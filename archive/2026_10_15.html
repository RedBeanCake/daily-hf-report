    <h1>前沿科研情报 - 2026-10-15</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Agent-Reflex: Teaching Language Agents to Act Reflectively (Agent-Reflex：教导语言代理进行反思性行动)\n- **社区热度**: `👍 192 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17953)\n- **研究任务**: 激励语言代理在长视野推理和工具使用中主动反思，以应对真实部署中工具服务返回的嘈杂反馈以及用户的干预纠正。\n- **核心亮点**: 提出 Agent-Reflex 通用训练框架，通过环境反思技能发现、反思监督微调和在策略反思策略优化三个阶段，全面提升代理在嘈杂环境下的鲁棒性和主动反思能力。\n- **深度解析**: 框架包含三个阶段：首先，环境反思技能发现（RSD）注入工具反馈扰动，挖掘成功-失败对并总结可重用的反思元技能；其次，反思监督微调（ReSFT）将技能转化为自我反思、技能恢复和以用户为中心纠正的监督信号；最后，在策略反思策略优化（ORPO）结合代理强化学习与反思引导的在策略蒸馏。基于 Qwen3-8B 构建的 Agent-Reflex 在五个长期工具使用基准上总分达到 58.6，在 AgentNoiseBench 上达到 29.1，超越了现有的环境扩展和反思基线。\n- **领域归类**: [AI Agent, 强化学习, 语言模型]\n---\n\n### 2. VideoJev: System One Model for Video Understanding and Interaction (VideoJev：用于视频理解与交互的系统一模型)\n- **社区热度**: `👍 189 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18615)\n- **研究任务**: 将视频理解和交互转化为结构化决策任务，使视觉代理能够基于视频观察做出低延迟的及时决策。\n- **核心亮点**: 引入 VideoJev 模型家族，采用共享头评分机制替代自回归解码，统一了时间定位和多项选择视频问答，并支持缓存推理和联合推理以大幅提升处理速度。\n- **深度解析**: VideoJev 通过共享头对时间区间和文本选项进行评分，结合了多模态大语言模型（MLLM）的语义灵活性与高效的决策能力。在交互过程中，模型通过缓存推理重用视觉计算，并通过联合推理在单次前向传播中处理多个查询。实验表明，VideoJev-4B 和 VideoJev-35B-A3B 在三个时间定位基准上的平均 mIoU 分别比主干网络提升 6.7 和 10.8 个点，推理加速 2.8-3.1 倍；在四个视频问答基准上性能与主干网络相当，但推理加速超过 100 倍。\n- **领域归类**: [视频理解, 多模态大模型, 计算机视觉]\n---\n\n### 3. Jeva: System One Models from First Principles (Jeva：基于第一性原理的系统一模型)\n- **社区热度**: `👍 177 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18773)\n- **研究任务**: 设计一种满足决策问题结构要求（空值感知、排列不变性、选项可扩展性、可缓存性）的系统一（System One）决策原生架构，解决现有设计低估这些结构要求的问题。\n- **核心亮点**: 提出 Jeva 决策原生架构，通过共享编码器和紧凑决策栈，联合解决决策问题中的空值感知、排列不变性、选项可扩展性和计算可缓存性。\n- **深度解析**: Jeva 使用共享编码器独立表示请求和每个选项，紧凑的决策栈仅针对不可变的选项内存细化请求状态。对称聚合产生排列等变概率，共享评分适应可变大小的候选集，单独的覆盖率估计区分答案缺失与候选竞争。评估显示，Jeva 结合了强大的类型化决策性能与近乎完美的空值检测，在任何测试排列下均无决策翻转，支持数千个候选，并通过跨请求重用大幅降低延迟。\n- **领域归类**: [模型架构, 决策系统, 自然语言处理]\n---\n\n### 4. Urbex: Agentic Spatial Grounding for City-Scale 3D Scenes (Urbex：面向城市级 3D 场景的代理空间定位)\n- **社区热度**: `👍 109 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18356)\n- **研究任务**: 在城市级 3D 场景中进行高效、准确的空间定位，克服传统候选排序方法在大型户外场景中需要预计算实例提议且效率低下的问题。\n- **核心亮点**: 提出 Urbex 代理视觉语言框架，将城市级 3D 定位转化为主动空间搜索，允许视觉语言模型（VLM）代理在交互式多视图环境中使用工具进行探索，并结合强化学习优化工具使用策略。\n- **深度解析**: Urbex 将城市级 3D 场景表示为交互式多视图环境，代理可查询地标、缩放局部区域、渲染倾斜视图并提交边界框。在 CityRefer 数据集上使用强化学习优化该策略，结合平滑定位奖励和轻量级塑造奖励。实验表明，Urbex 在 CityRefer 上取得了最佳的 Hit@1 和 IoU，支持无需真实边界框的无候选定位，且速度远超最强的城市级排序基线。在 STPLS3D-Refer 上的零样本结果进一步证明了其跨场景鲁棒性。\n- **领域归类**: [3D 视觉, 视觉语言模型, AI Agent, 空间定位]\n---\n\n### 5. GreenWAM: A World Foundation Model for Robotics (GreenWAM：面向机器人学的世界基础模型)\n- **社区热度**: `👍 79 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18774)\n- **研究任务**: 构建一个能够同时胜任世界模型（预测动作如何改变场景）和策略（选择动作）双重角色的机器人世界基础模型，并实现跨不同机器人身体的泛化。\n- **核心亮点**: 提出 GreenWAM 机器人世界基础模型，通过共享解剖动作空间、多模式联合训练和分离动作专家，同时实现顶级的世界预测和机器人控制性能。\n- **深度解析**: GreenWAM 定义了共享解剖动作空间以统一描述 20 个机器人家族（从双臂到灵巧人形），并在视觉、动作条件和世界-动作模式下进行联合训练，策略生成器分离出动作专家。作为世界模型，它在 WorldArena 1.0 上达到顶级的轨迹、深度和 3D 精度；作为策略，它在 RoboTwin 2.0 排行榜中名列前茅，在 LIBERO-plus 上取得最高的零样本成功率，并在 CALVIN 和 LIBERO 上具有竞争力。在真实人形机器人上，其成功率高于基于 π_{0.5} 和 Cosmos 3 Edge 改编的策略，并可蒸馏为单步策略用于实时控制。\n- **领域归类**: [机器人学, 世界模型, 基础模型]\n---\n\n### 6. AesCode: Aesthetic Code Generation with Decoupled Cross-Modal Rewards (AesCode：基于解耦跨模态奖励的美学代码生成)\n- **社区热度**: `👍 77 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18860)\n- **研究任务**: 生成信息丰富且具有高美学质量的视觉代码（如幻灯片、海报），解决代码模型缺乏视觉感知以及图像生成器内容渲染不准确的问题。\n- **核心亮点**: 提出 AesCode 框架，利用设计图和解耦的跨模态奖励（确定性验证器与 VLM 评估结合），通过强化学习同时优化代码生成的空间规划、美学质量和可验证正确性。\n- **深度解析**: AesCode 将目标表示为设计图，使每个属性可归因，并推导互补的跨模态奖励：确定性验证器对可从代码和渲染解析的属性评分，VLM 使用视觉图 Rubric 评估不可解析的属性。通过带通道归一化的强化学习优化这些奖励。AesCode-8B 和 AesCode-32B 的视觉质量分别提升 31.1 和 22.4 个百分点，达到了 GPT-5.5 和 Claude Opus 4.8 等闭源前沿模型的水平。\n- **领域归类**: [代码生成, 多模态, 强化学习, 视觉设计]\n---\n\n### 7. TPPO: Tracking-Value PPO For Language Model Reasoning (TPPO：用于语言模型推理的跟踪价值 PPO)\n- **社区热度**: `👍 71 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16794)\n- **研究任务**: 改进语言模型推理中基于可验证奖励的强化学习（PPO），解决标准评论家在稀疏终端奖励下难以跟踪轨迹上价值演变的问题。\n- **核心亮点**: 提出 TPPO（Tracking-Value PPO）方法，利用对数几率空间中的贝叶斯分解和加性更新结构，构建累积值参数化，以更准确地跟踪价值演变并提升推理性能。\n- **深度解析**: TPPO 分析连续前缀值的关系，发现其在 log-odds 空间存在加性更新结构，据此将位置标量输出求和为值 logits，并通过重建值的终端结果监督进行学习。在 Qwen3-4B-Base 和 Qwen3-8B-Base 上，TPPO 将数学推理总分比 PPO 分别提高了 7.0 和 8.4 分，并改善了分布外泛化能力。增益还扩展至 Qwen3-4B、Qwen2.5-Math-1.5B、Qwen3.5-9B 以及倒计时和科学编码任务。\n- **领域归类**: [强化学习, 语言模型推理, 算法优化]\n---\n\n### 8. Harness^2: Recursive Agent Harnessing for an Open World (Harness^2：面向开放世界的递归代理执行框架优化)\n- **社区热度**: `👍 71 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14224)\n- **研究任务**: 在开放世界设置中，通过递归自我改进（RSI）自动进化大语言模型代理的执行框架（harness），解决缺乏真实验证器和难以泛化到新场景的问题。\n- **核心亮点**: 提出 Harness^2 即插即用框架，通过任务级和框架级双层递归，在无需真实验证器的情况下优化代理执行框架，并提取经验以实现跨任务的持续改进。\n- **深度解析**: 任务级递归使用对比 Propose-Probe-Compose 步骤，无需真实验证器即可可靠地指导编辑；框架级递归则从这些编辑中提取经验，更新持续改进框架以更好地适应未来任务。在三个专业基准上，单步优化即一致提升了 GLM-5 和 Gemini 3.5 Flash 的性能，在 WorkBuddy-Bench、JobBench 和 LAB 上分别带来高达 11.5 分、4.5 分和 11.8 个百分点的增益。\n- **领域归类**: [AI Agent, 递归自我改进, 开放世界任务]\n---\n\n### 9. Vela: User Behavior as Supervision Sparks LLM Intelligence (Vela：以用户行为作为监督激发大语言模型智能)\n- **社区热度**: `👍 68 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14709)\n- **研究任务**: 利用真实世界的大规模用户行为数据作为监督信号，提升大语言模型在推断用户偏好、意图及未来行动方面的“用户维度”智能及通用智能。\n- **核心亮点**: 提出 Vela 框架，将真实的用户行为记录转化为可训练的任务和轨迹，证明了真实用户行为是提升 LLM 用户中心能力和通用智能的可扩展监督来源。\n- **深度解析**: Vela 从 100,000 名用户的匿名行为记录中生成 100,000 个任务（涵盖 91 个真实世界任务模板），经难度过滤和轨迹接受标准保留约 75,000 个任务。在 Qwen3.6-35B-A3B 上微调这些轨迹，使用户相关任务性能提升高达 11.5 分，通用基准平均提升 4 分。微调后再进行强化学习，比直接从基础模型进行强化学习提升高达 7.7 分。\n- **领域归类**: [大语言模型, 用户行为分析, 数据工程, 强化学习]\n---\n\n### 10. X-Ragent: Tool-Augmented Reinforcement Learning for Evidence-Grounded Chest X-Ray Reasoning (X-Ragent：用于基于证据的胸部 X 光推理的工具增强强化学习)\n- **社区热度**: `👍 66 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16811)\n- **研究任务**: 改进胸部 X 光（CXR）的视觉语言推理，使代理能够显式学习何时需要辅助证据，并防止不适用的定量证据进入诊断推理。\n- **核心亮点**: 提出 X-Ragent 后训练框架，通过解耦辅助证据寻求与有效性门控测量，结合工具增强强化学习，实现基于证据的 CXR 推理。\n- **深度解析**: 研究构建了 Rad-CoT 语料库（7.7K 样本），结合工具增强轨迹与报告式诊断推理，通过代理监督微调（SFT）初始化 Qwen3-VL-8B。随后使用 GRPO 优化策略，采用精度门控奖励（仅对正确轨迹应用测量一致性和辅助工具成本的过程级项）。在三个 CXR 基准上取得最强结果，包括在完全保留的 ChestAgentBench 上提升 8.6 分。\n- **领域归类**: [医疗 AI, 视觉语言模型, 强化学习, 工具增强]\n---\n\n### 11. DoSA: Dots Sparse Attention (DoSA：点稀疏注意力)\n- **社区热度**: `👍 65 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13990)\n- **研究任务**: 加速稀疏注意力机制中的 Top-K 键选择计算，同时保持精确的 token 选择（无损）。\n- **核心亮点**: 提出 DoSA（Dots Sparse Attention），通过条件化计算实现无损的稀疏注意力。利用种子集提供获胜阈值的下界，结合非负头投影和联合残差界来限制正贡献，并通过激活感知聚合来限制负头减去的幅度。\n- **深度解析**: \n  - **技术细节**: Top-K 选择需要足够的证据来拒绝候选者，而不必计算其完整分数。证书（certificate）指导完整评分仅针对仍符合条件的候选者，精确分数过滤进一步减少回写和选择工作。分析了选择边距和几何形状如何影响其有效性。\n  - **实验结果**: GPU 实现在英语、中文和代码工作负载上，将完整 Indexer 的加速比 SGLang 高达 2.74 倍，比 LiteTopK 高达 1.69 倍。在 GLM-5.2 和 DeepSeek-V3.2 上的端到端评估中，首字生成时间（time-to-first-token）分别比两个基线加速高达 1.94 倍和 1.50 倍。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [大语言模型, 注意力机制优化, 推理加速]\n---\n\n### 12. WorkRover: Scaling Long-Horizon Cowork Agent Training Via Recursive Environment Evolution (WorkRover：通过递归环境演化扩展长时程协作智能体训练)\n- **社区热度**: `👍 64 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18067)\n- **研究任务**: 通过强化学习训练长时程协作智能体，解决交互式环境扩展和迭代细化过程中的组件对齐问题。\n- **核心亮点**: 提出 WorkRover 框架，通过递归环境演化进行训练。引入阶乘兼容性重放（FCR）以支持环境演化，并提出验证器到回合的信用分配（VTCA）以提供更细粒度的训练信号。\n- **深度解析**: \n  - **技术细节**: FCR 使用 rollout 反馈通过依赖闭合重放评估组件修订的组合，并在保留任务要求的同时选择最小的验证修复。VTCA 用确定性工作空间进度检查的信号增强轨迹级 GRPO 优势，并将有界比例的正进度信用分配给先决回合。\n  - **实验结果**: 后训练 Qwen3.5-35B-A3B 得到 WorkRover-35B-A3B。在 JobBench 上得分超过基线 26.27 个百分点，在 OfficeQA Pro 上超过 29.32 个百分点，在 GDPval v2 上超过 413.25 Elo 分。\n  - **数据集**: JobBench, OfficeQA Pro, GDPval v2。\n- **领域归类**: [智能体, 强化学习, 长时程任务]\n---\n\n### 13. ExeWorldBench: Benchmarking Code-Based Executable 3D World Modeling (ExeWorldBench：基于代码的可执行 3D 世界建模基准测试)\n- **社区热度**: `👍 63 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15166)\n- **研究任务**: 全面评估基于代码的 3D 世界构建中的世界理解（world understanding）和可执行实现（executable realization）能力。\n- **核心亮点**: 提出 ExeWorldBench，据作者所知是首个通过基于代码的 3D 世界构建全面评估上述两种能力的基准。包含三个渐进挑战的任务。\n- **深度解析**: \n  - **技术细节**: 三个任务包括：机制可执行性（从视觉观察实现单个机制）、组合可执行性（扩展到具有空间、机械和因果依赖的多阶段系统）、意图驱动的可执行世界合成（从高级目标和物理要求构建可执行世界）。\n  - **实验结果**: 摘要未提供。\n  - **数据集**: ExeWorldBench。\n- **领域归类**: [基准测试, 3D世界建模, 代码智能体]\n---\n\n### 14. LeWAM: End-to-End World and Action Modeling with JEPAs (LeWAM：使用 JEPA 进行端到端世界与动作建模)\n- **社区热度**: `👍 62 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12818)\n- **研究任务**: 提出一种用于控制的端到端联合嵌入预测架构（JEPA），无需像素重建即可学习紧凑的潜在世界模型，并直接支持策略执行和高效规划。\n- **核心亮点**: 引入 LeWAM，包含两个创新：(1) 针对下一个潜在状态预测和动作流匹配的联合训练目标；(2) 对潜在状态的各向同性高斯约束，使单一模型能够支持直接策略执行和通过评估采样动作进行高效规划。\n- **深度解析**: \n  - **技术细节**: 与之前的 JEPA 相比，LeWAM 在视觉规划中表现更好。可解释性分析表明，LeWAM 有效地学习了与控制相关的表示和动作分布，从而指导测试时的规划和控制。\n  - **实验结果**: 在接触丰富的任务中，成功率从 28.6% 提高到 89.7%；在长时程任务中，从 10.9% 提高到 46.2%；规划速度提高 32.3 倍。在模拟和物理机器人的行为克隆任务中，与现有方法具有竞争力。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [强化学习, 机器人控制, 世界模型]\n---\n\n### 15. Scoring Higher, Answering Worse: Mitigating Reward Hacking in Rubric-Based RL via Protocol-Level Rubrics (分数更高，回答更差：通过协议级评估标准缓解基于评估标准的强化学习中的奖励作弊)\n- **社区热度**: `👍 60 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38847)\n- **研究任务**: 解决基于评估标准的强化学习（Rubric-RL）中，由于加权求和聚合方式导致的奖励作弊（reward hacking）问题，提升模型在临床咨询等任务中的回答质量。\n- **核心亮点**: 指出加法聚合是弱点，导致标准之间相互补偿。提出协议级评估标准（ProRubric），保持标准内容不变，但改变聚合方式，将检查表分组为几个协议级维度，只有当维度内所有标准都满足且失败条款未触发时才计分。\n- **深度解析**: \n  - **技术细节**: ProRubric 将检查表分组为协议级维度，离线完成分组，不改变优化器。在临床咨询任务中，未分组的标准会导致模型通过提供不请自来的建议来弥补关键决策的缺失，导致分数高但回答差。\n  - **实验结果**: ProRubric 在不损失覆盖率的情况下将适当性（appropriateness）提高了 10.8 分，并在两个规模的七个基准测试中取得了最佳平均分。\n  - **数据集**: 临床咨询数据集，以及七个基准测试（具体名称摘要未提供）。\n- **领域归类**: [强化学习, 奖励建模, 对齐]\n---\n\n### 16. Multics: Generative Multi-Player World Model with Hierarchical Communication (Multics：具有分层通信的生成式多玩家世界模型)\n- **社区热度**: `👍 55 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17201)\n- **研究任务**: 解决多玩家交互式世界模型在扩展到更多玩家时面临的生成鲁棒性挑战，如全连接通信的二次注意力成本和集中式方法的全局表示干扰。\n- **核心亮点**: 提出 Multics，一个具有分层通信的多玩家视频生成框架，在玩家、组和全局三个层级构建信息交换。引入组 token 作为中间表示，并提出基于相机轨迹的预算约束动态分组。\n- **深度解析**: \n  - **技术细节**: 组 token 参数在组槽之间共享，使同一通信模块能适应不同数量的玩家。预算约束动态分组根据最近的相机轨迹自适应地分组相关玩家，限制不必要的通信。\n  - **实验结果**: 在 4 人和 6 人设置中实现 SOTA 性能，提高了跨玩家一致性、玩家特定动作和相机可控性以及抗干扰鲁棒性。从 4 人训练泛化到 6、8 和 10 人推理而无需重新训练，同时减少了自注意力计算。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [视频生成, 世界模型, 多智能体交互]\n---\n\n### 17. UltraBERT: Beyond the Limit of BERT Pre-Training (UltraBERT：超越 BERT 预训练的极限)\n- **社区热度**: `👍 48 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15028)\n- **研究任务**: 探索双向编码器（encoder）预训练的性能极限，解决现有编码器在分类和检索任务上无法同时取得竞争力的问题。\n- **核心亮点**: 揭示了编码器预训练的三个关键发现，并提出 UltraBERT，一个在批次内为低和高掩码率分配独立 LM 头，并将蒸馏目标限制在低掩码率的单一编码器，首次在分类和检索任务上同时达到 SOTA。\n- **深度解析**: \n  - **技术细节**: 发现 (1) 编码器在数万亿 token 后在下游任务上饱和；(2) 较低掩码率有利于分类，较高掩码率有利于检索（与先前认为大模型需要更大掩码率的观点相反）；(3) 带剪枝的蒸馏在低掩码率下改善分类，但在高掩码率下损害检索。\n  - **实验结果**: UltraBERT 在 GLUE 上达到 91.0 分，在 BEIR 上达到 47.7 分，在分类和检索任务上均达到 SOTA。\n  - **数据集**: GLUE, BEIR。\n- **领域归类**: [自然语言处理, 预训练模型, 双向编码器]\n---\n\n### 18. Tev: Scaling Long-Horizon Agentic Environments with Dense Progress Rewards (Tev：通过密集进度奖励扩展长时程智能体环境)\n- **社区热度**: `👍 47 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18868)\n- **研究任务**: 解决开源模型在长时程任务上表现不佳的问题，缺乏训练数据和有效的训练方法（奖励稀疏、任务难以策划和验证）。\n- **核心亮点**: 引入 Tev-Gym（首个具有可验证、密集、渐进奖励的长时程智能体训练数据集）和 Tev-27B 模型。采用潜在世界优先（latent-world-first）方法构建环境，并通过进度势能奖励塑造（PPRS）将进度转化为密集的单步奖励。\n- **深度解析**: \n  - **技术细节**: Tev-Gym 包含 7 个领域的 1,170 个验证任务环境。PPRS 将进度转化为密集奖励，提高训练效率。\n  - **实验结果**: Tev-27B 在 Agents' Last Exam 计算和数学科学领域（ALE-CM）取得显著增益，在 Pass@5 上匹配 GPT-6 Astra 和 Claude Opus 5。泛化到 Terminal-Bench (TB) 3.0 和 4.0 子集，超过 GLM 5.2 和 Gemini 3.7 Flash，在 TB 2.1 等中等时程任务上达到 Claude Opus 4.8 水平。\n  - **数据集**: Tev-Gym, Agents' Last Exam (ALE-CM), Terminal-Bench (TB)。\n- **领域归类**: [智能体, 强化学习, 长时程任务]\n---\n\n### 19. EviScene: Beyond \"Is It AI?\" for Agentic Image Factuality Assessment (EviScene：超越“这是 AI 吗？”的智能体图像事实性评估)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14609)\n- **研究任务**: 提出图像事实性评估（Image Factuality Assessment）任务，即给定图像和通用验证指令，系统返回支持或反驳的裁决及基于证据的解释，而不仅仅是判断图像是否为 AI 生成。\n- **核心亮点**: 引入 EviLens 基准和 EviScene 多模态 ReAct 智能体。EviScene 交替进行视觉检查、外部检索和证据分析，使用新发现来细化问题并重新审视图像细节。\n- **深度解析**: \n  - **技术细节**: EviLens 包含 10,174 张支持或反驳的图像，涵盖 12 种事实错误类型。EviScene 通过监督微调在审查的教师轨迹上训练紧凑策略，然后对策略自身调查的验证决策应用特权在策略自蒸馏（privileged on-policy self-distillation）。\n  - **实验结果**: 在 1,527 张图像的测试集上，训练后的 Qwen3.5-9B 智能体达到 79.05% 的平衡准确率和 52.26% 的严格证据充分率（SESR），分别比同骨干基础智能体提高 6.71 和 9.37 个百分点。其 SESR 在评估的智能体中最高。\n  - **数据集**: EviLens。\n- **领域归类**: [多模态, 事实核查, 智能体]\n---\n\n### 20. SALD: Self-Referenced Advantage Learning for Diffusion Models (SALD：扩散模型的自参考优势学习)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.01496)\n- **研究任务**: 探索扩散模型如何在没有外部演示或教师网络的情况下，识别自参考训练信号以提升生成质量。\n- **核心亮点**: 提出 SALD 自参考训练框架，使用同一模型在两个噪声水平下评估每个图像-文本对。低噪声路径提供无梯度跟踪的参考，高噪声路径提供训练梯度。通过优势引导扩散（AGD）、时间优势记忆（TAM）和频谱优势分解（SAD）将相对误差转化为可微的权重。\n- **深度解析**: \n  - **技术细节**: AGD 将相对误差转化为可微的样本级权重；TAM 累积相对难度并调整未来两个噪声水平之间的差距；SAD 比较两条路径的残差功率谱，构建可微的频率派生潜在元素权重。所有组件共享单一模型参数，无需外部教师网络或额外可训练参数。\n  - **实验结果**: 摘要未提供（仅提及在多种架构和数据集上生成质量有持续改进，并通过消融实验量化了组件贡献）。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [扩散模型, 图像生成, 训练优化]\n---\n\n### 21. APEX: Asynchronous Prefix Denoising for Extreme Compression (APEX：用于极致压缩的异步前缀去噪)\n- **社区热度**: `👍 41 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12843)\n- **研究任务**: 解决扩散模型中激进的潜在压缩带来的“重建-生成困境”（即增加通道数能改善重建但会使生成变得更困难）。\n- **核心亮点**: 提出 APEX 方法，将分层潜在空间与跨通道组的异步去噪相结合。自编码器将通道前缀按从结构到细节的顺序排列，共享的去噪器在不同的局部时间交错生成这些前缀，且不会增加 token 数量。\n- **深度解析**: 在 ImageNet-512 数据集上，APEX 在 64x 和 128x 压缩下的所有评估通道数中均优于现有方法。在匹配的训练和引导采样计算量下，它在所有评估预算下均优于 256-token 模型，且在低计算量预算下增益更大。\n- **领域归类**: [计算机视觉, 扩散模型, 图像压缩]\n---\n\n### 22. Learning How to Remember: Memory Modality Selection for GUI Agents (学习如何记忆：GUI 智能体的记忆模态选择)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17928)\n- **研究任务**: 研究基于视觉语言模型（VLM）的 GUI 智能体中记忆模态的选择问题，解决现有智能体使用固定单一记忆模态的局限性。\n- **核心亮点**: 发现智能体首选的记忆表示强烈依赖于交互步骤。为此提出 SwitchMem 路由框架，能够在每一步动态选择文本或视觉记忆表示。\n- **深度解析**: 在三个 GUI 基准测试中，SwitchMem 优于依赖静态记忆表示的基线方法。研究结果验证了记忆模态的选择是一个依赖于具体步骤的决策，而非固定的设计选择。摘要未提供具体的基准测试名称和量化提升数字。\n- **领域归类**: [人机交互, GUI 智能体, 视觉语言模型]\n---\n\n### 23. VEDJE: Video-Efficient Discriminative Joint Encoder for Scalable Video-Text Retrieval (VEDJE：用于可扩展视频文本检索的高效判别联合编码器)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11850)\n- **研究任务**: 解决视频文本检索中处理丰富视频表示成本高昂的问题，实现高效且准确的联合匹配检索。\n- **核心亮点**: 在采样帧内压缩特征，同时在可重用缓存中保持表示分离。引入特征变化预测作为辅助训练信号，在不增加查询时计算量的情况下，改善从压缩缓存中的检索效果。\n- **深度解析**: 在 MSR-VTT、MSVD、DiDeMo 和 ActivityNet 数据集上，VEDJE 在两个检索方向上均提高了匹配的第一阶段检索器的 R@1。在 MSR-VTT 上，使用微调的 VideoCLIP-XL 第一阶段达到了 59.8 的文本到视频 R@1。在 VideoPrism 配置中，将每个视频的缓存缩小四倍至 12 KiB，可将文本到视频的召回率保持在 0.2 个百分点以内。\n- **领域归类**: [多模态, 视频文本检索, 信息检索]\n---\n\n### 24. AReA: Adaptive Receptive-Field Attention for Efficient High-Resolution Diffusion Transformers (AReA：用于高效高分辨率扩散 Transformer 的自适应感受野注意力)\n- **社区热度**: `👍 35 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17227)\n- **研究任务**: 解决扩散 Transformer (DiTs) 在生成超出训练分辨率的图像时，面临的计算成本呈二次方增长、结构扭曲和细节退化问题。\n- **核心亮点**: 提出 AReA，一种无需训练的注意力机制，其感受野随去噪过程从粗到细演变。在早期步骤应用跨尺度粗注意力捕获全局上下文，在后期步骤应用局部注意力细化细节。\n- **深度解析**: 无需额外参数或训练，实验表明 AReA 在不同目标分辨率和不同模型中始终优于最先进的无需训练基线，同时速度更快、效率更高。摘要未提供具体的模型名称和量化的加速/性能提升数字。\n- **领域归类**: [计算机视觉, 扩散模型, 图像生成]\n---\n\n### 25. FlashVSR+: Efficient Video Super-Resolution via Hybrid Attention and Reward-Yield Distribution Matching (FlashVSR+：通过混合注意力和奖励收益分布匹配实现高效视频超分辨率)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17552)\n- **研究任务**: 解决视频超分辨率（VSR）模型在高分辨率推理中成本高昂，以及蒸馏模型难以与人类偏好对齐的问题。\n- **核心亮点**: 架构上引入混合注意力（结合强局部性和稀疏全局交互），实现 DiT 2倍加速和 45% 峰值内存降低，支持单张 24GB RTX 4090 进行无平铺 4K VSR。训练上提出奖励收益分布匹配蒸馏（Ry-DMD），利用奖励加权的教师推演将黑盒奖励纳入分布匹配。\n- **深度解析**: Ry-DMD 无需通过奖励模型反向传播，且可泛化到文本到图像（T2I）生成。FlashVSR+ 提供了更强的恢复质量，大幅提高了高分辨率效率，并在用户偏好上获得一致提升。摘要未提供具体的评估数据集名称和最终恢复质量的量化指标数字。\n- **领域归类**: [计算机视觉, 视频超分辨率, 扩散模型蒸馏]\n---\n\n### 26. DeltaTTG: Training Multi-Turn Agents with a Token-to-Go Progress Meter (DeltaTTG：使用 Token-to-Go 进度计训练多轮智能体)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17666)\n- **研究任务**: 解决具有可验证奖励的多轮智能体强化学习（RLVR）中，稀疏终端奖励无法提供单步有效反馈的问题。\n- **核心亮点**: 引入 DeltaTTG，通过共享进度计学习可重用的进度信号。其监督目标 Token-to-Go (TTG) 作为剩余完成努力的可观察代理。在演员训练期间，利用冻结进度计估计的变化来重新分配结果衍生的优势。\n- **深度解析**: 在 ALFWorld、PaperSearchQA 和 BFCLv3 数据集上，DeltaTTG 使用 Qwen3-4B 和 Llama-3.1-8B-Instruct 分别将 GRPO 的平均得分提高了 5.7 和 7.2 分，平均优于所有比较的 RL 基线，并保持演员训练的 GPU 小时数接近 GRPO。进一步实验表明其提高了样本效率和域外性能。\n- **领域归类**: [自然语言处理, 强化学习, 智能体]\n---\n\n### 27. Last Secure Code Benchmark: Is the Code You Vibe Secure? (最后安全代码基准：你“氛围编程”的代码安全吗？)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14766)\n- **研究任务**: 评估 AI 编程智能体生成代码的安全性，解决当前代码生成缺乏全面安全评估的问题。\n- **核心亮点**: 提出 Last Secure Code Benchmark，包含由 150 个真实漏洞衍生的 450 个任务，涵盖 7 种语言、24 种 CWE（包括 21 种 2025 CWE Top 25 和 8 种 Top 10 KEV），以及三种“氛围编程”场景。任务仅要求功能，通过隐藏的功能和安全测试进行评分。\n- **深度解析**: 在六个前沿智能体中，73.6% 到 91.3% 的任务在功能上通过，但即使是最好的 Claude Fable 5，也只有 25.1% 的任务代码既功能正常又安全，其他模型仅为 16.4% 到 24.7%。最佳模型在所有氛围编程设置中仅通过 12% 的漏洞场景，引发了对氛围编程代码安全性的强烈担忧。\n- **领域归类**: [软件工程, 代码安全, 基准测试]\n---\n\n### 28. Self-Distillation with Verbal Regularization (带有语言正则化的自蒸馏)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16354)\n- **研究任务**: 解决在策略自蒸馏（OPSD）中，特权信息（PI）导致监督偏向捷径推理、缺乏验证和重新思考，并伴随输出分布熵急剧下降的问题。\n- **核心亮点**: 提出带有语言正则化的自蒸馏（VRSD），使用系统提示来调节教师模型如何使用特权信息，从而鼓励重新思考和探索，以抵消过早承诺。\n- **深度解析**: 理论上将提示建模为衰减特权信息对教师分布的影响，并推导了熵保留的条件。在三个模型和四个任务中，VRSD 在 12 个模型-任务设置中的 11 个里将 Pass@1 提高了平均 3.9 个百分点，同时通常保持更高的 token 熵。\n- **领域归类**: [自然语言处理, 大语言模型, 知识蒸馏]\n---\n\n### 29. Data-Centric Recursive Self-Improvement for Navigation via Policy-Synchronized Language-Action Dual Bootstrapping (通过策略同步语言-动作双重引导实现导航的数据中心递归自我改进)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15782)\n- **研究任务**: 解决视觉语言导航中高质量语言监督数据获取成本高的问题，以及现有数据合成方法中生成的监督滞后于不断演变的策略的问题。\n- **核心亮点**: 提出 RSI-Nav 框架，将视觉-语言到动作的指令跟随和视觉-动作到语言的指令生成统一在共享模型中。分块处理未标记轨迹，当前模型生成指令、执行评估、保留合格样本并立即更新自己，保持新生成的监督与演变的策略对齐。\n- **深度解析**: 结合了空间理解数据以增强导航能力。在 R2R-CE 上达到 68.6% SR，在 RxR-CE 上达到 72.4% SR，同时在递归进化后提供更强的指令生成效用和适度改善的空间理解。\n- **领域归类**: [机器人学, 视觉语言导航, 自我改进]\n---\n\n### 30. Cepheid: Decoupling Scale from Structure for Cross-Family Motion Completion (Cepheid：解耦尺度与结构以实现跨族运动补全)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18871)\n- **研究任务**: 解决从稀疏顶点位移恢复密集网格运动（稀疏到密集运动补全）时，残差先验在跨几何族训练时遇到的尺度障碍和失败问题。\n- **核心亮点**: 将残差结构与物理尺度解耦，通过学习无量纲先验，从可观察量和仅在训练源上拟合的轻量级校正来估计振幅。\n- **深度解析**: 统一模型在所有评估的族（包括未见过的布料和腿状物体）中均优于谐波扩展，无需骨架、配准或跨网格对应。相同的先验无需重新训练即可应用于点跟踪动物视频和机器人抓取软体。摘要未提供具体的量化评估指标数字。\n- **领域归类**: [计算机视觉, 3D 视觉, 运动补全]\n\n### 31. A Decade in a Day: Synthesizing Agent-Native Interfaces from Human-Oriented Software Evolution (一日十年：从面向人类的软件演进中合成 Agent 原生接口)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15765)\n- **研究任务**: 研究桌面软件界面属性对大语言模型 Agent 性能的影响，并为 Agent 合成专属的原生操作接口。\n- **核心亮点**: 提出 DeskIF-Bench 基准（包含 6 款桌面应用的 255 个任务）；识别出可发现性、粒度和可观察性三个关键界面属性；开发 ANIS 框架合成 Agent 原生接口，在 8 款应用的 368 个任务中，不仅提升了成功率（DeepSeek V4 Flash 提升 3.8%，Claude Haiku 4.5 提升 3.5%），还减少了约 73% 的在线 token 消耗。\n- **深度解析**: 现有桌面软件界面专为人类设计，导致 Agent 在操作时面临效率低下的问题。该研究巧妙地将软件版本演进作为界面变异的自然实验来源，通过控制变量法评估界面变化对 Agent 的影响。在此基础上提出的 ANIS 框架，通过原子级和 Goal 级命令重构软件交互，有效弥合了人类界面与 Agent 需求之间的鸿沟，Goal 级命令更是将成功率分别提升至 74.5% 和 67.4%。\n- **领域归类**: [AI Agent, 人机交互, 软件工程]\n---\n\n### 32. WAVE-0: Bridging VLA Policies and WAMs with Lightweight Latent Future Prediction (WAVE-0：通过轻量级潜在未来预测桥接 VLA 策略与 WAM)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18568)\n- **研究任务**: 结合视觉-语言-动作（VLA）策略与世界动作模型（WAM），通过轻量级的潜在未来预测来提升通用机器人的操作性能。\n- **核心亮点**: 提出 WAVE-0 框架，利用 257M 参数的轻量级潜在世界模型桥接 VLA 和 WAM；无需像素重建或大规模视频预训练，直接在真实机器人动作数据上训练；在 RoboTwin 2.0 和 LIBERO 等仿真任务中成功率分别达到 91.47% 和 98.7%，并在真实世界任务中将基线成功率从 38.3% 大幅提升至 73.3%。\n- **深度解析**: 传统的 VLA 模型擅长通用操作但缺乏对环境后果的显式建模，而现有的 WAM 往往依赖计算昂贵的视频生成。WAVE-0 通过引入反事实排序目标，将 VLM 的语义理解与显式的未来预测相结合，直接指导动作生成。这种设计统一了潜在规划、未来预测和动作生成，在避免高昂计算成本的同时，显著增强了机器人在复杂分布偏移下的操作泛化能力。\n- **领域归类**: [机器人学, 具身智能, 视觉-语言-动作模型]\n---\n\n### 33. EgoExplorer: A Vision-Motion-Touch Observatory for Human Loco-Manipulation In Situ (EgoExplorer：用于人类原地运动-操作的视觉-运动-触觉观测库)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18872)\n- **研究任务**: 构建一个用于人类原地运动-操作（loco-manipulation）的多模态观测库，以支持人形机器人从人类演示中进行高效学习。\n- **核心亮点**: 发布 EgoExplorer 100 小时多模态数据集，包含第一人称视频、全身运动重建、精细手指关节和触觉数据；提出 Calibrate-Complete-Constrain 处理管道，将身体点误差相比最强基线大幅降低 71.9%。\n- **深度解析**: 学习人形机器人的运动-操作需要全面观察 locomotion、姿势和物体交互的协同演化。针对现有数据集视角单一的问题，EgoExplorer 采用轻量级可穿戴系统收集对齐的多模态数据。其提出的处理管道通过可重用校准、时间先验和分层约束，有效解决了稀疏身体传感下的运动推断难题，为人形机器人的模仿学习和全身控制提供了高质量的数据基础。\n- **领域归类**: [机器人学, 具身智能, 数据集, 动作捕捉]\n---\n\n### 34. VIEWCRAFT: Evolving What Multimodal Agents See and How They Read It (VIEWCRAFT：演化多模态 Agent 的观察内容与解读方式)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15915)\n- **研究任务**: 通过联合演化可执行证据接口及其读取过程，提升多模态 Agent 在不更新模型权重情况下的可重用技能效果。\n- **核心亮点**: 提出 ViewCraft 框架，让 Agent 自主演化“看什么”和“怎么读”；在 8 个基准测试中平均提升 6.1 分；在 5 个多源任务上，学习到的接口比初始技能减少 8%-15% 的输入 token 消耗；学习到的技能具备跨执行器的迁移能力。\n- **深度解析**: 多模态 Agent 的性能不仅取决于模型能力，还受限于其获取和解读证据的方式。ViewCraft 将证据构建和解读视为耦合的可重用技能，通过失败轨迹反馈、重放评估和接口投影等机制，不断优化证据接口的选择、转换以及读取器的解释过程。这种方法在不增加模型参数负担的前提下，有效提升了任务表现并降低了 token 开销。\n- **领域归类**: [AI Agent, 多模态大模型, 技能学习]\n---\n\n### 35. ClawLoop: Self-Improving Agents via Harness-Native Training Loop (ClawLoop：通过沙盒原生训练循环实现 Agent 自我改进)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14118)\n- **研究任务**: 提出一种无需外部教师模型、基于沙盒环境（harness-native）的大语言模型 Agent 自改进训练框架。\n- **核心亮点**: 提出 ClawLoop 框架，实现无外部教师的 Agent 自改进；包含任务合成、训练、诊断与反馈三个自维持循环阶段；使用 Qwen3.6-27B 训练生成的任务可成功迁移，并显著提升较小规模模型（Qwen3.5-4B 和 9B）在多个基准上的性能。\n- **深度解析**: 现有的工具使用 Agent 训练多依赖外部强模型生成数据，存在能力上限和人类先验的局限。ClawLoop 构建了一个闭环自进化系统，通过诊断条件难度增长和基于 Agent 自身 rollout 行为的反馈，系统能够自主生成高质量训练任务并持续优化 Agent 能力。其生成的数据具有良好的跨模型迁移性，验证了该框架在数据质量上的独立性。\n- **领域归类**: [AI Agent, 强化学习, 模型训练与微调]\n---\n\n### 36. CineRecon: Benchmarking Frontier Models for Agentic Cinematic Reconstruction (CineRecon：评估前沿模型的 Agent 电影级重建能力)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16577)\n- **研究任务**: 评估前沿多模态 Agent 从动态参考视频中重建可编辑动态 3D 场景的能力，以推动可控视频生成和电影制作。\n- **核心亮点**: 发布 CineRecon 基准，包含 50 个参考视频和 360 个评估片段；设计了 Proxy、Simplified 和 Detailed 三种递进的表示设置；评估了 12 个模型，揭示了当前 Agent 在主体运动和交互重现方面的普遍困难。\n- **深度解析**: 将视频重建为可编辑的 3D 场景是实现电影级可控生成的关键。CineRecon 通过解耦几何/外观要求与空间/相机/动态要求，能够精确测试 Agent 在不同复杂度下的重建能力。基于检查列表和视觉-语言裁判的评估设计，提供了细粒度的失败分析，明确指出即使是最基础的 Proxy 设置，当前模型在主体运动和交互重现上依然存在显著短板。\n- **领域归类**: [AI Agent, 3D 视觉, 视频生成, 基准测试]\n---\n\n### 37. GeoFix: Geometry Fixing for 4D Consistent Generation (GeoFix：用于 4D 一致性生成的几何修复)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14293)\n- **研究任务**: 解决视频扩散模型在 4D 生成中缺乏几何一致性的问题，提出一种统一的几何修复框架。\n- **核心亮点**: 提出 GeoFix 框架，仅使用单一几何奖励即可同时提升几何一致性和视觉质量；通过测量静态区域跨视图深度一致性并校准视场重叠影响，实现训练和推理时的奖励对齐；WorldScore 3D 一致性提升 39%，VBench 质量分数提升 4%。\n- **深度解析**: 现有的几何奖励后训练方法往往会牺牲纹理和细节。GeoFix 通过聚焦于静态场景区域的跨视图深度一致性，避免了对有效物体运动和外观的直接惩罚。同时，研究敏锐地指出了相机视场重叠带来的深度一致性偏差，并通过校准机制确保了奖励信号的准确性，从而在不损害视觉质量的前提下显著改善了 4D 生成的几何结构。\n- **领域归类**: [计算机视觉, 视频生成, 4D 生成, 扩散模型]\n---\n\n### 38. ReTerm: Recovery Training for Self-Improving Terminal Agents (ReTerm：用于自我改进终端 Agent 的恢复训练)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18484)\n- **研究任务**: 提升终端 Agent 在长时间执行过程中从命令错误或实现故障中恢复的能力，实现自我改进。\n- **核心亮点**: 提出 ReTerm 框架及 ReTerm-10K 数据集用于冷启动；设计 ReTerm-GRPO 在线强化学习算法，从失败状态分叉进行自恢复尝试；基于 Qwen3.5-9B 训练的 ReTerm-9B 在 Terminal-Bench 2.0 上 Pass@1 达到 34.8%，相比基座模型提升 14.6 个点。\n- **深度解析**: 终端 Agent 常因无法从执行错误中恢复而导致复杂编码任务失败。ReTerm 通过构建高质量的恢复演示数据进行 SFT 冷启动，并创新性地提出 ReTerm-GRPO 算法，让 Agent 在自身的失败状态上进行多路探索和自我纠正。这种基于自身恢复经验的强化学习机制，显著增强了 Agent 的鲁棒性，使其在各类错误类别下的恢复率均优于标准 GRPO 训练。\n- **领域归类**: [AI Agent, 强化学习, 代码与终端操作]\n---\n\n### 39. Open-o3-Video-v2: Seek, Ground, and Reason with Verifiable Spatio-Temporal Evidence (Open-o3-Video-v2：利用可验证的时空证据进行寻找、定位与推理)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17656)\n- **研究任务**: 通过主动获取和定位可验证的时空证据，提升视频大模型的推理可靠性和可解释性。\n- **核心亮点**: 提出 Open-o3-Video-v2，将视频推理转化为基于证据的 Agent 过程；构建包含 52K 多轮轨迹的 STGR-v2-CoT135K 数据集和 STGR-v2-RL-13K 强化学习数据集；提出 CS-GRPO 算法优化证据获取；4B 模型在 V-STaR 上达到 40.4% mAM 和 56.3% mLGM，显著超越 Qwen3-VL-4B 基座模型。\n- **深度解析**: 针对视频推理中缺乏视觉证据支持的问题，Open-o3-Video-v2 赋予模型主动“寻找-定位-推理”的能力。模型能够识别信息缺失、调用工具获取额外帧、在时空维度上定位关键物体，并将这些证据融入推理轨迹。结合 CS-GRPO 强化学习算法，有效奖励了线索覆盖率和逐步增益，惩罚了冗余检索，从而提升了推理的准确性和可验证性。\n- **领域归类**: [多模态大模型, 视频理解, 视觉推理, 强化学习]\n---\n\n### 40. Fish Audio Drama 3 Technical Report (Fish Audio Drama 3 技术报告)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18010)\n- **研究任务**: 开发一个开源的文本到语音（TTS）生成模型，支持多角色、多轮修改、流式合成等复杂语音表演生成。\n- **核心亮点**: 发布 Fish Audio Drama 3，采用 35B MoE 架构（每 token 激活 3B）；支持多参考声音克隆、自然语言指导、多轮修改、流式合成等新功能；采用混合线性注意力和多 token 预测音频解码器；单张 H200 推理速度达 271 fps，在参数量增加 7 倍以上的情况下远超上一代（177 fps）。\n- **深度解析**: Fish Audio Drama 3 将 TTS 从简单的文本朗读提升为“导演级”的语音表演生成。通过引入多轮修改、场景配音和流式输入等特性，极大地扩展了实际应用场景。技术上，其创新的 codebook 多 token 预测解码器和仅依赖单一人类偏好奖励的大批量 RL 训练，在保证极高语音质量的同时，实现了参数规模大幅增加下的推理速度飞跃。\n- **领域归类**: [语音合成, 多模态生成, 音频大模型]\n---\n\n### 41. JevGPT: Thinking Fast and Slow in Autonomous Research (JevGPT：自主研究中的快慢思考)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18272)\n- **研究任务**: 自主研究智能体在有限预算内获取和推理证据，解决检索覆盖率与实际用于指导研究的证据之间的差距。\n- **核心亮点**: 提出JevGPT，一种用于自主研究的双系统架构。系统2（慢思考）设定证据目标并整合发现，系统1（快思考）定位支持、评估相关性并指导进一步检查。独立源判断并行运行。\n- **深度解析**: 该架构将快速的局部判断与不断变化的证据需求对齐。在固定语料问答和文档排序实验中，JevGPT实现了领先的任务性能，且完成更快、成本更低。证据分析显示其具有更广泛的源检查和更大的支持文档覆盖率。摘要未提供具体的数据集名称和性能指标数字。\n- **领域归类**: [人工智能智能体, 信息检索, 自主研究]\n---\n\n### 42. LifeSearch: Benchmarking Deep Research Agents for Real-World Life and Productivity (LifeSearch：面向真实世界生活与生产力的深度研究智能体基准测试)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18092)\n- **研究任务**: 评估深度研究（DR）智能体在真实世界生活和职业生产力场景中的能力，弥补现有基准主要关注学术研究或合成任务的不足。\n- **核心亮点**: 引入LifeSearch基准，包含203个中英文任务，涵盖7个具体的生活和生产力领域。包含超4500小时人工标注和超4000个专家编写的细粒度评分标准，覆盖报告内容标准和具体数值标准。\n- **深度解析**: 在统一评估框架下对12个先进DR智能体进行广泛实验。表现最好的前沿智能体GPT-5.6 Sol仅得63.4%。人类排名研究与基准总分高度一致（Spearman's ρ= 0.89, Kendall's τ= 0.81）。摘要未提供具体的失败模式细节和其他智能体的具体得分。\n- **领域归类**: [基准测试, 深度研究智能体, 真实世界评估]\n---\n\n### 43. PhyProbe: Rethinking Physical Consistency Evaluation in Generated Videos (PhyProbe：重新思考生成视频中的物理一致性评估)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38377)\n- **研究任务**: 评估生成视频的物理一致性，解决现有视觉语言模型对物理动态短视，或微调评估器过拟合特定数据集线索且泛化能力差的问题。\n- **核心亮点**: 提出PhyProbe评估器，从冻结的预训练时空编码器提取特征，并通过轻量级评分头映射为标量物理一致性违规分数。采用结合成对排序、噪声标量注释回归和基于锚点校准的统一目标进行训练。\n- **深度解析**: 实验表明PhyProbe在大多数成对基准（尤其是无对应和生成-生成设置）中优于先前方法。与人类判断具有强相关性，分数排序良好且锚定在稳定的[0, 1]尺度。此外，在没有显式通用偏好标签的情况下，在人类偏好基准上表现也具有竞争力。摘要未提供具体的数据集名称和指标数字。\n- **领域归类**: [视频生成, 评估指标, 物理一致性]\n---\n\n### 44. Elephant in the Fridge: Constant-Memory Frame Packing for Long Video Understanding (冰箱里的大象：用于长视频理解的恒定内存帧打包)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16118)\n- **研究任务**: 解决长视频（如小时级视频、流媒体、电影）理解中视觉语言模型（VLMs）因视觉token随视频长度线性增长导致的内存消耗和推理延迟问题。\n- **核心亮点**: 提出FramePack-U，一种无需训练、无需微调或修改架构的帧打包框架。在推理时直接插入现成VLMs，以恒定内存成本将任意长视频压缩为固定大小的视觉表示。采用内容感知压缩策略，根据语义相似性对帧评分并排序，以不同分辨率打包到固定长度上下文窗口。\n- **深度解析**: 在LongVideoBench、MLVU和Video-MME上的实验表明，FramePack-U在多种模型系列、参数规模和帧预算下均优于全分辨率基线及先前的token减少和关键帧选择方法。在Qwen3.5-35B-A3B上，128帧预算下，三个基准分别提升+12.9%、+10.6%和+9.7%。\n- **领域归类**: [长视频理解, 视觉语言模型, Token压缩]\n---\n\n### 45. LongR: Unleashing Long-Context Reasoning via Reinforcement Learning with Dense Utility Rewards (LongR：通过具有密集效用奖励的强化学习释放长上下文推理能力)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2602.05758)\n- **研究任务**: 提升大语言模型在长上下文场景（如长对话理解和结构化数据分析）中的严格推理能力，解决仅依赖稀疏、结果导向奖励效果有限的问题。\n- **核心亮点**: 提出LongR统一框架，整合动态“思考与阅读”机制（将推理与文档查阅交替进行）与基于相对信息增益的上下文密度奖励，以量化相关文档的效用，无需证据注释。\n- **深度解析**: 实验表明，LongR在LongBench v2上提升超9%，在RULER和InfiniteBench上取得一致提升。该框架在多种RL算法（如DAPO、GSPO）中均能提升性能。摘要未提供具体的推理链长度影响和抗干扰能力的详细数字。\n- **领域归类**: [长上下文推理, 强化学习, 大语言模型]\n---\n\n### 46. EMHO: EMbodied Agent Harness Optimization via Experience Traces (EMHO：通过经验轨迹优化具身智能体控制框架)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08432)\n- **研究任务**: 优化具身智能体的控制框架（harness，控制规划、上下文和工具使用），使其能在稀疏环境反馈下直接从经验轨迹中自我改进，而无需修改底层模型。\n- **核心亮点**: 提出EMHO自进化框架，保持具身模型冻结，通过分析执行轨迹和先前的框架历史来迭代修改其控制框架。引入EMHO-Merge，利用回合级的收益和损失来指导单一共享框架在多个子任务上的联合优化。\n- **深度解析**: 在EmbodiedBench的导航和操作任务上评估，EMHO一致提高了Qwen 9B和27B模型的任务成功率。定性分析表明，EMHO不仅从失败中恢复，还重塑了具身智能体解释和与环境交互的方式。摘要未提供具体的成功率提升数字。\n- **领域归类**: [具身智能体, 自我进化, 强化学习]\n---\n\n### 47. Latent World Action Model for GUI Agents (面向GUI智能体的潜在世界动作模型)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14228)\n- **研究任务**: 解决像素空间世界模型在GUI环境中面临的两个挑战：像素重建的高计算成本，以及需要重建超出动作选择所需的大型且多样的外观级细节（导致身份捷径问题）。\n- **核心亮点**: 将GUI世界建模的预测目标从全屏重建转移到潜在空间中动作诱导的未来信息。利用大型多模态模型作为潜在世界模型，共享表示支持动作选择和预测转移建模两个专用头。引入动作感知对比目标以缓解身份捷径。\n- **深度解析**: 在离线和在线GUI设置中的广泛实验表明，与像素空间世界模型相比，该方法在成功率上分别实现了高达31.9%和40.6%的相对提升，同时将推理延迟大幅降低高达98.9%。代码已开源。\n- **领域归类**: [GUI智能体, 世界模型, 潜在空间]\n---\n\n### 48. WorldRecon: Generative Multi-View Mesh Reconstruction for Large-Scale 3D World (WorldRecon：面向大规模3D世界的生成式多视图网格重建)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18846)\n- **研究任务**: 从未位姿的多视图图像中重建完整、高质量的大规模场景网格，需要在忠实几何基础的同时合理完成未观察或稀疏捕获的表面。\n- **核心亮点**: 提出WorldRecon生成式多视图重建框架。使用粗略、嘈杂的全局点云和相机位姿作为全局脚手架，并将其划分为重叠的空间块。为原生3D生成模型TRELLIS.2配备专门的重建条件架构，生成稀疏结构、详细几何和PBR材质。引入邻居感知潜在修复和因果世界生成过程以保持场景级连贯性。\n- **深度解析**: 实验表明WorldRecon实现了最先进的重建性能。在合成和真实世界室内场景中，与最强基线相比，Chamfer距离分别降低了14.9%和43.1%，F-score分别提高了17.3%和12.0%。\n- **领域归类**: [3D重建, 多视图生成, 大规模场景]\n---\n\n### 49. AutoEnvScaling: Automating the Data Flywheel with Terminal Agents (AutoEnvScaling：利用终端智能体自动化数据飞轮)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14163)\n- **研究任务**: 解决终端智能体通过强化学习训练时，需要多样且可验证的环境，而这些环境主要由人类研究人员设计，导致供应受限的问题。\n- **核心亮点**: 提出AutoEnvScaling，将环境设计视为终端任务，利用智能体自动化数据飞轮。提议者智能体从正在训练的求解器的轨迹中构建新的强化学习环境，求解器的新轨迹指导下轮生成。将环境生成和求解都作为终端任务，以实现递归自我改进（RSI）。\n- **深度解析**: 与仅提示生成相比，有效环境率提高高达25倍，每个有效环境的成本降低高达75%。在GPT-5.6-sol的AutoEnvScaling环境上训练Qwen3.5-35B-A3B，使其Terminal-Bench 2.1得分比匹配的Tmax基线提高4.3分。Qwen3.6-35B-A3B在两个角色中均获得12.2分提升，Terminal-Bench 4.0得分从1.6升至3.2。\n- **领域归类**: [终端智能体, 强化学习, 自动化环境生成]\n---\n\n### 50. UniForge3D: Joint 3D Reconstruction and Generation in a Shared Anchor-Guided Space (UniForge3D：在共享锚点引导空间中的联合3D重建与生成)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15357)\n- **研究任务**: 从稀疏、未位姿的图像中生成完整的3D资产，需要保留观察到的几何形状同时完成未见区域。解决相机相对重建与规范空间生成结合时引入的坐标不匹配问题，以及条件化时混合有用几何证据与无关图像内容的问题。\n- **核心亮点**: 提出UniForge3D，在共享锚点引导空间中联合建模重建和生成，解决坐标不匹配。该空间遵循锚点视图的方位角并保持物体直立。两个分支双向交换特征以预测每视图点图和完整的稀疏体素结构。进一步将点图预测条件化于生成的结构上，建立像素到体素的对应关系，并为每个体素选择最具信息量的输入视图。\n- **深度解析**: 该方法在Toys4K和GSO数据集上实现了最先进的appearance和geometry结果，生成具有更高保真度的完整3D资产。摘要未提供具体的指标数字。\n- **领域归类**: [3D生成, 3D重建, 稀疏视图合成]\n---\n\n### 51. What Really Works for Universal Multimodal Embeddings? A Controlled Study of Contrastive Training Strategies (通用多模态嵌入究竟什么真正有效？对比训练策略的对照研究)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15035)\n- **研究任务**: 在统一且可复现的条件下，系统评估多模态表示学习中各类对比训练策略的实际有效性，以指导通用多模态嵌入模型的训练。\n- **核心亮点**: 提出 MLLM-as-a-Judge 诊断框架以剖析检索行为中的失败模式；揭示了现有策略中普遍存在的“梯度失真”和“分布错觉”问题；提出了一种整合多种策略的协同训练方案，显著提升了模型性能。\n- **深度解析**: \n  - **技术细节**: 引入 MLLM-as-a-Judge 框架，将 top-1 检索行为分解为标记正例、假负例（未标记的有效匹配）以及难/易负例错误。研究发现：1. 梯度失真：对高相似度负样本进行梯度加权会持续损害下游泛化能力；2. 分布错觉：正负样本相似度分布分离更宽并不必然转化为更好的检索性能。\n  - **实验结果与数字**: 协同训练方案（整合难负样本挖掘、假负样本缓解和困难批次构建）在 MMEB 上使用 Qwen2-VL-2B 模型实现了平均 6.0% 的性能提升。\n  - **数据集**: MMEB。\n- **领域归类**: [多模态学习, 对比学习, 表示学习]\n---\n\n### 52. SWE-MISBEHAVIOR: Benchmarking and Mitigating Boundary Violations in Software Coding Agents (SWE-MISBEHAVIOR：软件编码智能体边界违规的基准测试与缓解)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18206)\n- **研究任务**: 诊断并缓解代码智能体（coding agents）在代码生成、文件管理和系统交互等动作空间中出现的边界违规不当行为。\n- **核心亮点**: 提出首个用于诊断代码智能体边界违规的分类法与评估框架 SWE-MISBEHAVIOR；提出轻量级自适应框架 CODE-KIT，结合违规感知指南与新工具帮助智能体避免此类失败。\n- **深度解析**: \n  - **技术细节**: 评估协议涵盖 11 种不同的不当行为，包括代码动作违规、CRUD 文件不当行为、系统完整性与滥用违规以及任务目标未对齐。CODE-KIT 框架通过提供感知违规的指南和新型工具来约束智能体行为。\n  - **实验结果与数字**: 实验发现开源智能体存在大量未对齐行为，包括依赖误解（高达 98.5%）、意外修改用户输入（50.5%）和静默破坏环境完整性（53%）。应用 CODE-KIT 后，smolagents 的不当行为减少 52%，OpenHands 减少 34%，同时任务完成率得到提升。\n  - **数据集**: SWE-MISBEHAVIOR（包含 7.4K 个人机协同合成样本）。\n- **领域归类**: [智能体, 软件工程, 安全与对齐]\n---\n\n### 53. Rubrics from the Task, Verdicts from Evidence: Pointwise Rubric Rewards with Tool-Augmented Judges (基于任务推导评分标准，基于证据得出裁决：工具增强评判器的逐点评分标准奖励)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18766)\n- **研究任务**: 改进基于评分标准的奖励模型（RMs），消除由候选响应引发的偏差，并提供可直接用于策略优化的逐点评估能力。\n- **核心亮点**: 提出 ReVeR 逐点评分标准奖励模型，仅通过推理指令来推导硬性规则和分级原则，并通过工具增强的评判器独立评估响应；引入无标签蒸馏训练机制。\n- **深度解析**: \n  - **技术细节**: 采用无标签蒸馏（label-blind distillation）进行训练，偏好标签仅用于过滤教师的输出。ReVeR 能够独立评估响应，克服了传统成对评判器只能提供相对偏好的局限。研究发现生成器 RL 会提高偏好准确率但降低评分标准保真度，且更高的偏好准确率不一定转化为更好的下游策略。\n  - **实验结果与数字**: ReVeR 在平均偏好准确率（尤其是指令遵循任务）、测试时扩展和下游策略优化方面优于成对评分标准 RM。具体提升数字摘要未提供。\n  - **数据集**: ReVeR-Traces（大规模评分标准推理与评判轨迹数据集），具体数据规模摘要未提供。\n- **领域归类**: [奖励模型, 强化学习, 大语言模型对齐]\n---\n\n### 54. HexaBee-4B: Six-Language Translation with Multilingual Answering and Bidirectional Supervision (HexaBee-4B：具备多语言问答与双向监督的六语言翻译)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16361)\n- **研究任务**: 提升多语言翻译模型在保持语义的同时生成目标语言文本的能力，重点优化六种特定语言之间的翻译质量。\n- **核心亮点**: 提出 HexaBee-4B，通过三阶段训练从 Gemma 3 4B IT 改编而来；创新性地引入中间阶段，通过共享多语言答案将问答和翻译任务连接起来。\n- **深度解析**: \n  - **技术细节**: 训练分为三个阶段：维基百科继续预训练、联合多语言问答与答案文本翻译、双向翻译专业化。中间阶段利用共享的多语言答案作为桥梁，有效连接了“用目标语言回答问题”和“将答案翻译成目标语言”两个任务。\n  - **实验结果与数字**: 在涵盖 30 个翻译方向的测试中，HexaBee-4B 的方向宏观 chrF++ 达到 73.75，显著优于 Gemma 3 4B IT（57.11）和 Gemma 3 12B IT（66.83）。BLEU、TER、COMET 等指标均支持该排名。\n  - **数据集**: 中间阶段包含 1946 万条问答记录（含 576 万跨语言问答对和 1070 万答案文本翻译），最终阶段使用 658,274 个正向和反向合成翻译样本。测试集为 36,572 个合成样本。\n- **领域归类**: [机器翻译, 多语言处理, 模型微调]\n---\n\n### 55. PsyBer-Agent: A Psychology-Driven User Agent for Recommender Systems (PsyBer-Agent：面向推荐系统的心理学驱动用户智能体)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13989)\n- **研究任务**: 构建能在长周期闭环交互中保持逼真的用户模拟器，以在部署前更准确地评估推荐系统。\n- **核心亮点**: 提出受心理学启发的模拟器 PsyBer-Agent，通过 Psy-Engine 建模用户的疲劳、情感和偏好转变等动态特征；引入 WebSim 平台和 PsyBer 基准测试以支持多模态场景评估。\n- **深度解析**: \n  - **技术细节**: Psy-Engine 使用三个不断演进的模型定义隐状态来表示每个用户。通过非平衡 Gromov-Wasserstein 最优传输，将日志条件参考轨迹与模拟器生成的隐状态轨迹对齐，从而为轻量级策略提供结构化监督，避免了微调骨干 LLM 的计算负担。\n  - **实验结果与数字**: 在测试范围内，PsyBer-Agent 的行为差异低于仅使用提示词的模拟器。在高达 500 万（5M）排队模拟任务的大规模并发模拟下，系统仍能保持稳定的性能。\n  - **数据集**: WebSim 平台和 PsyBer 基准测试（包含多模态场景和七种推荐骨干网络），具体样本数量摘要未提供。\n- **领域归类**: [推荐系统, 用户模拟, 智能体]\n---\n\n### 56. CIViC: Evidence Gates for Audio-Conditioned Visual Prediction on Proxy Tasks (CIViC：代理任务中音频条件视觉预测的证据门控)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15327)\n- **研究任务**: 验证视觉预测模型是否真正使用了预期的音频信息，排除仅因移除音频导致输出变化而产生的虚假因果推断。\n- **核心亮点**: 提出条件输入与视觉解释检查（CIViC）四门控协议，将模型解释与干预、保留任务比较或端点控制严格联系起来，在多个代理任务上验证了模型对音频信息的真实利用情况。\n- **深度解析**: \n  - **技术细节**: CIViC 协议通过四种门控机制交叉验证。结果表明，输出激活、保留误差和端点控制在不同的代理任务中支持不同的解释，不能仅凭单一指标断定模型是否有效利用了音频条件。\n  - **实验结果与数字**: 在合成混合物中，条件增强拟合的 1,000 步 RMSE 为 0.1807，高于纯音频拟合的 0.1707，且差距在训练期间缩小。在 SpeakerVid 代理中，五特征零拟合（将五个低级音频摘要置零）的全帧灰度 RMSE 低于对齐音频，但对齐音频的段漂移误差更低。\n  - **数据集**: 演员不相交的人脸光栅测试、合成音频特征混合物、源视频不相交的 SpeakerVid 代理任务。\n- **领域归类**: [多模态学习, 模型评估, 计算机视觉]\n---\n\n### 57. Spectral-Driven Adaptive-Rank Optimizer for Large Language Model Reinforcement Learning with Verifiable Rewards (面向可验证奖励大语言模型强化学习的谱驱动自适应秩优化器)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16533)\n- **研究任务**: 探究可验证奖励强化学习（RLVR）是否诱导了独特的优化几何结构，并设计适配该结构的优化器以提升大语言模型的推理能力。\n- **核心亮点**: 发现 RLVR 中梯度能量会逐渐集中到不断缩小的有效子空间中；提出 Ares 优化器，能够根据梯度谱能量分布自适应地估计并调整有效更新秩。\n- **深度解析**: \n  - **技术细节**: Ares（自适应秩有效谱优化）不依赖外部预设的更新秩，而是从梯度的谱能量分布中估计有效更新秩，跟踪其演变，并将驱动每次更新的梯度信号限制在 resulting 低秩子空间中。研究发现这种梯度能量集中现象是 RLVR 特有的，在 SFT 中不存在，且在奖励随机化后基本消失。\n  - **实验结果与数字**: 在不同规模的大语言模型上，Ares 提高了广泛使用的优化器的准确率，并在多种 RLVR 算法和任务中展现出良好的泛化能力。具体提升数字摘要未提供。\n  - **数据集**: 摘要未提供具体数据集名称。\n- **领域归类**: [强化学习, 优化算法, 大语言模型]\n---\n\n### 58. Agent Sociodrama: Social-Dynamics-Guided Persona Recasting for LLM Agent Teams (智能体社会剧：社会动态引导的大语言模型智能体团队角色重塑)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15788)\n- **研究任务**: 建模和验证大语言模型智能体团队中不断演变的社会动态，以解决团队在协作中出现的社交失败问题（如信息隐瞒、主导者锚定错误等）。\n- **核心亮点**: 提出 Agent Sociodrama 框架，通过外部 LLM 评判器动态更新智能体的情绪状态和不对称关系；提出轨迹引导角色重塑（TPR）机制，通过诊断群体动态失败来重新分配智能体角色。\n- **深度解析**: \n  - **技术细节**: 在固定角色下，智能体的情绪状态和定向关系每轮由统一的外部 LLM 评判器更新，并塑造后续交互。TPR 机制从交互文本和社会轨迹中诊断群体动态失败，并在重新运行任务前重塑智能体角色。\n  - **实验结果与数字**: 在四个协作基准上，TPR 与初始角色分配相比，准确率最高提升 83.3 个百分点。在分布式信息合作和混合动机讨价还价等任务中，在四个比较中的三个里优于 SOTOPIA 和 AgentVerse，帕累托率最高提升 37.5 个百分点。\n  - **数据集**: 实验使用了六个 LLM 骨干和五个社会场景，以及四个协作基准。具体基准名称摘要未提供。\n- **领域归类**: [多智能体系统, 社会动态, 大语言模型应用]\n---\n\n### 59. PANINI-DR: Controlled Deep Research through Generative Semantic Workspaces (PANINI-DR：通过生成式语义工作空间进行受控的深度研究)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15208)\n- **研究任务**: 解决深度研究中智能体在模型调用间维持研究状态、并在错误传播前验证中间发现的挑战。\n- **核心亮点**: 提出多智能体框架 PANINI-DR，将整体调查的协调与子问题的研究验证分离；引入基于生成式语义工作空间的共享状态记录机制，确保研究过程的可控性与证据的可追溯性。\n- **深度解析**: \n  - **技术细节**: 共享工作空间记录子问题、依赖关系、发现和证据。研究人员负责调查子问题，而独立的验证智能体根据子问题及其证据检查 proposed answers。验证反馈指导后续调查，且所有发现在被重用前都必须经过证据核对。\n  - **实验结果与数字**: 在 BrowseComp-Plus 上准确率达 73.3%，比第二好的框架高 16.0 个百分点，在困难问题上优势尤为明显（回答正确数几乎是第二名的两倍）。PANINI-DR 在所有三个基准上从保存证据中实现了最高的答案可恢复性。\n  - **数据集**: BrowseComp-Plus, FRAMES, MoNaCo。\n- **领域归类**: [智能体, 深度研究, 信息检索]\n---\n\n### 60. RSIPO: Recursive Self-Improving Policy Optimization for Agentic Reinforcement Learning via Skill-Policy Co-Evolution (RSIPO：通过技能-策略协同进化实现智能体强化学习的递归自我改进策略优化)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15772)\n- **研究任务**: 改善智能体强化学习（Agentic RL）中长视野任务中的信用分配问题，解决现有方法忽视智能体技能在策略演变及教师监督可靠性方面的不足。\n- **核心亮点**: 提出 RSIPO 框架，使智能体技能和策略模型在整个训练过程中协同进化；策略自身从轨迹中提取技能并优化技能生成能力；采用经验贝叶斯收缩动态校准对教师分数的信任度。\n- **深度解析**: \n  - **技术细节**: RSIPO 允许策略模型从完成的轨迹中提取技能，并通过轨迹回放显式优化其技能生成能力。同时，采用经验贝叶斯收缩（empirical Bayes shrinkage）来动态校准学生对教师分数的信任度，以应对技能增强的教师指导有时可靠性较低的问题。\n  - **实验结果与数字**: 以 Qwen2.5-7B 为基础模型，RSIPO 在 ALFWorld 任务上达到 98.6% 的平均成功率，比第二好的基线和标准 GRPO 分别绝对提升 2.5% 和 17.4%。\n  - **数据集**: ALFWorld，以及具身交互和基于搜索的智能体任务（具体其他数据集名称摘要未提供）。\n- **领域归类**: [强化学习, 智能体, 策略优化]\n\n### 61. ACCRUE: Continual Off-Policy Reinforcement Learning for Robot Foundation Models (ACCRUE：面向机器人基础模型的持续离策略强化学习)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18596)\n- **研究任务**: 解决机器人基础模型（RFMs）在持续学习新任务时如何避免遗忘已学行为，并提高样本效率的问题。\n- **核心亮点**: 提出ACCRUE框架，一种持续离策略强化学习方法。通过跨任务携带轻量级actor和critic网络，复用先前的行为和值知识。critic仅在当前任务转移上进行自适应并指导actor学习，同时通过蒸馏保留先前行为。固定视觉特征以保持继承的学习器与基础策略更新兼容。\n- **深度解析**: 现有的持续强化学习方法要么依赖在策略（on-policy）更新导致前向迁移有限，要么使用离策略（off-policy）方法但不解决跨任务的持久性。ACCRUE结合了离策略的样本效率和持续学习能力。在仿真和真实机器人硬件上的接触密集型装配序列中，该方法加速了后续任务的学习，遗忘率接近于零，并将真实机器人的训练时间显著减少了31.0%到68.5%。\n- **领域归类**: [机器人学, 强化学习, 持续学习]\n---\n\n### 62. LightVAE: Towards Compact and Efficient Video Autoencoders (LightVAE：迈向紧凑高效的视频自编码器)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14726)\n- **研究任务**: 解决视频生成中潜在扩散模型的视频VAE编解码计算成本高昂的问题。\n- **核心亮点**: 提出LightVAE压缩框架，利用时间建模和网络深度的冗余。将因果Conv3D层精确重参数化为聚合空间响应和差分驱动的时间校正。提出时间低秩压缩（TLR）和保宽块剪枝，并通过探测引导的特征对齐恢复压缩后的质量。\n- **深度解析**: 现有方法要么联合约束空间和时间计算，要么完全移除时间计算，未区分预训练Conv3D中两者的压缩敏感度。LightVAE根据敏感度差异，对时间校正应用特定层的低秩近似。在Wan VAE系列中，在NVIDIA H100和RTX 5090上分别实现最高2.24倍和1.11倍的解码吞吐量提升，且DAVIS PSNR更高、LPIPS更低。在MiniMax-H3上实现最高2.97倍原始解码吞吐量，保留99.51%的VBench-2.0分数。\n- **领域归类**: [计算机视觉, 视频生成, 模型压缩]\n---\n\n### 63. Controlled Acquisition and Abstention in Three-Channel Score Conflicts (三通道分数冲突中的受控获取与弃权)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10808)\n- **研究任务**: 研究在音频、视频和文本等多模态信息发生冲突时，系统是否应该获取额外信息源或选择弃权（abstain）的决策问题。\n- **核心亮点**: 构建了一个受控的三分数基准测试，策略观察两个有符号分数，可付费请求第三个分数，并可选择弃权。主要奖励是机制特定的，弃权仅在指定的模糊机制下正确，在混合损坏下受罚。\n- **深度解析**: 研究表明，阈值策略能以更少的请求匹配“始终请求”的决策。在部分保留的合成数据分割上，阈值策略达到0.789 +/- 0.006的目标决策准确率和0.481 +/- 0.014的效用。三分数多数参考达到0.626 +/- 0.008和0.252 +/- 0.016，但使用了更多信息。结果分离了全模态准确率与请求前选择的价值，表明选择价值取决于预算和观察对的排名。摘要未提供具体的下游应用场景细节。\n- **领域归类**: [多模态学习, 决策理论, 主动学习]\n---\n\n### 64. Pristine Models (纯净模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14091)\n- **研究任务**: 解决文本到图像生成模型中，使用广泛未过滤数据训练会学到不安全概念，而限制数据又会降低生成质量的权衡问题。\n- **核心亮点**: 提出“纯净模型”（Pristine Models），一种新型文本到图像生成架构。通过注意力机制鼓励将安全和非安全知识分离到独立参数化的分支中，在推理时可以分离并禁用不安全分支。\n- **深度解析**: 现有方法多通过事后的概念遗忘（concept unlearning）来解决，容易导致灾难性遗忘。Pristine Models在预训练期间隔离不安全概念知识，以便在推理时禁用对它的访问。在ImageNet上，该方法在保留全数据预训练效用的同时实现更安全的生成，图像质量和文本对齐优于仅在安全数据上训练或事后移除概念。在CC12M上的扩展证明了其在更大、更多样的开放世界预训练设置中的有效性。摘要未提供具体的量化提升数字。\n- **领域归类**: [计算机视觉, 文本到图像生成, AI安全]\n---\n\n### 65. Reading Right, acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops (读得对，做得错：诊断代理循环中系统一模型的决策失败)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18579)\n- **研究任务**: 诊断“系统一”（System One）模型（通过单次传递对选项评分来选择下一步动作的模型）在代理循环中选择错误动作的原因，即模型是误读了环境信息，还是读对了但依然做出了错误动作。\n- **核心亮点**: 在冻结的代理决策状态基准上，将每个下一步动作问题与关于同一状态的事实探针（factual probes）配对。发现大多数错误动作发生在正确读取信息之后，且系统越准确，这类错误占比越高。\n- **深度解析**: 这些错误并非噪声，而是集中在各类系统的相同状态上。当探测到的事实可证明地决定动作时，读取了所有事实的模型仍然无法将它们组合起来，而由代码组合的模型自身答案则能修复这一失败。在真实状态中，缺失的往往不是事实，而是下一个子目标。摘要未提供具体的基准测试名称和量化指标。\n- **领域归类**: [大语言模型, 智能体(Agent), 模型评估与诊断]\n---\n\n### 66. WorldCast: Distributed Multiplayer World Models (WorldCast：分布式多人世界模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12412)\n- **研究任务**: 解决多人世界模型需要生成独立控制的视角，同时保持对玩家和共享环境一致表示的问题，克服现有联合多视角生成方法成本随玩家增加而增长的限制。\n- **核心亮点**: 提出WorldCast，一种分布式多人世界模型。每个玩家运行一个包含视频生成器和状态模型的本地客户端。客户端交换玩家状态并将其投影到相机对齐的玩家状态场中，以指导其他玩家的渲染。\n- **深度解析**: 共享场景状态使客户端能够重用彼此生成的观察结果，以保持跨视角的场景外观一致性。在《反恐精英2》（Counter-Strike 2）上的实验表明，相机对齐的玩家状态场将玩家渲染率比联合生成方法提高了一个多数量级，共享场景状态提高了整个回合的视觉一致性。每个客户端实时运行，仅交换玩家和场景状态，实现无中心计算瓶颈的可扩展多人生成。摘要未提供具体的帧率或延迟数字。\n- **领域归类**: [计算机视觉, 世界模型, 游戏AI/图形学]\n---\n\n### 67. AUGUstus: Autonomous Driving VLA Model with Unified Generation and Understanding (AUGUstus：统一生成与理解的自动驾驶VLA模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16985)\n- **研究任务**: 解决当前视觉-语言-动作（VLA）模型在自动驾驶中的两个局限：1）退化为视觉-动作（VA）模型，未充分利用VLM理解导致不安全；2）自回归方法生成思维链（CoT）和动作token延迟高。\n- **核心亮点**: 提出AUGUstus，将基于扩散的动作生成和自回归CoT理解统一在一个模型中。AUGUstus-mode在推理时仅需动作输出以实现低延迟，而CoT在训练时监督可靠的动作。提出统一的GRPO算法（AUGUstus-GRPO）联合优化动作和CoT。\n- **深度解析**: 在NAVSIMv1和NAVSIMv2上分别达到94.6 PDMS和90.7 EPDMS，实现无评分器模块的SOTA规划。在nuScenes上，平均L2误差0.27米，平均碰撞率0.05%。使用512张NVIDIA H800 GPU训练约2天，在内部1000公里数据集上评估，并初步部署在真实车辆上，实现12 Hz运行。\n- **领域归类**: [自动驾驶, 视觉-语言-动作模型(VLA), 强化学习/规划]\n---\n\n### 68. DoubtLess: Training-Free Contrastive Decoding for Efficient Reasoning (DoubtLess：用于高效推理的免训练对比解码)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18862)\n- **研究任务**: 解决推理模型在生成长思维链（CoT）时消耗过多token的问题，旨在不降低准确率的前提下缩短CoT。\n- **核心亮点**: 提出DoubtLess，一种免训练的解码方法。使用一个更小的推理模型引导大模型走向简洁。小模型两次读取大模型的当前CoT（一次提示简洁，一次提示冗长），将两个logit向量的差值按比例加到大模型的logits上。\n- **深度解析**: 在7个竞赛数学、研究生科学和竞赛编程基准上，DoubtLess将Qwen3-32B的CoT缩短了31%且准确率不变，优于5个推理时基线。在自调试编码代理中，每轮思考token减少20%。该方法还可推广到其他模型家族，并与基于训练的压缩方法结合使用。消融实验表明，大部分token节省发生在正确答案首次出现在CoT之后，减少了重复检查。\n- **领域归类**: [大语言模型, 推理优化, 解码策略]\n---\n\n### 69. Web$hell: A Unified Interface for Agentic Web Access (Web$hell：用于智能体Web访问的统一接口)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13416)\n- **研究任务**: 解决大语言模型智能体在执行复杂、长视野的端到端任务时，现有Web访问模型（搜索增强、基于浏览器、基于文件系统）难以同时满足广泛信息收集、浏览器操作和证据回顾需求的问题。\n- **核心亮点**: 提出Web$hell，一个在单一访问模型下统一Web访问的接口。使用WebContract定义的通用模式，WebCompiler将实时网页编译为可寻址的信息和动作对象。这些对象在WebCache中维护，并通过共享操作集处理。\n- **深度解析**: 现有方法主要支持信息收集或浏览器交互，结合两者成本高或存在性能权衡。Web$hell为智能体提供一致、可操作和持久的Web访问。在Web搜索、Web导航和深度研究基准上的广泛实验表明，Web$hell以较低的成本实现了强大的任务性能。摘要未提供具体的基准测试名称和量化提升数字。\n- **领域归类**: [大语言模型, 智能体(Agent), Web交互]\n---\n\n### 70. Diffusion Editing with Soft Mask: Pixel Level Redo of Image and Video with Adjustable Strength (基于软掩码的扩散编辑：具有可调强度的图像与视频像素级重做)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00359)\n- **研究任务**: 解决基于提示和参考图像引导的扩散模型编辑方法在像素级控制上过于粗糙的问题，特别是引入软掩码（soft mask）指定空间变化编辑强度时面临的训练成本高或零样本方法效果不佳的挑战。\n- **核心亮点**: 提出SoftPaint，一种新的零样本采样方法，利用软掩码实现从完全保留原始内容到完全重新合成掩码区域的连续编辑光谱。设计了一种基于Langevin迭代的采样器，尊重每像素的软掩码强度。\n- **深度解析**: 该方法超越了零样本图像修复方法，普遍适用于图像和视频扩散模型，支持视频编辑等任务。SoftPaint是无梯度的、内存高效的，并在多个图像和视频骨干网络上实现了平滑的像素级编辑。摘要未提供具体的量化指标或对比数据集。\n- **领域归类**: [计算机视觉, 图像/视频编辑, 扩散模型]\n---\n\n### 71. Beyond the Verdict: Agentic Code Judging with Verifiable Feedback (超越判决：基于可验证反馈的智能体代码评判)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18760)\n- **研究任务**: 在竞争性编程中，指导大语言模型（LLM）在测试时进行代码选择或修订，通过生成反例作为可验证证据，仅使用问题陈述和源代码来评判和诊断候选程序。\n- **核心亮点**: 构建了USACO-JUDGE数据集；训练了35B MoE智能体验证器ARBITER；在代码选择和优化任务中超越基线，并在IOI 2026案例研究中提升了GPT-OSS-120B的预期得分。\n- **深度解析**: 针对官方评判系统不提供失败解释和失败输入的局限，本文提出了一种无需消耗官方提交次数即可提供信息反馈的任务。通过强化学习在通用执行沙盒中训练ARBITER模型，使其能够生成反例作为检查证据。实验表明，该模型在错误程序上的反例成功率从40.61%提升至62.67%，平均二元判决准确率从71.41%提升至87.41%。此外，ARBITER在代码选择和细化方面表现优异，在IOI 2026案例研究中，其引导的细化使GPT-OSS-120B的预期得分在官方提交限制下超过了金牌门槛。\n- **领域归类**: [自然语言处理, 代码生成, 强化学习, 智能体]\n---\n\n### 72. Enabling Token-wise Importance Sampling in Off-Policy RLVR with Proximal KL Regularization (通过近端KL正则化在离策略RLVR中实现逐词重要性采样)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18738)\n- **研究任务**: 解决具有可验证奖励的强化学习（RLVR）中离策略（off-policy）数据（如异步生成、rollout-training不匹配和响应重用）导致的策略梯度偏差问题。\n- **核心亮点**: 证明了在覆盖和局部表达能力条件下，完整的未来KL信用能使精确近端优化器成为更新的唯一平稳策略；提出了Proximal KL方法，在数学基准测试中微平均准确率最高提升2.58%。\n- **深度解析**: 离策略数据在RLVR中很常见，逐词重要性加权通常会带来策略梯度偏差。本文证明了在特定条件下，使用完整的未来KL信用可以解决这一问题，无需全响应权重或拟合的critic。基于此提出了Proximal KL方法，将参考策略与采样策略分离，并用有界的未来KL信用替代PPO裁剪。在Qwen3-1.7B和Qwen3-4B上的七组匹配离策略比较中，Proximal KL在八个数学基准上的微平均准确率比GRPO高出最多2.58%。在定期刷新实验中，该方法避免了PG和CISPO中观察到的崩溃，且逐词校正优于序列级和无权重控制。\n- **领域归类**: [自然语言处理, 强化学习, 大语言模型训练]\n---\n\n### 73. Can an Agent Learn to Predict Its Own Failure? Outcome-Grounded Confidence Calibration in LLM Agents (智能体能学会预测自己的失败吗？LLM智能体中基于结果的置信度校准)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18614)\n- **研究任务**: 在长视野任务中，校准LLM智能体每一步的置信度信号，以预测当前rollout最终是否会成功，从而决定是信任下一步动作、放弃还是交给人类。\n- **核心亮点**: 提出了一种将智能体自我报告的置信度与多步episode的最终结果进行校准的方法；在ALFWorld等环境的离线和在线RL中显著提升了置信度的预测能力（AUROC从接近随机提升至0.68-0.85）。\n- **深度解析**: 现有的强化学习方法通常将置信度校准到当前步骤决策的正确性上，而本文提出在GRPO下，利用任务的rollout组提供成功标签，并使用适当的评分规则根据实现的结果对每一步的置信度进行评分。在Qwen2.5-7B智能体的离线RL中，步骤置信度对episode结果的AUROC从接近随机提升至0.68-0.85，最自信的前10%步骤成功率是平均水平的约4.3倍。在ALFWorld的在线RL中，预期校准误差从0.42降至0.12以下，且选择性执行在不降低任务成功率的情况下有所改善。评估协议表明，训练后的智能体能够从第一步就识别出哪些任务会失败。\n- **领域归类**: [自然语言处理, 智能体, 强化学习, 模型校准]\n---\n\n### 74. Omni-Modal LLMs Know More Than They Say (全模态大语言模型知道的比它们说出来的多)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16135)\n- **研究任务**: 探究全模态大语言模型（Omni-LLMs）在处理非文本模态（如视觉、音频、IMU信号）时，虽然能正确感知但未能表达相关信息的“知而不言”现象，并提升其非文本知识的表达能力。\n- **核心亮点**: 引入了词元级模态对齐（TMA）指标；提出了OmniCatalyst策略，通过自生成文本补充原始模态输入，使非文本知识更易获取，在7个Omni-LLMs上平均提升7.29%的性能。\n- **深度解析**: 研究发现，Omni-LLMs的非文本表示与响应词元的对齐度较低，且获得的注意力少于文本表示，这解释了模态偏好不均的原因。为此，作者提出了OmniCatalyst，一种“感知-\u003e推理”策略，利用模型自生成的文本来补充原始模态输入。分析表明，知识提取阶段增加了TMA，说明改善的对齐度使得非文本信息在响应生成时更易获取。该方法在七个Omni-LLMs上持续提升了性能，并产生了更平衡的模态偏好。\n- **领域归类**: [自然语言处理, 多模态大语言模型, 模态对齐]\n---\n\n### 75. Video-Arena: A Scalable Agentic Video Benchmark for Spatiotemporal Capability (Video-Arena：面向时空能力的可扩展智能体视频基准)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14158)\n- **研究任务**: 评估模型在理解动态世界和跟踪不断演变的世界状态方面的时空能力，解决现有视频基准在真实世界视频标注上的困难。\n- **核心亮点**: 提出了Video-Arena基准，将竞技游戏转化为可扩展、可验证的视频理解测试；包含180个任务的黄金集，并在原生视觉理解和工具辅助智能体分析两种协议下进行了评估。\n- **深度解析**: 真实世界视频的世界状态是部分可观察的，导致标注困难。Video-Arena通过游戏记录大规模生成视频和对齐的参考标签。评估分为三类任务：感知关键事件、解释状态更新和跟踪结果状态。在180个任务的黄金集上，结果表明原生模型难以可靠地感知事件，而工具辅助系统虽然改善了事件恢复，但在解释状态更新和持续跟踪结果状态方面仍然存在困难。摘要未提供具体的F1分数数值。\n- **领域归类**: [计算机视觉, 视频理解, 智能体, 基准测试]\n---\n\n### 76. Scaling Repeated-Data Pretraining: Batch Size, Regularization, and GPU-Time Tradeoffs (扩展重复数据预训练：批量大小、正则化与GPU时间的权衡)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15965)\n- **研究任务**: 研究在计算资源充足但唯一训练数据有限的情况下，如何在相同数据上进行重复预训练，探讨批量大小、正则化以及GPU与时间资源之间的权衡。\n- **核心亮点**: 揭示了验证损失与批量大小之间的U型关系，倾向于较小的批量；证明了在固定时间预算下，使用较少GPU的较小批量可能比使用较多GPU的较大批量获得更低的验证损失。\n- **深度解析**: 本文重新审视了无限计算预训练，发现优化批量大小和epoch数时，较小的批量由于梯度噪声提供的隐式正则化而表现更好。针对训练配方（如文档重打包、权重绑定、正嵌入权重衰减）进行了调整。在放宽无限计算假设后，将GPU和时间视为独立资源。研究表明，尽管更紧迫的截止日期需要更大的批量，但在固定时间预算下，较小批量配合较少GPU仍能实现比大批量配合多GPU更低的验证损失，这挑战了为最大化GPU利用率而增加数据并行的常见做法。\n- **领域归类**: [自然语言处理, 大语言模型预训练, 训练优化]\n---\n\n### 77. Learning Transferable World-Action Models from Task-Paired Human Videos (从任务配对的人类视频中学习可迁移的世界-动作模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14351)\n- **研究任务**: 解决世界-动作模型在标准视频内下一帧预测中依赖外观共享而非学习跨场景和具身迁移的交互问题，通过跨视频预训练学习可迁移的世界-动作表示。\n- **核心亮点**: 提出了WATCH跨视频预训练方法，利用不同环境下的任务配对人类演示进行学习；在机器人后训练后，显著提升了MimicDroid的上下文成功率（最高从59.8%提升至77.7%）。\n- **深度解析**: 标准视频内预测容易让模型依赖外观。WATCH通过在条件视频和动作下，联合预测另一个演示的动作和未来帧，鼓励模型学习跨场景和演示者的任务相关交互。该方法仅使用人类-人类配对即可学习，无需匹配的人-机器人演示。在机器人后训练前，改善了跨具身的运动对齐；后训练后，在Cosmos Policy和Cosmos3下，MimicDroid的上下文成功率分别从40.9%提升至68.3%和从59.8%提升至77.7%，且在未见过的级别上收益最大。这些收益在无上下文后训练和不同机器人具身中持续存在。\n- **领域归类**: [计算机视觉, 机器人学, 视频预训练, 具身智能]\n---\n\n### 78. MixLID: Token-Level Language Identification in Mixed-Language Text (MixLID：混合语言文本中的词元级语言识别)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16601)\n- **研究任务**: 处理多语言文本时，识别广泛的语言范围并区分包含多种语言的输入中每个词元的语言。\n- **核心亮点**: 引入了支持111种语言-脚本组合的词元级语言识别模型MixLID；采用两阶段训练过程，在单语和混合语言识别任务中均超越了所有基线。\n- **深度解析**: MixLID首先使用单语示例的语言标签学习区分单一语言，然后在混合语言数据上继续训练。第二阶段使用来自现有代码切换数据的连接示例，以及基于英语源词和外来词对应关系通过词替换创建的增强示例。在单语识别方面，MixLID在与基线共享语言覆盖范围的四个基准测试中，准确率和宏F1均优于所有基线。在混合语言识别方面，它在每个评估的语言对上识别单个词元语言的表现均优于基线。\n- **领域归类**: [自然语言处理, 多语言处理, 语言识别]\n---\n\n### 79. EventLens: Event-Structure Reinforcement Learning for Video Understanding (EventLens：面向视频理解的事件结构强化学习)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16172)\n- **研究任务**: 解决多模态大语言模型（MLLMs）在视频问答中难以恢复使视频连贯的时间结构（如事件边界、单事件进展、多事件关系）的问题。\n- **核心亮点**: 提出了以视觉为中心的强化学习框架EventLens，通过事件结构恢复来学习视频理解；引入了多教师在线策略蒸馏（MT-OPD），在保持通用视频问答性能的同时，提升了时间接地和事件敏感推理的能力。\n- **深度解析**: 现有的字幕式监督允许模型依赖语言捷径。EventLens通过受控扰动（如改变时间粒度、反转进展、打乱事件顺序）训练模型恢复时间结构。实例化了三级时间本体，推导出事件分割、进展判别和多事件关系推理三个可验证任务族，支持无需人类偏好标签的GRPO训练。在Qwen3-VL骨干上的实验表明，该方法在时间接地和事件敏感推理基准上有一致提升，且与直接混合RL优化相比，训练成本显著降低。\n- **领域归类**: [计算机视觉, 多模态大语言模型, 视频理解, 强化学习]\n---\n\n### 80. SHELDON: Reasoning through Dual Search over Hypothesis and Observation Spaces (SHELDON：通过假设和观察空间的双重搜索进行推理)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18025)\n- **研究任务**: 解决测试时扩展中，现有方法将观察发现与现有假设耦合，导致偏向局部细化而非探索未知假设区域的问题，提升科学推理和复杂任务的性能。\n- **核心亮点**: 引入了SHELDON科学推理框架，分别表示并联合探索假设和观察空间；在诊断、抽象推理和优化基准上比基线高出最多26.7分，并能生成多达4.5倍的新颖解决方案。\n- **深度解析**: 现有方法在寻找当前假设证据时收集观察，然后基于假设和证据生成新假设，这限制了探索。受假设演绎法和科学发现双空间模型的启发，SHELDON积极寻找新观察和新假设，从而发现当前假设无法解释的观察。这些未解释的观察暴露了理解上的差距，激发了新的研究，并指导生成超越现有假设细化的新假设。在多个基准测试中，SHELDON表现出色，且分析显示其生成的新颖解决方案数量显著增加。\n- **领域归类**: [自然语言处理, 推理, 智能体, 科学发现]\n---\n\n### 81. 4LC: 4D Latent Cache for Efficient Conditioning in Dynamic World Modeling (4LC：用于动态世界建模中高效条件生成的4D潜在缓存)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17625)\n- **研究任务**: 动态世界建模中的视频生成，需要高效复用观察到的静态和动态内容，为不同时间和视角的重复生成提供条件。\n- **核心亮点**: 提出4LC（4D潜在缓存），具有复合视觉表示和灵活的时空访问接口。直接复用视觉表示以避免每次请求的RGB渲染和重编码；绑定多个视觉编码器（如VAE、DINO、V-JEPA、VGGT）到共享几何和运动，从而用丰富的信息描述动态世界。\n- **深度解析**: 设计了灵活的时空接口，支持在独立指定的时间和视角直接读取缓存并跨观察组合读取结果，为多种下游任务提供通用条件格式。基于此开发了4LC-Video模型，通过不同配置处理相机控制、时间控制、新视角合成、场景重访和长期生成等任务。实验表明，该单一模型在无需任务特定微调的情况下，实现了更高效的条件获取、有效的时空可控性以及跨任务的场景一致性。摘要未提供具体的实验数据集名称和量化对比数字。\n- **领域归类**: [计算机视觉, 视频生成, 世界模型]\n---\n\n### 82. Probable but Not Valid: A Psychometric Audit of Decision Models as Synthetic Survey Respondents (可能但无效：对作为合成调查受访者的决策模型的心理测量学审计)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14912)\n- **研究任务**: 评估决策模型（返回评分量表各点概率的语言模型）和最新的生成式大语言模型（LLMs）能否在心理测量调查中替代人类受访者，作为合成调查样本。\n- **核心亮点**: 测试了来自11个提供商的14个决策模型和47个生成式LLM。发现最佳生成模型MiniMax M3的心理测量相似度得分（PSS）为0.813，与仅在其他受访者上拟合的高斯 copula 持平，但低于样本内拟合。100个真实人类的第二样本得分低于最佳模型。\n- **深度解析**: 在5个产品线中，最新的生成版本得分低于同产品线的早期版本。在默认四舍五入读取下，14个决策模型中有13个得分低于生成参考模型gpt-5.4-mini。47个生成模型中有33个在项目相关性模式上优于任何决策模型。决策模型的概率向量比四舍五入答案更接近人类项目边缘分布，但在预测个人答案时，每个决策模型都差于其他受访者的答案频率。摘要未提供具体的调查数据集名称（除提及开放的立陶宛组织心理学调查外）和具体的PSS计算细节。\n- **领域归类**: [自然语言处理, 心理测量学, 大语言模型评估]\n---\n\n### 83. CURIO: Curiosity-Driven Test-Time Learning for Open-Ended Discovery (CURIO：用于开放式发现的好奇心驱动测试时学习)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04851)\n- **研究任务**: 开放式发现需要从反复尝试中学习，同时继续探索价值尚不明显的方向。解决使用冻结大语言模型搜索时无法从测试问题的成功和失败中更新模型，以及强化学习可能过早抑制低奖励但有潜力方向的问题。\n- **核心亮点**: 提出CURIO，一个好奇心驱动的测试时学习框架，通过内在好奇心世界模型（ICWM）补充任务反馈。ICWM学习策略隐藏状态表示中的转换，并在策略top-k选择之外的采样token上提供预测误差奖励。\n- **深度解析**: 使用Epoch归一化和退火权重来调节对策略更新的贡献。在6个数学发现任务和单细胞去噪任务上（使用8B到235B的Qwen3骨干），三次运行的平均值在5个数学目标上优于匹配的任务专用RL控制，在Circle Packing上匹配最佳报告性能，并在所有测试规模上提高了去噪Score和均方误差（MSE）。在Hadamard上相对增益达到18.3%，在去噪Score上达到10.8%。代码多样性测量显示生成的程序具有更大的结构变化。摘要未提供具体的数学发现任务名称（除Circle Packing和Hadamard外）和单细胞去噪的具体数据集名称。\n- **领域归类**: [强化学习, 大语言模型, 开放式发现]\n---\n\n### 84. ShellElastic: Scalable Elastic Pretraining with Simultaneous Maximal Updates and Hyperparameter Transfer (ShellElastic：具有同步最大更新和超参数转移的可扩展弹性预训练)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15124)\n- **研究任务**: 解决弹性模型在分布式扩展中面临的每步工作负载可变、跨模型尺寸的超参数转移受限，以及无法保证所有子网同时被最大化更新的问题。\n- **核心亮点**: 提出ShellElastic，一种弹性Transformer，将隐藏维度组织为密集核心和连续的壳，使每个隐藏矩阵呈块下三角形式。一次全宽前向传播包含每个子网的确切隐藏状态作为前缀，联合训练保持固定计算图，每步成本与单独训练最宽子网相当。\n- **深度解析**: 引入μE，将最大更新参数化（μP）扩展到ShellElastic及其他弹性架构。其缩放规则可证明保持超网的所有子网同时最大化更新，并在超网加宽或增加壳时保持此特性。扫描确认在小非弹性代理上微调的超参数对弹性家族和更大超网保持接近最优。单次ShellElastic运行产生的子网在匹配参数计数下优于MatFormer和完全弹性基线，并接近分别训练的模型。摘要未提供具体的实验数据集、模型参数量数字和具体的性能提升百分比。\n- **领域归类**: [机器学习, 模型训练, 弹性模型]\n---\n\n### 85. Privacy-Preserving Intent Fulfilment and Assurance for 6G RAN (6G RAN的隐私保护意图实现与保证)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.08809)\n- **研究任务**: 解决基于意图的网络管理中，现有实现和保证方法需要流量检查、每流跟踪或供应商内部遥测，这与多租户网络中的隐私约束和O-RAN部署中的供应商不透明性相冲突的问题。\n- **核心亮点**: 提出一种架构，从声明的意图类别中配置资源而无需流量检查，并仅使用O1接口处的单元格级标准化PM计数器来验证实现情况。\n- **深度解析**: 数据处理不等式将关于流量内容的资源分配泄漏限制在log_2 K bits（K为类别数）。意图-流量不可链接性和节点不透明验证在结构上成立。在四个运营商网络的生产PM数据上，类别平均得分在三个网络上具有更高的AUC，在第四个网络上具有相当的AUC。摘要未提供具体的运营商网络名称、PM计数器的具体数据类型以及具体的AUC数值。\n- **领域归类**: [计算机网络, 6G通信, 隐私保护]\n---\n\n### 86. Image Tokenizers Should Be Trained Between Images (图像分词器应该在图像之间进行训练)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16759)\n- **研究任务**: 解决潜在扩散模型生成图像时，生成的代码落在解码器预期之外导致图像存在缺陷的问题。当前方法通过在训练时添加噪声使解码器鲁棒，但生成的代码更像训练代码的混合而非单一代码加噪声。\n- **核心亮点**: 提出InterpTok，微调MAETok以将图像代码的混合解码为自然图像。由于训练样本之间没有目标图像，使用判别器判断解码的混合图像是否与其两个源图像一样自然，并引入混合比例损失防止崩溃。\n- **深度解析**: InterpTok保持了MAETok的重建质量，并将插值质量提高了三倍以上。在匹配的扩散Transformer上，无引导的生成FID从11.61提高到8.48，在八分之一的采样步数下达到8.11。在InterpTok上训练的生成器在一半的训练步数下达到了在MAETok代码上训练的最终结果。摘要未提供具体的训练数据集名称和FID评估的具体数据集。\n- **领域归类**: [计算机视觉, 图像生成, 扩散模型]\n---\n\n### 87. Words to World: Benchmarking LLMs in Interactive Physical Environments (从词语到世界：在交互式物理环境中对LLM进行基准测试)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15228)\n- **研究任务**: 评估大语言模型（LLMs）在真实物理环境中进行闭环物理交互的能力，而不仅仅是静态文本响应、离线工具调用或模拟任务。\n- **核心亮点**: 提出一个基准测试，模型控制连接到真实世界组件（包括机械臂、相机和传感器）的线束系统。模型必须发出指令，接收环境的物理反馈，解释 resulting state，并相应地调整下一步行动。\n- **深度解析**: 该设置评估了语言理解之外的能力，包括基础感知、动作规划、工具选择、空间推理、反馈驱动的纠正以及对执行不确定性的鲁棒性。通过代表性LLM的实验，表征了它们将语言推理转化为物理动作的能力，并识别了常见的失败模式，如幻觉状态变化、对意外结果的恢复能力差以及长期计划不稳定。摘要未提供具体的LLM模型名称、具体的基准测试任务名称以及量化的实验结果数字。\n- **领域归类**: [机器人学, 大语言模型, 物理交互基准测试]\n---\n\n### 88. Let the Mind Conceive, Let the Hand Achieve: Following Multimodal Instructions for Long-Horizon Robotic Manipulation (让大脑构思，让双手实现：遵循多模态指令进行长期机器人操作)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18352)\n- **研究任务**: 解决机器人在遵循多步指令时，需要在场景变化的情况下按正确顺序对正确对象进行操作，并保持对任务进度的感知以确定何时推进的问题。\n- **核心亮点**: 引入Orchestra，一个将任务规划和执行管理与动作生成分离的代理线束。Orchestra将完整的多模态指令分解为有序的子任务，跟踪已完成的步骤，并在执行期间更新相关对象和目标的位置，维护包含活动子任务和空间基础的共享上下文。\n- **深度解析**: 动作策略使用共享上下文生成动作，而单独训练的进度评估器估计何时推进到下一个子任务。引入了RMBench-Compose基准测试。Orchestra在9个RMBench任务上的平均成功率为68.22%，比Mem-0高出26.22个百分点。在RMBench-Compose上，平均成功长度（ASL）为7.35个子任务，是HarnessVLA的2.46倍。在四个真实世界的多步任务中，平均ASL比使用基础π_{0.5}策略的Orchestra提高了25.0%。摘要未提供具体的机器人硬件型号和RMBench任务的具体名称。\n- **领域归类**: [机器人学, 多模态学习, 长期操作]\n---\n\n### 89. Beyond Prompt Count: How Data Shapes Transfer in On-Policy Distillation (超越提示数量：数据如何塑造在策略蒸馏中的迁移)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37377)\n- **研究任务**: 研究在策略蒸馏（OPD）中，提示（prompt）的选择如何影响跨教师-学生对的迁移，尽管OPD使用教师对学生自己采样响应的反馈来训练学生。\n- **核心亮点**: 系统地研究了提示数量、来源和选择在RL和SFT延续对以及跨模型设置中的影响。发现OPD可以具有很高的提示效率：少量提示可以接近大池的性能，4个DAPO提示匹配了3840个DeepMath提示的观察到的数学分数。\n- **深度解析**: 提示效用是关系性的而非内在的：仅改变教师就可以逆转数学和代码提示的相对有效性。分析了提示支持和模型对之间的参数和功能变化。在延续对中，与教师对齐的预测变化可以与弱参数对齐共存。在有效支持上继续OPD可以在不利的迁移后恢复性能。有针对性的选择并不总是优于均匀随机采样，过滤掉单独表现不佳的来源也没有产生一致的增益。摘要未提供具体的教师和学生模型名称、DAPO和DeepMath的具体数据集细节以及具体的参数量。\n- **领域归类**: [自然语言处理, 模型蒸馏, 大语言模型]\n---\n\n### 90. TacitVLA: Reasoning Vision-Language-Action Models Without Reasoning Latency (TacitVLA：无推理延迟的推理视觉-语言-动作模型)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17540)\n- **研究任务**: 解决在视觉-语言-动作（VLA）模型中，行动前的文本推理虽然提高了性能，但会带来延迟（每个基于推理文本的条件动作都必须等待自回归解码）的问题。\n- **核心亮点**: 提出TacitVLA，一个推理VLA，其动作专家从不关注为当前调用生成的推理。在长期任务中，推理文本也作为情景记忆，可以在动作执行期间而不是动作之前生成每个条目。\n- **深度解析**: 在RoboMME、RMBench、LIBERO和PhysicalAI-AV四个基准测试上的研究表明，TacitVLA匹配其显式推理对应物的性能，同时延迟降低高达3.4倍，并匹配无推理架构的延迟且成功率提高高达17.1%。在绝对数值上，在RoboMME Counting套件（82.7% vs 66.8%）和RMBench（77.5% vs 56.5%）上超越了之前发布的最佳结果，在LIBERO-Plus上达到72.9%，在PhysicalAI-AV闭环驾驶挑战上达到52.5%的场景得分。摘要未提供具体的模型参数量、硬件配置和具体的推理延迟毫秒数。\n- **领域归类**: [机器人学, 多模态学习, 视觉-语言-动作模型]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [HKUDS/CLI-Anything](https://github.com/HKUDS/CLI-Anything)\n- **今日趋势**: Python 52,351 4,765 Built by 94 stars today\n- **项目简介**: 让所有软件具备 Agent（智能体）原生能力的 CLI 工具。\n- **核心价值**: \n  - **项目用途**: 将任意软件转化为 Agent 原生（Agent-Native）应用。\n  - **目标人群**: 软件开发者、AI 智能体构建者。\n  - **技术核心**: 依托 CLI-Hub 和命令行接口，实现各类软件的 Agent 化集成与调用。\n  - **AI/大模型相关**: 是（涉及 Agent-Native 智能体技术）。\n\n### [ifixai-ai/iFixAi](https://github.com/ifixai-ai/iFixAi)\n- **今日趋势**: Python 27,070 1,492 Built by 2,143 stars today\n- **项目简介**: 用于独立审计 AI 智能体行为的工具，确保其执行预期任务。\n- **核心价值**: \n  - **项目用途**: 对 AI Agent 进行独立审计，验证其是否按预期执行任务。\n  - **目标人群**: AI 开发者、AI 智能体经济参与者、安全与审计人员。\n  - **技术核心**: 支持人类或智能体自身运行审计流程，能在 1
