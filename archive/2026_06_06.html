- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.06155)
- **研究任务**: 机器人操作任务中的动作生成。
- **核心亮点**: 将物体的功能可供性（Affordance）融入 VLA 模型，增强动作合理性。
- **深度解析**: 传统 VLA 模型有时生成不符合物体物理属性的动作。该模型在视觉编码阶段增加可供性预测分支，识别物体可操作区域（如把手、按钮）。语言指令与可供性特征融合后指导动作解码，确保生成的动作在物理上可行，提高了操作成功率。
- **领域归类**: [Robotics, VLA, Affordance]

### 26. Revising Context, Shifting Simulated Stance: Auditing LLM-Based Stance Simulation in Online Discussions (修正上下文，转变模拟立场：审计在线讨论中基于 LLM 的立场模拟)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.06443)
- **研究任务**: LLM 在模拟在线讨论立场时的安全性与一致性审计。
- **核心亮点**: 揭示上下文修改如何导致 LLM 模拟立场发生非预期偏移。
- **深度解析**: 研究通过控制变量实验，微调讨论上下文信息，观察 LLM 模拟特定用户立场的变化。发现细微的上下文修正会导致立场模拟大幅漂移，存在被误导风险。论文提出了一套审计流程，用于检测模型在模拟人类观点时的鲁棒性，防止生成极端或偏差内容。
- **领域归类**: [Safety, Alignment, Social Simulation]

### 27. Towards Truly Multilingual ASR: Generalizing Code-Switching ASR to Unseen Language Pairs (迈向真正的多语言 ASR：将语码切换 ASR 泛化到未见语言对)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.05846)
- **研究任务**: 多语言语音识别中的语码切换（Code-Switching）问题。
- **核心亮点**: 实现模型在未训练过的语言混合对上的零样本泛化能力。
- **深度解析**: 现有 ASR 模型在处理混合语言时依赖特定训练数据。该方法采用语言无关的声学特征编码器，结合元学习策略，使模型学习语言切换的通用模式而非特定语言特征。在未见过的语言组合测试中，无需微调即可保持较高的识别准确率，降低了多语言部署成本。
- **领域归类**: [ASR, Multilingual, Zero-shot]

### 28. EvoDS: Self-Evolving Autonomous Data Science Agent with Skill Learning and Context Management (EvoDS：具有技能学习和上下文管理的自进化自主数据科学代理)

- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.03841)

- **深度解析**: 针对数据科学流程复杂多变的问题，构建了一个自主代理。代理内置技能库，执行任务时若遇到能力缺口，会自动搜索并学习新代码片段存入技能库。同时采用分层上下文管理，区分任务全局信息与局部代码状态，避免了长流程中的信息丢失，提升了复杂分析任务的完成率。
- **领域归类**: [Agent, Data Science, AutoML]

### 29. MechVQA: Benchmarking and Enhancing Multimodal LLMs on Comprehensive Mechanical Drawing Understanding (MechVQA：基准测试并增强多模态 LLM 在综合机械图纸理解上的能力)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.30794)

- **核心亮点**: 发布机械图纸专用基准，并提出针对性增强方案。
- **深度解析**: 通用 MLLM 在专业工程图纸上表现不佳。论文构建了包含尺寸标注、视图关系、公差信息的 MechVQA 数据集。基于此数据集，通过引入工程符号识别模块和空间关系推理损失，微调现有 MLLM。实验表明，模型在解读复杂机械结构时的准确性显著提升。
- **领域归类**: [Benchmark, Multimodal, Engineering]

### 30. Learning Geometric Representations from Videos for Spatial Intelligent Multimodal Large Language Models (从视频中学习几何表示以用于空间智能多模态大语言模型)

- **深度解析**: 静态图像缺乏深度信息，限制空间推理。该方法从视频序列中提取物体运动轨迹和视角变化，构建几何一致性约束。模型通过预测帧间几何变换，学习隐含的三维结构表示。增强后的 MLLM 在需要空间想象力的任务（如导航、装配）上表现更好。
- **领域归类**: [Multimodal, Geometry, Video Understanding]
