    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Apodex 1.1: Scaling Agentic Intelligence for Complex Work (Apodex 1.1：扩展复杂工作的智能体能力)\n- **社区热度**: `👍 160 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23283)\n- **研究任务**: 提升通用语言模型在复杂工作中的“工作能力”，即实现持续与文件、信息源和可执行代码交互，维持状态、恢复故障并交付可验证的结果，从而向现实世界目标取得持续且可验证的进展。\n- **核心亮点**: 提出环境扩展（Environment Scaling）和智能体协调扩展（Agentic Coordination Scaling）两个互补维度；引入共享执行工具和 AgentOS 以跨工具和智能体维护任务状态与来源；推出 35B 参数的 Mini 版本，在保持强大工作能力的同时支持本地部署。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI Agent, 复杂任务处理, 智能体协调]\n---\n\n### 2. EchoWM: Open and Enterable Omnimodal World Models (EchoWM：开放且可进入的全模态世界模型)\n- **社区热度**: `👍 61 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23189)\n- **研究任务**: 构建一个全模态世界模型，用于可进入的生成式媒体，能够响应连续导航，同时联合生成 720p 视频、环境声音、音乐和语音。\n- **核心亮点**: 围绕“相机意图”组织交互（第一人称指定观察者运动，第三人称学习相机-角色动态）；将离散命令和连续姿势映射到共享度量尺度的相对 6-DoF 轨迹；构建互补数据引擎，采用渐进式训练结合自回归后训练以实现长视野生成。\n- **深度解析**: 摘要未提供\n- **领域归类**: [世界模型, 全模态生成, 视频与音频生成]\n---\n\n### 3. TLive-Omni: An Omni-Modal Understanding Model for E-Commerce Live Streaming (TLive-Omni：面向电商直播的全模态理解模型)\n- **社区热度**: `👍 51 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20958)\n- **研究任务**: 解决电商直播场景中对嘈杂、时间跨度长的多模态流（语音、视频帧、商品图、叠加文本、用户提问）进行全模态理解的问题。\n- **核心亮点**: 提出 Per-vGrid 带时间戳的 token 组织方式，将视频网格与对应音频分组以促进时间对齐；设计三阶段监督训练和 Faithful-RFT 强化微调阶段；构建面向场景的原子能力分类法和紧凑的数据生产引擎，将直播流转化为多种训练信号。\n- **深度解析**: 摘要未提供\n- **领域归类**: [多模态理解, 电商直播, 强化微调]\n---\n\n### 4. Unlocking the Potential of Image Editing via Concept Scaling and Dense Supervision (通过概念扩展和密集监督释放图像编辑的潜力)\n- **社区热度**: `👍 43 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.16812)\n- **研究任务**: 解决现有图像编辑框架在编辑概念粒度上关注不足，以及稀疏监督信号导致的训练效率低下问题。\n- **核心亮点**: 建立包含 1000 多个细粒度编辑概念的层次分类法，构建 1200 万高质量编辑对的数据集 ConceptEdit-12M；提出密集监督训练策略，将多个不干扰的概念合成为单张图像对以提供更丰富的学习信号；提出 ConceptEdit-Bench 细粒度评估套件。\n- **深度解析**: 摘要未提供\n- **领域归类**: [图像编辑, 扩散模型, 数据集构建]\n---\n\n### 5. MobilePA-Bench: Benchmarking Mobile Planner Agents on Complex Real-World Tasks (MobilePA-Bench：在复杂现实任务中对移动规划智能体进行基准测试)\n- **社区热度**: `👍 33 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23035)\n- **研究任务**: 评估移动规划智能体在复杂现实世界任务中的工具调用和规划能力，弥补现有 GUI 中心或静态函数调用基准测试的盲区。\n- **核心亮点**: 提出交互式、有状态、以工具为中心的基准测试 MobilePA-Bench，运行在可执行沙盒中，涵盖 13 个功能域和 212 个移动工具；除了基础工具使用，还评估子智能体协作、记忆使用和技能使用三个高级维度。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI Agent 评测, 移动设备智能体, 基准测试]\n---\n\n### 6. Prime Agent: A Self-Improving RLM Harness (Prime Agent：一种自我改进的 RLM 执行框架)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23552)\n- **研究任务**: 解决语言模型作为顺序处理器在长视野代理任务中需要超出模型权重和活跃上下文的外部信息和计算的问题，提供长视野评估和编码代理工作流的开源框架。\n- **核心亮点**: 持久化 IPython REPL 遵循递归语言模型（RLM）抽象；Continual Harness 跨轨迹保留历史、记忆、技能和子智能体规格；递归子智能体通过直接通信协调；提供 Agents View 供人类检查和管理守护进程支持的会话。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI Agent 框架, 编码智能体, 递归语言模型]\n---\n\n### 7. Block3D: Efficient Text-to-3D Generation via Block-Wise Diffusion (Block3D：通过分块扩散实现高效的文本到 3D 生成)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.19567)\n- **研究任务**: 解决现有文本到 3D 生成方法（自回归解码或全局 3D 表示迭代细化）在推理成本高、无法修正错误或重复处理全表示导致高质量生成昂贵的问题，实现低推理成本下的高几何保真度。\n- **核心亮点**: 提出分块扩散框架 Block3D，将离散形状 token 序列划分为连续块，自回归生成块并联合去噪当前块内所有 token；引入置信度引导的块内校正机制，在块最终确定前修正低置信度 token 以缓解误差累积。\n- **深度解析**: 摘要未提供\n- **领域归类**: [3D 生成, 扩散模型, 文本到 3D]\n---\n\n### 8. RISE: Adaptive Imagination for World Action Models (RISE：面向世界动作模型的自适应想象)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20430)\n- **研究任务**: 解决现有世界动作模型（WAMs）为每个场景分配固定想象预算的问题，通过自适应想象框架提高规划效率。\n- **核心亮点**: 提出 RISE 框架，根据继续展开的预期规划收益做出顺序的 Roll/Stop 决策；包含潜在评估器（估计风险和规划改进空间）和展开门控（权衡收益与计算成本）；构建反事实数据集 CounterDrive 以丰富未来动态并提供局部风险监督。\n- **深度解析**: 摘要未提供\n- **领域归类**: [自动驾驶, 世界模型, 规划与决策]\n---\n\n### 9. Towards a Densing Law for User Representation Learning at Billion-Scale Capacity (面向十亿级容量用户表示学习的密集化定律)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23392)\n- **研究任务**: 解决工业场景中用户表示学习在十亿级规模下面临的原始数据扩展瓶颈（性能增益递减）以及缺乏分词配置与数据规模如何扩展的定量分析问题。\n- **核心亮点**: 提出“用户行为密集化定律”（User Behavioral Densing Law），刻画数据规模与最小充分分词容量之间的定量关系；发现最小充分分词容量的对数与输入数据大小的对数之间存在近似线性关系；开发自适应变长分词方法 ALGN 以改善容量分配。\n- **深度解析**: 摘要未提供\n- **领域归类**: [用户表示学习, 推荐系统, Scaling Law]\n---\n\n### 10. ARC: Fair Relative Advantage Comparison in Open-Ended Real-World Interaction (ARC：开放式现实世界交互中的公平相对优势比较)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13622)\n- **研究任务**: 解决开放式现实世界交互中，由于智能体行为灵活（如直接回答、澄清、更新进度等）导致基于组的强化学习中 rollout 行为不可比，进而使奖励模型偏好扭曲相对优势的奖励公平性问题。\n- **核心亮点**: 提出 ARC（通过条件化进行优势正则化）训练配方，通过策略条件化的 rollout 分组、混合奖励和熵正则化恢复更公平的相对比较；提出 \\inter 范式，解耦用户可见通信与潜在推理和工具使用；构建策略注释训练语料库 \\inter-86K。\n- **深度解析**: 摘要未提供\n- **领域归类**: [强化学习, 智能体交互, 奖励公平性]\n---\n\n### 11. ReWorld: An Interactive World Model with Long-Horizon Memory (ReWorld：具有长时记忆的交互式世界模型)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23565)\n- **研究任务**: 构建一个能够跟随用户动作、记住已展示位置并实时流式传输的交互式世界模型，解决控制（短视界）与记忆（无界视界）之间的结构性矛盾。\n- **核心亮点**: 提出在训练时分离控制与记忆，在推理时进行限制。采用混合每头注意力窗口（大部分头关注近期，少数全局头关注整个历史）和随机头路由；推理时使用固定预算的有界KV缓存和基于姿态索引的地标库；使用度量尺度对齐的数据引擎统一不同来源的物理动作尺度；通过分布匹配蒸馏将采样压缩至四步。\n- **深度解析**: 实验表明，该模型在动作跟随、长视界回忆和视频质量的三轴协议下，实现了最佳的控制保真度（11.95度旋转误差和最佳相机运动一致性）及最佳生成质量。在长达一分钟的往返推演（64秒，384个潜变量）中，其固定的12块缓存仍能重新生成起始视角，而此时滑动窗口早已驱逐了证据，全KV注意力也耗尽了内存。\n- **领域归类**: [计算机视觉, 世界模型, 视频生成, 交互式AI]\n---\n\n### 12. Beyond the Stability-Exploration Dilemma: Environmental Regularization for LLM Policy Optimization (超越稳定性与探索的困境：用于大语言模型策略优化的环境正则化)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23311)\n- **研究任务**: 解决大语言模型（LLM）策略优化（PO）中面临的稳定性与探索之间的权衡问题，打破传统动作侧策略KL正则化带来的双重困境。\n- **核心亮点**: 提出环境正则化策略优化（ERPO），将正则化移至输入侧。引入查询KL（QKL）项来限制查询分布偏移，并使用数据集静态参考派生的每查询权重，使更新偏向参考分布下的典型查询。QKL梯度仅通过查询似然流动，不影响响应分布，从而保留了探索能力。\n- **深度解析**: 实验在六个数学推理基准上进行，ERPO替换了标准的策略KL正则化器，有效控制了查询分布漂移，在高温解码和长视界训练下提供了更强的准确性和更稳定的行为。代码已开源于GitHub。\n- **领域归类**: [自然语言处理, 强化学习, 大语言模型, 策略优化]\n---\n\n### 13. GameXpert-Bench: How Far Are Coding Agents from Expert Game Development? (GameXpert-Bench：代码智能体距离专家级游戏开发还有多远？)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21833)\n- **研究任务**: 评估大语言模型作为代码智能体，从自然语言请求构建完整游戏的能力，涵盖游戏产品和开发过程的综合评估。\n- **核心亮点**: 提出GameXpert-Bench，将游戏开发生命周期操作化为三个互补的基准轨道：GameGen（单次请求生成完整游戏）、GameFix（缺陷诊断与修复）和GameOpt（多轮累积优化）。通过实时游戏交互、确定性行为测试或最终产品标准结合回归检查进行评估。\n- **深度解析**: 数据集包含11个流派的97个生成任务；50个人工验证的游戏关卡中的100个修复任务（每个注入19-27个bug）；以及包含6轮和102个请求的17条优化链。实验表明，当前智能体在生成可玩基础和实现明确需求方面更可靠，但在发现缺陷、验证运行时行为和跨更改保留功能方面表现较差。\n- **领域归类**: [自然语言处理, 代码智能体, 基准测试, 游戏开发]\n---\n\n### 14. One Success Isn't Reliability: Thinkingbox, a Sandbox and Benchmark for Agents in Stateful Business Workflows (一次成功不代表可靠：Thinkingbox，有状态业务工作流中智能体的沙盒与基准测试)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.19741)\n- **研究任务**: 评估AI智能体在复杂的有状态业务工作流中，跨多轮收集信息、遵循领域策略、协调工具并实现正确持久状态转换的可靠性。\n- **核心亮点**: 引入Thinkingbox沙盒，提供隔离的MCP兼容工具会话、完整执行轨迹和基于终端后端状态的结果评估。基于此构建Thinkingbox-bench，包含507个策略条件工作流，涵盖零售、酒店、汽车保险等场景。\n- **深度解析**: 评估使用特定于任务的可执行检查，接受有效轨迹并拒绝错误、缺失或多余的副作用。实验显示，最强模型在pass@1上达到65.36%，但在pass^20上仅为25.25%。许多失败的试验显示出干净的终止和有效的状态改变动作，证明响应或工具调用级别的信号不能直接代理端到端任务完成情况。沙盒和基准测试代码已开源。\n- **领域归类**: [自然语言处理, AI智能体, 基准测试, 业务工作流]\n---\n\n### 15. Task-CoEvolve: Efficient Harness Optimization via Adaptive Validation Task Selection (Task-CoEvolve：通过自适应验证任务选择实现高效的Harness优化)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20169)\n- **研究任务**: 解决大语言模型Harness优化（通过迭代重写Harness代码以提升验证性能，而不更新模型权重）过程中，每次迭代评估完整固定验证集带来的高昂评估成本问题。\n- **核心亮点**: 提出Task-CoEvolve，使验证任务与Harness协同进化。利用基于过去结果的方差加权采样，将评估集中在能力边界附近的任务上；通过考虑采样概率从部分评估中估计全集性能，从而在迭代中保持一致的比较。\n- **深度解析**: 在在线文本分类和Terminal-Bench 2.1上的实验表明，Task-CoEvolve持续优于基于子集的基线，并匹配全集搜索的最终性能，同时将优化过程中的评估次数减少了80%。代码将开源于GitHub。\n- **领域归类**: [自然语言处理, 大语言模型, 提示工程/Harness优化, 效率优化]\n---\n\n### 16. Beyond Imitation: Filtering On-Policy Distillation by Reasoning Progress (超越模仿：通过推理进度过滤在策略蒸馏)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.19408)\n- **研究任务**: 解决在策略蒸馏（OPD）中，教师衍生的奖励往往与真实的推理进度冲突，导致对所有教师反馈一视同仁所带来次优策略优化的问题。\n- **核心亮点**: 提出推理进度感知的在策略蒸馏奖励过滤（R2-OPD）。构建轨迹内推理片段的两个排序：一个来自教师衍生奖励，另一个来自独立估计的进度奖励。当两个排序不一致时，选择性地抑制蒸馏奖励，从而减少与推理进度冲突的监督，同时保留有效的教师指导。\n- **深度解析**: 摘要未提供具体的实验数据集、数字或基准测试结果，仅说明该方法在推理性能方面相较于标准OPD显示出一致的改进。\n- **领域归类**: [自然语言处理, 大语言模型, 知识蒸馏, 强化学习]\n---\n\n### 17. AutoResearch: Insight In, Hallucination Out (AutoResearch：洞察输入，幻觉输出)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.17906)\n- **研究任务**: 解决自主研究系统在执行长期研究工作流时，自动化无法确保过程保持科学基础的问题，连接想法生成与想法执行。\n- **核心亮点**: 引入AutoResearch两阶段系统。在想法生成阶段，整合研究信号与领域知识，使用多模型生成和交叉审查生成可测试的研究计划；在想法执行阶段，协调智能体分解计划为实验，迭代实施和诊断，并在接受结论前采用独立的基于证据的审查。\n- **深度解析**: 在跨模态检索、系统优化和基准驱动的机器学习等场景中，AutoResearch将想法转化为可衡量的进展。例如，在RSICD基准上，AutoResearch生成的想法将平均Recall从32.84提高到34.69，同时仅记录了5次审计确认的问题事件，而其他自主研究系统为11-27次。\n- **领域归类**: [人工智能, 自主研究系统, 多智能体, 科学发现]\n---\n\n### 18. Quantization-Aware Healing: A Practical Recipe for Recovering Compressed, 4-Bit LLMs (量化感知修复：恢复压缩的4位大语言模型的实用配方)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20953)\n- **研究任务**: 解决大语言模型在结构压缩和4位量化后，推理、数学、编码和长上下文行为退化严重，需要恢复（修复）阶段的问题。\n- **核心亮点**: 采用量化感知修复（QAH）替代默认的量化感知训练（QAT）。由于结构压缩模型从未在全精度下独立训练，其bfloat16检查点是蒸馏恢复的近似值；QAH直接从原始未压缩模型蒸馏4位学生模型。\n- **深度解析**: 在GPT-OSS 120B到60B再到MXFP4的流水线中，QAH学生在9个基准测试中的7个上匹配或击败了其bfloat16源模型，权重内存减少约4倍，参数量仅为教师的一半，并作为Hypernova-60B开源。相比QAT基线，它达到相当峰值的速度快约7倍，且在持续训练下保持稳定。报告了分布式训练后端之间存在巨大且可复现的质量差距。\n- **领域归类**: [自然语言处理, 大语言模型, 模型压缩, 量化]\n---\n\n### 19. One Polluted Page Is Enough: Evaluating Web Content Pollution in LLM Recommenders (一个被污染的页面就足够了：评估大语言模型推荐器中的网页内容污染)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.13610)\n- **研究任务**: 评估搜索增强的大语言模型推荐器在消费实时网页内容时，被生成式引擎优化（GEO）操作者污染以误导它们的脆弱程度，即它们多大程度上会成为虚假产品的无意推广者。\n- **核心亮点**: 引入FORGE（生成环境中的虚假在线推荐）基准，在冻结的检索网页集合中将真实产品本地重写为虚假产品，并测量大语言模型推荐虚假产品的频率。\n- **深度解析**: 涵盖15个类别和5个消费场景中的225个真实产品。在12个商业和开源权重的大语言模型中，所有模型均易受攻击：单个被污染页面导致高达27%的受骗率，而完全替换前3名则将此比率提高到73.8%。推理不仅不能减轻这种脆弱性，反而经常生成虚假的社会证明来为错误推荐辩护。四种防御措施均不充分。基准和代码已开源。\n- **领域归类**: [自然语言处理, 大语言模型, 信息检索, 安全性与鲁棒性]\n---\n\n### 20. Better Retrieval, Worse Robustness:How Multi-hop RAG Amplifies Upstream ASR Errors (更好的检索，更差的鲁棒性：多跳RAG如何放大上游ASR错误)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22872)\n- **研究任务**: 研究基于语音的应用中，自动语音识别（ASR）错误作为固定上游约束进入检索增强生成（RAG）管道后，标准RAG的两种扩展（实体图链接和迭代重构）是吸收还是放大了这些错误。\n- **核心亮点**: 通过神经TTS合成的四种英语口音，在三个多跳问答基准上评估四种RAG配置。发现结构更丰富的配置虽然在ASR输入下保留了较高的绝对F1，但两种扩展都放大了错误。\n- **深度解析**: 在干净文本和最高WER口音之间，组合使用这两种扩展时的F1差距比朴素密集检索大36-67%。主要的失败模式是一个或多个查询实体的损坏，在所有四种方法的2WikiMultiHopQA上占降级情况的87-96%。两种轻量级表面形式缓解措施未能弥补大部分差距。代码和数据已开源。\n- **领域归类**: [自然语言处理, 检索增强生成(RAG), 语音识别, 鲁棒性]\n---\n\n### 21. LongWoF-Bench: Evaluating EvoMap Genes for Verifiable Long-Workflow Tasks (LongWoF-Bench：评估可验证长工作流任务的EvoMap基因)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23200)\n- **研究任务**: 评估大语言模型在执行复杂长工作流任务时，能否通过EvoMap将经过验证的执行经验外部化并复用，以提高任务完成率和效率。\n- **核心亮点**: 提出Long-Workflow Benchmark (LongWoF-Bench)，包含778个机器可验证任务；引入EvoMap Gene概念，将验证过的执行轨迹整合为结构化基因以供复用。\n- **深度解析**: 在252个有验证轨迹的任务上，evolved EvoMap Gene在所有7个评估模型上比Skill高出8.7-15.5个百分点。对于Claude Opus，Gene复用比Skill多完成39个任务，并减少9.9%的解决时间token消耗。关于参考蒸馏Gene的具体性能对比数字，摘要未提供，但指出其未表现出相同优势，说明紧凑表示不够，Gene效用与验证经验来源密切相关。\n- **领域归类**: [大语言模型, 智能体, 基准测试]\n---\n\n### 22. Same Agent, Different Answers: A Repeat-Aware Audit of Corpus-Induced Answer Churn in Retrieval-Augmented QA (同一个智能体，不同的答案：检索增强问答中语料库诱导答案流失的重复感知审计)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22856)\n- **研究任务**: 研究检索增强问答（RAG）系统在索引扩展后，即使控制变量不变也会返回不同答案的隐藏现象（即“对准确性盲目的答案流失”），并提出相应的审计方法。\n- **核心亮点**: 提出“快照兼容性审计（Snapshot Compatibility Audit）”，通过从跨快照分歧中减去同一快照重复分歧来估计过度的答案流失。\n- **深度解析**: 在Natural Questions研究中，归一化精确和盲语义的过度流失分别为6.44和10.25个百分点，而精确匹配准确率仅变化-1.50点。在TriviaQA研究和DeepSeek生成器的复制研究中，即使精确匹配准确率上升，语义过度流失依然显著（如8.75个百分点）。关于具体的基础模型名称（除DeepSeek外）和更多底层技术细节，摘要未提供，但结果表明答案层面的兼容性可能在效用无明显变化的情况下失效。\n- **领域归类**: [检索增强生成, 问答系统, 模型评估]\n---\n\n### 23. RIBOSPAN: A Long-Context RNA Foundation Model for Versatile RNA Modeling (RIBOSPAN：用于多功能RNA建模的长上下文RNA基础模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22849)\n- **研究任务**: 解决现有RNA基础模型上下文长度受限，无法在单核苷酸分辨率下对完整长RNA（特别是mRNA）进行建模的问题。\n- **核心亮点**: 提出RIBOSPAN，一个16.1亿参数的双向RNA基础模型，原生预训练上下文长度高达10,240 nt，结合密集双向自注意力、单核苷酸分词和注意力隔离序列打包。\n- **深度解析**: 原生10K预训练在10,240 tokens处保持强大的重建能力，继续预训练使用40%掩码可改善重度损坏下的恢复。推理时YaRN缩放可恢复短上下文模型直接外推丢失的部分上下文组织。在冻结表示评估中，RIBOSPAN实现了最先进的RNA表示质量。关于具体的下游任务准确率数字，摘要未提供，但指出其基于相同骨干开发了多维条件离散扩散框架用于全长mRNA生成和设计。\n- **领域归类**: [生物信息学, 基础模型, 长上下文]\n---\n\n### 24. TileMix: Tile-Centric Mixed-Precision Attention for LLM Inference Acceleration (TileMix：面向大语言模型推理加速的以块为中心的混合精度注意力机制)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.17336)\n- **研究任务**: 解决大语言模型长上下文预填充阶段因密集自注意力计算带来的巨大计算和内存流量开销问题。\n- **核心亮点**: 提出TileMix，一种以块为中心的精度路由内核，将数值精度作为融合密集注意力内得分块组的可执行空间决策。\n- **深度解析**: TileMix将注意力矩阵划分为与硬件对齐的得分块，将路由决策打包成紧凑的位掩码，并通过FP16或INT8得分计算调度每个块组。关于具体的吞吐量提升百分比数字，摘要未提供，但指出在LongEval、LV-Eval和A100预填充基准上，TileMix恢复了统一INT8下丢失的长上下文质量，并提高了预填充吞吐量，支持分组查询注意力、可变长度批次和INT8键值缓存。\n- **领域归类**: [大语言模型, 推理加速, 混合精度]\n---\n\n### 25. Hybrid Quantum-inspired Kolmogorov-Arnold Networks for Privacy-Aware Federated Biosignal Learning (用于隐私感知联邦生物信号学习的混合量子启发Kolmogorov-Arnold网络)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13914)\n- **研究任务**: 解决联邦学习中心电图（ECG）分类面临的客户端样本有限、心律失常标签不平衡以及跨客户端数据非独立同分布（non-IID）等挑战。\n- **核心亮点**: 评估了一种混合量子启发Kolmogorov-Arnold网络（HQKAN）在联邦平均（FedAvg）下用于心律失常分类的表现，并与多层感知机（MLP）进行对比。\n- **深度解析**: 在MIT-BIH数据集上，HQKAN减少了37.35%的可训练参数，通信成本降低24.89%；在INCART数据集上，参数和通信成本分别减少44.81%和36.41%。关于具体的准确率提升数字，摘要未提供，但指出HQKAN提高了多数聚合和少数类指标，为隐私感知的生物信号联邦学习提供了一种紧凑、通信高效且鲁棒的替代方案。\n- **领域归类**: [联邦学习, 医疗AI, 量子启发计算]\n---\n\n### 26. Industrial-Instruction: An End-to-End Framework for Building Instruction-Tuning and Benchmark Datasets from Industrial Technical Reports (Industrial-Instruction：从工业技术报告中构建指令微调和基准数据集的端到端框架)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22817)\n- **研究任务**: 解决工业技术报告结构异构导致难以索引和推理的问题，填补缺乏基于此类文档的公开指令微调或基准数据集的空白。\n- **核心亮点**: 提出Industrial-Instruction框架，贡献了两个由真实工业技术报告构建的开放问答数据集，以及生成这些数据集的端到端流水线。\n- **深度解析**: 使用906份松下公开文档（7525页），过滤初始23.9k生成样本后，每个数据集提供约13.6k QA对。微调小于10B参数的小型开源大模型，在松下基准上将Set-Match Accuracy从28.5%提升至42.0%，F1从46.6%提升至63.5%。发布了分别由Qwen3-30B-A3B-Instruct和Claude-Opus-4.6生成的两个并行版本。关于具体的MMLU评估分数，摘要未提供，但指出后者数据更干净且微调增益更大，成本高约两个数量级。\n- **领域归类**: [指令微调, 数据集构建, 工业应用]\n---\n\n### 27. From Generation to Simulation: How Far Are World Models from Being True Simulators? (从生成到模拟：世界模型距离真正的模拟器还有多远？)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23070)\n- **研究任务**: 系统评估生成式世界模型在替代传统模拟器（物理引擎、游戏引擎等）方面还剩多少距离。\n- **核心亮点**: 提出基于能力的评估，使用传统模拟器的8项能力作为外部衡量标准，映射了2018年至2026年6月发表的200项代表性工作。\n- **深度解析**: 分析表明，世界模型在特定场景的交互和可控性上实现了功能替代，但在物理定律的形式化保证、结构化状态反馈和可重复的长程演化方面仍不及传统模拟器。状态反馈是最被忽视的缺点，163篇实现论文中仅有6篇暴露了运行时接口。关于具体的量化评估分数，摘要未提供，但提出了形式化物理、统一动作接口等6个研究方向。\n- **领域归类**: [世界模型, 视频生成, 模拟器]\n---\n\n### 28. WorldToken: Time-First Sequence Modeling for Robotic Imitation Learning (WorldToken：用于机器人模仿学习的时间优先序列建模)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22591)\n- **研究任务**: 解决机器人策略在每个决策步骤接收异构观测值时，序列模型在时间上组织这些输入的方式差异问题。\n- **核心亮点**: 提出WorldToken，一种时间优先的策略实例化方法，在每个策略时间步内将多视角图像、本体感受和任务条件融合为一个“世界token”。\n- **深度解析**: 使用因果时间Transformer对世界token序列进行建模，并通过扩散动作头生成动作块。在23个RoboCasa任务上，一个85.3M参数的策略使用每任务2900个生成的演示，实现了59.45%的平均闭环成功率。在RMBench Blocks Ranking上，将可见历史从146秒减少到8秒，评估器成功率从95%降至28%。关于与其他序列组织方法的直接对比数字，摘要未提供，但确立了该实例化的经验可行性。\n- **领域归类**: [机器人学, 模仿学习, 序列建模]\n---\n\n### 29. EXPL-FR: Explaining Face Recognition Models via Vision-Language Alignment (EXPL-FR：通过视觉-语言对齐解释人脸识别模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21486)\n- **研究任务**: 解决深度人脸识别（FR）模型虽然准确率高但缺乏可解释性（无法知道相似度分数依赖于哪些语义属性）的问题。\n- **核心亮点**: 提出EXPL-FR，在FR模型自身的嵌入空间内进行解释。通过轻量级适配器将视觉-语言模型（VLM）的图像编码器与冻结的FR空间对齐，仅使用人脸图像训练。\n- **深度解析**: 将978个属性提示转化为FR空间的锚点。提出无标签的可检测性度量，100个最可检测的概念形成模型的可读语义签名。关于具体的属性识别准确率数字，摘要未提供，但指出在无标签情况下，提示驱动的审计可以根据测量的每种族RFW错误对四个FR模型进行排名，并支持身份级、单图像和差异解释。\n- **领域归类**: [计算机视觉, 模型可解释性, 人脸识别]\n---\n\n### 30. Tomatoes, Potatoes, and Onions: Questioning the Need for Faces in Face Presentation Attack Detection (西红柿、土豆和洋葱：质疑人脸呈现攻击检测中对人脸的需求)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21455)\n- **研究任务**: 探究是否可以在不使用人脸的情况下，学习可迁移的人脸呈现攻击检测（PAD）表示。\n- **核心亮点**: 引入TPO，一个受控的无人脸呈现攻击数据集，包含西红柿、土豆和洋葱的真实、打印和重放录像。\n- **深度解析**: 使用基于基础模型的PAD架构，在TPO上训练的检测器在四个标准跨数据集人脸PAD基准上实现了92.70%的平均AUC。关于具体的EER或HTER等详细指标数字，摘要未提供，但指出其优于在合成人脸上的训练，并与真实人脸数据集训练的模型具有竞争力。将TPO纳入传统训练可一致提高跨数据集性能，表明无人脸数据提供了互补信息。\n- **领域归类**: [计算机视觉, 生物识别安全, 呈现攻击检测]\n---\n\n### 31. The Laws of Context Allocation: Causal Measurement and Closed-Loop Orchestration in Generative Search (上下文分配法则：生成式搜索中的因果测量与闭环编排)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23252)\n- **研究任务**: 解决检索增强生成（RAG）在向多样化组合生成转变时面临的两个关键瓶颈：证据利用的测量缺陷以及上下文预算分配不佳的问题。\n- **核心亮点**: \n  1. **揭示并解决“诊断错觉”**：指出标准相关性代理在困难负样本上会失效，提出使用高效的因果留一法探针来准确评估生成依赖，并校准大语言模型（LLM）注意力的结构稀释。\n  2. **颠覆单一上下文扩展策略**：证明单纯扩大上下文窗口会因相关性衰减而陷入“架构陷阱”，提出在多次顺序生成中迭代分配计算资源，实现16.7至20.5绝对百分点的组合召回增益。\n  3. **提出闭环次模调度器**：将上述方案统一为可部署的闭环系统，引入归因引导的对比解码器来克服LLM的注意力惯性，强制模型整合新证据。\n- **深度解析**: \n  本文针对RAG系统在多样化组合生成中的上下文分配问题进行了系统性研究。在测量层面，作者发现传统方法存在缺陷，通过引入因果留一法探针实现了更精准的证据利用评估。在分配层面，研究打破了盲目扩大上下文窗口的常规思路，证明了在多次顺序生成中迭代分配计算的有效性，并验证了该方法在高达32B参数模型上的稳健性（具体实验数据集：摘要未提供）。最终，作者构建了一个闭环次模调度器，结合对比解码技术打破模型的注意力惯性，确立了基于顺序和反馈驱动的生成式搜索新范式。相关代码、数据和测量工具已开源。\n- **领域归类**: [检索增强生成 (RAG), 大语言模型 (LLM), 信息检索, 自然语言处理]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [TauricResearch/TradingAgents](https://github.com/TauricResearch/TradingAgents)\n- **今日趋势**: ⭐ 99,942 | 🍴 19,321 | 今日新增 191\n- **项目简介**: 一个基于多智能体和大语言模型的金融交易框架，专为金融量化开发者和交易员设计。\n- **核心价值**: \n  - **项目用途**: 提供多智能体LLM金融交易框架。\n  - **目标人群**: 金融量化开发者、算法交易员。\n  - **技术核心**: Multi-Agents（多智能体）、LLM（大语言模型）。\n  - **AI/大模型相关性**: 是，核心基于多智能体和
