Only）在 ICL 配置中也有益，并与推理时缓解方法兼容。强调了构建细粒度安全监督数据集的必要性。具体的实验结果数字、数据集或技术细节摘要未提供。\n- **领域归类**: [大语言模型, 模型安全与对齐, 数据工程]\n---\n\n### 129. MasterControl Seventeen Every Time (MasterControl 每次十七)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03209)\n- **研究任务**: 企业分析的受控方法。语言模型解释问题，而确定性策略选择并运行预先批准的分析程序，返回结果和证据。\n- **核心亮点**: 证明这种限制在定义的分析类别（关系操作加聚合、比较、窗口、排名和相似性）内可以保持表达能力。固定的含义、策略、数据和执行规则使结果可重放。\n- **深度解析**: 在 440 次运行中，三个 8B 模型在运行时生成 SQL 并选择工具，而 Qwen3-8B 仅解释意图并由策略执行批准的程序。330 次运行时规划事件中没有一个在所有测试数据集中匹配完整的答案和证据契约；而策略执行的分析器匹配了 110 次中的 110 次。摘要指出这是特定配置的结果，并非证明运行时智能体在其他设计下不能成功。\n- **领域归类**: [大语言模型, 智能体, 企业数据分析, Text-to-SQL]\n---\n\n### 130. Training-Free Speech-Centric Omni Understanding with Frozen VLMs (使用冻结 VLM 的免训练以语音为中心的全能理解)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04242)\n- **研究任务**: 音视频理解。解决现有全能模型需要引入专用音频编码器并依赖昂贵的音视频文本训练，从而可能削弱原有视觉和推理能力的问题。\n- **核心亮点**: 提出 Training-Free Omni (TFO)，一个即插即用的框架。无需架构修改或多模态重新对齐，即可将冻结的 VLM 转换为以语音为中心的全能模型。使用 Whisper 提取置信度过滤的时间戳转录，并通过 VLM 现有的语言接口路由。\n- **深度解析**: 在 56 个基准测试和 21 种语言的匹配比较中，TFO 在音视频理解上具有竞争力，提高了所有 5 种模型设置的平均纯音频性能，并实现了大幅的多语言语音增益。冻结 VLM 通常还能保留更强的图像/视频理解、视觉定位、编码、数学推理和医疗问答能力。\n- **领域归类**: [多模态, 视觉语言模型, 语音处理]\n\n### 131. What Else Needs Fixing? Exploring Cost-Effective Test-Time Compute for Revision Propagation in Artifacts Generated Through Conversation (还有什么需要修复？探索对话生成工件中修改传播的低成本测试时计算)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03254)\n- **研究任务**: 研究大语言模型在对话生成的工件中，当用户仅指定局部修改时，模型识别相关依赖并将修改传播到工件所有受影响部分的能力。\n- **核心亮点**: 引入了一个新的基准测试，评估了九种修改方法（包括顺序反思和并行采样变体），并探索了在此新设置下具有成本效益的测试时计算（test-time compute）。\n- **深度解析**: 研究使用了 gpt-oss-20b/120b、gpt-5.4-mini 和 qwen3.5-9b/27b/122b 等模型进行评估。实验结果表明，基线方法的准确率在 68.3% 到 93% 之间。最具成本效益的方法是使用基于 LLM 或中心点（medoid）选择从三个并行样本中进行选择，可将准确率提高 2.2% 到 9.7%。代码和数据集已在 GitHub 开源。\n- **领域归类**: [自然语言处理, 大语言模型, 测试时计算]\n---\n\n### 132. Graph Machine: Towards Better Pretraining via Edges (图机器：通过边实现更好的预训练)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.02881)\n- **研究任务**: 提出一种名为“图机器”（Graph Machine, GM）的新架构，旨在通过稀疏、动态路由维护 O(n) 大小的状态，以改进模型预训练。\n- **核心亮点**: GM 在稀疏层中保持了 O(n) 的复杂度，而不将可访问的状态大小限制为 O(1)。它使用“边”（类似指针的对象），通过类似指针追逐的引用机制进行可微更新。\n- **深度解析**: 研究将 Qwen3-0.6B 中 75% 的密集 Transformer 层替换为 GM 稀疏层，并在 15.7B 个 token 上从头开始预训练。实验结果显示，在每个稀疏层的每个 KV 头中仅检索 4,096 个 token 中的 2 个时，损失仅有轻微下降；当检索 4 个 token 时，最佳模型的损失略有改善。\n- **领域归类**: [自然语言处理, 模型架构, 预训练]\n---\n\n### 133. ShallowStream: Index Shallow then Answer Deep for Streaming Video Understanding (ShallowStream：流式视频理解的浅层索引与深层回答)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.02780)\n- **研究任务**: 解决多模态大语言模型（MLLMs）在处理连续视频流时计算成本高昂的问题，提升流式视频理解的效率。\n- **核心亮点**: 提出 ShallowStream 框架，利用 MLLM 的浅层同时执行帧编码和检索索引构建。在流处理期间，利用浅层的 KV 缓存维护一个始终在线的轻量级索引；在查询回答时，利用浅层生成的注意力分数对上下文帧进行评分，并采用感知多样性的选择策略检索精确且全面的证据。\n- **深度解析**: ShallowStream 在实现与现有最强流式方法相当的性能的同时，将每帧预填充延迟和 10 秒端到端延迟分别降低了高达 52.1 倍和 11.9 倍。代码已在 GitHub 开源。\n- **领域归类**: [计算机视觉, 多模态大模型, 视频理解]\n---\n\n### 134. The Semantic Bottleneck: Leveraging Semantic Representations for Non-Invasive Speech Decoding (语义瓶颈：利用语义表示进行非侵入式语音解码)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10296)\n- **研究任务**: 解决非侵入式语音解码中神经记录信噪比低导致难以细粒度重建音素或单词的问题，探索通过高级语义表示进行解码的可行性。\n- **核心亮点**: 提出 Brain2Semantics2Text 方法，通过中间语义嵌入空间重建文本。将句子级别的 MEG（脑磁图）响应映射到语义流形，然后将预测的嵌入反转为自然语言，从而在无需单词级对齐的情况下恢复高级语义。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [脑机接口, 语音解码, 神经科学]\n---\n\n### 135. Reference-Based Bias Detection in LLMs via Relative Representations of Hidden States (基于隐藏状态相对表示的大语言模型参考偏差检测)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10060)\n- **研究任务**: 提出一种基于参考的方法，通过比较相关模型变体（如微调前后）的隐藏状态表示来审计大语言模型中的偏差，以解决现有方法依赖模型输出且成本高昂的问题。\n- **核心亮点**: 由于微调会改变表示几何，绝对隐藏状态无法直接比较，该方法通过将每个句子编码为它与一组固定锚点句子的相似度，从而在共享的比较空间中生成相对表示。在此空间中测量目标群体与正负属性关联的偏移量（表示偏差偏移 ΔB）。\n- **深度解析**: 在三个模型家族和 WildGuardMix、DecodingTrust、ToxiGen 基准上的测试表明，在 18 个测试设置中有 15 个，ΔB 与输出级偏差变化相关，全微调下相关性最高达 |r| = 0.84 (p \u003c 0.001)。对 ΔB 进行阈值处理可以检测偏差增加的检查点，ROC AUC 在 0.65 到 0.99 之间。该方法无需特定任务的评估数据，约三分钟即可审计模型，计算量比输出级基准少 3 到 50 倍。\n- **领域归类**: [自然语言处理, 模型安全与对齐, 偏差检测]\n---\n\n### 136. RESCUE-BENCH: Towards Relation-Aware Multi-Party Emotional Support Conversation Systems (RESCUE-BENCH：面向关系感知的多方情感支持对话系统)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09657)\n- **研究任务**: 探索多方场景下的人际关系动态，评估大语言模型是否能捕捉并利用不断变化的关系动态来提供更有效的情感支持。\n- **核心亮点**: 引入了“关系感知情感支持对话”这一新任务，并构建了 RESCUE 基准。该基准基于真实的夫妇和家庭访谈对话构建，包含 191 个样本、7,079 个标注轮次和 1,064.8 分钟的视频。定义了六项任务，评估关系理解和关系敏感支持两项核心能力。\n- **深度解析**: 对十个大语言模型的实验表明，当前模型在依赖局部情感或干预线索的任务上表现相对较好，但在关系模式预测、观点预测和支持策略预测等关系密集型任务上表现挣扎。这揭示了当前大语言模型在建模人际关系和做出关系敏感支持决策方面的局限性。\n- **领域归类**: [自然语言处理, 情感计算, 对话系统]\n---\n\n### 137. DF26: We Cannot Tell Fake From Real Anymore (DF26：我们再也无法分辨真假了)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07369)\n- **研究任务**: 检测包含由最新文本到视频和图像到视频模型生成的完全合成片段的 AI 生成视频。\n- **核心亮点**: 引入了 DF26 基准，专门针对单人公开演讲场景（包括直接面对镜头录制、官方声明和演播室访谈），包含 271 个真实视频和 2,420 个由七个现代视频模型生成的合成视频。\n- **深度解析**: 在 DF26 上的研究表明，人类以及最先进深度伪造检测器在检测 AI 生成视频方面的表现接近随机猜测。这一结果凸显了当前评估协议的局限性，并强调了需要明确衡量对现代生成模型分布偏移鲁棒性的基准。\n- **领域归类**: [计算机视觉, 视频生成, 深度伪造检测]\n---\n\n### 138. RenderFormer-V2: Neural Rendering with Heterogeneous Scene Primitives (RenderFormer-V2：使用异构场景基元的神经渲染)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05738)\n- **研究任务**: 提出一种统一的、基于 Transformer 学习的神经渲染模型，以处理多种光传输效果，作为现代基于物理的渲染系统的补充。\n- **核心亮点**: RenderFormer-V2 将全局光传输建模为序列到序列的转换，采用两阶段过程：解决场景内基元间传输的视图无关阶段，以及将内部神经场景表示转换为图像像素的视图相关阶段。引入了结合窗口注意力和渲染感知注意力汇聚（attention sink）的新机制，并支持异构场景基元及独立于底层表面反射模型的材料编码。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [计算机视觉, 神经渲染, 计算机图形学]\n---\n\n### 139. HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals (HarvestBench：衡量大语言模型智能体是否愿意付出代价以避免杀害动物)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04444)\n- **研究任务**: 评估大语言模型智能体在实现目标的过程中，是否愿意付出代价（如燃料成本）来避免对动物造成副作用（杀害）。\n- **核心亮点**: 首个为避免副作用定价并将副作用命名为生物的基准。构建了一个农场模拟环境（强化学习网格世界），LLM 子智能体驾驶拖拉机收割玉米。当动物挡住路线时，自动驾驶停止并询问模型是否继续前进（无燃料成本）或绕行（需支付公布的燃料价格）。\n- **深度解析**: 在九个模型和 7,201 个定价决策中，有 3,951 个涉及动物。杀戮率从 0.4% 到 98.8% 不等，Terra 和 Sol 最仁慈，GPT-4o-mini 最残忍，且与能力无关。六个模型中有四个对价格敏感（弹性在 0.09 到 1.69 之间）。所有九个模型在默认地图上碾压野生动物的频率都高于农场动物。道德简报的影响最大：在道德简报下，六个推理模型中有五个的杀戮率低于 6%，而移除简报后所有六个模型的杀戮率均高于 84%。该基准不使用 LLM 评分器，而是计算游戏日志中的事件，完全可重现。\n- **领域归类**: [人工智能安全, 智能体评估, 机器道德]\n---\n\n### 140. The 2026 PNPL Competition: Word Classification and Efficient Cross-Subject Generalisation in LibriBrain100 (2026 PNPL 竞赛：LibriBrain100 中的单词分类与高效跨被试泛化)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03231)\n- **研究任务**: 推进非侵入式语音解码的多年课程，从基础任务（语音检测和音素分类）向单词分类和跨被试泛化任务迈进，以解决脑机接口（BCI）需要向新用户泛化的问题。\n- **核心亮点**: 推出 LibriBrain100 数据集，在原有 LibriBrain 数据集基础上增加了 32 名新被试（每人约 40 分钟）以及更多的被试内数据（约 80 小时）。竞赛分为两个赛道：Deep 赛道针对大规模被试内单词分类以追求最佳性能；Broad 赛道针对跨被试泛化，逐步减少被试特定微调数据量。\n- **深度解析**: 回顾 2025 年 PNPL 竞赛，获胜提交在语音检测和音素分类任务上分别达到了 95.6% 和 73.6% 的 F1-macro 分数。2026 年竞赛的 Broad 赛道将微调数据量减少至约 40、20 再到 10 分钟，这一时长在临床上是可行的，使非侵入式脑机接口在恢复重度瘫痪患者沟通能力方面迈出了更近的一步。\n- **领域归类**: [脑机接口, 语音解码, 竞赛与基准]\n---\n\n### 141. Privacy Failure in Split-LLM Training, The Returned Gradient Nullifies the Decoys (拆分大模型训练中的隐私失效：返回的梯度使诱饵无效)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04382)\n- **研究任务**: 评估双节点拆分大语言模型（Split-LLM）训练系统的隐私安全性，特别是针对返回梯度通道中未被测试的隐私泄露问题进行系统性安全案例研究。\n- **核心亮点**: 发现返回梯度中诱饵行（decoys）的精确零梯度模式会直接暴露真实数据行；提出通过对梯度每行进行裁剪和加噪来关闭该泄露通道。\n- **深度解析**: 在拆分训练架构中，本地可信节点（TLN）将受保护的激活发送给不可信云节点（UCN），UCN返回输出，TLN计算私有损失并返回输出梯度。UCN接收的帧混合了真实行和诱饵行，且损失计算忽略诱饵。由于诱饵的梯度精确为零，这种零模式直接揭示了哪些行是真实的。实验表明，在9个随机种子中，零梯度在每帧的4096行中准确识别出所有真实行。攻击帧内容可在常数猜测基线上多恢复约百分之一的token（提升+0.65至+1.50个百分点），而打乱标签的对照组未恢复任何信息。该发现在保持模型质量的实际部署配置中同样成立。虽然前向通道检查和质量检查均通过，但一旦包含返回梯度就会失效。对梯度每行进行裁剪和加噪可关闭此泄露（代价约为0.01 nats的交叉熵），但系统仍面临跨训练步骤积累观测等五类未测量的攻击威胁。\n- **领域归类**: [系统安全, 大模型隐私, 分布式训练]\n\n---\n\n### 142. The Price of Sparsity: Sufficient Conditions for Sparse Recovery using Sparse and Sparsified Measurements (稀疏性的代价：使用稀疏和稀疏化测量进行稀疏恢复的充分条件)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2509.01809)\n- **研究任务**: 研究在含噪线性测量下，从稀疏高斯测量矩阵中恢复稀疏二元信号支撑集的最小样本量充分条件，以及将密集高斯设计稀疏化后的恢复问题。\n- **核心亮点**: 明确了测量稀疏性带来的信息论代价阈值；证明了在比例机制下，即使对原本密集的设计进行独立稀疏化，也能以极小的样本量实现支撑集恢复。\n- **深度解析**: 针对高信噪比区域，论文确定了稀疏高斯测量矩阵下最大似然恢复的最小样本量充分条件。结合已知下界，得出了量级为 $s \\log(p/s) / \\log(ds/p)$ 的信息论阈值，明确量化了测量稀疏性的代价。研究特别指出了一种机制，其中测量稀疏性导致的样本复杂度损失是对数级的，而计算增益几乎是线性的。其次，研究了将原始密集高斯设计稀疏化后的恢复问题（观测由密集设计生成，估计使用独立稀疏化设计和重缩放响应）。在比例机制下，证明了对于任意固定目标误差水平和任意松弛变量，$p/\\psi^2$ 量级的样本量足以实现支撑集恢复。摘要未提供具体的实验数据集或详细的实验数字结果。\n- **领域归类**: [信息论, 信号处理, 压缩感知, 理论机器学习]\n\n---\n\n### 143. NOAH: Learning the Full Patient Journey. A Longitudinal Multimodal Time-Aware Model for Representation and Forecasting (NOAH：学习完整的患者旅程。用于表示和预测的纵向多模态时间感知模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09140)\n- **研究任务**: 解决利用海量、纵向、多模态患者记录来完整表示和预测患者状态轨迹的挑战，克服现有模型在处理不规则时间动态和随机性方面的局限。\n- **核心亮点**: 提出 NOAH，一个时间感知、任务无关的生成式 Transformer 模型，具备双向时间积分和变分潜在空间，原生处理多种医疗模态，支持自回归预测、零样本分类和反事实干预模拟。\n- **深度解析**: 现有医疗AI模型多为判别式，受限于少数模态、封闭词汇或单调时间归纳偏置。NOAH 作为该领域首个真正全面的生成式模型，通过新颖的双向时间积分和变分潜在空间，捕捉患者状态的连续演变和临床轨迹的随机性。模型基于 MIMIC 数据集家族中 299,000 名患者的 431,000 次医院就诊的超过 5.59 亿个临床事件构建。它能原生处理医学图像、时间序列和数值信号、分类事件以及结构化和非结构化临床记录。在临床结果探测、15个ICD章节、29种合并症以及事件发生时间预测方面表现出强大的性能。摘要未提供具体的对比实验数字或基线模型名称。\n- **领域归类**: [医疗人工智能, 多模态学习, 时间序列分析, 生成式模型]\n\n---\n\n### 144. Learning 3D Editing without Paired Supervision via Generative Prior Distillation (通过生成先验蒸馏学习无配对监督的3D编辑)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04942)\n- **研究任务**: 解决指令引导的3D编辑中高质量配对训练数据严重匮乏的问题，实现无需配对3D监督的前馈3D编辑学习。\n- **核心亮点**: 提出通过生成先验蒸馏框架，将基础模型的视觉、语义和几何知识直接蒸馏到3D编辑模型中，并引入3D感知分布匹配正则化以防止几何崩溃和多视图不一致。\n- **深度解析**: 现有方法依赖测试时优化或复杂管道构建伪配对数据，易引入结构漂移和几何伪影。本文方法不依赖真实3D配对，而是通过可微渲染管道，利用两个互补信号监督3D表示：主编辑视图的图像编辑模型提供的2D视觉先验，以及新视图的视觉语言模型提供的语义先验（确保严格遵循指令和保留源身份）。为解决2D投影监督固有的几何崩溃和多视图不一致，引入3D感知分布匹配正则化作为几何先验，在3D潜在空间中约束编辑输出，使其保持在预训练图像到3D教师模型定义的真实3D资产流形内。摘要未提供具体的实验数据集名称、对比基线名称或具体的性能提升数字。\n- **领域归类**: [计算机视觉, 3D视觉, 图像/3D编辑, 知识蒸馏]\n\n---\n\n### 145. Real-World Knowledge-Guided Change Data Synthesis for Remote Sensing (面向遥感的现实世界知识引导变化数据合成)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24263)\n- **研究任务**: 解决遥感变化检测中现有数据合成方法依赖手工规则、类别转换覆盖有限、灵活性差的问题，提供低成本的高质量训练数据扩展方案。\n- **核心亮点**: 提出 KnowChange 框架，利用预训练的视觉语言模型作为知识源，从变化前场景和期望的变化类型中推理出合理的变化位置和类别转换，实现统一框架下多样化变化类型的灵活合成。\n- **深度解析**: 现有的变化数据合成方法通常使用手工规则，限制了数据多样性和灵活性。KnowChange 将知识引导的变化模拟与泛化合成模型相结合，利用视觉语言模型推理出合理的变化位置和类别转换。实验表明，尽管生成规模紧凑，KnowChange 生成的数据在合成到真实数据的迁移和合成数据增强方面，始终优于现有的合成数据集。进一步分析表明，该知识引导的变化模拟可以无缝集成到现有的合成管道中，并提升合成数据的下游效用。摘要未提供具体的遥感数据集名称、具体的性能提升数字或对比基线名称。\n- **领域归类**: [遥感图像处理, 计算机视觉, 数据合成, 视觉语言模型]\n\n---\n\n### 146. From Reweighting to Rewriting: Unlocking the Intervention Effects of Influential Samples in Training Data Attribution (从重加权到重写：解锁训练数据归因中关键样本的干预效应)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.02771)\n- **研究任务**: 探究训练数据归因（TDA）中影响函数的干预价值，解决影响函数选择的样本在传统基于权重的干预（重加权）下效果有限的问题。\n- **核心亮点**: 提出“影响引导的响应重写”方法，利用影响函数识别干预目标，并用行为对齐或行为相反的监督替换其响应；证明了重写比重加权能产生更强、更持久且双向的行为转变。\n- **深度解析**: 训练数据归因旨在识别塑造模型行为的训练样本，但其干预价值取决于样本的选择和修改方式。影响函数（IF）估计无限小重加权下的行为变化，但IF选择的样本在常规重加权干预中优势不明显。本文提出影响引导的响应重写，保持指令不变，替换响应。在四个开源权重LLM上，以认知弃权为主要测试平台，对比了相同影响选择样本的重写和重加权。结果显示，响应重写产生了更强、更持久和双向的行为转变，而重加权效果微弱且不一致。分析表明，影响选择的样本提供了更大的重写杠杆，且变化集中在目标相关行为上。同样的定性对比也延伸到安全拒绝任务。摘要未提供具体的LLM模型名称、具体的性能提升数字或详细的评估指标。\n- **领域归类**: [大语言模型, 训练数据归因, 模型可解释性, 模型干预]\n\u003c/details\u003e\n\n"</script>
