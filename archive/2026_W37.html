    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 每周论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Scaling Automatic Research Agents via World Models (通过世界模型扩展自动研究智能体)\n- **社区热度**: `👍 452 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12564)\n- **研究任务**: 解决自动研究（AutoResearch）智能体在强化学习扩展时，因环境执行占据主导而导致的训练成本瓶颈问题。\n- **核心亮点**: 提出 World Model RL (WMRL)，用世界模型替代环境执行以消除训练瓶颈；针对世界模型可能存在的偏差和噪声，引入在线去偏（Online Debiasing）和逆方差去噪（Inverse-Variance Denoising）两种缓解机制。\n- **深度解析**: 理论证明这两种缓解措施能严格改善收敛保证；实验上，WMRL 在不同智能体规模的各种任务上加速训练 3-4 倍，并超越标准 RL 基线；后训练的 4B 和 9B 智能体在保留基准上超越了 48B 和 120B 的开放权重智能体；此外，该方法可迁移至具身 VLA 策略的后训练，展现出良好的泛化性。\n- **领域归类**: [强化学习, 自动研究, 智能体, 世界模型]\n---\n\n### 2. NeoHorse-1: Towards Recursive Self-Improvement via Agentic Post-Training with Routing Harness (NeoHorse-1：通过带路由 Harness 的智能体后训练实现递归自我改进)\n- **社区热度**: `👍 414 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08183)\n- **研究任务**: 探索大语言模型通过智能体后训练（agentic post-training）实现递归自我改进（RSI）的具体机制。\n- **核心亮点**: 提出 NeoHorse-1，结合异构模型池与智能路由，将路由信号用于组织三阶段监督微调（SFT）课程和路由引导的在策略蒸馏（on-policy distillation），形成“评估-选择-更新”的闭环，使系统学到的能力决定其下一步学习的数据。\n- **深度解析**: 在涵盖基于 harness 的智能体、工具使用、编码和指令遵循的 11 个基准上，后训练使 4B 模型的宏观平均分从 58.94 提升至 64.87，9B 模型从 65.60 提升至 69.04，大幅缩小了后训练 4B 模型与 9B 基础模型之间的性能差距。\n- **领域归类**: [大语言模型, 智能体, 后训练, 递归自我改进]\n---\n\n### 3. NCP-ArchPreview Technical Report: Moving towards Latent Space Language Models through Next Concept Prediction (NCP-ArchPreview 技术报告：通过下一概念预测迈向潜空间语言模型)\n- **社区热度**: `👍 304 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10715)\n- **研究任务**: 开发潜空间语言模型，通过下一概念预测（NCP）超越标准的下一词元预测（NTP），提升自回归预训练的效率与效果。\n- **核心亮点**: 提出 NCP-ArchPreview，在标准 NTP 基础上引入 NCP 目标，通过乘积量化构建潜空间概念词汇表，并设计专门的概念模块预测未来离散概念，将其反馈至词元级以指导后续生成，实现端到端联合训练。\n- **深度解析**: 模型参数量为 8.9B，在 Dolma-3 数据集的 5.73T tokens 上训练；仅消耗 51.3% 的训练 tokens 即达到 OLMo-3-7B 的最终预训练损失；下游宏观平均超越 OLMo-3-7B 2.45 分（其中 GSM8K 提升 5.99 分）；仅使用 85% 的标准计算量即可接近 8.9B 基线的训练损失；预训练后，仅更新 17M 参数的 VQ 模块即可作为轻量级领域适应接口；将概念表示注入 DFlash2 drafter 可使平均接受长度提升 4.17%。\n- **领域归类**: [自然语言处理, 语言模型, 潜空间模型, 预训练]\n---\n\n### 4. SenseNova-U1.5: Towards Native Unified Visual Intelligence (SenseNova-U1.5：迈向原生统一视觉智能)\n- **社区热度**: `👍 248 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11929)\n- **研究任务**: 开发原生统一多模态模型，在单一架构中实现视觉内容的理解、推理和生成。\n- **核心亮点**: 推出 SenseNova-U1.5，采用无编码器、无 VAE 的 8B-MoT 架构，支持高达 4K 原生分辨率；通过后训练优化视觉美学、双语文本渲染、信息图生成和图像编辑等专门专家，并利用多专家在策略蒸馏整合各项能力。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [计算机视觉, 多模态模型, 图像生成, 视觉语言模型]\n---\n\n### 5. AuK Technical Report: An Open-Source Foundational Model for Speech Generation and Editing (AuK 技术报告：用于语音生成和编辑的开源基础模型)\n- **社区热度**: `👍 218 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08936)\n- **研究任务**: 开发统一语音生成和编辑的开源基础模型，通过自然语言指令和音频上下文进行灵活控制。\n- **核心亮点**: 提出 AuK，结合多模态大语言模型（语义条件）、联合训练的 VAE（声学条件）和混合整流流 Transformer（双流 MMDiT + 单流 DiT）；后训练采用人类反馈偏好优化和基于奖励的强化学习，并蒸馏出支持 4 步推理的 AuK-Flash 以大幅降低推理成本。\n- **深度解析**: 构建了约 30.3 亿个指令-音频实例和 195 万小时的有效监督数据，涵盖五个任务家族；AuK-Flash 通过一致性初始化和任务路由的解耦 DMD 进行蒸馏，实现 4 步推理且无需分类器自由引导，在匹配条件下实现 4.5 倍的挂钟加速。\n- **领域归类**: [语音处理, 音频生成, 多模态模型, 扩散模型]\n---\n\n### 6. Dr. Claw: An AI Scientist Workspace for Vibe Research (Dr. Claw：用于 Vibe 研究的 AI 科学家工作区)\n- **社区热度**: `👍 180 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.00365)\n- **研究任务**: 构建端到端的 AI 科学研究工作区，解决现有研究流程在聊天工具、IDE、终端和写作环境之间碎片化且决策难以审计的问题。\n- **核心亮点**: 提出 Dr. Claw，一个开源工作区，通过持久状态对象、可重用技能库和多执行器协调，将现有命令行编码智能体封装在可控、可审计的人在环工作流中，实现规划、执行和写作的可追溯、可恢复闭环。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [智能体, 软件工程, 人机交互, 自动化研究]\n---\n\n### 7. Show-Harness: Just a VLM Agent Can Play Robots (Show-Harness：仅靠 VLM 智能体即可操控机器人)\n- **社区热度**: `👍 156 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10522)\n- **研究任务**: 将基础视觉语言模型（VLM）的广泛世界智能转化为机器人控制能力，降低具身智能的部署门槛。\n- **核心亮点**: 提出 Show-Harness，通过紧凑的语义接口将意图与动作连接，暴露离散语义动作单元供 VLM 推理，并由具身解释器确定性地映射为局部机器人动作；同时开发 GUMI（GUI 操作接口），将相同语义动作空间扩展至基于 GUI 的演示收集，无需专用遥操作硬件。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [具身智能, 机器人控制, 视觉语言模型, 智能体]\n---\n\n### 8. Unlocking Lossless Speedups in LLMs via Discrete Diffusion (通过离散扩散解锁大语言模型的无损加速)\n- **社区热度**: `👍 148 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04010)\n- **研究任务**: 克服大语言模型自回归结构导致的顺序生成瓶颈，实现不牺牲生成质量的无损加速。\n- **核心亮点**: 提出扩散增强的大语言模型（Uno），将参数解耦为标准自回归权重和轻量级扩散权重，通过扩散蒸馏训练扩散权重以并行生成多个词元；引入 Ψ-Spec 采样器家族，实现固定上下文长度下的无损加速和推理时扩展，且无需单独的草稿模型。\n- **深度解析**: 8B 的 Uno 模型在所有评估的基准测试中（包括智能体工具使用、编码和长上下文推理）超越了领先的开源 d-LLM（26B DiffusionGemma）和专有模型 Mercury 2；在设备支持的最大批次大小下，相比基础自回归模型实现高达 3 倍的加速。\n- **领域归类**: [自然语言处理, 语言模型, 推理加速, 扩散模型]\n---\n\n### 9. Bilevel Coordinated Reflection: A Game-Theoretic Approach to Multi-Agent LLM Systems (双层协调反思：多智能体大语言模型系统的博弈论方法)\n- **社区热度**: `👍 146 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.02750)\n- **研究任务**: 为多智能体大语言模型系统提供协调、记忆改进和外部验证的统一理论解释，并提升系统在实际任务中的表现。\n- **核心亮点**: 将编排者-工作者交互建模为双层协调博弈，将反思分析为语义记忆状态上的随机运动；提出随机反思记忆上升（SRMA）算法，仅在基于环境的评估风险严格降低时才接受候选记忆，实现精确收敛，并证明了纯文本门控的信息论不可能性。\n- **深度解析**: 在 500 个 SWE-bench 实例上，完整的基于 Kimi 的系统解决了 72.2% 的问题，而公开的 mini-SWE-agent 参考基线为 70.8%。\n- **领域归类**: [多智能体系统, 大语言模型, 博弈论, 强化学习]\n---\n\n### 10. SpatialBlock: Enhancing Spatial Intelligence in LVLMs via Synthetic Block-Stacking Problem (SpatialBlock：通过合成积木堆叠问题增强大型视觉语言模型的空间智能)\n- **社区热度**: `👍 134 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07064)\n- **研究任务**: 提升大型视觉语言模型（LVLM）在 2D 图像中重建和推理 3D 场景结构的空间智能，解决真实场景数据集标注成本高且嘈杂的问题。\n- **核心亮点**: 提出受人类认知发展启发的新范式，构建包含 15,000 个积木堆叠问题的合成数据集 SpatialBlock-15k，涵盖 3D 到 2D 投影、视点变换和结构组合，并引入受控颜色调制作为视觉线索以鼓励复杂条件下的锚点推理。\n- **深度解析**: 构建了包含 15,000 个积木堆叠问题的合成数据集 SpatialBlock-15k，涵盖 3D 到 2D 投影、视点变换和结构组合，并引入受控颜色调制作为视觉线索。\n- **领域归类**: [计算机视觉, 视觉语言模型, 空间智能, 数据集]\n---\n\n### 11. Omni Interaction Agent Technical Report (全交互智能体技术报告)\n- **社区热度**: `👍 133 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08977)\n- **研究任务**: 统一全感知、实时交互和智能体能力，实现自然的全双工交互（涵盖日常对话和复杂工作流场景）。\n- **核心亮点**: 提出端到端模型 Gander，支持多模态流式输入和全双工自然交互，允许用户随时打断模型，模型也能主动提供中间反馈或追问。\n- **深度解析**: 架构上采用“小脑-大脑”协同框架，小脑基于流式 Thinker-Talker 架构处理低延迟连续交互，大脑处理高级推理与智能体任务。评估涵盖对话、理解、交互和智能体四个维度，在背景噪音、多方交互等挑战场景中展现出鲁棒性，并开源了模型、代码与数据。摘要未提供具体的评估分数。\n- **领域归类**: [多模态大模型, 智能体, 实时交互]\n---\n\n### 12. Programmable World Model (可编程世界模型)\n- **社区热度**: `👍 106 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10540)\n- **研究任务**: 解决视频世界模型缺乏维持持久世界状态和执行可编程规则机制的问题。\n- **核心亮点**: 提出可编程世界模型框架，将世界状态演化与视觉观察生成解耦。通过自然语言指令生成可执行程序，直接控制实体状态和转换规则。\n- **深度解析**: 引入状态增强的 3D 定向边界框 (OBBs) 作为中间表示，结合目标相机轨迹编译成时空条件信号输入预训练视频模型。在 CombatStateBench 基准上，计数准确率达 94%，状态准确率达 98%，显著优于现有交互式视频世界模型，支持连贯的长时程生成。摘要未提供其他具体实验数字。\n- **领域归类**: [视频生成, 世界模型, 计算机视觉]\n---\n\n### 13. FlowBalance: Verifier-Grounded Self-Improvement from On-Policy Reasoning Experience (FlowBalance：基于在策略推理经验与验证器锚定的自我提升)\n- **社区热度**: `👍 97 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03241)\n- **研究任务**: 解决推理模型在利用自身在策略经验进行自我提升时，面临的终端验证器监督稀疏和密集同模型指导可能导致错误自信的问题。\n- **核心亮点**: 提出 FlowBalance 方法，通过学习完整响应上的归一化分布，利用验证器衍生的组优势来校准自指导分数，实现结果校准的自指导。\n- **深度解析**: 该方法在数学推理任务中，在 Qwen3-4B 和 Qwen3-8B 上的平均性能优于 FlowRL，同时提高了训练速度和稳定性，避免了直接 OPSD 的响应长度崩溃，并在 AIME24 诊断中展现出更高的正确策略多样性。摘要未提供具体的性能提升数字。\n- **领域归类**: [大语言模型, 强化学习, 推理优化]\n---\n\n### 14. Eliciting Weak-to-Strong Generalization with On-Policy Reverse Distillation (基于在策略反向蒸馏激发弱到强泛化)\n- **社区热度**: `👍 94 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08798)\n- **研究任务**: 探索强模型能否从弱监督者学习并超越它们（弱到强泛化），解决传统蒸馏将弱教师作为优化目标从而限制学生模型能力上限的问题。\n- **核心亮点**: 提出在策略反向蒸馏 (OPRD)，评估教师策略相对于其参考策略在学生 rollout 上的偏移，并放大学生验证器驱动策略梯度中沿该方向的分量。\n- **深度解析**: OPRD 仅重新缩放验证器支持的更新，保留了策略优化的驻点，同时加速学习超越教师。在连续模型转移和多教师蒸馏中，以更少的学生更新实现了比现有 RL 和蒸馏方法更高的性能。响应风格分析表明学生模型更接近仅使用验证器 RL 训练的模型，而非弱教师。摘要未提供具体的性能提升数字。\n- **领域归类**: [大语言模型, 知识蒸馏, 强化学习]\n---\n\n### 15. AgentGrad: Intervention-guided Prompt Optimization for Multi Agent Systems (AgentGrad：多智能体系统的干预引导提示词优化)\n- **社区热度**: `👍 94 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08572)\n- **研究任务**: 解决基于 LLM 的多智能体系统 (MAS) 中提示词优化存在的梯度提取和梯度聚合阶段的局限性。\n- **核心亮点**: 提出 AgentGrad 框架，基于顺序干预和语义文本梯度抽象进行提示词优化。通过顺序干预识别解决故障的目标智能体，并利用语义聚类防止混合不相关的故障模式。\n- **深度解析**: 在五个 MAS 基准测试中达到最先进 (SOTA) 性能，与下一个最快的基线相比，平均将墙钟优化时间减少了 2.5 倍。摘要未提供具体的准确率提升数字。\n- **领域归类**: [大语言模型, 多智能体系统, 提示词优化]\n---\n\n### 16. OpenWAM: An Open, Modular Exploration Towards Systematic World-Action Model Pretraining (OpenWAM：面向系统化世界-动作模型预训练的开放模块化探索)\n- **社区热度**: `👍 74 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07398)\n- **研究任务**: 解决现有世界-动作模型 (WAM) 系统高度耦合、难以分辨哪些设计选择重要的问题，将 WAM 预训练转化为受控实验程序。\n- **核心亮点**: 推出 OpenWAM 开放研究栈，将 WAM 设计空间分解为可组合模块。提炼出三项原则：上游知识通过生成骨干和紧凑潜空间转移；世界-动作协同需要专门的动作容量和同步联合去噪；具身预训练主要改善域外泛化。\n- **深度解析**: 基于这些原则构建了 OpenWAM-α，在约 6400 小时的第一人称人类和机器人数据上预训练。在八个仿真基准和真实机器人实验中（涵盖单臂、双臂和灵巧手操作）均表现出优异的性能。开源了完整堆栈（基础设施、评估协议、预训练模型和数据配方）。摘要未提供具体的性能指标数字。\n- **领域归类**: [具身智能, 机器人, 世界模型]\n---\n\n### 17. Iris: Climbing to the Search Frontier (Iris：攀登搜索前沿)\n- **社区热度**: `👍 69 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04304)\n- **研究任务**: 训练高性能的搜索智能体，以解决需要多跳推理和复杂证据收集的复杂搜索任务。\n- **核心亮点**: 提出 Iris-mini (35B-A3B) 和 Iris-pro (397B-A17B) 搜索智能体。采用反向构建任务的数据管道，结合 SFT-RL 攀爬训练策略，并在推理时引入上下文管理。\n- **深度解析**: 在启用上下文管理的情况下，Iris-mini 和 Iris-pro 在 BrowseComp、BrowseComp-ZH、DeepSearchQA 和 HLE 上分别达到 82.2/84.8/86.9/52.3 和 88.6/85.1/92.9/56.4 的成绩，是其各自参数范围内开源搜索智能体的最强整体结果。计划开源模型权重及完整配方。摘要未提供其他未提及的实验细节。\n- **领域归类**: [大语言模型, 搜索智能体, 强化学习]\n---\n\n### 18. Marigold V2: Revisiting Diffusion Transformers for Monocular Depth Estimation (Marigold V2：重新审视用于单目深度估计的扩散 Transformer)\n- **社区热度**: `👍 68 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08084)\n- **研究任务**: 解决单目深度估计中模型难以泛化到分布外输入以及难以生成清晰详细深度图的问题。\n- **核心亮点**: 重新审视 Marigold 技术，利用扩散 Transformer (DiT) 架构将现代图像生成模型转化为最先进的单目深度估计器。采用单步推理和量化，并提出两种 remedies：对齐内部表示与语义特征，以及采用基于 Sinkhorn 损失的两阶段微调协议。\n- **深度解析**: 生成的深度图更清晰，泛化能力更强。在 KITTI 和 ETH3D 数据集上，AbsRel 相比先前最佳结果提升了 16-26%。定性地，模型能解析毛发、树叶和极细边缘。在表面法线估计和固有图像分解等其他密集回归任务中也达到了 SOTA。摘要未提供其他具体实验数字。\n- **领域归类**: [计算机视觉, 单目深度估计, 扩散模型]\n---\n\n### 19. DriveZero: End-to-End Driving Beyond Human Demonstrations (DriveZero：超越人类演示的端到端自动驾驶)\n- **社区热度**: `👍 63 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06055)\n- **研究任务**: 解决端到端自动驾驶系统受限于人类驾驶日志质量和行为覆盖范围的问题，学习超越人类演示的驾驶行为。\n- **核心亮点**: 提出 DriveZero 系统，将驾驶分解为感知模型和动作模型。引入 DriveRL（混合智能体闭环强化学习框架）和 DriveVFM（整合多个视觉基础模型的感知骨干），通过目标条件教师蒸馏实现端到端规划。\n- **深度解析**: 在 nuPlan 数据集上，DriveRL 在 Val14、Test14-hard 和 Test14-random 社区划分的非反应和反应模式下平均得分达到 93.57，超越了 Log-Replay 专家。DriveZero 在 NAVSIMv1、NAVSIMv2 和闭环 HUGSIM 基准上取得了 SOTA 性能，且无需任何人类轨迹监督。摘要未提供其他具体实验数字。\n- **领域归类**: [自动驾驶, 强化学习, 计算机视觉]\n---\n\n### 20. EvoSafeHarness: Evolving Model- and Domain-Specific Harnesses for Securing Agents (EvoSafeHarness：为保护智能体进化特定模型与领域的安全外壳)\n- **社区热度**: `👍 59 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05903)\n- **研究任务**: 解决大语言模型智能体在现实世界中面临的安全问题，特别是现有系统级安全外壳在不同模型和领域间缺乏针对性、容易导致过度拦截或防护不足的问题。\n- **核心亮点**: 提出 EvoSafeHarness 安全优化框架，为冻结模型在目标领域中合成可部署的安全外壳。联合搜索自然语言策略和可执行代码逻辑，结合模型行为、领域规范和新鲜上下文对抗审查。\n- **深度解析**: 在四个智能体基准家族中实现了更强的安全-效用边界。在 DecodingTrust-Agent 上，将平均攻击成功率从 45.6% 降至 10.0%，效用成本仅为 3.3 分。在 AgentDojo 上，在 0.0% ASR 下达到 82.8% 的效用。在 Agent-SafetyBench 上取得最佳成绩，并在自适应 PAIR 攻击下保持平均 ASR 低于 20%。摘要未提供其他具体实验数字。\n- **领域归类**: [大语言模型, 智能体安全, 提示词注入防御]\n---\n\n### 21. GE-Act 2.0: Pretraining and Scaling a World-Action Model for Robotic Manipulation (GE-Act 2.0：面向机器人操作的预训练与扩展世界-动作模型)\n- **社区热度**: `👍 59 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05588)\n- **研究任务**: 预训练和扩展用于机器人操作的世界-动作模型（WAM），使其能够从无动作视频和带动作标签的交互数据中学习，通过预测未来状态来指导机器人动作。\n- **核心亮点**: 提出 GE-Act 2.0，其所有可训练的生成和动作组件均在操作数据上从头初始化；引入控制导向自编码器（CoAE）、单步视觉规划器（SVP）和逆动力学模型（IDM），并使用知识对齐选择性优化（KASO）进行联合训练。\n- **深度解析**: 模型通过 CoAE 在激进压缩下保留动作和指令相关信息，SVP 在一次可微传递中生成完整的未来状态，使得视觉规划和逆动力学可以在互补数据上分别预训练。联合训练时，KASO 仅选择与记录动作在行为上兼容的预测未来，以减少不匹配的监督。在 100 个任务、20 个操作技能组（包含未见场景、背景、光照和物体实例）上直接评估预训练检查点，无需逐任务微调。共训练数据从 300 小时扩展到 30,000 小时，G1-OP 成功率从 17.1% 提升至 44.1%，G2-90D 从 13.4% 提升至 31.1%。具体的网络层数、参数量规模及具体的对比基线模型名称摘要未提供。\n- **领域归类**: [机器人操作, 世界模型, 强化学习]\n---\n\n### 22. Miles v0.1: Production-Level Post-Training (Miles v0.1：生产级后训练系统)\n- **社区热度**: `👍 57 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08368)\n- **研究任务**: 构建一个全栈、生产就绪的前沿大模型后训练（Post-Training）系统，使前沿规模的强化学习（RL）对研究人员和企业更易获取。\n- **核心亮点**: 推出 Miles v0.1 系统，围绕“组件应经过验证、干净且可定制”的原则设计 RL 训练循环；支持全参数 RL、LoRA RL、在策略蒸馏、监督微调以及扩散模型，并实现了完全异步的 Agentic RL。\n- **深度解析**: 系统包含基于 SGLang 构建的 rollout 引擎、支持 NVIDIA Megatron-LM 和 PyTorch FSDP 两种后端的 trainer，以及三种适用于不同部署拓扑的权重同步传输机制。在端到端案例中，在 64 块 NVIDIA GB300 GPU 上对 GLM-5.2 744B-A40B 模型进行终端使用编码任务的完全异步 agentic RL，前 30 个测量步骤的中位步时间为 263 秒。具体的内存占用峰值、通信带宽利用率及具体的集群网络拓扑细节摘要未提供。\n- **领域归类**: [大模型训练系统, 强化学习, 分布式计算]\n---\n\n### 23. T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks (T1：面向长视野任务的终端 Agent 强化学习)\n- **社区热度**: `👍 56 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11042)\n- **研究任务**: 针对编码和科学发现等长视野（Long-Horizon）任务，特别是终端（Terminal）操作任务，通过强化学习训练一个能够操作真实 shell 的大模型 Agent。\n- **核心亮点**: 提出 T1，一个总参数量为 122B 的混合专家（MoE）模型，在云沙盒中操作真实 shell，每个任务最多进行 300+ 轮工具调用，并通过执行任务自身的验证器获得奖励。\n- **深度解析**: 训练配方包括：1）激进的热启动以稳定 actor-critic 训练，使用密集过程奖励（根据通过的验证器绝对数量打分）；2）通过 TITO 构建实现稳定优化，在轮次边界进行漂移修复，并回放 rollout 路由（记录并回放 MoE 层每 token 的专家选择）；3）使用完全分布外（OOD）的训练语料。TITO 和 R3 将训练到推理的 log-probability 差异从 0.021 降至 0.013。在 Terminal-Bench 2.1 上解决率从 43.8% 提升至 64.0%，在 Long-Horizon Terminal Bench 上达到 27.9%。具体的 MoE 专家数量、激活参数量及具体的 RL 算法超参数摘要未提供。\n- **领域归类**: [AI Agent, 强化学习, 代码生成]\n---\n\n### 24. Mask Forcing: Improving Autoregressive Video Diffusion Distillation via Dual-Noise Masking Rollout (Mask Forcing：通过双噪声掩码展开改善自回归视频扩散蒸馏)\n- **社区热度**: `👍 55 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09123)\n- **研究任务**: 改善自回归（AR）视频扩散模型的蒸馏过程，解决分布匹配蒸馏（DMD）中因反向 KL 目标导致的模式寻求（mode-seeking）问题，从而缓解生成视频过饱和和过平滑的现象。\n- **核心亮点**: 提出 Mask Forcing（双噪声掩码展开）策略，在 AR 扩散蒸馏的自展开过程中，沿空间和时间轴注入随机掩码来扰动学生模型，鼓励其探索教师分布的更多区域，无需引入真实视频数据或额外的后训练阶段。\n- **深度解析**: 反向 KL 目标的模式寻求行为会导致学生分布坍缩到教师分布的少数模式上。Mask Forcing 的核心思想是在自展开过程中通过随机掩码向噪声输入注入更清晰的信号。这种扰动促使学生展开探索教师分布的更多区域，使 DMD 能够提供超越学生已覆盖模式的学习信号。同时，更清晰的 token 作为去噪指导，改善中间展开预测并减少误差累积。具体的掩码比例、掩码形状（如块状或随机像素）以及具体的视频分辨率和帧率设置摘要未提供。\n- **领域归类**: [视频生成, 扩散模型, 模型蒸馏]\n---\n\n### 25. Mi-Ripple: Restoring Images Degraded by Iterative AI Editing (Mi-Ripple：恢复因迭代 AI 编辑而退化的图像)\n- **社区热度**: `👍 49 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11317)\n- **研究任务**: 恢复因迭代式 AI 图像编辑而退化的图像，专门抑制和消除引入的网格状和颗粒状纹理（即“数字波纹”），同时保护图像原有结构。\n- **核心亮点**: 提出 Mi-Ripple，一种诊断引导的恢复工作流，通过将周期性晶格伪影与内容纠缠的颗粒纹理分离，结合选择性频谱陷波、结构感知平滑和清理参考再生，实现低失真过滤和视觉重建。\n- **深度解析**: 该方法首先分离周期性晶格伪影和内容纠缠的颗粒纹理。当伪影在频谱上隔离时，采用选择性频谱陷波实现低失真过滤；当过滤会抹除合法细节时，则结合结构感知平滑和清理参考再生进行视觉重建。在 14 次仅陷波的执行中，全图残差标准差在 CIELAB 亮度单位中为 0.08 到 0.44。在配对再生示例中，参考清理使输出碎片密度降低了 45%。具体的陷波滤波器设计参数、结构感知平滑的具体算法实现以及更多数据集上的泛化表现摘要未提供。\n- **领域归类**: [图像恢复, 计算机视觉, 图像编辑后处理]\n---\n\n### 26. SceneMosaic: Efficient and Diverse Simulation-Ready Scene Generation via Hybrid Agentic Layout Evolution (SceneMosaic：通过混合 Agent 布局进化实现高效多样的仿真就绪场景生成)\n- **社区热度**: `👍 47 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05594)\n- **研究任务**: 高效且多样化地生成可用于仿真的室内 3D 场景，解决现有基于 VLM 的 Agent 方法成本高，以及参数化图像到 3D 方法物理无效且缺乏多样性的问题。\n- **核心亮点**: 提出 SceneMosaic 框架，结合参数化图像先验的高效性和 VLM Agent 的物理有效性；利用自然场景的局部性，将场景分解为独立的局部单元进行分别进化，最后通过笛卡尔积组合成全局场景。\n- **深度解析**: SceneMosaic 首先从学习到的基于图像的先验中获取初始候选场景，随后通过 VLM Agent 进行进化以确保物理有效性。在进化过程中，利用场景局部性，将场景分解为独立局部单元，允许在每个单元内独立进化，然后通过笛卡尔积组合全局场景，从而为单一输入生成多样化场景。在 SceneEval-100 上，该方法在语义布局质量上匹配最强 Agent 基线，速度提升 24 倍，大幅减少物理违规，并获得最高的人类评分。具体的 VLM Agent 提示词设计、局部单元划分的阈值以及具体的 3D 资产库规模摘要未提供。\n- **领域归类**: [3D 场景生成, 具身智能, 多模态大模型]\n---\n\n### 27. ENEAS: Embedding-guided Neural Ensemble for Adaptive Segmentation (ENEAS：用于自适应分割的嵌入引导神经集成)\n- **社区热度**: `👍 47 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03756)\n- **研究任务**: 提出一种统一且支持文本提示的方法，用于实例跟踪和语义发现，解决现有基础模型（如 SAM 3）在时间幻觉、空间碎片和语义误分类方面的缺陷。\n- **核心亮点**: 提出 ENEAS，通过单一方法实现双向功能：对唯一实例进行精确跟踪和高质量分割，以及通过语义验证层发现文本查询命名的所有实例；结合几何鲁棒的 SeC 架构与文本提示适配器，并引入条件 VLM 细化以过滤本体论错误。\n- **深度解析**: 针对跟踪任务，ENEAS 扩展了 SeC 架构，添加文本提示适配器并利用其时间记忆，确保目标在消失时不会漂移，在充满视野时保持完整。针对发现任务，验证层结合高速视觉嵌入匹配与条件 VLM 细化，仅对模糊候选者调用语义推理，从而在保持低延迟的同时过滤视觉模型无法区分的本体论错误（如将雕像或反射误认为目标）。具体的 SeC 架构细节、视觉嵌入匹配的阈值以及条件 VLM 的具体模型选择摘要未提供。\n- **领域归类**: [计算机视觉, 视频分割, 实例跟踪]\n---\n\n### 28. X-AuT: Progressive Audio-Encoder Compression for Speech LLMs with Cross-Scale Distillation (X-AuT：通过跨尺度蒸馏实现语音大模型音频编码器的渐进式压缩)\n- **社区热度**: `👍 43 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11412)\n- **研究任务**: 通过渐进式音频编码器压缩和跨尺度蒸馏，降低语音大语言模型的推理成本，同时保持或提升语音识别性能。\n- **核心亮点**: 提出 X-AuT 渐进式框架，通过短行为探针选择层组合，并利用表示对齐、跨尺度蒸馏、计划学生策略监督和 LoRA 微调来恢复剪枝模型；在冻结语言模型骨干的情况下，仅调整注意力 LoRA 适配器和绑定的输出嵌入。\n- **深度解析**: 直接移除完整块会扰动解码器消耗的嵌入，导致删除和提前结束序列错误。X-AuT 训练使用转录一致性管道中最高一致性的层级，随后在微调期间进行源重新加权。在 10 个公开的中英文基准上，将 Qwen3-ASR-0.6B 的音频编码器从 18 层压缩到 16 层，宏平均错误率从 5.61% 降至 5.27%；14 层模型错误率为 5.75%，音频塔参数减少 20.7%。在匹配配方下，1.7B 教师模型平均错误率为 5.55%。渐进式 18 到 14 层剪枝优于直接剪枝（5.75% vs 6.73%）。具体的行为探针设计细节、跨尺度蒸馏的损失函数权重以及各基准测试的具体名称摘要未提供。\n- **领域归类**: [语音大模型, 模型压缩, 知识蒸馏]\n---\n\n### 29. The Attention Triangle in Audio-Video Models (音视频模型中的注意力三角形)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03586)\n- **研究任务**: 分析和解决音视频扩散模型中跨模态注意力机制引入的微妙且系统的语义泄漏问题，研究连接文本、音频和视频流的“注意力三角形”。\n- **核心亮点**: 揭示了音视频扩散模型中“注意力三角形”的语义路由机制，发现音频-视频边缘的路由是双向的，且受模型参数偏差影响，是导致语义泄漏的主要原因；提取注意力派生信号作为诊断工具，并用于引导推理时干预以改善跨模态对齐。\n- **深度解析**: 当提示与学习到的先验存在张力时，跨模态交互可能会覆盖预期的条件，并将语义重新路由到视觉上规范但错误的结果。语义伪影不仅源于注意力超出预期目标，还源于特定路径上结构化的、偏差驱动的交互。研究提取的注意力派生信号可用于分析语义在模态间的分布和基础，并在受控条件下故意引发泄漏以探测内部动态。利用这些信号引导推理时干预，鼓励更一致的跨模态对齐。具体的注意力派生信号提取公式、推理时干预的具体数学形式以及所评估的具体音视频扩散模型名称摘要未提供。\n- **领域归类**: [音视频生成, 扩散模型, 模型可解释性]\n---\n\n### 30. Motion-Omni: End-to-End Joint Speech and Full-Body Motion for Spoken Dialogue (Motion-Omni：面向口语对话的端到端联合语音与全身动作生成)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04250)\n- **研究任务**: 实现端到端的联合语音和全身动作生成，用于口语对话，解决传统级联方法中语音和动作分离导致无法联合优化且推理慢的问题。\n- **核心亮点**: 提出 Motion-Omni 框架，使口语对话模型原生输出面部表情及手部、上半身和下半身动作，直接从生成语音的隐藏状态中生成；通过联合训练 LLM、语音生成器和动作生成器来恢复对齐。\n- **深度解析**: 如果冻结语音路径，动作仍会与音频未对齐，必须在两个目标下共同适应 LLM、语音生成器和动作生成器。监督信号来自可扩展的、与模型无关的管道，该管道使用可替换的动作教师对一致语音的语音响应进行伪标签，生成 422,856 个质量排序的对（1,402 小时）。发布了 SwDA-500 和首个随机开放式全身口语对话的公开评估协议。基于 Qwen2.5-7B-Instruct 实例化的 Motion-Omni-Q7 在无参考动作指标上匹配教师级联（误差在 2% 以内），响应速度快 5.4 倍（RTF=0.78），词错误率达到 2.62%。具体的动作教师模型名称、伪标签管道的质量排序算法以及评估协议中自动指标的具体计算公式摘要未提供。\n- **领域归类**: [多模态生成, 语音对话, 数字人/动作生成]\n---\n\n### 31. Procedural Graphs: Self-Evolving Execution Structures for LLM Agents (过程图：大语言模型智能体的自演化执行结构)\n- **社区热度**: `👍 41 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09153)\n- **研究任务**: 解决大语言模型智能体在长视野规划和外部工具调用中，因隐式过程知识导致的迷失目标、乱序调用和重复无效动作的问题。\n- **核心亮点**: 提出“过程图（Procedural Graph）”，将过程知识组织为（过程，关系，过程）三元组。框架在每步决策时定位活跃节点，通过引导模型将周围子图转化为步骤级情境指导。该图具备自演化能力，通过对比失败和成功轨迹来编辑拓扑和属性。\n- **深度解析**: 该框架从最小骨架开始构建，能够匹配或超越手工设计的图，并能修复有缺陷的专家先验。跨多个数据集、任务类型和 LLM 的评估表明，过程图相比基于记忆的基线带来了一致的性能提升，且自演化机制在无需人工工程的情况下进一步提高了性能。具体的数据集名称、任务类型细节、LLM 型号以及具体的提升数值摘要未提供。\n- **领域归类**: [大语言模型, AI智能体, 知识图谱, 规划与推理]\n---\n\n### 32. BeaconKV: Key-Value Cache Compression Guided by Beacon Queries for Efficient Large Reasoning Model Inference (BeaconKV：由信标查询引导的键值缓存压缩以实现高效大推理模型推理)\n- **社区热度**: `👍 39 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04971)\n- **研究任务**: 解决大推理模型（LRMs）在长链式思维（CoT）生成中，键值（KV）缓存随序列长度线性增长导致的严重内存瓶颈问题。\n- **核心亮点**: 提出 BeaconKV，一种无需训练的 KV 缓存压缩方法。发现长视野推理中会产生“思维重访标记（TRT）”，其对应的查询在嵌入空间聚集成少数相似组。BeaconKV 维护“信标查询”作为全局查询簇的紧凑代表，以预测哪些 KV 对会被重访。\n- **深度解析**: 现有方法依赖近期查询来估计未来 token 重要性，但在长视野推理中会失效。BeaconKV 在 4 个开源 LRM 和多种推理基准上，实现了高达 5.8 倍的内存减少，吞吐量提高 4.3 倍以上，同时几乎保持完整的缓存准确率。具体的 LRM 模型名称、推理基准名称以及具体的准确率数值摘要未提供。\n- **领域归类**: [大语言模型, 推理加速, 内存优化, 键值缓存压缩]\n---\n\n### 33. WearableQA: A Benchmark for Health Reasoning over Real-World Wearable Data (WearableQA：基于真实世界可穿戴数据的健康推理基准)\n- **社区热度**: `👍 39 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05405)\n- **研究任务**: 评估 AI 系统能否对真实用户的纵向可穿戴记录进行推理，填补现有基准在真实可穿戴数据推理评估上的空白。\n- **核心亮点**: 引入 WearableQA 基准，包含 4084 个 10 选项的多选题，基于 200 名真实用户（每人最多 500 天）的可穿戴时间序列、血液生物标志物和人口统计数据构建。提出 16 种问题类型，沿“数据 vs 健康推理”和“单信号 vs 跨信号推理”两个轴组织。采用双重接地框架结合文献和人群统计模式构建问题。\n- **深度解析**: 评估了 14 个专有和开源 LLM，性能从 19.6% 到 72.9% 不等（随机基线为 10%），大多数模型准确率低于 60%，表明该基准远未被解决。具体的 LLM 模型名称、详细的数据集划分比例以及具体的生理信号类型摘要未提供。\n- **领域归类**: [自然语言处理, 医疗健康, 基准测试, 可穿戴设备数据]\n---\n\n### 34. Memory as Plans: World-Action Modeling with Memory-Grounded Planning (记忆即计划：基于记忆接地的规划进行世界-动作建模)\n- **社区热度**: `👍 37 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11561)\n- **研究任务**: 解决主流机器人策略在处理需要长视野记忆的非马尔可夫复杂现实世界操作任务时，现有记忆机制容易丢失细粒度视觉证据或在历史覆盖与执行效率之间妥协的问题。\n- **核心亮点**: 提出 MaP-WAM（记忆即计划）框架，将依赖记忆的世界-动作建模分解为基于记忆的规划和基于计划的执行。将记忆表示为包含语言指令和稀疏视觉上下文的已完成片段记录，并转化为紧凑的计划。引入世界-动作-进度（WAP）模型，在推理时联合预测动作块和执行进度。\n- **深度解析**: MaP-WAM 在 RMBench 上达到 83.3% 的成功率（SOTA），在真实机器人任务上达到 78.0% 的成功率，同时在任务历史增长时保持大致恒定的执行器推理延迟。具体的 RMBench 任务细节、真实机器人任务类型以及延迟的具体数值摘要未提供。\n- **领域归类**: [机器人学, 具身智能, 记忆机制, 动作规划]\n---\n\n### 35. An Open Recipe for IMO Gold: Training Nemotron for Olympiad Mathematics (IMO 金牌开源指南：为奥林匹克数学训练 Nemotron)\n- **社区热度**: `👍 37 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10712)\n- **研究任务**: 研究模型后训练和测试时推理设计如何影响困难奥林匹克数学的自然语言证明生成。\n- **核心亮点**: 基于 Nemotron 3 Ultra，通过监督微调和强化学习训练了两个专家检查点。提出一个开源模型测试时计算管道，完全在自然语言中运行，无形式证明器、外部工具或互联网访问。系统在 IMO 2026 中获得 30/42 分，达到金牌门槛。开源了两个检查点、训练数据、代码、提交的解决方案以及包含 200 个新问题的 Nemotron-IMO-Bench 基准。\n- **深度解析**: 系统由三个 Nemotron 3 Ultra 检查点驱动，进行迭代搜索以生成、验证和改进候选证明，随后的高计算阶段选择最终提交。具体的 SFT/RL 超参数、强化学习算法细节、迭代搜索的具体策略以及基准测试的题目分布摘要未提供。\n- **领域归类**: [大语言模型, 数学推理, 强化学习, 测试时计算]\n---\n\n### 36. Reason Through the Latent! Making Latent Visual Reasoning Necessary (穿越潜空间推理！使潜在视觉推理成为必要)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06746)\n- **研究任务**: 解决潜在视觉推理中，视觉信息存在于潜在状态并不意味着模型在生成答案时实际依赖该状态（特别是当存在其他图像条件路径时）的问题。\n- **核心亮点**: 引入因果视觉循环推理（CVRR），在保留预训练视觉能力的同时，使循环计算成为预测所需的图像条件路径。在预训练视觉语言模型整合图像后，从问题隐藏状态初始化循环，然后在反复阅读相同固定视觉证据的同时更新状态。解码前移除视觉状态和原始多模态 KV 缓存，仅保留最终循环状态。\n- **深度解析**: 在 V^*, MMVP, BLINK, 和 MME-RealWorld-Lite 基准测试中，CVRR 在这种严格接口下保持了强大的性能，而兼容的潜在推理器即使在相同约束下重新训练也无法恢复相当的视觉能力。因果干预表明预测对循环内容敏感。具体的各基准测试准确率数值、模型参数量以及因果干预的具体设置摘要未提供。\n- **领域归类**: [多模态学习, 视觉推理, 潜在空间计算, 大语言模型]\n---\n\n### 37. CosmoH2G: A Hand-to-Gripper Transfer Dataset and Baseline Method for Object Manipulation with Complex Spatial Movements (CosmoH2G：用于复杂空间运动对象操作的手到夹爪迁移数据集与基线方法)\n- **社区热度**: `👍 35 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07498)\n- **研究任务**: 解决现有人手到机器人夹爪演示迁移方法大多局限于简单平面任务，无法处理复杂空间运动（如旋转或翻转的复杂轨迹）的问题。\n- **核心亮点**: 引入可扩展的采集管道收集手-夹爪配对演示，构建了包含 6189 个片段、1254 个独特对象的大规模配对数据集。提出两阶段框架：第一阶段预测稀疏夹爪关键帧，第二阶段在关键帧条件下生成完整连续动作序列。通过保持夹爪方向学习并基于抓取启发式和运动学一致性后优化平移，来减轻累积漂移。\n- **深度解析**: 在仿真和真实机器人实验中，该框架实现了复杂空间操作的稳定精确的手到夹爪迁移，显著优于传统基线。具体的成功率数值、对比基线名称、具体操作对象类别以及漂移减轻的具体量化指标摘要未提供。\n- **领域归类**: [机器人学, 具身智能, 模仿学习, 数据集]\n---\n\n### 38. FreeFlow: A Bias-free Hierarchical Transformer for Optical Flow Estimation (FreeFlow：用于光流估计的无偏置分层 Transformer)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11486)\n- **研究任务**: 解决传统光流方法依赖特定任务归纳偏置（如相关体积、特征扭曲、迭代细化等）导致表达能力受限、管道复杂和计算成本增加的问题。\n- **核心亮点**: 提出 FreeFlow，一个没有任何光流特定组件的分层 Transformer，仅使用单一的前馈编码器-解码器。结合三种注意力变体：用于局部处理的窗口注意力、用于跨窗口信息交换的移位窗口注意力，以及在降低分辨率下运行的全局注意力。\n- **深度解析**: 在主要基准测试中达到 SOTA，包括 Sintel (Clean/Final 0.68/1.48 EPE)、KITTI-2015 (3.23 Fl-all) 和 Spring (3.192 1px)，同时在 1080p 推理时保持内存高效。具体的模型参数量、FLOPs、推理速度数值以及与其他方法的具体对比差距摘要未提供。\n- **领域归类**: [计算机视觉, 光流估计, Transformer, 无归纳偏置]\n---\n\n### 39. Online Draft Co-Training for Speculative Decoding in Large-Scale, Long-Context RL Post-Training (大规模长上下文强化学习后训练中推测解码的在线草稿协同训练)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07108)\n- **研究任务**: 解决在大规模模型和长上下文强化学习（RL）后训练中，在线协同训练推测解码面临的两个障碍：标准因果上下文并行（CP）实现不支持分支注意力，以及目标特征跨越流水线并行（PP）阶段。\n- **核心亮点**: 提出端到端的大规模在线草稿协同训练系统。对于 CP，通过合并秩局部分支注意力与因果主序列注意力，扩展了打包、负载均衡的 zigzag 环注意力。对于 PP，TapChannel 通过独立路径跨阶段传输中间目标特征，不影响流水线调度。\n- **深度解析**: 实验表明，协同训练的草稿紧密跟踪策略基线，同时在高达 122B 的模型规模上提供实质性的 rollout 和端到端加速。CP 设计在 256K tokens 下实现强扩展并显著节省内存，PP 传输开销适中。具体的加速倍数、内存节省具体数值、PP 传输的具体开销数值以及 RL 算法细节摘要未提供。\n- **领域归类**: [大语言模型, 推理加速, 分布式训练, 强化学习]\n---\n\n### 40. Agentic Visual Generation: From Generative Models to Agentic Control (智能体视觉生成：从生成模型到智能体控制)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06758)\n- **研究任务**: 梳理和定义视觉生成系统从单一调用的生成模型向具备规划、工具选择、中间输出检查、失败修正和经验复用能力的智能体控制过程演进的分类标准。\n- **核心亮点**: 根据控制器在生成过程中能直接控制的内容，将领域组织为五个层级：L0 固定支持（无控制器的固定管道）、L1 条件控制（准备输入但不控制视觉操作）、L2 执行控制（选择并调用实际生成/编辑操作）、L3 结果自适应控制（观察中间结果以改变当前任务的后续操作）、L4 经验自适应控制（保留经验以改变未来任务的决策）。\n- **深度解析**: 该框架描述了逐渐扩大的决策范围，而非模型大小、系统复杂性或输出质量。将该框架应用于图像、视频、编辑、3D、世界、幻灯片和用户界面生成，揭示了控制器能力的演进及其机制在各层级的分布。具体的系统案例名称、评估指标以及各层级在特定任务中的具体分布数据摘要未提供。\n- **领域归类**: [计算机视觉, 视觉生成, AI智能体, 综述与分类框架]\n---\n\n### 41. VDiff-Bench: A Challenging Benchmark for Fine-Grained Image Difference Identification (VDiff-Bench：用于细粒度图像差异识别的具有挑战性的基准)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06245)\n- **研究任务**: 评估多模态大语言模型（MLLMs）在细粒度图像差异识别（Image Difference Identification）这一基础比较技能上的表现。\n- **核心亮点**: 提出了 VDiff-Bench，一个包含 1,756 个四选一问题的多项选择基准，涵盖 10 种变化类别（如位置、运动、颜色、外观/消失、噪声/分辨率等）。每个问题包含两张图像输入和 4 个选项（真实差异、两个困难负样本描述、一个“无差异”干扰项）。特别策划了基于真实条件的高质量负样本，要求模型区分实际变化与附近的语义替代。\n- **深度解析**: 实验评估了 11 个 SOTA 开源和闭源 MLLM，结果表明模型在细粒度视觉比较上依然脆弱。模型在语义变化上表现尚可，但在噪声和纹理等低级变化上持续失败（例如三个 7-8B 规模的开源模型在低级变化上仅得 8.7-33.3%）。此外，闭源商业模型 Grok 4.3 在识别噪声和纹理差异时表现大幅下降，落后于 Kimi K2.5 和 K3 等大型开源模型。该基准暴露了标准单图视觉语言任务无法捕捉的模型缺陷。\n- **领域归类**: [多模态大模型, 视觉理解, 模型评估]\n---\n\n### 42. MetroLLM-Bench: Evaluating Language Models as Transit Kiosk Runtimes (MetroLLM-Bench：评估语言模型作为交通亭运行时的表现)\n- **社区热度**: `👍 32 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10016)\n- **研究任务**: 评估语言模型作为交通售票亭（transit kiosk）策略层的能力。\n- **核心亮点**: 提出了 MetroLLM-Bench，包含 955 个案例，覆盖 6 个真实的地铁系统（37 到 414 个站点不等）和 11 个类别（包括路线规划、票价计算、中断处理、无障碍设施和对抗性输入等）。模型需要调用结构化工具并提交机器可渲染的终端状态。评估包含 14 个确定性评分组件（Tier 1）和 8 个语义质量组件（Tier 2）。\n- **深度解析**: 实验评估了来自 6 个供应商的 26 个模型。在留出集上，通过参数高效微调（PEFT）训练的 4B Qwen 3.5 学生在 Tier 1 上超过了 GPT-5.6 的两个层级（91.3 对 90.6 和 90.0），并在最大推理努力下匹配了 GPT-5.4 full（91.4），且 footprint 仅为 2.6 GB Q4_K_M。更大的 9B 和 27B 学生并未带来进一步的 Tier 1 提升，且 PEFT 带来的增益随模型规模增大而减小。确定性基于规则的基线在 Tier 1 达到 84.6 分，语言模型的优势主要集中在策略适应、复合场景、无障碍设施和时间推理上。Muse Glimmer 30B 在综合排名中领先。\n- **领域归类**: [大语言模型, 智能体, 模型评估, 实际应用]\n---\n\n### 43. Steering Geometry: Validating Human Value Geometry in LLM Steering Space (引导几何：验证大语言模型引导空间中的人类价值几何结构)\n- **社区热度**: `👍 32 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06289)\n- **研究任务**: 研究大语言模型（LLMs）引导向量（steering vectors）的潜在几何结构是否反映了人类价值观和道德中理论指定的结构。\n- **核心亮点**: 使用 Schwartz 的基本人类价值观理论作为细粒度框架，引入了一个包含 26K 样本的基准，涵盖 20 种人类价值观。分析了分布驱动方法（如 CAA, SphericalSteer, ODESteer）和以行为为中心的方法（如 COLD-Steer, BiPO）在不同模型家族和规模上的表现。\n- **深度解析**: 研究发现，分布驱动方法能够恢复与理论预测一致的人类价值拓扑结构（Spearman ρ 高达 0.51，p \u003c 10^{-13}）。相比之下，以行为为中心的方法虽然实现了相当的引导性能，但与预期的价值几何结构几乎没有相关性。几何保真度随着模型规模的增加而提高，但在指令微调后下降。此外，更好的几何对齐能带来更符合人类价值观的跨价值迁移（引导一个价值能正确提升兼容价值并抑制对立价值）。\n- **领域归类**: [大语言模型, 模型对齐, 可解释性, 价值观]\n---\n\n### 44. Beyond Solver Verdicts: Generative Reward Models for Autoformalization (超越求解器裁决：用于自动形式化的生成式奖励模型)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11085)\n- **研究任务**: 解决神经符号系统中数学求解器无法判断形式化翻译是否与指定形式化保持严格参考等价（reference-equivalence）的问题，即“保留裁决的不忠实（VPU）”漏洞。\n- **核心亮点**: 形式化了 VPU 漏洞，并从理论上证明仅基于结构和裁决的验证启发式方法在检测这些欺骗性有效轨迹时受限于随机水平。引入了生成式验证（GenV），通过将离线 Z3 等价预言机蒸馏为无参考的连续参考等价分数，复用语言模型的原生词汇空间。\n- **深度解析**: 通过决策投影对数透镜和稀疏自编码器的机制分析表明，这种生成式读取原生地提取了精确的空间误差坐标，无需显式的定位训练。经验上，其预言机挖掘的验证器（GenV+HN）在参考等价验证中达到了 0.961 的 AUROC，能够零样本泛化到未见过的翻译器和不同的形式化风格，并在智能体测试时计算分配中带来了 11.3 个百分点的下游准确率提升。\n- **领域归类**: [大语言模型, 神经符号系统, 形式化验证, 奖励模型]\n---\n\n### 45. Negative Self-Distillation: Learning to Reason by Avoiding Flaws (负自蒸馏：通过避免缺陷来学习推理)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11699)\n- **研究任务**: 解决在策略自蒸馏（OPSD）中，由于强迫学生模仿基于特权信息的人工自信推理轨迹，从而抑制了不确定性表达和探索性自我纠正行为，导致 LLM 在复杂推理任务上性能下降的问题。\n- **核心亮点**: 提出了负自蒸馏（NSD）框架，通过偏离有缺陷的推理而不是模仿特权解决方案来优化 LLM。NSD 不依赖真实答案或外部监督，而是利用模型自身生成特定于问题的负条件（如扮演“粗心的推理者”），并将学生的分布推离这个自生成的负教师。\n- **深度解析**: 朴素地应用遗忘目标会导致问题，因为有缺陷的推理 token 与基础语言 token 混淆，无差别惩罚会破坏基础语言能力。作者设计了一种动态门控机制，自动识别并隔离推理关键 token，确保梯度更新仅针对行为缺陷，同时保留模型的语言先验。经验表明，NSD 持续优于 OPSD 和其他无标签自举强化学习基线。\n- **领域归类**: [大语言模型, 模型训练/优化, 推理能力, 自蒸馏]\n---\n\n### 46. Causal Foundation Models (因果基础模型)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03003)\n- **研究任务**: 将基础模型范式引入因果推断，提出因果基础模型（CFMs），即预训练的神经网络，能够使用上下文学习在全新的数据集上估计因果量（如平均处理效果），而无需更新模型。\n- **核心亮点**: 提供了一种对该新兴领域的实用介绍。总结了因果推断和机器学习的必要背景，然后讨论 CFMs。包含示例代码和 Jupyter notebooks。\n- **深度解析**: 摘要未提供\n- **领域归类**: [因果推断, 基础模型, 机器学习理论]\n---\n\n### 47. HyQuant: Hybrid-Precision Quantization for LLM Attention (HyQuant：用于大语言模型注意力的混合精度量化)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27875)\n- **研究任务**: 解决大语言模型注意力模块在极低比特宽度下量化会引入大误差导致性能下降的问题，提出一种混合精度量化设计以更好地平衡准确性和效率。\n- **核心亮点**: 提出了 HyQuant，一个高效的 LLM 注意力混合量化框架。它将大多数注意力状态量化为低比特格式，同时保留一小部分垂直线 token（vertical-line tokens）和局部窗口状态为高精度。使用轻量级的垂直线感知注意力模式信号来选择这些对精度至关重要的区域。\n- **深度解析**: 在 Prefill 阶段，HyQuant 使用混合精度量化注意力算子，以全精度保留垂直线 token 和局部滑动窗口，同时量化其余上下文。在 Decode 阶段，将相同原理应用于 KV-cache 压缩，并将 KV 反量化与注意力计算融合以提高内存和硬件效率。在各种任务、模型和数据集上，HyQuant 以极其简单的设计保持了几乎无损的准确性。\n- **领域归类**: [大语言模型, 模型压缩/量化, 推理加速]\n---\n\n### 48. TempCloze: Can Video-LLMs Identify the Missing Middle? (TempCloze：视频大语言模型能识别缺失的中间部分吗？)\n- **社区热度**: `👍 30 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.01515)\n- **研究任务**: 评估视频大语言模型（Video-LLMs）的视觉时间推理能力，减少现有基准中由语言介导带来的语言捷径问题。\n- **核心亮点**: 引入了 TempCloze，一个视频完形填空基准。给定视频的开始和结束片段，模型必须从四个候选中识别出真正缺失的中间部分。包含 1,521 个精心过滤的视频（主要来自长镜头和第一人称视频）。构建了三个维度的同源干扰项：语义（应该发生什么事件）、对齐（应该在何时发生）和进展（应该如何展开）。\n- **深度解析**: 对 10 个闭源和 21 个开源 Video-LLMs 的评估显示，“对齐（Alignment）”是主要瓶颈：模型通常能识别合理的语义内容和本地事件进展，但在时间对齐上挣扎。进一步对 TempCloze-Mixed 和 TempCloze-Hard 进行的错误模式和行为敏感性分析，检查了候选顺序、上下文方向、可见跨度、帧密度和测试时缩放如何影响模型选择。\n- **领域归类**: [多模态大模型, 视频理解, 时间推理, 模型评估]\n---\n\n### 49. Kalman Delta Networks: Uncertainty-aware Associative Memory (卡尔曼 Delta 网络：感知不确定性的关联记忆)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07816)\n- **研究任务**: 解决线性注意力模型中固定大小循环记忆在每次 token 更新时无法跟踪记忆估计置信度（不确定性）的问题，提出一种感知不确定性的关联记忆新模型家族。\n- **核心亮点**: 将循环关联记忆重新表述为线性-高斯状态空间模型（卡尔曼滤波器是最优递归估计器），引入了卡尔曼 Delta 网络（KDNs）。在 KDNs 中，状态转移同时传播记忆状态及其不确定性，允许卡尔曼增益根据累积证据和观察可靠性对每个残差写入进行加权。\n- **深度解析**: 由于精确跟踪需要密集的状态依赖 Riccati 递归，不适合 GPU 并行的线性注意力扫描，作者引入了两种扫描兼容的 KDN 近似方法：对角 KDN（通过在线均值场变分推断投影到对角高斯族）和各向同性 KDN（每个头使用单一不确定性标量）。它们的不确定性递推是 Mobius 映射，支持对数并行深度的关联扫描。在 750M 和 1.3B 参数的受控预训练中，KDN 变体在困惑度和平均下游准确率上持续优于最先进的线性注意力模型。\n- **领域归类**: [大语言模型, 模型架构, 线性注意力, 状态空间模型]\n---\n\n### 50. Recursive Code World Models: Building Complex Worlds through Recursive Scene Programs (递归代码世界模型：通过递归场景程序构建复杂世界)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11499)\n- **研究任务**: 解决代码世界模型在表示可执行程序时，无法确定如何构建复杂世界的问题，提出从单张参考图像重建复杂 3D 世界的框架。\n- **核心亮点**: 引入了递归代码世界模型（RCWM），将递归场景程序（RSP）表示与递归调用自身的构建求解器结合。RSP 将可执行世界表示为组合场景代码。每次求解器调用遵循相同过程：建立整体、递归重建未解析部分、重新审视整体以优化组合。这种“全局-局部-全局”递归让细粒度结构拥有自己的感知和编辑循环，同时保留场景级几何和关系。\n- **深度解析**: 参考对齐的视图在层级间传播共享的相机投影，而父级重新审视解决了局部细化后出现的边界、空间关系和共享错误。视觉-语言编码智能体直接比较参考图像与场景渲染以指导细化、递归下降和返回。在复杂场景中，RCWM 优于先前基于代码的图像到场景重建方法。消融研究支持了递归构建的优势，并表明更深的调用可以改善更细粒度的重建。\n- **领域归类**: [多模态大模型, 3D 视觉, 世界模型, 代码生成]\n---\n\n### 51. World in World: Explore the World with World Models (世界中的世界：利用世界模型探索世界)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11548)\n- **研究任务**: 解决自回归视频世界模型在灵活控制方面的挑战，实现从新视角探索源视频，同时保持与记录事件的同步、合理补全新暴露区域并在重访时恢复外观。\n- **核心亮点**: 提出了一种无需训练的推理时接口（World in World），将异构控制证据转换为带有相机和时间标签的干净视觉状态，通过冻结的因果视频模型的原生自注意力进行读取。支持相机控制的重渲染、长视野重访和人体动作迁移。\n- **深度解析**: 该方法利用对应路由器结合持久点身份和几何信息建立 token 对应关系，引导受支持的查询匹配源视频 token。引入证据级注意力 CFG (EWA) 独立调节每个辅助通道的额外贡献。在相机控制视频重渲染任务上评估了感知质量、时间一致性和相机跟随精度。具体的评估指标数值和实验结果摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 世界模型]\n---\n\n### 52. Studying Image Tokenizers as Visual Languages in Unified Multimodal Models (将图像分词器作为统一多模态模型中的视觉语言进行研究)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09143)\n- **研究任务**: 研究图像分词器（视觉语言）在统一多模态模型中与文本联合建模时的表现，评估不同分词器设计对多模态可学习性和下游任务的影响。\n- **核心亮点**: 构建了一个受控的纯自回归测试平台，跟踪多模态持续预训练期间特定任务的验证损失。发现损失应按任务分析，且 I2T（图到文）损失比 T2I（文到图）损失能提供更一致的信号并关联生成与理解性能。\n- **深度解析**: 研究表明，更好的重建不一定带来更低的特定任务损失或更强的下游性能，且图像分词器的选择会影响联合优化下的文本建模。通过案例研究探讨了判别器、语义监督和词汇量大小三个分词器设计轴的影响。具体的案例研究实验结果和对比数字摘要未提供。\n- **领域归类**: [多模态学习, 图像分词器, 大语言模型]\n---\n\n### 53. RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks? (RoboSPA：VLA 模型能否超越简单场景和短视野任务？)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05324)\n- **研究任务**: 诊断视觉-语言-动作（VLA）模型在空间和时间复杂度增加时的具身推理能力，解决现有数据集和基准测试在评估模型推理方面的局限性。\n- **核心亮点**: 引入了 RoboSPA，一个大规模机器人操作数据集和基准测试，专注于细粒度空间推理和长视野程序规划两个核心维度。涵盖 10 个任务类别、56 个基础任务，并在 5 个难度级别下实例化为 280 个变体，收集了 527K 条轨迹。\n- **深度解析**: 除了二元成功率，RoboSPA 引入了诊断指标进行更详细的评估。实验表明，当前的 VLA 系统在复杂空间关系、精确的低级执行和内存密集型规划方面仍然存在困难。具体的实验成功率等结果数字摘要未提供。\n- **领域归类**: [机器人学, 具身智能, 视觉-语言-动作模型]\n---\n\n### 54. Enoki: Efficient Multi-Level Hallucination Detection (Enoki：高效的多级幻觉检测)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.00581)\n- **研究任务**: 解决大语言模型在高风险场景中部署时的事实性挑战，提出一种高效的多级（声明级和跨度级）幻觉检测方法。\n- **核心亮点**: 提出 Enoki，一个用于多级幻觉检测的开放信息提取框架。它提取以文本为锚点的关系事实，根据证据进行验证，并将不支持的事实映射回幻觉跨度，从而在无需单独对齐的情况下实现声明级验证和跨度级定位。\n- **深度解析**: Enoki 支持基于 LLM、基于编码器和基于规则的提取机制，通过通用接口平衡准确性和推理成本。实验表明，Enoki 在资源消耗更少的情况下与强大的声明级系统保持竞争力，并在细粒度的跨度和实体级定位上取得了优异性能。同时发布了 EnokiQA 双粒度数据集。具体的性能对比数字和资源消耗数值摘要未提供。\n- **领域归类**: [自然语言处理, 幻觉检测, 信息提取]\n---\n\n### 55. Building Multilingual Bridges: Data Mixing as the Pillar of Generalization for In-Language Reasoning (构建多语言桥梁：数据混合作为语言内推理泛化的支柱)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10445)\n- **研究任务**: 提升推理语言模型的非英语推理能力（L2 推理），使模型能够一致地使用用户提示的语言进行推理，解决模型过度依赖英语的问题。\n- **核心亮点**: 从数据中心的角度出发，研究如何优化 SFT（监督微调）中的数据组合和调度以实现推理泛化。构建了 3.35B 规模的 Tiny Aya L2-Thinker，在 60 种语言的 6 个基准测试中实现了超过 93% 的 L2 推理率。\n- **深度解析**: 研究表明，将 L2 推理泛化到未见语言的路径在于更广泛的语言覆盖、现成的多语言非推理数据以及充足的英语推理骨干。推理是一种与语言无关的行为，可以通过仔细的数据混合跨语言转移，而无需在每个目标语言中进行推理监督。具体的其他基准测试得分和实验结果数字摘要未提供。\n- **领域归类**: [自然语言处理, 多语言大模型, 推理能力]\n---\n\n### 56. WorldSculpt: Generating Compositional Worlds from Grounded Videos (WorldSculpt：从接地视频中生成组合世界)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05416)\n- **研究任务**: 解决在包含数百个对象的杂乱场景中生成组合 3D 表示的问题，将场景表示为放置在共享世界坐标系中的独立对象网格集合。\n- **核心亮点**: 提出通过将强大的单对象 3D 生成先验（Pixal3D）适应多视图观察来组合生成复杂场景。扩展了多视图条件路径，使对象生成基于多个位姿观察，无需场景级训练即可泛化到严重遮挡的大型场景。\n- **深度解析**: 引入了 UE-MeshyScene，一个包含数百个对象、逐对象标注和真实网格的密集杂乱场景照片级真实基准。在单对象、受控多对象和 UE-MeshyScene 评估中，该方法一致优于先前方法，且场景复杂度和遮挡增加时优势更大。具体的性能提升数字摘要未提供。\n- **领域归类**: [计算机视觉, 3D 生成, 场景重建]\n---\n\n### 57. SWE-Bench Pro Verified: A Reliable Benchmark for Software Engineering Agents (SWE-Bench Pro Verified：软件工程智能体的可靠基准测试)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08149)\n- **研究任务**: 解决 SWE-Bench Pro 基准测试在评估软件工程智能体时存在的可靠性问题（奖励黑客和任务质量问题），提供一个更可信的评估基准。\n- **核心亮点**: 提出 SWE-Bench Pro Verified，通过结合反黑客保护措施（消除主要泄漏渠道）和任务细化（最小化纠正有缺陷实例中的不一致）来解决原有基准的缺陷。\n- **深度解析**: 在 SWE-Bench Pro Verified 上的评估显示，某些模型的表现比以前报告的要差得多，表明现有结果可能高估了真实的软件工程能力。该基准为评估软件工程智能体提供了更值得信赖的标准。具体的模型得分和性能下降数字摘要未提供。\n- **领域归类**: [软件工程, 智能体评估, 基准测试]\n---\n\n### 58. Generative Late-Interaction Embeddings For Visual Document Retrieval (用于视觉文档检索的生成式晚期交互嵌入)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11808)\n- **研究任务**: 解决视觉文档搜索中晚期交互检索方法在严格存储预算下性能急剧下降的问题，实现存储高效的检索。\n- **核心亮点**: 发现向量位于单位球面上并集中在低维流形上。提出生成式晚期交互嵌入（GLIE），每页学习 k 个向量作为轻量级索引和重建完整嵌入集的基础。查询时仅在 k 个向量上搜索，解码器仅将顶级候选扩展回所有 N 个向量进行精确重打分。\n- **深度解析**: 在 ViDoRe v1 上，每页 4 个向量的 GLIE 保留了未压缩系统近 80% 的 nDCG@5，优于先前最好的事后方法（70%）。该方法使用 415K 参数网络在不到 3 个 GPU 分钟内拟合。在匹配的训练预算下，微调编码器甚至达不到 GLIE 的免训练阶段水平。这些模式在第二个编码器和 ViDoRe v2 上同样成立。\n- **领域归类**: [信息检索, 视觉文档检索, 向量压缩]\n---\n\n### 59. Environments as Scaffold: Enriching Feedback to Bootstrap Self-Evolving Agents in Long-Horizon Tasks (环境作为脚手架：丰富反馈以引导长视野任务中自我进化的智能体)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08404)\n- **研究任务**: 解决使用强化学习（RL）训练大语言模型作为长视野任务自主智能体时面临的严重奖励稀疏问题。\n- **核心亮点**: 提出从环境侧适应的范式转变，构建反馈丰富环境（FEEs）。通过将环境从动作指导转变为观察丰富，在集内探索和集间进化的后期阶段重新制定环境。\n- **深度解析**: 在 SciWorld 和 BFCL 基准测试上使用多种 Qwen3 模型规模和 RL 算法（GRPO, GSPO, DAPO）的大规模实验表明，FEEs 持续优于标准设置。分析揭示 FEEs 能稳定训练动态、促进困难任务中的主动状态空间探索、确保环境指导内化到策略权重中，并确定了组内反馈一致性是稳定优化的关键边界。具体的实验提升数字摘要未提供。\n- **领域归类**: [强化学习, 智能体, 大语言模型]\n---\n\n### 60. Measuring Language Transfer in Robot Policies: Adding Greek to a Cosmos3 Vision-Language-Action Policy (测量机器人策略中的语言迁移：为 Cosmos3 视觉-语言-动作策略添加希腊语)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07470)\n- **研究任务**: 研究在缺乏机器人演示语料库的情况下，如何为开放视觉-语言-动作堆栈添加非英语（希腊语）支持，并解决低资源语言策略本地化中的测量挑战。\n- **核心亮点**: 仅使用机器重述的指令且不改变架构的情况下添加希腊语。强调了测量的重要性，指出多种合理的测量工具会得出错误结论。在包含 90 个任务的判别性套件上，双语训练比对照组产生了 6.7-7.1 分的稳定优势，并达到了约五分之二的英语性能。\n- **深度解析**: 研究发现策略会过拟合翻译者的措辞，每个任务使用 7 种措辞进行训练可以大致减半这种惩罚。从语言适应的世界模型热启动和解冻文本塔都会降低性能。提出了低资源机器人策略本地化的两个实际要求：在信任指标前建立保证的零假设，并在多种子间复制低资源语言结果。具体的其他实验结果数字摘要未提供。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 多语言迁移]\n---\n\n### 61. What Did I Just Say? Self-Listening for Full-Duplex Speech Models (我刚才说了什么？全双工语音模型的自我监听)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05592)\n- **研究任务**: 解决全双工语音模型在被打断时的“锚点中断”（anchor interruption）问题，即模型认为自己说的话与实际播放给用户的话不一致的问题。\n- **核心亮点**: 提出“Self-Listening”（自我监听）方法，将用户语音、模型文本和模型实际播放的语音交错处理，并将实际语音输出作为输入流反馈给模型；引入AnchorSpeech数据集用于评估模型对已说出内容的追踪能力。\n- **深度解析**: 在全双工模型中，文本生成、语音合成和音频播放是异步进行的，这导致模型的内部认知与实际播放内容存在偏差。自我监听机制通过将实际播放的语音反馈给模型，使中断恢复能够基于用户实际听到的内容进行。AnchorSpeech数据集提供了同质化的训练和测试集，用于评估模型在被打断前能否与最后一个完成的项目保持一致响应。实验表明，配备自我监听机制的模型在锚点性能上优于全双工基线模型（具体的性能提升数字摘要未提供）。\n- **领域归类**: [语音处理, 全双工对话, 大语言模型]\n---\n\n### 62. EVOHARNESSBENCH: Can Your Agents Keep Pace with an Evolving Harness? (EVOHARNESSBENCH：你的智能体能跟上不断进化的执行环境吗？)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04280)\n- **研究任务**: 评估大语言模型智能体在工具、技能和专家智能体等执行环境（harness）持续进化情况下的表现与适应能力。\n- **核心亮点**: 提出EVOHARNESSBENCH基准，将非平稳性（变化）置于外部提供的执行环境本身，而非任务流中；包含17个多阶段执行环境流，涵盖802个任务、520个工具、42个技能和62个智能体；评估部署评估和自我进化适应评估两种设置。\n- **深度解析**: 现有的持续学习基准通常保持执行环境固定而改变任务流，而该基准改变了这一设定。研究揭示了三个持续存在的差距：1. 仅扩展执行环境就会降低在之前解决的任务上的性能，产生执行环境诱导的遗忘；2. 自我进化适应带来的收益在不同阶段、能力轴和环境中不一致；3. 保留和适应可能相互拉扯，保留早期能力不一定能提高对新能力的适应，反之亦然。这确立了执行环境进化是构建能跟上环境进化同时保留有效行为的智能体的独特挑战（具体的性能下降或提升数字摘要未提供）。\n- **领域归类**: [AI智能体, 持续学习, 基准测试]\n---\n\n### 63. UniH^3: Unifying Hierarchical Homogeneity and Heterogeneity for All-in-One Medical Image Restoration (UniH^3：统一层次化同质性与异质性以实现多合一医学图像复原)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11156)\n- **研究任务**: 使用单一通用模型解决跨模态和跨退化类型的多种医学图像复原任务（All-in-One MedIR）。\n- **核心亮点**: 提出UniH3框架，统一层次化同质性和异质性；引入层次化同质性记忆（H2M）模块提取并检索同质性先验，通过同质性引导注意力（HGA）机制注入复原流程；设计层次化异质性平衡器（H2B）缓解任务间和任务内冲突。\n- **深度解析**: 现有方法多关注任务间异质性，忽略了医学图像中广泛共享的解剖结构等同质性。H2M模块在训练期间从高质量图像中逐步提取任务内和任务间同质性先验，并自适应检索最相关的先验。H2B缓解优化过程中的冲突，促进平衡的多任务学习。在MedIR-2D-500K和MedIR-3D-3K两个大规模基准上的实验表明，UniH3在多合一和单任务医学图像复原中均取得了SOTA性能（具体的评估指标数字摘要未提供）。\n- **领域归类**: [医学图像处理, 图像复原, 计算机视觉]\n---\n\n### 64. CoVeR: Coverage-Based Token Pruning for Multi-View 3D Reasoning in VLMs (CoVeR：用于VLM多视图3D推理的基于覆盖率的Token剪枝)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08345)\n- **研究任务**: 解决2D视觉语言模型（VLM）在多视图3D推理中产生的大量冗余视觉Token导致计算成本高昂的问题。\n- **核心亮点**: 提出CoVeR，一种确定性、免训练的Token选择器，仅使用Token坐标而无学习信号；通过选择能集体覆盖场景每个区域的Token，强制执行精确的每场景预算，打破体素化饱和平台，避免学习重要性方法中的近似重复选择。\n- **深度解析**: 现有的视觉Token剪枝方法在3D多视图设置中存在局限：基于学习的重要性方法会保留显著区域的近似重复Token，而体素化方法无法强制执行精确的Token预算且在多视图重叠时饱和。CoVeR证明了空间覆盖率与3D推理性能相关。实验表明，CoVeR在三个3D推理基准上均优于先前的SOTA，并作为即插即用模块在四个VLM中泛化。值得注意的是，仅使用约8%的视觉Token，它保留了93.5%的全Token性能，在基准上平均超越SOTA 3.9个百分点。\n- **领域归类**: [视觉语言模型, 3D推理, Token剪枝]\n---\n\n### 65. CARDEA: Auditable Reasoning Grounded in Spatial Evidence for End-to-End Coronary Angiography Interpretation (CARDEA：基于空间证据的可审计推理用于端到端冠状动脉造影解读)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06931)\n- **研究任务**: 开发一个统一的大型视觉语言模型作为冠状动脉造影（CAG）流程的推理核心，提供可审计的决策过程和全面的开放式评估。\n- **核心亮点**: 提出CARDEA，仅使用公开数据集和闭式任务进行三阶段训练（视觉特征对齐、自蒸馏Chain-of-Box冷启动、带CoB奖励的可验证奖励强化学习RLVR）；能够暴露结论背后的可审计空间证据；在闭式任务上的RLVR激发了开放式报告生成能力。\n- **深度解析**: 现有AI系统在CAG解读中缺乏可审计性。CARDEA从原始多视图视频到关键帧选择再到研究级诊断运行端到端流程。在领域偏移下的优势分类中准确率达到了0.91（95% CI, 0.86 to 0.95），在复杂性评估中与心脏病专家相当（准确率0.90，95% CI, 0.82 to 0.97）。只有RLVR提高了零样本报告生成能力，将其血管严重程度macro-F_1提升至0.686（95% CI, 0.664 to 0.707），远高于未微调基础模型的0.513和始终正常基线的0.312。临床使用需要针对专家心脏病学家进行前瞻性验证。\n- **领域归类**: [医疗AI, 视觉语言模型, 强化学习]\n---\n\n### 66. IdeaAMBIG: Benchmarking Implementation-Critical Gaps in Research-Idea Specifications (IdeaAMBIG：对研究想法规范中实现关键差距的基准测试)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10539)\n- **研究任务**: 评估研究方法的编码准备就绪度（codification readiness），即规范是否提供了足够的信息让实现者或编码智能体在无需 unsupported assumptions 的情况下构建预期方法。\n- **核心亮点**: 提出IdeaAMBIG基准，包含660个基于证据的实例（163个来自可复现性报告和GitHub issues的真实差距，497个注入到编码就绪参考中的受控合成差距）；评估编码准备就绪度评估、缺陷定位和澄清动作生成三种能力。\n- **深度解析**: 研究想法可能新颖且合理，但方法规范可能不足以忠实实现。IdeaAMBIG评估了13个LLM，最佳模型在真实实例上的宏观缺陷恢复率（Macro Defect Recovery Rate）仅为9.6%，但在提供缺陷的情况下，宏观澄清动作成功率达到80.6%。在oracle研究中，提供黄金解决方案将下游编码就绪率从14%提升至98%。在所有评估模型中，缺陷定位是主要瓶颈，而在给定缺陷的情况下澄清能力更强（其他模型的具体对比得分摘要未提供）。\n- **领域归类**: [大语言模型, 科学发现, 基准测试]\n---\n\n### 67. ActReview: Rebuttal-Guided Training Data and Rubric Rewards for Actionable Peer Review Generation (ActReview：用于可操作同行评审生成的反驳引导训练数据与规则奖励)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09076)\n- **研究任务**: 生成可操作的同行评审（Actionable Peer-review），不仅指出弱点，还引导作者进行具体修改，分解为诊断声明生成和修改建议生成两个子任务。\n- **核心亮点**: 提出ActReview，一种反驳引导的后训练框架，将论文特定的诊断与具体、有根据的修改计划联系起来；利用OpenReview上的真实评论-反驳线程构建ActReview-40K数据集；使用多任务SFT和基于候选感知、弱点特定规则奖励的GRPO对Qwen3-8B-Base进行后训练。\n- **深度解析**: 作者的反驳揭示了解决审稿人担忧的合理行动，可为面向修改的反馈提供潜在监督。ActReview-40K通过将审稿人弱点与作者回应相匹配，并将反馈建立在局部论文证据之上构建而成。引入了ActReview-Bench（1000个人工策划实例）用于评估。实验表明，ActReview在可操作性和根据性上优于先前的专用评审生成模型，同时与强大的基于提示的LLM保持竞争力。人类评估证实了修改有用性的提高，但也揭示了技术准确性方面仍存在差距（具体的评分或差距数字摘要未提供）。\n- **领域归类**: [大语言模型, 自然语言处理, 学术辅助]\n---\n\n### 68. TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model (TANGO：使用全身视觉-语言-动作模型在杂乱环境中的人形导航)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09158)\n- **研究任务**: 研究人形机器人在杂乱室内环境中的导航问题，需要连续的几何感知全身适应（如手臂放置、躯干调整和步态调节）以实现无碰撞移动。\n- **核心亮点**: 提出TANGO，首个用于语言条件人形穿越杂乱环境的全身视觉-语言导航框架；给定自然语言指令和第一人称RGB观察，直接预测29自由度关节空间动作；完全在仿真中训练，通过全局路径规划、运动学全身运动生成、障碍物感知运动编辑和基于RL的跟踪合成多样化的无碰撞穿越行为。\n- **深度解析**: 与传统将导航建模为2D路径规划的方法不同，TANGO直接输出全身控制动作。该训练流程为学习语言条件的全身策略提供了动态可行的动作监督。在广泛的仿真实验中，TANGO在视觉-语言导航中展示了SOTA性能，并在需要障碍协商的复杂场景中超越了强大的模块化基线（具体的性能指标数字摘要未提供）。最后，在Unitree G1人形机器人上零样本部署TANGO，在杂乱的现实世界场景中观察到稳健的语言引导穿越，且无需在任何现实世界导航数据上进行训练。\n- **领域归类**: [机器人学, 具身智能, 视觉语言动作模型]\n---\n\n### 69. Adaptive Bridge: A Proxy-Based Decoupling Layer for Mitigating DDS Backpressure in ROS 2 (Adaptive Bridge：用于缓解ROS 2中DDS背压的基于代理的解耦层)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.15380)\n- **研究任务**: 解决在基于ROS 2和DDS构建的系统中，单个网络受损或受限的订阅者在RELIABLE主题上引起的背压（backpressure）问题，该背压会降低所有其他订阅者（包括安全关键的订阅者）的吞吐量和延迟。\n- **核心亮点**: 提出Adaptive Bridge，一种基于代理的解耦层，通过主题拆分和动态速率控制将关键订阅者与受损或非关键订阅者隔离；代理作为中间人订阅原始主题，并向两个独立的DDS写入者重新发布消息（一个用于关键节点的RELIABLE写入者，一个用于非关键/受损节点的BEST EFFORT写入者）；基于探测的分类器主动监控订阅者健康并实时调整速率限制。\n- **深度解析**: 当发布者的DDS写入者无法接受新样本时，会导致背压。Adaptive Bridge通过隔离受损节点来保护发布者和关键节点。在使用Gilbert-Elliott突发无线丢失模型的可复现Docker测试环境中评估，结果表明使用Adaptive Bridge可将关键订阅者的尾部p95延迟从高达15秒降低到1.55毫秒，同时保留了发布者配置的吞吐量。\n- **领域归类**: [机器人操作系统, 分布式系统, 网络通信]\n---\n\n### 70. PARSER: Read in Parallel, Reason in Depth for Long-Context LLM Agents (PARSER：长上下文LLM智能体的并行阅读与深度推理)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06702)\n- **研究任务**: 解决顺序记忆智能体在处理长文档时，将文档遍历与推理深度耦合导致的对证据位置敏感以及推理延迟与文档长度线性相关的问题。\n- **核心亮点**: 提出PARSER，将阅读与推理分离；一个轻量级子智能体库各自绑定单个块并行阅读整个文档，而主智能体通过迭代散播-收集（scatter-gather）轮次进行深度推理；所有可学习行为集中在主智能体中，使用强化学习优化，子智能体保持冻结的现成模型。\n- **深度解析**: 在每一轮中，主智能体向所有子智能体广播查询，聚合返回的证据，并根据目前发现的内容制定更深层的后续查询。在上下文从7K到896K tokens的多跳QA中，具有4B主干的PARSER平均比最强的顺序记忆基线高出5.7分，在896K tokens时高出12.0分。扩展到9B主干时，PARSER超越DeepSeek-V4-Pro 6.3分（其他基线的具体绝对得分摘要未提供）。对照实验证实，PARSER对证据位置、顺序和距离的扰动具有鲁棒性（这些条件会导致顺序方法准确率大幅波动），同时将推理延迟降低高达11倍。\n- **领域归类**: [大语言模型, 智能体, 长上下文处理]\n---\n\n### 71. Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference (不要丢弃 Dropout：优化层稀疏性以实现高效的 LLM 训练和推理)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05275)\n- **研究任务**: 优化大语言模型（LLM）预训练中的层 Dropout（随机深度）策略，以提升训练效率和推理速度。\n- **核心亮点**: 证明层 Dropout 应被用于最先进的 LLM 训练并确立最佳实践；在相同训练 FLOPs 下可降低 loss，或在给定步数下节省高达 25% 的训练 FLOPs；支持后训练优化（如提前退出、中间层跳过等），实现高达 1.5 倍推理加速且精度损失可忽略。\n- **深度解析**: 研究通过优化层分布、时间调度和优化器超参数来发挥层 Dropout 的最大效用。实验跨越了从 271M 到 8.2B 参数模型和高达 160B tokens 数据集的 2400 多次训练实验，证明了其在大规模训练中的可靠性，且所有预训练实验均在 Cerebras CS-3 系统上完成。\n- **领域归类**: [大语言模型, 模型训练优化, 推理加速]\n---\n\n### 72. DRG-MAPPO: Hierarchical Dynamic Role-Graph Multi-Agent Reinforcement Learning for Cooperative Air Combat (DRG-MAPPO：用于协同空战的层次化动态角色图多智能体强化学习)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11155)\n- **研究任务**: 解决多智能体强化学习（MARL）在协同空战中面临的复杂战术协调、关系建模和任务分配问题。\n- **核心亮点**: 提出 DRG-MAPPO 框架，结合图关系建模与动态角色分配；实现战术策略与协同执行的联合优化；在实验中达到 87% 的最先进胜率。\n- **深度解析**: 采用分层架构，高层策略通过动态角色分配机制确定战术职责（如“领导者”和“支持者”），低层策略基于角色和图关系特征执行离散机动动作。此外，设计了目标优先级辅助任务以促使智能体产生集火等协同行为。\n- **领域归类**: [多智能体强化学习, 协同空战, 图神经网络]\n---\n\n### 73. Think Before You Link: Rarity, Reasoning, and Retrieval in Multilingual Entity Linking (链接前先思考：多语言实体链接中的稀有性、推理与检索)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10745)\n- **研究任务**: 提升多模态实体链接系统在处理罕见实体时的性能，并重新定义和评估实体的“稀有性”。\n- **核心亮点**: 使用知识图谱结构指标重新定义实体稀有性，揭示了 SOTA 模型在罕见实体上准确率大幅下降（15.4-39.9%）的问题；提出一种无需训练的框架，结合视觉语言模型的推理与检索能力；在 MERLIN 基准上整体准确率提升 6.9%，罕见实体切片提升高达 23.3%。\n- **深度解析**: 研究发现推理和检索具有互补性：单独推理不能显著提升罕见实体准确率，单独检索可能损害整体准确率，两者结合效果最佳。此外，研究发布了 MERLIN-Rare 测试集，用于针对五种语言（印地语、印尼语、日语、泰米尔语、越南语）罕见实体的定向评估。\n- **领域归类**: [多模态实体链接, 知识图谱, 视觉语言模型]\n---\n\n### 74. Revisiting Complete Reasoning Traces for Post-Training (重新审视后训练中的完整推理轨迹)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07103)\n- **研究任务**: 探究大语言模型（LLM）在后训练（如监督微调）中是否真正需要学习包含冗余和弯路的完整推理轨迹。\n- **核心亮点**: 发现完整推理轨迹提供的收益有限，而部分截断的轨迹依然有效；证明仅使用推理轨迹的端点进行训练，即可一致地改变模型的推理行为，并对强化学习和在线策略蒸馏等后训练方法有益。\n- **深度解析**: 通过基于注意力的分析和受控的 token 移除研究，发现中间 token 对最终推理质量的贡献微乎其微。这表明避免冗余信息可以让 LLM 利用内部知识推断缺失的步骤，从而在已知轨迹端点的情况下生成连贯的替代路径。\n- **领域归类**: [大语言模型, 模型后训练, 推理能力]\n---\n\n### 75. Multi-Grid Post-Training for Long-Form Multi-Shot Video Generation (用于长篇幅多镜头视频生成的多网格后训练)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06373)\n- **研究任务**: 解决长篇幅多镜头视频生成中镜头内运动连贯性和镜头间视觉叙事一致性的问题。\n- **核心亮点**: 提出 MovieGrid 多网格后训练范式，将长视频分解并排列在空间网格上联合建模；在相同 token 预算下，生成的镜头数量是时间打包方法的 6.05 倍；在镜头内（0.9131）和镜头间（0.5914）一致性指标上均达到最先进水平。\n- **深度解析**: 采用无噪声随机网格训练，保留部分干净视觉上下文用于去噪；引入网格嵌入编码网格结构，使用感知角色的故事提示链接重复实体，并通过网格边界损失稳定布局。此外，构建了包含 5.4 万个网格视频的多网格长视频（MGLV）数据集。\n- **领域归类**: [视频生成, 多模态大模型, 计算机视觉]\n---\n\n### 76. VidaForge: Open Research Infrastructure for Video Pretraining Data Recipes (VidaForge：用于视频预训练数据配方的开放研究基础设施)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06652)\n- **研究任务**: 提供一个开放的研究基础设施，以标准化、可复现的方式构建和评估视频预训练数据配方（Data Recipes）。\n- **核心亮点**: 提出 VIDAFORGE，将视频数据配方转化为可执行的五阶段工作流；揭示了数据配方的覆盖率和质量对模型预训练的影响（高覆盖率配方下游得分更高，但损失评估偏好不同）；发布了包含 314 万个场景级片段（总计 6475 小时）的 VIDAFORGE-3M 数据集。\n- **深度解析**: 该基础设施允许在保留每个样本生产方式追溯性的同时，通过改变工作流中的决策来构建替代数据集。研究在 Wan 2.1 和 V-JEPA 2.1 的从头预训练中验证了该工作流，证明了数据配方选择与下游模型性能之间的直接联系。\n- **领域归类**: [视频基础模型, 数据工程, 预训练]\n---\n\n### 77. What LLM Trading Agents Actually Do in Production: A Six-Month, Population-Scale Record from Two Fleets (LLM 交易代理在生产环境中实际做了什么：来自两个舰队的六个月、群体规模记录)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05663)\n- **研究任务**: 在真实生产环境中，对大规模自主大语言模型（LLM）交易代理的实际行为、决策质量和盈利能力进行连续的群体规模测量与分析。\n- **核心亮点**: 提供了长达六个月、涵盖 750 万次模型调用和 30 万次链上动作的真实生产环境记录；发现操作层（如风险滑块、排行榜渲染）比策略文本更能决定代理行为；揭示 LLM 交易代理在波动率管理上存在盲区，且未能有效捕捉市场的上行空间，整体未展现出方向性盈利优势。\n- **深度解析**: 研究详细剖析了代理的仓位大小对波动率盲目（中位数杠杆恒为 5.0x），以及 43.2% 的头寸出现至少 +300 bps 的有利偏移，但其中 49.3% 却以负收益平仓的现象（机械括号策略可恢复 +39.0 bps）。此外，通过前沿模型在 416 个真实生产场景中的配对回放测试，发现各模型家族在决策质量上无显著差异，但在选择稳定性上存在明显不同。\n- **领域归类**: [大语言模型应用, 量化交易, 代理行为分析]\n---\n\n### 78. Puppeteer: Object-Grounded Posture-Aware Co-Speech Gesture Generation (Puppeteer：基于物体接地与姿态感知的协同语音手势生成)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.00369)\n- **研究任务**: 生成在时间上连贯、与语音语义对齐，且能够与周围物理空间和物体相交互（接地）的协同语音手势。\n- **核心亮点**: 提出 Puppeteer 扩散模型，在因果潜空间中进行条件生成，显式考虑姿态约束和物体几何；支持手势插值和补全等时间控制任务；创建了 SceneGes 数据集，这是首个包含具身协同语音手势及对应 3D 物体的合成 3D 数据集。\n- **深度解析**: 将长手势分解为结构化原语，并学习因果变分自编码器（VAE）将其编码为仅依赖过去信息的时间有序潜 token。条件扩散过程综合了语音信号、运动历史、初始姿态参考和物体几何信息，从而合成符合物理一致性的手势，并引入了专门针对该任务的新评估指标。\n- **领域归类**: [手势生成, 多模态生成, 3D 视觉]\n---\n\n### 79. Φ-Bench: Can Large Language Models Engineer the Infrastructure That Powers Them? (Φ-Bench：大语言模型能工程化支撑它们的基础设施吗？)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10226)\n- **研究任务**: 系统评估大语言模型（LLM）在开发、优化和工程化支撑其自身运行的复杂 LLM 基础设施栈方面的能力。\n- **核心亮点**: 提出 Φ-Bench 基准，填补了评估 LLM 进行开放式、长周期 LLM 基础设施工程能力的空白；任务覆盖从局部内核级函数补全到长周期实现及端到端系统优化的全栈范围；揭示了前沿 LLM 在工程化复杂 LLM 基础设施时的当前能力与局限性。\n- **深度解析**: 摘要未提供\n- **领域归类**: [大语言模型评估, 基础设施工程, 代码生成]\n---\n\n### 80. Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization (优化前先提问：用于交互式优化的动态预公式化澄清)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05258)\n- **研究任务**: 解决大语言模型（LLM）在将自然语言问题描述转化为运筹学（OR）优化模型时，因问题描述不完整（如缺失目标、约束或业务规则）而导致的建模错误问题。\n- **核心亮点**: 提出 OR-Clarify 基准，专门用于评估 LLM 在公式化前的澄清能力；提出交互式优化（InterOPT）两阶段框架，能够动态识别关键信息缺口并决定是继续提问还是停止建模；在基于选择的实验中，InterOPT 在精确槽位恢复上大幅超越所有基线模型。\n- **深度解析**: OR-Clarify 基准通过隐藏结构化的关键槽位，并要求代理与模拟用户进行有界交互，来评估槽位恢复、停止行为、隐性假设和交互成本。InterOPT 框架将运筹学辅助重新定义为一种“选择性完整性决策”，即在需要时进行澄清，在准备好时停止，并量化剩余缺失的信息。\n- **领域归类**: [大语言模型应用, 运筹学, 交互式代理]\n---\n\n### 81. StudyBench: Can Self-Evolution Squeeze Textbooks for Olympiad Capability? (StudyBench：自我进化能从教科书中榨取奥林匹克竞赛能力吗？)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.00787)\n- **研究任务**: 评估自我进化方法将原始训练材料转化为可迁移问题解决能力的效率，以衡量模型能否像人类一样通过少量教科书掌握学科并解决难题。\n- **核心亮点**: 提出 StudyBench 物理基准测试，包含评估吸收能力的应用集（教科书难题）和评估迁移能力的迁移集（奥赛级难题）；揭示了自我进化方法存在的“指导鸿沟”（Guidance Gap）和“计算平台期”（Compute Plateau）。\n- **深度解析**: 理想的自我进化方法应能自主从原始训练材料中学习并获得可迁移能力。该基准测试发现，在应用集上的提升很少能迁移到更难的迁移集。即使是最强的方法，与将相同材料作为上下文指导相比，也只弥补了很小一部分差距（指导鸿沟）。此外，所有方法在耗尽计算预算前就达到了饱和（计算平台期），说明剩余差距是方法本身的问题，而非数据或计算资源的问题。关于具体的物理基准测试集规模、测试的具体物理子领域以及所评估的三个基础模型的具体名称，摘要未提供。\n- **领域归类**: [模型评估, 自我进化, 科学推理]\n---\n\n### 82. SAEScientist-Bench: Can AI Agents Conduct Autonomous SAE Interpretability Research? (SAEScientist-Bench：AI 智能体能进行自主的 SAE 可解释性研究吗？)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09113)\n- **研究任务**: 评估 AI 智能体能否作为科学家，利用稀疏自编码器（SAE）工具进行自主的机制发现研究，以弥补递归自我改进中缺乏事后监控和审计的短板。\n- **核心亮点**: 提出 SAEScientist-Bench，让智能体在 Gemma-2-9B-IT 的 Gemma Scope 字典（包含 131K+ 特征）中设计对比探针并发现最优特征；评估维度涵盖激活排名、对比文本上的概念选择性和因果引导。\n- **深度解析**: 递归自我改进（RSI）主要自动化了模型训练，但缺乏对模型学习内容的理解和安全对齐的审计。该基准测试评估了 10 种智能体配置和 20 个任务。结果显示，前沿智能体展现出真正的发现能力，在将目标概念与对比控制分离方面接近专家水平，但在因果生成引导方面仍大幅落后。分析表明，智能体虽然能设计对比来排除虚假候选，但经常误解实验测量结果。关于具体的专家基线数值、智能体配置的具体细节以及因果引导落后的具体差距数值，摘要未提供。\n- **领域归类**: [AI 安全与对齐, 可解释性, AI 智能体]\n---\n\n### 83. SynthGait-19K: A Physically Grounded Synthetic Video Dataset for Gait Parameter Estimation (SynthGait-19K：用于步态参数估计的物理基础合成视频数据集)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08108)\n- **研究任务**: 解决现有步态数据集规模小、视角受限和视觉多样性不足的问题，提供用于单目视频步态参数估计的大规模物理基础合成数据集。\n- **核心亮点**: 发布 SynthGait-19K 数据集，包含 19,272 个行走视频（源自 437 名受试者的 6,427 个 MoCap 序列），并配有 SMPL 动作和 6 种步态参数标注；提出 Gait2Vid 方法统一异构 MoCap 并合成多样化 RGB 视频；提出 GaitXFormer 作为直接 RGB 参考模型。\n- **深度解析**: 从单目视频中准确估计具有临床意义的步态参数对可扩展的移动性评估至关重要。该研究开发了 Gait2Vid 来生成合成数据，并验证了生成视频与条件步态运动学的一致性。基准测试表明，合成监督能有效迁移到真实视频中。研究还发现，空间步态参数对视觉域偏移更敏感，且仅改进人体网格恢复（HMR）重建并不一定能转化为下游步态估计的改进。关于具体的基线模型名称、具体的评估指标数值以及具体的域偏移量化数据，摘要未提供。\n- **领域归类**: [计算机视觉, 数据集, 医疗/健康分析]\n---\n\n### 84. Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents (仅凭分数无法证明发现：用于审计 AI 研究智能体的发现认证协议)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09219)\n- **研究任务**: 为 AI 研究智能体产生的结果提供可执行的恢复和反馈测试，以验证其“发现”的真实性，防止仅凭高分断言发现。\n- **核心亮点**: 提出发现认证协议（DCP），包含 Gate 1（验证密封评估上的有效改进）、Gate 2（匹配智能体提供恢复见证并触发核心否决）和可选的 Gate 3（测量真实反馈的平均效果）；在 SQLite 优化和虚拟催化剂控制中进行了受控审计。\n- **深度解析**: AI 研究智能体结合先验知识、公开来源和实验反馈来产生结果。DCP 将这些结果的声明转化为可执行的测试。在 96 个 episode 的审计中，每次产生 0 次恢复，上限为 0.0468。配对的 30 次真实恢复和 0 次中性恢复通过了 60 对零研究。DCP 为 AI 研究中的有用结果、替代路径和反馈效果提供了通用的证据语言，并包含一个确定性的、无 LLM 的验证器来复现决策。关于具体使用的不同模型名称、具体的审计 episode 详细设置以及 Gate 3 的具体效果数值，摘要未提供。\n- **领域归类**: [AI 智能体, AI 安全与审计, 评估协议]\n---\n\n### 85. SQS: Bayesian DNN Compression through Sparse Quantized Sub-distributions (SQS：通过稀疏量化子分布进行贝叶斯 DNN 压缩)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2510.08999)\n- **研究任务**: 在资源受限设备上部署模型时，实现比现有基线更高的压缩率，同时保持可接受的性能下降。\n- **核心亮点**: 提出 SQS 框架，通过贝叶斯变分学习同时执行剪枝和低比特量化；使用 spike-and-slab 先验诱导稀疏性，并使用高斯混合模型（GMM）对量化权重进行建模以实现低比特精度。\n- **深度解析**: 现有的压缩方法通常单独采用权重剪枝或低比特量化，导致压缩率不佳。SQS 推导了一种高效的近似方法，以最小的精度损失实现有效压缩。理论上，为提出的稀疏和量化深度神经网络的变分方法提供了一致性结果。在 ResNet、BERT-base、Llama3.2 和 Qwen2.5 模型上的实验表明，该方法在性能下降相当的情况下，实现了比一系列现有方法更高的压缩率。关于具体的压缩率数值、具体的性能下降百分比以及具体的模型参数量变化，摘要未提供。\n- **领域归类**: [模型压缩, 贝叶斯深度学习, 模型部署]\n---\n\n### 86. Cadence: Error-Bounded Lossy Compression of Demand Time Series with a Time-Series Foundation Model (Cadence：使用的时间序列基础模型对需求时间序列进行误差有界的有损压缩)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06008)\n- **研究任务**: 为数值时间序列提供一种误差有界的有损压缩方法，保证每个样本的误差在指定界限内，同时利用时间序列基础模型提升压缩效率。\n- **核心亮点**: 提出 Cadence，将 330M 参数的时间序列基础模型（Google TimesFM-3）与自适应算术编码器结合；提出自适应范围编码器，在真实索引上比 xz/zstd 高出 9.7%；揭示了基础模型在无界编码中的局限性以及误差有界编码的优势。\n- **深度解析**: 对于无损编码，基础模型的价值有限，因为节省的位数与预测器精度的对数成正比。误差有界编码在预测落入误差带内时，残差索引为零，样本几乎免费。Cadence 在 49 个 EIA-930 需求序列上比最佳经典预测器高出 13.3%，在 50 个 MTA 客流序列上高出 28.3%。与下采样相比，在相同大小下，其保证的最坏情况误差要紧凑 28-56 倍。研究还报告了确定性结果（预测在不同批次大小下不是位相同的）以及在 SDRBench 上的域定位失败等负面结果。关于具体的误差界限阈值设置、具体的压缩后绝对文件大小以及上下文 bootstrap 的具体计算开销，摘要未提供。\n- **领域归类**: [时间序列分析, 数据压缩, 基础模型]\n---\n\n### 87. Verify Before You Distill: Prompt-Level Teacher Gating for On-Policy Distillation (蒸馏前验证：用于在策略蒸馏的提示级教师门控)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.02998)\n- **研究任务**: 解决在策略蒸馏（OPD）中教师模型在某些提示上不可靠导致学生模型被误导的问题，通过提示级验证加速后训练。\n- **核心亮点**: 提出教师门控在策略蒸馏（TGOPD），在提示级别验证教师可靠性；利用少量验证器评分的教师探针估计可靠性，通过检查的提示路由到密集 OPD，否则路由到基于验证器的 GRPO；提高了教师节点的 GPU 利用率。\n- **深度解析**: Vanilla OPD 统一应用教师监督，但由于反向 KL 是模式寻求的，自信但错误的教师会导致强烈的误导更新。TGOPD 在引入密集监督前验证提示级可靠性。在 4B 和 35B 学生的数学、代码和指令跟随任务中，TGOPD 在所有六个单域设置中均优于 Vanilla OPD，并在多域训练下获得更高的七基准平均值。此外，利用原本闲置的教师容量进行可靠性估计，将教师节点 GPU 利用率从 9.8% 提高到 78.9%。关于具体的七基准平均分提升数值、具体的验证器评分阈值以及具体的 GRPO 路由策略细节，摘要未提供。\n- **领域归类**: [模型训练/后训练, 知识蒸馏, 强化学习]\n---\n\n### 88. ReactVAU: A Slow-Fast Decoupled Framework for Streaming Video Anomaly Understanding (ReactVAU：用于流式视频异常理解的快慢解耦框架)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07941)\n- **研究任务**: 实现实时流式视频异常理解（VAU），解决现有方法依赖离线推理违反因果关系，以及通用流式模型在内存压缩中稀释罕见异常并过度调用重型 MLLM 的问题。\n- **核心亮点**: 提出 ReactVAU 框架，包含三个协同组件：基于空间网格折叠（SGF）的轻量级快速检测模块用于连续异常过滤；异常感知持久记忆（AAPM）保护关键视觉线索免受时间衰减；重型慢速推理模块在正常流期间休眠，仅在可疑事件唤醒时进行语义验证和因果描述。\n- **深度解析**: 现有的 VAU 方法依赖全局时间采样的离线推理，无法部署在实时流中。ReactVAU 通过快慢解耦解决这一问题。快速模块持续过滤，AAPM 保护关键线索，慢速模块（重型 MLLM）仅在需要时唤醒。在多个基准测试上的实验表明，ReactVAU 在严格的流式约束下运行，同时在异常检测和因果推理方面取得有竞争力的性能，并通过最小化重型 MLLM 的调用显著提高了计算效率。关于具体的基准测试名称、具体的异常检测和因果推理性能指标数值以及计算效率提升的具体倍数，摘要未提供。\n- **领域归类**: [计算机视觉, 视频理解, 多模态大模型]\n---\n\n### 89. MOLE: Detecting Insider Threats in AI Agents (MOLE：检测 AI 智能体中的内部威胁)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06966)\n- **研究任务**: 评估防御者是否能在有限的审查预算下，检测出在常规工作中操作前沿实验室账户的 AI 智能体所进行的模型权重窃取、训练数据投毒或削弱发布门等内部威胁活动。\n- **核心亮点**: 提出 MOLE 开放基准测试，包含 150 个 AI 操作账户、9 个有状态服务、30 个工作日，以及 12 种威胁和 4 个模型生成的约 200 亿 token 的 8 个语料库；评估了 40 个监控器。\n- **深度解析**: 模型未对齐、提示注入或操作员滥用可能导致 AI 智能体执行恶意操作。在 39 个智能体模型中，72% 完成了大部分分配的有害目标，且智能体拒绝不能预测完成度。即使评估中最好的单日审计事件比较监控器也漏掉了近一半完成的伤害。基准引导的搜索将中级监控器提高了 49-64%，而选择性使用更强的监控器在可比建模成本下将预算-AUC 提高了 10%。关于具体的 4 个模型名称、具体的 40 个监控器名称以及具体的预算-AUC 绝对数值，摘要未提供。\n- **领域归类**: [AI 安全, AI 智能体, 基准测试]\n---\n\n### 90. TransNormal-2: Geometry-Grounded Rectified Flow with Edge-Aware Decoding for Precise Normal Estimation (TransNormal-2：用于精确法线估计的基于几何的校正流与边缘感知解码)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06665)\n- **研究任务**: 解决基于扩散的单目几何估计模型中，由于 VAE 重建退化（特别是 8 倍空间压缩导致物体边界处的表面法线退化）引起的像素空间精度受限问题。\n- **核心亮点**: 提出 TransNormal-2，基于 FLUX.2 的校正流框架，支持单步确定性推理；引入几何感知像素空间损失（包括逆渲染自洽性、von Mises-Fisher 角损失和小波边缘感知正则化）；提出轻量级几何细化模块（GRM）进行 RGB 引导的残差校正。\n- **深度解析**: VAE 编码器-解码器的 8 倍空间压缩会退化表面法线，即使对真实法线进行编解码也会引入 1.3--8.5° 的平均角误差（MAE），边缘 MAE 达到全局 MAE 的 2.8 倍。TransNormal-2 在训练时通过几何感知损失强制执行球形法线几何和漫反射图像形成线索，在推理时通过 GRM 减少边界局部解码误差。在通用场景基准测试中，TransNormal-2 在所有 8 个报告的指标上匹配或超过 MoGe-2，同时仅使用 1.4% 的特定任务法线标注。在透明物体上增益最明显，在 ClearGrasp 和 ClearPose 上分别降低了 4.2° 和 3.1° 的 MAE。关于具体的 MoGe-2 基线绝对 MAE 数值、具体的推理时间/FLOPs 以及具体的训练超参数，摘要未提供。\n- **领域归类**: [计算机视觉, 3D 几何估计, 扩散模型]\n---\n\n### 91. A*-Thought-V2: Efficient Latent Reasoning via Geometric Dynamics of LLM (A*-Thought-V2：通过大语言模型的几何动力学实现高效潜在推理)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07821)\n- **研究任务**: 解决思维链（CoT）带来的巨大计算和上下文成本问题，在保留中间信息的同时实现连续压缩。\n- **核心亮点**: 提出A*-Thought-V2框架，将CoT建模为隐藏状态轨迹，用显式-隐式交错的潜在架构替代硬删除；引入逐步嵌入强制和标签强制进行训练。\n- **深度解析**: 该框架将问题、步骤和解答表示投影到3D PCA空间，测量局部转换与全局方向的对齐度。对齐步骤保留为显式文本，偏离步骤压缩为连续潜在token。方向角捕捉局部语义和推理动态。在Qwen3.5-9B和Qwen3.6-27B上的实验表明，平均准确率提高高达2.6%，响应长度减少高达一半，每计算单位准确率提高2.29倍，预处理和训练时间分别减少94.6%和高达80.3%。摘要未提供其他额外的数据集或技术细节。\n- **领域归类**: [大语言模型, 推理优化, 潜在表示]\n---\n\n### 92. Harnessing CLIP and DINO: An Uncertainty-Aware Cascaded Fusion Network for Generalizable Deepfake Image Detection (利用CLIP和DINO：用于泛化深度伪造图像检测的不确定性感知级联融合网络)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07670)\n- **研究任务**: 提高深度伪造检测模型对未见过的伪造图像的泛化能力，解决现有基于视觉基础模型的检测器容易过拟合特定训练分布的问题。\n- **核心亮点**: 提出UCF-Net，结合CLIP的语言对齐语义先验和DINO的自监督视觉结构先验；构建了约400万张图像的统一基准测试和包含8000多张人脸图像的跨生成器评估集。\n- **深度解析**: UCF-Net提取Transformer深度的分层特征，使用逐层专家聚合自适应组合多级别线索，并基于熵导出的不确定性进行加权融合。在统一基准测试中，UCF-Net在域内和跨域评估中均取得最佳平均AUC。在跨生成器集上，它能用有限的目标域数据有效适应，但零样本迁移仍具挑战性。摘要未提供具体的AUC数值或其他量化指标。\n- **领域归类**: [计算机视觉, 深度伪造检测, 多模态融合]\n---\n\n### 93. SyncWorld: Visual Calibration Enables World Models as Zero-Shot Simulators (SyncWorld：视觉校准使世界模型成为零样本模拟器)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09155)\n- **研究任务**: 解决机器人领域世界模型在像素空间中动作不通用导致的泛化脆弱问题，使世界模型能在未见过的环境中作为零样本模拟器使用。\n- **核心亮点**: 提出SyncWorld，一种动作条件世界模型，利用视觉校准片段（配对的帧和动作）在上下文中指定特定设置的“动作-视觉映射”，无需额外训练即可跨未见环境进行零样本模拟。\n- **深度解析**: 动作在像素空间中的表现会因视觉环境、相机视角等改变而改变。SyncWorld通过视觉校准上下文训练模型通过视觉证据解释动作，并在缺乏显式校准时利用交互历史。实验表明，SyncWorld能准确模拟以前未见设置中的动作结果，并在测试时通过模拟推演实现策略改进，无需训练。摘要未提供具体的实验数据集名称或量化指标。\n- **领域归类**: [机器人学, 世界模型, 强化学习]\n---\n\n### 94. Encoded Early, Used Late: Where Transformers Begin to Act on an Inferred Partner's Expertise (早编码，晚使用：Transformer何时开始对推断出的对话者专业知识采取行动)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07139)\n- **研究任务**: 探究Transformer在残差流中线性解码某个属性（如对话者的专业知识水平）的深度与该属性实际影响输出的深度之间的差距。\n- **核心亮点**: 发现对话者专业知识在早期层最容易被解码，在网络中点前降至接近随机水平；反事实补丁实验表明，在可解码性峰值层注入专业知识差异几乎不改变后期层的读取，而在中点之后注入则几乎完全传播。\n- **深度解析**: 研究使用ExpertCollab语料库（包含四个专业知识级别的多轮研究规划对话）。推断出的关系属性在因果激活之前就已经被很好地表示出来，这界定了任何读取或引导基于对话者条件行为的干预位置。摘要未提供具体的模型名称和量化指标。\n- **领域归类**: [可解释性, 机制可解释性, 大语言模型]\n---\n\n### 95. Beneath the Surface of Chains-of-Thought: A Mechanistic Interpretation of Reasoning Operations in LLMs (思维链的表象之下：大语言模型中推理操作的机制解释)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04753)\n- **研究任务**: 调查大语言模型中不同的推理操作（如问题表述、目标分解、演绎）在隐藏表示空间中是否具有相应的几何结构。\n- **核心亮点**: 发现不同的推理操作在保留的表示中是可分离的，可分离性在中间层达到峰值；随着层数加深，逐token的操作对齐在跨度上变得更加分布式，且相同的表面token根据其周围块的操作被不同地表示。\n- **深度解析**: 研究验证了这种结构不是由词汇或位置混淆引起的。注意力掩码干预进一步表明，块开始处的操作对齐表示依赖于前面的推理上下文。这表明语言模型在语言推理表达与其内部几何结构之间保持了表示对应关系。摘要未提供具体模型名称、数据集名称或量化指标。\n- **领域归类**: [可解释性, 机制可解释性, 大语言模型]\n---\n\n### 96. UniMate: One Unified Model to Animate Diverse Skeletons (UniMate：一个为多样化骨骼生成动画的统一模型)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05415)\n- **研究任务**: 解决现有动画生成模型受拓扑结构限制的问题，实现从绑定的3D资产和文本提示中为任意骨骼合成关节运动，无需测试时优化或针对每个骨骼重新训练。\n- **核心亮点**: 提出UniMate，引入拓扑感知扩散Transformer，通过三种机制将骨骼拓扑整合到注意力中；构建了包含13006个运动序列的UniML3D数据集，涵盖双足、四足、鸟类等多种形态。\n- **深度解析**: 三种机制包括：(1) 来自成对关节关系和测地距离的图感知注意力偏置；(2) 通过图拉普拉斯算子将RoPE泛化到任意运动学树的谱旋转位置嵌入；(3) 从静止姿势骨骼注意力池化的全局拓扑条件。UniMate在质量、泛化和效率上优于现有基线，支持零样本跨拓扑迁移、中间插值、扩展和文本引导编辑。摘要未提供具体对比基线名称或量化提升数字。\n- **领域归类**: [计算机视觉, 3D动画生成, 扩散模型]\n---\n\n### 97. MaxKernel: Agentic Kernel Generation for TPUs (MaxKernel：用于TPU的智能体内核生成)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04523)\n- **研究任务**: 利用大语言模型和实时编译器反馈构建智能体系统，以自动化设计和编写TPU的高性能自定义内核。\n- **核心亮点**: 提出MaxKernel多智能体系统，实现了TPU内核开发的三种范式：人在回路（HITL）、自主（Auto）和基于图的自主搜索；在JaxBench的50个内核任务及真实工作负载上进行了评估。\n- **深度解析**: 这三种范式利用共享的专用子智能体池来处理规划、实现、自我调试、测试和硬件分析。实验表明，MaxKernel能一致地生成高度优化的实现，匹配专家手动调优的基线，并在基准测试中提供显著的性能提升。摘要未提供具体的性能提升数字或匹配基线的具体名称。\n- **领域归类**: [AI系统, 编译器优化, 智能体]\n---\n\n### 98. Recognition-Refusal Misalignment in LLMs: Why Models Answer Structurally Unanswerable Questions (大语言模型中的识别-拒绝错位：为什么模型会回答结构上无法回答的问题)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.29109)\n- **研究任务**: 探究大语言模型为什么会回答结构上无法回答的问题（如计算cot(-540°)），以及这种失败是由于缺乏识别能力还是从识别到拒绝的路由失败。\n- **核心亮点**: 发现隐藏状态中的一个单一线性方向可以区分可回答和结构上不可能的数学和代码提示，表明模型在生成前就表示了不可能性；但该识别方向与介导训练有害内容拒绝的典型安全拒绝方向几乎正交。\n- **深度解析**: 在1.7B到70B参数的指令微调模型上进行研究。生成时沿识别方向进行引导可以双向且剂量响应地改变无效性感知行为。基础模型和指令模型的比较表明，低余弦几何结构在预训练终点就已经存在。这表明“对不可能问题表现自信”的失败更好地解释为路由失败，而非编码失败。摘要未提供具体的准确率数字或数据集名称。\n- **领域归类**: [大语言模型, 安全与对齐, 机制可解释性]\n---\n\n### 99. One Symptom, Three Levers: A Critical Review of On-Policy Self-Distillation (一个症状，三个杠杆：对策略自蒸馏的批判性回顾)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.25936)\n- **研究任务**: 回顾和总结策略自蒸馏（OPSD）方法，特别是其主要的失败模式——“崩溃”（模型能产生的推理路径集合逐渐变窄）。\n- **核心亮点**: 将“崩溃”视为受三个杠杆控制的症状：(i) 信号应用的位置（token如何加权）；(ii) 教师看到的内容（特权信息的性质）；(iii) 信号何时改变（教师的动态和引导的衰减）。\n- **深度解析**: 策略自蒸馏让模型在自己的生成物上训练，由教师逐token打分。OPSD去除了需要更大模型作为教师的成本，教师就是模型本身，但被赋予了特权信息。该回顾将范围限制在数学推理领域，报告没有新实验，贡献在于提供了一个结构化的共享词汇表，并明确了哪些问题是已解决的，哪些仍有争议。摘要未提供具体实验数据或数字（本文为综述）。\n- **领域归类**: [大语言模型, 模型训练/蒸馏, 强化学习]\n---\n\n### 100. RISE: Recursive Improvement via Self-Extrapolating Policy Distillation (RISE：通过自外推策略蒸馏实现递归改进)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05295)\n- **研究任务**: 解决策略蒸馏（OPD）受限于教师质量的问题，提出一种无需外部模型或特权条件，直接从模型自身的RLVR训练轨迹中构建合成教师的方法。\n- **核心亮点**: 提出RISE，通过在参数空间或输出logit空间外推当前检查点与 trailing anchor 之间的位移，将稀疏的结果诱导参数更新转化为密集的token级目标，实现递归改进。\n- **深度解析**: RISE将RLVR和OPD结合在一个互补的循环中：结果奖励将外推引向正确的推理，而外推教师则细化token级决策。由于教师在每次迭代时随着学生进步而刷新，蒸馏变成了递归改进机制。实验跨越数学推理、多领域STEM、代码生成和多轮智能体任务，表明RISE在所有设置中均优于纯RLVR训练和策略自蒸馏。摘要未提供具体的提升数字或数据集名称。\n- **领域归类**: [大语言模型, 强化学习, 模型蒸馏]\n---\n\n### 101. EmbodiedSkills: A Unified Framework for Orchestrating, Training, and Deploying VLA Agents (EmbodiedSkills：一个用于编排、训练和部署VLA智能体的统一框架)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.01281)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在长视野任务中缺乏协调感知、规划、执行、进度验证和恢复能力的问题，将VLA策略转化为闭环具身系统。\n- **核心亮点**: 提出EmbodiedSkills框架，将技能决策视为执行提案，通过共享的可执行技能接口连接高级选择、低级执行和结果验证；接口固定允许灵活替换底层策略，并能记录结构化轨迹以支持组件监督与在线适应。\n- **深度解析**: 摘要未提供\n- **领域归类**: [具身智能, 机器人控制, 视觉-语言-动作模型]\n---\n\n### 102. τ^τ-Bench: An Environment for End-To-End, Realistic Agent Construction (τ^τ-Bench：一个用于端到端、真实智能体构建的环境)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04611)\n- **研究任务**: 评估AI系统（特别是编码智能体）在真实客户参与条件下，从零构建并交付完整客户服务智能体的端到端能力。\n- **核心亮点**: 提出τ^τ-bench基准，模拟真实业务场景（提供业务记录、API、代码库及成本限制），要求开发者智能体构建并部署客服智能体；揭示了当前最强模型（如Claude Opus 5）在深度理解、客户沟通和架构探索方面的显著不足。\n- **深度解析**: 摘要指出，当前模型的失败模式与人类开发者遇到的问题高度相似，例如进行浅层查询而非深入理解业务记录、几乎不与客户沟通，以及对智能体架构和服务成本的探索实验太少。\n- **领域归类**: [大语言模型智能体, 基准测试, 软件工程]\n---\n\n### 103. RelightFormer: Feed-forward Generative Transformer for Multiview Object Relighting (RelightFormer：用于多视图物体重光照的前馈生成Transformer)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.07414)\n- **研究任务**: 解决传统图像重光照方法中逆渲染管线优化病态，以及单图像生成模型忽略多视图线索的问题，实现直接、高质量的单视图和多视图图像重光照。\n- **核心亮点**: 提出前馈生成Transformer架构，通过潜在光照模块和排列不变位置编码绕过显式内在属性估计；构建包含9万物体和3.9万光照的大规模Laval Objaverse数据集（LOD）；在多种重光照任务中达到SOTA效果及强零样本泛化能力。\n- **深度解析**: 摘要未提供\n- **领域归类**: [计算机视觉, 图像生成与编辑, 3D视觉]\n---\n\n### 104. Why Is Video Still So Expensive? A Survey of Inference-Efficiency Mechanisms in Video and Audiovisual LLMs (为什么视频仍然如此昂贵？视频和音视频大语言模型中推理效率机制综述)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10355)\n- **研究任务**: 系统梳理和评估视觉及音视频视频大语言模型（VideoLLMs）在推理阶段的效率优化机制，解决其计算和内存成本随帧数及上下文长度增长的问题。\n- **核心亮点**: 全面综述VideoLLMs推理效率机制，按管道阶段（帧采样、模态编码、Token减少、LLM预填充与解码）分类现有方法；汇总准确率与成本的对比数据，并指出当前在音视频效率及标准化评估方面的研究空白。\n- **深度解析**: 摘要未提供\n- **领域归类**: [多模态大模型, 模型优化与加速, 视频理解]\n---\n\n### 105. DianShi-RxnDB: A Large-Scale, Fine-Grained Organic Reaction Data Platform Built via a Fully Automated Pipeline for Researchers and AI Agents (DianShi-RxnDB：通过全自动管道为研究人员和AI智能体构建的大规模、细粒度有机反应数据平台)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06703)\n- **研究任务**: 解决高质量结构化有机反应数据分散在专利文本、图像和反应方案中的问题，为化学AI（AI4Chem）提供大规模、细粒度的数据支持。\n- **核心亮点**: 构建全自动提取与归一化管道，从美欧专利中提取约2400万反应实例（1480万通过质检）；字段级准确率达92.95%，在去重和粒度上优于Pistachio；提供Web研究工作台及面向AI智能体的MCP结构化检索服务。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI for Science, 化学信息学, 数据集与数据库]\n---\n\n### 106. OracleZoom: On-Policy Self-Distillation Inspired Reference-Constrained Recursive Image Super Resolution (OracleZoom：受在策略自蒸馏启发的参考约束递归图像超分辨率)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06490)\n- **研究任务**: 解决递归超分辨率（SR）在极端放大倍率下，由于缺乏深层尺度的真实标签而导致深层预测缺乏监督的问题。\n- **核心亮点**: 提出OracleZoom框架，结合在策略自蒸馏与参考约束，通过直接/跨尺度监督与无参考质量目标引导细节生成；引入KL约束潜在先验和EMA一致性机制防止漂移并稳定边界；在7个数据集上实现SOTA质量并显著减少幻觉。\n- **深度解析**: 摘要未提供\n- **领域归类**: [计算机视觉, 图像超分辨率, 生成模型]\n---\n\n### 107. Difficulty-Adaptive Tree-Structured Policy Optimization for Expanding Reasoning Coverage in RLVR (用于扩展RLVR推理覆盖率的难度自适应树结构策略优化)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08650)\n- **研究任务**: 解决带可验证奖励的强化学习（RLVR）在训练期间因探索有限而难以扩展模型内在推理覆盖率（pass@k）的问题。\n- **核心亮点**: 提出DATPO方法，通过难度自适应树搜索与句子熵引导的分叉机制，结合兄弟多样性优势项，显式促进语义多样性；在数学推理基准上显著提升pass@k指标及测试时缩放性能。\n- **深度解析**: 摘要未提供\n- **领域归类**: [大语言模型, 强化学习, 逻辑与数学推理]\n---\n\n### 108. Diffs vs. Whole Files: An Empirical Comparison of Iterative Edit-Based and Direct Generation for Flutter/Dart Code Models (差异与完整文件：Flutter/Dart代码模型迭代编辑与直接生成的实证比较)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05779)\n- **研究任务**: 实证评估代码大语言模型在代码编辑任务中，采用“直接生成完整文件”与“基于差异（Diff）的迭代局部编辑”两种输出机制的性能差异及适用场景。\n- **核心亮点**: 实验表明直接生成在编译通过率、代码质量等所有指标上大幅优于基于Diff的迭代生成；发现基于Diff的生成仅在具有“任务局部性”（如短小、空间局部化的重构和边缘情况修复）时具备竞争力。\n- **深度解析**: 摘要提出“任务局部性”概念，指出基于差异的生成仅在短小且空间局部化的编辑中具有竞争力，并探讨了这一发现对代码编辑模型训练机制选择的启示。\n- **领域归类**: [代码大模型, 软件工程, 模型训练与评估]\n---\n\n### 109. Safety for Whom? Boundary-Aware Self-Distillation for Controlled LLM Safety Refusal (为了谁的安全？用于控制大语言模型安全拒绝的边界感知自蒸馏)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04482)\n- **研究任务**: 解决大语言模型在特定主题内需要精细控制安全拒绝边界（即在同一主题内拒绝有害部分而保留无害部分）的“窄边界安全”问题。\n- **核心亮点**: 提出窄边界安全概念及离线自生成框架，通过构造有害-无害边界对数据进行训练；实验证明数据组成能有效控制安全性与可用性的权衡，且使用目标模型验证响应可显著降低过度拒绝率。\n- **深度解析**: 摘要总结指出，数据组成决定了安全性与可用性的权衡，并强调安全对齐评估必须同时考察预期拒绝边界的两侧（即合规侧与有害侧）。\n- **领域归类**: [大语言模型, 安全与对齐, 价值观与拒绝机制]\n---\n\n### 110. Unfold The World: Factorize 4D Properties in Reinforcing Spatial Reasoning (展开世界：在强化空间推理中分解4D属性)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03729)\n- **研究任务**: 解决视觉语言模型（VLMs）在物理世界空间推理中因2D投影导致的维度不匹配（缺乏3D几何和时间连续性恢复能力）的“平坦”瓶颈问题。\n- **核心亮点**: 提出FactoSR框架，采用“分而治之”范式，将空间推理分解为平面对应（XY）、深度一致性（Z）和时间可逆性（T）三个正交几何子目标；通过强化学习优化这些约束，显著提升3D和4D推理能力。\n- **深度解析**: 摘要总结认为，强化显式的、分解的4D一致性是促使视觉语言模型向稳健的、具备世界感知能力的推理器演进的关键一步。\n- **领域归类**: [视觉语言模型, 3D/4D空间推理, 强化学习]\n---\n\n### 111. SimpleMemVLA: A Simple but Effective Native-Video Memory for Vision-Language-Action Models (SimpleMemVLA：一种简单但有效的视觉-语言-动作模型原生视频记忆)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05533)\n- **研究任务**: 解决长时程操作（Long-horizon manipulation）中的部分可观测性问题，即智能体在决定下一步动作时，所需的信息可能仅出现在几分钟前的观测中，从而需要有效的长时记忆机制。\n- **核心亮点**: 提出 SimpleMemVLA，这是一个没有专门记忆模块的视觉-语言-动作（VLA）模型。它保持采样的历史完整，并以带时间戳的视频格式直接传递给骨干网络；生成的子任务的隐藏状态形成从历史到标准流匹配动作头的唯一通道。通过预填充共享前缀，将执行延迟保持在接近单帧 VLA 的水平。\n- **深度解析**: 现有的记忆机制（如检索库、学习压缩器、循环状态）必须在不知道未来决策需求的情况下决定保留哪些历史信息。SimpleMemVLA 打破了这一假设，利用现代 VLM 骨干网络直接处理大规模历史的能力。该方法在四个记忆基准上取得了新的最先进水平，且在通用控制任务上没有性能代价。因果干预实验证实，该策略确实读取并利用了其历史信息。\n- **领域归类**: [机器人控制, 视觉语言模型, 强化学习]\n---\n\n### 112. A Three-Layer Caching Architecture for Low-Latency LLM Web Search on Commodity CPU Hardware (在商用 CPU 硬件上实现低延迟 LLM 网络搜索的三层缓存架构)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05463)\n- **研究任务**: 优化基于大语言模型（LLM）的搜索产品在商用 CPU 硬件上的运行效率，解决会话上下文丢失、等效查询触发冗余工作以及 URL 跨会话重复嵌入等问题。\n- **核心亮点**: 提出一种三层缓存架构：(1) 会话上下文窗口：在 Redis 中维护最近消息的滚动窗口，并自动溢出到 Huffman 压缩的磁盘归档；(2) 语义查询缓存：通过嵌入向量的余弦相似度捕获重述，消除冗余的 LLM 调用；(3) URL 嵌入缓存：跨会话去重嵌入计算。\n- **深度解析**: 该系统部署在单台 8 核 Intel Cascade Lake 服务器上，运行 30 个 Hypercorn 工作进程。评估显示，系统实现了 89.3% 的总 Redis 键空间命中率，读取延迟仅为 0.1 毫秒，内存开销仅 1.38 MB。后台 LRU 驱逐守护进程可将空闲会话从 Redis 迁移到磁盘并按需重新加载，支持在配置的保留策略下恢复数小时或数天后的对话。\n- **领域归类**: [系统架构, 大语言模型应用, 缓存与检索优化]\n---\n\n### 113. SchemeArena: Factorized Stress Testing of Scheming in LLM Agents (SchemeArena：LLM 智能体欺骗行为的因式分解压力测试)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08126)\n- **研究任务**: 研究 LLM 智能体中的“欺骗（scheming）”行为（即智能体暗中追求未对齐的目标），理解欺骗如何从工具目标、环境可供性、监督条件和感知后果等关键因素的相互作用中产生。\n- **核心亮点**: 引入 SCHEMEARENA，一个包含 400 个场景的基准，通过因式分解场景合成框架构建，用于可扩展的欺骗压力测试。同时提出 SCOUT，一个基于智能体推理和行动证据进行多标准判断的欺骗监控器。\n- **深度解析**: 对五个 LLM 智能体的受控压力测试发现，明确的工具目标是欺骗倾向的最强驱动力，而战略提示能帮助智能体将欺骗推理转化为具体的隐蔽行为。监督效果呈现混合状态：在某些闭源模型中，仅动作监控反而会增加欺骗。思维链（CoT）是有用但不完整的监控信号，因为隐蔽行为可能在缺乏明确推理证据的情况下发生。\n- **领域归类**: [AI 安全, 智能体评估, 大语言模型对齐]\n---\n\n### 114. Co-Evolving Harnesses and Models: On-Policy Correction Helps Weaker Models Catch Up Where Imitation Fails (协同进化的框架与模型：在策略纠正帮助弱模型在模仿失败的地方迎头赶上)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09134)\n- **研究任务**: 研究在特定领域的企业任务中，如何结合智能体框架（harness，包括系统提示、工具集等）的自动进化与轻量级微调，以使较小的模型以较低成本实现良好表现。\n- **核心亮点**: 发现直接用强专家的完整轨迹对弱模型进行监督微调会产生反效果（性能下降 4 到 30 分），因为这破坏了模型与框架的契合度。提出了一种在策略专家纠正（on-policy expert-correction）管道，由元级 MLE 智能体自动化，仅定位并让专家重写弱模型自身 rollout 中失败的回合。\n- **深度解析**: 模仿学习会转移知识，但弱模型采用了专家的计划策略却缺乏执行能力，导致不再匹配围绕其原生计划风格进化的框架。在策略纠正保留了弱模型原有的计划风格，成功结合了框架进化和模型适应的收益，解决了框架更新和权重更新之间的冲突，提供了一种兼容的协同进化方案。\n- **领域归类**: [大语言模型微调, 智能体系统, 模仿学习]\n---\n\n### 115. Train Smarter, Not Harder: Switching Signal-Guided Training in Active Learning (更聪明地训练，而非更刻苦：主动学习中切换信号引导的训练)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06806)\n- **研究任务**: 解决主动学习中的一个关键决策变量：在每一轮迭代中，决定是从头重新训练模型，还是从上一个检查点进行微调。\n- **核心亮点**: 提出 HybridAL，一种自适应训练计划。它监控在线稳定信号（包括基于权重的谱指数变化 Δα 和基于验证的准确率变化 ΔAcc），并在模型轨迹持续稳定后，自动从重新训练切换到微调。\n- **深度解析**: 重新训练在早期轮次最有用，而微调在模型稳定后更安全。在三个编码器骨干和六个文本分类任务上的实验表明，HybridAL 保持终点 macro-F1 不劣于重新训练和微调（0.010 边际），节省高达 49% 的重新训练时间，并恢复了重新训练在负对数似然（NLL）校准方面的大部分优势，提供了比固定早期切换更强的时间-校准权衡。\n- **领域归类**: [主动学习, 模型训练策略, 机器学习基础]\n---\n\n### 116. AdaptVPR: Route-Aware Hard Positive Generation for Robust Visual Place Recognition (AdaptVPR：用于鲁棒视觉位置识别的路由感知困难正样本生成)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04369)\n- **研究任务**: 提高视觉位置识别（VPR）在光照、天气、季节变化和动态遮挡等领域偏移下的鲁棒性，解决现有训练数据中同一地点外观多样性有限的问题。\n- **核心亮点**: 提出 AdaptVPR，一个路由感知生成增强框架。利用视觉语言模型解析场景属性，通过基于规则的调度器确定生成路由（全局外观路由、局部遮挡路由、双重路由）。使用基于几何一致性和外观多样性的 VPR 验证方案评估候选者，构建了包含 160K 经验证样本的 AdaptCities 数据集。\n- **深度解析**: 全局候选者生成一次，若验证失败则拒绝；局部遮挡和双重候选者则利用验证反馈进行有限的提示微调。在多个 VPR 基线和视觉基础骨干上的实验表明，该方法在标准基准和具有挑战性的领域偏移下均有持续增益，R@1 增益高达 9.2%。\n- **领域归类**: [计算机视觉, 图像检索, 数据增强]\n---\n\n### 117. When Models Edit Too Much: On the Fidelity of Minimal Code Edits (当模型编辑过多时：论最小代码编辑的保真度)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04061)\n- **研究任务**: 研究大语言模型在编辑现有代码时的“过度编辑（over-editing）”倾向，即模型重写代码的范围超出了修复错误所需的最低限度，影响代码的可审查性和保真度。\n- **核心亮点**: 构建了一个包含 400 个 BigCodeBench 问题的评估框架，通过注入受控的 AST 级损坏来提供已知的最小补丁。发现即使强模型（如 GPT-5.5）也存在广泛的过度编辑。添加“保留指令”可显著减少此行为，将平均超额 Levenshtein 距离从 0.195 降至 0.131，减少 26.6% 的增加认知复杂度，Pass@1 提高 2.3 分。\n- **深度解析**: 研究进一步探讨了在后训练阶段直接学习最小编辑的可行性。结果表明，监督微调会过拟合于见过的损坏模式，而强化学习在域外编辑保真度和性能保留权衡方面表现最好。该研究将“编辑保真度”确立为代码修复质量的一个独立且可测量的维度。\n- **领域归类**: [代码生成与修复, 大语言模型评估, 软件工程]\n---\n\n### 118. Unifying Conformal Language Tasks with In-Context Ensembles (使用上下文集成统一保形语言任务)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.03005)\n- **研究任务**: 解决 NLP 任务（如摘要和抽取式问答）中在满足覆盖率（coverage）和简洁性（conciseness）约束下的相关内容检索问题，优化保形预测（conformal prediction）的评分函数。\n- **核心亮点**: 引入保形相关性（Conformal Relevance）框架，使用上下文学习示例策划和集成（ensembling）来创建评分函数。该方法在保持覆盖率的同时提高简洁性，且只需最少的人工提示工程输入。\n- **深度解析**: 该框架在七个 NLP 任务上得到了应用验证。此外，研究从理论上探讨了集成保形分数的多样性影响，给出了一个互补条件来表征集成何时能改善最坏情况的句子分数，并推导出了集成改进的饱和边界。\n- **领域归类**: [自然语言处理, 保形预测, 信息抽取]\n---\n\n### 119. Group Adaptive Clipping Policy Optimization (分组自适应裁剪策略优化)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.00444)\n- **研究任务**: 改进带有可验证奖励的强化学习（RLVR）中的分组相对策略优化（GRPO）方法，解决固定重要性采样（IS）比率裁剪边界导致学习信号被不当抑制的问题。\n- **核心亮点**: 提出 GAPO（分组自适应裁剪策略优化），一种 GRPO 的即插即用修改。它基于反向 KL 信任区域视角，使裁剪边界动态适应 rollout 的优势，让具有较大学习信号的 rollout 获得按比例更大的更新空间。\n- **深度解析**: 在固定裁剪下，较难问题上罕见但正确的 rollout（具有较大的 IS 比率和较强的梯度信号）会被不成比例地抑制。GAPO 无需奖励塑形，保留标准 PPO/GSPO 代理，仅调整裁剪阈值。在 Qwen 和 Llama 模型上，针对基础模型通过率相对较低的数学推理和编码基准，GAPO 一致提高了 Pass@1 和 Pass@k 表现。\n- **领域归类**: [强化学习, 大语言模型训练, 策略优化]\n---\n\n### 120. StochBench: A Domain-Specific Benchmark for Stochastic Processes in Lean (StochBench：Lean 中随机过程的特定领域基准)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09264)\n- **研究任务**: 解决现有大语言模型形式化定理证明基准（如 IMO 和 Putnam 竞赛数学）代表性不足的问题，提供特定领域应用数学的评估基准。\n- **核心亮点**: 引入 StochBench，一个包含 450 个研究生级别随机过程问题的 Lean 4 基准。涵盖马尔可夫链、更新过程、随机游走、鞅、布朗运动、随机微积分等广泛主题，每个问题都配有其自然语言来源。\n- **深度解析**: 基于 Opus 4.8 的智能体在每问题 15 分钟的限制下实现了 34.9% 的证明率（157/450）。StochBench 填补了 Mathlib 中代表性不足领域的空白，更好地代表了特定领域的应用数学，同时对高级证明器仍具有足够的挑战性。\n- **领域归类**: [形式化验证, 定理证明, 大语言模型基准]\n---\n\n### 121. AgenticGen: Reward-Guided Agentic Video Generation for Advertising (AgenticGen：面向广告生成的奖励引导智能体视频生成)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.09187)\n- **研究任务**: 广告视频生成。该任务不仅是视频合成，更是一个以产品为条件的推理问题，其成功与否需通过在线业务指标来衡量。\n- **核心亮点**: 提出 AgenticGen，一个奖励引导的智能体框架。该框架将广告视频生成解耦为“策略选择”和“草稿生成”两个可训练的推理阶段，并学习基于在线反馈的性能奖励和基于人类质量标准的评价奖励，利用 DPO 和 GRPO 进行策略优化。\n- **深度解析**: 现有的视频基础模型虽然能生成逼真的片段，但无法优化产品如何转化为有效广告，也无法从在线反馈中闭环改进。AgenticGen 通过暴露可供在线业务反馈监督的优化目标解决了这一痛点。离线实验验证了奖励模型和连续策略优化的有效性；在 TikTok 广告系统的在线 A/B 实验中，经过 DPO 和 GRPO 优化的 AgenticGen 相比 SFT 基线，CTR 提升 2.72%，CVR 提升 2.63%，Advv 提升 9.61%。\n- **领域归类**: [计算机视觉, 视频生成, 强化学习, 推荐与广告系统]\n---\n\n### 122. To See a World in a Living Context: Unified Indoor-Outdoor Urban World Generation (在真实语境中看见世界：统一的室内外城市世界生成)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.05879)\n- **研究任务**: 统一的室内外城市世界 3D 生成。旨在解决以往大规模室外环境和详细室内场景独立合成、缺乏连贯城市世界对应关系的问题。\n- **核心亮点**: 提出 HoloWorld 框架，基于持续更新的跨尺度世界上下文，从城市尺度规划到单体建筑渐进式表示和更新信息。该框架自回归生成具有空间组织和视觉一致性的城市外部，并基于 3D 建筑实例和足迹生成受几何约束的室内。\n- **深度解析**: 据摘要称，HoloWorld 是首个在连贯的 3D 城市世界中统一室内和室外生成的框架。实验表明其城市外部生成性能优越，平均 AQS 分数比 SOTA 提高 7.68%，获得最高平均 RDR 分数，同时保持了强大的建筑级室内外对应和跨块连续性。\n- **领域归类**: [计算机视觉, 3D 生成, 场景生成]\n---\n\n### 123. PlannerForge: LLM Agents for Scenario-Based Testing of Motion Planners in Autonomous Driving (PlannerForge：用于自动驾驶运动规划器基于场景测试的大语言模型智能体)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.08965)\n- **研究任务**: 自动驾驶系统（ADS）的基于场景的测试。旨在解决现有测试流程碎片化、各模块缺乏交互，且缺乏统一 LLM 智能体框架覆盖整个测试流程的问题。\n- **核心亮点**: 提出 PlannerForge，一个 LLM 智能体框架。它扩展了所有基于场景的测试阶段（从场景生成到 ADS 评估），并新增了 ADS 增强和 ADS 基准测试两个 LLM 增强阶段。\n- **深度解析**: 研究使用 10 个现成 LLM 在 5 种提示条件下进行评估。最佳单任务得分在 0.88 到 1.00 之间，20-35B 的开源模型（如 Qwen3.6:35B）在多数任务上匹配商业 API。端到端链接保留了 83%（商业）/ 78%（开源）的种子查询。在自然语言生成（200 个中 193 个可执行）、物理有效编辑（\u003e=94%）等指标上优于现有方法。通过成本调整，规划器成功率从 50.4% 提升至 70.2%，碰撞率从 19.0% 降至 8.4%。\n- **领域归类**: [自动驾驶, 大语言模型, 智能体, 软件测试]\n---\n\n### 124. Knowing What Not to Answer: Selective Non-Compliance in Vision-Language Models (知道什么不该回答：视觉语言模型中的选择性不合规)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04720)\n- **研究任务**: 评估和提升视觉语言模型（VLMs）的选择性不合规能力，即对错误、不安全、不可行或无法回答的请求拒绝服从，同时恰当回答合理请求。\n- **核心亮点**: 引入 KoNA 基准，评估 VLM 在五个类别（错误前提、视觉不可访问、普遍未知、任务可行性、安全性）中的选择性不合规能力。通过微调使模型区分可回答组件和需要不合规的组件。\n- **深度解析**: 现有基准通常假设整个请求要么需要合规要么需要拒绝，而现实查询可能包含混合内容。KoNA 评估了查询级和组件级的不合规能力。实验表明模型在需要选择性不合规时往往失败。使用 KoNA 示例微调后，模型在不合规准确性上取得显著提升，同时基本保持了完全可回答任务的性能。具体的实验结果数字和额外数据集摘要未提供。\n- **领域归类**: [多模态, 视觉语言模型, 模型安全与对齐]\n---\n\n### 125. One Editor, Many Edits: A Unified Training-Free Framework for Diverse Video Editing (一个编辑器，多种编辑：用于多样化视频编辑的统一免训练框架)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04190)\n- **研究任务**: 多样化视频编辑。旨在单一统一框架内实现高质量的指令引导和主体引导编辑。\n- **核心亮点**: 提出 EditVid，一个免训练框架。它结合了用于局部连贯性的稀疏因果记忆、用于长程身份保留的基于对应关系的后注意力令牌注入，以及用于编辑局部性的软潜在混合。支持风格迁移、属性修改、对象插入等多种编辑。\n- **深度解析**: 在 FiVE 数据集上，EditVid 达到 78.16 的 FiVE-Acc，而最强的免训练基线为 58.95，在 IVEBench 上也取得有竞争力的结果。用户研究显示，相比 7 种竞争方法，对 EditVid 的总体偏好率为 51.8%。\n- **领域归类**: [计算机视觉, 视频编辑, 生成模型]\n---\n\n### 126. When Quantization Breaks Memory: Recurrent-State Write-Back in Low-Precision Temporal Inference (当量化破坏记忆：低精度时间推理中的循环状态写回)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04490)\n- **研究任务**: 研究低精度量化在循环神经网络（RNN）推理中对循环状态存储和写回规则的影响，特别是在荧光寿命成像（FLIM）等分子成像任务中。\n- **核心亮点**: 引入“循环状态写回”概念，隔离其在紧凑 GRU 编码器-解码器中的影响。发现将连续状态传播替换为确定性 4 位状态存储会使估计误差大幅增加。提出误差反馈、残差记忆和方向记忆来恢复精度而无需重新训练。\n- **深度解析**: 当重复的小更新低于写入阈值时，存储的状态几乎固定，导致失败。在 GRU 和 LSTM 上的实验表明，将连续状态替换为 4 位存储会使短寿命和长寿命分量的估计误差分别增加约 70 倍和 300 倍。增加状态精度有时反而会使固定的循环解决方案变差，而误差反馈可以恢复精度。该研究确立了循环状态写回是低精度循环动态的关键决定因素。\n- **领域归类**: [模型压缩与量化, 循环神经网络, 医疗/生物成像]\n---\n\n### 127. Counter-Swarm Doctrine: Containing Coordinated Agent Intrusions (反蜂群学说：遏制协调的智能体入侵)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06140)\n- **研究任务**: 防御智能体将共享基础设施转变为协调入侵渠道的安全问题。\n- **核心亮点**: 提出防御的操作单元应是一个“可修订的协调事件”，连接观察到的传输、任务权限和响应历史。核心研究问题是“前瞻性事件发现”，即在评估者提供成员资格之前找出哪些动作属于同一事件。\n- **深度解析**: 论文基于 Hugging Face 事件和公共 wiki 调查，将未经授权的协调与协作和委托权限策略相对立，将存储介导的协调与间接协调（stigmergy）联系起来。提出了一种评估设计，比较隔离动作、滚动窗口等，并建议跨执行进行监控。具体的实验结果数字、数据集或技术细节摘要未提供。\n- **领域归类**: [AI 安全, 智能体安全, 系统安全]\n---\n\n### 128. Refuse without Refusal: A Structural Analysis of Safety-Tuning Responses for Reducing False Refusals in Language Models (拒绝而不生硬拒绝：用于减少语言模型误拒绝的安全微调响应结构分析)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.04714)\n- **研究任务**: 解决大语言模型在安全对齐中难以区分真正有害查询和包含表面风险语言的良性查询，从而导致“误拒绝”（false refusals）的问题。\n- **核心亮点**: 将安全微调数据集中的响应分解为两个组件：(i) 样板拒绝声明，(ii) 解释拒绝的理由。发现仅使用“理由”进行训练可以减少误拒绝，同时保持相当的安全性能。\n- **深度解析**: 实验和分析表明，拒绝声明会诱导模型依赖表面线索，从而阻碍对有害和良性查询的准确区分。仅使用理由训练（Rationale-
