\u003e\u003cp\u003eEvaluations of multi-agent language models often compare communicating architectures against a single greedy pass. This practice confounds coordination with sample multiplicity and inference compute. We synthesize nine primary empirical evaluations comprising 516 unique multi-agent configurations organized along a resource vector R with six dimensions and a baseline ladder with four categories. Against baselines with a single pass (Category A), multi-agent accuracy differences are negative overall and near zero when omitting the largest contributing study. When evaluated against baselines matched on sample count (Category B) or resource budget (Category C), multi-agent systems average -0.042 in accuracy, and multilevel random effects modeling on the log odds scale remains negative across sensitivity checks. Multi-agent accuracy equals or falls below the baseline in 74% of these comparable contrasts, and study means are nonpositive in almost all evaluated studies. Across studies reporting both baselines, moving from a greedy pass to a sampled baseline shifts accuracy differences by -0.038 on average. Because communication adds no information when agents share identical evidence, positive returns require partitioned evidence, external verification, or error diversity across models. We provide a reviewer checklist and accounting utilities.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e对多智能体语言模型的评估通常将通信架构与单次贪婪传递进行比较。这种做法将协调与样本多重性和推理计算混淆在一起。我们综合了九项主要实证评估，包含516种独特的多智能体配置，这些配置沿着具有六个维度的资源向量R和具有四个类别的基线阶梯进行组织。与单次传递的基线（类别A）相比，多智能体的准确率差异总体为负，如果省略最大的贡献研究则接近零。当针对样本数量匹配（类别B）或资源预算匹配（类别C）的基线进行评估时，多智能体系统的准确率平均为-0.042，并且在敏感性检查中，对数几率尺度上的多级随机效应建模保持为负。在这些可比较的对比中，74%的多智能体准确率等于或低于基线，并且在几乎所有评估的研究中，研究均值均为非正数。在报告了两种基线的研究中，从贪婪传递转移到采样基线平均使准确率差异移动了-0.038。因为当智能体共享相同证据时，通信不会增加任何信息，所以正回报需要分区的证据、外部验证或跨模型的错误多样性。我们提供了审稿人检查清单和核算工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估并解耦多智能体语言模型中通信架构带来的协调收益与样本多重性、推理计算（测试时计算）增加之间的关系。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e综合了9项实证评估的516种多智能体配置；发现与单次贪婪基线相比，多智能体准确率差异总体为负；在控制样本数量或资源预算后，多智能体系统准确率平均下降0.042，74%的对比中准确率等于或低于基线；指出共享相同证据时通信不增加信息，正回报需要证据分区、外部验证或错误多样性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过大规模元分析揭示了当前多智能体LLM评估中存在的混淆问题，证明单纯增加智能体通信并不必然带来准确率提升，其收益往往被样本量和计算量的增加所掩盖。局限性在于：摘要未提供具体使用的9项实证评估的文献列表或详细数据集信息，也未探讨在何种特定任务或证据分区策略下多智能体通信能产生显著的正向收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 多智能体系统与评估方法学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e143. Marimba: A System One Model for Speech（Marimba：一种用于语音的系统一模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18330\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18330\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpeech applications require decisions about term presence, turn completion, and language within an audio window. We present Marimba, an interface for typed speech decisions built on frozen Qwen3-ASR 0.6B features. Lexical questions use zero-shot scoring of ASR transcripts; non-lexical questions use a question-conditioned head and a separate layer-18 turn-end readout. Language identification uses the ASR model\u0026#x27;s own language scores. On private conversational test sets, decoder AUROC is 0.80-0.92; on public read speech it is 0.92-0.97. Speech Commands four-way accuracy is 0.93; binary lexical ECE is at most 0.08. Personal-information detection, which passes the greedy transcript to a private, curated PII pipeline, reaches item-level F1 0.904 on synthetic Brazilian Portuguese speech (1.000 on reference transcripts). Layer-12 speaker readouts detect speaker change with AUROC 0.966-0.980 on AMI and VoxConverse, above an ECAPA baseline, and count speakers (0, 1, 2, or 3+) more accurately than pyannote 3.1. The turn-end readout reaches AUROC 0.930 versus Smart Turn v3.2 at 0.982 on Smart Turn\u0026#x27;s own test set. On a subset of ICSI meetings labeled by next speaker, AUROC is 0.716 versus 0.712; the paired confidence interval includes zero.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语音应用需要在音频窗口内对术语存在、轮次完成和语言做出决策。我们提出了Marimba，这是一个用于类型化语音决策的接口，构建在冻结的Qwen3-ASR 0.6B特征之上。词汇问题使用ASR转录的零样本评分；非词汇问题使用问题条件头和单独的层18轮次结束读出。语言识别使用ASR模型自身的语言分数。在私有对话测试集上，解码器AUROC为0.80-0.92；在公开朗读语音上为0.92-0.97。语音命令四路准确率为0.93；二元词汇ECE最多为0.08。个人信息检测将贪婪转录传递给私有的、经过整理的PII管道，在合成的巴西葡萄牙语语音上达到项目级F1 0.904（在参考转录上为1.000）。层12说话人读出在AMI和VoxConverse上以0.966-0.980的AUROC检测说话人变化，高于ECAPA基线，并且比pyannote 3.1更准确地计算说话人数量（0、1、2或3+）。轮次结束读出在Smart Turn自己的测试集上达到0.930的AUROC，而Smart Turn v3.2为0.982。在由下一个说话人标记的ICSI会议子集上，AUROC为0.716，而基线为0.712；配对置信区间包含零。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在音频窗口内对语音的术语存在、轮次完成、语言识别、个人信息检测、说话人变化及数量、轮次结束等类型化语音决策进行准确预测。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Marimba接口，基于冻结的Qwen3-ASR 0.6B特征；在私有对话和公开朗读语音上AUROC分别达0.80-0.92和0.92-0.97；个人信息检测在合成巴西葡萄牙语上F1达0.904；说话人变化检测AUROC达0.966-0.980，优于ECAPA基线，说话人计数优于pyannote 3.1；轮次结束检测AUROC达0.930。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了大量详细的实验指标，表明Marimba在多项语音决策任务上表现优异，部分指标超越基线。局限性方面，摘要指出在ICSI会议子集上的轮次结束预测AUROC为0.716，配对置信区间包含零，表明在该特定任务或数据集上相较于基线无显著优势；此外，摘要未提供模型推理速度、计算资源消耗以及在更多样化真实噪声环境下的鲁棒性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 语音处理 / 深度学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e144. DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images（DominoBench：评估从静态图像进行多步物理推理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20385\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20385\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCan a vision-language model look at a picture of a chain reaction and tell what will happen? Recent multimodal models describe scenes fluently and solve textbook physics problems, which suggests they should also predict how a scene of ramps, ledges, pendulums, seesaws and dominoes plays out once a ball is pushed. We tested this claim on 30 models from 10 families and reached a clear conclusion: unaided, no model predicts the outcome reliably. We built DominoBench, a benchmark of still images of 2D rigid-body scenes whose outcome a physics simulator computes. It holds 854 items in 427 minimal pairs, in which a change of one to three grid steps in one quantity decides whether one person survives, and every item comes with a four-rung hint ladder ending in the exact calculation that decides the outcome. Unaided, frontier models from Anthropic, Google and OpenAI are right about the person whose fate flips in at most 72% of items and answer both twins of a pair correctly in at most 34%. Pointing at the deciding step helps little, and exact geometry given as text barely helps, yet once the deciding calculation and the quantities it needs, including speeds that a still image cannot show, are written out, the same models reach 82-92% on the deciding person, while small open-weight models stay near chance. Physical prediction from a still image therefore fails at the quantitative step: the strongest models use the deciding quantity when they are given it, but do not produce it on their own. For models that plan or act in the physical world, a fluent account of a scene is thus no evidence of a correct prediction: such models must find and compute the deciding quantity unprompted, and DominoBench tests whether they do.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉语言模型能否看着链式反应的图片并说出会发生什么？最近的多模态模型能流畅地描述场景并解决教科书上的物理问题，这表明它们也应该能预测一旦球被推动，包含斜坡、壁架、钟摆、跷跷板和多米诺骨牌的场景会如何发展。我们在来自10个系列的30个模型上测试了这一说法，并得出了明确的结论：在没有辅助的情况下，没有模型能可靠地预测结果。我们构建了DominoBench，这是一个由物理模拟器计算结果的2D刚体场景静态图像基准。它包含427个最小对中的854个项目，其中一个数量改变一到三个网格步长就能决定一个人是否存活，并且每个项目都带有一个四步提示阶梯，以决定结果的精确计算结束。在没有辅助的情况下，来自Anthropic、Google和OpenAI的前沿模型在命运翻转的人上最多答对72%的项目，并且最多在34%的项目中正确回答一对中的两个孪生问题。指出决定性的步骤帮助很小，以文本形式给出的精确几何形状也几乎没有帮助，然而，一旦写出决定性的计算及其所需的数量（包括静态图像无法显示的速度），相同的模型在决定性的人上达到82-92%的正确率，而小型开放权重模型则保持在接近随机的水平。因此，从静态图像进行物理预测在定量步骤上失败了：最强的模型在给定决定性数量时会使用它，但无法自行产生它。对于在物理世界中规划或行动的模型，对场景的流畅描述因此不是正确预测的证据：此类模型必须未经提示地找到并计算决定性的数量，而DominoBench测试了它们是否做到了这一点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估视觉语言模型从静态图像进行多步物理推理和预测链式反应结果的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了DominoBench基准，包含427个最小对中的854个2D刚体场景静态图像项目；发现无辅助下前沿模型无法可靠预测物理结果，但在提供决定性计算和数量后准确率大幅提升至82-92%；揭示了当前模型在物理预测的定量步骤上存在失败，无法自行计算决定性数量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明当前多模态模型在流畅描述场景方面表现良好，但在无提示下缺乏从静态图像中提取和计算定量物理量的能力。局限性在于：摘要未提供关于模型在真实3D物理环境或动态视频中的表现数据，且基准仅限于2D刚体场景的静态图像，未探讨模型在更复杂物理交互中的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与多模态学习 / 物理推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e145. MemInStream: Memorizing or Merely Recognizing? Rethinking Streaming Video Memory Evaluation（MemInStream：记忆还是仅仅识别？重新思考流式视频记忆评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15640\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15640\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video understanding aims to continuously process incoming visual observations, making the retention and retrieval of relevant information increasingly important as the video history grows. Although existing benchmarks include memory-related questions, question-answering accuracy alone does not reliably measure memory capabilities. Incorrect predictions may arise from failures in visual understanding rather than forgetting, whereas correct predictions may rely on linguistic priors or recent observations without requiring historical memory. To address these ambiguities, we introduce MemInStream, a benchmark dedicated to evaluating memory capabilities in streaming video understanding. We develop an evidence-controlled validation protocol that associates each question with temporally localized evidence intervals. The protocol validates evidence solvability and memory necessity by retaining questions that models can answer from the annotated evidence but cannot resolve using recent observations, post-evidence observations, or textual input alone. This helps disentangle memory limitations from understanding failures while reducing memory-independent shortcuts. MemInStream provides a systematic evaluation of memory capabilities through four major categories, covering Episodic Retrieval, State Tracking \\\u0026amp; Updating, Multi-Evidence Integration, and Contextual Memory across diverse video scenarios. Overall, MemInStream provides a comprehensive and reliable benchmark for systematically evaluating memory capabilities in streaming video understanding.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频理解旨在持续处理传入的视觉观察，随着视频历史的增长，相关信息的保留和检索变得越来越重要。尽管现有的基准测试包含与记忆相关的问题，但仅凭问答准确率并不能可靠地衡量记忆能力。不正确的预测可能源于视觉理解的失败而不是遗忘，而正确的预测可能依赖语言先验或最近的观察，而不需要历史记忆。为了解决这些歧义，我们引入了MemInStream，一个专门用于评估流式视频理解中记忆能力的基准测试。我们开发了一种证据控制的验证协议，将每个问题与时间局部化的证据区间相关联。该协议通过保留那些模型可以从注释证据中回答，但无法仅使用最近观察、证据后观察或纯文本输入解决的问题，来验证证据的可解性和记忆的必要性。这有助于将记忆限制与理解失败区分开来，同时减少不依赖记忆的捷径。MemInStream通过四个主要类别提供对记忆能力的系统评估，涵盖不同视频场景中的情节检索、状态跟踪与更新、多证据整合和上下文记忆。总体而言，MemInStream为系统评估流式视频理解中的记忆能力提供了一个全面且可靠的基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个专门用于评估流式视频理解中记忆能力的基准测试（MemInStream），以解决现有基准中问答准确率无法可靠衡量记忆能力的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 指出现有基准中问答准确率无法区分视觉理解失败与记忆遗忘，且存在依赖语言先验或近期观察的捷径。2. 提出MemInStream基准及证据控制验证协议，通过时间局部化证据区间验证证据可解性和记忆必要性。3. 涵盖情节检索、状态跟踪与更新、多证据整合和上下文记忆四大类记忆能力评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要清晰地定义了流式视频记忆评估的痛点（理解失败与遗忘的混淆、非记忆捷径），并提出了严谨的证据控制验证协议来消除这些歧义。局限性方面，摘要未提供具体的视频数据集规模、模型在该基准上的具体表现数字、四大类别的具体样本数量，也未说明该协议在自动化构建基准时的可行性或潜在的人工标注偏差。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e146. Disen-Forcing: Disentangling Semantic Anchoring from Motion for Autoregressive Video Diffusion（Disen-Forcing：在自回归视频扩散中解耦语义锚定与运动）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.02822\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.02822\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoregressive video diffusion models (AR-VDMs) enable real-time, long-horizon video generation but degrade rapidly once the inference horizon outruns the training horizon, due to compounding exposure bias. To stabilize long rollouts, recent methods heuristically adopt frame sink, keeping initial frames as a persistent model context, inspired by attention sinks in LLMs. We revisit this design and find that the mechanism by which initial frames stabilize long-range consistency in AR-VDMs is not an LLM-style attention sink; instead, long-range consistency is anchored through a sparse subset of attention heads, while the majority of heads predominantly capture local temporal dynamics. This observation reveals an over-conditioning pathology in existing frame-sink strategies: by universally exposing every head to the pinned initial-frame context, the model becomes prone to collapsing motion toward the low-dynamic modes of the teacher during model distillation. We propose Disen-Forcing, a distillation-time plug-in for AR-VDMs that disentangles and reinforces this head specialization through disentangled context routing and motion-disentangling regularization. On long-horizon video generation benchmarks, Disen-Forcing simultaneously improves long-range consistency and motion dynamics of base AR-VDMs, a trade-off that sink-based methods fail to balance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自回归视频扩散模型（AR-VDMs）能够实现实时、长视野的视频生成，但由于复合暴露偏差，一旦推理视野超出训练视野，其性能会迅速下降。为了稳定长程展开，最近的方法受LLM中注意力汇聚的启发，启发式地采用帧汇聚，将初始帧保留为持久的模型上下文。我们重新审视了这一设计，发现初始帧在AR-VDMs中稳定长程一致性的机制并非LLM式的注意力汇聚；相反，长程一致性是通过注意力头的稀疏子集来锚定的，而大多数头主要捕捉局部时间动态。这一观察揭示了现有帧汇聚策略中的一种过度条件化病理：通过普遍地将每个头暴露于固定的初始帧上下文，模型在模型蒸馏期间容易将运动坍缩向教师的低动态模式。我们提出了Disen-Forcing，这是一种用于AR-VDMs的蒸馏时插件，通过解耦上下文路由和运动解耦正则化来解耦并强化这种头的专业化。在长视野视频生成基准上，Disen-Forcing同时改善了基础AR-VDMs的长程一致性和运动动态，这是基于汇聚的方法无法平衡的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决自回归视频扩散模型（AR-VDMs）在长视野生成中因复合暴露偏差导致的性能下降问题，并改进现有的帧汇聚策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示AR-VDMs中长程一致性并非通过LLM式的注意力汇聚实现，而是由稀疏注意力头子集锚定，多数头捕捉局部动态。2. 指出现有帧汇聚策略存在过度条件化病理，导致蒸馏时运动向低动态模式坍缩。3. 提出Disen-Forcing蒸馏时插件，通过解耦上下文路由和运动解耦正则化强化头的专业化。4. 在长视野视频生成基准上，同时提升了长程一致性和运动动态，打破了现有方法的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要深入分析了AR-VDMs中注意力头的作用机制，并提出了有效的蒸馏时插件以解决长程生成中的运动坍缩问题。局限性方面，摘要未提供Disen-Forcing插件对训练时间或计算资源的具体增加开销、在不同基础模型架构上的泛化表现、以及长视野视频生成基准的具体名称和定量提升指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成与扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e147. Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks（虚假成功，无声失败：审计模拟操作基准的成功检查器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25179\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25179\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSimulated manipulation benchmarks measure policy performance using hand-written success checkers that label each episode as a success or failure. Passing an expert demonstration shows that a checker accepts one way of completing the task. Learned policies, however, may stop after partial progress or complete the task in a different way. A checker may then accept an incomplete execution (phantom success) or reject an execution that satisfies the instruction (silent failure). In this paper, we introduce SimAudit, an LLM-based pipeline that audits success checkers against task instructions. SimAudit analyzes the instruction and checker code to identify scenarios where the two may disagree, recreates those scenarios in simulation, and runs the original checker. Multi-view renderings are then used to verify whether the observed behavior satisfies the instruction. Across RoboTwin 2.0, RoboCasa365, and RoboDojo, 183 simulated test cases produced the predicted checker verdict. Visual verification and deduplication yielded 61 distinct defects across 49 tasks, including 40 phantom successes and 21 silent failures. Most defects in RoboCasa365 accepted incomplete executions, most in RoboDojo rejected valid executions, and both error types were common in RoboTwin 2.0. These findings suggest that validating success checkers requires testing both incomplete executions and valid alternatives to expert demonstrations, and motivate more rigorous evaluation protocols for future benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e模拟操作基准使用手写的成功检查器来衡量策略性能，将每个片段标记为成功或失败。通过专家演示表明检查器接受一种完成任务的方式。然而，学习到的策略可能会在部分进展后停止，或者以不同的方式完成任务。此时，检查器可能会接受不完整的执行（虚假成功）或拒绝满足指令的执行（无声失败）。在本文中，我们引入了SimAudit，一个基于LLM的流水线，用于根据任务指令审计成功检查器。SimAudit分析指令和检查器代码以识别两者可能产生分歧的场景，在模拟中重现这些场景，并运行原始检查器。然后使用多视图渲染来验证观察到的行为是否满足指令。在RoboTwin 2.0、RoboCasa365和RoboDojo中，183个模拟测试用例产生了预测的检查器裁决。视觉验证和去重产生了49个任务中的61个不同缺陷，包括40个虚假成功和21个无声失败。RoboCasa365中的大多数缺陷接受了不完整的执行，RoboDojo中的大多数缺陷拒绝了有效的执行，而这两种错误类型在RoboTwin 2.0中都很常见。这些发现表明，验证成功检查器需要测试不完整的执行和专家演示的有效替代方案，并激发了对未来基准更严格的评估协议。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e审计模拟操作基准中手写成功检查器的准确性，识别并量化“虚假成功”（接受不完整执行）和“无声失败”（拒绝有效执行）缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出基于LLM的SimAudit流水线，通过分析指令和检查器代码识别分歧场景并在模拟中重现验证；在三个基准（RoboTwin 2.0, RoboCasa365, RoboDojo）中发现49个任务的61个缺陷（40个虚假成功，21个无声失败）；揭示了不同基准中错误类型的分布差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SimAudit有效发现了现有基准中成功检查器的缺陷，强调了验证检查器需要考虑不完整执行和替代方案。局限性方面，摘要未提供SimAudit流水线自身的计算成本、局限性或对其他未测试基准的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/强化学习/基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e148. Do Probing and Steering Favor the Same Directions Within and Across Language Models?（探测与引导在语言模型内部及跨模型之间是否偏好相同的方向？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19499\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19499\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA direction in a language model\u0026#x27;s hidden state can be used to probe whether a concept is present or to steer the model toward it. Although probe directions are often reused for steering, the direction that best detects a concept need not be the one that best changes it. We study this distinction in three instruction-tuned models from different families. We construct a one-parameter family of directions ranging from a covariance-adjusted discriminant to the mean difference, and evaluate probing and additive steering, which adds the direction to the hidden state, along the family at a fixed side effect. For truthfulness and sentiment, in every model, the best probe is not the best steering direction: steering consistently favors directions closer to the mean difference. This separation holds across 59 of 60 layer-model-concept combinations in a layer sweep, with matched probe and steering texts in all six model-concept combinations, and under a rotation-based steering operator. The exact steering optimum is less stable: for sentiment, an intermediate direction produces a 27-56% stronger steering effect than the mean difference, but this gain shrinks or disappears with matched texts and depends on the layer and the operator.\u003cbr\u003e  The two roles also transfer differently across models. A probe transferred by a linear map fitted on neutral text retains 81-91% of the target model\u0026#x27;s above-chance probing performance, while the transferred mean difference retains less of its steering effect in 11 of 12 model pairs. This is a consistent tendency, although our predefined criteria classify only three pairs, and nine remain inconclusive. Finally, as an application on PopQA, steering toward \u0026quot;unknown\u0026quot; increases abstention by 18-44 percentage points on uncertain errors, versus 2-5 on confident errors, while rarely correcting errors in cases where a correct answer is reachable.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型隐藏状态中的一个方向可用于探测某个概念是否存在，或引导模型朝向该概念。尽管探测方向经常被重复用于引导，但最能检测概念的方向未必是最能改变它的方向。我们在来自不同系列的三个指令微调模型中研究了这种区别。我们构建了一个单参数方向族，范围从协方差调整后的判别式到均值差，并在固定副作用下，沿着该方向族评估探测和加性引导（将方向添加到隐藏状态）。对于真实性和情感，在每个模型中，最佳探测方向不是最佳引导方向：引导一致地偏好更接近均值差的方向。这种分离在层扫描的60个层-模型-概念组合中的59个中成立，在所有六个模型-概念组合中具有匹配的探测和引导文本，并且在基于旋转的引导算子下也成立。精确的引导最优值不太稳定：对于情感，中间方向产生的引导效果比均值差强27-56%，但这种增益在文本匹配时缩小或消失，并取决于层和算子。这两个角色在跨模型转移时也表现不同。通过在中性文本上拟合的线性映射转移的探测，保留了目标模型高于随机探测性能的81-91%，而转移的均值差在12个模型对中的11个中保留了较少的引导效果。这是一种一致的倾向，尽管我们的预定义标准仅对三对进行了分类，九对仍不确定。最后，作为在PopQA上的应用，向“未知”引导使不确定错误的弃权率增加了18-44个百分点，而自信错误仅增加2-5个百分点，同时在正确答案可达的情况下很少纠正错误。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究语言模型隐藏状态中用于概念探测和概念引导的方向是否相同，以及这两种方向在跨模型转移时的表现差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现最佳探测方向与最佳引导方向存在显著分离，引导更偏好接近均值差的方向；精确的引导最优值不稳定，受文本匹配、层和算子影响；探测方向跨模型转移时性能保留较好，而引导方向保留较差；在PopQA应用中，向“未知”引导能有效增加不确定错误的弃权率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详实的跨模型、跨层、跨概念的实验数据，证明了探测与引导方向的分离现象及跨模型转移的差异。关于该发现对模型可解释性或对齐技术的具体改进方案，以及跨模型转移中九对不确定结果的具体原因，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 模型可解释性与机制分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e149. PlayCraft: Designing Engaging Games from Agent Play Experience（PlayCraft：从智能体游玩体验中设计引人入胜的游戏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26624\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26624\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent AI agents can generate playable games, but these games are not necessarily engaging. Mastery is a key source of engagement, yet designing for it requires extensive human play and tuning. We propose PlayCraft, an automated framework that uses a vision-based agent to play games and draws on its detailed play experience to revise them for mastery. Starting from an initial game, PlayCraft alternates between playing and crafting. In the playing stage, a player agent watches the game screen, uses the controls, and pursues the game objective over repeated episodes while retaining memory. After each episode, it reports its progress, outcomes, decisions, and reflections. In the crafting stage, a crafter agent uses these reports to revise the game. It estimates player abilities, predicts performance at different proficiency levels, and compares those predictions with a target learning progression. It diagnoses the game and addresses the gaps by giving players meaningful opportunities to improve through better decisions and execution. We evaluate games in fresh runs with player agents across three intelligence settings, measuring learning gain and learning slope. Compared with the initial games, PlayCraft yields larger learning gains and steeper learning slopes in most games. It also outperforms the baselines on the macro-average of each metric at every intelligence setting.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的AI智能体可以生成可玩的游戏，但这些游戏不一定引人入胜。精通（Mastery）是引人入胜的关键来源，但为其设计需要大量的人类游玩和调试。我们提出了PlayCraft，这是一个自动化框架，使用基于视觉的智能体来玩游戏，并利用其详细的游玩体验来修改游戏以达到精通。从初始游戏开始，PlayCraft在游玩和制作之间交替。在游玩阶段，玩家智能体观看游戏屏幕，使用控制，并在保留记忆的情况下在重复的回合中追求游戏目标。在每个回合之后，它报告其进度、结果、决策和反思。在制作阶段，制作者智能体使用这些报告来修改游戏。它评估玩家能力，预测不同熟练度水平下的表现，并将这些预测与目标学习进度进行比较。它诊断游戏并通过为玩家提供通过更好决策和执行来提高的有意义机会来解决差距。我们在三种智能设置下使用玩家智能体在全新运行中评估游戏，测量学习增益和学习斜率。与初始游戏相比，PlayCraft在大多数游戏中产生了更大的学习增益和更陡的学习斜率。它在每种智能设置下的每个指标的宏观平均值上也优于基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个自动化框架PlayCraft，利用视觉智能体的游玩体验来自动修改和打磨AI生成的游戏，以提升玩家的精通感和游戏参与度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出PlayCraft框架，通过玩家智能体和制作者智能体的交替工作，利用智能体的详细游玩报告来评估玩家能力并调整游戏难度与学习进度；在三种智能设置下的评估中，相比初始游戏实现了更大的学习增益和更陡的学习斜率，且优于基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明PlayCraft通过智能体反思和预测来调整游戏，提升了学习增益和斜率。局限性方面，摘要未提供该框架在人类玩家实际测试中的表现、智能体视觉和决策能力的局限性对游戏修改的影响、以及计算成本等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与游戏设计/人机交互（AI智能体/游戏生成）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e150. BiCAT: Bimanual Coordination Action Tokenization（BiCAT：双臂协调动作分词）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23499\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23499\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoregressive vision-language-action (VLA) models predict discrete action tokens with the next-token objective of their vision-language backbone, so the action tokenizer defines the interface between the policy and the robot. In bimanual manipulation, the two arms share a repertoire of movements yet coordinate through complementary roles, and an action representation should capture both. However, most existing tokenizers encode both arms as a single concatenated action vector, in which motion patterns common to the two arms are not shared and cross-arm dependencies remain entangled within each token. The policy must therefore learn both aspects implicitly. We propose Bimanual Coordination Action Tokenization (BiCAT), which shares one motion representation across arms while conditioning each arm\u0026#x27;s tokens on its partner through symmetric cross-arm attention and a joint decoder. The policy then predicts all tokens of each arm in parallel, generating the left arm first and the right arm conditioned on it. Across ten RoboTwin 2.0 tasks and six real-world tasks on three embodiments, BiCAT achieves the highest success among the compared tokenizers. In simulation, it improves mean success by 17.6 percentage points over the strongest of eight baselines, with the largest gains on tasks that require close coordination between the arms, while requiring only 40.5 ms per action chunk. These results suggest that the action tokenizer is a natural place to model bimanual coordination.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自回归视觉-语言-动作（VLA）模型使用其视觉-语言主干的下一个词元目标来预测离散动作词元，因此动作分词器定义了策略与机器人之间的接口。在双臂操作中，两只手臂共享动作库但通过互补角色进行协调，动作表示应同时捕获这两者。然而，大多数现有的分词器将两只手臂编码为单个连接的动作向量，其中两臂共有的运动模式未被共享，且跨臂依赖关系在每个词元内保持纠缠。因此，策略必须隐式地学习这两个方面。我们提出了双臂协调动作分词（BiCAT），它在手臂之间共享一个运动表示，同时通过对称跨臂注意力和联合解码器将每只手臂的词元以其伙伴为条件。然后，策略并行预测每只手臂的所有词元，先生成左臂，然后以左臂为条件生成右臂。在十个RoboTwin 2.0任务和三个实体上的六个真实世界任务中，BiCAT在比较的分词器中取得了最高的成功率。在仿真中，与八个基线中最强的一个相比，它将平均成功率提高了17.6个百分点，在需要手臂紧密协调的任务上获得了最大的收益，同时每个动作块仅需40.5毫秒。这些结果表明，动作分词器是建模双臂协调的自然位置。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e双臂机器人操作中的动作分词，将动作表示为离散词元以用于自回归视觉-语言-动作模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出BiCAT动作分词器，通过共享运动表示、对称跨臂注意力和联合解码器显式建模双臂协调；在10个仿真任务和6个真实世界任务中取得最高成功率，仿真平均成功率比最强基线提高17.6个百分点，且推理速度快，每个动作块仅需40.5毫秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明BiCAT通过显式建模跨臂依赖和共享运动模式，解决了现有分词器中动作模式不共享和依赖纠缠的问题，显著提升了需要紧密协调的任务成功率。关于不同实体间泛化能力的详细对比、失败案例分析或真实世界任务中具体误差指标等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e151. FVScore: Specification-Driven Neuro-Symbolic Video Evaluation（FVScore：规范驱动的神经常符号视频评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22673\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22673\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Faithfulness Video Score (FVSCORE), a neuro-symbolic framework for specification-driven video generation evaluation. Existing evaluators rely on holistic MLLM judgments or vision-language metrics, yet aligning their scores with human judgments and tracing them to specific temporal violations remain open challenges. FVSCORE addresses these limitations by compiling each video into explicit propositions capturing prompt requirements and implicit propositions capturing unstated physical, temporal, and cross-modal constraints. It grounds each proposition using specialized perceptual tools and evaluates the resulting confidence traces with soft temporal operators inspired by Linear Temporal Logic. A Significance-Aware Calibration step then aligns verification with human perception by retaining only perceptually significant violations before producing a timestamp- and evidence-grounded report. We conduct extensive experiments across public and complex multi-event benchmarks with the strongest video models to date, demonstrating that FVSCORE outperforms holistic and agent-based evaluators in human correlation while providing highly accurate and interpretable feedback.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们引入了忠实度视频分数（FVSCORE），一个用于规范驱动的视频生成评估的神经常符号框架。现有的评估器依赖于整体的多模态大语言模型（MLLM）判断或视觉语言指标，然而将它们的分数与人类判断对齐并追踪到特定的时间违规仍然是一个未解决的挑战。FVSCORE 通过将每个视频编译为捕获提示词要求的显式命题和捕获未说明的物理、时间和跨模态约束的隐式命题来解决这些限制。它使用专门的感知工具对每个命题进行基础化，并使用受线性时序逻辑启发的软时序算子评估由此产生的置信度痕迹。然后，重要性感知校准步骤通过仅保留感知上显著的违规来将验证与人类感知对齐，然后生成基于时间戳和证据的报告。我们在迄今为止最强的视频模型的公开和复杂多事件基准测试中进行了大量实验，表明 FVSCORE 在人类相关性方面优于整体和基于智能体的评估器，同时提供高度准确和可解释的反馈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过规范驱动的神经常符号框架（FVSCORE），对视频生成结果进行与人类判断对齐且可解释的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 FVSCORE 框架，将视频编译为显式和隐式命题；利用专门感知工具进行基础化，并结合线性时序逻辑的软时序算子评估置信度；引入重要性感知校准步骤以对齐人类感知；在人类相关性上优于现有整体和基于智能体的评估器，并提供可解释反馈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 FVSCORE 在人类相关性和可解释性方面表现优异。但摘要未提供具体的评估指标数值（如相关系数），未说明专门感知工具的具体类型及其各自的误差率，也未提及该框架在处理高度抽象或主观提示词时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e152. NexSight: Verifiable Tasks for Fine-Grained Agentic Long-Video Understanding（NexSight：用于细粒度智能体长视频理解的可验证任务）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22790\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22790\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFine-grained questions about long videos ask how many times an action occurs, in what order events unfold, or exactly when a state changes. Answering them can require finding brief moments scattered across hours of footage. Agentic models that decide when and where to look promise to find these moments, yet this ability is hard both to measure and to learn. Sparse supporting evidence may establish that an action occurred without establishing its total count; verifying timeline-wide claims requires checking for missed occurrences and double counting. Answer-only supervision, in turn, does not explicitly supervise the search for evidence. We present NexSight, which builds verifiable tasks to both evaluate and train agentic long-video understanding. Its agentic pipeline, SightForge, accepts a task only if a verifier blind to the draft answer can reconstruct it from evidence densely reacquired from the raw video and counterexample checks fail to refute it. This yields SightLine, 310 evidence-traceable tasks from 108 long videos, evaluated through SightLoop, a shared multiscale harness supporting temporal exploration, local inspection, evidence integration, and revisiting while recording returned observations. On disjoint videos, solver trajectories on verified tasks become step-level supervision for observation decisions. The strongest model reaches only 54.52% on SightLine, yet 79.35% when given the annotated evidence. With under 6K examples, Sight-35B nearly doubles its base model\u0026#x27;s interactive accuracy (21.29% to 42.26%), outperforms the 397B model of its family, begins using explicit spatial inspection after post-training, which its base model never uses, and gains over 8 points on two external long-video benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e关于长视频的细粒度问题会询问某个动作发生了多少次、事件按什么顺序展开，或者状态究竟在何时发生变化。回答这些问题可能需要在数小时的素材中寻找散落的短暂瞬间。决定何时何地观察的智能体模型有望找到这些瞬间，但这种能力既难以衡量也难以学习。稀疏的支持性证据可能证明某个动作发生过，但无法确定其总次数；验证时间线上的声明需要检查是否遗漏了发生次数以及是否重复计数。另一方面，仅答案的监督并没有明确监督对证据的搜索。我们提出了NexSight，它构建可验证任务来评估和训练智能体长视频理解。其智能体流程SightForge仅在验证者对草稿答案盲视的情况下，能够从原始视频中密集重新获取的证据重构答案，且反例检查未能反驳它时，才接受一个任务。这产生了SightLine，包含来自108个长视频的310个证据可追溯任务，通过SightLoop进行评估，SightLoop是一个共享的多尺度框架，支持时间探索、局部检查、证据整合和重访，同时记录返回的观察结果。在不相交的视频上，已验证任务上的求解器轨迹成为观察决策的步骤级监督。最强的模型在SightLine上仅达到54.52%，但在提供注释证据时达到79.35%。在不到6K个样本的情况下，Sight-35B将其基础模型的交互准确率几乎翻倍（从21.29%提高到42.26%），超越了其家族中的397B模型，在后训练后开始使用显式的空间检查（其基础模型从未使用过），并在两个外部长视频基准上获得了超过8分的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和训练智能体长视频理解，特别是解决关于长视频的细粒度问题（如动作发生次数、事件顺序、状态变化时间）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出NexSight构建可验证任务；提出SightForge智能体流程进行任务验证；构建包含310个任务的SightLine数据集；提出支持多尺度探索的SightLoop评估框架；Sight-35B模型在不到6K样本下将交互准确率从21.29%提升至42.26%，并超越同家族397B模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要表明仅答案监督不足以指导证据搜索，NexSight通过引入可验证任务和步骤级监督解决了这一问题。Sight-35B通过少量样本实现了显著的性能提升和空间检查能力的涌现。局限：摘要未提供具体的外部长视频基准名称、Sight-35B的具体架构细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与长视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e153. A Foundation Model to Measure and Predict Human Behaviour（一个用于测量和预测人类行为的基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24830\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24830\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly used to infer psychological attributes, predict individual behaviour, and simulate human populations. However, despite generating plausible responses, they often misrepresent individuals and distort population statistics. Here we introduce Chiron, a foundation model to measure and predict human behaviour. We jointly fine-tune an LLM to represent psychological constructs, predict individual behaviour, and align population response distributions with human statistics. The training and evaluation data span 36 behavioural domains and 78 social science experiments, comprising 288,307 person records, 1,411,750 atomic behavioural decisions, and 99,953 psychometric assessments over 109 psychological constructs. In our evaluations, Chiron\u0026#x27;s psychological measurements agree more closely with human self-reports and exhibit fewer biases that undermine psychometric validity. It predicts individual behaviour more accurately than frontier LLMs (up to 28.4% relative improvement). In simulations of social science experiments, it more accurately captures the direction and magnitude of human experimental effects (82.2--94.3% lower effect-size estimation error). Together, these results establish Chiron as a unified computational instrument for measuring and predicting human behaviour.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLMs）越来越多地用于推断心理属性、预测个体行为并模拟人类群体。然而，尽管能生成看似合理的响应，它们经常错误表征个体并扭曲群体统计数据。在此，我们引入Chiron，一个用于测量和预测人类行为的基础模型。我们联合微调一个LLM以表征心理构念、预测个体行为，并使群体响应分布与人类统计数据对齐。训练和评估数据跨越36个行为领域和78个社会科学实验，包含288,307条个人记录、1,411,750个原子行为决策，以及针对109个心理构念的99,953项心理测量评估。在我们的评估中，Chiron的心理测量与人类自我报告更一致，并表现出更少破坏心理测量有效性的偏差。它比前沿LLM更准确地预测个体行为（相对提升高达28.4%）。在社会科学实验的模拟中，它更准确地捕捉人类实验效应的方向和大小（效应量估计误差降低82.2%至94.3%）。综合这些结果，确立了Chiron作为测量和预测人类行为的统一计算工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e测量和预测人类行为，包括推断心理属性、预测个体行为以及模拟人类群体，同时纠正现有LLM在表征个体和扭曲群体统计方面的缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Chiron基础模型，联合微调LLM以表征心理构念、预测个体行为并对齐群体响应分布。2. 训练和评估数据规模庞大，涵盖36个行为领域、78个社会科学实验、超28.8万条个人记录和超141万个原子行为决策。3. 心理测量与人类自我报告更一致，偏差更少。4. 个体行为预测准确率比前沿LLM提升高达28.4%，社会科学实验效应量估计误差降低82.2%至94.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细列出了庞大的训练和评估数据规模（如288,307条记录、1,411,750个决策），并提供了具体的性能提升数字（28.4%相对提升，82.2-94.3%误差降低），证明了Chiron在人类行为预测上的有效性。局限性方面，摘要未提供36个行为领域和78个实验的具体名称，未说明模型在不同文化、年龄或特定人口统计学群体中的泛化能力和偏差情况，也未提及模型推理时的计算资源消耗。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算社会科学与人类行为建模\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e154. VAE Rhythm: Temporal Decoding Traces for AI-Generated Video Detection（VAE 节奏：用于 AI 生成视频检测的时间解码痕迹）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21114\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21114\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisible artifacts are an unreliable cue for detecting generated videos, because newer generators learn to remove them. We instead detect a trace left by the generation pipeline itself. Most video generators decode latents with a 3D causal VAE that groups consecutive frames in time, so the fidelity of generated frames rises and falls periodically with their position in a group. We call this periodic trace VAE Rhythm. Real videos are captured frame by frame and do not have it. To reveal it without training, we propose a phase scan. The scan reconstructs a clip with an off-the-shelf VAE from successive start offsets and measures the periodicity of the reconstruction error across these offsets. We find VAE Rhythm in most of the 39 variants of 31 generators we test, including the closed-source Sora, Kling 3.0 and Seedance 2.0. We use the rhythm as a zero-shot score, as a plug-in for existing detectors and as a data engine that pairs real videos with their VAE reconstructions to train our detector CaDet. On DF26, the training-free rhythm score outperforms all 15 retrained baselines, and as a plug-in it improves all 19 tested detectors by 6.7% to 23.7% AUROC. CaDet achieves the best AUROC on AIGVDBench, DF26 and three 2026 closed-source models, and its variant trained without any generated video still exceeds 90% on AIGVDBench.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e可见伪影是检测生成视频的不可靠线索，因为较新的生成器学会了去除它们。我们转而检测生成管道本身留下的痕迹。大多数视频生成器使用 3D 因果 VAE 解码潜变量，该 VAE 在时间上对连续帧进行分组，因此生成帧的保真度会随着其在组中的位置而周期性地上升和下降。我们称这种周期性痕迹为 VAE 节奏（VAE Rhythm）。真实视频是逐帧捕获的，没有这种痕迹。为了在不训练的情况下揭示它，我们提出了一种相位扫描（phase scan）。该扫描使用现成的 VAE 从连续的起始偏移量重建片段，并测量跨这些偏移量的重建误差的周期性。我们在测试的 31 个生成器的 39 个变体中的大多数中发现了 VAE 节奏，包括闭源的 Sora、Kling 3.0 和 Seedance 2.0。我们将该节奏用作零样本分数、现有检测器的插件，以及将真实视频与其 VAE 重建配对以训练我们的检测器 CaDet 的数据引擎。在 DF26 上，免训练的节奏分数优于所有 15 个重新训练的基线，并且作为插件，它将所有 19 个测试检测器的 AUROC 提高了 6.7% 到 23.7%。CaDet 在 AIGVDBench、DF26 和三个 2026 闭源模型上取得了最佳的 AUROC，其未经任何生成视频训练的变体在 AIGVDBench 上仍然超过 90%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过检测视频生成管道留下的时间解码痕迹（VAE节奏），来检测 AI 生成的视频。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现并利用 3D 因果 VAE 解码导致的帧保真度周期性变化（VAE 节奏）作为检测线索；提出免训练的相位扫描方法揭示该痕迹；该节奏可作为零样本分数或现有检测器的插件；提出 CaDet 检测器，在多个基准和闭源模型上取得最佳 AUROC。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 VAE 节奏是一种有效且通用的检测线索，CaDet 表现优异。但摘要未提供关于该痕迹在未来可能不使用 3D 因果 VAE 或采用非分组解码机制的生成器中的有效性，也未详细说明在极低分辨率或高度压缩视频下的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/多媒体安全与伪造检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e155. IDEA: Intent-Dominance Evidence Audit for Inference-Time Backdoor Detection in GUI Agents（IDEA：用于GUI智能体推理时后门检测的意图-主导证据审计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24102\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24102\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOrganizations increasingly deploy downloaded open-weight GUI agents. A backdoored agent passes acceptance tests on clean data and misbehaves only when a visual trigger appears on screen, turning an unvetted checkpoint into a supply-chain risk. However, existing sample-level detectors target image classifiers and CLIP-style encoders, leaving step-level backdoor detection for GUI agents unaddressed. On clean steps, the instruction drives the action; when an unreferenced screen region hijacks the step, the instruction loses control over the decision state or that region dictates it instead. We term this signature intent--evidence dominance inversion and propose IDEA (Intent-Dominance Evidence Audit) to detect backdoor activation at inference time for each step without trigger knowledge or attack data. Specifically, Intent Counterfactual Probing (ICP) measures how far redirected instructions move the decision state, and Region Causal Audit (RCA) quantifies how far ablating a candidate region moves it. A gated conformal score compares both displacements against clean steps at the same distance from the clean manifold, providing a finite-sample false-positive guarantee. Extensive experiments on Qwen2.5-VL-3B across five attack families show that IDEA consistently detects backdoor activation under a controlled false-positive rate and outperforms state-of-the-art detection methods, while localizing the trigger region for every alarm and adding only modest inference overhead.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e组织越来越多地部署下载的开源权重GUI智能体。被植入后门的智能体在干净数据上通过验收测试，并且仅在屏幕上出现视觉触发器时表现异常，从而将未经审查的检查点转化为供应链风险。然而，现有的样本级检测器针对图像分类器和CLIP风格的编码器，使得GUI智能体的步骤级后门检测仍未得到解决。在干净步骤中，指令驱动动作；当未被引用的屏幕区域劫持该步骤时，指令失去对决策状态的控制，或者该区域取而代之地决定它。我们将这种特征称为意图-证据主导反转，并提出IDEA（意图-主导证据审计），以在推理时检测每个步骤的后门激活，而无需触发器知识或攻击数据。具体而言，意图反事实探测（ICP）测量重定向指令使决策状态移动的距离，区域因果审计（RCA）量化消融候选区域使其移动的距离。门控共形分数将这两种位移与距离干净流形相同距离的干净步骤进行比较，提供有限样本的假阳性保证。在Qwen2.5-VL-3B上跨五个攻击系列的广泛实验表明，IDEA在受控的假阳性率下一致地检测后门激活，并优于最先进的检测方法，同时为每个警报定位触发区域，并且仅增加适度的推理开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在推理时检测GUI智能体每个步骤的后门激活，而无需触发器知识或攻击数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出意图-证据主导反转特征，并设计IDEA方法用于步骤级后门检测。2. 引入意图反事实探测（ICP）和区域因果审计（RCA）量化决策状态位移。3. 使用门控共形分数提供有限样本的假阳性保证。4. 在Qwen2.5-VL-3B上跨五个攻击系列实验，实现受控假阳性率下的后门检测，优于现有方法，并能定位触发区域且推理开销适度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明IDEA有效解决了GUI智能体步骤级后门检测的问题，通过ICP和RCA量化位移，并利用共形分数控制假阳性。局限性方面，摘要未提供关于该方法在其他基础模型上的泛化能力、对更复杂或未知攻击家族的防御效果，以及“适度”推理开销的具体量化数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能安全与GUI智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e156. MInfoVisQA: A Multilingual Benchmark for Information-Rich Visual Question Answering（MInfoVisQA：一个用于信息丰富视觉问答的多语言基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21644\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21644\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal large language models (MLLMs) excel in vision-language tasks; yet, whether they maintain consistent understanding of information-rich visuals (InfoVis) when the surface language changes remains unclear. To quantify this capability, we introduce MInfoVisQA, a parallel benchmark with 8,960 QA configurations derived from 128 seed instances across 24 languages. We construct seed-matched, language-parallel visuals and QA pairs by disentangling numerical-structural data from text and programmatically synchronizing translated labels. We evaluate 25 MLLMs under two settings: Language-Aligned QA (LQA, matching visual-text languages) and Cross-Language QA (XQA, fixed QA language with varying visual languages). The results show that aggregate accuracy masks substantial robustness gaps: two models with comparable mean LQA accuracy (80.4\\%) exhibit performance spreads of 7.8 and 20.3 percentage points across languages. Moreover, all 25 models score lower with non-English visuals under fixed English QA, underscoring the need for cross-language sensitivity metrics.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态大语言模型在视觉语言任务中表现出色；然而，当表面语言发生变化时，它们是否能保持对信息丰富视觉的一致理解仍不清楚。为了量化这种能力，我们引入了MInfoVisQA，这是一个包含8,960个问答配置的并行基准，源自24种语言的128个种子实例。我们通过将数字结构数据与文本分离，并以编程方式同步翻译标签，构建了种子匹配、语言平行的视觉和问答对。我们在两种设置下评估了25个多模态大语言模型：语言对齐问答（匹配视觉文本语言）和跨语言问答（固定问答语言，变化视觉语言）。结果表明，总体准确率掩盖了巨大的鲁棒性差距：两个具有可比平均语言对齐问答准确率（80.4%）的模型在不同语言上的表现差距分别为7.8和20.3个百分点。此外，在固定英语问答的情况下，所有25个模型在非英语视觉上的得分都较低，凸显了对跨语言敏感性指标的需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建多语言基准MInfoVisQA，量化评估多模态大语言模型在表面语言变化时对信息丰富视觉内容的一致理解能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入了包含8,960个问答配置、涵盖24种语言的多语言并行基准MInfoVisQA；发现总体准确率掩盖了模型在不同语言间的巨大鲁棒性差距（如80.4%平均准确率下存在7.8和20.3个百分点的表现差距）；证明了所有评估模型在非英语视觉下的得分均低于英语视觉，凸显了跨语言敏感性指标的必要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要介绍了MInfoVisQA基准的构建方法及其在评估25个多模态大语言模型跨语言视觉理解能力中的应用，揭示了总体准确率掩盖的鲁棒性差距以及模型对非英语视觉的敏感性。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/多模态学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e157. The novelty exposed: ablation, reproducibility and transparency in 40 technical reports of open-weight large language models (LLMs)（暴露的新颖性：40份开源大语言模型（LLM）技术报告中的消融实验、可重复性与透明度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20003\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20003\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn 2025 alone, 48 new large language model (LLM) architectures were added to the Hugging Face transformers library, and many of them arrive with a technical report that presents the model as new. What is actually new in these models, and is it tested? We put this question to LLM technical reports. We look at three things: what the reference code shows about how new open-weight architectures differ from earlier ones; what 40 randomly sampled technical reports claim as new and whether they support it with ablation studies; and what they disclose for reproducibility and transparency. In the library, 39 of the 48 architectures added in 2025 take at least two of their three core blocks from another model, most often Llama, although part of this reflects how the library writes code. In the reports, 19 of 73 architectural or training novelty claims come with a controlled with/without comparison; 4 of 40 reports state more than one training run; 8 rerun the models they compare against under one setup; and 1 discloses data mixture, token count, and compute together. We also looked for known components given new names: none of five candidate cases hid its origin, though we did not study model names. We propose seven reporting rules for LLM release reports and apply them to two reports. We do not judge model quality, and an untested claim may still be true.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e仅在2025年，就有48种新的大语言模型（LLM）架构被添加到Hugging Face transformers库中，其中许多附带一份将模型呈现为新的技术报告。这些模型中究竟有什么是新的，以及它们是否经过了测试？我们将这个问题应用于LLM技术报告。我们考察了三个方面：参考代码显示了新的开源架构与早期架构有何不同；40份随机抽样的技术报告声称什么是新的，以及它们是否通过消融研究来支持这些声明；以及它们为可重复性和透明度披露了什么。在该库中，2025年添加的48种架构中有39种从另一个模型（最常见的是Llama）中获取了其三个核心块中的至少两个，尽管这部分反映了该库编写代码的方式。在这些报告中，73项架构或训练新颖性声明中有19项附带了受控的有/无比较；40份报告中有4份说明了不止一次训练运行；8份报告在一种设置下重新运行了它们比较的模型；只有1份报告同时披露了数据混合、token数量和计算量。我们还寻找了被赋予新名称的已知组件：5个候选案例中没有一个隐藏了其来源，尽管我们没有研究模型名称。我们提出了七条LLM发布报告的报告规则，并将它们应用于两份报告。我们不评判模型质量，未经测试的声明可能仍然是真实的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估开源大语言模型（LLM）技术报告中的架构新颖性、消融实验支持情况以及可重复性和透明度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现2025年Hugging Face库中新增的48种架构里有39种至少两个核心块来自其他模型（如Llama）；在73项新颖性声明中仅19项有受控比较；仅1份报告同时披露数据混合、token数量和计算量；提出了七条LLM发布报告规则。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要揭示了当前LLM技术报告在架构新颖性声明和实验验证方面存在显著不足，大多数新颖性声明缺乏消融实验支持，且可重复性信息（如数据、计算量）披露极少。局限性在于：研究仅抽样了40份报告，且未研究模型名称的改名情况；作者明确指出不评判模型质量，且未测试的声明可能依然为真，这表明该分析仅限于报告规范性层面，无法反映模型实际性能。摘要未提供具体的七条报告规则细节及应用于两份报告的具体结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 科学评估与元分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e158. HubEgo-100K: In-the-Wild Egocentric Video of Skilled Work for Robot Learning（HubEgo-100K：用于机器人学习的野外熟练工作第一人称视频）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21938\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21938\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobot policies trained by imitation generalize poorly outside the environments and objects seen in training. Published data-scaling studies find that generalization grows with the diversity of training environments and objects rather than with more demonstrations per environment. Robot data is costly to collect across many environments, whereas egocentric human video can be recorded in the wild at scale; existing egocentric video, however, mostly shows daily-life activity and contains little skilled work in real workplaces. We present HubEgo-100K, a dataset built for diversity. This version of the paper covers the first release, v1.0: 10,124 hours of 1080p egocentric video with synchronized 100 Hz inertial (IMU) data from one head-mounted phone camera. In v1.0, 12,227 contributors record their own unscripted work in 15,548 environments (each one contributor\u0026#x27;s own setting of one type, such as their kitchen or workshop) across 11 setting types, 30 work categories, 56 task types and 35 action families, with 83% of hours in workplace settings. The release comprises 72,754 episodes with machine-generated action and language annotations, in LeRobot and MCAP formats under CC BY 4.0. We measure diversity along each axis, show that inside v1.0, with episodes in random order, new contributors and words keep appearing, and relate the measurements to published evidence on six data properties tied to policy performance, including hand visibility and inertial sensing. We also document collection, curation, privacy measures and data format, and provide a datasheet. Later versions of this paper will add benchmarks and cover further releases toward 100,000 hours.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e通过模仿训练的机器人策略在训练所见的环境和物体之外泛化能力较差。已发表的数据规模研究发现，泛化能力随着训练环境和物体多样性的增加而增长，而不是随着每个环境演示数量的增加而增长。在许多环境中收集机器人数据成本高昂，而第一人称人类视频可以在野外大规模录制；然而，现有的第一人称视频大多展示日常生活活动，在真实工作场所中很少包含熟练工作。我们提出了HubEgo-100K，一个为多样性而构建的数据集。本文的这个版本涵盖了首次发布v1.0：10,124小时的1080p第一人称视频，带有来自一个头戴式手机摄像头的同步100 Hz惯性（IMU）数据。在v1.0中，12,227名贡献者在15,548个环境中（每个环境是一名贡献者自己的一种类型设置，如他们的厨房或车间）录制了他们自己未经排练的工作，跨越11种设置类型、30个工作类别、56种任务类型和35个动作家族，其中83%的小时数在工作场所设置中。该发布包含72,754个片段，具有机器生成的动作和语言注释，采用LeRobot和MCAP格式，遵循CC BY 4.0协议。我们沿着每个轴测量多样性，表明在v1.0内部，随着片段按随机顺序排列，新的贡献者和词汇不断出现，并将这些测量结果与已发表的关于与策略性能相关的六个数据属性的证据联系起来，包括手部可见性和惯性传感。我们还记录了收集、整理、隐私措施和数据格式，并提供了数据表。本文的后续版本将添加基准测试并涵盖向100,000小时迈进的进一步发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个用于机器人学习的高多样性第一人称人类视频数据集（HubEgo-100K），以解决模仿学习策略泛化能力差的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了HubEgo-100K数据集的首个版本v1.0，包含10,124小时的1080p第一人称视频及同步的100 Hz IMU数据。2. 数据具有极高的多样性，由12,227名贡献者在15,548个环境中录制，涵盖11种设置类型、30个工作类别等，83%的数据来自工作场所。3. 包含72,754个带有机器生成动作和语言注释的片段，采用LeRobot和MCAP格式。4. 验证了数据在多个维度上的多样性，并将其与影响策略性能的六个数据属性（如手部可见性）相关联。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该数据集专注于解决机器人模仿学习中环境多样性不足的问题，通过大规模收集真实工作场所的第一人称视频来提升数据多样性。局限性方面，摘要提到后续版本将添加基准测试并涵盖向100,000小时迈进的进一步发布，暗示当前v1.0版本（10,124小时）尚未达到最终的100,000小时目标，且当前版本未提供具体的基准测试评估结果（摘要未提供）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学习 / 计算机视觉 / 数据集\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e159. MillBill: A Machining Agent with Geometric Feedback（MillBill：具有几何反馈的加工智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22565\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22565\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTurning a CAD model into a machining program requires both process knowledge and geometric precision. Language models can generate such workflows by writing geometry and toolpath code for each part, but this makes numerical execution part of the model\u0026#x27;s task. We introduce MillBill, an agent that separates machining decisions from their geometric execution and verification. Given a boundary-representation part, stock, and material, a locally hosted, mid-sized open model proposes operations and cutting parameters for indexed three-axis machining. A geometric harness generates toolpaths, simulates material removal, and returns feedback for plan refinement. Setup planning accounts for what the available cutters can physically reach, rather than visibility alone. We evaluate the resulting programs by the fraction of the target surface area within the specified tolerance after simulated machining. With Qwen3.8-27B, MillBill outperforms frontier-model approaches that construct their own geometry and toolpath workflows on the evaluated machining tasks. Code: https://github.com/kulibinai/millbill\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将CAD模型转化为加工程序需要同时具备工艺知识和几何精度。语言模型可以通过为每个零件编写几何和刀具路径代码来生成此类工作流，但这使得数值执行成为模型任务的一部分。我们引入了MillBill，一个将加工决策与其几何执行和验证分离的智能体。给定边界表示零件、毛坯和材料，一个本地托管的中型开源模型为分度三轴加工提出操作和切削参数。几何夹具生成刀具路径，模拟材料去除，并返回反馈以进行计划优化。设置规划考虑了可用刀具在物理上能够到达的范围，而不仅仅是可见性。我们通过模拟加工后在指定公差内的目标表面积比例来评估生成的程序。使用Qwen3.8-27B，MillBill在评估的加工任务上优于构建自身几何和刀具路径工作流的前沿模型方法。代码：https://github.com/kulibinai/millbill\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将CAD模型转化为加工程序，通过分离加工决策与几何执行和验证来生成工作流。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入MillBill智能体，将加工决策与几何执行和验证分离；使用本地托管的中型开源模型（Qwen3.8-27B）提出操作和切削参数；几何夹具生成刀具路径并模拟材料去除以提供反馈；设置规划考虑刀具物理可达性；在评估任务上优于构建自身工作流的前沿模型方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种将加工决策与几何执行分离的方法，并通过几何夹具提供反馈以优化计划。局限方面，摘要未提供具体的局限性分析，仅说明了评估指标和使用的模型，未提及计算成本、泛化到更复杂加工类型的能力或其他潜在限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机辅助设计与制造 / 人工智能应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e160. The Noise Floor of a Quantization Comparison: Engine, restart, batch and kernel drift, measured against 8-bit and 4-bit effects in two decision models（量化比较的噪声底线：在两个决策模型中针对8位和4位效应测量的引擎、重启、批次和内核漂移）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15671\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15671\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA quantized model is usually judged by comparing it with its BF16 original, but that comparison changes more than the weights. It often changes the serving engine, it always runs on a different server instance, it may change how requests are batched, and on some stacks the library selects a different kernel depending only on which packages import. We measure each of these sources on the same 2,400 public decisions for two of Cloudflare\u0026#x27;s decision models, Clef-flash (9B) and Clef (27B), on an NVIDIA GB10, and state every quantization effect as the excess over them. Sources that are not quantization move between 0 and 0.92% of decisions. llama.cpp restarts are bit-identical on every record for both models. vLLM restarts flip 0, 5 and 20 decisions at BF16, FP8 and NVFP4 on Clef-flash and 4, 0 and 22 on Clef; a third instance of Clef\u0026#x27;s quantized builds (exploratory) leaves FP8 at 0 and puts NVFP4 at 4 to 22, depending on which two instances are compared. An engine change at BF16 flips 6 to 16, a batch-size change 8 to 15, and the Gated DeltaNet kernel transformers selects unasked 10 to 14. Quantization inside one engine moves more: for Clef-flash and Clef, 0.88% and 1.04% at Q8_0, 2.12% and 1.62% at FP8, 5.79% and 3.50% at Q4_K_M, and 5.79% and 5.67% at NVFP4. On both models, every 4-bit interval excludes every non-quantization source. Two of our five pre-registered predictions failed, and the same two fail when the tests are rerun on the 27B: FP8 is not inside restart noise, and changing engine moves fewer decisions than 8-bit quantization does. Accuracy hides most of this. Over the full 31,275 public questions, Clef\u0026#x27;s Q4_K_M build moves accuracy by a net six questions (-0.02 points [-0.20, +0.16]) while 436 of its decisions get worse (exploratory), and NVFP4 costs Clef-flash 0.95 points and Clef 0.65. We release the code, quantization recipes, per-record outputs and the pre-registration.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e量化模型通常通过与其BF16原始模型进行比较来评判，但这种比较改变的不仅仅是权重。它通常会改变服务引擎，总是在不同的服务器实例上运行，可能会改变请求的批处理方式，并且在某些堆栈上，库仅根据导入的包选择不同的内核。我们在NVIDIA GB10上对Cloudflare的两个决策模型Clef-flash（9B）和Clef（27B）的相同2,400个公共决策测量了这些来源中的每一个，并将每种量化效应声明为超出它们的过量。非量化来源在0到0.92%的决策之间移动。llama.cpp重启在两个模型的每条记录上都是位相同的。vLLM重启在Clef-flash的BF16、FP8和NVFP4上分别翻转0、5和20个决策，在Clef上分别翻转4、0和22个；Clef量化构建的第三个实例（探索性）使FP8保持为0，并将NVFP4置于4到22之间，具体取决于比较哪两个实例。BF16下的引擎改变翻转6到16个，批次大小改变翻转8到15个，Gated DeltaNet内核转换器未经请求选择了10到14个。一个引擎内的量化移动更多：对于Clef-flash和Clef，在Q8_0下为0.88%和1.04%，在FP8下为2.12%和1.62%，在Q4_K_M下为5.79%和3.50%，在NVFP4下为5.79%和5.67%。在这两个模型上，每个4位区间都排除了每个非量化来源。我们五项预先注册的预测中有两项失败了，当在27B上重新运行测试时，同样的两项也失败了：FP8不在重启噪声范围内，并且改变引擎移动的决策少于8位量化。准确性掩盖了大部分这些情况。在全部31,275个公共问题上，Clef的Q4_K_M构建使准确性净移动了六个问题（-0.02分[-0.20, +0.16]），而其436个决策变得更糟（探索性），NVFP4使Clef-flash损失0.95分，Clef损失0.65分。我们发布了代码、量化配方、每条记录的输出和预先注册。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和量化大语言模型在量化过程中，除了权重变化外，由服务引擎、服务器重启、请求批处理和内核选择等非量化因素引起的决策变化（噪声底线），并将其与8位和4位量化效应进行对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示了模型量化比较中常被忽视的非量化变量（如引擎改变、重启、批处理、内核漂移）对决策结果的影响，其变化范围在0%至0.92%之间。2. 量化本身引起的决策变化更大，例如在NVFP4下，Clef-flash和Clef的决策变化分别达到5.79%和5.67%。3. 发现整体准确率指标掩盖了量化带来的局部决策恶化，例如Clef的Q4_K_M构建在准确率上仅净变动6个问题，但内部有436个决策变差。4. 公开了代码、量化配方、逐条记录输出及预注册信息，保证了研究的可重复性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明研究严谨地控制了量化评估中的混淆变量，揭示了非量化因素（噪声底线）和量化因素对模型输出的具体影响，并指出传统的准确率指标会掩盖决策层面的恶化。局限性方面，摘要提到五项预先注册的预测中有两项失败（FP8不在重启噪声范围内，改变引擎移动的决策少于8位量化），这表明模型量化带来的影响具有复杂性和不可完全预测性；此外，摘要未提供关于这些发现如何具体指导未来量化算法设计或系统部署优化的进一步实验结果或技术细节（摘要未提供）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 模型量化 / 系统评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e161. Invariant-Aware Harness Enforcement to Protect LLM Agents from Silent API Failures（不变量感知的执行环境强制执行以保护LLM智能体免受静默API故障影响）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20595\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20595\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLM agents answer questions by calling APIs and trusting the results. An API can fail silently. It ignores part of a request, such as a misnamed filter, yet returns HTTP 200 and a plausible but wrong result. Current fixes, such as checklists, reviewer models and LLM judges, ask the model to catch it. But models often see the problem and answer anyway. We present SilentGuard, which moves the decision from the model to the harness running tool calls. It tests each result against invariants that any correct API must satisfy and withholds values that break one. We find silent failures in 11 of 15 public research APIs, with counts inflated up to 691 times. Current fixes leave over 70% of answers wrong, and agents report 77.4% of counts a judge flags. Across 7 open models, SilentGuard cuts wrong answers on its target faults from 74.0% to 1.7%, with no loss on fault-free tasks. On three frontier models they fall from 70.2% to 0.5%. A warning from the same check leaves 70.1% wrong, so enforcement is the key. On new fault types, the harness alone cuts wrong answers from 61.1% to 24.5%. It avoids wrong answers by abstaining rather than recovering.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLM）智能体通过调用API并信任结果来回答问题。API可能会发生静默故障。它忽略请求的一部分，例如命名错误的过滤器，但仍返回HTTP 200和一个合理但错误的结果。当前的修复方法，如检查表、审查模型和LLM评判器，要求模型来捕获它。但模型经常看到问题却依然作答。我们提出了SilentGuard，它将决策从模型转移到运行工具调用的执行环境。它根据任何正确API必须满足的不变量来测试每个结果，并扣留打破不变量的值。我们在15个公开研究API中的11个中发现了静默故障，计数被夸大了多达691倍。当前的修复方法导致超过70%的答案错误，智能体报告了评判器标记的77.4%的计数。在7个开源模型中，SilentGuard将其目标故障的错误答案从74.0%降至1.7%，在无故障任务上没有损失。在三个前沿模型中，错误率从70.2%降至0.5%。来自相同检查的警告仍留下70.1%的错误，因此强制执行是关键。对于新的故障类型，仅靠执行环境将错误答案从61.1%降至24.5%。它通过弃权而不是恢复来避免错误答案。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出SilentGuard方法，通过将决策从LLM模型转移到运行工具调用的执行环境，利用不变量测试API返回结果，以解决API静默故障导致LLM智能体输出错误答案的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SilentGuard，将错误拦截决策从LLM模型移至执行环境，通过不变量测试拦截打破规则的API返回值。2. 发现15个公开研究API中有11个存在静默故障，计数错误最高达691倍。3. 在7个开源模型中，将目标故障的错误率从74.0%大幅降至1.7%，在3个前沿模型中从70.2%降至0.5%，且无故障任务性能无损。4. 证明了强制执行比单纯警告更有效，并通过弃权机制避免错误答案。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究针对LLM智能体调用API时面临的静默故障问题，提出了一种基于不变量感知的执行环境强制执行机制。实验表明，该方法能显著降低目标故障和新型故障下的错误率，且不影响无故障任务的性能，证明了将决策权从模型转移到执行环境的有效性。局限：摘要未提供SilentGuard引入的具体推理延迟或计算开销；摘要未提供15个公开研究API的具体名称和详细故障类型分布；摘要未提及该方法在需要复杂多步API调用或动态生成不变量场景下的表现和局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e162. BitDecoding-FP4: Native FP4 KV Cache Decoding via Algorithm-System Co-Design（BitDecoding-FP4：通过算法-系统协同设计实现原生FP4 KV缓存解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.09825\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.09825\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe key-value (KV) cache dominates memory capacity and bandwidth in long-context LLM serving. While 4-bit microscaling formats (NVFP4, MXFP4) shrink the cache and run attention on FP4 Tensor Cores, a fundamental gap remains between algorithmic quantization and system-aware acceleration: existing FP4 KV systems use vanilla quantization that causes severe accuracy drops, whereas accuracy-oriented 4-bit algorithms rely on vector codebooks whose lookup overhead degrades decoding throughput. We present BitDecoding-FP4, an algorithm--system co-design for accurate and efficient native FP4 KV decoding. We mitigate three error sources: Dual-Residual Query Quantization splits queries into two FP4 tensors, cutting query logit error from 60% to 1%; Underflow-Aware Probability Scaling prevents E4M3 scales from rounding long-context probabilities to zero; and Outlier-Aware Key Quantization combines static smoothing, Hadamard rotation, and scale search to suppress key outliers under token-wise scaling. At the system level, we remove the softmax bottleneck via transposed softmax with fused probability quantization and stacked query MMA on paged KV caches. Across dense and MoE models with GQA and MLA, BitDecoding-FP4 stays within 0.5 points of BF16 KV accuracy with NVFP4 (1 point with MXFP4), and tracks BF16 KV in RL training rollouts. In end-to-end serving on NVIDIA B300 with Qwen3-4B and Qwen3-30B-A3B, it delivers 2.4-3.0times higher peak serving throughput than BF16 KV. The implementation is available at https://github.com/OpenBitSys/BitDecoding-FP4.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e键值（KV）缓存在长上下文大语言模型服务中主导了内存容量和带宽。虽然4位微缩放格式（NVFP4、MXFP4）缩小了缓存并在FP4 Tensor Core上运行注意力机制，但算法量化与系统感知加速之间仍存在根本差距：现有的FP4 KV系统使用导致严重准确率下降的原始量化，而面向准确率的4位算法依赖于向量码本，其查找开销降低了解码吞吐量。我们提出了BitDecoding-FP4，这是一种用于准确高效的原生FP4 KV解码的算法-系统协同设计。我们缓解了三个误差来源：双残差查询量化将查询分割为两个FP4张量，将查询logit误差从60%降至1%；防下溢概率缩放防止E4M3缩放将长上下文概率四舍五入为零；异常值感知键量化结合了静态平滑、Hadamard旋转和缩放搜索，以在逐token缩放下抑制键异常值。在系统层面，我们通过带有融合概率量化的转置softmax和分页KV缓存上的堆叠查询MMA来消除softmax瓶颈。在具有GQA和MLA的密集和MoE模型中，BitDecoding-FP4使用NVFP4时保持在BF16 KV准确率的0.5个点以内（使用MXFP4时为1个点），并在RL训练展开中跟踪BF16 KV。在NVIDIA B300上使用Qwen3-4B和Qwen3-30B-A3B进行端到端服务时，它提供的峰值服务吞吐量比BF16 KV高2.4-3.0倍。实现代码可在 https://github.com/OpenBitSys/BitDecoding-FP4 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决长上下文LLM服务中KV缓存的内存和带宽瓶颈，弥合4位微缩放格式在算法量化与系统感知加速之间的差距，实现准确高效的原生FP4 KV解码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出算法-系统协同设计的BitDecoding-FP4；通过双残差查询量化、防下溢概率缩放和异常值感知键量化缓解三大误差来源；系统层面通过转置softmax和堆叠查询MMA消除softmax瓶颈；在NVFP4/MXFP4下准确率损失控制在0.5/1个点内，在NVIDIA B300上峰值吞吐量提升2.4-3.0倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明BitDecoding-FP4通过算法和系统层面的联合优化，成功解决了原生FP4 KV解码中的精度下降和吞吐量瓶颈问题，实现了高吞吐与高精度的平衡。局限性在于：摘要未提供在更大规模模型或更长上下文中的具体扩展性数据，且评估硬件限定为NVIDIA B300，未提及在其他架构GPU上的兼容性和性能表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机系统与架构 / 大语言模型推理优化与量化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e163. JEPA4R: Embodied JEPA World Models with 4D Point Planning（JEPA4R：具有4D点规划的具身JEPA世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19771\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19771\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eJoint-embedding predictive architecture (JEPA) world models predict future embeddings instead of pixels and plan in latent space. Two challenges remain: 2D images leave the metric geometry that manipulation acts on implicit and entangled with appearance, and what these models imagine stays hidden, as they are mostly judged in simulation by short-horizon latent planning. We present JEPA4R, a JEPA world model that observes single-depth-camera point clouds, predicts and plans in their latent space, and acts through a policy head on its frozen latents; we call this 4D point planning. A decoder on the frozen world model shows what it imagines as 4D point clouds, with a mean point error within 1.1 cm over 200 steps. Under the policy-learning protocols of OGBench and CortexBench, JEPA4R leads pixel JEPA models on OGBench Cube-Single, Cube-Double, Cube-Triple and Scene, and ranks first on MetaWorld and Adroit Relocate with 98.4% and 88.0%, above the runner-up, R3M, at 96.0% and 65.3%. Trained only in a digital twin, JEPA4R and its policy heads run zero-shot on the real arm with both a gripper and a dexterous hand.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e联合嵌入预测架构（JEPA）世界模型预测未来的嵌入而不是像素，并在潜在空间中进行规划。仍存在两个挑战：2D图像使操作所依赖的度量几何变得隐式并与外观纠缠在一起，而且这些模型想象的内容保持隐藏，因为它们主要通过在仿真中进行短视界的潜在规划来评判。我们提出了JEPA4R，一个JEPA世界模型，它观察单深度相机点云，在其潜在空间中进行预测和规划，并通过策略头在其冻结的潜在变量上执行动作；我们称之为4D点规划。冻结世界模型上的解码器将其想象的内容显示为4D点云，在200步内平均点误差在1.1厘米以内。在OGBench和CortexBench的策略学习协议下，JEPA4R在OGBench的Cube-Single、Cube-Double、Cube-Triple和Scene任务上领先于像素JEPA模型，并在MetaWorld和Adroit Relocate上排名第一，分别为98.4%和88.0%，高于第二名R3M的96.0%和65.3%。JEPA4R及其策略头仅在数字孪生中进行训练，在带有夹爪和灵巧手的真实机械臂上零样本运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种基于单深度相机点云的联合嵌入预测架构（JEPA）世界模型，以解决2D图像中度量几何隐式化及模型想象内容不可见的问题，实现4D点规划。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出JEPA4R，通过观察单深度相机点云在潜在空间进行预测和规划，实现4D点规划。2. 冻结世界模型上的解码器能将想象内容可视化为4D点云，200步内平均点误差在1.1厘米以内。3. 在OGBench和CortexBench的多个任务中领先于像素JEPA模型，在MetaWorld和Adroit Relocate上排名第一（98.4%和88.0%），超越R3M。4. 仅在数字孪生中训练，即可在真实机械臂（带夹爪和灵巧手）上零样本运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过引入单深度相机点云和4D点规划，解决了传统2D图像JEPA模型中度量几何隐式和想象内容不可见的问题，并在多个仿真基准中取得领先成绩，实现了向真实机械臂的零样本迁移。局限：摘要未提供真实环境中零样本运行的具体成功率数据；摘要未提供计算资源消耗、推理延迟或训练数据规模等细节；摘要未提供关于模型在复杂非结构化环境中长期稳定性的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e164. Continuation-Guided LLM Evolution of Program Policies and Goal Compilers in Craftax（Craftax中程序策略和目标编译器的延续引导大语言模型进化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19537\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19537\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCoding agents can synthesize and optimize code-based policies from simulator feedback, allowing the resulting program to act with zero inference model calls. But for long horizon tasks, two challenges arise: local improvements can hurt final success and switching to a new objective requires another expensive synthesis run. We propose a framework that first develops competence by refining the policy through a feedback cascade, moving from episode returns to hierarchical goals and belief updates which can be scored densely from simulator. In the Craftax game, a partially observed and procedurally generated environment, refinements via episode level feedback stall at \u0026lt;1% final-level arrival, whereas with the feedback cascade the optimized policy reaches the final stage 50% of time (28% final boss defeats). Furthermore, to make this competence reusable towards new goals, we factor the previous controller into an environment interpreter I (models, memory, skills) and a rule program p_0, and we show that coding agents can optimize a reusable goal compiler C_θ that maps structured tasks g into new rule programs p_g. Across five independent compiler searches trained only on short tasks, the resulting compilers successfully transfer zero-shot to longer tasks without any task-specific tuning nor inference-time LLM calls: continuation-scored feedback and a fixed machine with an editable program together turn a single-task competent policy into a reusable one.\u003cbr\u003e  Code at: https://github.com/vicgalle/craftax-program-policies\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e编码智能体可以从模拟器反馈中合成和优化基于代码的策略，使生成的程序能够在零推理模型调用的情况下执行。但对于长期任务，会出现两个挑战：局部改进可能会损害最终成功，而切换到新目标需要另一次昂贵的合成运行。我们提出了一个框架，首先通过反馈级联细化策略来发展能力，从回合回报移动到可以从模拟器密集评分的分层目标和信念更新。在Craftax游戏中，一个部分可观察和程序生成的环境，通过回合级反馈的细化在最终阶段到达率低于1%时停滞，而使用反馈级联，优化后的策略有50%的时间到达最终阶段（28%击败最终Boss）。此外，为了使这种能力可重复用于新目标，我们将先前的控制器分解为环境解释器I（模型、记忆、技能）和规则程序p_0，并且我们展示了编码智能体可以优化一个可重复使用的目标编译器C_θ，将结构化任务g映射到新的规则程序p_g。在仅于短任务上训练的五个独立编译器搜索中，生成的编译器成功零样本迁移到更长的任务，无需任何特定于任务的调整或推理时LLM调用：延续评分的反馈和带有可编辑程序的固定机器共同将单任务能力策略转变为可重复使用的策略。代码位于：https://github.com/vicgalle/craftax-program-policies\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决编码智能体在长期任务中优化基于代码的策略时面临的局部改进损害最终成功以及切换新目标成本高昂的问题，实现策略的优化与零样本迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出反馈级联框架，将优化从回合回报转移到分层目标和信念更新，在Craftax中将最终阶段到达率从低于1%提升至50%（击败Boss率28%）；将控制器分解为环境解释器和规则程序，训练出可重用的目标编译器，实现向更长任务的零样本迁移，且推理时无需LLM调用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法显著提升了长期任务的完成率，并实现了策略的零样本迁移，消除了推理时的LLM调用成本。局限性方面，摘要未提供该框架在其他非程序生成环境或不同任务类型中的泛化能力，未说明目标编译器在极其复杂任务结构上的表现，以及反馈级联中密集评分的具体计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习 / 代码生成与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e165. UMM-JEPA: Generative Pretraining via Masked Next-Scale Representation Prediction for Unified Multimodal Models（UMM-JEPA：通过掩码下一尺度表征预测进行统一多模态模型的生成式预训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18668\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18668\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnified multimodal models can support both visual understanding and generation, yet generative training does not necessarily improve understanding. We argue that this limitation may arise from a mismatch between the representation targeted by generation and the perceptual representation used for understanding. Conventional generation objectives primarily optimize synthesis-oriented spaces such as discrete visual codes or generative latents. We therefore introduce UMM-JEPA, which reformulates generation as progressive prediction of continuous visual-understanding representations. The model constructs a multi-scale representation hierarchy from coarse to fine, while pixel rendering is decoupled from representation pretraining and attached only afterward. Controlled comparisons show that the representation-prediction objective accounts for most of the understanding improvement, while a data-matched control leaves the group means nearly unchanged. UMM-JEPA reaches a 16-benchmark visual mean of 51.71, against 46.36 for the understanding-only Qwen-VL baseline, and the text mean also rises. Compared with discrete-code and latent-flow generation objectives, perceptual representation prediction yields stronger and more consistent transfer to understanding. Linear probes and visual-evidence interventions further reveal richer object and spatial structure and stronger use of image-specific information. These results suggest that generation can benefit understanding when it directly supervises the perceptual representations that understanding consumes.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e统一多模态模型可以同时支持视觉理解和生成，然而生成式训练并不一定能提升理解能力。我们认为这种局限性可能源于生成所针对的表征与用于理解的感知表征之间的不匹配。传统的生成目标主要优化面向合成的空间，如离散视觉码或生成潜变量。因此，我们引入了UMM-JEPA，它将生成重新表述为连续视觉理解表征的渐进预测。该模型构建了从粗到细的多尺度表征层次结构，同时将像素渲染与表征预训练解耦，仅在之后附加。受控比较表明，表征预测目标解释了大部分的理解能力提升，而数据匹配的控制组使组均值几乎保持不变。UMM-JEPA在16个基准测试上的视觉平均分达到51.71，而仅理解的Qwen-VL基线为46.36，文本平均分也有所上升。与离散码和潜流生成目标相比，感知表征预测产生了更强且更一致的理解迁移。线性探测和视觉证据干预进一步揭示了更丰富的对象和空间结构以及对图像特定信息的更强使用。这些结果表明，当生成直接监督理解所消耗的感知表征时，生成可以使理解受益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003c
