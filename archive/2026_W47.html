紧凑视频解码器，大幅降低计算成本。5. 在HandBench上表现优异，全序列模型FVD为181.67，MANO Dice分数为93.02；单H200上540p实时流传输达18.03 FPS，延迟741ms，显存占用仅34.89GB。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究针对交互式视频世界模型中手部控制面临的复杂动力学和实时计算挑战，提出了LynnReal-Hand模型。通过构建大规模数据集、引入手部感知监督、因果流图少步生成、区域感知分数蒸馏以及Ultra-Fast-VAE解码器，有效提升了手部跟随精度、视觉质量和推理速度。实验数据证明其在HandBench上的优越性能及在单卡H200上的实时交互能力。局限：摘要未提供10万交互片段数据集中真实与合成数据的具体比例；摘要未提供Ultra-Fast-VAE与标准VAE在重建保真度上的具体量化对比数字；摘要未提及该模型在处理极度复杂遮挡或快速非刚性形变时的具体表现和局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. RL Post-Training in Diffusion Transformers Is Activation Steering（扩散Transformer中的强化学习后训练即为激活引导）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26627\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26627\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning (RL) post-training substantially improves the visual quality, text rendering, and compositional accuracy of diffusion transformers. Because capabilities such as rendering requested text or composing multiple objects are inherently prompt-dependent, a natural hypothesis is that improving them requires learning complex, input-dependent transformations. To isolate how much of these gains an input-independent shift explains, we probe each RL-tuned model with a deliberately simple parameterization: a fixed set of steering vectors added to the block outputs of the frozen base model. On SD3.5-M, these vectors hold 65x fewer parameters than the RL-tuned LoRA (0.29M against 18.8M). We fit them to match the velocity predictions of public RL-tuned checkpoints, with no reward in the objective. Although the vectors are identical for every prompt, token, and sampling seed, they recover 90.0-96.3% of the reward gains of six RL-tuned image models, and 89.8% and 111.9% on two RL-tuned video models. Initialized at zero and trained with online RL, the vectors alone exceed the reward gains of weight-based RL on text rendering (OCR) and human preference (PickScore) on SD3.5-M. A constant shift thus suffices for most of the gain of policy-gradient RL post-training: without new input-dependent transformations, it steers the pretrained generator toward what it can already compute.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e强化学习（RL）后训练大幅提升了扩散Transformer的视觉质量、文本渲染和组合准确性。由于渲染请求文本或组合多个对象等能力本质上依赖于提示，一个自然的假设是提升它们需要学习复杂的、依赖于输入的变换。为了隔离这些收益中有多少可以由独立于输入的偏移来解释，我们用故意简单的参数化来探测每个RL微调模型：一组固定的引导向量，添加到冻结基础模型的块输出上。在SD3.5-M上，这些向量包含的参数比RL微调的LoRA少65倍（0.29M对18.8M）。我们拟合它们以匹配公开RL微调检查点的速度预测，目标中没有奖励。尽管这些向量对每个提示、标记和采样种子都是相同的，它们恢复了六个RL微调图像模型90.0-96.3%的奖励收益，以及在两个RL微调视频模型上89.8%和111.9%的收益。初始化为零并使用在线RL训练，仅这些向量在SD3.5-M上的文本渲染（OCR）和人类偏好（PickScore）方面就超过了基于权重的RL的奖励收益。因此，恒定偏移足以解释策略梯度RL后训练的大部分收益：无需新的依赖于输入的变换，它将预训练生成器引导至其已经能够计算的内容。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究扩散Transformer中强化学习（RL）后训练提升视觉质量、文本渲染和组合准确性的内在机制，验证独立于输入的激活引导是否能解释大部分性能收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现使用固定引导向量（参数量仅为LoRA的1/65）添加到冻结基础模型上，能恢复90.0-96.3%的图像模型和89.8-111.9%的视频模型的RL奖励收益；在SD3.5-M上，仅使用引导向量进行在线RL训练，在文本渲染和人类偏好上超越了基于权重的RL；证明恒定偏移足以解释策略梯度RL后训练的大部分收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的参数对比（0.29M vs 18.8M，少65倍）和收益恢复比例（图像90.0-96.3%，视频89.8%和111.9%）。局限性方面，摘要未提供具体使用的6个图像模型和2个视频模型的名称或类型，未说明引导向量的具体维度或网络层分布，也未探讨这种方法在更复杂生成任务（如长视频或3D生成）中的适用性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e扩散模型 / 强化学习与模型解释\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e48. LightTAR: Light and Fast Target-Aware Representations for Multimodal Tabular Learning（LightTAR：用于多模态表格学习的轻量快速目标感知表示）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17600\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17600\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal tabular learning involves classification and regression on tables combining structured numerical and categorical features with unstructured text and images. These unstructured fields are commonly represented by pretrained encoder embeddings reduced with principal component analysis (PCA). This reduction prioritizes input variance but may overlook information relevant to predicting the target. We introduce LightTAR, a simple, inexpensive method that adapts dimensionality reduction to the prediction task. LightTAR augments the standard PCA representation with a few target-aware features extracted jointly from the final and an intermediate encoder layer using regularized partial least squares (PLS). We evaluate LightTAR with 21 tabular models, including tree ensembles, neural networks, and tabular foundation models. LightTAR improves average predictive performance for all models and, averaged across models, improves prediction on almost every MulTaBench dataset. These gains come with a small increase in total runtime relative to PCA representations. LightTAR integrates directly into existing encoding pipelines, improving tabular learners\u0026#x27; predictive performance without modifying the encoder or the learner.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态表格学习涉及对结合了结构化数值和分类特征以及非结构化文本和图像的表格进行分类和回归。这些非结构化字段通常由通过主成分分析（PCA）降维的预训练编码器嵌入表示。这种降维优先考虑输入方差，但可能会忽略与预测目标相关的信息。我们引入了LightTAR，一种简单、廉价的方法，使降维适应预测任务。LightTAR使用正则化偏最小二乘法（PLS）从最终和中间编码器层联合提取少量目标感知特征，从而增强标准PCA表示。我们使用21种表格模型评估了LightTAR，包括树集成、神经网络和表格基础模型。LightTAR提高了所有模型的平均预测性能，并且在对模型进行平均后，在几乎每个MulTaBench数据集上都改善了预测。这些增益伴随着相对于PCA表示的总运行时间的微小增加。LightTAR直接集成到现有的编码管道中，在不修改编码器或学习器的情况下提高表格学习者的预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e多模态表格学习中的特征降维与表示优化，用于提升分类和回归任务的预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出LightTAR方法，利用正则化偏最小二乘法（PLS）从编码器层提取目标感知特征以增强PCA表示；在21种表格模型和几乎整个MulTaBench数据集上提升平均预测性能，且运行时间增加微小；无需修改编码器或学习器即可直接集成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明LightTAR在多种模型和MulTaBench数据集上均有效，且计算开销小。局限性方面，摘要未提供具体的性能提升百分比、运行时间增加的具体数值、所提取目标感知特征的具体数量，以及除MulTaBench外的其他数据集表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习 / 多模态表格学习与特征工程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e49. HINT-WAM: Hindsight-Informed Training for World Action Models（HINT-WAM：用于世界动作模型的后见之明信息训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24789\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24789\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld action models (WAMs) have shown promising generalization and data efficiency in robot manipulation by coupling action generation with predictions of future visual dynamics. Translating these capabilities into reliable task execution, however, remains a challenge for existing post-training methods. Offline supervised fine-tuning provides dense supervision on expert trajectories, but its flow-matching action expert is trained only on noised demonstration actions and never on the intermediate states produced by its own sampler; task-specific adaptation can also compromise pretrained capabilities. On-policy reinforcement learning trains on the policy\u0026#x27;s own behavior, yet sparse task rewards make exploration and credit assignment difficult, while dense reward shaping still provides scalar evaluations rather than direct action targets. We introduce HINT-WAM, the first on-policy self-distillation framework that supervises the action expert on its own sampling trajectories using hindsight, the future video of the demonstration, as privileged information available to the WAM itself. For each demonstration observation, the student generates its action through its own denoising trajectory, and at the states along this trajectory the same model acts as a teacher conditioned additionally on this hindsight, providing a conditional action distribution as a dense training target, while the student sees only deployment-time inputs and needs no environmental rewards or simulator interaction. To transfer this supervision to a flow-matching action expert, HINT-WAM distills the teacher into the student with an energy score, a distribution-level objective that matches the teacher\u0026#x27;s action distribution from the student\u0026#x27;s own samples rather than regressing its velocity field. The project web is available in https://tuandattt.github.io/hintwam/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界动作模型（WAMs）通过将动作生成与未来视觉动态预测相结合，在机器人操作中展现了良好的泛化和数据效率。然而，将这些能力转化为可靠的任务执行对现有的后训练方法仍然是一个挑战。离线监督微调在专家轨迹上提供密集监督，但其流匹配动作专家仅在加噪演示动作上训练，从未在其自身采样器产生的中间状态上训练；特定任务的适应也可能损害预训练能力。在线策略强化学习在策略自身的行为上训练，但稀疏的任务奖励使得探索和信用分配困难，而密集奖励塑造仍然提供标量评估而不是直接的动作目标。我们引入了HINT-WAM，这是第一个在线策略自蒸馏框架，它使用后见之明（即演示的未来视频，作为WAM本身可用的特权信息）在其自身的采样轨迹上监督动作专家。对于每个演示观察，学生通过其自身的去噪轨迹生成其动作，并且在该轨迹上的状态处，同一模型作为教师，额外以此后见之明为条件，提供条件动作分布作为密集训练目标，而学生仅看到部署时的输入，不需要环境奖励或模拟器交互。为了将这种监督转移到流匹配动作专家，HINT-WAM使用能量分数（一种分布级目标，从学生自身的样本中匹配教师的动作分布，而不是回归其速度场）将教师蒸馏到学生中。项目网站可在 https://tuandattt.github.io/hintwam/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e机器人操作中的世界动作模型（WAMs）后训练，以将泛化和数据效率转化为可靠的任务执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出首个在线策略自蒸馏框架HINT-WAM，利用后见之明（未来视频）作为特权信息提供密集训练目标；使用能量分数进行分布级蒸馏，无需环境奖励或模拟器交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有离线监督微调和在线策略强化学习在WAMs后训练中的局限，并提出了HINT-WAM解决这些问题。局限性方面，摘要未提供具体的机器人操作任务成功率、泛化指标、计算成本、能量分数蒸馏的具体数值，或与其他后训练方法的定量对比结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 强化学习与视觉动态模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e50. π^4: A Foundation Model for 4D Scene Geometry and Motion（π^4：用于4D场景几何与运动的基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 21 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23144\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23144\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eπ^4 is a unified foundation model for 4D scene perception. From diverse, uncalibrated RGB observations in the wild---a single image, an unordered collection, or a video sequence---it recovers dense geometry, camera poses, and metric scale, together with 2D/3D point tracks and moving-object masks for multi-image inputs. It couples a geometry branch with a geometry-conditioned motion branch, which predicts image-space correspondences that are lifted into 3D using reconstructed target-view geometry. Across diverse benchmarks, π^4 achieves the best overall average rank in geometry evaluation, alongside competitive performance in single- and multiview 2D/3D point tracking and moving-object segmentation. With a shared backbone, the full geometry-and-motion system contains approximately 0.5B parameters---less than half the size of most baselines. It produces joint reconstructions and tracks in one forward pass, including large-scale scenes with thousands of input images despite training with contexts of at most 64 views. We further present the data and training recipe underlying these capabilities, together with empirical studies of key design choices. Code and models are available at https://github.com/yyfz/Pi4.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eπ^4 是一个用于 4D 场景感知的统一基础模型。从野外多样化的、未标定的 RGB 观测中——单张图像、无序集合或视频序列——它恢复密集几何、相机位姿和度量尺度，以及多图像输入的 2D/3D 点轨迹和运动对象掩码。它将几何分支与几何条件运动分支耦合，后者预测图像空间对应关系，并使用重建的目标视图几何将其提升为 3D。在不同的基准测试中，π^4 在几何评估中取得了最佳的整体平均排名，同时在单视图和多视图 2D/3D 点跟踪以及运动对象分割方面具有竞争力的表现。通过共享骨干网络，完整的几何与运动系统包含大约 0.5B 个参数——不到大多数基线模型大小的一半。它在前向传递中生成联合重建和轨迹，包括具有数千张输入图像的大规模场景，尽管训练时上下文最多只有 64 个视图。我们进一步介绍了支持这些能力的数据和训练方法，以及对关键设计选择的实证研究。代码和模型可在 https://github.com/yyfz/Pi4 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e4D场景感知（从单张图像、无序图像集合或视频序列中恢复密集几何、相机位姿、度量尺度以及2D/3D点轨迹和运动对象掩码）\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出统一的4D场景感知基础模型π^4，支持从单图、无序图像集或视频中恢复密集几何、相机位姿、度量尺度及点轨迹和运动掩码。2. 耦合几何分支与几何条件运动分支，利用重建的目标视图几何将图像空间对应关系提升至3D。3. 在几何评估中取得最佳整体平均排名，且在点跟踪和运动分割上表现优异。4. 模型参数量仅约0.5B，不到多数基线的一半，且能在单次前向传播中处理包含数千张图像的大规模场景（训练上下文最多64个视图）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：π^4通过共享骨干网络和几何条件运动分支，以极小的参数量实现了高效的4D场景感知，并在单次前向传播中支持大规模场景处理，展现了优异的泛化和扩展能力。局限：摘要未提供关于该模型在极端光照变化、严重遮挡或动态模糊等复杂野外条件下的具体表现，也未说明其在处理非刚性物体形变或极长视频序列时的性能局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉 / 场景重建与感知\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e51. WAM-Policy: World Action Models with On-Policy Distillation for Quadrupedal Loco-Manipulation（WAM-Policy：用于四足运动操作的在策略蒸馏世界动作模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24011\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24011\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eArm-free quadrupeds can perform loco-manipulation, walking on three legs while manipulating with a front leg, yet no existing policy for it follows language instructions. World action models (WAMs) have emerged as effective language-conditioned manipulation policies, but are pretrained for robot arms and sample slowly. WAM-Policy turns one WAM into a quadrupedal loco-manipulation policy via two stages. The first, Cross-Morphology Policy Adaptation and Acceleration, adapts the arm-centric WAM to quadrupeds and distills the transferred policy into a student with one video and two action steps by on-policy self-distillation (OPSD). This student, however, is bounded by its teacher, which only imitates demonstrations. The second stage, Task-Specific Improvement and Merging, therefore tunes the teacher by reinforcement learning (RL) and merges the slow specialists into one few-step student by multi-teacher on-policy distillation (M-OPD). On QLM-Bench, ten simulated tasks with 1,000 demonstrations synthesized without teleoperation, the transferred policy reaches 77.0%, and the OPSD student keeps 76.7% while sampling 14 times faster. Task-specific RL and M-OPD lift it to 85.0%. We also deploy the OPSD student on a real Unitree Go2 Air. WAM-Policy thus achieves a stronger quadrupedal policy at a fraction of the inference cost.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e无臂四足机器人可以执行运动操作，即用三条腿行走同时用前腿进行操作，然而现有针对此的策略没有遵循语言指令的。世界动作模型（WAMs）已成为有效的语言条件操作策略，但它们是预训练用于机械臂的且采样缓慢。WAM-Policy通过两个阶段将一个WAM转化为四足运动操作策略。第一阶段，跨形态策略适应与加速，将以臂为中心的WAM适应于四足机器人，并通过在策略自蒸馏（OPSD）将转移的策略蒸馏成具有一个视频和两个动作步骤的学生模型。然而，该学生受限于其仅模仿示范的教师模型。因此，第二阶段，特定任务改进与合并，通过强化学习（RL）微调教师模型，并通过多教师在策略蒸馏（M-OPD）将缓慢的专家合并为一个少步学生模型。在QLM-Bench上，十个模拟任务，具有1,000个无需遥操作合成的示范，转移策略达到77.0%，OPSD学生保持76.7%同时采样快14倍。特定任务RL和M-OPD将其提升至85.0%。我们还将OPSD学生部署在真实的Unitree Go2 Air上。因此，WAM-Policy以极低的推理成本实现了更强的四足策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将预训练用于机械臂的世界动作模型（WAM）转化为遵循语言指令的四足机器人运动操作策略，并解决其采样缓慢的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WAM-Policy，通过两阶段将WAM转化为四足运动操作策略；第一阶段使用在策略自蒸馏（OPSD）实现跨形态适应并加速14倍；第二阶段使用强化学习（RL）和多教师在策略蒸馏（M-OPD）提升性能至85.0%；成功部署于真实的Unitree Go2 Air机器人。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了QLM-Bench上的具体性能数字（转移策略77.0%，OPSD学生76.7%且快14倍，最终85.0%），以及1000个无需遥操作的示范。局限性方面，摘要未提供真实机器人部署的具体成功率或失败原因，未说明强化学习的具体奖励函数设计，也未提及在更复杂或非模拟环境中的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 四足机器人与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e52. WorldRuler: Interactive World Modeling under Configurable Rules（WorldRuler：可配置规则下的交互式世界建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24869\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24869\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRules govern how player actions change interactive worlds. Different rules create distinct gameplay experiences within similar scenes and action spaces. For customizable gameplay, generative world models must follow user-defined rules beyond real-world behaviors. However, realizing user-defined rules presents two challenges: Rule-State Persistence and Rule-to-Visual Realization. The former requires preserving rule definitions, dependencies, and world states across saving and loading, so that restored worlds follow the established rules. The latter requires accurately realizing rule-induced changes on designated objects and attributes, particularly when affected objects are unseen. In this paper, we propose WorldRuler, which organizes rule definitions, dependencies, and object states in an executable 3D rule graph and connects rule execution, video generation, and perceptual feedback in a closed loop. The graph supports joint saving and restoration of rules and world states, while dynamic object binding grounds rule-specified entities in visual instances and uses stored states to constrain generation from their first appearance. We further introduce object attribute state replacement and counterfactual reconstruction training, enabling accurate attribute control and compatible appearance and motion changes while limiting interference with unrelated content. We develop an automated data collection and annotation pipeline using GTA-V and Habitat to construct RuleVerse, a dataset of rule-driven interactions with detailed state and event annotations, including cases where rules take effect before affected objects become visible. Extensive experiments demonstrate the effectiveness of WorldRuler in preserving rule-state consistency across saving and loading and accurately realizing rule outcomes on designated objects and attributes.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e规则控制玩家动作如何改变交互式世界。不同的规则在相似的场景和动作空间中创造不同的游戏体验。对于可定制的游戏玩法，生成式世界模型必须遵循用户定义的规则，而不仅仅是现实世界的行为。然而，实现用户定义的规则面临两个挑战：规则-状态持久性和规则到视觉的实现。前者要求在保存和加载之间保留规则定义、依赖关系和世界状态，以便恢复的世界遵循已建立的规则。后者要求在指定的对象和属性上准确实现规则引起的变化，特别是当受影响的对象是未见过的时。在本文中，我们提出了WorldRuler，它在可执行的3D规则图中组织规则定义、依赖关系和对象状态，并在规则执行、视频生成和感知反馈之间形成闭环连接。该图支持规则和世界观状态的联合保存和恢复，而动态对象绑定将规则指定的实体接地到视觉实例中，并使用存储的状态从它们首次出现时约束生成。我们进一步引入了对象属性状态替换和反事实重建训练，实现了准确的属性控制以及兼容的外观和动作变化，同时限制了对无关内容的干扰。我们使用GTA-V和Habitat开发了一个自动化数据收集和标注管道，以构建RuleVerse，这是一个由规则驱动的交互数据集，具有详细的状态和事件标注，包括规则在受影响对象变得可见之前生效的情况。大量实验证明了WorldRuler在保存和加载之间保持规则-状态一致性以及在指定对象和属性上准确实现规则结果方面的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e生成式交互式世界建模，旨在使生成式世界模型遵循用户定义的可配置规则，实现规则-状态持久性和规则到视觉的准确实现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WorldRuler，利用可执行3D规则图组织规则与状态，支持联合保存和恢复以及动态对象绑定；引入对象属性状态替换和反事实重建训练以实现准确属性控制；构建RuleVerse数据集，包含规则在对象可见前生效的复杂交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了系统架构和数据集构建，并声称实验证明了其在规则-状态一致性和视觉实现上的有效性。局限性方面，摘要未提供具体的视频生成评估指标、RuleVerse数据集的具体规模、生成视频的长度或分辨率，以及与其他世界模型基线的定量对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 交互式世界建模与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e53. VideoNexus: Video Perception Beyond the Reasoning Context（VideoNexus：超越推理上下文的视频感知）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21392\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21392\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnderstanding long videos requires locating evidence, resolving visual details, and integrating observations into an answer. Even when relevant evidence is present, performing these operations within long, dense visual sequences burdens both perception and reasoning. Video agents enable selective inspection, but returning frames to the planner still accumulates visual information in its reasoning context. Delegating perception reduces this burden, yet sparse sampling can miss decisive details, and per-frame descriptions can preserve context growth. We introduce VideoNexus, a training-free framework that separates detailed video perception from evidence-driven planning and reasoning. The planner controls where to inspect, what to resolve, and how densely to sample. Perception sub-agents process native audio-video in independent contexts and return compact, temporally grounded evidence for iterative search and verification. Using Gemini 3.8 Flash for both planning and perception, VideoNexus achieves 88.6% accuracy on full LVBench, exceeding same-backbone static ingestion and built-in agentic processing by 3.6 and 1.1 points, respectively, at 44% of the latter\u0026#x27;s measured API cost. A paired LVBench subset ablation shows lower planner input and higher accuracy. With Kimi K3 as the shared backbone, VideoNexus improves over the official Video-GAIA ReAct harness by 8.5 points in our evaluation. These results support compact evidence exchange for combining detailed observation with efficient planning and reasoning.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e理解长视频需要定位证据、解析视觉细节并将观察结果整合为答案。即使存在相关证据，在长而密集的视觉序列中执行这些操作也会给感知和推理带来负担。视频智能体能够进行选择性检查，但将帧返回给规划器仍会在其推理上下文中积累视觉信息。委托感知可以减轻这种负担，但稀疏采样可能会遗漏决定性细节，而逐帧描述则会导致上下文持续增长。我们引入了VideoNexus，这是一个无需训练的框架，将详细的视频感知与证据驱动的规划和推理分离开来。规划器控制检查的位置、解析的内容以及采样的密度。感知子智能体在独立的上下文中处理原生音视频，并返回紧凑的、时间接地的证据，用于迭代搜索和验证。使用 Gemini 3.8 Flash 同时进行规划和感知，VideoNexus 在完整的 LVBench 上达到了 88.6% 的准确率，分别比相同骨干网络的静态摄入和内置智能体处理高出 3.6 和 1.1 个百分点，且其测量的 API 成本仅为后者的 44%。配对的 LVBench 子集消融实验显示规划器输入更低且准确率更高。以 Kimi K3 为共享骨干网络，VideoNexus 在我们的评估中比官方的 Video-GAIA ReAct 框架提高了 8.5 个百分点。这些结果支持了紧凑的证据交换，以将详细观察与高效的规划和推理结合起来。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e长视频理解与问答（在长且密集的视觉序列中定位证据、解析视觉细节并整合答案）\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出无需训练的VideoNexus框架，将详细视频感知与证据驱动的规划推理分离。2. 规划器控制检查位置、解析内容和采样密度，感知子智能体在独立上下文中处理原生音视频并返回紧凑的时间接地证据。3. 使用Gemini 3.8 Flash在LVBench上达到88.6%准确率，超越静态摄入和内置智能体处理，且API成本仅为后者的44%。4. 使用Kimi K3作为骨干网络时，比官方Video-GAIA ReAct框架提升8.5个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：VideoNexus通过分离感知与规划推理，有效解决了长视频处理中上下文膨胀和细节丢失的问题。紧凑的证据交换机制在保持高准确率的同时显著降低了API成本。局限：摘要未提供关于该框架在处理极长视频时的具体扩展性限制、不同视频类型的泛化能力以及感知子智能体在极端噪声条件下的鲁棒性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频理解 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e54. Accelerate Bench: Evaluating Agents for Application-Level Program Optimization（Accelerate Bench：评估用于应用程序级程序优化的智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20882\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20882\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eApplication optimization requires coding agents to discover useful changes and coordinate them across a complete program while preserving the required computation. We introduce Accelerate Bench, a benchmark of 32 CPU optimization tasks adapted from scientific applications and supercomputing competitions. Each task provides a working program and specifies the workload, correctness requirements, timing boundaries, and permitted edits, leaving agents to choose where and how to optimize. Public testing supports iterative development, and a separate verifier scores the final submission. On benchmark version 1.1, we evaluate 16 coding agents, each pairing a model with a harness. Their Score@1 ranges from 25.5% to 67.4%. Most of their programs are correct, and the size of the speedup separates them: the two leading agents are at least 2x faster on 22 or more of the 32 tasks, while the other fourteen reach 2x on 8 to 17 and leave 125 of their 412 correct outcomes below 1.25x. Controlled replays show why coordination across an application matters: identical source code runs between 0.29x and 2.12x depending only on build and runtime settings, and one code change is worth 1.01x or 6.4x depending on another. Accelerate Bench pairs executable workloads with agents\u0026#x27; programs and trajectories to evaluate both their gains and the process behind them.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e应用程序优化要求编码智能体发现有用的更改并在整个程序中协调它们，同时保留所需的计算。我们引入了 Accelerate Bench，这是一个包含 32 个 CPU 优化任务的基准，改编自科学应用程序和超级计算竞赛。每个任务提供一个可工作的程序，并指定工作负载、正确性要求、计时边界和允许的编辑，让智能体选择在何处以及如何优化。公共测试支持迭代开发，独立的验证器对最终提交进行评分。在基准版本 1.1 上，我们评估了 16 个编码智能体，每个智能体将一个模型与一个工具链配对。它们的 Score@1 范围从 25.5% 到 67.4%。它们的大多数程序是正确的，加速的大小将它们区分开来：两个领先的智能体在 32 个任务中的 22 个或更多任务上至少快了 2 倍，而其他 14 个智能体在 8 到 17 个任务上达到 2 倍，并使其 412 个正确结果中的 125 个低于 1.25 倍。受控重放显示了为什么跨应用程序的协调很重要：相同的源代码仅根据构建和运行时设置运行速度在 0.29 倍到 2.12 倍之间，并且一个代码更改的价值是 1.01 倍还是 6.4 倍取决于另一个更改。Accelerate Bench 将可执行工作负载与智能体的程序和轨迹配对，以评估它们的收益及其背后的过程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估编码智能体在应用程序级别发现、协调和执行CPU优化任务的能力，同时保持程序的正确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了包含32个源自科学应用和超算竞赛的CPU优化任务基准Accelerate Bench；评估了16种编码智能体，揭示了领先智能体与普通智能体在加速幅度上的显著差异；通过受控重放证明了跨应用程序协调（构建和运行时设置、代码更改依赖）对优化结果的关键影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该基准能有效评估智能体在复杂程序中的全局优化和协调能力，并揭示了环境配置和代码依赖对优化效果的巨大影响。局限性方面，摘要未提供关于任务的具体编程语言分布、智能体使用的具体模型名称，以及基准在GPU优化或内存密集型优化任务上的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程与人工智能 / 代码优化与智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e55. G-CAST: Governed Continual Self-Training for E-Commerce Agents under Evolving Demands（G-CAST：需求不断演变下的电商智能体受治理持续自训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17814\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17814\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWith the rapid advancement of Large Language Models (LLMs), an increasing number of users are turning to LLM-powered agents for conversational shopping in e-commerce. However, the user needs continue to change as new product categories, procurement scenarios, and feature requests emerge. At the same time, the product\u0026#x27;s execution harness-including its tools, skills, and operating procedures-continues to evolve to support increasingly sophisticated interactions. These changes create two practical challenges: 1) Demand drift alters the distribution, intent, and complexity of user requests, causing a model trained once to fall behind; 2) Harness evolution requires the model to use newly introduced capabilities correctly without losing behavior that users already rely on. Periodic manual retraining is too delayed and labor-intensive for this setting. To address these challenges, we present G-CAST, a governed continual self-training system that converts daily production evidence under evolving demand and capability contracts into reward-routed, entropy-prioritized training data and governed reward evolution. Governed checkpoint transition under cumulative evaluation controls each model update, enabling the agent to learn newly introduced behaviors without sacrificing previously accepted capabilities. Experiments on a real production e-commerce agent show that G-CAST achieves stronger adaptation to newly introduced demand while better preserving previously accepted behavior compared with a strong autonomous post-training baseline. Ablations further show that both reward-routed, entropy-prioritized data orchestration and governed reward evolution are important to these gains. G-CAST is now deployed in Yuancai(http://cai.1688.com/), a B2B procurement agent on Alibaba\u0026#x27;s 1688 platform.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着大型语言模型（LLMs）的快速发展，越来越多的用户转向由LLM驱动的智能体进行电商对话购物。然而，随着新产品类别、采购场景和功能请求的出现，用户需求不断变化。同时，产品的执行工具——包括其工具、技能和操作程序——也在不断发展以支持日益复杂的交互。这些变化带来了两个实际挑战：1）需求漂移改变了用户请求的分布、意图和复杂性，导致仅训练一次的模型落后；2）工具演进要求模型正确使用新引入的功能，同时不丢失用户已经依赖的行为。定期的手动重新训练对于这种环境来说太滞后且耗费人力。为了应对这些挑战，我们提出了G-CAST，一个受治理的持续自训练系统，它将不断演变的需求和能力契约下的日常生产证据转化为奖励路由、熵优先的训练数据和受治理的奖励演进。在累积评估下的受治理检查点转换控制每次模型更新，使智能体能够学习新引入的行为而不牺牲先前被接受的能力。在真实生产电商智能体上的实验表明，与强大的自主后训练基线相比，G-CAST实现了对新引入需求的更强适应性，同时更好地保留了先前被接受的行为。消融实验进一步表明，奖励路由、熵优先的数据编排和受治理的奖励演进对这些收益都很重要。G-CAST现已部署在阿里巴巴1688平台上的B2B采购智能体元采（http://cai.1688.com/）中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决电商对话购物智能体在面对用户需求漂移和执行工具演进时，一次性训练模型落后以及手动重训成本高的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出G-CAST受治理持续自训练系统，将日常生产证据转化为奖励路由和熵优先的训练数据；通过受治理的检查点转换控制模型更新，在学习新行为的同时保留旧能力；在真实生产电商智能体上优于自主后训练基线，并已部署于阿里1688平台的元采智能体。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了实际应用场景（阿里1688元采）和解决的痛点（需求漂移、工具演进）。局限性方面，摘要未提供具体的定量评估指标（如准确率提升百分比、具体保留了多少旧能力等），未说明累积评估的具体指标和阈值设定，也未提及该系统在处理极端长尾需求或全新未知工具时的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能应用 / 智能体与推荐系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e56. MEM-SQL: Memory-Empowered Text-to-SQL（MEM-SQL：记忆赋能的文本到SQL）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18338\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18338\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eText-to-SQL systems translate natural language questions into SQL queries over increasingly complex databases. However, widely used benchmarks evaluate questions independently, overlooking settings where earlier queries over the same database can supply joins or calculations for a new question. We introduce HARE (History-AwaRe Text-to-SQL BEnchmark) to measure the accuracy and cost of adapting historical SQL. HARE comprises 1,600 requests derived from a fixed pool of 823 verified queries across four datasets. Annotations record which components each request preserves and which edits it requires, distinguishing whole-query adaptation from partial reuse. Our method, MEM-SQL (Memory-EMpowered Text-to-SQL), stores whole-query templates, reusable SQL blocks, and mappings from domain concepts to schema elements. MEM-SQL uses a layer only if every requirement assigned to it has a match above that layer\u0026#x27;s threshold. With On-demand Schema Linking (OSL), MEM-SQL consults the schema only when no layer qualifies or the generator judges retrieved evidence insufficient. Across six language models on HARE, mean execution accuracy rises from 37.1% for Direct Generation without history to 50.0% for MEM-SQL, with 76.6% fewer input tokens and 68.8% lower latency on average. Further analysis shows that requests reusing several verified queries remain a bottleneck, with accuracy falling from 56.7% to 29.7%, most sharply when reused components must be placed in a new query structure or combined with a shared join. Applying OSL to three other memory designs consistently reduces generation cost, while its accuracy benefit depends on the memory design. Verified history can thus make generation both more accurate and cheaper, but its value depends on the evidence retained and when the system consults the schema.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e文本到SQL系统将自然语言问题转化为针对日益复杂的数据库的SQL查询。然而，广泛使用的基准测试独立评估问题，忽略了同一数据库上的早期查询可以为新问题提供连接或计算的设置。我们引入了HARE（历史感知文本到SQL基准）来衡量调整历史SQL的准确性和成本。HARE包含1,600个请求，源自四个数据集中823个经过验证的查询的固定池。注释记录了每个请求保留了哪些组件以及需要哪些编辑，区分了整查询调整与部分重用。我们的方法MEM-SQL（记忆赋能文本到SQL）存储整查询模板、可重用的SQL块以及从领域概念到模式元素的映射。MEM-SQL仅当分配给它的每个要求都有高于该层阈值的匹配时才使用该层。借助按需模式链接（OSL），MEM-SQL仅在没有层符合条件或生成器判断检索到的证据不足时才查询模式。在HARE上的六个语言模型中，平均执行准确率从没有历史的直接生成的37.1%上升到MEM-SQL的50.0%，输入token平均减少76.6%，延迟平均降低68.8%。进一步分析表明，重用多个已验证查询的请求仍然是一个瓶颈，准确率从56.7%下降到29.7%，当重用的组件必须放置在新的查询结构中或与共享连接结合时下降最为明显。将OSL应用于其他三种记忆设计一致地降低了生成成本，而其准确性收益取决于记忆设计。因此，经过验证的历史可以使生成更准确且更便宜，但其价值取决于保留的证据以及系统何时查询模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用历史SQL查询信息提高文本到SQL（Text-to-SQL）系统的准确性和效率，并评估历史适应的准确性与成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了HARE基准测试，包含1600个请求以评估历史SQL的适应；提出了MEM-SQL方法，存储查询模板、可重用SQL块和概念映射，并结合按需模式链接（OSL）；在6个语言模型上，平均执行准确率从37.1%提升至50.0%，输入token减少76.6%，延迟降低68.8%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在HARE基准上6个语言模型的评估结果，准确率提升及成本降低的具体数字。同时指出了重用多个已验证查询时的准确率下降瓶颈（从56.7%降至29.7%）。关于更复杂数据库模式下的泛化能力、OSL在不同记忆设计下准确性收益的具体差异数据，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e数据库与自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e57. Training Vision Models for LLM-Driven Weight-Space Programming（训练视觉模型以用于LLM驱动的权重空间编程）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26408\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26408\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIt has been demonstrated that, in certain settings, large language models can perform weight-space programming to directly modify the weights of neural networks. However, it is unknown how dedicated training of these networks can contribute to the successes of weight-space programming. We present a benchmark of LLM-driven weight-space programming on vision models, in which five LLMs edit convolutional networks and vision transformers on relabeling and error-correction tasks on Waterbirds, CIFAR-100, PACS and Entity-30. We report more than 2,600 such edit processes, whereby each edit is scored on held-out images for success, side effects and accuracy loss. We compare standard training with label smoothing, gradient-based editable training, and our Edit-Ready Training (ERT), a novel method that rehearses the direct, closed-form weight edits LLMs perform. We show that preparing networks for editing raises the success of LLM edits substantially where standard networks are hard to edit. ERT further achieves the highest mean score for GPT-6 Astra and Claude Opus 5.5 across all evaluated baselines. We will release our LLM testing framework alongside all tasks, editing trajectories and scores. Project page: https://viscom.uni-ulm.de/wsp\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e已有证明，在某些设置下，大型语言模型可以执行权重空间编程以直接修改神经网络的权重。然而，目前尚不清楚对这些网络进行专门训练如何有助于权重空间编程的成功。我们提出了一个在视觉模型上进行 LLM 驱动权重空间编程的基准，其中五个 LLM 在 Waterbirds、CIFAR-100、PACS 和 Entity-30 的重标记和错误纠正任务上编辑卷积网络和视觉 Transformer。我们报告了超过 2600 个这样的编辑过程，其中每次编辑都在保留图像上根据成功、副作用和准确率损失进行评分。我们将带有标签平滑的标准训练、基于梯度的可编辑训练与我们的 Edit-Ready Training (ERT) 进行了比较，ERT 是一种新颖的方法，它排练 LLM 执行的直接、闭式权重编辑。我们表明，为编辑准备网络可以大幅提高 LLM 编辑的成功率，而在标准网络中这些编辑很难实现。ERT 进一步在所有评估的基线中为 GPT-6 Astra 和 Claude Opus 5.5 实现了最高的平均分。我们将发布我们的 LLM 测试框架以及所有任务、编辑轨迹和分数。项目主页：https://viscom.uni-ulm.de/wsp\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个用于视觉模型的LLM驱动权重空间编程基准，研究专门训练（如ERT）如何提升LLM直接修改神经网络权重的成功率，并在重标记和错误纠正任务上进行评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了视觉模型上LLM驱动权重空间编程的基准，涵盖4个数据集和2种任务。2. 报告了超过2600次编辑过程，并从成功率、副作用和准确率损失三个维度进行评估。3. 提出Edit-Ready Training (ERT) 方法，通过排练LLM执行的直接闭式权重编辑来准备网络。4. ERT在GPT-6 Astra和Claude Opus 5.5上取得了所有评估基线中的最高平均分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了丰富的实验设置和评估维度，证明了专门训练对权重空间编程的积极作用。但摘要未提供ERT方法的具体计算开销、不同LLM之间的详细性能差异、以及该方法在更复杂视觉任务或更大规模模型上的泛化能力等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习 / 模型编辑 / 大语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e58. Code World Model 2.0: Towards Infinite Controllable Video Generation（Code World Model 2.0：迈向无限可控视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22925\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22925\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual proxies decouple explicit world-state simulation from photorealistic video synthesis, offering a controllable interface for both offline clip creation and real-time interactive streaming. Yet a practical renderer must address two challenges. Upstream proxies vary from coarse layouts to fine articulated geometry depending on the interaction, and streaming inference must operate in a few causal steps without accumulating drift across self-generated history. We present Invoker-Render, pairing a bidirectional creation model with a causal four-step streaming model under a shared conditioning interface over structural proxies, an appearance reference, and language. Trained on an aligned approximately 200-hour multi-granularity corpus, Invoker-Render honors fine geometric constraints when supplied while synthesizing plausible local motion under coarse proxies, enabling runtime selection of input detail. To bridge bidirectional creation and real-time streaming without compounding step compression and rollout drift, we introduce Progressive Forcing (ProForcing). ProForcing first trains a causal predictor and distills it into a four-step renderer using histories derived from training videos. Training then shifts to continuous self-generated rollouts. A pipelined serving stack supports efficient streaming inference. Experiments show versatile control across proxy families, granularities, and camera paths, consistent gains over recent streaming baselines, and stable 30-minute racing rollouts that preserve scene and subject appearance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉代理将显式的世界状态模拟与照片级真实的视频合成解耦，为离线片段创建和实时交互式流媒体提供了可控的接口。然而，实用的渲染器必须解决两个挑战。上游代理根据交互从粗略布局到精细关节几何变化，流媒体推理必须在几个因果步骤中运行，而不会在自生成的历史中积累漂移。我们提出了Invoker-Render，将双向创建模型与因果四步流媒体模型配对，在结构代理、外观参考和语言的共享条件接口下运行。在大约200小时对齐的多粒度语料库上训练，Invoker-Render在提供精细几何约束时遵守这些约束，同时在粗略代理下合成合理的局部运动，从而实现输入细节的运行时选择。为了在不复合步骤压缩和展开漂移的情况下桥接双向创建和实时流媒体，我们引入了渐进式强制（ProForcing）。ProForcing首先训练因果预测器，并使用从训练视频中获得的历史将其蒸馏为四步渲染器。然后训练转移到连续的自生成展开。流水线化的服务堆栈支持高效的流媒体推理。实验表明，在代理家族、粒度和相机路径上具有多功能的控制，相比最近的流媒体基线有一致的增益，并且具有稳定的30分钟赛车展开，保留了场景和主体外观。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e基于视觉代理的可控视频生成，解决从离线片段创建到实时交互式流媒体推理中的多粒度代理控制和长序列漂移问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Invoker-Render，结合双向创建模型与因果四步流媒体模型，支持多粒度代理的运行时选择；引入渐进式强制（ProForcing）技术，通过蒸馏和连续自生成展开解决步骤压缩和漂移问题；支持高效的流水线化流媒体推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在多种代理和相机路径下表现良好，且能实现稳定的30分钟长视频生成而不漂移。局限性方面，摘要未提供具体的视频分辨率、帧率、渲染延迟、与其他基线对比的具体定量指标，以及大约200小时语料库的具体构成细节和来源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 可控视频生成与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e59. Learning What Actions Change: Action Effect Matching for Dynamics-Faithful World Models（学习动作改变了什么：用于动态忠实世界模型的动作效果匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25980\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25980\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld models aim to predict environment dynamics under actions, enabling the prediction of action consequences without executing them in the real world. Yet despite producing increasingly realistic videos, current world models often fail to capture how small action changes affect future observations. This limits their use in tasks such as robotic policy evaluation and model-based planning, where nearly identical actions can lead to qualitatively different outcomes. To address this, we propose AFFECT, an auxiliary training objective for learning the distribution of visual changes induced by action perturbations. Specifically, we inject temporally correlated noise into the actions of a policy trained on task-agnostic human teleoperation. We then train the world model so that its generated videos respond to this noise as the recorded videos do, without requiring repeated executions from the same initial state. Across OGBench simulation and real-world DROID and ALOHA-2 setups, AFFECT makes world-model rollouts more faithful to real outcomes. On DROID, the Pearson correlation between policy success rates in the world model and on the real robot rises from 0.47 to 0.79, alongside up to 23% lower FVD. These gains carry over to planning, where selecting actions with AFFECT-trained world models improves task success by up to 8.3%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界模型旨在预测动作下的环境动态，从而无需在真实世界中执行即可预测动作后果。然而，尽管生成了越来越逼真的视频，当前世界模型通常无法捕捉微小的动作变化如何影响未来的观察。这限制了它们在机器人策略评估和基于模型的规划等任务中的使用，在这些任务中，几乎相同的动作可能导致质量上不同的结果。为了解决这个问题，我们提出了 AFFECT，一种用于学习由动作扰动引起的视觉变化分布的辅助训练目标。具体而言，我们将时间相关噪声注入到在任务无关的人类遥操作上训练的策略的动作中。然后我们训练世界模型，使其生成的视频对这种噪声的响应与记录的视频一样，而无需从同一初始状态重复执行。在 OGBench 仿真以及真实世界的 DROID 和 ALOHA-2 设置中，AFFECT 使世界模型的推演更忠实于真实结果。在 DROID 上，世界模型中策略成功率与真实机器人上的皮尔逊相关性从 0.47 上升到 0.79，同时 FVD 降低高达 23%。这些收益延续到了规划中，其中使用 AFFECT 训练的世界模型选择动作可将任务成功率提高高达 8.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出AFFECT辅助训练目标，使世界模型能够准确捕捉微小动作变化对未来观察的影响，解决当前世界模型在动作扰动下动态预测不忠实的问题，以提升机器人策略评估和规划的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出AFFECT辅助训练目标，通过向动作注入时间相关噪声，训练世界模型学习视觉变化分布。2. 无需从同一初始状态重复执行，即可使生成的视频对噪声的响应与真实记录一致。3. 在DROID真实机器人设置中，世界模型与真实机器人的策略成功率皮尔逊相关性从0.47提升至0.79，FVD降低高达23%。4. 在规划任务中，使用AFFECT训练的世界模型可将任务成功率提高高达8.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了AFFECT在提高世界模型动态忠实度方面的有效性，并提供了仿真和真实机器人环境下的具体提升数据。但摘要未提供AFFECT带来的额外训练时间成本、在更复杂或未见过的任务环境中的泛化能力，以及噪声注入策略对不同动作空间的敏感性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 世界模型 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e60. WM^MLLM: Turning MLLMs into World Models（WM^MLLM：将多模态大语言模型转化为世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24193\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24193\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo world models keep the world in the context of a generator, so a revisit is synthesized again and earlier edits can drift or disappear. We present WM^MLLM, the first interactive world model built on multimodal large language models (MLLMs), for persistent, editable world generation from a single image. WM^MLLM keeps the world state outside every generator, as a panorama with a revision history, and lets the MLLMs write it: they turn each request into operations on this state, select where a local edit is written, and check every candidate before it becomes the next state. Image generators only propose views, and video only presents them. Users can walk to new places and return, edit objects through text or a box, place subjects, and change lighting, weather or season. By construction, a revisit at the same revision reproduces the earlier view exactly, a local edit leaves every panorama pixel outside its region unchanged, and each request starts from the result of the previous one. Against six world model baselines on MBench-A, WM^MLLM has the highest mean on all four environment-recovery metrics (Epipolar 91.5 versus 0.1 to 74.0) and completes the most camera round trips (85.3% versus at most 50.9%). It has the best value in all 15 CompBench columns against 15 baselines. On 112 local edits judged blind, selecting the region to write after generation raises completion from 34.8% to 83.0%. On 258 WBench and MBench-A items, all 46 revisits recover their earlier views, and all 97 local edits that pass the check leave panorama pixels outside their region unchanged.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频世界模型将世界保持在生成器的上下文中，因此重新访问会被重新合成，早期的编辑可能会漂移或消失。我们提出了 WM^MLLM，这是首个构建于多模态大语言模型（MLLMs）之上的交互式世界模型，用于从单张图像进行持久、可编辑的世界生成。WM^MLLM 将世界状态保持在每个生成器之外，作为一个带有修订历史的全景图，并让 MLLMs 对其进行写入：它们将每个请求转化为对该状态的操作，选择局部编辑写入的位置，并在每个候选成为下一个状态之前进行检查。图像生成器仅提出视图，视频仅展示它们。用户可以走到新地方并返回，通过文本或边界框编辑对象，放置主体，并改变光照、天气或季节。通过结构设计，在相同修订处重新访问可以完全重现早期视图，局部编辑保持其区域外的每个全景像素不变，并且每个请求都从上一个请求的结果开始。在 MBench-A 上对比六个世界模型基线，WM^MLLM 在所有四个环境恢复指标上具有最高的平均值（对极 91.5 对比 0.1 到 74.0），并完成了最多的相机往返（85.3% 对比最多 50.9%）。在对比 15 个基线的 15 个 CompBench 列中，它具有最佳值。在对 112 个局部编辑进行盲评时，在生成后选择写入区域将完成率从 34.8% 提高到 83.0%。在 258 个 WBench 和 MBench-A 项目上，所有 46 次重新访问都恢复了其早期视图，并且所有通过检查的 97 次局部编辑都保持了其区域外的全景像素不变。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建首个基于多模态大语言模型的交互式世界模型，实现从单张图像进行持久且可编辑的世界生成，解决视频世界模型中重新访问时编辑漂移或消失的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 将世界状态作为带有修订历史的全景图保存在生成器外部，由MLLMs进行写入和检查。2. 支持用户走到新地方并返回、通过文本或框编辑对象、放置主体及改变环境条件。3. 在MBench-A上，环境恢复指标和相机往返完成率显著优于6个基线；在CompBench的15个指标上均优于15个基线。4. 生成后选择写入区域将局部编辑完成率从34.8%提升至83.0%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过架构设计保证了状态的一致性和编辑的精确性，实验数据详实。但摘要未提供该模型在计算资源消耗、生成速度或处理极长序列与复杂场景时的具体表现和局限性，也未提及与基于3D表示的世界模型的对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大语言模型 / 世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e61. Thinking Fast, Anywhere: One System-1 for the Decision Points of Any Agent Workflow（快速思考，无处不在：适用于任何智能体工作流决策点的单一系统1）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23751\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23751\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutonomous LLM agents incur substantial cost and latency by invoking a large model (System-2) at every step, even when many intermediate actions choose among a small set of known candidates. Existing dual-system agents offload such decisions to a lightweight System-1 model, but rely on workflow-specific hooks authored per environment. We present AnyS1, a framework that turns human-authored procedural skills, whose instructions naturally specify where choices arise and which options apply, into a shared, domain-general source of decision points. Offline, AnyS1 mines grounded enumerable decisions across over 1,000 public skills, gathers execution-grounded trajectory states inside isolated containers to construct Any-DP, and trains a single calibrated 4B pointer System-1 with label smoothing. At run time, compiled workflows resolve routine decisions in one forward pass and fall back to System-2 when confidence falls below a calibrated threshold. Across three unseen benchmarks and distinct System-2 model families, AnyS1 preserves task reliability while cutting episode cost by 75-91% and model-call time by 63-92% relative to an uncompiled System-2 agent, and maintains performance under zero-shot threshold transfer.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自主大语言模型智能体在每一步都调用大型模型（系统2），从而产生巨大的成本和延迟，即使许多中间动作只是在一小群已知候选者中进行选择。现有的双系统智能体将此类决策卸载到轻量级的系统1模型，但依赖于为每个环境编写的特定于工作流的钩子。我们提出了 AnyS1，一个框架，它将人类编写的过程技能（其指令自然地指定了选择出现的位置和适用的选项）转化为共享的、领域通用的决策点来源。在离线阶段，AnyS1 在超过 1,000 个公开技能中挖掘有基础的 enumerable（可枚举）决策，在隔离容器中收集基于执行的轨迹状态以构建 Any-DP，并使用标签平滑训练一个单一的校准 4B 指针系统1。在运行时，编译后的工作流在一次前向传递中解决常规决策，并在置信度低于校准阈值时回退到系统2。在三个未见过的基准测试和不同的系统2模型家族中，AnyS1 在保持任务可靠性的同时，与未编译的系统2智能体相比，将 episode（回合）成本降低了 75-91%，模型调用时间减少了 63-92%，并在零样本阈值迁移下保持了性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e降低自主大语言模型智能体在中间决策步骤中的计算成本和延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 AnyS1 框架，利用人类编写的过程技能提取通用决策点；离线构建 Any-DP 数据集并训练单一 4B 指针系统1模型；运行时通过置信度阈值动态回退至系统2；在多个基准测试中大幅降低成本和延迟，同时保持任务可靠性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 AnyS1 有效降低了成本和延迟，且具备跨模型和零样本迁移能力。但摘要未提供关于该方法在更复杂、非枚举型决策或长尾任务中的表现，也未提及构建 Any-DP 和训练 4B 模型的具体离线成本与时间开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/大语言模型智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e62. VoxMel TTS Technical Report（VoxMel TTS 技术报告）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20254\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20254\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eContinuous autoregressive TTS relies on an acoustic target that enables stable next-latent modeling while preserving fine-grained acoustic details. While existing approaches employ learned compressed representations (e.g., continuous VAE latents) to render prediction tractable, they rely on complex neural encoders that often cap generation fidelity. Conversely, training-free targets like mel-spectrograms eliminate encoder overhead, yet their potential for autoregressive generation remains largely underexplored. In this work, we propose VoxMel, a tokenizer-free framework for autoregressive TTS that makes stable mel modeling tractable through a fixed, exactly invertible two-axis Haar transform. The transform first decomposes each mel spectrogram along frequency into local averages and a frequency residual, then splits the averaged component along time into Coarse-Mel and a temporal residual. A language-model backbone with a flow-matching head autoregressively generates Coarse-Mel. Non-autoregressive residual tiers then predict the temporal residual from Coarse-Mel, followed by the frequency residual conditioned on the reconstructed Frequency-Averaged Mel. Neither residual is fed back into the autoregressive history. Trained on 100K hours of Emilia, the supervised 0.6B model obtains 1.51\\% WER and 0.738 speaker similarity (SIM) on test-en, and 1.29\\% CER and 0.755 SIM on test-zh. GRPO improves these results to 1.15\\% WER / 0.753 SIM and 1.17\\% CER / 0.776 SIM, respectively. We also distill the guided flow head into two- and four-step students, requiring 2 or 4 head evaluations per coarse frame. The four-step student retains competitive SIM and nearly matches the supervised model in WER/CER.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e连续自回归 TTS 依赖于一种声学目标，该目标能够实现稳定的下一个潜在状态建模，同时保留细粒度的声学细节。虽然现有方法采用学习到的压缩表示（例如连续 VAE 潜在变量）来使预测变得易于处理，但它们依赖复杂的神经编码器，这通常会限制生成保真度。相反，像梅尔频谱图这样的免训练目标消除了编码器开销，但它们在自回归生成中的潜力在很大程度上仍未被充分探索。在这项工作中，我们提出了 VoxMel，一个用于自回归 TTS 的无分词器框架，它通过固定的、完全可逆的双轴 Haar 变换使稳定的梅尔建模变得易于处理。该变换首先沿频率将每个梅尔频谱图分解为局部平均值和频率残差，然后沿时间将平均分量拆分为粗梅尔（Coarse-Mel）和时间残差。带有流匹配头的语言模型骨干自回归地生成粗梅尔。然后，非自回归残差层从粗梅尔预测时间残差，接着是在重建的频率平均梅尔条件下预测频率残差。两个残差都不会反馈到自回归历史中。在 10 万小时的 Emilia 数据集上训练后，监督的 0.6B 模型在 test-en 上获得了 1.51% 的 WER 和 0.738 的说话人相似度（SIM），在 test-zh 上获得了 1.29% 的 CER 和 0.755 的 SIM。GRPO 将这些结果分别提高到 1.15% WER / 0.753 SIM 和 1.17% CER / 0.776 SIM。我们还将引导流头蒸馏为两步和四步学生模型，每个粗帧需要 2 或 4 次头评估。四步学生模型保留了具有竞争力的 SIM，并在 WER/CER 上几乎与监督模型相匹配。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种无分词器的自回归TTS框架VoxMel，通过双轴Haar变换实现稳定的免训练梅尔频谱图自回归建模。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了无分词器框架VoxMel，利用固定且完全可逆的双轴Haar变换分解梅尔频谱图；采用自回归生成粗梅尔与非自回归预测残差相结合的架构；在10万小时Emilia数据集上训练的0.6B模型取得了优异的WER/CER和说话人相似度，且GRPO进一步提升了性能；通过蒸馏实现了低步数的高效推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了免训练的梅尔频谱图结合特定变换可以有效用于自回归TTS，避免了复杂编码器对保真度的限制。局限性方面，摘要未提供该框架在零样本语音克隆、情感控制或长文本合成稳定性方面的表现，也未提供与当前最先进（SOTA）基于分词器方法的详细对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e语音合成与自然语言处理 / 文本到语音 (TTS)\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e63. Mobile AI Factory: Building Specialized Language Models for Your Mobile Device（移动AI工厂：为你的移动设备构建专用语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.13509\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.13509\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSmall language models (SLMs) running on mobile devices can keep user data private and work without connectivity. But they perform well only when fine-tuned for the target task and sized for the target device, a process that today requires repeated expert tuning. We present {\\it Mobile AI Factory}, an agentic system that builds a fine-tuned, quantized SLM for a given task and phone. Given a task specification and a target phone, an orchestrator LLM chooses whether to tune hyperparameters, mine real data, or generate synthetic examples, while fixed rules roll back changes that hurt accuracy. The factory searches from small to large models across base models and quantizations, adapts its accuracy goal as it searches, and uses real measurements of the target phone across inference engines and backends. We evaluate Mobile AI Factory on ten tasks and four Android phones. On an unseen testset, its on-device models outperform two five-shot frontier models on five tasks, by up to 0.34, and match them on three more. Its search comes within 0.03 of exhaustively training all 27 model variants on an entity extraction task, while using 19times less GPU time. Phone measurements also matter: the best configuration changes across phones. Without phone measurements, Claude Opus 5.5, given the full hardware and model specifications, misses the app\u0026#x27;s requirements in 25\\% of easy and moderate cases and in 60\\% of hard ones. Code is available at: https://github.com/evanly-gh/SLM_Factory.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在移动设备上运行的小型语言模型（SLM）可以保护用户数据隐私并在无网络连接的情况下工作。但它们只有在针对目标任务进行微调并针对目标设备调整大小时才能表现良好，而这一过程今天需要反复的专家调优。我们提出了Mobile AI Factory，一个代理系统，为给定任务和手机构建微调、量化的SLM。给定任务规范和目标手机，编排LLM选择是否调优超参数、挖掘真实数据或生成合成示例，同时固定规则回滚损害准确性的更改。该工厂在基础模型和量化之间从小型到大型模型进行搜索，在搜索时调整其准确性目标，并使用目标手机在推理引擎和后端的真实测量数据。我们在十个任务和四款Android手机上评估了Mobile AI Factory。在未见的测试集上，其设备端模型在五个任务上超越了两个五样本前沿模型，最高超出0.34，并在另外三个任务上与它们持平。在实体提取任务上，其搜索在穷举训练所有27个模型变体的0.03以内，同时使用的GPU时间减少了19倍。手机测量数据也很重要：最佳配置在不同手机之间发生变化。如果没有手机测量数据，Claude Opus 5.5在获得完整的硬件和模型规格的情况下，在25%的简单和中等情况以及60%的困难情况下未能满足应用程序的要求。代码可在：https://github.com/evanly-gh/SLM_Factory 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e为特定任务和移动设备自动构建微调且量化的小型语言模型（SLM）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了一个代理系统Mobile AI Factory，能自动搜索模型、量化和超参数；利用目标手机的实际测量数据进行搜索；在10个任务和4款手机上评估，设备端模型在5个任务上超越前沿模型，搜索效率比穷举训练高19倍；证明了手机实际测量数据的重要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在10个任务和4款Android手机上的评估结果，包括与前沿模型的对比（5个任务超越最高0.34，3个任务持平），以及与穷举训练的对比（差距0.03，GPU时间减少19倍）。同时指出了无手机测量数据时Claude Opus 5.5的失败率（简单/中等25%，困难60%）。关于系统在其他操作系统上的表现、长期稳定性及具体任务失败原因，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e移动计算与小型语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e64. Accelerating Mixture of Block Attention via Dynamic Routing, KV-Centric Execution and Runtime Pipelining（通过动态路由、以KV为中心的执行和运行时流水线加速块注意力混合）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26268\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26268\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMixture of Block Attention (MoBA) reduces long-context computation by selecting key-value (KV) blocks for each query. FlashMoBA implements MoBA efficiently but retains a fixed Top-k budget and query-centric schedule. Fixed Top-k applies one budget across different score distributions and couples routing to task granularity; query-range ownership fragments K/V reuse when several ranges select the same column. We present LightningMoBA, which co-designs selection and execution through dynamic routing, KV-centric ownership, and runtime pipelining. Dynamic routing thresholds MoBA\u0026#x27;s per-query block scores and directly emits variable-cardinality sparse metadata. KV-centric ownership groups selected rows by (query head, KV block) column, splits high-fanout columns into bounded tasks, and reuses each task\u0026#x27;s loaded KV tile. On Hopper, pipelining overlaps regular K/V transfers and irregular query gathers with Tensor Core computation. Together, these mechanisms decouple retention from GPU scheduling granularity. At matched Top-16 retention across five checkpoints, LightningMoBA accelerates end-to-end generation by 1.20 to 1.60x while raising mean RULER score from 74.42 to 75.28.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e块注意力混合（MoBA）通过为每个查询选择键值（KV）块来减少长上下文计算。FlashMoBA 高效地实现了 MoBA，但保留了固定的 Top-k 预算和以查询为中心的调度。固定的 Top-k 在不同的分数分布上应用单一预算，并将路由与任务粒度耦合；当多个范围选择同一列时，查询范围所有权会碎片化 K/V 重用。我们提出了 LightningMoBA，它通过动态路由、以 KV 为中心的所有权和运行时流水线协同设计选择和执行。动态路由对 MoBA 的每查询块分数进行阈值处理，并直接发出可变基数的稀疏元数据。以 KV 为中心的所有权按（查询头，KV 块）列对选定的行进行分组，将高扇出列拆分为有界任务，并重用每个任务加载的 KV 图块。在 Hopper 上，流水线将常规的 K/V 传输和不规则的查询收集与 Tensor Core 计算重叠。这些机制共同将保留率与 GPU 调度粒度解耦。在五个检查点上匹配 Top-16 保留率的情况下，LightningMoBA 将端到端生成加速了 1.20 到 1.60 倍，同时将平均 RULER 分数从 74.42 提高到 75.28。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出LightningMoBA，通过动态路由、以KV为中心的执行和运行时流水线协同设计，解决现有FlashMoBA中固定Top-k预算和查询中心调度导致的K/V重用碎片化和调度粒度耦合问题，从而加速长上下文计算。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出动态路由，对每查询块分数进行阈值处理并直接发出可变基数稀疏元数据，解耦路由与任务粒度。2. 引入以KV为中心的所有权，按列分组并拆分高扇出列，重用加载的KV图块，解决K/V重用碎片化问题。3. 在Hopper架构上实现运行时流水线，将K/V传输、查询收集与Tensor Core计算重叠。4. 在匹配Top-16保留率下，端到端生成加速1.20至1.60倍，RULER平均分从74.42提升至75.28。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了系统级优化的三个核心机制，并给出了明确的加速比和精度提升数据。但摘要未提供该方法在不同硬件架构（非Hopper）上的表现、内存占用的具体变化、以及在不同上下文长度下的扩展性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机系统 / 深度学习加速 / 注意力机制优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e65. AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher（AutoMaster：通过使同一模型成为更好的教师来实现自主后训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26510\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26510\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTask success alone does not specify which behaviors post-training should reinforce. Even successful teacher trajectories can contain unsupported assumptions, unproductive repetition, or superficial verification. We propose Skill-FT (Skill-Guided Fine-Tuning), which uses natural-language skills to suppress undesirable habits and elicit underrepresented effective behaviors during teacher rollouts, then fine-tunes a target model on the resulting trajectories. We introduce AutoMaster, an autonomous post-training system in which an LLM agent develops these interventions through trajectory analysis, skill design, data selection, and feedback from rollouts and target-model evaluation. Across Terminal, Search, and software engineering tasks with 4B and 9B target models, AutoMaster improves mean performance over Vanilla SFT on successful unguided teacher trajectories by 1.42-8.99 percentage points, with the teacher, task pool, training set size, and SFT recipe held fixed. Together with the ablations and trajectory analyses, these results suggest that behavioral shaping can make a fixed model a more effective teacher. We further find that retaining skill instructions during SFT yields higher mean performance than removing them across all six settings, despite their absence at evaluation and identical supervised outputs. These findings suggest that preserving skill context as part of a training demonstration can support better behavioral internalization.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e仅凭任务成功并不能指明后训练应该强化哪些行为。即使是成功的教师轨迹也可能包含未经支持的假设、无效的重复或肤浅的验证。我们提出了 Skill-FT（技能引导微调），它使用自然语言技能在教师推演期间抑制不良习惯并引出代表性不足的有效行为，然后在生成的轨迹上微调目标模型。我们引入了 AutoMaster，这是一个自主后训练系统，其中 LLM 智能体通过轨迹分析、技能设计、数据选择以及来自推演和目标模型评估的反馈来开发这些干预措施。在 Terminal、Search 和软件工程任务中，使用 4B 和 9B 目标模型，AutoMaster 在成功的无引导教师轨迹上比 Vanilla SFT 的平均性能提高了 1.42-8.99 个百分点，同时保持教师、任务池、训练集大小和 SFT 配方不变。结合消融实验和轨迹分析，这些结果表明行为塑造可以使固定模型成为更有效的教师。我们进一步发现，在所有六种设置中，在 SFT 期间保留技能指令比移除它们产生更高的平均性能，尽管在评估时它们不存在且监督输出相同。这些发现表明，将技能上下文作为训练演示的一部分保留下来可以支持更好的行为内化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出AutoMaster自主后训练系统和Skill-FT方法，利用自然语言技能引导教师模型生成高质量轨迹，以抑制不良习惯并引出有效行为，从而在固定教师模型的情况下提升目标模型的后训练效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Skill-FT，利用自然语言技能在教师推演中抑制不良习惯并激发有效行为。2. 引入AutoMaster系统，由LLM智能体自主进行轨迹分析、技能设计、数据选择和反馈迭代。3. 在4B和9B模型上，相比Vanilla SFT，平均性能提升1.42至8.99个百分点，且控制了教师、任务池等变量。4. 发现SFT期间保留技能指令能带来更高的平均性能，有助于行为内化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细说明了AutoMaster的工作机制和显著的实验提升，证明了行为塑造对固定模型作为教师的有效性。但摘要未提供AutoMaster自主设计技能的失败率或计算成本、保留技能指令对推理阶段延迟的影响，以及在更广泛任务类型上的泛化局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型后训练 / 强化学习与模仿学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e66. LogT: Logically Think with Images for Visual Search（LogT：面向视觉搜索的图像逻辑思考）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19200\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19200\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThinking with images empowers vision-language models (VLMs) to use an external Zoom-in tool for fine-grained visual search. Recent works employ supervised fine-tuning (SFT) and reinforcement learning (RL) with tool-specific designs to enable such capabilities. However, achieving logical reasoning alongside accurate and efficient tool use remains a significant challenge. To address this, we shift the focus away from increasing RL complexity and instead identify SFT data quality as a key bottleneck. We then propose LogT (short for Logically Think with Images), a fully automated SFT data engine that explicitly enforces logic-chain-guided reasoning. LogT generates an SFT dataset featuring challenging, visually grounded questions and structured tool-use traces with human-like logic. We validate our approach by fine-tuning two base models, Qwen2.5-VL-7B and InternVL3.5-8B, on the dataset and evaluating them across seven benchmark test sets. We show that LogT-SFT based on Qwen2.5-VL-7B outperforms the state-of-the-art trained with both SFT and RL, despite using 3.1times less data and \u0026gt;120times fewer GPU hours. Furthermore, applying a simple RL recipe without tool-specific design on LogT-SFT yields a model that surpasses prior methods with complex RL setups by a substantial 9.59-point margin. In addition to strong performance gains, our model exhibits higher tool-use accuracy and efficiency, as well as more structured and logically consistent reasoning traces, directly validating the effectiveness of our approach.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e用图像思考使视觉语言模型（VLMs）能够使用外部放大工具进行细粒度视觉搜索。最近的工作采用监督微调（SFT）和具有工具特定设计的强化学习（RL）来启用此类能力。然而，在实现逻辑推理的同时准确高效地使用工具仍然是一个重大挑战。为了解决这个问题，我们将重点从增加RL复杂性转移到识别SFT数据质量作为关键瓶颈。然后我们提出了LogT（Logically Think with Images的简称），一个完全自动化的SFT数据引擎，显式地强制执行逻辑链引导的推理。LogT生成一个SFT数据集，具有挑战性的、视觉基础的问题和具有类似人类逻辑的结构化工具使用轨迹。我们通过微调两个基础模型（Qwen2.5-VL-7B和InternVL3.5-8B）并在七个基准测试集上评估它们来验证我们的方法。我们表明，基于Qwen2.5-VL-7B的LogT-SFT优于同时使用SFT和RL训练的最先进模型，尽管使用的数据少了3.1倍，GPU时间少了大于120倍。此外，在没有工具特定设计的LogT-SFT上应用简单的RL配方，产生的模型以9.59分的巨大优势超越了具有复杂RL设置的先前方法。除了强大的性能提升外，我们的模型还表现出更高的工具使用准确性和效率，以及更结构和逻辑一致的推理轨迹，直接验证了我们方法的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提升视觉语言模型在细粒度视觉搜索中结合逻辑推理与外部放大工具准确高效使用的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出完全自动化的SFT数据引擎LogT，显式强制执行逻辑链引导的推理；生成包含挑战性视觉问题和类人逻辑结构化工具使用轨迹的SFT数据集；在减少3.1倍数据和大于120倍GPU时间的情况下超越现有SFT和RL方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出实现逻辑推理与准确高效工具使用的挑战在于SFT数据质量而非RL复杂性。LogT通过自动化数据引擎生成逻辑链引导的SFT数据，在Qwen2.5-VL-7B和InternVL3.5-8B上验证，以极少的数据和计算资源超越了现有最先进方法，并在叠加简单RL后进一步提升9.59分。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉语言模型与工具使用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e67. From Repositories to Training Environments: Scaling Long-Horizon Coding Agents with Environment Evolution Loop（从代码库到训练环境：利用环境演化循环扩展长视野编程智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21152\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21152\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTraining coding agents for long-horizon tasks requires environments with verifiable feedback. Existing pipelines often follow a linear process that ends with validation, establishing usability but providing little guidance on improving training value. Recursive self-improvement (RSI) often requires model rollouts or model training followed by downstream evaluation, with costs and feedback delays amplified on long-horizon tasks. How can we use timely, reliable proxy signals to improve training value and synthesize environments at scale? We present RepoFactory, an automated pipeline that converts real repositories into verifiable environments where agents build complete projects from scratch given a language specification. Its Environment Evolution Loop optimizes a multiplicative objective combining validity, structural coupling, and implementation scope through proxy feedback. RepoFactory produces 10,159 environments across 17 software domains. Training Qwen3.5-35B-A3B on these environments yields RepoHorizen-35B-A3B, which achieves gains of 22.6 percentage points on NL2Repo-Bench and 8.5 points on average across five benchmarks covering long-horizon coding and agentic tasks in real-world production settings, compared with 17.5 and 6.4 points without environment evolution. These results highlight the training value of RepoFactory environments and the additional gains from the Environment Evolution Loop.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e训练用于长视野任务的编程智能体需要具有可验证反馈的环境。现有流程通常遵循以验证结束的线性过程，确立了可用性，但几乎没有提供关于提高训练价值的指导。递归自我改进（RSI）通常需要模型展开或模型训练，然后进行下游评估，其成本和反馈延迟在长视野任务中被放大。我们如何使用及时、可靠的代理信号来提高训练价值并大规模合成环境？我们提出了 RepoFactory，这是一个自动化流程，可将真实的代码库转换为可验证的环境，在这些环境中，智能体在给定语言规范的情况下从头开始构建完整的项目。其环境演化循环通过代理反馈优化结合了有效性、结构耦合和实现范围的乘性目标。RepoFactory 在 17 个软件领域生成了 10,159 个环境。在这些环境上训练 Qwen3.5-35B-A3B 得到了 RepoHorizen-35B-A3B，与没有环境演化的 17.5 和 6.4 个百分点相比，它在 NL2Repo-Bench 上实现了 22.6 个百分点的提升，并在涵盖真实世界生产环境中长视野编程和智能体任务的五个基准测试中平均提升了 8.5 个百分点。这些结果突出了 RepoFactory 环境的训练价值以及环境演化循环带来的额外收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e长视野编程智能体的训练环境合成与优化（将真实代码库转化为可验证的训练环境，并通过环境演化循环提升智能体在长视野任务中的表现）\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出RepoFactory自动化流程，将真实代码库转化为可验证环境，使智能体能根据语言规范从头构建完整项目。2. 引入环境演化循环，通过代理反馈优化有效性、结构耦合和实现范围的乘性目标。3. 在17个软件领域生成了10,159个环境。4. 训练出的RepoHorizen-35B-A3B在NL2Repo-Bench上提升22.6个百分点，在五个真实世界生产环境基准上平均提升8.5个百分点，显著优于无环境演化的基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：RepoFactory通过环境演化循环解决了长视野编程任务中训练环境构建和反馈延迟的问题，利用代理信号大规模合成高质量环境，显著提升了编程智能体的性能。局限：摘要未提供关于环境演化循环的具体计算开销、生成环境的多样性与真实世界分布的偏差分析，以及该流程在其他模型架构上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 人工智能 / 代码生成与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e68. Regularized Score Centering（正则化得分居中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21791\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21791\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAsynchronous reinforcement learning increases training throughput, but data from stale policies and numerical mismatch between training and inference can destabilize learning. To stabilize off-policy learning, score centering (SC) removes the effect of reward baselines on the expected update. Our gradient diagnostics show less extreme gradients with SC than with importance sampling (IS), but SC can still fail when the learner moves far from the behavior policy that generated the data. To limit this policy mismatch, we introduce Regularized Score Centering (RSC), which adds a reverse Kullback-Leibler (KL) penalty to encourage the learner\u0026#x27;s next-token distribution to stay close to the behavior policy\u0026#x27;s next-token distribution. RSC works with or without truncated importance sampling (TIS), which caps token importance weights. Our theoretical analysis supports this approach, showing that KL regularization improves convergence guarantees. We evaluate dense and mixture-of-experts models on mathematical reasoning and agentic tasks, including online shopping, tool use, games, and fully asynchronous software engineering. RSC with TIS substantially improves sample efficiency across all agentic benchmarks, attaining higher training rewards with the same number of sampled responses. In final evaluations, it achieves top performance across all six agentic tasks, improving by 14.3% on AppWorld and reaching 9.9 times the strongest baseline\u0026#x27;s score on BabyAI.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e异步强化学习提高了训练吞吐量，但来自陈旧策略的数据以及训练和推理之间的数值不匹配可能会使学习不稳定。为了稳定异策略学习，得分居中（SC）消除了奖励基线对预期更新的影响。我们的梯度诊断显示，与重要性采样（IS）相比，SC产生的极端梯度较少，但当学习器远离生成数据的行为策略时，SC仍可能失败。为了限制这种策略不匹配，我们引入了正则化得分居中（RSC），它添加了一个反向Kullback-Leibler（KL）惩罚，以鼓励学习器的下一个token分布保持接近行为策略的下一个token分布。RSC可与截断重要性采样（TIS）结合使用或不结合使用，TIS限制了token重要性权重。我们的理论分析支持这一方法，表明KL正则化改善了收敛保证。我们在数学推理和智能体任务（包括在线购物、工具使用、游戏和完全异步软件工程）上评估了稠密模型和混合专家模型。带有TIS的RSC在所有智能体基准测试中显著提高了样本效率，在相同数量的采样响应下获得了更高的训练奖励。在最终评估中，它在所有六个智能体任务中取得了顶级性能，在AppWorld上提高了14.3%，并在BabyAI上达到了最强基线得分的9.9倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e稳定异步强化学习中的异策略学习，解决陈旧策略数据和数值不匹配导致的学习不稳定问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入正则化得分居中（RSC），通过添加反向KL惩罚限制策略不匹配；结合截断重要性采样（TIS）显著提高样本效率；理论分析证明KL正则化改善收敛保证；在数学推理和多种智能体任务（如AppWorld、BabyAI）中取得顶级性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了RSC以解决SC在学习器远离行为策略时失败的问题。局限方面，摘要未提供关于该方法在特定任务类型上的失败案例、计算开销增加或超参数敏感性等局限性的讨论。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习 / 机器学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e69. SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models（SALA：语义对齐的潜在动作实现具身基础模型的双轴扩展）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17110\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17110\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEmbodied foundation models hinge on diverse robot interaction data, which are costly to collect. Egocentric human videos offer a complementary source of experience, and latent action models (LAMs) provide a popular means of leveraging these videos for policy supervision. Compared with world-action models (WAMs), LAMs can offer greater training efficiency and potentially lower inference costs by avoiding explicit pixel prediction during policy learning and execution. However, most existing LAMs learn latent actions solely through video reconstruction, which can cause their representations to cluster by visual appearance rather than by the underlying actions. As a result, they struggle to align human actions with their robot counterparts. To bridge the gap, we introduce SALA, which emphasizes establishing the semantic correspondence for latent actions. Without requiring paired data, we use the language descriptions of unpaired human and robot clips to estimate semantic similarities and supervise cross-embodiment correspondence. Specifically, we translate these similarities into soft neighborhood structures that guide human latent actions toward semantically related robot latents, while robot action reconstruction grounds the latent space in control. The resulting shared latent action space provides a unified supervision signal for training an embodied foundation model on both human and robot videos. Notably, latent action supervision enables scaling along two axes: (1) pre-training on increasing amounts of general human video consistently reduces robot action prediction error on downstream tasks, and (2) post-training on increasing amounts of task-specific human video substantially improves real-world robot task success rates.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具身基础模型依赖于多样化的机器人交互数据，而这些数据的收集成本高昂。以自我为中心的人类视频提供了互补的经验来源，潜在动作模型（LAMs）提供了一种利用这些视频进行策略监督的流行手段。与世界上动作模型（WAMs）相比，LAMs 可以通过在策略学习和执行期间避免显式的像素预测来提供更高的训练效率和潜在更低的推理成本。然而，大多数现有的 LAMs 仅通过视频重建来学习潜在动作，这可能导致它们的表示按视觉外观而不是底层动作进行聚类。因此，它们难以将人类动作与其机器人对应物对齐。为了弥合这一差距，我们引入了 SALA，它强调为潜在动作建立语义对应关系。在不需要配对数据的情况下，我们使用未配对的人类和机器人片段的语言描述来估计语义相似性并监督跨具身对应关系。具体而言，我们将这些相似性转化为软邻域结构，以引导人类潜在动作朝向语义相关的机器人潜在动作，同时机器人动作重建将潜在空间扎根于控制中。由此产生的共享潜在动作空间为在人类和机器人视频上训练具身基础模型提供了统一的监督信号。值得注意的是，潜在动作监督实现了沿两个轴的扩展：（1）在越来越多的通用人类视频上进行预训练持续降低了下游任务上的机器人动作预测误差，并且（2）在越来越多的特定任务人类视频上进行后训练大幅提高了现实世界机器人任务的成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用未配对的人类和机器人视频数据，通过语义对齐的潜在动作模型（SALA）训练具身基础模型，以实现机器人策略的监督与双轴扩展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SALA方法，利用未配对的人类和机器人视频的语言描述估计语义相似性，建立潜在动作的跨具身语义对应关系。2. 将语义相似性转化为软邻域结构，引导人类潜在动作对齐机器人潜在动作，并通过机器人动作重建将潜在空间扎根于控制。3. 实现了双轴扩展：增加通用人类视频预训练降低下游动作预测误差，增加特定任务人类视频后训练提高真实世界任务成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出SALA通过语言描述解决现有LAMs因视觉外观聚类导致的动作不对齐问题，实现了跨具身语义对齐和双轴扩展。局限性方面，摘要未提供关于具体数据集规模、计算资源消耗、不同语言描述质量对模型的影响以及在其他未提及的机器人平台上的泛化能力等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e70. Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding（重新思考尖峰：通过步长感知解码缓解多模态扩散语言模型中的幻觉）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12901\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12901\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advancements in multimodal diffusion language models (MDLMs) have exhibited strong global modeling capabilities through iterative refinement. We observe that mask uncertainty follows an overall downw
