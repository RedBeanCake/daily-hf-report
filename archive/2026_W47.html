中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在粒子物理学中，实验测量与标准模型（SM）预测之间的差异通常在新的理论模型中进行解释。在这种背景下，标准模型有效场论（SMEFT）提供了一个包含广泛模型类别的通用框架。然而，探索巨大的可能 SMEFT 算子空间迅速成为一个具有挑战性的组合问题：许多算子可以同时贡献于不同的可观测量，它们的影响是相关的，并且不同的算子组合可以提供对数据相当好的描述。在这项工作中，我们使用强化学习（RL）将 SMEFT 算子空间的探索公式化为一个序列决策问题。我们的 RL 智能体采用轻量级的 actor-critic 架构，总共约有 40K 个可训练参数。我们的方法不是为了寻找单一的最佳拟合理论，而是旨在发现一组多样化的高质量理论假设。我们在一个复杂的现象学环境中测试了该方法，该环境包含粒子物理学几个领域的 132 个可观测量，其中包括 24 个与其 SM 预测偏差超过 1.5σ 的测量值。我们表明，学习到的 RL 策略有效地构建了多算子理论，从而大幅改善了全局拟合。与独立的随机子集和随机序列搜索的比较证明了 RL 策略导航这个大型组合空间的能力。我们的结果将 RL 确立为探索 SMEFT 中新物理（NP）相互作用多样化模式的系统框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e使用强化学习探索标准模型有效场论（SMEFT）中巨大的算子组合空间，以发现能够解释实验测量与标准模型预测差异的多样化新物理理论假设。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e将 SMEFT 算子空间探索建模为序列决策问题，采用约 40K 参数的轻量级 actor-critic 架构；在包含 132 个可观测量的复杂现象学环境中，学习到的 RL 策略能有效构建多算子理论，显著改善全局拟合，并优于随机搜索方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该强化学习框架能够有效导航庞大的 SMEFT 算子组合空间，发现多样化的高质量理论假设，并显著改善全局拟合。局限性方面，摘要未提供该 RL 方法与其他现有启发式或优化算法的具体定量对比，未说明计算成本或训练时间，也未提及该方法在处理更高维度算子空间或更复杂相关性时的可扩展性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e粒子物理学 / 强化学习与科学计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e214. Reflection Anchors for Propagation-Aware Visual Retention in Long-Chain Multimodal Reasoning（长链多模态推理中传播感知视觉保留的反思锚点）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2605.09614\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2605.09614\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLong chain-of-thought (CoT) reasoning improves large vision--language models, but visual information often fades during generation, limiting long-horizon multimodal reasoning. Existing methods either re-inject vision at inference or train policies for stronger grounding, but where to intervene relies on perception heuristics rather than principled gain analysis, and how local visual influence propagates remains implicit. We study this problem from an information-theoretic standpoint and derive a lower bound on the downstream visual gain of a one-step intervention, which suggests two factors: local branching room (token entropy) and downstream visual propagation potential (suffix divergence from a vision-marginalized reference). Guided by this analysis, we propose reflection-anchor policy optimization (RAPO), a GRPO-based policy optimization method that selects high-entropy reflection anchors and optimizes a chain-masked finite-window KL surrogate for downstream visual dependence. Experiments on reasoning-intensive and general-domain benchmarks show that RAPO delivers substantial gains over strong baselines across multiple LVLM backbones. Mechanism analyses further indicate that reflection anchors are enriched for visually sensitive decision points and that RAPO increases contrastive visual-dependence signals along generated trajectories.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e长思维链（CoT）推理提升了大型视觉语言模型，但视觉信息在生成过程中往往会消退，限制了长视野多模态推理。现有方法要么在推理时重新注入视觉信息，要么训练策略以进行更强的接地，但干预位置依赖于感知启发式而非基于原则的增益分析，且局部视觉影响如何传播仍然不明确。我们从信息论的角度研究这个问题，并推导出单步干预的下游视觉增益的下限，这提出了两个因素：局部分支空间（词元熵）和下游视觉传播潜力（后缀与视觉边缘化参考的散度）。在该分析的指导下，我们提出了反思锚点策略优化（RAPO），这是一种基于GRPO的策略优化方法，它选择高熵反思锚点，并优化用于下游视觉依赖的链掩码有限窗口KL代理。在推理密集型和通用领域基准上的实验表明，RAPO在多个LVLM骨干网络上提供了超越强基线的实质性增益。机制分析进一步表明，反思锚点在视觉敏感的决策点上得到了丰富，并且RAPO增加了沿生成轨迹的对比视觉依赖信号。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决大型视觉语言模型在长思维链推理过程中视觉信息消退的问题，通过基于原则的增益分析确定干预位置并优化策略以保留视觉信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e从信息论角度推导单步干预下游视觉增益下限，提出局部分支空间和下游视觉传播潜力两个因素；提出反思锚点策略优化（RAPO），选择高熵反思锚点并优化链掩码有限窗口KL代理；在多个LVLM骨干和基准上取得实质性增益；机制分析表明反思锚点富集于视觉敏感决策点并增加对比视觉依赖信号。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明RAPO在推理密集型和通用领域基准上相比强基线取得了实质性增益，且机制分析验证了其有效性。局限性方面，摘要未提供具体的定量提升数值、不同LVLM骨干网络之间的性能差异细节、RAPO方法引入的额外计算开销，以及在非CoT推理模式下的适用性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 多模态大模型与推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e215. GlyphAtlas: Disentangling Stroke Detail from Layout for Scene Text Synthesis（GlyphAtlas：在场景文本合成中解耦笔画细节与布局）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20192\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20192\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eScene text synthesis requires stroke-accurate characters rendered in a specified layout, as well as visual coherence with the surrounding scene. To achieve this, existing methods commonly pre-render the target text at its intended locations to form a glyph image that jointly specifies layout and glyph structure. However, this representation ties the resolution of each glyph to its target region, limiting fine-grained stroke guidance for small, densely packed, or structurally complex text. To tackle this, we propose GlyphAtlas, a scene text synthesis framework that retains the glyph image as a spatial anchor and supplies fine-grained stroke references through a dedicated glyph atlas. The atlas renders and encodes each character or word in a separate cell, decoupling reference resolution from target-region size. We further introduce atlas-anchored attention, which lets each text region retrieve stroke detail only from its corresponding atlas cells to refine the coarse glyph structure provided by the glyph image. This coarse-to-fine conditioning simplifies stroke rendering while preserving explicit layout correspondence. We optimize GlyphAtlas with a mask-weighted flow matching objective and a timestep-weighted text perceptual loss for writing accuracy and background consistency. Random resolution augmentation of atlas cells supports adjustable atlas budgets at inference. Extensive experiments demonstrate that GlyphAtlas achieves stroke-accurate synthesis of small, dense, and structurally complex text, zero-shot transfer to languages unseen during task-specific training, and leading performance in scenes with many text regions. project page: https://fr0zencrane.github.io/project-glyphatlas/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e场景文本合成需要在指定布局中渲染笔画准确的字符，并与周围场景保持视觉连贯性。为了实现这一目标，现有方法通常在目标位置预渲染目标文本以形成字形图像，从而共同指定布局和字形结构。然而，这种表示将每个字形的分辨率与其目标区域绑定，限制了对小、密集或结构复杂的文本的细粒度笔画指导。为了解决这个问题，我们提出了GlyphAtlas，这是一个场景文本合成框架，它保留字形图像作为空间锚点，并通过专用的字形图集提供细粒度的笔画参考。图集在单独的单元格中渲染和编码每个字符或单词，将参考分辨率与目标区域大小解耦。我们进一步引入了图集锚定注意力，它让每个文本区域仅从其对应的图集单元格中检索笔画细节，以细化字形图像提供的粗略字形结构。这种从粗到细的条件化简化了笔画渲染，同时保留了明确的布局对应关系。我们使用掩码加权流匹配目标和时间步加权文本感知损失来优化GlyphAtlas，以提高书写准确性和背景一致性。图集单元格的随机分辨率增强支持推理时可调整的字图集预算。大量实验表明，GlyphAtlas实现了小、密集和结构复杂文本的笔画准确合成，向特定任务训练中未见过的语言的零样本迁移，以及在具有许多文本区域的场景中的领先性能。项目页面：https://fr0zencrane.github.io/project-glyphatlas/\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决场景文本合成中现有方法将字形分辨率与目标区域绑定，从而限制对小、密集或复杂文本进行细粒度笔画指导的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出GlyphAtlas框架，通过专用字形图集提供细粒度笔画参考，解耦参考分辨率与目标区域大小；引入图集锚定注意力实现从粗到细的条件化；使用掩码加权流匹配和时间步加权文本感知损失进行优化；实现小、密集、复杂文本的准确合成及零样本语言迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明GlyphAtlas在小、密集和复杂文本合成以及零样本语言迁移上取得了领先性能。局限性方面，摘要未提供具体的定量评估指标数值、推理速度、图集预算调整对生成质量的具体影响，以及在极端复杂背景下的鲁棒性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像生成与编辑\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e216. BrickFlow: Connectivity-Guided Brick Reconstruction（BrickFlow：连接引导的积木重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17321\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17321\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGiven a set of LEGO parts and an image of an assembled object, our task is to infer the pose of each part to assemble the object. In contrast with traditional 3D reconstruction, doing so requires satisfying discrete physical constraints, which provide structure but render the problem combinatorial and highly sensitive to small pose errors. To learn a prior over how parts fit together, we train a set-conditioned SE(3) flow model on procedurally generated assemblies. We then finetune this model to inject image conditioning, using 1% as much data. However, while the learned flow captures global structure, it does not enforce connectivity. To address this, we introduce an analytic connectivity-field guidance to pull predictions toward connected assemblies at test time. Through this, we demonstrate improved build quality with model size, pretraining, and guidance. We make our models and data available for research purposes at https://kulits.github.io/BrickFlow/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e给定一组乐高零件和一个组装物体的图像，我们的任务是推断每个零件的姿态以组装该物体。与传统的3D重建相比，这样做需要满足离散的物理约束，这些约束提供了结构，但也使问题变得组合化，并对微小的姿态误差高度敏感。为了学习零件如何组合在一起的先验，我们在程序生成的组件上训练了一个集合条件SE(3)流模型。然后，我们微调该模型以注入图像条件，仅使用1%的数据。然而，虽然学习到的流捕获了全局结构，但它没有强制执行连接性。为了解决这个问题，我们引入了一个解析连接场引导，在测试时将预测拉向连接的组件。通过这种方法，我们证明了随着模型规模、预训练和引导的增加，构建质量得到了改善。我们将模型和数据用于研究目的，发布在 https://kulits.github.io/BrickFlow/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e给定一组乐高零件和组装物体的图像，推断每个零件的姿态以组装物体。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 训练集合条件SE(3)流模型学习零件组合先验，并微调注入图像条件（仅用1%数据）。2. 引入解析连接场引导，在测试时将预测拉向连接的组件，解决流模型不强制执行连接性的问题。3. 证明了模型规模、预训练和引导对构建质量的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统3D重建与积木重建的区别在于离散物理约束导致组合问题和姿态误差敏感性。方法上结合了流模型和解析连接场引导。局限性方面，摘要未提供具体的评估指标、对比基线或具体的失败案例，仅定性说明了构建质量的改善。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与3D重建\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e217. OneSteer: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control（OneSteer：通过单步扩散全身控制解锁可转向的通用仿人运动跟踪）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2610.41354\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2610.41354\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDeployment objectives often specify desired outcomes without providing revised trajectories, while parts of the original reference must still be followed. We present OneSteer, a one-step diffusion whole-body controller that combines general motion tracking with selective test-time steering. To accommodate new objectives, differentiable task costs guide optimization of the generator\u0026#x27;s input noise with frozen weights, while body-group reference masks relax selected tracking requirements. Predicted state-action plans provide a shared interface for task optimization and feedback-conditioned execution. For nominal tracking, the model trained from scratch achieves the lowest local tracking error among the evaluated baselines on successful held-out AMASS and BONES clips. For steering, one frozen distilled controller adapts across diverse deployment objectives in simulation, raising the clean passage rate under a 1.25 m bar from 2% to 90%. On a physical Unitree G1, OneSteer completes all 27 nominal tracking trials across nine diverse whole-body motion sequences without falling. With a steering cost derived from a signed distance field built using only onboard LiDAR, it also passes under a 1.1 m low bar in four of five attempts and steps over a 12 cm hurdle without falling in all three attempts. Beyond control, prediction variation in the model trained from scratch ranks likely tracking failures without physics rollouts. This scoring method is more than 10x faster than simulation-based scoring with five rollouts per clip and guides targeted fine-tuning. Project page: https://onesteer.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e部署目标通常指定期望的结果而不提供修改后的轨迹，同时仍需遵循原始参考的一部分。我们提出了 OneSteer，一种单步扩散全身控制器，它将通用运动跟踪与选择性的测试时转向相结合。为了适应新目标，可微任务成本引导具有冻结权重的生成器输入噪声的优化，同时身体组参考掩码放宽了选定的跟踪要求。预测的状态-动作计划为任务优化和反馈条件执行提供了共享接口。对于标称跟踪，从头训练的模型在成功的保留 AMASS 和 BONES 剪辑中，在评估的基线中实现了最低的局部跟踪误差。对于转向，一个冻结的蒸馏控制器在仿真中适应不同的部署目标，将 1.25 米横杆下的干净通过率从 2% 提高到 90%。在物理 Unitree G1 上，OneSteer 在九个不同的全身运动序列中完成了所有 27 次标称跟踪试验而没有摔倒。利用仅使用机载激光雷达构建的符号距离场得出的转向成本，它还在五次尝试中的四次中通过了 1.1 米的低横杆，并在所有三次尝试中跨过了 12 厘米的障碍物而没有摔倒。除了控制之外，从头训练的模型中的预测变化无需物理回滚即可对可能的跟踪失败进行排名。这种评分方法比每个剪辑五次回滚的基于仿真的评分快 10 倍以上，并指导有针对性的微调。项目页面：https://onesteer.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种结合通用运动跟踪与选择性测试时转向的单步扩散全身控制器（OneSteer），以适应部署目标指定期望结果但不提供修改后轨迹的需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出OneSteer，结合通用运动跟踪与测试时转向，通过可微任务成本优化输入噪声并使用身体组参考掩码放宽跟踪要求。2. 在标称跟踪中，从头训练的模型在AMASS和BONES数据集上实现最低局部跟踪误差。3. 在仿真中，冻结的蒸馏控制器将1.25米横杆下的干净通过率从2%提升至90%。4. 在物理Unitree G1上，完成27次标称跟踪试验未摔倒；在1.1米低横杆下5次尝试通过4次，跨越12厘米障碍物3次未摔倒。5. 利用预测变化对跟踪失败进行排名，评分速度比基于仿真的评分快10倍以上。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了OneSteer在仿真和物理机器人上的卓越跟踪和转向能力，并提供了具体的成功率数据，同时提出了一种无需物理回滚的快速失败排名方法。局限性方面，摘要未提供关于计算资源消耗的具体数值、在更复杂环境下的泛化能力评估、以及与其他最新非基线方法的详细对比等局限信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/运动控制/强化学习与扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e218. TwinD: Generalizing Deepfake Detection from Blending to Entire Face Synthesis（TwinD：将深度伪造检测从混合泛化到整脸合成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25935\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25935\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFacial deepfake detectors are usually trained on blending fakes, where a generated face is pasted back into a real frame. Recent generators synthesize the entire face and leave no traces of blending. On a benchmark of 19 datasets released from 2019 to 2026, the best prior facial deepfake detector reaches a mean AUROC of 96.2% on ten blending datasets, but none exceeds 78.1% on five datasets of entire face synthesis (EFS). AI-generated content (AIGC) detectors do not close this gap. We propose TwinD, a detector trained on FaceForensics++ fakes and two kinds of twins: fakes made from a real frame. A reconstruction twin is a real frame reconstructed by an autoencoder, with the real pixels put back in a random region. It targets the neural traces of a decoder. A blob twin blends an altered copy of a real frame with the frame itself, targeting blending artifacts. It needs no generator and no face-shaped mask. Together, these twins provide two complementary forensic cues that generalize to unseen manipulations. TwinDreaches a mean AUROC of 96.3%, 8.9 points above the prior state-of-the-art, with 98.1% on the blending datasets and 95.6% on the EFS datasets. Trained on twins alone, without a deepfake dataset, single models still reach 94.3% on average over three seeds. For reproducibility, the code, trained model, and training data are at: https://github.com/yermandy/TwinD\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e面部深度伪造检测器通常是在混合伪造上训练的，即把生成的脸粘贴回真实帧中。最近的生成器会合成整张脸，不留任何混合痕迹。在 2019 年至 2026 年发布的 19 个数据集的基准测试中，先前最好的面部深度伪造检测器在 10 个混合数据集上达到了 96.2% 的平均 AUROC，但在 5 个整脸合成（EFS）数据集上均未超过 78.1%。AI 生成内容（AIGC）检测器未能弥补这一差距。我们提出了 TwinD，一种在 FaceForensics++ 伪造数据和两种孪生数据（由真实帧制成的伪造数据）上训练的检测器。重建孪生是由自编码器重建的真实帧，真实像素被放回随机区域。它针对的是解码器的神经痕迹。斑点孪生将真实帧的修改副本与该帧本身混合，针对混合伪影。它不需要生成器也不需要人脸形状掩码。这两种孪生数据共同提供了两种互补的取证线索，可泛化到未见过的操纵。TwinD 达到了 96.3% 的平均 AUROC，比先前的最先进水平高出 8.9 个百分点，在混合数据集上达到 98.1%，在 EFS 数据集上达到 95.6%。仅在孪生数据上训练而不使用深度伪造数据集，单模型在三个种子上的平均准确率仍能达到 94.3%。为了可重复性，代码、训练模型和训练数据位于：https://github.com/yermandy/TwinD\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为 TwinD 的面部深度伪造检测器，旨在解决现有检测器在整脸合成（EFS）伪造数据上泛化能力差的问题，提升对不留混合痕迹的最新生成器伪造人脸的检测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 TwinD 检测器，利用两种孪生伪造数据（重建孪生和斑点孪生）结合 FaceForensics++ 数据进行训练。2. 重建孪生通过自编码器重建真实帧并放回随机区域，针对解码器的神经痕迹；斑点孪生混合真实帧的修改副本与原帧，针对混合伪影，且无需生成器和人脸掩码。3. 在 19 个数据集的基准测试中，TwinD 平均 AUROC 达到 96.3%，比先前 SOTA 高 8.9 个百分点，在 EFS 数据集上达到 95.6%。4. 仅使用孪生数据训练（不使用真实深度伪造数据集），单模型平均 AUROC 仍可达 94.3%。5. 开源了代码、训练模型和训练数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：TwinD 通过引入针对解码器神经痕迹和混合伪影的两种互补孪生数据，有效提取了泛化到未见操纵的取证线索，显著提升了模型在整脸合成（EFS）数据集上的检测性能，弥补了现有检测器在面对最新全脸生成器时的性能差距。局限：摘要未提供关于模型在不同压缩率、分辨率变化、对抗性攻击下的鲁棒性评估以及在视频序列检测中的表现和计算复杂度等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像伪造检测 / 多媒体安全\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e219. CONGA: Compiling Gaussian Fiber Geometry for Structured Bayesian Inference（CONGA：为结构化贝叶斯推断编译高斯纤维几何）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20995\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20995\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn structured Bayesian models, a large latent block is often Gaussian conditional on a smaller set of parameters, yet generic inference methods relearn this geometry during warmup. We study how this structure can be used to construct transports for posterior inference. The conditional mean and precision determine exact affine maps, including symmetric Brenier and triangular Knothe-Rosenblatt maps, that separate a standard normal block from the remaining non-Gaussian core. KL and relative Fisher objectives then reduce to objectives on this core. We introduce CONGA, a compiler that identifies candidate Gaussian blocks and selects a temporal, spectral, or sparse implementation according to their structure and computational cost. Marginalization requires an identity established from the model; numerical evidence alone permits only a target-preserving change of variables, and a failed check leaves the model unchanged. On the Stock-Watson inflation model, CONGA improves minimum ESS per second by 12.5x for NUTS. It also restores convergence where the raw target fails: for WALNUTS on the same model, and for NUTS on a 6760-dimensional electricity load model reduced to 34 core coordinates. Experiments on graph-indexed fields show how coloring and fill affect the choice of map, including cases where retaining the original target is preferable.\u003cbr\u003e  Code at https://github.com/vicgalle/conga\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在结构化贝叶斯模型中，一个大的潜在块通常在条件于一组较小的参数时呈高斯分布，然而通用推断方法在预热期间会重新学习这种几何结构。我们研究了如何利用这种结构来构建用于后验推断的传输映射。条件均值和精度决定了精确的仿射映射，包括对称Brenier映射和三角Knothe-Rosenblatt映射，这些映射将标准正态块与剩余的非高斯核心分离开来。随后，KL和相对Fisher目标简化为针对该核心的目标。我们引入了CONGA，这是一个编译器，它识别候选高斯块，并根据其结构和计算成本选择时间、频谱或稀疏实现。边缘化需要从模型中建立的一个恒等式；仅凭数值证据只允许保持目标不变的变量替换，而失败的检查则保持模型不变。在Stock-Watson通胀模型上，CONGA将NUTS的每秒最小有效样本量（ESS）提高了12.5倍。它还恢复了原始目标失败时的收敛性：在同一模型上的WALNUTS，以及在降至34个核心坐标的6760维电力负载模型上的NUTS。在图索引场上的实验展示了着色和填充如何影响映射的选择，包括保留原始目标更可取的情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发CONGA编译器，利用结构化贝叶斯模型中的高斯条件潜在块几何结构，构建传输映射以加速后验推断。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出CONGA编译器，自动识别高斯块并选择时间、频谱或稀疏实现以构建仿射映射。2. 将标准正态块与非高斯核心分离，简化KL和相对Fisher目标。3. 在Stock-Watson通胀模型上，NUTS的每秒最小ESS提高12.5倍。4. 在6760维电力负载模型（降至34个核心坐标）等原始目标失败的情况下恢复收敛。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种利用模型内在高斯条件结构来优化贝叶斯推断的编译方法CONGA，通过分离高斯和非高斯部分显著提高了采样效率并恢复了收敛性。局限性方面，摘要未提供CONGA编译器本身的编译时间开销、在更广泛的复杂贝叶斯模型（如深层生成模型）上的适用性，以及图索引场实验中着色和填充策略的具体量化影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e贝叶斯推断与概率编程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e220. GPBam: A Retrieval-Aware German Public Law Exam Benchmark（GPBam：一个感知检索的德国公法考试基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18981\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18981\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLegal reasoning in civil-law systems is not rule-lookup: the German state examination asks for a structured opinion (Gutachten) that names the governing norms, applies them to the facts, and argues to a conclusion. We introduce GPBam (German Public Law Bar-style Exam), 81 public-law examination cases with reference solutions, paired with a recitation task over 200 statutory provisions. Drawn from state examination preparation, the cases are broad and rarely repeat, and are not publicly available - we find no evidence of exact-solution memorisation in the models we evaluate, and keeping them private limits contamination. Because each reference solution\u0026#x27;s cited norms form a retrieval gold set over the very instances the essays are graded on, GPBam scores retrieval and long-form generation jointly, which makes it a benchmark for legal retrieval as well as for legal writing and lets us ask how much retrieval quality a legal opinion actually needs. Across 32 open-weight and proprietary models evaluated without retrieval, scores span 4.81-76.42 out of 100. Supplying the law helps modestly: across seven models and eight retrieval configurations, retrieval performance varies nearly threefold and buys at most 4.1 essay points, and nothing significant for three of the seven, while an oracle with 91% gold-norm recall improves scores by 2-6 points. Essay quality strongly tracks prior knowledge: verbatim statute recall, measured in a separate task, correlates at ρ= 0.92 over 32 models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大陆法系中的法律推理不是规则查找：德国国家考试要求提供一份结构化的意见（Gutachten），指出适用规范，将其应用于事实，并论证得出结论。我们引入了 GPBam（德国公法律师风格考试），包含 81 个带有参考解决方案的公法考试案例，并配有一个涵盖 200 多项法定条款的背诵任务。这些案例取自国家考试准备，范围广泛且很少重复，并且不公开——我们在评估的模型中没有发现精确解决方案记忆的证据，保持私密性限制了数据污染。因为每个参考解决方案引用的规范构成了对论文进行评分的实例的检索黄金集，GPBam 联合对检索和长文本生成进行评分，这使其成为法律检索以及法律写作的基准，并让我们能够探究法律意见实际上需要多少检索质量。在评估的 32 个开放权重和专有模型中，在不使用检索的情况下，得分跨度为 100 分中的 4.81 到 76.42 分。提供法律条文有适度的帮助：在 7 个模型和 8 种检索配置中，检索性能变化近三倍，最多提高 4.1 分的论文分数，其中 3 个模型没有显著提高，而具有 91% 黄金规范召回率的 oracle 将分数提高了 2 到 6 分。论文质量与先验知识密切相关：在单独任务中测量的逐字法规召回率，在 32 个模型上的相关系数为 ρ= 0.92。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估大语言模型在大陆法系（特别是德国公法）中的法律推理能力，包括结构化法律意见生成（长文本生成）和法律条文检索能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了包含 81 个非公开公法案例和 200 多项法定条款背诵任务的 GPBam 基准，联合评估检索与长文本生成；发现提供法律条文检索对模型分数的提升有限（最多 4.1 分），而模型先验知识（逐字法规召回率）与论文质量高度相关（ρ= 0.92）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 GPBam 有效评估了模型的法律推理和检索能力，并揭示了检索增强在复杂法律推理中的局限性，即模型表现更依赖于先验知识而非外部检索。局限性方面，摘要未提供关于模型在特定法律子领域的具体表现差异，未说明案例的具体难度分布，也未提及长文本生成评估的具体自动指标或人工评估细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 法律人工智能与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e221. Zuse: A Decision Model for European Languages（Zuse：一种面向欧洲语言的决策模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.06238\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.06238\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecision models read a document and return a probability for each of a fixed set of options instead of generating text. Several appeared in 2026, but none has published results outside English. We describe Zuse, three decision models (4B, 9B and 27B) that train a low-rank adapter and a pointer head on frozen open-weight bases, targeting 27 European languages, and use them to study how this design behaves across languages and tasks. On a broad European suite of 11 sources excluded from training, covering 9 task groups and 27 languages, a development set that also guided model selection, the 27B model reaches 87.5% accuracy with a pooled expected calibration error of 0.016, and 0.035 when weighted per source. Post-hoc analyses of these single-seed results give three findings. First, miscalibration is structured by task rather than language: on parallel reading and topic items in 26 languages the confidence gap varies about as much as sampling noise, while across sources it spans -0.07 to +0.09, with knowledge tasks overconfident and acceptability judgements underconfident at all three sizes, so one fitted temperature cannot correct both. Second, the share of decisions that can be automated at a 5% error budget follows chance-corrected skill (Spearman 0.97 over 33 source and model pairs) more closely than raw accuracy (0.91). Third, reach beyond the training languages is set by the base model: across 210 languages, changing the training run moved scores by at most about 2 points within a size, while languages outside the base\u0026#x27;s documented list trail by 23 to 28 points at every size. On English public suites Zuse is behind Jev and Kev, including Kev models on the same bases. We also report two pitfalls in building multi-source training data: label-word collision between topic schemes, and an injection augmentation that taught a shortcut. Zuse can be tried at https://bineric.com/zuse.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e决策模型读取文档并为固定选项集中的每个选项返回概率，而不是生成文本。2026 年出现了几种这样的模型，但没有一种发布了英语之外的结果。我们描述了 Zuse，三种决策模型（4B、9B 和 27B），在冻结的开放权重基座上训练低秩适配器和指针头，针对 27 种欧洲语言，并用它们来研究这种设计在不同语言和任务中的表现。在排除在训练之外的 11 个来源的广泛欧洲套件上，涵盖 9 个任务组和 27 种语言（这也是一个指导模型选择的开发集），27B 模型达到了 87.5% 的准确率，池化预期校准误差为 0.016，按来源加权时为 0.035。对这些单种子结果的事后分析得出了三个发现。首先，校准错误是按任务而非语言构建的：在 26 种语言的并行阅读和主题项目上，置信度差距的变化大约与采样噪声一样大，而在不同来源之间，它跨越 -0.07 到 +0.09，知识任务在所有三种规模下都过度自信，而可接受性判断则自信不足，因此一个拟合的温度无法同时纠正两者。其次，在 5% 错误预算下可自动化的决策份额遵循经机遇校正的技能（在 33 个来源和模型对上 Spearman 0.97），比原始准确率（0.91）更密切。第三，超出训练语言的覆盖范围由基座模型设定：在 210 种语言中，改变训练运行在相同规模内最多移动约 2 分，而基座模型记录列表之外的语言在每个规模下都落后 23 到 28 分。在英语公开套件上，Zuse 落后于 Jev 和 Kev，包括相同基座上的 Kev 模型。我们还报告了构建多来源训练数据的两个陷阱：主题方案之间的标签词冲突，以及教授捷径的注入增强。Zuse 可在 https://bineric.com/zuse 试用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发并评估面向 27 种欧洲语言的多语言决策模型，研究其在不同语言和任务中的准确率、校准误差及跨语言泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Zuse 决策模型（4B/9B/27B），在 27 种欧洲语言的 11 个来源上达到 87.5% 准确率；发现模型校准错误主要由任务类型（而非语言）决定；揭示了模型跨语言泛化能力受限于基座模型的预训练语言覆盖范围。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Zuse 在多语言决策任务中取得了较高的准确率和良好的校准，并深入分析了校准错误的来源和跨语言泛化的瓶颈。局限性方面，摘要明确指出在英语公开套件上性能落后于 Jev 和 Kev 模型，且对于基座模型未记录的语言，性能显著下降（落后 23-28 分）；此外，摘要未提供模型在推理速度、内存占用等效率指标上的表现，也未详细说明多来源训练数据陷阱的具体解决策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 多语言模型与决策系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e222. Do Underwater Image Quality Metrics Agree with Human Perception? A Benchmark with Human Choices, Simple Edits and Generative Drift（水下图像质量指标与人类感知一致吗？包含人类选择、简单编辑和生成漂移的基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18429\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18429\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnderwater image enhancement is challenging to evaluate due to the lack of clean reference images, so researchers rely on no-reference image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learned underwater, vision-language and general-purpose metrics against human preferences on five references: four published opinion-score sets and a new paired-comparison study. For each metric, we measure how often it selects the same image as people when comparing versions of the same scene. We further test whether simple image edits and small adversarial perturbations raise metric scores above the enhancement people preferred, and whether scores decrease as repeated generative edits add noise. Our results show that no metric consistently matches human preferences. The best worst-case Cohen\u0026#x27;s kappa over the five references is only 0.23 (Q-Align), while two raters in our study agree with a median kappa of 0.41. The widely used UCIQE often favors edits that people reject. On a Nano Banana Pro replica chain that should leave the image unchanged, only 22 of 73 scores decrease at every checkpoint, while noise grows by 2.5 times. We also introduce TrustUIQA, a benchmark that combines the human references, our study choices, the edited, attacked and generated images, and the scores of every metric on every image. The code is available at https://github.com/TrustUIQA/TrustUIQA and TrustUIQA at https://huggingface.co/datasets/TrustUIQA/TrustUIQA.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e由于缺乏干净的参考图像，水下图像增强很难评估，因此研究人员依赖于无参考图像质量评估（NR-IQA）指标。然而，这些指标是否与人类判断一致仍不清楚。我们在五个参考集上评估了73种手工水下、学习水下、视觉语言和通用指标与人类偏好的对比：四个已发表的意见得分集和一个新的成对比较研究。对于每个指标，我们测量在比较同一场景的不同版本时，它选择与人类相同图像的频率。我们进一步测试了简单的图像编辑和小的对抗性扰动是否会将指标得分提高到人们偏好的增强之上，以及随着重复的生成编辑增加噪声，得分是否会下降。我们的结果表明，没有指标能一致地匹配人类偏好。在五个参考集上，最坏情况下的最佳Cohen\u0026#x27;s kappa仅为0.23（Q-Align），而我们研究中的两名评分者同意的中位kappa为0.41。广泛使用的UCIQE经常偏好人们拒绝的编辑。在应保持图像不变的Nano Banana Pro复制链上，73个得分中只有22个在每个检查点下降，而噪声增长了2.5倍。我们还引入了TrustUIQA，这是一个结合了人类参考、我们研究的选择、编辑、攻击和生成图像，以及每个指标在每个图像上得分的基准。代码可在 https://github.com/TrustUIQA/TrustUIQA 获取，TrustUIQA数据集可在 https://huggingface.co/datasets/TrustUIQA/TrustUIQA 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估现有水下无参考图像质量评估（NR-IQA）指标与人类感知的一致性，并构建一个综合基准测试（TrustUIQA）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在五个参考集上评估了73种不同的水下及通用图像质量指标与人类偏好的对齐程度。2. 发现没有任何指标能一致匹配人类偏好，最佳最坏情况Cohen\u0026#x27;s kappa仅为0.23。3. 揭示了现有指标（如UCIQE）的缺陷，例如偏好被人类拒绝的编辑，且在图像不变但噪声增加时得分未持续下降。4. 提出TrustUIQA基准，整合人类参考、编辑/攻击/生成图像及所有指标得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过大量实验证明了现有水下图像质量指标与人类感知的严重脱节，并提供了新的基准。局限性方面，摘要未提供TrustUIQA基准中人类评分者的具体数量及背景、73种指标的具体分类表现差异、以及该基准在指导新型指标设计方面的具体实验验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/图像质量评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e223. Alloy: A Multi-Material Physics Engine for Robot Learning（Alloy：用于机器人学习的多材料物理引擎）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16312\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16312\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobots handle much more than rigid objects: towels, cables, water, sand. The simulators used to train robots at scale are strongest on rigid bodies, and adding another material usually means a second engine and hand-written glue between the two. We present Alloy, an open-source physics engine for robot learning in which rigid robots, cloth, cables, liquids, granular material and soft bodies share one scene. Each object is described once; Alloy assigns it to a solver suited to its material, couples the solvers inside every control step, and runs the scene in many parallel worlds on one GPU, or on a CPU. Every world carries a health grade, to help tell a failure of the physics from a failure of the policy. Alloy is built on Newton, MuJoCo Warp and Warp, and it is written to be driven by coding agents: its documentation ships inside the package, every error names its fix, and the engine is exposed as tools over the Model Context Protocol. In a cold test, agents that had never seen Alloy installed a pre-release from the package index and trained policies for walking, cable handling and pouring on a single GPU. We also report how throughput grows with the number of worlds, depth-camera throughput, agreement with closed-form references, and a reliability test over a thousand worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人处理的不仅仅是刚性物体：毛巾、电缆、水、沙子。用于大规模训练机器人的模拟器在刚体方面最强，添加另一种材料通常意味着需要第二个引擎以及两者之间手写的粘合代码。我们提出了 Alloy，一个用于机器人学习的开源物理引擎，其中刚性机器人、布料、电缆、液体、颗粒材料和软体共享一个场景。每个对象只描述一次；Alloy 将其分配给适合其材料的求解器，在每个控制步骤内耦合这些求解器，并在一个 GPU 或 CPU 上的许多并行世界中运行场景。每个世界都带有一个健康等级，以帮助区分物理失败和策略失败。Alloy 构建于 Newton、MuJoCo Warp 和 Warp 之上，它被编写为由编码代理驱动：其文档随包一起发布，每个错误都指明其修复方法，并且引擎作为 Model Context Protocol 上的工具暴露。在冷启动测试中，从未见过 Alloy 的代理从包索引安装了预发布版本，并在单个 GPU 上训练了用于行走、电缆处理和倾倒的策略。我们还报告了吞吐量如何随世界数量的增长而增长、深度相机吞吐量、与封闭形式参考的一致性，以及超过一千个世界的可靠性测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个名为Alloy的开源多材料物理引擎，使刚性机器人、布料、电缆、液体、颗粒材料和软体能够在同一场景中共享，并支持由编码代理驱动，以解决现有模拟器在处理非刚性材料时需要多个引擎和手写粘合代码的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Alloy，支持刚性机器人、布料、电缆、液体、颗粒材料和软体在同一场景中共享，每个对象描述一次并自动分配给合适的求解器，在每个控制步骤内耦合。2. 支持在单个GPU或CPU上的多个并行世界中运行场景，并为每个世界提供健康等级以区分物理失败和策略失败。3. 专为编码代理驱动设计，文档内置，错误提示修复方法，并通过Model Context Protocol暴露为工具。4. 冷启动测试证明未见过的代理能自动安装并训练行走、电缆处理和倾倒策略。5. 报告了吞吐量随世界数量增长、深度相机吞吐量、与封闭形式参考的一致性以及千个世界的可靠性测试结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细介绍了Alloy引擎的多材料耦合能力、并行计算架构以及为编码代理优化的设计，并通过冷启动测试和多维度指标验证了其可用性。局限性方面，摘要未提供具体的吞吐量数值、深度相机吞吐量的具体帧率、与封闭形式参考一致性的具体误差数值，也未提及在极复杂多材料交互场景下的计算瓶颈或物理仿真的具体精度局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/物理仿真/多材料模拟\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n"</script>
