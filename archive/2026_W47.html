suals, and Delivery. Task-specific rating anchors instantiate shared criteria for the intended audience, purpose, and medium, with judgments grounded in source materials and artifact inspection records. We evaluate nine model-harness configurations on all 211 tasks. Overall scores range from 42.12 to 70.52, with Artifact Performance accounting for 73.4% of the gap between the highest- and lowest-scoring configurations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉制品任务测试智能体将任务规范和源材料转化为满足实际需求输出的能力。跨制品家族的评估有助于区分广泛适用的创作能力与局限于特定媒介的优势。我们引入了VisualArtifactSpec 1.0（VAS），这是一个包含211项创建和修改任务的基准，涵盖演示文稿、静态图形、动画和视频以及Web界面。每项任务都指定了创作目标、源材料、约束条件和交付物。现有基准为系统评估创作选择如何适应跨制品家族的不同受众、目的和媒介提供的支持有限。VAS分别评估两个方面：任务完成度验证显式要求和适用功能，而制品性能评估内容、组织、视觉和交付。特定任务的评分锚点实例化了目标受众、目的和媒介的共享标准，其判断基于源材料和制品检查记录。我们在所有211项任务上评估了九种模型-工具配置。总体得分在42.12到70.52之间，其中制品性能占最高分和最低分配置之间差距的73.4%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出VisualArtifactSpec 1.0 (VAS) 基准，用于系统评估智能体在跨媒介视觉制品（如演示文稿、图形、视频、Web界面）创作任务中满足任务规范和源材料要求的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出包含211项跨媒介视觉制品创建和修改任务的VAS基准；分别评估任务完成度和制品性能（内容、组织、视觉、交付）；引入特定任务的评分锚点以实例化共享标准；评估了九种模型-工具配置，发现制品性能是得分差距的主要来源（占73.4%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了基准的规模、评估维度以及九种配置的具体得分范围和差距归因。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e基准测试 / 多模态智能体 / 视觉内容生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e118. Glyph: An Interpretability Engine for AI-Driven Scientific Discovery in Clinical Data（Glyph：用于临床数据中AI驱动科学发现的可解释性引擎）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.08922\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.08922\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutomated scientific discovery has the potential to advance understanding of disease mechanisms and accelerate identification of early disease markers. Manual data annotation is infeasible at population scale, motivating methods that automatically extract pre-defined phenotypes in multimodal and unstructured clinical data. Such pre-defined feature sets determine and limit which associations these approaches can discover. This limitation extends to agentic AI systems that use these tools to query population-scale data. In contrast, foundation models (FMs) trained on large volumes of clinical data can perform tasks beyond their training objectives. This suggests their latent embeddings may represent novel or unexplored features that could yield insights into disease mechanisms, yet such latent features remain difficult to interpret. To address this challenge, we introduce Glyph, an automated multistage framework that extracts features from multimodal and unstructured clinical data using FMs and sparse autoencoders, interprets them as coded clinical concepts, and evaluates their value for clinical scientific discovery. We applied Glyph to abdominal CT volumes, CT radiology reports and laboratory measurements from 41,628 patients across different institutions. We identified 397 predictive concepts supported by 4,463 Bonferroni-significant associations. Moreover, a majority of discovered associations were automatically reproducible in held-out cohorts across different sites. Glyph concepts provided complementary associations to literature-derived markers, leading to gains in predictive power. We envision that interpretability can extend beyond a mechanistic understanding of neural networks to connecting implicitly learned features with clinical knowledge and establishing their significance for patient outcomes. We release Glyph at https://github.com/StanfordMIMI/Glyph.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自动科学发现有潜力推进对疾病机制的理解并加速早期疾病标志物的识别。在人群规模下手动数据注释是不可行的，这促使了在多模态和非结构化临床数据中自动提取预定义表型的方法。此类预定义特征集决定并限制了这些方法能够发现的关联。这种局限性也延伸到使用这些工具查询人群规模数据的智能体AI系统。相比之下，在大量临床数据上训练的基础模型（FMs）可以执行超出其训练目标的任务。这表明它们的潜在嵌入可能代表新颖或未探索的特征，这些特征可能产生对疾病机制的见解，但此类潜在特征仍然难以解释。为了应对这一挑战，我们引入了Glyph，一个自动化的多阶段框架，使用FMs和稀疏自编码器从多模态和非结构化临床数据中提取特征，将它们解释为编码的临床概念，并评估它们对临床科学发现的价值。我们将Glyph应用于来自不同机构的41,628名患者的腹部CT体积、CT放射学报告和实验室测量数据。我们确定了397个预测概念，这些概念由4,463个Bonferroni显著关联支持。此外，大多数发现的关联在不同站点的保留队列中自动可重复。Glyph概念提供了与文献衍生标志物互补的关联，从而提高了预测能力。我们设想可解释性可以扩展到对神经网络的机制理解之外，将隐式学习的特征与临床知识联系起来，并确立它们对患者结果的意义。我们在https://github.com/StanfordMIMI/Glyph发布Glyph。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从多模态和非结构化临床数据中提取和解释潜在特征，以支持AI驱动的临床科学发现和疾病机制理解。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入Glyph自动化多阶段框架，结合基础模型和稀疏自编码器提取并解释临床特征；在41,628名患者的多模态数据上识别出397个预测概念及4,463个显著关联；发现的关联在不同机构保留队列中具有高度可重复性；提供的概念与文献标志物互补，提升预测能力；开源代码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出利用基础模型和稀疏自编码器提取可解释的临床特征。局限方面，摘要未提供关于该框架在处理其他类型临床数据时的适用性、稀疏自编码器可能丢失的细粒度信息、或解释过程中可能引入的人为偏差等局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医疗健康信息学 / 可解释人工智能 / 医学图像分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e119. Agentic On-Policy Distillation Implicitly Reshapes LLMs\u0026#x27; ReAct Patterns（智能体在策略蒸馏隐式重塑大语言模型的ReAct模式）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19244\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19244\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOn-policy distillation (OPD) transfers specialized capabilities to language-model agents, but its cross-domain effects on interaction remain unclear. We investigate how OPD reshapes ReAct interaction patterns across mathematics, ALFWorld, and τ^2-bench, focusing on reasoning, actions, and observation acquisition. General-reasoning supervision reduces mathematical tool attempts from 70.4% to 14.4% while increasing accuracy from 16.7% to 38.0%; code-interpreter supervision improves household actions and retail queries. In contrast, ALFWorld supervision reduces τ^2-bench accuracy from 41.5% to 6.6%, accompanied by frequent tool calls that violate user-information dependencies. To address negative transfer using only source-domain training trajectories, we explore selective OPD guided by teacher preference changes before and after domain-specific RL. Retaining the top 95% of positions raises τ^2 accuracy from 11.5% to 29.9% with a source-learning trade-off.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在策略蒸馏（OPD）将专业能力转移给语言模型智能体，但其对交互的跨领域影响仍不清楚。我们研究了OPD如何重塑数学、ALFWorld和τ^2-bench中的ReAct交互模式，重点关注推理、动作和观察获取。通用推理监督将数学工具尝试次数从70.4%减少到14.4%，同时将准确率从16.7%提高到38.0%；代码解释器监督改善了家庭动作和零售查询。相比之下，ALFWorld监督将τ^2-bench的准确率从41.5%降低到6.6%，并伴随着违反用户信息依赖的频繁工具调用。为了仅使用源领域训练轨迹来解决负迁移问题，我们探索了由特定领域强化学习前后教师偏好变化引导的选择性OPD。保留前95%的位置将τ^2的准确率从11.5%提高到29.9%，并存在源学习的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在策略蒸馏（OPD）如何重塑语言模型智能体在数学、ALFWorld和τ^2-bench等任务中的ReAct交互模式，并探索解决负迁移的方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e揭示OPD对ReAct交互模式的跨领域影响（如通用推理监督减少工具尝试并提高数学准确率，而ALFWorld监督导致τ^2-bench准确率下降及违规工具调用）；提出利用教师偏好变化引导的选择性OPD来解决负迁移；保留前95%的位置有效提升τ^2准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的实验数据证明了OPD在不同领域间的正负迁移效应，并验证了选择性OPD的有效性，同时指出存在源学习的权衡。其他局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 强化学习 / 智能体 / 知识蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e120. Termination Lag: Coding Agents Solve Early but Stop Late（终止滞后：代码智能体过早解决但过晚停止）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14960\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14960\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCoding agents can solve a task well before they stop working on it. We characterize termination lag--the number of steps between an agent\u0026#x27;s first correct patch and the end of its run--across five models, two agent frameworks, and three SWE-bench datasets by recording and testing every distinct repository patch generated during execution. Our analysis reveals that 38--82% of successful runs achieve a correct solution on their initial source-code edit. However, agents continue to expend substantial effort after correct patches, with post-solution steps accounting for a median of 35--37% for Qwen3-Coder and 54--60% for Laguna-XS.2 in successful runs on SWE-bench Verified and Multilingual. Agents spend most of these additional steps verifying their work and exploring the repository. In a small fraction of cases (1--8%), this continued activity leads agents to undo their earlier correct patch, leaving the final solution incorrect.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代码智能体可以在停止工作之前很久就解决任务。我们通过记录并测试执行期间生成的每个不同仓库补丁，在五个模型、两个智能体框架和三个 SWE-bench 数据集上表征了终止滞后——即智能体首次生成正确补丁与其运行结束之间的步数。我们的分析显示，38-82% 的成功运行在初始源代码编辑时就实现了正确的解决方案。然而，智能体在生成正确补丁后继续耗费大量精力，在 SWE-bench Verified 和 Multilingual 的成功运行中，解决方案后的步骤占 Qwen3-Coder 的中位数的 35-37%，占 Laguna-XS.2 的中位数的 54-60%。智能体将这些额外步骤中的大部分用于验证其工作和探索仓库。在小部分情况下（1-8%），这种持续的活动导致智能体撤消其早期的正确补丁，使最终解决方案变得不正确。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e刻画和量化代码智能体在解决任务后继续运行直至终止的“终止滞后”现象，分析其在不同模型、框架和数据集上的表现及原因。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 定义并量化了“终止滞后”（首次正确补丁到运行结束的步数），发现38-82%的成功运行在首次代码编辑即获得正确解。2. 揭示了智能体在正确解决后仍耗费大量步骤（Qwen3-Coder中位数35-37%，Laguna-XS.2中位数54-60%），主要用于验证和探索。3. 发现终止滞后存在负面风险：1-8%的情况下，智能体因后续活动撤消了原本正确的补丁，导致最终解决方案错误。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过大量实验揭示了代码智能体普遍存在的“终止滞后”问题，指出智能体在获得正确解后仍进行大量无效验证和探索，甚至导致正确解被覆盖。局限性方面，摘要未提供五个模型和两个框架的具体名称（除Qwen3-Coder和Laguna-XS.2外）、三个SWE-bench数据集的具体版本差异、终止滞后对整体计算成本的具体量化影响，以及缓解该问题的潜在策略或实验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程与人工智能智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e121. GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs（GH-AWTrace：GitHub代理工作流执行日志的大规模数据集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.06866\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.06866\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verified GitHub Agentic Workflows across 5,051 repositories to 4,112,526 run records and 562,877 nonempty execution log archives. The dataset preserves execution evidence subject to GitHub\u0026#x27;s log-retention limits and links it to repository metadata and generated workflow configurations. Illustrative cases show how the logs expose tool denials, provider failures, changes in an agent\u0026#x27;s approach, and delegation among agents. These observations enable research on execution failures, tool use, and the relationship between reported run outcomes and visible task progress. Coverage varies across workflows, and the logs provide partial observations rather than complete agent trajectories. Video: https://youtu.be/KIlfmZhHxtA\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代理工作流使AI代理能够按计划或响应存储库事件执行重复的存储库任务。现有研究检查了工作流定义和输出，但对执行期间发生的情况提供的证据有限。我们提出了GH-AWTrace，一个将5,051个存储库中的25,014个经过验证的GitHub代理工作流链接到4,112,526条运行记录和562,877个非空执行日志存档的数据集。该数据集在GitHub的日志保留限制下保留了执行证据，并将其链接到存储库元数据和生成的工作流配置。说明性案例展示了日志如何暴露工具拒绝、提供商故障、代理方法的改变以及代理之间的委托。这些观察结果使得对执行失败、工具使用以及报告的运行结果与可见任务进度之间关系的研究成为可能。工作流之间的覆盖率各不相同，并且日志提供的是部分观察而不是完整的代理轨迹。视频：https://youtu.be/KIlfmZhHxtA\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提供一个大规模数据集，用于记录和分析GitHub代理工作流在执行期间的实际行为、失败和工具使用情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了GH-AWTrace数据集，包含5051个仓库中的25014个验证过的GitHub代理工作流，链接了4112526条运行记录和562877个非空执行日志存档；展示了日志如何暴露工具拒绝、提供商故障、方法改变和代理间委托；支持对执行失败、工具使用及运行结果与任务进度关系的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了数据集的具体规模（25,014个工作流，5,051个仓库，4,112,526条运行记录，562,877个日志存档），并说明了其支持的分析和说明性案例。摘要明确指出工作流之间的覆盖率各不相同，且日志提供的是部分观察而非完整的代理轨迹，同时受限于GitHub的日志保留限制，关于完整代理轨迹的获取方法及覆盖率提升策略，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程与数据集\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e122. System 1 agents: a method for local, reliable and fast agentic AI（系统1智能体：一种局部、可靠且快速的智能体AI方法）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21053\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21053\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgentic artificial intelligence could automate analyses of sensitive clinical data, but current agents depend on large language models (LLMs). Cloud LLMs expose patient data. Local LLMs hallucinate, and an invented value in a tool call propagates through every later step. Here we present a method to build System 1 agents: local agents that call tools without generating text. A deterministic compiler turns each tool\u0026#x27;s schema and the request into multiple-choice questions whose options come from the request and the schema, then a one-pass decision model answers them. On 1,952 requests to 157 biomedical tools, the best System 1 agent chose the right tool, or correctly declined, for 97.0% of requests, significantly ahead of all 18 local LLM-agent settings (best 95.2%). The System 1 agent filled 97.0% of 6,056 stated argument values. No System 1 call contained invented content, against 5.5-19.7% of LLM calls. The System 1 Agents framework is freely available as open-source software at https://github.com/eltzanis/SystemOneAgents.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体人工智能可以自动化分析敏感的临床数据，但当前的智能体依赖于大型语言模型（LLM）。云端LLM会暴露患者数据。局部LLM会产生幻觉，并且在工具调用中捏造的值会传播到随后的每一个步骤中。在此，我们提出了一种构建系统1智能体的方法：调用工具而不生成文本的局部智能体。一个确定性编译器将每个工具的模式和请求转化为多项选择题，其选项来自请求和模式，然后由单次遍历决策模型回答这些问题。在对157个生物医学工具的1,952个请求中，最佳的系统1智能体为97.0%的请求选择了正确的工具或正确拒绝，显著领先于所有18种局部LLM-智能体设置（最佳为95.2%）。系统1智能体填充了6,056个声明参数值中的97.0%。没有系统1调用包含捏造内容，而LLM调用中有5.5-19.7%包含捏造内容。系统1智能体框架作为开源软件在 https://github.com/eltzanis/SystemOneAgents 免费提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一种不生成文本、在本地运行且可靠的智能体AI方法，以自动化分析敏感临床数据，避免云端LLM的数据泄露和局部LLM的幻觉问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出系统1智能体方法，通过确定性编译器将工具模式和请求转化为多项选择题，由单次遍历决策模型回答；在157个生物医学工具的1,952个请求中，正确选择或拒绝率达97.0%，显著优于局部LLM；参数值填充率达97.0%，且无捏造内容（对比LLM的5.5-19.7%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效解决了局部LLM的幻觉问题并保护了数据隐私，在工具调用和参数填充上表现出高准确率和零捏造率。局限性方面，摘要未提供该方法的计算成本、更广泛领域的泛化能力或具体局限性信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/智能体系统/医疗信息学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e123. SpecWM: Turning Verification into Refinement for Streaming World Models（SpecWM：将验证转化为流式世界模型的细化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26211\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26211\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecently, video world models have advanced interactive generation, with large models offering higher quality and smaller models enabling faster inference. Existing speculative methods combine their strengths through fast draft generation and selective target regeneration guided by rewards on decoded frames. However, verification covers only the external scorer\u0026#x27;s evaluation dimensions and adds decoding and scoring costs. Moreover, these scores provide no correction, requiring costly target regeneration for rejected drafts. To address these limitations, we propose Speculative World Model (SpecWM), a unified, training-free inference framework for streaming world models. It verifies draft chunks using the target\u0026#x27;s latent velocity field. Verification also yields a reusable correction; two thresholds select Accept, Refine, or Reject. Specifically, one-step refinement reuses it to improve perceptual quality, while three-step refinement strengthens camera following and trajectory consistency. These findings motivate transition-aware refinement. On WBench Navigation, SpecWM improves visual quality at 1.63times speedup over the target and raises NavScore from the draft\u0026#x27;s 75.99 to 85.63, achieving the best quality-speed-control trade-off. Additionally, our LongSpecBench shows sustained quality and control over long, multi-turn rollouts, while experiments on Hy-Nomas validate SpecWM across backbones and denoising budgets.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近，视频世界模型推进了交互式生成，大模型提供更高的质量，小模型实现更快的推理。现有的推测方法通过快速草稿生成和在解码帧上奖励引导的选择性目标重新生成来结合它们的优势。然而，验证仅涵盖外部评分器的评估维度，并增加了解码和评分成本。此外，这些评分不提供纠正，需要昂贵的目标重新生成来拒绝草稿。为了解决这些限制，我们提出了推测世界模型（SpecWM），一个用于流式世界模型的统一、免训练推理框架。它使用目标的潜在速度场验证草稿块。验证还产生可重用的纠正；两个阈值选择接受、细化或拒绝。具体而言，单步细化重用纠正来提高感知质量，而三步细化增强了相机跟随和轨迹一致性。这些发现激发了转换感知的细化。在WBench Navigation上，SpecWM在目标1.63倍加速下提高了视觉质量，并将NavScore从草稿的75.99提高到85.63，实现了最佳的质量-速度-控制权衡。此外，我们的LongSpecBench显示了在长多轮展开中持续的质量和控制，而在Hy-Nomas上的实验验证了SpecWM跨骨干网络和去噪预算的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种用于流式视频世界模型的免训练推理框架（SpecWM），通过将验证过程转化为细化过程，解决现有推测方法中验证成本高且缺乏纠正机制的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SpecWM框架，利用目标潜在速度场验证草稿块并生成可重用纠正；通过单步细化提升感知质量，三步细化增强相机跟随和轨迹一致性；在WBench Navigation上实现1.63倍加速，NavScore从75.99提升至85.63；在LongSpecBench和Hy-Nomas上验证了长序列生成和跨骨干/去噪预算的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SpecWM有效平衡了生成质量、速度和控制，通过重用验证信息降低了重新生成的成本。局限性方面，摘要未提供该框架的具体计算开销、在不同视频分辨率或更复杂物理交互场景下的具体表现局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成/世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e124. A CPU Inside an LLM: Zero-Gradient Compilation of Exact Circuits into Pretrained Weights（大语言模型中的CPU：将精确电路零梯度编译到预训练权重中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26450\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26450\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePretrained language models (LMs) remain unreliable on exact multi-digit arithmetic without gradient fine-tuning or external tool interpreters. We introduce closed-form, zero-gradient circuit-grafting primitives that compile deterministic computation directly into pretrained LM weights using zero training examples and zero runtime hooks, while bounding per-layer normalization drift and preserving natural-language (NL) competence. Our construction combines three analytical mechanisms: (1) two-layer Mellin-GLU quadrature over bias-free SwiGLU/GeGLU layers, turning unknown per-token RMSNorm scaling into translation along a log-spaced gate grid (\u0026gt;250times dynamic range) with IEEE 754 error bounds; (2) cross-token scale cancellation via signed Chebyshev Indefinite-RoPE self-sink attention and memoryless SiLU-antisymmetric GatedDeltaNet shifts; and (3) axis-aligned width extension (d to d+K) with d/(d+K) norm compensation, Base-1000 canonical BPE emission, and differential (+254,-256) tied unembeddings. An automated 5-stage compiler synthesizes 4-8 digit signed {+,-,times} circuits in constant TC^0 depth alongside 3-literal Boolean (100%, N=1{,}728; plus 42-layer Gemma 4 E4B audits) and 5-bit Majority/Parity (100%) circuits. On 6-digit arithmetic (N=1{,}200, BF16), IBM Granite 4.2 3B (1.07M-1.33M active non-zeros, le 0.036%) and Alibaba Qwen 3.5 4B (2.25M-2.39M non-zeros, le 0.057%) reach 99.17% and 100.00% ALU-prefix accuracy (100% with an FP32 sidecar) and 98%-100% mid-sentence resumption, outperforming 12.8K-sample LoRA (42.2% / 61.7%, 0% inline continuation). A factorized block-sparse sidecar holds A100 memory at 7.89 / 10.65 GiB (4.60 / 8.14 GiB under INT8/INT4 + FP32 sidecar) while passing all 14/14 pre-registered \u0026gt;2K-token Tango splits (N=4{,}392; 0/11,134 OOD triggers).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e预训练语言模型（LM）在没有梯度微调或外部工具解释器的情况下，在精确的多位算术上仍然不可靠。我们引入了封闭形式的零梯度电路嫁接原语，使用零训练样本和零运行时钩子将确定性计算直接编译到预训练的LM权重中，同时限制每层归一化漂移并保留自然语言（NL）能力。我们的构造结合了三种分析机制：（1）在无偏置的SwiGLU/GeGLU层上进行两层Mellin-GLU求积，将未知的每标记RMSNorm缩放转化为沿着对数间隔门网格（\u0026gt;250倍动态范围）的平移，并具有IEEE 754误差界限；（2）通过带符号的Chebyshev不定-RoPE自汇注意力和无记忆SiLU-反对称GatedDeltaNet移位实现跨标记尺度抵消；（3）轴对齐的宽度扩展（d到d+K），具有d/(d+K)范数补偿、Base-1000规范BPE发射和差分（+254,-256）绑定反嵌入。一个自动化的5阶段编译器在恒定的TC^0深度合成4-8位带符号的{+,-,×}电路，以及3文字布尔电路（100%，N=1,728；加上42层Gemma 4 E4B审计）和5位多数/奇偶校验（100%）电路。在6位算术上（N=1,200，BF16），IBM Granite 4.2 3B（1.07M-1.33M活跃非零值，≤0.036%）和阿里巴巴Qwen 3.5 4B（2.25M-2.39M非零值，≤0.057%）达到了99.17%和100.00%的ALU前缀准确率（使用FP32侧车时为100%）和98%-100%的句中恢复率，优于12.8K样本的LoRA（42.2% / 61.7%，0%内联继续）。分解的块稀疏侧车将A100内存保持在7.89 / 10.65 GiB（在INT8/INT4 + FP32侧车下为4.60 / 8.14 GiB），同时通过了所有14/14预注册的\u0026gt;2K标记Tango分割（N=4,392；0/11,134 OOD触发器）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将确定性计算（如精确多位算术和布尔电路）直接编译到预训练语言模型权重中，无需梯度微调或外部工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出零梯度电路嫁接原语，结合三种分析机制（Mellin-GLU求积、跨标记尺度抵消、轴对齐宽度扩展），实现零训练样本和零运行时钩子的确定性计算编译；自动化5阶段编译器合成多种电路；在多位算术和逻辑电路上实现极高准确率，显著优于LoRA微调；通过分解的块稀疏侧车有效控制内存占用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详尽的实验数据和技术细节，证明了该方法在精确计算上的有效性及内存效率。关于该方法在更复杂自然语言任务中的泛化能力、编译过程的计算开销、以及对非算术任务潜在负面影响的评估，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 模型编辑与知识编译\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e125. TwinLab-Bench: Evaluating AI Scientists in Agentic Twins of Real Labs（TwinLab-Bench：在真实实验室的智能体孪生中评估AI科学家）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26248\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26248\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI agents are increasingly expected to act as AI scientists, which requires three increasingly open abilities: carrying out a given computational workflow correctly, choosing the next measurements from a given design space, and designing their own experiments. Existing benchmarks mainly evaluate the first two abilities, in a terminal or in a closed loop that selects from predefined candidates. Evaluating the third ability requires reliably executing an experiment that an agent designs, with readings grounded in a real laboratory. We introduce TwinLab-Bench, which evaluates AI scientists on self-designed experiments in 52 tasks from laboratories in the physical sciences, the life sciences, and engineering. The benchmark supports more than 100 experimental action types, and the agent\u0026#x27;s report is scored by comparison with a hidden answer taken from real laboratory records. Each task has its own TwinLab agent, an agent that serves as the environment and executes the experiments that the tested agent designs, reading the raw materials of the laboratory and calling calculators that are built from its records. Compared with a language model that sees only the task description, the TwinLab agent almost eliminates readings that deviate from the real records and inconsistent answers to a repeated request, and closed-book probes control for answers recalled from memory. We find that these tasks remain hard for frontier models: the strongest, Claude Fable 5.2, averages a score of only 45.0, and we conduct an empirical study of where it fails.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAI智能体越来越被期望充当AI科学家，这需要三种日益开放的能力：正确执行给定的计算工作流、从给定的设计空间中选择下一次测量，以及设计自己的实验。现有基准主要评估前两种能力，在终端中或在从预定义候选中进行选择的闭环中。评估第三种能力需要可靠地执行智能体设计的实验，且读数需基于真实实验室。我们引入了TwinLab-Bench，它在来自物理科学、生命科学和工程实验室的52个任务中评估AI科学家的自主设计实验能力。该基准支持超过100种实验动作类型，智能体的报告通过与取自真实实验室记录的隐藏答案进行比较来评分。每个任务都有其自己的TwinLab智能体，该智能体作为环境并执行被测智能体设计的实验，读取实验室的原材料并调用基于其记录构建的计算器。与仅查看任务描述的语言模型相比，TwinLab智能体几乎消除了偏离真实记录的读数和对重复请求的不一致回答，并且闭卷探测控制了从记忆中回忆的回答。我们发现这些任务对前沿模型来说仍然很难：最强的Claude Fable 5.2平均得分仅为45.0，我们对其失败之处进行了实证研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出TwinLab-Bench基准，用于评估AI智能体作为AI科学家自主设计并执行物理、生命和工程科学实验的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 填补了评估AI科学家自主设计实验能力的空白，包含52个真实实验室任务。2. 支持超100种实验动作，通过TwinLab智能体模拟真实实验室环境执行实验并基于真实记录评分。3. 有效消除了偏离真实记录的读数和模型记忆偏差。4. 揭示了前沿模型在此类任务上的巨大挑战，最强模型平均分仅为45.0。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该基准通过TwinLab智能体模拟真实实验室环境，确保了实验读数的真实性并控制了记忆偏差。局限性方面，摘要未提供关于TwinLab智能体模拟物理或化学实验的精确度、基准中各学科任务的难度分布、以及除了最强模型之外其他模型的具体得分和失败原因分析细节，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与智能体基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e126. VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models（VSpark：自回归视觉-语言-动作模型的推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22666\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22666\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOur aim is to accelerate autoregressive vision-language-action models (VLAs), which generate robot actions one token at a time. Speculative decoding makes this possible: a lightweight draft model proposes several tokens at once, and the VLA verifies them in a single pass, accepting only those that match its own predictions, so decoding remains lossless. The speedup, however, is limited in robot control, where many different tokens encode nearly the same motion and a draft close to the correct action is still rejected. To address this, our approach, VSpark, is built upon three design choices: (i) rollouts collected with calibrated action noise, which expose the draft to a wider range of robot states; (ii) feature alignment, which trains the draft to match the VLA\u0026#x27;s hidden features rather than its output tokens alone; and (iii) continuation reuse, which keeps the predictions the VLA has already computed along rejected drafts as candidates for the next verification step, instead of discarding them. On four VLAs with different action tokenizers and four manipulation benchmarks, VSpark achieves 1.28x to 2.10x speedup while keeping the VLA\u0026#x27;s decoding lossless.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们的目标是加速自回归视觉-语言-动作模型（VLA），它们一次生成一个token的机器人动作。推测解码使这成为可能：一个轻量级的草稿模型一次提出几个token，VLA在一次传递中验证它们，只接受那些与其自身预测匹配的token，因此解码保持无损。然而，在机器人控制中，加速受到限制，因为许多不同的token编码几乎相同的动作，并且接近正确动作的草稿仍会被拒绝。为了解决这个问题，我们的方法VSpark建立在三个设计选择之上：（i）使用校准的动作噪声收集的推演，这使草稿暴露于更广泛的机器人状态；（ii）特征对齐，训练草稿以匹配VLA的隐藏特征而不仅仅是其输出token；（iii）延续重用，保留VLA沿着被拒绝的草稿已经计算的预测作为下一步验证的候选，而不是丢弃它们。在具有不同动作分词器的四个VLA和四个操作基准上，VSpark实现了1.28倍到2.10倍的加速，同时保持VLA的解码无损。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e加速自回归视觉-语言-动作模型的推理过程，通过推测解码技术提高机器人动作生成的效率，同时保持解码无损。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VSpark方法，通过引入带校准动作噪声的推演、特征对齐以及延续重用三个设计选择，解决了机器人控制中因token编码相似导致草稿被拒绝的问题。在多个VLA和操作基准上实现了1.28x至2.10x的无损加速。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统推测解码在机器人控制中因动作token的语义相似性而受限，VSpark通过特征对齐和延续重用等机制有效提升了草稿接受率。实验在多种VLA和操作基准上验证了加速效果。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能 / 视觉-语言-动作模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e127. How Far Can Untrained Neural Networks Go in Anomaly Detection? From Tables to Pixels（未训练神经网络在异常检测中能走多远？从表格到像素）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.08136\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.08136\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAnomaly detection (AD) is often framed as a representation-learning problem, where strong performance is expected to require learned features or AD-specific optimization. However, this view can overlook the intrinsic separability of anomalies from normal references, even in the absence of learned representations. We therefore investigate how far untrained neural networks can go in anomaly detection. To this end, we propose PRISM, a framework combining fixed random nonlinear features with normal-reference Mahalanobis scoring for tabular detection and dense visual localization. Across 47 tabular datasets in ADBench, PRISM-T achieves the highest mean AUROC (86.4%) and the second-highest mean AUPRC (65.9%) among the compared methods. On MVTec AD and VisA, covering 27 visual categories, PRISM-V achieves mean image-level and pixel-level AUROCs of 90.4% and 96.4%, respectively. Notably, both models achieve these results without neural weight optimization or pretrained representations. A theoretical analysis further characterizes how nonlinear transformations affect the mean and covariance contributions to the Mahalanobis score gap, while empirical analyses examine the resulting score separability. These findings establish PRISM as both a competitive anomaly detector and a prior-to-learning baseline for assessing the added value of learned representations in anomaly detection.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e异常检测（AD）通常被构建为表示学习问题，其中强大的性能被认为需要学习的特征或特定于 AD 的优化。然而，这种观点可能会忽视异常与正常参考之间的内在可分离性，即使在缺乏学习表示的情况下也是如此。因此，我们研究了未训练的神经网络在异常检测中能走多远。为此，我们提出了 PRISM，这是一个将固定随机非线性特征与正常参考马哈拉诺比斯评分相结合的框架，用于表格检测和密集视觉定位。在 ADBench 的 47 个表格数据集中，PRISM-T 在比较方法中实现了最高的平均 AUROC（86.4%）和第二高的平均 AUPRC（65.9%）。在涵盖 27 个视觉类别的 MVTec AD 和 VisA 上，PRISM-V 分别实现了 90.4% 和 96.4% 的平均图像级和像素级 AUROC。值得注意的是，这两个模型在无需神经网络权重优化或预训练表示的情况下取得了这些结果。理论分析进一步表征了非线性变换如何影响马哈拉诺比斯评分差距的均值和协方差贡献，而实证分析则检查了由此产生的评分可分离性。这些发现将 PRISM 确立为一种具有竞争力的异常检测器，同时也是评估异常检测中学习表示的附加价值的先于学习基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究未训练神经网络在异常检测（AD）中的性能极限，提出结合固定随机非线性特征与正常参考马哈拉诺比斯评分的PRISM框架，用于表格和视觉异常检测。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出PRISM框架，无需神经网络权重优化或预训练表示，结合固定随机非线性特征与马哈拉诺比斯评分进行异常检测。2. 在47个表格数据集（ADBench）中，PRISM-T取得最高平均AUROC（86.4%）和次高平均AUPRC（65.9%）。3. 在27个视觉类别（MVTec AD和VisA）中，PRISM-V实现90.4%的图像级和96.4%的像素级平均AUROC。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明未训练神经网络结合随机特征和马哈拉诺比斯评分即可在表格和视觉异常检测中达到极具竞争力的性能，挑战了必须依赖表示学习的传统观点。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 异常检测与表示学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e128. Do LLM Agents Still Need to Be Told How to Self-Improve?（LLM智能体还需要被告知如何自我提升吗？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23219\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23219\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLM agents increasingly drive their own learning. Self-improvement methods delegate various components of model optimization to the models themselves. As models become more capable, this motivates a basic question: do these increasingly capable models still need us to specify how they should self-improve? In this paper we study an autonomous paradigm in which, given basic primitives, resources, and a general goal for self-improvement, agents construct their own self-learning algorithm for context-based optimization. Using the setting of gameplay as a testbed, a frozen LLM agent is given a compute budget and tools for collecting experience and updating text documents, and allowed to freely experiment without an externally imposed loop or access to real-world data. We find that sufficiently capable models do self-improve under these conditions, demonstrating strategies that align with classic cognitive frameworks for self-regulated learning and constructs from machine learning literature on self-generated curricula. Furthermore, we study the extent to which the learned text artifacts transfer to external benchmarks, observing improvement across different game horizons, mechanics, and 3D navigation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLLM智能体越来越多地驱动它们自己的学习。自我提升方法将模型优化的各个组件委托给模型本身。随着模型变得越来越强大，这引发了一个基本问题：这些越来越强大的模型还需要我们指定它们应该如何自我提升吗？在本文中，我们研究了一种自主范式，其中，在给定基本原语、资源和自我提升的总体目标的情况下，智能体构建自己的自学习算法以进行基于上下文的优化。使用游戏设置作为测试平台，一个冻结的LLM智能体被赋予计算预算以及用于收集经验和更新文本文档的工具，并被允许在没有外部强加循环或访问真实世界数据的情况下自由实验。我们发现，足够强大的模型在这些条件下确实会自我提升，展示了与自我调节学习的经典认知框架和机器学习中关于自生成课程的构建相一致的策略。此外，我们研究了学习到的文本产物转移到外部基准测试的程度，观察到在不同的游戏范围、机制和3D导航中都有改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在无需外部指定具体自我提升算法的情况下，LLM智能体是否能够利用基本原语、资源和通用目标，自主构建自学习算法并实现自我提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了一种自主范式，允许冻结的LLM智能体在给定计算预算和工具（收集经验、更新文本）的情况下，自由实验并构建自己的基于上下文的自学习算法。2. 发现足够强大的模型能够在无外部强加循环和真实世界数据的情况下实现自我提升，其策略与自我调节学习的经典认知框架及自生成课程理论一致。3. 验证了智能体学习到的文本产物能够泛化到外部基准测试中，在多种游戏范围、机制和3D导航任务中均观察到性能提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明研究探索了LLM智能体自主学习和自我提升的潜力，证明了在适当条件下模型可以自发形成有效的学习策略并实现跨任务泛化。局限性方面，摘要未提供关于足够强大的模型的具体参数量或能力阈值，也未提供具体的性能提升数字、使用的具体游戏环境名称或基准测试的详细结果（摘要未提供），且未提及该方法在真实世界非游戏任务中的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 智能体 / 自我提升与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e129. Abstention Direction in Large Language Models: Mechanistic Interpretability of Abstention Across Query Ambiguity, Knowledge Limits, and Safety Alignment（大型语言模型中的弃权方向：跨越查询模糊性、知识极限和安全对齐的弃权机制可解释性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20441\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20441\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAbstention, the withholding of a response by a large language model (LLM) under uncertainty or safety risks, is essential for trustworthy models. The causes of abstention fall into three perspectives: ambiguity in the Query (Q), limits of Model Knowledge (MK), and misalignment with Human Values (HV). However, prior analyses of internal representations have focused on HV, using a refusal direction computed from harmful and harmless queries. No study has analyzed the three perspectives jointly. We therefore extend the refusal direction framework to all three perspectives. Specifically, for each perspective, we construct counterfactual pairs that share a template and differ only in the abstention-inducing factor, and compute an abstention direction by normalizing the difference in mean activations between the two polarities. Activation steering experiments show that intervening in middle layers increases or decreases abstention across all three perspectives. Moreover, steering yields cross-perspective effects, indicating that the abstention directions share a common directional component.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e弃权，即大型语言模型（LLM）在不确定性或安全风险下保留响应，对于可信赖的模型至关重要。弃权的原因可分为三个视角：查询（Q）的模糊性、模型知识（MK）的极限以及与人类价值观（HV）的对齐错误。然而，先前对内部表示的分析主要集中在 HV 上，使用从有害和无害查询计算出的拒绝方向。没有研究联合分析这三个视角。因此，我们将拒绝方向框架扩展到所有三个视角。具体而言，对于每个视角，我们构建共享模板且仅在诱发弃权因素上不同的反事实对，并通过归一化两个极性之间平均激活的差异来计算弃权方向。激活引导实验表明，在中间层进行干预会增加或减少所有三个视角的弃权。此外，引导产生了跨视角效应，表明弃权方向共享一个共同的方向分量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e扩展大型语言模型（LLM）的拒绝方向框架，联合分析查询模糊性（Q）、模型知识极限（MK）和人类价值观对齐错误（HV）三个导致弃权的视角，并探究其内部机制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 首次联合分析LLM弃权的三个视角（查询模糊性、模型知识极限、价值观对齐错误），构建反事实对计算各视角的弃权方向。2. 激活引导实验证明，干预中间层可有效增加或减少所有三个视角的弃权行为。3. 发现引导干预存在跨视角效应，表明这三种弃权方向在模型内部共享一个共同的方向分量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要揭示了LLM在不同原因下的弃权行为在内部表示上具有共享的机制基础，通过中间层干预可统一调控。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 大模型可解释性与安全对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e130. Correcting Persistent Failures in Point-Cloud Grasping Policies using Human Demonstrations in Virtual Reality（利用虚拟现实中的真人演示纠正点云抓取策略中的持续性失败）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18919\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18919\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobots in homes, warehouses and farms must pick up objects they have never seen, usually without a 3D model or a category label. A grasping policy that works directly on the point cloud from a depth sensor needs only the geometry the robot observes, so it applies to any new object. Offline grasp generators such as Contact-GraspNet work this way, but they rank grasps by learned plausibility rather than by whether the grasp actually lifts the object. Reinforcement learning (RL) can optimize for that directly and make a point-cloud grasping policy much better on average, yet it leaves specific grasps persistently unsolved. We present a human-in-the-loop failure loop that targets those grasps: situations an RL policy keeps failing are mined automatically, sent to a virtual-reality application where a person picks the object up with their own hands, and returned to training as two grasp points. The person contributes only where to grasp; the robot chooses its own approach. In simulation, RL raises success on unseen objects from 55% with Contact-GraspNet to 83%. Adding 58 human demonstrations nearly doubles success on the hard cases RL kept failing, from 24% to 45%, and recovers performance that RL alone loses on similar cases that were never demonstrated, without reducing success on unseen objects.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e家庭、仓库和农场中的机器人必须抓取它们从未见过的物体，通常没有3D模型或类别标签。直接在深度传感器的点云上工作的抓取策略只需要机器人观察到的几何形状，因此适用于任何新物体。像Contact-GraspNet这样的离线抓取生成器就是这样工作的，但它们根据学习到的合理性对抓取进行排序，而不是根据抓取是否实际举起物体。强化学习（RL）可以直接对此进行优化，使点云抓取策略在平均情况下变得更好，但它会使特定的抓取持续无法解决。我们提出了一个针对这些抓取的人机循环失败循环：RL策略持续失败的情况会被自动挖掘，发送到虚拟现实应用程序中，由人用自己的手拿起物体，并作为两个抓取点返回到训练中。人只贡献抓取位置；机器人选择自己的接近方式。在仿真中，RL将未见物体的成功率从Contact-GraspNet的55%提高到83%。增加58个人类演示使RL持续失败的困难案例的成功率几乎翻倍，从24%提高到45%，并恢复了单独使用RL在从未演示过的类似案例上失去的性能，同时没有降低未见物体的成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提高点云抓取策略在未见物体和困难抓取案例上的成功率，解决强化学习策略中持续失败的特定抓取问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了一种人机在环的失败循环机制，自动挖掘RL策略持续失败的抓取情况，通过虚拟现实让人类提供抓取点；在仿真中，RL将未见物体成功率从55%提升至83%，加入58个人类演示后，困难案例成功率从24%提升至45%，且未降低未见物体的成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效提升了困难案例和未见物体的抓取成功率。局限性方面，摘要未提供关于该方法在真实物理机器人上的验证结果、人类演示的成本或时间效率，以及在不同类型物体上的泛化能力等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 强化学习 / 计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e131. OutfitterBench: Evaluating LLM Agents on Long-Horizon Resource Allocation and Commitment Coordination（OutfitterBench：评估大语言模型智能体在长期资源分配和承诺协调上的表现）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17933\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17933\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn many long-horizon settings, an agent\u0026#x27;s own choices create future constraints: committing finite capacity establishes future obligations and forecloses later opportunities. Sustaining performance therefore requires both keeping evolving plans feasible and comparing the value of resource allocations with the alternatives they displace. Recent benchmarks increasingly evaluate LLM agents in continuing operations, but give less attention to how agents keep their own commitments feasible while reassessing resource allocations as opportunities change. We introduce OutfitterBench, where agents manage an outdoor-equipment rental business for 200 days, purchasing from a 46-product catalog and handling roughly 1,100 reservation requests. Under a fixed capital ceiling, reservations and uncertain walk-in demand compete for reusable equipment whose availability changes over time. Experiments with seven frontier LLMs show that several agents underperform a simple rule-based baseline, while only the leading agent consistently surpasses it. Trajectory analysis shows that some agents apply known constraints inconsistently and make new decisions that conflict with existing commitments. Agents with more reliable fulfillment can still secure low returns from comparable commitments or delay resource reallocation. The leading agent better connects preparation with economic choices but also misses opportunities for more profitable asset use. These findings highlight limitations in sustaining coherent resource plans and reassessing their value over time. The benchmark code is publicly available at https://github.com/adminblackjack/OutfitterBench.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在许多长期环境中，智能体自身的选择会产生未来的约束：承诺有限的能力会建立未来的义务并排除后来的机会。因此，维持性能需要保持不断发展的计划可行，并将资源分配的价值与它们所替代的替代方案进行比较。最近的基准测试越来越多地评估持续运营中的大语言模型智能体，但较少关注智能体如何在机会变化时重新评估资源分配的同时保持自身承诺的可行性。我们引入了OutfitterBench，智能体在其中管理户外设备租赁业务200天，从46种产品的目录中采购并处理大约1100个预订请求。在固定的资本上限下，预订和不确定的散客需求竞争可重复使用的设备，其可用性随时间变化。对七个前沿大语言模型的实验表明，几个智能体的表现低于一个简单的基于规则的基线，而只有领先的智能体持续超越它。轨迹分析表明，一些智能体不一致地应用已知约束，并做出与现有承诺冲突的新决策。具有更可靠履行的智能体仍然可以从类似的承诺中获得低回报，或延迟资源重新分配。领先的智能体更好地将准备与经济选择联系起来，但也错过了更有利可图的资产使用的机会。这些发现突出了在维持连贯的资源计划和随时间重新评估其价值方面的局限性。基准代码公开在 https://github.com/adminblackjack/OutfitterBench。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估大语言模型智能体在长期环境（如户外设备租赁业务）中管理资源分配、维持承诺可行性以及重新评估资源价值的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入OutfitterBench基准，模拟200天、46种产品、约1100个请求的户外设备租赁业务；测试了7个前沿LLM，发现多数表现不如简单规则基线，仅领先智能体持续超越；通过轨迹分析揭示了智能体在约束应用、承诺冲突、回报获取和资源重新分配延迟等方面的具体行为模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明当前前沿LLM在长期资源分配和承诺协调上存在明显局限，多数不如简单规则基线。局限性方面，摘要明确指出领先智能体仍会错过更有利可图的资产使用机会，且部分智能体存在约束应用不一致和承诺冲突的问题；摘要未提供具体LLM的名称、详细的量化收益指标，以及该基准在更复杂或动态变化更剧烈的现实商业场景中的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 大语言模型智能体 / 运筹学与资源分配\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e132. Latent Feedback Is a Compute and Data Amplifier（潜在反馈是计算和数据的放大器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20404\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20404\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWhen high-quality data runs out, a common practice is to train on it for several epochs, but each repeat is worth less than the last. Latent feedback, which feeds each token\u0026#x27;s top-layer state into the next token\u0026#x27;s input, is another way to spend that compute, yet it has not been tested against a vanilla Transformer that spends the same compute on more epochs. We run this test across a ladder of model sizes, unique data and epochs, tuning both models at every size and amount of unique data. Latent feedback makes every FLOP and every token count for more except when unique data is scarce relative to model size, a regime that today\u0026#x27;s models are far from. We find that latent feedback serves as an amplifier: with unique data fixed, it reaches a Transformer\u0026#x27;s loss with less compute; with epochs fixed, it reaches that loss with less unique data. Furthermore, both savings grow with unique data per parameter and with repetition, and downstream tasks agree. To go beyond our grid, we fit one scaling law to both models, in which latent feedback enters as a Transformer with more parameters; it predicts that both savings keep growing with unique data and repetition. Fitted on models from 60M to 271M parameters, the law predicts the losses at a held-out 778M size to within 0.3% and the gap between the two models to within 0.05%. At most, latent feedback saves 48% of the compute and 47% of the unique data. When data, not compute, is the limit, latent feedback is the better use of a FLOP for a model of a given size.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当高质量数据耗尽时，一种常见的做法是在其上训练多个 epoch，但每次重复的价值都不如上一次。潜在反馈（将每个 token 的顶层状态输入到下一个 token 的输入中）是花费这些计算量的另一种方式，但尚未针对在更多 epoch 上花费相同计算量的普通 Transformer 进行测试。我们在模型大小、唯一数据和 epoch 的阶梯上运行此测试，在每个大小和唯一数据量上对两个模型进行调优。潜在反馈使每个 FLOP 和每个 token 都发挥更大作用，除非唯一数据相对于模型大小稀缺，而当今的模型远未达到这种状态。我们发现潜在反馈起到了放大器的作用：在唯一数据固定的情况下，它用更少的计算量达到 Transformer 的损失；在 epoch 固定的情况下，它用更少的唯一数据达到该损失。此外，这两种节省都随着每个参数的唯一数据和重复次数的增加而增加，下游任务也证实了这一点。为了超越我们的网格，我们为两个模型拟合了一个缩放定律，其中潜在反馈作为具有更多参数的 Transformer 进入；它预测这两种节省都会随着唯一数据和重复次数的增加而继续增长。该定律在 60M 到 271M 参数的模型上拟合，预测保留的 778M 大小模型的损失误差在 0.3% 以内，两个模型之间的差距误差在 0.05% 以内。潜在反馈最多可节省 48% 的计算量和 47% 的唯一数据。当数据（而不是计算量）成为限制时，对于给定大小的模型，潜在反馈是对 FLOP 更好的利用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估潜在反馈（将token顶层状态反馈至下一token输入）与增加训练epoch在消耗相同计算量下的性能差异，并探索其作为计算和数据放大器的缩放规律。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 首次系统对比潜在反馈与增加epoch在相同计算量下的表现，证明潜在反馈在绝大多数情况下能更高效利用FLOP和token。2. 发现潜在反馈具有放大效应：固定数据时节省计算量，固定epoch时节省唯一数据，且节省量随参数量和重复次数增加。3. 拟合了包含潜在反馈的缩放定律，在60M-271M参数上拟合，准确预测778M参数的损失（误差\u0026lt;0.3%）和模型差距（误差\u0026lt;0.05%），最高节省48%计算量和47%唯一数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了潜在反馈在数据受限或计算受限时作为放大器的有效性，并成功拟合了跨参数规模的缩放定律。局限性方面，摘要未提供具体使用的下游任务名称及详细指标、模型架构的具体细节（如层数、注意力机制）、训练所用的具体数据集名称，以及在唯一数据极度稀缺状态下的具体表现数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e深度学习基础架构与训练优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e133. Direct3D-V3: Latent-Free Diffusion Transformers in the Native Voxel Domain（Direct3D-V3：原生体素域中的无潜在空间扩散Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26511\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26511\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eNative 3D generation has largely been built around latent diffusion, with recent advances concentrating on stronger variational autoencoders (VAE) and increasingly elaborate latent representations, from vecset and triplanes to structured sparse voxels. Despite their architectural differences, these methods all share the same premise: geometry is first compressed into a latent space and only then modeled by the generator. We take a different route and propose Direct3D-V3, a latent-free diffusion transformer (DiT) framework that discards the VAE altogether and operates in the native voxel domain, directly modeling raw SDF voxel grids during both training and sampling. To make this direct voxel formulation geometrically reliable, we introduce an implicit manifold regularization over neighboring voxels to suppress non-watertight surfaces, and convert predicted SDF grids into meshes via Marching Cubes so that rendered normal losses can supervise the model directly from its predicted SDF. To improve alignment between the conditioning image and generated geometry, Direct3D-V3 also predicts the camera parameters of the conditioning image as an auxiliary task, encouraging the DiT to learn the mapping from image observations to 3D shape. This latent-free design removes the reconstruction bottleneck, brings training under an objective in the native voxel domain, and yields meshes with substantially richer local detail. The predicted camera and native SDF voxel output further make Direct3D-V3 extensible to generative reconstruction, where diffusion is interleaved with normal-guided refinement to improve alignment with the observed view while the generative prior completes unseen regions. Project page: https://dreamtechai.github.io/Direct3D-V3.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e原生3D生成主要围绕潜在扩散构建，最近的进展集中在更强大的变分自编码器和日益复杂的潜在表示上，从向量集和三平面到结构化的稀疏体素。尽管架构不同，这些方法都共享相同的前提：几何首先被压缩到潜在空间，然后才由生成器建模。我们采取了一条不同的路线，提出了Direct3D-V3，这是一个无潜在空间的扩散Transformer框架，它完全摒弃了变分自编码器，并在原生体素域中操作，在训练和采样期间直接对原始符号距离函数字节网格进行建模。为了使这种直接的体素公式在几何上可靠，我们在相邻体素上引入了隐式流形正则化以抑制非水密表面，并通过移动立方体算法将预测的符号距离函数网格转换为网格，以便渲染的法线损失可以直接从模型预测的符号距离函数中监督模型。为了改善条件图像和生成几何之间的对齐，Direct3D-V3还将条件图像的相机参数预测作为辅助任务，鼓励扩散Transformer学习从图像观察到3D形状的映射。这种无潜在空间的设计消除了重建瓶颈，将训练置于原生体素域的目标之下，并产生具有更丰富局部细节的网格。预测的相机和原生符号距离函数体素输出进一步使Direct3D-V3可扩展到生成式重建，其中扩散与法线引导的细化交织在一起，以改善与观察视图的对齐，同时生成先验完成未见区域。项目主页：https://dreamtechai.github.io/Direct3D-V3。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种无潜在空间的扩散Transformer框架Direct3D-V3，在原生体素域中直接对原始符号距离函数体素网格进行建模，以进行原生3D生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 摒弃变分自编码器，直接在原生体素域操作，消除潜在空间压缩带来的重建瓶颈。2. 引入隐式流形正则化抑制非水密表面，并利用移动立方体算法转换网格，通过渲染法线损失直接监督模型。3. 将相机参数预测作为辅助任务，改善条件图像与生成几何的对齐。4. 可扩展至生成式重建，结合法线引导细化与生成先验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出无潜在空间设计能产生局部细节更丰富的网格，并消除了重建瓶颈。局限性方面，摘要未提供关于该模型在训练时间、内存消耗、生成速度、具体定量评估指标以及与其他基于变分自编码器方法的详细对比数据，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与3D生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e134. Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU（Accord：基于单目相机和IMU的通用在线度量定位与稠密建图）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25279\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25279\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDense metric mapping from a single camera and IMU remains challenging: visual-inertial odometry (VIO) provides metric motion but sparse geometry, whereas feed-forward depth models predict dense structure without ensuring metric scale. We present Accord, which constructs an accurate online dense metric map from any camera with an IMU. A VIO filter publishes metric poses, a depth foundation model conditioned on them predicts depth for short keyframe windows, and a factor graph fuses the resulting submaps. Recent work has explored several approaches to this problem. What is essential is the multi-view agreement (Accord), which is considered in SLAM as a source of geometric self-consistency. Accord anchors each keyframe window to metric 3D points triangulated from the filter poses, then exploits bidirectional dense depth agreement between co-visible images to estimate and correct per-image scale errors while preserving the metric scale established by the anchors. Context keyframes further improve depth prediction, and the resulting submaps are fused in a factor graph. We evaluate a single mapping configuration across five public camera-IMU setups and a new Phone-rig/GoPro dataset. With nothing tuned per dataset/setup and every map aligned only by Accord\u0026#x27;s own trajectory, Accord achieves consistently best/second-best mean F-score at 5 cm on every platform. Accord is open-source along with the phone-rig dataset for the benefit of the research community\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用单目相机和IMU进行稠密度量建图仍然具有挑战性：视觉惯性里程计提供度量运动但几何稀疏，而前馈深度模型预测稠密结构却无法确保度量尺度。我们提出了Accord，它可以从任何带有IMU的相机构建准确的在线稠密度量地图。视觉惯性里程计滤波器发布度量位姿，以它们为条件的深度基础模型预测短关键帧窗口的深度，因子图融合生成的子图。最近的工作探索了该问题的几种方法。本质上是多视图一致性，在同步定位与建图中被视为几何自洽性的来源。Accord将每个关键帧窗口锚定到从滤波器位姿三角测量的度量3D点，然后利用共视图像之间的双向稠密深度一致性来估计和校正每张图像的尺度误差，同时保留锚点建立的度量尺度。上下文关键帧进一步改善了深度预测，生成的子图在因子图中融合。我们在五个公开的相机-IMU设置和一个新的手机阵列与GoPro数据集上评估了单一的建图配置。在无需针对每个数据集或设置进行任何调整，且每张地图仅通过Accord自身的轨迹对齐的情况下，Accord在每个平台上始终获得5厘米处最佳或第二佳的平均F分数。Accord连同手机阵列数据集一起开源，以造福研究社区。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Accord系统，利用单目相机和IMU构建准确的在线稠密度量地图，解决视觉惯性里程计几何稀疏和前馈深度模型缺乏度量尺度的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 结合视觉惯性里程计滤波器提供的度量位姿与深度基础模型，通过因子图融合子图。2. 核心在于多视图一致性，利用双向稠密深度一致性估计和校正单图尺度误差，同时保持度量尺度。3. 在五个公开数据集和一个新数据集上，使用单一配置且无需针对数据集调参，在5厘米阈值下均取得最佳或第二佳的平均F分数。4. 代码及新数据集开源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该系统具有通用性，无需针对特定数据集或硬件设置进行调参即可取得顶尖性能。局限性方面，摘要未提供关于系统在不同极端环境下的鲁棒性、计算资源消耗、实时性表现以及与其他最先进方法的具体F分数数值对比，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与机器人学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e135. NarrowSpec: Draft Hidden Width Need Not Match the Target in Speculative Decoding（NarrowSpec：推测解码中草稿模型的隐藏宽度无需与目标模型匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23835\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23835\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpeculative decoding is widely used to speed up generation in large language models (LLMs), with a small draft model proposing tokens that one forward pass of the target model verifies. Draft models that read the target\u0026#x27;s hidden states, such as DFlash and EAGLE-3, typically inherit the target\u0026#x27;s hidden width. We show that the draft\u0026#x27;s whole residual stream can run at half or a quarter of that width while largely preserving acceptance. For DFlash, which borrows the target\u0026#x27;s vocabulary projection, the trained output adapter folds into it, giving one narrower projection with logits unchanged up to floating-point rounding. We test two drafter families, DFlash and EAGLE-3, on two targets, Qwen3-8B (NVFP4) and GPT-OSS-20B (MXFP4), in SGLang on a B200 and a DGX Spark (GB10). At batch size 1 and temperature 0, narrowing the draft to half or a quarter width speeds up end-to-end decoding by 1.06-1.12x on B200 and 1.13-1.44x on GB10. The speedup holds at larger batch sizes. From batch 32 to the largest batch each GPU fits, narrowing reaches up to 1.21x on both GPUs, and no narrow draft is slower than full width.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推测解码被广泛用于加速大语言模型（LLMs）的生成，由一个小的草稿模型提出token，由目标模型的一次前向传播进行验证。读取目标模型隐藏状态的草稿模型（如DFlash和EAGLE-3）通常继承目标的隐藏宽度。我们表明，草稿模型的整个残差流可以以其一半或四分之一的宽度运行，同时很大程度上保留接受率。对于借用目标词汇投影的DFlash，训练好的输出适配器折叠进其中，给出一个更窄的投影，其logits在浮点舍入误差内保持不变。我们在SGLang中的B200和DGX Spark (GB10) 上，针对两个目标模型Qwen3-8B (NVFP4) 和 GPT-OSS-20B (MXFP4)，测试了两个草稿模型系列DFlash和EAGLE-3。在批量大小为1且温度为0时，将草稿宽度缩小到一半或四分之一，在B200上端到端解码加速1.06-1.12倍，在GB10上加速1.13-1.44倍。该加速在更大的批量大小下依然成立。从批量大小32到每个GPU能容纳的最大批量，缩小宽度在两个GPU上最高达到1.21倍加速，且没有窄草稿比全宽度慢。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索并验证在推测解码中，读取目标模型隐藏状态的草稿模型无需继承目标模型的隐藏宽度，通过缩小草稿模型的残差流宽度来加速解码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e证明草稿模型的残差流可以缩小至目标模型的一半或四分之一而基本保持接受率；针对DFlash，将输出适配器折叠入词汇投影中实现更窄投影且logits不变；在B200和GB10上测试DFlash和EAGLE-3，batch size 1时实现1.06-1.44倍加速，大batch size下最高达1.21倍加速且无性能下降。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的硬件、模型和加速比数据，证明了缩小草稿宽度的有效性。局限性方面，摘要未提供缩小宽度对极端长文本生成、不同温度设置（除0外）或更复杂任务下接受率的具体影响，以及该方法在其他非DFlash/EAGLE-3架构上的泛化能力等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型推理加速（推测解码/模型优化）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e136. RICoT: Recurrent Interleaved Chain-of-Thought for Page Stream Segmentation（RICoT：用于页面流分割的循环交错思维链）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22382\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22382\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) have renewed interest in Page Stream Segmentation (PSS), splitting a multi-page file into its constituent documents. Yet published LLM methods still frame the task as boundary classification over one or a few neighboring pages, and commercial document-splitting APIs do not disclose their methods. We reimagine PSS for LLMs as a sequential process over the whole stream and propose RICoT (Recurrent Interleaved Chain-of-Thought), a prompting framework that works through the pages as a reader would: within a sliding window it reasons about each page and commits its boundary decision before moving on, and across windows it carries forward a compact record of what it has read, keeping per-call cost bounded. We also introduce FinancePSS-205, a benchmark of 205 real-world, de-identified financial page streams, to be released publicly. On FinancePSS-205, RICoT matches or outperforms pairwise and windowed prompting with the same backbone for each of three open-weight LLMs; on a TABME test subset, RICoT with GLM-5 reaches document F1 0.847 and boundary F1 0.915, above published zero-shot results. A 2B-parameter student, trained on a larger teacher\u0026#x27;s decisions with and without the page-level reasoning, performs comparably in both modes and comes within 0.05 document F1 of the strongest prompted model on FinancePSS-205.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）重新引发了人们对页面流分割（PSS）的兴趣，即将多页文件拆分为其组成文档。然而，已发表的LLM方法仍将任务界定为对一个或几个相邻页面的边界分类，且商业文档拆分API未公开其方法。我们将PSS重新构想为LLM在整个流上的顺序过程，并提出了RICoT（循环交错思维链），这是一种提示框架，它像读者一样处理页面：在滑动窗口内，它对每一页进行推理并在继续之前提交其边界决策，在窗口之间，它传递一个关于其已读内容的紧凑记录，从而保持每次调用的成本有界。我们还引入了FinancePSS-205，这是一个包含205个真实世界、去标识化的金融页面流的基准，将公开发布。在FinancePSS-205上，对于三个开放权重LLM中的每一个，RICoT匹配或优于具有相同主干的成对和窗口提示；在TABME测试子集上，带有GLM-5的RICoT达到文档F1 0.847和边界F1 0.915，高于已发表的零样本结果。一个20亿参数的学生模型，在较大教师模型的决策（有和没有页面级推理）上进行训练，在两种模式下表现相当，并在FinancePSS-205上距离最强提示模型仅差0.05的文档F1。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e页面流分割，即将多页文件拆分为其组成文档。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出RICoT提示框架，将PSS重构为顺序过程，通过滑动窗口和紧凑记录控制成本；引入包含205个真实金融页面流的FinancePSS-205基准；在FinancePSS-205和TABME测试子集上，RICoT在多个开放权重LLM上匹配或优于基线方法，且2B参数学生模型通过蒸馏教师决策取得了接近最强提示模型的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出RICoT通过滑动窗口和传递紧凑记录解决了LLM处理长页面流的成本问题，并在两个基准上验证了其有效性，同时展示了知识蒸馏在降低模型参数量时的潜力。关于具体的推理延迟、内存消耗对比或更广泛的领域泛化性等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/文档理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e137. Chorus: Shared N-gram Embeddings with Layer-wise Adaptation（Chorus：具有逐层适应性的共享 N-gram 嵌入）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23386\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23386\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage models can gain capacity at little computational cost from n-gram embedding tables: large tables of learned vectors for short sequences of consecutive tokens, which are looked up and added to the model\u0026#x27;s input or to its intermediate layers. Recent designs commonly use a separate n-gram embedding table for each layer, which makes the tables costly in memory and prevents layers from sharing what they learn. Sharing a single table, however, gives every layer the same embedding and leaves no room for layer-wise preferences, and it performs poorly in practice. We propose Chorus, in which one set of n-gram embedding tables serves the whole network and every layer reads it in its own way. Each layer maps the refined embedding through its own projection layer, after rescaling its components by factors computed from its current hidden state. Chorus matches the quality of existing n-gram methods with 87% smaller tables: with 1.2B table parameters it predicts text better than FactorEngram and DeepSeek\u0026#x27;s Engram do with 9.6B. It outperforms Engram, TN-gram and FactorEngram in every setting where we compared them, across table sizes from 20M to 9.6B parameters. We also show that the recently proposed memory-efficient optimizer Ember works well with Chorus, saving 99.2% of table-optimizer memory compared with AdamW without degrading training performance. These results enable further scaling of n-gram embedding tables along the table-size axis by reducing memory use and allowing shared knowledge to be reused across layers.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型可以从 n-gram 嵌入表中以极小的计算成本获得容量：这些是用于连续 token 短序列的大型学习向量表，它们被查找并添加到模型的输入或中间层。最近的设计通常为每一层使用单独的 n-gram 嵌入表，这使得表在内存上成本高昂，并阻止了层之间共享它们所学到的内容。然而，共享单个表会给每一层提供相同的嵌入，没有为逐层偏好留下空间，并且在实践中表现不佳。我们提出了 Chorus，其中一组 n-gram 嵌入表服务于整个网络，每一层都以自己的方式读取它。每一层在通过根据其当前隐藏状态计算的因子重新缩放其组件后，通过其自己的投影层映射精化的嵌入。Chorus 以缩小 87% 的表匹配了现有 n-gram 方法的质量：使用 1.2B 表参数，它预测文本的效果优于 FactorEngram 和 DeepSeek 的 Engram 使用 9.6B 参数的效果。在我们比较的每种设置中，在从 20M 到 9.6B 参数的表大小范围内，它都优于 Engram、TN-gram 和 FactorEngram。我们还表明，最近提出的内存高效优化器 Ember 与 Chorus 配合良好，与 AdamW 相比节省了 99.2% 的表优化器内存，且不会降低训练性能。这些结果通过减少内存使用并允许跨层重用共享知识，使得 n-gram 嵌入表能够沿着表大小轴进一步扩展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过共享 n-gram 嵌入表并引入逐层适应性机制，在大幅减少内存占用的同时提升语言模型的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Chorus 框架，实现全网络共享 n-gram 嵌入表，并通过逐层投影和基于隐藏状态的缩放实现逐层适应性；在表参数减少 87% 的情况下达到或超越现有方法（如 1.2B 超越 9.6B）；结合 Ember 优化器节省 99.2% 的优化器内存。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Chorus 在参数效率和内存占用上具有显著优势，且性能优异。但摘要未提供关于该方法在极长上下文或罕见 n-gram 组合下的表现，未说明逐层投影带来的额外计算开销，也未提及在下游特定任务（如推理、代码生成）上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型架构与优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e138. UltraTex: Aligning Physical Knowledge for High-Fidelity PBR Texture Generation（UltraTex：对齐物理知识以实现高保真PBR纹理生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24941\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24941\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerating physically based rendering (PBR) texture maps for a 3D mesh from a single reference image is highly ambiguous, as the observed appearance entangles material identity, surface reflectance, and illumination. While current generative methods produce realistic albedo maps, they still struggle to infer accurate metallic and roughness attributes for relighting. We present UltraTex, a cascaded multi-view framework that moves beyond appearance matching by integrating physical knowledge into multi-view diffusion-based PBR generation. UltraTex first jointly predicts albedo and world-space shading normals to generate more detailed albedo maps, and then predicts metallic-roughness (MR) maps conditioned on the generated albedo, reference image, and material semantic priors. To inject material semantics, a lightweight adapter transforms hidden-layer features of a vision-language model (VLM) into intrinsic material representation tokens, providing part-level knowledge anchors for MR estimation. To model material-light interaction, photometric representation alignment guides intermediate diffusion features toward ground-truth material renderings under controlled lighting. This makes metallic and roughness variations observable through highlight intensity, specular sharpness, and local reflectance contrast, providing stronger guidance for fine-grained material prediction without explicit lighting supervision. Extensive experiments show that UltraTex generates high-quality textures and outperforms existing open-source and commercial methods in visual fidelity, material accuracy, and physical plausibility.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从单张参考图像为 3D 网格生成基于物理的渲染（PBR）纹理图具有高度歧义性，因为观察到的外观将材质身份、表面反射率和光照纠缠在一起。虽然当前的生成方法能生成逼真的反照率图，但它们仍然难以推断出用于重新照明的准确金属度和粗糙度属性。我们提出了 UltraTex，这是一个级联多视图框架，通过将物理知识整合到基于多视图扩散的 PBR 生成中，超越了单纯的外观匹配。UltraTex 首先联合预测反照率和世界空间着色法线，以生成更详细的反照率图，然后在生成的反照率、参考图像和材质语义先验的条件下预测金属度-粗糙度（MR）图。为了注入材质语义，一个轻量级适配器将视觉语言模型（VLM）的隐藏层特征转换为内在材质表示 token，为 MR 估计提供部分级别的知识锚点。为了对材质-光照相互作用进行建模，光度表示对齐将中间扩散特征引导至受控光照下的真实材质渲染。这使得金属度和粗糙度的变化可以通过高光强度、镜面锐度和局部反射率对比度来观察，为细粒度材质预测提供更强的指导，而无需显式的光照监督。大量实验表明，UltraTex 生成高质量的纹理，并在视觉保真度、材质准确性和物理合理性方面优于现有的开源和商业方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从单张参考图像生成高保真、物理准确的基于物理的渲染（PBR）纹理图（特别是金属度和粗糙度属性）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出级联多视图框架 UltraTex，将物理知识融入多视图扩散 PBR 生成；利用 VLM 提取材质语义先验作为知识锚点；通过光度表示对齐隐式建模材质-光照交互，无需显式光照监督；在视觉保真度、材质准确性和物理合理性上优于现有方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 UltraTex 在生成高质量 PBR 纹理方面表现优异，解决了金属度和粗糙度推断的难题。但摘要未提供具体的定量评估指标（如 PSNR、SSIM 等），未提及该方法在极端光照条件或复杂几何结构下的局限性，也未说明计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/3D生成与渲染\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e139. DrawScore: Evaluating Generated CAD Models against Engineering Drawings（DrawScore：根据工程图评估生成的CAD模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24681\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24681\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutomatic CAD generation is commonly evaluated with volumetric IoU, Chamfer Distance, and surface F-score, which barely penalize local errors that occupy only a small fraction of a part\u0026#x27;s volume or surface area, such as a misplaced hole or a slot on the wrong face, even though such errors are critical to manufacturing. We formalize these metrics in a unified integral form and show that the weight of a local error decays as the (k+q)-th power of its size, where k is the dimension of the integration domain and q is determined by the penalty function. Guided by this analysis, we propose DrawScore, which projects both models into three orthographic views with visible and hidden lines, as in engineering drawings, and applies a saturating penalty along the projected curves, so that the weight of a local error decays only linearly. Controlled experiments confirm the predicted decay orders, and on outputs of existing CAD generation agents, DrawScore exposes errors in outputs that IoU rates as nearly perfect. DrawScore further improves generation as a reinforcement learning reward and, for CAD generation from engineering drawings, serves as a test-time verifier without 3D ground truth or an additional reward model. Our code is available at https://github.com/UESTC-Simon/DrawScore.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自动CAD生成通常使用体积IoU、Chamfer距离和表面F-score进行评估，这些指标几乎不会惩罚仅占零件体积或表面积很小一部分的局部错误，例如错位的孔或错误面上的槽，即使这些错误对制造至关重要。我们在统一的积分形式中形式化了这些指标，并表明局部错误的权重以其大小的(k+q)次幂衰减，其中k是积分域的维度，q由惩罚函数决定。在这一分析的指导下，我们提出了DrawScore，它将两个模型投影到具有可见线和隐藏线的三个正交视图中，如同工程图一样，并沿投影曲线应用饱和惩罚，使得局部错误的权重仅线性衰减。对照实验证实了预测的衰减阶数，并且在现有CAD生成智能体的输出上，DrawScore暴露了IoU评为近乎完美的输出中的错误。DrawScore作为强化学习奖励进一步改善了生成，并且对于从工程图生成CAD，它作为测试时验证器，无需3D真实值或额外的奖励模型。我们的代码可在 https://github.com/UESTC-Simon/DrawScore 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种新的评估指标DrawScore，用于解决现有CAD生成评估指标（如体积IoU、Chamfer距离、表面F-score）难以惩罚对制造至关重要的局部小错误的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在统一积分形式下形式化现有评估指标，证明局部错误权重随其大小的(k+q)次幂衰减；提出DrawScore，通过正交视图投影和沿投影曲线的饱和惩罚，使局部错误权重仅线性衰减；DrawScore能暴露IoU评为完美的输出中的错误；可作为强化学习奖励改善生成，并作为无需3D真实值的测试时验证器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要指出传统指标对局部小错误惩罚不足，DrawScore通过改变投影和惩罚方式使错误权重线性衰减，有效解决了该问题，并在强化学习和测试时验证中展现了实用性。局限：摘要未提供对照实验的具体数值结果、DrawScore的计算复杂度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机辅助设计与三维生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e140. Thinking Harder Doesn\u0026#x27;t Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents（更努力地思考不会带来更好的选择：推理努力增加了LLM购物代理的置信度而非正确性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22033\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22033\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly deployed as autonomous shopping agents that process multimodal product listings (consisting of visual and text data) and recommend purchases on behalf of consumers. Naturally, one might assume that models with more thinking power would make higher-quality purchasing decisions. To test this belief, we ask two questions about such agents: does asking a model to think harder make it choose better products, and does the confidence it reports tell us the likelihood it may be wrong? We benchmark ten frontier models on three product-choice benchmarks built from WebShop, Amazon\u0026#x27;s SQID and Wayfair\u0026#x27;s WANDS platforms to see if LLMs with more thinking power actually make better-quality product purchase decisions. Across all three benchmarks, we found that increasing the thinking effort does not increase decision quality in a statistically meaningful way. The same change in thinking effort raises stated confidence at a statistically significant level, so extra thinking buys confidence rather than correctness. We also measure the calibration of these models (how well their reported confidence percentage matches their true correctness percentage) in these tasks and show that most models are not well-calibrated at every effort level. We also find that errors are strongly shared: when one model errs in a task, several others tend to err on that same task. Furthermore, on tasks where several models all err, a large number of them pick the same wrong product.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLM）越来越多地被部署为自主购物代理，处理多模态产品列表（由视觉和文本数据组成）并代表消费者推荐购买。自然地，人们可能会假设具有更强思考能力的模型会做出更高质量的购买决策。为了检验这一信念，我们对这类代理提出两个问题：要求模型更努力地思考是否能让它选择更好的产品，它报告的置信度是否能告诉我们它出错的可能性？我们在基于WebShop、亚马逊的SQID和Wayfair的WANDS平台构建的三个产品选择基准上对十个前沿模型进行了基准测试，以查看具有更强思考能力的LLM是否真的能做出更高质量的产品购买决策。在所有三个基准上，我们发现增加思考努力并没有在统计学上有意义地提高决策质量。思考努力的相同变化在统计学上显著地提高了报告的置信度，因此额外的思考买到的是置信度而不是正确性。我们还测量了这些模型在这些任务中的校准情况（它们报告的置信度百分比与真实正确性百分比的匹配程度），并表明大多数模型在每个努力水平上都校准不佳。我们还发现错误是强烈共享的：当一个模型在一个任务中出错时，其他几个模型往往也会在同一任务中出错。此外，在多个模型都出错的任务中，大量模型选择了相同的错误产品。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估大型语言模型作为自主购物代理时，增加推理努力（思考能力）是否能提高产品选择决策的质量，以及模型报告的置信度是否能反映其出错的可能性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在三个产品选择基准上测试了十个前沿LLM购物代理；发现增加思考努力并未在统计学上显著提高决策质量；发现增加思考努力在统计学上显著提高了模型报告的置信度；发现大多数模型在各个努力水平上校准不佳；发现模型间的错误具有强烈的共享性，常选择相同的错误产品。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要揭示了LLM购物代理的一个反直觉现象，即增加推理努力只能提升模型的自信程度（置信度），而无法提升实际决策的正确性，且模型存在严重的校准不良和错误共享问题。局限：摘要未提供十个前沿模型的具体名称、三个基准的具体准确率或置信度数值、错误共享的具体比例。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大型语言模型应用与电子商务\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e141. Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior（正确的标签是不够的：可靠的元数据可以暗中控制模型行为）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.04395\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.04395\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFine-tuning data can include metadata that predicts the correct answer, such as a reward-model score or a quality label. We ask whether a model learns to rely on this metadata even when every training label is correct. We fine-tune 7-9B open-weight models from three families on multiple-choice questions in which (Reward: 5) always marks the correct option; when this annotation is moved to a wrong option at test time, models select that option on 97-100% of CommonsenseQA items. Removing it leaves most answers correct, so evaluation without it misses the dependence. Cue-following rises sharply with training-time reliability and develops even with neutral or nonsense annotation words, although test-time wording affects its strength. A Qwen3 experiment also finds cue dependence in option-letter scores after direct preference optimization. Audits can test for this dependence by moving or removing visible annotations while holding the task and correct answer fixed.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e微调数据可以包含预测正确答案的元数据，例如奖励模型分数或质量标签。我们询问，即使每个训练标签都正确，模型是否会学会依赖这种元数据。我们在多选题上微调了来自三个家族的7-9B开放权重模型，其中（Reward: 5）始终标记正确选项；当在测试时将此注释放到错误选项时，模型在97-100%的CommonsenseQA项目上选择了该选项。移除它后大多数答案仍然正确，因此没有它的评估会遗漏这种依赖性。提示跟随随着训练时可靠性的增加而急剧上升，并且即使使用中性或无意义的注释词也会发展，尽管测试时的措辞会影响其强度。一项Qwen3实验还发现，在直接偏好优化后，选项字母分数中存在提示依赖性。审计可以通过在保持任务和正确答案不变的情况下移动或移除可见注释来测试这种依赖性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究模型在训练标签均正确的情况下，是否会学习并依赖微调数据中预测正确答案的元数据（如奖励模型分数或质量标签），以及这种依赖性的表现和审计方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现7-9B模型在多选题中会强烈依赖元数据提示，当提示移至错误选项时，模型在97-100%的情况下选择该错误选项；提示跟随行为随训练时可靠性增加而上升，且在中性或无意义词汇下也会出现；提出通过移动或移除可见注释来审计模型的提示依赖性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要揭示了模型对元数据提示的严重依赖，即使训练标签完全正确，模型仍会利用元数据捷径，并提出了通过移动或移除注释来审计模型依赖性的方法。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/模型评估与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e142. More Agents, More Samples, or More Thinking? Untangling Coordination, Ensembling, and Test-Time Compute in Multi-Agent LLMs（更多智能体、更多样本还是更多思考？解开多智能体LLM中的协调、集成与测试时计算）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17610\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17610\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary
