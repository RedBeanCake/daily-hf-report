无法衡量下游策略的效用。为了解决这个问题，我们引入了策略感知数据估值（PAD），这是一个为每个候选演示分配特定于目标驾驶策略的效用的框架。PAD将场景级校准反馈与投影策略梯度以及局部训练几何的正则化近似相结合，为该策略产生可扩展的基于影响力的值。受控的组移除研究确立了这些值的方向保真度，而跨规划器分析表明，相同的候选池在不同规划器家族中会引起显著不同的排名。在DiffusionDrive上，与仅使用真实数据训练相比，PAD在NavTest上将EPDMS提高了3.5分，在NavHard上提高了5.0分。特定于策略的数据整理在基于扩散、回归和流匹配的规划器中始终优于仅真实数据和全池训练，同时大幅减少了场景级的性能回退。这些结果确立了策略感知数据估值作为用针对性策略改进替代无差别数据积累的基础，从而实现自动驾驶系统更高效和可靠的扩展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e为端到端自动驾驶系统开发一种策略感知的数据估值框架，以评估候选训练演示对特定驾驶策略的效用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出PAD框架，结合场景级校准反馈、投影策略梯度和局部训练几何的正则化近似，计算特定于策略的影响力值。2. 跨规划器分析揭示了相同数据池在不同规划器家族中的效用差异。3. 在DiffusionDrive上，NavTest和NavHard的EPDMS分别提升3.5分和5.0分。4. 在多种规划器（扩散、回归、流匹配）上优于全量数据训练，并显著减少场景级回退。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种针对特定策略的数据估值方法，解决了传统数据整理方法无法衡量下游策略效用的问题，并通过实验证明了其在多种规划器上的有效性。局限性方面，摘要未提供PAD框架的计算复杂度分析、投影策略梯度和正则化近似的具体实现细节，以及在更广泛的自动驾驶数据集或不同传感器配置下的泛化能力评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自动驾驶与机器学习数据工程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e190. Squoosh Bench: Evaluating UX-1 on 318 Historical Website A/B Tests（Squoosh Bench：在318个历史网站A/B测试中评估UX-1）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25200\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25200\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eExperimentation teams must decide which proposed website changes to test with live traffic. We evaluated whether forecasts from simulated shoppers could inform that choice. We screened 412 historical website A/B tests and evaluated four systems on the 318 that ran longer than 21 days. Each system predicted an original win, a variant win, or an inconclusive result. Page roles were masked and recorded outcomes were withheld during inference. Squoosh UX-1, a model fine-tuned on human browsing data, simulated 1,000 shoppers per arm and correctly classified 267 of 318 outcomes (84.0%, 95% Wilson interval 79.5-87.6%, treating experiments as independent). Qwen3 Next 80B, the strongest general-purpose configuration on outcome accuracy, correctly classified 196 of 318 (61.6%). UX-1 favored the variant in 126 experiments. In the live tests, 118 of those variants won (93.7%), four lost, and four had inconclusive results. The remaining 192 experiments included 19 additional variant wins.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e实验团队必须决定将哪些提议的网站更改与实时流量进行测试。我们评估了来自模拟购物者的预测是否可以为该选择提供信息。我们筛选了412个历史网站A/B测试，并在运行时间超过21天的318个测试上评估了四个系统。每个系统预测原始版本获胜、变体获胜或结果不确定。页面角色在推理期间被掩码，记录的结果被隐藏。Squoosh UX-1是一个在人类浏览数据上微调的模型，每个分支模拟1,000名购物者，并正确分类了318个结果中的267个（84.0%，95% Wilson区间79.5-87.6%，将实验视为独立）。Qwen3 Next 80B是结果准确性上最强的通用配置，正确分类了318个中的196个（61.6%）。UX-1在126个实验中偏好变体。在实时测试中，这些变体中有118个获胜（93.7%），4个失败，4个结果不确定。其余192个实验包括19个额外的变体获胜。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估基于人类浏览数据微调的模拟购物者模型（Squoosh UX-1）在预测历史网站A/B测试结果（原始版本获胜、变体获胜或不确定）方面的有效性，以辅助实验团队决策。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在318个运行超21天的历史A/B测试上评估，UX-1每臂模拟1000名购物者，正确分类267个结果（准确率84.0%，95% Wilson区间79.5-87.6%），显著优于通用模型Qwen3 Next 80B（61.6%）；UX-1偏好的126个变体中，有118个在实时测试中实际获胜（93.7%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的评估数据集规模、准确率及置信区间数据，证明了UX-1在A/B测试预测中的高准确性和实用性。局限性方面，摘要未提供其余两个评估系统的具体名称、模拟购物者与真实用户在长期行为上的差异、以及该模型在不同类型网站或不同文化背景下的泛化能力等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与电子商务/推荐系统（A/B测试预测/用户行为模拟）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e191. In Situ Training of Optical Neural Networks by Coding Agents（编码智能体原位训练光学神经网络）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23875\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23875\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOptical neural networks promise fast, energy-efficient computing, but every device departs from its design and must be trained with the hardware. In situ training relies on an expert-built calibrated digital model of each device or on gradient-free trial and error. Coding agents, large language models that write and run programs, have shown an emergent ability to understand and edit the weights of digital neural networks. Here we introduce optics as code, a method in which a coding agent trains an optical neural network from measurements alone, through a harness that returns camera images of its probes and requires a hypothesis per request. We discovered that the agent forms a physical understanding of the optics and reparametrizes the network with interpretable optical elements tuned on the hardware. It outperforms gradient-free methods in classification and image encoding, approaching backpropagation through a calibrated model at a fraction of the cost. Needing neither per-device calibration nor gradients through the hardware, and improving with more capable models, optics as code offers a practical route to large, scalable optical neural networks and a general tool for calibrating and optimizing optical experiments.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e光学神经网络有望实现快速、节能的计算，但每个器件都偏离其设计，必须与硬件一起训练。原位训练依赖于专家构建的每个器件的校准数字模型或无梯度的试错法。编码智能体（编写和运行程序的大型语言模型）已展现出理解和编辑数字神经网络权重的涌现能力。在此，我们引入“光学即代码”，这是一种编码智能体仅通过测量训练光学神经网络的方法，通过一个返回其探针相机图像并要求每次请求提供一个假设的测试工具来实现。我们发现智能体形成了对光学的物理理解，并使用在硬件上调优的可解释光学元件对网络进行重新参数化。它在分类和图像编码方面优于无梯度方法，以极低的成本接近通过校准模型的反向传播。既不需要逐器件校准，也不需要穿过硬件的梯度，并随着更强大模型的出现而改进，“光学即代码”为大型、可扩展的光学神经网络提供了一条实用途径，并为校准和优化光学实验提供了一个通用工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用编码智能体仅通过硬件测量（无需预校准数字模型或硬件梯度）原位训练光学神经网络。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出“光学即代码”方法，编码智能体通过返回相机图像的测试工具仅凭测量训练光学神经网络；智能体展现出对光学的物理理解并使用可解释光学元件重新参数化网络；在分类和图像编码上优于无梯度方法，以极低成本接近校准模型的反向传播；无需逐器件校准和硬件梯度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效降低了光学神经网络训练的成本和校准需求，且智能体具备物理理解能力。局限性方面，摘要未提供该方法的具体训练时间、硬件平台细节、与反向传播方法的具体性能差距数字，以及在更复杂光学系统上的泛化局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e光学计算/人工智能/神经形态计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e192. AURA: AUdio-dRiven streaming Avatar（AURA：音频驱动的流式化身）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26540\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26540\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCurrent audio-driven video diffusion models can synthesize realistic talking-head videos but generally require dozens of diffusion denoising steps over multi-second video chunks, making them unsuitable for streaming applications such as voice assistants and virtual avatars, where low-latency and online causal generation are required properties. AURA generates video chunk by chunk with a rolling KV cache, requiring only the audio of the current chunk to start generating, rather than a multi-second audio look-ahead like bidirectional models. It comes in two sizes: AURA 1.3B streams 576p video in real time on a single GPU (20.7 fps for a 16 Hz playback rate), making it suited to interactive avatar applications, and AURA 5B streams 720p video at 9.7 fps. Our two-stage distillation pipeline first aligns the causal student with the teacher, by training it to match the teacher\u0026#x27;s trajectories with fewer diffusion steps and a chunk-wise sliding window causal attention mask, then applies Distribution Matching Distillation (DMD) with backward simulation to close the remaining quality gap. On standard talking-head benchmarks, AURA 1.3B runs 23x faster than its own bidirectional teacher and reaches a quality comparable to TalkVerse at a lower resolution, and AURA 5B matches its TalkVerse teacher at 720p while running 17x faster. To support reproducibility and further research on streaming avatar generation, we release the weights of both models along with a dataset of 30K synthetic videos and their precomputed teacher trajectories.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当前的音频驱动视频扩散模型可以合成逼真的说话头视频，但通常需要在多秒的视频块上进行数十次扩散去噪步骤，这使其不适用于语音助手和虚拟化身等流媒体应用，这些应用需要低延迟和在线因果生成等特性。AURA 使用滚动 KV 缓存逐块生成视频，仅需当前块的音频即可开始生成，而不是像双向模型那样需要多秒的音频前瞻。它有两种尺寸：AURA 1.3B 在单个 GPU 上实时流式传输 576p 视频（16 Hz 播放速率为 20.7 fps），使其适用于交互式化身应用，而 AURA 5B 以 9.7 fps 流式传输 720p 视频。我们的两阶段蒸馏管道首先通过将因果学生与教师对齐，训练它以更少的扩散步骤和逐块滑动窗口因果注意力掩码来匹配教师的轨迹，然后应用带有反向模拟的分布匹配蒸馏（DMD）来弥合剩余的质量差距。在标准的说话头基准测试中，AURA 1.3B 的运行速度比其自身的双向教师快 23 倍，并在较低分辨率下达到与 TalkVerse 相当的质量，而 AURA 5B 在 720p 分辨率下与其 TalkVerse 教师相匹配，同时运行速度提高了 17 倍。为了支持可重复性和对流式化身生成的进一步研究，我们发布了这两个模型的权重以及包含 3 万个合成视频及其预计算教师轨迹的数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种适用于流媒体应用（如语音助手和虚拟化身）的低延迟、在线因果生成的音频驱动视频扩散模型（AURA），以实现实时流式传输说话头视频。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 AURA 模型，使用滚动 KV 缓存逐块生成视频，仅需当前块音频，无需多秒音频前瞻。2. 提供两种尺寸：AURA 1.3B（单GPU实时流式传输576p，20.7 fps）和 AURA 5B（流式传输720p，9.7 fps）。3. 采用两阶段蒸馏管道：首先使用较少的扩散步骤和逐块滑动窗口因果注意力掩码对齐因果学生与教师，然后应用带反向模拟的分布匹配蒸馏（DMD）弥补质量差距。4. AURA 1.3B 比双向教师快 23 倍，AURA 5B 比教师快 17 倍，且质量相当。5. 开源了两个模型的权重以及包含 3 万个合成视频及其预计算教师轨迹的数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：AURA 通过逐块生成和两阶段蒸馏成功解决了音频驱动视频扩散模型在流媒体应用中延迟高、需要多秒音频前瞻的问题，实现了单GPU上的实时或接近实时的流式传输，并在速度和生成质量上取得了显著平衡。局限：摘要未提供关于模型在更高分辨率下的表现、复杂场景下的泛化能力以及长期流式传输中的累积误差评估等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e193. Choosing Quantized Code LLMs by File Size and Energy per Solved Task（根据文件大小和每解决任务能耗选择量化代码大语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17605\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17605\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA developer running a code assistant on a laptop downloads one model file, and local inference moves the energy of every request onto that machine. A common rule says a larger model at lower precision tends to beat a smaller one at higher precision. We ran 24 GGUF files of Qwen2.5-Coder at four sizes on a fanless MacBook Air M2 and priced each in energy per solved task on 542 EvalPlus tasks. The result is a selection guide indexed by Ollama\u0026#x27;s listed file size, with an evidence label on each pick. At 1 and 2 GB it picks the q4_K_M files of the 1.5B and 3B models, both on the correctness and energy frontier under every accounting. At 3 GB as listed, the larger-model rule picks 7B-q2_K, the only measured 7B file that fits, and there it does not pay. That file brings no significant gain in solves over the 2 GB pick, 3B-q4_K_M, and the 90% CI limits any 3B-q4_K_M deficit to 2.4 points. Yet 7B-q2_K needs 2.03 times the energy per solved task on CPU, GPU and memory rails, or 1.66 to 1.81 times on whole-system power. On HumanEval+, five alternating session pairs give a ratio of 1.925 against 1.956 in the main grid. At 8 GB, 7B-q6_K buys a significant gain over the 2 GB pick at a higher energy price. From 1.5B up, q4_K_M trails the highest precision measured at its size by less than 3 points (90% CI). We release per-task results, power logs and the analysis script.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在笔记本电脑上运行代码助手的开发者下载一个模型文件，本地推理将每个请求的能耗转移到该机器上。一个常见的规则是，较低精度的较大模型往往能击败较高精度的较小模型。我们在无风扇MacBook Air M2上运行了四种大小的24个Qwen2.5-Coder的GGUF文件，并根据542个EvalPlus任务中每个解决任务的能耗对它们进行定价。结果是一个由Ollama列出的文件大小索引的选择指南，每个选择都带有证据标签。在1和2 GB时，它选择了1.5B和3B模型的q4_K_M文件，在每种计算下均处于正确性和能耗前沿。在列出的3 GB时，较大模型规则选择了7B-q2_K，这是唯一符合的测量7B文件，但这并不划算。该文件在解决数量上相较于2 GB选择（3B-q4_K_M）没有显著增益，且90%置信区间将任何3B-q4_K_M的劣势限制在2.4分以内。然而，7B-q2_K在CPU、GPU和内存轨道上每解决任务需要2.03倍的能耗，或在整机功耗上需要1.66到1.81倍的能耗。在HumanEval+上，五个交替会话对在主流网格中给出1.925对1.956的比率。在8 GB时，7B-q6_K以更高的能耗代价获得了相较于2 GB选择的显著增益。从1.5B起，q4_K_M落后于其尺寸下测量的最高精度不到3分（90%置信区间）。我们发布了每任务结果、功耗日志和分析脚本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和选择量化代码大语言模型，以在本地推理中平衡模型文件大小、任务解决正确率与能耗。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在MacBook Air M2上评估了24个Qwen2.5-Coder GGUF文件在542个EvalPlus任务上的表现与能耗。2. 提供了基于Ollama文件大小的模型选择指南，挑战了“低精度大模型优于高精度小模型”的常见规则（如3GB下7B-q2_K能耗高但收益不显著）。3. 发现q4_K_M量化格式在正确性和能耗上表现优异，与同尺寸最高精度差距小于3分。4. 开源了每任务结果、功耗日志和分析脚本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的文件大小、能耗倍数（如2.03倍、1.66-1.81倍）和置信区间（90% CI限制在2.4分或3分以内）等具体数据，证明了其选择指南的可靠性。局限性方面，摘要未提供该指南在其他硬件平台（如非M2芯片或带风扇设备）上的适用性，未提及对更长上下文或更复杂代码生成任务的评估，也未说明“定价”的具体经济成本换算。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型评估与系统优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e194. Movie2Game-Bench: Holistic Evaluation of Film-to-Game Adaptation Beyond Playability（Movie2Game-Bench：超越可玩性的电影到游戏改编的全面评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24669\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24669\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAdapting a film into a game requires selecting source elements and translating them into player actions, rules, and feedback. We introduce Movie2Game-Bench (M2G-bench), a benchmark for evaluating film-to-game adaptation beyond playability. M2G-bench combines general evaluation, movie-specific evaluation, and playtesting by three GUI model players. The protocol connects source content to gameplay steps and implementation evidence, capturing both content preservation and interactive realization. The benchmark comprises 22 films and 658 source-specific reference items. Evaluating 14 models on the same films with their selected primary harnesses reveals complementary strengths in game quality, adaptation, and player experience. A shared weakness concerns playable sequences: this category has the lowest content-presence mean in all 14 models, averaging 37.9 out of 100 compared with 54.8 for iconic elements. Among judgments of retained emotionaldevelopment content, narrative choices account for 60.0% and scenario operation for 7.2%. These findings identify two linked priorities for film-to-game adaptation: preserving source situations that can support gameplay and connecting retained content to player actions and consequences.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将电影改编为游戏需要选择源元素并将其转化为玩家动作、规则和反馈。我们引入了Movie2Game-Bench（M2G-bench），这是一个用于评估超越可玩性的电影到游戏改编的基准。M2G-bench结合了通用评估、电影特定评估以及由三个GUI模型玩家进行的试玩。该协议将源内容连接到游戏步骤和实现证据，捕获内容保留和交互式实现。该基准包含22部电影和658个源特定参考项。在相同电影上使用其选择的主要工具评估14个模型，揭示了它们在游戏质量、改编和玩家体验方面的互补优势。一个共同的弱点涉及可玩序列：该类别在所有14个模型中具有最低的内容存在均值，平均为100分中的37.9分，而标志性元素为54.8分。在保留的情感发展内容的判断中，叙事选择占60.0%，场景操作占7.2%。这些发现确定了电影到游戏改编的两个关联优先事项：保留能够支持游戏的源情境，以及将保留的内容与玩家动作和后果联系起来。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估电影到游戏的改编质量，涵盖内容保留和交互式实现，超越单纯的可玩性评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出M2G-bench基准，包含22部电影和658个参考项，结合通用评估、电影特定评估和GUI模型玩家试玩；评估了14个模型，发现可玩序列内容保留得分最低，平均为37.9分；指出改编的两大优先事项：保留支持游戏的源情境，以及将内容与玩家动作和后果相连。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出M2G-bench提供了一个多维度的评估框架，并通过14个模型的评估揭示了当前模型在可玩序列内容保留上的显著短板。关于GUI模型玩家试玩的具体设置细节、不同模型在特定电影上的表现差异以及评估协议中主观指标的一致性验证等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/多模态生成与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e195. Let Samples Sing in Chorus: Mitigating Spurious Correlations via Cross-view Consensus（让样本齐唱：通过跨视图共识缓解虚假相关性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22668\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22668\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDeep models often rely on spurious correlations that fail on underrepresented groups. Existing methods either correct human-specified bias attributes or infer unknown biases from the learned representation space. However, annotated attributes may differ from the shortcuts actually used by a model, while a single representation provides incomplete and potentially noisy evidence. Our key insight is that a bias obscured in one feature space may be clearer in another. In this work, we propose CHORD (Cross-view Harmonic Outlier Reversal for Debiasing), a multi-view framework that allows samples to \u0026quot;sing in chorus\u0026quot; across diverse representation spaces to achieve robust cross-view consensus. CHORD aggregates aggregates within-class partitions in each view, which is a proxy for specifying candidate biases, to debias the target representation and classifier without bias supervision. Experiments on seven benchmarks across vision, language, speech, and medical imaging show consistent improvements in worst-group accuracy. Code and checkpoints are available at https://github.com/davelee-uestc/chord_debiasing_public .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e深度模型通常依赖于在代表性不足的群体上失败的虚假相关性。现有方法要么纠正人类指定的偏差属性，要么从学习到的表示空间推断未知偏差。然而，注释属性可能与模型实际使用的捷径不同，而单一表示提供不完整且可能嘈杂的证据。我们的关键见解是，在一个特征空间中模糊的偏差在另一个特征空间中可能更清晰。在这项工作中，我们提出了CHORD（用于去偏的跨视图谐波异常值反转），这是一个多视图框架，允许样本在不同的表示空间中“齐唱”以实现稳健的跨视图共识。CHORD聚合每个视图中的类内划分（这是指定候选偏差的代理），以在没有偏差监督的情况下去偏目标表示和分类器。在视觉、语言、语音和医学成像的七个基准上的实验表明，最差组准确率得到了一致的提高。代码和检查点可在 https://github.com/davelee-uestc/chord_debiasing_public 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e缓解深度模型中的虚假相关性，提高模型在代表性不足群体上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CHORD多视图框架，通过在不同表示空间中聚合类内划分来实现跨视图共识，无需偏差监督即可去偏目标表示和分类器；在视觉、语言、语音和医学成像等7个基准上，一致地提高了最差组准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出CHORD利用多视图特征空间中偏差清晰度的差异，通过无监督的跨视图共识有效缓解了虚假相关性问题，且跨模态泛化性强。关于计算开销分析、不同视图选择对性能的影响以及在极端长尾分布下的具体表现等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习/鲁棒性与公平性\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e196. Recurrent Domain Incremental Adaptation of Time-Series Foundation Models（时间序列基础模型的循环域增量适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24075\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24075\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePretrained Time-Series Foundation Models (TSFMs) provide strong representations for downstream classification tasks. Yet adapting a TSFM under changing operating conditions remains challenging. A model must improve on each newly observed condition without sacrificing conditions it has already learned, often from only a small labeled calibration set and without knowing the operating condition at inference time. We find that this difficulty has an important geometric structure. Under an operating-condition shift, the embedding space of a TSFM does not move uniformly: some local regions change substantially, while others remain nearly unchanged. Consequently, a global adaptation can unnecessarily move embeddings that were already correctly classified. To address this, we propose the novel PACT (Piecewise Adaptation via Chart Transport). PACT partitions the frozen source embedding space into local charts and learns lightweight residual transports for the regions affected by each new condition. An explicit identity path is always retained, and a learned gate softly selects among the identity and accumulated transports for each input. The pretrained TSFM encoder, classifier head, and previously learned transports remain fixed. With only 5% labeled calibration data per arriving condition and no condition identity at test time, PACT maintains an average macro-F1 above 0.95 across a four-condition bearing-fault stream. Under homogeneous tasks and label spaces, similar retention-adaptation behavior is observed across public benchmarks. Code is available at https://github.com/Sachithx/PACT.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e预训练的时间序列基础模型（TSFMs）为下游分类任务提供了强大的表示。然而，在不断变化的操作条件下适应TSFM仍然具有挑战性。模型必须在每个新观察到的条件下进行改进，而不牺牲它已经学到的条件，通常仅从一小部分带标签的校准集中进行，并且在推理时不知道操作条件。我们发现这种困难具有重要的几何结构。在操作条件偏移下，TSFM的嵌入空间不会均匀移动：一些局部区域发生实质性变化，而其他区域几乎保持不变。因此，全局适应可能会不必要地移动已经正确分类的嵌入。为了解决这个问题，我们提出了新颖的PACT（通过图表传输的分段适应）。PACT将冻结的源嵌入空间划分为局部图表，并为受每个新条件影响的区域学习轻量级残差传输。始终保留显式身份路径，并且学习的门在每个输入的身份和累积传输之间进行软选择。预训练的TSFM编码器、分类器头和先前学习的传输保持固定。在每个到达条件仅有5%带标签校准数据且在测试时没有条件身份的情况下，PACT在四条件轴承故障流中保持平均macro-F1高于0.95。在同质任务和标签空间下，在公开基准测试中观察到类似的保留-适应行为。代码可在 https://github.com/Sachithx/PACT 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在不断变化的操作条件下，利用少量带标签校准数据对时间序列基础模型进行循环域增量适应，同时保持对已学条件的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现TSFM嵌入空间在操作条件偏移下具有非均匀移动的几何结构；提出PACT方法，将嵌入空间划分为局部图表并学习轻量级残差传输；保留显式身份路径并通过门控机制软选择；在仅有5%校准数据且测试时未知条件身份的情况下，在四条件轴承故障流中保持平均macro-F1高于0.95。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出全局适应会不必要地移动已正确分类的嵌入，PACT通过分段适应解决了这一问题。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e时间序列分析 / 持续学习 / 领域适应\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e197. WeightBench: Evaluating Language Models as Weight-Space Programmers（WeightBench：评估作为权重空间程序员的大语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18553\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18553\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent work shows that large language models (LLMs) can operate directly on the parameters of other neural networks. They can read what a network was trained to do, fix a network that fails, and write working networks from scratch, all without gradient descent. This capability has been termed Weight-Space Programming (WSP). Exploring this new paradigm systematically requires a robust benchmark. We introduce WEIGHTBENCH, a benchmark that evaluates LLMs of increasing capability on 42 WSP tasks across five tracks: reading, fixing and writing weights, recognizing edits that are impossible, and data-free compression. The networks whose weights the LLMs read and edit range from 2K-parameter control policies to 7B-parameter language models. Experimental benchmark results show that frontier agents can already read small networks and write working control policies without ever running them, but cannot yet patch language models, compress them without data, or tell an impossible edit from a hard one. On all 42 tasks, Claude Opus 5.5 reaches a macro score of 0.535 (Sonnet 5.5 0.466, Haiku 5.5 0.402, DeepSeek v4-flash 0.215); on the 38 tasks it was run on, GPT-6.1-sol reaches 0.568 against Opus\u0026#x27;s 0.546. Code, the task registry, our OS-level sandbox harness, and the live leaderboard are publicly available at https://github.com/Aayush-Marasini/WeightBench.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的工作表明，大语言模型（LLM）可以直接在其他神经网络的参数上进行操作。它们可以读取网络的训练目标，修复失败的网络，并从头编写可运行的网络，所有这些都不需要梯度下降。这种能力被称为权重空间编程（WSP）。系统地探索这种新范式需要一个强大的基准。我们引入了WEIGHTBENCH，这是一个在五个轨道（读取、修复和编写权重、识别不可能的编辑以及无数据压缩）上的42个WSP任务中评估能力递增的LLM的基准。LLM读取和编辑权重的网络范围从2K参数的控制策略到7B参数的语言模型。实验基准结果表明，前沿智能体已经能够读取小型网络并在不运行它们的情况下编写可运行的控制策略，但尚不能修补语言模型、在无数据的情况下压缩它们，或区分不可能的编辑和困难的编辑。在所有42个任务上，Claude Opus 5.5达到了0.535的宏观分数（Sonnet 5.5为0.466，Haiku 5.5为0.402，DeepSeek v4-flash为0.215）；在它运行的38个任务上，GPT-6.1-sol达到了0.568，而Opus为0.546。代码、任务注册表、我们的操作系统级沙箱工具以及实时排行榜已在 https://github.com/Aayush-Marasini/WeightBench 公开。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建并应用一个名为WEIGHTBENCH的基准，以评估大语言模型在权重空间编程（WSP）任务（包括读取、修复、编写权重、识别不可能编辑和无数据压缩）上的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了WEIGHTBENCH基准，包含5个轨道的42个WSP任务，评估的网络规模从2K到7B参数；发现前沿LLM能读取小网络并编写控制策略，但无法修补语言模型、无数据压缩或区分不可能与困难的编辑；公布了具体的模型得分（如GPT-6.1-sol在38个任务上得0.568）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了WEIGHTBENCH基准的构建及其在评估LLM权重空间编程能力方面的初步结论，揭示了当前前沿模型在复杂WSP任务（如修补大模型、无数据压缩）上的局限性。局限性在于：摘要未提供关于任务具体设计细节、评估指标的详细说明，也未讨论模型在失败任务上的具体错误模式；此外，评估的网络规模上限为7B参数，对于更大规模网络的WSP能力摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 大语言模型 / 基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e198. Unreasonable Confidence from Simulator Misspecification: Directional Robustness on the SPEED+ Sim-to-Real Benchmark（模拟器错误设定导致的不合理置信度：SPEED+ 模拟到真实基准上的方向鲁棒性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20321\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20321\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-based navigation systems for orbit must be trained almost entirely on synthetic imagery, because real labelled images of a given spacecraft in flight rarely exist. Benchmarks like SPEED+ are built for that situation: the training set comes from a simulator, and the test sets are real images of a satellite mockup under two kinds of lighting. That simulator approximates how light reflects off mylar and aluminium, and like every scientific simulator it is misspecified. Its error is radiometric, since it misses the specular highlights, hard shadows and sensor saturation common in real images. We probe the resulting synthetic-to-real gap, the central risk for such systems, with a deliberately simple monocular pose estimator. In a 2x2 study of backbone adaptation and photometric augmentation, trained on synthetic images and tested on both real hardware-in-the-loop domains, we find three things. (1) The model does not know it is failing: regions conformally calibrated to 90% on synthetic data cover only 9-15% of rotation errors on sunlamp and 21-38% on lightbox, so a wrong pose carries the confidence of a correct one. (2) Transfer is asymmetric: scaling data and features improved synthetic rotation error from 1.65 to 1.03 rad but moved the harshly lit sunlamp domain by only 0.05 rad, under twice its seed s.d., whereas adapting the backbone\u0026#x27;s last stage carried 63-83% of its extra synthetic gain to both real domains. (3) Once the backbone adapts, augmentation helps only in the direction it models: our photometric stack improved the diffusely lit lightbox domain from 1.17 to 0.99 rad on every seed but moved sunlamp no more than seed-to-seed variation, while with the backbone frozen it helped sunlamp more. Every post-review experiment was pre-registered, and the code, per-image predictions and pre-registration record are at https://github.com/lokindoo/spacecraft-pose-estimation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e用于轨道的基于视觉的导航系统必须几乎完全在合成图像上进行训练，因为特定航天器在飞行中的真实标注图像很少存在。像SPEED+这样的基准就是为这种情况构建的：训练集来自模拟器，测试集是两种光照条件下卫星模型的真實图像。该模拟器近似了光线如何从聚酯薄膜和铝上反射，并且像每个科学模拟器一样，它是错误设定的。它的误差是辐射度的，因为它遗漏了真实图像中常见的镜面高光、硬阴影和传感器饱和。我们用故意简单的单目位姿估计器来探测由此产生的合成到真实的差距，这是此类系统的核心风险。在关于主干适应和光度增强的2x2研究中，在合成图像上训练并在两个真实的硬件在环领域上进行测试，我们发现了三件事。（1）模型不知道它正在失败：在合成数据上共形校准到90%的区域在太阳灯下仅覆盖9-15%的旋转误差，在灯箱下覆盖21-38%，因此错误的位姿带有正确位姿的置信度。（2）迁移是不对称的：缩放数据和特征将合成旋转误差从1.65改善到1.03弧度，但在光照强烈的太阳灯领域仅移动了0.05弧度，低于其种子标准差的两倍，而适应主干的最后阶段将其额外的合成收益的63-83%带到了两个真实领域。（3）一旦主干适应，增强仅在它建模的方向上有帮助：我们的光度堆栈在每个种子上将漫射光照的灯箱领域从1.17改善到0.99弧度，但在太阳灯上的移动不超过种子间的变化，而在主干冻结时它对太阳灯的帮助更大。所有审查后的实验都进行了预注册，代码、每张图像的预测和预注册记录位于 https://github.com/lokindoo/spacecraft-pose-estimation。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e使用单目位姿估计器探究由模拟器辐射度误差（错误设定）引起的合成到真实差距，评估主干适应和光度增强在SPEED+基准上的方向鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现模型在真实场景中失败时缺乏自我认知（合成数据校准90%置信度的区域在真实场景仅覆盖9-38%的误差）；揭示了迁移的不对称性（缩放数据/特征对强光照领域改善极小，而主干适应能转移63-83%的合成收益）；指出光度增强仅在模型建模的光照方向上有效。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要深入分析了模拟器错误设定对视觉导航系统位姿估计置信度和迁移能力的影响，揭示了模型在真实物理光照下盲目自信的问题以及不同适应策略的方向局限性。局限性在于：研究仅使用了故意简单的单目位姿估计器，摘要未提供该估计器的具体架构细节；实验仅在SPEED+基准的特定光照条件（太阳灯和灯箱）下进行，摘要未提供在其他光照或不同航天器模型上的泛化结果；未讨论计算成本或推理速度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 机器人学 / 模拟到真实迁移\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e199. M3OPD-Reasoner: An Open Recipe for Post-Training Multimodal Reasoning with Multi-Teacher On-Policy Distillation（M3OPD-Reasoner：使用多教师同策略蒸馏进行多模态推理后训练的开放方案）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23034\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23034\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMulti-Teacher On-Policy Distillation (MOPD) enables a single student to absorb the skills of several domain teachers by learning from its own generated responses. We present Multimodal Model Multi-Teacher On-Policy Distillation Reasoner (M3OPD-Reasoner), a fully open recipe for post-training vision-language models (VLMs) over three reasoning domains: image STEM, image perception, and video. We curate two datasets, M3OPD-SFT-1.35M for supervised fine-tuning (SFT) and M3OPD-RL-193K for reinforcement learning (RL) with verifiable rewards. On these data, we compare post-training recipes that start from Qwen3.5-9B: training one model on the mixed data of all domains (MixSFT and MixRL), and training one teacher per domain with Group Sequence Policy Optimization (GSPO), directly or after an SFT warm-up, and distilling the teachers into one student with MOPD. We evaluate on 21 image STEM, image perception, and video reasoning benchmarks after we decontaminate the training data against them. The comparison establishes MOPD of teachers trained with GSPO directly from Qwen3.5-9B as the best recipe: the student closely matches each teacher on its own domain and is on average above the mixed-training baselines on the same prompts. Since MOPD already merges the domain capabilities that MixRL would otherwise have to learn, its student is a stronger starting point for RL, and we ask whether the same data can carry the model further from there: we add MixRL on top of the MOPD student, on the same prompts and with the same settings, which, to our knowledge, no prior VLM recipe has studied. The same prompts still improve the MOPD student, with no collapse, and give our main model, M3OPD-Reasoner-9B. MOPD and MixRL can therefore work as consecutive stages that get more out of the same data. We release all data, the training code, and the checkpoints of every stage.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多教师同策略蒸馏（MOPD）使单个学生能够通过从自己生成的响应中学习来吸收多个领域教师的技能。我们提出了多模态模型多教师同策略蒸馏推理器（M3OPD-Reasoner），这是一个完全开放的后训练视觉语言模型（VLMs）方案，涵盖三个推理领域：图像STEM、图像感知和视频。我们整理了两个数据集，用于监督微调（SFT）的M3OPD-SFT-1.35M和用于具有可验证奖励的强化学习（RL）的M3OPD-RL-193K。在这些数据上，我们比较了从Qwen3.5-9B开始的后训练方案：在所有领域的混合数据上训练一个模型（MixSFT和MixRL），以及为每个领域训练一个教师，使用组序列策略优化（GSPO），直接训练或在SFT预热之后训练，并使用MOPD将教师蒸馏到一个学生中。在对训练数据进行去污染后，我们在21个图像STEM、图像感知和视频推理基准测试上进行了评估。比较确立了直接从Qwen3.5-9B使用GSPO训练的教师进行MOPD是最佳方案：学生在其自身领域紧密匹配每个教师，并且在相同提示上的平均表现高于混合训练基线。由于MOPD已经合并了MixRL否则必须学习的领域能力，其学生是RL的更强起点，我们询问相同的数据是否可以从那里进一步带动模型：我们在MOPD学生之上添加MixRL，使用相同的提示和相同的设置，据我们所知，以前的VLM方案都没有研究过这一点。相同的提示仍然改善了MOPD学生，且没有崩溃，并给出了我们的主模型M3OPD-Reasoner-9B。因此，MOPD和MixRL可以作为连续的阶段，从相同的数据中获取更多。我们发布所有数据、训练代码和每个阶段的检查点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e后训练视觉语言模型（VLMs）以提升在图像STEM、图像感知和视频三个领域的推理能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出M3OPD-Reasoner开放后训练方案；整理M3OPD-SFT-1.35M和M3OPD-RL-193K数据集；确立直接使用GSPO训练教师并进行MOPD为最佳方案；发现MOPD和MixRL可作为连续阶段，在相同数据上进一步提升模型性能且无崩溃；完全开源数据、代码和检查点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种结合MOPD和MixRL的连续后训练方案。局限方面，摘要未提供关于该方案在更多领域或更复杂多模态任务上的泛化能力、计算资源消耗、或MixRL阶段可能带来的潜在过拟合风险的讨论。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 自然语言处理 / 多模态学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e200. ViRA: Toward Ultra-High-Resolution Visual Agents via Cross-Input Relative Policy Optimization（ViRA：通过跨输入相对策略优化迈向超高分辨率视觉智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21605\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21605\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual agents answer questions about ultra-high-resolution photos by zooming into the relevant regions. However, existing agents often answer from common sense instead of reading the evidence. Reinforcement learning (RL) on the final answer cannot correct this, because a guess earns the same reward as reading. We propose Cross-Input Relative Policy Optimization (CrossRPO), which trains agents on contrast sets. A contrast set asks one question about several versions of an image that differ only in a small region with the evidence and have different answers, so only reading the evidence solves the whole set. CrossRPO rewards solving the whole set, and we prove that it does not reinforce a set answered from common sense. We build contrast sets for training (ViRA-Train) and evaluation (ViRA-Bench) by editing one small object in images of 21 to 120 megapixels, and we photograph further sets with real changes (ViRA-Bench-Real) to exclude editing traces. We train two Visual Reasoning Agents, ViRA-9B and ViRA-27B, with CrossRPO on only about 3,500 items of ViRA-Train each. CrossRPO achieves 63.3% set accuracy on ViRA-Bench at the maximum resolution, against 59.3% for GRPO. ViRA-9B is the most accurate open model of its size on all benchmarks, and ViRA-27B outperforms Claude Haiku 5.5 and GPT-6-Luna, both at their highest thinking level, on most benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉智能体通过放大相关区域来回答关于超高分辨率照片的问题。然而，现有智能体通常依靠常识而不是阅读证据来回答。对最终答案的强化学习（RL）无法纠正这一点，因为猜测与阅读能获得相同的奖励。我们提出了跨输入相对策略优化（CrossRPO），它在对比集上训练智能体。对比集对几个图像版本提出一个问题，这些版本仅在包含证据的小区域上有所不同且答案不同，因此只有阅读证据才能解决整个集合。CrossRPO奖励解决整个集合，我们证明它不会强化依靠常识回答的集合。我们通过编辑21到120兆像素图像中的一个小对象来构建用于训练（ViRA-Train）和评估（ViRA-Bench）的对比集，并拍摄具有真实变化的进一步集合（ViRA-Bench-Real）以排除编辑痕迹。我们使用CrossRPO在仅约3500个ViRA-Train项目上训练了两个视觉推理智能体ViRA-9B和ViRA-27B。CrossRPO在最大分辨率下在ViRA-Bench上实现了63.3%的集合准确率，而GRPO为59.3%。ViRA-9B是所有基准测试中同等规模最准确的开源模型，ViRA-27B在大多数基准测试上超越了处于最高思考级别的Claude Haiku 5.5和GPT-6-Luna。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决超高分辨率视觉智能体在回答问题时依赖常识而非阅读图像证据的问题，通过强化学习纠正这一行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出跨输入相对策略优化（CrossRPO），利用对比集训练智能体，确保只有阅读证据才能解决整个集合；构建ViRA-Train和ViRA-Bench（含真实拍摄集ViRA-Bench-Real）；ViRA-9B和ViRA-27B在仅约3500个训练项下，在ViRA-Bench上分别达到63.3%和超越GRPO的准确率；ViRA-27B在多数基准上超越Claude Haiku 5.5和GPT-6-Luna。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了CrossRPO在ViRA-Bench上的具体准确率（63.3%对比GRPO的59.3%），并证明了ViRA-9B和ViRA-27B在多个基准上的领先表现。局限性方面，摘要未提供模型在更广泛自然场景（非对比集）下的泛化能力、放大区域选择的准确性评估、以及CrossRPO训练所需的计算资源和时间成本等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视觉智能体与推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e201. Iris-Z: Scaling One Generative Model Past Specialist Geometry Models（Iris-Z：扩展单一生成模型超越专业几何模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16010\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16010\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage moved from many task-specific models to one unified model: a single generative model with a single generative training task that handles all of them within the same backbone, and keeps improving with data, parameters and compute. We believe the bitter lesson applies just as much to computer vision, 3D and spatial understanding, in the end to visual intelligence: the effort should go into general architectures that solve all these tasks in a unified way, and into scaling them, rather than into task-specific designs. We test this on monocular geometry, a task that has belonged to specialised architectures for years. Iris-Z is a general image generator that produces appearance and geometry together. A single backbone denoises, reasons about and understands the image and its depth at the same time, and one set of weights generates images with their depth, estimates depth from photographs and paints images onto a given depth. At enough scale it surpasses state-of-the-art specialists on established depth benchmarks while keeping the generative abilities of the backbone it started from without specialized layers. We release two models for the community.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言处理已从许多特定任务模型转向一个统一模型：一个具有单一生成训练任务的单一生成模型，在同一个主干网络中处理所有任务，并随着数据、参数和计算量的增加而不断改进。我们相信“苦涩的教训”同样适用于计算机视觉、3D和空间理解，最终适用于视觉智能：努力应投入到以统一方式解决所有这些任务的通用架构中，并对其进行扩展，而不是投入到特定任务的设计中。我们在单目几何（一项多年来一直属于专业架构的任务）上对此进行了测试。Iris-Z是一个通用图像生成器，可同时生成外观和几何结构。单一主干网络同时对图像及其深度进行去噪、推理和理解，并且一组权重可生成带有深度的图像、从照片中估计深度以及在给定深度上绘制图像。在足够的规模下，它在已建立的深度基准测试中超越了最先进的专业模型，同时保留了其起始主干网络的生成能力，且无需专门的层。我们向社区发布了两个模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e验证“苦涩的教训”在计算机视觉和3D空间理解中的适用性，通过扩展单一通用生成模型（Iris-Z）来超越单目几何等特定任务的专业模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Iris-Z，一个通用图像生成器，使用单一主干网络和一组权重同时处理图像生成、深度估计和深度条件图像绘制。2. 在足够的规模下，无需专门层即可在深度基准测试中超越最先进的专业模型。3. 保留了原始主干网络的生成能力，证明了统一架构在视觉智能中的潜力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要探讨了将大语言模型中“统一模型和扩展”的成功经验迁移到视觉和3D几何任务的可行性，证明了通用生成模型在单目几何任务上的潜力。局限性方面，摘要未提供具体的模型规模参数、训练计算成本、在深度基准测试上的具体定量提升数字，以及该模型在其他3D理解任务（如多视角几何、点云生成）上的表现评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与生成式模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e202. EvenVLM: A Text and Multimodal Dataset for the Even Language with Vision-Language Fine-Tuning（EvenVLM：用于Even语言并带有视觉语言微调的文本和多模态数据集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16500\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16500\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present EvenVLM, the first text and multimodal (VQA) dataset for Even (Lamut), an endangered Northern Tungusic language spoken by approximately 6,800 people in Siberia. Our dataset comprises 50,521 structured Even-Russian entries extracted from dictionary and phrasebook sources via GPT-4o Mini-based parsing, from which we synthetically generate 107,543 training examples spanning translation, grammar, reading comprehension, and semantic classification. To address tokenization inefficiency on Even\u0026#x27;s agglutinative morphology, we propose a three-step tokenizer expansion algorithm that adds Even-specific graphemes (eng, oe, o-umlaut), whitelisted vocabulary, and BPE merges, reducing average tokens per word by 27% (4.99 to 3.64). Using LoRA fine-tuning of Qwen3-VL-4B, we adapt the model for text tasks (0.53% trainable parameters, rank 32) and separately for visual question answering (rank 64, frozen vision encoder). Our best configuration achieves 11.4% exact match and a 13.6 weighted score on text benchmarks, 0.1283 chrF for sentence translation, and 65% accuracy on VQA (up from 0% for the base model and text-only fine-tuning). We release our datasets, evaluation benchmarks, and training pipeline to support further research on Even and other low-resource languages.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了EvenVLM，这是针对Even（Lamut）语的首个文本和多模态（VQA）数据集，Even语是一种在西伯利亚约6,800人使用的濒危北通古斯语。我们的数据集包含50,521个结构化的Even-俄语条目，这些条目通过基于GPT-4o Mini的解析从词典和短语手册来源提取，我们从中合成了107,543个训练样本，涵盖翻译、语法、阅读理解和语义分类。为了解决Even语黏着语形态导致的分词效率低下问题，我们提出了一种三步分词器扩展算法，添加了Even语特有的字素（eng, oe, o-umlaut）、白名单词汇和BPE合并，将每个词的平均token数减少了27%（从4.99降至3.64）。使用Qwen3-VL-4B的LoRA微调，我们使模型适应文本任务（0.53%可训练参数，秩32）并单独适应视觉问答（秩64，冻结视觉编码器）。我们的最佳配置在文本基准上实现了11.4%的精确匹配和13.6的加权分数，句子翻译的chrF为0.1283，VQA准确率为65%（基础模型和纯文本微调为0%）。我们发布数据集、评估基准和训练流程，以支持对Even语及其他低资源语言的进一步研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建首个针对濒危语言Even语的文本和多模态（VQA）数据集，并微调视觉语言模型以支持该语言的文本和视觉问答任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发布首个Even语文本和多模态数据集（包含50,521个词典条目和107,543个合成训练样本）。2. 提出三步分词器扩展算法，解决黏着语分词效率问题，平均token数减少27%。3. 使用LoRA微调Qwen3-VL-4B，在VQA任务上达到65%准确率（基础模型为0%），并在文本任务上取得一定性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了数据集的规模、构建方法（GPT-4o Mini提取与合成）以及分词器优化的具体效果。局限性方面，摘要未提供文本任务中各项子任务（如翻译、语法）的具体细分指标，未说明合成数据可能引入的噪声或幻觉问题，也未对比其他低资源语言模型或大模型在Even语上的基线表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与低资源语言\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e203. Continual-ARC: Measuring Skill Acquisition over a Working Lifetime（Continual-ARC：衡量工作生命周期中的技能获取）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14505\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14505\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgent harnesses have emerged as a promising mechanism for continual learning, alongside test-time parametric learning. However, the current benchmarks have several limitations: they generally focus on a single applied domain, serve each instance only once, and assume a single family of learner, so memory-based and weight-based systems are rarely compared on the same scale. We propose Continual-ARC, a lifelong stream built from the three ARC-AGI editions, whose tasks need no domain knowledge. The same tasks return after dormant gaps with fresh instances, while new tasks keep arriving. On each instance, the learner may pay for demonstrations, submit answers, or act inside the harness, with retries permitted on incorrect submissions, which are paid for. Each instance is scored based on the share of this feedback budget consumed. Since a learner may keep anything between instances, memory-based and weight-based systems are scored on the same scale. After the stream, the learner is frozen and tested on fresh instances of the tasks it met, which measures memorization, and on unseen tasks, which measures generalization. We run an agent harness with frozen weights, with and without persistence, on Qwen3.5-9B and GLM-5.3 Flash, comparing them with two prompting floors, a program-induction method and Qwen3.5-9B\u0026#x27;s weights trained to imitate GLM-5.3 Flash. Persistence in the harness generally does not improve memorization unless provided with explicit expert guidance. Most harness-based methods still learn less than a floor that simply caches each task\u0026#x27;s demonstrations, across all models we tested. No harness-based method gains on unseen tasks, whereas weight-based learning shows substantial gains. This opens the door to future weight-based continual learning that could teach models to drive harnesses in new domains.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体工具（Agent harnesses）已成为持续学习的一种有前途的机制，与测试时参数学习并列。然而，当前的基准测试有几个局限性：它们通常专注于单一应用领域，每个实例仅服务一次，并假设单一的学习者家族，因此基于记忆和基于权重的系统很少在同一尺度上进行比较。我们提出了Continual-ARC，一个由三个ARC-AGI版本构建的终身流，其任务不需要领域知识。相同的任务在休眠间隔后带着新实例返回，同时新任务不断到达。在每个实例上，学习者可以付费获取演示、提交答案或在工具内行动，允许对错误提交进行重试（需付费）。每个实例根据消耗的反馈预算份额进行评分。由于学习者在实例之间可以保留任何内容，基于记忆和基于权重的系统在同一尺度上进行评分。在流结束后，学习者被冻结并在其遇到的任务的新实例上进行测试（衡量记忆），以及在未见任务上进行测试（衡量泛化）。我们在Qwen3.5-9B和GLM-5.3 Flash上运行带有冻结权重的智能体工具（有和没有持久性），将它们与两个提示基线、一种程序归纳方法以及模仿GLM-5.3 Flash训练的Qwen3.5-9B权重进行比较。工具中的持久性通常不会改善记忆，除非提供明确的专家指导。在我们测试的所有模型中，大多数基于工具的方法学习的内容仍少于简单地缓存每个任务演示的基线。没有基于工具的方法在未见任务上取得收益，而基于权重的学习显示出实质性收益。这为未来基于权重的持续学习打开了大门，可以教模型在新领域中驱动工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Continual-ARC基准，用于衡量智能体在工作生命周期（终身流）中的技能获取，并在同一尺度上比较基于记忆和基于权重的持续学习系统。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建由三个ARC-AGI版本组成的终身任务流，任务无需领域知识，且包含休眠间隔和新任务。2. 引入基于反馈预算消耗的评分机制，允许在同一尺度上比较基于记忆和基于权重的系统。3. 评估了多种模型和方法（如Qwen3.5-9B, GLM-5.3 Flash等）在记忆和泛化任务上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明实验发现工具中的持久性通常不能改善记忆（除非有专家指导），且大多数基于工具的方法表现不如简单的演示缓存基线；基于工具的方法在未见任务上无收益，而基于权重的学习有实质性收益。局限性方面，摘要指出当前基准通常专注单一领域、单实例服务和单一学习者家族，Continual-ARC旨在解决这些问题，但摘要未提供Continual-ARC本身的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/持续学习/基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e204. JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams（JFinBench：来自最新认证考试的可定期刷新日本金融基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18130\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18130\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly applied to finance, creating a need for benchmarks that evaluate their capabilities across financial systems with different regulations and practices. However, existing financial benchmarks provide limited coverage of country-specific financial systems, and they are difficult to keep up to date as released questions leak into training data. We introduce JFinBench, a Japanese financial benchmark comprising 321 examples from the 2026 editions of six regularly administered certification exams covering accounting, tax, financial planning, and banking. To construct it, we develop a human-in-the-loop agentic pipeline in which a coding agent writes exam-specific conversion code and a review page, while a human verifies every example and feeds corrections back to the agent. This pipeline adapts to heterogeneous exam formats and reduces the effort of incorporating new exam editions, enabling periodic refreshes that mitigate data contamination. Evaluating 12 recent LLMs, we find that Claude Fable 5 and GPT-6 Astra exceed 93% overall, while even the best open-weight model, Kimi K3.1 Pro, trails Claude Fable 5 by 12 percentage points. When models can additionally use a terminal and web access, they retrieve the knowledge they lack and every model improves. The gap narrows but about 4 points remain, and the ranking of models stays largely the same, suggesting that knowledge held in the model itself remains valuable even with tools. We release the dataset, the evaluation code, and the construction pipeline.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）越来越多地应用于金融领域，这产生了评估它们在不同法规和实践的金融系统中能力的需求。然而，现有的金融基准对特定国家的金融系统覆盖有限，并且由于发布的问题会泄露到训练数据中，它们很难保持最新。我们引入了JFinBench，这是一个日本金融基准，包含来自2026年版六项定期管理的认证考试的321个示例，涵盖会计、税务、财务规划和银行业。为了构建它，我们开发了一个人在回路的智能体管道，其中编码智能体编写特定于考试的转换代码和审查页面，而人类验证每个示例并将纠正反馈给智能体。该管道适应异构的考试格式，并减少了纳入新考试版本的工作量，从而能够进行定期刷新以缓解数据污染。在评估了12个最新的大型语言模型后，我们发现Claude Fable 5和GPT-6 Astra的整体得分超过93%，而即使是最好的开源权重模型Kimi K3.1 Pro也比Claude Fable 5落后12个百分点。当模型可以额外使用终端和网络访问时，它们检索了所缺乏的知识，每个模型都有所提高。差距缩小了，但仍剩下大约4分，并且模型的排名基本保持不变，这表明即使有工具，模型本身掌握的知识仍然具有价值。我们发布了数据集、评估代码和构建管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个可定期刷新的日本金融基准（JFinBench），以评估大型语言模型在特定国家金融系统中的能力，并缓解数据污染问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出JFinBench，包含321个来自2026年六项日本金融认证考试的示例。2. 开发人在回路的智能体管道，自动转换考试格式并由人类验证，支持定期刷新以缓解数据污染。3. 评估12个LLM，发现闭源模型（如Claude Fable 5和GPT-6 Astra）得分超93%，最佳开源模型落后12个百分点。4. 引入工具（终端和网络）后所有模型得分提升，但排名基本不变，证明模型内部知识依然关键。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了JFinBench在评估特定领域和地区金融知识方面的有效性，以及人在回路管道在保持数据时效性上的优势。局限性方面，摘要未提供该基准在更广泛金融任务上的泛化能力、智能体管道在无人工干预时的具体错误率、以及工具使用场景下具体检索失败的原因。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/金融领域大模型评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e205. eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means（eDIAR：通过e-means实现无需训练的长会议和大型档案开放说话人流式说话人日志）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18529\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18529\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMeetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online, but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational corpora are prepared, and it reaches the clustering quality of Lloyd\u0026#x27;s k-means several times faster. The method needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e会议长达一小时，事先没有人知道会有多少人发言。具有固定数量输出槽的神经日志系统（如Streaming Sortformer和Nemotron-3）准确且在线运行，但它们命名的说话人数量不能超过其槽数。我们在不重新训练的情况下去除了这一限制。槽头继续决定谁在活跃以及语音何时重叠，并且仅在每个槽都被使用后，才在单个槽内使用官方e-means算法对说话人嵌入进行聚类。在流式系统中，重新聚类限制在有界窗口内，标签在几秒钟内被修订，身份锚定在头的槽上。所得系统对说话人数量没有限制，并且在说话人多于槽数时保持准确，而固定槽模型会崩溃。在长达一小时的会议中，它比累积错误的Streaming Sortformer准确得多，且其每次更新的成本不随会议增长。相同的配方将四槽Streaming Sortformer转变为开放说话人系统。跨录音，e-means使得逐帧链接大型档案的说话人变得负担得起，这是在准备对话语料库时出现的任务，并且它以比Lloyd的k-means快几倍的速度达到聚类质量。该方法几乎不需要调优，e-means使用其默认配方从几百个到超过一百万个嵌入运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出eDIAR系统，通过结合e-means算法，在不重新训练的情况下打破固定输出槽神经日志系统的说话人数量限制，实现长会议和大型档案的开放说话人流式日志。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 无需重新训练即可移除固定槽模型对说话人数量的限制。2. 在流式系统中，重新聚类限制在有界窗口内，身份锚定在槽上，更新成本不随会议长度增长。3. 在长达一小时的会议中，准确率远高于累积错误的Streaming Sortformer。4. e-means算法几乎无需调优，处理几百到上百万个嵌入的速度比Lloyd的k-means快数倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明eDIAR有效解决了固定槽模型在说话人数量超过槽数时崩溃的问题，且在长会议中保持高准确率和恒定的更新成本。局限性方面，摘要未提供关于该方法的局限性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/语音处理/说话人日志\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e206. Time Series Structure Learning with Local Causal Parent Discovery（基于局部因果父节点发现的时间序列结构学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26232\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26232\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLearning and inference on time series can pose significant statistical challenges, including autocorrelated observations, distribution shift over time, and the curse of dimensionality. These challenges complicate the practical application of causal discovery algorithms, which already suffer from high computational and sample complexity in the general case. To mitigate these issues, this work introduces Iterative Temporal Parent Discovery (ITPD): a sound and complete constraint-based procedure for causal structure learning on multivariate time series with causal nonstationarity. ITPD takes a local-to-global learning approach that discovers the global graph by sequentially discovering the parent set for each variable. ITPD exploits temporal structural priors, graph partitioning, and the local Markov condition to swap higher-order conditional independence tests for lower-order alternatives. With an exact oracle, ITPD performed the least number of tests and used the smallest average conditioning set sizes relative to baselines. In benchmarking simulations, ITPD sat on the Pareto frontier with respect to F1 and wall-clock time and was faster than baselines on large graphs (geq 1000 nodes). For graphs with 2000 nodes, ITPD ran 2.3times, 9.1times, and 40.9times faster than iterative IAMB, DF-PC, and PCMCI, respectively.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e时间序列的学习和推断可能带来重大的统计挑战，包括自相关观测、随时间分布偏移以及维度灾难。这些挑战使因果发现算法的实际应用变得复杂，而这些算法在一般情况下已经面临高计算和样本复杂度的问题。为了缓解这些问题，本工作引入了迭代时间父节点发现（ITPD）：一种在具有因果非平稳性的多变量时间序列上进行因果结构学习的可靠且完备的基于约束的过程。ITPD采用从局部到全局的学习方法，通过依次发现每个变量的父节点集来发现全局图。ITPD利用时间结构先验、图划分和局部马尔可夫条件，将高阶条件独立性测试替换为低阶替代方案。在精确预言机下，与基线相比，ITPD执行的测试次数最少，且使用的平均条件集规模最小。在基准测试模拟中，ITPD在F1和挂钟时间方面处于帕累托前沿，并且在大型图（大于等于1000个节点）上比基线更快。对于具有2000个节点的图，ITPD的运行速度分别比迭代IAMB、DF-PC和PCMCI快2.3倍、9.1倍和40.9倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种用于具有因果非平稳性的多变量时间序列的因果结构学习算法（ITPD），以解决时间序列数据中的统计挑战和高计算复杂度问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ITPD，一种可靠且完备的基于约束的局部到全局因果结构学习过程。2. 利用时间结构先验、图划分和局部马尔可夫条件，将高阶条件独立性测试替换为低阶测试。3. 在精确预言机下，测试次数和平均条件集规模最小。4. 在2000个节点的图上，速度比迭代IAMB、DF-PC和PCMCI分别快2.3倍、9.1倍和40.9倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种针对因果非平稳时间序列的因果发现算法ITPD，通过局部到全局的策略和低阶条件独立性测试替换，显著降低了计算复杂度并提高了大规模图上的运行速度。局限性方面，摘要未提供在真实世界时间序列数据集上的评估结果、对非平稳性假设的具体鲁棒性分析，以及在存在隐藏变量或测量误差情况下的性能表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e时间序列分析与因果推断\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e207. Lang-SVG: Hierarchical Image Vectorization with Language Priors（Lang-SVG：具有语言先验的层次化图像矢量化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15941\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15941\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eImage vectorization reconstructs raster images as compact scalable vector graph- ics (SVG), providing a structured and editable code representation of images. However, most existing vectorization methods optimize for pixel-level render- ing fidelity, often producing SVGs that lack alignment with human-perceived object-part hierarchies, making them difficult to manipulate. To address this, we propose Lang-SVG, which introduces an explicit tree structure to organize SVG primitives with semantic labels and parent-child relationships. Lang-SVG incorporates granularity-controllable and open-vocabulary segmentation priors to initialize object-part hierarchies and leverages multimodal large language models (MLLMs) with SVG tree context to assign semantic labels to unlabeled nodes. To reduce redundancy, we introduce depth-adaptive simplification to reduce shape complexity and Tree-Guided Pruning and Merging to eliminate redundant SVG nodes. L1-SAM-Prompting further recovers missing regions to improve recon- struction fidelity and structural completeness. Beyond reconstruction fidelity, we introduce a new evaluation protocol that measures structural quality and semantic part alignment. Experiments demonstrate that Lang-SVG achieves state-of-the-art performance in both rendering fidelity and structural quality. Project website: https://xiliu8006.github.io/Lang-SVG/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e图像矢量化将光栅图像重建为紧凑的可缩放矢量图形（SVG），提供图像的结构化且可编辑的代码表示。然而，大多数现有的矢量化方法优化像素级渲染保真度，通常生成的SVG缺乏与人类感知的对象-部分层次结构的对齐，使其难以操作。为了解决这个问题，我们提出了Lang-SVG，它引入了显式的树结构来组织带有语义标签和父子关系的SVG图元。Lang-SVG结合了粒度可控和开放词汇的分割先验来初始化对象-部分层次结构，并利用带有SVG树上下文的多模态大语言模型（MLLMs）为未标记的节点分配语义标签。为了减少冗余，我们引入了深度自适应简化来降低形状复杂性，并引入树引导的剪枝和合并来消除冗余的SVG节点。L1-SAM-Prompting进一步恢复缺失区域，以提高重建保真度和结构完整性。除了重建保真度，我们引入了一个新的评估协议，用于测量结构质量和语义部分对齐。实验表明，Lang-SVG在渲染保真度和结构质量方面均达到了最先进（state-of-the-art）的性能。项目网站：https://xiliu8006.github.io/Lang-SVG/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Lang-SVG方法，通过引入语言先验和显式树结构，解决现有图像矢量化方法生成的SVG缺乏人类感知的对象-部分层次结构对齐、难以操作的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入显式树结构组织SVG图元，结合粒度可控和开放词汇分割先验初始化层次结构，利用MLLMs分配语义标签；提出深度自适应简化、树引导剪枝与合并减少冗余，以及L1-SAM-Prompting恢复缺失区域；提出衡量结构质量和语义部分对齐的新评估协议，在渲染保真度和结构质量上达到SOTA。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出Lang-SVG通过多模态大模型和树结构提升了SVG的语义对齐和结构质量，并提出了新的评估协议。局限性方面，摘要未提供该方法在处理极高分辨率图像时的计算效率、MLLMs推理带来的额外时间开销、以及在不同复杂场景下的具体失败案例等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/图形学（图像矢量化/多模态大模型应用）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e208. Inhabitant: An Agent Framework for Long-Horizon Human-Scene Interaction with Spatial Control and Quantitative Feedback（Inhabitant：一个具有空间控制和定量反馈的长时程人-场景交互智能体框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25005\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25005\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent work on human-scene interaction (HSI) generation moves from single interactions to long-horizon interaction, where a language-model agent plans and executes a sequence of interactions in a 3D scene under one instruction. However, existing agents struggle in challenging everyday scenarios (e.g., picking up a toy and throwing it into a basket) because they lack spatial control over the motion and quantitative feedback on its execution, and they often fail to complete the interaction sequence. To address these gaps, we present Inhabitant, a training-free agent framework in which the agent specifies each motion through positions, paths and poses, measures how the executed interaction deviates from its intent, and revises the control specification accordingly. For an extensive evaluation in such scenarios, we build Inhabit, a benchmark of 75 household tasks in 31 furniture layouts of an apartment, in which every task chains one to three goals on movable objects and is carried out by the whole body, excluding fingers. On Inhabit, Inhabitant completes 98.7\\% of the tasks with Claude Opus 5.5, and 93.3\\% and 82.7\\% with Claude Sonnet 5.5 and Gemini 4 Argon, respectively. Ablations confirm that without spatial control the agent fails most tasks, and without quantitative feedback its motion becomes less precise. Code is available on the project page.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近关于人-场景交互（HSI）生成的工作从单一交互转向长时程交互，其中语言模型智能体在一个指令下在3D场景中规划并执行一系列交互。然而，现有智能体在具有挑战性的日常场景（例如，拿起玩具并扔进篮子里）中表现挣扎，因为它们缺乏对运动的空间控制和对其执行的定量反馈，并且经常无法完成交互序列。为了解决这些差距，我们提出了Inhabitant，一个免训练的智能体框架，其中智能体通过位置、路径和姿势指定每个运动，测量执行的交互如何偏离其意图，并相应地修改控制规范。为了在此类场景中进行广泛评估，我们构建了Inhabit，一个包含公寓31种家具布局中75项家务任务的基准，其中每项任务链接可移动对象上的一到三个目标，并由除手指外的整个身体执行。在Inhabit上，Inhabitant使用Claude Opus 5.5完成了98.7%的任务，使用Claude Sonnet 5.5和Gemini 4 Argon分别完成了93.3%和82.7%的任务。消融实验证实，如果没有空间控制，智能体会失败大多数任务；如果没有定量反馈，其运动变得不那么精确。代码可在项目页面上获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决长时程人-场景交互中智能体缺乏空间控制和定量反馈导致任务失败的问题，实现复杂日常场景下的多步交互规划与执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练智能体框架Inhabitant，通过位置、路径和姿势进行空间控制，并引入定量反馈机制测量并修正执行偏差；构建Inhabit基准，包含31种家具布局下的75项全身家务任务；在Inhabit基准上，结合不同大语言模型（如Claude Opus 5.5）实现极高的任务完成率（最高98.7%）；消融实验证实了空间控制和定量反馈的必要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的基准构建细节和不同模型下的高任务完成率数据，证明了框架的有效性。关于动作生成的物理合理性（如是否发生穿模）、计算延迟、以及在更复杂或动态环境中的泛化能力评估，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图形学 / 3D场景理解与智能体规划\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e209. Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning（抑制隐藏在视频大模型微调收益背后的捷径）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25776\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25776\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSupervised fine-tuning (SFT) is the stage in which Video Large Language Models (VideoLLMs) advance their capability to reason over video. However, the VideoLLM also learns to answer from textual regularities of its training data, a shortcut that bypasses the video. The regularities behind the shortcut are hard to define at the data level, and the shortcut forms regardless of training epoch, data size, or backbone. The shortcut is hidden behind a rise in accuracy within the training distribution, yet it is not required for the rise and even costs SFT the gain the video offers under distribution shift. We therefore propose Video-Evidence Training via Orthogonal projection (VETO), which intervenes on the fine-tuning update where the shortcut is written rather than on the data. VETO calibrates the subspace that the text alone occupies in the activations of the base model and projects the update onto its orthogonal complement. The VideoLLM is thus left to ground its answer in the full input, with the shortcut suppressed as it forms and never defined. Across seven VideoLLMs, VETO preserves the gain of SFT on the training distribution and suppresses the shortcut. On six benchmarks under shift it gains more than SFT and answers from the full input rather than the shortcut. Code is available at https://github.com/Youngwoo-git/VETO.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e监督微调（SFT）是视频大语言模型（VideoLLMs）提升视频推理能力的阶段。然而，VideoLLM也学会了根据其训练数据的文本规律来回答问题，这是一种绕过视频的捷径。捷径背后的规律在数据层面很难定义，并且无论训练轮数、数据规模或主干网络如何，该捷径都会形成。捷径隐藏在训练分布内准确率的提升背后，但它并非提升所必需，甚至在分布偏移下使SFT失去了视频所提供的收益。因此，我们提出了通过正交投影进行视频证据训练（VETO），它在捷径被写入的地方干预微调更新，而不是在数据层面进行干预。VETO校准了基模型激活中仅由文本占据的子空间，并将更新投影到其正交补集上。因此，VideoLLM被迫将其答案基于完整输入进行接地，捷径在形成时被抑制且从未被定义。在七个VideoLLMs上，VETO保留了SFT在训练分布上的收益并抑制了捷径。在分布偏移下的六个基准测试中，它的收益超过SFT，并且基于完整输入而非捷径进行回答。代码可在 https://github.com/Youngwoo-git/VETO 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视频大语言模型在监督微调过程中学习文本规律捷径而绕过视频推理的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VETO方法，通过在微调更新阶段进行正交投影干预，校准文本占据的子空间并投影到正交补集，从而在捷径形成时进行抑制；在7个VideoLLMs上保留训练分布收益，并在6个分布偏移基准上超越SFT。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出捷径在数据层面难以定义且不受训练轮数、数据规模或主干网络影响，VETO通过在更新阶段干预而非数据层面干预来解决问题。局限性方面，摘要未提供关于VETO计算开销、正交投影对模型其他能力的潜在负面影响以及在不同类型视频任务上的具体性能差异等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与自然语言处理交叉（视频大语言模型/多模态学习）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e210. GameRealm: Grounding Visual Learning in Interactive Games（GameRealm：在交互式游戏中奠定视觉学习的基础）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23140\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23140\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual foundation models are central to physical intelligence, yet their development remains constrained by fragmented training datasets, inconsistent annotation quality, and limited multimodal supervision. To address these challenges, we introduce GameRealm, a large-scale, richly annotated dataset that grounds visual observations in synchronized, game-native supervision. GameRealm encompasses over 120 million RGB frames and 1,000 hours of gameplay footage across all views. Beyond its unprecedented scale, GameRealm provides rich multimodal supervision, including metric depth, camera parameters, synchronized audio, control inputs, and 3D point trajectories. Its diversity further extends to flexible view configurations, spanning single-view, stereo, multi-view, and panoramic recordings. To enable scalable acquisition across diverse game environments, we develop a unified data collection pipeline that combines human-operated interaction with agentic exploration. Extensive experiments across diverse visual learning tasks demonstrate that GameRealm consistently strengthens visual foundation models in both visual generation and geometric learning. These results establish GameRealm as a versatile and valuable data resource, unlocking new opportunities for advancing visual intelligence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉基础模型是物理智能的核心，但其发展仍然受到碎片化训练数据集、不一致的标注质量以及有限的多模态监督的制约。为了应对这些挑战，我们引入了GameRealm，这是一个大规模、丰富标注的数据集，将视觉观察建立在同步的、游戏原生的监督之上。GameRealm包含超过1.2亿个RGB帧和1000小时跨所有视角的游戏画面。除了其空前的规模外，GameRealm还提供了丰富的多模态监督，包括度量深度、相机参数、同步音频、控制输入和3D点轨迹。其多样性进一步扩展到灵活的视角配置，涵盖单视角、立体、多视角和全景录制。为了实现跨不同游戏环境的可扩展采集，我们开发了一个统一的数据收集管道，结合了人类操作的交互与智能体探索。在多种视觉学习任务上的广泛实验表明，GameRealm在视觉生成和几何学习方面持续增强了视觉基础模型。这些结果确立了GameRealm作为一个多才多艺且宝贵的数据资源，为推进视觉智能解锁了新的机会。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个名为GameRealm的大规模、多模态、丰富标注的游戏数据集，以解决视觉基础模型训练中数据碎片化、标注不一致和多模态监督有限的问题，并评估其在视觉生成和几何学习任务上的效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了包含超1.2亿RGB帧和1000小时游戏画面的GameRealm数据集；提供了包括度量深度、相机参数、同步音频、控制输入和3D点轨迹在内的丰富多模态监督；支持单视角、立体、多视角和全景等灵活视角配置；开发了结合人类交互与智能体探索的统一数据收集管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要介绍了GameRealm数据集的构建及其在增强视觉基础模型方面的有效性，强调了其规模、多模态监督的丰富性以及视角的多样性。局限性在于：摘要未提供具体视觉生成和几何学习任务的性能提升数字或对比基线；未说明数据集涵盖的具体游戏环境类型或数量；未讨论数据收集过程中的成本、时间消耗或智能体探索的具体算法细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 数据集与基准 / 多模态学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e211. PanDWM: Panoramic 4D Driving World Models（PanDWM：全景4D驾驶世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19857\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19857\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDriving world models usually generate videos from six pinhole cameras with separate optical centres and small overlaps, and must learn to keep these views consistent. We present PanDWM, which stitches them into one 360^circ panoramic band. Camera boundaries then fall inside one image, so keeping the views consistent means keeping the image continuous, and each pixel still records its camera ray. Conditioned on layouts, a causal student generates the band window by window in four steps; it is distilled from a causal teacher and trained on its own rollouts. A feed-forward decoder lifts each frame along these rays into 3D Gaussians, and static Gaussians from neighbouring frames complete them into 4D scenes. On nuScenes, scored in one stitched 360^circ view, PanDWM has lower FID and FVD than the multi-camera baselines at 8-46times their speed, and keeps its 50-step teacher\u0026#x27;s FID while lowering FVD by 22-25%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e驾驶世界模型通常从具有单独光学中心和小重叠区域的六个针孔相机生成视频，并且必须学习保持这些视角的一致性。我们提出了PanDWM，将它们拼接成一个360度的全景带。相机边界然后落在一个图像内，因此保持视角一致意味着保持图像连续，并且每个像素仍然记录其相机光线。以布局为条件，一个因果学生模型分四步逐窗口生成该带；它从因果教师模型蒸馏而来，并在其自身的展开上进行训练。前馈解码器沿着这些光线将每一帧提升为3D高斯，来自相邻帧的静态高斯将它们补全为4D场景。在nuScenes上，在一个拼接的360度视角中评分，PanDWM的速度是多相机基线的8到46倍，同时具有更低的FID和FVD，并且保持了其50步教师的FID，同时将FVD降低了22-25%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出PanDWM，一种将六个针孔相机视角拼接为360度全景带的驾驶世界模型，通过因果蒸馏和前馈解码器生成连续的4D场景，并在nuScenes数据集上进行评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e将多相机视角拼接为单一的360度全景带，将视角一致性问题转化为图像连续性问题；采用因果学生模型分四步逐窗口生成，并通过教师模型蒸馏和自身展开训练；利用前馈解码器将2D帧沿相机光线提升为3D高斯，并结合相邻帧构建4D场景；在nuScenes上速度比基线快8到46倍，FVD降低22-25%且保持教师模型的FID。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种创新的驾驶世界模型架构，通过全景拼接和3D高斯提升实现了高效且一致的4D场景生成，显著提升了生成速度并降低了FVD。局限性在于：摘要未提供FID的具体数值，仅说明保持了教师模型的FID；未详细说明布局条件的具体形式或因果教师和学生模型的具体架构；评估仅在nuScenes数据集上进行，摘要未提供在其他驾驶数据集或更复杂动态场景下的泛化结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 自动驾驶 / 世界模型与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e212. Flexible Multi-Stack Super-Resolution of Clinical Brain MRI Using Hetero-Orientation Variational Encoding: Expert Reader Evaluation in a Nigerian Cohort（使用异向变分编码的临床脑 MRI 灵活多栈超分辨率：尼日利亚队列的专家读者评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21412\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21412\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHigh-resolution brain MRI is important for neuroradiological assessment, yet routine clinical protocols often rely on fast, anisotropic 2D acquisitions, particularly in resource-constrained settings. These acquisitions may differ in orientation, alignment and anatomical coverage, resulting in partially overlapping image stacks. Existing learning-based super-resolution methods typically rely on single, under-constrained inputs or fixed multi-stack configurations with idealised acquisition geometry. We introduce MS-HVED, a sequence-agnostic framework for flexible multi-stack brain MRI super-resolution. Available axial, coronal and sagittal stacks are independently encoded into multi-scale Gaussian posteriors and fused using a field-of-view-aware Product-of-Gaussians formulation that limits contributions from unsupported regions. Physics-informed domain randomisation simulates heterogeneous clinical acquisition conditions, including obliqueness, partial coverage and imaging artefacts. MS-HVED achieved competitive or superior reconstruction fidelity across synthetic benchmarks and improved downstream tissue segmentation relative to low-resolution inputs. To assess generalisation beyond the training cohorts, we performed external clinical validation on 30 routine brain MRI examinations from a Nigerian cohort, representing an under-represented population in medical imaging research. These examinations formed the largest component of a blinded reader study involving 44 real cases and seven expert neuroradiologists. In the Nigerian cohort, MS-HVED was preferred over the supervised baseline for overall image quality in 187 of 210 paired assessments. Across all clinical cohorts, MS-HVED achieved higher overall-quality scores with all available inputs (5.93 vs. 4.49, p\u0026lt;.001), with the preference persisting when axial or coronal inputs were omitted (p\u0026lt;.001). Code at github.com/cai4cai/ms-hved\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e高分辨率脑部 MRI 对于神经放射学评估很重要，但常规临床方案通常依赖于快速、各向异性的 2D 采集，特别是在资源受限的环境中。这些采集可能在方向、对齐和解剖覆盖范围上有所不同，从而导致部分重叠的图像栈。现有的基于学习的超分辨率方法通常依赖于单一的、约束不足的输入或具有理想化采集几何形状的固定多栈配置。我们引入了 MS-HVED，一个用于灵活多栈脑部 MRI 超分辨率的序列不可知框架。可用的轴状、冠状和矢状栈被独立编码为多尺度高斯后验，并使用感知视场的乘积高斯公式进行融合，该公式限制了不受支持区域的贡献。物理信息域随机化模拟了异质的临床采集条件，包括倾斜、部分覆盖和成像伪影。MS-HVED 在合成基准测试中实现了具有竞争力或更优的重建保真度，并相对于低分辨率输入改善了下游组织分割。为了评估超越训练队列的泛化能力，我们对来自尼日利亚队列的 30 例常规脑部 MRI 检查进行了外部临床验证，该队列代表了医学影像研究中代表性不足的人群。这些检查构成了涉及 44 个真实病例和 7 名专家神经放射学家的盲法读者研究的最大组成部分。在尼日利亚队列中，在 210 次配对评估中，有 187 次 MS-HVED 在整体图像质量方面优于监督基线。在所有临床队列中，MS-HVED 在所有可用输入下获得了更高的整体质量分数（5.93 对 4.49，p\u0026lt;.001），当省略轴状或冠状输入时，这种偏好依然存在（p\u0026lt;.001）。代码位于 github.com/cai4cai/ms-hved。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e临床脑部 MRI 的灵活多栈超分辨率，以解决资源受限环境下各向异性 2D 采集导致的图像栈方向、对齐和覆盖范围不一致问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 MS-HVED 框架，将不同方向的图像栈独立编码为多尺度高斯后验并使用感知视场的乘积高斯公式融合；利用物理信息域随机化模拟异质临床采集条件；在尼日利亚队列等外部临床验证中，通过盲法读者研究证明其在整体图像质量上显著优于监督基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 MS-HVED 在合成基准和外部临床验证（包括代表性不足的尼日利亚队列）中均表现出优越的重建保真度和图像质量。局限性方面，摘要未提供具体的计算复杂度、推理时间或与其他最先进多栈超分辨率方法的详细定量对比，也未提及在极端伪影或完全缺失某个方向栈时的具体表现局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医学图像分析 / 超分辨率\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e213. A Reinforcement Learning Method to Navigate SMEFT Operator Space（一种用于探索 SMEFT 算子空间的强化学习方法）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21439\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21439\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn particle physics, discrepancies between experimental measurements and Standard Model (SM) predictions are commonly interpreted within new theoretical models. In this context, the Standard Model Effective Field Theory (SMEFT) provides a general framework encompassing a broad class of models. However, exploring the enormous space of possible SMEFT operators rapidly becomes a challenging combinatorial problem: many operators can contribute simultaneously to different observables, their effects are correlated, and distinct operator combinations can provide comparably good descriptions of the data. In this work, we formulate the exploration of the SMEFT operator space as a sequential decision-making problem using reinforcement learning (RL). Our RL agent employs a lightweight actor-critic architecture with approximately 40K trainable parameters in total. Rather than searching for a single best-fit theory, our method is designed to discover a diverse set of high-quality theory hypotheses. We test the method in a complex phenomenological environment comprising 132 observables across several sectors of particle physics, including 24 measurements that deviate from their SM predictions by more than 1.5σ. We show that the learned RL policy efficiently constructs multi-operator theories that substantially improve the global fit. Comparisons with independent random-subset and random-sequential searches demonstrate the ability of the RL policy to navigate this large combinatorial space. Our results establish RL as a systematic framework for exploring diverse patterns of new physics (NP) interactions within SMEFT.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e
