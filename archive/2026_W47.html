ard trend during iterative denoising, while a few denoising steps exhibit localized entropy spikes closely associated with hallucinations. We argue that anomalous steps can be identified by measuring the entropy deviation of each denoising step from its neighboring temporal window. We hypothesize that discrete token commitment discards the distributional information at masked positions, limiting the continued interaction between candidate semantics and the context during entropy spikes. With this goal, we present StepRefine, a plug-and-play decoding strategy that leverages semantic context to achieve reliable denoising. The core of our method lies in a step-aware switch between discrete denoising and latent refinement. The model employs probability-weighted embeddings at entropy spike steps to preserve diverse reasoning hypotheses and performs multiple rounds of continuous refinement. Meanwhile, a refinement controller monitors distributional stability to reduce unnecessary loops and switch the model back to standard discrete denoising. Through extensive experiments, StepRefine demonstrates significant hallucination mitigation across different MDLMs on multimodal benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近，多模态扩散语言模型（MDLMs）通过迭代细化展现了强大的全局建模能力。我们观察到，在迭代去噪过程中，掩码不确定性呈现整体下降趋势，而少数去噪步骤表现出与幻觉密切相关的局部熵尖峰。我们认为，可以通过测量每个去噪步骤与其相邻时间窗口的熵偏差来识别异常步骤。我们假设，离散token承诺丢弃了掩码位置的分布信息，限制了在熵尖峰期间候选语义与上下文之间的持续交互。基于这一目标，我们提出了StepRefine，一种即插即用的解码策略，利用语义上下文实现可靠的去噪。我们方法的核心在于离散去噪和潜在细化之间的步长感知切换。模型在熵尖峰步骤采用概率加权嵌入来保留多样化的推理假设，并执行多轮连续细化。同时，细化控制器监控分布稳定性以减少不必要的循环，并将模型切换回标准离散去噪。通过大量实验，StepRefine在不同的MDLMs和多模态基准测试中展示了显著的幻觉缓解效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e缓解多模态扩散语言模型（MDLMs）在迭代去噪过程中产生的幻觉。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现去噪过程中的局部熵尖峰与幻觉密切相关；提出StepRefine即插即用解码策略，通过步长感知切换离散去噪和潜在细化，在熵尖峰步骤使用概率加权嵌入保留推理假设，并通过细化控制器监控分布稳定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了通过监测熵偏差来识别异常步骤的假设，并设计了StepRefine策略。局限性方面，摘要未提供具体的实验数据集名称、具体的性能提升数字以及该方法在其他非多模态基准上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e71. One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning（一个先验，两种动态：重新利用视频扩散Transformer进行自监督潜在动作学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26617\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26617\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideos reveal how the world changes, but rarely the actions that cause those changes. Latent action learning recovers such supervision from visual transitions, yet often learns the underlying dynamics largely from scratch. We ask whether a pretrained video generator can instead provide the prior for both inverse and forward dynamics. We introduce O^{2}LaF, built on a simple principle: one prior, two dynamics. We initialize both models from the same pretrained video DiT and adapt them to their distinct roles: a feed-forward transition encoder with learnable action queries for inverse dynamics, and a causal, action-conditioned video generator for forward dynamics. By controlling information access and optimizing both dynamics end-to-end through a compact bottleneck, O^{2}LaF learns transferable actions from unlabeled videos. Across navigation and robotic manipulation, O^{2}LaF sets a new state of the art in few-shot action probing and enables stronger zero-shot action transfer across visual contexts and embodiments. Beyond generative video priors, we further extend our framework to predictive representation priors such as V-JEPA2, achieving competitive performance. Our findings suggest a broader paradigm for latent-action learning: repurposing pretrained video models to discover transferable actions and predict their consequences.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频揭示了世界如何变化，但很少揭示导致这些变化的动作。潜在动作学习从视觉转换中恢复这种监督，但通常从头学习底层动态。我们询问预训练视频生成器是否可以反过来为逆动态和正动态提供先验。我们引入了O^{2}LaF，建立在一个简单的原则上：一个先验，两种动态。我们从同一个预训练视频DiT初始化这两个模型，并使它们适应其不同的角色：用于逆动态的具有可学习动作查询的前馈转换编码器，以及用于正动态的因果、动作条件视频生成器。通过控制信息访问并通过紧凑的瓶颈端到端优化这两种动态，O^{2}LaF从无标签视频中学习可转移的动作。在导航和机器人操作中，O^{2}LaF在少样本动作探测中设定了新的最先进水平，并实现了跨视觉上下文和具身形式的更强零样本动作转移。除了生成视频先验，我们进一步将框架扩展到预测表示先验（如V-JEPA2），取得了具有竞争力的性能。我们的发现提出了潜在动作学习的更广泛范式：重新利用预训练视频模型来发现可转移的动作并预测其后果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用预训练视频生成器作为先验，同时学习逆动态（从视觉转换中恢复动作）和正动态（预测动作后果），以实现自监督的潜在动作学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出O^{2}LaF框架，基于“一个先验，两种动态”原则，从同一预训练视频DiT初始化逆动态和正动态模型；通过紧凑瓶颈端到端优化，从无标签视频中学习可转移动作；在导航和机器人操作任务中，少样本动作探测达到SOTA，并实现强大的跨视觉上下文和具身形式的零样本动作转移；框架可扩展至预测表示先验（如V-JEPA2）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了该方法在无标签视频动作学习、少样本探测和零样本跨域转移方面的卓越性能，并验证了框架的扩展性。关于动作表示的语义可解释性、在更复杂长序列任务中的表现、以及计算资源消耗的具体数据，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 机器人学 / 视频理解与自监督学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e72. On-Policy Morphing into Hybrid Attention Models（混合注意力模型的在线策略转换）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24809\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24809\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHybrid attention models combine full and linear attention to achieve a better quality--efficiency trade-off. Converting pretrained Transformers into such models requires identifying which layers should retain full attention under a prescribed budget. We identify two off-policy mismatches in FlashMorph\u0026#x27;s layer selection: (i) continuous branch interpolation and teacher-forced hidden states differ from discrete hybrid computation; and (ii) frozen model weights fail to account for parameter adaptation during subsequent recovery. We introduce FlashMorph2, an on-policy layer-selection method that (I) evaluates sampled discrete hybrid architectures end to end using their own hidden states, and (II) jointly optimizes layer-selection scores and model weights under the recovery objective to reflect post-adaptation performance. Experiments across Qwen3 model scales and linear-attention variants show that FlashMorph2 consistently outperforms existing layer-selection methods, improving average scores over FlashMorph by +2.42 points on RULER, +1.08 on LongBench, and +0.76 on recall-intensive tasks, while completing layer selection in only 0.72--3.57 GPU hours across 0.6B--8B models, demonstrating high efficiency and scalability.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e混合注意力模型结合了全注意力和线性注意力，以实现更好的质量-效率权衡。将预训练的Transformer转换为这类模型需要在规定的预算下确定哪些层应该保留全注意力。我们发现了FlashMorph层选择中的两个离策略不匹配问题：（i）连续分支插值和教师强制的隐藏状态与离散混合计算不同；（ii）冻结的模型权重未能考虑后续恢复过程中的参数适应。我们引入了FlashMorph2，一种在线策略层选择方法，该方法（I）使用其自身的隐藏状态端到端地评估采样的离散混合架构，并且（II）在恢复目标下联合优化层选择分数和模型权重，以反映适应后的性能。在Qwen3模型规模和线性注意力变体上的实验表明，FlashMorph2始终优于现有的层选择方法，在RULER上的平均得分比FlashMorph提高了+2.42分，在LongBench上提高了+1.08分，在回忆密集型任务上提高了+0.76分，同时在0.6B至8B模型上仅用0.72至3.57个GPU小时就完成了层选择，展示了高效率和可扩展性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在预算限制下，将预训练Transformer转换为混合注意力模型时，确定哪些层应保留全注意力（层选择）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了FlashMorph2，一种在线策略层选择方法，通过端到端评估离散混合架构并联合优化层选择分数与模型权重，解决了FlashMorph中的离策略不匹配问题。在多个模型规模和基准上显著提升了性能，且计算效率极高。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有方法FlashMorph的离策略不匹配问题，并通过在线策略评估和联合优化提出了FlashMorph2。实验证明了其在Qwen3模型和线性注意力变体上的优越性能和高效性。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 模型架构优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e73. Piccolo: Co-Evolving Decision Models and Data through Recursive Self-Improvement（Piccolo：通过递归自我改进协同进化决策模型与数据）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24651\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24651\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present Piccolo, a family of multimodal decision models (0.8B to 27B) that coevolves model capabilities and training data via Agentic Data Engineering and recursive self-improvement (RSI). The models predict probabilities over candidate answers for general-purpose text and visual judgments, agent harnesses, data workflows, and interactive games. Piccolo-27B tops the Decision Index Vision Full leaderboard with a score of 75.59, while Piccolo-9B and Piccolo-4B achieve 68.35 and 67.46, respectively. All three rank first on the Private benchmark in their respective model-size categories. Research agents analyze model behavior, construct training data, conduct experiments, and use the results to refine subsequent proposals. Semantic slices and a shared research memory connect these actions across the model family\u0026#x27;s development. With training recipes comprising hundreds of thousands of examples, data selection and feedback-driven refinement are central to the self-improvement process. Our large-scale RSI exploration yields three counter-intuitive insights for decision-model development: (1) Backbone-recipe co-adaptation outweighs raw model recency: earlier backbones can surpass newer generations on visual tasks under identical recipes; (2) Targeted data curation enables 4B-9B models to rival 27B baselines on specialized workflows; and (3) Continuous loss reduction can decouple from and even degrade discrete decision accuracy. Together with the released weights and tools from the Data-Juicer and AgentScope ecosystems, Piccolo provides an actionable blueprint for building frontier decision models and scaling data-driven RSI.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了Piccolo，这是一个多模态决策模型系列（0.8B到27B），它通过智能体数据工程和递归自我改进（RSI）协同进化模型能力和训练数据。这些模型预测通用文本和视觉判断、智能体框架、数据工作流和交互式游戏的候选答案的概率。Piccolo-27B以75.59的得分位居Decision Index Vision Full排行榜榜首，而Piccolo-9B和Piccolo-4B分别达到68.35和67.46。这三个模型在各自模型规模类别的Private基准测试中均排名第一。研究智能体分析模型行为，构建训练数据，进行实验，并利用结果来完善后续提案。语义切片和共享的研究记忆将这些行动连接在模型家族的开发过程中。包含数十万个示例的训练配方中，数据选择和反馈驱动的完善是自我改进过程的核心。我们的大规模RSI探索为决策模型开发得出了三个反直觉的见解：（1）主干-配方协同适应比原始模型的新近性更重要：在相同配方下，较早的主干可以在视觉任务上超越新一代模型；（2）有针对性的数据整理使4B-9B模型能够在专业工作流上与27B基线相媲美；（3）持续的损失减少可以与离散的决策准确性脱钩，甚至使其下降。连同从Data-Juicer和AgentScope生态系统发布的权重和工具，Piccolo为构建前沿决策模型和扩展数据驱动的RSI提供了一个可操作的蓝图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过智能体数据工程和递归自我改进（RSI）协同进化多模态决策模型的能力与训练数据，以提升其在文本与视觉判断、智能体框架等任务上的决策概率预测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Piccolo 模型系列（0.8B-27B），在 Decision Index Vision Full 和 Private 基准中取得同规模第一；利用研究智能体分析行为、构建数据并迭代优化；得出三个反直觉见解：主干-配方协同适应重于模型新近性、针对性数据整理可使小模型媲美大模型、持续损失减少可能降低离散决策准确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了模型规模、基准得分以及通过 RSI 获得的三个反直觉见解。局限性方面，摘要未提供训练示例的确切数字，摘要未提供 Private 基准测试的具体构成，摘要未提供较早主干的具体架构名称，摘要未提供计算资源消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 智能体与决策模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e74. Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model（Calpha：迈向通用语言模型中的原生生物分子智能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20986\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20986\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eBiomolecular foundation models predict the structures of proteins and their complexes accurately, and large language models (LLMs) reason in natural language, but the two remain separate: the abilities of the former are not part of a general-purpose LLM, and the reasoning of the latter does not enter a structure prediction. Calpha aims at one general model that folds proteins and complexes, understands protein sequence and structure, and lets its language reasoning influence the structures it predicts. This report covers the first step, in which an LLM outputs single-chain protein structures. Qwen3.5-9B reads a sequence enriched with ESM2 residue features. It can respond in text or emit a token that invokes a pretrained SimpleFold structure head, which receives information about the protein only through Qwen\u0026#x27;s residue states. Under a fixed folding request, the head achieves mean TM-scores of 0.808 on the FoldBench-334 development set, 0.635 on CASP16 domains and 0.900 on a CAMEO-style PDB set. We compare these predictions with a baseline in which ESM2-3B encodes the sequence and a fine-tuned SimpleFold-3B head predicts the coordinates. The two systems also differ in trainable weights, training duration and crop length. For chains of 100--299 residues, all three paired confidence intervals include zero. At 300--600 residues, the mean differences are -0.044, -0.160 and -0.025, respectively. In a separate test, four English request types triggered folding on every evaluated example. Protein training reduced accuracy on a 350-item MMLU-Pro subset from 77.4% to 70.3%. An LLM can therefore output single-chain structures from its own states, with lower long-chain scores in the current comparisons and reduced accuracy on the evaluated MMLU-Pro subset. Complex prediction, structure understanding and the effect of language reasoning on the predicted coordinates remain future work.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e生物分子基础模型能准确预测蛋白质及其复合物的结构，大型语言模型（LLMs）能用自然语言进行推理，但两者仍然是分离的：前者的能力不是通用LLM的一部分，后者的推理也不参与结构预测。Calpha 旨在构建一个通用模型，该模型能折叠蛋白质和复合物，理解蛋白质序列和结构，并让其语言推理影响其预测的结构。本报告涵盖了第一步，即 LLM 输出单链蛋白质结构。Qwen3.5-9B 读取富含 ESM2 残基特征的序列。它可以以文本形式响应，或发出一个调用预训练的 SimpleFold 结构头的 token，该头仅通过 Qwen 的残基状态接收有关蛋白质的信息。在固定的折叠请求下，该头在 FoldBench-334 开发集上的平均 TM-score 为 0.808，在 CASP16 结构域上为 0.635，在 CAMEO 风格的 PDB 集上为 0.900。我们将这些预测与基线进行了比较，在基线中 ESM2-3B 对序列进行编码，并由微调的 SimpleFold-3B 头预测坐标。这两个系统在可训练权重、训练时长和裁剪长度上也有所不同。对于 100-299 个残基的链，所有三个配对置信区间均包含零。在 300-600 个残基时，平均差异分别为 -0.044、-0.160 和 -0.025。在另一项测试中，四种英语请求类型在每个评估的示例上都触发了折叠。蛋白质训练使 350 项 MMLU-Pro 子集的准确率从 77.4% 降至 70.3%。因此，LLM 可以从其自身状态输出单链结构，但在当前比较中长链得分较低，且在评估的 MMLU-Pro 子集上准确率降低。复合物预测、结构理解以及语言推理对预测坐标的影响仍是未来的工作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将蛋白质结构预测能力整合到通用大型语言模型（LLM）中，使LLM能够通过自身的语言推理和内部状态直接输出单链蛋白质结构。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Calpha模型，将预训练的SimpleFold结构头集成到Qwen3.5-9B中，仅通过LLM的残基状态接收蛋白质信息以输出单链结构。2. 在FoldBench-334、CASP16和CAMEO风格PDB集上取得了较高的平均TM-scores（分别为0.808、0.635和0.900）。3. 验证了LLM自身状态输出结构的可行性，同时揭示了蛋白质训练对通用语言推理能力（MMLU-Pro准确率下降）和长链预测分数的负面影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Calpha成功迈出了将结构预测整合入LLM的第一步，证明了LLM内部状态可用于输出单链结构。局限性方面，当前比较中长链（300-600残基）得分低于基线，且蛋白质训练导致通用推理能力（MMLU-Pro）下降。摘要未提供关于复合物预测、结构理解、语言推理如何具体影响坐标预测的细节，也未说明计算资源消耗和更大规模模型的扩展情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e生物信息学与自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e75. eDMD: Endpoint Distribution Matching for Few-Step Diffusion Distillation（eDMD：用于少步扩散蒸馏的端点分布匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17194\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17194\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDistribution matching distillation (DMD) has emerged as a leading paradigm for distilling diffusion models into few-step students, where an auxiliary fake score model tracks the student\u0026#x27;s distribution and the discrepancy between the teacher and fake predictions drives the student toward the teacher. In multi-step distillation, although only the student\u0026#x27;s final output is delivered, existing methods train the fake model on intermediate states or across all denoising steps. Consequently, the student\u0026#x27;s update signal becomes entangled with intermediate distributions, which can distort the matching direction and remain nonzero even after the student\u0026#x27;s final outputs already match the teacher distribution. To resolve this mismatch, we propose Endpoint Distribution Matching Distillation (eDMD), which trains a single shared fake model exclusively on the student\u0026#x27;s final outputs and uses it to correct every denoising step. Our theoretical analysis proves that this endpoint reference guarantees that the distribution matching term vanishes if and only if the student\u0026#x27;s final output distribution matches the teacher\u0026#x27;s, regardless of intermediate distributions. Beyond the fake reference, we further strengthen teacher supervision through a precise teacher (PT) that replaces single-step guided predictions with short multi-step trajectories on the final noise interval, paired with a calibrated query density for intermediate steps. Experiments on SD3-Medium, FLUX.2-klein (4B and 9B), and Qwen-Image-2.1 demonstrate that eDMD consistently outperforms existing distribution matching methods for 4-step generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e分布匹配蒸馏（DMD）已成为将扩散模型蒸馏为少步学生模型的领先范式，其中辅助的假分数模型跟踪学生模型的分布，教师模型与假预测之间的差异驱动学生模型向教师模型靠拢。在多步蒸馏中，尽管仅传递学生模型的最终输出，但现有方法在中间状态或所有去噪步骤上训练假模型。因此，学生模型的更新信号与中间分布纠缠在一起，这可能会扭曲匹配方向，并且即使学生模型的最终输出已经匹配教师分布，该信号仍保持非零。为了解决这种不匹配，我们提出了端点分布匹配蒸馏（eDMD），它专门在学生模型的最终输出上训练单个共享假模型，并使用它来纠正每个去噪步骤。我们的理论分析证明，无论中间分布如何，这种端点参考保证了当且仅当学生模型的最终输出分布与教师模型匹配时，分布匹配项才会消失。除了假参考之外，我们还通过精确教师（PT）进一步加强教师监督，该精确教师在最终噪声区间上用短多步轨迹替换单步引导预测，并配以中间步骤的校准查询密度。在 SD3-Medium、FLUX.2-klein（4B 和 9B）和 Qwen-Image-2.1 上的实验表明，eDMD 在 4 步生成中始终优于现有的分布匹配方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多步扩散模型蒸馏中学生模型更新信号与中间分布纠缠的问题，提出一种新的分布匹配蒸馏方法以提升少步生成质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出端点分布匹配蒸馏（eDMD），仅在学生最终输出上训练共享假模型以纠正所有去噪步骤；理论证明端点参考能确保分布匹配项在最终输出匹配时消失；引入精确教师（PT）机制，在最终噪声区间使用短多步轨迹替代单步引导预测；在 SD3-Medium、FLUX.2-klein 和 Qwen-Image-2.1 上，4 步生成性能一致优于现有分布匹配方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 eDMD 从理论和实验上解决了现有 DMD 方法中更新信号与中间分布纠缠的问题，提升了少步生成的性能。局限性方面，摘要未提供 eDMD 在超过 4 步生成中的表现对比，未说明训练假模型和精确教师机制带来的额外计算开销，也未提供在更高分辨率或更复杂数据集上的评估结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 扩散模型与图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e76. DySENSE: Dynamic Spatiotemporal ENergy Synthesis and Emulation with Satellite Imagery（DySENSE：结合卫星图像的动态时空能源合成与仿真）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17878\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17878\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCities account for over two-thirds of the world\u0026#x27;s energy and more than 70% of global carbon dioxide emissions. City energy is essential for achieving the 2050 net-zero target and the UN\u0026#x27;s Sustainable Development Goals 7 and 11. Although existing studies have made progress, they are limited by data and methodological gaps. Existing studies are largely predictive for existing cities rather than generative for future cities; fine-grained, aligned monthly dynamic energy data are scarce; and existing GenAI models struggle to generate dynamic urban functional monthly energy. We present DySENSE, a joint multimodal GenAI framework that synthesizes static urban satellite imagery together with spatially aligned, dynamic monthly building energy consumption maps. We decouple long-term static urban morphology from short-term dynamic energy consumption. By conditioning on static urban land use, DySENSE can generate realistic, diverse and new static urban imagery with aligned energy maps. By conditioning on dynamic monthly and climate prompts, DySENSE can jointly generate dynamic, monthly energy consumption maps while keeping the urban morphology static. Experiments across four cities (New York, Washington, Norfolk, Busan) demonstrated that DySENSE can generate annotated high-fidelity synthetic energy data using less than 25% labelled data, boosting downstream prediction performance by 8% mIoU, and achieving strong energy dynamic consistency. Compared to existing methods, DySENSE significantly improved prediction performance (8.7% accuracy) and reduced prediction error (9%-18% CVRMSE, ASHRAE). DySENSE offers an effective foundation for energy-efficient cities, peak-load analysis, building performance simulation and dynamic demand response for city, energy, and building science. The data and code: https://huggingface.co/datasets/skl24/MUSE2 and https://github.com/kailaisun/DySENSE\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e城市消耗了世界上超过三分之二的能源，并产生了全球70%以上的二氧化碳排放。城市能源对于实现2050年净零目标和联合国可持续发展目标7和11至关重要。尽管现有研究取得了进展，但它们受到数据和方法差距的限制。现有研究主要是对现有城市进行预测，而不是对未来城市进行生成；缺乏细粒度、对齐的月度动态能源数据；且现有的GenAI模型难以生成动态的城市功能月度能源。我们提出了DySENSE，一个联合多模态GenAI框架，可合成静态城市卫星图像以及空间对齐的动态月度建筑能源消耗图。我们将长期的静态城市形态与短期的动态能源消耗解耦。通过以静态城市土地利用为条件，DySENSE可以生成逼真的、多样化的新型静态城市图像及对齐的能源图。通过以动态月份和气候提示为条件，DySENSE可以在保持城市形态静态的同时，联合生成动态的月度能源消耗图。在四个城市（纽约、华盛顿、诺福克、釜山）的实验表明，DySENSE可以使用不到25%的标记数据生成带注释的高保真合成能源数据，将下游预测性能提高8% mIoU，并实现强大的能源动态一致性。与现有方法相比，DySENSE显著提高了预测性能（8.7%准确率）并降低了预测误差（9%-18% CVRMSE，ASHRAE）。DySENSE为城市、能源和建筑科学的节能城市、峰值负荷分析、建筑性能仿真和动态需求响应提供了有效的基础。数据和代码：https://huggingface.co/datasets/skl24/MUSE2 和 https://github.com/kailaisun/DySENSE\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决现有城市能源研究中缺乏细粒度动态数据、难以生成未来城市动态月度能源消耗图的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出DySENSE联合多模态GenAI框架，解耦长期静态城市形态与短期动态能源消耗；通过条件生成实现静态图像与动态能源图的联合合成；在四个城市的实验中，使用不到25%的标记数据即可生成高保真合成数据，提升下游预测性能8% mIoU，准确率提升8.7%，误差降低9%-18% CVRMSE。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的实验城市（纽约等）和明确的性能提升数字（8% mIoU, 8.7% accuracy, 9%-18% CVRMSE）。局限性方面，摘要未提供该框架在生成极端气候或特殊城市形态下的表现，未说明生成单张或单月数据的具体计算成本，也未提及模型在未见过的第五个城市上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能应用 / 城市计算与能源\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e77. JVT: Just Video Transformer makes pixel-space video diffusion simple（JVT：纯粹的Video Transformer让像素空间视频扩散变得简单）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18549\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18549\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDirect diffusion modeling of high-dimensional raw video data is challenging, and existing pixel-space methods often rely on specialized architectures. We introduce JVT (Just Video Transformer), a simple large-patch DiT-style Transformer for pixel-space video diffusion, without a pretrained autoencoder, auxiliary detailers, cascaded stages, or U-Net-style skip connections. We systematically examine video patch embeddings, register tokens, and adaptive layer normalization to identify design choices that balance generation quality and computational efficiency. The resulting JVT design achieves generation quality competitive with latent diffusion baselines in both class-conditioned and unconditional settings. The pixel-space formulation of JVT also naturally supports joint generation of pixel-aligned modalities. We demonstrate this capability through camera-conditioned RGB-disparity generation, which improves camera following relative to RGB-only baselines and yields explicit scene geometry without an additional reconstruction model at inference. These results highlight the potential of simple DiT-style Transformers for pixel-space video diffusion, and we hope our findings offer useful insights and practical guidance for future research.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e对高维原始视频数据进行直接扩散建模具有挑战性，现有的像素空间方法通常依赖于专门的架构。我们引入了JVT（Just Video Transformer），一种用于像素空间视频扩散的简单大补丁DiT风格Transformer，无需预训练自编码器、辅助细节器、级联阶段或U-Net风格的跳跃连接。我们系统地检查了视频补丁嵌入、寄存器令牌和自适应层归一化，以确定平衡生成质量和计算效率的设计选择。最终的JVT设计在类条件和无条件设置中均实现了与潜在扩散基线相当的生成质量。JVT的像素空间公式还自然支持像素对齐模态的联合生成。我们通过相机条件RGB-视差生成展示了这一能力，与仅RGB基线相比，它改善了相机跟随，并在推理时无需额外的重建模型即可产生明确的场景几何。这些结果突出了简单DiT风格Transformer在像素空间视频扩散中的潜力，我们希望我们的发现能为未来的研究提供有用的见解和实践指导。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在像素空间中直接进行视频扩散建模，无需复杂的辅助架构，实现高质量且计算高效的视频生成及像素对齐模态的联合生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了JVT，一种无需预训练自编码器、辅助细节器、级联阶段或跳跃连接的简单大补丁DiT风格Transformer；系统评估了补丁嵌入、寄存器令牌和自适应层归一化；在类条件和无条件设置下生成质量与潜在扩散基线相当；支持相机条件RGB-视差联合生成，改善相机跟随并直接输出场景几何。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要说明了JVT在类条件和无条件设置下与潜在扩散基线具有竞争力的生成质量，以及在相机条件RGB-视差生成中的能力。关于具体的定量评估指标数值、与其他最先进像素空间方法的详细对比数据、以及训练和推理的具体计算资源消耗，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e78. TabBioMed: A Large-Scale Benchmark for Biomedical Tabular Learning（TabBioMed：生物医学表格学习的大规模基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23779\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23779\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advances in machine learning have accelerated biomedical prediction, but evaluation on structured biomedical data remains fragmented, especially for datasets with high dimensionality, large sample size, missingness, and class imbalance. We introduce TabBioMed, a large-scale benchmark of 94 curated public biomedical tabular datasets spanning electronic health records, drug discovery, genomics, transcriptomics, proteomics, metabolomics, single-cell omics, and systems biology. TabBioMed unifies these datasets through a standardized, dataset-aware preprocessing and evaluation framework, enabling reproducible comparison across classification, regression, and multi-target tasks. We benchmark 23 models across classical baselines, gradient-boosted trees, neural tabular architectures, and tabular foundation models. Foundation models deliver the strongest family-level predictive performance. However, their gains are regime-dependent: tree-based models and tuned multilayer perceptrons remain highly competitive, often dominating under inference-time or training-cost constraints. Overall, TabBioMed shows that biomedical tabular learning is strongly context-dependent, with optimal model choice depending on data regime, task type, and computational budget. We release TabBioMed with curated datasets and splits, preprocessing code, baselines, and results, providing a reproducible benchmark for practical model selection and future methods development in biomedical machine learning, available at https://github.com/AI-sandbox/TabBioMed.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器学习的最新进展加速了生物医学预测，但在结构化生物医学数据上的评估仍然碎片化，特别是对于具有高维度、大样本量、缺失和类别不平衡的数据集。我们引入了TabBioMed，一个包含94个精选公共生物医学表格数据集的大规模基准，涵盖电子健康记录、药物发现、基因组学、转录组学、蛋白质组学、代谢组学、单细胞组学和系统生物学。TabBioMed通过标准化的、数据集感知的预处理和评估框架统一了这些数据集，实现了跨分类、回归和多目标任务的可重复比较。我们对23个模型进行了基准测试，涵盖经典基线、梯度提升树、神经表格架构和表格基础模型。基础模型提供了最强的家族级预测性能。然而，它们的增长是依赖于环境的：基于树的模型和微调的多层感知器仍然具有高度竞争力，通常在推理时间或训练成本约束下占据主导地位。总体而言，TabBioMed表明生物医学表格学习强烈依赖于上下文，最佳模型选择取决于数据环境、任务类型和计算预算。我们发布了TabBioMed，包含精选数据集和划分、预处理代码、基线和结果，为生物医学机器学习中的实用模型选择和未来方法开发提供了可重复的基准，可在 https://github.com/AI-sandbox/TabBioMed 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提供一个大规模、标准化的生物医学表格数据基准（TabBioMed），以统一评估和比较各类机器学习模型在结构化生物医学数据上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e包含94个精选公共生物医学表格数据集，涵盖多个生物医学领域；提供标准化的、数据集感知的预处理和评估框架；对23个模型（包括基础模型、树模型等）进行跨任务基准测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前生物医学表格数据评估碎片化。TabBioMed通过整合94个数据集和标准化框架解决了这一问题。基准测试表明表格基础模型家族级性能最强，但树模型和微调MLP在计算成本受限时仍具竞争力，证明模型选择高度依赖上下文、任务和预算。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习基准与生物医学信息学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e79. StrideWorld: Benchmarking Scene Rigidity and Action Consistency in Interactive Video World Model（StrideWorld：在交互式视频世界模型中对场景刚性和动作一致性进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24408\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24408\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eInteractive video world models turn user commands into the exploration of a generated scene, which requires the scene to keep its 3D structure as the camera moves and each action to keep a stable effect. Existing benchmarks mostly evaluate these properties against references fitted to the video under test, either a scene reconstructed from its own frames or a camera trajectory aligned to the command path with a free scale. Such references can absorb gradual scene deformation and changes in pace and route length, so these errors can pass undetected. We therefore introduce StrideWorld, a benchmark whose references are fixed before the motion they judge. It evaluates scene rigidity against the ground-truth geometry of the start view, and action consistency against the stride of each action, the camera motion of one command. The stride is measured on the model\u0026#x27;s first steps and then used to test the steps that follow, so each model is judged only against its own steps. Its measurements are validated on rendered videos with known camera motion, and its scores agree with human judgments. Across  videos generated by  open models from 140 start views, all models but one deform their scenes as the camera moves, with offsets up to 7.3 times those of a rigid rendering along the same camera path. Most models keep a steady pace when a single action is held. Along composed routes, several models often stall, and most completed routes end away from the positions predicted by each model\u0026#x27;s own strides. Only the two models that scale commands by the estimated scene depth bring most routes close to these positions. Fine-tuning two models on a few rendered clips removes most of their mid-route stalls. Code, data, and a leaderboard are publicly available at https://github.com/chuangwang123/strideworld.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e交互式视频世界模型将用户命令转化为对生成场景的探索，这要求场景在相机移动时保持其3D结构，并且每个动作保持稳定的效果。现有的基准测试大多根据拟合到被测视频的参考来评估这些属性，这些参考要么是从其自身帧重建的场景，要么是与命令路径对齐且尺度自由的相机轨迹。此类参考可以吸收逐渐的场景变形以及节奏和路线长度的变化，因此这些错误可能会在未被检测到的情况下通过。因此，我们引入了StrideWorld，这是一个其参考在它们所评判的运动之前就已固定的基准测试。它根据起始视图的真实几何形状评估场景刚性，并根据每个动作的步幅（即一个命令的相机运动）评估动作一致性。步幅在模型的最初几步进行测量，然后用于测试随后的步骤，因此每个模型仅根据其自身的步骤进行评判。其测量在具有已知相机运动的渲染视频上进行了验证，并且其得分与人类判断一致。在由开放模型从140个起始视图生成的视频中，除一个模型外，所有模型在相机移动时都会使其场景变形，其偏移量高达沿相同相机路径的刚性渲染的7.3倍。当保持单一动作时，大多数模型能保持稳定的节奏。在组合路线上，几个模型经常停滞，并且大多数完成的路线结束于远离每个模型自身步幅所预测的位置。只有两个通过估计的场景深度缩放命令的模型将大多数路线带到了接近这些位置的位置。在少量渲染片段上微调两个模型可以消除它们大部分的中途停滞。代码、数据和排行榜已在 https://github.com/chuangwang123/strideworld 公开提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估交互式视频世界模型在相机移动时的场景刚性（3D结构保持）和动作一致性（稳定效果）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 StrideWorld 基准，其参考在运动前固定，避免现有基准吸收场景变形和节奏变化；通过模型自身初始步幅测量来评估后续步骤；在140个起始视图的开放模型视频上验证，发现除一个模型外均存在场景变形（偏移高达刚性渲染的7.3倍）；发现通过估计场景深度缩放命令的两个模型表现最好；微调可消除中途停滞。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有基准测试在评估场景变形和节奏变化时的盲区，并提出了固定参考的 StrideWorld 基准。局限性方面，摘要未提供具体的视频生成总数，摘要未提供微调所用渲染片段的具体数量，摘要未提供计算资源消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e80. QDA: Closed-Loop LLM Quantization Design with Agents（QDA：基于智能体的闭环大语言模型量化设计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23388\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23388\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePost-training quantization is the standard way to serve large language models at low cost. However, the best quantization recipe differs across models and precisions. As a result, experts must redesign it for every new model, which is time-consuming and often sub-optimal. Fortunately, an LLM agent can take over this design by refining the recipe over rounds of building and evaluating candidates, so that more rounds lead to better recipes. However, evaluating one quantized reasoning model takes tens of GPU-hours, and combining methods from different codebases means porting each to the new architecture by hand. We present QDA, a system in which an agent designs the recipe for each model and precision. To make evaluation fast, QDA scores each candidate in minutes by its output KL divergence from the original model on reasoning traces that the agent never sees, and checks promising ones with long generations to catch failures such as repetition loops. To make building fast, QDA provides a library of public PTQ methods that are compatible with one another and with new model architectures. Across four reasoning models, QDA improves accuracy over the strongest public recipe by 0.9, 1.4 and 2.2 percentage points on average at W4A16, W4A8 and W3A16, using 64 GPU-hours per search. On the 320B-parameter MoE model GLM-5.3-Flash at NVFP4 W4A4, it recovers 98.3% of the FP8 model\u0026#x27;s accuracy, against 96.9% for the best vendor checkpoint. Every QDA checkpoint also runs on existing serving kernels with no inference overhead. We will release the library, the evaluator and the harness.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e训练后量化是以低成本服务大语言模型的标准方法。然而，最佳量化配方因模型和精度而异。因此，专家必须为每个新模型重新设计，这很耗时且通常次优。幸运的是，大语言模型代理可以通过在构建和评估候选者的多轮中改进配方来接管这一设计，因此更多轮次会带来更好的配方。然而，评估一个量化的推理模型需要数十个GPU小时，并且结合来自不同代码库的方法意味着手动将每个方法移植到新架构。我们提出了QDA，一个系统，其中代理为每个模型和精度设计配方。为了使评估快速，QDA在几分钟内通过候选者在代理从未见过的推理轨迹上与原始模型的输出KL散度对其进行评分，并通过长生成检查有希望的候选者以捕获失败（如重复循环）。为了使构建快速，QDA提供了一个相互兼容且与新模型架构兼容的公共训练后量化方法库。在四个推理模型中，QDA在W4A16、W4A8和W3A16下，每次搜索使用64个GPU小时，平均将准确率比最强的公开配方提高了0.9、1.4和2.2个百分点。在NVFP4 W4A4下的320B参数MoE模型GLM-5.3-Flash上，它恢复了FP8模型98.3%的准确率，而最佳供应商检查点为96.9%。每个QDA检查点也在现有服务内核上运行，没有推理开销。我们将发布该库、评估器和测试工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用大语言模型代理自动为不同模型和精度设计最优的训练后量化（PTQ）配方。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e利用输出KL散度在几分钟内快速评估候选量化配方；提供相互兼容且支持新架构的公共PTQ方法库以加速构建；通过长生成检查捕获重复循环等失败。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统量化配方设计耗时且次优，评估成本高。QDA通过代理闭环设计、基于KL散度的快速评估和兼容的PTQ方法库解决了这些问题。实验显示在W4A16、W4A8、W3A16下准确率分别提升0.9、1.4、2.2个百分点，在GLM-5.3-Flash W4A4下恢复98.3% FP8准确率，且无推理开销。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大模型压缩与量化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e81. WebArena-Pro: A Heterogeneous, Multimodal, Reproducible Benchmark for Web Agents（WebArena-Pro：面向Web智能体的异构、多模态、可复现基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17955\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17955\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWeb agents powered by large language and vision-language models are increasingly applied to realistic browser work that spans heterogeneous applications, multimodal content, and stateful workflows. However, existing reproducible web-agent benchmarks cover only a small number of web applications drawn from a few software categories, and restrict modality to text and vision. Live benchmarks broaden site coverage but sacrifice reproducibility, since pages and data drift between runs. Moreover, existing benchmarks do not meaningfully evaluate whether agents can understand and use audio and video content embedded within web tasks. To address these gaps, we introduce WebArena-Pro, a benchmark comprising 300 tasks across 20 self-hosted web applications in six domain categories, spanning distinct interface conventions, workflows, and data models. Across the evaluated agents, the best performance is achieved by both Codex with GPT 6.1 Sol and Claude Code with Claude Opus 5.5 at 62.3%, followed by OpenCode with Kimi 3.1 Pro at 60.7%. The strongest GenericAgent configurations, Gemini 3.1 Pro omni and Gemma4 31B, both achieve 30.3%. Among reproducible, human-curated web agent benchmarks, WebArena-Pro provides the broadest application coverage and the most comprehensive multimodal support to date. The benchmark treats audio and video as core observations alongside text and vision, with dedicated actions for extracting information from each. WebArena-Pro runs each task in isolation and supports reproducible, parallel evaluation. Tasks are authored through a dedicated annotator interface, filtered by LLM-assisted triage, and finally validated by humans before release. Project page: https://webarena-pro.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e由大型语言和视觉语言模型驱动的Web智能体正越来越多地应用于跨越异构应用程序、多模态内容和有状态工作流的真实浏览器工作。然而，现有的可复现Web智能体基准仅涵盖从少数软件类别中提取的少量Web应用程序，并将模态限制为文本和视觉。实时基准扩大了站点覆盖范围，但牺牲了可复现性，因为页面和数据在运行之间会发生漂移。此外，现有基准没有有意义地评估智能体是否能够理解和使用嵌入在Web任务中的音频和视频内容。为了解决这些差距，我们引入了WebArena-Pro，这是一个包含300个任务的基准，跨越6个领域类别的20个自托管Web应用程序，涵盖不同的界面约定、工作流和数据模型。在评估的智能体中，Codex与GPT 6.1 Sol以及Claude Code与Claude Opus 5.5均取得了最佳性能，达到62.3%，其次是OpenCode与Kimi 3.1 Pro，达到60.7%。最强的GenericAgent配置，Gemini 3.1 Pro omni和Gemma4 31B，均达到30.3%。在可复现、人工策划的Web智能体基准中，WebArena-Pro提供了迄今为止最广泛的应用覆盖率和最全面的多模态支持。该基准将音频和视频与文本和视觉一起视为核心观察，并具有用于从每个模态中提取信息的专用动作。WebArena-Pro在隔离状态下运行每个任务，并支持可复现的并行评估。任务通过专用的注释界面编写，由LLM辅助分类进行过滤，并在发布前由人类最终验证。项目主页：https://webarena-pro.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个异构、多模态、可复现的Web智能体基准测试（WebArena-Pro），以评估智能体在跨越多种应用、多模态内容和有状态工作流的真实浏览器任务中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 包含300个任务，涵盖6个领域的20个自托管Web应用，提供广泛的覆盖率和多模态支持（包括音频和视频）。2. 任务在隔离环境中运行，支持可复现的并行评估。3. 任务通过专用界面编写，经LLM辅助过滤和人工验证。4. 评估结果显示Codex+GPT 6.1 Sol和Claude Code+Claude Opus 5.5表现最佳（62.3%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出WebArena-Pro解决了现有基准在应用覆盖率、多模态支持（特别是音视频）和可复现性方面的不足。局限性方面，摘要未提供关于该基准的具体局限性分析，仅说明了其构建方法和评估结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自然语言处理/智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e82. Online Mistake Detection in Instruction-Conditioned Procedural Video（指令条件程序视频中的在线错误检测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25567\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25567\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAn assistant monitoring a person performing a procedure is most useful when it can detect mistakes while there is still time to recover. This requires judging actions against task instructions as the video unfolds, identifying the attempted step, locating it in time, and assessing its execution. Existing online detectors do not use the instruction text, while instruction-conditioned methods operate offline. In this paper, we study online, instruction-conditioned mistake detection in egocentric videos. Using only observed video, task instructions, and prior predictions, our model identifies and localizes completed action attempts and classifies them as correct, modified, slip, corrections, or additions; omitted steps are determined after the video ends. We compare a modular pipeline, with separate step identification, temporal localization, and execution verification, to a joint model that predicts all outputs in a single step. To support supervised learning from mistakes, we repartition EgoPER to include erroneous videos in all splits. The approaches achieve similar step-segmentation F1@0.5 (93.6% and 92.1%), while the joint model achieves higher binary mistake-detection F1@0.5 (84.1% vs. 80.7%), with its largest gain on slips (56.4% vs. 37.5%). Component-level analysis suggests that error propagation between stages contributes to the modular approach\u0026#x27;s lower detection score. On test videos containing mistakes, both designs outperform released AEM and ESTANet checkpoints under our evaluation protocol.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e监控人员执行程序的助手在能够于还有时间恢复时检测到错误时最为有用。这需要在视频展开时根据任务指令判断动作，识别尝试的步骤，在时间上定位它，并评估其执行情况。现有的在线检测器不使用指令文本，而指令条件方法则离线运行。在本文中，我们研究了第一人称视频中的在线、指令条件错误检测。仅使用观察到的视频、任务指令和先前的预测，我们的模型识别并定位已完成的动作尝试，并将它们分类为正确、修改、失误、纠正或添加；省略的步骤在视频结束后确定。我们将具有单独的步骤识别、时间定位和执行验证的模块化管道与在单步中预测所有输出的联合模型进行了比较。为了支持从错误中进行监督学习，我们重新划分了EgoPER，以在所有分割中包含错误视频。这些方法实现了相似的步骤分割F1@0.5（93.6%和92.1%），而联合模型实现了更高的二元错误检测F1@0.5（84.1%对80.7%），其在失误上的增益最大（56.4%对37.5%）。组件级分析表明，阶段之间的错误传播导致了模块化方法较低的错误检测分数。在包含错误的测试视频上，这两种设计在我们的评估协议下均优于发布的AEM和ESTANet检查点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在第一人称视频中，结合任务指令进行在线的错误检测，包括识别、定位和评估动作执行情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了结合任务指令的在线错误检测方法，比较了模块化管道和联合模型。联合模型在二元错误检测（特别是失误检测）上表现更好。重新划分了EgoPER数据集以支持错误监督学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明联合模型由于避免了模块化管道中阶段间的错误传播，在错误检测上优于模块化方法。实验在重新划分的EgoPER数据集上进行。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频理解与动作检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e83. Beyond Answering: Learning to Speak First and Act in Streaming Video（超越回答：在流式视频中学习率先发言与行动）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17048\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17048\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMost AI assistants respond only when prompted, remaining silent even when events in the video stream offer meaningful opportunities for conversation. To move beyond purely user-driven interaction, we present AURA 2.0, a streaming video large language model that introduces three core upgrades to AURA. The key advance is Model-Initiated Conversation (MIC), which enables the model to identify topics worth discussing in the evolving visual stream and initiate conversations at appropriate moments without a user query. Stream-Aware Tool Calling (SATC) lets the model act on what it sees by invoking external tools using the current visual and conversational context and incorporating returned information into the ongoing interaction. Interactive Visual Grounding (IVG) supports visual grounding in both user inputs and model outputs. The model can identify objects marked by users on video frames and produce frame-aligned bounding boxes to link its responses to specific objects and regions. To develop these capabilities, we construct a dedicated streaming interaction dataset and adopt a three-stage training scheme to integrate the new behaviors with AURA\u0026#x27;s existing streaming interaction abilities. We further incorporate Long-Horizon Interaction Memory (LHIM) to maintain contextual continuity over extended video streams. Evaluations on public streaming benchmarks show that AURA 2.0 achieves leading performance among open-source streaming models, while targeted evaluations further validate its new interaction capabilities.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大多数AI助手仅在收到提示时做出响应，即使视频流中的事件提供了有意义的对话机会，它们也保持沉默。为了超越纯粹的用户驱动交互，我们提出了AURA 2.0，这是一个流式视频大语言模型，对AURA引入了三项核心升级。关键进展是模型发起对话（MIC），它使模型能够识别不断变化的视觉流中值得讨论的主题，并在没有用户查询的情况下在适当时刻发起对话。流感知工具调用（SATC）让模型通过调用外部工具对其所见采取行动，使用当前的视觉和对话上下文，并将返回的信息纳入正在进行的交互中。交互式视觉定位（IVG）支持用户输入和模型输出中的视觉定位。该模型可以识别用户在视频帧上标记的对象，并生成帧对齐的边界框，以将其响应链接到特定对象和区域。为了开发这些能力，我们构建了一个专用的流式交互数据集，并采用三阶段训练方案，将新行为与AURA现有的流式交互能力相集成。我们进一步引入了长时交互记忆（LHIM），以在扩展的视频流上保持上下文连续性。在公开流式基准上的评估表明，AURA 2.0在开源流式模型中取得了领先的性能，同时针对性评估进一步验证了其新的交互能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发流式视频大语言模型AURA 2.0，使其能够在流式视频中主动发起对话、调用工具执行动作以及进行交互式视觉定位。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出模型发起对话（MIC）实现无查询主动交互；流感知工具调用（SATC）结合视觉和对话上下文调用外部工具；交互式视觉定位（IVG）支持用户输入和模型输出的对象识别与边界框生成；构建专用数据集并采用三阶段训练；引入长时交互记忆（LHIM）保持长视频上下文连续性；在开源流式模型中取得领先性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eAURA 2.0通过MIC、SATC、IVG和LHIM等机制显著提升了流式视频交互能力。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型 / 流式视频处理 / 人机交互\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e84. MedJev: A System One Vision-Language Decision Model for Fast and Effective Medical Image Understanding（MedJev：用于快速高效医学图像理解的系统一视觉语言决策模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20992\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20992\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMedical image understanding with vision-language models (VLMs) typically relies on autoregressively generating reasoning and answer tokens. These unnecessary tokens make the inference cost scale with the response length and force the answer to be parsed from free-form text, incurring avoidable latency and decision errors. To this end, we introduce MedJev, a system one vision-language decision model that maps medical images, questions, and candidate answers directly to decisions in a single multimodal forward pass, without any autoregressive generation process. For fast inference, MedJev removes the upper language layers and the generative output pathway, while keeping the full vision pathway and all visual tokens. On this shortened backbone, a decision head scores each candidate by pretrained query--key matching and refines the scores with a lightweight multilayer perceptron (MLP) residual, coupling the pretrained matching structure with task-specific nonlinear discrimination. Built on Qwen3.5-4B, MedJev-4B improves both accuracy and speed over the original model on each of four medical image classification and visual question answering benchmarks, with an absolute accuracy gain of 7.93\\% and a 6.04times end-to-end speedup. Further comparison with 20 cutting-edge models shows that MedJev-4B achieves state-of-the-art performance and inference speed among 4B--9B general and medical VLMs, indicating that direct multimodal decision making is an effective route to fast and effective medical image understanding.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用视觉语言模型（VLM）进行医学图像理解通常依赖于自回归生成推理和答案标记。这些不必要的标记使得推理成本随响应长度扩展，并迫使从自由格式文本中解析答案，从而产生不可避免的延迟和决策错误。为此，我们引入了 MedJev，这是一个系统一视觉语言决策模型，它在单次多模态前向传递中将医学图像、问题和候选答案直接映射到决策，而无需任何自回归生成过程。为了快速推理，MedJev 移除了上层语言层和生成输出路径，同时保留了完整的视觉路径和所有视觉标记。在这个缩短的骨干网络上，决策头通过预训练的查询-键匹配对每个候选者进行评分，并使用轻量级多层感知器（MLP）残差来细化分数，将预训练的匹配结构与特定任务的非线性判别相结合。基于 Qwen3.5-4B 构建的 MedJev-4B 在四个医学图像分类和视觉问答基准测试的每一个中，在准确性和速度上都优于原始模型，绝对准确率提高了 7.93%，端到端加速了 6.04 倍。与 20 个前沿模型的进一步比较表明，MedJev-4B 在 4B 至 9B 的通用和医学 VLM 中实现了最先进的性能和推理速度，表明直接多模态决策是实现快速高效医学图像理解的有效途径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e医学图像理解与问答（通过单次多模态前向传递直接进行决策，消除自回归生成带来的延迟和错误）\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出MedJev系统一视觉语言决策模型，通过单次多模态前向传递直接将图像、问题和候选答案映射为决策，消除自回归生成。2. 移除上层语言层和生成输出路径，保留完整视觉路径和视觉标记以实现快速推理。3. 决策头结合预训练查询-键匹配与轻量级MLP残差进行评分和细化。4. 基于Qwen3.5-4B构建的MedJev-4B在四个基准上绝对准确率提升7.93%，端到端加速6.04倍，在4B至9B模型中实现SOTA性能和推理速度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：MedJev通过摒弃自回归生成并采用直接多模态决策机制，大幅降低了医学图像理解的推理延迟，同时通过保留完整视觉路径和引入特定任务的非线性判别提升了准确率，实现了速度与精度的双赢。局限：摘要未提供该模型在处理复杂多步推理医学问题时的能力表现，未说明移除语言层后对模型泛化到未见过的医学任务的影响，也未提供在更大参数规模下的扩展性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 医学图像分析 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e85. MovieRoll: A Systematic Framework for Rolling Out Long-Form Videos（MovieRoll：一个用于长视频生成的系统性展开框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21339\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21339\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video generation must sustain quality beyond the training horizon while handling self-generated history and growing cache costs. To address these challenges, we present MovieRoll, a base-to-distilled framework that connects streaming fine-tuning, long-rollout distillation, and long-horizon inference. We first establish a robust multi-step base through Window-wise Teacher Forcing (WinTF), which jointly denoises chunks at progressive noise levels with bidirectional attention within each window and causal access to preceding history. To retain historical context efficiently, hierarchical KV-cache compression (HieraKV) exploits layer-wise attention patterns, retaining full history in shallow layers and sink--recent history in deeper layers. This reduces cache memory by up to 78% while improving generation quality. Building on this base, cumulative long tuning with distribution matching distillation (CuLT-DMD) holds parameters fixed throughout each long self-rollout and averages local gradients before updating. Each update therefore combines supervision across temporal positions while retaining only one local computation graph, enabling efficient long-rollout training of a few-step generator. To extend generation beyond the training horizon, KV recomputation bounds context for both models, while guidance annealing (AnnealCFG) reduces guidance toward the clean endpoint to stabilize MovieRoll-Base. Complementing these modeling advances, FBCA attention and PS-VAE decoding support efficient training and streaming output. On HeliosBench, MovieRoll-Base remains competitive at 30s after training on videos of up to 15s, and MovieRoll-Distilled achieves the highest total scores among the compared methods across single- and multi-event evaluations up to 60s, combining sustained naturalness with active motion.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频生成必须在训练范围之外保持质量，同时处理自生成的历史和不断增长的缓存成本。为了应对这些挑战，我们提出了 MovieRoll，一个连接流式微调、长展开蒸馏和长视野推理的基础到蒸馏框架。我们首先通过窗口级教师强制（WinTF）建立一个稳健的多步基础，它在每个窗口内使用双向注意力并以渐进噪声水平联合去噪块，同时因果访问先前的历史。为了有效地保留历史上下文，分层 KV 缓存压缩（HieraKV）利用逐层注意力模式，在浅层保留完整历史，在深层保留 sink-最近历史。这将缓存内存减少了高达 78%，同时提高了生成质量。在此基础之上，带有分布匹配蒸馏的累积长微调（CuLT-DMD）在每次长自展开期间保持参数固定，并在更新前对局部梯度进行平均。因此，每次更新结合了跨时间位置的监督，同时仅保留一个局部计算图，从而实现了几步生成器的高效长展开训练。为了将生成扩展到训练范围之外，KV 重新计算为两个模型界定上下文，同时引导退火（AnnealCFG）减少向干净端点的引导以稳定 MovieRoll-Base。作为这些建模进展的补充，FBCA 注意力和 PS-VAE 解码支持高效的训练和流式输出。在 HeliosBench 上，MovieRoll-Base 在长达 15s 的视频上训练后，在 30s 时仍保持竞争力，并且 MovieRoll-Distilled 在长达 60s 的单事件和多事件评估中，在比较方法中取得了最高的总分，结合了持续的自然度与活跃的运动。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决流式视频生成中超出训练范围的长视频质量维持、自生成历史处理以及缓存成本增长的问题，提出MovieRoll框架以实现长视频的生成与推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出MovieRoll基础到蒸馏框架，包含窗口级教师强制（WinTF）、分层KV缓存压缩（HieraKV，减少高达78%缓存内存）、累积长微调与分布匹配蒸馏（CuLT-DMD）等技术。2. 引入KV重新计算和引导退火（AnnealCFG）以将生成扩展到训练范围之外并稳定基础模型。3. 在HeliosBench上，MovieRoll-Base在15s视频训练后30s生成保持竞争力，MovieRoll-Distilled在60s评估中取得最高总分，兼具自然度与活跃运动。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明MovieRoll通过一系列技术创新（如HieraKV、CuLT-DMD、AnnealCFG）有效解决了长视频生成中的缓存和长程质量问题。局限性方面，摘要未提供关于具体生成视频的分辨率、帧率、不同复杂场景下的生成失败率、模型推理的具体延迟以及与其他非流式长视频生成方法的详细对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e86. Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era（重复的批评：大语言模型时代同行评审的声明级同质化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26286\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26286\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePeer review relies on several readers finding different problems. We measure critique overlap in conference and journal reviews. At ICLR, measured overlap rose from 12.0% in 2026 to 21.3% in 2027, in reviews from the same stage of the review process, with year-on-year rises at NeurIPS, ICML and the F1000 and PLOS journals. A third ICLR review of a paper added 5.46 new problems to the other two in 2027, against 6.12 in 2026. We apply MELD, a detector of LLM-generated text, to all reviews. Within a paper, two reviews that MELD flags overlap more than two unflagged reviews: by 3.0 points at ICLR in 2024-2025, by 4.5 points in 2026-2027, and by 5.4 points across five journal sources. These results provide evidence that LLM-flagged reviews of one paper are less distinct from each other than unflagged reviews, and suggest that the diversity of critiques among reviews of a single paper is falling.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e同行评审依赖于多个读者发现不同的问题。我们测量了会议和期刊评审中的批评重叠度。在ICLR，在评审过程同一阶段的评审中，测量的重叠度从2026年的12.0%上升到2027年的21.3%，在NeurIPS、ICML以及F1000和PLOS期刊中也出现了同比上升。2027年，一篇论文的第三份ICLR评审为另外两份评审增加了5.46个新问题，而2026年为6.12个。我们将MELD（一种大语言模型生成文本的检测器）应用于所有评审。在同一篇论文中，MELD标记的两份评审的重叠度高于未标记的两份评审：在2024-2025年的ICLR中高出3.0分，在2026-2027年高出4.5分，在五个期刊来源中高出5.4分。这些结果提供了证据，表明同一篇论文的被MELD标记的评审之间的区别小于未标记的评审，并表明单篇论文评审之间批评的多样性正在下降。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e测量和分析会议及期刊同行评审中批评内容的重叠度，特别是大语言模型生成文本对评审多样性的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现ICLR等顶会及期刊的评审重叠度逐年上升。利用MELD检测器发现，被标记为LLM生成的评审之间的重叠度显著高于未被标记的评审，表明LLM的使用正在降低单篇论文评审批评的多样性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过统计数据证明了同行评审同质化的趋势，并建立了LLM生成文本与评审多样性下降之间的关联。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理应用 / 科学文本分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e87. Embeddings vs. Grep: Rethinking the Dense Advantage in Code Search（嵌入与Grep：重新思考代码搜索中的稠密优势）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20455\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20455\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode-search benchmarks show dense encoders well ahead of BM25, yet coding agents do well with grep. What does this dense advantage measure? Existing benchmarks cannot tell: they use curated queries, old code and a handicapped BM25. To find out, we build Repo-Premium, a realistic repository-level code-search benchmark. It ranks files in real repositories, with curated and raw queries in Python, JavaScript, TypeScript, Go, Rust and Java, pull requests from 2022 to 2026, and a preregistered test pool over 91 repositories. Our experiments trace the advantage to two sources: evaluation choices that favor dense retrieval, such as splitting files into chunks for BM25 and counting edited tests as relevant, and queries that lack the code\u0026#x27;s rare identifiers. Expanding the query with LLM-written identifiers (generate-then-grep) helps BM25 far more than dense retrieval, letting it match dense retrieval in every Python pool, even on pull requests opened after the LLM was released. No method we tried predicts which retriever will win on a given query. From these results we derive three guidelines: measure dense gains against a fair lexical baseline, fuse dense retrieval with BM25, and add the code\u0026#x27;s words to queries that lack them.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代码搜索基准显示稠密编码器远领先于BM25，但编码智能体使用grep表现很好。这种稠密优势衡量的是什么？现有基准无法说明：它们使用精选查询、旧代码和受限的BM25。为了找出原因，我们构建了Repo-Premium，一个真实的仓库级代码搜索基准。它对真实仓库中的文件进行排名，包含Python、JavaScript、TypeScript、Go、Rust和Java的精选和原始查询，2022年至2026年的拉取请求，以及在91个仓库上的预注册测试池。我们的实验将优势追溯到两个来源：偏向稠密检索的评估选择，例如将文件分块用于BM25以及将编辑过的测试计为相关，以及缺乏代码中罕见标识符的查询。使用LLM编写的标识符扩展查询（生成后grep）对BM25的帮助远大于对稠密检索的帮助，使其在每个Python池中匹配稠密检索，甚至在LLM发布后打开的拉取请求上也是如此。我们尝试的方法都无法预测哪种检索器会在给定查询上获胜。从这些结果中，我们得出三条指南：针对公平的词汇基线衡量稠密增益，将稠密检索与BM25融合，并将代码的词汇添加到缺乏这些词汇的查询中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究代码搜索基准中稠密编码器相对于BM25的“稠密优势”的真实来源，并构建更真实的仓库级代码搜索基准以重新评估两者性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建Repo-Premium真实仓库级代码搜索基准，涵盖多语言、多年份拉取请求及91个仓库；发现稠密优势源于偏向稠密检索的评估设置及缺乏罕见标识符的查询；提出“生成后grep”方法，利用LLM扩展查询使BM25在Python池中匹配稠密检索；提出三条代码检索评估与优化指南。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明现有基准的评估设置和查询构建夸大了稠密检索的优势，BM25在合理扩展查询后表现优异。局限性方面，摘要未提供Repo-Premium基准的具体规模细节、其他语言池的详细实验结果或该方法在工业级代码库中的实际部署局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程/信息检索/代码智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e88. Tideway: Phase-Aware Tiered Memory Management for MoE Inference on Consumer Devices（Tideway：面向消费级设备MoE推理的感知阶段分层内存管理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14848\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14848\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language model (LLM) agents are rapidly becoming a dominant paradigm for AI applications. Recently, there is a growing demand to deploy large-scale Mixture-of-Experts (MoE) models locally on consumer PCs to balance data privacy, API costs, and inference efficiency. However, unlike datacenter servers with abundant DRAM, consumer devices are tightly constrained in both GPU VRAM and host RAM, forcing massive MoE weights to spill across VRAM, host RAM, and SSD. Under such spilling, we observe that existing systems fail to fully utilize this memory hierarchy, treating the tiers as independent caches and thrashing in inference.\u003cbr\u003e  We present TIDEWAY, a system for efficient inference of large MoE models on memory-constrained consumer devices. Our core insight is to manage host RAM and GPU VRAM as a unified memory pool. Within this pool, TIDEWAY couples phase-aware memory layouts, which adapt to the distinct access patterns of prefill and decode, with an execution engine that optimizes CUDA Graph execution under expert paging. Our evaluations on representative consumer hardware with frontier MoE models demonstrate that TIDEWAY significantly outperforms state-of-the-art systems. On average, TIDEWAY achieves speedups of 1.97x in end-to-end latency and 2.40x in Time-to-First-Token (TTFT), along with 1.61x higher decode throughput against the fastest baseline.\u003cbr\u003e  Our source code is publicly available at https://github.com/Afterglow231/Tideway .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLM）代理正迅速成为AI应用的主导范式。最近，在消费级PC上本地部署大规模混合专家（MoE）模型以平衡数据隐私、API成本和推理效率的需求日益增长。然而，与拥有丰富DRAM的数据中心服务器不同，消费级设备在GPU VRAM和主机RAM方面受到严格限制，迫使大量MoE权重溢出到VRAM、主机RAM和SSD之间。在这种溢出情况下，我们观察到现有系统未能充分利用这种内存层次结构，将各层视为独立缓存并在推理中产生抖动。我们提出了TIDEWAY，一个用于在内存受限的消费级设备上高效推理大型MoE模型的系统。我们的核心见解是将主机RAM和GPU VRAM作为统一的内存池进行管理。在这个池内，TIDEWAY将感知阶段的内存布局（适应预填充和解码的不同访问模式）与在专家分页下优化CUDA Graph执行的执行引擎相结合。我们在具有前沿MoE模型的代表性消费级硬件上的评估表明，TIDEWAY显著优于最先进系统。平均而言，与最快的基线相比，TIDEWAY在端到端延迟方面实现了1.97倍的加速，在首字时间（TTFT）方面实现了2.40倍的加速，以及1.61倍的更高解码吞吐量。我们的源代码公开在 https://github.com/Afterglow231/Tideway 。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在内存受限的消费级设备上高效推理大型混合专家（MoE）模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e将主机RAM和GPU VRAM作为统一内存池管理；结合感知阶段的内存布局以适应预填充和解码的不同访问模式；执行引擎在专家分页下优化CUDA Graph执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出消费级设备内存受限导致MoE权重在VRAM、RAM和SSD间溢出，现有系统将其视为独立缓存导致抖动。TIDEWAY通过统一内存池和感知阶段的布局及CUDA Graph优化解决了此问题，并在端到端延迟（1.97倍加速）、TTFT（2.40倍加速）和解码吞吐量（1.61倍提升）上取得显著性能提升。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e系统与大模型推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e89. Decoding Without a Decoder: Direct Pixel Prediction from Diffusion Transformers（无需解码器：从扩散Transformer直接进行像素预测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22287\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22287\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLatent diffusion models rely on a decoder to map denoised latents to pixels, adding complexity and inference cost. We introduce Decoding Without a Decoder (DWD), which lets a finetuned diffusion transformer produce final pixels directly through a linear head. Unlike previous methods, where the denoising output leads to final pixels, DWD separates the two roles: the original denoising head continues to drive sampling, then the new DWD head predicts the pixels at the final step. We extend pretrained latent models with DWD efficiently by finetuning only the last few transformer blocks, training the DWD head with pixel quality losses while anchoring the denoising head to the pretrained model to preserve the sample trajectory. Across latent image and video generators, DWD removes the decoder and reduces inference cost while maintaining or even improving pixel quality. On Wan video generation, it visibly reduces detail distortion and flickering, lowering warping error by 23%. Remarkably, the same separation also improves pixel diffusion models that do not even use a decoder: a final-step DWD head produces substantially better texture detail in text-to-image generation, and improves ImageNet FID from 1.55 to 1.43, a new state of the art among pixel flow models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e潜在扩散模型依赖解码器将去噪潜在变量映射到像素，增加了复杂性和推理成本。我们引入了无需解码器（DWD），它让微调后的扩散Transformer通过线性头直接生成最终像素。与以往去噪输出直接生成最终像素的方法不同，DWD分离了这两种角色：原始去噪头继续驱动采样，然后新的DWD头在最后一步预测像素。我们通过仅微调最后几个Transformer块，使用像素质量损失训练DWD头，同时将去噪头锚定到预训练模型以保留采样轨迹，从而有效地使用DWD扩展预训练潜在模型。在潜在图像和视频生成器中，DWD移除了解码器并降低了推理成本，同时保持甚至提高了像素质量。在Wan视频生成中，它明显减少了细节失真和闪烁，将扭曲误差降低了23%。值得注意的是，相同的分离也改善了甚至不使用解码器的像素扩散模型：最后一步的DWD头在文本到图像生成中产生了明显更好的纹理细节，并将ImageNet FID从1.55提高到1.43，这是像素流模型中的最新最先进水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为无需解码器（DWD）的方法，使扩散Transformer能够通过线性头直接生成最终像素，从而移除潜在扩散模型中的解码器以降低推理成本并提升像素质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 分离去噪和像素预测角色，原始去噪头驱动采样，新的DWD线性头在最后一步直接预测像素，仅需微调最后几个Transformer块。2. 在潜在图像和视频生成中移除解码器，降低推理成本，在Wan视频生成中将扭曲误差降低23%。3. 将DWD应用于无解码器的像素扩散模型，在文本到图像生成中改善纹理细节，将ImageNet FID从1.55提升至1.43，达到像素流模型的最新最先进水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eDWD方法通过角色分离和轻量级微调，成功在降低推理成本的同时提升或保持了图像和视频的生成质量，甚至对无解码器的像素模型也有增益。然而，摘要未提供DWD头在不同分辨率或更复杂场景下的泛化能力数据，未提供仅微调最后几个Transformer块是否会导致模型在长序列或极端条件下的稳定性问题，也未提供该方法在训练阶段引入的额外计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 生成式模型 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e90. CADMAGEDDON: High-Fidelity CAD Reconstruction with Local Inference（CADMAGEDDON：具有本地推理能力的高保真CAD重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22563\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22563\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCAD practitioners often work with proprietary parts that they are unwilling to share with external services. For individuals and small companies, bringing this work in-house also requires computational resources they can afford. We introduce CADMAGEDDON, an open-source agent that reconstructs editable CAD from meshes and can run locally on single-GPU systems and current-generation laptops. The method decomposes this complex task into a chain of simple visual decisions about what to construct and what to correct. Geometric tools support precise construction, allowing the agent to focus on visual reasoning. Using the mid-sized Qwen3.8-27B model, CADMAGEDDON outperforms prior approaches, including systems based on frontier models, in reconstruction quality on all the main benchmarks. CADMAGEDDON integrates with FreeCAD, bringing its reconstructions into practitioners\u0026#x27; existing CAD workflows. Code: https://github.com/kulibinai/cadmageddon\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eCAD从业者经常处理他们不愿意与外部服务共享的专有零件。对于个人和小公司来说，将这项工作引入内部也需要他们能够负担得起的计算资源。我们引入了CADMAGEDDON，这是一个开源代理，可以从网格重建可编辑的CAD，并且可以在单GPU系统和当前一代的笔记本电脑上本地运行。该方法将这个复杂的任务分解为一系列关于构建什么和纠正什么的简单视觉决策链。几何工具支持精确的构建，使代理能够专注于视觉推理。使用中等规模的Qwen3.8-27B模型，CADMAGEDDON在所有主要基准测试的重建质量上超越了先前的方法，包括基于前沿模型的系统。CADMAGEDDON与FreeCAD集成，将其重建引入从业者现有的CAD工作流程中。代码：https://github.com/kulibinai/cadmageddon\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从网格重建可编辑的CAD模型，并在本地单GPU系统或笔记本电脑上运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出开源代理CADMAGEDDON，将复杂任务分解为简单视觉决策链；结合几何工具支持精确构建；在单GPU和笔记本上本地运行；使用Qwen3.8-27B模型在所有主要基准上超越先前方法（包括前沿模型）；与FreeCAD集成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e该方法通过分解任务和使用几何工具专注于视觉推理，解决了本地计算资源受限的问题。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机辅助设计 / 计算机视觉 / 智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e91. Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game（Re-Search：通过双人提问游戏剖析大语言模型的思想生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14487\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14487\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eResearch ideation is iterative: researchers refine their ideas step by step based on feedback. Yet existing evaluations obscure this search process, making it difficult to understand how LLMs explore the space of research ideas and what limits their progress. We introduce Re-Search, which adapts the format of Twenty Questions to research ideation: given only the research problem of a published paper, a model must rediscover the paper\u0026#x27;s core idea by asking yes-or-no questions. Built from 200 ICML 2026 papers, Re-Search tracks how a model\u0026#x27;s idea evolves as it asks questions and receives binary oracle feedback, isolating ideation from execution. Across six recent LLMs, nearly all progress happens within the first 30 of 100 questions, which largely decide how the game ends; after that, most models plateau. Through controlled interventions on the candidate questions and the hypothesis space, we find that the bottleneck is generation, not judgment: models recognize a good idea or a good question when one is offered, but often cannot produce it on their own. We further analyze the ideation traces and find that models fail by either over-exploiting one direction or over-exploring too many. These findings point to concrete design principles for autoresearch systems: since models can judge candidates they cannot produce, enriching the search with externally sourced ideas and questions may be more effective than improving any single model\u0026#x27;s generation ability.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e研究构思是迭代的：研究人员根据反馈逐步完善他们的想法。然而，现有的评估掩盖了这一搜索过程，使得难以理解 LLM 如何探索研究想法的空间以及什么限制了它们的进展。我们引入了 Re-Search，它将“二十个问题”游戏的格式应用于研究构思：在仅给出已发表论文的研究问题的情况下，模型必须通过提出是非问题来重新发现论文的核心思想。Re-Search 基于 200 篇 ICML 2026 论文构建，跟踪模型在提问和接收二元预言机反馈时想法的演变，将构思与执行隔离开来。在六个最新的 LLM 中，几乎所有进展都发生在 100 个问题中的前 30 个之内，这在很大程度上决定了游戏的结局；此后，大多数模型趋于平稳。通过对候选问题和假设空间进行受控干预，我们发现瓶颈在于生成而非判断：当提供一个好想法或好问题时，模型能够识别，但通常无法自行产生。我们进一步分析了构思轨迹，发现模型失败的原因要么是过度开发一个方向，要么是过度探索太多方向。这些发现为自动研究系统指出了具体的设计原则：由于模型能够判断它们无法产生的候选项，用外部来源的想法和问题丰富搜索可能比提高任何单一模型的生成能力更有效。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和剖析大语言模型（LLM）在研究构思（ideation）过程中的迭代搜索行为，隔离构思与执行，以理解 LLM 如何探索研究想法空间及其进展限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Re-Search 框架，通过“二十个问题”游戏格式让模型通过是非问题重构论文核心思想；发现 LLM 的构思进展主要集中在前 30 个问题内，之后趋于平稳；通过受控干预证明构思瓶颈在于生成能力而非判断能力；发现模型失败模式为过度开发单一方向或过度探索过多方向。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Re-Search 有效隔离了构思与执行，并揭示了 LLM 在想法生成中的具体瓶颈和失败模式，为自动研究系统提供了设计原则。局限性方面，摘要未提供该框架在 ICML 2026 之外其他会议或领域的泛化测试结果，未说明“外部来源想法”的具体实现和效果数据，且未提供模型在超过 100 个问题后的长期表现分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 自动研究与大语言模型评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e92. Interpreting Coding Agents Through Their Behavioral Trajectories（通过行为轨迹解释代码代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17440\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17440\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStandard coding-agent benchmarks primarily evaluate binary task success, treating execution as a black box and obscuring the behaviors that produce those outcomes. We analyze a large corpus of 143,209 execution trajectories from 125 agent configurations spanning 117 unique models. To enable comparisons across heterogeneous agent interfaces, we develop a rule-based parser that maps raw execution traces to high-level actions such as repository search, file editing, and test execution, and audit its predictions against a six-model consensus reference on 500 events. We find that agents with similar solve rates can nevertheless differ substantially in how they explore, modify and verify code. Moreover, without using task outcomes, token counts, or tool names as features, aggregate behavioral profiles retrieve the corresponding agent stack across disjoint repository sets and programming languages, although task composition is not fully controlled in the cross-repository setting. Through analyses of frontier models and agent scaffolds, we further show that scaffold choice and reasoning effort systematically shift agents\u0026#x27; search, editing, and testing behavior. We release the deterministic parser together with the full annotation and analysis pipeline alongside an annotated trajectory subset.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e标准的代码代理基准主要评估二元任务成功率，将执行视为黑盒，从而掩盖了产生这些结果的行为。我们分析了一个包含 143,209 条执行轨迹的大型语料库，这些轨迹来自跨越 117 个独特模型的 125 种代理配置。为了实现跨异构代理接口的比较，我们开发了一个基于规则的解析器，将原始执行轨迹映射到高级操作（如仓库搜索、文件编辑和测试执行），并在 500 个事件上根据六模型共识参考对其预测进行了审计。我们发现，具有相似解决率的代理在探索、修改和验证代码的方式上仍可能存在显著差异。此外，在不使用任务结果、token 数量或工具名称作为特征的情况下，聚合行为特征可以在不相交的仓库集和编程语言中检索出相应的代理堆栈，尽管在跨仓库设置中任务组合未得到完全控制。通过对前沿模型和代理脚手架的分析，我们进一步表明，脚手架的选择和推理工作量会系统地改变代理的搜索、编辑和测试行为。我们发布了该确定性解析器以及完整的注释和分析流程，并附带了一个注释的轨迹子集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e分析和解释代码代理的执行行为轨迹，以超越传统的二元任务成功率评估，揭示产生结果的具体行为模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了包含 143,209 条轨迹的大型语料库，并开发了基于规则的解析器将原始轨迹映射为高级操作；发现解决率相似的代理在探索、修改和验证代码的行为上存在显著差异；聚合行为特征能够在不使用任务结果等特征的情况下跨仓库和语言检索代理堆栈；证明脚手架选择和推理工作量会系统性地改变代理行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明通过行为轨迹可以深入理解代码代理的内部机制，且行为特征具有跨域检索能力。局限性方面，摘要未提供在跨仓库设置中完全控制任务组合的方法，未提供该解析器在其他未测试代理接口上的泛化能力数据，也未提供行为差异如何具体指导代理架构优化的实验结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 代码代理与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e93. BLIP-Live: Balancing Timeliness \u0026amp; Firing Precision in Proactive Streaming Video Agents（BLIP-Live：在主动流式视频智能体中平衡及时性与触发精度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21553\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21553\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video understanding is becoming increasingly important for real-world interactive systems. Such systems must be proactive for natural and useful human interaction: they should respond as soon as sufficient evidence becomes available while avoiding premature, redundant, or incorrect responses. We present BLIP-Live, a framework unifying data, metrics, harness, and training around a shared formulation of proactivity as effective causal response decisions balancing the two competing objectives of responding vs silence. First, we construct BLIP-Live-780K dataset containing human annotations of proactive response content and timing, which defines this desired behavior. We then propose PAUC-F, a metric to effectively measure our desired proactive behavior. PAUC-F combines existing response timeliness metrics with firing precision to reward early useful responses without rewarding excessive firing. With our desired behavior defined and measurable, we finally investigate model-agnostic inference harnesses that draw out proactive streaming capabilities of offline vision language models (VLMs), together with training pipelines that learn to further improve their proactive responsiveness. Across both settings, we find that combinations of sliding visual windows, online interaction memory, and structured response outputs consistently yield strongest proactive performance. Our experiments result in two models, with our BLIP-Live-Qwen model achieving state-of-the-art performance across four proactive streaming benchmarks, with gains up to 44% over baselines and outperforming multiple closed API models. Our code and data will be released publicly.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频理解对于现实世界的交互式系统正变得越来越重要。这些系统必须是主动的，以实现自然和有用的人机交互：它们应该在有充分证据可用时立即做出响应，同时避免过早、冗余或不正确的响应。我们提出了BLIP-Live，一个围绕将主动性表述为平衡响应与沉默这两个竞争目标的有效因果响应决策的共享公式，来统一数据、指标、框架和训练的框架。首先，我们构建了BLIP-Live-780K数据集，其中包含人类对主动响应内容和时间的注释，这定义了这种期望的行为。然后我们提出PAUC-F，一种有效测量我们期望的主动行为的指标。PAUC-F将现有的响应及时性指标与触发精度相结合，以奖励早期的有用响应而不奖励过度触发。在定义和可测量我们期望的行为之后，我们最终研究了提取离线视觉语言模型（VLMs）主动流式能力的与模型无关的推理框架，以及学习进一步提高其主动响应能力的训练管道。在这两种设置中，我们发现滑动视觉窗口、在线交互记忆和结构化响应输出的组合始终产生最强的主动性能。我们的实验产生了两个模型，我们的BLIP-Live-Qwen模型在四个主动流式基准测试中实现了最先进的性能，比基线高出高达44%，并超越了多个闭源API模型。我们的代码和数据将公开发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提升流式视频理解系统在交互式应用中的主动性，使其能够在证据充分时及时响应，同时避免过早、冗余或错误的响应，平衡及时性与触发精度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 BLIP-Live 框架，统一数据、
