    <h1>AI 技术周报 - 2026-W47</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 每周论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks（从TeleChat到Xing4：在国产芯片和框架上推进前沿智能体模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 167 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22115\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22115\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation, memory access, and execution overhead. Our pretraining infrastructure builds on MindSpore HyperParallel, combining topology-aware hybrid sharding, efficient distributed optimizer execution, and coordinated management of long-sequence workloads and activation memory. CPU affinity and core isolation further reduce host scheduling interference. Together, these mechanisms support the pretraining of a 285B-parameter model on 8,192 Ascend 910C cards, providing a concrete setting for the architectural and systems studies. For post-training, we introduce TeleGym, a unified agent execution platform that connects execution, evaluation, and trajectory construction to policy optimization. Disaggregated asynchronous execution, bounded oversampling, and partial rollout accommodate heterogeneous task durations while preserving trajectory continuity across policy updates. Together, these advances establish an Ascend-oriented training foundation for the continued development of Xing 4 across model scales and increasingly demanding reasoning and agent workloads.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了 Xing 4，这是一系列大型语言模型，通过在昇腾上协调推进模型架构和训练基础设施，扩展了 TeleChat 的血脉。本报告描述了该系列背后的设计原则和系统工程，涵盖架构选择、大规模预训练以及推理和智能体后训练。我们研究了稀疏激活、注意力设计、模型深度和宽度以及推测解码如何平衡模型容量与计算、内存访问和执行开销。我们的预训练基础设施建立在 MindSpore HyperParallel 之上，结合了拓扑感知的混合分片、高效的分布式优化器执行，以及对长序列工作负载和激活内存的协调管理。CPU 亲和性和核心隔离进一步减少了主机调度干扰。这些机制共同支持在 8192 张昇腾 910C 卡上预训练一个 2850 亿参数的模型，为架构和系统研究提供了具体的环境。对于后训练，我们引入了 TeleGym，这是一个统一的智能体执行平台，将执行、评估和轨迹构建连接到策略优化。解耦的异步执行、有界过采样和部分展开适应了异构的任务持续时间，同时在策略更新中保持了轨迹的连续性。这些进展共同为 Xing 4 在模型规模以及日益复杂的推理和智能体工作负载方面的持续开发奠定了面向昇腾的训练基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在国产昇腾芯片和框架上设计和训练大型语言模型（Xing 4系列），包括架构选择、大规模预训练基础设施以及推理和智能体后训练平台。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 Xing 4 系列模型，在昇腾 910C 上支持 2850 亿参数模型的预训练。2. 预训练基础设施基于 MindSpore HyperParallel，结合拓扑感知混合分片等技术优化计算和内存。3. 引入 TeleGym 统一智能体执行平台，支持解耦异步执行和部分展开等机制以适应异构任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：摘要详细描述了在昇腾硬件上的系统工程和架构设计，展示了在国产芯片上训练超大参数模型的能力。然而，摘要未提供模型在具体下游任务上的性能评估结果、与其他开源或闭源模型的对比数据，也未提及训练成本、时间或具体的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型与系统基础设施\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent（Gamer：用于长视野实时游戏智能体的通用视觉-语言-动作基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 156 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18397\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18397\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning. A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces and complex 3D simulated worlds. We first continue pre-training on a dataset constructed from tens of thousands of hours of device-level keyboard and mouse interaction. These trajectories span simulated games and embodied environments, allowing the model to learn environmental dynamics across both physical and virtual domains. Sparse-thinking instruction tuning then substantially reduces redundant computation while preserving the reasoning needed for complex decisions. We train the policy for long-horizon interaction with a stable multi-turn reinforcement learning method that addresses finite context windows, accumulated rollout errors, and sparse rewards. For real-time interaction, a cloud-edge inference engine serves numerous simulated game environments concurrently, supports unbounded-context execution, and keeps online inference latency low. Across multiple challenging 3D open-world games, Gamer demonstrates solid generalization and operational efficiency comparable to skilled players. It also achieves competitive results on a range of conventional 2D game benchmarks. These results suggest that even repetitive keyboard and mouse trajectories can support substantial gains from scaling data and learning algorithms. Training on these trajectories helps Gamer learn complex skills more steadily in environments with both physical and digital properties. This approach offers a path toward generalist agents that can interact across digital and physical worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们引入了Gamer，一个为复杂交互环境中的长视野任务构建的通用智能体框架。其端到端架构结合了感知、记忆管理和多步推理。共享的训练和部署管道支持与传统的2D图形界面和复杂的3D模拟世界进行交互。我们首先在一个由数万小时设备级键盘和鼠标交互构建的数据集上继续进行预训练。这些轨迹跨越模拟游戏和具身环境，使模型能够学习物理和虚拟领域的环境动态。随后，稀疏思维指令微调大幅减少了冗余计算，同时保留了复杂决策所需的推理能力。我们使用一种稳定的多轮强化学习方法训练长视野交互策略，该方法解决了有限的上下文窗口、累积的展开误差和稀疏奖励问题。为了进行实时交互，云边缘推理引擎同时服务于众多模拟游戏环境，支持无界上下文执行，并保持较低的在线推理延迟。在多个具有挑战性的3D开放世界游戏中，Gamer展示了稳固的泛化能力和与熟练玩家相当的运行效率。它还在一系列传统的2D游戏基准测试中取得了具有竞争力的结果。这些结果表明，即使是重复的键盘和鼠标轨迹也能支持从数据和学习算法扩展中获得实质性收益。在这些轨迹上进行训练有助于Gamer在具有物理和数字属性的环境中更稳定地学习复杂技能。这种方法为能够跨数字和物理世界交互的通用智能体提供了一条路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个用于复杂交互环境中长视野任务的通用智能体框架（Gamer），结合视觉、语言、动作，支持2D和3D环境交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出端到端架构，结合感知、记忆管理和多步推理，支持2D和3D环境。2. 利用数万小时键鼠交互数据进行预训练，并采用稀疏思维指令微调减少冗余计算。3. 提出稳定的多轮强化学习方法解决上下文窗口、累积误差和稀疏奖励问题。4. 设计云边缘推理引擎实现低延迟实时交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了Gamer在3D开放世界游戏和2D游戏基准上的泛化能力和运行效率。局限性方面，摘要提到多轮强化学习需要解决有限上下文窗口、累积展开误差和稀疏奖励问题，且重复的键鼠轨迹可能存在局限，但通过数据扩展获得了收益。摘要未提供具体的基准测试名称、具体的数值指标（如胜率、得分）以及具体的模型参数量等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/游戏智能体/多模态基础模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. Jeveration: System One Models Now Generate（Jeveration：系统一模型现可生成图像）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 152 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24738\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24738\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSystem One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent whole. We therefore condition all positions on a shared random state to coordinate parallel predictions, so that each draw yields a different but coherent image. Since the model tends to ignore this state under direct image supervision, we first learn a distribution over discrete image codes to guide single-pass generation. Beyond text-to-image generation, we further unify image-to-image generation and dense prediction within the same architecture, so that one checkpoint supports all three tasks, each in one forward pass. Experiments show that Jeveration generates a 512x512 image in 78 ms, up to 122x faster than existing unified models, while maintaining competitive image quality and dense prediction performance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e诸如Jev之类的系统一模型通过快速、并行的预测返回决策。在本文中，我们介绍了Jeveration，展示了相同的决策范式也可以在单次前向传播中生成高质量图像。Jeveration构建于冻结的视觉-语言模型之上，将其视觉-语义知识重新用于整体图像生成。关键挑战在于保持全局一致性。单个提示允许许多有效的图像，但并行预测必须收敛于一个连贯的整体。因此，我们将所有位置条件化于共享的随机状态以协调并行预测，使得每次抽取都能产生不同但连贯的图像。由于该模型在直接图像监督下倾向于忽略该状态，我们首先学习离散图像代码上的分布以引导单次生成。除了文本到图像的生成，我们进一步在同一架构内统一了图像到图像的生成和密集预测，使得一个检查点支持所有三种任务，且每种任务都在单次前向传播中完成。实验表明，Jeveration在78毫秒内生成512x512的图像，比现有的统一模型快达122倍，同时保持了具有竞争力的图像质量和密集预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在单次前向传播中生成高质量图像，并统一文本到图像生成、图像到图像生成和密集预测任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Jeveration，利用冻结的视觉-语言模型在单次前向传播中生成高质量图像。2. 通过将位置条件化于共享随机状态来协调并行预测，保持全局一致性。3. 学习离散图像代码分布以引导单次生成，解决直接图像监督下模型忽略随机状态的问题。4. 统一架构支持文本到图像、图像到图像和密集预测三种任务。5. 生成512x512图像仅需78毫秒，比现有统一模型快达122倍，且保持竞争力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Jeveration在速度和多任务统一上具有显著优势。然而，摘要未提供关于模型参数量、具体视觉-语言模型基座、以及在不同复杂提示下图像质量的具体量化评估细节。此外，摘要未提及该模型在生成复杂空间关系或长文本提示时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与多模态生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. Envisioning Agentic Robotics: A New Era of Robotic Systems（展望智能体机器人：机器人系统的新纪元）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 141 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18359\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18359\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy. Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework, or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore, we identify the principles that carry over from digital to physical agents and the challenges that must be addressed to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively broader responsibility, from executing individual primitives to fulfilling standing roles.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eGPT-6 Astra的发布标志着机器人学中新范式的出现：智能体机器人。在几周内，配备智能体控制装置的前沿模型在许多具身基准测试中匹配或超过了特定任务策略。智能体机器人系统不再为每个任务族训练专用策略，而是将基础模型应用于开放世界具身任务。它在一个闭环中运行：观察环境、解释用户意图、对任务进行推理、调用技能和工具、验证结果并调整其策略。尽管取得了这些进展，社区尚未在共享定义、可靠的评估框架或研究路线图上达成共识。我们认为，由基础模型和具身控制装置共同实现的“具身系统2”构成了智能体机器人的决策核心。其核心挑战是在有限的反应时间、机械限制、不可预测的环境变化和不可逆后果等物理约束下，将通用推理转化为有效且可验证的动作。基于这一视角，我们提出了一个评估框架，用于衡量模型能力和闭环系统性能。此外，我们确定了从数字智能体转移到物理智能体的原则，以及实现可靠物理自主性必须解决的挑战。在“具身系统2”和评估框架的基础上，我们展望了通向持续自主性的研究路线图：以逐渐扩大的责任安全、可靠地执行工作的能力，从执行单个原语到履行固定角色。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出智能体机器人的定义、核心概念（具身系统2）、评估框架以及通向持续自主性的研究路线图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出“具身系统2”作为智能体机器人的决策核心概念。2. 提出衡量模型能力和闭环系统性能的评估框架。3. 识别从数字到物理智能体的迁移原则及实现物理自主性的挑战。4. 提出通向持续自主性的研究路线图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种概念框架（具身系统2）和评估框架，并规划了研究路线图。局限性方面，摘要指出社区尚未在共享定义、可靠评估框架或研究路线图上达成共识，且核心挑战在于物理约束（反应时间、机械限制等）下的动作转化。摘要未提供具体的实验结果、数字、数据集或具体的技术实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. InclusionMed: Benchmarking AI for Inclusive Healthcare（InclusionMed：面向包容性医疗的 AI 基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 104 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21218\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21218\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAdvancing medical AI for inclusive healthcare requires evaluation across diverse healthcare roles, tasks, and care settings, but benchmark coverage remains uneven. We introduce InclusionMed, an open medical AI evaluation initiative for inclusive healthcare. The InclusionMed Atlas organizes benchmarks across three healthcare roles and three AI capabilities. For the first release, we selected four public benchmarks from 388 candidates through structured audits and independent reproduction. With InclusionMed-DxFiles, our private diagnostic reasoning benchmark, the Atlas contains five benchmarks covering three of its nine role--capability cells. We evaluated frontier large language models on the Atlas and aggregated their results into the InclusionMed Index, with overall scores ranging from 17.5 to 49.1 out of 100. The Index also reports scores by healthcare role and AI capability, showing that a model\u0026#x27;s rank varied with the role or capability considered. A within-benchmark analysis using task-level tags showed that the ten highest-ranked models in the Index all scored higher on patient communication than on clinical decision-making. Models with similar Index scores also differed substantially in estimated inference cost. These findings highlight the need for evaluation covering more diverse healthcare needs and for context-specific model selection. Through open collaboration and community contributions, InclusionMed seeks to ensure that diverse healthcare needs worldwide shape how medical AI progress is defined and measured.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推进包容性医疗的医疗 AI 需要跨不同的医疗角色、任务和护理环境进行评估，但基准测试的覆盖范围仍然不均匀。我们引入了 InclusionMed，一项面向包容性医疗的开放医疗 AI 评估倡议。InclusionMed Atlas 组织了跨越三个医疗角色和三个 AI 能力的基准测试。在首次发布中，我们通过结构化审计和独立复制从 388 个候选基准中选择了四个公共基准。结合我们的私有诊断推理基准 InclusionMed-DxFiles，Atlas 包含五个基准测试，涵盖了其九个角色-能力单元中的三个。我们在 Atlas 上评估了前沿大型语言模型，并将其结果汇总为 InclusionMed 指数，总体得分在 100 分中介于 17.5 到 49.1 之间。该指数还报告了按医疗角色和 AI 能力划分的得分，表明模型的排名随所考虑的角色或能力而变化。使用任务级标签的基准内分析表明，指数中排名前十的模型在患者沟通方面的得分均高于临床决策。具有相似指数得分的模型在估计推理成本上也存在显著差异。这些发现强调了需要涵盖更多样化医疗需求的评估以及针对特定上下文的模型选择。通过开放协作和社区贡献，InclusionMed 致力于确保全球多样化的医疗需求能够塑造医疗 AI 进步的定义和衡量方式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e面向包容性医疗的医疗 AI 评估与基准测试\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 推出InclusionMed开放医疗AI评估倡议及InclusionMed Atlas。2. 从388个候选中筛选出4个公共基准，并结合私有基准InclusionMed-DxFiles，涵盖3个医疗角色和3个AI能力。3. 提出InclusionMed指数，前沿大模型总体得分介于17.5至49.1之间。4. 发现模型排名随角色或能力变化，且高分模型在患者沟通上得分高于临床决策，相似得分模型的推理成本差异显著。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了InclusionMed在填补包容性医疗AI评估空白方面的努力，揭示了当前模型在不同医疗角色和能力上的表现差异及成本差异。局限性：摘要未提供所选公共基准测试的具体名称、模型在特定医疗角色上的具体得分细节、以及该指数在真实临床环境中的实际验证结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/医疗AI与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Sage S2.1 Flash Technical Report（Sage S2.1 Flash 技术报告）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 102 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21072\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21072\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Sage S2.1 Flash, a 320-billion-parameter general-purpose mixture-of-experts model designed to reason over scientific evidence and act in interactive environments. Sage Sci-Perception uses dedicated encoders for molecular graphs and biological sequences and represents spectra as ordered patches of measurements. Modality-specific projectors map these representations into the input space of a shared backbone, which processes them alongside text and images. To develop the model\u0026#x27;s agent capabilities, we construct verifiable environments for tool use, search, and coding, as well as specialized workflows involving machine learning experiments and scientific software. Task completion is checked against execution results, changes in environment state, or submitted artifacts. We evaluate Sage S2.1 Flash on 33 benchmarks across seven domains. In the primary comparison against five baselines, it ranks first on OfficeQA Pro (72.2), MLE-bench Lite (90.3 HumanRank), Harvey LAB, and SpreadsheetBench 2, and second on OSWorld-Verified (85.2), WebArena-Verified (67.6), and DeepResearch Bench II (54.2). These results show particular strengths in using documentary evidence, producing verifiable workbooks, and carrying out machine learning tasks, alongside competitive performance in desktop and browser workflows that require the model to act on visual feedback.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们推出了 Sage S2.1 Flash，这是一个拥有 3200 亿参数的通用混合专家模型，旨在对科学证据进行推理并在交互式环境中采取行动。Sage Sci-Perception 使用专用的分子图和生物序列编码器，并将光谱表示为有序的测量值补丁。特定模态的投影器将这些表示映射到共享骨干网络的输入空间，该骨干网络将它们与文本和图像一起进行处理。为了开发该模型的智能体能力，我们构建了用于工具使用、搜索和编码的可验证环境，以及涉及机器学习实验和科学软件的专业工作流。任务完成情况会根据执行结果、环境状态的变化或提交的工件进行检查。我们在七个领域的 33 个基准测试上评估了 Sage S2.1 Flash。在与五个基线的主要比较中，它在 OfficeQA Pro（72.2）、MLE-bench Lite（90.3 HumanRank）、Harvey LAB 和 SpreadsheetBench 2 上排名第一，并在 OSWorld-Verified（85.2）、WebArena-Verified（67.6）和 DeepResearch Bench II（54.2）上排名第二。这些结果表明，该模型在使用文献证据、生成可验证的工作簿以及执行机器学习任务方面具有特殊优势，同时在需要模型根据视觉反馈采取行动的桌面和浏览器工作流中也具有竞争力的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发并评估一个用于科学证据推理和交互式环境操作的通用混合专家模型（Sage S2.1 Flash），并构建可验证的智能体环境。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出3200亿参数的通用混合专家模型Sage S2.1 Flash，支持分子图、生物序列和光谱等多模态科学数据处理。2. 构建了用于工具使用、搜索、编码及机器学习实验的可验证智能体环境。3. 在33个基准测试的7个领域中表现优异，在OfficeQA Pro等4个基准中排名第一，在OSWorld-Verified等3个基准中排名第二。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该模型在多模态科学推理和智能体任务中取得了显著的性能提升。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 多模态大模型与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs（AscendGYM：面向昇腾 NPU 真实工作负载的成本感知内核优化基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 94 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17621\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17621\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eKernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whose data types and tensor shapes are collected from real-world training and inference tasks. Consequently, performance improvements on AscendGYM map directly to the corresponding workloads. In terms of usability, two evaluation modes are supported in AscendGYM: model evaluation and model-harness evaluation. The kernel optimization capabilities of both trained models and custom agents are allowed to be measured. It provides a complete execution environment that closely reproduces how Ascend kernels are invoked in practical pipelines. For model evaluation, it additionally includes a built-in harness equipped with search orchestration and experience accumulation. Finally, we propose a new metric, the Speedup-Token Score (STS), which quantifies performance gains relative to token cost. By jointly considering speedup and cost, STS enables the assessment of practical kernel optimization capability of a model or harness under an acceptable budget. AscendGYM is available at https://github.com/SLAI-AITP/AscendGYM.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e内核优化对于在昇腾 NPU 上高效进行大型语言模型训练和推理至关重要。现有的昇腾内核基准主要关注内核生成，较少强调智能体在从真实工作负载中提取的输入配置下优化现有实现的能力。为了满足这一需求，我们引入了 AscendGYM，其初始套件包含三个难度级别的 48 个内核。每个内核都配有测试用例，其数据类型和张量形状收集自真实的训练和推理任务。因此，AscendGYM 上的性能提升直接映射到相应的工作负载。在可用性方面，AscendGYM 支持两种评估模式：模型评估和模型-工具评估。允许测量训练模型和自定义智能体的内核优化能力。它提供了一个完整的执行环境，紧密重现了在实际管道中调用昇腾内核的方式。对于模型评估，它还额外包含一个内置工具，配备搜索编排和经验积累。最后，我们提出了一种新的指标，即加速-令牌分数（STS），它量化了相对于令牌成本的性能增益。通过同时考虑加速和成本，STS 能够在可接受的预算下评估模型或工具的实际内核优化能力。AscendGYM 可在 https://github.com/SLAI-AITP/AscendGYM 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个用于评估和优化昇腾 NPU 上真实工作负载内核优化能力的基准测试集（AscendGYM），并提出一种成本感知的评估指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 AscendGYM 基准，包含 48 个内核，数据类型和张量形状源自真实训练和推理任务。2. 支持模型评估和模型-工具评估两种模式，提供紧密重现实际调用环境的完整执行环境。3. 提出加速-令牌分数（STS）指标，量化相对于令牌成本的性能增益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：摘要提供了一个针对昇腾 NPU 的内核优化基准，强调了真实工作负载和成本感知。然而，摘要未提供使用该基准评估具体模型或智能体后的实验结果、性能提升的具体数字，也未说明该基准在评估不同模型时的具体表现或局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e基准测试与系统评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. K2-Horizon: A Frontier Fleet of Open Source Language Models（K2-Horizon：开源语言模型的前沿舰队）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 92 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21003\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21003\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with strong open models of their size on agentic and coding benchmarks. On the modeling side, to strengthen reasoning, we introduce Mixture-of-Value Attention (MoVA), applying MoE to attention value projections, and softplus attention gating, a more flexible, theoretically motivated gate. Our 36B-A4B model uses both and nearly matches a 32B dense model trained on the same data, with one-seventh the active parameters. We also introduce Uno, lossless diffusion adapters that speed up decoding by up to 2.2x without a separate draft model. Our release follows the LLM360 definition of open source for transparency and reproducibility: the full development history, including intermediate checkpoints from every training stage, pre-training data, training logs, and all training, evaluation, and infrastructure code, notably our production-scale xLLM framework for dense and MoE training and the RL360 reinforcement-learning stack. Beyond the data itself, we release and document in detail every pipeline that built it, the part of model development that open releases most rarely disclose. These pipelines produced roughly 10T synthetic pre-training tokens, showing that synthetic data can be a major ingredient of pre-training at scale. Four of the models share one 22T-token pre-training corpus and recipe, revealing consistent scaling behavior and enabling controlled studies of scale and sparsity. All artifacts are available at https://ifm.ai/k2/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们推出了 K2-Horizon，这是一个包含六个完全开源语言模型的舰队，从 0.9B 的密集模型到 375B-A23B 的混合专家模型，专为数学和科学、软件工程、深度研究、办公自动化等领域的通用推理和智能体工作而构建。这些模型在智能体和编码基准测试中领先或与其规模强大的开源模型具有竞争力。在建模方面，为了加强推理能力，我们引入了价值混合注意力（MoVA），将混合专家应用于注意力值投影，以及 softplus 注意力门控，这是一种更灵活、有理论动机的门控。我们的 36B-A4B 模型同时使用了这两种技术，在活跃参数仅为七分之一的情况下，几乎匹配了在相同数据上训练的 32B 密集模型。我们还引入了 Uno，这是一种无损扩散适配器，无需单独的草稿模型即可将解码速度提高多达 2.2 倍。我们的发布遵循 LLM360 对开源的定义，以确保透明度和可重复性：完整的开发历史，包括每个训练阶段的中间检查点、预训练数据、训练日志以及所有训练、评估和基础设施代码，特别是我们用于密集和混合专家训练的生产规模 xLLM 框架和 RL360 强化学习堆栈。除了数据本身，我们还发布并详细记录了构建数据的每个管道，这是开源发布中最少披露的模型开发部分。这些管道产生了大约 10T 个合成预训练 token，表明合成数据可以成为大规模预训练的主要成分。其中四个模型共享一个 22T token 的预训练语料库和配方，揭示了一致的缩放行为，并能够对缩放和稀疏性进行受控研究。所有工件均可在 https://ifm.ai/k2/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通用推理与智能体任务（涵盖数学、科学、软件工程、深度研究、办公自动化等）\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发布包含6个完全开源语言模型的K2-Horizon舰队（0.9B至375B-A23B）。2. 提出价值混合注意力（MoVA）和softplus注意力门控以增强推理。3. 引入Uno无损扩散适配器，解码速度提升高达2.2倍。4. 完全开源开发历史、数据、代码及构建管道，生成约10T合成预训练token。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了模型架构创新及极高的开源透明度，并证明了合成数据在大规模预训练中的有效性。局限性：摘要未提供模型在特定非智能体基准上的具体表现数字、推理延迟的具体对比数据以及模型在长文本或特定垂直领域的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自然语言处理与开源大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender（VibePrevisBench：评估Blender中4D场景生成的智能体编码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 87 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15789\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15789\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eControllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including scripts, photos, continuations, and reference videos. Each delivery is scored along two evaluation dimensions. Rule-based Scene Check re-runs the code and compares the exported 4D scene with hidden ground truth facts in nine dimensions. VLM-based Screen Check asks a VLM judge whether the facts that pass can be recognized in the proxy video. We analyze the evaluation results and trajectories of 11 frontier coding agents and identify three key observations. First, multimodal understanding separates the agents, especially in understanding space and camera motion. Second, all agents seem to already master basic camera work and staging, and fail at challenging requests. Third, agents inspect their own renders but fail to correct their errors. Agents thus need better visual understanding of space and camera, explicit checks for challenging requests, and item-by-item verification of renders against the brief.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e可控的真实世界视频生成模型可以以渲染的灰盒代理视频为条件，从而固定布局、运动和相机。编码智能体可以通过在Blender中重建4D场景来构建此类视频，但目前还没有基准测试同时检查这些视频及其背后的长篇幅、多镜头场景。我们引入了VibePrevisBench，一个用于4D场景重建的基准测试：智能体将简报转化为可执行的4D场景并渲染其代理视频。其242个任务涵盖四种输入类型，包括脚本、照片、续集和参考视频。每次交付沿两个评估维度进行评分。基于规则的场景检查重新运行代码，并将导出的4D场景与九个维度的隐藏地面真实事实进行比较。基于VLM的屏幕检查要求VLM评判者判断通过的事实是否可以在代理视频中被识别。我们分析了11个前沿编码智能体的评估结果和轨迹，并确定了三个关键观察结果。首先，多模态理解将智能体区分开来，特别是在理解空间和相机运动方面。其次，所有智能体似乎已经掌握了基本的相机工作和场面调度，但在具有挑战性的请求上失败了。第三，智能体检查自己的渲染但未能纠正其错误。因此，智能体需要更好的空间和相机视觉理解、对挑战性请求的显式检查，以及将渲染与简报进行逐项验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出VibePrevisBench基准测试，用于评估编码智能体在Blender中进行4D场景重建和代理视频渲染的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出VibePrevisBench，包含242个任务，涵盖脚本、照片、续集和参考视频四种输入。2. 采用基于规则的场景检查（9个维度）和基于VLM的屏幕检查双重评估维度。3. 评估了11个前沿编码智能体，发现多模态理解（特别是空间和相机运动）是区分智能体的关键。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要分析了11个前沿编码智能体在242个任务上的表现，指出智能体掌握了基本相机工作但在挑战性请求上失败，且无法纠正自身渲染错误。局限性方面，摘要明确指出智能体缺乏对空间和相机的良好视觉理解，缺乏对挑战性请求的显式检查，以及缺乏逐项验证能力。摘要未提供具体的准确率数值、具体智能体名称或具体的失败案例细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成/基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data（AllocFlow：从原始市场数据端到端生成投资组合交易动作）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 71 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19937\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19937\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReal-world portfolio management requires converting noisy market observations into coordinated, simultaneous allocations across multiple assets under shared capital constraints. Advances in forecasting models and alpha discovery help identify opportunities. However, traditional pipelines often decouple signal forecasting from portfolio construction, potentially misaligning learning with allocation and execution objectives. We present AllocFlow, an end-to-end flow-matching framework that directly generates joint portfolio allocations from raw multi-asset market histories. To capture dependencies among portfolio positions, AllocFlow employs a cross-asset flow Transformer conditioned on temporal market representations to generate continuous, signed position weights across all instruments jointly. To address the sample inefficiency and instability of learning continuous allocation policies from scratch, we establish a two-stage training scheme: strategy-supervised imitation shapes a structured distribution of candidate portfolios, followed by group-relative reinforcement learning (RL) that refines joint decisions using portfolio-level financial rewards and a frozen policy reference. On hourly cryptocurrency perpetual futures, RL refinement raises the annualized net return of the imitation policy from 27.79% to 51.38% and its Calmar ratio from 0.955 to 4.043, surpassing the teacher strategy on every metric, and AllocFlow reaches a Calmar ratio of 4.90 on six further months of unseen 2026 data without retraining.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e现实世界的投资组合管理需要将嘈杂的市场观察结果转化为在共享资本约束下跨多个资产的协调、同步分配。预测模型和 alpha 发现的进步有助于识别机会。然而，传统管道通常将信号预测与投资组合构建解耦，这可能导致学习与分配和执行目标不一致。我们提出了 AllocFlow，这是一个端到端的流匹配框架，可直接从原始多资产市场历史中生成联合投资组合分配。为了捕捉投资组合头寸之间的依赖关系，AllocFlow 采用以时间市场表示为条件的跨资产流 Transformer，以联合生成所有工具的连续、有符号头寸权重。为了解决从头开始学习连续分配策略时的样本低效和不稳定性问题，我们建立了一个两阶段训练方案：策略监督模仿塑造候选投资组合的结构化分布，随后是组相对强化学习（RL），它使用投资组合级别的财务奖励和冻结的策略参考来完善联合决策。在每小时加密货币永续期货上，RL 细化将模仿策略的年化净收益率从 27.79% 提高到 51.38%，其 Calmar 比率从 0.955 提高到 4.043，在每个指标上都超过了教师策略，并且 AllocFlow 在六个月未见过的 2026 年数据上无需重新训练即可达到 4.90 的 Calmar 比率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e现实世界投资组合管理与多资产联合分配\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出端到端流匹配框架AllocFlow，直接从原始多资产市场历史生成联合投资组合分配。2. 采用跨资产流Transformer捕捉头寸依赖关系。3. 设计两阶段训练方案：策略监督模仿结合组相对强化学习（RL）。4. 在加密货币永续期货上，RL细化使年化净收益率提升至51.38%，Calmar比率提升至4.043，并在未见数据上达到4.90的Calmar比率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了AllocFlow在解决信号预测与投资组合构建解耦问题上的有效性，通过两阶段训练显著提升了财务指标。局限性：摘要未提供该框架在其他资产类别上的表现、交易成本的具体扣除细节、最大回撤的具体数值以及模型在极端市场条件下的鲁棒性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/金融科技与量化交易\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. MIRIX-2.0: Multi-Agent Memory System（MIRIX-2.0：多智能体记忆系统）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 57 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12068\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12068\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLong-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest baseline by 14.3 points, and with AutoDream disabled it gains 31.0 and 22.0 points over HyperMem on single-hop and multi-hop document QA. As procedural memory, it yields the highest mean success among the compared memory methods on ALFWorld and WebShop and reaches 49.2% on MetaClaw-Bench, against 44.0% for MetaClaw\u0026#x27;s skill library. Six typed memory agents keep complete records as the system of record, and a provenance hypergraph indexes episodic and semantic records with n-ary frames that cite their rows. Retrieval runs under explicit budgets, so the evidence a question inspects does not grow with the history. AutoDream merges duplicate anchors outside the write path without rewriting any record, and it distills task sessions into skills. With AutoDream disabled, MIRIX-2.0 answers faster than HyperMem on all five timed benchmarks. It needs no fine-tuning, runs with closed and open models, and its code is public.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e长期记忆使LLM智能体能够个性化、保持一致性并重用以前有效的方法。参数化记忆需要训练，整合可能会永久丢失细节，而保留每条记录会留下一个不断增长的需要搜索的存储库。我们提出了MIRIX-2.0，一个旨在同时兼顾实用性、准确性和高效性的多智能体记忆系统。在五个问答基准中的四个上，它是所比较系统中最准确的。它在LoCoMo上达到91.4%，在LongMemEval-S上达到72.6%，比最强基线领先14.3分，并且在禁用AutoDream的情况下，它在单跳和多跳文档问答上比HyperMem分别高出31.0分和22.0分。作为程序性记忆，它在ALFWorld和WebShop上产生了所比较记忆方法中最高的平均成功率，并在MetaClaw-Bench上达到49.2%，而MetaClaw的技能库为44.0%。六个类型化记忆智能体保留完整记录作为记录系统，并且一个来源超图使用引用其行的n元框架对情景和语义记录进行索引。检索在明确的预算下运行，因此问题检查的证据不会随着历史记录的增长而增长。AutoDream在写入路径之外合并重复的锚点而不重写任何记录，并将任务会话提炼为技能。在禁用AutoDream的情况下，MIRIX-2.0在所有五个计时基准上的回答速度都比HyperMem快。它不需要微调，可与封闭和开放模型一起运行，并且其代码是公开的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出MIRIX-2.0多智能体记忆系统，旨在解决LLM智能体长期记忆中的实用性、准确性和效率问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在5个QA基准中的4个上达到最高准确率（LoCoMo 91.4%，LongMemEval-S 72.6%）。2. 在ALFWorld和WebShop上平均成功率最高，在MetaClaw-Bench上达到49.2%。3. 采用6个类型化记忆智能体和来源超图进行索引，检索在明确预算下运行。4. 提出AutoDream机制合并重复锚点并提炼技能，禁用时回答速度仍快于HyperMem。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的实验结果，证明MIRIX-2.0在多个基准测试（LoCoMo, LongMemEval-S, ALFWorld, WebShop, MetaClaw-Bench）上优于基线（如HyperMem）。局限性方面，摘要提到参数化记忆需要训练、整合会丢失细节、保留所有记录会导致搜索库不断增长，而MIRIX-2.0通过明确预算检索和AutoDream机制缓解了这些问题。摘要未提供具体的模型架构细节、具体的数据集规模或AutoDream合并锚点的具体算法细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/大语言模型智能体/记忆系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation（Mind2Act World：机器人操作中具身心智、物理动作及心智-动作组合的诊断基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 56 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26444\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26444\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEmbodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a failure comes from reasoning, execution, or their composition. We introduce Mind2Act World, a diagnostic benchmark of 30 simulated manipulation tasks from five real-world application domains. Each task has three difficulty levels and two scene settings (Clean and Random), yielding 180 configurations. The tasks form three views: Mind tests decisions based on past observations, Act tests precise and timely execution, and Mind2Act combines both in closed-loop tasks where action outcomes guide later decisions. Comparing the three views shows whether a system lacks a capability or fails to compose capabilities it already has. A diagnosis harness further attributes the failed episodes of three representative systems to Mind, Act, or their composition and summarizes each system in a profile card. Our evaluation of multimodal agents, vision-language-action models (VLAs), and world-action models (WAMs) shows that competence in a single view does not carry over to Mind2Act tasks. Even the strongest agent succeeds in 52.7% of Mind and 39.0% of Act episodes but in only 12.0% of Mind2Act episodes. The strongest agent retains task state but struggles with sustained contact, whereas end-to-end policies execute practiced motions but retain little task state. These findings point to composing reasoning and execution through environmental feedback as the main open problem.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具身智能旨在让机器人以类似人类的适应性和可靠性执行复杂的物理任务，这需要三种互补的能力：基于历史的认知推理、精确及时的物理执行，以及通过环境反馈将推理与执行进行组合。然而，现有基准要么在同一任务中评估推理和执行，要么单独评估它们而不评估其组合，因此它们几乎无法揭示失败是源于推理、执行还是它们的组合。我们引入了Mind2Act World，这是一个包含来自五个真实世界应用领域30个模拟操作任务的诊断基准。每个任务有三个难度级别和两种场景设置（干净和随机），产生180种配置。这些任务构成三个视角：Mind测试基于过去观察的决策，Act测试精确及时的执行，Mind2Act在闭环任务中结合两者，其中动作结果指导后续决策。比较这三个视角可以显示系统是缺乏某种能力，还是未能组合其已有的能力。诊断工具进一步将三个代表性系统的失败片段归因于Mind、Act或它们的组合，并在档案卡中总结每个系统。我们对多模态智能体、视觉-语言-动作模型（VLA）和世界-动作模型（WAM）的评估表明，单一视角的能力不能迁移到Mind2Act任务。即使是最强的智能体在52.7%的Mind片段和39.0%的Act片段中成功，但在Mind2Act片段中仅成功12.0%。最强的智能体能保留任务状态但在持续接触方面表现挣扎，而端到端策略能执行练习过的动作但几乎不保留任务状态。这些发现指出，通过环境反馈组合推理和执行是主要的未解决问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个诊断基准（Mind2Act World），用于分别评估和组合评估机器人在物理任务中的认知推理（Mind）、物理执行（Act）以及两者通过环境反馈的组合能力（Mind2Act），以定位系统失败的具体原因。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出包含30个模拟操作任务、180种配置的Mind2Act World基准，分为Mind、Act和Mind2Act三个视角；开发诊断工具将系统失败归因于具体能力缺失或组合失败；揭示单一视角能力无法迁移至组合任务的现象。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的评估数据，最强智能体在Mind和Act视角的成功率分别为52.7%和39.0%，而在Mind2Act视角仅为12.0%。分析指出最强智能体难以维持持续接触，端到端策略难以保留任务状态。局限性方面，摘要未提供该基准在真实物理机器人上的验证结果、具体使用的五个应用领域的名称，以及多模态智能体、VLA和WAM的具体模型名称。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 具身智能与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. Weight-Space Programming Doesn\u0026#x27;t Need Transformers（权重空间编程不需要 Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 56 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22055\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22055\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStandard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed architecture or designing the architecture themselves. When free to design, all three compile plain-text facts into a sparse table queried by a fixed procedure, reaching up to 54.4% test accuracy. An LLM-designed model achieves higher test accuracy than the most accurate released Transformer that the same LLM wrote while using about 1,800x fewer parameters. Without gradients, they choose a table, in which the LLM can state what each weight means and can find and rewrite a wrong one. Each wrong answer points to one row, and removing a row changes about one other answer. From this, we propose an associative-memory-based model up to 17x faster on GPUs than a same-sized Transformer. We also test pretrained weights, other benchmarks, and tasks where models generate answers. Pretrained LLMs remain more accurate; the claim concerns which structure to build when writing weights.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e选择标准神经架构（如 Transformer）是因为它们使用梯度下降训练效果好且在 GPU 上运行速度快。在权重空间编程中，大型语言模型无需基于梯度的训练即可手写目标权重，因此这些原因不再适用。我们应该保留 Transformer 吗？在极少的指导、十个带标签的样本和一个沙盒环境下，主要在多项选择题上，我们让三个前沿 LLM 要么生成固定架构的权重，要么自己设计架构。当可以自由设计时，所有三个模型都将纯文本事实编译成一个由固定过程查询的稀疏表，测试准确率高达 54.4%。LLM 设计的模型比同一 LLM 编写的最准确已发布 Transformer 实现了更高的测试准确率，同时使用的参数大约少 1800 倍。没有梯度，它们选择了表，其中 LLM 可以说明每个权重的含义，并可以查找和重写错误的权重。每个错误答案指向一行，删除一行大约会改变另一个答案。由此，我们提出了一种基于关联记忆的模型，在 GPU 上比同等大小的 Transformer 快多达 17 倍。我们还测试了预训练权重、其他基准以及模型生成答案的任务。预训练的 LLM 仍然更准确；该主张涉及在编写权重时应构建哪种结构。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在无梯度训练的权重空间编程范式下，探索替代 Transformer 的模型架构设计，并评估 LLM 自主设计架构的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现 LLM 在自由设计架构时倾向于将事实编译为稀疏表，测试准确率可达 54.4%，且参数量比 Transformer 少约 1800 倍。2. 提出一种基于关联记忆的模型，在 GPU 上推理速度比同等大小的 Transformer 快多达 17 倍。3. 证明在无梯度权重编程场景下，非 Transformer 结构（如表格或关联记忆）比 Transformer 更有效且易于解释和修改。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：摘要表明在权重空间编程中，LLM 设计的非 Transformer 架构在参数效率和推理速度上具有优势。然而，摘要未提供该关联记忆模型在更广泛任务或复杂数据集上的泛化能力评估，未说明预训练 LLM 与所提出模型在具体任务上的详细对比数字，也未讨论该架构在需要复杂序列建模任务中的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e模型架构与权重空间编程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection（WeVisForensics：用于全能AI生成视频检测的自我进化智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 55 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21373\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21373\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeVisForensics, an agentic framework in which a main investigator agent coordinates a self-evolving library of forensic inspector sub-agents spanning visual and audio cues. The investigator learns which artifact type to examine, over which window, and when to conclude, and these interactions provide shared feedback for both levels of agents. Our dual-timescale policy optimization strategy, DTPO, closes this loop through fast reinforcement learning of the investigator and slower refinement of the inspectors, guided by annotated artifact intervals, to report subtle artifacts they once dismissed. Furthermore, we curate ForenCue-30K, combining role-specific forensic annotations and interaction trajectories to supervise individual inspections and their coordination, with an accompanying reinforcement-learning pool. Experiments show that WeVisForensics averages 95.2% detection accuracy across in-domain, out-of-domain and agentic benchmarks, 9.0% above the strongest prior detector, while grounding its verdicts in localized evidence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频生成的最新进展要求基于明确的取证证据进行可靠的检测。然而，当前方法主要依赖于单次思维链推理，这会忽略短暂或局部的伪影，或者依赖于预定义的多智能体工作流，这些工作流在选择相关检查时灵活性有限。即使具有自适应调查能力，仅优化调查策略也不能直接提高固定专家的取证能力。我们引入了WeVisForensics，这是一个智能体框架，其中主调查智能体协调一个跨越视觉和音频线索的自我进化的取证检查器子智能体库。调查器学习要检查哪种伪影类型、在哪个时间窗口上检查以及何时得出结论，这些交互为两个层级的智能体提供共享反馈。我们的双时间尺度策略优化策略DTPO通过调查器的快速强化学习和检查器的较慢优化来闭合这一循环，在带注释的伪影间隔的指导下，报告他们曾经忽略的细微伪影。此外，我们整理了ForenCue-30K数据集，结合特定角色的取证注释和交互轨迹来监督单独的检查及其协调，并附带一个强化学习池。实验表明，WeVisForensics在域内、域外和智能体基准测试中平均检测准确率达到95.2%，比最强的先前检测器高出9.0%，同时将其裁决基于局部证据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种基于明确取证证据的可靠AI生成视频检测方法，以克服现有单次推理忽略局部伪影及预定义多智能体工作流灵活性不足的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WeVisForensics框架，包含主调查智能体和自我进化的取证检查器子智能体库；引入双时间尺度策略优化策略（DTPO）实现调查器与检查器的协同优化；构建ForenCue-30K数据集用于监督检查与协调。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在域内、域外和智能体基准上达到了95.2%的平均准确率，比先前最强检测器高9.0%，并能基于局部证据做出裁决。局限性方面，摘要未提供具体的计算开销、推理延迟或针对特定生成模型的失败案例分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频取证与检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations（SWE-CoWork：在组织中将编码智能体作为数字员工进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 53 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20218\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20218\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from a brief handoff, agents must recover requirements distributed across colleagues and workplace records, reconcile conflicting evidence, and implement changes evaluated by private executable tests. We evaluate eleven models and find a substantial gap between partial implementation and complete task delivery. The two leading models satisfy approximately 63% of fail-to-pass (F2P) tests but complete fewer than 8% of assignments. Providing complete requirements upfront improves F2P by approximately 16 percentage points for Seed Evolving and GPT-6 Astra, yet leaves complete task success unchanged. Requirement-level trajectory analysis reveals failures throughout the delivery process: Claude-Opus-5.5 directs a mean of 93% of first questions about queried cards to their accountable owners across runs but obtains only 64% of colleague-held requirements. Deferred questions go unfollowed, implementations remain incomplete even after requirements are acquired, and 31% of requirements reported as completed fail their tests. These findings highlight sustained requirement tracking, from clarification through implementation, verification, and handoff, as a key challenge for reliable autonomous software engineering.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在软件组织中工作的编码智能体必须确定要构建的内容、与同事协作并验证其交付的内容。我们引入了 SWE-CoWork，这是一个包含 101 个开发任务的基准，跨越 101 个真实代码库、11 种编程语言和 12 个应用领域。每个任务将智能体置于一个模拟的工程组织中，该组织有 26 名同事，他们具有不同的职责、有限的知识和受控的协作行为。从简短的交接开始，智能体必须恢复分布在同事和工作场所记录中的需求，调和相互矛盾的证据，并实施由私有可执行测试评估的更改。我们评估了 11 个模型，发现部分实现与完整任务交付之间存在巨大差距。两个领先的模型满足了大约 63% 的 fail-to-pass (F2P) 测试，但完成的分配不到 8%。提前提供完整需求使 Seed Evolving 和 GPT-6 Astra 的 F2P 提高了大约 16 个百分点，但完整的任务成功率保持不变。需求级别的轨迹分析揭示了交付过程中的失败：Claude-Opus-5.5 在多次运行中将关于查询卡片的 93% 的首次问题定向到其负责人，但仅获得了 64% 的同事持有的需求。推迟的问题未被跟进，即使在获取需求后实现仍不完整，并且 31% 报告为已完成的需求未通过测试。这些发现强调了从澄清到实现、验证和交接的持续需求跟踪，是可靠自主软件工程的关键挑战。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估编码智能体在模拟软件组织中作为数字员工进行需求恢复、协作、实现和验证的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了包含101个真实代码库和11种编程语言的SWE-CoWork基准；模拟了具有26名同事的工程组织环境；揭示了当前模型在部分实现与完整任务交付间的巨大差距，以及持续需求跟踪的挑战。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该基准有效揭示了智能体在复杂组织环境中的协作与需求跟踪缺陷。局限性方面，摘要未提供关于模拟环境与真实人类团队差异的评估，也未提供基准中不同应用领域或编程语言的具体性能差异分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程与人工智能 / 智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding（WeMM-Video：推动开源全能模态视频理解的前沿）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 50 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26409\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26409\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct responses and a thinking mode for explicit step-by-step reasoning. The models are trained on a large-scale multimodal corpus of approximately 1.2 trillion tokens through progressive pre-training and a multi-stage post-training pipeline incorporating multi-teacher OPD, anti-repetition MrDPO, and specialist RL. Evaluated across more than 120 benchmarks, WeMM-Video demonstrates superior performance in omni-modal video understanding and reasoning, while maintaining highly competitive capabilities across general audio, silent video, image, and text tasks. Specifically, in omni-modal video evaluations, our flagship WeMM-Video-35B-A3B establishes a new open-source state of the art, substantially outperforming proprietary models such as Qwen3.5-Omni-Flash and Seed2.0-Mini-0428 while narrowing the gap with the strong Gemini-3.0-Flash, and our compact WeMM-Video-9B surpasses the larger open-source Qwen3-Omni-30B-A3B-Instruct. We publicly release the WeMM-Video family along with our evaluation and reproduction pipeline to foster further research and development in the open-source community.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频理解，特别是伴随音频的视频理解，仍然是多模态智能的核心挑战。在本报告中，我们引入了WeMM-Video，这是一个中英双语全能模态基础模型系列，包含2B、4B、9B和35B-A3B变体。以联合视听感知和推理为中心，WeMM-Video在混合思考范式内统一了文本、图像、音频和视频处理，无缝支持用于快速直接响应的非思考指令模式和用于显式逐步推理的思考模式。这些模型在约1.2万亿个token的大规模多模态语料库上进行训练，通过渐进式预训练和包含多教师OPD、防重复MrDPO以及专家RL的多阶段后训练流水线。在超过120个基准测试中评估，WeMM-Video在全能模态视频理解和推理方面展现出卓越的性能，同时在通用音频、无声视频、图像和文本任务中保持高度竞争力的能力。具体而言，在全能模态视频评估中，我们的旗舰WeMM-Video-35B-A3B确立了新的开源最先进水平，大幅超越了Qwen3.5-Omni-Flash和Seed2.0-Mini-0428等专有模型，同时缩小了与强大的Gemini-3.0-Flash的差距，而我们紧凑的WeMM-Video-9B超越了更大的开源Qwen3-Omni-30B-A3B-Instruct。我们公开发布WeMM-Video系列以及我们的评估和复现流水线，以促进开源社区的进一步研究和开发。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个中英双语全能模态基础模型系列（WeMM-Video），统一处理文本、图像、音频和视频，以解决伴随音频的视频理解挑战，并支持混合思考范式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e推出包含2B至35B-A3B多种变体的WeMM-Video模型家族；采用约1.2万亿token语料库训练，结合渐进式预训练与多阶段后训练（多教师OPD、防重复MrDPO、专家RL）；支持非思考指令模式与思考模式；在120多个基准上取得全能模态视频理解的开源SOTA。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明WeMM-Video-35B-A3B在全能模态视频评估中超越Qwen3.5-Omni-Flash和Seed2.0-Mini-0428，并缩小了与Gemini-3.0-Flash的差距；WeMM-Video-9B超越了Qwen3-Omni-30B-A3B-Instruct。局限性方面，摘要未提供在120多个基准测试中的具体得分数字、模型推理的计算成本或延迟，以及多教师OPD、防重复MrDPO和专家RL的具体技术实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与多模态学习 / 视频与多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Multi-Branch Transformer（多分支 Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 50 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19800\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19800\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTransformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MBT variants: Wide-Shallow preserves block width, Narrow-Deep preserves sequential depth, and Balanced interpolates between them. In controlled pretraining experiments at four mixture-of-experts scales (0.8B to 2.1B total parameters), 2-branch Wide-Shallow MBTs consistently outperform sequential Transformers under matched parameter and training-compute budgets. Balanced MBTs improve further and retain comparable quality as the number of branches increases. To improve inference efficiency at long contexts, we introduce Joint-KV, which constructs a shared KV cache from branch representations at each depth. Our final recipe combines Balanced MBTs with Joint-KV, supported by an inference engine that exploits branch grouping and shared-cache reuse. Fitted scaling curves indicate that standard Transformers require up to 1.26x as much training body compute to match our final models\u0026#x27; validation loss. These models reduce full-model KV-cache storage by up to 34% and deliver up to 51.4% higher decoding throughput on a single H200 GPU. Ablation studies show that branching yields gains beyond changes in width and depth, enables an effective KV-sharing strategy (Joint-KV), remains robust across fusion functions, and performs best in the middle layers. These findings show that branching offers a practical path for scaling language models toward both better modeling quality and faster inference.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eTransformer 语言模型通常通过加宽其模块或堆叠得更深来进行扩展。在这项工作中，我们探索了一条互补的路径：分支，即完整 Transformer 模块的并行组合。我们引入了多分支 Transformer（MBT），它通过共享的初始层处理输入，并行执行独立参数化的顺序模块分支，并在共享的最终层之前融合它们的输出。在相当的训练计算量下，我们研究了三种 MBT 变体：Wide-Shallow 保留模块宽度，Narrow-Deep 保留顺序深度，Balanced 在它们之间进行插值。在四个混合专家规模（总参数从 0.8B 到 2.1B）的受控预训练实验中，在匹配的参数和训练计算预算下，2 分支 Wide-Shallow MBT 始终优于顺序 Transformer。Balanced MBT 进一步改进，并在分支数量增加时保持相当的质量。为了提高长上下文下的推理效率，我们引入了 Joint-KV，它在每个深度从分支表示中构建共享的 KV 缓存。我们的最终配方结合了 Balanced MBT 和 Joint-KV，并得到利用分支分组和共享缓存重用的推理引擎的支持。拟合的缩放曲线表明，标准 Transformer 需要多达 1.26 倍的训练主体计算量才能匹配我们最终模型的验证损失。这些模型将全模型 KV 缓存存储减少了多达 34%，并在单个 H200 GPU 上实现了高达 51.4% 的更高解码吞吐量。消融研究表明，分支带来的增益超出了宽度和深度的变化，实现了有效的 KV 共享策略（Joint-KV），在融合函数上保持鲁棒性，并在中间层表现最佳。这些发现表明，分支为将语言模型扩展到更好的建模质量和更快的推理提供了一条实用的路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出多分支 Transformer（MBT）架构，通过并行组合完整的 Transformer 模块来探索模型扩展的新路径，并优化长上下文推理效率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出多分支 Transformer（MBT），在匹配参数和计算预算下，Balanced MBT 表现优于标准顺序 Transformer。2. 引入 Joint-KV 策略构建共享 KV 缓存，将全模型 KV 缓存存储减少多达 34%，在 H200 GPU 上解码吞吐量提高高达 51.4%。3. 拟合缩放曲线显示，标准 Transformer 需要多达 1.26 倍的训练计算量才能达到 MBT 的验证损失。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：摘要展示了 MBT 架构在训练效率和长上下文推理吞吐量上的显著优势。然而，摘要未提供模型在标准自然语言处理下游任务上的具体评估分数，未说明分支数量增加时的质量上限或具体下降拐点，也未讨论该架构在极长序列或超大规模参数下的内存和计算瓶颈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e模型架构与语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection（SPILLWAY：分离目标准入与净化以防御使用工具的代理免受提示注入攻击）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 47 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.07222\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.07222\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may read the attacker\u0026#x27;s text and adds model calls to every step. Provenance defenses keep the model off the final check but need a model to plan or route each task first. Where an action goes can instead be read from the tools\u0026#x27; typed returns: an email\u0026#x27;s sender or a payment\u0026#x27;s account arrives in a typed field, while injected instructions arrive as free text. SPILLWAY turns this observation into a deterministic floor with no per-task plan. The check admits a call when each target value that appears in tool output but not in the user\u0026#x27;s task was returned by a read-only tool in a typed field or is covered by a fixed delegation rule. A deterministic sanitizer removes instruction-like regions its fixed rules match before the model reads them and retains the removed spans as evidence, and a local judge may restore a refused call, never one whose target lies in the removed text. Across three backbones, and seven task suites on one of them, no standard templated injection redirects an action to an attacker\u0026#x27;s target under SPILLWAY, at the highest observed mean utility and composite scores (NRP, ERS) of the defenses we run under that attack. A forged chat template also produces a raw zero, and mean in-scope attack success under a released reinforcement-learning attacker is .007. SPILLWAY reaches this floor with no defense-triggered backbone re-run and almost no added model call. As personal AI agents act on users\u0026#x27; email, files, and payments, SPILLWAY gives them an auditable refusal floor on where their actions go that keeps them useful and holds across backbones.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用工具的代理会对电子邮件、文件和付款采取行动，因此隐藏在网页或共享文档中的指令可能会使代理将数据或金钱发送给攻击者。许多运行时防御将语言模型置于允许操作通过的决定上，因此该决定依赖于可能读取攻击者文本的模型，并在每一步增加模型调用。来源防御使模型脱离最终检查，但需要模型首先规划或路由每个任务。操作的去向反而可以从工具的类型化返回中读取：电子邮件的发件人或付款的账户到达类型化字段中，而注入的指令作为自由文本到达。SPILLWAY 将这一观察转化为无需每任务计划的确定性底线。当工具输出中出现但不在用户任务中的每个目标值由只读工具在类型化字段中返回或被固定委托规则覆盖时，检查允许调用。确定性净化器在模型读取之前移除其固定规则匹配的类似指令的区域，并将移除的跨度保留为证据，本地法官可以恢复被拒绝的调用，但永远不会恢复目标位于移除文本中的调用。在三个主干网络上，以及其中一个上的七个任务套件中，在 SPILLWAY 下，没有标准的模板化注入将操作重定向到攻击者的目标，同时在我们运行的防御中观察到该攻击下的最高平均效用和综合得分（NRP，ERS）。伪造的聊天模板也产生了原始零，并且在发布的强化学习攻击者下的平均范围内攻击成功率为 0.007。SPILLWAY 在没有防御触发的骨干网络重新运行且几乎没有增加模型调用的情况下达到了这一底线。随着个人 AI 代理对用户的电子邮件、文件和付款采取行动，SPILLWAY 为它们提供了一个可审计的拒绝底线，关于它们的行动去向，这保持了它们的实用性并适用于各种主干网络。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e防御使用工具的AI代理免受提示注入攻击\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SPILLWAY，通过分离目标准入与净化，提供无需每任务计划的确定性防御底线。2. 利用工具类型化返回与自由文本的区别，结合确定性净化器移除指令区域。3. 在三个主干网络和七个任务套件中，成功防御所有标准模板化注入，且保持最高平均效用和综合得分。4. 防御触发时不引起骨干网络重新运行，几乎不增加模型调用开销，强化学习攻击成功率仅为0.007。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了SPILLWAY在防御提示注入攻击时的有效性和高效性，通过确定性规则而非依赖语言模型进行最终检查，降低了开销并提高了安全性。局限性：摘要未提供该防御机制在面对非标准或语义级复杂注入攻击时的具体表现，也未详细说明本地法官恢复调用时的误判率或具体实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/大模型安全与智能体防御\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models（ForceHarness：将力转化为冻结前沿模型的动作与物理量）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 45 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21099\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21099\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarness, a harness that lets frozen models use force without demonstrations or finetuning. After calibrating hand force from a wrist sensor or joint torques alone, ForceHarness addresses the first challenge with self-terminating force primitives that regulate force on their own and return at a contact event. To address the second challenge, a physics translation layer turns each force trace into physical quantities with uncertainty as the tool result. To evaluate ForceHarness against expert force controllers and learned policies under identical conditions, we also build HiddenPhys, a seven-task MuJoCo benchmark with hidden physical variables. On a real arm without a wrist force sensor, ForceHarness raises the zero-shot success rate of GPT-6 Astra from 3.3% to 90.0%. In simulation, it adds 17.5 percentage points on the public ForceBench suite and 34.3 percentage points on HiddenPhys, surpassing force-aware policies trained on demonstrations on both benchmarks and matching hand-written expert controllers on HiddenPhys. Ablations further show that smaller models make significantly better decisions when given physical quantities rather than raw force values.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前沿多模态模型现在可以从图像中零样本控制机器人，然而许多操作任务依赖于图像无法显示的接触力。将力引入仅 API 的冻结模型提出了两个挑战。首先，接触演变的速度远快于 API 模型决策的速度，因此系统必须在模型下方闭合力循环。其次，冻结模型无法解释原始力流，因此必须以模型能够推理的形式返回力。因此，我们提出了 ForceHarness，一个让冻结模型无需演示或微调即可使用力的工具。在仅从腕部传感器或关节扭矩校准手部力之后，ForceHarness 通过自终止力原语解决第一个挑战，这些原语自行调节力并在接触事件时返回。为了解决第二个挑战，物理翻译层将每个力轨迹转化为带有不确定性的物理量作为工具结果。为了在相同条件下评估 ForceHarness 与专家力控制器和学习策略，我们还构建了 HiddenPhys，一个包含隐藏物理变量的七任务 MuJoCo 基准。在没有腕部力传感器的真实机械臂上，ForceHarness 将 GPT-6 Astra 的零样本成功率从 3.3% 提高到 90.0%。在仿真中，它在公开的 ForceBench 套件上增加了 17.5 个百分点，在 HiddenPhys 上增加了 34.3 个百分点，在这两个基准测试上都超过了在演示上训练的力感知策略，并在 HiddenPhys 上匹配了手写的专家控制器。消融研究进一步表明，当提供物理量而不是原始力值时，较小的模型能做出明显更好的决策。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发 ForceHarness 框架，使仅支持 API 的冻结多模态大模型能够理解和利用接触力信息来控制机器人，并构建相应的物理基准测试集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 ForceHarness，通过自终止力原语和物理翻译层，使冻结模型无需微调即可利用接触力进行机器人控制。2. 构建 HiddenPhys 七任务 MuJoCo 基准，用于评估隐藏物理变量下的力控制能力。3. 在真实机械臂上，将 GPT-6 Astra 的零样本成功率从 3.3% 提升至 90.0%；在仿真中显著超越基于演示训练的力感知策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：摘要证明了 ForceHarness 在将原始力转化为物理量后，能大幅提升冻结模型在机器人操作中的零样本成功率。然而，摘要未提供该框架在更多样化或更复杂的真实物理环境中的泛化测试结果，未说明物理翻译层引入的不确定性对最终控制精度的具体影响，也未讨论系统延迟或计算开销对高频接触任务的实际限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人与具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. Posterior Matching Distillation（后验匹配蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 44 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26629\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26629\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDiffusion distillation accelerates image and video generation by compressing a pretrained teacher\u0026#x27;s iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student\u0026#x27;s output distribution to the teacher\u0026#x27;s. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distribution-based distillation family that combines mode-covering posterior sampling with any-step generation. At zero population loss, PMD recovers the teacher\u0026#x27;s full posterior of clean images at each trained noise level. Its stochastic student supports any-step sampling budgets within the trained timestep grid without further training. To learn these posteriors, PMD matches exponentially reweighted averages of student samples conditioned on a fixed noisy state to corresponding teacher posterior means. Under Gaussian corruption, exponentially tilted posterior mean is a single teacher evaluation at a shifted input. We prove that, matching tilted means over an open neighborhood uniquely identifies the full posterior. PMD thus supervises the entire conditional distribution through a family of mean constraints, without any auxiliary student-score network. Experiments on SDXL and FLUX.2 [klein] 4B demonstrate that PMD achieves the best FID among 4-step methods on both models, while maintaining competitive or leading performance across prompt-alignment and perceptual-quality metrics.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩散蒸馏通过将预训练教师的迭代采样过程压缩为少数几次网络评估，从而加速图像和视频生成。基于分布的方法通过匹配学生的输出分布与教师的分布来实现这一点。这种匹配通常由逆向KL目标驱动，其模式寻求偏差有利于主导的教师模式，而牺牲了样本间的多样性。我们引入了后验匹配蒸馏（PMD），这是基于分布的蒸馏家族的新成员，它将覆盖模式的后验采样与任意步生成相结合。在总体损失为零的情况下，PMD在每个训练的噪声水平下恢复教师的完整干净图像后验。其随机学生支持在训练的时间步网格内的任意步采样预算，而无需进一步训练。为了学习这些后验，PMD将固定噪声状态下条件的学生样本的指数重加权平均值与相应的教师后验均值进行匹配。在高斯损坏下，指数倾斜后验均值是在偏移输入处的单次教师评估。我们证明，在开放邻域上匹配倾斜均值可以唯一地确定完整后验。因此，PMD通过一系列均值约束来监督整个条件分布，而无需任何辅助的学生得分网络。在SDXL和FLUX.2 [klein] 4B上的实验表明，PMD在这两个模型上的4步方法中实现了最佳的FID，同时在提示对齐和感知质量指标上保持具有竞争力或领先的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e加速图像和视频生成的扩散蒸馏，通过压缩预训练教师的迭代采样过程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出后验匹配蒸馏（PMD），结合覆盖模式的后验采样与任意步生成；在零总体损失下恢复教师完整后验；支持任意步采样预算而无需额外训练；通过匹配指数倾斜后验均值监督整个条件分布，无需辅助学生得分网络；在SDXL和FLUX.2上4步方法中实现最佳FID，且提示对齐和感知质量指标具有竞争力或领先。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出PMD解决了基于分布的蒸馏中逆向KL目标带来的模式寻求偏差问题，通过匹配后验均值来监督条件分布。局限性方面，摘要未提供具体的局限性分析，仅提到了在SDXL和FLUX.2 [klein] 4B上的实验结果，未提及其他模型或更高分辨率及复杂场景下的表现。摘要未提供具体的FID数值、提示对齐和感知质量的具体指标得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像与视频生成 / 扩散模型蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. MMFlash: Faster Speculative Decoding for Vision-Language Models（MMFlash：视觉语言模型更快的推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 43 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18482\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18482\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpeculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that acceptance rates decrease from 46% in the lowest visual-dependence quartile to 22% in the highest, with this disparity persisting after multimodal training. Motivated by this observation, we propose MMFlash, a simple and effective framework that adaptively upweights visually dependent tokens that the drafter predicts poorly. For long video inputs, MMFlash further employs sparse attention to reduce redundant attention computation and improve drafting quality. Across various multimodal benchmarks, MMFlash achieves lossless decoding speedups of up to 3.58times, outperforming EAGLE-3 and DFlash by up to 195.4% and 17.1%, respectively.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推测解码通过让轻量级起草器提出标记以供目标模型并行验证来加速生成。诸如DFlash之类的扩散起草器在单次前向传播中提出整个标记块，但主要关注纯文本任务，使得多模态起草未被充分探索。为了研究这种设置，我们首先引入了基于有无视觉输入的下一个标记分布之间的KL散度的标记级视觉依赖性度量。我们发现，接受率从视觉依赖性最低四分位数的46%下降到最高四分位数的22%，并且这种差异在多模态训练后依然存在。受这一观察的启发，我们提出了MMFlash，一个简单有效的框架，它自适应地提高起草器预测不佳的视觉依赖标记的权重。对于长视频输入，MMFlash进一步采用稀疏注意力来减少冗余注意力计算并提高起草质量。在各种多模态基准测试中，MMFlash实现了高达3.58倍的无损解码加速，分别比EAGLE-3和DFlash高出195.4%和17.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出MMFlash框架，用于加速视觉语言模型的多模态推测解码，解决多模态起草中视觉依赖标记预测不佳的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入基于KL散度的标记级视觉依赖性度量，发现视觉依赖性高的标记接受率显著降低（从46%降至22%）。2. 提出MMFlash框架，自适应提高起草器预测不佳的视觉依赖标记的权重。3. 针对长视频输入采用稀疏注意力减少冗余计算并提高起草质量。4. 在多模态基准上实现高达3.58倍无损解码加速，显著优于EAGLE-3和DFlash。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的实验数据，证明MMFlash在解码速度上的显著提升（3.58倍加速，比EAGLE-3和DFlash分别高出195.4%和17.1%），并揭示了视觉依赖性对接受率的影响（46%到22%）。局限性方面，摘要指出多模态起草未被充分探索，且扩散起草器主要关注纯文本任务，导致视觉依赖标记的接受率在多模态训练后依然较低。摘要未提供具体的基准测试名称、具体的模型参数量或稀疏注意力的具体实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/多模态模型/模型加速与推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. ALIVE: Making Streaming Video Models Interactive（ALIVE：使流式视频模型具备交互能力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 42 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21366\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21366\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and local advantages to refine decisions, responses, and silence across multi-turn interactions. We also introduce FSI-Bench to evaluate feedback seeking and subsequent task completion. ALIVE achieves the highest overall scores among the compared models on four public benchmarks and FSI-Bench, demonstrating strong streaming understanding and interactive capabilities.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频大语言模型可以持续观察世界，但通常孤立地处理用户请求。我们引入了ALIVE，一个支持主动监控、流式任务协调和寻求反馈交互的交互式流式视频模型。我们构建了ALIVE-SFT-288K和ALIVE-RL-3K用于两阶段训练。对比监督微调教授何时以及如何响应，而带有行为对齐信用分配（BACA）的强化学习结合了轨迹级和局部优势，以在多轮交互中优化决策、响应和沉默。我们还引入了FSI-Bench来评估寻求反馈和后续任务完成情况。ALIVE在四个公共基准和FSI-Bench上的比较模型中取得了最高的总体分数，展示了强大的流式理解和交互能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种支持主动监控、流式任务协调和寻求反馈交互的交互式流式视频模型（ALIVE），以提升流式视频大语言模型的多轮交互和任务协调能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ALIVE，支持主动监控、流式任务协调和寻求反馈的交互。2. 构建ALIVE-SFT-288K和ALIVE-RL-3K数据集进行两阶段训练。3. 采用对比监督微调决定响应时机和方式，并使用行为对齐信用分配（BACA）强化学习优化多轮交互中的决策、响应和沉默。4. 提出FSI-Bench基准评估寻求反馈及后续任务完成情况。5. 在四个公共基准和FSI-Bench上取得最高总体分数。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ALIVE在流式视频理解和交互方面取得了领先性能，并提出了新的训练方法和评估基准。然而，摘要未提供四个公共基准的具体名称、FSI-Bench的详细构成，也未说明BACA方法的具体实现细节以及模型在长视频流处理时的计算开销或局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习与视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Coda-DaVinci: Reimagining Video Generation with Code2Video（Coda-DaVinci：使用Code2Video重塑视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 40 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26595\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26595\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium-grained proxies favor consistency. Physics simulation and proxy-aligned prompting further improve average quality. Guided by these findings, we introduce Coda-DaVinci, a task-adaptive agentic framework for Cod
