e2Video generation that selects between proxy-guided and direct generation, adapts modeling granularity to each entity, and coordinates simulation with proxy-grounded prompting. Its multi-agent harness preserves scene assets and guides repairs through visual inspection and independent review. Experiments demonstrate leading instruction following on VTR and scene consistency on R2M, improved physical plausibility over direct generation, and higher visual realism than the compared Code2Video baselines. Long-video evaluations further show gains in event structure and consistency across successive interactions, while revealing limitations in transition stability and adherence to scene settings.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eCode2Video使用智能体编写的3D代理来引导视频生成，从而实现对结构和动态的显式控制。然而，如何构建代理和提示以获得最佳下游质量仍未得到充分探索，该范式的能力和局限性也是如此。通过对照实验和盲评人类评估，我们研究了代理粒度、物理模拟和提示。结果揭示了依赖于任务的权衡：粗粒度代理有利于自然运动，而中等粒度代理有利于一致性。物理模拟和与代理对齐的提示进一步提高了平均质量。在这些发现的指导下，我们引入了Coda-DaVinci，一个用于Code2Video生成的任务自适应智能体框架，它在代理引导和直接生成之间进行选择，使每个实体的建模粒度自适应，并协调模拟与基于代理的提示。其多智能体工具保留了场景资产，并通过视觉检查和独立审查引导修复。实验表明，在VTR上具有领先的指令遵循能力，在R2M上具有场景一致性，相比直接生成提高了物理合理性，并且比比较的Code2Video基线具有更高的视觉真实感。长视频评估进一步显示了在连续交互中事件结构和一致性的提升，同时揭示了在过渡稳定性和遵循场景设置方面的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决Code2Video范式中如何构建3D代理和提示以优化下游视频生成质量的问题，开发一个任务自适应的智能体框架以实现结构与动态的显式控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e揭示代理粒度、物理模拟和提示在视频生成中的任务依赖权衡；提出Coda-DaVinci框架，自适应选择代理引导或直接生成，并为每个实体调整建模粒度；引入多智能体工具通过视觉检查和独立审查保留场景资产并引导修复。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Coda-DaVinci在VTR的指令遵循和R2M的场景一致性上表现领先，提升了物理合理性和视觉真实感，长视频在事件结构和一致性上有增益。局限性方面，摘要明确指出在过渡稳定性和遵循场景设置方面存在局限。未提供的信息包括VTR和R2M的具体全称或指标得分、物理模拟的具体引擎或方法、以及多智能体工具的具体架构细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与多智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. Self-Improvement Memory Enables Continual Recursive Self-Improvement（自我改进记忆实现持续递归自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 40 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18856\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18856\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHarness optimization is often studied with a fixed policy model and benchmark. When either changes, the optimizer must decide which parts of an evolved harness to reuse or revise, but the harness alone may not explain why earlier edits were made or how they performed. In this work, we study Continual Recursive Self-Improvement (CRSI), a setting for continuing existing harness-optimization methods across compatible benchmarks or policy models. We propose Self-Improvement Memory (SIM) for the harness optimizer, rather than the task-solving policy. SIM groups edits by recurring harness problem and records their rationale, predicted and observed outcomes, and evaluation context. New attempts extend this history as optimization continues. In our experiments across four domains, SIM achieves higher final scores than harness-only and root-cause-only continuation in cross-dataset and pairwise cross-model comparisons. Across ten independent source runs in coding, paired continuations with SIM improve final scores by an average of 2.36 points over harness-only continuation (p=0.003).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eHarness优化通常在固定的策略模型和基准下进行研究。当其中任何一个发生变化时，优化器必须决定进化出的harness的哪些部分需要重用或修改，但仅靠harness本身可能无法解释之前的编辑为何进行或其表现如何。在这项工作中，我们研究了持续递归自我改进（CRSI），这是一种在兼容的基准或策略模型上继续现有harness优化方法的设置。我们为harness优化器（而不是任务解决策略）提出了自我改进记忆（SIM）。SIM按重复出现的harness问题对编辑进行分组，并记录其基本原理、预测和观察到的结果以及评估上下文。新的尝试在优化继续时扩展这一历史。我们在四个领域的实验中，SIM在跨数据集和成对跨模型比较中比仅harness和仅根因延续实现了更高的最终分数。在编码领域的十个独立源运行中，使用SIM的成对延续比仅harness延续平均提高了2.36分的最终分数（p=0.003）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究持续递归自我改进（CRSI）设置，并提出一种用于harness优化器的自我改进记忆（SIM）机制，以在兼容的基准或策略模型发生变化时继续优化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出持续递归自我改进（CRSI）设置，用于在兼容基准或策略模型变化时继续harness优化。2. 提出自我改进记忆（SIM），按问题分组编辑并记录原理、预测/观察结果和评估上下文。3. 在四个领域的实验中，SIM在跨数据集和跨模型比较中优于仅harness和仅根因延续。4. 在编码任务中，使用SIM的延续比仅harness延续平均提高2.36分（p=0.003）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究针对harness优化在模型或基准变化时难以复用历史经验的问题，提出了SIM机制，通过记录编辑的上下文和结果来指导后续优化。实验证明SIM能显著提升跨数据集和跨模型的优化效果。局限：摘要未提供SIM机制的具体实现细节（如如何分组、如何记录），摘要未提供四个领域的具体名称和详细实验设置，摘要未提供仅根因延续的具体定义和对比数据，摘要未提供p=0.003对应的具体基线分数。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/机器学习优化/大语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters（ScaleVLA：将视觉-语言-动作模型扩展至 5520 亿参数）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 40 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21607\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21607\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier Vision-Language Models (VLMs) such as GPT-6 Astra have demonstrated remarkable capabilities in robot control, suggesting that broad pretraining provides knowledge valuable for physical action. Yet most Vision-Language-Action (VLA) policies still rely on much smaller VLM backbones, leaving this potential largely untapped. We ask whether frontier-scale representations can provide a stronger foundation for robot learning. We introduce ScaleVLA, which connects a 552B DeepSeek-V4.1-Flash backbone to a trainable action DiT, and systematically compare VLMs from 2B to 552B under a shared training setup. We evaluate three fundamental capabilities of robot foundation models. In sample efficiency, just 10 demonstrations outperform a 2B backbone trained with 50 (87.8% vs. 85.6%). In generalization, LIBERO-PRO success reaches 45.1%, compared with at most 31.3% for smaller backbones. In precise manipulation, real-world charger insertion improves from 4/10 to 9/10 successes, with gains concentrated in contact-sensitive alignment. Despite its scale, ScaleVLA achieves 216 ms median latency per action chunk. Our findings suggest that frontier VLMs can serve not only as reasoning agents, but also as powerful representational foundations for efficient and generalizable robot policies.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eGPT-6 Astra 等前沿视觉-语言模型（VLM）在机器人控制方面展现了卓越的能力，表明广泛的预训练提供了对物理动作有价值的知识。然而，大多数视觉-语言-动作（VLA）策略仍然依赖小得多的 VLM 骨干网络，使得这一潜力在很大程度上未被开发。我们询问前沿规模的表示是否能为机器人学习提供更强大的基础。我们引入了 ScaleVLA，它将 5520 亿参数的 DeepSeek-V4.1-Flash 骨干网络连接到可训练的动作 DiT，并在共享训练设置下系统地比较了从 20 亿到 5520 亿参数的 VLM。我们评估了机器人基础模型的三个基本能力。在样本效率方面，仅 10 个示范就超过了使用 50 个示范训练的 20 亿参数骨干网络（87.8% 对 85.6%）。在泛化能力方面，LIBERO-PRO 的成功率达到 45.1%，而较小的骨干网络最多为 31.3%。在精确操作方面，现实世界中的充电器插入成功率从 10 次中的 4 次提高到 9 次，收益集中在接触敏感的对齐上。尽管规模庞大，ScaleVLA 每个动作块的中位延迟达到了 216 毫秒。我们的发现表明，前沿 VLM 不仅可以作为推理智能体，还可以作为高效且可泛化的机器人策略的强大表示基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索并验证前沿规模（5520亿参数）的视觉-语言模型表示能否为机器人学习（视觉-语言-动作模型）提供更强大的基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了ScaleVLA，将552B参数的DeepSeek-V4.1-Flash骨干与动作DiT连接；在样本效率、泛化能力和精确操作三个基本能力上全面超越较小规模模型；在保持大参数量的同时实现了216毫秒的中位延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了扩大VLM骨干网络参数规模能显著提升机器人策略的样本效率、泛化性和精确操作能力。局限性方面，摘要未提供关于模型训练成本、硬件需求、动作DiT的具体架构细节，以及在更复杂或长视野机器人任务中的表现评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人与具身智能 / 视觉-语言-动作模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. The Resolution Hypothesis: Agent Evolution\u0026#x27;s Key Is Identifying Improvements（分辨率假说：智能体进化的关键在于识别改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 39 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23068\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23068\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across seven evolution methods and six models (over 10M LLM calls), we find support for the hypothesis at both levels where evaluation scores are used. At the candidate level (choosing artifacts), helpful candidate artifacts exist, but selection is no better than random at telling them from harmful ones, so errors accumulate across rounds. At the method level (ranking methods), typical margins of a few percentage points are smaller than the difference between two independent runs of the same method, so published rankings often rest on luck. Together, these findings indicate that agent evolution is often bottlenecked by reliably identifying improvements. This calls for a shift in how we develop and evaluate self-improving agents, from designing ever more candidate improvement systems to making true improvements detectable and accumulable.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体进化遵循一个简单的循环：提议者编写候选工件（提示、技能、记忆），选择器接受得分较高的工件。这个循环已显示出前景，但实践者面临一个难题：方法在论文中互有胜负，且进化在某些任务上经常无法自举。我们将这个难题追溯到分辨率假说：智能体进化停滞不是因为方法未能提出更好的工件，而是因为嘈杂的评估无法可靠地识别它们。在七种进化方法和六个模型（超过1000万次大语言模型调用）中，我们在使用评估分数的两个层面上发现了支持该假说的证据。在候选层面（选择工件），存在有益的候选工件，但选择器在区分它们与有害工件方面并不比随机选择好，因此误差在多轮中累积。在方法层面（对方法排名），几个百分点的典型边际小于同一方法两次独立运行之间的差异，因此发表的排名通常依赖于运气。综上所述，这些发现表明智能体进化通常受制于可靠地识别改进。这呼吁在开发和评估自我改进智能体的方式上发生转变，从设计越来越多的候选改进系统转向使真正的改进可检测和可累积。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究智能体进化过程中停滞的原因，验证“分辨率假说”，即智能体进化受阻是因为嘈杂的评估无法可靠识别改进，而非提议者无法提出更好的工件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出“分辨率假说”，指出智能体进化停滞的瓶颈在于嘈杂的评估无法可靠识别改进。2. 在候选层面发现选择器区分有益和有害工件的能力不优于随机，导致误差累积。3. 在方法层面发现方法间得分差异小于独立运行的方差，表明现有排名具有偶然性。4. 基于超过1000万次大语言模型调用，在七种进化方法和六个模型上验证了假说。5. 呼吁将研究重点从设计候选改进系统转向使真正的改进可检测和可累积。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了大规模实验支持分辨率假说，揭示了当前智能体进化评估的不可靠性。但摘要未提供具体是哪些进化方法或模型表现最差，也未提出解决评估噪声的具体技术方案，仅指出了研究方向应从设计改进系统转向提高检测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth（Depth Pro 2：清晰且时间一致的度量单目深度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 37 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26603\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26603\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present Depth Pro 2, an approach to estimating dense metric depth for images and video at full resolution. By analyzing prior methods for monocular depth estimation, we find that they commonly trade off temporal consistency and boundary sharpness: multi-frame methods favor consistency, single-frame methods favor sharpness. To overcome this trade-off, we train a single, scalable network that processes both images and video and predicts depth maps at native resolution. Depth Pro 2 produces depth maps that are metrically accurate, sharp, and temporally consistent all at once, outperforming prior work in all of these dimensions. We release a family of models that define a new Pareto frontier in terms of metric accuracy, sharpness, temporal consistency, and runtime. We release code and weights at https://apple-aiml-research.github.io/ml-depth-pro-2/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了Depth Pro 2，一种在全分辨率下估计图像和视频的密集度量深度的方法。通过分析单目深度估计的先前方法，我们发现它们通常在时间一致性和边界清晰度之间进行权衡：多帧方法倾向于一致性，单帧方法倾向于清晰度。为了克服这种权衡，我们训练了一个单一的、可扩展的网络，该网络同时处理图像和视频，并以原生分辨率预测深度图。Depth Pro 2生成的深度图同时具备度量准确性、清晰度和时间一致性，在所有这些维度上均优于先前工作。我们发布了一系列模型，在度量准确性、清晰度、时间一致性和运行时间方面定义了新的帕累托前沿。我们在 https://apple-aiml-research.github.io/ml-depth-pro-2/ 发布了代码和权重。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在全分辨率下估计图像和视频的密集度量单目深度，克服先前方法在时间一致性和边界清晰度之间的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Depth Pro 2，使用单一可扩展网络同时处理图像和视频并以原生分辨率预测深度图；生成的深度图同时具备度量准确性、清晰度和时间一致性，优于先前工作；发布了一系列模型，在度量准确性、清晰度、时间一致性和运行时间方面定义了新的帕累托前沿；开源了代码和权重。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出Depth Pro 2通过单一网络处理图像和视频，解决了多帧方法和单帧方法在时间一致性和边界清晰度之间的权衡问题。局限性方面，摘要未提供具体的局限性分析，未提及在极端光照、弱纹理或快速运动场景下的表现。摘要未提供具体的度量准确性、清晰度、时间一致性和运行时间的数值指标，也未说明帕累托前沿的具体对比基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 深度估计 / 单目深度估计\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. Probing the \u0026quot;Conscious\u0026quot; Mind: Selective Access and Global Workspace in Vision-Language Models（探测“有意识”的心智：视觉-语言模型中的选择性访问与全局工作区）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 36 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26590\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26590\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map intermediate states to a shared semantic space defined by the decoder\u0026#x27;s output vocabulary to compare concept accessibility across modalities. MC-Lens supports internal concept interventions to examine the role of accessed concepts in downstream computation. (i) Accessibility and selective access. Multimodal concept information is readable in intermediate states and selectively accessible as tasks require. We extend \u0026quot;readout carriers\u0026quot; from one name token to a token set to better capture and express concept information and support counterfactual experiments. (ii) Concepts in downstream computation. Counterfactual experiments show that accessed concept information participates in downstream computation and reasoning. (iii) Development of cross-modal alignment and selective access. We develop two J-space metrics tracking the development of cross-modal concept alignment more clearly than hidden state cosine in controlled VLM training. The experiment also shows that reliable selective access develops later than concept accessibility. (iv) Shared functions across models. Across VLM families and sizes, we find shared patterns of concept accessibility, query-dependent selectivity and cross-task intervention effects despite differences in internal organisation. These findings offer an experimental basis to study GWT in multimodal artificial systems and how it can guide cross-modal alignment improvements.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉-语言模型（VLM）整合视觉和文本信息，但其输出并未揭示内部概念表示。全局工作区理论（GWT）提出，信息从并行的大脑过程中被选择，在共享工作区中整合，并提供给专门的过程。我们引入了多模态概念透镜（MC-Lens），一种多模态雅可比透镜，来研究VLM概念处理中的这些功能。其视觉编码器和语言解码器透镜将中间状态映射到由解码器输出词汇定义的共享语义空间，以比较跨模态的概念可访问性。MC-Lens支持内部概念干预，以检查访问的概念在下游计算中的作用。（i）可访问性与选择性访问。多模态概念信息在中间状态中是可读的，并且根据任务需要可选择性地访问。我们将“读出载体”从一个名称标记扩展到标记集，以更好地捕获和表达概念信息并支持反事实实验。（ii）下游计算中的概念。反事实实验表明，访问的概念信息参与了下游计算和推理。（iii）跨模态对齐与选择性访问的发展。我们开发了两种J空间指标，在受控的VLM训练中，比隐藏状态余弦更清晰地跟踪跨模态概念对齐的发展。实验还表明，可靠的选择性访问发展得晚于概念可访问性。（iv）跨模型的共享功能。在不同的VLM家族和规模中，尽管内部组织存在差异，我们发现了概念可访问性、依赖查询的选择性以及跨任务干预效应的共享模式。这些发现为研究多模态人工系统中的GWT以及如何指导跨模态对齐改进提供了实验基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究视觉-语言模型（VLM）内部概念处理的选择性访问和全局工作区功能，以揭示其内部概念表示及跨模态对齐机制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出多模态概念透镜（MC-Lens），将中间状态映射到共享语义空间以比较跨模态概念可访问性；将“读出载体”扩展为标记集以支持反事实实验；开发两种J空间指标以跟踪跨模态概念对齐发展；发现不同VLM间存在概念可访问性和干预效应的共享模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出多模态概念信息在中间状态可读且可选择性访问，反事实实验证明其参与下游计算；可靠的选择性访问发展晚于概念可访问性。局限性方面，摘要未提供所测试的具体VLM家族和规模名称、J空间指标的具体数学公式或数值结果，以及GWT理论在人工系统中的具体量化验证指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能基础 / 模型可解释性与认知科学交叉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation（掩码并非物体：用于3D高斯分割的体积监督）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 35 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21383\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21383\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003e3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure to group per-pixel contributors and directly supervises all Gaussians in selected depth clusters, bypassing contribution-weighted gradient delivery. To evaluate volumetric completeness, we introduce Removal-3D, a synthetic object-removal benchmark, and the Removal Depth Error (RDE), a metric comparing predicted and ground-truth depth changes. Across four rendering-based baselines, VODA consistently improves volumetric segmentation on Removal-3D while maintaining or improving performance on LERF and ScanNet. Further analysis shows that VODA recovers lower-contribution Gaussians, while simple gradient reweighting and spatial propagation fail to reproduce comparable gains.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e3D高斯泼溅支持对高斯基元进行物体级操作，然而现有的分割方法主要通过渲染视图进行训练和评估。这种不匹配可能会从不完整的3D选择中产生准确的渲染掩码，因为alpha混合特征监督将学习集中在主导贡献者上，而使被遮挡或低贡献的高斯受到微弱的监督。我们提出了VODA，一种即插即用的监督目标，它利用局部深度结构对每像素贡献者进行分组，并直接监督选定深度簇中的所有高斯，从而绕过基于贡献加权的梯度传递。为了评估体积完整性，我们引入了Removal-3D，一个合成物体移除基准，以及移除深度误差（RDE），一种比较预测和真实深度变化的指标。在四个基于渲染的基线中，VODA在Removal-3D上持续提高了体积分割性能，同时在LERF和ScanNet上保持或提高了性能。进一步的分析表明，VODA恢复了低贡献的高斯，而简单的梯度重加权和空间传播未能重现可比的增益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e改进3D高斯泼溅中的物体级分割，解决现有基于渲染视图训练和评估导致的3D选择不完整问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VODA，一种即插即用的监督目标，利用局部深度结构分组像素贡献者并直接监督深度簇中的所有高斯；引入Removal-3D合成物体移除基准和RDE指标以评估体积完整性；在Removal-3D上持续提高体积分割，在LERF和ScanNet上保持或提升性能；成功恢复低贡献高斯，优于简单的梯度重加权和空间传播。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出VODA通过直接监督深度簇中的所有高斯，解决了alpha混合特征监督导致的低贡献和高斯被遮挡部分监督不足的问题。局限性方面，摘要未提供具体的局限性分析，未提及VODA在动态场景、极大场景或复杂光照条件下的表现。摘要未提供Removal-3D、LERF和ScanNet上的具体数值指标，也未说明四个基于渲染的基线的具体名称。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉 / 3D高斯泼溅与分割\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. FastFrames: Video Generation at Interactive Latency（FastFrames：交互式延迟下的视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 33 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23226\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23226\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoregressive video diffusion models generate frames based on new observations and inputs, making them a promising medium for interactive visual experiences. However, existing models are orders of magnitude too slow for fluid interaction. This paper introduces FastFrames, a family of fast autoregressive video diffusion models that achieves interactive latency without compromising quality. We profile the inference pipeline of state-of-the-art models and find that operations often treated as fixed implementation details, such as VAE decoding and KV cache updates, in fact account for over half of end-to-end inference latency. We challenge the assumption that these components are indispensable and replace them with lightweight alternatives. Our 1.3B variant runs at 36 ms per frame, or 28 responses per second (RPS), on a single B200 GPU while matching the generation quality of a state-of-the-art model that is nearly 8x slower. Our 14B variant runs at 45 ms per frame, or 22 RPS, on an 8x B200 GPU node and yields significantly better visual quality and realism. We show that FastFrames enables real-time interaction in applications such as camera-conditioned and physics-conditioned video generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自回归视频扩散模型基于新的观察和输入生成帧，使其成为交互式视觉体验的有前途的媒介。然而，现有模型对于流畅交互来说慢了数个数量级。本文引入了FastFrames，一系列快速的自回归视频扩散模型，在不牺牲质量的情况下实现了交互式延迟。我们对最先进模型的推理流程进行了分析，发现通常被视为固定实现细节的操作（如VAE解码和KV缓存更新）实际上占到了端到端推理延迟的一半以上。我们挑战了这些组件不可或缺的观点，并用轻量级替代方案替换了它们。我们的1.3B变体在单个B200 GPU上以每帧36毫秒或每秒28次响应（RPS）的速度运行，同时匹配了速度慢近8倍的最先进模型的生成质量。我们的14B变体在8x B200 GPU节点上以每帧45毫秒或22 RPS的速度运行，并产生了显著更好的视觉质量和真实感。我们展示了FastFrames能够在相机条件和物理条件视频生成等应用中实现实时交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一系列快速的自回归视频扩散模型（FastFrames），通过优化推理流程中的固定实现细节（如VAE解码和KV缓存更新），在不牺牲生成质量的前提下实现交互式延迟的视频生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出FastFrames，实现不牺牲质量的交互式延迟自回归视频扩散模型。2. 识别出VAE解码和KV缓存更新等固定实现细节占端到端推理延迟的一半以上，并用轻量级替代方案替换。3. 1.3B变体在单B200 GPU上达到36ms/帧（28 RPS），匹配慢8倍的最先进模型质量。4. 14B变体在8x B200 GPU上达到45ms/帧（22 RPS），视觉质量和真实感显著提升。5. 支持相机条件和物理条件视频生成的实时交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过深入剖析自回归视频扩散模型的推理瓶颈，将传统上被视为固定的组件（VAE解码、KV缓存更新）替换为轻量级替代方案，大幅降低了推理延迟。实验证明了其在不同参数规模下的高帧率和高质量。局限：摘要未提供具体的轻量级替代方案的技术细节，摘要未提供14B变体相比1.3B变体或其他基线的具体质量评估指标，摘要未提供相机条件和物理条件视频生成的具体任务设置和定量结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成/深度学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. Breath-Dx: A Time Series Classification Benchmark for Disease Screening with eNose（Breath-Dx：用于电子鼻疾病筛查的时间序列分类基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 33 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15348\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15348\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eElectronic nose (eNose) technology offers a portable, non-invasive route for disease screening via exhaled breath analysis. However, progress in the field is hindered by the lack of systematic benchmarks that compare machine learning methods under realistic conditions, particularly sensor drift, a known but rarely quantified failure mode. Most existing studies rely on small, private datasets with inconsistent protocols, rendering results non-comparable and slowing progress. We introduce Breath-Dx, the first comprehensive benchmark of time series classification methods for breath-based disease screening. Our work leverages the Scent of Health (S-OH) dataset, the largest public clinical eNose collection to date, comprising 1,234 patients across nine diagnostic groups, each providing a 17-channel multivariate time series with explicit temporal train/test splits that account for sensor drift. We systematically evaluate 10 methods spanning four families: feature-based tabular learners, convolution-based models, graph-based, and time series architectures. All methods degrade significantly under temporal validation (0.05-0.12 AUC drop compared to random cross-validation), confirming that drift embeds a strong temporal signal. Under this realistic evaluation, the best methods achieve ROC AUC of 0.74-0.76 for some lung conditions, though others remain near chance. Recurrent architectures show the most consistent performance across diseases, while specialized time series methods achieve the highest peak results. Demographic confounders matter: breath signals provide independent diagnostic value for some conditions but add little beyond age for others. We release the S-OH dataset, all temporal splits, evaluation protocols, and code to enable reproducible research and accelerate progress in clinical breathomics.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e电子鼻（eNose）技术通过呼出气体分析为疾病筛查提供了一种便携、无创的途径。然而，该领域的进展受到缺乏系统性基准的阻碍，这些基准无法在现实条件下比较机器学习方法，特别是传感器漂移，这是一种已知但很少被量化的故障模式。大多数现有研究依赖于具有不一致协议的小型私有数据集，导致结果不可比并减缓了进展。我们引入了Breath-Dx，这是首个用于基于呼吸的疾病筛查的时间序列分类方法的综合基准。我们的工作利用了健康气息（Scent of Health, S-OH）数据集，这是迄今为止最大的公共临床电子鼻数据集，包含来自九个诊断组的1,234名患者，每位患者提供一个17通道的多变量时间序列，并具有明确的时间训练/测试划分以解释传感器漂移。我们系统地评估了跨越四个系列的10种方法：基于特征的表格学习器、基于卷积的模型、基于图的模型和时间序列架构。所有方法在时间验证下均显著退化（与随机交叉验证相比，AUC下降0.05-0.12），证实了漂移嵌入了强烈的时间信号。在这种现实的评估下，最佳方法在某些肺部疾病上实现了0.74-0.76的ROC AUC，而其他疾病仍接近随机水平。循环架构在疾病中表现出最一致的性能，而专门的时间序列方法实现了最高的峰值结果。人口统计学混杂因素很重要：呼吸信号为某些疾病提供了独立的诊断价值，但对其他疾病而言，除了年龄之外增加的价值微乎其微。我们发布了S-OH数据集、所有时间划分、评估协议和代码，以实现可重复的研究并加速临床呼吸组学的进展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建用于基于呼吸的疾病筛查的时间序列分类方法的综合基准，并评估不同机器学习方法在考虑传感器漂移的现实条件下的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入Breath-Dx，首个基于呼吸的疾病筛查时间序列分类综合基准。2. 利用S-OH数据集（包含1234名患者，9个诊断组，17通道多变量时间序列），并设计了考虑传感器漂移的时间训练/测试划分。3. 系统评估了10种跨越四个系列的机器学习方法。4. 揭示了传感器漂移导致时间验证下AUC显著下降（0.05-0.12）。5. 发现人口统计学混杂因素（如年龄）对某些疾病的诊断价值有影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究填补了电子鼻疾病筛查领域缺乏系统性基准的空白，通过引入大型公共数据集和考虑传感器漂移的时间验证协议，提供了更现实的评估。分析表明，传感器漂移对模型性能有显著的负面影响，且不同方法在跨疾病表现上存在差异。局限：摘要未提供具体的传感器漂移量化机制细节，摘要未提供除肺部疾病外其他具体疾病名称的详细AUC数据，摘要未提供人口统计学混杂因素的具体校正方法或定量影响大小。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习/医疗健康/时间序列分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. PaperCritic: Training AI Reviewers to Assess the Soundness of Papers（PaperCritic：训练 AI 审稿人评估论文的可靠性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 33 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17834\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17834\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs AI conference submissions grow rapidly, AI reviewers are being considered as an alternative. However, simply imitating human reviewing is problematic because reviewing serves multiple purposes, including evaluating papers\u0026#x27; soundness, interestingness, and clarity, the last two of which are subjective. In this work, we focus solely on evaluating soundness, the most important and objective criterion, and define the learning objective as jointly maximizing (1) precision, based on the soundness and substantiveness of review points, and (2) recall, the coverage of high-quality reference review points. Under this problem formulation, we construct a quality-labeled review point dataset, PaperSound-23K, using 1K ICLR submissions and 23K human-written and LLM-generated review points. Using this dataset, we train an AI reviewer model, PaperCritic, through reinforcement learning with the F1 score of precision and recall as the reward. Our experiments show that PaperCritic outperforms frontier models and models trained with other AI reviewer training methods on an in-domain test set. Surprisingly, learning to review ICLR submissions also transfers to reviewing Nature-family papers and even to out-of-domain reviewing tasks (e.g., code review, legal contract review, and feedback on story writing).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着 AI 会议投稿量的快速增长，AI 审稿人正被视为一种替代方案。然而，简单地模仿人类审稿是有问题的，因为审稿服务于多个目的，包括评估论文的可靠性、趣味性和清晰度，后两者是主观的。在这项工作中，我们仅专注于评估可靠性，这是最重要且最客观的标准，并将学习目标定义为联合最大化（1）精确度，基于审稿点的可靠性和实质性，以及（2）召回率，即高质量参考审稿点的覆盖率。在这种问题表述下，我们使用 1000 篇 ICLR 投稿和 23000 个人类撰写和 LLM 生成的审稿点，构建了一个质量标注的审稿点数据集 PaperSound-23K。使用该数据集，我们通过强化学习训练了一个 AI 审稿模型 PaperCritic，以精确度和召回率的 F1 分数作为奖励。我们的实验表明，PaperCritic 在域内测试集上优于前沿模型和使用其他 AI 审稿训练方法训练的模型。令人惊讶的是，学习审稿 ICLR 投稿也能迁移到审稿 Nature 系列论文，甚至迁移到域外审稿任务（例如代码审查、法律合同审查和故事写作反馈）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e训练一个专门评估学术论文“可靠性（soundness）”的AI审稿模型，通过最大化审稿点的精确度和召回率来优化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e聚焦于客观的“可靠性”评估，避免了趣味性和清晰度等主观标准；构建了包含2.3万审稿点的PaperSound-23K数据集；采用强化学习以F1分数为奖励训练PaperCritic模型；展现了从学术会议论文到Nature系列论文及域外任务（如代码、法律审查）的强泛化与迁移能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明将审稿目标解耦并专注于客观的可靠性评估是有效的，且强化学习结合F1奖励能提升模型性能。局限性方面，摘要未提供PaperCritic在识别深层逻辑错误或数学推导错误时的具体表现，也未提供与人类专家审稿一致性的详细对比数据，以及强化学习训练的具体超参数或收敛情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 学术文本分析与AI审稿\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development（Game2Player：通过环境-玩家协同开发扩展视觉智能体的游戏体验）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 29 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24154\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24154\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGames are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at scale. In the Game2Player loop, a Builder agent adapts existing web games, exposes their internal state, and defines tasks with state-based progress measures and success checks. A Coding Player and a VLM Player then attempt the tasks and report problems to the Builder for repair, so that play serves as both environment validation and training data collection. With Game2Player, we build 568 verified web games with 3,436 tasks, collect 15.7K trajectories (307 hours of gameplay), and hold out 50 games as the benchmark PlayerBench. To evaluate the collected experience as training data, we train VLM agents with progress-weighted SFT, assigning greater weight to steps that advance task progress. Game2Player-9B improves progress from 14.3% to 31.2% on PlayerBench and from 30.0% to 53.1% on the external GameWorld benchmark. More broadly, our work suggests a path for visual agents to scale their gameplay experience by building, verifying, and learning from existing game worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e游戏是视觉智能体的丰富测试平台，需要感知、长期规划和精确控制。然而，收集人类游戏数据成本高昂，且从游戏视频中学习需要推断缺失的动作。现有数据集也涵盖有限的游戏范围，通常没有明确的任务或可验证的结果。为了解决这些差距，我们引入了Game2Player，一个协同开发游戏环境和玩家的框架，以大规模收集多样且可验证的游戏体验。在Game2Player循环中，构建者智能体改编现有的网页游戏，暴露其内部状态，并定义具有基于状态的进度度量和成功检查的任务。然后，编码玩家和VLM玩家尝试这些任务并向构建者报告问题以进行修复，因此游戏既作为环境验证又作为训练数据收集。通过Game2Player，我们构建了568个经过验证的网页游戏，包含3,436个任务，收集了15.7K条轨迹（307小时的游戏时间），并留出50个游戏作为基准PlayerBench。为了评估收集的体验作为训练数据的效果，我们使用进度加权监督微调（SFT）训练VLM智能体，为推进任务进度的步骤分配更大的权重。Game2Player-9B在PlayerBench上的进度从14.3%提高到31.2%，在外部GameWorld基准上的进度从30.0%提高到53.1%。更广泛地说，我们的工作为视觉智能体通过构建、验证和学习现有游戏世界来扩展其游戏体验提供了一条路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视觉智能体在游戏环境中训练数据收集成本高、缺失动作推断难及现有数据集缺乏明确任务和可验证结果的问题，提出Game2Player框架以协同开发游戏环境和玩家，大规模收集多样且可验证的游戏体验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Game2Player框架，通过构建者智能体改编网页游戏并定义任务，编码玩家和VLM玩家尝试任务并反馈修复，实现环境与玩家的协同开发。2. 构建了568个验证网页游戏（3,436个任务），收集15.7K条轨迹（307小时），并留出50个游戏作为PlayerBench基准。3. 采用进度加权监督微调（SFT）训练VLM智能体，为推进任务进度的步骤分配更大权重。4. Game2Player-9B在PlayerBench上进度从14.3%提升至31.2%，在GameWorld基准上从30.0%提升至53.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了Game2Player在构建大规模可验证游戏数据集及提升VLM智能体游戏进度方面的显著效果。但摘要未提供构建者智能体、编码玩家和VLM玩家的具体模型架构或提示词设计细节，也未说明进度加权SFT中权重的具体计算方式，以及该框架在更复杂或非网页类游戏中的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉智能体与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling（PROLA：用于预测性时空天气降尺度的主正交低秩自适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 28 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.11318\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.11318\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHigh-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution trajectories. To this end, we propose a framework that decomposes prediction into spatial and temporal stages using a shared pretrained backbone, fixed numerical scaffolds, and lightweight residual heads. For backbone adaptation, we introduce PROLA (PRincipal-Orthogonal Low-rank Adaptation), which allocates a fixed low-rank budget between pretrained weights\u0026#x27; principal directions and their orthogonal complement. PROLA further rescales rank-1 optimizer updates using gradient signals, improving adaptation without increasing trainable rank. Experiments in the PSWD setting show that PROLA outperforms representative low-rank adaptation baselines. Further experiments across diverse datasets and tasks support the broader applicability of PROLA, showing that its benefits extend beyond the primary weather downscaling setting.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e高分辨率天气预测对于解析粗粒度全球预测所遗漏的局部大气模式非常重要。大型预训练天气骨干网络改善了全球预测，但调整它们以从最近的粗粒度状态生成未来高分辨率场仍然具有挑战性且成本高昂。我们将这种设置形式化为预测性时空天气降尺度（PSWD），这是一项在预测未来高分辨率轨迹的同时联合细化空间和时间分辨率的任务。为此，我们提出了一个框架，使用共享的预训练骨干网络、固定的数值支架和轻量级残差头将预测分解为空间和时间阶段。对于骨干网络自适应，我们引入了PROLA（主正交低秩自适应），它在预训练权重的主方向及其正交补之间分配固定的低秩预算。PROLA进一步使用梯度信号重新缩放秩为1的优化器更新，在不增加可训练秩的情况下改善自适应。在PSWD设置中的实验表明，PROLA优于具有代表性的低秩自适应基线。跨多个数据集和任务的进一步实验支持了PROLA的更广泛适用性，表明其优势超出了主要的天气降尺度设置。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决从粗粒度状态预测未来高分辨率天气场的挑战，提出预测性时空天气降尺度（PSWD）任务，并开发PROLA（主正交低秩自适应）方法以高效微调预训练天气骨干网络。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 形式化预测性时空天气降尺度（PSWD）任务，联合细化时空分辨率并预测未来高分辨率轨迹。2. 提出分解预测为空间和时间阶段的框架，使用共享预训练骨干、固定数值支架和轻量级残差头。3. 提出PROLA（主正交低秩自适应），在预训练权重的主方向和正交补之间分配固定低秩预算。4. PROLA利用梯度信号重新缩放秩为1的优化器更新，在不增加可训练秩的情况下提升自适应效果。5. 实验证明PROLA在PSWD中优于代表性低秩自适应基线，且在多个数据集和任务中具有广泛适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了PROLA在天气降尺度及其他任务中的有效性和广泛适用性，通过主方向和正交补的预算分配及梯度重缩放提升了低秩微调效率。但摘要未提供具体的预训练骨干网络名称、PSWD任务中使用的具体数据集名称、评估指标，以及PROLA相比基线提升的具体数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e地球科学与人工智能交叉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations（V-JEPA-LM：超越静态、文本对齐表示读取动态的视频语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 28 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17831\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17831\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld-model video encoders such as V-JEPA learn how scenes change (direction, speed, order, state) from video alone. To answer questions, they are joined to a language model trained on captions and question-answer pairs. But each caption or question names only a few attributes of a clip, so the model learns to retrieve those attributes rather than to read the clip, and the dynamics the encoder carries go unused: on the same items, a linear probe reads speed from frozen V-JEPA features at 87% while the VLM answers at chance. We show where dynamics lives in a frozen encoder: in a subspace shared across videos for predictive encoders such as V-JEPA, but not as a shared component of frame-wise, text-aligned encoders such as SigLIP. We then build counterfactual supervision that makes the language model read it: pixel transformations turn public videos into answer-balanced variants whose answers are set by the transformation and differ only in the change. Trained in a single stage on 4.53M public samples with 32 visual tokens per frame, where open video LLMs use several stages, 9M to 172M samples and 64 to 256 tokens per frame on average, the resulting V-JEPA-LM models (1B to 8B, Qwen3 and Llama) lead every size class in average score across eleven video benchmarks; our 4B model scores 72.1, against 61.1 for the best open 4B and 64.8 for the best open 8B model. A controlled encoder x supervision study shows that the encoder decides what can be read and the supervision what is read: at a matched budget, counterfactual supervision adds 4.5 points on average and 38 on the speed questions of natural benchmarks. Code and models: https://github.com/kkt94/Llama-V-JEPA-LM.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e诸如V-JEPA等世界模型视频编码器仅从视频中学习场景如何变化（方向、速度、顺序、状态）。为了回答问题，它们与在字幕和问答对上训练的语言模型结合。但是每个字幕或问题仅命名视频片段的少数属性，因此模型学习检索这些属性而不是读取视频片段，编码器携带的动态信息未被使用：在相同项目上，线性探针从冻结的V-JEPA特征中以87%的准确率读取速度，而VLM的回答仅凭猜测。我们展示了动态信息存在于冻结编码器的何处：对于诸如V-JEPA的预测编码器，它存在于跨视频共享的子空间中，但对于诸如SigLIP的逐帧、文本对齐编码器，则不是共享组件。然后我们构建反事实监督使语言模型读取它：像素变换将公共视频转化为答案平衡的变体，其答案由变换设定且仅在变化上有所不同。在单个阶段使用4.53M个公共样本（每帧32个视觉token）进行训练，而开放视频LLM使用多个阶段、9M到172M个样本以及平均每帧64到256个token，生成的V-JEPA-LM模型（1B到8B，Qwen3和Llama）在11个视频基准测试的每个规模类别中平均得分领先；我们的4B模型得分为72.1，而最佳开放4B模型为61.1，最佳开放8B模型为64.8。受控的编码器乘监督研究表明，编码器决定了能读取什么，监督决定了读取什么：在匹配的预算下，反事实监督平均增加4.5分，在自然基准的速度问题上增加38分。代码和模型：https://github.com/kkt94/Llama-V-JEPA-LM。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视频语言模型（VLM）在结合世界模型视频编码器时，未能有效利用编码器中的动态信息（如速度、方向等）来回答问题的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现VLM倾向于检索文本属性而忽略视频动态信息；提出反事实监督机制，通过像素变换生成答案平衡的变体，迫使语言模型读取动态信息；在单阶段、较少数据和较少视觉token下，V-JEPA-LM在11个视频基准上取得同规模最优成绩（4B模型得分72.1）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的实验数据（如4.53M样本，32视觉token，4B模型72.1分等），证明了方法的有效性。局限性方面，摘要未提供模型在特定复杂场景下的失败案例，未详细说明反事实监督中像素变换的具体类型及其对非速度类动态属性（如状态、顺序）的具体提升数字，也未提及推理成本或延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. Loopback Transformer: Towards a Unified View of Residual Looped Transformers（Loopback Transformer：迈向残差循环Transformer的统一视角）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 28 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.07226\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.07226\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped Transformers reduce parameter count by repeatedly applying shared blocks, but parameter sharing alone does not determine how the results of repeated computation are reused. We take the depth-memory view of residual connections and analyze which representation is stored after each block application and how later reads weight it. A full block output contains both its input and its new update, so weighting that output also reweights the history already carried by the input. Reading individual updates instead, with the shared stack\u0026#x27;s input kept on a separate path, gives separate controls over input strength, total update weight, and allocation across updates. The Loopback Transformer implements these controls: geometric decay sets the total update weight and supplies a recency prior, and attention learns how to allocate that weight. On ClimbMix, Loopback reaches lower validation loss than standard Transformer baselines with 40-75% of their Transformer parameters (excluding token embeddings and the output head) at reference scales from 191M to 3B, with training tokens and executed depth matched. It also has higher mean accuracy over thirteen downstream tasks at 1.4B and 3B. At 191M, 374M, and 778M, it has the lowest validation loss and the highest thirteen-task mean among the standard Transformer and seven looped residual designs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer通过重复应用共享块来减少参数数量，但仅靠参数共享并不能决定重复计算的结果如何被重用。我们采用残差连接的深度-内存视角，分析在每次块应用后存储了哪种表示，以及后续读取如何对其进行加权。完整的块输出包含其输入及其新更新，因此对该输出进行加权也会重新加权输入已携带的历史。相反，读取单个更新，并将共享堆栈的输入保持在单独的路径上，可以对输入强度、总更新权重以及跨更新的分配进行单独控制。Loopback Transformer实现了这些控制：几何衰减设置总更新权重并提供近期先验，注意力机制学习如何分配该权重。在ClimbMix上，Loopback在191M到3B的参考规模下，使用标准Transformer基线40-75%的参数（不包括token嵌入和输出头），在匹配训练token和执行深度的情况下，达到了更低的验证损失。它在1.4B和3B规模下的13个下游任务中也具有更高的平均准确率。在191M、374M和778M规模下，它在标准Transformer和七种循环残差设计中具有最低的验证损失和最高的13任务平均值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e优化循环Transformer中重复计算结果的重用机制，通过控制输入强度、更新权重和分配来降低参数量并提升模型性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e从深度-内存视角分析残差连接，提出Loopback Transformer，通过独立路径控制输入和更新权重；使用几何衰减设置总更新权重并结合注意力机制分配权重；在ClimbMix上，使用40-75%的参数达到更低的验证损失，并在1.4B和3B规模下13个下游任务平均准确率更高。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了明确的参数比例（40-75%）、模型规模（191M到3B）以及对比基线（标准Transformer和七种循环残差设计）。局限性方面，摘要未提供13个下游任务的具体名称和各自准确率提升的数字，未说明几何衰减超参数的敏感性分析，也未提及该方法在更大规模（如超过3B）或更长上下文下的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大模型架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning（EgoCaptioner：迈向全面且细粒度的第一人称视频字幕生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 26 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26380\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26380\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEgocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer\u0026#x27;s motion. Existing caption formats also offer limited support for combining detailed narration with precise timing. We present EgoCaptioner, which pairs a video-level overview of the setting, participants, and the wearer\u0026#x27;s overall activity with timed steps whose narration adapts to varying perceptual demands and marks key moments at specific timestamps. We develop a coarse-to-fine annotation pipeline that establishes event structure before expanding step descriptions, yielding 50,000 training examples from eight egocentric video sources. Complementary rewards assess factual accuracy and coverage, measure step-level temporal alignment, and penalize fragmented or redundant narration, guiding caption refinement through Group Relative Policy Optimization (GRPO). To improve the reliability of factual supervision, we supplement caption references with pose-derived motion facts when sensor data are available. Across five egocentric benchmarks, EgoCaptioner achieves leading performance among evaluated open-source models in caption quality, caption-conditioned question answering, and temporal alignment. It also surpasses Gemini 3.1 Pro on PhysCapBench and all evaluated proprietary baselines on Minerva-Ego under the caption-to-QA protocol. Ablations support the complementary roles of factual and temporal rewards and show that coarse-to-fine annotation provides more effective supervision than single-pass annotation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e第一人称视频字幕生成需要细粒度的细节和准确的时间安排，然而当前的多模态大语言模型经常遗漏短暂动作、混淆其顺序或误解佩戴者的运动。现有的字幕格式也对将详细叙述与精确时间结合的支持有限。我们提出了EgoCaptioner，它将关于场景、参与者和佩戴者整体活动的视频级概述与定时步骤配对，其叙述适应不同的感知需求并在特定时间戳标记关键时刻。我们开发了一种从粗到细的标注流程，在扩展步骤描述之前建立事件结构，从八个第一人称视频源中产生了50,000个训练样本。互补的奖励评估事实准确性和覆盖率，测量步骤级的时间对齐，并惩罚碎片化或冗余的叙述，通过组相对策略优化指导字幕细化。为了提高事实监督的可靠性，当传感器数据可用时，我们用姿态衍生的运动事实补充字幕参考。在五个第一人称基准测试中，EgoCaptioner在评估的开源模型中在字幕质量、字幕条件问答和时间对齐方面取得了领先的性能。它还在PhysCapBench上超越了Gemini 3.1 Pro，并在Minerva-Ego上的所有评估的专有基线中在字幕到问答协议下取得了超越。消融实验支持了事实和时序奖励的互补作用，并表明从粗到细的标注比单次标注提供了更有效的监督。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e生成全面且细粒度的第一人称视频字幕，解决当前多模态大语言模型遗漏短暂动作、混淆顺序、误解运动以及现有格式难以结合详细叙述与精确时间的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出EgoCaptioner，结合视频级概述与适应感知需求的定时步骤叙述；开发从粗到细的标注流程，从8个数据源生成50,000个训练样本；使用互补奖励和组相对策略优化指导字幕细化；利用姿态衍生的运动事实增强事实监督；在5个第一人称基准中开源模型领先，超越Gemini 3.1 Pro及专有基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出EgoCaptioner通过从粗到细的标注流程、互补奖励机制以及姿态衍生的运动事实，解决了第一人称视频字幕生成中的细节遗漏和时间不准问题。局限性方面，摘要未提供具体的局限性分析，未提及模型在计算资源消耗、推理速度或处理极长视频时的表现。摘要未提供5个第一人称基准的具体名称，也未提供字幕质量、问答和时间对齐的具体数值指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频理解 / 第一人称视频字幕生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators（AltRA-Test：无需共享标注者的LLM评委替代标注者检验）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 24 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26073\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26073\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly used as judges and graders to replace human annotators, raising the question of when such replacement is statistically justified. To support such decisions, the Alternative Annotator Test (Alt-Test) was introduced for dense settings where all items are annotated by the same annotators. However, in many large-scale annotation settings, items are annotated by different subsets of annotators. We therefore propose the Alternative Annotator Test with Resampled Annotations (AltRA-Test), a statistical test that does not require that all items are annotated by the same annotators. AltRA-Test uses a bootstrap that resamples items, draws k human annotations for each item, and substitutes one of them with an LLM annotation. This produces paired all-human and mixed human-LLM panels. A replacement is supported when the inter-annotator agreement (IAA) of the mixed panel is statistically non-inferior to the IAA of the all-human panel, i.e., when the LLM preserves the signal that the human annotators share. We establish that AltRA-Test is a consistent test of asymptotic level alpha. We then evaluate it through simulations and real-world experiments in which we test 18 LLMs and 5 prompting techniques on 20 datasets across text, image, audio, and video. Across these evaluations, about 100 items often suffice for the test. In simulations, where we know whether the LLM is a better or a worse annotator than the humans, AltRA-Test makes more correct replacement decisions than existing baselines. In real-world data experiments, LLMs pass the test in about half of the setups, depending mainly on the task. Since replacement is not always justified, we encourage researchers to test it for their task.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLMs）越来越多地被用作评委和评分者来替代人类标注者，这引发了这种替代在何时具有统计学合理性的问题。为了支持此类决策，引入了替代标注者检验（Alt-Test），适用于所有项目由相同标注者标注的密集设置。然而，在许多大规模标注设置中，项目由标注者的不同子集进行标注。因此，我们提出了带有重采样标注的替代标注者检验（AltRA-Test），这是一种不要求所有项目由相同标注者标注的统计检验。AltRA-Test使用一种自举法，对项目进行重采样，为每个项目抽取k个人类标注，并用一个LLM标注替换其中一个。这产生了配对的全人类和混合人类-LLM面板。当混合面板的标注者间一致性（IAA）在统计上不劣于全人类面板的IAA时，即当LLM保留了人类标注者共享的信号时，支持进行替代。我们确立了AltRA-Test是一个渐近水平alpha的一致检验。然后，我们通过模拟和真实世界实验对其进行评估，在这些实验中，我们在跨文本、图像、音频和视频的20个数据集上测试了18个LLM和5种提示技术。在这些评估中，大约100个项目通常就足以进行测试。在模拟中，当我们知道LLM是比人类更好还是更差的标注者时，AltRA-Test比现有基线做出更多正确的替代决策。在真实世界数据实验中，LLM在大约一半的设置中通过了测试，这主要取决于任务。由于替代并非总是合理的，我们鼓励研究人员针对其任务进行测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种统计检验方法（AltRA-Test），用于在大规模标注设置（项目由不同标注者子集标注）中，评估大语言模型（LLM）替代人类标注者是否具有统计学合理性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出AltRA-Test，不要求所有项目由相同标注者标注，通过重采样和自举法生成全人类与混合面板进行对比；证明了该检验是一致检验；在18个LLM、5种提示技术和20个多模态数据集上进行了评估；约100个项目即可满足测试需求；在模拟和真实实验中均表现出优于基线的正确决策能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了AltRA-Test的机制、理论性质（一致检验）、评估规模（18个LLM，5种提示，20个数据集，约100个项目）以及实验结果（一半设置通过测试）。局限性方面，摘要未提供具体的IAA数值差异、显著性水平alpha的具体设定值，也未详细说明不同模态数据集上通过测试的具体比例差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型评估 / 统计检验与标注质量\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning（CurvDelta：用于手术学习与遗忘的低曲率Delta建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 24 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24654\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24654\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA central challenge in adapting large language models (LLMs) is capability preservation: an adaptation can achieve its target while degrading general capabilities. We introduce CurvDelta, a scalable framework that incorporates the preservation constraint into the parameterization of the model update. By analyzing the local geometry of the preservation constraint around the pre-adaptation model, CurvDelta constructs a low-curvature space in which parameter updates leave the preservation loss nearly invariant. We make its construction practical for LLMs through Kronecker-factored approximate curvature (K-FAC) and a factorized projection. We also introduce CurvLoRA, a low-rank variant within the same preservation geometry, designed for more efficient adaptation. Both methods apply to preservation-constrained adaptation tasks such as capability learning and selective unlearning. We evaluate our methods on mathematical reasoning, code generation, and knowledge unlearning. For mathematical reasoning and code generation, our approaches achieve competitive downstream performance while better preserving general capabilities, offering a favorable acquisition--retention trade-off relative to the baselines. For knowledge unlearning, our main results on TOFU and MUSE show a better balance between targeted forgetting and knowledge retention than the baselines, with retention performance close to the from-scratch retraining reference.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e适应大型语言模型（LLMs）的一个核心挑战是能力保留：适应可以实现其目标，同时降低通用能力。我们引入了CurvDelta，一个可扩展的框架，它将保留约束纳入模型更新的参数化中。通过分析预适应模型周围保留约束的局部几何，CurvDelta构建了一个低曲率空间，其中参数更新使保留损失几乎保持不变。我们通过Kronecker分解近似曲率（K-FAC）和分解投影使其对LLMs的构建变得实用。我们还引入了CurvLoRA，一种在同一保留几何内的低秩变体，旨在实现更高效的适应。这两种方法都适用于保留约束的适应任务，如能力学习和选择性遗忘。我们在数学推理、代码生成和知识遗忘方面评估了我们的方法。对于数学推理和代码生成，我们的方法在更好地保留通用能力的同时实现了有竞争力的下游性能，相对于基线提供了有利的获取-保留权衡。对于知识遗忘，我们在TOFU和MUSE上的主要结果显示，在目标遗忘和知识保留之间比基线有更好的平衡，保留性能接近从头开始重新训练的参考。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e大型语言模型的保留约束适应任务，包括能力学习（数学推理、代码生成）和选择性知识遗忘。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CurvDelta框架，利用K-FAC和分解投影构建低曲率空间以保留通用能力；提出CurvLoRA低秩变体以提高效率；在获取-保留权衡和目标遗忘-知识保留平衡上优于基线，保留性能接近从头重新训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在数学推理、代码生成和知识遗忘（TOFU, MUSE数据集）上有效，且保留性能接近从头重新训练。局限性方面，摘要未提供具体的性能提升或下降数字、计算开销对比、除TOFU和MUSE外的其他遗忘数据集表现，也未提及标题中提到的真实手术场景的应用验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型微调与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. TCP4D: A Unified Tool-Center-Point Tracking and Generation Model for Robot Manipulation（TCP4D：用于机器人操作的统一工具中心点跟踪与生成模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 24 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23143\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23143\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobot manipulation videos provide a rich visual experience, yet recovering robot action and gripper-state annotations from RGB observations still remains challenging. Using the embodiment-agnostic tool-center-point (TCP) pose as the action space, we present TCP4D, a unified model in which a shared 4D scene representation both tracks observed TCP motion and generates future TCP trajectories. Given a monocular video and initial 2D TCP queries, the tracker directly recovers metric TCP poses in SE(3) and gripper states alongside scene geometry and camera parameters. The generator samples local features from the same 4D representation along the recovered TCP tracks, then combines them with robot observations and language instructions to predict future TCP states. Our new cross-embodiment augmentation pipeline converts existing RGB videos into demonstrations for alternative embodiments by retargeting the recovered motion and synthesizing the corresponding observations, without recorded source-robot states. Experiments show that the tracker achieves absolute trajectory errors of 7.60 and 16.07 mm on DROID and RoboLab and adapts to a new embodiment with only ten demonstrations. The generator achieves 69.19% mean success on RoboTwin and outperforms well-established policy models on two real-world tasks, while joint training on source and augmented demonstrations improves target-robot success by 41.5% over augmented-only training.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人操作视频提供了丰富的视觉体验，但从RGB观察中恢复机器人动作和夹爪状态注释仍然具有挑战性。使用与具体实体无关的工具中心点（TCP）位姿作为动作空间，我们提出了TCP4D，一个统一模型，其中共享的4D场景表示既跟踪观察到的TCP运动，又生成未来的TCP轨迹。给定单目视频和初始2D TCP查询，跟踪器直接在SE(3)中恢复度量TCP位姿和夹爪状态，以及场景几何和相机参数。生成器从恢复的TCP轨迹上的相同4D表示中采样局部特征，然后将它们与机器人观察和语言指令结合以预测未来TCP状态。我们新的跨实体增强管道通过将恢复的运动重新定向并合成相应的观察，将现有的RGB视频转换为替代实体的演示，而无需记录源机器人状态。实验表明，跟踪器在DROID和RoboLab上分别实现了7.60毫米和16.07毫米的绝对轨迹误差，并仅使用十个演示即可适应新实体。生成器在RoboTwin上实现了69.19%的平均成功率，并在两个真实世界任务中优于成熟的策略模型，而在源和增强演示上进行联合训练使目标机器人的成功率比仅增强训练提高了41.5%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个统一模型TCP4D，使用与实体无关的工具中心点（TCP）位姿作为动作空间，从单目RGB视频中跟踪当前的TCP运动并生成未来的TCP轨迹，同时通过跨实体增强管道提升机器人操作策略的学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出TCP4D统一模型，利用共享的4D场景表示同时跟踪观察到的TCP运动并生成未来TCP轨迹。2. 跟踪器能从单目视频和2D查询中恢复SE(3)中的度量TCP位姿、夹爪状态、场景几何和相机参数。3. 提出跨实体增强管道，无需源机器人状态即可将RGB视频转换为其他实体的演示。4. 跟踪器在DROID和RoboLab上的绝对轨迹误差分别为7.60mm和16.07mm，仅需10个演示即可适应新实体。5. 生成器在RoboTwin上达到69.19%平均成功率，联合训练使目标机器人成功率提升41.5%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过引入与实体无关的TCP动作空间和共享的4D场景表示，解决了从RGB视频恢复机器人动作和生成轨迹的难题。跨实体增强管道有效缓解了数据稀缺问题。局限：摘要未提供生成器在两个真实世界任务中的具体成功率数字，摘要未提供4D场景表示的具体网络架构细节，摘要未提供跨实体增强管道中重新定向和合成观察的具体算法，摘要未提供仅增强训练的基线成功率以计算41.5%的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/计算机视觉/深度学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. Language Models Can Rewrite Their Own Weights（语言模型可以重写自身的权重）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21885\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21885\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage models are trained once, frozen and deployed: improving one again takes another training run, and a prompt, a scaffold or extra computation at inference is gone once the task ends. A frontier model has been shown to edit the weights of a much smaller one. We ask whether a model can rewrite its own weights to make itself better, and find that it can, by its own reasoning, with no gradients and no training; we call this self-rewriting. Given its weights, graded answers and the ability to run itself, a 27B model diagnoses its failure and edits the weights behind it. It surpasses itself: its own edit makes it 6.6 points more accurate on 490 problems it never saw, in a test fixed in advance, and another session\u0026#x27;s edit also makes it significantly better. It keeps getting better: it submits an edit only when its own tests support it, each edit replacing the last, and over its first eight such sessions its accuracy only rises. Unlike test-time scaling, the gain persists in its weights and adds no cost per answer; unlike training, it needs no pre- or post-training infrastructure, only an open model and hours on one GPU. It repairs a damaged copy of itself: it locates the corrupted matrix and rewrites it with values of its own, never reading the undamaged weights; found on text math problems alone, the repair lifts the copy on six image benchmarks it never saw from 7% to 70% accuracy, 83% of the undamaged model\u0026#x27;s. And the ability emerges with scale: across four sizes of one family, the 2B model makes no edit and the 4B and 9B models break themselves; only the 27B model works on itself as a human would, comparing its hidden states on answers that finish and on answers that run out of tokens, weakening the direction that separates them. Like a human, a model need not separate training from inference; improving a language model may come to take a conversation rather than a training run.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型通常只训练一次，冻结后部署：再次改进需要另一次训练运行，而提示、脚手架或推理时的额外计算在任务结束后就消失了。前沿模型已被证明可以编辑小得多模型的权重。我们询问模型是否可以重写自身的权重以变得更好，并发现它可以，通过其自身的推理，无需梯度和训练；我们称之为自我重写。给定其权重、分级答案和运行自身的能力，一个27B模型诊断其失败并编辑背后的权重。它超越了自身：其自身的编辑使其在预先固定的测试中，对490个它从未见过的问题准确率提高了6.6分，另一次会话的编辑也使其显著提高。它不断变得更好：它只在自身测试支持时提交编辑，每次编辑替换上一次，在其前八次此类会话中，其准确率只升不降。与测试时扩展不同，这种增益持久存在于其权重中，且每个答案不增加成本；与训练不同，它不需要预训练或后训练基础设施，只需要一个开放模型和在单个GPU上运行数小时。它修复了自身的一个损坏副本：它定位损坏的矩阵并用自身的值重写它，从不读取未损坏的权重；仅在文本数学问题上发现，这种修复将其在六个它从未见过的图像基准上的准确率从7%提升至70%，达到未损坏模型的83%。并且这种能力随规模涌现：在一个系列的四个尺寸中，2B模型不进行编辑，4B和9B模型破坏了自身；只有27B模型像人类一样对自身进行操作，比较完成的答案和耗尽token的答案的隐藏状态，削弱分隔它们的方向。像人类一样，模型无需将训练与推理分离；改进语言模型可能只需一次对话而非一次训练运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索语言模型是否能够通过自身推理重写自身权重以提升性能，而无需梯度或额外训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出自我重写概念，27B模型能在无梯度、无训练的情况下通过推理诊断失败并编辑自身权重。2. 在490个未见问题上准确率提升6.6分，且增益持久存在于权重中，不增加推理成本。3. 能够修复损坏的模型副本，将图像基准准确率从7%提升至70%。4. 该能力具有规模效应，仅在27B模型上成功涌现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法无需预训练或后训练基础设施，仅需单GPU运行数小时，且能持续自我改进。局限性方面，摘要未提供关于该方法在非数学或非图像等其他任务类型上的适用性、权重编辑过程的具体计算开销、以及长期自我改进的稳定性等详细数据或分析，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. HiUni: Harmonizing Understanding and Generation in Shared Visual Space（HiUni：在共享视觉空间中协调理解与生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26107\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26107\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unification. In this paper, we present HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly extended into a unified model with extensive parameter sharing. Specifically, HiUni reuses the same language-aligned ViT and dense Transformer backbone for both capabilities, while confining task-specific computation to the output side. Yet such a design introduces two key challenges. Generation in pixel space is difficult to optimize, and semantic abstraction in pretrained ViT discards fine spatial details required for synthesis. To address these challenges, HiUni introduces a Pixel Diffusion Head tailored to direct pixel-space optimization and a lightweight HiGate pathway that provides fine-grained spatial details near the output stage. Extensive experiments show that HiUni achieves a similar average understanding score to the pretrained VLM while attaining competitive performance on image generation and editing. Controlled comparisons and analyses further demonstrate that a single dense backbone can effectively support both capabilities without task-specific backbone computation, highlighting a simpler path toward unified multimodal modeling.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e统一的多模态模型旨在单一框架内支持视觉理解和生成。然而，主流方法通常分离其视觉表示或骨干计算以适应这两个任务的不同要求，这限制了统一的程度。在本文中，我们提出了HiUni，重新审视了这一设计选择，并探索预训练的视觉语言模型是否可以直接扩展为具有广泛参数共享的统一模型。具体而言，HiUni为这两种能力重用相同的语言对齐ViT和密集Transformer骨干，同时将特定任务的计算限制在输出端。然而，这种设计引入了两个关键挑战。像素空间中的生成难以优化，并且预训练ViT中的语义抽象丢弃了合成所需的精细空间细节。为了应对这些挑战，HiUni引入了专为直接像素空间优化定制的像素扩散头，以及在输出阶段附近提供细粒度空间细节的轻量级HiGate路径。大量实验表明，HiUni实现了与预训练VLM相似的平均理解分数，同时在图像生成和编辑方面取得了具有竞争力的性能。受控的比较和分析进一步证明，单一密集骨干可以有效支持这两种能力，而无需特定任务的骨干计算，凸显了通往统一多模态建模的更简单路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在单一框架内实现视觉理解和图像生成与编辑的统一，探索预训练视觉语言模型通过广泛参数共享直接扩展为统一模型的可能性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出HiUni，重用相同的语言对齐ViT和密集Transformer骨干，将特定任务计算限制在输出端；引入像素扩散头以直接优化像素空间，引入轻量级HiGate路径提供细粒度空间细节；实现与预训练VLM相似的平均理解分数，并在图像生成和编辑上取得竞争力性能；证明单一密集骨干无需特定任务骨干计算即可有效支持理解和生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出HiUni通过共享骨干网络并引入像素扩散头和HiGate路径，解决了像素空间生成优化困难和预训练ViT丢失空间细节的问题，实现了理解和生成的统一。局限性方面，摘要未提供具体的局限性分析，未提及模型在视频理解、3D视觉或其他模态上的扩展性，也未说明在极高分辨率图像生成或复杂推理任务上的表现。摘要未提供具体的平均理解分数、图像生成和编辑的评估指标数值，也未说明与哪些具体基线进行了对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态学习 / 统一视觉理解与生成模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. ZeroVLN: Learning to Navigate without Supervised Fine-Tuning of the VLM Brain（ZeroVLN：无需对VLM大脑进行监督微调的导航学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26414\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26414\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRepresentative vision-language navigation (VLN) methods typically couple a vision-language model (VLM) brain with a learnable action head and fine-tune the VLM brain on navigation-domain data to predict geometric goals. However, such adaptation can substantially alter base VLM weights and degrade general visual capabilities. We introduce ZeroVLN, a slow-fast navigation framework that achieves effective navigation with zero navigation-domain SFT of the VLM brain. Rather than teaching the brain to predict geometric goals, we equip it with a semantic tool-calling interface for conveying movement decisions to an action expert in natural language. We first adapt the action expert to carry out these movement requests, then jointly improve the brain\u0026#x27;s movement decisions and the action expert\u0026#x27;s continuous execution through closed-loop reinforcement learning (RL). Trained on the same navigation episodes, ZeroVLN substantially outperforms representative SFT-based hierarchical VLN methods on standard VLN-CE (continuous environments) benchmarks, while inducing only minor changes to the brain\u0026#x27;s weights and largely preserving its general capabilities. To our knowledge, ZeroVLN is the first slow-fast VLN framework with zero navigation-domain SFT of the VLM brain, and the first to jointly optimize its slow and fast policies through closed-loop agentic RL in VLN-CE.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代表性的视觉语言导航（VLN）方法通常将视觉语言模型（VLM）大脑与可学习的动作头结合，并在导航领域数据上微调VLM大脑以预测几何目标。然而，这种适应会大幅改变基础VLM权重并降低通用视觉能力。我们引入了ZeroVLN，一个慢快导航框架，在VLM大脑零导航领域监督微调（SFT）的情况下实现有效导航。我们没有教大脑预测几何目标，而是为其配备了语义工具调用接口，以自然语言将移动决策传达给动作专家。我们首先使动作专家适应执行这些移动请求，然后通过闭环强化学习（RL）联合改善大脑的移动决策和动作专家的连续执行。在相同的导航片段上训练，ZeroVLN在标准VLN-CE（连续环境）基准上大幅优于代表性的基于SFT的分层VLN方法，同时仅引起大脑权重的微小变化并很大程度上保留了其通用能力。据我们所知，ZeroVLN是第一个VLM大脑零导航领域SFT的慢快VLN框架，也是第一个在VLN-CE中通过闭环智能体RL联合优化其慢速和快速策略的框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在不进行导航领域监督微调（SFT）的情况下，训练视觉语言模型（VLM）实现有效的视觉语言导航（VLN），同时保留其通用视觉能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出ZeroVLN慢快导航框架，实现VLM大脑零导航领域SFT；通过语义工具调用接口将移动决策传达给动作专家；通过闭环强化学习（RL）联合优化大脑的移动决策和动作专家的连续执行；在VLN-CE基准上大幅优于基于SFT的方法，且仅引起大脑权重微小变化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要说明了ZeroVLN的核心机制（语义工具调用、闭环RL）和主要结果（在VLN-CE基准上优于SFT方法，保留通用能力）。局限性方面，摘要未提供具体的性能提升数字、计算资源消耗，也未提及在离散环境或其他非VLN-CE基准上的表现，以及动作专家在极端情况下的执行失败率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉语言导航 / 强化学习与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. TuringSpace: Grounding Spatial Intelligence in Action with Interactive CAPTCHAs（TuringSpace：通过交互式验证码将空间智能落地于动作中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25387\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25387\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHumans act in the visual world by inferring the 3D layout behind a 2D view, predicting how an action changes it, and correcting themselves after seeing the result. Can multimodal large language models (MLLMs) do the same? CAPTCHAs offer a natural test, since humans solve them through this very loop, clicking and dragging on the screen and adjusting after each result. Yet existing CAPTCHA benchmarks are largely solved and rarely spatial, while spatial benchmarks rarely require action. We therefore present TuringSpace, a synthetic web environment of 125 interactive CAPTCHAs that span five spatial abilities and must be solved through clicks and drags on the screen. Every task is a program that generates new instances with a checker and an oracle, so the tasks also form a scalable training gym. Humans solve 94.1% of the tasks, whereas the best model, GPT-6 Astra, still fails 25.9% of them, and the best open-weight model, Kimi K3, fails 68.0%. Our further analysis shows that most failures come from misreading the screenshot, and that model reasoning rarely corrects a wrong belief but hallucinates evidence to defend it. To test whether such spatial abilities can be learned, we fine-tune Qwen3.5-9B on this gym. Its success rate rises from 1.6% to 33.1%, above Kimi K3, and it improves on all seven out-of-distribution benchmarks, including a 9.9-point gain on the real-world indoor videos of VSI-Bench. These results show that grounding spatial intelligence in screen actions exposes what MLLMs lack and offers a scalable way to teach it, with gains that transfer to real-world scenes. We will release TuringSpace to support further study.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人类通过在2D视图背后推断3D布局、预测动作如何改变它以及在看到结果后纠正自己来在视觉世界中行动。多模态大语言模型（MLLMs）能做到同样吗？验证码提供了一个自然的测试，因为人类正是通过这个循环来解决它们的，在屏幕上点击和拖动并在每次结果后进行调整。然而，现有的验证码基准大部分已被解决且很少涉及空间，而空间基准很少需要动作。因此，我们提出了TuringSpace，一个包含125个交互式验证码的合成网络环境，涵盖五种空间能力，必须通过在屏幕上的点击和拖动来解决。每个任务都是一个程序，生成带有检查器和预言机的新实例，因此这些任务也构成了一个可扩展的训练场。人类解决了94.1%的任务，而最好的模型GPT-6 Astra仍然失败了25.9%，最好的开源权重模型Kimi K3失败了68.0%。我们的进一步分析表明，大多数失败来自于误读截图，并且模型推理很少纠正错误的信念，而是产生幻觉证据来为其辩护。为了测试这种空间能力是否可以被学习，我们在这个训练场上微调了Qwen3.5-9B。其成功率从1.6%上升到33.1%，高于Kimi K3，并且在所有七个分布外基准上都有提升，包括在VSI-Bench的真实世界室内视频上获得了9.9分的提升。这些结果表明，将空间智能落地于屏幕动作中暴露了MLLMs所缺乏的东西，并提供了一种可扩展的教学方法，其收益可以转移到真实世界的场景中。我们将发布TuringSpace以支持进一步的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和提升多模态大语言模型（MLLMs）在交互式验证码环境中的空间智能和屏幕动作能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了TuringSpace，一个包含125个交互式验证码的合成网络环境，涵盖五种空间能力；发现GPT-6 Astra和Kimi K3等顶尖模型在此任务上表现不佳，主要失败原因是误读截图和幻觉辩护；微调Qwen3.5-9B不仅大幅提升了在该环境中的成功率，还在七个分布外基准（包括VSI-Bench）上实现了泛化提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了TuringSpace的具体规模（125个验证码）、人类和模型的具体表现数字（人类94.1%，GPT-6 Astra失败25.9%，Kimi K3失败68.0%），以及微调Qwen3.5-9B的具体提升（1.6%到33.1%，VSI-Bench提升9.9分）。局限性方面，摘要未提供关于模型在更复杂真实世界3D交互中的表现局限，也未提供微调数据的具体规模或计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型 / 空间智能与具身交互\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. Heave-Ho: Decentralized Long-Horizon Multi-Humanoid Collaboration（Heave-Ho：去中心化的长时域多人形机器人协作）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22275\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22275\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCollaboration promises to extend humanoid capabilities beyond what individual robots can achieve. However, realizing this potential requires coordinated whole-body interactions, coherent long-horizon planning, and precise synchronization across robots. We introduce Heave-Ho, a decentralized framework for long-horizon collaborative multi-humanoid loco-manipulation. At the low level, we develop a multi-agent post-training framework that adapts a humanoid foundation tracking model to physically coupled interactions between humanoids, enabling coordinated decentralized control from local observations alone. At the high level, we train a vision-language planner and design a speech-based leader-follower coordination mechanism to synchronize decentralized execution without network communication. Trained with two identical humanoids, our system scales to teams of up to ten robots and generalizes to heterogeneous teams without retraining. To benchmark these capabilities, we introduce HH-Bench, comprising 12 tasks involving teams of 2 to 10 humanoids, including heterogeneous teams. Systematic evaluations show that Heave-Ho consistently outperforms baseline methods, while real-world experiments demonstrate robust decentralized collaboration across challenging tasks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e协作有望将人形机器人的能力扩展到单个机器人所能实现的之外。然而，实现这一潜力需要协调的全身交互、连贯的长时域规划以及跨机器人的精确同步。我们引入了Heave-Ho，一个用于长时域协作多人形机器人运动操作的去中心化框架。在底层，我们开发了一个多智能体后训练框架，将人形机器人基础跟踪模型适应于人形机器人之间的物理耦合交互，仅通过局部观察实现协调的去中心化控制。在高层，我们训练了一个视觉-语言规划器，并设计了一种基于语音的领导者-跟随者协调机制，以在没有网络通信的情况下同步去中心化执行。使用两个相同的人形机器人进行训练，我们的系统可扩展到多达十个机器人的团队，并在无需重新训练的情况下泛化到异构团队。为了对这些能力进行基准测试，我们引入了HH-Bench，包含涉及2到10个人形机器人团队（包括异构团队）的12项任务。系统评估表明，Heave-Ho始终优于基线方法，而真实世界实验证明了在具有挑战性的任务中稳健的去中心化协作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Heave-Ho，一个用于长时域协作多人形机器人运动操作的去中心化框架，结合底层的多智能体后训练物理耦合控制和高层的视觉-语言规划及语音协调机制，并引入HH-Bench基准测试集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Heave-Ho去中心化框架，实现长时域多人形机器人运动操作协作。2. 底层开发多智能体后训练框架，仅依赖局部观察实现物理耦合交互的协调控制。3. 高层结合视觉-语言规划器和基于语音的领导者-跟随者协调机制，实现无网络通信的同步。4. 系统可扩展至10个机器人团队，并无需重训练即可泛化至异构团队。5. 引入HH-Bench基准，包含12项涉及2-10个（含异构）人形机器人的任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过分层设计（底层物理耦合控制+高层视觉语言与语音协调）解决了多机器人协作中的全身交互、长时域规划和精确同步问题。无网络通信的语音协调和异构团队的泛化能力是重要亮点。局限：摘要未提供HH-Bench中12项任务的具体名称和评估指标，摘要未提供始终优于基线方法的具体定量数据，摘要未提供真实世界实验中具有挑战性的任务的具体细节和成功率，摘要未提供底层多智能体后训练的具体算法或奖励函数设计。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/多智能体系统/强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. LynnReal-Hand: Unlocking World Interaction with Hand Control（LynnReal-Hand：通过手部控制解锁世界交互）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21479\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21479\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eInteractive video world models enable exploration through text and camera controls, yet direct object interaction requires finer control. Hands provide a natural interface, but translating continuous hand movements into coherent visual responses remains challenging because of complex hand-object dynamics and demanding real-time computation. To address these challenges, we introduce LynnReal-Hand, a hand-controlled video world model that unifies precise interaction modeling with efficient streaming generation. We curate 100K interaction clips spanning diverse real and synthetic environments and develop hand-aware supervision to improve fine-grained hand motions and object interactions. Building on this foundation, we learn a causal flow map for few-step generation and introduce region-aware score distillation that combines complementary video and image priors to refine interaction dynamics and visual appearance. To further reduce inference latency, we propose Ultra-Fast-VAE, a compact video decoder that preserves high reconstruction fidelity with substantially lower computational cost. Extensive evaluations on HandBench demonstrate superior hand-following accuracy and visual quality compared with existing approaches. Our full-sequence model achieves an FVD of 181.67 and a MANO Dice score of 93.02, while the three-step causal model maintains a MANO Dice score of 92.49. For real-time interaction, 540p streaming on a single H200 reaches 18.03 FPS with 741ms latency and an optimized peak GPU memory footprint of only 34.89GB. We will release the datasets, model weights, and the full training and inference code to support research on hand-controlled video world models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e交互式视频世界模型通过文本和相机控制实现探索，但直接的对象交互需要更精细的控制。手部提供了一个自然的界面，但由于复杂的手-物体动力学和苛刻的实时计算要求，将连续的手部动作转化为连贯的视觉响应仍然具有挑战性。为了应对这些挑战，我们引入了LynnReal-Hand，一个手部控制的视频世界模型，它将精确的交互建模与高效的流式生成统一起来。我们整理了10万个跨越不同真实和合成环境的交互片段，并开发了手部感知监督以改善细粒度的手部动作和对象交互。在此基础上，我们学习了一个因果流图用于少步生成，并引入了结合互补视频和图像先验的区域感知分数蒸馏，以优化交互动力学和视觉外观。为了进一步降低推理延迟，我们提出了Ultra-Fast-VAE，一种紧凑的视频解码器，在保持高重建保真度的同时大幅降低计算成本。在HandBench上的广泛评估表明，与现有方法相比，其具有卓越的手部跟随精度和视觉质量。我们的全序列模型实现了181.67的FVD和93.02的MANO Dice分数，而三步因果模型保持了92.49的MANO Dice分数。对于实时交互，在单个H200上的540p流媒体传输达到18.03 FPS，延迟为741ms，优化的峰值GPU内存占用仅为34.89GB。我们将发布数据集、模型权重以及完整的训练和推理代码，以支持手部控制视频世界模型的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种名为LynnReal-Hand的手部控制视频世界模型，旨在解决将连续手部动作转化为连贯视觉响应的挑战，实现精确的手-物交互建模与高效的实时流式生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出LynnReal-Hand，统一了精确的手-物交互建模与高效的流式视频生成。2. 构建了包含10万个真实和合成环境交互片段的数据集，并开发了手部感知监督机制。3. 引入因果流图进行少步生成，结合区域感知分数蒸馏优化交互动力学和视觉外观。4. 提出Ultra-Fast-VAE
