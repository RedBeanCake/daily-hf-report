b\u003e研究任务：\u003c/b\u003e解决统一多模态模型中生成式训练未能有效提升视觉理解能力的问题，通过重新表述生成目标来弥合生成表征与理解感知表征之间的不匹配。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出UMM-JEPA，将生成重新表述为连续视觉理解表征的渐进预测；构建多尺度表征层次结构并解耦像素渲染；在16个基准测试上视觉平均分达51.71（基线46.36）；线性探测和干预表明其具有更丰富的对象和空间结构及图像特定信息使用能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了UMM-JEPA在16个基准上的具体得分（51.71对比46.36），证明了其在视觉和文本理解上的提升。局限性方面，摘要未提供该模型在纯生成任务（如图像合成质量）上的表现、多尺度表征预测的计算复杂度、以及解耦像素渲染对最终生成图像质量的具体影响等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e166. LoopFill: Pipelined Multi-Token Speculative Decoding for Looped Transformers（LoopFill：用于循环Transformer的流水线多Token推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19649\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19649\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped Transformers improve parameter efficiency by repeatedly applying the same Transformer layers. During autoregressive decoding, however, generating each token requires several sequential passes through these layers, leading to high decoding latency. Pipelined self-speculative methods use shallow-loop predictions to process tokens at different loops in the same batch, but each token must reach the drafting depth before the next can enter the pipeline. We introduce LoopFill, a training-free speculative decoding algorithm for looped LLM that combines multi-token suffix drafts with shallow-loop predictions in a single draft tree. Both drafters contribute to one tree, so a suffix lookup can immediately extend a shallow prediction and several future tokens can enter the pipeline together. The shared block computes the highest-scoring draft candidates at different loop depths in one batch, and full-depth verification preserves the model\u0026#x27;s autoregressive output distribution. Across seven benchmarks, LoopFill\u0026#x27;s average speedup over greedy autoregressive decoding is 5.85times on Ouro-2.6B and 5.13times on Huginn-3.5B. The speedups exceed those of LoopAhead, the strongest baseline, by \\(40\\%\\) on Ouro-2.6B and \\(25\\%\\) on Huginn-3.5B.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer通过重复应用相同的Transformer层来提高参数效率。然而，在自回归解码期间，生成每个token需要对这些层进行多次顺序传递，从而导致高解码延迟。流水线自推测方法使用浅层循环预测在同一批次中处理不同循环的token，但每个token必须达到起草深度后，下一个才能进入流水线。我们引入了LoopFill，这是一种用于循环LLM的免训练推测解码算法，它将多token后缀草稿与浅层循环预测结合在单个草稿树中。两个起草器都贡献于一棵树，因此后缀查找可以立即扩展浅层预测，并且多个未来token可以一起进入流水线。共享块在一个批次中计算不同循环深度下得分最高的草稿候选，并且全深度验证保留了模型的自回归输出分布。在七个基准测试中，LoopFill在Ouro-2.6B上的平均加速比贪婪自回归解码快5.85倍，在Huginn-3.5B上快5.13倍。这些加速比超过了最强基线LoopAhead，在Ouro-2.6B上高出40%，在Huginn-3.5B上高出25%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e降低循环Transformer在自回归解码过程中的高解码延迟，提高循环大语言模型的推理速度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练推测解码算法LoopFill，将多token后缀草稿与浅层循环预测结合在单一草稿树中；允许后缀查找立即扩展浅层预测，使多个未来token同时进入流水线；在Ouro-2.6B和Huginn-3.5B上分别实现5.85倍和5.13倍的平均加速，超越最强基线LoopAhead 40%和25%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出LoopFill通过结合多token后缀草稿和浅层循环预测，有效解决了循环Transformer解码延迟高的问题，且无需训练。局限性在于：摘要未提供关于该算法在不同模型规模、不同硬件平台上的通用性数据，也未提及在长文本生成或复杂推理任务中的具体表现及内存开销变化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型推理加速\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e167. Ego Guidance: Enhancing Robot Policy Learning with Action-Free Human Egocentric Videos（自我引导：利用无动作监督的人类第一人称视频增强机器人策略学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.13685\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.13685\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn this paper, we investigate how human egocentric videos can benefit robot policy learning without action supervision. Building on a pretrained VLM, we propose Shared Prediction on Action and Representation (SPAR), an MoT architecture in which future visual state prediction can provide independent and complementary learning signals alongside action prediction. We find that representations learned from egocentric videos improve downstream performance on out-of-distribution robot tasks, with further gains as video data scales. We also study the effects of objective choices and data curation, providing insights into how to leverage action-free videos for scalable robot learning.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在本文中，我们研究了在没有动作监督的情况下，人类第一人称视频如何使机器人策略学习受益。基于预训练的VLM，我们提出了动作和表征共享预测（SPAR），这是一种MoT架构，其中未来视觉状态预测可以与动作预测一起提供独立且互补的学习信号。我们发现，从第一人称视频中学习到的表征提高了在分布外机器人任务上的下游性能，并且随着视频数据规模的扩大，性能会进一步提升。我们还研究了目标选择和数据整理的影响，提供了关于如何利用无动作视频进行可扩展机器人学习的见解。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究如何利用无动作监督的人类第一人称视频来增强机器人策略学习，提高在分布外任务上的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了基于预训练VLM的SPAR（动作和表征共享预测）MoT架构，利用未来视觉状态预测提供独立且互补的学习信号；证明了从第一人称视频学习的表征能提升分布外机器人任务性能，且随数据规模增加而提升；研究了目标选择和数据整理的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法利用无动作视频提升了分布外任务性能，并随数据规模扩大而提升。局限性方面，摘要未提供具体的实验数据集名称、具体的性能提升数字、基线模型对比结果，以及该方法在特定机器人硬件或复杂物理交互中的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉 / 机器学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e168. Dual Flow: Joint Image-Measurement Interpolation for Inverse Problems（Dual Flow：用于逆问题的联合图像-测量插值）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.05843\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.05843\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerative model-based approaches to linear inverse problems typically use the acquired noisy measurement to condition or guide sampling in the image domain. In this work, we introduce Dual Flow, a novel joint-flow model for solving linear inverse problems by jointly estimating the clean image and corresponding noise-free measurement from the observation. Specifically, Dual Flow formulates image reconstruction and measurement denoising as a coupled estimation problem, using coupled flows in the image and measurement domains. The acquired noisy measurement is used only to initialize the measurement state; thereafter, image and measurement states are jointly updated based on their current values. By construction, the final image and measurement estimates are guaranteed to satisfy the underlying forward model. We derive the sampling updates for the joint-flow which involves the conditional mean of the clean image given the joint state. We further derive a closed-form expression for a sufficient statistic of the joint state and show that the required conditional mean can be obtained by solving an image-domain Gaussian denoising problem involving operator-dependent, correlated noise. We train a velocity-prediction network using this formulation to estimate the conditional mean from the derived sufficient statistic. Extensive experiments across various linear inverse problems and image datasets demonstrate state-of-the-art performance in both distortion metrics and perceptual quality. Dual Flow requires no hyperparameter tuning beyond the number of inference steps and achieves shorter reconstruction times than competing methods. Additional analyses assess robustness to model mismatch, as well as the ability to generate diverse plausible reconstructions and characterize reconstruction uncertainty.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于生成模型的线性逆问题方法通常使用获取的噪声测量来调节或引导图像域中的采样。在这项工作中，我们引入了Dual Flow，一种新颖的联合流模型，通过从观测中联合估计干净图像和相应的无噪声测量来解决线性逆问题。具体而言，Dual Flow将图像重建和测量去噪表述为耦合估计问题，在图像和测量域中使用耦合流。获取的噪声测量仅用于初始化测量状态；此后，图像和测量状态根据它们当前的值进行联合更新。通过构造，最终的图像和测量估计保证满足底层的前向模型。我们推导了联合流的采样更新，其中涉及给定联合状态的干净图像的条件均值。我们进一步推导了联合状态充分统计量的闭式表达式，并表明所需的条件均值可以通过求解涉及依赖于算子的相关噪声的图像域高斯去噪问题来获得。我们使用这种公式训练了一个速度预测网络，以从推导出的充分统计量中估计条件均值。在各种线性逆问题和图像数据集上的大量实验表明，在失真指标和感知质量方面均达到了最先进的性能。Dual Flow除了推理步数外不需要超参数调整，并且比竞争方法实现了更短的重建时间。额外的分析评估了对模型不匹配的鲁棒性，以及生成多样化合理重建和表征重建不确定性的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决线性逆问题，通过从观测中联合估计干净图像和相应的无噪声测量来进行图像重建和测量去噪。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Dual Flow联合流模型，将图像重建和测量去噪表述为耦合估计问题，在图像和测量域使用耦合流。2. 最终估计通过构造保证满足底层前向模型。3. 推导了联合流采样更新及充分统计量的闭式表达式，将条件均值估计转化为图像域高斯去噪问题。4. 无需超参数调整（除推理步数外），重建时间短，且在失真和感知质量上达到SOTA。5. 具备对模型不匹配的鲁棒性，能生成多样化重建并表征不确定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了Dual Flow的数学推导（如充分统计量闭式解、条件均值转化为高斯去噪），并强调了其无需调参、速度快、满足前向模型保证等优势。局限性方面，摘要未提供具体的数据集名称、具体的SOTA数值对比、前向模型的具体类型，也未说明在极端噪声或严重模型失配下的具体性能下降情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图像重建\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e169. S1CogBench: What System One Decision Models Can and Cannot Do on Cognitive Experiments（S1CogBench：系统一决策模型在认知实验中能做什么和不能做什么）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.00911\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.00911\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecision-making in humans and AI involves multiple cognitive abilities. System One decision models produce fast, structured choices. Their cognitive strengths and limitations, however, remain poorly understood. We introduce S1CogBench, a benchmark of 24 established cognitive tasks and 27 evaluation modes, evaluating seven open models and the API model Jev. It combines human-response prediction, autonomous execution, and controlled task manipulations to reveal strengths and failures that aggregate scores miss. We find distinct behavioral profiles across the evaluated models. In these models, strong performance on some learning tasks coexists with failures to gather information or adapt to feedback, while high accuracy does not guarantee human-like responses to changing task demands. Shared readout controls show that model rankings depend partly on how choices are extracted. Separate latency comparisons with generative language models show that long responses are much slower than direct decisions, whereas matched one-token generation adds little overhead. To our knowledge, S1CogBench is the first benchmark of System One decision models on established cognitive experiments. It provides a common empirical basis for identifying their capabilities and limitations before integrating them into automated decision systems.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人类和人工智能的决策涉及多种认知能力。系统一决策模型产生快速、结构化的选择。然而，它们的认知优势和局限性仍然知之甚少。我们引入了S1CogBench，一个包含24个既定认知任务和27种评估模式的基准，评估了七个开源模型和API模型Jev。它结合了人类响应预测、自主执行和受控任务操作，以揭示聚合分数所遗漏的优势和失败。我们在评估的模型中发现了不同的行为特征。在这些模型中，在某些学习任务上的强劲表现与无法收集信息或适应反馈的情况共存，而高准确率并不能保证对不断变化的任务需求做出类似人类的响应。共享读取控制表明，模型排名部分取决于如何提取选择。与生成式语言模型的单独延迟比较表明，长响应比直接决策慢得多，而匹配的单标记生成几乎不增加开销。据我们所知，S1CogBench是第一个在既定认知实验上评估系统一决策模型的基准。它为在将它们集成到自动决策系统之前识别其能力和局限性提供了共同的实证基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估系统一（System One）决策模型在认知实验中的认知优势与局限性，揭示其在人类响应预测、自主执行和任务操作中的真实能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出S1CogBench基准，包含24个认知任务和27种评估模式，评估7个开源模型和1个API模型；结合多种评估方式揭示聚合分数遗漏的模型行为特征（如高准确率与无法适应反馈共存）；发现模型排名受选择提取方式影响；延迟对比显示单标记生成开销极小，而长响应显著慢于直接决策。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了基准的规模、评估维度以及发现的模型行为特征和延迟特性。关于各模型在具体认知任务上的详细得分数据、“系统一决策模型”的具体架构定义，以及这些认知局限性在下游实际决策任务中的具体负面影响，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 认知科学 / 模型评估与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e170. DailySafe: Benchmarking Dynamic Safety Awareness in Everyday Multi-Turn Multimodal Interactions（DailySafe：评估日常多轮多模态交互中的动态安全意识）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26298\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26298\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs multimodal large language models (MLLMs) become increasingly integrated into everyday life, their ability to provide safe and reliable assistance in realistic daily activities remains insufficiently explored. Existing safety benchmarks primarily focus on isolated harmful requests or adversarial scenarios, overlooking the safety risks that may arise as ordinary tasks unfold. In practice, users pursue legitimate goals through multi-turn, multimodal interactions, where seemingly benign requests may become safety-critical when considered alongside earlier actions and visual observations. This calls for Dynamic Safety Awareness, the ability to track evolving task conditions, recognize implicit contextual risks, and provide safe and helpful assistance. To systematically evaluate this capability, we introduce DailySafe, a benchmark comprising 195 naturalistic multi-turn, multi-image interactions across 10 everyday domains and 42 task categories. Grounded in authentic user dialogue topics and documented safety knowledge, DailySafe captures realistic scenarios where safety-critical evidence is progressively revealed across conversational turns and visual observations. Using case-specific safety annotations, DailySafe assesses whether MLLMs can recognize and appropriately address evolving risks while supporting users\u0026#x27; legitimate goals, bringing multimodal safety evaluation closer to real-world everyday AI assistance. DailySafe is publicly available at: https://github.com/XuankunRong/DailySafe.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着多模态大语言模型日益融入日常生活，它们在现实日常活动中提供安全可靠协助的能力仍未得到充分探索。现有安全基准主要关注孤立的有害请求或对抗性场景，忽视了普通任务展开过程中可能出现的安全风险。在实践中，用户通过多轮多模态交互追求合法目标，其中看似无害的请求在与早期动作和视觉观察结合考虑时，可能会变得具有安全关键性。这呼唤动态安全意识，即跟踪不断变化的任务条件、识别隐式上下文风险并提供安全有帮助的协助的能力。为了系统地评估这种能力，我们引入了DailySafe，这是一个包含195个自然的多轮、多图像交互的基准，跨越10个日常领域和42个任务类别。基于真实的用户对话主题和记录的安全知识，DailySafe捕捉了安全关键证据在对话轮次和视觉观察中逐步揭示的现实场景。使用特定案例的安全注释，DailySafe评估多模态大语言模型是否能够在支持用户合法目标的同时识别并适当处理不断演变的风险，使多模态安全评估更接近现实世界的日常AI协助。DailySafe公开于：https://github.com/XuankunRong/DailySafe。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出DailySafe基准，系统评估多模态大语言模型在日常多轮多模态交互中的动态安全意识，即跟踪任务变化、识别隐式上下文风险并提供安全协助的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 关注日常多轮多模态交互中逐渐显现的安全风险，弥补了现有基准仅关注孤立有害请求的不足。2. 包含195个自然交互案例，覆盖10个日常领域和42个任务类别。3. 基于真实对话和安全知识，安全关键证据在对话和视觉中逐步揭示。4. 评估模型在支持合法目标的同时处理动态风险的能力，使评估更贴近现实应用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明DailySafe通过多轮多图像交互和逐步揭示的安全证据，更真实地反映了日常场景中的动态安全风险。局限性方面，摘要未提供关于基准中具体模型的评估得分、不同领域或任务类别下的难度差异、以及模型在处理动态风险时的具体失败模式分析，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与多模态大模型安全\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e171. General progress substitutes for specific training data in language models（语言模型中的通用进展可替代特定训练数据）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24844\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24844\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage models acquire their capabilities from training data, and developers withhold data during training to keep models from learning capabilities that could be misused. How long this delays a capability, and how much data is needed to acquire it later, is unknown. Here we show that the general progress a model makes on the rest of its training data substitutes for the data that was withheld. We withheld the training signal for individual skills in models of chess, Othello, molecular strings, bracket languages and web text. The delay of a withheld skill in larger models was predicted from smaller ones. A chess model never explicitly trained to respond to check ranked the legal responses almost as well as a model that was. When models were then trained on the withheld data, they acquired the skill with a small fraction of the data needed from initialization, and this fraction decreased as the models progressed. A control rule of equal difficulty was learned much more slowly. A programming language withheld from the training text of a 7-billion-parameter model was regained in the same way. Data filtering therefore delays a capability, and the data required to regain it decreases as models improve.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型从训练数据中获取能力，开发者在训练期间扣留数据以防止模型学习可能被滥用的能力。这会延迟能力多久，以及后续需要多少数据来获取它，是未知的。在这里，我们表明模型在其余训练数据上取得的通用进展可以替代被扣留的数据。我们在国际象棋、奥赛罗、分子字符串、括号语言和网络文本模型中扣留了特定技能的训练信号。较大模型中被扣留技能的延迟可以从较小模型中预测。一个从未明确训练应对将军的国际象棋模型对合法应对的排名几乎与训练过的模型一样好。当随后在被扣留的数据上训练模型时，它们以从初始化开始所需数据的一小部分获得了该技能，并且随着模型的进展，这一比例下降。一个同等难度的控制规则学习速度慢得多。从70亿参数模型训练文本中扣留的编程语言以同样的方式被恢复。因此，数据过滤会延迟一种能力，并且随着模型的改进，恢复它所需的数据会减少。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究语言模型在训练期间被扣留特定数据后，模型在其他数据上的通用进展能否替代被扣留的数据以获取特定能力，以及恢复该能力所需的数据量变化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e证明模型在其他训练数据上的通用进展可以替代被扣留的特定数据；发现较大模型中被扣留技能的延迟可从较小模型预测；模型在后续训练中仅需极少部分数据即可恢复被扣留技能，且该比例随模型进展下降；同等难度的控制规则学习速度慢得多，证明了通用进展的替代作用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要证明了语言模型的通用进展可以替代特定训练数据，数据过滤只能延迟而非阻止能力获取，且恢复能力所需数据随模型进步而减少。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/模型训练与能力评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e172. Replay, Don\u0026#x27;t Resample: Off-Policy Consolidation of Long-Horizon RL Experts（重放，不要重采样：长视界强化学习专家的离策略整合）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24059\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24059\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier post-training follows a common recipe: train one expert per domain with reinforcement learning (RL), then consolidate the experts into one model via multi-teacher on-policy distillation (MOPD). Such consolidation is expensive: the student samples in every environment again, an expert scores every sampled token, and the student inherits the drift of the final experts. Yet we argue that the experts\u0026#x27; RL runs have already produced what consolidation needs: rollouts with their sampling probabilities and rewards, in the order the experts learned from them. We propose multi-expert replay policy distillation (MRPD), which replays these training logs through the student in the experts\u0026#x27; order. At each step, the policy gradient is recomputed on these scored trajectories, and the final experts\u0026#x27; distributions are distilled at the logged prefixes. Following the experts\u0026#x27; own trajectory reduces the training-inference mismatch and keeps the student within the clip range, so the replay is off-policy in origin but quasi-on-policy throughout consolidation. MRPD samples nothing and calls no environment or reward model: the trainer is the sole process, and consolidating the experts costs only about a seventh of the compute used to train them. On three long-horizon agentic domains (reasoning, search and SQL), MRPD yields the best student model, substantially outperforming online RL baselines, and surpassing MOPD from the same experts at a fraction of MOPD\u0026#x27;s cost. Our analysis on the same logs shows that the replayed trajectories carry most of the gain, and that both the policy gradient and the distillation term add to it. Most interestingly, the order of the logs matters more than their amount or rewards, suggesting that expert training logs are a curriculum, not a data mixture.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前沿的后训练遵循一个常见的配方：使用强化学习（RL）为每个领域训练一个专家，然后通过多教师在线策略蒸馏（MOPD）将专家整合为一个模型。这种整合非常昂贵：学生在每个环境中再次采样，专家对每个采样的token进行评分，并且学生继承了最终专家的漂移。然而我们认为，专家的RL运行已经产生了整合所需的内容：具有其采样概率和奖励的展开，按照专家学习它们的顺序。我们提出了多专家重放策略蒸馏（MRPD），它按专家的顺序通过这些训练日志在学生中进行重放。在每一步，在这些评分轨迹上重新计算策略梯度，并在记录的前缀处蒸馏最终专家的分布。遵循专家自身的轨迹减少了训练-推理的不匹配，并使学生在裁剪范围内，因此重放最初是离策略的，但在整个整合过程中是准在线策略的。MRPD不进行任何采样，也不调用任何环境或奖励模型：训练器是唯一的过程，整合专家的成本仅约为训练它们所用计算量的七分之一。在三个长视界智能体领域（推理、搜索和SQL），MRPD产生了最好的学生模型，大幅优于在线RL基线，并以MOPD成本的一小部分超越了来自相同专家的MOPD。我们对相同日志的分析表明，重放的轨迹带来了大部分增益，并且策略梯度和蒸馏项都对其有所增加。最有趣的是，日志的顺序比其数量或奖励更重要，这表明专家训练日志是一个课程，而不是数据混合。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将多个通过强化学习训练的长视界专家模型整合为一个单一的学生模型，同时降低计算成本并避免在线策略蒸馏的昂贵开销和模型漂移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出多专家重放策略蒸馏（MRPD），按专家学习顺序重放训练日志；重放过程不进行采样、不调用环境或奖励模型，计算成本仅为训练专家的约七分之一；在推理、搜索和SQL三个长视界领域大幅优于在线RL基线，并以更低成本超越MOPD；发现日志顺序比数量或奖励更重要，表明训练日志起到课程作用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明MRPD通过重放轨迹减少了训练-推理不匹配，且策略梯度和蒸馏项共同贡献了性能增益。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习 / 模型蒸馏 / 模型整合\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e173. Unified Law for Visual Tasks (The Four Laws of Computer Vision)（视觉任务的统一法则（计算机视觉的四大法则））\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24917\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24917\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn this paper, we propose a Unified Law for Visual Tasks, which could be further divided into Four Laws of Computer Vision, with the goal of enabling a single framework or method to uniformly train on and perform nearly all visual tasks. Our starting point is an inspiration and hypothesis: if the world information is encoded into image, which we call World Snapshots, then image processing is world processing, and image generation is World Snapshot generation. Furthermore, if all visual and visualization tasks can be reformulated as generation tasks, then a unified method, World Snapshot Models (WSMs), can perform the vast majority of visual tasks, much as large language models have largely unified natural language processing. This paper validates these laws across more than 1,000 trained and evaluated visual tasks (defined by distinct input-output mappings) and presents a unified training framework for future visual-task research and applications.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在本文中，我们提出了视觉任务的统一法则，该法则可进一步分为计算机视觉的四大法则，目标是使单一框架或方法能够统一地训练和执行几乎所有视觉任务。我们的出发点是一个灵感和假设：如果世界信息被编码到图像中（我们称之为世界快照），那么图像处理就是世界处理，图像生成就是世界快照生成。此外，如果所有视觉和可视化任务都可以重新表述为生成任务，那么一种统一的方法，即世界快照模型（WSMs），可以执行绝大多数视觉任务，就像大语言模型在很大程度上统一了自然语言处理一样。本文在超过1000个训练和评估的视觉任务（由不同的输入-输出映射定义）上验证了这些法则，并为未来的视觉任务研究和应用提出了一个统一的训练框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出视觉任务的统一法则（计算机视觉的四大法则），旨在通过单一框架或方法统一训练和执行几乎所有视觉任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出世界快照（World Snapshots）假设，将图像处理视为世界处理，图像生成视为世界快照生成；提出世界快照模型（WSMs），将所有视觉和可视化任务重新表述为生成任务；在超过1000个具有不同输入-输出映射的视觉任务上验证了这些法则；提出了用于未来视觉任务研究和应用的统一训练框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明通过将视觉任务重构为生成任务，WSMs能够处理绝大多数视觉任务，并在1000多个任务上进行了验证。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 统一模型 / 图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e174. Kezek: Splitting Mono Two-Person Conversations into Per-Speaker Tracks for Full-Duplex Dialogue Data（Kezek：将单声道双人对话拆分为全双工对话数据的每说话人轨道）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16933\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16933\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFull-duplex spoken dialogue models learn turn-taking, overlaps and backchannels from conversations recorded with one channel per speaker, but most available conversational audio is a single mono mix. We present Kezek, a model that turns a mono recording of exactly two people into one track per person with the original length and timing; overlaps and short replies (\u0026quot;yeah\u0026quot;, \u0026quot;mm-hm\u0026quot;) stay on the track of the person who said them. Kezek decides who speaks when and who is who once for the whole recording (stage 1: a two-voice activity model guided by a speaker fingerprint trained to be insensitive to phase), and a conditioned time-domain separator only carries out that decision (stage 2), with outputs that always sum to the input. Standard separation metrics miss the failures that matter for dialogue data, so we report short-reply retention, leakage onto the other person\u0026#x27;s solo, channel swaps and coverage. Against the open pipeline pyannote -\u0026gt; DialogueSidon on the same recordings, Kezek keeps more short replies (0.83 vs. 0.69 on Open Yap test; 0.80 vs. 0.71 over the other\u0026#x27;s speech on unseen telephone speech from CallHome English), mostly because it returns the whole recording while the external pipeline drops part of it (on the audio both return, reply retention is about the same: 0.859 vs. 0.865 on Open Yap); it also leaks less, swaps channels less often, and runs 4-5 times faster (about 230 hours of audio per GPU-hour). We also report negative results and an ideal-mask ceiling that locate the remaining gap: quiet replies under a louder voice. Code and weights are released under permissive licences.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e全双工语音对话模型从每个说话人一个通道录制的对话中学习轮流、重叠和反馈，但大多数可用的对话音频是单声道混合。我们提出了Kezek，一个模型，它将恰好两个人的单声道录音转换为每人一个轨道，保持原始长度和时间；重叠和简短回复（\u0026quot;yeah\u0026quot;、\u0026quot;mm-hm\u0026quot;）保留在说话人的轨道上。Kezek为整个录音一次性决定谁在何时说话以及谁是谁（阶段1：由训练为对相位不敏感的说话人指纹引导的双语音活动模型），并且条件时域分离器仅执行该决定（阶段2），其输出始终总和为输入。标准分离指标会遗漏对对话数据重要的失败，因此我们报告了简短回复保留率、泄漏到另一人独白的程度、通道交换和覆盖率。与在相同录音上的开放管道 pyannote -\u0026gt; DialogueSidon 相比，Kezek保留了更多简短回复（在Open Yap测试上为0.83对0.69；在CallHome English的未见电话语音上，在另一人语音上的保留率为0.80对0.71），主要是因为它返回整个录音，而外部管道丢弃了部分（在两者都返回的音频上，回复保留率大致相同：在Open Yap上为0.859对0.865）；它泄漏更少，通道交换频率更低，并且运行速度快4-5倍（每GPU小时约230小时音频）。我们还报告了定位剩余差距的负面结果和理想掩码上限：较响声音下的安静回复。代码和权重在宽松的许可证下发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将包含恰好两人的单声道对话录音分离为每个说话人独立的轨道，保留原始长度、时间、重叠和简短回复，以生成适用于全双工语音对话模型的数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Kezek模型，分为两阶段：阶段1通过说话人指纹引导的双语音活动模型决定说话人和时间，阶段2通过条件时域分离器执行分离，输出总和等于输入；在Open Yap和CallHome English测试集上，简短回复保留率显著优于pyannote -\u0026gt; DialogueSidon管道；泄漏更少、通道交换更少、速度快4-5倍（每GPU小时约230小时音频）；提出了针对对话数据的特定评估指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出标准分离指标无法捕捉对对话数据重要的失败，因此引入了特定指标。局限性在于较响声音下的安静回复，其他局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e语音处理 / 音频分离 / 对话系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e175. PGPO: Prototype-Guided Progressive Obfuscation for Privacy-Preserving LLM-Enhanced Recommendation（PGPO：用于隐私保护LLM增强推荐的原型引导渐进式混淆）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23236\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23236\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLM-enhanced recommender systems encode item side information into semantic embeddings, but these embeddings may leak sensitive textual attributes through inversion attacks. Existing input-side defenses rely on trusted collection or local token perturbation, often disrupting the inter-item semantic topology needed for recommendation. To address it, we introduce relational fidelity as the key objective, requiring semantic shift for privacy while preserving relative item relations for utility. Based on this principle, we propose prototype-guided progressive obfuscation (PGPO), which learns topology-aware obfuscation anchors for high-influence prototype words and propagates them through a static semantic graph. PGPO is optimized with GRPO using individual dissimilarity, structural consistency, and semantic constraint rewards. Experiments on two benchmarks show strong inversion defense with near-upper-bound recommendation performance. The code is available at https://github.com/Shengxiang-Lin/PGPO.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLLM增强的推荐系统将项目侧信息编码为语义嵌入，但这些嵌入可能通过反转攻击泄露敏感的文本属性。现有的输入端防御依赖于受信任的收集或局部token扰动，通常会破坏推荐所需的项间语义拓扑。为了解决这个问题，我们引入关系保真度作为关键目标，要求为了隐私进行语义偏移，同时保留相对项关系以保证效用。基于这一原则，我们提出了原型引导渐进式混淆（PGPO），它为高影响力原型词学习拓扑感知的混淆锚点，并通过静态语义图传播它们。PGPO使用GRPO进行优化，利用个体相异性、结构一致性和语义约束奖励。在两个基准测试上的实验表明，其具有强大的反转防御能力，同时推荐性能接近上限。代码可在 https://github.com/Shengxiang-Lin/PGPO 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e防止LLM增强推荐系统中的语义嵌入通过反转攻击泄露敏感文本属性，同时保持推荐所需的项间语义拓扑和推荐效用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入“关系保真度”作为关键目标，在实现隐私保护的语义偏移的同时保留相对项关系。2. 提出原型引导渐进式混淆（PGPO），为高影响力原型词学习拓扑感知的混淆锚点并通过静态语义图传播。3. 使用GRPO结合个体相异性、结构一致性和语义约束奖励进行优化。4. 在两个基准测试上实现了强大的反转防御，且推荐性能接近上限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有输入端防御破坏项间语义拓扑的问题，提出PGPO通过原型引导和图传播在隐私和效用之间取得平衡，并使用GRPO优化。局限性方面，摘要未提供两个基准测试的具体名称、数据集规模、反转攻击的具体类型和成功率指标，也未详细说明“接近上限”的具体数值差距以及GRPO训练的计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e推荐系统隐私保护与自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e176. Out of Sight, Still in Mind: Token Compression for Omni-LLMs（眼不见，心仍记：全模态大语言模型的词元压缩）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2607.21179\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2607.21179\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe goal of this paper is to reduce the input token cost of Omni-modal large language models (Omni-LLMs) at inference time. Omni-LLMs reason jointly over audio, video and text, but the cost of the three streams is highly unbalanced: visual tokens account for the vast majority of the input, and are highly redundant. In this paper, we propose ReMo, a training-free framework that compresses visual tokens by redistributing their information across modalities: a visual token is kept only if its information appears nowhere else. ReMo achieves this in two ways: (i) it aligns audio and video in a shared space via closed-form calibration, and removes visual tokens already explained by the audio or by other visual tokens; and (ii) it replaces object-level visual tokens, identified by a lightweight object detector, with compact text proxies, short descriptions of each object and its location, conveying the same content in far fewer tokens. On Qwen2.5-Omni at two model scales, ReMo removes 54% of the input tokens with comparable accuracy. It performs comparably to the full-token model, reaching 101.2% and 101.4% of its average accuracy over five audio-visual benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e本文的目标是在推理时降低全模态大型语言模型（Omni-LLMs）的输入词元成本。Omni-LLMs对音频、视频和文本进行联合推理，但三个流的成本高度不平衡：视觉词元占据了输入的绝大部分，且高度冗余。在本文中，我们提出了ReMo，一个免训练框架，通过跨模态重新分配视觉词元的信息来压缩它们：仅当视觉词元的信息在其他地方未出现时才保留它。ReMo通过两种方式实现这一点：（i）它通过闭式校准在共享空间中对齐音频和视频，并移除已由音频或其他视觉词元解释的视觉词元；（ii）它将由轻量级对象检测器识别的对象级视觉词元替换为紧凑的文本代理，即每个对象及其位置的简短描述，以更少的词元传达相同的内容。在两个模型规模的Qwen2.5-Omni上，ReMo移除了54%的输入词元，且精度相当。它的表现与全词元模型相当，在五个视听基准上达到了其平均精度的101.2%和101.4%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e全模态大语言模型推理时的视觉词元压缩，以降低输入词元成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练框架ReMo，通过跨模态信息重分配压缩视觉词元：利用闭式校准对齐音视频以移除冗余视觉词元，并用轻量级文本代理替换对象级视觉词元；在Qwen2.5-Omni上减少54%输入词元的同时，在五个视听基准上达到了全词元模型平均精度的101.2%和101.4%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ReMo通过跨模态对齐和对象级文本代理有效解决了视觉词元高度冗余的问题，在大幅降低计算成本的同时保持了模型性能。关于不同模态缺失情况下的鲁棒性测试、文本代理生成带来的额外延迟以及在更复杂长视频任务中的具体表现等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e177. Learning Anisotropic Prediction Targets for Flow Models（学习流模型的各项异性预测目标）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17767\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17767\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFlow-based generative models are trained on a hand-chosen prediction target, such as the velocity, the noise, or the clean data. This choice strongly affects training and sample quality. We introduce Anisotropic Flow Models (AnisoFlow), which replaces a fixed prediction target with a fully learnable one. AnisoFlow learns to scale the noise component of the target anisotropically, assigning a separate nonnegative weight to each direction in a jointly learned basis. A closed-form map recovers the velocity from the network\u0026#x27;s prediction, leaving the architecture, flow-matching loss, and sampler unchanged. Since recovery is exact, training optimizes the target purely to make it easier for the network to predict. We theoretically analyze the resulting prediction error and predict that the preferred noise weight in each direction scales near-linearly with data variance, in agreement with the weights learned empirically in pixel space. AnisoFlow improves FID from 1.90 to 1.55 over the JiT baseline on ImageNet 256times256, by learning only the prediction target, without representation alignment or architectural changes. In pixel-space text-to-image generation, AnisoFlow improves image quality and, through better-conditioned velocity recovery, largely removes patch-seam artifacts under reduced-precision inference.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于流的生成模型在手选预测目标（如速度、噪声或干净数据）上进行训练。这种选择强烈影响训练和样本质量。我们引入了各向异性流模型（AnisoFlow），它将固定的预测目标替换为完全可学习的目标。AnisoFlow学习各向异性地缩放目标的噪声分量，在联合学习的基础中为每个方向分配单独的非负权重。一个闭式映射从网络的预测中恢复速度，保持架构、流匹配损失和采样器不变。由于恢复是精确的，训练纯粹为了优化目标以使其更容易被网络预测。我们从理论上分析了由此产生的预测误差，并预测每个方向上首选的噪声权重与数据方差呈近线性缩放，这与在像素空间中经验学习的权重一致。AnisoFlow仅通过学习预测目标，无需表示对齐或架构更改，就将ImageNet 256times256上的FID从JiT基线的1.90提高到1.55。在像素空间文本到图像生成中，AnisoFlow提高了图像质量，并通过条件更好的速度恢复，在降低精度的推理下很大程度上消除了拼块接缝伪影。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决基于流的生成模型中固定预测目标（如速度、噪声或干净数据）对训练和样本质量影响较大的问题，提出一种完全可学习的各向异性预测目标方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出AnisoFlow，用完全可学习的目标替换固定预测目标，各向异性地缩放噪声分量；闭式映射精确恢复速度，无需改变架构、损失或采样器；理论分析预测首选噪声权重与数据方差近线性缩放，与经验学习一致；在ImageNet 256times256上将FID从1.90降至1.55；在像素空间文生图中提升图像质量并消除低精度推理下的拼块接缝伪影。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要表明AnisoFlow通过引入可学习的各向异性预测目标，在不改变模型架构和采样器的情况下，有效提升了流模型的生成质量（FID降低）并减少了低精度推理下的伪影。理论分析与经验结果相吻合。局限：摘要未提供联合学习基础的具体维度、闭式映射的具体数学形式、其他数据集上的FID结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e生成模型与计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e178. Attention at Absolute Zero（绝对零度下的注意力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.11937\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.11937\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAttention scores candidate supports of an answer, which we call witnesses, and reads the scores at a temperature. We build a higher-order attention layer whose state lives on pairs of items: for a pair (a, b), each third item k is a witness judged through its legs (a, k) and (k, b). It reads witnesses at zero temperature, keeping the best and the number tied with it, passes on only bits comparing such counts, rebuilds its pair state from the input and these bits at every loop, and is trained from answers alone. Each choice removes one way soft attention fails at size: dispersed weight, unresolved gaps between learned scores, and a drifting soft state. In maximum retrieval it is right on at least 99.95% of sets 1,000 times larger than in training, on all ten seeds; trained with a soft count, the same network falls to 42% at 4,096 items. On CLRS-30 without hints, a general form of the layer (half its channels read at zero temperature, numbers embedded, state carried) beats the best published model, which uses hints on some tasks; the full cold layer is exact on every test input of 9 of the 12 tasks whose answers depend on numbers only through comparisons. From yes-or-no answers it decides 2-SAT and two-colouring exactly at 500 variables and, as our theory predicts, not parity equations. Beside a frozen 7B language model it chains family relations exactly at 1,000 statements after training on 16, where the model alone falls to 44%; finite checks on the weights prove every block that learned correct at every size, on acyclic contexts and given what the model reads. On CLUTRR it is right on every story of five to ten relations given the graphs, learning the 62 rules exactly; from text, with the model frozen, no hand-written rule and only a small read-in trained, it lifts an open 7B model from 33% to 65%, above every system we found without hand-written rules except frontier reasoning models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e注意力对答案的候选支持（我们称为见证者）进行评分，并在特定温度下读取分数。我们构建了一个高阶注意力层，其状态存在于项目对上：对于一对(a, b)，每个第三个项目k是一个见证者，通过其分支(a, k)和(k, b)进行判断。它在零温度下读取见证者，保留最佳及其并列数量，仅传递比较此类计数的位，在每次循环中从输入和这些位重建其对状态，并仅从答案中进行训练。每种选择都消除了软注意力在规模上失败的一种方式：分散的权重、学习分数之间未解决的差距以及漂移的软状态。在最大检索中，它在比训练集大1,000倍的至少99.95%的集合上是正确的，在所有十个种子上；用软计数训练时，同一网络在4,096个项目时下降到42%。在没有提示的CLRS-30上，该层的一般形式（一半通道在零温度下读取，嵌入数字，携带状态）击败了使用提示的一些任务上的最佳发布模型；完整的冷层在12个任务中9个仅通过比较依赖数字的答案的每个测试输入上都是精确的。从是或否答案中，它在500个变量时精确决定2-SAT和双色，并且正如我们的理论预测，不能决定奇偶方程。在冻结的7B语言模型旁边，它在16个语句上训练后，在1,000个语句时精确链接家庭关系，而单独模型下降到44%；对权重的有限检查证明每个在每种规模、无环上下文中以及给定模型读取内容时学习正确的块。在CLUTRR上，给定图时，它在每个五到十个关系的故事上都是正确的，精确学习62条规则；从文本中，模型冻结，没有手写规则且仅训练了一个小的读入，它将一个开放的7B模型从33%提升到65%，高于我们发现的所有没有手写规则的系统，除了前沿推理模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一种在零温度下运行的高阶注意力层，通过保留最佳见证者及其并列数量并传递比较计数的位，解决软注意力在规模扩大时出现的权重分散、分数差距和状态漂移问题，并评估其在算法推理和关系链接任务中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出在零温度下读取见证者的高阶注意力层，仅传递比较计数的位以重建状态；在最大检索任务中，对大于训练集1,000倍的集合准确率至少达99.95%，而软计数网络在4,096个项目时降至42%；在CLRS-30无提示设置下超越最佳模型，在9/12个任务上完全精确；在500变量时精确解决2-SAT和双色问题；在CLUTRR任务中精确学习62条规则，将7B模型准确率从33%提升至65%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要提出了一种零温度高阶注意力层，有效解决了软注意力在规模扩展时的失效问题，并在多种算法推理和关系链接任务中展现出卓越的精确度和扩展性。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习/注意力机制与架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e179. AuXSpec: Learning to Autoformalize Program Specifications via Executable Postconditions（AuXSpec：通过可执行后置条件学习自动形式化程序规范）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21421\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21421\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFormal specifications define intended program behavior and underpin verification, but writing them in theorem provers such as Lean is slow and expertise-intensive, making specification a major bottleneck to scaling formally correct code. Autoformalization from natural-language problems is promising, yet training specification models requires scalable feedback on whether generated specifications capture intended behavior. Prior approaches obtain this feedback through explicit proofs or separately implemented code with formal correspondence proofs, both expensive. We introduce AuXSpec, a Lean framework that pairs declarative postconditions with executable counterparts, obtained through type class resolution when possible and otherwise defined separately with an equivalence proof. Test cases can then evaluate declarative specifications by execution, letting us use agreement as a reinforcement-learning reward. Using AuXSpec, we synthesize 3,037 LeetCode problems and expand training to 19.5K samples through expert iteration on Codeforces. Experiments show that training Qwen3.5-9B and Qwen3.8-27B with the execution-based reward improves SpecGen pass@4 on AuXSpec-Test 0.7% to 82.7% and 14.3% to 84.3%, and the 27B model outperforms all frontier models. On the out-of-domain Verina benchmark with its original prompts, both models improve 7.0% to 90.5% and 21.9% to 90.5% and surpass VeriSpecGen-30B-A3B, the prior state of the art among open-source specification models, on pass@1 (theirs 47.6% vs. ours 73.7% and 84.5%) and pass@4 (theirs 63.9% at pass@10 vs. ours 90.5%). We release the weights of the trained 9B and 27B models and the 3,037 problems with test cases, including the 300-problem AuXSpec-Test benchmark with expert review and correctness proofs for future evaluation. Models and data: https://huggingface.co/collections/eth-algopt/auxspec. Website: https://auxspec.org\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e形式化规范定义了预期的程序行为并支撑验证，但在Lean等定理证明器中编写它们既缓慢又需要专业知识，使得规范编写成为扩展形式化正确代码的主要瓶颈。从自然语言问题进行自动形式化很有前景，但训练规范模型需要可扩展的反馈，以确定生成的规范是否捕获了预期行为。先前的方法通过显式证明或具有形式对应证明的单独实现代码来获取此反馈，两者都很昂贵。我们引入了AuXSpec，一个Lean框架，将声明性后置条件与可执行对应物配对，在可能时通过类型类解析获得，否则通过等价证明单独定义。然后可以通过执行来评估声明性规范，让我们使用一致性作为强化学习奖励。使用AuXSpec，我们合成了3,037个LeetCode问题，并通过在Codeforces上的专家迭代将训练扩展到19.5K个样本。实验表明，使用基于执行的奖励训练Qwen3.5-9B和Qwen3.8-27B，将AuXSpec-Test上的SpecGen pass@4从0.7%提高到82.7%，从14.3%提高到84.3%，并且27B模型优于所有前沿模型。在带有原始提示的域外Verina基准测试上，两个模型分别从7.0%提高到90.5%，从21.9%提高到90.5%，并在pass@1（theirs 47.6% vs. ours 73.7%和84.5%）和pass@4（theirs 63.9% at pass@10 vs. ours 90.5%）上超越了VeriSpecGen-30B-A3B（开源规范模型中的先前最先进水平）。我们发布了训练好的9B和27B模型的权重以及带有测试用例的3,037个问题，包括经过专家审查和正确性证明的300个问题的AuXSpec-Test基准测试，以供未来评估。模型和数据：https://huggingface.co/collections/eth-algopt/auxspec. 网站：https://auxspec.org\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从自然语言问题自动形式化程序规范，通过可执行后置条件提供可扩展的反馈以训练规范模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入AuXSpec框架，将声明性后置条件与可执行对应物配对，使用一致性作为强化学习奖励；合成3,037个LeetCode问题并扩展至19.5K个训练样本；训练Qwen3.5-9B和Qwen3.8-27B在AuXSpec-Test和域外Verina基准测试上显著超越先前最先进模型及所有前沿模型；开源模型权重、数据和基准测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出利用可执行后置条件作为强化学习奖励来训练自动形式化模型。局限方面，摘要未提供关于该方法在无法通过类型类解析或难以编写等价证明的情况下的表现、合成数据的质量限制或泛化到更复杂编程语言时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 形式化方法 / 自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e180. TPHC: Improving Hyper-Connections with Tensor-Parallel Grouped Updates（TPHC：通过张量并行分组更新改进超连接）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23026\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23026\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHyper-Connections (HC) expand the residual stream of a Transformer into N parallel streams, and manifold-constrained HC (mHC) stabilizes them at scale. However, mHC benefits little from more than four streams, partly because each sublayer writes a single output to all streams, limiting how differently they can be updated. In this work, we propose TPHC, which integrates tensor-parallel (TP) shards with HC streams to promote greater independence across streams. Specifically, we route a separate mixture of the residual streams to each TP shard and keep the individual shard outputs separate during write-back, so each stream can receive a different mixture of those outputs. This design makes the residual-stream updates more expressive without adding parameters or FLOPs to the attention or FFN sublayers. With native support for stream sharding under TP, TPHC requires only 9% more training time than mHC on an 8B model when both use four streams. Increasing the number of streams from four to sixteen raises its training time by only 19%. On a 1.1B model trained on 100B tokens, TPHC reduces validation loss by 0.7-1.0% and raises average zero-shot accuracy across six commonsense reasoning benchmarks by 0.3-0.7 percentage points relative to mHC at matched stream counts Nin{4,8,16}. Our code is available at https://github.com/wuyou2002/TPHC.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e超连接（HC）将 Transformer 的残差流扩展为 N 个并行流，而流形约束 HC（mHC）在规模上稳定了它们。然而，mHC 从超过四个流中获益甚微，部分原因是每个子层向所有流写入单个输出，限制了它们更新方式的差异。在这项工作中，我们提出了 TPHC，它将张量并行（TP）分片与 HC 流集成，以促进流之间更大的独立性。具体而言，我们将残差流的单独混合路由到每个 TP 分片，并在回写期间保持各个分片输出分离，因此每个流可以接收这些输出的不同混合。这种设计使残差流更新更具表现力，而无需向注意力或 FFN 子层添加参数或 FLOPs。在 TP 下原生支持流分片的情况下，当两者都使用四个流时，TPHC 在 8B 模型上仅比 mHC 多需要 9% 的训练时间。将流数量从四个增加到十六个，其训练时间仅增加 19%。在 100B token 上训练的 1.1B 模型上，在匹配的流计数 Nin{4,8,16} 下，与 mHC 相比，TPHC 将验证损失降低了 0.7-1.0%，并将六个常识推理基准的平均零样本准确率提高了 0.3-0.7 个百分点。我们的代码可在 https://github.com/wuyou2002/TPHC 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究任务：提出 TPHC（张量并行分组更新超连接）方法，通过集成张量并行（TP）分片与超连接（HC）流，提高 Transformer 残差流更新的表达能力和独立性，从而在大规模模型训练中提升性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e核心亮点：1. 提出 TPHC 方法，将张量并行（TP）分片与 HC 流集成，通过将残差流的单独混合路由到每个 TP 分片并保持分片输出分离，促进流之间更大的独立性。2. 在不增加注意力或 FFN 子层参数或 FLOPs 的情况下，使残差流更新更具表现力。3. 训练效率高：在 8B 模型上使用四个流时，仅比 mHC 增加 9% 的训练时间；流数量从四增加到十六时，训练时间仅增加 19%。4. 性能提升显著：在 100B token 训练的 1.1B 模型上，相比 mHC，验证损失降低 0.7-1.0%，六个常识推理基准的平均零样本准确率提高 0.3-0.7 个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析与局限：分析：TPHC 通过解决 mHC 中每个子层向所有流写入单一输出的瓶颈，利用 TP 分片实现流的独立更新，有效提升了模型的表现力。实验证明该方法在 1.1B 和 8B 模型上均能带来验证损失和零样本准确率的提升，且计算和训练时间开销增加有限。局限：摘要未提供关于更大规模模型（如大于 8B）的扩展性实验结果；摘要未提供与其他非 mHC 基线模型（如标准 Transformer）的详细对比数据；摘要未提及该方法在特定下游任务（除六个常识推理基准外）或不同模态数据上的表现；摘要未说明流数量超过 16 时的性能与训练时间变化趋势。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e领域归类：自然语言处理 / 深度学习模型架构优化 / 大语言模型训练\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e181. ResWAM: Learning What Changes, Not What Stays, for World-Action Models（ResWAM：世界-动作模型中学习变化而非静止的部分）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19559\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19559\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld-action models (WAMs) augment vision-language-action policies (VLAs) with future prediction so that the policy can anticipate how its actions will affect the physical world. Existing WAMs supervise complete future observations. However, observations typically change little over an action chunk, so the future loss is dominated by copying static background content rather than learning task-relevant robot and object motion, limiting policy learning. Moreover, existing WAMs rely on large video generation models or separate world models, incurring heavy training and inference compute that hinders closed-loop deployment. To improve policy performance, we propose visual residual learning, supervising only the feature change from the current frame to the future frame in a frozen DINOv3 space. Compared with complete future features, this residual learning target yields a higher feature rank with richer and more diverse representations of scene changes, and spatially concentrates on the robot arm and manipulated objects rather than the background. To further improve computational efficiency, we present ResWAM, a residual world-action model with 2.3B parameters in total, including a lightweight 0.5B dual-branch DiT that jointly trains an action branch and a residual branch via conditional flow matching. Without robot pretraining (i.e., pretraining on external robot action trajectories beyond the benchmark demonstrations), ResWAM achieves top average success rates on LIBERO-Plus (81.1%), RoboTwin 2.0 (93.8%), and RoboDojo (9.40% success, 13.41 score) at the lowest training (2.7-4.0 TFLOPs) and inference compute (1.0-1.4 TFLOPs), and leads real-robot Open, Put, and Stack (80.0% average, +10.0% over π_{0.5}) at 92.7 ms latency.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界-动作模型（WAMs）通过未来预测增强视觉-语言-动作策略（VLAs），使策略能够预测其动作将如何影响物理世界。现有的WAMs监督完整的未来观察。然而，观察在一个动作块内通常变化很小，因此未来损失主要由复制静态背景内容主导，而不是学习任务相关的机器人和物体运动，从而限制了策略学习。此外，现有的WAMs依赖大型视频生成模型或独立的世界模型，产生沉重的训练和推理计算，阻碍了闭环部署。为了提高策略性能，我们提出了视觉残差学习，在冻结的DINOv3空间中仅监督从当前帧到未来帧的特征变化。与完整的未来特征相比，这种残差学习目标产生了更高的特征秩，具有更丰富和更多样化的场景变化表示，并在空间上集中在机器人手臂和被操纵物体上，而不是背景上。为了进一步提高计算效率，我们提出了ResWAM，一个总参数为2.3B的残差世界-动作模型，包括一个轻量级的0.5B双分支DiT，通过条件流匹配联合训练动作分支和残差分支。在没有机器人预训练（即在基准演示之外的外部机器人动作轨迹上进行预训练）的情况下，ResWAM在LIBERO-Plus（81.1%）、RoboTwin 2.0（93.8%）和RoboDojo（9.40%成功率，13.41分）上实现了最高的平均成功率，且训练（2.7-4.0 TFLOPs）和推理计算（1.0-1.4 TFLOPs）最低，并在92.7毫秒的延迟下主导真实机器人的打开、放置和堆叠任务（平均80.0%，比π_{0.5}高+10.0%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种视觉残差学习方法及ResWAM模型，通过仅监督未来帧与当前帧之间的特征变化（而非完整未来观察），解决现有世界-动作模型（WAMs）在策略学习中受静态背景主导及计算成本过高的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出视觉残差学习，在冻结的DINOv3空间中仅监督特征变化，使特征表示更丰富、多样，并聚焦于机器人和物体运动而非静态背景。2. 设计了ResWAM模型（总计2.3B参数），包含轻量级0.5B双分支DiT，通过条件流匹配联合训练动作和残差分支，大幅提升计算效率。3. 在无外部机器人预训练的情况下，在LIBERO-Plus（81.1%）、RoboTwin 2.0（93.8%）和RoboDojo（9.40%成功率）上取得最高平均成功率。4. 训练和推理计算成本极低（训练2.7-4.0 TFLOPs，推理1.0-1.4 TFLOPs），且在真实机器人任务中达到92.7ms低延迟及80.0%的高成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ResWAM通过残差学习有效解决了WAMs中背景信息干扰和计算开销大的问题，在多个基准和真实机器人任务中实现了高性能与低延迟。局限性方面，摘要未提供关于DINOv3空间特征提取的具体细节、条件流匹配的具体数学公式，以及模型在更复杂或未见过的真实世界场景中的泛化能力评估（摘要未提供）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学习 / 视觉-语言-动作模型 / 世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e182. Inside the Trading Loop: Markets, Models, and Moves with LLM Agents（交易循环内部：使用LLM代理的市场、模型与操作）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.11657\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.11657\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe built a hybrid multi-agent trading system that combines large language model (LLM) analysts with momentum-based portfolio construction and rule-based execution. Company-news and macroeconomic agents return structured reports to a coordinator that sets stock weights and cash reserves. We evaluate the portfolio engine using its broker-recorded paper account, which operated with deterministic fallbacks, and compare LLM-enabled configurations through retrospective replays. From March 11 to August 28, 2026, the account returned 34.5%, compared with 14.4% for the S\u0026amp;P 500 fund SPY over the same dates. This raw return advantage came with a larger maximum drawdown. Reconstructed policies also finish above matched SPY and QQQ references when assessments are used in the same session or deferred to the next. Design comparisons examine cash authority, selective invocation, and response contracts. A constant-cash control gives a return estimate close to stance-based sizing, and shorter report contracts improve observed parsing but can change recommendations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们构建了一个混合多代理交易系统，将大语言模型分析师与基于动量的投资组合构建和基于规则的执行相结合。公司新闻和宏观经济代理向协调器返回结构化报告，协调器设置股票权重和现金储备。我们使用其经纪人记录的模拟账户评估投资组合引擎，该账户使用确定性回退运行，并通过回顾性重放比较启用大语言模型的配置。从2026年3月11日到8月28日，该账户回报率为34.5%，而同期标普500基金SPY的回报率为14.4%。这种原始回报优势伴随着更大的最大回撤。重建的策略在评估用于同一会话或延迟到下一次时，其表现也超过了匹配的SPY和QQQ参考。设计比较检查了现金授权、选择性调用和响应契约。恒定现金控制给出了接近基于立场的规模的回报估计，较短的报告契约改善了观察到的解析但可能改变建议。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建并评估一个结合大语言模型分析师、基于动量的投资组合构建和基于规则执行的混合多代理交易系统，比较不同大语言模型配置和系统设计对交易表现的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了结合大语言模型分析师与动量投资组合构建的混合多代理交易系统；在2026年3月11日至8月28日期间，系统模拟账户实现34.5%的回报率，显著高于同期SPY的14.4%；发现原始回报优势伴随更大的最大回撤；较短的报告契约改善了数据解析但可能改变投资建议。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要展示了一个混合多代理交易系统的设计与回测结果，证明了大语言模型在金融交易分析中的潜力，并探讨了现金授权、响应契约等设计选择对系统表现和解析的影响。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/多智能体与金融应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e183. When Expert Disagreement Hurts: Prestige and Selectivity in LLM Decision Revision（当专家分歧造成伤害时：LLM决策修订中的声望与选择性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16694\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16694\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWhen language models revise a decision after another agent disagrees, neither reversal counts nor final accuracy shows whether they are fixing mistakes or abandoning correct answers. We introduce a controlled two-pass audit that holds the question, the evidence, and the model\u0026#x27;s initial answer fixed and varies only the revision context: neutral reflection, anonymous disagreement, or disagreement attributed to a domain expert. For binary decisions the accounting is exact: revision raises accuracy only if it is selective enough, reversing wrong answers more than a/(1-a) times as often as correct ones, where a is initial accuracy (nine times at 90%). Across five models and 1,989 evidence-grounded decisions in medicine, science, and law, no model clears this bar under expert disagreement, and accuracy falls by up to 16.1 points. The expert label, a prestige cue, adds reversals for four of the five models, yet its effect on accuracy ranges from a 5.2-point loss to a 2.4-point gain, so reversal counts are a poor proxy for harm. With identical arguments from both sources, the label still raises reversal for three proprietary models and in a pooled analysis of four newer models. Models also respond to stated source reliability. Revision pipelines should therefore be evaluated with paired, conditional metrics, per model and protocol.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当语言模型在另一个智能体表示不同意后修订决策时，无论是逆转次数还是最终准确率都无法显示它们是在纠正错误还是放弃正确答案。我们引入了一种受控的两遍审计方法，保持问题、证据和模型的初始答案固定，仅改变修订上下文：中性反思、匿名分歧或归因于领域专家的分歧。对于二元决策，计算是精确的：只有当修订具有足够的选择性时，准确率才会提高，即逆转错误答案的次数是正确答案的a/(1-a)倍以上，其中a是初始准确率（在90%时为9倍）。在5个模型和医学、科学、法律领域的1,989个基于证据的决策中，没有模型在专家分歧下达到这一标准，准确率最高下降16.1个百分点。专家标签（一种声望线索）为5个模型中的4个增加了逆转次数，但其对准确率的影响范围从下降5.2个百分点到增加2.4个百分点不等，因此逆转次数是衡量伤害的糟糕代理指标。当两个来源提供完全相同的论点时，该标签仍使3个专有模型和4个较新模型的汇总分析中的逆转次数增加。模型也对声明的来源可靠性做出响应。因此，修订管道应针对每个模型和协议使用成对的条件指标进行评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究语言模型在面临其他智能体分歧时的决策修订行为，评估其是在纠正错误还是放弃正确答案，并分析声望线索和来源可靠性对修订选择性的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出受控的两遍审计方法，通过固定问题、证据和初始答案，仅改变修订上下文来精确评估模型的决策修订行为。2. 提出了二元决策修订的精确选择性阈值，即逆转错误答案次数需大于正确答案的a/(1-a)倍。3. 发现5个模型在专家分歧下均未达到选择性标准，准确率最高下降16.1个百分点，证明逆转次数不能准确反映模型受到的伤害。4. 揭示了专家标签和声明的来源可靠性会显著增加模型的逆转次数，但不一定提升准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过严谨的受控两遍审计设计，深入剖析了LLM在决策修订中的盲目顺从问题。研究指出，仅仅依赖逆转次数或最终准确率无法准确评估修订质量，并提出了基于初始准确率的选择性阈值。实验证实，专家标签等声望线索会导致模型过度逆转，从而损害准确率，强调了评估修订管道需要使用成对的条件指标。局限：摘要未提供5个模型的具体名称和参数量；摘要未提供医学、科学、法律三个领域中各领域的具体准确率下降数据或决策数量分布；摘要未提及该审计方法在多于两个智能体交互或连续多轮修订场景下的适用性和局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e184. Dataset Distillation via Drifting（通过漂移进行数据集蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16642\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16642\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe task of dataset distillation concerns the learning of a small set of synthetic samples that can serve as an effective replacement for a large real dataset when used for downstream tasks. While many solutions have been proposed since the problem\u0026#x27;s inception, most of them primarily seek to optimize the distilled data with respect to a classifier. In this work, we propose a new distillation method that learns a set of samples such that they directly approximate the per-class data distribution. Specifically, we \u0026quot;drift\u0026quot; our distilled data in the latent space of a feature extractor such that they move both toward the real data and away from each other without using a classification objective. We find that our drifted data cover the real distribution significantly better than existing methods while still serving as powerful training samples for classification. Furthermore, we showcase our method\u0026#x27;s use as a visualization tool for better interpreting models and extend it beyond images to other modalities. Our work advances the frontier of dataset distillation, offering a novel synthesis method and proposing distribution-based metrics as a complementary evaluation. More broadly, our findings help address the growing need to understand both data and models by uncovering more about how they interact.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e数据集蒸馏任务涉及学习一小组合成样本，当用于下游任务时，这些样本可以作为大型真实数据集的有效替代。自从该问题提出以来，虽然提出了许多解决方案，但大多数主要寻求针对分类器优化蒸馏数据。在这项工作中，我们提出了一种新的蒸馏方法，学习一组样本使其直接近似每类的数据分布。具体而言，我们在特征提取器的潜在空间中“漂移”我们的蒸馏数据，使它们在不使用分类目标的情况下，既向真实数据移动又彼此远离。我们发现，与现有方法相比，我们漂移的数据显著更好地覆盖了真实分布，同时仍然作为强大的分类训练样本。此外，我们展示了我们的方法作为可视化工具的用途，以更好地解释模型，并将其扩展到图像之外的其他模态。我们的工作推进了数据集蒸馏的前沿，提供了一种新颖的合成方法，并提出基于分布的指标作为补充评估。更广泛地说，我们的发现通过揭示数据和模型如何交互的更多信息，帮助解决了理解数据和模型日益增长的需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种新的数据集蒸馏方法，通过在特征提取器的潜在空间中“漂移”合成样本，使其直接近似每类数据分布，从而替代大型真实数据集用于下游任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了一种无需分类目标的新蒸馏方法，通过在特征提取器潜在空间中使蒸馏数据向真实数据移动且彼此远离（“漂移”），直接近似每类数据分布。2. 漂移后的数据比现有方法显著更好地覆盖真实分布，同时保持强大的分类训练能力。3. 该方法可作为可视化工具以更好地解释模型，并成功扩展至图像之外的其他模态。4. 提出了基于分布的指标作为数据集蒸馏的补充评估方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究提出了一种基于分布近似而非分类器优化的新型数据集蒸馏方法，通过“漂移”机制在潜在空间中优化合成样本。该方法不仅提升了数据分布的覆盖率和分类训练效果，还拓展了数据集蒸馏在模型解释和多模态领域的应用，并引入了基于分布的评估指标。局限：摘要未提供具体的数据集名称、蒸馏比例或具体的分类准确率提升数字；摘要未提供与其他基线方法在分布覆盖率和计算成本上的具体对比数字；摘要未提及该方法在极小样本蒸馏比例下的表现或具体局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e185. Centered Ablation: Why Last-Layer Directional Ablation Under-Fires or Collapses, and a Closed-Form Fix（居中消融：为何最后一层方向性消融会欠触发或崩溃，以及一种闭式修复方法）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20148\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20148\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDirectional ablation removes a hidden state\u0026#x27;s component along a \u0026quot;behaviour direction\u0026quot; while a language model runs. It is the standard way to switch a behaviour such as refusal off, but it is erratic: on some models it barely fires, on others the text collapses into repetition. We show why, and fix it. At the last residual stream, ablation is exactly a logit bias: a fixed vocabulary footprint scaled by a gate, the cosine between the hidden state and the direction. The gate is measured from the origin, but last-layer states share a large common mode far from it, so a direction that overlaps the common mode fires on benign text and under-fires on its targets. Centered Ablation (CA) projects the common mode out of the direction, in closed form. Across 8 models, CA raises attack success by 29 and 46 points where the standard recipe under-fires, cuts collapse on Gemma-2-9B from 50\\% to 1\\%, and preserves 12 to 40 points more benign answers on high-overlap models, 39 to 46 more than the affine offset of prior work. Two numbers computed before generation predict, on models the analysis had not seen, which gain faithfulness and which gain attack success, and a collapse index marks when text degenerates. We also show that two standard safety judges score collapsed text in opposite directions, which can fabricate a 46-point effect.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e方向性消融在语言模型运行期间移除隐藏状态沿“行为方向”的分量。它是关闭拒绝等行为的标准方法，但它是不稳定的：在某些模型上它几乎不触发，在另一些模型上文本崩溃为重复。我们展示了原因并修复了它。在最后一个残差流处，消融精确地是一个对数偏置：一个由门缩放的固定词汇足迹，该门是隐藏状态与方向之间的余弦值。该门是从原点测量的，但最后一层状态共享一个远离原点的大型公共模式，因此与公共模式重叠的方向会在良性文本上触发，并在其目标上欠触发。居中消融（CA）以闭式形式将公共模式从方向中投影出去。在8个模型中，CA在标准方法欠触发的地方将攻击成功率提高了29和46分，将Gemma-2-9B上的崩溃率从50%降至1%，并在高重叠模型上保留了12到40分更多的良性答案，比先前工作的仿射偏移多39到46分。在生成前计算的两个数字预测了，在分析未见过的模型上，哪些获得了忠实度，哪些获得了攻击成功率，并且崩溃指数标记了文本何时退化。我们还表明，两个标准的安全评判员对崩溃文本的评分方向相反，这可能会捏造出46分的效应。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决语言模型中方向性消融在关闭特定行为（如拒绝）时出现的欠触发或文本崩溃问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出居中消融（CA）方法，通过闭式形式将公共模式从方向中投影出去；在8个模型上显著提升攻击成功率并降低文本崩溃率；提出生成前预测忠实度或攻击成功率的方法及崩溃指数；揭示标准安全评判员对崩溃文本评分存在相反方向的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了CA方法在8个模型上的具体提升数据（如攻击成功率提升29和46分，Gemma-2-9B崩溃率从50%降至1%），证明了方法的有效性。局限性方面，摘要未提供具体的计算开销、对其他类型行为（非拒绝类）的泛化能力以及CA方法在更复杂多轮对话中的表现等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型安全与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e186. Reducing Batch Makespan for LLM Agent Workloads through Inference-Environment Coordination（通过推理-环境协调减少LLM智能体工作负载的批处理完工时间）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16661\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16661\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEfficient batch execution of agent tasks is critical to LLM training and development workflows, including benchmark evaluation, synthetic-data generation, and RL rollouts. Since these tasks alternate between LLM inference and environment interaction, we present coordinated optimizations to reduce batch makespan, the time required to complete all tasks in a batch. For hybrid LLMs, a workload-based resource model guides GPU-memory allocation between key-value (KV) cache and recurrent state and provides a reference sample concurrency to exploit parallelism while limiting recomputation. Trajectory-aware routing and scheduling promote cache reuse while balancing worker load. Under constrained environment capacity, we decouple sample admission from environment execution and introduce Chain-Advancing Action Scheduling (CAAS), which prioritizes long chains using observed progress to shorten the batch tail. Controlled replay combines actual inference with recorded environment responses and durations for ablations of individual optimizations. Live evaluations with Ling-3.0-Flash and Ling-3.1-Flash on the BFCL, SWE-bench Multilingual, WideSearch, and MCP-Atlas benchmarks demonstrate makespan reductions of 10.4% to 65.0%, while evaluation scores remain aligned. Furthermore, these methods have been successfully applied to training and evaluation workflows for the Ling-3.x model series, accelerating the model-development cycle.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体任务的高效批处理执行对LLM训练和开发工作流（包括基准评估、合成数据生成和强化学习展开）至关重要。由于这些任务在LLM推理和环境交互之间交替进行，我们提出了协调优化方法以减少批处理完工时间（即完成批次中所有任务所需的时间）。对于混合LLM，基于工作负载的资源模型指导键值（KV）缓存和循环状态之间的GPU内存分配，并提供参考样本并发度以利用并行性同时限制重新计算。轨迹感知路由和调度促进缓存重用，同时平衡工作器负载。在环境容量受限的情况下，我们将样本准入与环境执行解耦，并引入链推进动作调度（CAAS），该方法利用观察到的进度优先处理长链，从而缩短批次尾部。受控回放将实际推理与记录的环境响应和持续时间相结合，用于对各个优化进行消融实验。在BFCL、SWE-bench Multilingual、WideSearch和MCP-Atlas基准上使用Ling-3.0-Flash和Ling-3.1-Flash进行的实时评估表明，完工时间减少了10.4%到65.0%，同时评估分数保持一致。此外，这些方法已成功应用于Ling-3.x模型系列的训练和评估工作流，加速了模型开发周期。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e减少大语言模型（LLM）智能体工作负载在批处理执行中的完工时间（makespan）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出基于工作负载的资源模型，指导混合LLM中KV缓存和循环状态的GPU内存分配及样本并发度。2. 引入轨迹感知路由和调度以促进缓存重用并平衡负载。3. 提出链推进动作调度（CAAS），在环境容量受限时优先处理长链以缩短批次尾部。4. 在多个基准测试上实现10.4%至65.0%的完工时间减少，且评估分数保持一致。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了针对LLM智能体任务交替特性的协调优化方法，通过资源分配、调度策略和CAAS有效减少了批处理完工时间。局限性方面，摘要未提供具体的系统开销分析、不同硬件环境下的泛化能力评估，以及CAAS在极端长尾分布任务下的具体表现细节，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型系统优化与分布式计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e187. LuthorSQL: A One-Pass Text-to-SQL Model as System 1 for a Slower LLM Agent（LuthorSQL：作为较慢LLM代理系统1的单遍Text-to-SQL模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17780\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17780\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier LLM agents that query databases with tools are among the most accurate text-to-SQL systems, but per-query calls to a hosted model are slow, costly, and expose sensitive organizational queries to external APIs. For example, a Claude Opus 5.5 agent serving 10,000 queries a day costs over $70,000 a year at list price. To what extent can local hardware already owned by an organization offload this burden without compromising the agent\u0026#x27;s accuracy? We present LuthorSQL, a non-autoregressive 7B text-to-SQL model that serves as a rapid System 1 gate for a slower LLM agent (System 2), escalating queries only when uncertain. LuthorSQL makes a single forward pass to predict slot scores over a bounded grammar for query plans, compiles and runs up to 32 candidate plans, and chooses an answer using a trained validator. On its own, LuthorSQL reaches 68.03% execution accuracy on BIRD\u0026#x27;s hidden test set at 0.84 s per question on a single GPU, maintains its accuracy in 9 GB with 8-bit quantized weights, and transfers zero-shot to Snowflake, BigQuery, MySQL, PostgreSQL, and DuckDB within 3.1 points of its native SQLite accuracy. Combined with Claude Opus 5.5 in a pre-registered confidence cascade over 227 questions on databases published after Opus\u0026#x27;s training cutoff, LuthorSQL answers nearly half of all questions locally and cuts API cost by 33.3% at the same accuracy. Finally, contamination probing shows that Opus reproduces 48-92% of public benchmark gold queries verbatim without seeing the schema; however, its tool-assisted accuracy holds on renamed schemas and reaches 95.6-97.4% on post-cutoff databases. Code and data: https://github.com/IAMIbrahimmemon/luthorsql\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用工具查询数据库的前沿LLM代理是最准确的text-to-SQL系统之一，但对托管模型的每次查询调用缓慢、昂贵，并将敏感的组织查询暴露给外部API。例如，每天处理10,000个查询的Claude Opus 5.5代理按标价每年成本超过70,000美元。组织已拥有的本地硬件在多大程度上可以在不损害代理准确性的情况下减轻这种负担？我们提出了LuthorSQL，一个非自回归的7B text-to-SQL模型，作为较慢LLM代理（System 2）的快速System 1门控，仅在不确定时升级查询。LuthorSQL进行单次前向传播以预测查询计划有界语法上的槽位分数，编译并运行多达32个候选计划，并使用训练有素的验证器选择答案。单独使用时，LuthorSQL在BIRD的隐藏测试集上达到68.03%的执行准确率，在单个GPU上每个问题耗时0.84秒，在9 GB的8位量化权重下保持其准确率，并以零样本方式转移到Snowflake、BigQuery、MySQL、PostgreSQL和DuckDB，与原生SQLite准确率相差在3.1个百分点以内。与Claude Opus 5.5结合，在Opus训练截止日期后发布的数据库上的227个问题进行预注册的置信度级联，LuthorSQL在本地回答了几乎所有问题中的近一半，并在相同准确率下将API成本降低了33.3%。最后，污染探测表明，Opus在没有看到模式的情况下逐字重现了48-92%的公共基准黄金查询；然而，其工具辅助准确率在重命名模式上保持不变，并在截止日期后的数据库上达到95.6-97.4%。代码和数据：https://github.com/IAMIbrahimmemon/luthorsql\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个快速的本地text-to-SQL模型（LuthorSQL），作为较慢LLM代理的门控（System 1），以在不牺牲准确性的情况下降低API调用成本、延迟和数据泄露风险。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出非自回归7B模型LuthorSQL，单次前向传播预测槽位分数，编译运行最多32个候选计划并用验证器选择答案。2. 在BIRD隐藏测试集上达68.03%准确率，单GPU推理0.84秒，8位量化仅需9GB，零样本迁移至多种数据库误差在3.1%内。3. 与Claude Opus 5.5组成置信度级联系统，本地处理近半问题，降低33.3% API成本且准确率不变。4. 揭示了Opus在基准测试中的记忆污染问题及其在重命名模式和截止日期后数据库上的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详实的实验数据（如准确率、推理时间、成本降低比例、量化大小等），证明了LuthorSQL的高效性和迁移能力。局限性方面，摘要未提供LuthorSQL在复杂查询或特定数据库方言上的具体失败分析，也未详细说明验证器的具体架构或置信度级联的阈值设定细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与数据库查询\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e188. CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving（CANTraj：从自然驾驶中的CAN信号恢复车辆轨迹）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18442\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18442\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOpen driving releases and usage-based insurance programs often claim to prevent privacy breaches by omitting GPS records when sharing or collecting vehicle data. However, removing GPS coordinates from driving logs does not erase the location information carried by vehicle signals. While prior route-inference attacks have demonstrated that speed, steering, and driving events can be matched to road networks to reconstruct trajectories, existing studies rely on inconsistent prior assumptions and evaluation metrics and are tested only on small, restricted datasets, making their results difficult to compare and their real-world effectiveness uncertain. We release CANTraj, a naturalistic driving dataset pairing decoded CAN events with time-aligned GNSS trajectories (3,940 drives, 454 drivers), and CANTraj-Bench for evaluating trajectory recovery (3,675 drives, 431 drivers, 1,380 hours, 85,919 km). On 776 evaluation drives from 94 unseen drivers, we compare six re-implemented attacks and benchmark baselines under explicit information-access protocols, paired comparisons, and metrics incorporating failures. Experiments show that combining steering signals with road-network constraints yields the largest gain: With a known start and heading, adding steering to speed raises the online map filter\u0026#x27;s five-minute route recovery from 56% to 87%, with a median average displacement error of 43 m versus 921 m for map-free dead reckoning. Offline beam search recovers 88% of test routes with the heading and 81% without it. Because methods fail on different windows, we also evaluate an LLM harness that selects among candidate routes on 659 five-minute windows; its best configuration recovers 79% of routes on test and 83% on few-shot, outperforming the best baseline on test and matching it on few-shot. Data and code at huggingface.co/datasets/HenryYHW/CANTraj and github.com/WangYuHang-cmd/GPS--CAN.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e开放驾驶数据集和基于使用的保险计划通常声称通过在共享或收集车辆数据时省略GPS记录来防止隐私泄露。然而，从驾驶日志中删除GPS坐标并不能消除车辆信号携带的位置信息。虽然先前的路线推断攻击已经证明速度、转向和驾驶事件可以匹配到道路网络以重建轨迹，但现有研究依赖于不一致的先验假设和评估指标，并且仅在小而受限的数据集上进行测试，使其结果难以比较且实际有效性不确定。我们发布了CANTraj，一个将解码的CAN事件与时间对齐的GNSS轨迹配对的真实驾驶数据集（3,940次驾驶，454名驾驶员），以及用于评估轨迹恢复的CANTraj-Bench（3,675次驾驶，431名驾驶员，1,380小时，85,919公里）。在来自94名未见驾驶员的776次评估驾驶中，我们在明确的信息访问协议、配对比较和包含失败的指标下，比较了六种重新实现的攻击和基准基线。实验表明，将转向信号与道路网络约束相结合可产生最大收益：在已知起点和航向的情况下，将转向添加到速度可使在线地图过滤器的五分钟路线恢复率从56%提高到87%，中位平均位移误差为43米，而无地图航位推算为921米。离线波束搜索使用航向恢复了88%的测试路线，不使用航向恢复了81%。由于方法在不同的窗口上失败，我们还评估了一个在659个五分钟窗口上选择候选路线的LLM工具；其最佳配置在测试中恢复了79%的路线，在少样本中恢复了83%，在测试中优于最佳基线，在少样本中与之匹配。数据和代码位于 huggingface.co/datasets/HenryYHW/CANTraj 和 github.com/WangYuHang-cmd/GPS--CAN。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e发布CANTraj真实驾驶数据集和CANTraj-Bench评估基准，用于评估从车辆CAN信号（如速度、转向）中恢复车辆轨迹的隐私攻击方法的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发布了包含3,940次驾驶（454名驾驶员）的CANTraj数据集和包含3,675次驾驶（1,380小时，85,919公里）的CANTraj-Bench。2. 评估了6种重新实现的攻击和基线，发现结合转向信号与道路网络约束收益最大（5分钟路线恢复率从56%提升至87%）。3. 离线波束搜索在无航向情况下仍能恢复81%的路线。4. 评估了LLM工具选择候选路线，最佳配置在测试集恢复79%，少样本恢复83%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明即使移除GPS，车辆CAN信号仍包含大量位置信息，现有攻击方法（特别是结合转向和路网约束）能高效恢复轨迹，证明了隐私泄露风险。局限性方面，摘要指出先前研究依赖不一致的假设和指标且数据集小，CANTraj解决了这一问题，但摘要未提供CANTraj数据集或评估方法本身的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/隐私安全/智能交通系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e189. PAD: Policy-Aware Data Valuation for Autonomous Driving（PAD：用于自动驾驶的策略感知数据估值）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25604\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25604\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEnd-to-end autonomous driving increasingly depends on scaling training demonstrations, yet data growth does not guarantee proportional gains. However, additional data do not guarantee better policies: a demonstration that benefits one planner may be redundant or harmful to another. Existing curation methods typically infer data value from intrinsic sample properties or training-dependent proxies that do not measure downstream policy utility. To address this, we introduce Policy-Aware Data Valuation (PAD), a framework that assigns each candidate demonstration a utility specific to the target driving policy. PAD combines scene-level calibration feedback with projected policy gradients and a regularized approximation of local training geometry, producing scalable influence-based values for the policy. A controlled group-removal study establishes the directional fidelity of these values, while cross-planner analysis shows that the same candidate pool induces markedly different rankings across planner families. On DiffusionDrive, PAD improves EPDMS over real-only training by 3.5 points on NavTest and 5.0 points on NavHard. Policy-specific curation consistently outperforms real-only and full-pool training across diffusion-, regression-, and flow-matching-based planners while substantially reducing scene-level regressions. These results establish policy-aware data valuation as a basis for replacing indiscriminate data accumulation with targeted policy improvement, enabling more efficient and reliable scaling of autonomous-driving systems.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e端到端自动驾驶越来越依赖于扩大训练演示的规模，但数据增长并不能保证成比例的性能提升。然而，额外的数据并不能保证更好的策略：对一个规划器有益的演示可能对另一个规划器是冗余或有害的。现有的数据整理方法通常从内在样本属性或依赖于训练的代理指标推断数据价值，而这些指标
