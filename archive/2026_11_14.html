在等效光谱表示下的决策一致性（表示不变性）以及在数据缺失时的弃权行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现仅改变表示方式（如表格或图表、单位）会导致同一模型准确率波动高达41个百分点；未适应模型在相关数据缺失时很少回答“未确定”；LoRA微调在不可回答问题上存在截断即弃权的捷径，使用可回答截断训练可避免此捷径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要揭示了多模态模型在科学决策中缺乏表示不变性和合理弃权能力的问题。通过改变光谱的表示形式和截断数据，量化了模型准确率的波动和捷径学习现象。局限性方面，摘要未提供具体的模型架构细节（除名称外），且指出使用可回答截断训练时，六个种子中有五个仍保留了捷径，表明解决该问题仍存在挑战。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习与科学人工智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. Humanized but Still True? Auditing Facts and Detection in AI-Text Humanizers（人性化但仍真实？审计AI文本人性化工具中的事实与检测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.00359\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.00359\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI \u0026quot;humanizers\u0026quot; rewrite machine-generated text so that detectors classify it as human-written. Public leaderboards score evasion and embedding similarity, but not whether checkable details survive. We check whether numbers, dates, person and organization names, and quoted spans survive each rewrite, using a rule-based checker validated by two AI annotators (precision 0.84-1.00, recall 0.93-0.95; no human annotation). In the October 2026 cycle of a public humanizer leaderboard, all 11 commercial tools changed or dropped at least one of these units in 35-65% of the documents that contained one. Most changes were to quoted spans; counting numbers and names alone, 10 of the 11 tools still altered at least one in 20% or more of the documents. The September 2026 cycle was similar (19-50%). An open 12B humanizer kept at least 97% of numbers and names in fact-dense U.S. federal agency text, but reworded 67-78% of the quoted spans, against its own prompt. Unit retention and detector evasion were not clearly related across tools (Spearman rho = -0.46, 95% CI -0.65 to 0.08), and the open model\u0026#x27;s four released files (two of them quantization-aware low-bit files) did not show the pre-registered monotone trade-off. On federal texts with matched human, AI-styled and humanized versions, a general-purpose decision model, Jev, asked a single zero-shot question, separated human originals from humanized rewrites with AUROC 0.864 (0.827-0.902), 0.18-0.22 higher than Binoculars, Fast-DetectGPT and the adversarially trained RADAR, while calling 24% of the human originals AI at a 0.5 threshold. On the AI-styled rewrites by 2026 models, both perplexity-based detectors scored below chance (AUROC 0.37 and 0.39), also with line breaks removed. Hypotheses, data rules and analyses were frozen before the main runs; two earlier data contacts are disclosed. We release the checker and the per-item results.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAI“人性化工具”重写机器生成的文本，以便检测器将其分类为人类编写。公共排行榜对逃避检测和嵌入相似性进行评分，但不评估可检查的细节是否保留。我们使用由两个AI注释器验证的基于规则的检查器（精确度0.84-1.00，召回率0.93-0.95；无人工注释），检查数字、日期、人物和组织名称以及引用跨度是否在每次重写中保留。在2026年10月公共人性化排行榜周期中，所有11个商业工具在包含这些单元的文档中，有35-65%的文档更改或丢弃了至少一个此类单元。大多数更改发生在引用跨度上；仅计算数字和名称，11个工具中有10个仍在20%或更多的文档中更改了至少一个。2026年9月的周期类似（19-50%）。一个开源的12B人性化工具在事实密集的美国联邦机构文本中保留了至少97%的数字和名称，但违背了其自身的提示，重写了67-78%的引用跨度。跨工具的单位保留率和检测器逃避率没有明显的相关性（Spearman rho = -0.46，95% CI -0.65至0.08），并且该开源模型的四个发布文件（其中两个是量化感知的低比特文件）没有显示预先注册的单调权衡。在具有匹配的人类、AI风格和人性化版本的联邦文本上，通用决策模型Jev通过单个零样本问题，以0.864（0.827-0.902）的AUROC将人类原文与人性化重写分开，比Binoculars、Fast-DetectGPT和对抗训练的RADAR高0.18-0.22，同时在0.5阈值下将24%的人类原文称为AI。在2026年模型的AI风格重写上，两种基于困惑度的检测器得分均低于随机水平（AUROC为0.37和0.39），在移除换行符时也是如此。假设、数据规则和分析在主要运行前已冻结；披露了两次早期的数据接触。我们发布了检查器和逐项结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估AI文本人性化工具在重写过程中是否保留了可检查的事实细节（如数字、日期、名称、引用），并评估现有检测器对人性化文本的检测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现11个商业人性化工具在35-65%的文档中更改或丢弃了事实单元，主要为引用跨度；单位保留率与检测逃避率无明显相关性；通用决策模型Jev在区分人类原文与人性化重写时AUROC达0.864，而基于困惑度的检测器对2026年模型AI风格重写的检测得分低于随机水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了当前AI人性化工具在保留事实细节方面的严重缺陷，以及公共排行榜评估指标的局限性。通过量化分析，揭示了工具在事实保留和检测逃避之间的权衡关系，并评估了多种检测器的有效性。局限性方面，摘要提到基于困惑度的检测器对最新AI风格重写检测效果差，且开源模型未显示预期的单调权衡，表明当前检测和人性化工具均存在局限；此外，检查器由AI注释器验证，无人工注释，可能引入验证偏差。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与文本生成检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. From Large Language Models to Efficient System One Models via Adaptive Computation（通过自适应计算从大型语言模型到高效的系统一模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16321\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16321\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTransferring LLMs into System One decision models typically replaces the language modeling head with a decision head while retaining the full backbone, making every decision pay for all layers. Yet it remains unclear how much depth such decisions require. We find that decision information is concentrated in intermediate layers, with early layers building essential features and the final six layers removable without loss, while independently trained smaller models largely mimic the full model rather than developing specialized decision capabilities. These findings suggest that efficiency requires not simply smaller backbones, but shared computation across different depths. Building on this, we propose , which jointly trains a full model with prefix sub-models that share its final layers and decision head through self-distillation. A lightweight gate reads the hidden state at each exit to determine whether additional computation is needed, allowing one model to operate at multiple layers. Across seven decision benchmarks, our approach matches or outperforms independently trained models at every depth, while achieving better accuracy-efficiency trade-offs through adaptive computation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将大型语言模型（LLM）转化为系统一决策模型通常用决策头替换语言建模头，同时保留完整的骨干网络，使得每个决策都要为所有层付出代价。然而，此类决策需要多少深度仍不清楚。我们发现决策信息集中在中间层，早期层构建基本特征，最后六层可以无损失地移除，而独立训练的较小模型在很大程度上模仿完整模型，而不是开发专门的决策能力。这些发现表明，效率不仅需要更小的骨干网络，还需要不同深度之间的共享计算。在此基础上，我们提出该方法，通过自蒸馏联合训练一个完整模型与前缀子模型，共享其最后几层和决策头。一个轻量级门控读取每个出口的隐藏状态，以确定是否需要额外的计算，从而允许一个模型在多个层上运行。在七个决策基准测试中，我们的方法在每个深度上都匹配或超过了独立训练的模型，同时通过自适应计算实现了更好的准确率-效率权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提高大型语言模型转化为系统一决策模型时的计算效率，通过自适应计算和共享不同深度的计算来减少推理成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现决策信息集中在中间层，最后六层可无损失移除；独立训练的小模型主要模仿完整模型而非发展专门能力；提出通过自蒸馏联合训练完整模型与前缀子模型，并使用轻量级门控实现自适应计算；在七个决策基准上实现了更好的准确率-效率权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要分析了LLM转化为决策模型时的深度需求，发现中间层集中了决策信息，并提出了基于自适应计算和自蒸馏的共享计算方案。局限性方面，摘要未提供具体的模型名称（原文缺失）、参数量、具体的准确率或效率提升数字，也未讨论该方法在特定任务或极端情况下的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与模型高效推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. The Value of Thinking: Learning When to Reason in Hybrid Decision Models（思考的价值：在混合决策模型中学习何时进行推理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16961\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16961\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eExisting adaptive-reasoning methods shorten the explicit reasoning a model writes, or skip it by switching modes; either way the answer is still written out token by token. Rather than deciding how much to think, we explore a different paradigm, zero-or-T thinking: a single model either answers from the implicit thinking inside one forward pass, generating no token, or performs full autoregressive reasoning at a cost of T tokens when that is worth paying. We realise it in a hybrid decision model (HDM), where one frozen backbone serves both modes and a lightweight self-routing block chooses between them. The block estimates the value of thinking, the utility the slow mode is expected to add over the fast one, from what that implicit thinking has already produced, and the slow mode runs only where that value exceeds a price λ set per request. Where no per-decision label exists, as in episodic agentic tasks, we introduce Calibrated Decision Policy Optimisation (CDPO), a reinforcement-learning recipe that trains the block from episode-level returns. We evaluate HDM on MMLU-Pro, AGIEval, GPQA-Diamond, JevBench, BANKING77 and MiniWoB. Specifically, on JevBench HDM-4B scores 0.857 against Jev\u0026#x27;s 0.851 (+0.7%) at a median 0.179\\,s against 0.652 (-72.5%). On the agentic venue MiniWoB HDM-27B cuts token cost by 80.1%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e现有的自适应推理方法会缩短模型写出的显式推理，或者通过切换模式来跳过它；无论哪种方式，答案仍然是逐个token写出的。我们探索了一种不同的范式，即零或T思考（zero-or-T thinking），而不是决定思考多少：单个模型要么根据一次前向传播中的隐式思考来回答，不生成任何token，要么在值得付出T个token的代价时执行完整的自回归推理。我们在混合决策模型（HDM）中实现了这一点，其中一个冻结的主干网络同时服务于这两种模式，一个轻量级的自路由模块在它们之间进行选择。该模块根据隐式思考已经产生的内容来估计思考的价值（即慢速模式预计比快速模式增加的效用），并且只有在价值超过每个请求设定的价格λ时，慢速模式才会运行。在缺乏逐决策标签的情况下（如情景智能体任务中），我们引入了校准决策策略优化（CDPO），这是一种强化学习方法，用于根据情景级别的回报来训练该模块。我们在MMLU-Pro、AGIEval、GPQA-Diamond、JevBench、BANKING77和MiniWoB上评估了HDM。具体而言，在JevBench上，HDM-4B得分为0.857，而Jev为0.851（+0.7%），中位时间为0.179\\,s，而后者为0.652（-72.5%）。在智能体场景MiniWoB上，HDM-27B将token成本降低了80.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种“零或T思考”范式，并在混合决策模型（HDM）中实现，通过轻量级自路由模块和校准决策策略优化（CDPO）决定何时进行完整的自回归推理或仅使用隐式思考。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出“零或T思考”范式，模型可选择零token隐式回答或T token完整推理。2. 引入混合决策模型（HDM），使用冻结主干和轻量级自路由模块。3. 提出校准决策策略优化（CDPO）以在缺乏逐决策标签时训练路由模块。4. 在多个基准上验证，在JevBench上提升准确率并降低72.5%延迟，在MiniWoB上降低80.1%的token成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了HDM在多个基准测试中的有效性，特别是在JevBench和MiniWoB上展示了准确率和效率的权衡优势。局限性方面，摘要未提供关于模型在其他未提及任务上的泛化能力、自路由模块的误判率分析以及CDPO训练过程中的具体收敛细节或计算开销等局限信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自然语言处理/大语言模型推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Experience-Handoff Reinforcement Learning for Recursive Self-Improvement（用于递归自我改进的经验传递强化学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16409\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16409\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIt is common to train Large Language Models (LLMs) for agentic tasks with Reinforcement Learning (RL) from scalar rewards. However, this throws away the fine-grained information about the environment that the agent experienced during the trial (e.g., error logs). To utilize this rich information, recent works wrap the agent in a harness that refines its own inputs through reflection or compaction and hands past experience to future rollouts, but the construction of the handed-off artifacts (e.g., a playbook) is itself not learned. We want the best of both worlds: gradient updates from a scalar reward, while also utilizing environment information to hand off experience. As a concrete testbed, we fix the Agentic Context Engineering () harness and train one model to act, reflect, and curate task-local playbooks. Our method, , evaluates candidate experience-handoff artifacts by their downstream effect on future actor rollouts, and co-optimizes the role-specific behaviors (action generator, insight reflector, and playbook curator) under a fixed scaffold. Across agentic benchmarks,  achieves higher held-out performance than baseline methods. The results suggest that agent training should optimize not only the actions in the current rollout, but also the model-written experience that future rollouts inherit.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e通常使用标量奖励的强化学习（RL）来训练大型语言模型（LLMs）以执行智能体任务。然而，这会丢弃智能体在试验期间体验到的关于环境的细粒度信息（例如错误日志）。为了利用这些丰富的信息，最近的工作将智能体包裹在一个工具中，通过反思或压缩来优化其自身的输入，并将过去的经验传递给未来的推演，但传递的工件（例如，操作手册）的构建本身并没有被学习。我们希望两全其美：从标量奖励中获得梯度更新，同时利用环境信息来传递经验。作为一个具体的测试平台，我们固定了智能体上下文工程（）工具，并训练一个模型来执行动作、反思和策划任务局部的操作手册。我们的方法，，通过候选经验传递工件对未来执行者推演的下游影响来评估它们，并在固定脚手架下协同优化特定角色的行为（动作生成器、洞察反思者和操作手册策划者）。在智能体基准测试中，相比基线方法取得了更高的留出性能。结果表明，智能体训练不仅应优化当前推演中的动作，还应优化未来推演所继承的模型编写的经验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种经验传递强化学习方法，在固定脚手架下协同优化智能体的动作生成、反思和操作手册策划行为，以利用环境细粒度信息并优化未来推演继承的经验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 结合标量奖励的梯度更新与环境细粒度信息的经验传递。2. 在固定脚手架下协同优化动作生成器、洞察反思者和操作手册策划者三种特定角色行为。3. 通过候选经验传递工件对未来推演的下游影响来评估和优化工件构建。4. 在智能体基准测试中实现了比基线方法更高的留出性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在智能体基准测试中优于基线方法，证明了优化模型编写的经验对未来推演的有效性。局限性方面，摘要未提供具体的基准测试名称、具体的性能提升数字、计算开销以及该方法在非智能体任务上的泛化能力等局限信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/强化学习/智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. A Cross-Scenario Survey and Analysis of Self-Evolving Multimodal Agents（跨场景自进化多模态智能体调查与分析）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14256\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14256\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent work shows that multimodal agents increasingly self-improve without recurring human annotation. However, each self-improvement mechanism is designed and evaluated within a single scenario, leaving its preconditions unverified under cross-scenario transfer. This survey investigates the structural source of asymmetric mechanism transfer across four scenarios: multimodal reasoning, multimodal generation, GUI and Web navigation, and embodied manipulation. We first formalize the self-evolving multimodal agent by four criteria and a differentia of self-reference, and adopt the three-stage self-evolving loop of experience generation, feedback acquisition, and update consolidation as our analytical framework to position the scenarios along ceilings on rollout count and feedback fidelity. Comparing self-evolving with fixed loops within each scenario separates the limitations that the scenario imposes from those inherent in the self-evolving design. We then recast each mechanism as a trade-off that raises a scarce factor by presupposing a task-structural resource, such as output equivalence or checkable outcomes, and judge it portable, conditional, blocked, or redundant across scenarios. We attribute the asymmetry to divergent combinations of scarce factors and resources across opposite transfer directions, and identify the matched-budget measurements that could overturn these still untested verdicts.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的工作表明，多模态智能体越来越多地在无需重复人工注释的情况下进行自我改进。然而，每种自我改进机制都是在单一场景中设计和评估的，其在跨场景迁移下的前提条件尚未得到验证。本调查研究了跨四个场景（多模态推理、多模态生成、GUI和Web导航以及具身操作）的不对称机制迁移的结构来源。我们首先通过四个标准和自我引用的种差来形式化自进化多模态智能体，并采用经验生成、反馈获取和更新巩固的三阶段自进化循环作为我们的分析框架，以根据推演数量和反馈保真度的上限来定位这些场景。在每个场景中比较自进化与固定循环，将场景施加的局限性与自进化设计固有的局限性分离开来。然后，我们将每种机制重新构建为一种权衡，通过预设任务结构资源（如输出等效性或可检查结果）来提高稀缺因素，并判断其在跨场景中是可移植的、有条件的、被阻止的还是冗余的。我们将这种不对称性归因于相反迁移方向上稀缺因素和资源的不同组合，并确定了可以推翻这些尚未测试的结论的匹配预算测量方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e调查和分析多模态智能体在四个不同场景（多模态推理、生成、GUI/Web导航、具身操作）中自我改进机制的跨场景迁移不对称性的结构来源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 形式化自进化多模态智能体，提出基于经验生成、反馈获取和更新巩固的三阶段分析框架。2. 将场景施加的局限性与自进化设计固有的局限性进行分离。3. 将自我改进机制重构为权衡模型，评估其在跨场景中的可移植性、条件性、阻塞性或冗余性。4. 将迁移不对称性归因于稀缺因素和资源的不同组合，并提出匹配预算测量方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了对多模态智能体自进化机制跨场景迁移的理论分析和框架，明确了场景限制与设计限制的差异。局限性方面，摘要未提供具体的实验验证结果、所评估的具体机制实例、以及“匹配预算测量方法”的实际应用效果或数据支持。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/多模态智能体/综述与分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. The Narrative Gap: Can LLMs Help Us Navigate Diverse Narratives Across Languages?（叙事鸿沟：大型语言模型能帮助我们跨语言导航多样化的叙事吗？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12750\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12750\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) increasingly mediate how people seek and consume information, including accounts that differ across languages and regions, especially on contested topics. Supporting diverse information seeking requires models to help users navigate competing narratives across languages and information streams. We define six capabilities necessary for diverse multilingual information seeking: three foundational capabilities for narrative inclusion, narrative exclusion, and missing narrative identification; and three higher-level capabilities for presenting diverse narratives, preserving narrative coverage under confirmatory queries, and maintaining information parity across languages. To guide the development of those information seeking capabilities, we introduce NarrativeBench, a benchmark comprising 1,333 news articles in 23 publication languages across 23 contested topics and 460 Reddit-grounded queries. Evaluating 14 LLMs across 24 query languages, we find that current models lack the capabilities needed to reliably navigate diverse narratives, limiting users\u0026#x27; control over the perspectives they receive and leaving substantial gaps in exposure to competing accounts even when diversity is explicitly requested. Information access also differs across query framings and languages, risking echo chambers, linguistic filter bubbles, and information disparities that weaken the common ground needed for democratic discourse. NarrativeBench provides a foundation for developing information systems that give users across languages and regions agency to navigate diverse narratives.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）越来越多地调节人们寻求和消费信息的方式，包括跨语言和地区存在差异的报道，尤其是在有争议的话题上。支持多样化的信息寻求需要模型帮助用户跨语言和信息流导航相互竞争的叙事。我们定义了多样化的多语言信息寻求所需的六种能力：用于叙事包含、叙事排除和缺失叙事识别的三种基础能力；以及用于呈现多样化叙事、在确认性查询下保留叙事覆盖范围以及跨语言保持信息平等的三种高级能力。为了指导这些信息寻求能力的开发，我们引入了NarrativeBench，这是一个包含23种出版语言的1,333篇新闻报道、涵盖23个有争议话题和460个基于Reddit的查询的基准测试。在24种查询语言中评估14个LLM，我们发现当前模型缺乏可靠导航多样化叙事所需的能力，限制了用户对所接收视角的控制，并且即使在明确要求多样性时，在接触竞争性报道方面仍存在巨大差距。信息访问在查询框架和语言之间也存在差异，存在回音室、语言过滤气泡和信息差距的风险，从而削弱了民主话语所需的共同基础。NarrativeBench为开发信息系统提供了基础，使跨语言和地区的用户能够自主导航多样化叙事。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e定义多语言信息寻求中导航多样化叙事所需的六种能力，构建NarrativeBench基准测试，并评估当前大型语言模型在跨语言导航竞争性叙事方面的能力与局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 定义了多语言信息寻求的六种能力（三种基础能力，三种高级能力）。2. 引入NarrativeBench基准测试，包含23种语言、1333篇新闻、23个争议话题和460个查询。3. 评估了14个LLM在24种查询语言下的表现，揭示了当前模型在导航多样化叙事方面的严重不足。4. 指出信息访问差异可能导致回音室和语言过滤气泡等风险。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过大规模基准测试证明了当前LLM在处理跨语言多样化叙事时的能力缺陷，揭示了潜在的信息不平等和回音室风险。局限性方面，摘要未提供14个LLM的具体名称、各模型的具体得分细节、以及针对这些缺陷的具体改进方案或微调策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自然语言处理/信息检索与社会影响\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. A frontier machine intelligence for human neuroimaging（面向人类神经影像的前沿机器智能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15094\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15094\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMedical imaging is essential for diagnosing disease, guiding treatment and monitoring patients over time. Although artificial intelligence has advanced image interpretation, existing medical models often address restricted tasks, while general-purpose proprietary models lack access to private clinical imaging required to achieve medical expertise. Developing models that can interpret complex examinations and communicate their findings in the context of clinical decisions remains a major challenge. Here, we show that Neuro-VL, a vision-language model trained on nearly one million neuroimaging studies from routine clinical care, can interpret complete imaging examinations and engage in natural language conversations about their findings. Across internal and international datasets, Neuro-VL outperformed frontier general-purpose and specialized medical models in diagnosing, localizing, and describing abnormalities, as well as generating comprehensive radiology reports. The model also compared serial examinations to assess disease progression and more reliably resisted misleading clinical assumptions than leading frontier models from OpenAI and Google. These results extend health system learning beyond individual predictions to interactive image interpretation and longitudinal disease monitoring. They demonstrate how the collective clinical experience of health systems can be used to develop medical AI with specialized expertise and broad clinical capabilities.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e医学影像对于诊断疾病、指导治疗和长期监测患者至关重要。尽管人工智能已经推进了图像解释，但现有的医学模型通常只处理受限的任务，而通用专有模型缺乏实现医学专业知识所需的对私人临床影像的访问权限。开发能够解释复杂检查并在临床决策背景下交流其发现的模型仍然是一个重大挑战。在此，我们展示了Neuro-VL，一个在来自常规临床护理的近一百万项神经影像研究上训练的视觉语言模型，能够解释完整的影像检查并参与关于其发现的自然语言对话。在内部和国际数据集上，Neuro-VL在诊断、定位和描述异常以及生成全面的放射学报告方面优于前沿的通用和专用医学模型。该模型还能比较系列检查以评估疾病进展，并且比OpenAI和Google的领先前沿模型更可靠地抵抗误导性的临床假设。这些结果将健康系统学习从个体预测扩展到交互式图像解释和纵向疾病监测。它们展示了如何利用健康系统的集体临床经验来开发具有专业知识和广泛临床能力的医学人工智能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发并评估Neuro-VL视觉语言模型，该模型在大规模常规临床神经影像数据上训练，旨在实现完整的影像检查解释、自然语言对话、疾病进展评估及抵抗误导性临床假设。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 训练了Neuro-VL模型，使用了近一百万项常规临床护理的神经影像研究。2. 能够解释完整影像检查并进行自然语言对话，生成全面的放射学报告。3. 在内部和国际数据集上，诊断、定位、描述异常及生成报告的性能优于前沿通用和专用医学模型。4. 能比较系列检查评估疾病进展，且比OpenAI和Google的前沿模型更可靠地抵抗误导性临床假设。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了Neuro-VL在神经影像解释、报告生成和纵向监测方面的卓越性能，展示了利用集体临床经验开发医学AI的潜力。局限性方面，摘要未提供具体的内部和国际数据集名称、具体的性能提升指标数字、模型在不同模态或解剖区域的细粒度表现差异，以及模型在真实临床环境中的部署反馈或潜在偏见分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u0
