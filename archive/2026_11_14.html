    <h1>前沿科研情报 - 2026-11-14</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models（SO-Arena：对系统一模型的能力谱和可靠性进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 72 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15777\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15777\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSystem One models promise fast, general-purpose decision-making without lengthy token generation. However, understanding their capability spectrum and decision reliability requires more than aggregate performance on current benchmarks. Existing evaluations often provide limited insight into the breadth of model capabilities and the reliability of their decisions. We introduce SO-Arena, a benchmark characterizing the capability spectrum and decision reliability of System One models across 11 domains and five capability families. For the capability spectrum, SO-Arena offers evidence-grounded evaluation through reliable sources and manual verification of reference labels against model-visible inputs; fine-grained capability assessment through domain-specific difficulty criteria; and realistic interactive evaluation, where models iteratively execute actions in sandboxes. Reasoning-intensive tasks further enable system one-two comparison. Beyond accuracy, SO-Arena assesses decision reliability through two complementary measures: decision stability under controlled option-set changes and missing-answer recognition when no valid option is available. Evaluations across 21 models reveal that the benefits of scaling and additional reasoning vary substantially across domains. More importantly, strong overall performance does not necessarily imply reliable decision-making: the best-performing System One model ranks only seventh in reliability. Together, these findings highlight the need to characterize capability spectrum and decision reliability as complementary dimensions, providing a systematic view of the strengths and limitations of System One models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e系统一模型承诺无需冗长的 token 生成即可进行快速、通用的决策。然而，理解其能力谱和决策可靠性需要的不仅仅是当前基准测试上的总体性能。现有的评估通常对模型能力的广度和其决策的可靠性提供有限的见解。我们引入了 SO-Arena，这是一个表征系统一模型在 11 个领域和五个能力家族中的能力谱和决策可靠性的基准。对于能力谱，SO-Arena 通过可靠来源和针对模型可见输入的手动验证参考标签提供基于证据的评估；通过特定领域的难度标准进行细粒度的能力评估；以及逼真的交互式评估，其中模型在沙盒中迭代执行动作。推理密集型任务进一步实现了系统一和系统二的比较。除了准确性之外，SO-Arena 还通过两个互补的指标评估决策可靠性：受控选项集变化下的决策稳定性，以及在没有有效选项可用时的缺失答案识别。对 21 个模型的评估表明，扩展和额外推理的收益在不同领域之间存在很大差异。更重要的是，强大的整体性能并不一定意味着可靠的决策：表现最好的系统一模型在可靠性方面仅排名第七。总而言之，这些发现强调了将能力谱和决策可靠性表征为互补维度的必要性，从而提供了对系统一模型优势和局限性的系统性视角。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个名为 SO-Arena 的基准，用于表征系统一模型在多个领域和能力家族中的能力谱和决策可靠性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入 SO-Arena 基准，涵盖 11 个领域和 5 个能力家族，支持基于证据的评估、细粒度能力评估和沙盒交互式评估。2. 提出评估决策可靠性的两个互补指标：受控选项集变化下的决策稳定性和缺失答案识别。3. 评估了 21 个模型，发现整体性能与可靠性并不完全正相关，表现最好的模型在可靠性上仅排第七。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出系统一模型在快速决策方面具有潜力，但现有评估缺乏对能力广度和决策可靠性的深入分析。SO-Arena 通过引入可靠性指标弥补了这一不足。局限性方面，摘要未提供关于该基准在特定实际应用场景中的具体部署效果或更广泛的模型泛化能力的详细数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能评估与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. BirdDreams: Joint Perspective and BEV Video Generation for a Plausible, Reactive Driving World Model（BirdDreams：用于合理、反应式驾驶世界模型的联合透视与BEV视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 45 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14815\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14815\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDriving world models aim to simulate how a scene unfolds under different ego actions. This requires plausible motion of surrounding vehicles as well as precise ego-trajectory control. Learning vehicle motion from perspective video alone is challenging because motion is entangled with appearance and vehicles can be occluded. Prior work therefore conditions video generation on layouts that specify vehicle motion, providing control over surrounding vehicles but requiring their future trajectories as inputs. We introduce BirdDreams, an autoregressive driving world model that jointly generates perspective video and a schematic bird\u0026#x27;s-eye-view (BEV) video, making scene layout part of the predicted future. The BEV, rendered from scene annotations for training, depicts roads and vehicles as simple shapes at a fixed metric scale, providing a top-down view of their positions and motion with reduced occlusion between vehicles. Perspective video, by contrast, retains scene details that the BEV omits, such as traffic signals and object appearance. Joint attention between two video diffusion transformers, one per stream, lets each stream inform the other during generation. The predicted BEV also provides a geometric interface for ego control: we translate and rotate its latest frame along an input ego trajectory and use the resulting frames as a soft condition that shows how the scene would appear to move if only the ego vehicle moved. At inference, BirdDreams generates both videos from a single camera image without requiring an HD map or vehicle-state inputs. On PhysicalAI-AV and nuScenes, BirdDreams follows input ego trajectories more faithfully than prior driving world models and generates more plausible ego motion without ego-action conditioning. Human evaluation shows that BirdDreams outperforms a perspective-only baseline in generating realistic surrounding-vehicle behavior.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e驾驶世界模型旨在模拟场景在不同自车动作下如何展开。这需要周围车辆的合理运动以及精确的自车轨迹控制。仅从透视视频学习车辆运动具有挑战性，因为运动与外观纠缠在一起，且车辆可能被遮挡。因此，先前的工作以指定车辆运动的布局为条件进行视频生成，提供了对周围车辆的控制，但需要它们的未来轨迹作为输入。我们引入了 BirdDreams，一种自回归驾驶世界模型，它联合生成透视视频和示意性的鸟瞰图（BEV）视频，使场景布局成为预测未来的一部分。用于训练的 BEV 从场景注释渲染，将道路和车辆描绘为固定度量比例的简单形状，提供了它们位置和运动的自顶向下视图，并减少了车辆之间的遮挡。相比之下，透视视频保留了 BEV 省略的场景细节，如交通信号和物体外观。两个视频扩散Transformer（每个流一个）之间的联合注意力让每个流在生成过程中相互提供信息。预测的 BEV 还为自车控制提供了几何接口：我们沿着输入的自车轨迹平移和旋转其最新帧，并将生成的帧用作软条件，显示如果只有自车移动，场景将如何移动。在推理时，BirdDreams 从单张相机图像生成这两种视频，而无需高清地图或车辆状态输入。在 PhysicalAI-AV 和 nuScenes 上，BirdDreams 比先前的驾驶世界模型更忠实地遵循输入的自车轨迹，并在没有自车动作条件的情况下生成更合理的自车运动。人工评估表明，BirdDreams 在生成逼真的周围车辆行为方面优于仅透视的基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种名为 BirdDreams 的自回归驾驶世界模型，通过联合生成透视视频和鸟瞰图（BEV）视频，实现对周围车辆合理运动和自车轨迹的精确控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 BirdDreams，联合生成透视视频和 BEV 视频，将场景布局作为预测未来的一部分，减少遮挡并保留场景细节。2. 利用两个视频扩散 Transformer 之间的联合注意力机制，使两个流在生成过程中相互提供信息。3. 预测的 BEV 提供自车控制的几何接口，推理时仅需单张相机图像，无需高清地图或车辆状态输入。4. 在 PhysicalAI-AV 和 nuScenes 数据集上，自车轨迹遵循度更高，且人工评估显示周围车辆行为更逼真。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出从单一透视视频学习车辆运动存在运动与外观纠缠及遮挡问题，现有方法依赖未来轨迹作为输入。BirdDreams 通过引入 BEV 视角和联合注意力机制解决了这些问题，实现了无需额外输入的自车控制。局限性方面，摘要未提供关于模型在极端天气、复杂交叉路口或长时序预测下的具体表现数据，也未说明计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与自动驾驶\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. PhysLoop: Harnessing LLMs\u0026#x27; Physics Awareness for Self-Improving Video Generation Models（PhysLoop：利用大语言模型的物理意识实现视频生成模型的自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 41 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16748\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16748\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo generation models produce visually realistic videos but still struggle with physical dynamics and causal consistency. Learning from generated videos requires fine-grained physical supervision, yet reliable quality judgments, correction pairs, and controlled variations are difficult to obtain. Large language models (LLMs) possess physical knowledge, but struggle to reliably guide video generation models in producing their training videos. We present PhysLoop, a unified harness designed to support physically grounded self-improvement in video generation models. The harness guides and constrains LLMs throughout video generation, selection, and correction, distilling their physical knowledge into physically consistent videos. The framework supports controllable training-data construction and inference-time video repair. By identifying and correcting failures, PhysLoop marks a key milestone toward recursive self-improvement (RSI) in video generation models with limited human intervention. We release 100K videos spanning diverse, realistic indoor and outdoor scenes, along with generation tools and two evaluation datasets: PhysLoop-Gen and PhysLoop-Repair. We evaluate controllable generation and localized repair on these datasets, respectively, and assess physical behavior on the external Physics-IQ Verified benchmark.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频生成模型能生成视觉上逼真的视频，但在物理动力学和因果一致性方面仍然面临困难。从生成的视频中进行学习需要细粒度的物理监督，然而可靠的质量判断、纠正对和受控变化很难获得。大语言模型（LLM）拥有物理知识，但难以可靠地指导视频生成模型生成其训练视频。我们提出了 PhysLoop，这是一个统一的框架，旨在支持视频生成模型基于物理的自我改进。该框架在视频生成、选择和纠正的整个过程中引导和约束 LLM，将其物理知识蒸馏到物理一致的视频中。该框架支持可控的训练数据构建和推理时的视频修复。通过识别和纠正失败，PhysLoop 标志着在有限人工干预下视频生成模型实现递归自我改进（RSI）的关键里程碑。我们发布了包含 100K 视频的集合，涵盖多样化的逼真室内和室外场景，以及生成工具和两个评估数据集：PhysLoop-Gen 和 PhysLoop-Repair。我们分别在这些数据集上评估了可控生成和局部修复，并在外部的 Physics-IQ Verified 基准上评估了物理行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 PhysLoop 框架，利用大语言模型（LLM）的物理知识，通过引导和约束视频生成、选择和纠正过程，实现视频生成模型基于物理的自我改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出统一的 PhysLoop 框架，在视频生成、选择和纠正全过程中引导和约束 LLM，将其物理知识蒸馏为物理一致的视频。2. 支持可控的训练数据构建和推理时的视频修复，推动有限人工干预下的递归自我改进（RSI）。3. 发布了包含 100K 多样化逼真场景视频的数据集、生成工具以及两个评估数据集（PhysLoop-Gen 和 PhysLoop-Repair）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出视频生成模型在物理动力学和因果一致性上存在不足，且获取细粒度物理监督困难。PhysLoop 利用 LLM 的物理知识来解决这一问题，并发布了相关数据集和工具。局限性方面，摘要未提供具体的定量评估指标（如准确率或提升百分比），也未详细说明 LLM 在引导过程中可能产生的幻觉或错误纠正的具体比例。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. G-STAR: Group-Scaled Token Capacity for Deeply Compressed Autoregressive Generation（G-STAR：用于深度压缩自回归生成的组缩放Token容量）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 40 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.13004\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.13004\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDiscrete autoregressive models offer a scalable framework for image generation. However, they face a fundamental trade-off: long token sequences preserve representation quality but slow generation, while aggressive spatial compression reduces representation capacity. Based on product quantization, we show that, under a fixed nominal information budget, group size should scale quadratically with the per-axis spatial compression factor. Building on this principle, we propose GSTAR, a spatial--group co-scaling framework that enables \\(32\\times\\) and even effective \\(64\\times\\) compression while preserving strong reconstruction, understanding, and generation performance. Since larger groups introduce intra-group dependencies that must be modeled efficiently, we analyze their impact on inference latency and generation quality and introduce a semi-autoregressive decoder that combines parallel feature computation with lightweight causal modeling. With these designs, our highly compressed models perform competitively with leading models across five representative text-to-image benchmarks (GenEval, DPG-Bench, PRISM, LongText-Bench, and Qwen-Image-Bench). At \\(1024\\times1024\\) resolution, our model delivers a \\(20\\times\\) speedup over prior discrete autoregressive models, generating each image in 2.5 seconds on a single NVIDIA H200. Together, these results show that highly compressed discrete representations can enable high-quality autoregressive generation at low latency.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e离散自回归模型为图像生成提供了一个可扩展的框架。然而，它们面临着一个根本的权衡：长 token 序列保留了表示质量但减慢了生成速度，而激进的空间压缩则降低了表示能力。基于乘积量化，我们表明，在固定的标称信息预算下，组大小应与每轴空间压缩因子呈二次方缩放。基于这一原则，我们提出了 GSTAR，一种空间-组协同缩放框架，可实现 32× 甚至有效的 64× 压缩，同时保持强大的重建、理解和生成性能。由于较大的组引入了必须高效建模的组内依赖关系，我们分析了它们对推理延迟和生成质量的影响，并引入了一种半自回归解码器，将并行特征计算与轻量级因果建模相结合。通过这些设计，我们的高度压缩模型在五个代表性的文本到图像基准（GenEval、DPG-Bench、PRISM、LongText-Bench 和 Qwen-Image-Bench）上与领先模型的表现具有竞争力。在 1024×1024 分辨率下，我们的模型比先前的离散自回归模型实现了 20× 的加速，在单个 NVIDIA H200 上生成每张图像仅需 2.5 秒。总而言之，这些结果表明，高度压缩的离散表示可以在低延迟下实现高质量的自回归生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 GSTAR（空间-组协同缩放）框架，解决离散自回归模型在图像生成中面临的长 token 序列生成慢与激进空间压缩降低表示能力之间的权衡问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现并证明在固定标称信息预算下，组大小应与每轴空间压缩因子呈二次方缩放。2. 提出 GSTAR 框架，实现 32 倍甚至有效 64 倍压缩，同时保持强大的重建、理解和生成性能。3. 引入半自回归解码器，结合并行特征计算与轻量级因果建模，高效处理组内依赖。4. 在 1024×1024 分辨率下，相比先前模型实现 20 倍加速，在单张 NVIDIA H200 上每张图像生成仅需 2.5 秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出离散自回归模型在表示质量和生成速度之间存在根本权衡。GSTAR 通过空间-组协同缩放和半自回归解码器有效解决了这一问题，实现了极高的压缩率和生成速度。局限性方面，摘要未提供关于模型在更高分辨率（如 2K 或 4K）下的表现，也未详细说明在极低计算资源（如消费级 GPU）上的推理延迟和内存占用情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. Duo: A Reciprocal World Model for Full-Duplex Interaction（Duo：用于全双工交互的互惠世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 35 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15131\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15131\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn this report, we introduce the Reciprocal World Model (RWM) and present Duo v1, a full-duplex world model that continuously perceives audiovisual inputs while responding to users in real time. The RWM treats intelligence and physical reality as equally fundamental to what constitutes a world. Existing world models largely focus on simulating the latter, leaving reasoning and decision-making as external controls rather than intrinsic parts of the world itself. In RWM, we identify two equally fundamental capabilities: Intent, which provides the cognition underlying world interactions, and Realization, which generates coherent audio-visual behavior. To realize this formulation, Duo v1 introduces three key technical designs: (1) Leveraging autoregressive modeling for continuous interaction reasoning and participation decisions, rather than restricting it to instruction understanding for diffusion models. (2) Constructing chunk-specific conditions and synchronize tokens across Intent and Realization on a unified timeline. Module-specific attention masks enforce causal dependencies both within and across chunks, preventing access to future inputs. (3) Mitigating distribution shift in both modules through dual rollout distillation, training on autoregressively generated Intent tokens and synthesized audiovisual histories from Realization. Both modules continuously perceive real-time audio, video, and text, enabling full-duplex interaction with spontaneous conversations and interruptions. Beyond conversation, users can share real objects, reshape virtual scenes, guide assistants, or play audiovisual games without mouse or keyboard controls. The release of Duo v1 makes our first step, with the next version coming soon. We look forward to broader exploration of this emerging field.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在本报告中，我们介绍了互惠世界模型（RWM），并展示了 Duo v1，这是一个全双工世界模型，能够持续感知音视频输入同时实时响应用户。RWM 将智能和物理现实视为构成世界的同等基本要素。现有的世界模型主要侧重于模拟后者，将推理和决策作为外部控制，而不是世界本身的内在部分。在 RWM 中，我们确定了两个同等基本的能力：意图（Intent），提供世界交互背后的认知；和实现（Realization），生成连贯的音视频行为。为了实现这一公式化，Duo v1 引入了三个关键技术设计：（1）利用自回归建模进行连续的交互推理和参与决策，而不是将其限制在扩散模型的指令理解上。（2）构建特定块的条件，并在统一的时间线上跨意图和实现同步 token。特定模块的注意力掩码强制块内和跨块的因果依赖，防止访问未来输入。（3）通过双重展开蒸馏减轻两个模块中的分布偏移，在自回归生成的意图 token 和从实现中合成的音视频历史上进行训练。两个模块持续感知实时音频、视频和文本，实现具有自发对话和中断的全双工交互。除了对话之外，用户无需鼠标或键盘控制即可共享真实物体、重塑虚拟场景、引导助手或玩音视频游戏。Duo v1 的发布迈出了我们的第一步，下一个版本即将推出。我们期待对这一新兴领域进行更广泛的探索。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出互惠世界模型（RWM）及其实例 Duo v1，实现持续感知音视频输入并实时响应用户的全双工交互，将智能推理与物理现实模拟结合为世界模型的内在部分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出互惠世界模型（RWM），将智能（意图）和物理现实（实现）视为构成世界的同等基本要素。2. 引入三项关键技术设计：利用自回归建模进行连续交互推理、构建统一时间线上的块特定条件与 token 同步、以及通过双重展开蒸馏减轻分布偏移。3. 实现无需鼠标或键盘的全双工交互，支持自发对话、中断、共享真实物体、重塑虚拟场景及音视频游戏。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前世界模型多侧重于物理现实模拟，而将推理和决策作为外部控制。RWM 和 Duo v1 将意图和实现作为内在能力结合，实现了真正的全双工交互。局限性方面，摘要未提供关于模型在长时间交互中的稳定性、延迟具体数值、多用户并发处理能力，以及在复杂物理交互场景下的具体成功率等定量评估数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents（演员、裁判还是教师？理解长视界智能体中的决策模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 29 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17167\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17167\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecision models answer a question with a typed output, such as a choice among options with a probability for each, so one model can choose an agent\u0026#x27;s actions, evaluate actions already taken, or score every action to teach a policy with reinforcement learning. Prior work has studied them mainly as actors, judging their usefulness by how well they act. We ask whether a decision model that acts poorly can still teach well. We compare three decision models and three general LLMs as actors and judges on ALFWorld, and use JEV as a teacher on ALFWorld and WebShop. As actors, all six models are pulled away from a subgoal that must come first by an easier one. As judges that see the whole trajectory, the same models credit the steps toward that subgoal, and asking whether each action helped, rather than whether the task will succeed, separates useful from useless actions. As a teacher, JEV raises a Qwen2.5-1.5B policy over GRPO from 72.8% to 82.9% success on ALFWorld and from 56.8% to 71.4% on WebShop. These results suggest that a poor actor can still teach well, because judging an action after the episode ends reveals the consequences that acting must anticipate. Code is available at https://github.com/ZJU-REAL/decision-agents.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e决策模型以类型化的输出回答问题，例如带有每个选项概率的选项选择，因此一个模型可以选择智能体的动作、评估已采取的动作，或对每个动作进行评分以通过强化学习教授策略。先前的工作主要将它们作为演员进行研究，通过它们行动的效果来判断其有用性。我们询问一个表现不佳的决策模型是否仍然能很好地教学。我们在 ALFWorld 上比较了三个决策模型和三个通用大语言模型作为演员和裁判的表现，并在 ALFWorld 和 WebShop 上使用 JEV 作为教师。作为演员，所有六个模型都被一个更容易的子目标从必须先完成的子目标上拉开。作为看到整个轨迹的裁判，相同的模型认可了朝着该子目标前进的步骤，并且询问每个动作是否有帮助，而不是任务是否会成功，从而将有用动作与无用动作区分开来。作为教师，JEV 将基于 GRPO 的 Qwen2.5-1.5B 策略在 ALFWorld 上的成功率从 72.8% 提高到 82.9%，在 WebShop 上从 56.8% 提高到 71.4%。这些结果表明，表现不佳的演员仍然可以很好地教学，因为在情节结束后判断一个动作可以揭示行动必须预见的后果。代码可在 https://github.com/ZJU-REAL/decision-agents 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在长视界智能体任务中，表现不佳的决策模型（作为演员）是否仍能作为教师（或裁判）有效地指导策略学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现决策模型作为演员时容易被简单子目标干扰，但作为裁判时能正确评估关键步骤。2. 提出通过询问动作是否有帮助而非任务是否成功来区分有效动作。3. JEV作为教师显著提升了Qwen2.5-1.5B策略在ALFWorld和WebShop上的成功率。4. 证明了表现不佳的演员仍能成为好老师，因为事后判断能揭示行动需预见的后果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在ALFWorld和WebShop上的具体成功率提升数据，证明了事后评估的有效性。局限性方面，摘要未提供关于模型泛化到其他环境的具体数据，也未提及JEV作为教师时的计算开销或与其他教师模型的对比，这些摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习与智能体决策\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. Open Vision Banana: A Fully Open Recipe for Generative Visual Perception（Open Vision Banana：生成式视觉感知的完全开放指南）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 28 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15844\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15844\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent work suggests that pretrained image generators encode real-world understanding beyond image synthesis. Vision Banana exploits this by framing vision tasks as conditional image editing. However, its data, weights, code, and implementation details are not public. We present Open Vision Banana (OVB), a fully open and reproducible recipe for converting pretrained generators into unified multi-task perception systems. Our analyses identify the design choices that matter most for generalization, including color encoding, prompt design, parameter adaptation, and task balancing. These choices interact, so individually helpful choices can hurt when combined with others. Starting from 4B and 9B parameter open-weight base models and using 2.1M-3.8M training pairs from public datasets, OVB surpasses Vision Banana\u0026#x27;s reported Cityscapes zero-shot performance (73.9 vs. 69.9 mIoU) and rivals state-of-the-art affine-invariant depth estimators. Its non-zero-shot variants come within five points of Vision Banana on referring and reasoning segmentation but remain further behind on instance segmentation. All models largely retain the base model\u0026#x27;s image-editing abilities. With legend ensembling, we introduce a test-time scaling method for generator-based perception. It segments an image under several class-color legends and fuses the results by majority vote, correcting unstable color-class bindings and improving mIoU by up to 8.7 points on Cityscapes and 15.0 points on COCO-Object without retraining. We release the dataset construction and processing pipeline, the training and evaluation code, as well as the final, intermediate, and ablation checkpoints. Project website: https://openvisionbanana.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的工作表明，预训练的图像生成器编码了超越图像合成的现实世界理解。Vision Banana 通过将视觉任务构建为条件图像编辑来利用这一点。然而，其数据、权重、代码和实现细节并未公开。我们提出了 Open Vision Banana (OVB)，这是一个完全开放且可复现的指南，用于将预训练生成器转换为统一的多任务感知系统。我们的分析确定了对泛化最重要的设计选择，包括颜色编码、提示设计、参数适应和任务平衡。这些选择相互交互，因此单独有益的选择在与其他选择结合时可能会产生负面影响。从 4B 和 9B 参数开放权重基础模型开始，并使用来自公共数据集的 2.1M-3.8M 训练对，OVB 超越了 Vision Banana 报告的 Cityscapes 零样本性能（73.9 对 69.9 mIoU），并与最先进的仿射不变深度估计器相媲美。其非零样本变体在指代和推理分割上比 Vision Banana 落后不到五个点，但在实例分割上仍有较大差距。所有模型在很大程度上保留了基础模型的图像编辑能力。通过图例集成，我们引入了一种基于生成器感知的测试时缩放方法。它在几个类别-颜色图例下对图像进行分割，并通过多数投票融合结果，纠正不稳定的颜色-类别绑定，并在不重新训练的情况下将 Cityscapes 上的 mIoU 提高多达 8.7 个点，将 COCO-Object 上的 mIoU 提高多达 15.0 个点。我们发布了数据集构建和处理管道、训练和评估代码，以及最终、中间和消融检查点。项目网站：https://openvisionbanana.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个完全开放且可复现的指南（Open Vision Banana, OVB），将预训练图像生成器转换为统一的多任务视觉感知系统，并探索提升其泛化能力和测试时性能的方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出完全开放的OVB，填补了Vision Banana未开源的空白。2. 识别了影响泛化的关键设计选择及其交互作用。3. 在Cityscapes零样本设置下超越Vision Banana（73.9 vs 69.9 mIoU）。4. 提出基于图例集成的测试时缩放方法，无需重训练即可显著提升Cityscapes和COCO-Object的mIoU。5. 开源了完整的数据集、代码和检查点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的性能对比数据，证明了方法的有效性，同时指出了非零样本变体在实例分割上仍落后于Vision Banana。局限性方面，摘要未提供关于模型推理速度、计算资源消耗以及在其他未提及的视觉任务上的表现，这些摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. On the Design of Hyper-Connections: Simplification, Stability, and Scalability（关于超连接的设计：简化、稳定性与可扩展性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 26 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.05984\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.05984\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHyper-Connections (HC) architectures are increasingly adopted in frontier language models, yet their components remain insufficiently understood and introduce non-negligible training overhead. In this work, we systematically study the HC architecture to understand its components and identify simpler, more efficient designs. We find that learned read/write gating without mixing and unconstrained mixing with fixed gates form two effective interaction groups: either alone achieves performance comparable to mHC. We also identify repeated access to the expanded residual state as a major source of training overhead, even without mixing. These findings lead to SimpleHC, which simplifies the architecture by removing residual mixing and simplifies execution through shared memory access, using the resulting additive structure and shared gate inputs. Layer-specific gates share a group-entry state, enabling batched reads and deferred writes; scalar corrections exactly preserve preceding sublayer output contributions. Our analyses support both the retained residual structure and the design of shared memory access. SimpleHC incurs only 2.4% extra end-to-end training time over a vanilla residual baseline at the largest tested scale. It maintains performance comparable to mHC when scaling from 15B to 30B MoE models, exhibits smoother gradient dynamics during standard training, and remains stable under stress. We hope SimpleHC will encourage a broader pursuit of simplicity in foundation model design, making performance gains more accessible and practical at scale.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e超连接（HC）架构在前沿语言模型中越来越被采用，但其组件仍未得到充分理解，并引入了不可忽略的训练开销。在这项工作中，我们系统地研究了 HC 架构以理解其组件并确定更简单、更高效的设计。我们发现，没有混合的学习读/写门控和具有固定门控的无约束混合构成了两个有效的交互组：单独使用任一组都能达到与 mHC 相当的性能。我们还确定了对扩展残差状态的重复访问是训练开销的主要来源，即使没有混合。这些发现促成了 SimpleHC，它通过移除残差混合来简化架构，并通过共享内存访问来简化执行，利用由此产生的加性结构和共享门控输入。特定层的门控共享一个组入口状态，从而实现批量读取和延迟写入；标量校正精确地保留了先前子层的输出贡献。我们的分析支持保留的残差结构和共享内存访问的设计。在最大测试规模下，SimpleHC 仅比普通的残差基线增加 2.4% 的端到端训练时间。当从 15B 扩展到 30B MoE 模型时，它保持了与 mHC 相当的性能，在标准训练期间表现出更平滑的梯度动态，并在压力下保持稳定。我们希望 SimpleHC 能鼓励在基础模型设计中更广泛地追求简洁，使性能增益在规模上更易于获取和实用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e系统研究超连接（HC）架构的组件，识别更简单、更高效的设计（SimpleHC），以降低训练开销并保持或提升模型在扩展时的性能与稳定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现无混合的读写门控和固定门控的无约束混合是两种有效的交互组，单独使用即可媲美mHC。2. 提出SimpleHC，通过移除残差混合和共享内存访问简化架构与执行。3. 在最大测试规模下，仅增加2.4%的端到端训练时间。4. 在15B到30B MoE模型扩展中保持与mHC相当的性能，梯度动态更平滑且压力下更稳定。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的训练时间开销数据和模型规模，证明了SimpleHC的高效性和可扩展性，同时提到了梯度动态更平滑和压力下的稳定性。局限性方面，摘要未提供SimpleHC在下游具体任务上的详细评估指标，也未提及与其他非HC先进架构的对比，这些摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与基础模型架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. Ropedia Xperience 2: A Gold Standard for Scaling Physical AI Environments and Behaviors（Ropedia Xperience 2：扩展物理人工智能环境与行为的黄金标准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 25 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17060\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17060\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge foundation models such as GPT-6 Astra and Claude Fable 5.1 have recently been shown to control robots directly from visual observations. They nevertheless remain brittle on long-horizon, contact-rich tasks in real-world environments. Further progress depends on two complementary resources: demonstrations of human behavior that supervise how tasks are performed, and interactive environments in which policies can be rolled out, evaluated, and improved in closed loop. Language models have advanced along well-characterized scaling laws; the corresponding question for physical AI is how capability scales with environments and behaviors, which first requires identifying which data to scale and how to produce and reuse such data continuously. To address this question, we introduce Ropedia Xperience 2, comprising 1,589 released metric-scale 3D scans and a collection of 4,230 egocentric recordings of 74 tasks (131 hours). We further show that each capture can be repurposed for robot learning: scenes are converted into physically interactive simulation environments, human motion is retargeted to whole-body robot trajectories, and additional robot behaviors are obtained through virtual teleoperation and automated long-horizon trajectory generation. We propose this joint capture of environments and behaviors as a gold standard for physical AI data collection, laying a data foundation for establishing scaling laws over environments and behaviors.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e诸如 GPT-6 Astra 和 Claude Fable 5.1 等大型基础模型最近已被证明可以直接从视觉观察中控制机器人。然而，它们在现实世界环境中的长视界、接触密集型任务上仍然很脆弱。进一步的进展取决于两个互补的资源：监督任务如何执行的人类行为演示，以及可以在其中闭环推出、评估和改进策略的交互式环境。语言模型已经沿着特征明确的缩放定律取得了进展；物理人工智能的相应问题是能力如何随环境和行为缩放，这首先需要确定缩放哪些数据以及如何持续生产和重用此类数据。为了解决这个问题，我们引入了 Ropedia Xperience 2，包含 1,589 个发布的公制比例 3D 扫描和 74 个任务的 4,230 个第一人称视角录像（131 小时）的集合。我们进一步展示了每次捕获都可以重新用于机器人学习：场景被转换为物理交互式模拟环境，人类运动被重新定位到全身机器人轨迹，并且通过虚拟遥操作和自动长视界轨迹生成获得额外的机器人行为。我们提出这种环境和行为的联合捕获作为物理人工智能数据收集的黄金标准，为建立环境和行为的缩放定律奠定数据基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 Ropedia Xperience 2 数据集与数据收集标准，通过联合捕获物理交互环境和人类行为数据，为研究物理人工智能在环境和行为上的缩放定律奠定数据基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入包含1,589个公制比例3D扫描和4,230个第一人称视角录像（74个任务，131小时）的Ropedia Xperience 2。2. 证明了捕获数据可重用于机器人学习：场景转为物理交互模拟环境，人类运动重定向为全身机器人轨迹。3. 通过虚拟遥操作和自动长视界轨迹生成获取额外机器人行为。4. 提出环境与行为联合捕获作为物理AI数据收集的黄金标准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细说明了数据集的规模以及数据重用的具体方法。局限性方面，摘要未提供使用该数据集训练出的具体机器人策略的性能指标，也未提及该数据集在验证物理AI缩放定律时的具体实验结论，这些摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人与物理人工智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. TTB: Test-time Baking for Efficient Rendering of Decoder-only View Synthesis Models（TTB：用于仅解码器视图合成模型高效渲染的测试时烘焙）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17331\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17331\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecoder-only Large View Synthesis Models (LVSMs) with KV-cache have recently achieved state-of-the-art quality by regressing novel views from neural networks without reconstructing 3D geometry, while Test-Time Training (TTT) layers save computation but sacrifice quality. We propose Test-Time Baking (TTB), a strategy that learns to bake global scene information from cross-view attention into a lightweight MLP, enabling fast and high-fidelity novel-view decoding. The first key is to repurpose the fast-weight MLP of TTT to learn the cross-view attention mapping explicitly from its input-output pairs, rather than replacing attention entirely, achieving the same rendering efficiency as TTT while delivering substantially higher quality. The second key addresses a modality misalignment between context prefilling and novel-view rendering: we disentangle context tokens into camera-only context rendering tokens to serve as TTB input, and context ground-truth tokens with image content to serve as the TTB mapping target, ensuring the baked MLPs are relieved of the modality generalization challenge between context and novel-view processing. Our method achieves up to **23x** rendering speedup with quality on par with the state-of-the-art across several benchmarks. Project page: https://test-time-baking.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e带有 KV 缓存的仅解码器大型视图合成模型（LVSM）最近通过从神经网络回归新视图而不重建 3D 几何结构，实现了最先进的质量，而测试时训练（TTT）层节省了计算但牺牲了质量。我们提出了测试时烘焙（TTB），这是一种学习将来自跨视图注意力的全局场景信息烘焙到轻量级 MLP 中的策略，从而实现快速且高保真的新视图解码。第一个关键是将 TTT 的快速权重 MLP 重新用于从其输入-输出对中显式学习跨视图注意力映射，而不是完全替换注意力，从而实现与 TTT 相同的渲染效率，同时提供显著更高的质量。第二个关键解决了上下文预填充和新视图渲染之间的模态不对齐问题：我们将上下文标记解缠为仅相机的上下文渲染标记以作为 TTB 输入，并将具有图像内容的上下文真实标记作为 TTB 映射目标，确保烘焙的 MLP 免受上下文和新视图处理之间模态泛化挑战的影响。我们的方法在多个基准测试中实现了高达 23 倍的渲染加速，且质量与最先进的方法相当。项目页面：https://test-time-baking.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出测试时烘焙（TTB）策略，通过将跨视图注意力的全局场景信息烘焙到轻量级MLP中，解决仅解码器大型视图合成模型在渲染新视图时计算成本高或质量受损的问题，实现高效且高保真的渲染。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出TTB策略，将跨视图注意力信息烘焙到轻量级MLP，替代完全替换注意力的TTT层。2. 解缠上下文标记，解决上下文预填充与新视图渲染间的模态不对齐问题。3. 在多个基准测试中实现高达23倍的渲染加速。4. 在大幅提升渲染速度的同时，保持了与最先进方法相当的渲染质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了明确的加速数据和质量对比，证明了TTB在效率和保真度上的优势，并详细解释了模态不对齐的解决机制。局限性方面，摘要未提供具体的基准测试名称、不同场景下的具体加速倍数差异、以及模型训练或烘焙过程本身的时间开销，这些摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与神经渲染\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. WorldDraft: If Code Builds the World, Can Video Models Just Render It?（WorldDraft：如果代码构建世界，视频模型能仅仅负责渲染吗？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16217\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16217\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal coding agents decouple 4D world construction from visual generation, repurposing video models from world generators toward generative renderers. This division of labor raises a fundamental question: if code builds the world, can video models just render it? A reliable generative renderer hinges on two complementary criteria: (i) world preservation, retaining prescribed 4D kinematics and camera paths; and (ii) visual realization, persistently binding text-specified target attributes over time. To evaluate this capability, we introduce WorldDraft, a benchmark of 432 strictly paired test cases across 48 executable 4D world families spanning six dynamic challenge categories. Under a 3 times 3 factorial design, WorldDraft orthogonally crosses draft granularity (abstract proxy to previs) and appearance alignment (neutral to conflicting) under identical dynamics. Extensive evaluations across 12 representative models reveal that: (I) world preservation and visual realization remain in stark operational tension; (II) richer draft scaffolding anchors structure but paradoxically impairs appearance fidelity; and (III) conflicting source cues trigger severe source leakage (up to 64%), exposing fragile cross-modal disentanglement. To mitigate these bottlenecks, we propose WorldDraft-Primer, a plug-and-play visual prompting strategy that consistently improves both objectives across frozen video renderers. Together, WorldDraft and WorldDraft-Primer lay a foundation for bridging programmatic 4D simulation with video generation, advancing physically grounded generative rendering.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态代码智能体将4D世界构建与视觉生成解耦，将视频模型从世界生成器重新用作生成式渲染器。这种分工提出了一个基本问题：如果代码构建世界，视频模型能仅仅负责渲染吗？一个可靠的生成式渲染器取决于两个互补的标准：（i）世界保留，保留规定的4D运动学和相机路径；以及（ii）视觉实现，随时间持续绑定文本指定的目标属性。为了评估这种能力，我们引入了WorldDraft，这是一个包含432个严格配对的测试用例的基准，跨越48个可执行的4D世界族，涵盖6个动态挑战类别。在3乘3的析因设计下，WorldDraft在相同动态下正交交叉了草稿粒度（从抽象代理到预演）和外观对齐（从中性到冲突）。对12个代表性模型的广泛评估表明：（I）世界保留和视觉实现之间存在明显的操作张力；（II）更丰富的草稿脚手架锚定了结构，但矛盾地损害了外观保真度；以及（III）冲突的源线索触发了严重的源泄漏（高达64%），暴露了脆弱的跨模态解耦。为了缓解这些瓶颈，我们提出了WorldDraft-Primer，一种即插即用的视觉提示策略，在冻结的视频渲染器上持续改善这两个目标。WorldDraft和WorldDraft-Primer共同为连接程序化4D模拟与视频生成奠定了基础，推进了基于物理的生成式渲染。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估视频模型作为生成式渲染器在4D世界构建中的能力，即评估其在保留4D运动学和相机路径（世界保留）以及绑定文本指定目标属性（视觉实现）方面的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出WorldDraft基准，包含432个测试用例和48个4D世界族，采用3x3析因设计评估草稿粒度和外观对齐。2. 发现世界保留与视觉实现存在操作张力，丰富的草稿脚手架损害外观保真度，冲突源线索导致高达64%的源泄漏。3. 提出即插即用的视觉提示策略WorldDraft-Primer，在冻结的视频渲染器上同时提升两个目标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前视频模型在作为生成式渲染器时，世界保留和视觉实现存在张力，且草稿脚手架和冲突线索会带来负面影响（如源泄漏高达64%）。提出的WorldDraft-Primer能缓解这些瓶颈。局限性方面，摘要未提供具体的模型名称、具体的视频渲染器架构细节或WorldDraft-Primer的具体实现机制，也未提及在真实世界物理环境中的泛化验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与多模态生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. Factored One-sided Adam-Moment for Practical and Scalable SOAP（用于实用且可扩展SOAP的分解单边Adam矩）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16905\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16905\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSecond-order optimizers (e.g., Shampoo, SOAP) have emerged as compelling alternatives to Adam/AdamW and promise faster per-step convergence than AdamW in transformer training. However, they still remain costly in practice, and even SOAP still pays substantial optimizer-state memory and eigendecomposition overhead. We ask whether the benefits of SOAP can be retained at nearly the efficiency of AdamW. In this paper, we answer yes with a lightweight SOAP variant, Factored One-sided Adam-Moment (FOAM). The path to practical impact is twofold: first, FOAM employs input-only preconditioning, dropping the output-side Kronecker factor to reduce memory and remove one eigendecomposition. The Kronecker structure of the Hessian shows that this is exact for a diagonal output-side curvature and nearly lossless for a near-diagonal one, as we observe empirically. Second, FOAM replaces SOAP\u0026#x27;s dense rotated second moment with a factored Adam-moment estimator based on row-by-column statistics. Under the K-FAC Fisher assumption with a diagonal output curvature, this estimator exactly recovers SOAP\u0026#x27;s dense second moment, and we measure only a 15-20% K-FAC violation, with negligible effect on the update. Our empirical results support the claim that FOAM matches strong SOAP and Muon baselines in validation loss across scales of large language model (LLM) pre-training, uses half of SOAP\u0026#x27;s optimizer state, runs at Muon-class wall-clock time, and retains robustness across a three-fold learning-rate range. The results hold from 124M to 760M parameters, demonstrating that SOAP\u0026#x27;s gains need not require SOAP\u0026#x27;s cost. Code: https://github.com/naver-ai/foam\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e二阶优化器（如Shampoo、SOAP）已成为Adam/AdamW的引人注目的替代方案，并承诺在Transformer训练中实现比AdamW更快的每步收敛。然而，它们在实践中仍然成本高昂，即使是SOAP也需要付出大量的优化器状态内存和特征分解开销。我们问是否可以在接近AdamW的效率下保留SOAP的优势。在本文中，我们用一种轻量级的SOAP变体Factored One-sided Adam-Moment（FOAM）给出了肯定的回答。产生实际影响的路径有两方面：首先，FOAM采用仅输入预处理，丢弃输出侧Kronecker因子以减少内存并移除一次特征分解。Hessian的Kronecker结构表明，这对于对角输出侧曲率是精确的，对于近对角的曲率几乎是无损的，正如我们在经验中观察到的那样。其次，FOAM用基于逐行逐列统计的分解Adam矩估计器替换了SOAP的密集旋转二阶矩。在对角输出曲率的K-FAC Fisher假设下，该估计器精确恢复了SOAP的密集二阶矩，我们测量到仅有15-20%的K-FAC违规，对更新的影响可以忽略不计。我们的经验结果支持这一说法，即FOAM在大型语言模型（LLM）预训练的各种规模上，在验证损失上匹配了强大的SOAP和Muon基线，使用了SOAP一半的优化器状态，以Muon级的挂钟时间运行，并在三倍的学习率范围内保持了鲁棒性。这些结果在124M到760M参数规模上成立，表明SOAP的收益不需要付出SOAP的成本。代码：https://github.com/naver-ai/foam\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种轻量级的二阶优化器变体FOAM，旨在保留SOAP优化器的收敛优势，同时将其内存和计算开销降低至接近AdamW的效率水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出FOAM，采用仅输入预处理并丢弃输出侧Kronecker因子，减少内存和特征分解开销。2. 使用基于逐行逐列统计的分解Adam矩估计器替换密集旋转二阶矩，K-FAC违规仅为15-20%。3. 在124M至760M参数的LLM预训练中，FOAM匹配SOAP和Muon基线的验证损失，优化器状态减半，运行时间达到Muon级，且在三倍学习率范围内保持鲁棒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明FOAM在124M到760M参数规模下有效，优化器状态减半且速度达到Muon级。局限性方面，摘要未提供超过760M参数规模（如更大LLM）的实验结果，未详细说明K-FAC违规对极大规模训练的具体长期影响，也未提供与其他最新优化器（如除了Shampoo、SOAP、AdamW、Muon之外）的详细对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习优化算法\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. UniSpark: Exploring Hybrid Attention for Multimodal Understanding and Generation（UniSpark：探索用于多模态理解与生成的混合注意力机制）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16517\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16517\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present UniSpark-9B, a unified multimodal model that investigates hybrid attention for visual understanding and generation. Built on a Mixture-of-Transformer-Experts backbone with approximately 9B parameters in each branch, UniSpark combines full attention for explicit token interactions with GatedDeltaNet linear attention for compact context propagation. Autoregressive text prediction and visual flow matching jointly support visual question answering, text-to-image generation, instruction-guided editing, and interleaved text-image prediction. In interleaved generation, noisy visual targets are isolated from subsequent predictions, while clean visual representations provide context for later outputs. A blockwise protocol enforces this distinction through attention masks in full-attention layers and recurrent-state retention rules in linear-attention layers. The selected training sources contain 159.7M generation samples, 213.4M understanding samples, and 624.8K interleaved sequences. A four-stage curriculum jointly trains multimodal understanding and visual generation, refining answer accuracy and instruction following while extending image synthesis to 2K. UniSpark scores 2470.3 on MME-S and 0.83 on GenEval. Qualitative examples further illustrate its capabilities in interleaved image generation, video synthesis, and video editing. Together, these results demonstrate that hybrid attention provides an effective backbone for unified multimodal understanding and generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了UniSpark-9B，一个统一的多模态模型，用于研究混合注意力在视觉理解和生成中的应用。UniSpark构建在混合Transformer专家（Mixture-of-Transformer-Experts）主干上，每个分支约有90亿参数，将用于显式token交互的全注意力与用于紧凑上下文传播的GatedDeltaNet线性注意力相结合。自回归文本预测和视觉流匹配共同支持视觉问答、文本到图像生成、指令引导编辑和交错的文本-图像预测。在交错生成中，嘈杂的视觉目标与后续预测隔离，而干净的视觉表示为后续输出提供上下文。分块协议通过全注意力层中的注意力掩码和线性注意力层中的循环状态保留规则来强制执行这种区分。选定的训练源包含1.597亿个生成样本、2.134亿个理解样本和62.48万个交错序列。四阶段课程联合训练多模态理解和视觉生成，提高答案准确性和指令遵循能力，同时将图像合成扩展至2K。UniSpark在MME-S上得分2470.3，在GenEval上得分0.83。定性示例进一步说明了其在交错图像生成、视频合成和视频编辑方面的能力。这些结果共同表明，混合注意力为统一的多模态理解和生成提供了有效的主干。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出并验证一种结合全注意力和线性注意力的混合注意力机制（UniSpark-9B），用于统一多模态理解（如视觉问答）与生成（如文本到图像、交错文本-图像预测、视频合成与编辑）任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出UniSpark-9B，采用混合Transformer专家主干（每分支约9B参数），结合全注意力和GatedDeltaNet线性注意力。2. 设计分块协议，通过注意力掩码和循环状态保留规则隔离交错生成中的嘈杂视觉目标。3. 使用包含1.597亿生成样本、2.134亿理解样本和62.48万交错序列的数据集进行四阶段课程训练，图像合成扩展至2K。4. 在MME-S上得分2470.3，GenEval上得分0.83。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了UniSpark-9B在多模态理解和生成任务上的具体得分（MME-S 2470.3, GenEval 0.83）以及支持2K图像合成。局限性方面，摘要未提供与其他同等规模（如9B参数）统一多模态模型的详细对比基线数据，未说明GatedDeltaNet线性注意力在极长上下文下的具体性能瓶颈，也未提供视频合成和编辑的定量评估指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement（学习任务还是学习验证器？重新思考具身自我改进中的标准暴露）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.08318\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.08318\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSelf-improving embodied agents are increasingly being developed and compared on robot simulation benchmarks. Several recent works expose the benchmark\u0026#x27;s success criteria to the learning agent, a practice we call Criteria Exposure (CE). These criteria, originally written to verify policies trained by imitation learning, often demand more than the corresponding language instructions, so a score from such a verifier may not faithfully reflect whether the instructed task was completed, especially for robot-control programs written by an agent. As embodied coding agents report ever higher benchmark scores, a natural question arises: when a coding agent is exposed to the benchmark\u0026#x27;s criteria, does it generate code that better performs the instructed task, or code that simply overfits to the verification criteria? We conduct controlled experiments with a self-improving agent with and without CE, and find that with CE the agent quickly produces code with a higher success rate under the given criteria, but this advantage disappears when the criteria are changed slightly without departing from the original instructions. More importantly, the skills the agent develops under CE transfer poorly across tasks. We further propose instruction-faithful criteria and show that they better reflect the performance of agent-generated programs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自我改进的具身智能体越来越多地在机器人仿真基准上进行开发和比较。最近的几项工作将基准的成功标准暴露给学习智能体，我们将这种做法称为标准暴露（CE）。这些标准最初是为了验证通过模仿学习训练的策略而编写的，通常要求比相应的语言指令更多，因此来自此类验证器的分数可能无法忠实地反映指示的任务是否完成，特别是对于由智能体编写的机器人控制程序。随着具身编码智能体报告越来越高的基准分数，一个自然的问题出现了：当编码智能体暴露于基准的标准时，它是生成了更好执行指示任务的代码，还是仅仅过拟合于验证标准的代码？我们对有和没有CE的自我改进智能体进行了对照实验，发现使用CE时，智能体能快速生成在给定标准下具有更高成功率的代码，但当标准发生轻微改变而不偏离原始指令时，这种优势就消失了。更重要的是，智能体在CE下开发的技能在跨任务迁移时表现很差。我们进一步提出了忠于指令的标准，并表明它们能更好地反映智能体生成程序的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在具身自我改进智能体中，将基准成功标准暴露给智能体（标准暴露，CE）是否会导致智能体过拟合验证标准而非真正学习指示任务，并提出改进的评估标准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示标准暴露（CE）问题：智能体在CE下能快速提高给定标准的成功率，但在标准轻微改变时优势消失，且跨任务迁移能力差。2. 证明CE导致智能体过拟合验证标准而非执行实际指示任务。3. 提出忠于指令的标准（instruction-faithful criteria），证明其能更准确地反映智能体生成程序的真实任务执行性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过对照实验证明了CE会导致智能体过拟合验证器，且跨任务迁移差，提出了忠于指令的标准作为替代。局限性方面，摘要未提供具体的机器人仿真基准名称、未说明忠于指令的标准的具体设计细节和定量提升幅度，也未提及该方法在真实物理机器人（而非仅仿真）上的验证情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. Unbundling Multimodal Vision Encoding（解构多模态视觉编码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17334\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17334\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHow multimodal language models should encode visual input remains up for debate. Most models use a pretrained vision encoder, while some recent recipes train the encoder from scratch with the language model or remove it entirely. Vision encoders bundle together three design choices: a visual prior from upstream pretraining, dedicated vision capacity, and pre-fusion placement of that capacity (i.e., before the multimodal backbone). Because published models also differ in data, architecture, and compute, comparing them cannot isolate the effect of each choice. We disentangle these choices via a controlled framework where we pretrain all models from scratch on common data and compare them on visual question answering and language benchmarks at matched lifetime compute. We find that the visual prior is not necessary; an encoder trained jointly from scratch is on par with a pretrained one, without a separate training stage. What matters instead is dedicated vision capacity: an encoder-free model trails on visual understanding even when its backbone is enlarged by the encoder\u0026#x27;s parameter count. Yet that capacity need not precede multimodal fusion, as vision-only modules added in-fusion to early backbone layers perform comparably to a pre-fusion encoder and can lower time to first token. These results also hold across backbone sizes, when encoder pretraining is treated as free, and when starting from a pretrained language model. Overall, our findings favor dedicated vision capacity trained jointly with the backbone and placed early within it.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态语言模型应如何编码视觉输入仍存在争议。大多数模型使用预训练的视觉编码器，而一些最新的方法将编码器与语言模型从头开始联合训练或完全移除它。视觉编码器将三种设计选择捆绑在一起：来自上游预训练的视觉先验、专用的视觉能力以及该能力的融合前放置（即在多模态主干之前）。由于已发布的模型在数据、架构和计算上也各不相同，比较它们无法隔离每种选择的影响。我们通过一个受控框架解耦了这些选择，在该框架中，我们在公共数据上从头预训练所有模型，并在匹配的终身计算下比较它们在视觉问答和语言基准上的表现。我们发现视觉先验并非必要；从头联合训练的编码器与预训练的编码器不相上下，且无需单独的训练阶段。真正重要的是专用的视觉能力：无编码器的模型在视觉理解上落后，即使其主干增加了编码器的参数量。然而，这种能力不必先于多模态融合，因为在融合时添加到早期主干层的纯视觉模块的表现与融合前编码器相当，并且可以降低首个token的生成时间。这些结果在不同主干规模下、当编码器预训练被视为免费时以及从预训练语言模型开始时同样成立。总体而言，我们的发现支持将与主干联合训练并放置在其早期的专用视觉能力作为首选。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解构并评估多模态语言模型中视觉编码器的三种设计选择（视觉先验、专用视觉能力、融合前放置），以确定最佳的视觉输入编码策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出受控框架，在相同数据和计算下解耦视觉先验、专用视觉能力和放置位置的影响。2. 发现视觉先验非必要，从头联合训练的编码器可媲美预训练编码器。3. 证明专用视觉能力是关键，无编码器模型即使参数量增加也表现不佳。4. 发现专用视觉能力无需融合前放置，在融合时加入早期主干层的纯视觉模块效果相当且能降低首token生成时间。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过严格控制变量（数据、计算、主干规模等）证明了专用视觉能力的重要性及放置位置的灵活性。局限性方面，摘要未提供具体的视觉问答和语言基准名称及具体得分，未详细说明纯视觉模块的具体架构设计，也未探讨该策略在更复杂的多模态任务（如视频理解、高分辨率图像密集预测）中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大模型架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. JustRUA: A Controlled Study of GPT-6 Robot-Use Agents（JustRUA：GPT-6 机器人使用代理的对照研究）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16009\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16009\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGPT-6 Astra can drive a robot arm directly through a fixed harness, and scores of such robot-use agents on RoboDojo have risen quickly since. Reported systems differ in harness and test subset and often change several designs at once, so it is hard to tell which choices produce the gains. We take these designs apart and test them in one framework, along the harness around the model, the action interface, the reuse of experience and the scene geometry given to the model. A lean harness that keeps the full episode history and stops each motion early goes a long way. Reusing experience changes how the model acts but is not a free lunch, and scene geometry helps most, even when depth is predicted from RGB alone. JustRUA starts from the official L3 harness and keeps only what matters most. Even with no learned policy, self-improvement loop or task-specific tuning, this simple harness raises the score on the RoboDojo simulation benchmark substantially, from 29.7 to 50.3.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eGPT-6 Astra 可以通过固定线束直接驱动机械臂，此后此类机器人使用代理在 RoboDojo 上的得分迅速上升。报道的系统在线束和测试子集上有所不同，并且经常同时更改多个设计，因此很难分辨哪些选择带来了收益。我们将这些设计拆解并在一个框架中进行测试，涉及模型周围的线束、动作接口、经验重用以及提供给模型的场景几何。一个保留完整回合历史并提前停止每次动作的精简线束发挥了很大作用。重用经验改变了模型的行为方式，但并非免费午餐，而场景几何帮助最大，即使深度仅从 RGB 预测。JustRUA 从官方 L3 线束开始，仅保留最重要的部分。即使没有学习到的策略、自我改进循环或特定于任务的调整，这个简单的线束也大幅提高了 RoboDojo 模拟基准上的得分，从 29.7 提高到 50.3。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和优化 GPT-6 机器人使用代理在 RoboDojo 基准上的表现，通过拆解和对照测试不同的设计选择（如线束、动作接口、经验重用和场景几何）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 JustRUA 框架，通过精简线束（保留完整回合历史并提前停止动作）和引入场景几何（即使仅从 RGB 预测深度）显著提升性能；在 RoboDojo 模拟基准上，无需学习策略、自我改进循环或任务特定调整，得分从 29.7 提升至 50.3。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该研究通过控制变量法拆解了现有机器人代理的设计，证明了精简线束和场景几何的关键作用。局限性方面，摘要未提供关于该方法在其他机器人基准或真实物理机器人上的泛化能力，也未提及经验重用的具体成本或失败案例，这些细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能 / 大语言模型代理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. DeepStress: Stress-Testing Deep Search Agents（DeepStress：深度搜索代理的压力测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2607.13920\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2607.13920\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWhile search agents demonstrate impressive capabilities in multi-step question answering, their robustness to poor-quality evidence remains under-explored. Such evidence is rare in benchmark corpora, and resulting failures are hard to reproduce. We propose DeepStress, a dynamic stress-testing framework that subjects agents to degraded evidence at controlled rates. It replaces the retrieval module with a synthetic environment where documents are generated dynamically for each query, under independent control of their trustworthiness, relevance, and factuality. To characterize behavior under stress, we go beyond binary accuracy with a five-way classification of final-answer outcomes and two new reliability-aware metrics, RAS and CoPRAS, which credit cautious behavior and account for computational cost. Evaluating 12 systems on questions from HotpotQA and BrowseComp-Plus, we find that several open-weight agents answer confidently when sources contain obvious credibility red flags, and that many HotpotQA questions are answered from parametric knowledge even when all returned documents are factually wrong.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e虽然搜索代理在多步问答中展现出令人印象深刻的能力，但它们对低质量证据的鲁棒性仍未得到充分探索。此类证据在基准语料库中很少见，导致的失败也难以重现。我们提出了 DeepStress，一个动态压力测试框架，使代理在受控速率下接受退化证据。它用合成环境替换检索模块，在该环境中为每个查询动态生成文档，并独立控制其可信度、相关性和事实性。为了表征压力下的行为，我们超越了二元准确性，对最终答案结果进行五分类，并提出了两个新的可靠性感知指标 RAS 和 CoPRAS，它们奖励谨慎行为并考虑计算成本。在 HotpotQA 和 BrowseComp-Plus 的问题上评估 12 个系统，我们发现几个开源权重代理在来源包含明显的可信度危险信号时仍自信地回答，并且即使所有返回的文档在事实上都是错误的，许多 HotpotQA 问题也是从参数知识中回答的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 DeepStress 动态压力测试框架，评估搜索代理在面对低质量、退化证据时的鲁棒性和行为特征。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 DeepStress 框架，通过合成环境动态生成具有可控可信度、相关性和事实性的文档；引入五分类最终答案结果和两个可靠性感知指标（RAS 和 CoPRAS）；发现多个开源代理在证据存在明显可信度问题时仍自信作答，且常依赖参数知识而非错误文档。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出搜索代理在处理低质量证据时存在鲁棒性不足的问题，并提出了相应的测试框架和评估指标。局限性方面，摘要未提供该框架在更广泛或不同领域的问答数据集上的测试结果，也未提及如何具体解决代理过度自信或依赖参数知识的问题，这些改进方案摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 信息检索与问答代理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. HiVe-Mem: Interleaving Horizontal Memory Expansion and Vertical Evidence Composition for Multimodal Agents（HiVe-Mem：多模态代理的水平记忆扩展与垂直证据组合交错机制）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12872\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12872\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs multimodal agents accumulate increasingly long interaction histories, effectively retrieving and utilizing past information becomes critical for long-term interaction. Existing memory systems typically rely on semantic retrieval over compressed memories and expose predefined representations, which may miss relevant memories and overlook heterogeneous evidence needs across queries. We introduce \\hivemem, a multimodal memory framework that interleaves \\textsc{H}or\\textsc{i}zontal Memory Expansion with \\textsc{Ve}rtical Evidence Composition. For horizontal memory expansion, \\hivemem organizes memory episodes into a relational graph using textual and visual anchors, expanding semantically retrieved seeds with related neighbors to recover complementary information. For vertical evidence composition, each retrieved memory retains multiple evidence forms, including compact summaries, captions, grounded visual views, raw images, and interaction history. A lightweight trainable selector independently composes an evidence subset for each retrieved memory, enabling query-adaptive utilization of heterogeneous multimodal information. This two-dimensional design jointly broadens memory coverage and adapts the evidence contributed by individual memories. Experiments across three multimodal memory benchmarks show that \\hivemem consistently improves task performance across base models while reducing token consumption by about 90\\% compared with the most efficient competing multimodal baselines.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着多模态代理积累越来越长的交互历史，有效地检索和利用过去的信息对于长期交互变得至关重要。现有的记忆系统通常依赖于对压缩记忆的语义检索并暴露预定义的表示，这可能会遗漏相关的记忆并忽视跨查询的异构证据需求。我们引入了 HiVe-Mem，一个交错水平记忆扩展与垂直证据组合的多模态记忆框架。对于水平记忆扩展，HiVe-Mem 使用文本和视觉锚点将记忆片段组织成关系图，用相关的邻居扩展语义检索的种子以恢复互补信息。对于垂直证据组合，每个检索到的记忆保留多种证据形式，包括紧凑的摘要、字幕、接地的视觉视图、原始图像和交互历史。一个轻量级的可训练选择器为每个检索到的记忆独立组合一个证据子集，从而实现异构多模态信息的查询自适应利用。这种二维设计共同拓宽了记忆覆盖范围并适应了单个记忆贡献的证据。在三个多模态记忆基准上的实验表明，与最高效的竞争多模态基线相比，HiVe-Mem 在跨基础模型一致提高任务性能的同时，将 token 消耗减少了约 90%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多模态代理在长期交互中有效检索和利用历史信息的问题，提出 HiVe-Mem 多模态记忆框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 HiVe-Mem 框架，结合水平记忆扩展（通过关系图利用文本和视觉锚点扩展检索种子）和垂直证据组合（保留多种证据形式并通过轻量级选择器进行查询自适应组合）；在三个多模态记忆基准上提升任务性能，并将 token 消耗减少约 90%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该研究通过二维设计解决了现有记忆系统遗漏相关记忆和忽视异构证据需求的问题，显著降低了 token 消耗。局限性方面，摘要未提供这三个多模态记忆基准的具体名称和详细得分，也未提及轻量级可训练选择器的具体训练数据或计算开销，这些细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 智能体记忆系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. Agent-R^2: Scaling Agents for Realistic Productivity Work via Real-Source Data Synthesis（Agent-R^2：通过真实来源数据合成扩展现实生产力工作代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.08219\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.08219\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models have made rapid progress in agentic reasoning and tool use, raising expectations for agents that can take over realistic productivity work from humans. However, current agents still struggle to finish such tasks, where success requires following long-horizon professional workflows, understanding heterogeneous file contexts, and producing usable deliverables under fine-grained requirements. A key bottleneck is the lack of scalable post-training data that reflects real work intent, authentic file environments, and deliverable-level evaluation. To close this gap, we introduce Agent-R^2, a real-source data synthesis framework that scales training data for realistic productivity work. Instead of relying on manually specified workflows or LLM-generated files, Agent-R^2 grounds synthesis throughout the pipeline in real occupational seeds, corpus-derived workflow evidence, and authentic web-sourced files. From 10k web-corpus candidates, Agent-R^2 distills 4k task instances that pair real multi-format attachments with fine-grained, deliverable-level rubrics. On this data, we train Agent-R^2-4B via supervised fine-tuning and rubric-based reinforcement learning, improving both end-to-end productivity performance and file-grounded reasoning. Trained on only 4k instances, Agent-R^2-4B surpasses Qwen3-235B-A22B-Thinking-2507 on both GDPval (51.0% vs. 48.0%) and OfficeQA (14.8% vs. 13.8%). Further analysis shows that Agent-R^2 mitigates shortcut behavior, where agents produce superficially plausible deliverables before sufficiently grounding, constructing, or verifying them, while promoting sustained exploration.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型在代理推理和工具使用方面取得了快速进展，提高了对能够接管人类现实生产力工作的代理的期望。然而，当前的代理仍然难以完成此类任务，这些任务的成功需要遵循长周期的专业工作流程、理解异构的文件上下文，并在细粒度要求下生成可用的交付成果。一个关键瓶颈是缺乏反映真实工作意图、真实文件环境和交付成果级评估的可扩展后训练数据。为了弥补这一差距，我们引入了 Agent-R^2，一个为现实生产力工作扩展训练数据的真实来源数据合成框架。Agent-R^2 不依赖于手动指定的工作流程或 LLM 生成的文件，而是将整个管道中的合成建立在真实的职业种子、源自语料库的工作流程证据和真实的网络来源文件之上。从 1 万个网络语料库候选中，Agent-R^2 提炼出 4000 个任务实例，将真实的多格式附件与细粒度的交付成果级评分标准配对。在此数据上，我们通过监督微调和基于评分标准的强化学习训练了 Agent-R^2-4B，提高了端到端生产力性能和基于文件的推理能力。仅使用 4000 个实例训练，Agent-R^2-4B 在 GDPval（51.0% 对 48.0%）和 OfficeQA（14.8% 对 13.8%）上均超越了 Qwen3-235B-A22B-Thinking-2507。进一步分析表明，Agent-R^2 缓解了捷径行为（即代理在充分接地、构建或验证交付成果之前生成表面上合理的交付成果），同时促进了持续的探索。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决当前代理在现实生产力工作中缺乏高质量后训练数据的问题，提出 Agent-R^2 真实来源数据合成框架以扩展训练数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Agent-R^2 框架，基于真实职业种子、语料库工作流证据和网络文件合成数据；提炼 4000 个任务实例并结合监督微调与基于评分标准的强化学习训练 Agent-R^2-4B；在 GDPval 和 OfficeQA 上超越大参数模型，并有效缓解代理的捷径行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该研究通过真实来源数据合成解决了生产力代理训练数据缺乏的问题，并在基准测试中取得了优于大参数模型的结果，同时缓解了捷径行为。局限性方面，摘要未提供 GDPval 和 OfficeQA 基准的具体任务细节，也未提及该框架在更多样化或更复杂的真实办公场景中的泛化表现，这些评估细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型应用 / 智能体数据合成与训练\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. Evidence-Guided Recovery for AI Agents with Ambiguous Tool Outcomes and Partial Execution（针对具有模糊工具结果和部分执行的 AI 代理的证据引导恢复）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2610.41453\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2610.41453\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTool timeouts can leave AI agents facing ambiguous tool outcomes and partial execution: an action may have failed, committed or remained in flight while other workflow steps have already completed. We formulate evidence-guided task recovery over approved obligations, provider capabilities and states compatible with public evidence. A shared admissibility check handles key expiry, authorization timing, dependencies and residual effects; a terminal certificate separates actual goal satisfaction from publicly supported safe completion. The known-model implementation combines standard observation-contingent planning with a separately implemented effect-history adjudicator. In a finite study of 37 assignments, planning and three active controls each certify 28 completions; four saved synthetic fee units incur additional computation. A preregistered assignment-held-out comparison then evaluates planning advice against evidence prompting with two local model bundles. Across 58 paired units in 19 previously developed task families, advice certifies 30 completions versus 9, a 36.2-percentage-point difference (exact family sign-flip p=0.0078), using 272 proposals versus 399. All 116 trajectories pass independent replay. Both models exhibit a positive completion difference. The comparison measures the evaluated advice interface under a common shield; search-versus-rule advice requires a separate matched comparison. Unknown and handoff outcomes remain explicit, with guarantees tied to the declared provider capabilities rather than arbitrary third-party exactly-once execution.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e工具超时可能使 AI 代理面临模糊的工具结果和部分执行：一个动作可能已经失败、已提交或仍在运行中，而其他工作流步骤已经完成。我们在批准的义务、提供者能力和与公共证据兼容的状态之上制定了证据引导的任务恢复。共享的可接受性检查处理密钥过期、授权时机、依赖关系和残余效应；终端证书将实际目标满足与公共支持的安全完成分开。已知模型实现将标准的观察条件规划与单独实现的效果历史裁决器相结合。在对 37 个任务的有限研究中，规划和三个主动控制各自认证了 28 个完成；四个保存的合成费用单位产生了额外的计算。然后，一项预注册的保留任务比较评估了规划建议与两个本地模型包的证据提示。在 19 个先前开发的任务家族中的 58 个配对单元中，建议认证了 30 个完成，而证据提示为 9 个，相差 36.2 个百分点（精确家族符号翻转 p=0.0078），使用了 272 个提案对 399 个。所有 116 条轨迹都通过了独立重放。两个模型都表现出正向的完成差异。该比较测量了公共屏蔽下的评估建议接口；搜索与建议规则的建议需要单独的匹配比较。未知和交接结果保持明确，保证与声明的提供者能力挂钩，而不是任意的第三方精确一次执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决 AI 代理在工具超时导致模糊结果和部分执行时的任务恢复问题，提出证据引导的任务恢复机制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出基于公共证据、批准义务和提供者能力的证据引导任务恢复框架，包含共享可接受性检查和终端证书；在 37 个任务的有限研究中实现 28 个完成认证；在 58 个配对单元的预注册比较中，规划建议比证据提示多认证 21 个完成（36.2% 差异，p=0.0078），且所有 116 条轨迹通过独立重放。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该研究通过形式化证据引导的恢复机制，有效处理了工具超时带来的模糊状态和部分执行问题，并通过严格的预注册实验验证了规划建议的有效性。局限性方面，摘要未提供该机制在更大规模任务或更复杂工具依赖网络中的扩展性测试结果，也未详细说明合成费用单位的具体含义和计算开销，这些细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003eAI 代理系统 / 鲁棒性与任务恢复\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. TurtLES: A Large-Scale Benchmark for Turbulent 3D Neural PDE Surrogates（TurtLES：用于湍流3D神经偏微分方程代理模型的大规模基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.09567\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.09567\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMachine-learning surrogates are increasingly used to accelerate computational fluid dynamics, yet progress is limited by the lack of benchmarks capturing realistic, time-dependent turbulent flows. We introduce TurtLES, a 14 TB dataset of 3D turbulent cylinder wakes in the shear-layer transition regime, computed via high-fidelity implicit large-eddy simulations. The dataset contains 400 trajectories of 400 time steps each, with 3-11 million points per frame, spanning variations in geometry, Reynolds number, and angle of attack. Unlike existing datasets, TurtLES combines (i) physically realistic turbulence with an active energy cascade driven by vortex stretching, (ii) dense irregular meshes, and (iii) long-horizon temporal dynamics. We benchmark state-of-the-art neural operators on autoregressive rollouts and identify key failure modes, including temporal instability, loss of small-scale energy, and challenges in learning on large irregular domains. TurtLES provides a new benchmark for evaluating surrogate models on 3D turbulent wakes at industrially relevant mesh resolution.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器学习代理模型正被越来越多地用于加速计算流体动力学，但由于缺乏捕捉真实的、随时间变化的湍流的基准测试，进展受到限制。我们引入了TurtLES，这是一个14 TB的数据集，包含剪切层过渡状态下3D湍流圆柱尾流，通过高保真隐式大涡模拟计算得出。该数据集包含400条轨迹，每条400个时间步，每帧有300万至1100万个点，涵盖了几何形状、雷诺数和攻角的变化。与现有数据集不同，TurtLES结合了（i）由涡旋拉伸驱动的主动能量级联的物理真实湍流，（ii）密集的非结构化网格，以及（iii）长时域时间动态。我们在自回归展开上对最先进的神经算子进行了基准测试，并确定了关键的失败模式，包括时间不稳定性、小尺度能量损失以及在大型非结构化域上学习的挑战。TurtLES为在工业相关网格分辨率下评估3D湍流尾流的代理模型提供了一个新的基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和基准测试用于加速计算流体动力学的机器学习代理模型在3D湍流尾流上的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入了TurtLES，一个14 TB的3D湍流圆柱尾流数据集，包含400条轨迹，每条400个时间步，每帧300万至1100万个点；结合了物理真实湍流、密集非结构化网格和长时域动态；识别了神经算子在自回归展开中的关键失败模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有基准测试缺乏真实时间相关湍流的局限，并提出了TurtLES数据集来解决这一问题。分析表明，该数据集在规模（14 TB）、网格类型（密集非结构化）和物理特性（主动能量级联）上具有优势。局限性方面，摘要提到了神经算子存在时间不稳定性和小尺度能量损失等失败模式，但未提供具体的改进方法或解决这些局限的方案。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算流体动力学与机器学习代理模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. Structured Confidence Perturbation via Fisher Geometry for Adversarial Training（通过Fisher几何进行结构化置信度扰动以用于对抗训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14046\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14046\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAdversarial training is often plagued by \u0026quot;pseudo-attacks\u0026quot;, perturbations that significantly increase the loss value but fail to truly alter the model\u0026#x27;s confidence structure. To address this, we propose two complementary approaches to directly attack and defend against confidence structure deformation. First, building upon the traditional loss maximization perspective, we introduce a hybrid objective that integrates cross-entropy and KL divergence, encouraging adversarial examples to simultaneously disrupt prediction accuracy and distribution consistency. Second, we geometrically reconstruct adversarial training by generating perturbations that maximize the distribution distance on the confidence manifold. Theoretical analysis shows that the optimal perturbation direction aligns with the principal eigenvectors of the Fisher information matrix. We also propose an efficient algorithm to avoid high-dimensional matrix computations. Experiments on multiple datasets and model architectures demonstrate that our method outperforms existing methods in adversarial robustness and robust transferability, particularly excelling in structural perturbations within high-confidence regions.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e对抗训练常常受到“伪攻击”的困扰，这些扰动显著增加了损失值，但未能真正改变模型的置信度结构。为了解决这个问题，我们提出了两种互补的方法，直接攻击和防御置信度结构变形。首先，在传统的损失最大化视角的基础上，我们引入了一个结合交叉熵和KL散度的混合目标，鼓励对抗样本同时破坏预测准确性和分布一致性。其次，我们通过生成在置信度流形上最大化分布距离的扰动，从几何上重构了对抗训练。理论分析表明，最优扰动方向与Fisher信息矩阵的主特征向量对齐。我们还提出了一种高效算法来避免高维矩阵计算。在多个数据集和模型架构上的实验表明，我们的方法在对抗鲁棒性和鲁棒可迁移性方面优于现有方法，特别是在高置信度区域内的结构扰动方面表现优异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决对抗训练中“伪攻击”导致模型置信度结构未被真正改变的问题，提出直接攻击和防御置信度结构变形的方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出结合交叉熵和KL散度的混合目标以同时破坏预测准确性和分布一致性；通过几何重构对抗训练，使最优扰动方向与Fisher信息矩阵的主特征向量对齐；提出避免高维矩阵计算的高效算法；在高置信度区域的结构扰动中表现出优异的对抗鲁棒性和可迁移性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了对抗训练中“伪攻击”的局限性，即扰动未能改变置信度结构。提出的方法通过混合目标和Fisher几何重构来解决此问题，并在多个数据集和模型架构上验证了有效性。局限性方面，摘要未提供具体的实验数字、数据集名称或模型架构细节，也未提及该方法在计算成本或特定场景下的局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与机器学习鲁棒性\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Do Multimodal Models Decide Consistently on Equivalent Optical Spectra?（多模态模型对等效光谱的决策是否一致？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.00428\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.00428\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA spectrum can be given to a model as a table in nanometers or as a plot in photon energy, and the decision should not depend on which one it sees. When the data needed for an answer are missing, the model should say so. We test representation invariance and abstention on measured optical spectra of silicon metasurfaces (MOCLIP) and gold nanoparticles, with labels computed from the data. Each spectrum is shown as four tables (nm, μm, scientific notation, eV) and two plots (nm, eV), and partial spectra remove data inside or outside the queried range. We evaluate the decision models d3-nano and Jev 1.13, three GPT-6 Luna configurations and the Qwen3.5-2B base model. Changing only the representation moves accuracy by up to 41 percentage points within one model, mostly on photon-energy tables and plots. With the same evidence, asking in photon energy instead of wavelength helps some model-view pairs by 16-50 points and hurts others by up to 25. When the relevant extremum is removed, unadapted models rarely answer \u0026quot;undetermined\u0026quot;. LoRA fine-tuning of d3-nano improves comparisons on the trained table formats, but much of its gain on unanswerable questions comes from a shortcut: it abstains whenever the input is truncated. Training with answerable truncations avoids the shortcut in all six seeds, with a 90-100 point gap between abstention after inside and outside cuts on held-out structures; with the same amount of extra original-task data, five of six seeds keep the shortcut. On gold spectra the two training sets perform similarly. Multimodal language models used for scientific decisions should be tested on equivalent representations and on missing evidence, not only on average accuracy. We release the tasks, per-response results and analysis code.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e光谱可以作为纳米单位的表格或光子能量单位的图表提供给模型，决策不应取决于它看到的是哪一种。当回答所需的数据缺失时，模型应该说明这一点。我们在硅超表面（MOCLIP）和金纳米颗粒的测量光谱上测试了表示不变性和弃权行为，标签由数据计算得出。每个光谱显示为四种表格（nm、μm、科学记数法、eV）和两种图表（nm、eV），部分光谱移除了查询范围内或范围外的数据。我们评估了决策模型d3-nano和Jev 1.13、三种GPT-6 Luna配置以及Qwen3.5-2B基础模型。仅改变表示方式就会使同一模型内的准确率变动高达41个百分点，主要是在光子能量表格和图表上。在相同证据下，用光子能量代替波长进行提问对某些模型-视图组合有帮助，提升16-50分，但对其他组合则损害高达25分。当相关极值被移除时，未适应的模型很少回答“未确定”。对d3-nano进行LoRA微调改善了在训练表格格式上的比较，但其在不可回答问题上的大部分收益来自一个捷径：只要输入被截断它就弃权。使用可回答的截断进行训练在所有六个种子中避免了该捷径，在保留结构上内部和外部切割后的弃权率之间存在90-100点的差距；在相同数量的额外原始任务数据下，六个种子中有五个保留了该捷径。在金光谱上，两个训练集表现相似。用于科学决策的多模态语言模型应在等效表示和缺失证据上进行测试，而不仅仅是平均准确率。我们发布了任务、逐响应结果和分析代码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e测试多模态语言模型
