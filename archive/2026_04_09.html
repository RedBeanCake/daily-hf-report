- **研究任务**: 智能体强化学习（Agentic RL）中的长程推理稳定性。
- **核心亮点**: 揭示了智能体在复杂 RL 任务中出现的“推理崩溃”现象，并提出缓解方案。
- **深度解析**: 论文分析了智能体在多步决策中，随着轨迹变长，推理逻辑逐渐偏离目标的问题。通过引入一致性约束和中间状态验证机制，防止推理链在 RL 更新过程中发生退化，提升了长任务成功率。

### 2. Think in Strokes, Not Pixels: Process-Driven Image Generation via Interleaved Reasoning (思考笔触而非像素：通过交错推理实现过程驱动的图像生成)
- **社区热度**: `👍 37 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04746)
- **研究任务**: 可控图像生成。
- **核心亮点**: 将生成过程从像素预测改为笔触序列预测，中间穿插推理步骤。
- **深度解析**: 模型不直接生成像素，而是生成矢量笔触参数。在生成每一步笔触前，模型先进行文本推理，决定下一笔的位置和样式。这种交错机制让生成过程更像人类绘画，显著提升了结构可控性和编辑性。
- **领域归类**: [计算机视觉] [生成模型] [可控生成]
---

### 3. MARS: Enabling Autoregressive Models Multi-Token Generation (MARS：实现自回归模型的多 Token 生成)

- **深度解析**: 通过修改注意力掩码和引入预测头，模型在一次前向传播中预测后续多个 Token。配合置信度校验机制，确保生成的多 Token 序列合法。在保持 perplexity 不变的情况下，显著降低了推理延迟。
- **领域归类**: [大语言模型] [推理加速] [自回归模型]
