### 1. RAGEN-2: Reasoning Collapse in Agentic RL (RAGEN-2：代理强化学习中的推理崩溃)
- **社区热度**: `👍 38 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.06268)
- **研究任务**: 探究智能体在强化学习中因多步推理导致的性能退化现象（推理崩溃），并提出缓解方法。
- **核心亮点**: 发现复杂推理路径会引发状态空间膨胀，导致策略退化，通过引入轻量级记忆约束机制有效抑制崩溃。
- **深度解析**: 论文分析了代理在长序列决策任务中出现的“推理崩溃”——即随着推理步数增加，模型逐渐失去对目标的追踪能力。作者提出在策略网络中加入可学习的记忆门控模块，限制每一步的上下文信息容量，防止信息过载。实验表明，在多个复杂推理任务（如数学求解、规划）上，该方法使成功率提升15%-22%，且训练稳定性显著增强。
- **领域归类**: 强化学习 / 智能体系统 / 推理建模

### 2. Think in Strokes, Not Pixels: Process-Driven Image Generation via Interleaved Reasoning (以笔画思考，而非像素：通过交错推理实现过程驱动的图像生成)
- **社区热度**: `👍 35 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04746)
- **研究任务**: 提升图像生成过程中对结构和语义逻辑的控制能力，解决传统扩散模型依赖像素级优化的问题。
- **核心亮点**: 将图像生成拆解为“草图生成—细节细化”的交替过程，利用推理链引导生成顺序，提升可控性与一致性。
- **深度解析**: 作者设计了一个双阶段生成框架：第一阶段生成粗略笔画草图（stroke-level），第二阶段基于草图逐步添加纹理与细节。两个阶段之间通过注意力机制进行跨阶段信息传递，并引入显式推理节点（如“先画轮廓，再填充颜色”）作为中间指令。在文本到图像生成任务中，该方法在结构准确性（FID↓18%，LPIPS↓21%）和用户满意度（人工评分↑27%）上优于主流扩散模型。
- **领域归类**: 图像生成 / 多模态生成 / 控制生成

### 3. MARS: Enabling Autoregressive Models Multi-Token Generation (MARS：支持自回归模型多标记生成)
- **社区热度**: `👍 16 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.07023)
- **研究任务**: 解决自回归语言模型在单次前向传播中无法生成多个连续标记的问题，提升生成效率。
- **核心亮点**: 提出一种基于动态采样窗口的并行生成机制，在不改变模型结构的前提下实现多标记并行输出。
- **深度解析**: 传统自回归模型每次只能生成一个词，依赖循环调用。本文提出 MARS 框架，在每次推理时预测未来若干个 token 的分布，并通过滑动窗口方式选择最可能的序列片段进行批量生成。关键在于设计了一种基于置信度的截断策略，避免错误传播。实测显示，在保持生成质量不变的前提下，生成速度提升 2.3 倍，尤其在长文本生成场景下优势明显。
- **领域归类**: 语言模型 / 生成加速 / 推理优化

### 4. INSPATIO-WORLD: A Real-Time 4D World Simulator via Spatiotemporal Autoregressive Modeling (INSPATIO-WORLD：基于时空自回归建模的实时四维世界模拟器)

- **核心亮点**: 采用时空联合自回归建模，实现高保真、低延迟的动态场景演化。
- **深度解析**: 该工作将三维空间划分为网格单元，每个单元的状态（如物体位置、光照）随时间演化。使用一个统一的自回归模型对时空序列建模，输入当前帧及历史状态，预测下一时刻全场景状态。通过分块处理与缓存机制，实现 30 FPS 的实时渲染能力。在自动驾驶仿真基准中，其轨迹预测误差比现有方法降低 30%，且支持复杂交互行为（如车辆变道、行人避让）。
- **领域归类**: 世界模型 / 仿真系统 / 动态环境建模

- **深度解析**: 传统深度压缩自编码器受限于固定大小的码本，难以表达复杂特征。本文引入可扩展的令牌池机制，在训练中动态调整可用令牌数量，并通过聚类中心更新策略优化分配。实验显示，在图像压缩任务中，该方法在同等比特率下，峰值信噪比（PSNR）提升 1.8–3.2 dB，且支持更灵活的压缩比调节。

### 7. FP4 Explore, BF16 Train: Diffusion Reinforcement Learning via Efficient Rollout Scaling (FP4探索，BF16训练：通过高效滚动扩增实现扩散强化学习)

- **核心亮点**: 在探索阶段使用极低精度（FP4）进行快速采样，训练阶段切换至高精度（BF16），实现成本与性能平衡。
- **深度解析**: 扩散强化学习需大量环境模拟，计算成本高。本文提出分阶段精度策略：探索阶段使用 4 位浮点（FP4）生成动作序列，大幅减少内存占用与计算量；训练阶段则用 16 位浮点（BF16）恢复精度。通过梯度补偿机制弥补精度损失。在多个连续控制任务中，该方案使训练时间缩短 40%，能耗下降 55%，且最终策略性能仅下降 2%。
- **领域归类**: 强化学习 / 训练优化 / 精度管理

### 11. Beyond Hard Negatives: The Importance of Score Distribution in Knowledge Distillation for Dense Retrieval (超越硬负样本：密集检索中知识蒸馏的得分分布重要性)
- **社区热度**: `👍 3 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04734)
- **研究任务**: 改进密集检索场景下的知识蒸馏方法，提升学生模型在真实查询上的泛化能力。
- **核心亮点**: 提出关注得分分布而非仅依赖硬负样本，显著提升蒸馏效果。
- **深度解析**: 传统知识蒸馏只用最难的负样本（hard negatives）来训练学生模型，忽略了整体得分分布的信息。本文发现，学生模型对正负样本之间的得分差距敏感，若蒸馏时未保留原始教师模型的得分分布特性（如分值范围、相对排序），会导致学生模型在实际检索中表现下降。作者引入基于得分分布匹配的目标函数（score distribution matching），让学生模型不仅学“对错”，还学“多大概率是对的”。实验表明，在MS MARCO、TREC-COVID等数据集上，该方法比标准蒸馏提升平均P@10 2.5%~4.1%。
- **领域归类**: 信息检索 / 知识蒸馏 / 深度学习优化

### 16. DeonticBench: A Benchmark for Reasoning over Rules (道义逻辑基准：规则推理评测集)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04443)
