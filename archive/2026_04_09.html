### 1. RAGEN-2: Reasoning Collapse in Agentic RL (RAGEN-2：代理强化学习中的推理崩溃)
- **社区热度**: `👍 37 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.06268)
- **研究任务**: 探究智能体在强化学习中因长期推理导致的性能退化问题（即“推理崩溃”）
- **核心亮点**: 发现并量化了代理在多步推理中逐渐丢失目标导向能力的现象，提出可检测与缓解该问题的机制。
- **深度解析**: 作者通过构建一个基于符号推理的代理框架，在复杂任务中观察到随着推理深度增加，智能体开始产生无关或自相矛盾的中间步骤，最终偏离正确路径。他们设计了一个“推理一致性评分器”，用于实时监控推理链的质量，并引入轻量级回溯修正机制，在发现异常时主动重置推理状态。实验表明，该方法在数学推理和程序合成任务上将成功率提升约15%-20%。
- **领域归类**: 强化学习、智能体系统、推理建模

### 2. Think in Strokes, Not Pixels: Process-Driven Image Generation via Interleaved Reasoning (以笔画思考，而非像素：通过交错推理驱动图像生成)
- **社区热度**: `👍 34 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04746)
- **研究任务**: 提升图像生成模型对生成过程的可控性与语义一致性
- **核心亮点**: 将图像生成拆解为“草图→细节→风格”的分阶段推理流程，用交错式逻辑控制生成顺序。
- **深度解析**: 传统扩散模型直接从噪声生成像素，缺乏过程引导。本文提出一种结构化生成范式：先生成粗略轮廓（笔画），再逐步注入局部细节与纹理，最后统一风格特征。整个过程由一个轻量级控制器协调，每一步输出作为下一步输入，并通过跨阶段注意力确保上下文连贯性。在文本到图像生成任务中，该方法在用户调研中显著提高对生成结果的可控性和自然度评分，尤其在复杂构图场景下优于Stable Diffusion v3。
- **领域归类**: 图像生成、生成模型、可控生成

### 3. MARS: Enabling Autoregressive Models Multi-Token Generation (MARS：支持自回归模型多标记生成)
- **社区热度**: `👍 16 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.07023)
- **研究任务**: 解决自回归语言模型在一次前向传播中只能生成单个词元的效率瓶颈
- **核心亮点**: 提出一种基于动态分组的并行生成机制，使模型可在单次推理中输出多个词元。
- **深度解析**: 原有自回归模型每次只能预测下一个词元，无法利用并行计算优势。本文设计MARS框架，通过在生成过程中动态识别可并行处理的词元组合（如名词短语、动词结构），将其打包成“生成单元”，并使用条件掩码控制依赖关系。该方法不改变模型结构，仅需在解码器端添加一个轻量级调度模块。实测显示，在保持生成质量不变的前提下，推理速度提升2.3倍，适用于长文本生成与低延迟应用。
- **领域归类**: 自回归模型、生成效率、序列建模

- **深度解析**: 传统视频生成模型通常只处理时间维度，忽略空间动态一致性。本文提出一种四维网格表示法，将空间位置与时间帧联合编码为张量，采用自回归方式逐点预测未来状态。关键在于引入“局部因果约束”机制，确保每个体素的变化仅依赖于其邻域历史信息，从而保证物理合理性。在自动驾驶仿真测试中，该模型能在毫秒级完成一帧预测，且运动轨迹连续性优于现有方法，适合用于训练机器人感知与决策模块。

### 6. TC-AE: Unlocking Token Capacity for Deep Compression Autoencoders (TC-AE：释放深度压缩自编码器的词元容量)

- **核心亮点**: 通过重构词元分布结构，使压缩后的模型仍能保留原始数据的关键语义信息。
- **深度解析**: 传统深度压缩方法在降低参数量时会损失大量细节。本文提出一种“词元容量增强”策略：在训练阶段引入一个辅助的词元池，允许模型在压缩后仍可“借用”部分未被完全丢弃的词元表示。具体做法是通过门控机制动态分配词元使用率，并在重建损失中加入词元多样性惩罚项。实验显示，在相同压缩比下，该方法在图像重建任务中PSNR提升约3-4dB，尤其在高压缩场景（如10:1）下表现更优。
- **领域归类**: 模型压缩、自编码器、低比特推理

### 7. FP4 Explore, BF16 Train: Diffusion Reinforcement Learning via Efficient Rollout Scaling (FP4探索，BF16训练：通过高效采样扩展实现扩散强化学习)

- **核心亮点**: 在探索阶段使用极低精度（FP4）进行轨迹采样，训练阶段切换至高精度（BF16），实现效率与稳定性的平衡。
- **深度解析**: 扩散强化学习需要大量采样才能获得有效奖励信号，但全精度运行开销巨大。本文提出混合精度策略：探索阶段使用4位浮点（FP4）进行前向传播，大幅减少内存占用和计算延迟；训练阶段则切换至半精度（BF16）以维持梯度精度。同时引入误差补偿机制，对低精度采样结果做偏差校正。在Atari和MuJoCo任务上，该方法使整体训练耗时下降40%，且最终性能与全精度基线相当。
- **领域归类**: 强化学习、扩散模型、高效训练

### 18. AgentGL: Towards Agentic Graph Learning with LLMs via Reinforcement Learning (基于强化学习的代理式图学习)

### 19. The Depth Ceiling: On the Limits of Large Language Models in Discovering Latent Planning (深度天花板：大语言模型在发现潜在规划中的局限性)

- **深度解析**: 在自定义的 multi-step reasoning 任务中，设置不同难度层级的规划链。结果显示，即使在强模型（如 GPT-4）上，当路径长度超过 8 步时，正确率从 90% 降至不足 30%。作者认为这是由于注意力机制的上下文窗口限制和推理过程中的累积误差导致。
- **领域归类**: 大模型推理 / 规划能力 / 可靠性分析

### 20. A Frame is Worth One Token: Efficient Generative World Modeling with Delta Tokens (一帧值一个令牌：基于增量令牌的高效生成世界建模)
- **社区热度**: `👍 1 Upvote`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04913)
- **研究任务**: 提高生成式世界模型（如视频预测、环境演化）的生成效率与压缩比。
- **核心亮点**: 使用“差分令牌”（delta token）替代完整帧编码，大幅减少生成所需参数量。
- **深度解析**: 传统方法对每一帧独立编码，而本方法只记录相邻帧之间的变化（如运动区域、颜色偏移），用少量 delta token 表示差异。解码时通过叠加恢复原始帧。在 YouTube-VIS 等数据集上，同等质量下生成速度提升 2.5 倍，存储占用减少 60%。
- **领域归类**: 生成建模 / 视频预测 / 高效推理

### 24. A Systematic Study of Cross-Modal Typographic Attacks on Audio-Visual Reasoning (跨模态字体攻击对音视频推理系统的系统性研究)

- **研究任务**: 分析多模态模型在面对视觉文字干扰时的脆弱性，尤其是字体变化对音频-视觉联合理解的影响。
- **核心亮点**: 首次系统性揭示字体风格变化可诱导多模态模型产生错误推理，暴露模型对视觉符号的过度依赖。
- **深度解析**: 作者构建了一套可控的跨模态攻击框架，将目标文字以不同字体样式（手写体、艺术字、模糊字体）叠加在视频画面中，同时保留原始语音内容。发现当文字字体与语义不一致时，多个主流 AV 模型（如 CLIP、BLIP、Flamingo）出现误判率上升 20%-40%。例如，视频中说“打开灯”，但屏幕上显示“关掉灯”（用夸张字体），模型仍倾向于相信视觉文本。这说明当前模型缺乏对跨模态信息的一致性判断能力。
- **领域归类**: 多模态安全 / 对抗攻击 / 模型鲁棒性 / 人机交互

- **深度解析**: 传统等变网络强制所有层满足特定变换规则（如旋转不变），限制了表达能力。本文提出“软等变”机制，通过可学习参数调节每层对变换的敏感程度，同时提供误差上界分析（即等变性偏差不超过某个值）。实验显示，在图像分类和点云分割任务中，该方法在保持一定等变性的同时，性能优于固定等变网络，且对噪声和扰动更具鲁棒性。
- **领域归类**: 深度学习理论 / 对称性建模 / 几何深度学习 / 可控表示学习
