- **社区热度**: `👍 175 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.30611)
- **研究任务**: 科学图表生成与编辑
- **核心亮点**: 用多智能体协作实现图表的可编辑生成，而非一次性黑盒输出。
- **深度解析**: 传统方法生成图表后很难修改局部。这篇论文把任务拆给多个 Agent，分别负责布局、绘图、样式和逻辑检查。改动在于引入了编辑接口，用户修改指令后，系统只更新受影响的模块，不用重绘整图。效果上大幅降低了修改成本，生成的图表结构更清晰，符合科学出版规范。
- **领域归类**: [Multimodal] [Agent] [Scientific Computing]

- **深度解析**: 主要问题是存不下那么多 Adapter。方案是共享基座参数，只存储极小的个性化增量参数，并优化了加载机制。改动在于设计了一种分层索引结构，让推理时能动态切换不同用户的 Adapter。效果是在显存占用几乎不变的情况下，支持了大规模个性化部署。
- **领域归类**: [Efficiency] [PEFT] [LLM]
