    <h1>前沿科研情报 - 2026-08-26</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Annotations as Rollouts: Efficient and Scalable Reinforcement Learning for Video MLLMs (将标注作为轨迹：视频多模态大模型的高效且可扩展的强化学习)\n- **社区热度**: `👍 75 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20492)\n- **研究任务**: 解决视频多模态大模型（Video MLLMs）在大型多任务数据集上进行强化学习后训练时，面临的样本效率低和可扩展性差的问题。\n- **核心亮点**: 提出 OraRL 方法，将数据标注不仅用于评分，还作为“神谕轨迹（oracle rollout）”直接作为正优化目标参与策略更新。提出解耦优势估计器以解决“优势反转”问题，并采用符号平衡剪枝大幅提升训练效率。\n- **深度解析**: 现有强化学习方法在生成思维链（CoT）时采样效率极低。OraRL 将标注直接引入策略组，但高奖励标注会抬高组基线，导致原本正向的优势变为负向（即“优势反转”）。为此，OraRL 使用无神谕的策略轨迹确定基线，利用神谕与策略的差距来调节方向增益和分离的神谕优势。结合符号平衡剪枝（仅保留神谕和最强轨迹），其步时间仅为 SFT 的 2.2 倍，远低于带 CoT 的 GRPO（4.9 倍）。模型从 0.8B 扩展至 9B，提示词扩展至 100k。Video-ORA-9B 无 CoT 解码时间从 4,780 ms 降至 130 ms。在多项指标上超越先前最佳模型（如时间 mIoU 从 62.5 升至 66.0，VSI-Bench 得分 73.1，超越 GPT-5 的 55.0 和 Gemini-3-Pro 的 55.1）。\n- **领域归类**: [多模态大模型, 强化学习, 视频理解]\n---\n\n### 2. GigaBrain-0.7: Scaling Embodied Foundation Models to Emergent Capabilities with a Three-System Architecture (GigaBrain-0.7：通过三系统架构将具身基础模型扩展至涌现能力)\n- **社区热度**: `👍 72 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.15875)\n- **研究任务**: 提升视觉-语言-动作（VLA）模型在多样化机器人具身形态中的泛化能力，解决当前 VLA 系统在架构设计、大规模异构数据扩展以及跨任务和具身形态泛化方面的局限。\n- **核心亮点**: 提出 GigaBrain-0.7，采用三系统架构统一理解、预测和动作。将预训练数据扩展至超过 37,000 小时的异构具身数据，并引入单阶段对齐训练，联合优化视觉-语言理解和多具身动作生成。\n- **深度解析**: 相比前代 GigaBrain-0 系列和包括 π_{0.5} 在内的先前 SOTA 模型，GigaBrain-0.7 在基础零样本能力、语言条件指令跟随和后训练任务成功率上取得显著提升。在内部 Maker H01 平台和主流机器人具身形态上，展示了在家庭和工业场景中的强大任务适应性和完成能力。训练代码和预训练模型权重将开源。摘要未提供具体的实验数字和评估数据集名称。\n- **领域归类**: [具身智能, 视觉-语言-动作模型, 机器人控制]\n---\n\n### 3. WeMM-Embedding: WeChat Multi-Modal Embedding Technical Report (WeMM-Embedding：微信多模态嵌入技术报告)\n- **社区热度**: `👍 53 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24053)\n- **研究任务**: 构建通用多模态嵌入模型，将文本、图像、视频、视觉文档及任意交错的多模态输入表示在共享空间中，以支持检索、推荐、分类和智能体系统等应用。\n- **核心亮点**: 提出 WeMM-Embedding 模型家族（包含 2B、4B 和 9B 变体），支持灵活输出维度。采用两阶段训练：大规模多模态对齐阶段，以及使用精选数据、细粒度相关性监督和跨尺度知识迁移的精炼阶段。\n- **深度解析**: 2B 变体在 MMEB-v2 上超越了先前领先的 8B 开源基线，9B 变体取得了 80.6 的最新 SOTA 总分。在微信内部 26 项任务基准和 14 项在线 A/B 测试中表现出强大的实用性能。已大规模部署于微信视频号、公众号、朋友圈和电商等推荐和搜索应用中。模型权重和代码已开源。摘要未提供其他具体基准测试的数字或名称。\n- **领域归类**: [多模态嵌入, 信息检索, 推荐系统]\n---\n\n### 4. AutoSaddler: Automatic Harness Optimization with Durable Updates from Agent Execution Traces (AutoSaddler：基于智能体执行轨迹的持久更新自动优化执行外壳)\n- **社区热度**: `👍 47 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23041)\n- **研究任务**: 解决大语言模型智能体在长期任务中因局部失败累积导致整体任务失败的问题，自动化优化外部执行外壳（harness，包含提示、工具配置和控制逻辑），以提高智能体的鲁棒性。\n- **核心亮点**: 提出 AutoSaddler 框架，将 harness 改进转化为离线学习问题，利用小批量失败信号迭代更新 harness。结合失败轨迹诊断、将 harness 视为代码的结构化补丁生成，以及基于验证的更新选择。\n- **深度解析**: 在 GAIA2、SWE-Bench Pro 和 Terminal-Bench 2.0 上，AutoSaddler 相比基础 harness 分别提升了 9.0、9.6 和 10.0 个百分点。消融实验表明，有效的 harness 优化依赖于三个要素：深度调试而非浅层反思、针对性修改而非无约束编辑、泛化感知选择而非特定轨迹修复。摘要未提供具体的基线模型名称或更多数据集细节。\n- **领域归类**: [大语言模型智能体, 自动化优化, 长期任务规划]\n---\n\n### 5. On-Policy Self-Distillation in Diffusion Models (扩散模型中的在策略自蒸馏)\n- **社区热度**: `👍 45 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24646)\n- **研究任务**: 解决强化学习对齐扩散模型时，端点奖励无法指导中间去噪预测如何调整的问题，将图像级奖励指导转化为采样查询处干净输出预测的显式目标。\n- **核心亮点**: 提出 DiffusionOPSD（在策略自蒸馏框架）。冻结的行为策略生成轨迹并提供查询状态和锚点，奖励梯度在每个锚点周围构建有界的正负目标。可训练策略通过有限拟合将这些目标作为分离的监督进行拟合，然后通过指数移动平均更新刷新行为策略。\n- **深度解析**: 该方法允许分别测量目标构建和有限实现。在 SD 3.5-M 和步蒸馏的 Z-Image-Turbo 上，在两个骨干网络和十个评估器的 20 个奖励匹配设置中，有 19 个取得了最佳的最终保留分数。比最强竞争方法高出 44.0%，在 SD 3.5-M 和 Z-Image-Turbo 上相比 DiffusionNFT 分别减少了 40% 和 63% 的训练 GPU 小时。摘要未提供具体的评估器名称和奖励类型。\n- **领域归类**: [扩散模型, 强化学习, 模型对齐]\n---\n\n### 6. CyberFactory: Scaling Cyber Security Capabilities with Instances from the Wild (CyberFactory：利用野外实例扩展网络安全能力)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23181)\n- **研究任务**: 提升开源大语言模型在网络安全领域（如 PoC 生成、漏洞修补、网络安全问答）的能力，解决现有开源训练方案缺乏可扩展智能体数据和强领域先验的问题。\n- **核心亮点**: 提出 CyberFactory 统一开源框架，连接数据构建、轨迹合成和模型训练。将公共漏洞工件（包括野外的 CVE）转化为可执行和可验证的任务实例。使用可重用的漏洞分析技能指导教师模型进行源码检查、基于领域先验的问题解决和基于证据的验证。\n- **深度解析**: 训练出的模型 Aegis 内化了技能引导过程，推理时不需要该技能。在 CyberGym 上，Aegis 在一小时预算下达到 52.4% 的 Pass@1，比其 Qwen 3.5 基础模型提升 22.8 个百分点，并在相同脚手架下优于评估的通用骨干模型。摘要未提供其他具体基准测试名称或对比模型名称。\n- **领域归类**: [网络安全, 大语言模型智能体, 漏洞分析]\n---\n\n### 7. Recursive Experiential-Working Memory Evolution for Long-Horizon Agent Harnesses (面向长期智能体执行外壳的递归经验-工作记忆演化)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24876)\n- **研究任务**: 解决长期任务中递归自我改进（RSI）的困难，即不断增长的历史记录掩盖了任务状态并导致技能调用错位。\n- **核心亮点**: 提出 Recuris，一种用于长期智能体 harness 的递归经验-工作记忆架构。工作记忆跟踪任务进度并从经验记忆中指导技能选择。固定的元智能体将执行证据转化为对技能记忆的局部、验证门控更新，形成有界的递归记忆演化循环。\n- **深度解析**: 在四个长期基准和十个模型上，Recuris 在 37 个完成的模型-基准对中的 35 个中提高了任务成功率。在 tau-bench 上为 GPT-5.6 Sol 增加 17.8 分，为 Claude Opus 5 增加 15.6 分（使 Opus 5 达到 87.9%），在 SkillFlow 上为 Qwen3.6-27B/35B 增加 16.6/13.5 分。在最长任务上优势扩大至 32.2 分，常见长期失败减少高达 80%。代码已开源。\n- **领域归类**: [大语言模型智能体, 记忆机制, 长期任务规划]\n---\n\n### 8. Best Practice Critic Optimization (最佳实践评论家优化)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23566)\n- **研究任务**: 解决大语言模型强化学习中，基于评论家（critic）的训练方法通常不稳定的问题，提供一种可靠的替代基于组的相对优势估计（如 GRPO）的方案。\n- **核心亮点**: 提出 BPCO 方法，结合 DPPO、限制在奖励范围内的价值预测、蒙特卡洛价值目标、未归一化策略优势和长度自适应广义优势估计。由于评论家仅在训练时使用，BPCO 还可以用对策略隐藏的定义奖励的信息（如参考答案或评分标准）来调节评论家。\n- **深度解析**: 在 1.5B 到 30B-A3B MoE 的数学推理任务模型上，BPCO 一致地改进了强大的基于评论家的基线，并在每个提示采样一个响应时匹配或超过了基于组的基线。相同的方法也改善了基于评分标准奖励的学习。摘要未提供具体的数学推理数据集名称。\n- **领域归类**: [强化学习, 大语言模型对齐, 价值函数估计]\n---\n\n### 9. On-policy Distillation with Verifiable Reward (带有可验证奖励的在策略蒸馏)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24696)\n- **研究任务**: 结合可验证奖励强化学习（RLVR）和在策略蒸馏（OPD）以进行大语言模型后训练，解决 RLVR 反馈稀疏和 OPD 忽略轨迹正确性的问题，同时避免现有结合方法引入额外超参数和权衡。\n- **核心亮点**: 提出 OPDVR 方法，无缝结合 OPD 和 RLVR。重新表述采样 token OPD 的隐式奖励，应用 ReLU 门控机制确保正确轨迹获得非负奖励，错误轨迹获得非正奖励，从而将蒸馏信号与任务成功对齐，同时保留教师的分布指导。\n- **深度解析**: 该修改将采样 token OPD 转化为合适的 RLVR 方法，使其能与任何策略梯度算法（如 GRPO）结合。在六个推理基准上的实验表明，OPDVR 一致地优于标准 OPD。代码已开源。摘要未提供具体的推理基准名称和数字。\n- **领域归类**: [强化学习, 知识蒸馏, 大语言模型后训练]\n---\n\n### 10. From Seeing to Acting: Smart Glasses as First-Person Intelligence Platforms (从看到做：智能眼镜作为第一人称智能平台)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24877)\n- **研究任务**: 系统性研究智能眼镜作为第一人称智能平台，解决文献在设备、任务和基准方面碎片化的问题，构建一个统一的框架来评估和部署可靠、可纠正和可治理的感知-状态-交互-动作循环。\n- **核心亮点**: 首次通过统一框架系统研究智能眼镜。形式化了第一人称数据流和受限任务效用，沿八个可验证的硬件能力轴对设备进行表征，围绕七个相互依赖的基础能力组织文献，并引入了涵盖捕获、反应感知、上下文辅助、持久状态、受治理动作和具身耦合的 L0-L5 框架。\n- **深度解析**: 在九个应用场景中，将任务与数据集、系统、产品、利益相关者、失败后果和证据缺口联系起来。提出了九维部署框架、基于声明的评估协议，以及从受控测量到纵向现场验证和审计的证据阶梯。摘要未提供具体的实验结果或数字。\n- **领域归类**: [智能眼镜, 第一人称视觉, 具身智能, 综述]\n---\n\n### 11. Game2World Engine: Unlocking In-the-Wild Gameplay Videos for World Model Training (Game2World 引擎：释放野外游戏视频在世界模型训练中的潜力)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24680)\n- **研究任务**: 解决原始游戏视频与世界模型训练之间的干扰问题，通过自动化去除游戏用户界面（UI），提取纯净的游戏世界动态，从而为视频世界模型提供高质量的训练数据。\n- **核心亮点**: 提出了 GameUI-Taxonomy 和 G2WEngine 全栈框架，实现了游戏 UI 的自动化提取、合成与去除。构建了包含 96K 合成配对视频和 1,079 个野外片段的 Game2World 数据集。提出了无需掩码的 GameCleaner 模型，结合多模态语义理解与视频编辑能力，直接移除 UI 元素并保留底层场景与时间动态。\n- **深度解析**: 游戏视频是世界模型的理想数据源，但屏幕 UI 会引入特定游戏的偏差和无关动态。G2WEngine 能够从真实视频中提取可复用的 UI 资产，其资产库包含来自 1,010 个代表性游戏帧的 5,132 个已验证 UI 元素（涵盖 21 个分类）。GameCleaner 在合成视频上的平均 AAR 达到 95.36，超越最强时间掩码基线 57.3%；在野外视频上 AAR 达到 80.05，背景保留率达 99.8。控制实验表明，在去除 UI 的视频上训练的世界模型，其整体 VideoReward 比在含 UI 数据上训练的模型提升了 6.83%。\n- **领域归类**: [计算机视觉, 视频世界模型, 数据预处理]\n---\n\n### 12. Meta^n: Recursive Self-Improvement through Emergent Depth (Meta^n：通过涌现深度实现递归自我改进)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24735)\n- **研究任务**: 突破现有大语言模型（LLM）智能体自我改进系统在“元深度”（meta-depth）上的限制，实现更高层次、更稳定的递归自我优化过程。\n- **核心亮点**: 提出 Meta^n 框架，保持元操作（Ω）固定，并对其输入进行递归。该操作反复应用于自身的产物，读取求解器栈的轨迹和生成代码，将下一层写为战略预处理和可调用助手库。深度由收敛情况决定而非预先固定，并通过进化档案搜索层链。\n- **深度解析**: 现有的自我改进 LLM 智能体通常只优化答案而不优化产生答案的过程，且为了避免系统不稳定，其元深度通常被限制在两层左右。Meta^n 通过固定元操作并严格递增输入，确保每一层都能从比上一层更高的视角进行推理，且不会破坏系统稳定性。在 ARC-AGI-2 等旨在抵抗技能记忆化的基准测试中，Meta^n 是唯一得分超过零的系统。消融实验表明，递归带来的大部分增益来自于每一层传递给下一层的条件信息，且随着深度增加，系统会自然涌现出不同的层角色。\n- **领域归类**: [自然语言处理, LLM智能体, 自我改进/元学习]\n---\n\n### 13. LAION-BVD: A 10-Million-Hour Open Video Dataset for Multimodal Pre-training (LAION-BVD：用于多模态预训练的千万小时级开放视频数据集)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24845)\n- **研究任务**: 构建并释放一个超大规模开放视频数据集，旨在为视频、音频和图像等多模态学习提供前所未有的预训练数据规模。\n- **核心亮点**: 从 CommonCrawl 收集了 13 亿个特定平台的视频 URL，成功下载 8000 万个视频，总时长高达 1000 万小时。利用内容感知场景检测提取视频片段，并合成了视频和音频字幕。此外，探索了将场景变化的视频帧作为图像-文本数据的替代来源。\n- **深度解析**: LAION-BVD 极大地扩展了多模态视频数据的开放获取边界。在标准视频-文本和音频-文本基准测试中，基于该数据集训练的模型取得了极具竞争力的性能，且性能随着训练规模或模型规模的增加而稳定提升。提取的场景变化帧在视觉分布上显著不同于标准的网络图像语料库，基于这些帧训练的模型在图像-文本检索任务中表现强劲，证明了其作为多模态预训练数据的有效性和多样性。\n- **领域归类**: [多模态学习, 数据集, 视频/音频/图像预训练]\n---\n\n### 14. Length-Adaptive Decoding for Masked Diffusion Machine Translation (掩码扩散机器翻译的长度自适应解码)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.22274)\n- **研究任务**: 解决掩码扩散语言模型（dLLMs）在机器翻译任务中，固定画布解码必须预先选择目标长度从而直接影响覆盖率和冗余度的问题。\n- **核心亮点**: 提出 Entropy-Valley (EV)，一种无需训练的长度选择器。通过计算全掩码前向传播的平均预测熵来对候选目标画布进行评分，从而选择主干网络“最准备好填充”的画布长度。\n- **深度解析**: 现有的掩码扩散解码研究主要集中于 token 的解掩码顺序，而忽略了长度决策。EV 方法在 EntoZh、ZhtoEn 和 EntoDe 任务上，分别恢复了使用参考目标长度所带来的 COMET-22 增益的 64.9%、65.3% 和 33.0%。诊断表明，适合去噪的长度并不一定需要与参考长度完全匹配。与使用相同微调数据训练的 LLaMA-3-8B 自回归模型相比，EV 系统在 EntoZh 上表现持平，在 ZhtoEn 上处于领先。进一步的诊断表明，在掩码扩散机器翻译设定下，决定“如何提供目标长度”比决定“首先揭示哪些 token”更为重要。\n- **领域归类**: [自然语言处理, 机器翻译, 扩散模型]\n---\n\n### 15. DREAM Technical Report (DREAM 技术报告)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09408)\n- **研究任务**: 解决工业推荐系统中级联检索、排序和重排管道导致的信息碎片化、目标割裂以及对实时用户意图感知不足的问题。\n- **核心亮点**: 提出 DREAM（使用智能体方法开发推荐引擎），一种自主优化控制架构。它在现有管道之上增加了一个具备感知能力、可编排且可审计的策略层。核心包含三层意图引擎（融合设备信号为 L0/L1/L2 意图表示）和元引擎（使用 MetaModel 进行 M1 到 M3 的分层推理），并通过奖励双循环持续优化。\n- **深度解析**: DREAM 不替换现有管道模型，而是通过边缘-云触发链将意图引擎的报告量减少至约 8.7%。元引擎结合策略记忆进行意图总结、策略规划和参数转换，并通过统一出口分发参数且带有安全护栏。在淘宝首页信息流的大规模 A/B 测试中，仅重排控制就使 IPV 提升 2.06%，核心 IPV 提升 2.39%，GMV 提升 0.88%。将控制扩展到精排后，这些增益分别提升至 2.71%、3.06% 和 1.31%，同时 PV 一致提升超过 1%。这证明了智能体元控制在工业推荐中的可行性。\n- **领域归类**: [推荐系统, 工业应用, 智能体控制]\n---\n\n### 16. CAFE: Self-Improving Search Agents Need Co-Evolving Feedback (CAFE：自我改进的搜索智能体需要协同演化的反馈)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24794)\n- **研究任务**: 解决结果监督的搜索智能体无法有效定位中间错误并在错误复合前重定向轨迹的问题，提出一种搜索智能体与反馈批评家协同演化的框架。\n- **核心亮点**: 提出 CAFE（耦合智能体-反馈演化）框架，使用共享参数的模型在搜索智能体和批评家角色之间交替。在线强化学习期间使用比较反馈估计来塑造请求回报，离线阶段通过基于轨迹的偏好优化来学习反馈。\n- **深度解析**: 终端奖励无法定位中间错误，而将纠正反馈视为学习到的轨迹内干预会耦合智能体和批评家的角色。CAFE 从围绕基础智能体自身失败构建的轨迹中初始化反馈条件恢复。在七个智能体搜索基准测试中，CAFE 平均优于评估的基于 RL 的搜索智能体，在六个域外基准测试中保持了增益，并减少了答案级别的幻觉。单边消融实验表明，仅改进智能体或仅改进批评家最终都会遇到性能瓶颈，而交替更新两者则能持续提升性能，证明了自我改进的搜索智能体需要与其指导策略协同演化的反馈。\n- **领域归类**: [自然语言处理, 搜索智能体, 强化学习]\n---\n\n### 17. MoTE: Mixture of Task Experts for Multi-Task Video Understanding (MoTE：用于多任务视频理解的任务专家混合模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24763)\n- **研究任务**: 解决程序性视频-语言模型在处理动作识别、预测等异构任务时，密集 Transformer 解码器导致任务行为纠缠以及受控能力扩展困难的问题。\n- **核心亮点**: 提出 MoTE（任务专家混合模型），一种解码器架构。它将大语言模型的前馈网络转换为特定任务的专家，同时保持多模态主干共享。每个样本遵循一个样本级的任务路由，使得活跃的任务专家计算独立于存储的任务专家总数。\n- **深度解析**: 稀疏 MoE 解码器中基于 token 的学习路由与任务级的程序目标并不自然对齐。MoTE 通过将设计实例化为 VideoLLM-MoTE 并在五个 COIN 基准测试上进行评估。五专家模型每个样本激活约 20 亿 LLM 参数，取得了比近期 VideoLLM 基线更高的平均 top-1 准确率。在相同的专家拓扑下，它优于密集的全专家激活和学习稀疏路由控制，证明了任务结构化路由为多任务视频-语言学习提供了一种可解释且计算高效的解码器替代方案。\n- **领域归类**: [计算机视觉, 视频理解, 混合专家模型 (MoE)]\n---\n\n### 18. Latent Action as Intention Enables Efficient Future Imagination for World Action Models (潜在动作作为意图使世界动作模型的高效未来想象成为可能)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24882)\n- **研究任务**: 解决世界动作模型（WAMs）在测试时生成未来观察结果会带来巨大延迟的问题，同时在保持泛化能力的前提下实现高效的测试时未来想象。\n- **核心亮点**: 提出 LAWA 架构，使用紧凑的潜在动作作为未来意图的操作表示。通过增强的离散分词器和无动作预训练生成以操作为中心的码本目标，在推理时省略未来视频分支，从而无需生成未来观察即可实现高效想象。\n- **深度解析**: 虽然 Fast-WAM 去除了生成过程以提高效率，但其泛化能力较低，特别是在机器人演示稀缺和分布外场景中。LAWA 联合去噪锚定在码本目标上的连续潜在状态与可执行动作块。在 RoboCasa 上，LAWA 在少样本和全数据设置下的平均成功率分别达到 65.6% 和 80.8%，比匹配的 Fast-WAM 基线分别提高了 9.6 和 4.5 个百分点。同时，它保持了与 Joint-WAM 变体相当的性能水平，但推理延迟降低了 42.9%。在 LIBERO-Plus 的零样本鲁棒性和真实世界任务中也表现出竞争力，证明了保留紧凑潜在动作的未来想象能在性能、泛化和延迟之间取得有效平衡。\n- **领域归类**: [机器人学, 世界模型, 动作预测]\n---\n\n### 19. TorchMorph: CUDA-accelerated Morphological Transforms (TorchMorph：CUDA 加速的形态学变换)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24738)\n- **研究任务**: 解决 Python 生态系统中形态学变换参考实现（如 scipy.ndimage）仅限 CPU、单数组处理，导致无法在 GPU 训练循环中直接使用且需付出昂贵设备到主机往返代价的问题。\n- **核心亮点**: 提出 TorchMorph，一个轻量级 PyTorch 扩展。提供 22 个公共算子，涵盖二值/灰度形态学、精确/近似距离变换和熵正则化最优传输。所有算子均实现为融合 CUDA 内核，直接操作高达八个空间维度的 (B, C, Spatial...) CUDA 张量。\n- **深度解析**: TorchMorph 的 API 刻意镜像 scipy.ndimage 的参数（包括边界模式、结构元素原点等），使得现有管道只需更改导入即可无缝迁移。与单线程 CPU 参考相比，批量执行在灰度形态学上达到 scipy.ndimage 1.1e3 倍的吞吐量，在精确欧几里得距离变换上达到 350 倍，Sinkhorn 求解器比 POT 快 42 倍。二值和倒角算子精确重现了 SciPy 的对应结果，所有浮点值算子与 CPU 参考的绝对误差控制在 1.8e-6 以内，兼顾了极致的速度与精确度。\n- **领域归类**: [深度学习框架, 计算机视觉, CUDA 加速]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\n- **今日趋势**: 34,269 stars / 3,881 forks，今日新增 307 stars (Python)\n- **项目简介**: Anthropic 官方管理的高质量 Claude Code 插件目录。\n- **核心价值**: \n  - **项目用途**: 提供官方认证的 Claude Code 插件集合，规范和管理插件生态。\n  - **目标人群**: Claude Code 开发者及 Anthropic 生态用户。\n  - **技术核心**: Claude Code 插件目录管理与分发。\n  - **AI/大模型相关性**: 是（基于 Claude 大模型生态）。\n\n---\n\n### [K-Dense-AI/scientific-agent-skills](https://github.com/K-Dense-AI/scientific-agent-skills)\n- **今日趋势**: 34,575 stars / 3,353 forks，今日新增 130 stars (Python)\n- **项目简介**: 将任意 AI 代理转化为 AI 科学家的顶级科学领域代理技能库。\n- **核心价值**: \n  - **项目用途**: 提供 163 个即用型验证技能和 100 多个科学数据库，覆盖生物、化学、医学和药物发现等领域。\n  - **目标人群**: 全球科学家（17.5万+）及 AI 代理开发者。\n  - **技术核心**: AI 代理技能库、科学数据库集成，兼容 Cursor、Claude Code 等多种工具及开放代理技能标准。\n  - **AI/大模型相关性**: 是（专为 AI 代理和 AI 科学家设计）。\n\n---\n\n### [netbox-community/netbox](https://github.com/netbox-community/netbox)\n- **今日趋势**: 21,389 stars / 3,107 forks，今日新增 35 stars (Python)\n- **项目简介**: 为网络自动化提供权威真实数据源的开源基础设施管理工具。\n- **核心价值**: \n  - **项目用途**: 作为网络自动化的核心真实数据源（Source of Truth），并提供免费的 NetBox Cloud 体验。\n  - **目标人群**: 网络工程师、IT 基础设
