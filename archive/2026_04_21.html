### 1. Extending One-Step Image Generation from Class Labels to Text via Discriminative Text Representation (通过判别式文本表示将一步图像生成从类标签扩展到文本)
- **社区热度**: `👍 85 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.18168)
- **研究任务**: 文本到图像生成（一步蒸馏）
- **核心亮点**: 用判别式文本表示替代对比式编码，让一步生成模型能直接理解文本而非仅靠类别。
- **深度解析**: 传统一步生成模型（如蒸馏后的 Diffusion）多依赖类标签条件。这篇改了文本编码器，采用判别式表示让文本特征分布更匹配一步噪声预测器的需求，解决了文本条件在一步生成中对齐难的问题，无需多步迭代即可出图。
- **领域归类**: [AIGC, Diffusion Models, Distillation]
---

### 2. OneVL: One-Step Latent Reasoning and Planning with Vision-Language Explanation (OneVL：带视觉语言解释的一步潜在推理与规划)
- **社区热度**: `👍 65 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.18486)
- **研究任务**: 视觉语言推理与规划
- **核心亮点**: 将多步推理过程压缩至潜在空间一步完成，同时保留生成自然语言解释的能力。
- **深度解析**: 针对 VLM 自回归推理慢的问题，该方法不在 token 层面逐步生成推理链，而是在潜在空间（Latent Space）直接映射规划结果。模型结构上增加了投影头，既能输出决策也能输出解释文本，兼顾了推理速度和可解释性。
- **领域归类**: [Multimodal, Reasoning, Efficient AI]
---
