    <h1>前沿科研情报 - 2026-09-23</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. RRSI: Regularized Recursive Self-Improvement of Agent Harnesses (RRSI：智能体运行环境的正则化递归自我改进)\n- **社区热度**: `👍 144 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24972)\n- **研究任务**: 解决大语言模型智能体在运行环境（harness）自动化迭代优化过程中容易过拟合训练任务，导致在分布外基准测试上性能下降或消失的问题。\n- **核心亮点**: 提出RRSI方法，将正则化原则引入运行环境的自我改进中，通过限制演化候选的生成和选择，促使智能体学习可复用的机制而非特定于基准测试的机制或噪声。\n- **深度解析**: 提出者（proposer）使用时间退火预算限制候选可捆绑的编辑数量，并鼓励基于演化历史的未探索轨迹。选择器（selector）配备评论家（critic）和修剪器（pruner）：评论家筛选特定于基准的提议，修剪器移除太小、太贵或不再有用的更改。在8个基准测试上，RRSI在演化分布内提升高达14.1分，在5个分布外基准上提升高达4.7分，同时生成的运行环境比未正则化演化减少30%的策略token。关于具体的基座模型和详细的网络架构，摘要未提供。\n- **领域归类**: [Agent, LLM, 强化学习]\n---\n\n### 2. WorldCrafter: Consistent Video World Model with Implicit 3D-aware Memory (WorldCrafter：具有隐式3D感知记忆的一致性视频世界模型)\n- **社区热度**: `👍 109 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24984)\n- **研究任务**: 解决视频世界模型在长时间跨度和多视角下难以尊重先前观察（保持环境一致性）的问题。\n- **核心亮点**: 提出WorldCrafter，学习一种可查询相机的隐式3D感知记忆，通过将请求的视角作为多视角证据压缩到视频生成器有限token预算中的依据，实现长时间场景探索的一致性。\n- **深度解析**: 核心洞察是让请求的视角决定多视角证据如何被压缩。训练一个记忆编码器和位姿条件读取模块，在去噪前将历史观察整合到一组固定的目标视角特定token中，无需显式的基于深度的对应关系。结合该记忆、最近的时间上下文和少步蒸馏，WorldCrafter能够从单张输入图像或文本提示实现流式场景探索。在静态和动态场景上的实验表明，在保持分钟级探索视觉质量的同时，长时间一致性和相机控制准确性获得了显著提升。关于具体的评估指标数值和对比基线，摘要未提供。\n- **领域归类**: [视频生成, 世界模型, 3D视觉]\n---\n\n### 3. GameHorizon Suite: Multi-Horizon Data and Evaluation in Gameplay (GameHorizon Suite：游戏play中的多时间跨度数据与评估套件)\n- **社区热度**: `👍 107 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.25001)\n- **研究任务**: 解决现有游戏AI数据集和基准测试覆盖游戏范围窄、缺乏语言指令或依赖高方差在线推演的问题，提供衡量不同时间跨度下游戏能力的统一数据和评估套件。\n- **核心亮点**: 推出GameHorizon Suite，包含可扩展的自动多跨度指令标注流水线、首个包含时间对齐视频/动作/指令的大规模AAA游戏数据集，以及包含可复现离线和逐步在线测试的基准。\n- **深度解析**: GameHorizon-Data包含100名人类专家玩家收集的21款游戏共5000小时录像。GameHorizon-Bench的离线轨道使用数千个标准化问题进行可复现评估，在线轨道测试离线分数是否反映实际游戏能力并定位长跨度游戏中的失败步骤。基于该套件评估了47个模型，进行了超过100万次模型调用，揭示了任务难度的有意义层次和模型能力的显著差异。关于具体的模型表现排名和详细得分数字，摘要未提供。\n- **领域归类**: [游戏AI, 数据集与基准, 多模态]\n---\n\n### 4. Transferring the Intelligence of VLMs to Robotic Control (将视觉语言模型的智能迁移到机器人控制中)\n- **社区热度**: `👍 100 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.22966)\n- **研究任务**: 探索视觉语言模型（VLMs）的智能能否从数字世界泛化到物理世界用于机器人控制，解决数字到现实的差距问题。\n- **核心亮点**: 提出RoboDawn，一个符合人类直觉的接口，通过一组紧凑的离散平移、旋转和夹爪命令将机器人控制暴露给智能体VLM，结合上下文学习（ICL）方案，在无需特定任务机器人训练的情况下实现强大性能。\n- **深度解析**: RoboDawn接口让VLM在闭环中控制机器人（观察、推理、执行、适应）。ICL方案使用少量演示将VLM扎根于接口使用和任务解决策略。在RoboTwin 2.0 C2R上，零样本成功率53.2%，单样本提升至73.6%，超越基线π0.5（46.0%）。在RoboDojo上，零样本35.67%提升至单样本47.17%。该框架还迁移到真实世界机器人（Franka），执行篮子里的方块和方块堆叠任务。关于具体的VLM基座型号和详细的动作空间设计，摘要未提供。\n- **领域归类**: [机器人控制, 具身智能, VLM]\n---\n\n### 5. OmniEdu: Open Foundation Models for Learning and Teaching (OmniEdu：用于学习和教学的开放基础模型)\n- **社区热度**: `👍 64 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23088)\n- **研究任务**: 解决现有教育语言模型通常只关注解题或辅导，且训练数据混合按来源或任务组织而非按能力组织的问题，开发用于K-12学习和教学的开放基础模型。\n- **核心亮点**: 提出OmniEdu模型家族，其指令微调语料库结合100多种教育资源，围绕学科能力、课程基础、诊断推理和教学行动与脚手架四种能力进行组织，并设计了包含确定性清洗、语义审计等步骤的数据处理流水线。\n- **深度解析**: 数据处理流水线生成69,999个样本和1596万个监督响应token（包括60,951个教育特定样本）。微调了4B、9B和27B模型。OmniEdu-27B在K12-Bench上达到63.12% EM和76.69% F1，MathFish 85.89%，EDUMATH 86.95%，MathTutorBench Scaffold设置下78.74%，LongTutor教学平均分3.02。关于具体的预训练基座和详细的超参数设置，摘要未提供。\n- **领域归类**: [教育AI, LLM, 指令微调]\n---\n\n### 6. Document Retrieval-Aware Chunking (D-RAC): Universal Retrieval-Aware Ingestion of Enterprise Documents via PDF Normalization and Multimodal Markdown Conversion (文档检索感知分块：通过PDF归一化和多模态Markdown转换实现企业文档的通用检索感知摄取)\n- **社区热度**: `👍 48 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24220)\n- **研究任务**: 解决企业知识库RAG系统在处理PDF、Word、PPT和扫描件等异构文档时，基于规则的提取和OCR会破坏阅读顺序、扁平化表格并丢失标题层级，而完全智能体分块又成本高且易产生幻觉的问题。\n- **核心亮点**: 提出D-RAC框架，将任意输入文档归一化为PDF，然后通过单次多模态LLM调用将渲染页面转换为检索优化的Markdown（将表格重写为独立的散文陈述并保留标题层级），随后进行确定性解析和轻量级LLM分块规划。\n- **深度解析**: 在RAG-Multi-Corpus基准的236个文档、795页PDF子集上，D-RAC在72分钟内零错误转换并分块整个语料库，生成1748个检索就绪块。与前沿LLM的智能体分块相比，D-RAC将分块阶段输出token减少95.7%，分块成本降低77.8%（GPT-4.1定价）至85.6%（Gemini 2.5 Pro定价），分块时间减少75%。D-RAC可线性扩展至500页以上的文档。关于具体的多模态LLM型号和详细的解析算法，摘要未提供。\n- **领域归类**: [RAG, 数据处理, LLM应用]\n---\n\n### 7. VideoGen-Agent: Reinforcing Video Generation Agents (VideoGen-Agent：强化视频生成智能体)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24997)\n- **研究任务**: 解决视频生成模型在满足需要专业知识、特定身份、物理一致性或有序事件等复杂提示时表现挣扎的问题。\n- **核心亮点**: 提出VideoGen-Agent，一个通过多任务智能体强化学习训练的多模态智能体，能够使用外部工具进行视频生成，通过多轮交互协调增强、生成和验证工具。\n- **深度解析**: 在跨越6个任务的类别平衡数据集上训练共享策略。通过监督微调建立工具使用行为，再通过强化学习优化。引入类别感知混合奖励评估工具调用有效性、适当性和视频质量。提出VABench基准（600个提示）。在VABench上，VideoGen-Agent比基础文本到视频生成器提高19.1分（从56.5到75.6）。升级生成工具后分数升至86.1。人类评估者在84.3%的比较中偏好升级后的配置。关于具体的强化学习算法细节和基础视频生成模型，摘要未提供。\n- **领域归类**: [视频生成, Agent, 强化学习]\n---\n\n### 8. onPanda: Efficient Annotation of On-Policy Alignment Data for LLMs and Agents via Token-Level Correction (onPanda：通过Token级纠正高效标注LLM和智能体的在策略对齐数据)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24983)\n- **研究任务**: 解决大语言模型（LLM）和智能体对齐数据及轨迹标注效率低下的问题。\n- **核心亮点**: 提出onPanda交互工具，采用Token级纠正作为核心交互：标注者定位第一个不合适的Token并从候选中选择或自由编辑，系统截断后续内容并从纠正后的前缀继续生成，循环直至满意。\n- **深度解析**: 该机制让标注者以低成本精确引导模型输出，一项小型对照研究表明onPanda比手动后期编辑减少52%的中位标注时间。由于最终响应中绝大多数Token由模型自身生成，结果数据很大程度上保留了模型的采样分布，适合构建在策略SFT和偏好数据。记录的Token级纠正提供细粒度监督和自然配对的正负样本。还发布了Panda-CVL数据集和Token级纠正基准。关于具体的标注者人数和详细的用户研究设计，摘要未提供。\n- **领域归类**: [数据标注, 对齐, LLM]\n---\n\n### 9. Grounded Action Model: 3D Grounding as a Foundation for Robotics (Grounded动作模型：3D空间定位作为机器人基础模型的基础)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23863)\n- **研究任务**: 解决当前机器人基础模型（如VLA和WAM）的预训练骨干网络不直接需要度量接地（metric grounding），只能从机器人演示中隐式学习“哪些对象重要以及它们在哪”的问题。\n- **核心亮点**: 提出Grounded Action Models (GAMs)，一种以3D定位为基础构建的机器人基础模型新范式。GAM可以使用语言、点或边界框提示进行条件化，并转换为共享的以对象为中心的表示，捕获目标视觉特征和度量几何。\n- **深度解析**: 该表示通过多流Transformer与机器人状态历史混合以预测动作块。GAM可作为自主运行或高级规划器的低级控制器。在RoboTwin 2.0上，50个任务平均成功率55.3%（Spatial Forcing为52.0%），场景随机化下47.6%（Abot-M0为30.4%）。在LIBERO-PRO上，16个扰动设置平均成功率61%（π_{0.5}为53%）。在真实机器人上，双臂YAM在视觉偏移下保留17/20次成功（π_{0.5}为4/20），与Molmo2规划器组合在Franka上长跨度任务ID步骤完成率64.7%，OOD 49.8%。关于具体的Transformer层数和详细的3D特征提取网络，摘要未提供。\n- **领域归类**: [机器人控制, 具身智能, 3D视觉]\n---\n\n### 10. One to More, More to One: Category-Aware Iterative Expert Training for Software Engineering Agents (从一到多，从多到一：软件工程智能体的类别感知迭代专家训练)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23377)\n- **研究任务**: 解决仓库级软件工程（SWE）中不同任务类别在池化智能体强化学习中进展不均（某些类别提升伴随其他类别倒退）的问题。\n- **核心亮点**: 开发类别感知专家训练和策略集成框架。通过SWE Labeler组织训练池，使用同源类别专家交替进行长跨度Agentic-miniRL和“刷新-修复-扩展”（RRE），并通过标签路由的多教师在策略蒸馏（MOPD）将专家整合为一个可部署的学生模型。\n- **深度解析**: 初始类别特定RL后，专家交替进行RRE：更新策略刷新实例掌握度，重用其验证成功的轨迹进行修复SFT，并重新选择任务进行RL。MOPD使用ReLU门控奖励外推仅保留每个教师相对于参考的改进方向。最终MOPD策略在Pro-618上平均解决率58.04%，在SWE-bench Multilingual上59.00%，分别比基础模型提高5.39和2.78个百分点。关于具体的基础模型架构和详细的RL超参数，摘要未提供。\n- **领域归类**: [Agent, 软件工程, 强化学习]\n---\n\n### 11. Harness-Zero: Harness Distillation via Agent-as-Harness (Harness-Zero：通过智能体作为Harness实现Harness蒸馏)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24974)\n- **研究任务**: 智能体Harness蒸馏，即将在部署时依赖的、针对特定领域或实例优化的外部系统（Harness）的行为，通过训练转移到模型权重中，使模型在单一固定的目标Harness下也能获得性能提升。\n- **核心亮点**: 提出Harness-Zero框架，通过“智能体作为Harness（agent-as-harness）”机制，在目标Harness的动作空间中利用优化Harness指导的智能体纠正学生响应，将Harness指导转化为训练演示，从而在部署时移除专用Harness。\n- **深度解析**: 挑战在于两个Harness在动作空间和可用信息上存在差异。实验跨越知识工作、工具使用和科学领域（摘要未提供具体数据集名称）。结果显示：(1) 对于前沿LLM，agent-as-harness优于code-as-harness；(2) 移除专用Harness后，宏平均任务成功率从23.3%提升至44.3%，甚至超过保留Harness时的41.7%；(3) 在3个领域的28种模式中，平均恢复率达82.3%。摘要未提供更深层的网络架构等技术细节。\n- **领域归类**: [智能体系统, 模型蒸馏, 强化学习, 外部系统优化]\n---\n\n### 12. Deep Persona: A Psychologically Grounded Architecture and Evaluation Framework for Role-Playing Agents and Simulations (Deep Persona：一种基于心理学的角色扮演智能体与模拟架构及评估框架)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.22255)\n- **研究任务**: 构建高度逼真的角色扮演智能体，解决现有大语言模型（LLM）在长期交互中因依赖浅层角色描述而无法维持连贯角色行为的问题。\n- **核心亮点**: 提出Deep Persona，一个基于心理学的三层架构（将角色组织为可观察表达、潜在信念和核心动机驱动的层次），并引入一个无参考评估框架，使用心理学临床工具和对抗性压力测试来基准化对话自然度。\n- **深度解析**: 架构受“脚本确定性”和“有界能动性”原则约束，将模型限制为由结构化内部脚本引导的反应引擎。评估框架将对话自然度与经验人类分布进行对比。实证评估表明，LLM虽具有高语用流畅性，但在情感表达和联合注意方面存在系统性局限。案例研究表明，结构化角色能产生更贴近人类对话行为的交互。摘要未提供具体的实验数字或特定数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [角色扮演, 智能体, 心理学, 评估框架]\n---\n\n### 13. Jev-Mem: System-One-Controlled Agentic Memory for Efficient AI Agents (Jev-Mem：面向高效AI智能体的系统一控制型智能体记忆)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23986)\n- **研究任务**: 解决长视野AI智能体中智能体记忆依赖自回归LLM控制记忆组织、检索和使用，导致昂贵的生成过程处于记忆操作关键路径上的效率问题。\n- **核心亮点**: 提出Jev-Mem，一种受系统一/系统二认知启发的智能体记忆架构。通过专用的系统一控制平面、结构化多关系记忆平面和系统二推理平面，将快速轻量级决策与慢速深思熟虑推理分离，提升记忆有效性和系统效率。\n- **深度解析**: 系统一控制器在构建时管理记忆类型和关系组织，在检索时动态执行查询路由、检索预算分配、图遍历、候选评分和自适应停止；系统二仅在复杂推理和答案合成时调用。在LoCoMo数据集上，Jev-Mem的LLM-as-a-Judge综合得分达0.777（相对最强基线提升11.0%），记忆构建时间降至158秒（比最快竞争系统快6.6倍），平均查询延迟降至0.93秒（降低36.7%）。摘要未提供更深层的技术细节。\n- **领域归类**: [智能体记忆, 认知架构, 检索优化, 效率提升]\n---\n\n### 14. CARE: Experience-Guided Atomic Corrective Execution for Vision-Language-Action Policies (CARE：面向视觉-语言-动作策略的经验引导原子级纠正执行)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24118)\n- **研究任务**: 解决视觉-语言-动作（VLA）策略在机器人操作中执行偏离标称轨迹时表现脆弱的问题，提高从失败中恢复的能力。\n- **核心亮点**: 提出CARE框架，通过学习执行过程中遇到的失败来进行恢复。收集失败的rollout，对阶段条件的失败后偏差进行建模，合成代表性失败状态和纠正演示。推理时结合阶段规划与物理接地的3D监控，触发原子级调整或重新操作。\n- **深度解析**: 提出失败状态恢复基准（FSR-Bench），评估在局部偏差和结构异常下从中间失败状态恢复的能力。在多个VLA骨干、仿真基准和真实世界双臂任务上的实验表明，仿真中平均任务成功率提升14.5分，真实世界中提升15.9分。摘要未提供具体的数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [机器人操作, 视觉-语言-动作模型, 故障恢复, 强化学习]\n---\n\n### 15. Why Do Video Diffusion Models Violate Physics? Unveiling the Flaws in Attention Mechanisms (为什么视频扩散模型违反物理规律？揭示注意力机制的缺陷)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23658)\n- **研究任务**: 探究最先进的视频扩散模型生成违反现实世界物理规律内容的根本原因，并从模型内部机制（特别是注意力机制）进行可解释性研究。\n- **核心亮点**: 首次对文本到视频扩散模型的“运动规划”过程进行可解释性研究，揭示运动轨迹在早期去噪阶段的形成过程。发现旋转位置编码（RoPE）会导致过度的空间注意力衰减，使早期候选区域过早锁定在物理上不合理的位置。提出一种轻量级架构修改，在不同去噪步骤中缩放RoPE的频率。\n- **深度解析**: 基于“先形状，后细节”的发现，结合交叉注意力轨迹模式与因果头贡献，识别出驱动运动规划的特定注意力头子集。自注意力分析表明，RoPE引起的过度空间注意力衰减会抑制相邻帧中的合理轨迹。所提出的轻量级修改减少了过度的注意力衰减，帮助模型探索更好的候选区域以建立连贯的物理运动。无训练和基于训练的实验均证实了该方法在增强生成视频物理常识方面的有效性。摘要未提供具体的实验数字或特定数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [视频生成, 扩散模型, 可解释性, 物理规律]\n---\n\n### 16. 1% of Tokens Can Be Enough: On Gradient Estimation in On-Policy Distillation (1%的Token可能就足够了：关于在策略蒸馏中的梯度估计)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24432)\n- **研究任务**: 解决稀疏在策略蒸馏（OPD）中，当从采样的下一个token估计梯度时，有用的教师指导会产生噪声更新的问题，研究在固定前缀下的梯度估计问题。\n- **核心亮点**: 在信息几何中研究该估计问题，提出基于信号-噪声分解的信息效率比（IER）。IER表征了在最优标量基线下的相对梯度估计误差。通过候选集近似，实现基于IER及其与现有有用性分数结合的token选择，同时保留采样的反向KL训练目标。\n- **深度解析**: 在数学和医学推理任务上，添加IER在多种设置下改善了现有的选择器。在0.1%--1%的小token预算下，稀疏配置能够匹配或超过不进行token选择的完整OPD。结果表明，在分配稀疏监督时，需要同时考虑有用性和梯度估计的可靠性。摘要未提供具体的实验数字（除0.1%-1%外）或特定数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [模型蒸馏, 梯度估计, 信息几何, 大语言模型]\n---\n\n### 17. HuRo: Robotizing Human Videos for Scalable VLA Pretraining (HuRo：将人类视频机器人化以实现可扩展的VLA预训练)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.10706)\n- **研究任务**: 系统考察机器人化的人类视频是否能作为VLA（视觉-语言-动作）预训练的有效且可扩展的监督来源，以弥补人类视频与真实机器人数据之间的具身差距。\n- **核心亮点**: 开发了一个机器人化流水线，将异构人类视频转换为与机器人对齐的观察和动作轨迹，同时推断注释级别之间缺失的中间信号。构建了HuRo数据集，包含约63万机器人化片段和1.42亿处理帧。\n- **深度解析**: 在四个真实世界操作任务中，增加机器人化预训练数据量使整体完成率从51.5%提升至80.3%，在空间和视觉偏移下的OOD（分布外）完成率从34.9%提升至72.2%。消融实验表明，视觉机器人化提高了OOD鲁棒性，且使用重定向动作的端到端预训练优于仅视觉迁移。摘要未提供具体的来源数据集名称（仅提及来自五个人类视频来源）。摘要未提供更深层的技术细节。\n- **领域归类**: [机器人操作, 视觉-语言-动作模型, 预训练, 数据增强]\n---\n\n### 18. Think Like a World Model, Act Like a VLA: Distilling World-Model Representations into Compact Robot Policies (像世界模型一样思考，像VLA一样行动：将世界模型表示蒸馏到紧凑的机器人策略中)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24682)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型因缺乏解释世界如何响应的目标而导致鲁棒性受限于数据覆盖的问题，同时避免世界模型在控制循环中因生成未来而带来的高计算成本。\n- **核心亮点**: 提出将世界模型对物理场景的了解（存在于其内部特征中）与生成未来的目标分离。在普通VLA训练中添加一个特征对齐项：冻结的世界模型在训练帧上运行一次并缓存，学生模型学习与该缓存一致。部署时的策略与未蒸馏基线相同，无需加载教师模型。\n- **深度解析**: 0.8B的学生模型在LIBERO上达到97.9%，在RoboCasa-GR1人形操作中从48.2%提升至50.5%，并在单臂和双臂真实硬件上验证了该目标。在消费级RTX 5090上运行时间为32毫秒，显存占用1.86GB。增益在学生规模、骨干网络、对齐层和教师变化下依然存在。摘要未提供具体的训练数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [机器人策略, 世界模型, 知识蒸馏, 视觉-语言-动作模型]\n---\n\n### 19. Complex KDA: Understanding and Enhancing the Expressivity of Kimi Delta Attention (Complex KDA：理解并增强Kimi Delta Attention的表达能力)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24797)\n- **研究任务**: 解决基于delta规则的线性RNN在序列建模中，由于低秩校正的线性更新限制了其表达能力的问题，特别是如何在不增加更新秩和成本的情况下实现2D旋转。\n- **核心亮点**: 提出Complex KDA (CKDA)，通过结合单个delta规则变换与其通道门控提供的第二次反射来实现2D旋转。这需要扩展KDA的参数范围（允许门控在[-1,1]，delta规则系数β在[0,2]）。CKDA保持了KDA的稳定性和效率，同时达到了DeltaProduct_2的状态跟踪表达能力。\n- **深度解析**: 证明了每个正交的对角加秩一矩阵恰好是一个CKDA转移矩阵。单个CKDA层可以跟踪与SO(3)子群同构的每个有限群，且许多状态跟踪结果比其它对角加秩一线性RNN少用一层。在S_3、S_4和周期性音频续写上，结合两种扩展在测试的KDA范围设置中产生了最强的长度外推能力。在语言建模中，CKDA优于Transformers和其他线性RNN，获得了与KDA基线相似的结果，并展现出良好的扩展行为。摘要未提供具体的实验数字（除提及的群和层数比较外）或特定数据集名称。摘要未提供更深层的技术细节。\n- **领域归类**: [线性RNN, 序列建模, 状态跟踪, 架构设计]\n---\n\n### 20. SkillSpec: Intent-Masked Specification Reasoning for Agent Skill Correctness (SkillSpec：面向智能体技能正确性的意图掩码规范推理)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06052)\n- **研究任务**: 解决自主智能体系统中可重用技能抽象（通常包含自由形式指令和异构资源）的正确性保证问题，特别是意图冲突等细微语义不一致导致的隐性故障。\n- **核心亮点**: 提出SkillSpec，一种Hoare风格的框架，将技能正确性表述为规范推理问题。将异构技能库转换为统一的图表示，通过意图掩码调节对整体、谱系、邻域和局部视图的访问，以平衡过度上下文带来的偏差和上下文不足导致的无支持推理。\n- **深度解析**: 在SkillsBench和广泛下载的仓库中的515个真实世界技能上，SkillSpec在239个技能中识别出763个手动确认的缺陷，精确率达到61.2%。跨多个模型家族的节点级分析表明，规范推理对代码节点一致可靠，而纯文本节点仍是主要瓶颈。大多数缺陷出现在声明意图与实现之间的边界。摘要未提供具体的实验数字（除515、763、239、61.2%外）或特定数据集名称（仅提及SkillsBench和广泛下载的仓库）。摘要未提供更深层的技术细节。\n- **领域归类**: [智能体技能, 规范推理, 代码缺陷检测, 质量保证]\n\n### 21. The Functionalizer: Lossless Functional Decomposition for Subword Tokenization (Functionalizer：用于子词分词的无损函数分解)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15991)\n- **研究任务**: 解决标准子词分词器在处理单词正字法变体（如大小写、变音符号、字符重复）时导致的词表碎片化或信息丢失问题，提出一种无损的分词前处理框架。\n- **核心亮点**: 提出 Functionalizer 框架，将正字法和结构变体分解为可组合的操作码/操作数前缀流。使用 Unicode 私有区编码参数化转换操作符（如大小写、13种变音符号、字符重复等），实现完全可逆的无损分解。\n- **深度解析**: 摘要指出，该方法在自然语言和代码语料库中实现了完整的语料覆盖，并在无约束条件下将实际词表槽位需求减少了高达 19.7%。在 98M 参数的 GPT-2 模型上的下游评估表明，Functionalizer 提高了 Python 代码语法的有效性（9.12% vs. 7.70%），同时减少了自然语言散文中的重复 n-gram。这表明函数分解可以作为一种有效的机制，用于词汇高效、结构感知的语言建模。\n- **领域归类**: [自然语言处理, 词表与分词, 语言模型]\n---\n\n### 22. ShieldVLA: Feasibility-Aware Safety Alignment for Vision-Language-Action Models (ShieldVLA：面向视觉-语言-动作模型的可行性感知安全对齐)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13231)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在机器人操作和导航中微调时缺乏安全保障的问题，提出一种安全对齐的微调框架。\n- **核心亮点**: 提出基于 Hamilton-Jacobi (HJ) 可达性的 ShieldVLA 框架。直接从视觉观测中学习无模型的 HJ 可达性值函数近似，以估计安全操作区域。引入基于规则的 VLM 安全评分，将语义安全反馈转化为结构化的批评家目标，无需手动成本标签。\n- **深度解析**: 摘要提到，ShieldVLA 通过将可行区域内的奖励最大化与不安全状态附近的恢复分离开来，避免了持续的奖励-成本权衡。在五个导航和操作基准测试中，ShieldVLA 平均降低了 57% 的累积安全成本，并比 SafeVLA 提高了 +0.13 的任务成功率。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 安全与对齐]\n---\n\n### 23. Mira-Scene: Pixel-Aligned Layouts for Generative 3D Scene (Mira-Scene：用于生成式3D场景的像素对齐布局)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23796)\n- **研究任务**: 解决单图像 3D 对象生成中，将高保真资产准确放置到连贯场景布局中的挑战，特别是现有组合方法中布局参数化难以学习和泛化的问题。\n- **核心亮点**: 提出 Mira-Scene 组合式 3D 场景重建框架，用密集、有界的对应恢复替代稀疏姿态回归。核心是规范坐标图（CCM），将每个可见对象像素映射到对象有界规范空间中的表面坐标。引入多模态扩散 Transformer 联合生成对象几何和 CCM。\n- **深度解析**: 摘要提到，CCM 与单目几何估计的场景空间点云图（PCM）结合，通过鲁棒的几何对齐恢复对象变换。由于 CCM 在有界规范空间中操作，它提供了稳定的预测目标，可从可扩展的对象级 3D 数据中训练，无需场景级布局注释。在室内、室外、合成和野外场景的实验中，Mira-Scene 在布局准确性上大幅超越强基线，3D-IoU 相对提升 39.8%，2D-IoU 相对提升 16.5%（相较于 SAM3D）。\n- **领域归类**: [计算机视觉, 3D场景生成, 图像与布局]\n---\n\n### 24. Measuring the Checker: Mutation Analysis for GPU-Kernel Benchmark Oracles (测量检查器：GPU内核基准测试预言机的突变分析)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.22220)\n- **研究任务**: 评估和量化用于 LLM 生成 GPU 内核的基准测试检查器（oracles）的充分性和弱点，解决现有检查器依赖少量随机输入和宽松浮点容差的问题。\n- **核心亮点**: 引入突变分析作为内核基准测试预言机的充分性指标。通过确定性规则向 188 个 KernelBench 问题的已验证 CUDA 实现中注入 10,303 个可编译故障（其中 7,384 个具有独立的杀死见证），根据检测到的故障比例对任何测试协议进行评分。\n- **深度解析**: 摘要提到，官方检查器确定性地漏掉了六分之一的见证故障（16.9%），且漏报因类型而异（8.7% 的算术故障逃逸，但 78.6% 的精度故障逃逸）。该指标解释了原因，审计了现有补丁（KernelBench-Verified 的收益分为隐藏输入的 +4.0 分和更紧容差的 +4.5 分），并暴露了一个拒绝正确内核 107 次的模糊测试方案。在杀死矩阵上优化套件在每问题两个输入的情况下达到了 98.0% 的检测率（94.8% 保留率）。作者开源了相关数据集。\n- **领域归类**: [软件工程, 基准测试与评估, GPU计算]\n---\n\n### 25. A Lie Detector Test for Language Models: Reading Knowledge a Model Won't Reveal (语言模型的测谎仪测试：读取模型不愿透露的知识)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.21996)\n- **研究任务**: 解决大语言模型可能隐藏其内部知识（如能力评估中的故意表现不佳或回答与内部知识相悖）的问题，提出一种方法检测模型是否隐藏了答案。\n- **核心亮点**: 借鉴法医学中的隐蔽信息测试，提出内部识别探测（PIR）方法。通过向模型展示问题及其候选答案，并从模型的内部状态中读取模型识别为正确的候选答案，实现无参考（无需诚实参考模型或标记的真实语料库）的知识检测。\n- **深度解析**: 摘要提到，在来自五个家族的八个模型上，PIR 以 0.70 到 0.87 的平衡准确率恢复识别的答案，远高于未知项基线（0.28 到 0.40）和随机猜测（0.25）。它在各种隐藏形式（提示欺骗、训练有素的故意表现不佳、外部密码锁定和电路断开检查点）中保持可读性，识别率在 0.85 到 0.93 之间。当模型隐藏已知答案时，识别率保持较高；当未学习移除知识时，识别率下降到模型从未知道该问题的水平。该信号是因果的，支持故意表现不佳审计和未学习验证。\n- **领域归类**: [自然语言处理, 模型安全与对齐, 可解释性]\n---\n\n### 26. TAPe+ML: A Compact Structured Representation for Multi-Task Computer Vision (TAPe+ML：用于多任务计算机视觉的紧凑结构化表示)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20869)\n- **研究任务**: 提出一种紧凑的计算机视觉系统，通过在识别前对感知元素之间的关系进行结构化编码，替代直接操作像素张量，以支持多任务视觉系统。\n- **核心亮点**: 提出 TAPe+ML v3，基于主动感知理论（TAPe）的结构化表示。结合背景和轮廓处理、局部对象定位、基于原型的分类以及专用子模型的协调器。整个系统使用少于 100,000 个参数。\n- **深度解析**: 摘要提到，在 COCO 目标检测上，获得 84.7 mAP50 和 65.3 mAP50-95。在 COCO 实例分割上，获得 80.7 mask mAP50 和 58.4 mask mAP50-95。在分类实验中，在 Imagenette 上达到 92% 的验证准确率，在 ImageNet-Real 上达到 89.9% 的 Top-1 准确率。结果建议，将部分建模负担从网络参数转移到结构化输入表示，可以支持紧凑的多任务视觉系统，减少数据、内存和计算需求。\n- **领域归类**: [计算机视觉, 多任务学习, 高效模型]\n---\n\n### 27. EDGEGEN: Improving Tool-Calling Agents Beyond Happy Paths with Synthetic Edge Case Generation (EDGEGEN：通过合成边缘案例生成改进超越常规路径的工具调用智能体)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24115)\n- **研究任务**: 解决工具调用 LLM 智能体在企业应用中缺乏高质量、多样化任务数据集进行评估和优化的问题，特别是现有合成方法忽略智能体底层状态或数据库的问题。\n- **核心亮点**: 提出 EdgeGen 合成任务生成框架，从智能体规范中提取合规规则，并利用这些规则生成基于数据库的边缘案例任务，这些任务旨在违反这些规则。结合现有合成数据生成技术，形成无需人工标注的全自动闭环系统。\n- **深度解析**: 摘要提到，在 tau2bench 航空领域，使用 EdgeGen 生成的数据进行微调可产生 2% 到 42% 的一致平均进度提升，而其他基线方法在某些模型上表现出下降。在测试工具优化方面，对于 Gemma-4-e4b 模型，该方法比人工策划和基础测试工具分别显示出 10% 和 30% 的平均进度提升。\n- **领域归类**: [自然语言处理, 智能体, 数据生成与微调]\n---\n\n### 28. Prediction-Powered Smoothing and Validation for Disaggregated AI Evaluation (用于分解式AI评估的预测驱动平滑与验证)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20758)\n- **研究任务**: 解决 AI 系统分解评估（如不同基准任务类型或对话类型）中，由于标签数量有限导致直接估计器不精确的问题，提出一种集成估计和验证的工作流。\n- **核心亮点**: 提出预测驱动平滑（PP-S），一种拟合到每个领域预测驱动估计的贝叶斯模型，并扩展为跨报告分类借用强度的 PP-TS。推导了一种新的、近似无偏的基于设计的交叉验证分数，用于在直接和平滑估计器之间进行选择。\n- **深度解析**: 摘要提到，在具有可验证评分的策划基准和由人类评分的部署智能体流量中，所提出的估计器在点估计和区间估计中均优于直接估计器，且具有接近标称的覆盖率。在相同的采样预算下，其分数选择估计器的表现与独立验证样本一样好，并且更准确地估计所选估计器的误差。\n- **领域归类**: [机器学习理论, 模型评估与统计, 数据分析]\n---\n\n### 29. Streaming Video Editing with Easy Adaptation (轻松适配的流式视频编辑)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24788)\n- **研究任务**: 解决如何在预训练的双向视频扩散模型上仅进行少量训练，即可支持高质量的自回归流式视频编辑的问题。\n- **核心亮点**: 提出 SVEET 框架。识别出流式适配的两个关键原则：骨干特征解耦和条件帧独立性。开发了一种新的可控视频生成范式，辅助模型分支使用时间独立的自注意力编码源视频输入，并将中间特征注入骨干块。提出解耦训练方案，显式强制视频可控性和模型因果性优化方向之间的正交性。\n- **深度解析**: 摘要提到，这种解耦确保了推理时两个目标的兼容性，并促进了跨异构骨干架构的平滑零样本知识转移。广泛的实验表明，SVEET 在保持实时性能的同时实现了卓越的编辑质量，在单个 H100 GPU 上无需任何辅助加速技术即可达到 15 FPS。代码已开源。\n- **领域归类**: [计算机视觉, 视频生成与编辑, 扩散模型]\n---\n\n### 30. Realtime-Venus: A full-duplex interaction system with asynchronous delegation (Realtime-Venus：具有异步委托的全双工交互系统)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13814)\n- **研究任务**: 解决数字和物理环境中自然交互需要持续感知和及时响应的问题，提出一种主动的全双工交互系统，支持音频视觉和纯语音交互。\n- **核心亮点**: 提出 Realtime-Venus 系统，包含两个独立训练的 9B 模型：用于音视频交互的 Realtime-Venus-Omni 和用于语音交互的 Realtime-Venus-Audio。每个模型作为完整的对话前端，通过共享的因果时间线集成持续感知、对话控制和原生语音生成。双循环运行时协调实时交互与后台推理和工具执行。\n- **深度解析**: 摘要提到，Realtime-Venus-Omni 在八个视频基准测试中的六个中得分最高，包括 StreamingBench (70.2%)、OVO-Bench (64.7%) 和 Daily-Omni (81.3%)。Realtime-Venus-Audio 在八个音频理解和语音问答基准测试中领先，并在 Full-Duplex-Bench v1.5 上响应用户中断的比例达到 75%，在背景音等条件下的继续率（97%、88%、86%）超过 Gemini 3.1 Live 和 GPT-4o。\n- **领域归类**: [多模态, 语音与对话系统, 实时交互]\n---\n\n### 31. UltraTex: Unleashing 2K Multi-View Diffusion for 3D Texturing (UltraTex：解锁2K多视角扩散模型用于3D纹理生成)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23169)\n- **研究任务**: 基于高分辨率（2K）多视角扩散模型的高效3D纹理生成。\n- **核心亮点**: \n  1. 提出 UltraTex：一个高效的端到端高分辨率（2K）多视角扩散3D纹理生成框架。\n  2. 提出两大冗余消除机制：引入背景Token丢弃（Background Token Dropping）和块稀疏注意力（Block-Sparse Attention），大幅降低多视角序列的计算开销。\n  3. 设计前景感知VAE解码（Foreground-Aware VAE Decoding），在仅进行前景推理时有效避免重建伪影，保障最终视图质量。\n  4. 构建 G-buffer TexVerse 数据集：包含超26.8万个3D资产的大规模、超高分辨率多视角渲染数据集，满足2K分辨率训练的数据需求。\n- **深度解析**: \n  现有的图像引导3D纹理多视角扩散方法通常局限于512或768的低分辨率，难以保留高分辨率参考图像的高频细节。若将分辨率提升至2048，统一的多视角序列会超过212K个token，导致极高的内存和延迟成本。本文提出的 UltraTex 观察到以物体为中心的多视角渲染存在两大冗余来源：背景引起的序列冗余和前景内稀疏的token交互。据此，该方法在DiT主干网络前丢弃背景token，并对保留的前景序列采用块稀疏注意力以减少计算。同时，通过前景感知VAE解码保障最终高分辨率视图的质量。摘要未提供具体的对比基线模型名称，但指出在数据集常见样本上，UltraTex 实现了20.6倍至91.1倍的训练加速和22.3倍至74.6倍的端到端推理加速，且生成的纹理视觉保真度高、细节丰富。\n- **领域归类**: [3D视觉, 计算机图形学, 扩散模型, 纹理生成, 图像生成]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [anthropics/financial-services](https://github.com/anthropics/financial-services)\n- **今日趋势**: Python | 36,209 stars | 5,302 forks | 今日新增 436 stars\n- **项目简介**: 仓库描述未提供。\n- **核心价值**: \n  - **项目用途**: 仓库描述未提供。\n  - **目标人群**: 仓库描述未提供。\n  - **技术核心**: 仓库描述未提供。\n  - **是否AI/大模型相关**: 无法确定（仓库描述未提供，不根据项目名猜测）。\n---\n### [davila7/claude-code-templates](https://github.com/davila7/claude-code-templates)\n- **今日趋势**: Python | 31,016 stars | 3,534 forks | 今日新增 113 stars\n- **项目简介**: 用于配置和监控 Claude Code 的命令行工具。\n- **核心价值**: \n  - **项目用途**: 提供 CLI 工具以方便开发者配置和监控 Claude Code。\n  - **目标人群**: 使用 Claude Code 的开发者。\n  - **技术核心**: CLI（命令行界面）工具开发。\n  - **是否AI/大模型相关**: 是（涉及大模型编程工具 Claude Code）。\n---\n### [mvt-project/mvt](https://github.com/mvt-project/mvt)\n- **今日趋势**: Python | 13,914 stars | 1,345 forks | 今日新增 441 stars\n- **项目简介**: 用于移动设备取证以发现潜在入侵或妥协迹象的工具包。\n- **核心价值**: \n  - **项目用途**: 帮助对移动设备进行取证分析，检测潜在的安全入侵痕迹。\n  - **目标人群**: 安全研究人员、数字取证专家。\n  - **技术核心**: 移动设备取证分析技术。\n  - **是否AI/大模型相关**: 否。\n---\n### [super
