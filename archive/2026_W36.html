    <h1>AI 技术周报 - 2026-W36</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 每周论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. LoopArena: Benchmarking Models as Runtime Controllers for Loop Engineering (LoopArena：将模型作为循环工程运行时控制器的基准测试)\n- **社区热度**: `👍 82 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28281)\n- **研究任务**: 评估模型作为运行时控制器（Controller）指导独立编码代理（Worker）完成长期任务的能力，即评估“循环工程”中模型指导编码代理的表现。\n- **核心亮点**: 提出 LoopArena 基准测试，将评估分为三种不同执行范围和成本的设置（Type I/II/III），揭示了当前模型在长期循环控制中的不足，并开源了基准数据和评估代码。\n- **深度解析**: \n  - **技术细节**: 模型作为 Controller 接收结构化摘要并指导固定的 Worker。Type I 通过执行验证的问题评估下一步循环契约选择，不运行 Worker；Type II 对完整任务的选定切片执行重复控制；Type III 从初始状态评估配对的完整任务。\n  - **实验结果与数字**: 最佳模型的严格成功率为 24.69%。配对推理成本平均降低了 64.4%。Type II 在核心标准下产生相似排序（Spearman's ρ=0.9747）。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [AI Agent, 软件工程, 基准测试]\n---\n\n### 2. DART-SD: Diamond-topology Aware Retrieval and Tuning for Self-Distillation of Multi-Turn Tool-Calling Agents (DART-SD：面向多轮工具调用代理自蒸馏的钻石拓扑感知检索与微调)\n- **社区热度**: `👍 60 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18524)\n- **研究任务**: 提升大语言模型在多轮工具调用任务中的自主代理能力，解决全长度轨迹模仿学习导致的拓扑坍缩和策略多样性下降问题。\n- **核心亮点**: 提出 DART-SD 框架，通过钻石拓扑感知检索与微调，将范式从全局强制转变为拓扑引导的局部校正，显著优于传统全轨迹基线。\n- **深度解析**: \n  - **技术细节**: 将执行过程建模为交互-状态转换图（ISTG），捕捉钻石拓扑结构。识别关键拓扑断点（CTB）并检索成功恢复参考。采用渐进式自蒸馏范式，训练损失仅在生成的恢复步骤上计算，严格保护有效推理前缀免受破坏性梯度更新。\n  - **实验结果与数字**: 摘要未提供（仅提及显著优于传统全轨迹基线）。\n  - **数据集**: 摘要未提供（仅提及复杂的多轮工具调用基准）。\n- **领域归类**: [AI Agent, 自蒸馏/强化学习, 工具调用]\n---\n\n### 3. Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models (超越数据扩展：面向视觉-语言-动作模型的以表征为中心的持续预训练)\n- **社区热度**: `👍 55 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27550)\n- **研究任务**: 在有限的机器人数据预算下，通过以表征为中心的持续预训练将有限的轨迹转化为可迁移的视觉-动作知识，构建通用的视觉-语言-动作（VLA）模型。\n- **核心亮点**: 提出 VLAct 骨干网络，通过保留 VLM 先验和跨具身动作语义共享，在固定微调协议下持续提升下游性能，证明了表征中心持续预训练在适度计算预算下的重要性。\n- **深度解析**: \n  - **技术细节**: 采用 VLM 先验保留、多头连续动作协同监督和部分统一的跨具身动作布局，同时允许在微调期间使用任务特定的动作头。\n  - **实验结果与数字**: 在 LIBERO-Plus 和 RoboTwin 2.0 上成功率分别为 82.6% 和 92.5%。在 RoboDojo 中按成功率排名第六，并超越所有明确指定的世界-动作模型（WAM）条目。在 RoboCasa-GR1 上仅用 20% 下游轨迹超越全数据 GR00T-N1.6 基线。使用 16 块 GPU 训练。\n  - **数据集**: LIBERO-Plus, RoboTwin 2.0, RoboDojo, RoboCasa-GR1。\n- **领域归类**: [具身智能, 视觉-语言-动作模型, 持续预训练]\n---\n\n### 4. Agentic Artifact Creation: Systems, Evaluation, Principles, and Opportunities (代理式工件创建：系统、评估、原则与机遇)\n- **社区热度**: `👍 50 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28122)\n- **研究任务**: 调查和总结“代理式工件创建”，即 AI 系统通过有状态构建来物质化创建或修改可交付成果的过程。\n- **核心亮点**: 综述了 259 篇相关工作，比较了六个工件家族，分析了应用设置和评估实践，并提出了保持承诺和责任明确、将反馈转化为针对性修复等核心原则。\n- **深度解析**: \n  - **技术细节**: 过程链接了工件的操作表示、构建策略和运行时验证。分解可以降低局部复杂性，但会增加协调和重组成本。学习到的评判者如果与生成器有相同的偏好或盲点，可能增加很少的独立证据。\n  - **实验结果与数字**: 摘要未提供。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [AI Agent, 综述, 生成式AI]\n---\n\n### 5. Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning (代码即世界：用于物理推理的可执行世界表示的代理式发现)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27549)\n- **研究任务**: 通过可执行的世界表示来构建物理世界的紧凑、可量化和可控的抽象，以提升视觉-语言模型的定量物理推理能力。\n- **核心亮点**: 提出 Code-as-World 范式，将物理组合、动态演化和视觉外观表示为可执行代码，并开发了一个受溯因推理启发的代理发现循环来构建这些表示。\n- **深度解析**: \n  - **技术细节**: 代理提出、执行、渲染、验证并迭代细化可执行世界假设。使用验证后的可执行世界为训练视觉-语言模型提供可扩展的物理监督。\n  - **实验结果与数字**: 摘要未提供（仅提及 Code-as-World-VL 在 QuantiPhy 上达到最先进性能并超越领先的专有模型）。\n  - **数据集**: QuantiPhy。\n- **领域归类**: [具身智能/物理推理, 视觉-语言模型, 代码生成]\n---\n\n### 6. J-Zero: Unified Challenger--Solver--Judge Co-Evolution from Zero Data (J-Zero：从零数据出发的统一挑战者-解决者-评判者协同进化)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.26582)\n- **研究任务**: 提出一种统一的“挑战者-解决者-评判者”协同进化框架（J-Zero），支持语言模型在可验证和不可验证领域的自我提升，且无需额外数据。\n- **核心亮点**: 挑战者和解决者通过对抗交互协同进化，评判者利用预先已知顺序的偏好对进行协同适应，在可验证和不可验证领域均优于基线，且能持续改进至少十次迭代。\n- **深度解析**: \n  - **技术细节**: 挑战者生成越来越难的任务，解决者学习生成更高质量的响应。评判者使用偏好对进行协同适应，偏好对的顺序由生成方式预先已知（解决者的答案优于挑战者的，分解重组的答案优于单次生成的答案），而不是依赖评判者自己的分数。\n  - **实验结果与数字**: 在可验证领域平均超越基线 4.2 分，在不可验证领域超越 8.0 分。基线在两次迭代后下降，而 J-Zero 在至少十次迭代中持续改进。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [大语言模型, 自我进化/强化学习, 无数据学习]\n---\n\n### 7. Revisiting Local Context for Long-Horizon Streaming 3D Reconstruction (重新审视局部上下文用于长视野流式 3D 重建)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27529)\n- **研究任务**: 在内存和计算受限的情况下，从超长视频中进行流式 3D 重建，解决长序列中估计退化问题。\n- **核心亮点**: 提出 ABot-Recon，一种简单的流式模型，仅缓存前 11 帧的 KV 特征，通过保持局部时间状态和序列长度无关的预测目标，实现了卓越的长视野性能。\n- **深度解析**: \n  - **技术细节**: 预测当前相机坐标系下的点图及相邻帧相对位姿，通过顺序组合恢复全局位姿和几何。引入轻量级时间细化器利用近期视觉和运动上下文改善相对旋转，并使用组合感知位姿损失监督多步位姿组合。\n  - **实验结果与数字**: 在 Oxford Spires 上，ATE 为 4.35 米，RPE-R 为 0.12 度，相比先前最佳结果误差均减少约 40%。\n  - **数据集**: Oxford Spires（其他长序列基准名称摘要未提供）。\n- **领域归类**: [计算机视觉, 3D重建, 流式处理]\n---\n\n### 8. Puro-2B: Poor Lab's Qwen2-1.5B Trained on RTX 5090 within $5090 (Puro-2B：穷人的 Qwen2-1.5B，在 RTX 5090 上花费不到 5090 美元训练)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27370)\n- **研究任务**: 提出一种开源预训练配方，旨在大幅降低语言模型预训练的成本和硬件门槛，使学术界和开源社区能够负担得起。\n- **核心亮点**: 在消费级 RTX 5090 GPU 上使用 FP8 精度从头训练 Puro-2B 模型，最佳模型计算成本低于 6900 美元，性能接近 Qwen2.5-1.5B。推导了 Puro 成本缩放定律，表明约 4400 美元即可达到 Qwen2-1.5B 的性能。\n- **深度解析**: \n  - **技术细节**: 结合了硬件选择、低精度训练（FP8）、超球优化、课程模型平均和数据配方。考察了预训练数据课程如何塑造后训练后的下游性能。\n  - **实验结果与数字**: 最佳模型计算成本低于 6900 美元。拟合的 Puro 成本缩放定律显示约 4400 美元即可达到 Qwen2-1.5B 的性能。训练数据高达 1.4 万亿 tokens。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [大语言模型, 预训练, 高效计算/低成本训练]\n---\n\n### 9. LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation (LayerRecall：用于视频生成长视野一致性的状态条件记忆路由器)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28460)\n- **研究任务**: 解决自回归视频扩散模型在长视频生成中因历史线索被驱逐而导致的一致性下降问题，实现长视野一致性。\n- **核心亮点**: 提出 LayerRecall，一种当前状态条件、层选择性的记忆路由器，检索相关历史 K/V 状态并仅注入对记忆敏感的特定层。提出跨视野预测匹配（CHPM）来监督有界记忆路由器。\n- **深度解析**: \n  - **技术细节**: 视频 DiT 层对当前、近期和远距离上下文有不同偏好。LayerRecall 保留局部注意力，仅在特定层注入历史 K/V。CHPM 使用特权长上下文参考在预测空间监督路由器，以减少对稀缺高质量长视野视频的依赖。\n  - **实验结果与数字**: 摘要未提供具体数字（仅提及在 100 个多镜头评估提示中，在 MemoBench 和 MovieBench 上取得最佳整体结果，在 VBench-Long 上匹配主干网络）。\n  - **数据集**: MemoBench, MovieBench, VBench-Long。\n- **领域归类**: [视频生成, 扩散模型, 记忆机制]\n---\n\n### 10. ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL (ContextPilot：通过细粒度强化学习教导代理进行主动上下文管理)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28476)\n- **研究任务**: 解决长视野代理任务中大语言模型工作上下文不断增长的问题，通过主动上下文管理框架提升推理性能。\n- **核心亮点**: 提出 ContextPilot，系统性地增强了规划、长期记忆和软上下文卸载等工具集。提出了一种专为上下文管理定制的强化学习方法，利用上下文和熵变化识别关键编辑决策，并从分支轨迹中估计动作级优势。\n- **深度解析**: \n  - **技术细节**: 解决了现有方法工具集受限、探索效率低和信用分配粗粒度的问题。使用上下文和熵变化进行分支采样，估计通过相应上下文编辑动作的所有分支轨迹的动作级优势。\n  - **实验结果与数字**: 摘要未提供（仅提及在长上下文 QA 和深度搜索任务中一致优于现有基线）。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [AI Agent, 上下文管理, 强化学习]\n---\n\n### 11. Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models (带着意图行动：为视觉-语言-动作模型蒸馏行为意图)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23478)\n- **研究任务**: 改进视觉-语言-动作（VLA）模型的动作解码器，使其不仅通过行为克隆模仿动作，还能理解并建模行为在指令下所服务的局部语义目标（即行为意图）。\n- **核心亮点**: 提出意图蒸馏（INDI）方法，利用冻结的教师视觉语言模型（VLM）将行为级意图蒸馏到动作解码器中，使模型能够结合行为的展开方式与达成目标来组织动作预测。\n- **深度解析**: 现有的 VLA 模型主要依赖行为克隆，忽略了行为背后的局部目标。INDI 在训练时让教师 VLM 解释演示片段，部署的 VLA 在中间解码器层恢复多模态意图表示。在 SimplerEnv-Bridge 上，INDI 将 GR00T-N1.7 的表现从 64.3% 提升至 84.7%；在 RoboCasa Kitchen 上，将受控基线从 64.1% 提升至 70.3%。在真实世界任务中，平均成功率从 62.0% 提升至 68.7%，长视野任务最高提升 12.0 个百分点。分析表明，恢复的潜在表示被解码器有效使用，捕捉了行为目标和执行进度。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 模仿学习]\n---\n\n### 12. Locate Anything in Videos: Rethinking Efficient Generative Spatio-Temporal Video Grounding (在视频中定位任何事物：重新思考高效的生成式时空视频定位)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28192)\n- **研究任务**: 解决时空视频定位（STVG）任务中，现有多模态大语言模型自回归序列化密集定位轨迹所导致的解码延迟随管长度增加以及定位错误随时间传播的问题。\n- **核心亮点**: 提出并行管解码（PTD），将定位分解为时间块和时间条件的空间块并同时解码，消除了 token 级和轨迹级依赖，将顺序解码深度减少到固定的 1+1 轮。引入解耦块注意力和定位感知策略优化。\n- **深度解析**: PTD 使得解码过程独立于管长度。在 VidSTG 数据集上，PTD 将管完成延迟降低了 79 倍，空间解码吞吐量提高了 92 倍，同时提升了定位精度。使用 4B 参数的主干网络，该模型在 VidSTG 和 HC-STVG 上表现优异，并能零样本泛化到时间定位、接地 VideoQA 和引用视频对象跟踪任务。\n- **领域归类**: [计算机视觉, 视频理解, 多模态大语言模型]\n---\n\n### 13. Blind Men and the Elephant: Probing the Epistemic Myopia of LLMs under Long-Tail Divergent Knowledge (盲人摸象：探究长尾分歧知识下大语言模型的认知近视)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28478)\n- **研究任务**: 探究大语言模型（LLMs）在事实问答中是否保留了长尾事实的分歧描述，揭示单一标准答案假设如何掩盖模型对长尾事实不同视角的保留情况。\n- **核心亮点**: 引入 ElephantBench，一个包含 1,094 个问题的闭卷知识探针。通过基于图的可审计管道，从低曝光网络语料库中识别自然发生的分歧，并转化为多视角问答记录。\n- **深度解析**: 对 32 个模型的评估显示，即使是最强的模型也仅在 52.4% 的问题上恢复了两种视角，其余问题几乎只回忆起一种而遗漏另一种。扩大模型规模和推理时推理能提高召回率，但无法消除这种不完整性。语料库分析表明，曝光不平衡有利于主导视角，而少数派视角的更大曝光与更完整的召回相关。该基准为诊断参数记忆中的认知近视提供了可复现的工具。\n- **领域归类**: [自然语言处理, 大语言模型评估, 知识探针]\n---\n\n### 14. Fast weight Attention for Continual Learning (用于持续学习的快速权重注意力机制)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27763)\n- **研究任务**: 研究循环快速权重记忆和选择性状态空间模型在“写后读”自回归语义下的状态转移规则，以将不断扩展的上下文压缩为固定大小的循环状态，实现持续学习。\n- **核心亮点**: 推导了平方误差回归和负内积目标的归一化一阶更新。提出了 Falcon 系列（Falcon-1/2/3 及其 A 变体）更新规则，并提供循环、掩码并行和分块并行形式，以及数值稳定的正衰减归一化。\n- **深度解析**: 该框架将循环序列模型中的时间对齐、可塑性、遗忘和有界重放分离开来。代表性变体在语言建模中保持竞争力，并改善了可变数字加法中的长度外推能力。具体的实验数据集名称和性能提升的具体数字：摘要未提供。\n- **领域归类**: [自然语言处理, 循环神经网络, 持续学习]\n---\n\n### 15. Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents (画你所见：多模态智能体中灵巧视觉工具使用的基准测试)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.25417)\n- **研究任务**: 评估多模态智能体在“灵巧视觉工具使用”方面的能力，即从视觉证据推断工具参数并直接控制最终结果的细粒度、闭环参数化视觉动作。\n- **核心亮点**: 提出 EASEL 基准，采用参考引导的视觉重建作为主要代理任务（智能体增量绘制画布以匹配参考图像），并包含区域注释、手写和路径规划等语义任务。提供 EASEL-Data（440k 样本的两阶段课程数据集）和 EASEL-9B 模型。\n- **深度解析**: 对 25 个模型的评估显示，当前多模态智能体在 EASEL 上系统性地表现挣扎，重建相似度在 0.40-0.54 的低水平遇到瓶颈，轨迹诊断暴露出严重的闭环不稳定（通常过早饱和或峰值后退化）。EASEL-9B 在 EASEL-Data 上训练后，比基础模型相对提升 6.3%，在所有评估模型中排名第三。\n- **领域归类**: [多模态智能体, 计算机视觉, 基准测试]\n---\n\n### 16. StepGuard: Learning Step-Level Guardrails with Scalable Supervision and Safety-Utility Balancing (StepGuard：通过可扩展监督和安全-效用平衡学习步级护栏)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24777)\n- **研究任务**: 解决基于 LLM 的智能体在通过工具调用与外部环境交互时引入的安全风险（如文件修改、信息泄露），填补执行前步级动作监控的空白。\n- **核心亮点**: 提出 StepGuard（步级护栏模型）和 StepGen（自动数据引擎，生成具有相同上下文但在风险步骤具有不同动作的安全/不安全轨迹）。提出 Balance-GRPO，基于观察到的准确率动态平衡安全和不安全动作的学习。\n- **深度解析**: StepGuard 在开源护栏模型中实现了最高的平均准确率，性能与 GPT-5.4 相当。在 AgentDojo 和 AgentDyn 上保护智能体时，与无护栏设置相比，平均攻击成功率相对降低了 77.3%，而平均效用仅下降 2.8 个百分点，有效实现了安全与效用的平衡。\n- **领域归类**: [AI 安全, 智能体, 大语言模型]\n---\n\n### 17. Sliding-window beats linear attention (滑动窗口注意力击败线性注意力)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28444)\n- **研究任务**: 解决大语言模型（LLMs）中二次方注意力机制带来的高内存和能耗问题，并重新评估线性注意力与更简单基线（如滑动窗口注意力）的性能对比。\n- **核心亮点**: 证明带有 sinks 的滑动窗口注意力（SWA）表现与后训练的线性注意力模型一样好甚至更好。SWA 无需后训练，速度极快且内存需求低，是解决二次方扩展问题的廉价且可靠的方案。\n- **深度解析**: 在长上下文推理任务（Needle-in-a-Haystack 和 BABILong）中，SWA 的性能比线性注意力高出 2 到 10 倍。作者强烈建议为了降低推理内存成本而切换到 SWA，而不是后训练线性模型，因为线性注意力模型可能需要从头训练或大量后训练才能匹配 SWA 的表现。\n- **领域归类**: [自然语言处理, 大语言模型架构, 注意力机制]\n---\n\n### 18. Ring Forcing: Towards Precise Long-Term Memory for Autoregressive Video Diffusion (Ring Forcing：迈向自回归视频扩散的精确长期记忆)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.26794)\n- **研究任务**: 解决视频生成扩展到长持续时间时缺乏稳健长期记忆的瓶颈，具体包括对象持久性（重新进入时精确重现外观）和记忆容量（处理超长上下文并使用 distant history 信息）。\n- **核心亮点**: 提出 Ring Forcing 自回归视频扩散框架。采用环状训练策略强制从 distant history 检索，引入压缩和时间步组合策略以扩展有效历史跨度，并提出稀疏 RoPE 机制以实现灵活、可扩展的记忆适应。\n- **深度解析**: 在固定序列长度约束下，该方法将有效历史跨度扩展到数分钟时长，并实现对整个历史的全面感受野。广泛实验表明，Ring Forcing 实现了卓越的数分钟连贯性和对象持久性，显著优于最先进的方法。具体的实验数据集名称和详细的性能对比数字：摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 扩散模型]\n---\n\n### 19. PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control (PonderPounce：将预训练多模态大语言模型作为机器人控制的片段上下文引擎)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24115)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型通常只继承预训练表示而未将其上下文能力作为片段记忆的问题，利用多模态大语言模型（MLLM）的原生因果上下文作为机器人记忆。\n- **核心亮点**: 提出 PonderPounce 架构，包含 System2 MLLM（Ponder，积累观察、示范和认知）和 System1 VLA（Pounce，接收当前观察和指令）。两者端到端联合训练，无需专用记忆模块或单独的桥接预训练。\n- **深度解析**: 优化后的服务实现了 78ms 的认知刷新 p50 延迟和 25ms 的动作模型调用延迟，支持 20Hz 动作回放。在 RoboMME 上，9B 模型达到 60.83%，0.8B 模型达到 50.04%（对比基线 44.51% 和 17.93%）。使用 9 倍数据时达到 75.54%。在 RoboCasa-DC 上，仅通过动作监督学习达到 12.5%（对比最强基线 11.6%）。\n- **领域归类**: [机器人学, 多模态大语言模型, 视觉-语言-动作模型]\n---\n\n### 20. Video Generative Models as Geometry Learner (视频生成模型作为几何学习者)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28549)\n- **研究任务**: 克服现有几何估计方法（独立训练特定任务模型丢失内在相关性，或联合微调修改的图像扩散骨干需要大量数据）的局限性，提出一种统一且数据高效的几何估计框架。\n- **核心亮点**: 提出 GeoNeXt 方法，将预训练视频生成模型重新用于几何估计，创新地将其表述为“下一帧预测”任务。继承视频模型的结构化知识和丰富先验，适应图像和几何目标的联合建模。\n- **深度解析**: 在零样本单目深度和表面法线估计的广泛实验中，该方法优于以前特定任务和统一的生成竞争者，同时使用了显著更少的训练数据。值得注意的是，该方法可与在超过 100 倍数据上训练的判别式最先进方法相媲美，甚至在几个基准测试中脱颖而出。具体的基准测试名称和详细指标数字：摘要未提供。\n- **领域归类**: [计算机视觉, 3D 几何估计, 视频生成模型]\n\n### 21. StarHarness: Evolving Harnesses with Stratified Search for Enterprise Environments (StarHarness：在企业环境中使用分层搜索演进代理执行框架)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.24804)\n- **研究任务**: 在保持模型权重固定的情况下，演进特定环境的代理执行框架（Harness），包括提示、任务框架、工具接口、技能、子代理结构和代理循环配置等。\n- **核心亮点**: 提出 StarHarness 框架，通过分层任务构建紧凑的演进池，分离提议者可见和隐藏的搜索任务，并在保留任务上评估泛化能力。在多个企业基准上，框架演进使完整基准性能比默认配置提高了 20-35 个百分点。\n- **深度解析**: StarHarness 根据基线失败行为对任务进行分层以构建紧凑的演进池，并将搜索任务分为提议者可见和隐藏两部分。实验表明，该方法在 ITBench SRE、EnterpriseOps-Gym ITSM 和 AutomationBench Finance 等基准上，经过 4-12 次接受的更改后，性能提升了 20-35 个百分点。这些提升在演进排除的任务上依然有效，并且可以在 GPT 和 Qwen 模型家族间迁移。追踪分析表明，改进源于接口修复、环境约定和压缩搜索的操作知识，减少了假阳性诊断并缩短了轨迹。\n- **领域归类**: [AI Agent, 强化学习/优化, 企业级应用]\n---\n\n### 22. Rubric-to-Code Credit Assignment for Reinforcement Learning (用于强化学习的评分标准到代码信用分配)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.27906)\n- **研究任务**: 解决交互式 Web 应用程序生成中，标准 GRPO 将结构化结果折叠为单一序列级奖励从而削弱信用分配的问题，要求模型从自然语言生成可用的 HTML、CSS 和 JavaScript 应用。\n- **核心亮点**: 提出 Rubric-to-Code Credit Assignment (RCCA) 强化学习框架，将基于评分标准（Rubric）的功能反馈转化为生成代码的局部优化信号。构建的 Ling-RCCA-Flash 模型在 MiniAppBench 和 ArtifactsBench 上取得领先成绩。\n- **深度解析**: 针对 Web 应用生成中质量依赖多个局部代码区域（如事件处理器、DOM 片段）的问题，RCCA 围绕显式功能评分标准构建训练任务，使用分层奖励分离格式、源代码、运行时和功能失败，并将评估器生成的文本归因与负责的代码片段和 token 对齐。实验结果：Ling-RCCA-Flash 在 MiniAppBench 上得分 41.25（比 Ling-3.0-Flash 提高 32.20 分，略超 Claude Opus 4.5）；在 ArtifactsBench 上达到 76.19（比 SFT 模型提高 4.48 分，比 GPT-5 高 3.64 分，成为官方排行榜设置下的新最高分）。\n- **领域归类**: [强化学习, 代码生成, 信用分配]\n---\n\n### 23. LMSM: LLM Security Framework Inspired by Linux Security Modules (LMSM：受 Linux 安全模块启发的 LLM 安全框架)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.25697)\n- **研究任务**: 解决大语言模型（LLM）在部署中恶意提示绕过分层防御的问题，将可解释性方法暴露的模型内部信号转化为统一、模块化的安全控制。\n- **核心亮点**: 提出语言模型安全模块（LMSM）框架，借鉴 Linux 安全模块（LSM）的分离理念，将安全后端、策略评估和输出授权分离，实现运行时强制执行的模块化和可组合性。\n- **深度解析**: 现有的 LLM 部署通常将每个可解释性信号与其自身的校准和干预代码耦合。LMSM 框架中，安全后端暴露校准后的证据，版本化策略在受信任的上下文中评估规则，独立的门控授权缓冲输出的释放。原型在 Hugging Face Transformers 和 vLLM 上验证，支持稀疏自编码器（SAE）和任务拟合的密集探针。在 Qwen3-4B 上，LMSM-Checkpoint 将 HarmBench 攻击成功率从 39.20% 降至 3.32%，XSTest 误拒率从 2.40% 升至 4.40%，同时在 32 个活动序列下保留了 98.14% 的无监控服务路径吞吐量。\n- **领域归类**: [大模型安全, 可解释性, 系统架构]\n---\n\n### 24. Language Chain in Alignment: Cross-lingual Ranking Preference Optimization (对齐中的语言链：跨语言排序偏好优化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.23149)\n- **研究任务**: 解决大语言模型对齐严重依赖以英语为中心的高质量偏好数据，导致在其他语言中表现不佳的问题。\n- **核心亮点**: 提出跨语言排序偏好优化（CRPO）框架，利用英语中稳健的偏好知识促进目标语言的偏好对齐，通过分层结构联合优化语内和语际偏好，提升语言适应性和输出质量。\n- **深度解析**: CRPO 在目标语言和英语的并行偏好对中设计分层结构，基于 LambdaLoss 框架，超越基于二元比较的优化，提供跨多个候选响应的相对排序信号。实验在五种不同资源规模的语言上进行，表明 CRPO 在指令遵循和知识利用能力上持续优于标准方法。此外，CRPO 显著提高了奖励边际和理想响应的对数概率，为跨语言对齐贡献了更稳定的偏好流形。摘要未提供具体的实验数字。\n- **领域归类**: [大模型对齐, 跨语言/多语言, 偏好优化]\n---\n\n### 25. Training, learning and inference: unified dynamics of neural systems (训练、学习与推理：神经系统的统一动力学)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20965)\n- **研究任务**: 定义统一的训练-学习动力学，将训练、学习和推理过程在神经系统中进行统一建模和分析。\n- **核心亮点**: 提出“生成事实图（GFG）”作为 AI 原生的科学事实基底，并建立了基于 GFG 的递归科学过程。在 nanoGPT 上建立了统一的训练-学习动力学，并将推理确立为训练-学习动力学的冻结投影。\n- **深度解析**: 论文定义了原子生成事实并编译为生成事实图（GFG）。训练被定义为参数-优化器系统的演化，学习是这些响应引起的分布式功能支持的持续重组。通过三个主要坐标产生二阶预测器，在保留运行中实现了 91.43% 的准确率和 91.49% 的宏平均召回率。推理被建立为训练-学习动力学的冻结投影，组件门控和回滚显示了训练期间形成的查询条件支持的因果招募和非加性组合。在 ResNet/CIFAR-100 和 diffusion/CIFAR-10 实验中也证实了接收状态条件响应和冻结推理投影。摘要未提供其他具体的实验数字。\n- **领域归类**: [神经网络理论, 动力学建模, 基础理论]\n---\n\n### 26. EvoUndo: Recoverability-Constrained Self-Evolution for LLM Agent Harnesses (EvoUndo：针对 LLM Agent 执行框架的可恢复性约束自进化)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28363)\n- **研究任务**: 解决 LLM 代理在运行时修改自身提示、工具、中间件等执行框架时，成功的突变可能留下无法在不同状态下安全逆转的持久影响的问题。\n- **核心亮点**: 提出 EvoUndo 框架，用于表示、合成、诊断和独立验证模型生成的自修改在反事实状态下的可恢复性，强调可靠的代理自进化需要协同设计验证、状态接地、见证语义和恢复语言表达能力。\n- **深度解析**: 在 600 个未见过的单样本自进化任务中，识别出 197 个提高能力但无法通过可恢复性验证的突变。在原始恢复表示下，常规修复策略恢复 0/197 个自然失败。确定性 oracle 分析在原始恢复语言 L0 下恢复 48/197，扩展恢复计算将经验 oracle 恢复增加到 191/197。协议锁定的干预分离了两个瓶颈：精确状态地址接地将成功恢复从 0/48 提高到 38/48 (79.2%)，而扩展恢复语言在 oracle 定义的 S1 层中实现了 142/143 (99.3%) 的恢复。在 gpt-oss-120b 主干上，添加精确地址诊断将恢复降低到 133/143 (93.0%)；Qwen3.8-27B 复制保留了接地和表达能力效应，但没有这种负面交互。\n- **领域归类**: [AI Agent, 自进化, 安全与可恢复性]\n---\n\n### 27. Generative Semantic Scene Completion (生成式语义场景补全)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.26737)\n- **研究任务**: 户外 LiDAR 语义场景补全（SSC），从仅观察目标体积 1% 的扫描中恢复密集的语义体素网格，解决类别不平衡超过 7,000 倍的问题。\n- **核心亮点**: 将 SSC 重新定义为生成式语义场景补全（GSSC），采用单一离散扩散公式扮演三个角色。在 SemanticKITTI 隐藏测试集上取得最佳因果、单扫描、单样本结果。\n- **深度解析**: GSSC 框架包含三个角色：首先，配对稀疏-密集场景合成（PS^3）生成匹配的稀疏 LiDAR 观察及其密集语义补全，解决长尾问题并生成 PS^3-SemanticKITTI 语料库。其次，语义引导的生成式场景补全（SGSC）通过多核苷离散扩散从噪声生成场景。第三，结构化源离散扩散（S^2D^2）在一个流匹配步骤中细化现有补全。S^2D^2 提高了 SGSC 自身输出和所有测试的外部 SSC 基础的 mIoU。在最强基础上，一步无测试时增强在 SemanticKITTI 隐藏测试上达到 38.8% mIoU，比之前相同限制下的最佳发布分数高 2.1 个百分点。四步校正配合八视图测试时增强达到 39.2%。\n- **领域归类**: [计算机视觉, 3D 视觉/点云, 生成模型]\n---\n\n### 28. GGSS: Geodesic-Gated Spherical Steering for Inference-Time Debiasing of Generative Vision-Language Models (GGSS：用于生成式视觉语言模型推理时去偏的测地门控球面转向)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.25375)\n- **研究任务**: 解决生成式视觉语言模型（VLMs）在以人为本的场景中产生人口统计偏见输出的问题，特别是在图像仅在感知种族或性别等受控属性上不同时。\n- **核心亮点**: 提出 GGSS（测地门控球面转向），一种保持范数的干预方法，在单位超球面上发现反事实偏见子空间，沿测地弧线转向视觉 token，并使用自适应门控将校正集中在携带更强人口统计信号的 token 上。\n- **深度解析**: 现有的推理时去偏器主要针对静态嵌入或 CLIP 类模型。GGSS 在四个生成式 VLM 上进行评估，对比十个改编的推理时去偏基线和基于提示的缓解方法。在单一操作点协议下，跨越分类、成对和职业-性别偏见测试，同时测量一般视觉语言能力。GGSS 在所有四个模型上实现了最低的平均偏见，在四个骨干中的三个上具有显著性（配对排列测试），同时将 MMStar 准确率保持在未转向基线的 +/- 0.6 个百分点以内。摘要未提供具体的实验数字。\n- **领域归类**: [多模态/视觉语言模型, 公平性与去偏, 推理时优化]\n---\n\n### 29. Lost in Compression: A Controlled Cross-Lingual Audit of Extractive Prompt Compressors (迷失在压缩中：提取式提示压缩器的受控跨语言审计)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.26175)\n- **研究任务**: 审计提取式提示压缩器在跨语言场景下的表现，探究压缩是缩小还是扩大了非英语语言相对于英语的 token 溢价差距。\n- **核心亮点**: 通过十种语言、五种脚本的完全并行数据，对四个学习压缩器和四个确定性基线进行审计，发现英语训练的压缩器存在明显的跨语言转移差距，且多语言训练的压缩器在激进阈值下可能清空非英语上下文。\n- **深度解析**: 研究使用十种语言的并行数据，在十个供应商的十一个目标模型上进行了超过 250,000 次评估调用。发现：1. 转移差距真实存在，在 0.33 保留率下，英语保留 57-62% 的标准化上下文利用率，立陶宛语保留 10-24%，中文几乎没有。2. 差距与压缩监督数据相关，多语言训练的 XProvence v1 没有差距，但其 v2 版本在激进阈值下清空了 92% 的中文上下文。3. 在长上下文设置中，激进的学习压缩使五种非英语语言中的三种的压缩上下文效用降至或低于无上下文效用。翻译后压缩管道在五种测试语言中的三种中以大约一半的 token 成本匹配或超过原生压缩。\n- **领域归类**: [大模型推理优化, 提示工程, 跨语言/多语言]\n---\n\n### 30. Acquire, Repair, Preserve: A Diagnosis-Guided Post-Training Recipe for Small-Model Dialogue Game Agents (获取、修复、保留：一种诊断引导的小模型对话游戏代理后训练配方)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.28458)\n- **研究任务**: 解决交互式对话游戏中模型需要跨回合保持状态、解释反馈并在不断变化的约束下选择有效动作的能力问题，特别是针对 2B 开放权重模型在 LM Playschool Challenge 中的局部决策失败。\n- **核心亮点**: 提出一种围绕三个步骤组织的训练配方：通过监督微调获取广泛的游戏参与能力，使用回合局部偏好对在目标对话游戏家族内修复可机械验证的失败，并保留这些对话游戏之外的通用能力。\n- **深度解析**: 研究发现 2B 模型的许多失败不仅是广泛的知识失败，还有局部决策失败（如重复猜测、动作格式错误）。训练配方包括：1. 获取：通过 SFT 获取广泛的游戏参与能力；2. 修复：使用回合局部偏好对修复特定对话游戏家族内的机械可验证失败；3. 保留：保留通用能力。在官方最终评估中，提交的模型将公开 clemscore 从 10.67 提高到 38.92，封闭域内分数从 13.41 提高到 41.17，同时大致保留了聚合静态性能（44.14 vs 基线的 44.24）。域外 clemscore 仍较低为 7.88，最大增益集中在目标家族的未见变体上。结果表明广泛的 SFT 带来了大部分能力改进，当失败检测精确时，回合局部监督是有效的。\n- **领域归类**: [大模型微调/后训练, AI Agent/对话系统, 游戏 AI]\n---\n\u003c/details\u003e\n\n"</script>
