- **本质改动**: 将文本、图像、3D统一映射为**共享离散token序列空间**，通过**交错X-to-X训练范式**（如text→image→3D→image循环）隐式建模跨模态结构一致性；以2D数据作为几何约束源，在无需text-image-3D三元组对齐前提下，用2D先验蒸馏3D表征，实现3D原生建模。

### 20. Automatic Image-Level Morphological Trait Annotation for Organismal Images (生物体图像级形态性状自动标注)

- **研究动机**: 形态性状标注依赖专家经验，高质量图像-性状配对数据匮乏，制约生态学大规模分析；现有VLMs难以定位解剖部位并生成符合生物学语义的描述。  
- **本质改动**: 利用**稀疏自编码器从多模态基础模型特征中提取单义性（monosemantic）、空间定位的神经元**，激活区域即形态部件；以此驱动视觉-语言提示工程，将局部视觉特征→生物学概念描述，构建首个可验证的昆虫形态性状数据集Bioscan-Traits（80K annotations），实现端到端、可解释、免人工标注流水线。

### 21. Apriel-Reasoner: RL Post-Training for General-Purpose and Efficient Reasoning (Apriel-Reasoner：面向通用性与效率的强化学习后训练推理模型)  
- **热度/链接**: 👍 0 Upvotes | [Arxiv](https://arxiv.org/abs/2604.02007)  
- **研究任务**: 多领域通用推理能力增强（数学、代码、逻辑、指令、函数调用）  
- **研究动机**: 多领域RL联合优化面临rollout长度异构、难度差异大、采样效率不均等问题；标准length penalty无法自适应平衡推理深度与效率，长思维链推断延迟高。  
- **本质改动**: 提出**自适应领域采样机制**（维持目标域比例不变）与**难度感知长度惩罚**（difficulty-aware length penalty）：在16K token严格预算下，对难问题鼓励更长chain-of-thought，对易问题强制压缩，零开销实现推理深度动态调控，兼顾性能与实时性。

### 22. Executing as You Generate: Hiding Execution Latency in LLM Code Generation (边生成边执行：隐藏LLM代码生成中的执行延迟)  
- **热度/链接**: 👍 0 Upvotes | [Arxiv](https://arxiv.org/abs/2604.00491)  
- **研究任务**: 降低LLM代码生成+执行端到端延迟  
- **研究动机**: 当前串行范式（生成全代码→执行）导致生成期执行器空闲、执行期生成器空闲，造成显著资源闲置与端到端延迟；而LLM代码生成具有不可逆、逐token流式特性，天然支持并行化。  
- **本质改动**: 提出**三阶段流水线（生成→AST感知检测→动态批执行）**，实现token级执行隐藏：通过AST chunking识别可执行子单元，结合gated execution与early error interruption，在生成过程中异步触发安全子表达式执行，理论证明可达近100%非重叠延迟消除，实测端到端加速最高55%。

### 23. LinguDistill: Recovering Linguistic Ability in Vision-Language Models via Selective Cross-Modal Distillation (LinguDistill：基于选择性跨模态蒸馏的语言能力恢复)  
- **热度/链接**: 👍 0 Upvotes | [Arxiv](https://arxiv.org/abs/2604.00829)  
- **研究任务**: 视觉-语言模型（VLM）中退化语言能力的无损恢复  
- **研究动机**: VLM多模态微调导致语言模型原始表征偏移（representation shift）与跨模态干扰，标准微调或插件式对齐模块（如adapter）增加推理负担、牺牲泛化性。  
- **本质改动**: **零参数适配器蒸馏**：冻结原始LM为teacher，学生VLM通过**layer-wise KV-cache sharing**机制，使teacher在vision-conditioned前向传播中“看到”学生中间表征，从而提供精准语言监督；仅在language-intensive数据上选择性蒸馏，保留VLM视觉接地能力，实现语言能力恢复与多模态能力解耦。

### 24. UniRecGen: Unifying Multi-View 3D Reconstruction and Generation (UniRecGen：多视角3D重建与生成的统一框架)  
- **热度/链接**: 👍 0 Upvotes | [Arxiv](https://arxiv.org/abs/2604.01479)  
- **研究任务**: 稀疏视角下的高保真、几何一致3D模型生成  
- **研究动机**: 重建范式（reconstruction）高效但缺乏全局先验致结构缺失；生成范式（generation）细节丰富但多视角不一致；二者坐标系、表征、目标冲突，难以协同。  
- **本质改动**: 构建**共享规范空间（canonical space）对齐双路径**，采用**解耦协作学习**：重建分支输出规范几何锚点（canonical anchors）作为强几何约束，生成分支通过**latent-augmented conditioning**融合该锚点，在扩散去噪中完成结构补全与细节增强，实现重建精度与生成合理性的闭环互补。

### 25. Memory-Augmented Vision-Language Agents for Persistent and Semantically Consistent Object Captioning (面向持续性与语义一致性的记忆增强型视觉-语言具身智能体)

- **研究动机**: 现有VLMs在不同视角下对同一物体产生矛盾描述，导致具身智能体无法构建稳定的语义表征；离线多视图聚合或解耦式多阶段方法缺乏对历史观测的在线因果推理能力  
- **本质改动**: 提出统一自回归框架，将数据关联（data association）、物体标注（captioning）与探索策略（exploration policy）三者联合建模，并引入**对象级情节记忆（object-level episodic memory）**——以序列化对象token形式显式维护跨时间步的物体身份与语义状态，辅以基于分歧驱动的伪标注自监督训练范式

### 27. Friends and Grandmothers in Silico: Localizing Entity Cells in Language Models (硅基“朋友”与“祖母”：语言模型中实体神经元的定位)

- **本质改动**: 提出基于模板提示的**实体选择性MLP神经元定位法**，并通过负向消融（neuron ablation）与正向注入（controlled activation）双重因果验证：发现约200个高频实体的知识高度浓缩于早期层单个MLP神经元，该神经元激活即可触发实体一致性预测，且对别名/拼写变体/多语言形式鲁棒，揭示LLMs存在可定位、可干预的“实体细胞”（entity cells）结构
