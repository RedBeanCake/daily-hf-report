    <h1>前沿科研情报 - 2026-10-22</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Matrix-Game 4.0: Harnessing Video Models for Real-Time Playable Game Worlds (矩阵游戏 4.0：利用视频模型构建实时可玩游戏世界)\n- **社区热度**: `👍 175 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27999)\n- **研究任务**: 利用视频生成模型构建具有持久世界状态、可执行游戏规则和低延迟交互的实时可玩游戏世界。\n- **核心亮点**: 提出将游戏执行与视觉生成分离的架构；结合轻量级游戏引擎、多模态编码代理和基于自回归视频模型的渲染器；在单张 RTX5090 上实现 480p、60 FPS  gameplay，按键到显示延迟仅 112ms。\n- **深度解析**: 该系统通过轻量级引擎维持逻辑状态，利用多模态代理将玩家意图转化为代码和场景描述，再通过视频渲染器将低多边形代理转化为高保真视觉。通过蒸馏和推理优化，大幅降低了视频生成的延迟。关于预训练视频对的具体数据规模以及渲染器的具体参数量：摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 游戏 AI]\n---\n\n### 2. Focused Omni-Modal GUI Agents (聚焦型全模态 GUI 智能体)\n- **社区热度**: `👍 174 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26203)\n- **研究任务**: 解决全模态 GUI 智能体在处理流式多模态观察时因信息过载导致的“顺序分心”问题，提升决策准确性。\n- **核心亮点**: 提出“聚焦感知”概念；设计 FocusGUI 轻量级适配器，动态优先处理多模态通道并将最相关证据压缩注入冻结解码器；仅需动作监督即可训练，无需模态相关性标签。\n- **深度解析**: 针对 GUI 智能体在复杂多模态上下文中容易迷失的问题，FocusGUI 通过动态注意力机制过滤冗余信息。将关键证据压缩为紧凑潜变量并注入，既避免了微调骨干网络的高昂成本，又显著提升了类型匹配和精确匹配率。关于具体的测试集名称以及不同模态（如音频、视频）的具体消融实验数字：摘要未提供。\n- **领域归类**: [多模态学习, GUI 代理, AI Agent]\n---\n\n### 3. PAR: Progress-Aligned Recurrence for Length Generalization in State Tracking (PAR：用于状态跟踪长度泛化的进度对齐循环)\n- **社区热度**: `👍 146 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27628)\n- **研究任务**: 提高循环语言模型在序列状态跟踪任务中的长度泛化能力，使其在测试时能通过增加迭代次数解决更长的问题。\n- **核心亮点**: 提出进度对齐循环（PAR），使第 k 次迭代的预测匹配前 k 次操作后的状态；引入范数锚定防止循环状态尺度漂移；支持在中间标签不可用时使用前缀自蒸馏。\n- **深度解析**: 传统循环模型在长序列中容易因状态尺度变化和迭代目标模糊而失效。PAR 通过对齐中间进度和固定状态范数，让模型在短序列（如 32 步）上训练后，能稳定外推到长序列（如 512 步，16 倍泛化）。关于该模型在其他非 swap-S_5 状态跟踪任务上的具体准确率数字：摘要未提供。\n- **领域归类**: [自然语言处理, 循环神经网络, 长度泛化]\n---\n\n### 4. Ropedia W0: Scaling Loco-Manipulation World Models across Embodiments with Human Experience (Ropedia W0：利用人类经验跨具身扩展运动-操作世界模型)\n- **社区热度**: `👍 140 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26855)\n- **研究任务**: 构建首个跨越人类和多种机器人具身的自我中心运动-操作（loco-manipulation）世界基础模型。\n- **核心亮点**: 构建包含 10k 小时人类和 3k 小时机器人数据的 Xp-Data 数据集；采用统一运动学表示（相机位姿和投影骨架）编码运动和操作；引入长视野基准 Xp-Teleop 并支持实时 VR 交互。\n- **深度解析**: 通过统一的运动学表示，Ropedia W0 有效解决了人类与不同机器人之间动作空间异构的问题。利用海量人类经验进行预训练，不仅提升了人类视角的预测能力，还通过蒸馏显著增强了机器人在跨具身基准上的表现。关于模型的具体推理显存占用、延迟数字以及 VR 交互的具体帧率：摘要未提供。\n- **领域归类**: [具身智能, 世界模型, 机器人学]\n---\n\n### 5. S-Agent 2.0: Spatial Reasoning with a General Coding Agent (S-Agent 2.0：使用通用编码智能体进行空间推理)\n- **社区热度**: `👍 88 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28354)\n- **研究任务**: 提升视觉语言模型（VLM）在复杂 3D 空间推理任务中的能力，弥合模型与工具之间的证据鸿沟。\n- **核心亮点**: 为通用编码智能体配备命令行感知工具包；提出“闭合证据循环”原则（获取、记忆、解释）；在 MMSI-Bench 和 ReVSI 上显著提升开源和闭源模型的性能，且支持多种编码代理框架。\n- **深度解析**: S-Agent 2.0 解决了 VLM 在空间推理中“获取了正确证据但得出错误结论”的痛点。通过强制模型将工具读数转化为持久记忆和空间语言解释，确保了推理的几何基础。其设计保持了编码代理的灵活性，并在不同骨干模型上展现了稳定的增益。关于工具包具体的命令行 API 细节以及在不同 3D 感知工具上的具体耗时：摘要未提供。\n- **领域归类**: [多模态学习, 空间推理, AI Agent]\n---\n\n### 6. Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition (Sage-A1.5：通过能力组合从长视野执行走向科学探索)\n- **社区热度**: `👍 61 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28578)\n- **研究任务**: 通过自适应能力组合，提升 35B MoE 智能体模型的长视野问题求解能力，并将其扩展至开放科学发现。\n- **核心亮点**: 引入智能体编排（子智能体并行协作）、智能体验证（进度检查与策略反思）和开放科学发现能力；支持复杂任务分解、可检查的研究工件生成以及多学科科学应用。\n- **深度解析**: Sage-A1.5 标志着智能体从单一任务执行向复杂协作和科学探索的演进。子智能体隔离上下文减少了并行干扰，验证机制提高了长视野任务的可靠性。将能力延伸至科学探索，为交互式分析和可检查 artifacts 的生成提供了基础。关于具体的评测数据集名称、详细的性能提升数字以及科学探索任务的具体成功率：摘要未提供。\n- **领域归类**: [AI Agent, 大语言模型, 科学发现]\n---\n\n### 7. VLA-Rolling: Fewer Denoising Steps, Better Control via Adaptive Action Reuse (VLA-Rolling：通过自适应动作重用实现更少去噪步数和更好控制)\n- **社区热度**: `👍 59 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25043)\n- **研究任务**: 优化视觉-语言-动作（VLA）模型的推理效率和控制精度，解决滑动窗口规划中动作尾部被丢弃的问题。\n- **核心亮点**: 提出 VLA-Rolling 框架，重用被丢弃的动作尾部；包含动作尾部继承、置信度估计和置信度引导细化三个阶段；在冻结底层 VLA 的情况下，实现最高 1.48 倍加速和 15.08% 的成功率提升。\n- **深度解析**: 传统 VLA 模型在重规划时丢弃未执行的动作尾部，造成计算浪费。VLA-Rolling 发现这些尾部包含可迁移的去噪进度，通过自适应重用和置信度引导，不仅减少了去噪步数，还利用历史先验提高了动作生成的准确性。关于具体的 GPU 型号、单次推理的绝对耗时（毫秒）以及不同模型的具体显存占用：摘要未提供。\n- **领域归类**: [具身智能, 机器人控制, 扩散/流匹配模型]\n---\n\n### 8. CoEvo-RSI: When Harnesses Evolve, Which Models Should Follow? (CoEvo-RSI：当执行工具进化时，哪些模型应该跟随？)\n- **社区热度**: `👍 58 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25078)\n- **研究任务**: 解决递归自我改进（RSI）智能体中模型（脑）与执行工具（体）协同进化时产生的“脑-体不匹配”问题。\n- **核心亮点**: 提出 CoEvo-RSI 框架，实现模型与工具的双向协同进化；引入元智能体协调工具开发与模型检查点选择/合并；通过双向历史继承对齐能力与执行需求，使 Qwen3.5-9B 媲美更大模型。\n- **深度解析**: 在智能体自我进化中，工具的升级往往超出模型能力或限制其已有能力。CoEvo-RSI 通过共享进化档案和执行反馈，让元智能体动态选择或合并合适的模型检查点，确保“脑”与“体”同步进化。关于具体的 SFT 训练数据规模、拒绝采样轨迹的具体数量以及元智能体的具体架构细节：摘要未提供。\n- **领域归类**: [AI Agent, 递归自我改进, 模型协同进化]\n---\n\n### 9. SolarRenderer: Few-Step Generative Reference Rendering (SolarRenderer：少步数生成式参考渲染)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28630)\n- **研究任务**: 将游戏引擎或代码代理生成的粗粒度场景结构（布局、运动、相机）高效渲染为逼真的视频。\n- **核心亮点**: 提出 SolarRenderer，通过两个轻量级 LoRA 适配冻结的 33B 骨干；仅需四步即可渲染，速度提升 12.3 倍；支持流式 768p 实时渲染；泛化到 11 种未见结构表示。\n- **深度解析**: 现有渲染器通常绑定特定引擎或需要大量去噪步数。SolarRenderer 将结构视频直接注入预训练视频大模型的参考路径，结合分布匹配实现极少步数的高质量渲染。其块因果设计支持实时流式输出，且对骨架、点云等多种结构表示具有极强泛化能力。关于具体的 FVD、FID 等视频质量评估指标数字以及 136K 剪辑数据集中各来源的具体比例：摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 渲染技术]\n---\n\n### 10. Learning the 4D World through Point Trajectory Forecasting (通过点轨迹预测学习 4D 世界)\n- **社区热度**: `👍 41 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28594)\n- **研究任务**: 通过点轨迹预测学习 4D 世界，实现可靠的多视角视频预测、3D 运动理解以及机器人控制。\n- **核心亮点**: 提出 Video-Point Model (VPM)，联合预测多视角未来视频和持久场景点的 3D 轨迹；引入轨迹头将外观变化锚定到共享的 3D 运动描述；扩展至机器人控制，将动作 token 与视频联合去噪。\n- **深度解析**: 多视角视频预测的难点在于不同相机视角的 3D 一致性。VPM 通过预测物理点的 3D 轨迹，为每个视角的视频生成提供了共享的 3D 运动锚点。将动作 token 融入同一框架，使世界模型能直接指导机器人操作。关于具体的视频保真度指标（如 PSNR/SSIM）提升数字以及机器人操作成功率的具体提升百分比：摘要未提供。\n- **领域归类**: [计算机视觉, 世界模型, 机器人学]\n\n### 11. Correction Training for Diffusion Models (扩散模型的校正训练)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14136)\n- **研究任务**: 解决扩散模型在迭代采样过程中因曝光偏差（exposure bias）导致的误差累积问题，提升无引导生成的样本质量。\n- **核心亮点**: 引入“校正步骤（correction step）”，在推理时迭代修正去噪器的预测，缩小训练与推理之间的差距；该方法可媲美甚至结合无分类器引导（CFG）使用，且额外推理成本可通过蒸馏回基础模型来消除。\n- **深度解析**: 扩散模型在推理时使用的是自身前一步不完美的预测，这与训练时看到的真实图像加噪声不同，导致误差累积。本文提出一个显式学习任务的校正器，以基础模型的预测为输入，针对同一真实目标进行训练。在采样时，该校正器可反复应用于中间步骤，防止早期伪影 persist。在 DiT、SiT 和 JiT 上的实验表明，该方法显著提升了无引导生成的 FID 分数，且与 CFG 结合能提升多样性并减少过饱和。摘要未提供具体的 FID 数值。\n- **领域归类**: [计算机视觉, 生成模型, 扩散模型]\n---\n\n### 12. SWIFT: Self-guided Weak-to-strong dIFfusion models via Target extrapolation (SWIFT：通过目标外推实现自引导的弱到强扩散模型)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25844)\n- **研究任务**: 降低训练高质量扩散模型的计算成本，并在不增加推理开销的前提下提升强模型的性能。\n- **核心亮点**: 提出 Swift 自引导训练方法，利用冻结的弱去噪器（如早期训练检查点）来指导强模型训练；通过将干净的回归目标向外推离弱去噪器的预测，放大欠拟合的成分，实现高效的弱到强训练。\n- **深度解析**: 训练高质量扩散模型计算昂贵，且推理时的引导会增加采样成本。Swift 方法在训练时，对每个噪声输入，将干净回归目标远离弱去噪器的预测进行外推。弱引导器不需要在主模型训练期间反向传播，训练后直接丢弃。通过 RKHS 中有限时间总体梯度流的谱分析解释了该机制。在 CIFAR-10 和 ImageNet-256 上的实验表明，Swift 在 ImageNet-256 的某种配置下，仅用约一半的总训练计算量（包括引导准备和训练开销）就超越了基线的最佳 FID。在 RAEv2 上，无推理时引导的 FID 为 1.15，有引导为 0.99。摘要未提供 CIFAR-10 的具体实验数字。\n- **领域归类**: [计算机视觉, 生成模型, 模型训练与优化]\n---\n\n### 13. MMEnterprise-Bench: Evaluating Enterprise Agents over Evolving Multimodal Records (MMEnterprise-Bench：在演变的多模态记录上评估企业智能体)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27911)\n- **研究任务**: 系统性地评估多模态大语言模型在企业场景下，针对不断演变、存在冲突的多模态工作记录进行可靠问答和推理的能力。\n- **核心亮点**: 构建了包含 1613 个问题的 MMEnterprise-Bench 基准，涵盖证据推理、冲突解决和不可回答性三大类；揭示了即使是最强的模型在处理跨源/时间冲突或多图像证据时依然表现挣扎，且增加检索预算并不能稳定提升回答准确率。\n- **深度解析**: 在企业环境中，信息在团队协作中不断被共享、修正和修订，导致同一信息存在多个版本。可靠的问答要求智能体能够进行充分的证据推理、解决跨源和时间冲突，并识别证据不足的情况。该基准基于模拟协作项目的演变多模态记录构建。对 10 个专有和开源多模态 LLM 的评估发现，最强模型在面对跨源/时间冲突或跨越多个图像的证据时仍面临挑战。此外，增加检索预算或使用更大的检索器虽然提高了证据召回率，但并未一致地转化为更高的回答准确率。摘要未提供各模型的具体准确率数字。\n- **领域归类**: [自然语言处理, 多模态大模型, 基准测试, 智能体]\n---\n\n### 14. LLM2R: From Large Language Models to 3D Reassemblers (LLM2R：从大语言模型到 3D 重组器)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18604)\n- **研究任务**: 解决 3D 零件组装任务中，现有方法在处理多零件物体时扩展性差的问题，通过预测每个零件的刚性 SE(3) 变换来重建完整形状。\n- **核心亮点**: 将 3D 零件组装转化为序列建模任务，利用预训练的仅解码器大语言模型（LLM）结合 LoRA 进行处理；引入可学习的摘要 token 块来聚合全局组装信息，实现单次非自回归前向传播中预测所有零件的位姿。\n- **深度解析**: 3D 零件组装需要推理整个零件集，而不仅仅是成对关系。LLM2R 使用 Point-BERT 和 Q-Former 将每个零件压缩为几何 token 块，拼接后由因果 LLM 处理。由于因果注意力只能看到前面的零件，模型在最后一个零件后附加了一个可学习的摘要 token 块，以恒定 token 成本聚合整个组装信息，并通过零件感知位姿头预测旋转和平移。该方法在 PartNet、PartNeXt 和 Breaking Bad 数据集上取得了最佳表现。摘要未提供 PartNet 和 PartNeXt 的具体误差数值，但提到在 100 个零件时，Breaking Bad 上的零件准确率比 GARF 高 33.5 分，PartNet 上比 Assembler 高 29.1 分，零样本迁移到未见类别比最强基线高 16 分以上。\n- **领域归类**: [计算机视觉, 3D 视觉, 大语言模型应用]\n---\n\n### 15. Joints, Camera, Action! Co-Generating 3D Motion and Video for Arbitrary Rigs (关节、相机、动作！为任意骨骼绑定共同生成 3D 动作与视频)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28632)\n- **研究任务**: 解决视频生成模型难以将生成的逼真动作转化为特定 3D 资产的可重放 3D 动作并放置在 3D 场景中的问题，实现为任意提供的骨骼绑定（rig）共同生成视频、3D 动作及相机参数。\n- **核心亮点**: 将 3D 动作保留在支持任意骨架的独立模型中，通过少量交叉注意力层连接到预训练视频模型；模型还能学习定位视频帧中的每个关节以恢复相机参数，从而将 3D 动作准确注册到场景中。\n- **深度解析**: 现有的视频-动作模型通常只处理人类骨架或从 2D 姿态图三角化 3D 动作。本文的方法让动作模型先从纯动作数据中学习骨架运动，再通过交叉注意力与视频模型连接。为了在多种骨架上训练，使用生成式视频编辑器将动画化的 3D 资产放置在适合其动作的场景中，结合人类和机器人视频，生成了近 200K 的训练对。评估表明，该模型从文本生成多样化骨骼绑定的动画比 video-first 流程更忠实，且动作能响应周围环境。摘要未提供具体的定量评估数字。\n- **领域归类**: [计算机视觉, 视频生成, 3D 动画与动作生成]\n---\n\n### 16. Specter: Fast MoE Inference via Quantization-Enabled Multi-Step Speculative Offloading (Specter：通过量化支持的多步推测卸载实现快速 MoE 推理)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2511.14102)\n- **研究任务**: 解决混合专家（MoE）模型在单加速器上因内存不足而将专家卸载到主机内存时，产生的严重 PCIe I/O 瓶颈问题，加速 MoE 推理。\n- **核心亮点**: 提出 Specter 推理系统，利用量化技术将推测解码与专家卸载相结合；通过轻量级量化草稿模型在设备端高效运行，提供未来专家使用情况的准确多步前瞻，从而提前组织专家移动和执行，提升通信和执行效率。\n- **深度解析**: MoE 模型的数据依赖路由使得数据传输处于关键路径，导致卸载时 I/O 瓶颈。Specter 的轻量级量化草稿模型保留了高保真的专家激活模式，使得运行时能够在验证之前预测未来的专家使用情况。在单请求推理下，Specter 在每输出 token 时间（TPOT）上比最先进系统平均加速 1.50 倍（最高达 1.88 倍）。摘要未提供具体的硬件配置、模型规模或延迟绝对数值。\n- **领域归类**: [系统优化, 模型推理加速, 混合专家模型 (MoE)]\n---\n\n### 17. EvaOmni: An Evidence-Grounded Benchmark for Audio-Visual Reasoning (EvaOmni：用于音视频推理的证据接地基准)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28444)\n- **研究任务**: 解决现有音视频推理基准仅依赖多选和答案正确性评分，难以评估模型是否真正形成从证据到答案的推理链，以及容易受文本或单模态捷径影响的问题。\n- **核心亮点**: 构建了包含 392 个视频和 1027 个人工标注 QA 对的 EvaOmni 基准，要求模型同时返回答案和支持证据区间；提出了 Coverage Grounded Score (C.G.) 和 Bottleneck Grounded Score (B.G.) 指标，全面评估模型的证据定位和推理能力。\n- **深度解析**: 全能多模态大模型（Omni LLMs）需要跨模态整合信息进行推理。EvaOmni 覆盖 15 种能力和 3 个难度级别，通过严格的标注流程构建视频级干扰项，并由人类和模型过滤捷径。评估了 7 个开源和 17 个专有 Omni LLM。结果显示，Gemini3.7-Flash 取得了最高的整体准确率（79.4%）、C.G.（70.8%）和 B.G.（35.1%）。但在 Level 3（复杂推理）中，其准确率为 79.1%，B.G. 仅为 12.3%，表明即使是最先进的模型在接地音视频推理方面仍有发展空间。摘要未提供其他模型的具体分数。\n- **领域归类**: [多模态大模型, 音视频理解, 基准测试, 推理能力评估]\n---\n\n### 18. SpecKCast: Spectral Kalman Forecasting for Diffusion Acceleration (SpecKCast：用于扩散加速的谱卡尔曼预测)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26837)\n- **研究任务**: 降低扩散 Transformer（DiTs）在图像和视频生成中因多次去噪步骤重复评估 Transformer 而产生的巨大推理成本。\n- **核心亮点**: 提出免训练的 SpecKCast 方法，在频域中预测模型输出；通过对输出应用 2D 离散余弦变换（DCT），并使用轻量级卡尔曼滤波器沿特定频带的时间坐标跟踪每个系数，仅在预测不确定性超过阈值时才评估 Transformer。\n- **深度解析**: 现有的特征缓存或预测方法在跳过步骤时均匀外推特征，忽略了去噪过程中空间频率成分变化的非均匀性，导致预测误差放大。SpecKCast 解决了这一问题，通过频域跟踪和动态阈值控制 Transformer 的评估时机。在 FLUX.1-dev、Qwen-Image、Wan2.1-14B 和 HunyuanVideo 上的实验表明，SpecKCast 在加速和保真度之间取得了更好的平衡，实现了高达 6 倍的加速，且额外内存占用小于 0.05 GiB。摘要未提供各模型的具体加速倍数和 FID/保真度数值。\n- **领域归类**: [计算机视觉, 生成模型, 模型推理加速]\n---\n\n### 19. Evolving Agent Interfaces (进化智能体接口)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28601)\n- **研究任务**: 解决计算机使用智能体受限于人类手工设计的接口，无法跟上应用、工作流和模型发展速度的问题，将接口设计本身转化为智能体的一种能力。\n- **核心亮点**: 提出 Agent S4，一个自主的计算机使用科学家，能够从任务经验中构建和进化智能体接口（Evolving Agent Interfaces）；通过元智能体分析轨迹并利用基于种群的进化算法，自动选择和优化泛化能力强的接口库。\n- **深度解析**: 智能体在面对新任务时，往往因为接口不匹配而效率低下（如逐行输入表格或打印整个文件）。Agent S4 的元智能体在无成功标签的合成训练任务上检查任务智能体的轨迹，构建和修改接口库。然后使用基于种群的进化，根据在未见过的验证任务上的表现来选择和进化存储库。在 OSWorld V2 上，结合 Qwen3.8-27B 和进化接口库的 Agent S4 达到了 21.3% 的二元分数，是固定接口模型的 3.8 倍，超越了 GPT-5.5（13.0%）和 Claude Opus 4.8（20.6%），且成本仅为其约 4.3% 和 1.5%。在 ScienceBoard 上，成功率从 41.4% 提升至 58.6%。摘要未提供具体的成本绝对数值。\n- **领域归类**: [人工智能, 智能体 (Agents), 计算机使用 (Computer Use), 进化算法]\n---\n\n### 20. Painting Change Map as guidance for generating painting processes (绘制变化图作为生成绘画过程的引导)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25369)\n- **研究任务**: 解决现有数字艺术视频生成模型在模拟人类绘画过程时，缺乏对绘画演变时空局部控制能力的问题，实现对“艺术家在何处以及何时采取行动”的精细引导。\n- **核心亮点**: 提出“绘画变化图（Painting Change Map）”，一种新颖的时空控制机制，在 1000 个时间步的连续体上显式跟踪归一化的结构变化；通过将局部视觉差异映射到编码的 RGB 空间，为正向绘画和反向擦除过程提供细粒度的引导。\n- **深度解析**: 当前的条件机制要么依赖静态几何线索（如 Canny 边缘）过于僵硬，要么使用简单的标量进度变量过于宏观，导致用户无法控制绘画随时间的演变。绘画变化图将局部视觉差异编码，分辨率足以捕捉笔触级别的精细变化，同时保持计算上的可行性。广泛的基准测试表明，该方法优于现有的控制基线，并与最先进的绘画方法取得相当或更好的结果。摘要未提供具体的基准测试对比数字，但提到在 oracle（先知/理想）条件下，该方法以显著优势超越了所有基线。\n- **领域归类**: [计算机视觉, 视频生成, 可控生成, 数字艺术]\n---\n\n### 21. PhysSkin++: Real-Time and Generalizable Physics-Based Animation via Self-Supervised Neural Skinning (PhysSkin++：通过自监督神经蒙皮实现实时且可泛化的基于物理的动画)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26067)\n- **研究任务**: 解决在多样化的 3D 形状和空间离散化中，难以泛化实时基于物理的动画的问题。\n- **核心亮点**: 提出 PhysSkin++ 物理信息框架，从静态几何中学习连续神经蒙皮场以构建紧凑的变形子空间；提出神经蒙皮场自编码器，无需逐对象训练即可预测依赖形状的变形子空间；开发物理信息自监督学习策略，结合蒙皮场归一化和冲突感知梯度校正以稳定联合优化。\n- **深度解析**: 该方法通过自监督方式避免了昂贵的模拟轨迹，利用物理约束和正交性约束稳定联合优化。其学到的表示支持高效的降阶动力学，允许用户控制、接触交互，并能直接绑定到网格、点云和 3D 高斯。对于规定骨骼动画，引入自监督互补目标来学习互补弹性响应，从而在运行时免除了强制执行互补约束。\n- **实验细节说明**: 摘要未提供具体的实验数据集名称和具体的性能数字，仅定性描述了实现了跨形状泛化、实时降阶模拟以及可控、碰撞感知和骨骼互补动画的应用。\n- **领域归类**: [计算机图形学, 3D动画, 物理模拟, 神经渲染]\n---\n\n### 22. Breaking Diffusion: Parallel Reasoning with Draft Refinement (打破扩散：基于草稿细化的并行推理)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26542)\n- **研究任务**: 改进离散扩散模型在复杂推理任务中的表现，解决重复扩散去噪不能保证单个合理的 token 更新能共同形成更好答案的问题。\n- **核心亮点**: 提出草稿细化语言模型（DRLMs），使用单个去噪器提出并行修订并评估候选草稿；训练去噪器从均匀损坏的草稿中重建每个 token；通过一次前向传播计算空腔能量（cavity energy），无需额外评分模型；每轮提出修订，仅在能量更低时保留。\n- **深度解析**: 传统扩散模型的逆向转移在推理中效率受限。DRLM 利用已知的损坏过程，纠正自 token 证据以估计 token 被提示和剩余草稿支持的程度。这种方法将完整的草稿并行细化作为逆向扩散的有效替代方案，在 Countdown、Sudoku-Extreme 和 Maze-Hard 等任务上超越了自回归和离散扩散基线。\n- **实验细节说明**: 摘要提供了具体数字：模型参数量为 6M，在 Countdown-5 上达到 44.4% 的准确率，在 Sudoku-Extreme 上达到 93.9% 的准确率。摘要未提供具体的训练数据集名称。\n- **领域归类**: [自然语言处理, 复杂推理, 扩散模型, 语言模型]\n---\n\n### 23. FlowState: Execution State as Memory for Long-Horizon LLM Agents (FlowState：将执行状态作为长视野 LLM 智能体的记忆)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34565)\n- **研究任务**: 解决长视野任务中 LLM 智能体保留完整历史导致上下文成本高，压缩历史又容易丢失后续所需细节的问题。\n- **核心亮点**: 提出 FlowState，将执行状态视为可跨请求保留和重访的记忆；保留语义类型化的状态节点、关系及对原始工具观察的引用；包含增量状态更新（ISU）和渐进状态访问（PSA）机制，实现持久保留与按需访问的分离。\n- **深度解析**: FlowState 将当前决策与历史信息的重用统一起来。ISU 基于新输入和反馈维护当前状态，PSA 在推理过程中根据需要渐进地揭示历史状态和支持证据。这使得智能体能够根据新信息重新评估先前的决策并指导后续动作，有效平衡了上下文成本与细节保留。\n- **实验细节说明**: 摘要提供了具体数字和模型信息：使用 DeepSeek-V4-Flash 模型，在 MemoryArena 上平均成功率提升 4.55 个百分点，在 τ^3-Bench 上平均通过率提升 13.95 个百分点，总 token 消耗分别减少 43.2% 和 40.6%。\n- **领域归类**: [自然语言处理, LLM 智能体, 长视野任务, 记忆机制]\n---\n\n### 24. From Short Clips to Real-Time Streams: Identity-Aware Supervision and Context-Efficient Generation for Video Face Swapping (从短视频到实时流：用于视频换脸的身份感知监督与上下文高效生成)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26681)\n- **研究任务**: 在长视频流中实现高保真、实时的参考引导视频换脸，同时保持目标视频的其他属性和运动。\n- **核心亮点**: 提出 StreamingSwap 框架；开发 Joint Rec-ID Loss 平衡显式身份监督和潜在重建；通过 Face-RoI Generation 和 Short-Context Rollout Training 减少空间 token 和缩短时间上下文；引入 HumanFaceVid 数据集。\n- **深度解析**: 针对流匹配监督对身份变化敏感度弱的问题，设计了随噪声水平平衡的联合损失。利用目标视频已提供的未编辑属性和时间动态，通过面部感兴趣区域生成和短上下文展开训练来提高生成效率。该方法在单张 GPU 上实现了实时生成，并能稳定处理长视频。\n- **实验细节说明**: 摘要提供了具体数字和数据集细节：HumanFaceVid 包含 1000 小时电影训练数据，以及 200 个短视频和 200 个长视频评估集；在单张 NVIDIA RTX 4090 GPU 上实现 20 FPS 的实时生成，支持长达 10 分钟的视频稳定生成。\n- **领域归类**: [计算机视觉, 视频生成, 视频换脸, 流匹配]\n---\n\n### 25. Event-STVG: Spatio-Temporal Video Grounding for Long-Form Event Reasoning (Event-STVG：面向长时事件推理的时空视频定位)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22444)\n- **研究任务**: 将时空视频定位（STVG）从基于实例描述的局部定位转向事件级推理，统一长时上下文、重复事件推理、事件定位、角色推断和多目标定位。\n- **核心亮点**: 引入 Event-STVG 任务；构建包含足球及其他 7 个领域的大规模基准测试；揭示了现有 MLLM 在该任务上的巨大困难，特别是在重复事件混淆和空间定位瓶颈方面。\n- **深度解析**: 现有的 STVG 基准主要关注通过特定实例描述来定位目标，与多模态大语言模型（MLLMs）日益强调的长时推理脱节。Event-STVG 要求模型在空间和时间上联合推理复杂事件。实验表明，即使是最强的模型在长时跨度上也表现不佳，证明了该任务对视觉理解的巨大挑战。\n- **实验细节说明**: 摘要提供了具体数字：基准测试包含 4,016 个标注事件，涵盖足球及 7 个其他领域；最强模型在 10 分钟的时间跨度上仅达到 5.4% 的 m-vIoU。摘要未提供其他具体的性能对比数字。\n- **领域归类**: [计算机视觉, 多模态大语言模型, 时空视频定位, 长时推理]\n---\n\n### 26. Epi: Towards a Persistent, Self-Improving Agent for Autonomous Research (Epi：迈向持久且自我改进的自主研究智能体)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24944)\n- **研究任务**: 开发能够跨模型会话维持研究并通过积累的经验进化其方法的自主研究智能体。\n- **核心亮点**: 提出 Épi，结合持久研究历史、分层记忆、分支和独立审查；实验跨会话运行并由固定验证器评估；提出 Épi-turbo 轻量级配置用于算法编码，支持人类理解。\n- **深度解析**: Épi 通过维护研究连续性、从实验中学习以及探索/重访替代方法来进化。它不仅在数学和数值界限上取得了多项创纪录的结果，还通过计算机辅助证明解决了特定的数学猜想。Épi-turbo 进一步将其扩展到算法编码领域，在保持较低模型成本的同时提升了基准分数。\n- **实验细节说明**: 摘要提供了大量具体数字：产生 120 项记录（20个数值界限，100个构造），n-queens 常数区间缩小约 84 倍，quartic Feigenbaum 吸引子维度严格区间缩小超 360 万倍；证明了 Cohn-Elkies 界限在 10 和 11 维不尖锐；证明了 Tuza 猜想（特定条件下的 split graphs）；Épi-turbo 在 30 个 FrontierOR 任务上比 Codex 总分高 5.4%，模型成本为 64%。摘要未提供具体的训练数据集名称。\n- **领域归类**: [人工智能, 自主智能体, 自动化研究, 强化学习]\n---\n\n### 27. DecisionPivot: A Diagnostic Benchmark for Decision Models in LLM Systems (DecisionPivot：LLM 系统中决策模型的诊断基准)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28522)\n- **研究任务**: 解决仅靠项目准确率无法确定决策模型是否在受控变化中做出正确决策或为其预测分配可靠置信度的问题。\n- **核心亮点**: 引入 DecisionPivot 诊断基准，包含核心轨道和参考轨道；评估了 40 个决策模型和 14 个通用模型；通过对比组评估项目准确率、概率排序、校准和经验选择性覆盖率，揭示聚合分数掩盖的显著差异。\n- **深度解析**: 该基准通过精细的对比组设计，暴露了模型在概率排序与决策正确性之间的差距，以及高置信度预测可靠性的差异。研究表明，具有相似项目准确率的模型在对比组准确率、校准和选择性覆盖率上可能存在巨大鸿沟，为 LLM 系统中的决策模型提供了更细粒度的诊断。\n- **实验细节说明**: 摘要提供了大量具体数字：包含 48 个任务、40,033 个项目、7 种决策角色；核心轨道 7,800 个项目（13个家族），参考轨道 32,233 个项目（35个公共测试集）；评估了 40 个决策模型和 14 个通用模型；两个 27B 模型对比组准确率分别为 70.1% 和 44.2%（参考轨道差 2.6 分）；Perplexity Decider 排序正确率 92.3%，两者都答对仅 74.1%；GLM-5.3 在 1,296 个项目子集上高推理设置 93.5%，低 effort 81.5%。\n- **领域归类**: [自然语言处理, 大语言模型, 模型评估, 决策模型]\n---\n\n### 28. EdgeKernelBench: Unified LLM-Driven Kernel Generation for Edge Backends (EdgeKernelBench：用于边缘后端的统一 LLM 驱动内核生成)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24648)\n- **研究任务**: 系统研究 LLM 在多样化边缘后端（硬件异构、软件栈碎片化、资源预算紧张）上的内核生成能力。\n- **核心亮点**: 引入 EdgeKernelBench，结合统一 IR 部署框架和边缘工作负载的分层基准；提出分层边缘内核智能体（LEKA），通过分层 IR 组织优化，弥补功能正确性与性能提升之间的差距。\n- **深度解析**: 边缘部署与服务器 GPU 面临不同挑战。EdgeKernelBench 的统一 IR 捕获可重用的计算、调度和内存决策。实验表明，最佳模型单次生成的功能正确率较高，但性能达标率极低，说明功能正确性不能一致转化为性能提升。LEKA 通过分层优化显著提升了内核的性能达标率。\n- **实验细节说明**: 摘要提供了具体数字和工具信息：使用 TVM 作为参考编译器；最佳模型单次生成 Correct@1 为 64.5%，Fast@1.0 为 25.5%；LEKA 在智能体评估子集上 Fast@1.0 达到 43.5%（直接生成为 13.0%，Claude Code 为 26.1%）。摘要未提供具体的边缘硬件型号或详细的数据集名称。\n- **领域归类**: [计算机系统, 边缘计算, 编译器优化, 大语言模型应用]\n---\n\n### 29. Good Judgment, Bad Advice: Decision-Model Controllers Raise Agent Cost Without Improving Success (好的判断，坏的建议：决策模型控制器增加智能体成本而未提高成功率)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24649)\n- **研究任务**: 研究在智能体脚手架中，将小决策委托给更便宜的决策模型，是否能在不降低性能的情况下降低终端智能体的成本。\n- **核心亮点**: 在 Terminal-Bench 上进行预定研究，固定智能体循环，仅改变控制器（无、确定性规则、小 LLM、Jev、安慰剂）；发现 Jev 提高了每次尝试的成本但未改变通过率；Jev 排序更好但校准差，导致无效干预。\n- **深度解析**: 研究表明，信息丰富的决策信号并未转化为有用的干预。虽然决策模型 Jev 能够较好地排序完成请求，但其概率校准不佳，导致它频繁要求智能体验证已经正确的工作，从而增加了成本而没有提高成功率。这揭示了在智能体系统中引入决策控制器时，校准和干预有效性的重要性。\n- **实验细节说明**: 摘要提供了具体数字：在 Terminal-Bench 2.1 的 21 个保留任务（315 次试验）中，Jev 使每次尝试成本增加 19%（几何平均比率 1.19，95% CI 1.02-1.36），通过率保持 73.0% 不变；Jev 比小 LLM 便宜（比率 0.81），比安慰剂贵 22%；Jev 的 AUROC 为 0.78（规则 0.62，小 LLM 0.60）；平均完成概率 0.50 时实际通过率为 87%。\n- **领域归类**: [自然语言处理, LLM 智能体, 决策模型, 成本优化]\n---\n\n### 30. EAU: Environment-Agent-User Co-evolution for Training User-Centric Agents (EAU：用于训练以用户为中心的智能体的环境-智能体-用户协同进化)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16523)\n- **研究任务**: 解决训练 LLM 智能体在多轮交互中与用户互动时，由于用户模拟器和环境的不稳定性导致学习信号不稳定的问题。\n- **核心亮点**: 提出 EAU 元智能体框架，实现环境-智能体-用户协同进化；在训练期间监控轨迹和统计信息，诊断失败并提出针对性修改；验证的修改可热插拔到正在运行的训练中，并跨运行持久化。\n- **深度解析**: 与以往通过奖励塑造或更密集的监督来解决不稳定性并将组件视为固定的方法不同，EAU 允许训练设置与策略共同进化。它通过用户和环境动态的可编辑符号表示来实现这一过程，同时智能体保持为使用 RL 优化的神经 LLM。这种方法显著提升了多轮 RL 的训练效果和任务完成率。\n- **实验细节说明**: 摘要提供了具体数字：在三个交互式智能体基准和两个骨干模型上，EAU 总分比最强基线提高 14.7-15.0%，在 ColBench 上的成功任务完成率最高提高 36.7%。摘要未提供具体的训练数据集名称或详细的硬件配置。\n- **领域归类**: [自然语言处理, LLM 智能体, 强化学习, 多轮交互]\n---\n\n### 31. Unsupervised Tool Evolution for Coding Agents in Data-Lake Analytics (数据湖分析中代码智能体的无监督工具进化)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27327)\n- **研究任务**: 解决代码智能体在数据湖分析中每次回答后丢弃工作、重复从头开始的问题，旨在无监督（无真实标签）设置下实现跨任务的工具自动构建与优化（工具进化）。\n- **核心亮点**: 提出 TEAL 框架，通过 Explorer 和 Critic 两个智能体互补提出工具，Worker 智能体在无标签情况下直接采用；引入 TEAL-Q 生成合成问题；在严格步数预算下显著提升 Worker 性能；证明更紧的预算能提供更好的进化反馈，且合成问题进化的工具库与真实问题效果相当。\n- **深度解析**: 针对数据湖问答缺乏专家标签的痛点，TEAL 设计了无监督的工具进化机制。Explorer 从数据湖本身、Critic 从 Worker 轨迹中提出工具，并严格验证 Worker 是否直接采用以及答案变化是否有轨迹证据支持。实验在 KramaBench 和 LakeQA 上进行，使用 4 种 Worker LLM。在 10 或 15 步的紧凑预算下，TEAL 提升了所有 Worker 的表现（例如 Sonnet-5 在 15 步时 KramaBench 提升 9.3 分，LakeQA 提升 21.7 分）。此外，发现 20 步预算进化的库在 30 步部署时得分 68.3，优于基线（59.6）和直接在 30 步进化的库（64.2），且合成问题与真实问题进化效果相当。\n- **领域归类**: [智能体, 数据分析, 工具进化]\n---\n\n### 32. HarnessRL: Co-Evolving Policies with a Just-in-Time Training Harness for Open-Ended RL (HarnessRL：用于开放式强化学习的即时训练框架与策略协同进化)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26426)\n- **研究任务**: 解决基于规则的强化学习（RL）在开放式生成任务中，随着训练推进奖励变得无效（非判别性奖励和虚假奖励）的问题。\n- **核心亮点**: 提出 HarnessRL 训练时框架，与策略协同进化；包含任务采样、 rollout 引导和规则标准三个接口；维护训练时记忆，通过即时批评家循环验证更新；构建了包含五个领域的 Rubric-Mix-10k 训练和评估套件。\n- **深度解析**: 识别了开放式 RL 中奖励失效的两种模式，根源在于训练配置固定。HarnessRL 通过维护训练时记忆，利用任务内历史和跨任务证据，将奖励失败归因到具体接口并更新。采用提议者和即时批评家循环，仅在冻结策略上测量效果后才接受更新。在 Rubric-Mix-10k（涵盖医疗、科学、写作、角色扮演和指令遵循）上，HarnessRL 在 4B 和 9B 模型上比最强基线高出 2.8 到 3.1 分，并将达到最佳检查点的训练步数减少近一半。\n- **领域归类**: [强化学习, 大语言模型, 开放式生成]\n---\n\n### 33. Harness Self-Evolution for Long-Horizon Terminal Agents (面向长视界终端智能体的框架自进化)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27435)\n- **研究任务**: 解决长视界终端智能体在重复运行中由于随机错误传播导致能力与可靠执行之间存在差距的问题，在模型权重固定的情况下迭代改进智能体框架（harness）。\n- **核心亮点**: 提出 RiseHarness 框架，专注于翻转在相同配置下既有成功又有失败的任务；结合智能体轨迹和运行时监控器的内部框架痕迹进行分析；通过“框架手册”将证据与框架行为和源代码链接；搜索其他框架的相关实现并作为设计参考进行改编；经过行为检查和重复任务评估的循环迭代。\n- **深度解析**: 长视界任务中，单次成功不代表稳定成功。RiseHarness 在不改变模型权重的情况下，通过分析成功和失败运行的差异来改进框架。它利用运行时监控器捕获内部痕迹，结合“框架手册”定位跨任务共享机制中的 recurring problems。然后从其他框架中寻找参考实现进行适配，候选更改需通过行为检查和重复评估，有增益的版本进入下一轮迭代。该方法将不同框架的合适机制整合到单一框架中，并以特定模型为单元进行框架适配研究。摘要未提供具体的实验数据集名称和具体的性能提升数字。\n- **领域归类**: [智能体, 框架优化, 长视界任务]\n---\n\n### 34. Large Flow Language Models (大型流式语言模型)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28559)\n- **研究任务**: 解决连续流式语言模型在十亿参数规模下构建技术尚不成熟的问题，实现高效、高性能的并行生成。\n- **核心亮点**: 提出 Lafa（大型流式语言模型），扩展到 80 亿参数，数据高效；采用分块流模型，前缀使用因果注意力，块内使用双向异步流；支持前缀缓存和分块并行解码以实现快速推理；训练数据少于 300 亿 token；利用多 token 预测效应保留或提升预训练自回归能力，并用于自投机解码。\n- **深度解析**: Lafa 是一种分块流模型，结合了因果注意力（前缀）和双向异步流（块内），使其能够适应预训练的自回归（AR）模型进行高效训练，并通过前缀缓存和分块并行解码实现快速推理。在 0.5B、7B 和 8B 规模上使用不到 300 亿 token 进行训练，比之前的扩散模型更高效。在指令遵循、推理和编码任务上，其质量匹配或超越 AR 模型。关键发现是流式训练通过多 token 预测效应保留甚至提升了 AR 能力，作者利用此特性设计了自投机解码方案（在单模型内自回归验证流式草稿），在相当的质量下实现了 AR 模型 2.54 倍的吞吐量，优于多 token 预测和离散扩散方法。\n- **领域归类**: [大语言模型, 连续流模型, 并行生成, 推理加速]\n---\n\n### 35. Evaluating Agentic Capabilities Before Post-Training: An End-to-End Approach (在后训练前评估智能体能力：一种端到端的方法)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19425)\n- **研究任务**: 解决在预训练阶段难以评估大语言模型智能体能力的问题，提供一种轻量级框架来激发和评估预训练基础模型在端到端任务上的智能体行为。\n- **核心亮点**: 提出 ASAP（预训练评估的智能体框架适配）框架；保留补全接口，通过结构化轨迹延续、短参考前缀和最小恢复机制来适配现有智能体框架；在软件工程和深度研究基准上产生具有区分度的端到端性能；暴露模型生成的执行轨迹，用于分析预训练阶段智能体相关能力的变化。\n- **深度解析**: 现有的预训练评估方法（静态轨迹或似然代理）难以反映基础模型在交互环境中的真实行为。ASAP 不将基础模型转换为聊天式智能体，而是保留其补全接口，通过结构化轨迹延续等轻量级机制适配现有框架。在软件工程和深度研究基准上，ASAP 能够区分不同基础模型和预训练检查点的端到端性能。更重要的是，它暴露了执行轨迹，使得研究人员能够分析模型在探索、编辑、测试、恢复和任务完成等方面的行为模式，从而了解预训练期间智能体能力的演变以及后训练后执行模式的差异。摘要未提供具体的实验数据集名称和具体的性能提升数字。\n- **领域归类**: [大语言模型, 预训练评估, 智能体能力]\n---\n\n### 36. More Memory, Worse Agents: Error Reproduction and Anti-Persistence in LLM Agents (更多记忆，更差智能体：大语言模型智能体中的错误复制与反持久化)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27406)\n- **研究任务**: 解决大语言模型智能体在外部记忆中存储推断规则、摘要和技能时，错误通过检索和重用传播并自我复制（错误复制）的问题。\n- **核心亮点**: 提出“错误复制”概念，即错误通过抽象、执行和再抽象的循环被重新生成；提出“反持久化”（Anti-Persistence）记忆设计，累积轨迹和结果，但按需重建特定任务的指导，并在执行后丢弃，防止其作为存储对象被直接重用。\n- **深度解析**: 智能体利用外部记忆自我改进时，如果存储了推断出的抽象知识（如规则、摘要），其中的错误会在后续决策中传播，并影响新的执行轨迹，进而产生新的错误抽象，形成“错误复制”循环。为打破此循环，作者提出“反持久化”设计：只累积原始轨迹和结果，通过自适应选择器利用先验结果按需合成任务指导，执行后立即丢弃该指导，避免错误抽象的持久化存储。在不同基准和骨干模型上的评估表明，反持久化实现了更高的整体保留成功率，并在评估的记忆设计中保持了最低的平均 LLM 调用成本，证明了将经验累积与抽象持久化分离的有效性。摘要未提供具体的实验数据集名称和具体的性能提升数字。\n- **领域归类**: [智能体, 记忆机制, 错误分析]\n---\n\n### 37. On the Fragility of Tasks under Composition: Implicit Budgeting in Language Models (任务组合下的脆弱性：语言模型中的隐式预算)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27190)\n- **研究任务**: 研究现代语言模型在单个提示中处理多个组合任务时，错误率显著增加的根本局限性。\n- **核心亮点**: 发现模型在组合任务下的退化不能仅用独立错误累积来解释；指出这是由于“隐式思考预算”导致的，即在组合下模型为每个任务分配的 token 数量大幅减少；任务在孤立状态下需要较长解决轨迹时，在组合下更脆弱；通过根据脆弱性对任务分组，可以操纵隐式预算，在保持准确率的同时减少 43% 的 token 使用量。\n- **深度解析**: 当多个任务组合在一个提示中时，即使模型能单独可靠地解决每个任务，其表现也会大幅下降。研究发现，这是因为模型存在“隐式思考预算”，在组合任务中分配给每个任务的 token 显著减少（即使总序列远在上下文窗口内）。在孤立状态下，非脆弱任务获得了超出所需的推理 token（浪费算力），而需要长轨迹的脆弱任务在组合时因预算不足而更容易出错。在开源模型和 Claude Opus 5 上均验证了此现象。通过将任务按脆弱性分组来操纵隐式预算，可以在数学和语言任务中将 token 使用量减少 43%，同时保持准确率。\n- **领域归类**: [大语言模型, 推理能力, 任务组合, 计算效率]\n---\n\n### 38. WinARDet: Compressed Window Auto-Regression for Long-Horizon Vision-Language Grounding (WinARDet：用于长视界视觉语言定位的压缩窗口自回归)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19419)\n- **研究任务**: 解决基于多模态大语言模型（MLLM）的检测器在密集场景中进行视觉语言定位时，陷入重复输出相同边界框的循环问题。\n- **核心亮点**: 将失败归因于“历史答案注意力接管”；提出压缩窗口自回归（WinAR）机制，将长答案序列划分为连续的生成窗口，仅在当前窗口进行完整的 token 级自回归，将之前的窗口压缩为固定数量的潜在 token 以条件化后续解码；在 RSDense 数据集上显著提升 F1 分数并降低冗余率。\n- **深度解析**: 在密集场景的视觉语言定位中，全历史自回归会导致重复的坐标 token 吸引过多注意力，挤占关注新视觉证据的“注意力汇聚”，导致模型陷入重复框循环。WinAR 机制通过将长序列分块，限制完整自回归仅在最新窗口进行，而将历史窗口压缩为潜在 token。这减少了对原始历史坐标的重复暴露，同时保留了跨窗口的依赖关系。在包含 200 到 2000 个对象的 RSDense 数据集上，WinARDet 将 RexOmni 的 F1 分数（IoU=0.5）从 32.16 提升至 39.36，冗余率从 35.48% 降至 13.00%。该方法还泛化到并行框解码和多边形生成等不同解码策略和输出格式。\n- **领域归类**: [多模态大模型, 视觉语言定位, 自回归优化, 密集场景检测]\n---\n\n### 39. HybridResearcher: Bridging the Structured-Unstructured Boundary for Deep Research Agents (HybridResearcher：跨越结构化与非结构化边界以构建深度研究智能体)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24899)\n- **研究任务**: 解决大语言模型智能体在处理需要跨越异构来源（如结构化数据库和非结构化网络数据）的真实世界分析问题时表现不佳的问题。\n- **核心亮点**: 提出 HybridResearcher，一个 4B 的智能体，专门训练用于跨越结构化和非结构化边界桥接证据；通过从单源任务出发并围绕桥接实体构建缺失源，合成跨源桥接轨迹；使用严格的结构门控确保数据需要真正的跨源相互依赖；采用监督微调加强化学习进行训练。\n- **深度解析**: 现实问题通常需要结合内部数据库（结构化）和网络搜索（非结构化）的证据，现有前沿智能体在此类跨源推理上表现挣扎。HybridResearcher 是一个 4B 参数模型，通过合成跨源桥接轨迹进行训练：从验证过的单源任务（如 text-to-SQL 或 web search）开始，利用种子输出中的桥接实体虚构缺失的源，并通过严格门控确保必须跨源才能解答。训练采用 SFT 后接 RL。在 HybridDeepResearch 基准上，它比基础模型 Qwen3.5-4B 的 pass@8 提高了 30.0 分，并超越了规模大得多的 Qwen3.5-397B-A17B 8.3 分。同时，它在 BrowseComp 和 BrowseComp-Plus 等单源基准上也优于基础模型，证明了复杂的跨源推理可以直接教给小模型而不会引发灾难性遗忘。\n- **领域归类**: [智能体, 深度研究, 跨源推理, 强化学习]\n---\n\n### 40. PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level Physical Measurements (PVBench：通过对象级物理测量量化视频生成中的物理合理性)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26711)\n- **研究任务**: 解决现有视频生成模型在物理合理性（如几何、运动学、动力学和守恒定律）方面缺乏定量评估标准的问题。\n- **核心亮点**: 提出 PVBench，一个物理视频基准，通过 7 个领域的 46 个维度定量测量生成视频的物理合理性；包含 600 个精心制作的提示（30% 涉及物理具身智能体）；为具有挑战性的物理维度配备专门的视觉模型，导出可验证的、基于物理的测量（如 6D 姿态、度量尺度、表面法线、运动学和数值守恒定律残差）；支持文生视频和图生视频，并验证了自动指标与人类判断的一致性。\n- **深度解析**: 视频生成模型虽然视觉效果好，但往往违反物理定律。PVBench 从 7 个领域（指令与语义保真度、行为与因果一致性、感知与时间质量、几何与空间一致性、材料属性与场状态、运动学与时空持久性、带守恒定律的机械合理性）的 46 个维度进行定量评估。它包含 600 个提示，其中 30% 涉及机器人、人形等具身智能体。不同于依赖粗粒度 VLM 判断的现有基准，PVBench 为复杂的物理维度配备了专门的视觉模型，提取对象级 6D 姿态、度量尺度、表面法线、运动学和守恒定律残数等客观物理测量，避免了纯主观评分。摘要未提供具体评估的模型名称和具体的得分数字。\n- **领域归类**: [视频生成, 物理合理性, 评估基准, 具身智能]\n---\n\n### 41. Muse Glimmer 30B: An On-Device Agentic Model (Muse Glimmer 30B：一款端侧智能体模型)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24628)\n- **研究任务**: 开发一款专为消费级硬件上的自主智能体任务设计的开源 30B 参数因果语言模型。\n- **核心亮点**: 集成多步推理、可靠的工具使用和故障恢复能力；支持文本和图像输入并输出文本；在超过 100 种语言的数据上训练；量化至约 4-bit 精度以实现单 GPU 高效推理；在工具使用、多步规划和智能体任务完成等基准测试中，性能超越了同尺寸的 Gemma4-31B 和 Qwen3.6-27B。\n- **深度解析**: 该模型的核心目标是摆脱对云基础设施的依赖，让强大的 AI 智能体能够在本地消费级设备上运行。通过 4-bit 量化技术，Muse Glimmer 在保持 30B 参数规模的同时，实现了单 GPU 推理的效率。模型采用 Apache 2.0 许可证开源，旨在推动具备能力且安全的本地 AI 智能体的开源生态发展。\n- **领域归类**: [大语言模型, 智能体, 端侧部署, 多模态]\n---\n\n### 42. λ_0: Scaling Open-World Egocentric Human Data for Humanoid Loco-Manipulation (λ_0：扩展开放世界自我中心人类数据以实现人形机器人运动操作)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18950)\n- **研究任务**: 解决人形机器人运动操作（loco-manipulation）中大规模收集机器人演示成本高昂的问题，利用人类演示作为可扩展的替代方案。\n- **核心亮点**: 提出包含 500 小时开放世界人类运动操作数据的 HumanVerse 数据集；设计了人类到人形机器人的流水线，通过离线优化动作参考和控制器输入来减少末端执行器误差；开发了人形基础模型 λ_0，在 SIMPLE 基准上达到 90.0% 成功率，在真实世界任务中达到 62.5% 成功率。\n- **深度解析**: 针对人类与机器人具身差异及控制器动态带来的执行误差，研究团队设计了特定的视角对齐和手臂外观匹配流水线。λ_0 模型利用与机器人对齐的人类演示进行中训练，证明了增加全身人类数据能持续改善下游任务进展。该方法在无需目标任务机器人演示的情况下，实现了对 Unitree G1 机器人的零样本迁移。\n- **领域归类**: [具身智能, 机器人学, 计算机视觉, 基础模型]\n---\n\n### 43. Beyond Compilation: Evaluating Faithful Natural-Language-to-Lean Statement Formalization (超越编译：评估忠实的自然语言到 Lean 语句形式化)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.31002)\n- **研究任务**: 评估在自然语言到 Lean 语句的自动形式化中，Lean 编译通过是否高估了生成声明的语义忠实度。\n- **核心亮点**: 提出新的评估标准，要求 Lean 编译通过且两个不同模型家族的 LLM 评判者达成一致；在独立随机审计中，该标准与人类多数意见在 91.5% 的情况下保持一致；发现工具增强的智能体虽然编译了 87.2% 的语句，但仅有 57.7% 被接受，其中 23.8 个百分点是真实的翻译错误。\n- **深度解析**: Lean 编译器只能验证类型正确性，无法检查语义意图。研究表明，现有系统（包括 GPT-6 Astra 和 Claude Opus 5.5 等）在形式化时存在真实的翻译错误和评判误差。工具消融实验显示，Lean 反馈驱动了大部分编译收益，但近一半的收益未能通过语义标准。该研究揭示了单纯依赖编译通过率来评估形式化质量的局限性。\n- **领域归类**: [形式化验证, 代码生成, LLM 评估, 定理证明]\n---\n\n### 44. Training the Whole Agent, Not Just the Model (训练整个智能体，而不仅仅是模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28069)\n- **研究任务**: 解决代码智能体训练中通常只更新策略而保持环境（harness）固定的问题，提出在强化学习过程中同时训练策略和适应环境。\n- **核心亮点**: 提出 HarnessAdapt-RL 方法；针对有缺陷的修复策略，由冻结的教师生成特定任务的机制级技能；针对跨任务反复出现的交互问题，由另一个教师模型进化工具和钩子（hooks）；在 9B 基础模型上，SWE-bench Verified、Multilingual 和 Pro 的 pass@1 分别比 GRPO 提高了 9.8、12.6 和 6.4 个百分点。\n- **深度解析**: 该研究强调智能体训练应是模型与环境的协同进化。机制级技能在评估时移除后收益依然存在，而进化的工具和钩子在部署时移除会导致性能下降（最多 7.7 个百分点）。最终产出的是训练好的策略与进化的工具/钩子组成的“模型-环境对”，证明了在部署时保留这些进化的环境组件对维持性能至关重要。\n- **领域归类**: [强化学习, 代码智能体, 软件工程, 智能体训练]\n---\n\n### 45. OverSeer: Multi-Agent World Models Beyond What Agents See (OverSeer：超越智能体视角的多智能体世界模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28554)\n- **研究任务**: 解决将视频世界模型扩展到多智能体时的困难，即需要生成多个在时间和智能体间保持一致的特定智能体视频流。\n- **核心亮点**: 引入 OverSeer，通过辅助相机视角增强自我中心智能体视角；固定辅助视角在空间中作为世界中心表示的代理；使用 delta-VAE 对辅助视角进行高效压缩（仅编码相对于静态参考图像的变化），大幅减少 token 数量；在 Minecraft 和 Doom 中提高了世界和智能体一致性。\n- **深度解析**: 智能体视角的微小位置变化会导致视角完全改变，而固定的辅助视角直接映射到世界状态的局部变化，有助于维持多智能体间的一致性。delta-VAE 利用辅助视角的冗余和半静态性质，显著降低了计算开销。真实世界多相机捕获的定性结果表明，该方法不局限于游戏引擎，具有更广泛的适用性。\n- **领域归类**: [世界模型, 多智能体系统, 视频生成, 计算机视觉]\n---\n\n### 46. OmniCam: Omni-Camera Trajectory Generation via Geometry-Grounded Pose Token Learning (OmniCam：通过几何基础的位姿 Token 学习实现全相机轨迹生成)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09513)\n- **研究任务**: 从单一全景图和文本轨迹描述中生成相机位姿序列，用于视频生成、场景重建和机器人感知。\n- **核心亮点**: 提出 OmniCam 自回归模型；几何基础的位姿 Token 学习包含全景点云编码器、混合绝对旋转与相对平移 Token 化、分离的几何与语义条件流及显式 3D 目标锚点；构建 OmniCaT 数据集（包含 267,700 条轨迹）；相比 GenDoP，轨迹误差降低 28-47%，碰撞率降低 65.8%。\n- **深度解析**: 生成相机轨迹需要同时理解场景几何和目标感知构图。OmniCam 通过结合全景几何上下文和显式 3D 目标锚点，解决了语言到相机轨迹生成中的几何和目标对齐问题。组件消融实验支持了几何和目标感知条件的有效性，下游实验验证了其在相机控制视频生成和机器人主动感知中的应用潜力。\n- **领域归类**: [计算机视觉, 视频生成, 机器人感知, 3D 几何]\n---\n\n### 47. Multimodal Reranking Is a System One Decision (多模态重排是一种系统一决策)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28435)\n- **研究任务**: 提出通用视觉语言模型（VLM）可以通过“系统一”决策（不生成文本，直接输出概率）充当多模态重排器，并通过决策微调提升重排效果。\n- **核心亮点**: 向 VLM 提出关于第一阶段检索器 top-16 候选项的单选题，通过一次前向传播读取标签概率进行排序；在 MMEB-V2 图像检索中，单选题比针对每个候选项的判断题 hit@1 高出 5.4 到 7.3；零样本 Qwen3.8-27B 在所有三个基准上超越了有监督的 Qwen3-VL-Reranker-2B，并在每个基准上接近 Reranker-8B（差距 1.6 分以内）。\n- **深度解析**: 该研究挑战了多模态重排器必须是专用模型的观点。将重排视为状态（查询和候选）到选项（候选）概率映射的“系统一”决策。研究表明，通用大模型通过简单的选择题形式和决策微调，可以在不生成文本的情况下实现高效且强大的多模态重排，且延迟仅为专用模型的 1.1 到 1.5 倍。\n- **领域归类**: [信息检索, 多模态学习, 视觉语言模型, 重排算法]\n---\n\n### 48. EMBER: Predicting TCR-pMHC Binding Without a Docked Complex (EMBER：无需对接复合物预测 TCR-pMHC 结合)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27334)\n- **研究任务**: 提出一种基于结构的 TCR-pMHC（T细胞受体-肽-主要组织相容性复合体）结合预测框架，消除对预测对接复合物的依赖及由此产生的放置误差。\n- **核心亮点**: 独立折叠 TCR 和 pMHC，将其编码为 SE(3) 不变的残基图，并在不构建共享坐标系的情况下比较其学习到的表示；计算上，预处理复杂度为 O(N+M)，而基于复合物的预测器需要 O(NM)；在 6 个重新训练的基线和 4 种折叠工具下，EMBER 在所有指标上均排名第一（micro-AUROC 提升 0.9-14.4%，micro-AUPRC 提升 18.5-25.3%，MCC 提升 10.6-24.1%）。\n- **深度解析**: 传统方法依赖共折叠复合物结构，导致下游特征继承结构预测工具的偏差。EMBER 通过独立折叠和 SE(3) 不变图表示，从根本上避免了相对位姿放置误差的传播，同时大幅降低了计算复杂度。实验表明，该方法不仅提高了预测精度，还使排名在跨折叠工具时更加稳定（提升高达 85%）。\n- **领域归类**: [计算生物学, 结构预测, 图神经网络, 药物发现]\n---\n\n### 49. Slot-JEPA: Object-Structured Prediction Interfaces for Latent World Models (Slot-JEPA：潜在世界模型的物体结构化预测接口)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28074)\n- **研究任务**: 解决联合嵌入预测架构（JEPA）中密集 patch 表示向下游预测器暴露冗余接口的问题，提供可重用的物体结构化接口。\n- **核心亮点**: 提出 Slot-JEPA，将密集表示分解为稳定的语义槽（slots）和随时间变化的空间掩码；提出过渡记忆预测器（TMP），使用紧凑掩码存储视觉过渡，并通过对应槽的统计信息检索有用上下文；使用非最优传输（UOT）监督掩码预测并评估候选计划；在 7 个视觉理解基准上特征可迁移，并在平面环境和机械臂规划任务中改善了目标条件规划。\n- **深度解析**: JEPA 的密集表示迫使下游预测器冗余地恢复物体结构。Slot-JEPA 通过预训练一次并冻结的分解，提供了物体级别的接口。TMP 分离了特定槽动态和共享跨槽动态。UOT 提供了与空间进展更好对齐的信号，解决了现有 JEPA 模型点对点的 l1/l2 距离对空间位移不敏感的问题，提升了规划能力。\n- **领域归类**: [世界模型, 表征学习, 机器人规划, 计算机视觉]\n---\n\n### 50. HRoPE: Homography Relative Positional Encoding (HRoPE：单应性相对位置编码)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28284)\n- **研究任务**: 将空间归纳偏置注入多视图 Transformer，提出一种感知表面的位置编码，将 patch token 显式地建立在物理表面的几何基础上。\n- **核心亮点**: 引入 HRoPE，将每个 patch 的局部几何表示为倾斜的 3D 平面（遵循经典多视图立体视觉的倾斜支撑窗口假设）；将 token 级的平面诱导单应性（homographies）作为相对变换注入注意力机制；无需真实几何，平面参数可在视图合成目标下端到端预测或从基础模型派生；在 RealEstate10K、CO3Dv2 和 DL3DV 上的新视角合成任务中一致优于评估的几何位置编码。\n- **深度解析**: 现有的几何相对位置编码主要基于传感器几何（相机视锥或深度），忽略了 token 所描绘场景区域的丰富表面几何。HRoPE 通过倾斜 3D 平面和单应性变换，为 Transformer 提供了校正透视畸变和跨视图对齐 patch 特征的几何先验，显著提升了新视角合成的性能，且无需依赖真实的几何真值。\n- **领域归类**: [计算机视觉, 3D 视觉, 新视角合成, Transformer]\n---\n\n### 51. PhysLDM: Latent Diffusion for High-Fidelity Deformable Simulation (PhysLDM：用于高保真可变形模拟的潜在扩散模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07609)\n- **研究任务**: 计算机图形学和物理AI中高保真可变形体（如高分辨率3D体积网格）的神经模拟和长时程预测。\n- **核心亮点**: 提出PhysLDM，一个统一的潜在扩散范式，用于一次性可变形模拟。核心是一个整体的时空VAE，避免标准时间压缩的“阶梯”伪影，在米级场景上实现约2.48毫米的重建精度，最高78倍token压缩。系统比较了回归和扩散方法，发现扩散更适合建模混沌的可变形动力学。在Objaverse规模数据集上纯运动学训练，可零样本泛化到未见过的OOD数据集，并支持逆问题和高级设计优化。\n- **深度解析**: 针对高分辨率3D网格长时程预测中自回归方法误差累积和直接多帧预测计算成本过高的问题，本文引入紧凑的时空潜在表示。关键洞察在于复杂可变形动力学通常是混沌的，确定性回归容易产生非物理的平均值，而扩散模型能更好地建模其分布。该方法是首个用于体积可变形动力学的高保真时空自编码器和潜在扩散范式。\n- **领域归类**: [计算机图形学, 物理AI, 生成模型, 3D视觉]\n---\n\n### 52. HumanSkill-4D: Training-Free Language Querying of Animatable Gaussian Avatars in Space and Time (HumanSkill-4D：在空间和时间上对可动画高斯虚拟形象进行免训练的语言查询)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24452)\n- **研究任务**: 虚拟形象指代分割（avatar referring segmentation），即根据语言查询从可动画高斯虚拟形象中选择区域，查询还可指定姿势或动作以选择匹配的时间间隔，用于局部编辑和动作检查。\n- **核心亮点**: 提出HumanSkill-4D，一个免训练框架，在虚拟形象间共享多模态大语言模型（MLLM）和几何算子。为每个虚拟形象构建语义记忆，将身体部位和服装类别链接到持久的高斯区域和外观描述。MLLM通过类别名称和描述进行选择；为寻找匹配间隔，将算子组合成程序，在运动记忆存储的驱动关节轨迹上检查查询条件。引入了三个基准测试，在部分分割和3D/4D指代分割中优于基线，且每个虚拟形象只需几分钟设置。\n- **深度解析**: 现有的语言高斯溅射方法面临区域模糊（相邻部位和服装难分离或间接指代）和运动模糊（细粒度动作在RGB中看起来相似）的挑战。本文通过语义记忆和运动记忆结合MLLM，实现了免训练的高效查询。算子的组合使得选择过程可追溯，并支持新的运动条件。\n- **领域归类**: [计算机视觉, 3D视觉, 多模态大模型, 虚拟人]\n---\n\n### 53. TRACE: Tracking Multimodal Clinical Trajectories for Inpatient Risk Prediction (TRACE：追踪多模态临床轨迹以进行住院患者风险预测)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25765)\n- **研究任务**: 住院患者风险预测，包括院内死亡率、延长住院时间和再入院，需要建模随时间不规则累积的异构临床证据。\n- **核心亮点**: 提出TRACE框架，以天为单位将临床事件组织成轨迹，分离与天无关的全局上下文和特定于天的局部事件（来自EHR数据、胸部X光、放射学报告和出院小结）。使用 temporal attention 编码轨迹，允许不可用的模态不发出token。引入表型引导的对比目标，在异构疾病分布下组织入院记录。在MIMIC-IV、eICU和MIMIC-III的近18万次住院记录中，TRACE在所有9个数据集-任务设置中取得最高AUROC，在8个中取得最高ACC。\n- **深度解析**: 现有多模态方法主要关注模态融合或缺失模态补偿，较少关注入院期间的时间轨迹。TRACE通过日级轨迹建模，结合temporal attention和表型引导对比学习，有效处理了临床数据的不规则性和异构性。消融实验验证了注意力掩码和对比学习，轨迹级归因可定位与风险相关的住院日和模态。\n- **领域归类**: [医疗AI, 多模态学习, 时间序列分析, 电子健康记录]\n---\n\n### 54. On the Tip of the Tongue: First-Token Cueing as a Behavioral Probe of Recall Failures in LLMs (话到嘴边：首词提示作为大语言模型回忆失败的行为探针)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23400)\n- **研究任务**: 探究大语言模型在闭卷设置下回答事实性问题出错的原因，区分是知识缺失还是回忆失败（首词召回失败）。\n- **核心亮点**: 提出首词提示（First-Token Cueing）行为探针，在响应中预填标准答案的首个token。发现模型不确定性在首个答案token处达到峰值，且仅首词就能恢复五分之一到一半的多token答案错误。在16个开源模型上，该单token纠正了英文QA中20%到50%的错误，并提高了多语言基准中所有7种语言的准确率。模型能识别自己未产生的正确开头，且比错误开头更有信心。\n- **深度解析**: 闭卷错误通常归因于知识缺失，但本文证明许多错误是首词回忆失败：模型锁定了错误的首token，但给定正确首token后能完成并识别正确答案。这表明大量事实错误定位在首个解码步骤，推理时方法（如首词提示）在此处能获得最大收益。\n- **领域归类**: [自然语言处理, 大语言模型, 模型评估与探针, 认知科学]\n---\n\n### 55. Self-Credit: Credit Assignment for Long-Horizon Agentic RL via Intra-group Rescaling (Self-Credit：通过组内重缩放实现长时程智能体强化学习的信用分配)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28388)\n- **研究任务**: 解决大语言模型智能体在长时程任务中，由于典型RLVR（强化学习验证奖励）奖励稀疏导致的信用分配困难问题。\n- **核心亮点**: 提出Self-Credit，一种端到端的智能体RL方法，通过组内重缩放的自生成信用分配，从稀疏结果奖励中创建密集的监督信号。包含三个组件：1) 策略模型生成带引用的摘要作为自生成信用；2) 组内重缩放，比较同一提示下成功和失败rollout中引用的动作，去除不应得的信用；3) 优势重加权，使用重缩放后的信用权重更新被引用轮次的优势。在BrowseComp-Plus上，Qwen3 8B和32B分别比基础模型提高37.0和36.2分，比最强基线高8.5和5.6分；在GAIA和xBench-DeepSearch上也分别比最强基线高4.9和4.7分。\n- **深度解析**: 针对长时程任务中稀疏奖励导致的信用分配难题，本文利用模型自身生成的引用作为信用信号，并通过对比同一prompt下成功与失败轨迹的组内一致性来精炼信用，去除错误归因。这种方法有效突出了关键动作的信用，在多个复杂基准上显著提升了智能体性能。\n- **领域归类**: [强化学习, 大语言模型智能体, 信用分配, 长时程任务]\n---\n\n### 56. On the Limits of Scale: Inverse Scaling in Vision-Language Models (规模的极限：视觉语言模型中的逆向缩放)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27360)\n- **研究任务**: 探究视觉语言模型（VLMs）在子任务层面是否存在逆向缩放现象，即同一模型家族中较大的模型在特定问题类别上表现不如较小的模型。\n- **核心亮点**: 评估了4个不同模型家族的19个模型，在8个多模态基准上回答了29,386个问题/模型。通过逐问题成对分析，识别出375个表现出逆向缩放的子任务-模型对组合，涉及4,342个唯一查询。发现13个子任务-数据集对在多个家族中表现出逆向缩放，表明这是任务驱动的而非模型特有的。受影响最大的领域包括多图空间推理、视觉感知和大学级别STEM知识（准确率差距超20个百分点），而图表理解相对具有抵抗力。\n- **深度解析**: 缩放定律通常认为增加模型规模会带来单调的性能提升，但本文提供了系统性证据表明VLM在子任务级别存在逆向缩放。这种现象在独立开发的架构中可复现，且由特定任务驱动。这挑战了“增加模型规模能均匀提升多模态能力”的假设，建议模型选择应具备任务感知。\n- **领域归类**: [多模态学习, 视觉语言模型, 缩放定律, 模型评估]\n---\n\n### 57. Axiomatic World Modeling for Physics Reasoning (用于物理推理的公理化世界建模)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24519)\n- **研究任务**: 解决大语言模型在物理推理中由于“建模漂移”（即模型内部公理化世界模型与问题指定的真实物理世界之间的差距，如篡改给定数量、捏造定律）导致的失败。\n- **核心亮点**: 提出公理化世界建模强化学习（RLAWM），通过在推理时惩罚推断的公理化世界模型与真实物理世界之间的偏差来优化策略。在两个层次（建模和求解）进行探测，分别由基于物理的奖励评分：建模奖励评估是否捕获真实公理化世界，求解奖励检查具体推导是否与公理化世界一致。在PhysReason上提高多达12.2分，在PHYSICS上提高5.2分。在奥林匹克级别的物理和数学上获得2.45倍增益和比最强基线高10分。\n- **深度解析**: LLM在物理推理中的错误往往不是知识或执行问题，而是世界建模问题。RLAWM将世界建模（相信自己在什么世界中推理）与推理过程（如何在该世界中推理）分离，通过两级奖励结构在训练阶段直接监督公理化世界建模，推理时无额外成本，有效提升了物理推理的准确性和泛化能力。\n- **领域归类**: [大语言模型, 物理推理, 强化学习, 世界模型]\n---\n\n### 58. World Models with Configurable Perception (具有可配置感知的世界模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27914)\n- **研究任务**: 解决现有世界模型编码器非自适应导致的状态表示容易被任务无关信息干扰的问题，实现可配置感知以进行有效的世界建模和规划。\n- **核心亮点**: 提出ConfigWM，通过任务条件状态提取实现可配置感知。利用任务的语言描述作为配置信号，引导视觉嵌入映射到任务特定状态空间，选择性保留相关信息并抑制无关变化。在该状态空间学习动作条件动态进行规划。在干扰增加的环境中，ConfigWM保持稳定，平均比最强竞争方法高出22.3%。物理量探测和干扰到干净检索的一致性增益表明其学到了鲁棒的状态表示。\n- **深度解析**: 真实世界观察包含噪声和过多无关信息。ConfigWM创新性地使用语言任务描述作为配置信号，动态调整视觉特征到状态空间的映射，从而过滤掉任务无关的干扰。这种任务条件化的感知机制使得世界模型能够在嘈杂环境中保持稳定的规划能力。\n- **领域归类**: [机器人学, 世界模型, 强化学习, 多模态学习]\n---\n\n### 59. VideoMaMa++: Temporally Consistent Video Matting via Preserve-and-Refine Token (VideoMaMa++：通过保留与细化Token实现时间一致的视频抠图)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26857)\n- **研究任务**: 解决基于扩散的视频抠图方法在处理长视频时，由于分块独立处理导致块边界处缺乏时间一致性（如边缘闪烁和透明度不连续）的问题。\n- **核心亮点**: 提出基于掩码引导的扩散抠图框架。1) RGB和掩码条件表示为独立的token流，通过完整的时空自注意力交互，自适应结合精细RGB纹理和粗糙掩码布局。2) 提出一对可学习嵌入：保留token和细化token，作为逐帧条件接口，实现滑动窗口推理，使已生成的抠图在块边界传播以保持局部时间一致性，并在每个块使用全局共享参考锚点防止长序列误差累积，无需额外训练。在标准基准和野外长视频上，在细节精度和时间一致性上均优于先前方法。\n- **深度解析**: 扩散模型在视频抠图中表现优异，但计算量大导致必须分块处理，引发时间不一致。VideoMaMa++通过解耦RGB和掩码token流，并引入保留与细化token机制，巧妙地在不增加训练成本的情况下，实现了跨块边界的局部时间一致性和全局误差控制，解决了长视频抠图的痛点。\n- **领域归类**: [计算机视觉, 视频处理, 扩散模型, 图像/视频抠图]\n---\n\n### 60. BiDex-100: A Comprehensive Benchmark for Bimanual Dexterous Manipulation Across 100+ Simulation Tasks (BiDex-100：跨越100多项仿真任务的双手灵巧操作综合基准)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25459)\n- **研究任务**: 为双手灵巧操作提供一个专门的仿真基准，以充分表征现有机器人动作模型的灵巧操作能力。\n- **核心亮点**: 提出BiDex-100，包含106个任务，沿5个能力轴组织：泛化、指令跟随、有限演示、长时程和记忆。每个任务配有域外变体以评估鲁棒性。支持两种具身，提供8,080个经过成功验证的遥操作演示，总计625万帧。在统一协议下评估了7个最新的视觉-语言-动作（VLA）模型，建立了能力特定性能、鲁棒性和数据效率的基线。\n- **深度解析**: 现有研究缺乏专门针对灵巧操作的基准。BiDex-100通过多维度的任务设计（涵盖泛化、长时程等5个轴）和域外变体，全面评估了模型在复杂双手操作中的能力。提供的大规模高质量遥操作数据集和统一的评估协议，为VLA模型在灵巧操作领域的研究提供了坚实的基础。\n- **领域归类**: [机器人学, 具身智能, 基准测试, 视觉-语言-动作模型]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [k2-fsa/OmniVoice](https://github.com/k2-fsa/OmniVoice)\n- **今日趋势**: ⭐ 15,408 stars | 🍴 2,265 forks | 📈 今日 +204 stars\n- **项目简介**: 支持600多种语言的高质量语音克隆与文本转语音（TTS）项目。\n- **核心价值**: \n  - **用途**: 提供多语言的高质量语音克隆和文本转语音（TTS）功能。\n  - **目标人群**: 需要多语言语音合成、语音克隆的开发者、研究人员或内容创作者。\n  - **技术核心**: 语音克隆技术、TTS（文本转语音）模型、多语言支持。\n  - **是否 AI/大模型相关**: 是（语音克隆和 TTS 属于 AI 深度学习领域）。\n---\n\n### [luongnv89/claude-howto](https://github.com/luongnv89/claude-howto)\n- **今日趋势**: ⭐ 42,469 stars | 🍴 5,327 forks | 📈 今日 +429 stars\n- **项目简介**: 一份以视觉和示例为驱动的 Claude Code 使用指南，涵盖从基础到高级代理的实用模板。\n- **核心价值**: \n  - **用途**: 提供 Claude Code 的可视化教程及复制粘贴模板，帮助用户快速上手和进阶。\n  - **目标人群**: 使用或希望学习 Claude Code 的开发者、AI 工程师及提示词工程师。\n  - **技术核心**: Claude Code 使用指南、Agent（智能体）开发模板、提示词工程。\n  - **是否 AI/大模型相关**: 是（直接针对大语言模型 Claude 的代码工具）。\n---\n\n### [Emily2040/seedance-2.0](https://github.com/Emily2040/seedance-2.0)\n- **今日趋势**: ⭐ 7,881 stars | 🍴 1,154 forks | 📈 今日 +33 stars\n- **项目简介**: 基于 Seedance 2.0 的四模态 AI 电影制作综合生产流水线。\n- **核心价值**: \n  - **用途**: 提供使用 Seedance 2.0 进行四模态 AI 电影制作的完整生产流水线。\n  - **目标人群**: AI 影视创作者、视频生成开发者、数字媒体艺术家。\n  - **技术核心**: 四模态 AI 视频生成、电影制作流水线、Seedance 2.0 模型应用。\n  - **是否 AI/大模型相关**: 是（涉及 AI 电影制作和多模态生成）。\n---\n\n### [github/spec-kit](https://github.com/github/spec-kit)\n- **今日趋势**: ⭐ 14
