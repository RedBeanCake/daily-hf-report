未提供具体的评估数据集、定量实验结果、基线对比方法以及系统的具体参数规模。局限性方面，摘要仅定性指出独立模型和简单结合方法的不足，未提供Innata-0自身在特定场景下失败或受限的具体证据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e48. ReWeave: Emergent Physical Task Topologies for Embodied Harness Optimization and Cross-Task Meta-Distillation（ReWeave：用于具身线束优化和跨任务元蒸馏的涌现物理任务拓扑）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31053\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31053\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLong-horizon embodied tasks involve physical dependencies that may only become clear through interaction. As task understanding deepens, past trials can reveal new information for adaptation and transfer. However, coarse progress feedback cannot identify which physical preconditions held, leaving search unguided, while task-specific optimization easily overfits to individual scenes, making cross-task transfer brittle. We introduce ReWeave, a framework that jointly optimizes an embodied agent harness and an emergent physical task topology from interaction without updating policy weights. Keeping execution policies and perception frozen, ReWeave co-optimizes coupled context, workflows, and control loops. As new evidence revises the topology, ReWeave reprojects past trials onto the updated task understanding, exposing retained progress, regressions, and bottlenecks that guide parent selection and search width. Across tasks, matching verified local mechanisms to unmet preconditions consolidates 72 specialist units into 44 reusable groups (0.34times full concatenation) within a compact shared harness capable of continual learning. ReWeave improves held-out success from 89.00% to 98.75% on LIBERO-PRO and from 25.50% to 58.25% on RoboDojo, while uncovering retained progress in 89% of 159 failed RoboDojo development trials and translating stronger offline reasoning into higher online performance. On eight unseen LIBERO-PRO tasks, the shared harness reaches 51.3% success versus 41.3% for direct distillation, rising to 75.0% after continual learning.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e长期具身任务涉及可能只有通过交互才能明确的物理依赖关系。随着任务理解的加深，过去的试验可以揭示用于适应和迁移的新信息。然而，粗粒度的进度反馈无法识别哪些物理前提条件成立，使搜索失去引导，而特定任务的优化容易过拟合到个别场景，使得跨任务迁移变得脆弱。我们引入了ReWeave，一个框架，它在交互中联合优化具身代理线束和涌现的物理任务拓扑，而不更新策略权重。保持执行策略和感知冻结，ReWeave协同优化耦合的上下文、工作流和控制循环。随着新证据修改拓扑，ReWeave将过去的试验重新投影到更新的任务理解上，暴露保留的进度、回退和瓶颈，以引导父代选择和搜索宽度。跨任务匹配验证的局部机制与未满足的前提条件，在能够持续学习的紧凑共享线束中，将72个专家单元整合为44个可重用组（完全串联的0.34倍）。ReWeave在LIBERO-PRO上将保留的成功率从89.00%提高到98.75%，在RoboDojo上从25.50%提高到58.25%，同时在159个失败的RoboDojo开发试验中发现了89%的保留进度，并将更强的离线推理转化为更高的在线性能。在八个未见过的LIBERO-PRO任务上，共享线束达到51.3%的成功率，而直接蒸馏为41.3%，在持续学习后上升至75.0%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出ReWeave框架，在不更新策略权重的情况下，通过交互联合优化具身代理线束和涌现的物理任务拓扑，以实现跨任务的元蒸馏和持续学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ReWeave框架，在冻结执行策略和感知的情况下，协同优化上下文、工作流和控制循环，动态更新任务拓扑。2. 通过将验证的局部机制匹配到未满足的前提条件，将72个专家单元整合为44个可重用组（完全串联的0.34倍）。3. 显著提升任务成功率：LIBERO-PRO从89.00%提升至98.75%，RoboDojo从25.50%提升至58.25%。4. 在159个失败的RoboDojo试验中识别出89%的保留进度；在8个未见过的LIBERO-PRO任务上，共享线束成功率从直接蒸馏的41.3%提升至51.3%，持续学习后达75.0%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了丰富的定量结果，证明了ReWeave在提高成功率、整合专家单元和发现失败试验中保留进度方面的有效性。局限性方面，摘要提到特定任务优化容易过拟合且粗粒度反馈无法引导搜索，ReWeave解决了这些问题，但未提供该方法在极端动态环境或完全未知任务中的表现，也未说明计算开销或拓扑更新的具体延迟。摘要未提供关于线束具体组件构成的详细技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e49. From Rewarding What Models Say to How They Think: Attention Process Reward Model for LLM Reinforcement Learning（从奖励模型所说的到模型如何思考：用于大语言模型强化学习的注意力过程奖励模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30627\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30627\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning (RL) has become an important component in large language models (LLMs). However, existing RL approaches focus on final outputs or textual solution trajectories, leading to coarse-grained rewards and unreliable reasoning. Such paradigms focus mainly on what the model outputs while overlooking how the model internally reasons. Therefore, can we reward how a model thinks internally rather than merely what it says? We first reveal the problem of textual reward aliasing in existing reward modeling approaches. Motivated by this, we propose the Attention Process Reward Model (APRM), which assigns internal rewards based on hidden states and attention maps to capture high-quality reasoning patterns. With only approximately 46M parameters, APRM is trained using ranking and counterfactual objectives, and its reward guides RL optimization while being periodically updated to handle distribution shifts. Integrated with representative RL methods, APRM achieved an average pass@8 gain of 2.88\\%. Our results demonstrate the promise of incorporating internal reasoning signals into RL for LLMs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e强化学习（RL）已成为大语言模型（LLMs）的重要组成部分。然而，现有的RL方法关注最终输出或文本解决轨迹，导致粗粒度的奖励和不可靠的推理。这些范式主要关注模型输出了什么，而忽略了模型内部是如何推理的。因此，我们能否奖励模型内部是如何思考的，而不仅仅是它说了什么？我们首先揭示了现有奖励建模方法中文本奖励混叠的问题。受此启发，我们提出了注意力过程奖励模型（APRM），它基于隐藏状态和注意力图分配内部奖励，以捕获高质量的推理模式。APRM仅具有大约46M参数，使用排序和反事实目标进行训练，其奖励引导RL优化，并定期更新以处理分布偏移。与代表性的RL方法集成后，APRM实现了平均pass@8提升2.88%。我们的结果证明了将内部推理信号纳入LLMs的RL中的前景。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出注意力过程奖励模型（APRM），通过基于隐藏状态和注意力图分配内部奖励，在LLM强化学习中奖励模型的内部推理过程，以解决文本奖励混叠和粗粒度奖励问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示了现有奖励建模方法中文本奖励混叠的问题，提出从关注模型输出转向关注模型内部推理过程。2. 提出APRM，基于隐藏状态和注意力图分配内部奖励以捕获高质量推理模式，参数量仅约46M。3. 使用排序和反事实目标进行训练，奖励引导RL优化并定期更新以处理分布偏移。4. 与代表性RL方法集成后，实现了平均pass@8提升2.88%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确指出了现有RL方法在奖励模型输出时的局限性（文本奖励混叠），并提出了基于内部状态（隐藏状态和注意力图）的APRM。实验结果显示了2.88%的pass@8提升。局限性方面，摘要未提供APRM在不同类型任务（如数学、代码、常识推理）上的具体表现差异，未说明46M参数模型在处理更大规模LLM时的扩展性，也未提供关于分布偏移定期更新的具体频率和计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e50. NoHairCache: Calibrate-Once KV Cache Eviction with One Power-Law Exponent（NoHairCache：使用单一幂律指数的一次校准KV缓存驱逐）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29006\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29006\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe decay exponent α in KV-cache eviction is an intrinsic property of the model: calibrated once on a single corpus, it transfers directly across domains. Attention-based accumulation (H2O) and recency-based sliding windows (StreamingLLM) are two dominant eviction frameworks, often treated as unrelated, but we show that they are the two endpoints of a single power-law family: by scoring each token as s_i = A_i cdot (t-i)^{-α}, where A_i is cumulative attention and α controls the age penalty, H2O and StreamingLLM correspond to α=0 and αtoinfty, respectively (with StreamingLLM additionally hard-coding an attention-sink patch).\u003cbr\u003e  The no-hair mechanism of xiang2026nohair bounds the admissible range of α, and the measured exponents agree: calibrating once on WikiText yields [0.556, 0.822] for a representative model (Qwen2.5-1.5B-Instruct). The per-model ranges are consistent across five models (410M--1.5B) and independently match the optimal regions from perplexity sweeps.\u003cbr\u003e  NoHairCache achieves the lowest perplexity across three datasets (WikiText, PG19, and arXiv) without per-dataset tuning, outperforming both H2O and StreamingLLM (p \u0026lt; 0.05 on all three datasets, with 0.06--0.10 PPL gains over StreamingLLM at budget 512). On downstream four-way multiple-choice QA, it matches or outperforms StreamingLLM across all nine (task, budget) cells, retaining 98.2% of full-cache accuracy on NarrativeQA at 25% retention versus 91.1% for StreamingLLM; per-cell McNemar tests are not significant, so QA is corroborating only. We release our calibration script and drop-in scorer upon publication.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eKV缓存驱逐中的衰减指数α是模型的内在属性：在单个语料库上校准一次，它可以直接跨领域迁移。基于注意力的累积（H2O）和基于最近性的滑动窗口（StreamingLLM）是两个主要的驱逐框架，通常被视为不相关的，但我们表明它们是单一幂律族的两个端点：通过将每个token评分为s_i = A_i * (t-i)^(-α)，其中A_i是累积注意力，α控制年龄惩罚，H2O和StreamingLLM分别对应α=0和α趋于无穷大（其中StreamingLLM另外硬编码了一个注意力汇聚补丁）。xiang2026nohair的无毛机制限制了α的允许范围，并且测量出的指数一致：在代表性模型（Qwen2.5-1.5B-Instruct）上在WikiText上校准一次产生[0.556, 0.822]。每个模型的范围在五个模型（410M--1.5B）中是一致的，并且独立匹配困惑度扫描的最佳区域。NoHairCache在三个数据集（WikiText、PG19和arXiv）上实现了最低的困惑度，无需按数据集调整，优于H2O和StreamingLLM（在所有三个数据集上p \u0026lt; 0.05，在预算512时比StreamingLLM有0.06--0.10的PPL增益）。在下游四选一多项选择问答中，它在所有九个（任务，预算）单元中匹配或优于StreamingLLM，在25%保留率时在NarrativeQA上保留了98.2%的完整缓存准确率，而StreamingLLM为91.1%；逐单元McNemar检验不显著，因此问答仅作为佐证。我们将在发表时发布我们的校准脚本和即插即用评分器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出NoHairCache方法，通过统一的幂律公式将基于注意力的累积（H2O）和基于最近性的滑动窗口（StreamingLLM）统一为单一幂律族的两端，并通过一次校准衰减指数α来实现跨领域的KV缓存驱逐。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 证明H2O和StreamingLLM是单一幂律族的两端，提出统一的评分公式s_i = A_i * (t-i)^(-α)。2. 发现衰减指数α是模型内在属性，在代表性模型（Qwen2.5-1.5B-Instruct）上校准一次得到的范围[0.556, 0.822]在五个模型（410M-1.5B）中一致，且匹配困惑度扫描的最佳区域。3. NoHairCache在WikiText、PG19和arXiv上无需按数据集调整即实现最低困惑度，显著优于H2O和StreamingLLM（预算512时PPL增益0.06-0.10）。4. 在下游四选一问答中匹配或优于StreamingLLM，在NarrativeQA 25%保留率下保留98.2%的完整缓存准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了坚实的理论统一（将H2O和StreamingLLM统一为幂律族）和充分的实验验证（困惑度和下游QA任务）。局限性方面，摘要明确指出下游QA的逐单元McNemar检验不显著，因此QA结果仅作为佐证，说明在特定下游任务上的提升可能不具备严格的统计显著性。此外，摘要未提供该方法在更长上下文窗口或更大参数规模模型上的表现，也未说明校准过程的具体计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型系统优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e51. How Complete Must an Environment Be to Train a Capable GUI Agent?（训练一个能力强的GUI智能体，环境必须有多完整？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23946\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23946\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGraphical user interface (GUI) agents are widely trained in executable GUI environments. To lower cost, build environments in batches, and reduce manual effort, each work trades away part of the environment through its construction choices. We describe these choices along three dimensions: reward coverage, the goal-reaching trajectories the verifier rewards; data coverage, the application data the agent is exposed to beyond what the task reads or writes; and feature coverage, the application features beyond what the task uses. Existing works set each dimension on engineering grounds, but they do not measure its effect on training. How complete must an environment be to train a capable agent, and along which dimensions? In MobileGym, we adjust each dimension separately, train Qwen3-VL-4B-Instruct, and evaluate every policy in the original full environment. A verifier that rewards only one reference path lowers success by 10.53 points, and removing unneeded records also lowers success. Pruning unneeded features instead raises success from 51.61% to 56.13%, entirely on tasks whose environments it left unchanged. The gain reverses when each episode is weighted equally and vanishes when only episodes on the pruned tasks are balanced. Without pruning, length weighting there reinforces long detour successes that erode skills on other tasks. Following these findings, we build MobileGym-Lite, which keeps reward and data coverage complete and prunes unneeded features. It outperforms Full in the full environment (55.48% versus 51.61% success) with lower construction cost.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e图形用户界面（GUI）智能体通常在可执行的GUI环境中进行广泛训练。为了降低成本、分批构建环境并减少人工工作量，每项工作都通过其构建选择牺牲了环境的一部分。我们沿着三个维度描述这些选择：奖励覆盖范围，即验证器奖励的到达目标的轨迹；数据覆盖范围，即智能体接触到的超出任务读取或写入范围的应用程序数据；以及特征覆盖范围，即超出任务使用范围的应用程序特征。现有工作基于工程基础设定每个维度，但它们没有衡量其对训练的影响。为了训练一个能力强的智能体，环境必须有多完整，以及沿着哪些维度？在MobileGym中，我们分别调整每个维度，训练Qwen3-VL-4B-Instruct，并在原始完整环境中评估每个策略。仅奖励一条参考路径的验证器使成功率降低了10.53分，移除不需要的记录也会降低成功率。相反，修剪不需要的特征将成功率从51.61%提高到56.13%，这完全发生在其环境保持不变的任务上。当每个episode被同等加权时，这种收益发生逆转，并且当仅平衡修剪任务上的episode时，收益消失。在没有修剪的情况下，那里的长度加权强化了长绕行成功，从而侵蚀了其他任务上的技能。根据这些发现，我们构建了MobileGym-Lite，它保持奖励和数据覆盖完整，并修剪不需要的特征。它在完整环境中优于Full（55.48%对51.61%的成功率），且构建成本更低。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究GUI智能体训练环境的完整性（奖励覆盖、数据覆盖、特征覆盖）对智能体能力的影响，并构建更高效的训练环境。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出从奖励覆盖、数据覆盖和特征覆盖三个维度评估环境完整性；发现修剪不需要的特征可提升成功率（51.61%至56.13%），但受加权方式影响；构建MobileGym-Lite，在保持奖励和数据覆盖完整并修剪特征的情况下，以更低成本在完整环境中实现55.48%的成功率，优于完整环境的51.61%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：研究评估了环境完整性三个维度对GUI智能体训练的影响，并提出了MobileGym-Lite。局限性与未提供细节：摘要未提供MobileGym-Lite在其他模型或更广泛任务上的泛化能力评估，未提供特征修剪的具体自动化程度，也未提供构建成本更低的具体数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习 / 智能体训练环境\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e52. Fast-JEPA: Advancing the Success-Latency Frontier for Latent World Models（Fast-JEPA：推进潜在世界模型的成功-延迟前沿）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25927\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25927\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLatent world models predict the outcomes of action sequences, but comparing candidate plans through recursive rollout remains expensive at test time. We introduce Fast-JEPA, a latent world model planning framework that advances the success-latency Pareto frontier of predictive search. Fast-JEPA reorganizes predictive computation to support effective action-sequence search at low planning cost. It constructs a goal-directed plan to guide search and directly predicts the outcomes of complete candidates for efficient comparison, avoiding recursive state rollout during refinement. Across PushT, Reacher, Cube, and TwoRoom, Fast-JEPA achieves 96.50% average success rate with 2.41x faster planning than INTACT. Search-budget sweeps show that its competitive success and low latency extend across candidate counts and refinement depths. We further introduce DynaGoal, a benchmark for evaluating world-model planning under dynamic out-of-distribution conditions, execution deadlines, and controlled response delays. Fast-JEPA achieves average success rates of 73.83% on DynaGoal-Shift and 87.67% on DynaGoal-Deadline, demonstrating the practical value of low-latency predictive planning under changing control conditions and execution-time constraints. Our code is available at https://github.com/Sofilyzia/Fast-JEPA.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e潜在世界模型预测动作序列的结果，但在测试时通过递归展开比较候选计划仍然代价高昂。我们引入了Fast-JEPA，一个潜在世界模型规划框架，它推进了预测搜索的成功-延迟帕累托前沿。Fast-JEPA重组预测计算，以在低规划成本下支持有效的动作序列搜索。它构建一个目标导向的计划来引导搜索，并直接预测完整候选的结果以进行高效比较，避免了细化过程中的递归状态展开。在PushT、Reacher、Cube和TwoRoom中，Fast-JEPA实现了96.50%的平均成功率，规划速度比INTACT快2.41倍。搜索预算扫描表明，其具有竞争力的成功率和低延迟延伸至候选数量和细化深度。我们进一步引入DynaGoal，一个用于评估在动态分布外条件、执行截止时间以及受控响应延迟下的世界模型规划的基准。Fast-JEPA在DynaGoal-Shift上实现了73.83%的平均成功率，在DynaGoal-Deadline上实现了87.67%的平均成功率，证明了在变化的控制条件和执行时间约束下低延迟预测规划的实际价值。我们的代码可在 https://github.com/Sofilyzia/Fast-JEPA 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Fast-JEPA潜在世界模型规划框架，以低规划成本实现有效的动作序列搜索，推进预测搜索的成功-延迟帕累托前沿，并引入DynaGoal基准评估动态条件下的规划。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Fast-JEPA框架，通过构建目标导向计划并直接预测完整候选结果，避免递归状态展开；在PushT等4个任务中实现96.50%平均成功率，规划速度比INTACT快2.41倍；引入DynaGoal基准，Fast-JEPA在DynaGoal-Shift和DynaGoal-Deadline上分别达到73.83%和87.67%的平均成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：Fast-JEPA通过避免递归状态展开，在多个任务和DynaGoal基准上实现了高成功率与低延迟。局限性与未提供细节：摘要未提供该框架在更复杂或高维连续控制任务上的表现，未提供目标导向计划的具体构建机制细节，也未提供计算开销的具体数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习 / 世界模型与规划\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e53. VideoJSON: A Minimal Harness Beats Purpose-Built Memory for Ultra-Long Video Understanding（VideoJSON：极简框架在超长视频理解中击败专用记忆）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28167\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28167\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAnswering questions over days or weeks of video requires searching for scattered clues across long timelines. Existing video agents rely on complex memory graphs and fixed retrieval pipelines, which restrict how the agent can search. We propose VideoJSON, a minimal harness for ultra-long video understanding that keeps the memory simple and lets a coding agent write its own search programs. During indexing, a vision-language model turns each minute of video into a single JSON record containing a dense caption and structured fields such as events, entities, places, and speech transcripts. At query time, the agent writes Python or Bash programs in a sandboxed container to filter, link, and read these records over multiple steps, without task-specific training or raw video access. On four ultra-long video benchmarks, VideoJSON with DeepSeek V4.1 Flash outperforms MAGIC-Video by 7.0, 20.0, and 24.75 points on EgoLifeQA, Ego-R1-Bench, and MM-Lifelong Week, and beats the best prior EgoMemReason score by 12.6 points. Across four policy models of increasing capability, VideoJSON\u0026#x27;s average score rises by up to 11.58 points over the weakest model, compared with at most 5.50 points for MAGIC-Video. Ablations show that both agentic code search and the structured JSON records drive these gains, while adding hourly summaries, extra tools, or video access changes the average score by less than 1.5 points. In addition, fine-tuning Qwen-3.5-Flash on 64 VideoJSON trajectories from an unrelated 100-hour livestream improves its MM-Lifelong scores by up to 8.25 points. Code will be open-sourced after publication.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e回答跨越数天或数周视频的问题需要在长时间线中搜索分散的线索。现有的视频智能体依赖复杂的记忆图和固定的检索管道，这限制了智能体的搜索方式。我们提出了VideoJSON，一个用于超长视频理解的极简框架，它保持记忆简单，并让编码智能体编写自己的搜索程序。在索引期间，视觉语言模型将每分钟的视频转化为单个JSON记录，包含密集描述以及事件、实体、地点和语音转录等结构化字段。在查询时，智能体在沙盒容器中编写Python或Bash程序，以在多个步骤中过滤、链接和读取这些记录，无需特定任务训练或原始视频访问。在四个超长视频基准上，使用DeepSeek V4.1 Flash的VideoJSON在EgoLifeQA、Ego-R1-Bench和MM-Lifelong Week上分别比MAGIC-Video高出7.0、20.0和24.75分，并比之前最佳的EgoMemReason得分高出12.6分。在四个能力递增的策略模型中，VideoJSON的平均得分比最弱模型提高了多达11.58分，而MAGIC-Video最多提高5.50分。消融实验表明，智能体代码搜索和结构化JSON记录共同推动了这些收益，而添加每小时摘要、额外工具或视频访问对平均得分的改变不到1.5分。此外，在来自不相关的100小时直播的64个VideoJSON轨迹上微调Qwen-3.5-Flash，可将其MM-Lifelong得分提高多达8.25分。代码将在发表后开源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出VideoJSON极简框架用于超长视频理解，通过结构化JSON记录和智能体自主编写搜索程序替代复杂的记忆图和固定检索管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VideoJSON框架，将视频每分钟转化为包含密集描述和结构化字段的JSON记录，由编码智能体在沙盒中编写程序进行搜索；在四个基准上显著优于MAGIC-Video（最高高出24.75分）及EgoMemReason（高出12.6分）；消融实验证明智能体代码搜索和结构化JSON记录是性能提升的核心驱动力，微调可进一步提升得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：VideoJSON通过结构化JSON记录和智能体代码搜索，在超长视频理解中取得显著性能提升。局限性与未提供细节：摘要未提供视频索引阶段的具体计算成本或时间开销数字，未提供沙盒环境中代码执行的安全性或失败率等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 计算机视觉 / 超长视频理解与多模态智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e54. Self-Supervised Dataset Distillation via Mutual Information Maximization（通过互信息最大化进行自监督数据集蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31225\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31225\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDataset distillation (DD) aims to compress a large dataset into a small synthetic one that remains effective for training neural networks. Despite its success in supervised learning, DD remains underexplored in self-supervised learning (SSL), where distilled data must preserve the information needed to learn representations that remain consistent across augmentations. To bridge this gap, we introduce Mutual Information Prototype Alignment (MIPA), an efficient SSL dataset distillation approach that optimizes synthetic images to preserve augmentation-invariant information. Specifically, MIPA treats synthetic images as learnable prototypes and uses a frozen encoder to assign real samples to them based on feature similarity. A synthetic dataset that preserves such augmentation invariance should yield stable prototype assignments across multiple augmented views of the same real image. MIPA encourages this by maximizing mutual information between cross-view assignments while avoiding trivial solutions in which all real samples are assigned to only a few synthetic prototypes. Evaluations on image classification benchmarks show that synthetic data generated by MIPA yield higher-quality representations than existing distillation approaches while reducing time and storage demands during distillation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e数据集蒸馏（DD）旨在将大型数据集压缩为一个小型合成数据集，该数据集在训练神经网络时仍然有效。尽管DD在监督学习中取得了成功，但在自监督学习（SSL）中仍未得到充分探索，在SSL中，蒸馏数据必须保留学习跨增强保持一致的表示所需的信息。为了弥补这一差距，我们引入了互信息原型对齐（MIPA），一种高效的SSL数据集蒸馏方法，该方法优化合成图像以保留增强不变信息。具体而言，MIPA将合成图像视为可学习的原型，并使用冻结的编码器基于特征相似性将真实样本分配给它们。保留这种增强不变性的合成数据集应该在同一个真实图像的多个增强视图上产生稳定的原型分配。MIPA通过最大化跨视图分配之间的互信息来鼓励这一点，同时避免所有真实样本仅被分配给少数几个合成原型的平凡解。在图像分类基准上的评估表明，MIPA生成的合成数据比现有的蒸馏方法产生更高质量的表示，同时降低了蒸馏过程中的时间和存储需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出互信息原型对齐（MIPA）方法，用于自监督学习（SSL）中的数据集蒸馏，通过优化合成图像保留增强不变信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出MIPA方法，将合成图像作为可学习原型，通过冻结编码器分配真实样本；通过最大化跨视图分配的互信息并避免平凡解，保留增强不变信息；在图像分类基准上，生成的合成数据比现有方法产生更高质量的表示，同时降低了时间和存储需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：MIPA通过最大化互信息原型对齐，在自监督数据集蒸馏中提升了表示质量并降低了资源需求。局限性与未提供细节：摘要未提供具体的图像分类基准名称，未提供蒸馏数据集的具体压缩比例或大小数字，也未提供与其他最新方法对比的具体定量数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 计算机视觉 / 数据集蒸馏与自监督学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e55. ApexID: Hierarchical Learning for Multi-Species Animal Re-Identification（ApexID：用于多物种动物重识别的层次化学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29723\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29723\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAnimal re-identification (Re-ID) must distinguish individuals across species and capture conditions. We introduce ApexID, a hierarchical SphereFace2-based loss that integrates global identity discrimination with balanced animal-category supervision. Using 132,533 images curated from 19 public datasets, we evaluate three model families and four objectives on four external datasets with observation-aware retrieval protocols. ApexID achieves a dataset-averaged Rank-1 accuracy of 64.89% with ConvNeXt-Small and an mAP of 32.54% with MIEW-ID, outperforming their pretrained reference models. On elephants, a category absent from animal Re-ID training, our ConvNeXt-Small variant achieves the highest retrieval performance among the fourteen evaluated configurations. Scores vary by backbone and dataset, and open-set evaluation reveals remaining discovery challenges. These findings support hierarchical category-identity learning to improve transfer to unseen datasets and species.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e动物重识别（Re-ID）必须区分不同物种和拍摄条件下的个体。我们引入了ApexID，一种基于SphereFace2的层次化损失，它将全局身份判别与平衡的动物类别监督相结合。使用从19个公开数据集中整理的132,533张图像，我们在四个外部数据集上使用观察感知检索协议评估了三个模型家族和四个目标。ApexID使用ConvNeXt-Small实现了64.89%的数据集平均Rank-1准确率，使用MIEW-ID实现了32.54%的mAP，优于它们的预训练参考模型。在动物Re-ID训练中不存在的类别大象上，我们的ConvNeXt-Small变体在14种评估配置中实现了最高的检索性能。得分因骨干网络和数据集而异，开放集评估揭示了剩余的发现挑战。这些发现支持层次化类别-身份学习，以改善对未见数据集和物种的迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出ApexID层次化损失方法，结合全局身份判别与平衡的动物类别监督，用于跨物种和拍摄条件的动物重识别（Re-ID）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出基于SphereFace2的层次化损失ApexID，整合全局身份判别与动物类别监督；在19个公开数据集的132,533张图像上训练，在4个外部数据集上，ConvNeXt-Small达到64.89%平均Rank-1准确率，MIEW-ID达到32.54% mAP；在未见类别（大象）上，ConvNeXt-Small变体在14种配置中取得最高检索性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：ApexID通过层次化损失在多物种动物重识别中表现优异，特别是在未见类别上。局限性与未提供细节：摘要指出得分因骨干网络和数据集而异，且开放集评估揭示了剩余的发现挑战，但摘要未提供这些挑战的具体细节，也未提供在更多未见物种上的泛化测试结果数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 计算机视觉 / 图像检索与动物重识别\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e56. WeaveVLA: 3D Relational Grounding for Vision-Language-Action Models（WeaveVLA：面向视觉-语言-动作模型的3D关系建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31126\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31126\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-language-action (VLA) models leverage pretrained vision-language representations for instruction-conditioned robot control, yet their understanding of task-relevant 3D relations and how these relations evolve during manipulation remains largely implicit. To address this challenge, we introduce WeaveVLA, a framework that enhances VLA action generation by explicitly modeling task-relevant relative 3D relations and maintaining relational context across observations. WeaveVLA employs a task-conditioned sparse graph neural network to encode relative 3D relations among objects, the gripper, and nearby references. Pair-specific recurrent edge states integrate geometric evidence across observations to maintain evolving spatial context. A learned-query readout summarizes the updated graph representations into compact relational tokens, which condition the action expert alongside the original vision-language context. An auxiliary geometry reconstruction objective further encourages spatial structure preservation. We instantiate WeaveVLA on StarVLA-GR00T and π_{0.5}, achieving over 98\\% average success on LIBERO with both backbones. On LIBERO-Plus, WeaveVLA improves success from 74.9\\% to 82.0\\% and from 85.7\\% to 87.8\\%, respectively, with additional improvements on CALVIN DrightarrowD. On three real-world tasks, the StarVLA-GR00T-based variant improves average success from 55.6\\% to 70.0\\% under standard conditions and from 33.3\\% to 53.3\\% under OOD perturbations, surpassing the π_{0.5} baseline in both settings.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉-语言-动作（VLA）模型利用预训练的视觉-语言表示进行基于指令的机器人控制，但它们对任务相关的3D关系以及这些关系在操作过程中如何演变的理解在很大程度上仍然是隐式的。为了应对这一挑战，我们引入了WeaveVLA，这是一个通过显式建模任务相关的相对3D关系并跨观测保持关系上下文来增强VLA动作生成的框架。WeaveVLA采用任务条件化的稀疏图神经网络来编码对象、夹爪和附近参考物之间的相对3D关系。特定于对的循环边状态跨观测整合几何证据，以维持不断演变的空间上下文。学习到的查询读出将更新的图表示总结为紧凑的关系标记，这些标记与原始视觉-语言上下文一起为动作专家提供条件。辅助几何重建目标进一步鼓励空间结构保留。我们在StarVLA-GR00T和π_{0.5}上实例化了WeaveVLA，在LIBERO上使用这两种骨干网络均实现了超过98%的平均成功率。在LIBERO-Plus上，WeaveVLA分别将成功率从74.9%提高到82.0%和从85.7%提高到87.8%，并在CALVIN D-\u0026gt;D上取得了额外改进。在三个真实世界任务中，基于StarVLA-GR00T的变体在标准条件下将平均成功率从55.6%提高到70.0%，在分布外（OOD）扰动下从33.3%提高到53.3%，在两种设置下均超过了π_{0.5}基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e增强视觉-语言-动作（VLA）模型的动作生成，通过显式建模任务相关的相对3D关系并跨观测保持关系上下文，以解决VLA模型对任务相关3D关系及其演变理解隐式的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WeaveVLA框架，采用任务条件化稀疏图神经网络编码相对3D关系；使用特定于对的循环边状态整合几何证据维持空间上下文；通过辅助几何重建目标保留空间结构；在LIBERO、LIBERO-Plus、CALVIN和真实世界任务中显著提升成功率，超越基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的架构设计和广泛的实验结果，证明了其在仿真和真实环境中的有效性。关于计算开销、推理延迟、更复杂场景下的泛化能力或失败案例的分析，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/计算机视觉/具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e57. MMMem: Self-Improving Agents with Task-Aware Multimodal Experience Consolidation（MMMem：具有任务感知多模态经验整合的自我改进智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30287\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30287\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI agents accumulate conversations, images, and documents through long-term interactions with users. Answering later questions often requires connecting evidence across these records, yet the resulting understanding is rarely retained, allowing mistakes to recur on related questions. Existing multimodal memory methods largely focus on storing and retrieving records, with limited mechanisms for learning from completed tasks and consolidating task-specific experience. We therefore propose MMMem, a task-aware multimodal memory framework that extracts and consolidates experience from completed tasks through four complementary strategies. First, source-linked multi-view memory organizes original text, images, and rendered pages alongside generated scene images that combine clues across records for retrieval. Second, source-generated tasks support knowledge alignment at two levels: warm-up consolidates source knowledge into task-relevant experiences in external memory, while self-training adapts the model\u0026#x27;s parametric knowledge to task demands. Third, the same vision-language model distills completed tasks into experiences that record the task context, conclusion, and support links. Finally, task-aware retrieval recalls source views and relevant experiences for answering and verification, while source-supported reuse guides long-term retention. Across three memory benchmarks and two vision-language readers, MMMem outperforms eight baselines. With Qwen3.5-9B, MMMem achieves relative gains of 36.9%, 17.6%, and 15.2% over the best-performing baselines on LoCoMo, Mem-Gallery, and LooGLE v2, respectively. Ablations show consistent gains from training and memory warm-up, while case studies illustrate how individual components work in practice.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAI智能体通过与用户的长期交互积累对话、图像和文档。回答后续问题通常需要跨这些记录连接证据，但由此产生的理解很少被保留，导致在相关问题上错误再次发生。现有多模态记忆方法主要侧重于存储和检索记录，从已完成任务中学习并整合特定任务经验的机制有限。因此，我们提出了MMMem，这是一个任务感知的多模态记忆框架，通过四种互补策略从已完成任务中提取和整合经验。首先，源链接的多视图记忆组织原始文本、图像和渲染页面，以及结合跨记录线索以进行检索的生成场景图像。其次，源生成的任务支持两个层面的知识对齐：预热将源知识整合到外部记忆中的任务相关经验中，而自训练使模型的参数化知识适应任务需求。第三，同一个视觉-语言模型将已完成的任务提炼为记录任务上下文、结论和支持链接的经验。最后，任务感知检索召回源视图和相关经验用于回答和验证，而源支持的重用指导长期保留。在三个记忆基准和两个视觉-语言阅读器上，MMMem优于八个基线。使用Qwen3.5-9B，MMMem在LoCoMo、Mem-Gallery和LooGLE v2上分别实现了比表现最好的基线高出36.9%、17.6%和15.2%的相对增益。消融实验表明训练和记忆预热带来了一致的增益，而案例研究说明了各个组件在实践中如何工作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出MMMem框架，通过四种互补策略从已完成任务中提取和整合多模态经验，解决现有AI智能体在多模态记忆方法中缺乏从已完成任务学习及整合特定任务经验机制的问题，从而减少相关问题的错误复发。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出任务感知的多模态记忆框架MMMem；包含四种策略：源链接多视图记忆、源生成任务支持的双层知识对齐（预热和自训练）、同一视觉-语言模型提炼任务经验、任务感知检索与源支持重用；在三个记忆基准上显著超越八个基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了MMMem的四个核心组件及其在知识对齐、经验提炼和检索重用方面的作用，并提供了在三个基准测试上的具体性能提升数据及消融实验结果。关于系统计算成本、记忆存储上限、长期交互中的记忆遗忘率或具体失败案例，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/多模态学习/智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e58. Deterministic, Reproducible Inference in Exact Integer Arithmetic, and Verifiable Distributed Inference as Its Consequence（精确整数算术中的确定性、可复现推理，及其带来的可验证分布式推理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.13730\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.13730\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOptimized floating-point inference is not reproducible across environments: the same model on different hardware, compilers or thread counts can produce different bits. We present tritify, an open-source runtime that executes the forward pass of real models -- decoder-only language models, Mixture-of-Experts decoders, and the Segment Anything 2.1 image/video stack -- with the entire run-time path in exact integer arithmetic; floating point is confined to offline quantization and the float reference used for verification. We make three separate claims and verify each. (1) Cross-hardware reproducibility: the integer path produces bit-identical output run to run, across CPU instruction-set architectures, and across CPU/GPU, carried by a reproducing SHA-256 of the output. (2) Decision fidelity: the integer path reproduces the float reference\u0026#x27;s decision on the models and inputs tested, with the numeric exceptions measured; per-layer fidelity through sixteen layers of OLMoE-1B-7B and of a 106-billion-parameter MoE shows no fidelity cliff. (3) Location independence: a model\u0026#x27;s computation can be split across instruction sets, CPU and GPU, and networked machines with zero effect on the output bits. GLM-4.5-Air (106,852,251,264 parameters, 427 GB of integer codes) generated its answer across three machines, none of which can hold its integer codes in RAM, bit-identically to a single-host reference. The consequence is verifiable distributed inference: an untrusted server or a fleet of devices runs the model while an open scalar oracle re-derives the exact bytes; a guarantee against a dishonest server is future work. We do not claim a per-device speed-up, bit-equality of floating-valued intermediates, or confidentiality. Code: https://github.com/pelloran-inc/tritify\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e优化的浮点推理在不同环境中不可复现：相同模型在不同硬件、编译器或线程数下会产生不同的位。我们提出了tritify，一个开源运行时，它以精确整数算术执行整个运行时路径来运行真实模型的前向传播——包括仅解码器语言模型、混合专家解码器以及Segment Anything 2.1图像/视频堆栈；浮点运算仅限于离线量化和用于验证的浮点参考。我们提出三个独立的声明并逐一验证。（1）跨硬件可复现性：整数路径在每次运行中产生位相同的输出，跨越CPU指令集架构，以及跨越CPU/GPU，通过输出的复现SHA-256来体现。（2）决策保真度：整数路径在测试的模型和输入上复现了浮点参考的决策，并测量了数值异常；通过OLMoE-1B-7B的十六层和1060亿参数MoE的逐层保真度显示没有保真度悬崖。（3）位置独立性：模型的计算可以跨指令集、CPU和GPU以及联网机器进行分割，对输出位产生零影响。GLM-4.5-Air（106,852,251,264个参数，427 GB整数代码）在三台机器上生成了其答案，这些机器中没有一台能将其整数代码保存在RAM中，其位与单主机参考完全相同。其结果是可验证的分布式推理：不受信任的服务器或设备集群运行模型，而开放的标量预言机重新推导出精确的字节；防止不诚实服务器的保证是未来的工作。我们不声称每设备的加速、浮值中间体的位相等性或保密性。代码：https://github.com/pelloran-inc/tritify\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决优化浮点推理在不同环境下不可复现的问题，提出tritify开源运行时，通过精确整数算术执行真实模型前向传播，实现跨硬件可复现、决策保真和位置独立的推理，并实现可验证的分布式推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出tritify运行时，将运行时路径完全转换为精确整数算术；实现跨硬件的位相同输出；保持高决策保真度，无保真度悬崖；实现位置独立性，支持跨机器分布式计算；支持可验证分布式推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了三大核心声明并提供了具体模型的验证结果。关于推理延迟、内存开销的具体数据，摘要未提供；同时摘要明确指出不声称每设备加速、浮点中间体的位相等性或保密性，且防止不诚实服务器的保证是未来的工作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机系统/机器学习系统/分布式计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e59. Prism: Hierarchical Text Detection with Minimalist Design（Prism：极简设计的分层文本检测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26254\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26254\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHierarchical text detection aims to localize words, text lines, and paragraphs while parsing their structural relationships. It provides essential structural cues for visual text understanding. To maximize accuracy, existing methods typically rely on complex multi-scale feature fusion necks and heavy-weight heads, resulting in bloated architectures and low inference efficiency. In this paper, we argue that a sufficiently pre-trained backbone can effectively replace these sophisticated external modules, while simple geometric inclusion suffices for hierarchical text structural parsing. Thus, we propose Prism, a minimalist framework for hierarchical text detection. Prism performs multi-granularity detection by attaching parallel lightweight heads to a single-scale backbone feature map, covering words, text lines, and paragraphs, and reconstructs the structural hierarchy via an efficient geometric inclusion algorithm. In addition, we systematically compare representative lightweight head archetypes and show that pixel-level regression offers the best accuracy-efficiency trade-off in this setting. Experiments on multiple public benchmarks show that our significantly simplified architecture achieves state-of-the-art (SOTA) performance with remarkable efficiency. Specifically, it runs 1.7times faster than LRANet on CTW1500 while achieving higher accuracy, and surpasses the current SOTA method, OmniParser V2, by over 6 PQ points on the hierarchical HierText dataset. Code will be released soon.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e分层文本检测旨在定位单词、文本行和段落，同时解析它们的结构关系。它为视觉文本理解提供了重要的结构线索。为了最大化准确性，现有方法通常依赖复杂的多尺度特征融合颈部和重量级头部，导致架构臃肿和推理效率低下。在本文中，我们认为充分预训练的骨干网络可以有效替代这些复杂的外部模块，而简单的几何包含足以进行分层文本结构解析。因此，我们提出了Prism，一个用于分层文本检测的极简框架。Prism通过将并行的轻量级头部附加到单尺度骨干特征图上来执行多粒度检测，覆盖单词、文本行和段落，并通过高效的几何包含算法重建结构层次。此外，我们系统地比较了具有代表性的轻量级头部原型，并表明像素级回归在此设置中提供了最佳的精度-效率权衡。在多个公开基准上的实验表明，我们显著简化的架构以卓越的效率实现了最先进（SOTA）的性能。具体而言，它在CTW1500上的运行速度比LRANet快1.7倍，同时实现了更高的精度，并在分层HierText数据集上比当前的SOTA方法OmniParser V2高出6个以上的PQ点。代码将很快发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出极简框架Prism用于分层文本检测，通过单尺度骨干网络和轻量级头部替代复杂的多尺度特征融合和重量级头部，结合几何包含算法解析文本结构关系，解决现有方法架构臃肿和推理效率低下的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出极简分层文本检测框架Prism，使用单尺度骨干和并行轻量级头部；采用高效几何包含算法重建结构层次；证明像素级回归提供最佳精度-效率权衡；在CTW1500上比LRANet快1.7倍且精度更高，在HierText上比OmniParser V2高6个以上PQ点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了极简设计理念，通过实验证明了其在精度和效率上的双重优势。关于复杂场景（如严重遮挡、极端形变）下的检测性能分析、更详细的计算资源消耗或代码发布的具体时间，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/文档分析/文本检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e60. Seeing Right, Writing Wrong: Where Short Chain-of-Thought Breaks Spatial VQA（看对写错：短思维链在哪里破坏了空间视觉问答）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28665\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28665\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAsking a vision-language model (VLM) to think step by step often makes it worse at spatial questions, even though the image stays in context. We show that short chain-of-thought (CoT) turns a perception problem into a transcription problem. Once a VLM writes a spatial relation, its answer follows that sentence instead of the image, so whether CoT helps or hurts depends largely on whether the written relation is more accurate than answering directly. Studying 15 open VLMs (2B-38B) and six frontier closed models, we rule out token count, turn format, and visual forgetting in open models and trace the failure through three stages. First, writing re-weights visual cues, weakening a \u0026quot;lower is closer\u0026quot; shortcut in all 13 open models tested but also discarding valid cues, which produces false relations. Second, the written text takes over. With the model\u0026#x27;s own conclusion-removed rationale held fixed, swapping in an opposite-depth image moves the answer by 2-9 points on rendered twins (vs. up to 77 for direct answers) and by 3.0-3.4 points on average on natural photographs (vs. 20.5-69.6). Third, the concluding sentence can invert even a true relation, mainly on converse questions. Together, false relations and conclusion mis-mapping account for four in five CoT losses. Scale does not remove this bottleneck: Qwen3-VL-32B shows the same pattern. Frontier closed models are not hurt: they write relations as accurately as they answer, and three of six re-check the image after writing. The three queried with reasoning off lock in like open models, so re-grounding co-occurs with answer-turn reasoning; we identify answer-step re-grounding as the step open VLMs lack. In a single-model pilot, fine-tuning on fixed rationales with image-determined labels restores it on natural photographs. We open-sourced all our datasets and code at https://ming-zch.github.io/seeing-right-writing-wrong.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e要求视觉-语言模型（VLM）逐步思考通常会使它们在空间问题上表现更差，即使图像仍保留在上下文中。我们表明，短思维链（CoT）将感知问题变成了转录问题。一旦VLM写出一个空间关系，它的答案就会遵循该句子而不是图像，因此CoT是有帮助还是有害很大程度上取决于写出的关系是否比直接回答更准确。通过研究15个开源VLM（2B-38B）和6个前沿闭源模型，我们排除了开源模型中的token数量、回合格式和视觉遗忘，并通过三个阶段追踪了失败原因。首先，书写重新加权了视觉线索，削弱了所有测试的13个开源模型中的“越低越近”捷径，但也丢弃了有效线索，从而产生虚假关系。其次，书面文本接管了控制权。在固定模型自身去除结论的理由的情况下，换入相反深度的图像在渲染双胞胎上使答案移动了2-9分（而直接回答高达77分），在自然照片上平均移动了3.0-3.4分（而直接回答为20.5-69.6分）。第三，结论句甚至可以反转真实的关系，主要是在反向问题上。虚假关系和结论错误映射共同导致了五分之四的CoT损失。规模并未消除这一瓶颈：Qwen3-VL-32B显示出相同的模式。前沿闭源模型未受伤害：它们写关系和回答一样准确，且六个模型中有三个在书写后重新检查图像。关闭推理进行查询的三个模型像开源模型一样锁定，因此重新接地与答案回合推理同时发生；我们将答案步重新接地确定为开源VLM缺乏的步骤。在单模型试点中，在具有图像确定标签的固定理由上进行微调可恢复其在自然照片上的表现。我们在 https://ming-zch.github.io/seeing-right-writing-wrong 开源了所有数据集和代码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究并解释短思维链（CoT）为何会降低视觉-语言模型（VLM）在空间视觉问答任务中的表现，揭示CoT将感知问题转化为转录问题的机制，并探索解决开源VLM缺乏答案步重新接地能力的方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e揭示短CoT将空间感知问题转化为转录问题，导致“看对写错”；通过三个阶段追踪失败原因；发现虚假关系和结论错误映射导致80%的CoT损失；发现规模无法解决此问题，但前沿闭源模型通过答案步重新接地避免了该问题；通过微调固定理由恢复了自然照片上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要深入分析了短CoT在空间VQA中失败的三个阶段，提供了具体的实验数据，并对比了开源与闭源模型的表现差异。关于大规模微调的详细结果、该方法在其他类型VQA任务或更复杂空间关系中的泛化能力，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/自然语言处理/视觉问答/模型分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e61. Typhoon OCR 2: From Thai Document Transcription to Multilingual, Multi-Task OCR（Typhoon OCR 2：从泰语文档转录到多语言、多任务OCR）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.27494\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.27494\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTyphoon OCR 1.5 focused on reading Thai documents. However, in real-world workflows, users often need to extract specific information or preserve the structure of an entire page for further processing. Typhoon OCR 2 handles both tasks in a single model, with prompt-driven extraction and structured full-page parsing. Full-page parsing covers Thai, English, and Chinese. We release compact 2B and 0.8B models adapted from open document parsers through supervised fine-tuning on curated Thai and public multilingual data, followed by Group Relative Policy Optimization (GRPO) with task rewards and a rule penalizing unfinished responses. Among evaluated open models, Typhoon OCR 2 2B scores highest on Thai MDPBench (80.7 versus 68.9 for Typhoon OCR 1.5) and on ThaiOCRBench (59.91 versus 40.45), which covers recognition, extraction, and document understanding. The 2B model remains close to its base on English olmOCR-bench (84.7 versus 84.4) and on OmniDocBench, which evaluates English and Chinese together (90.97 versus 91.03). On MDPBench, GRPO reduces the mean share of pages with repetition loops for the 2B model from 3.2% to 0.7%, with a smaller and statistically uncertain score gain for the 0.8B model. We release the model weights, Python package, and evaluation suite.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eTyphoon OCR 1.5 专注于阅读泰语文档。然而，在实际工作流程中，用户通常需要提取特定信息或保留整个页面的结构以进行进一步处理。Typhoon OCR 2 在单个模型中处理这两项任务，采用提示驱动的提取和结构化的全页解析。全页解析涵盖泰语、英语和中文。我们发布了紧凑的 2B 和 0.8B 模型，这些模型改编自开放文档解析器，通过在精选的泰语和公开的多语言数据上进行监督微调，随后进行带有任务奖励和惩罚未完成回复规则的分组相对策略优化（GRPO）。在评估的开放模型中，Typhoon OCR 2 2B 在 Thai MDPBench（80.7 对比 Typhoon OCR 1.5 的 68.9）和 ThaiOCRBench（59.91 对比 40.45）上得分最高，后者涵盖识别、提取和文档理解。2B 模型在英文 olmOCR-bench（84.7 对比 84.4）和同时评估英文和中文的 OmniDocBench（90.97 对比 91.03）上保持接近其基础模型的水平。在 MDPBench 上，GRPO 将 2B 模型出现重复循环页面的平均比例从 3.2% 降低到 0.7%，而 0.8B 模型的得分提升较小且在统计上不确定。我们发布了模型权重、Python 包和评估套件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e多语言、多任务OCR（包括提示驱动的信息提取和结构化的全页解析）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在单个模型中实现提示驱动提取和全页解析，支持泰、英、中三种语言。2. 采用GRPO（分组相对策略优化）减少重复循环。3. 2B模型在Thai MDPBench和ThaiOCRBench上取得开源模型最高分，同时在英文和中文基准上保持接近基线模型的性能。4. 开源了2B和0.8B模型权重、Python包及评估套件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该模型在多语言OCR任务上取得了显著的性能提升，特别是泰语任务，且通过GRPO有效减少了重复生成的问题。局限性方面，摘要提到0.8B模型在MDPBench上的得分提升在统计上不确定，且全页解析在OmniDocBench上的得分略低于基线模型（90.97 vs 91.03），但未提供具体原因。摘要未提供关于模型推理速度、计算资源消耗以及在其他未提及语言上的表现等局限或细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 光学字符识别 (OCR) / 自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e62. Beyond Attention Maps: Understanding and Improving Medical MLLMs via Visual Values（超越注意力图：通过视觉值理解和改进医疗多模态大语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29361\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29361\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCurrent MLLM methods largely focus on whether models attend to the right visual regions, implicitly treating spatial attention map as the primary key of effective visual perception. To examine this assumption, we introduce a medical VQA dataset with paired non-contrast (NC) and contrast-enhanced (CE) images that share corresponding anatomy while providing different cues. We show that this view is incomplete: across paired NC and CE medical images, MLLMs often exhibit similar attention patterns despite producing contrasting answers, while controlled bidirectional interventions induce substantially larger prediction changes on visual values than attention weights. These results identify the visual content retrieved through values as a critical factor in improving perception beyond spatial attention alone. Guided by this finding, we propose VIVID (VIsual Value Intervention Distillation), which uses enhanced visual values to identify and refine teacher corrections aligned with useful visual evidence to improve on-policy distillation from CE to NC images. Across six internal and external test sets, VIVID consistently outperforms existing on-policy distillation methods across different model scales and architectures, requires only NC images at inference, and maintains strong zero-shot performance on general-domain VQA benchmarks. The project page is available at https://qiuzyc.github.io/VIVID.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当前的 MLLM 方法主要关注模型是否关注正确的视觉区域，隐含地将空间注意力图视为有效视觉感知的主要关键。为了检验这一假设，我们引入了一个医疗 VQA 数据集，该数据集包含配对的平扫（NC）和增强（CE）图像，这些图像共享相应的解剖结构同时提供不同的线索。我们表明这种观点是不完整的：在配对的 NC 和 CE 医疗图像中，MLLM 通常表现出相似的注意力模式，尽管产生了截然不同的答案，而受控的双向干预在视觉值上引起的预测变化远大于注意力权重。这些结果确定通过值检索的视觉内容是超越单纯空间注意力改善感知的关键因素。在这一发现的指导下，我们提出了 VIVID（视觉值干预蒸馏），它使用增强的视觉值来识别和完善与有用视觉证据对齐的教师纠正，以改善从 CE 到 NC 图像的同策略蒸馏。在六个内部和外部测试集上，VIVID 在不同模型规模和架构上始终优于现有的同策略蒸馏方法，在推理时仅需要 NC 图像，并在通用领域的 VQA 基准上保持了强大的零样本性能。项目页面位于 https://qiuzyc.github.io/VIVID。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e医疗视觉问答（VQA）中的视觉感知改进与模型蒸馏。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示了医疗MLLM中注意力模式相似但答案不同的现象，证明视觉值（visual values）比注意力权重对预测的影响更大。2. 提出VIVID（视觉值干预蒸馏）方法，利用增强的视觉值改进从CE到NC图像的同策略蒸馏。3. 在6个内部和外部测试集上，VIVID在不同模型规模和架构上均优于现有同策略蒸馏方法。4. 推理时仅需NC图像，且在通用VQA基准上保持强大的零样本性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前MLLM过度依赖空间注意力图的局限性，并通过实验证明了视觉值的关键作用。提出的VIVID方法在多个测试集和模型架构上表现出优越性，且推理时仅需平扫图像，具有较好的临床实用性。局限性方面，摘要未提供VIVID方法在训练时的计算开销、对特定罕见疾病的泛化能力，以及“增强的视觉值”的具体实现细节。摘要未提供具体的性能提升数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医疗人工智能 / 多模态大语言模型 (MLLM) / 计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e63. PixelOne: From Options to Pixels in a Single Forward for GUI Grounding（PixelOne：在单次前向传播中从选项到像素的GUI定位）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30235\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30235\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGUI grounding requires precise clicks at low latency. Recent models such as GUI-Decisions and GUI-Swift predict coordinates in one forward pass using fixed global bins with local refinement. However, screenshot downsampling removes detail needed to locate small controls, while fixed bins cover larger pixel ranges at higher resolutions. We introduce PixelOne, which transfers spatial knowledge from a search teacher to a student that predicts clicks directly from screenshots at native resolution. The teacher uses VideoJEV\u0026#x27;s text-option scorer to select rows and columns and progressively zoom into candidate regions. The student inherits the teacher\u0026#x27;s parameters and matches its distributions over explored regions through spatial distillation alongside box supervision. At inference, the same decision head selects a visual token, and a lightweight pixel head predicts the click within it, all in one forward pass. A click-aligned loss encourages pixels inside the target box to score above those outside. Across four benchmarks, PixelOne-Pro-35B-A3B achieves 83.8% mean accuracy, the highest among the evaluated single-forward grounders, with a mean latency of 0.43 s per target.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eGUI 定位需要低延迟的精确点击。最近的模型（如 GUI-Decisions 和 GUI-Swift）使用固定全局分箱与局部细化在一次前向传播中预测坐标。然而，截图下采样移除了定位小控件所需的细节，而固定分箱在更高分辨率下覆盖更大的像素范围。我们引入了 PixelOne，它将空间知识从搜索教师转移到学生模型，该学生模型直接从原生分辨率的截图中预测点击。教师模型使用 VideoJEV 的文本-选项评分器来选择行和列，并逐渐放大到候选区域。学生模型继承教师模型的参数，并通过空间蒸馏以及边界框监督来匹配其在探索区域上的分布。在推理时，同一个决策头选择一个视觉 token，一个轻量级的像素头在其中预测点击，所有操作均在一次前向传播中完成。点击对齐损失鼓励目标框内的像素得分高于框外的像素。在四个基准测试中，PixelOne-Pro-35B-A3B 达到了 83.8% 的平均准确率，在评估的单次前向定位器中最高，每个目标的平均延迟为 0.43 秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e图形用户界面（GUI）定位（以低延迟实现精确点击坐标预测）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出PixelOne，通过空间蒸馏将搜索教师的空间知识转移到学生模型，直接在原生分辨率截图上预测点击。2. 推理时单次前向传播即可同时选择视觉token和预测像素级点击。3. 引入点击对齐损失，优化目标框内外像素的得分差异。4. PixelOne-Pro-35B-A3B在4个基准测试中达到83.8%的平均准确率（单次前向定位器中最高），且平均延迟仅为0.43秒/目标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明PixelOne有效解决了截图下采样丢失细节和固定分箱在高分辨率下覆盖范围过大的问题，实现了高精度和低延迟的GUI定位。局限性方面，摘要未提供该模型在不同操作系统或复杂动态GUI环境下的泛化能力评估，也未说明35B参数模型的显存占用和实际部署成本。摘要未提供与其他非单次前向传播模型（如多步推理模型）的精度对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人机交互 / 计算机视觉 / 智能体 (Agent)\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e64. Frontier models need only one text to unmask its human or AI author（前沿模型仅需一段文本即可揭露其人类或AI作者身份）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26216\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26216\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGiven a single text and a simple zero-shot prompt (no web access, tools, candidate lists, or writing samples), frontier models can answer \u0026quot;who wrote this?\u0026quot; at three increasingly specific levels: (1) whether an AI or human wrote it, (2) if an AI, which lab, and (3) if a human, often exactly who. The latest models (Claude Fable 5.2, GPT-6.1 Sol, Gemini 4 Carbon) match trained detectors like Pangram while also explaining their predictions in natural language, and Opus 5.5 names the correct lab for 98% of texts generated by models from Anthropic, OpenAI, and Google. Most strikingly, Fable 5.2 correctly names the author of 55% of 15K anonymous ICML 2020 reviews that were never made public, and identifies the username behind 69% of comments from active Redditors (with \u0026gt;500 posts over the last year). Accuracy depends on exposure to an author\u0026#x27;s writing in pretraining data and on reasoning effort, and simply asking a model how familiar it is with someone predicts whether it can identify their writing. For anyone who has published enough writing online, frontier models present a greater threat to anonymity than commonly assumed, and defenses are limited.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e给定单一文本和简单的零样本提示（无网络访问、工具、候选列表或写作样本），前沿模型可以在三个越来越具体的层面上回答“这是谁写的？”：（1）是 AI 还是人类写的，（2）如果是 AI，是哪个实验室，以及（3）如果是人类，通常是具体谁。最新模型（Claude Fable 5.2、GPT-6.1 Sol、Gemini 4 Carbon）在能用自然语言解释其预测的同时，匹配了如 Pangram 这样的训练检测器，并且 Opus 5.5 对 Anthropic、OpenAI 和 Google 模型生成的文本中 98% 正确命名了所属实验室。最引人注目的是，Fable 5.2 正确命名了 15K 篇从未公开的匿名 ICML 2020 审稿意见中 55% 的作者，并识别出活跃 Reddit 用户（在过去一年中发帖超过 500 篇）背后 69% 评论的用户名。准确性取决于预训练数据中对作者写作的暴露程度以及推理努力，简单地询问模型对某人的熟悉程度即可预测其是否能识别其写作。对于任何在网上发表了足够多写作内容的人来说，前沿模型对匿名性的威胁比通常假设的要大，且防御手段有限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e文本作者身份识别（区分AI与人类，识别AI所属实验室，以及识别具体人类作者）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 前沿模型（如Claude Fable 5.2, GPT-6.1 Sol, Gemini 4 Carbon）仅需单文本和零样本提示即可在三个层级上识别作者。2. Opus 5.5 对三大实验室（Anthropic, OpenAI, Google）生成的文本识别实验室的准确率达98%。3. Fable 5.2 成功识别55%的未公开匿名ICML 2020审稿人，以及69%的活跃Reddit用户。4. 识别准确率依赖于预训练数据中的暴露程度和推理努力，且模型自我报告的熟悉度可预测识别能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要揭示了前沿大模型在零样本、无外部工具辅助下强大的文本溯源和作者识别能力，对匿名性构成了严重威胁。分析表明，模型的识别能力高度依赖于预训练数据中的文本暴露量。局限性方面，摘要未提供模型在对抗性文本修改（如改写、混淆）下的鲁棒性测试，未说明“推理努力”的具体量化方式，也未提供针对非英语或低资源语言文本的识别效果。摘要未提供具体的防御机制评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型安全与隐私 / 文本分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e65. HEP-Ex-Bench: Evaluating Agentic Performance in High Energy Physics Experiment Data Analyses with Sealed Worlds（HEP-Ex-Bench：使用密封世界评估高能物理实验数据分析中的智能体性能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28194\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28194\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgentic systems are increasingly being explored for automating experimental high-energy physics measurements, but the correctness of their results can today be reliably evaluated only via extensive expert review. To address this, we propose a method to perform detailed quantitative evaluations of agent-driven analyses through the use of blind analysis and injection tests, which are critical in a typical expert review. Agents develop a data analysis pipeline on a public dataset, while the evaluation is performed on programmatically generated sealed private datasets where signals are injected and simulation settings varied within realistic detector uncertainties. By requiring agents to provide a single workflow that is evaluated across these \u0026quot;sealed worlds\u0026quot;, we are able to test the accuracy and robustness of the workflows. We demonstrate the approach on four tasks built from CMS open data and present it as a way to reliably benchmark scientific work in experimental high-energy physics. At the time of writing, the best-performing model, Gemini 4 Argon, reaches 60% of the score of the expert reference analyses on average, ahead of GPT 6 Astra at 38% and Claude Opus 5.5 at 31%. In individual sessions on one of the tasks, Gemini 4 Argon exceeds the reference. The benchmark is hosted at https://hep-ex-bench.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体系统正越来越多地被探索用于自动化实验高能物理测量，但目前其结果的正确性只能通过广泛的专家审查来可靠评估。为了解决这个问题，我们提出了一种方法，通过使用盲分析和注入测试（这在典型专家审查中至关重要）对智能体驱动的分析进行详细的定量评估。智能体在公开数据集上开发数据分析管道，而评估则在以编程方式生成的密封私有数据集上进行，在这些数据集中注入信号并在真实探测器不确定性范围内改变模拟设置。通过要求智能体提供一个在这些“密封世界”中评估的单一工作流，我们能够测试工作流的准确性和鲁棒性。我们在基于 CMS 公开数据构建的四个任务上演示了该方法，并将其作为可靠基准测试实验高能物理科学工作的一种方式。在撰写本文时，表现最好的模型 Gemini 4 Argon 平均达到了专家参考分析分数的 60%，领先于 GPT 6 Astra 的 38% 和 Claude Opus 5.5 的 31%。在其中一个任务的个别会话中，Gemini 4 Argon 超过了参考标准。该基准托管在 https://hep-ex-bench.github.io。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估智能体系统在高能物理实验数据分析中的自动化性能与鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出HEP-Ex-Bench，利用盲分析和注入测试在“密封世界”中对智能体驱动的数据分析管道进行定量评估。2. 智能体在公开数据集开发工作流，在注入信号且模拟设置变化的私有数据集上进行评估，测试准确性和鲁棒性。3. 基于CMS公开数据构建了4个评估任务。4. 当前最佳模型Gemini 4 Argon平均达到专家参考分析60%的分数，显著优于GPT 6 Astra (38%) 和 Claude Opus 5.5 (31%)，且在单一任务中可超越专家参考。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种创新的高能物理实验数据分析评估基准，通过“密封世界”和注入测试解决了智能体结果难以自动验证的问题，为科学工作提供了可靠的基准测试方法。局限性方面，摘要未提供该基准在更广泛的物理实验（非CMS数据）中的适用性，未说明“密封世界”生成的具体计算成本，也未详细分析模型达到60%分数时剩余40%错误的具体类型。摘要未提供关于智能体工作流可解释性的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e高能物理 / 科学人工智能 / 智能体 (Agent) 评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e66. Lyris: Layout-Guided Long Video Generation with Persistent 3D Memory（Lyris：具有持久3D记忆的布局引导长视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31239\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31239\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eExploring a scene from as little as a single photo requires generating a long, camera-controlled walkthrough that extends far beyond what was captured, yet remains consistent upon return. Memory-based video generation methods preserve what they have already seen, but have no anchor beyond it, where the camera drifts from its path and a text prompt can name objects but not place them. Layout-conditioned methods provide such an anchor and precise control over what appears where, but rely on layouts that are typically authored by hand. Both limitations arise because, beyond what was captured, nothing anchors the video model unless a human authors one. To overcome both, we propose Lyris, a long video generation framework that never leaves the video model without an anchor: a persistent point-cloud memory where the scene has been observed or generated, and a 3D layout that a vision-language model authors where it has not. Our key insight is that the interface between the two models can be surprisingly coarse. A layout of one labeled 3D box per object is simple enough for a vision-language model to author (and for a user to edit), yet expressive enough for a video model to follow once rendered along the camera path. We demonstrate walkthroughs of over three minutes and 50 meters from a single photo, passing through doorways into rooms it never shows. When evaluated on minute-long round trips across four datasets, Lyris outperforms state-of-the-art methods by a wide margin, reducing camera error by 3.8x and improving consistency upon return by 22% on average.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从仅一张照片探索场景需要生成一个长距离的、相机控制的漫游视频，该视频延伸远超所拍摄的内容，但在返回时仍保持一致。基于记忆的视频生成方法保留了它们已经看到的内容，但除此之外没有锚点，导致相机偏离路径，且文本提示可以命名对象但无法放置它们。布局条件方法提供了这样的锚点并精确控制出现的位置，但依赖于通常由手工制作的布局。这两种局限性都源于，在拍摄内容之外，除非人类制作锚点，否则没有任何东西锚定视频模型。为了克服这两点，我们提出了Lyris，一个长视频生成框架，它从不让视频模型失去锚点：在场景被观察或生成的地方使用持久点云记忆，在未被观察的地方使用视觉-语言模型制作的3D布局。我们的关键见解是，两个模型之间的接口可以出奇地粗糙。每个对象一个带标签的3D框的布局足够简单，可供视觉-语言模型制作（以及用户编辑），同时在沿相机路径渲染后，又足够丰富以供视频模型遵循。我们展示了从单张照片生成超过三分钟和50米的漫游，穿过门道进入其从未展示的房间。在四个数据集上的分钟级往返评估中，Lyris以巨大优势优于最先进的方法，将相机误差降低了3.8倍，并平均将返回时的一致性提高了22%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从单张照片生成长距离、相机控制的漫游视频，并在返回时保持一致性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Lyris框架，结合持久点云记忆和视觉-语言模型生成的3D布局作为锚点；接口设计粗糙但有效（每个对象一个3D框）；从单张照片生成超3分钟、50米漫游；在四个数据集的分钟级往返评估中，相机误差降低3.8倍，返回一致性平均提高22%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出基于记忆和基于布局的方法的局限性在于缺乏超出已捕获内容的锚点。Lyris通过结合点云记忆和视觉-语言模型生成的3D布局解决了这一问题。实验证明了其在长视频生成中的优越性。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e67. SWEEP-Bench: Do Embodied Policies Act on the Speed They See?（SWEEP-Bench：具身策略是否按照它们看到的速度行动？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30637\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30637\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobot policies must adapt to the speed of moving objects, yet existing benchmarks rarely measure this ability across diverse tasks and speeds. We introduce SWEEP-Bench, a simulation benchmark with 80 conveyor-belt manipulation tasks spanning 16 skill categories, each evaluated at 13 belt speeds (0.10-0.40 m/s). Objects are transported through physical contact with a visibly moving belt. Each task has a static counterpart, and each evaluation episode uses the same randomized scene at all 13 speeds. We fine-tune eight vision-language-action and world-action models on demonstrations spanning the full speed range, comparing observations from the current frame alone with those including two past frames. For six models, the success rate peaks at intermediate speeds, and their failures indicate that they tend to produce actions suited to the average demonstration speed rather than to the actual one. Past frames raise the success rate by 10-40 percentage points for three models, and linear probes show that the belt speed is also most linearly decodable from these three. Adding ground-truth speed input to four of the models improves all of them, and a speed estimated from the images keeps most of this gain. These results show that SWEEP-Bench exposes speed-dependent failures and suggest that past frames help only policies from which the speed is most decodable, such as those pretrained on multiple frames. Project page: https://damin3927.github.io/SWEEP-Bench\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人策略必须适应移动物体的速度，然而现有的基准测试很少在不同任务和速度下衡量这种能力。我们引入了SWEEP-Bench，这是一个包含80个传送带操作任务的模拟基准，跨越16个技能类别，每个任务在13个传送带速度（0.10-0.40 m/s）下进行评估。物体通过与可见移动的传送带的物理接触进行运输。每个任务都有一个静态对应任务，并且每个评估片段在所有13个速度下使用相同的随机场景。我们在跨越全速度范围的演示上微调了八个视觉-语言-动作和世界-动作模型，比较了仅来自当前帧的观察与包含过去两帧的观察。对于六个模型，成功率在中等速度时达到峰值，它们的失败表明它们倾向于产生适合平均演示速度而不是实际速度的动作。过去帧使三个模型的成功率提高了10-40个百分点，线性探针显示传送带速度从这三个模型中也最具有线性可解码性。向其中四个模型添加真实速度输入改善了所有模型，而从图像估计的速度保持了大部分收益。这些结果表明，SWEEP-Bench暴露了依赖于速度的失败，并表明过去帧仅对速度最可解码的策略有帮助，例如在多个帧上预训练的策略。项目主页：https://damin3927.github.io/SWEEP-Bench\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估机器人策略在不同任务和速度下适应移动物体速度的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入SWEEP-Bench模拟基准，包含80个传送带操作任务，16个技能类别，13个速度（0.10-0.40 m/s）；微调8个模型并比较单帧与多帧观察；发现6个模型在中等速度成功率最高，倾向于按平均演示速度行动；过去帧使3个模型成功率提高10-40个百分点；添加真实速度输入改善4个模型，图像估计速度保持大部分收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出现有基准很少衡量机器人适应速度的能力，因此提出了SWEEP-Bench。实验揭示了模型倾向于按平均速度行动的缺陷，并证明了过去帧和速度输入的有效性。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e68. CCFinance: Reconstructing Financial News Samples from Web Archives（CCFinance：从网络档案重建金融新闻样本）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30737\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30737\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eProprietary news archives assign stories to firms, so reproducing a financial study often requires access to both the articles and the vendor\u0026#x27;s assignments. CCFinance lets researchers reconstruct firm coverage under different selection rules by recording which version of a story was captured, which issuers it names and how often each appears. From 14.8 million English-language records in Fine News, derived from public Common Crawl News, we identify 5.22 million distinct, consistently dated articles with issuer links. Exact reconstruction requires the restricted snapshot and derived artifacts. We compare GLiNER and Stanza on 250 model-labeled article leads and assess issuer links and story focus against blinded model judgments. Estimated precision among 475 accepted links is 96.8%. Among held-out articles with a detected company, requiring three mentions raises subject precision from 31.9% to 66.1%. Across the 2017-2025 panel, the same rule reduces the number of issuer-years with at least 50 qualifying stories from 13,918 to 8,641. Three reimplementations examine volatility tracking, bank networks and overnight returns. In the network study, bank pairs appearing together rose from 177 to 242 across publishers between January and April 2020, but fell from 50 to 35 within Reuters.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e专有新闻档案将报道分配给公司，因此重现金融研究通常需要同时访问文章和供应商的分配结果。CCFinance通过记录捕获的报道版本、其命名的发行人以及每个发行人出现的频率，使研究人员能够在不同选择规则下重建公司报道。从源自公共Common Crawl News的Fine News中的1480万条英语记录中，我们识别出522万篇具有发行人链接的独立、日期一致的文章。精确重建需要受限快照和派生工件。我们在250个模型标记的文章导语上比较了GLiNER和Stanza，并根据盲模型判断评估发行人链接和报道焦点。在475个接受的链接中，估计精确度为96.8%。在检测到公司的保留文章中，要求提及三次将主题精确度从31.9%提高到66.1%。在2017-2025年的面板中，同一规则将至少有50篇符合条件的报道的发行人-年数量从13,918减少到8,641。三个重新实现检查了波动率跟踪、银行网络和隔夜回报。在网络研究中，2020年1月至4月期间，跨出版商共同出现的银行对从177对增加到242对，但在路透社内部从50对下降到35对。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从公共网络档案中重建金融新闻样本，以重现依赖专有新闻档案的金融研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CCFinance，从1480万条记录中识别出522万篇带发行人链接的文章；在475个链接中估计精确度达96.8%；要求提及三次将主题精确度从31.9%提升至66.1%，并将符合条件的发行人-年数量从13,918降至8,641；重新实现了波动率跟踪、银行网络和隔夜回报研究，并在网络研究中复现了特定趋势。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出专有新闻档案的访问限制阻碍了金融研究的重现，CCFinance通过公共数据重建了公司报道。实验验证了其在链接精确度和主题聚焦上的有效性，并成功重新实现了三项金融研究。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e金融工程与数据挖掘\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e69. The norm axiom and factor hyperfields（范数公理与因子超域）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29473\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29473\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTouchard and the author asked whether every valued hyperfield, in Krasner\u0026#x27;s sense with the norm axiom, is of the form H_ρ(K): a valued field K read up to relative error ρ. The question turns on the norm axiom. If a valued hyperfield is a quotient K^times/Tcup{0} of a field, the norm axiom forces T=1+m_ρ for a valuation on K. This completes the proof of a published proposition, and it makes the question equivalent to asking whether every Krasner valued hyperfield is such a quotient. For value group Z we prove directly that it is. Without the norm axiom the answer is negative. Layering a hyperfield over a non-trivial ordered abelian group gives a factor hyperfield exactly when the hyperfield itself is one, so Massouros\u0026#x27;s hyperfields yield hyperfields with a non-trivial valuation, satisfying all the other axioms, that are not factor hyperfields. The general question remains open.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eTouchard和作者询问，在Krasner意义下带有范数公理的每个赋值超域是否都具有H_ρ(K)的形式：一个赋值域K在相对误差ρ内的读取。这个问题取决于范数公理。如果一个赋值超域是一个域的商K^times/Tcup{0}，范数公理迫使T=1+m_ρ对于K上的一个赋值。这完成了对已发表命题的证明，并使该问题等同于询问每个Krasner赋值超域是否都是这样的商。对于值群Z，我们直接证明了它是。没有范数公理，答案是否定的。在非平凡有序阿贝尔群上层叠一个超域，恰好当该超域本身是因子超域时给出一个因子超域，因此Massouros的超域产生了具有非平凡赋值、满足所有其他公理但不是因子超域的超域。一般性问题仍然开放。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究在Krasner意义下带有范数公理的赋值超域是否均具有特定形式（即赋值域在相对误差内的读取）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e证明了若赋值超域是域的商，范数公理迫使特定条件成立，完成了已发表命题的证明；直接证明了对于值群Z该命题成立；证明无范数公理时答案为否；发现Massouros的超域满足除因子超域外的所有公理；指出一般性问题仍开放。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要探讨了赋值超域与因子超域之间的数学关系，重点分析了范数公理在其中的作用。证明了特定条件下的等价性，并指出了无范数公理时的反例。局限性方面，摘要指出一般性问题仍然开放。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e数学与代数几何\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e70. UniVEP: Unifying Velocity and Endpoint Prediction for Robot Manipulation（UniVEP：统一机器人操作的速度与终点预测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26103\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26103\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFlow-matching robot policies usually use one prediction target throughout action generation, even though recovering actions from noise and polishing nearly clean actions bring different challenges. We systematically compare velocity prediction (V), endpoint prediction (X), and velocity-weighted endpoint prediction (X--V) across multiple robot policies, benchmarks, and inference budgets. On StarVLA and LiLa-WAM, X--V works best for few-step generation, while V gains more from iterative refinement. We further uncover their complementary strengths across noise levels: clean actions have concentrated covariance spectra, endpoint predictions stay more stable under high noise, and velocity predictions offer more accurate corrections near clean actions. Inspired by these findings, we introduce UniVEP, which learns both prediction targets together with consistency supervision and switches from endpoint recovery to velocity refinement as noise drops. Each step only needs one network run, and joint training also boosts single-step endpoint generation. Tests on simulated and real-world manipulation show better success rates and efficiency. On RoboTwin, UniVEP hits 61.36% success with one StarVLA run, beating the best single-target baseline at sixteen runs (59.96%). With LiLa-WAM, two runs outperform the best sixteen-step single-target baseline and cut inference latency by 77.1%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流匹配机器人策略通常在动作生成过程中使用单一的预测目标，尽管从噪声中恢复动作和打磨几乎干净的动作会带来不同的挑战。我们在多个机器人策略、基准和推理预算下，系统地比较了速度预测（V）、终点预测（X）和速度加权终点预测（X--V）。在StarVLA和LiLa-WAM上，X--V在少步生成中效果最好，而V从迭代细化中获益更多。我们进一步揭示了它们在不同噪声水平下的互补优势：干净动作具有集中的协方差谱，终点预测在高噪声下更稳定，速度预测在干净动作附近提供更准确的校正。受这些发现的启发，我们引入了UniVEP，它结合一致性监督同时学习两种预测目标，并随着噪声降低从终点恢复切换到速度细化。每一步只需要一次网络运行，联合训练也提升了单步终点生成。在模拟和真实世界操作上的测试显示出更好的成功率和效率。在RoboTwin上，UniVEP在一次StarVLA运行中达到61.36%的成功率，击败了十六次运行（59.96%）的最佳单目标基线。使用LiLa-WAM，两次运行超过了最佳的十六步单目标基线，并将推理延迟降低了77.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提高流匹配机器人策略在动作生成过程中的成功率与效率，解决从噪声恢复和打磨干净动作的不同挑战。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e系统比较了速度预测、终点预测及两者加权预测的互补优势；提出UniVEP框架，结合一致性监督同时学习两种预测目标，并根据噪声水平动态切换；每步仅需一次网络运行；在RoboTwin上，1次运行成功率达61.36%（超越16次运行的基线59.96%）；使用LiLa-WAM时，2次运行超越16步基线，推理延迟降低77.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出单一预测目标在流匹配策略中的局限性，通过分析不同预测目标在噪声水平下的互补性，提出了UniVEP。实验证明了其在模拟和真实环境中的高效性和高成功率。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [elementalsouls/Claude-BugHunter](https://github.com/elementalsouls/Claude-BugHunter)\n- **今日趋势**: 21,431 stars / 2,228 forks / 今日新增 1,826 stars\n- **项目简介**: 一个专为漏洞挖掘和外部红队工作打造的 Claude Code 技能包。\n- **核心价值**: \n  - **项目用途**：辅助安全人员进行漏洞挖掘（Bug Hunting）和外部红队渗透测试工作。\n  - **目标人群**：网络安全研究人员、红队成员、漏洞赏金猎人及安全工程师。\n  - **技术核心**：基于 Claude Code 构建的技能包，内含 84 项技能、15 个斜杠命令、681 个跨 24 个核心漏洞类别的已披露报告模式，以及企业身份与基础设施攻击矩阵。\n  - **AI/大模型相关性**：是（基于大模型 Claude Code 的扩展技能包）。\n---\n### [jingyaogong/minimind](https://github.com/jingyaogong/minimind)\n- **今日趋势**: 70,158 stars / 9,130 forks / 今日新增 727 stars\n- **项目简介**: 一个帮助用户在 2 小时内从零开始训练 64M 参数大语言模型的开源项目。\n- **核心价值**: \n  - **项目用途**：提供极简、快速的大语言模型从零训练流程，大幅降低 LLM 训练的时间成本。\n  - **目标人群**：AI 初学者、大模型开发者、高校学生及对 LLM 底层训练机制感兴趣的研究人员。\n  - **技术核心**：轻量级大语言模型训练框架，支持在 2 小时内完成 64M 参数规模 LLM 的从零训练。\n  - **AI/大模型相关性**：是（核心功能即为大语言模型的从零训练）。\n---\n\u003c/details\u003e"</script>
