    <h1>前沿科研情报 - 2026-11-25</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. Motion Mamba 2.0: Autoregressive Diffusion Mamba for Long-Horizon Humanoid Control（Motion Mamba 2.0：用于长时域人形控制的自回归扩散Mamba）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 171 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29897\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29897\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLong-horizon, real-time controllable motion generation is essential for interactive animation and humanoid robotics, where an agent must respond to changing instructions and spatial goals while moving. Existing autoregressive diffusion methods generate motion incrementally, but bounded attention caches limit access to distant history, while repeated denoising introduces substantial inference overhead. We present Motion Mamba 2.0, a Mamba-based root-body diffusion architecture that integrates local attention, resumable recurrent states, and persistent content memory (PCM) for long-horizon controllable motion generation. PCM transforms compressed motion history from Mamba recurrent states, together with state changes and text-conditioned features, into dynamically updated content slots accessible to local attention. To enable efficient inference, we further develop an execution scheme tailored to this architecture, combining CUDA Graph replay, fused kernels, and execution-flow simplification while preserving the canonical history update. Evaluations on retargeted HiPHI demonstrate accurate terminal control over rollouts of up to 39.52 s, while short-horizon comparisons on BONES Seed and retargeted HumanML3D show that the model also retains strong spatial control and text-motion matching. On an RTX 4090, the optimized execution reduces median complete-window latency from 1685.35 to 276.14 ms, achieving a median paired speedup of 6.138times while preserving identical outputs and committed states in the tested rollouts. Moreover, we conduct extensive real-world evaluation on the Unitree G1, demonstrating sequential text-guided action composition, expressive motion, and interactive locomotion through keyboard and mouse control.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e长时域、实时可控的运动生成对于交互式动画和人形机器人至关重要，在这些场景中，智能体必须在移动时对变化的指令和空间目标做出响应。现有的自回归扩散方法增量地生成运动，但有界的注意力缓存限制了对遥远历史的访问，而重复去噪引入了大量的推理开销。我们提出了 Motion Mamba 2.0，一种基于 Mamba 的根-身体扩散架构，它集成了局部注意力、可恢复的循环状态和持久内容记忆（PCM），用于长时域可控运动生成。PCM 将来自 Mamba 循环状态的压缩运动历史，连同状态变化和文本条件特征，转换为局部注意力可访问的动态更新内容槽。为了实现高效推理，我们进一步开发了一种针对该架构定制的执行方案，结合了 CUDA Graph 重放、融合内核和执行流简化，同时保留了规范的历史更新。在重定向的 HiPHI 上的评估表明，在长达 39.52 秒的展开中实现了准确的终端控制，而在 BONES Seed 和重定向的 HumanML3D 上的短时域比较表明，该模型还保留了强大的空间控制和文本-运动匹配能力。在 RTX 4090 上，优化的执行将中位数完整窗口延迟从 1685.35 毫秒降低到 276.14 毫秒，实现了 6.138 倍的中位数配对加速，同时在测试的展开中保留了相同的输出和提交状态。此外，我们在 Unitree G1 上进行了广泛的真实世界评估，展示了通过键盘和鼠标控制进行的顺序文本引导动作组合、富有表现力的运动和交互式运动。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e长时域、实时可控的运动生成，用于交互式动画和人形机器人控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Motion Mamba 2.0 架构，集成局部注意力、可恢复循环状态和持久内容记忆（PCM）；开发结合 CUDA Graph 重放、融合内核等的优化执行方案，大幅提升推理速度；在长时域和短时域任务中实现准确的终端控制、空间控制和文本-运动匹配；在真实机器人 Unitree G1 上验证了交互式运动控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了针对长时域运动生成的新架构及优化执行方案，并在多个数据集和真实机器人上进行了评估，证明了其在控制精度和推理速度上的优势。然而，摘要未提供该架构在更复杂物理交互或更多样化机器人形态上的泛化能力评估，也未提供与最新非扩散自回归方法在长时域生成质量上的详细对比局限分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/运动生成/计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness（Embo-Harness：迈向理解作为策略的前沿模型框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 90 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31201\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31201\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier multimodal models exhibit extraordinary generalization in generating robot actions from observations and instructions, enabling a new paradigm in which they serve directly as policies within closed-loop robotic harnesses. However, the design principles of such harnesses, and the capabilities underlying their strong performance, remain unclear. We present Embo-Harness, a framework for systematically studying frontier-model-as-policy harnesses. We investigate four components of the robotic agentic loop, namely, prompting, planning, action execution, and tool use, and distill six empirical findings into a practical recipe. This recipe prioritizes interfaces that exploit the model\u0026#x27;s native visual reasoning and tool-use capabilities over handcrafted plans, skills, or action priors, and identifies effective choices for action representation, chunking, reasoning effort, visual observations, short multi-action sequences, and policy refinement. On RoboLab-120, Embo-Harness achieves an 83.3\\% success rate, outperforming the strongest reported baseline by 26.2 percentage points. It also succeeds in 15 of 20 zero-shot trials across four real-world manipulation tasks. Beyond performance, controlled interventions indicate that the studied model depends more strongly on accurate spatial target estimation than on explicit low-level joint or trajectory generation. These results provide both a practical recipe for building strong frontier-model-as-policy harnesses and a clearer account of the capabilities that drive their performance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前沿多模态模型在从观察和指令生成机器人动作方面表现出非凡的泛化能力，使它们能够作为闭环机器人框架中的策略直接服务，从而开启了一种新范式。然而，此类框架的设计原则及其强大性能背后的能力仍不清楚。我们提出了 Embo-Harness，一个用于系统研究作为策略的前沿模型框架的框架。我们研究了机器人智能体循环的四个组成部分，即提示、规划、动作执行和工具使用，并将六个经验发现提炼为一个实用的指南。该指南优先考虑利用模型原生视觉推理和工具使用能力的接口，而不是手工制作的计划、技能或动作先验，并确定了动作表示、分块、推理努力、视觉观察、短多动作序列和策略细化的有效选择。在 RoboLab-120 上，Embo-Harness 达到了 83.3% 的成功率，比报告的最强基线高出 26.2 个百分点。它还在四个真实世界操作任务的 20 次零样本试验中成功了 15 次。除了性能之外，受控干预表明，所研究的模型更强烈地依赖于准确的空间目标估计，而不是显式的低级关节或轨迹生成。这些结果既为构建强大的作为策略的前沿模型框架提供了实用的指南，也对其驱动性能的能力进行了更清晰的说明。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e系统研究将前沿多模态模型直接作为闭环机器人策略的框架设计原则及其底层能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Embo-Harness 框架，研究机器人智能体循环的四个组件并提炼出实用指南；优先利用模型原生视觉推理和工具使用能力；在 RoboLab-120 上达到 83.3% 成功率，大幅超越基线；在真实世界操作任务中零样本成功率高；发现模型更依赖准确的空间目标估计而非低级关节或轨迹生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细介绍了 Embo-Harness 框架的设计原则、实用指南以及在仿真和真实世界任务中的高成功率，并通过受控干预揭示了模型依赖空间目标估计的内在机制。然而，摘要未提供该框架在不同类型机器人硬件或更复杂长序列任务中的局限性，也未详细说明推理努力等具体超参数的选择对性能的定量影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/具身智能/多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. WorldLeague: Benchmarking Physical Agency（WorldLeague：物理代理能力基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 79 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30989\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30989\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI systems can now operate Blender, follow instructions in complex video games, and manipulate objects with robot arms. What range of physical goals can today\u0026#x27;s AI systems achieve autonomously? Answering this question requires testing systems on tasks that demand different combinations of perception, memory, planning, and action. We introduce WorldLeague, a benchmark that compares AI systems on a common set of 60 simulated robot tasks by measuring progress toward each task\u0026#x27;s physical goal from the robot\u0026#x27;s trajectory. Robots explore scenes to gather evidence in WorldSeek, rearrange objects in WorldShape, and adapt to changes in WorldShift. Tying these goals to a single control interface limits which AI systems can be compared. In WorldLeague, vision-language models (VLMs) choose targets and motions, while vision-language-action models (VLAs) and world-action models (WAMs) use their native controls. For each of six capability dimensions, we measure how much progress a system makes toward its goals (Interactive Score) and how often it achieves them (physical success rate). Together, these measures form the system\u0026#x27;s Physical Agency Profile. Among 13 representative AI systems, Claude Fable 5.2 achieves 13 of the 60 goals and earns the highest mean Interactive Score (28.58/100). Fable leads in four dimensions, while GPT-6.1-Sol and GPT-6-Astra tie for first on rule-following tasks. Even when VLMs answer every final question correctly, they receive an Interactive Score of zero in 71.8\\% of those episodes. WorldLeague gives Embodied AI, Physical AI, and Agentic AI a shared basis for comparing what AI systems achieve autonomously, from partial progress toward a physical goal to full goal completion. Project Webpage: https://xyangzhou.github.io/WorldLeague\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e如今的 AI 系统可以操作 Blender、在复杂的电子游戏中遵循指令，并使用机械臂操作物体。当今的 AI 系统可以自主实现多大范围的物理目标？回答这个问题需要在需要感知、记忆、规划和动作不同组合的任务上测试系统。我们引入了 WorldLeague，这是一个基准测试，通过从机器人轨迹测量向每个任务的物理目标取得的进展，在一组通用的 60 个模拟机器人任务上比较 AI 系统。机器人在 WorldSeek 中探索场景以收集证据，在 WorldShape 中重新排列物体，并在 WorldShift 中适应变化。将这些目标绑定到单一控制接口限制了可比较的 AI 系统范围。在 WorldLeague 中，视觉语言模型（VLM）选择目标和运动，而视觉语言动作模型（VLA）和世界动作模型（WAM）使用其原生控制。对于六个能力维度中的每一个，我们测量系统向其目标取得的进展程度（交互分数）以及实现目标的频率（物理成功率）。这些测量共同构成了系统的物理代理画像。在 13 个具有代表性的 AI 系统中，Claude Fable 5.2 实现了 60 个目标中的 13 个，并获得了最高的平均交互分数（28.58/100）。Fable 在四个维度中领先，而 GPT-6.1-Sol 和 GPT-6-Astra 在遵循规则的任务中并列第一。即使 VLM 正确回答了每个最终问题，它们在 71.8% 的这些情节中仍获得零分的交互分数。WorldLeague 为具身 AI、物理 AI 和智能体 AI 提供了一个共享的基础，用于比较 AI 系统自主实现的内容，从向物理目标的部分进展到完全实现目标。项目网页：https://xyangzhou.github.io/WorldLeague\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和比较当前 AI 系统在需要感知、记忆、规划和动作组合的模拟机器人任务中自主实现物理目标的能力范围。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 WorldLeague 基准，包含 60 个模拟机器人任务，涵盖场景探索、物体重排和适应变化；设计了结合交互分数和物理成功率的物理代理画像评估指标；支持 VLM、VLA 和 WAM 等多种模型使用各自原生控制接口；评估了 13 个代表性 AI 系统，发现 VLM 即使回答正确也常获零交互分数。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一个全面的基准测试 WorldLeague，通过多维度指标评估 AI 系统的物理代理能力，并对比了多种模型的表现，揭示了 VLM 在物理交互中的局限性。然而，摘要未提供该基准中 60 个任务的具体难度分布、模拟环境的物理引擎细节，以及评估指标在不同任务类型下的权重分配或局限性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/基准测试/具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. 3AGameFactory-Motion: Agentic Rigging and Reliable Complex Motion Generation for Diverse 3D Assets（3AGameFactory-Motion：面向多样化3D资产的智能体绑骨与可靠复杂运动生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 57 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30013\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30013\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAnimating arbitrary 3D assets from instructions requires both structural inference and motion control, yet existing motion benchmarks mostly cover conventional human or animal skeletons with simple instructions. We introduce DivDynBench, which evaluates rigging and motion generation across six morphology categories, with instructions requiring multi-phase part coordination and explicit timing, angle, repetition, and trajectory constraints. With large language models, we systematically compare three common paradigms: specialized motion generation, video generation followed by motion recovery, and direct agent-driven generation. We analyze their control capabilities, cross-morphology adaptability, and generation costs. Guided by this comparison, we propose an Agentic Motion Framework in which an agent writes compact parametric skeleton and motion programs, and a deterministic executor performs rigging, kinematic solving, and geometric correction. Compact parameter control reduces generation overhead and improves rigging reliability and motion-control accuracy, providing practical guidance for deploying complex 3D motion generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e根据指令为任意 3D 资产制作动画需要结构推理和运动控制，而现有的运动基准大多涵盖具有简单指令的常规人类或动物骨骼。我们引入了 DivDynBench，它评估跨越六个形态类别的绑骨和运动生成，其指令需要多阶段部件协调以及明确的时间、角度、重复和轨迹约束。借助大型语言模型，我们系统地比较了三种常见范式：专门的运动生成、视频生成后进行运动恢复，以及直接的智能体驱动生成。我们分析了它们的控制能力、跨形态适应性和生成成本。在该比较的指导下，我们提出了一个智能体运动框架，其中智能体编写紧凑的参数化骨骼和运动程序，确定性执行器执行绑骨、运动学求解和几何校正。紧凑的参数控制减少了生成开销，并提高了绑骨可靠性和运动控制精度，为部署复杂的 3D 运动生成提供了实用指导。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和改进根据指令为多样化 3D 资产进行绑骨和复杂运动生成的能力，解决现有基准局限于简单骨骼和指令的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 DivDynBench 基准，涵盖六个形态类别及多阶段、多约束的复杂指令；系统比较了专门运动生成、视频生成后恢复和智能体驱动生成三种范式；提出智能体运动框架，结合智能体编写紧凑参数程序与确定性执行器进行绑骨和运动学求解；紧凑参数控制有效降低了生成开销并提升了绑骨可靠性与运动控制精度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了针对多样化 3D 资产的新基准 DivDynBench 和智能体运动框架，通过结合大语言模型和确定性执行器，有效提升了复杂运动生成的可靠性和精度。然而，摘要未提供 DivDynBench 中六个形态类别的具体名称、三种范式比较的定量结果数据，以及该框架在处理极端复杂拓扑或物理碰撞时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机图形学/3D动画生成/大语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. A Glimpse of Training VLMs as Foundation Models for Robotic Manipulation（训练VLM作为机器人操作基础模型的一瞥）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 53 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29338\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29338\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecently, GPT-6 Astra demonstrates strong generalization in robot control, yet limited disclosure of its training leaves open how such capabilities can be reproduced. We introduce nanoAstra, an approach to training vision-language models (VLMs) for generalizable manipulation that combines semantic action modeling with capability-preserving supervised fine-tuning (CP-SFT). nanoAstra represents robot behavior as semantic steps composed of reusable, parameterized action primitives, guided by explicit progress descriptions. Meanwhile, CP-SFT uses an explicit robot-specific system prompt to constrain manipulation outputs to a structured action space, aiming to focus adaptation on robot-specific contexts and promote specialization while minimizing interference with broader pretrained capabilities. With this formulation, we train nanoAstra on more than 5,000 hours of robot data together with general VQA data. On RoboTwin 2.0\u0026#x27;s randomized benchmark, nanoAstra-9B achieves a 17.8% zero-shot success rate, substantially outperforming advanced VLA and WAM baselines as well as similarly sized VLMs. With inference faster than the corresponding motion execution on a single H20 GPU, our model supports action-chunk-like streaming execution that overlaps inference with motion, reducing the robot\u0026#x27;s idle time from 35.0% to 6.9%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近，GPT-6 Astra 在机器人控制方面展示了强大的泛化能力，但其训练细节的有限公开使得如何复现这些能力仍是个未知数。我们引入了 nanoAstra，一种训练视觉语言模型（VLM）以实现可泛化操作的方法，该方法结合了语义动作建模与能力保持的有监督微调（CP-SFT）。nanoAstra 将机器人行为表示为由可重用的、参数化的动作原语组成的语义步骤，并在明确的进度描述指导下进行。同时，CP-SFT 使用明确的机器人特定系统提示将操作输出约束到结构化动作空间，旨在使适应集中于机器人特定上下文并促进专业化，同时最小化对更广泛的预训练能力的干扰。通过这种公式化，我们在超过 5000 小时的机器人数据以及通用 VQA 数据上训练了 nanoAstra。在 RoboTwin 2.0 的随机基准上，nanoAstra-9B 达到了 17.8% 的零样本成功率，大幅超越了先进的 VLA 和 WAM 基线以及同等规模的 VLM。在单个 H20 GPU 上，推理速度快于相应的运动执行，我们的模型支持类似动作块的流式执行，将推理与运动重叠，将机器人的空闲时间从 35.0% 减少到 6.9%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e训练视觉语言模型（VLM）以实现可泛化的机器人操作，复现前沿模型在机器人控制中的强大泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 nanoAstra 方法，结合语义动作建模与能力保持的有监督微调（CP-SFT）；将机器人行为表示为参数化动作原语的语义步骤，并使用机器人特定系统提示约束输出；在超过 5000 小时机器人数据和通用 VQA 数据上训练；在 RoboTwin 2.0 随机基准上零样本成功率达 17.8%，超越多种基线；支持流式执行，将机器人空闲时间从 35.0% 降至 6.9%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种结合语义动作建模和 CP-SFT 的 VLM 训练方法，通过结构化动作空间和流式执行显著提升了机器人操作的成功率和执行效率。然而，摘要未提供 17.8% 零样本成功率的具体任务类型分布、CP-SFT 中系统提示的具体设计细节，以及该方法在真实物理机器人上的部署效果和局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/视觉语言模型/强化学习与模仿学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. WeMM-Ecom: Advancing Multimodal Content Understanding for WeChat E-Commerce（WeMM-Ecom：推进微信电商的多模态内容理解）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 52 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30662\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30662\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present WeMM-Ecom, a family of multimodal large language models that deliver frontier e-commerce capabilities while achieving state-of-the-art general-purpose performance at their respective scales. The family spans five sizes, from a 0.8B dense model to a 35B mixture-of-experts model with 3B active parameters. Our training pipeline begins with two-stage continued pre-training that progressively raises the proportion of e-commerce data within a diverse multimodal data mixture, followed by hybrid-thinking post-training that combines on-policy distillation and reinforcement learning to support both non-thinking and thinking modes. For evaluation, we construct a comprehensive suite of 28 e-commerce benchmarks (23 in-house and five open-source) covering eight business scenarios and complement it with 64 public general-purpose benchmarks. On the e-commerce suite, WeMM-Ecom-35B-A3B surpasses substantially larger open-source flagship models, including Qwen3.8-Flash-Next, HY4, and DeepSeek-V4.1-Flash. On the general-purpose suite, every WeMM-Ecom model surpasses its similarly sized Qwen3.5 counterpart, with the lightweight variants (e.g., WeMM-Ecom-2B) showing clear advantages over leading lightweight models such as Qwen3.5-2B, MiniCPM-V-4.7-1B, and LFM3-VL-2B. Beyond benchmarks, WeMM-Ecom now powers hundreds of production use cases in WeChat, including catalog management, multimodal product search, and livestream commerce, serving billion-scale requests per day. We publicly release all model weights and detail our data curation, training recipe, and benchmark construction to facilitate future work on domain-specialized multimodal models. We have released the model weights and code to facilitate future research at https://github.com/Tencent/WeMM-Ecom.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了WeMM-Ecom，一个多模态大语言模型系列，在提供前沿电商能力的同时，在其各自规模上实现了最先进的通用性能。该系列包含五种尺寸，从0.8B的密集模型到具有3B激活参数的35B混合专家模型。我们的训练流程从两阶段继续预训练开始，在多样化的多模态数据混合中逐步提高电商数据的比例，随后是结合在策略蒸馏和强化学习的混合思考后训练，以支持非思考模式。为了进行评估，我们构建了一个包含28个电商基准测试（23个内部和5个开源）的综合套件，涵盖八个业务场景，并辅以64个公共通用基准测试。在电商套件上，WeMM-Ecom-35B-A3B大幅超越了规模更大的开源旗舰模型，包括Qwen3.8-Flash-Next、HY4和DeepSeek-V4.1-Flash。在通用套件上，每个WeMM-Ecom模型都超越了同等规模的Qwen3.5对应模型，其中轻量级变体（例如WeMM-Ecom-2B）相较于Qwen3.5-2B、MiniCPM-V-4.7-1B和LFM3-VL-2B等领先的轻量级模型展现出明显优势。除了基准测试，WeMM-Ecom现在为微信中数百个生产用例提供支持，包括目录管理、多模态商品搜索和直播电商，每天服务数十亿规模的请求。我们公开发布所有模型权重，并详细说明我们的数据整理、训练方案和基准构建，以促进未来在领域特化多模态模型方面的工作。我们已在 https://github.com/Tencent/WeMM-Ecom 发布模型权重和代码以促进未来研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发具备前沿电商能力和通用性能的多模态大语言模型系列，并构建电商基准测试套件进行评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出WeMM-Ecom模型系列（0.8B至35B MoE），在电商和通用任务上均达到同规模最先进水平。2. 采用两阶段继续预训练和结合在策略蒸馏与强化学习的混合思考后训练流程。3. 构建包含28个电商基准和64个通用基准的综合评估套件。4. 模型已在微信数百个生产用例中部署，日请求量达数十亿级。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了模型规模、训练流程（预训练与后训练）及评估基准，并展示了在电商和通用基准上的优越表现及实际部署情况。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型 / 电子商务\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. Let the Fixer Decide: Training a Code Localizer from the Fixer\u0026#x27;s Likelihood（让修复器决定：从修复器的似然性训练代码定位器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 51 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12164\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12164\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode localizers are usually trained to predict the files a reference patch edits, but the code a fixer needs to read is not the same as the code it changes. We propose Fixer-Guided Localization (FGL): the localizer proposes several localizations, a frozen fixer scores each by how likely it makes a verified patch, and the localizer is trained on these scores with weighted supervised fine-tuning, without running tests and without reinforcement learning. We build the full pipeline on Gemma 4 E4B for the Kaggle Gemma-4 Developer Agent competition, from 1,629 test-verified Kimi K3 trajectories. The FGL target helps the fixer find the bug as often as the teacher\u0026#x27;s localization while using 27.5% less code. On the development set, one EM round moves the agent in the expected direction compared with a matched control: more tasks reach a patch (53 vs. 46), fewer tasks get stuck reading files that do not exist (43 vs. 54), and more tasks are solved (8 vs. 6). Training also changes how the agent works: trained agents explore about three times more than the base model and write far fewer wrong patches, and the single agent solves up to 11 of 78 tasks, against 8 for the base model. An analysis of 13 evaluation runs identifies what limits a 4B agent under an 8-minute budget (time, repetition loops and edit quality) and gives practical lessons for training small coding agents. All data, code and adapters are publicly available.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代码定位器通常被训练来预测参考补丁编辑的文件，但修复器需要读取的代码与其更改的代码并不相同。我们提出了修复器引导定位（FGL）：定位器提出多个定位，冻结的修复器根据每个定位使验证补丁成为可能的程度对其进行评分，定位器使用加权监督微调在这些分数上进行训练，无需运行测试且无需强化学习。我们在Gemma 4 E4B上为Kaggle Gemma-4 Developer Agent竞赛构建了完整的流程，基于1,629个经过测试验证的Kimi K3轨迹。FGL目标帮助修复器找到bug的频率与教师的定位一样高，同时使用的代码减少了27.5%。在开发集上，与匹配的控制组相比，一轮EM（期望最大化）回合使智能体向预期方向移动：更多任务达到了补丁（53对46），更少任务卡在读取不存在的文件上（43对54），并且解决了更多任务（8对6）。训练也改变了智能体的工作方式：训练后的智能体探索次数约为基础模型的三倍，编写的错误补丁少得多，并且单个智能体最多解决78个任务中的11个，而基础模型为8个。对13次评估运行的分析确定了在8分钟预算下限制4B智能体的因素（时间、重复循环和编辑质量），并为训练小型编码智能体提供了实用的经验。所有数据、代码和适配器均已公开。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种修复器引导定位（FGL）方法，通过修复器的似然性评分来训练代码定位器，以优化代码修复智能体的定位能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出FGL方法，利用冻结修复器对定位器提出的多个定位进行评分，并使用加权监督微调进行训练，无需运行测试和强化学习。2. FGL目标在保持相同bug发现率的同时，减少了27.5%的代码使用量。3. 训练后的智能体在开发集上表现更优（达到补丁、解决任务数增加，读取不存在文件的情况减少）。4. 分析了限制4B智能体在8分钟预算下的因素，为训练小型编码智能体提供实用经验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的实验数据（如代码减少27.5%，任务解决数从8提升到11等），证明了FGL方法的有效性，并分析了4B智能体在8分钟预算下的限制因素。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 代码智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. ViDecide: Teaching Video Diffusion Models to Reason and Plan Step by Step（ViDecide：教导视频扩散模型逐步推理和规划）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 36 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26389\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26389\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCurrent leading video generation models can synthesize highly realistic videos, while still frequently violating physical and logical constraints in multi-step reasoning and planning, even after training with large-scale reasoning data or existing diffusion RL methods. We attribute these failures to the conventional video training paradigm, which treats a solution as a fixed-length clip rather than a chain of decisions. We present ViDecide, a decision-centric framework that trains video diffusion models to predict state transitions causally and decide when to stop, with a decision-focused training schedule. We further propose Corrective Fine-tuning (CFT), which corrects failed decisions by mapping their noise to the model\u0026#x27;s own successful continuations, achieving stable improvement without policy-gradient optimization. Across abstract games, planning tasks, and a new benchmark of multi-step robot planning, ViDecide achieves an average strict success rate of 83.8%, far above 23.3% for standard fine-tuning and 67.8% for the strongest prior method, and generalizes to larger puzzles and unseen layouts. Our framework therefore unlocks greater potential for video generation models as reliable reasoners and planners in the visual world. Project page: https://kevin-thu.github.io/ViDecide.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当前领先的视频生成模型可以合成高度逼真的视频，但在多步推理和规划中仍然经常违反物理和逻辑约束，即使在使用大规模推理数据或现有扩散强化学习方法进行训练之后也是如此。我们将这些失败归因于传统的视频训练范式，该范式将解决方案视为固定长度的片段，而不是决策链。我们提出了ViDecide，这是一个以决策为中心的框架，通过以决策为重点的训练计划，训练视频扩散模型因果地预测状态转换并决定何时停止。我们进一步提出了纠正微调（CFT），它通过将失败决策的噪声映射到模型自身的成功延续来纠正失败的决策，无需策略梯度优化即可实现稳定的改进。在抽象游戏、规划任务和一个新的多步机器人规划基准测试中，ViDecide实现了83.8%的平均严格成功率，远高于标准微调的23.3%和最强先前方法的67.8%，并能泛化到更大的谜题和未见过的布局。因此，我们的框架释放了视频生成模型作为视觉世界中可靠推理器和规划器的更大潜力。项目页面：https://kevin-thu.github.io/ViDecide。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出ViDecide框架，训练视频扩散模型进行因果状态转换预测和停止决策，以解决多步推理和规划中违反物理和逻辑约束的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出以决策为中心的ViDecide框架，改变传统将视频视为固定长度片段的范式，使模型能因果预测状态转换并决定停止时机。2. 提出纠正微调（CFT），通过将失败决策噪声映射到成功延续，无需策略梯度优化即可稳定提升。3. 在抽象游戏、规划任务及多步机器人规划基准上，平均严格成功率达83.8%，显著优于标准微调（23.3%）和最强先前方法（67.8%）。4. 模型能够泛化到更大谜题和未见布局。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确指出了现有视频生成模型在多步推理和规划中的失败原因（传统训练范式），并提出了ViDecide和CFT方法。实验结果提供了具体的成功率数字（83.8%对比23.3%对比67.8%），证明了方法的有效性。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视频生成 / 推理与规划\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. AutoPILOT: A Visual Agent Harness for Real-Time Gameplay（AutoPILOT：用于实时游戏的视觉智能体执行框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 32 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28202\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28202\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal foundation models can play video games well when the game waits for them, but often fail when it keeps running. We find that much of this gap lies in the harness, which decides what the model sees, what it remembers, and how its outputs become actions over time. Existing harnesses such as VISTA improve the first two, yet turn each model call into at most one action, so the agent acts only as often as its model thinks. We introduce AutoPILOT, which changes the third: in each model call, the model can send a primitive action, start an open-loop macro, or write a closed-loop controller that keeps playing from the screen without further model calls until it hands control back. To evaluate agents in real-time games, we build AFK-Bench, 120 diverse browser games grouped by how they respond to inaction and playable in real time or with the clock paused. With GPT-6.1 Sol under the same budgets, AutoPILOT reaches 68.6% real-time success against 38.3% for VISTA, and on GameWorld it keeps 80.0% in real time while VISTA drops from 84.1% to 42.9%. Its gains hold across models, and it reaches VISTA\u0026#x27;s final success rate at a fifth of its API cost. Our results suggest that how a harness turns model outputs into actions over time is a central yet underexplored part of agent design, and we hope AutoPILOT and AFK-Bench will serve as a foundation for agents in a world that does not wait.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态基础模型在游戏等待它们时能玩得很好，但在游戏持续运行时往往失败。我们发现这种差距很大程度上在于执行框架，它决定模型看到什么、记住什么，以及其输出如何随时间转化为动作。现有的执行框架如VISTA改善了前两者，但将每次模型调用最多转化为一个动作，因此智能体仅以其模型思考的频率行动。我们引入了AutoPILOT，它改变了第三点：在每次模型调用中，模型可以发送一个基本动作、启动一个开环宏，或编写一个闭环控制器，该控制器从屏幕持续游玩而无需进一步的模型调用，直到交还控制权。为了评估实时游戏中的智能体，我们构建了AFK-Bench，包含120种不同的浏览器游戏，根据它们对无动作的响应方式分组，可实时游玩或暂停时钟游玩。在相同预算下使用GPT-6.1 Sol，AutoPILOT达到了68.6%的实时成功率，而VISTA为38.3%；在GameWorld上，它在实时中保持80.0%，而VISTA从84.1%下降到42.9%。它的增长在不同模型间保持一致，并且以五分之一的API成本达到了VISTA的最终成功率。我们的结果表明，执行框架如何随时间将模型输出转化为动作是智能体设计中一个核心但尚未充分探索的部分，我们希望AutoPILOT和AFK-Bench能成为不等待的世界中智能体的基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出AutoPILOT视觉智能体执行框架，解决多模态基础模型在实时持续运行游戏中因执行框架限制导致的失败问题，并构建AFK-Bench评估实时游戏智能体。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出AutoPILOT执行框架，允许模型在单次调用中发送基本动作、启动开环宏或编写闭环控制器，无需持续调用模型即可持续游玩。2. 构建AFK-Bench，包含120种根据对无动作响应方式分组的浏览器游戏，支持实时或暂停评估。3. 在GPT-6.1 Sol下，AutoPILOT实时成功率（68.6%）远超VISTA（38.3%），在GameWorld实时保持率（80.0%）显著优于VISTA（42.9%）。4. 以五分之一的API成本达到VISTA的最终成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要分析了实时游戏中智能体失败的原因（执行框架将模型调用限制为单一动作），提出了AutoPILOT和AFK-Bench。提供了具体的成功率对比数据（68.6%对比38.3%，80.0%对比42.9%）和API成本优势。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e智能体 / 实时游戏与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. Plan4D: Generative Plannable 4D Worlds（Plan4D：生成式可规划4D世界）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 28 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26516\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26516\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMost world models for future prediction prioritize aestetic quality of generated videos, but offer only weak physical grounding and limited geometric consistency over time, due to the lack of explicit 4D modeling. In this paper, we introduce plan4d, a possible next milestone towards building a generative plannable 4D world model that predicts future RGB videos together with dense 4D geometry, including depth, cameras, point clouds, and scene flow from an observed scene context and text-specified actions. Since training data with paired actions and dense 4D annotations is inherently scarce, plan4d leverages the complementary priors of foundational video generators and 3D reconstructors. Specifically, we propose a model-stitching architecture that couples Depth Anything 3 with LongCat-Video and augments it with an auxiliary DPT head for scene-flow prediction. The resulting model allows us to plan and generate complex, long-horizon, and fine-grained actions in a dynamic 3D scenes, while substantially improving both visual fidelity and geometric accuracy of the generated future videos. Extensive experiments on both synthetic and real-world datasets demonstrate that plan4d achieves state-of-the-art performance in generative 4D modeling of environmental reactions. Project Page: https://fogradio.github.io/plan4d-project\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大多数用于未来预测的世界模型优先考虑生成视频的美学质量，但由于缺乏显式的4D建模，仅提供微弱的物理基础和随时间有限的几何一致性。在本文中，我们引入了plan4d，这是构建生成式可规划4D世界模型的一个可能的下一个里程碑，该模型从观察到的场景上下文和文本指定的动作中预测未来的RGB视频以及密集的4D几何，包括深度、相机、点云和场景流。由于具有成对动作和密集4D注释的训练数据本质上非常稀缺，plan4d利用了基础视频生成器和3D重建器的互补先验。具体而言，我们提出了一种模型拼接架构，将Depth Anything 3与LongCat-Video耦合，并增加了一个用于场景流预测的辅助DPT头。生成的模型使我们能够在动态3D场景中规划和生成复杂、长视野和细粒度的动作，同时大幅提高生成未来视频的视觉保真度和几何精度。在合成和真实世界数据集上的大量实验表明，plan4d在环境反应的生成式4D建模中实现了最先进的性能。项目页面：https://fogradio.github.io/plan4d-project\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出plan4d，一种生成式可规划4D世界模型，从场景上下文和文本动作中预测未来RGB视频及密集4D几何（深度、相机、点云、场景流）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出plan4d模型，能够同时预测未来RGB视频和密集4D几何（深度、相机、点云、场景流），解决现有世界模型物理基础弱和几何一致性差的问题。2. 针对4D配对训练数据稀缺的问题，利用基础视频生成器和3D重建器的互补先验。3. 提出模型拼接架构，耦合Depth Anything 3与LongCat-Video，并增加辅助DPT头用于场景流预测。4. 在合成和真实世界数据集上实现了环境反应生成式4D建模的最先进性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有世界模型缺乏显式4D建模导致物理基础和几何一致性弱的局限，提出了plan4d及其模型拼接架构。实验表明其在合成和真实数据集上达到最先进性能。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e世界模型 / 4D生成与几何建模\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. Composable Soft-Prompt Distillation of RL Experts: Toward Continual Post-Training（RL专家的可组合软提示蒸馏：面向持续后训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 27 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.27376\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.27376\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRL post-training typically produces domain experts that must then be consolidated into one model, and as new experts keep arriving, this consolidation becomes a continual process. Weight merging and multi-teacher on-policy distillation (MOPD) must re-consolidate the whole model whenever an expert is added, and can erode capabilities outside the target domains. We propose Composable Soft-Prompt Distillation (CSPD), which keeps the pre-RL model frozen, distills each RL expert independently into a soft prompt, and composes experts by concatenating their prompts without joint training. A single soft prompt suffices to distill an RL expert, recovering at least 90% of the teacher\u0026#x27;s gain in 22 of 23 math, code, and agent settings. Independently trained prompts compose well. In a multi-expert setting, the average rises with every expert added, and the full composition matches MOPD (67.83 vs. 67.79). The composition generalizes best across six held-out benchmarks. Input-space adaptation adds little serving overhead, keeping throughput within 1.5% of the unadapted backbone and reaching 2.40x that of rank-4 LoRA. These results point toward continual post-training on a fixed backbone.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e强化学习（RL）后训练通常会产生领域专家，这些专家必须随后被整合到一个模型中，并且随着新专家的不断到来，这种整合成为一个持续的过程。权重合并和多教师在线策略蒸馏（MOPD）在每次添加专家时都必须重新整合整个模型，并且可能会削弱目标域之外的能力。我们提出了可组合软提示蒸馏（CSPD），它保持预RL模型冻结，将每个RL专家独立蒸馏为软提示，并通过连接它们的提示来组合专家，而无需联合训练。单个软提示足以蒸馏一个RL专家，在23个数学、代码和智能体设置中的22个里，恢复了教师至少90%的收益。独立训练的提示组合得很好。在多专家设置中，平均值随着每个专家的添加而上升，并且完整组合与MOPD相匹配（67.83对67.79）。该组合在六个保留基准上泛化得最好。输入空间适应增加了很少的服务开销，使吞吐量保持在未适应骨干的1.5%以内，并达到4秩LoRA的2.40倍。这些结果指向了在固定骨干上进行持续后训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将多个强化学习领域专家持续整合到一个固定预训练模型中，避免重新训练整个模型并防止能力侵蚀。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CSPD方法，保持预RL模型冻结，将每个RL专家独立蒸馏为单个软提示并通过连接进行组合；在23个设置中的22个中恢复至少90%的教师收益；多专家组合匹配MOPD（67.83 vs 67.79）且在6个保留基准上泛化最好；输入空间适应使吞吐量保持在未适应骨干的1.5%以内，达到4秩LoRA的2.40倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明CSPD通过软提示组合有效避免了权重合并和MOPD需要重新整合整个模型的问题，且在多专家场景下性能匹配甚至泛化更好，推理开销极低。局限性方面，摘要未提供关于该方法在更广泛任务类型上的表现、软提示数量增加时的扩展性瓶颈或组合提示之间的潜在干扰等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习 / 模型蒸馏与持续学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. World Models as Native Latent Action Models（将世界模型作为原生潜在动作模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30898\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30898\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge and diverse video sources, such as egocentric human video and heterogeneous robot recordings, carry rich dynamics but come either without actions or without a shared action space. Latent action models (LAMs) can recover these dynamics, but they train their inverse- and forward-dynamics models (IDM, FDM) from scratch, trading off pixel reconstruction against latent capacity and accuracy. Pretrained video world models natively generate high-fidelity dynamics, yet represent them densely, entangled across all layers. Viewing the world model as a LAM, we show that these dynamics can be extracted with minimal changes to the model. Native LAM operates one pretrained video diffusion transformer as both IDM and FDM, with learnable dynamics registers as the only causal bridge between the two, and trains on counterfactual temporal pairs that differ in motion alone, so that the registers distill a video\u0026#x27;s dynamics into a compact native latent action. We further propose a pretraining paradigm for vision-language-action (VLA) policies, Pretraining Actions from World models (PAWlicy), in which Native LAM serves as a dynamics teacher on large-scale video; unlike world action models, it never generates video. Native latent actions outperform existing LAMs on the LARY benchmark in both action classification and control regression, and replay the same motion on new robots, in new scenes, and from human hands to robots, although no transfer objective is used in training. With a 3.8B model, PAWlicy reaches a 93.6% average success rate on RoboTwin 2.0 trained with domain-randomized demonstrations, the highest among VLAs. On RoboDojo, it is competitive on every dimension we evaluate, and its Precision, evaluated by us, is on par with the leading leaderboard entries. On real robots, it improves over the pi_0.5 baseline on both tasks. Both stages use only public data and a publicly released world model.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型且多样的视频源（如第一人称人类视频和异构机器人录像）携带丰富的动态信息，但要么没有动作，要么没有共享的动作空间。潜在动作模型（LAM）可以恢复这些动态，但它们从头开始训练其逆动力学和正向动力学模型（IDM、FDM），在像素重建与潜在容量和准确性之间进行权衡。预训练的视频世界模型原生生成高保真动态，但将其密集地表示并纠缠在所有层中。将世界模型视为LAM，我们表明这些动态可以通过对模型进行最小更改来提取。原生LAM将一个预训练的视频扩散Transformer同时作为IDM和FDM运行，以可学习的动态寄存器作为两者之间唯一的因果桥梁，并在仅运动不同的反事实时间对上进行训练，从而使寄存器将视频的动态蒸馏为紧凑的原生潜在动作。我们进一步提出了一种用于视觉-语言-动作（VLA）策略的预训练范式，即从世界模型预训练动作（PAWlicy），其中原生LAM在大规模视频上充当动态教师；与世界动作模型不同，它从不生成视频。原生潜在动作在LARY基准测试的动作分类和控制回归方面均优于现有的LAM，并在新机器人、新场景以及从人手到机器人上重放相同的运动，尽管在训练中没有使用迁移目标。使用3.8B模型，PAWlicy在使用域随机化演示训练的RoboTwin 2.0上达到了93.6%的平均成功率，是VLA中最高的。在RoboDojo上，它在我们评估的每个维度上都具有竞争力，并且由我们评估的精确度与领先的排行榜条目相当。在真实机器人上，它在两项任务上都优于pi_0.5基线。这两个阶段仅使用公共数据和公开发布的世界模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从缺乏动作标签或共享动作空间的大型多样视频源中提取动态信息，并将其应用于视觉-语言-动作（VLA）策略的预训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出原生LAM，利用预训练视频扩散Transformer同时作为IDM和FDM，通过可学习动态寄存器提取紧凑潜在动作；提出PAWlicy预训练范式，原生LAM作为动态教师且不生成视频；在LARY基准的动作分类和控制回归上优于现有LAM，支持跨机器人、场景和人机迁移；3.8B模型在RoboTwin 2.0上达93.6%平均成功率（VLA最高），在RoboDojo和真实机器人任务上表现优异；仅使用公共数据和公开世界模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过最小化对预训练世界模型的修改，有效提取了视频中的动态信息，并在多个仿真和真实机器人基准上取得了领先或极具竞争力的结果，且具备强大的零样本迁移能力。局限性方面，摘要未提供关于该方法在更复杂长序列任务中的表现、计算资源消耗、或动态寄存器在极端分布外场景下的鲁棒性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 视觉-语言-动作模型与视频世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. RUIBench: What Makes a Good Robot-Use Interface?（RUIBench：是什么造就了一个好的机器人使用接口？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31115\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31115\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFoundation models can reason about complex physical tasks, yet translating this intelligence into reliable robot execution remains challenging. We argue that a critical, often overlooked factor is the robot-use interface (RUI), which determines how agents express and execute physical actions. To systematically study its impact, we introduce RUIBench, comprising 30 manipulation tasks across five suites spanning world knowledge, in-context learning, discovery, dynamic interaction, and contact-rich manipulation. We further develop RUIKit, a unified framework that crosses six action abstractions with two interaction forms, yielding 13 interfaces under shared perception and control. In simulation, changing only the RUI shifts a frontier agent\u0026#x27;s success rate from 45% to 81%, and that of a fine-tuned 4B model from 13% to 47%. Our analysis reveals that effective interfaces reduce unnecessary decisions while preserving essential feedback, with their benefits shaped by agent behavior and physical uncertainty. We further uncover a verification gap, where agents frequently declare success despite observable failures, revealing the need for task-level verification beyond individual actions. Together, these findings establish RUI design as a critical factor in embodied agent reliability.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基础模型能够推理复杂的物理任务，但将这种智能转化为可靠的机器人执行仍然具有挑战性。我们认为一个关键且常被忽视的因素是机器人使用接口（RUI），它决定了智能体如何表达和执行物理动作。为了系统地研究其影响，我们引入了RUIBench，包含跨越世界知识、上下文学习、发现、动态交互和接触丰富操作的五个套件中的30个操作任务。我们进一步开发了RUIKit，这是一个统一框架，将六种动作抽象与两种交互形式交叉，在共享感知和控制下产生13个接口。在仿真中，仅更改RUI就将前沿智能体的成功率从45%提高到81%，并将微调的4B模型的成功率从13%提高到47%。我们的分析表明，有效的接口在保留必要反馈的同时减少了不必要的决策，其收益受智能体行为和物理不确定性的影响。我们进一步揭示了一个验证差距，即智能体经常在有明显失败的情况下宣布成功，揭示了超越单个动作的任务级验证的必要性。综上所述，这些发现确立了RUI设计作为具身智能体可靠性的关键因素。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e系统研究机器人使用接口（RUI）对基础模型转化为可靠机器人执行的影响，评估不同接口设计在复杂物理任务中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出RUIBench，包含5个套件的30个操作任务；开发RUIKit统一框架，在共享感知和控制下生成13个接口（6种动作抽象与2种交互形式交叉）；仿真表明仅更改RUI可将前沿智能体成功率从45%提升至81%，微调4B模型从13%提升至47%；发现有效接口能减少不必要决策并保留必要反馈；揭示了智能体在明显失败时仍宣布成功的验证差距，强调任务级验证的必要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明RUI设计对具身智能体的成功率有巨大影响（最高提升36%和34%），并指出了当前智能体在任务级验证上的缺陷。局限性方面，摘要未提供关于这13个接口在真实物理机器人上的实际部署结果、RUIKit框架的具体计算开销、或不同物理不确定性下接口收益的具体量化差异等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 具身智能体与接口设计\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. ViDiHand2: Unifying Video Diffusion Priors and Hand Geometry for 3D Hand Motion Reconstruction in the Wild（ViDiHand2：在野外统一视频扩散先验与手部几何进行3D手部运动重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30597\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30597\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLearning robot manipulation from egocentric human videos requires accurate metric 3D hand motion. Recent methods leverage pretrained video diffusion model (VDM) priors to recover occluded hands directly from full-frame videos, but their appearance-based depth regression generalizes poorly to unseen cameras. In this work, we propose ViDiHand2, a geometry-driven framework that reformulates VDM-based hand depth estimation from direct regression into fine-grained geometric constraint solving. Specifically, we introduce Fine-Grained Geometric Lifting and Clip-Level Ray Fitting, which recover metric depth by enforcing geometric consistency between pixel-aligned 2D joints and the metric structure of MANO hands, while leveraging temporal observations across the clip. Since the lifting relies on these 2D joints, to improve robustness under occlusion and image truncation, we further develop Confidence-Gated Fusion to adaptively combine geometrically lifted joints with MANO predictions according to localization confidence. Finally, we enhance the VDM backbone to better capture spatial-temporal representations and produce the per-frame 2D joint and MANO predictions that both steps rely on. Extensive experiments on seven public datasets demonstrate that ViDiHand2 consistently outperforms 18 baselines, reducing in-the-wild absolute joint error by 42% and detection failures by 8.82x compared with the best baseline on each metric, while running at 57 FPS. The code is available at https://github.com/NTUYWANG103/ViDiHand.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从第一人称人类视频中学习机器人操作需要准确的度量3D手部运动。最近的方法利用预训练的视频扩散模型（VDM）先验直接从全帧视频中恢复被遮挡的手，但其基于外观的深度回归对未见相机的泛化能力较差。在这项工作中，我们提出了ViDiHand2，一个几何驱动的框架，它将基于VDM的手部深度估计从直接回归重新表述为细粒度几何约束求解。具体而言，我们引入了细粒度几何提升和片段级射线拟合，它们通过在像素对齐的2D关节与MANO手的度量结构之间强制几何一致性来恢复度量深度，同时利用跨片段的时序观察。由于提升依赖于这些2D关节，为了提高在遮挡和图像截断下的鲁棒性，我们进一步开发了置信度门控融合，根据定位置信度自适应地将几何提升的关节与MANO预测相结合。最后，我们增强了VDM骨干，以更好地捕获空间-时间表示，并生成这两个步骤所依赖的每帧2D关节和MANO预测。在七个公共数据集上的广泛实验表明，ViDiHand2始终优于18个基线，与每个指标上的最佳基线相比，将野外绝对关节误差减少了42%，检测失败减少了8.82倍，同时运行速度达到57 FPS。代码可在 https://github.com/NTUYWANG103/ViDiHand 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从第一人称人类视频中准确恢复被遮挡手部的度量3D运动，解决现有基于视频扩散模型的方法在未见相机上泛化能力差的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出ViDiHand2框架，将基于VDM的手部深度估计转化为细粒度几何约束求解；引入细粒度几何提升和片段级射线拟合，利用2D关节与MANO度量结构的一致性恢复深度；开发置信度门控融合以提高遮挡和截断下的鲁棒性；增强VDM骨干以提取更好的时空表示；在7个公共数据集上优于18个基线，绝对关节误差减少42%，检测失败减少8.82倍，运行速度达57 FPS。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ViDiHand2通过引入几何约束和置信度门控融合，显著提升了野外3D手部运动重建的准确性和鲁棒性，同时保持了较高的推理速度。局限性方面，摘要未提供关于该方法在极端遮挡或完全无2D关节可见情况下的表现、对MANO模型本身误差的敏感性、或在不同光照/背景复杂度的真实机器人操作场景中的具体泛化能力等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D手部运动重建与视频扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. Distilling Visual Agents from Limited Interaction Experience（从有限交互经验中蒸馏视觉智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28618\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28618\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHow much interaction experience is needed to distill a capable visual agent? We study learning from few tasks and recorded interaction histories. Our framework selects representative trajectories using skill-context coverage and ordered visual-decision similarity. On-policy distillation (OPD) learns through fresh interaction on selected tasks or fresh student responses at fixed histories. Across Navigation, Sokoban, and spatial mapping, even one online training task supports transfer to other tasks. Four fixed trajectories raise a 4B student\u0026#x27;s success from 49.17% to 82.08% on standard Navigation and from 60.16% to 85.55% on Sokoban, recovering over 90% of the measured gap to a 27B teacher on these panels. On an independent Navigation panel, replay improves success from 45.83% to 76.67%, retaining 91.36% of the same-task online gain without new interaction during optimization. Training repetitions, matched supervised fine-tuning (SFT), and a 9B extension further support the value of compact experience.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e蒸馏一个有能力的视觉智能体需要多少交互经验？我们研究从少量任务和记录的交互历史中学习。我们的框架使用技能-上下文覆盖率和有序的视觉-决策相似性来选择代表性轨迹。在线策略蒸馏（OPD）通过在选定任务上的新鲜交互或在固定历史下的新鲜学生响应来学习。在导航、推箱子（Sokoban）和空间映射中，即使一个在线训练任务也支持向其他任务的迁移。四条固定轨迹将4B学生在标准导航上的成功率从49.17%提高到82.08%，在推箱子上从60.16%提高到85.55%，在这些面板上恢复了与27B教师测量差距的90%以上。在一个独立的导航面板上，重放将成功率从45.83%提高到76.67%，在优化期间没有新交互的情况下保留了91.36%的同任务在线增益。训练重复、匹配的监督微调（SFT）和9B扩展进一步支持了紧凑经验的价值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究在仅有少量任务和记录的交互历史的情况下，如何有效地蒸馏出具备能力的视觉智能体，并评估紧凑交互经验的价值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出基于技能-上下文覆盖率和视觉-决策相似性的代表性轨迹选择框架；结合在线策略蒸馏（OPD）进行训练；在导航、推箱子和空间映射任务中，仅1个在线训练任务即可实现跨任务迁移；4条固定轨迹使4B学生在导航和推箱子上的成功率大幅提升，恢复与27B教师90%以上的性能差距；在独立面板上，无新交互的重放保留了91.36%的同任务在线增益；通过训练重复、SFT和9B扩展验证了紧凑经验的价值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明通过精心选择少量代表性轨迹，可以极大地提升小模型（4B）的性能，使其逼近大模型（27B），且经验具有高度的可迁移性和重放价值。局限性方面，摘要未提供关于该框架在更复杂或连续控制任务中的表现、轨迹选择算法的具体计算成本、或当教师模型本身存在缺陷时蒸馏效果的衰减情况等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习 / 视觉智能体与模型蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. DiLE: Discrimination-Aware Latent-Space Learning for Universal Multimodal Embeddings（DiLE：用于通用多模态嵌入的判别感知潜在空间学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25419\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25419\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal large language models have greatly improved input understanding in universal multimodal embedding models. However, this understanding does not ensure that their embeddings preserve the evidence needed to distinguish relevant items from confusable alternatives. To preserve essential discriminative evidence in embeddings, this paper proposes DiLE, a discrimination-aware latent-space learning framework that combines task guidance with on-policy retrieval feedback. Specifically, a few learnable queries are used to encode task-relevant information in a compact latent space. Reasoning instructions and auxiliary answer-generation supervision shape these representations to support both task understanding and retrieval discrimination. To address task-specific discriminative needs, we design shared-private expert adaptation that integrates cross-task knowledge sharing with task-specific representation learning. Building on this, the on-policy hard-negative distillation is introduced: the student retrieves confusable candidates, and a reverse KL divergence objective aligns its embedding-based similarity distribution with the teacher\u0026#x27;s fine-grained relevance distribution over these candidates. Candidates are periodically refreshed using updated student snapshots, tying teacher supervision to the student\u0026#x27;s evolving retrieval behavior and confusions. Across four model configurations that span two backbone generations, DiLE achieves state-of-the-art performance on MMEB-v2, UVRB, and MRMR, demonstrating its effectiveness across modalities and tasks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态大语言模型极大地提高了通用多模态嵌入模型中的输入理解能力。然而，这种理解并不能确保其嵌入保留了将相关项目与易混淆替代项区分开来所需的证据。为了在嵌入中保留基本的判别证据，本文提出了DiLE，一个将任务指导与在策略检索反馈相结合的判别感知潜在空间学习框架。具体而言，使用少量可学习查询在紧凑的潜在空间中编码任务相关信息。推理指令和辅助答案生成监督塑造了这些表示，以支持任务理解和检索判别。为了解决特定任务的判别需求，我们设计了共享-私有专家适应机制，将跨任务知识共享与特定任务表示学习相结合。在此基础上，引入了在策略硬负样本蒸馏：学生模型检索易混淆的候选项，并通过反向KL散度目标将其基于嵌入的相似度分布与教师模型对这些候选项的细粒度相关性分布对齐。使用更新的学生模型快照定期刷新候选项，将教师监督与学生不断演变的检索行为和混淆联系起来。在跨越两代骨干网络的四种模型配置中，DiLE在MMEB-v2、UVRB和MRMR上取得了最先进（state-of-the-art）的性能，证明了其在不同模态和任务中的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种判别感知潜在空间学习框架（DiLE），以在通用多模态嵌入中保留区分相关项目与易混淆替代项所需的基本判别证据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 结合任务指导与在策略检索反馈，使用可学习查询在紧凑潜在空间中编码任务相关信息。2. 设计共享-私有专家适应机制，整合跨任务知识共享与特定任务表示学习。3. 引入在策略硬负样本蒸馏，利用反向KL散度对齐学生与教师的分布，并定期刷新候选项以结合学生演变的检索行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明DiLE在MMEB-v2、UVRB和MRMR上达到了SOTA性能，证明了其跨模态和任务的有效性。局限性方面，摘要未提供关于计算成本、推理延迟或特定失败案例的分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 信息检索 / 表示学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Open Vision Banana: An Open Framework for Unified Visual Perception through Generation in RGB Space（Open Vision Banana：通过RGB空间生成实现统一视觉感知的开放框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 16 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28489\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28489\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision Banana showed that a closed image generator, instruction-tuned to paint perception outputs as RGB images, becomes a generalist vision model. Does this carry over to open generators, and if not, what fails? We answer with Open Vision Banana (OVB), an open framework that adapts the 7B diffusion generator of Qwen-Image-2.1 into one instruction-driven model for metric depth, semantic, instance, and referring segmentation, using a single shared low-rank adapter and public data. Each task is a task contract whose RGB encoder, instruction, and decoder share one specification and are checked before training. Studying 42 externally evaluated checkpoints from two 100k-update runs, six exact weight-space merges, and eight controlled shorter runs, we find that the gap to the closed system is specific and measurable. Geometry is learned early while absolute scale is not: median-aligned NYUv2 δ_1 stays at 0.89--0.93 throughout training as unaligned δ_1 wanders between 0.11 and 0.50. The scale is not committed by a single sample: a ten-seed ensemble lifts unaligned δ_1 from 0.348 to 0.516 without retraining. Depth and 2D segmentation compete for the shared adapter, and weight merging moves along this trade-off without escaping it. Finally, lower validation flow loss comes with lower Cityscapes accuracy (Spearman ρapprox-0.9 between loss reduction and mIoU), so the loss cannot select checkpoints. We release code, contracts, training data, and all evaluation outputs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eVision Banana表明，一个经过指令微调以将感知输出绘制为RGB图像的封闭图像生成器，可以成为一个通用视觉模型。这能否推广到开放生成器上，如果不能，哪里会失败？我们用Open Vision Banana（OVB）来回答，这是一个开放框架，它使用单个共享的低秩适配器和公开数据，将Qwen-Image-2.1的7B扩散生成器适配为一个由指令驱动的度量深度、语义、实例和指代分割模型。每个任务都是一个任务契约，其RGB编码器、指令和解码器共享一个规范并在训练前进行检查。通过研究来自两次10万次更新运行的42个外部评估检查点、6个精确权重空间合并以及8个受控的较短运行，我们发现与封闭系统的差距是具体且可衡量的。几何结构在早期就被学习，而绝对尺度则没有：中值对齐的NYUv2 δ_1在整个训练期间保持在0.89至0.93，而未对齐的δ_1在0.11到0.50之间游荡。尺度并非由单个样本决定：一个十种子集成无需重新训练即可将未对齐的δ_1从0.348提升至0.516。深度和2D分割竞争共享适配器，权重合并沿着这种权衡移动而无法逃脱。最后，较低的验证流损失伴随着较低的Cityscapes准确率（损失减少与mIoU之间的Spearman ρ约为-0.9），因此损失无法选择检查点。我们发布了代码、契约、训练数据和所有评估输出。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Open Vision Banana (OVB) 开放框架，将7B扩散生成器适配为通过指令驱动的度量深度、语义、实例和指代分割的统一视觉感知模型，并探究开放生成器在实现通用视觉模型时的具体失败点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 使用单一共享低秩适配器和公开数据，将7B扩散生成器适配为多任务指令驱动模型。2. 引入任务契约机制，统一RGB编码器、指令和解码器的规范。3. 发现几何结构学习早于绝对尺度，且深度与2D分割在共享适配器上存在竞争权衡。4. 发现验证流损失与Cityscapes准确率呈负相关（Spearman ρ约为-0.9），表明损失无法用于检查点选择。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详尽的实验分析，揭示了开放生成器在绝对尺度学习、多任务竞争（深度与2D分割）以及损失函数有效性（无法选择检查点）方面的具体局限。局限性在于，摘要未提供该框架在下游实际任务中的最终应用效果或与其他开放框架的定量对比基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像生成 / 多任务学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. Polytropos: What Do Vision-Language Model Descriptions Make of a Cultural Object?（Polytropos：视觉语言模型的描述对文化对象意味着什么？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 16 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29355\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29355\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-language models have become a new kind of describer, writing about almost anything people see, and their descriptions now shape how cultures are known by people and by other models. Descriptions of cultures tend to turn particular things into types, and what a description loses shows what its describer lacks. We introduce Polytropos, a benchmark that measures what model descriptions of cultural objects keep of the particular object by turning each description back into an image and comparing it with the original photograph. On 374 objects from the Metropolitan Museum of Art and the Getty, with 1,870 descriptions from five models and 230 written by curators, reconstructions are recognised as the recorded culture more often than the photographs, at 54.55% to 59.09% against 52.14%, yet 16% to 21% of objects change outcome and only 0.49% of reconstructions are identified as the specific object. On the same objects, models lose recorded cultures at a rate similar to curators but gain more. Model descriptions give each object many faces, each typical of its culture and almost none the object itself.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉语言模型已经成为一种新型的描述者，对人类看到的几乎所有事物进行写作，它们的描述现在塑造了人类和其他模型对文化的认知方式。对文化的描述倾向于将特定事物转化为类型，而描述所失去的内容则显示了其描述者的缺失。我们引入了Polytropos，这是一个基准测试，通过将每个描述转化回图像并与原始照片进行比较，来衡量模型对文化对象的描述保留了多少特定对象的信息。在来自大都会艺术博物馆和盖蒂博物馆的374个对象上，包含来自五个模型的1,870条描述和策展人撰写的230条描述，重建图像被识别为所记录文化的频率高于原始照片，分别为54.55%至59.09%对52.14%，然而16%至21%的对象改变了结果，且仅有0.49%的重建图像被识别为特定对象本身。在相同的对象上，模型丢失记录文化的比率与策展人相似，但增加（泛化/典型化）得更多。模型描述赋予了每个对象许多面孔，每个都典型于其文化，而几乎没有一个是对象本身。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Polytropos基准测试，通过将视觉语言模型对文化对象的文本描述重新生成为图像并与原图对比，评估模型描述在多大程度上保留了特定文化对象的独特信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出通过文本到图像重建来评估视觉语言模型对文化对象描述保真度的新颖基准Polytropos。2. 在374个博物馆对象上评估了5个模型的1870条描述和230条策展人描述。3. 发现重建图像被识别为所属文化的概率（54.55%-59.09%）高于原始照片（52.14%），但仅有0.49%被识别为特定对象本身。4. 揭示模型描述倾向于将特定事物泛化为文化类型，赋予对象典型面孔而丢失其独特性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过定量数据（如54.55%-59.09%的文化识别率与0.49%的特定对象识别率）深刻揭示了VLM在文化描述中的类型化倾向和独特性丢失问题。局限性方面，摘要未提供不同模型之间的具体性能差异对比，也未说明该基准在评估非视觉文化属性（如历史背景、情感价值）时的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 视觉语言模型 / 文化计算 / 基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. Beam Model Technical Report（Beam 模型技术报告）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26358\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26358\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eBeam is a sparse Mixture-of-Experts (MoE) model with 501.3B total parameters and 23.4B active parameters, specifically built and optimized for coding, reasoning, and agentic workloads. Beam delivers frontier level reasoning, while requiring 3-4x less inference compute than many models of its class. Pretrained on 23.8T diverse, curated, high-quality tokens, Beam features a 1M-token context window achieved through a novel two-stage midtraining phase, built on verifiable, correctness-anchored data. Post-training leveraged a large-scale, fully asynchronous reinforcement learning (RL) campaign across 10.5K GB300 GPUs, generating over 100M rollouts over 4 weeks of training. We believe this is one of the largest scale RL runs conducted by any open lab to date. Across our evaluation suite, capabilities continued to improve as we increased RL compute, with no sign of a plateau. Supported by deep hardware-model co-design, FP8/NVFP4 quantization, and a 1.93B-parameter speculative decoding drafter (DFlash 2), Beam maximizes serving throughput with efficient, flexible deployment. Averaged across conversation turns and harm categories, Beam refuses or pivots on 88.9% of harmful requests while complying with 81.5% of harmless requests, achieving the highest refusal/pivot rate on harmful requests among open-weight models on the Pareto frontier.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eBeam是一个稀疏混合专家（MoE）模型，总参数为501.3B，活跃参数为23.4B，专门为编码、推理和智能体工作负载构建和优化。Beam提供了前沿水平的推理能力，同时所需的推理计算量比其同类中的许多模型少3-4倍。Beam在23.8T多样化、经过整理的高质量token上进行预训练，具有1M-token的上下文窗口，这是通过一个新颖的两阶段中间训练阶段实现的，建立在可验证的、以正确性为锚点的数据之上。后训练利用了跨10.5K GB300 GPU的大规模、完全异步强化学习（RL）活动，在4周的训练中生成了超过1亿次rollout。我们认为这是迄今为止任何开放实验室进行的最大规模的RL运行之一。在我们的评估套件中，随着我们增加RL计算量，能力持续提高，没有迹象表明达到了平台期。在深度硬件-模型协同设计、FP8/NVFP4量化以及1.93B参数的推测解码抽取器（DFlash 2）的支持下，Beam通过高效、灵活的部署最大化了服务吞吐量。平均跨越对话轮次和伤害类别，Beam拒绝了88.9%的有害请求或进行了转移（pivot），同时遵从了81.5%的无害请求，在帕累托前沿的开放权重模型中实现了有害请求的最高拒绝/转移率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出并优化Beam模型，一个专为编码、推理和智能体工作负载设计的稀疏MoE模型，旨在以较低的推理计算成本实现前沿水平的推理能力、长上下文处理及高效部署。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 采用501.3B总参数/23.4B活跃参数的稀疏MoE架构，推理计算量比同类模型少3-4倍。2. 通过两阶段中间训练在23.8T tokens上实现1M-token上下文窗口。3. 使用10.5K GB300 GPU进行4周的大规模异步RL训练，生成超1亿次rollouts，且能力随RL计算量增加持续提升，未见平台期。4. 结合硬件-模型协同设计、FP8/NVFP4量化和1.93B推测解码抽取器，最大化服务吞吐量。5. 在帕累托前沿的开放权重模型中实现最高的有害请求拒绝/转移率（88.9%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细列出了Beam的架构规模、训练数据量、RL训练规模及推理优化技术，展示了其在推理能力、长上下文和安全性方面的卓越表现。局限性方面，摘要未提供在具体基准测试上的详细得分，也未说明模型在极端长上下文或复杂多步推理中的具体失败案例。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 混合专家模型 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. UUBench: Understanding the Unspoken toward Full-Duplex Multimodal Interaction（UUBench：面向全双工多模态交互的理解未言之意）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30157\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30157\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEffective real-time, full-duplex multimodal interaction requires systems to understand not only what users say, but also the communicative needs conveyed through prosody, facial expressions, gestures, and context, and to generate audiovisual responses that appropriately address those needs. Existing evaluations offer limited insight into whether systems translate an understanding of such unspoken needs into effective responses. We introduce UUBench, a benchmark for assessing how well multimodal interactive systems Understand the Unspoken intent and address users\u0026#x27; implicit communicative needs. The inherent subjectivity of implicit intent inference poses a key challenge for evaluation. To address this, we introduce Process-Oriented Scoring, which grounds the assessment of intent fulfillment in observable auditory and visual cues, such as prosody and gestures. Rather than relying solely on a single overall score, it evaluates how well a response addresses the communicative needs conveyed by each applicable primitive dimension. We aggregate the dimension-level scores according to each dimension\u0026#x27;s relevance to the annotated evidence. Beyond intent fulfillment, Outcome-Oriented Scoring evaluates the naturalness, appropriateness, and human-likeness of the reply itself under audio-only, visual-only, and audiovisual conditions. To make these judgments traceable to observable evidence, we propose a Fact-Grounded Scoring JEV module, which uses structured, timestamped audiovisual observations of the user and the digital human\u0026#x27;s reply to assess one dimension or criterion at a time. UUBench provides a foundation for assessing whether multimodal interactive systems respond effectively to meaning beyond literal wording, supporting progress toward context-aware, real-time, full-duplex interaction.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e有效的实时、全双工多模态交互要求系统不仅理解用户说了什么，还要理解通过韵律、面部表情、手势和语境传达的沟通需求，并生成适当满足这些需求的音视频响应。现有的评估对系统是否将对这种未言明需求的理解转化为有效响应提供的洞察有限。我们引入了UUBench，这是一个用于评估多模态交互系统理解未言明意图和满足用户隐性沟通需求程度的基准测试。隐性意图推断的固有主观性对评估构成了关键挑战。为了解决这个问题，我们引入了面向过程的评分（Process-Oriented Scoring），它将意图满足度的评估建立在可观察的听觉和视觉线索（如韵律和手势）之上。它不依赖单一的总体分数，而是评估响应在多大程度上满足了每个适用的基本维度所传达的沟通需求。我们根据每个维度与注释证据的相关性来聚合维度级别的分数。除了意图满足度之外，面向结果的评分（Outcome-Oriented Scoring）在仅音频、仅视频和音视频条件下评估了回复本身的自然度、适当性和拟人度。为了使这些判断可追溯到可观察的证据，我们提出了一个基于事实的评分JEV模块，该模块使用用户和数字人回复的结构化、带时间戳的音视频观察，每次评估一个维度或标准。UUBench为评估多模态交互系统是否有效地响应字面意思之外的意义提供了基础，支持向上下文感知、实时、全双工交互迈进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出UUBench基准测试，旨在评估多模态交互系统理解用户隐性沟通需求（未言之意）并将其转化为有效音视频响应的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出UUBench基准，填补了评估多模态系统理解隐性意图（如韵律、表情、手势）并做出适当响应能力的空白。2. 引入面向过程的评分，将意图满足度评估建立在可观察的音视频线索上，并按维度聚合分数。3. 引入面向结果的评分，在单模态和多模态条件下评估回复的自然度、适当性和拟人度。4. 提出基于事实的评分JEV模块，利用结构化、带时间戳的音视频观察进行细粒度、可追溯的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了UUBench的评估框架，通过面向过程和面向结果的双重评分机制，以及基于事实的JEV模块，有效缓解了隐性意图评估的主观性问题。局限性方面，摘要未提供使用该基准对现有模型进行评估的具体实验结果或得分，也未说明该基准在构建数据集时的具体规模和来源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态交互 / 人机交互 / 基准测试 / 情感与意图计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. What Makes Good Data for Training Coding Agents? A Systematic Study on SWE-Gym（什么是训练代码智能体的好数据？对 SWE-Gym 的系统研究）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30207\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30207\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning (RL) trains coding agents on software tasks whose hidden tests decide the reward, yet task collections check these tests only against the reference fix. We ask what makes a task good training data, focusing on the correctness of its reward labels. We audit SWE-Gym with two LLM families, and a suspected error counts only if execution reproduces it. We find that unsolved often means mislabelled: 74% of the tasks that a 9B base model never solves have a test that rejects correct fixes (a false negative), versus 20% of those it sometimes solves. We repair or remove such tasks, and the audited tasks that remain train better policies. At equal size and matched difficulty, models trained on them score 2.4 and 2.7 points higher on held-out tasks from SWE-bench Verified and SWE-bench Pro than models trained on the original tasks, whereas simply dropping the never-solved tasks shows no such gain. We further find that wrong patches that pass (false positives) make up about a quarter of all passing patches, and that new tests that catch a quarter of them do not change held-out scores detectably. A pass rate shows whether a task yields reward, not whether that reward is right, so the reward labels themselves must be checked. To this end, we release SWE-Gym-Verified with its 1,087 audited tasks, every verdict with its executed evidence, our training sets, and the full audit pipeline.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e强化学习（RL）在软件任务上训练代码智能体，其隐藏测试决定奖励，然而任务集合仅根据参考修复来检查这些测试。我们询问是什么使一个任务成为好的训练数据，重点关注其奖励标签的正确性。我们使用两个大语言模型（LLM）家族对 SWE-Gym 进行审计，并且只有当执行重现疑似错误时才将其计算在内。我们发现，未解决通常意味着标签错误：9B 基础模型从未解决的任务中，有 74% 的测试会拒绝正确的修复（假阴性），而它有时能解决的任务中这一比例为 20%。我们修复或移除了这些任务，保留下来的经过审计的任务训练出了更好的策略。在规模相等且难度匹配的情况下，在这些任务上训练的模型在 SWE-bench Verified 和 SWE-bench Pro 的保留任务上得分比在原始任务上训练的模型分别高出 2.4 和 2.7 分，而仅仅丢弃从未解决的任务则没有显示出这种增益。我们进一步发现，通过的错误补丁（假阳性）约占所有通过补丁的四分之一，并且捕获其中四分之一的新测试并没有明显改变保留任务的得分。通过率表明任务是否产生奖励，而不是该奖励是否正确，因此必须检查奖励标签本身。为此，我们发布了 SWE-Gym-Verified，包含其 1,087 个经过审计的任务，每个判定都附有执行证据、我们的训练集以及完整的审计管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和修正用于训练代码智能体的强化学习软件任务数据集中奖励标签的正确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现未解决任务中普遍存在奖励标签错误（假阴性）；通过修复或移除错误标签任务，在匹配难度和规模下显著提升了模型在保留任务上的得分；揭示了假阳性补丁的比例及新测试对得分的影响；发布了包含1087个审计任务及完整证据的SWE-Gym-Verified数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明奖励标签的正确性对训练代码智能体至关重要，简单的通过率不能反映奖励的正确性。局限性方面，摘要未提供关于审计过程的具体计算成本、两个LLM家族的具体名称、以及该审计方法在其他数据集上的泛化能力等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 强化学习 / 大语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. GameAnything: From Any Inspirations to Playable Game Worlds（GameAnything：从任意灵感到可玩游戏世界）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29238\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29238\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI-driven game development holds the potential to transform diverse human inspirations into interactive experiences. However, existing systems and benchmarks primarily focus on explicit development specifications, with limited support for adapting multimodal references and evaluating actual gameplay experiences. We introduce GameAnything, an open-source agentic platform that transforms multimodal inspirations into playable extensions of existing games through iterative development. GameAnything integrates coding agents with an independent playtesting critic, persistent development state, and reusable experience memory to support continuous refinement. We further present GameAnything-Bench, a benchmark spanning diverse reference modalities, game creation objectives, and gaming environments, with exploratory gameplay testing to assess both functional correctness and gameplay quality. Evaluations of nine coding agent configurations reveal that current agents can adapt reference content but still struggle with playable interactions and precise modifications. Moreover, multimodal references improve content fidelity, while iterative refinement yields substantial but varying improvements across agents. These findings highlight both the potential and remaining challenges of inspiration-driven game development.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人工智能驱动的游戏开发具有将多样化的人类灵感转化为互动体验的潜力。然而，现有的系统和基准主要关注明确的开发规范，对适应多模态参考和评估实际游戏体验的支持有限。我们引入了 GameAnything，这是一个开源的智能体平台，通过迭代开发将多模态灵感转化为现有游戏的可玩扩展。GameAnything 将代码智能体与独立的试玩评论家、持久的开发状态和可重用的经验记忆相集成，以支持持续改进。我们进一步提出了 GameAnything-Bench，这是一个涵盖不同参考模态、游戏创建目标和游戏环境的基准，具有探索性游戏玩法测试，以评估功能正确性和游戏质量。对九种代码智能体配置的评估表明，当前的智能体能够适应参考内容，但在可玩交互和精确修改方面仍然存在困难。此外，多模态参考提高了内容保真度，而迭代改进在不同智能体中产生了显著但不同的提升。这些发现突出了灵感驱动的游戏开发的潜力和剩余挑战。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个将多模态灵感转化为现有游戏可玩扩展的开源智能体平台，并构建评估功能正确性和游戏质量的基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了GameAnything平台，集成代码智能体、独立试玩评论家、持久状态和经验记忆；提出了GameAnything-Bench基准，支持多模态参考和探索性玩法测试；评估发现多模态参考提升内容保真度，迭代改进带来显著提升但效果因智能体而异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前智能体在可玩交互和精确修改上仍有困难，这是该领域的主要挑战。局限性方面，摘要未提供具体的游戏环境名称、评估指标的具体数值、以及不同智能体配置的具体差异等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 游戏开发 / 多模态智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. WeightCode: Installing New Capabilities into Neural Networks via Weight-Space Programming（WeightCode：通过权重空间编程将新能力安装到神经网络中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25476\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25476\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eNeural networks encode learned capabilities in their weights, yet extending those capabilities with explicit task knowledge remains a fundamental challenge. Here we show that Weight-Space Programming (WSP), in which executable programs read, construct or modify a network\u0026#x27;s weights directly, can install new capabilities within trained neural networks. WeightCode, a WSP framework, uses a frozen language model to write executable weight programs that install new computations into trained neural networks using task knowledge and their existing weights, without gradient-based training. Once installed, the new capabilities run independently of the language model. Given a grammar or eight demonstrations, weight programs enable previously unseen command compositions (0% to 99.8% exact match) and a new pickup action (0% to 98.4% success), while preserving the original command and navigation capabilities. On ImageNet, four weight programs achieve net gains of 8.84-17.62 points while preserving clean accuracy, outperforming the best of eight fine-tuning methods under matched examples, checks, and retention constraints. In a Vision Transformer, causal interventions show that installed noise-correction gates drive robustness gains, while their selective activation preserves clean accuracy. Rerun on five independently trained Vision Transformers without further language model calls, ten weight programs retain 83-110% of their source-network gains on average, whereas copying their fixed weight edits yields negligible gains. Six programs written for an already edited network add 5.23-14.50 points of contrast robustness while retaining the previously installed noise gain. Together, these results establish WSP as a new route to acquiring and accumulating capabilities in trained neural networks through reusable weight programs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e神经网络将其学习到的能力编码在其权重中，然而用显式任务知识扩展这些能力仍然是一个基本挑战。在这里我们表明，权重空间编程（WSP）——即可执行程序直接读取、构建或修改网络的权重——可以在训练好的神经网络中安装新能力。WeightCode 是一个 WSP 框架，它使用冻结的语言模型编写可执行的权重程序，利用任务知识及其现有权重将新计算安装到训练好的神经网络中，而无需基于梯度的训练。一旦安装，新能力便独立于语言模型运行。给定语法或八个演示，权重程序能够实现以前未见过的命令组合（精确匹配率从 0% 提升至 99.8%）和新的拾取动作（成功率从 0% 提升至 98.4%），同时保留原有的命令和导航能力。在 ImageNet 上，四个权重程序在保持干净准确率的同时实现了 8.84 到 17.62 分的净增益，在匹配的样本、检查和保留约束下，优于八种微调方法中的最佳方法。在视觉 Transformer 中，因果干预表明安装的噪声校正门驱动了鲁棒性的提升，而它们的选择性激活保留了干净准确率。在五个独立训练的视觉 Transformer 上重新运行（无需进一步调用语言模型），十个权重程序平均保留了其源网络增益的 83% 到 110%，而复制其固定的权重编辑则产生可忽略不计的增益。为已编辑网络编写的六个程序增加了 5.23 到 14.50 分的对比度鲁棒性，同时保留了先前安装的噪声增益。综合这些结果，确立了 WSP 作为通过可重用的权重程序在训练好的神经网络中获取和积累能力的新途径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出权重空间编程（WSP）框架 WeightCode，通过冻结的语言模型生成可执行权重程序，在不进行梯度训练的情况下将新能力直接安装到训练好的神经网络中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WeightCode框架，无需梯度训练即可通过权重程序安装新能力；在命令组合和拾取动作上实现极高成功率且保留原有能力；在ImageNet上微调方法对比中取得显著净增益；证明了权重程序在不同独
