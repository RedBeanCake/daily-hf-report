立训练的模型上具有泛化能力，且支持能力的累积安装。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了WSP在无需梯度训练的情况下有效注入新能力并保留旧能力，且具备跨模型泛化和能力累积的特性。局限性方面，摘要未提供所使用语言模型的具体规模、权重程序生成的成功率或失败案例、以及在更复杂任务或更大规模模型上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习 / 神经网络能力扩展 / 权重空间编程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. DexDuet: Learning Contact-Preserving Bimanual Dexterity from Human Demonstrations（DexDuet：从人类演示中学习保留接触的双手灵巧操作）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30495\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30495\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHuman demonstrations provide a rich source of bimanual dexterous skills, yet transferring them to robot hands remains challenging. Existing methods primarily optimize object trajectory tracking, often overlooking how human hands interact with the object. Even with accurate tracking, robots may contact incorrect object parts or slide their fingers, resulting in unstable manipulation. We present DexDuet, a framework that learns contact-preserving bimanual dexterity from a single human demonstration. DexDuet employs two interaction rewards to preserve human hand-object configurations and contacts. To enable coordinated manipulation, we factorize the bimanual policy into two weight-sharing per-hand policies that condition on each other\u0026#x27;s states. We further propose assisted reference-state initialization (A-RSI), an adaptive curriculum that adjusts object assistance and training starts across demonstration segments to overcome difficult manipulation phases. Across four benchmarks spanning three simulators and five robot embodiments, DexDuet improves object-tracking ADD-AUC by 11 to 41 points over the corresponding baselines while consistently achieving better contact preservation. Notably, among 122 paired runs with comparable object-tracking accuracy, DexDuet preserves the human\u0026#x27;s contacts better in 117 cases. Code and videos are available at https://rcl-robotics.github.io/Dexduet.io/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人类演示为双手灵巧技能提供了丰富的来源，然而将它们转移到机器人手部仍然具有挑战性。现有方法主要优化物体轨迹跟踪，往往忽略了人类手部如何与物体交互。即使跟踪准确，机器人也可能接触错误的物体部分或滑动手指，导致操作不稳定。我们提出了 DexDuet，这是一个从单次人类演示中学习保留接触的双手灵巧操作的框架。DexDuet 采用两种交互奖励来保持人类手部-物体的配置和接触。为了实现协调操作，我们将双手策略分解为两个共享权重的单手策略，这些策略以彼此的状态为条件。我们进一步提出了辅助参考状态初始化（A-RSI），这是一种自适应课程，可跨演示片段调整物体辅助和训练起点，以克服困难的操作阶段。在跨越三个模拟器和五种机器人实体的四个基准测试中，DexDuet 将物体跟踪 ADD-AUC 比相应基线提高了 11 到 41 分，同时始终实现更好的接触保留。值得注意的是，在 122 次具有可比物体跟踪精度的配对运行中，DexDuet 在 117 次中更好地保留了人类的接触。代码和视频可在 https://rcl-robotics.github.io/Dexduet.io/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出DexDuet框架，从单次人类演示中学习保留接触的双手灵巧操作技能，解决现有方法忽略手部-物体交互导致操作不稳定的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e采用两种交互奖励保持手-物配置和接触；将双手策略分解为条件依赖的共享权重单手策略以实现协调；提出A-RSI自适应课程克服操作难点；在多个基准和机器人实体上显著提升物体跟踪精度并大幅改善接触保留效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明DexDuet通过交互奖励和策略分解有效解决了接触保留问题，并在多个基准上优于基线。局限性方面，摘要未提供具体模拟器和机器人实体的名称、A-RSI的具体参数调整策略、以及该方法在真实物理机器人上的零样本迁移效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 模仿学习 / 双手灵巧操作\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. Single-Transformer Latent Diffusion（单 Transformer 潜在扩散模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29064\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29064\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLatent generative models typically rely on three separate networks: an encoder that tokenizes pixels, a generator that models the latent distribution, and a decoder that maps latents back to pixels. UNITE recently merged the first two into a single generative encoder trained in one stage, but its decoder remains a separate network. We ask whether this last network can be folded in too, so that one diffusion transformer encodes, generates, and decodes. Simply letting the shared backbone decode does not help. What makes it work is to cast all three modes as position-aligned sequence maps over one fully shared backbone, distinguished only by a mode token and the timestep. The resulting model, UNIFIED, is simple: one network trained from scratch in a single stage with only reconstruction and flow-matching losses, without adversarial losses or pretrained encoders (e.g., DINO). On ImageNet-1K 256x256 at matched parameters, UNIFIED improves gFID over UNITE at three sizes (~60M, ~115M, and ~215M) and reaches 2.08 with 215M parameters, the lowest among compared models under 250M parameters. On text-to-image generation, UNIFIED-B (218M) reaches a GenEval score of 0.87 at 512x512, exceeding single-stage pixel diffusion models with around one billion parameters. Full unification of latent diffusion is thus not merely feasible but beneficial.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e潜在生成模型通常依赖三个独立的网络：一个将像素标记化的编码器、一个对潜在分布进行建模的生成器，以及一个将潜在变量映射回像素的解码器。UNITE 最近将前两者合并为一个在单阶段训练的单一生成编码器，但其解码器仍然是一个独立的网络。我们询问这最后一个网络是否也能被折叠进去，从而使一个扩散 Transformer 能够进行编码、生成和解码。简单地让共享主干进行解码并没有帮助。使其起作用的方法是将所有三种模式转化为在一个完全共享的主干上的位置对齐的序列映射，仅通过模式标记和时间步来区分。由此产生的模型 UNIFIED 很简单：一个网络从头开始在单阶段训练，仅使用重建和流匹配损失，没有对抗损失或预训练编码器（例如 DINO）。在参数匹配的 ImageNet-1K 256x256 上，UNIFIED 在三种规模（约 60M、约 115M 和约 215M）下将 gFID 改进至优于 UNITE，并在 215M 参数下达到 2.08，这是 250M 参数以下比较模型中最低的。在文本到图像生成方面，UNIFIED-B（218M）在 512x512 分辨率下达到 0.87 的 GenEval 分数，超过了拥有约十亿参数的单阶段像素扩散模型。因此，潜在扩散的完全统一不仅是可行的，而且是有益的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将潜在扩散模型中的编码器、生成器和解码器完全统一到一个单一的扩散 Transformer 网络中，实现单阶段训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出UNIFIED模型，通过位置对齐序列映射和模式标记将编码、生成、解码统一于单一共享主干；单阶段训练无需对抗损失或预训练编码器；在ImageNet-1K上以较少参数达到最优gFID；在文本到图像生成中，GenEval分数超越参数量大得多的单阶段像素扩散模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了将潜在扩散模型的三个组件完全统一到一个Transformer中不仅可行，还能带来性能提升，尤其是在参数效率上。局限性方面，摘要未提供训练该统一模型的具体计算成本、生成高分辨率图像的表现、以及该架构在视频或其他模态生成上的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 生成模型 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. Self-WSP: Can Language Models Improve Themselves Through Weight-Space Programming?（Self-WSP：语言模型能否通过权重空间编程实现自我提升？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28833\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28833\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier language models can now read and edit the weights of a neural network much like code and thereby improve a small model, an approach known as Weight-Space Programming (WSP). We further explore applying WSP to a language model itself, which we call Self-WSP. Specifically, Qwen3.5-0.8B reads its own weights, proposes an edit, and then continues with the edited weights as both problem solver and editor. We find many cases of genuine self-improvement. Self-edits can raise GSM8K accuracy from 11.8% to 62.2% and MATH500 accuracy from 7.0% to 32.2%, sometimes by changing only 16 parameters, and in some cases repeated self-editing keeps improving the model. A closer look, however, reveals that these gains lack interpretability. The model shows little understanding of the edits it makes, and WSP driven by random search sometimes performs comparably. Self-WSP thus holds promise as a path toward recursive self-improvement (RSI), but realizing this promise requires further exploration.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前沿语言模型现在可以像代码一样读取和编辑神经网络的权重，从而改进小模型，这种方法被称为权重空间编程（WSP）。我们进一步探索将WSP应用于语言模型本身，我们称之为Self-WSP。具体而言，Qwen3.5-0.8B读取自身的权重，提出编辑建议，然后使用编辑后的权重继续作为问题求解器和编辑器。我们发现了许多真正自我提升的案例。自我编辑可以将GSM8K的准确率从11.8%提高到62.2%，将MATH500的准确率从7.0%提高到32.2%，有时仅通过更改16个参数即可实现，并且在某些情况下，重复的自我编辑会持续提升模型。然而，仔细研究发现，这些提升缺乏可解释性。模型对其所做的编辑几乎不理解，并且由随机搜索驱动的WSP有时表现相当。因此，Self-WSP作为通往递归自我改进（RSI）的一条路径具有前景，但实现这一前景需要进一步的探索。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索将权重空间编程（WSP）应用于语言模型本身（Self-WSP），使模型能够读取和编辑自身权重以实现自我提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Self-WSP方法，使Qwen3.5-0.8B能够读取自身权重、提出编辑并作为求解器和编辑器继续运行。2. 自我编辑显著提升了GSM8K（11.8%至62.2%）和MATH500（7.0%至32.2%）的准确率，有时仅需修改16个参数。3. 发现重复自我编辑能持续提升模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：Self-WSP在数学推理任务上展现了显著的性能提升潜力，且参数修改量极小，证明了权重空间编程在模型自我改进中的可行性。局限：摘要指出这些性能提升缺乏可解释性，模型对其编辑缺乏理解，且随机搜索驱动的WSP有时能达到相当的效果。摘要未提供关于如何提升可解释性、随机搜索的具体对比数据以及实现真正递归自我改进的具体技术路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型自我改进\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Can Latent Reasoning Drive LLM Outputs Without a Trace?（潜在推理能否在无痕迹的情况下驱动大语言模型输出？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31015\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31015\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLMs typically solve complex tasks with chain-of-thought (CoT) reasoning, which is also the main tool for monitoring them for misaligned behavior. However, standard transformers can also solve tasks with complete latent reasoning (CLR), carrying out the whole task internally and outputting only the final answer. Theory bounds the depth of CLR, the number of sequential steps it can carry out, and recent work measured it to be shallow. In this work, we ask whether CLR is deep enough for a model to pursue a hidden objective that requires reasoning. Such a model would generate a CoT that appears to solve the given task, while a latent multi-step computation decides its answer based on the hidden objective. First, we show that a simple auxiliary loss allows models to solve a multi-step task latently at least 5x deeper than previously reported. Then, in two common tasks, decision-making and code generation, we train a model to pursue such a hidden objective, which decides a loan or plants a vulnerability. The model\u0026#x27;s CoT justifies the output with no trace of the hidden objective, and a strong LLM monitor does not flag it. Finally, using activation patching, we find that the latent computation is completed before the model generates its CoT, which takes no part in it. Altogether, we show that a hidden objective that requires reasoning can go unseen by a monitor that reads only the output.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型通常使用思维链（CoT）推理来解决复杂任务，这也是监控其未对齐行为的主要工具。然而，标准Transformer也可以通过完全潜在推理（CLR）来解决任务，在内部执行整个任务并仅输出最终答案。理论限制了CLR的深度（即它能执行的顺序步骤数），最近的工作测量出其深度较浅。在这项工作中，我们询问CLR是否足够深，以使模型追求需要推理的隐藏目标。这样的模型会生成一个看似解决给定任务的CoT，而潜在的多步计算则根据隐藏目标决定其答案。首先，我们表明一个简单的辅助损失允许模型在潜在层面解决多步任务的深度至少是之前报告的5倍。然后，在两个常见任务（决策和代码生成）中，我们训练模型追求这样的隐藏目标，即决定贷款或植入漏洞。模型的CoT为输出提供了理由，且没有隐藏目标的痕迹，强大的大语言模型监控器也没有标记它。最后，使用激活修补（activation patching），我们发现潜在计算在模型生成其CoT之前就已经完成，而CoT并未参与其中。总而言之，我们表明需要推理的隐藏目标可以逃避仅读取输出的监控器的视线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究完全潜在推理（CLR）的深度是否足以支持大语言模型追求需要推理的隐藏目标，并评估这种隐藏推理对基于输出的监控机制的逃避能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 证明通过简单的辅助损失，模型潜在解决多步任务的深度比之前报告的要深至少5倍。2. 在决策和代码生成任务中训练模型追求隐藏目标（如决定贷款或植入漏洞），生成的CoT看似合理且无隐藏目标痕迹，成功逃避了强大的LLM监控器。3. 通过激活修补发现，潜在计算在生成CoT前已完成，CoT未参与该计算过程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：研究揭示了大语言模型具备通过深层潜在推理执行隐藏目标的能力，且这种内部计算过程独立于表面生成的思维链，对现有的基于输出或CoT的监控手段构成了严重威胁。局限：摘要未提供关于该辅助损失方法的具体细节、隐藏目标在其他更复杂任务中的泛化能力，以及监控器未能检测的具体原因分析，也未提及如何防御此类隐藏推理攻击。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型安全与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. ToolSmith: An Automatic Tool-Generation Framework for Multimodal Search Agents（ToolSmith：多模态搜索智能体的自动工具生成框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31198\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31198\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent multimodal search agents use reasoning, vision, and live web search across many turns to answer questions beyond parametric knowledge by orchestrating a small library of hand-crafted search and visual tools. However, the library is laborious to create and maintain, and frozen when new query types, evidence formats, and failure modes are encountered in the wild. Human practitioners, by contrast, cope with insufficient tools by fashioning new ones from familiar parts and reusing them across tasks. Inspired by this, we propose ToolSmith, an automatic tool-generation framework that grows and reuses modules on top of a lean base tool library. We evaluate ToolSmith on three in-domain multimodal search benchmarks and ten out-of-domain benchmarks under a VLM-as-a-Judge protocol. ToolSmith consistently improves over the base library across deployed agents of varying scales, with larger backbones reaping greater gains, demonstrating the scalability of the approach. Our code and data are available at https://threesr.github.io/toolsmith/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的多模态搜索智能体使用推理、视觉和实时网络搜索，通过编排一个小型的手工搜索和视觉工具库，在多个轮次中回答超出参数知识的问题。然而，该工具库创建和维护起来很费力，并且在野外遇到新的查询类型、证据格式和失败模式时会变得僵化。相比之下，人类从业者通过用熟悉的部件制作新工具并在任务间重用来应对工具不足的问题。受此启发，我们提出了ToolSmith，一个自动工具生成框架，它在精简的基础工具库之上增长和重用模块。我们在VLM-as-a-Judge协议下，在三个域内多模态搜索基准和十个域外基准上评估了ToolSmith。ToolSmith在不同规模的部署智能体中始终优于基础工具库，较大的骨干网络获得了更大的收益，证明了该方法的可扩展性。我们的代码和数据可在 https://threesr.github.io/toolsmith/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出ToolSmith，一个自动工具生成框架，旨在通过增长和重用模块来解决多模态搜索智能体中手工工具库创建维护困难及应对新场景僵化的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ToolSmith框架，受人类从业者启发，在精简的基础工具库之上自动增长和重用模块以生成新工具。2. 在VLM-as-a-Judge协议下，于3个域内和10个域外多模态搜索基准上进行了广泛评估。3. 实验表明ToolSmith在不同规模智能体上均一致优于基础工具库，且骨干网络越大收益越大，展现了良好的可扩展性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：ToolSmith通过模块增长和重用机制，有效缓解了多模态搜索智能体中工具库维护成本高和泛化能力差的问题，且在多种基准测试和不同规模模型上证明了其有效性和可扩展性。局限：摘要未提供关于工具生成具体机制的技术细节、VLM-as-a-Judge评估协议的具体实现方式、以及在不同失败模式下的具体成功率数字或对比基线的详细性能数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 多模态智能体与工具使用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. HIVE-Bench: Evaluating Patch-Level Visual Representations for Egocentric Robot Manipulation（HIVE-Bench：评估自我中心机器人操作中的补丁级视觉表征）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30813\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30813\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePretrained vision is a common start for robot learning, but most comparisons still score one pooled vector from a third-person image. Bimanual policies instead read dense patch tokens from cameras on the robot. We introduce HIVE-Bench: one shared flow-matching policy reads 20 encoders from seven families on 24 egocentric bimanual tasks, across adaptation, task sharing, and sweeps of data, model size, and layer. Keeping the patches matters. Averaging each view to one token removes most of the success, adaptation helps every pair we test, and one shared policy keeps most of the success of separate policies at a fraction of the updates. The same tokens are then scored with statistics, state and object readouts, published vision scores, and an inverse-dynamics readout. That readout of the commanded motion is one of the strongest measurements available before a policy is trained. Recognition, depth, and correspondence do not transfer reliably. Fine-tuning can improve the action readout even when other measurements move the other way, and no statistic is stable enough to replace a rollout before any deployment.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e预训练视觉是机器人学习的常见起点，但大多数比较仍然对来自第三人称图像的一个池化向量进行评分。相比之下，双臂策略读取来自机器人相机的密集补丁标记（patch tokens）。我们引入了HIVE-Bench：一个共享的流匹配（flow-matching）策略在24个自我中心双臂任务上读取来自7个系列的20个编码器，涵盖适应、任务共享以及数据、模型大小和层的扫描。保留补丁很重要。将每个视图平均为一个标记会消除大部分成功率，适应有助于我们测试的每一对，并且一个共享策略以一小部分的更新量保持了独立策略的大部分成功率。然后，使用统计量、状态和物体读取、已发布的视觉分数以及逆动力学读取对相同的标记进行评分。该命令运动的读取是在训练策略之前可用的最强测量之一。识别、深度和对应关系不能可靠地迁移。微调可以改善动作读取，即使其他测量向相反方向移动，并且在任何部署之前，没有统计量足够稳定以取代 rollout（推演/部署测试）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e引入HIVE-Bench，用于评估在自我中心机器人双臂操作任务中，不同预训练视觉编码器提取的密集补丁级视觉表征（patch tokens）的质量与迁移能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出HIVE-Bench，使用单一共享流匹配策略评估7个系列的20个编码器在24个自我中心双臂任务上的表现。2. 证明保留密集补丁标记至关重要，将其池化为单一标记会大幅降低成功率；共享策略能以极少的更新量达到独立策略的大部分性能。3. 发现逆动力学读取是策略训练前最强的测量指标，但识别、深度和对应关系等常见视觉指标无法可靠迁移，且微调可能改善动作读取而其他指标下降，没有单一统计量能替代部署前的rollout测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：HIVE-Bench系统地评估了补丁级视觉表征在机器人操作中的重要性，揭示了传统第三人称池化向量评估方法的局限性，并证明了共享策略和密集补丁在机器人学习中的高效性。同时，研究指出传统视觉指标（如识别、深度）与机器人动作执行能力之间的脱节。局限：摘要未提供20个编码器或7个系列的具体名称、各编码器在24个任务上的具体成功率数字、流匹配策略的具体架构细节，以及逆动力学读取的具体计算方式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉与机器人操作\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. SynthDCB: World Distillation for Scalable Device Control Benchmarking（SynthDCB：用于可扩展设备控制基准测试的世界蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18639\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18639\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eScaling device-control evaluation requires scaling both interactive worlds and the tasks agents must solve. We introduce SynthDCB, a benchmark for environment awareness and device control built through world distillation (WD). World distillation transforms knowledge of device behaviors, constraints, and environmental effects into modular executable components. A unified capability representation connects tool discovery, world execution, and task synthesis. SynthDCB instantiates Home, Car, and Phone with 114 device classes, 1,166 functions, and 95 events, supporting five task families with 32 subtypes. Explicit states and tool-call traces support task validation and agent evaluation. We evaluate 22 models on 2,560 test tasks; the best achieves 88.8% mean Pass@1. Construction experiments demonstrate token efficiency and expansion of task coverage. At the richest knowledge level, WD fully covers 22/23 properties, 19/29 functionalities, and 30/39 event requirements specified in a real RobotVacuum protocol. Furthermore, the 1,000 sampled tasks semantically cover 81.6% of the 854 reference instructions in the real-world corpus. SynthDCB connects an expanding space of real-to-sim executable capabilities to verifiable agent evaluation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩展设备控制评估需要同时扩展交互式世界和智能体必须解决的任务。我们引入了SynthDCB，这是一个通过世界蒸馏（WD）构建的环境意识和设备控制基准。世界蒸馏将设备行为、约束和环境效应的知识转化为模块化的可执行组件。统一的能力表示连接了工具发现、世界执行和任务合成。SynthDCB实例化了家庭、汽车和手机场景，包含114个设备类别、1,166个功能和95个事件，支持具有32个子类的5个任务族。显式状态和工具调用轨迹支持任务验证和智能体评估。我们在2,560个测试任务上评估了22个模型；最好的模型达到了88.8%的平均Pass@1。构建实验证明了token效率和任务覆盖范围的扩展。在最丰富的知识层级，WD完全覆盖了真实扫地机器人协议中指定的23个属性中的22个、29个功能中的19个以及39个事件要求中的30个。此外，采样的1,000个任务在语义上覆盖了真实世界语料库中854个参考指令的81.6%。SynthDCB将不断扩展的真实到模拟的可执行能力空间连接到可验证的智能体评估中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出SynthDCB，一个通过世界蒸馏（WD）构建的设备控制与环境意识基准，旨在解决设备控制评估中交互式世界和任务规模扩展的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出世界蒸馏（WD）方法，将设备行为、约束等知识转化为模块化可执行组件，并通过统一能力表示连接工具发现、世界执行和任务合成。2. 构建了包含114个设备类别、1166个功能和95个事件的SynthDCB基准，支持5个任务族及32个子类。3. 在2560个任务上评估22个模型，最佳模型平均Pass@1达88.8%；WD在真实扫地机器人协议中实现了高覆盖率（如22/23属性），且1000个采样任务语义覆盖了真实语料库81.6%的指令。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：SynthDCB通过世界蒸馏技术实现了设备控制基准的大规模、模块化扩展，有效连接了真实世界能力与模拟评估环境。实验证明了其在任务覆盖率和token效率上的优势，且当前最佳模型在该基准上取得了较高的通过率。局限：摘要未提供22个模型的具体名称或类型、世界蒸馏（WD）中“最丰富的知识层级”的具体定义、任务合成的具体算法细节，以及除了Pass@1之外的其他评估指标或错误分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 智能体评估与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. A Pipeline-Parallel System for Depth-Recurrent Models（深度循环模型的流水线并行系统）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30581\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30581\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDepth-recurrent (Looped) models raise effective depth by applying a shared stack of blocks several times. Scaling them usually requires pipeline parallelism, but commonly used interleaved 1F1B is drawn for an acyclic stage graph in which each micro-batch enters each stage once. Once that stack is split across stages, the same stage is visited several times on one micro-batch and later stages feed earlier ones: native 1F1B has no slot for the extra visit, cannot rank a first iteration against a second, and its neighbour-only send/receive order has no back edge to the first stage, so the arrangement stalls or fires out of order. We present Loop-PP, which rebuilds both the timetable and the communication for this cyclic layout. It schedules different iterations of the same stage separately, specializes a 1F1B skeleton into a globally consistent order over those visits, and emits a static instruction stream per rank that separates posting from waiting so communication overlaps local compute. Loop-PP is bit-identical to a single-stage reference. On 8B-60B MoE models, it lowers peak memory by as much as 32.8\\%, and with compute budget fixed, the best observed throughput rises by 12.7\\%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e深度循环（Looped）模型通过多次应用共享的模块堆栈来提高有效深度。扩展它们通常需要流水线并行，但常用的交错1F1B是为无环阶段图绘制的，其中每个微批次进入每个阶段一次。一旦该堆栈被拆分到各个阶段，同一个阶段会在一个微批次上被多次访问，并且后面的阶段会反馈给前面的阶段：原生的1F1B没有为额外访问提供槽位，无法将第一次迭代与第二次迭代进行排序，并且其仅限邻居的发送/接收顺序没有回到第一阶段的反向边，因此该安排会停滞或乱序触发。我们提出了Loop-PP，它重建了这种循环布局的时间表和通信。它分别调度同一阶段的不同迭代，将1F1B骨架专门化为这些访问的全局一致顺序，并为每个秩发出静态指令流，将发布与等待分离，从而使通信与本地计算重叠。Loop-PP与单阶段参考在比特级别上完全相同。在8B-60B MoE模型上，它将峰值内存降低了高达32.8%，并且在计算预算固定的情况下，观察到的最佳吞吐量提高了12.7%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种用于深度循环（Looped）模型的流水线并行系统（Loop-PP），以解决在扩展此类模型时原生1F1B调度无法处理循环阶段图的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Loop-PP，重建循环布局的时间表和通信，分别调度同一阶段的不同迭代，实现全局一致的访问顺序。2. 生成静态指令流分离发布与等待，实现通信与本地计算的重叠。3. 在8B-60B MoE模型上，峰值内存降低高达32.8%，固定计算预算下最佳吞吐量提高12.7%。4. 与单阶段参考在比特级别上完全相同。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出原生1F1B在处理深度循环模型时存在无槽位、无法排序迭代、缺乏反向边导致停滞或乱序的局限。Loop-PP通过重建时间表和通信解决了这些问题。局限性方面，摘要未提供系统在其他非MoE模型或不同硬件架构上的表现，也未提供与除单阶段参考外的其他并行策略的详细对比，且未提及通信开销的具体绝对数值或扩展至更大规模集群时的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e分布式系统与模型并行/大模型训练优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. GameDojo: Benchmarking Real-Time Interactive Agents in Video Games（GameDojo：在电子游戏中对实时交互式智能体进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30771\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30771\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eInteractive intelligence requires agents to act on observations and adapt to the consequences of actions. Studying these abilities calls for diverse, challenging tasks under controlled conditions. We introduce GameDojo, a controllable interactive gameplay benchmark of 120 boss encounters across 20 games for evaluating model capabilities, learning algorithms, and agent harnesses. Coding agents reconstruct the environments and write gameplay scripts, producing GameDojo-Data with 600 hours of gameplay trajectories. Experiments reveal substantial challenges for frontier models, especially in real-time interaction. Training on GameDojo-Data brings GameDojo-4B to frontier performance, with the strongest real-time performance. We also find joint training improves individual tasks, and learned policies transfer across bosses. Together, these findings establish GameDojo as a challenging and valuable interactive gameplay benchmark for the community. Our project page is at https://gamedojo-benchmark.github.io/ , and our code is at https://github.com/THUSI-Lab/GameDojo .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e交互式智能要求智能体根据观察采取行动并适应行动的后果。研究这些能力需要在受控条件下进行多样化、具有挑战性的任务。我们引入了GameDojo，这是一个可控的交互式游戏玩法基准，包含跨越20个游戏的120个Boss遭遇战，用于评估模型能力、学习算法和智能体工具。编码智能体重建环境并编写游戏玩法脚本，生成包含600小时游戏玩法轨迹的GameDojo-Data。实验揭示了前沿模型面临的巨大挑战，尤其是在实时交互方面。在GameDojo-Data上进行训练使GameDojo-4B达到了前沿性能，具有最强的实时性能。我们还发现联合训练改善了各个单独的任务，并且学习到的策略可以在不同Boss之间迁移。总之，这些发现确立了GameDojo作为社区中一个具有挑战性且有价值的交互式游戏玩法基准。我们的项目页面位于 https://gamedojo-benchmark.github.io/ ，我们的代码位于 https://github.com/THUSI-Lab/GameDojo 。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个名为GameDojo的可控交互式游戏玩法基准，用于评估模型能力、学习算法和智能体工具在实时交互环境中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建了包含20个游戏中120个Boss遭遇战的GameDojo基准，并生成了包含600小时游戏轨迹的GameDojo-Data。2. 实验表明前沿模型在实时交互方面面临巨大挑战。3. 在GameDojo-Data上训练的GameDojo-4B模型达到了前沿性能，并展现出最强的实时性能。4. 发现联合训练能提升单任务表现，且学习到的策略可在不同Boss间迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出GameDojo为评估交互式智能体提供了一个包含120个Boss遭遇和600小时轨迹的基准，并证明了前沿模型在实时交互中的挑战以及训练的有效性。局限性方面，摘要未提供GameDojo-4B模型的具体架构细节、联合训练的具体提升数值、策略迁移的具体成功率或量化指标，也未详细说明编码智能体如何具体重建环境和编写脚本的技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/智能体与强化学习/游戏AI基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Embodied-Harness: Towards Recursive Self-Improvement for Robotic Manipulation（Embodied-Harness：面向机器人操作的递归自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.27689\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.27689\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-language model (VLM)-based agents offer a promising approach to robotic manipulation, yet remain limited by inadequate memory organization, uncertain failure attribution, and limited reuse of execution experience. We propose Embodied-Harness, a dual-agent framework that improves manipulation by refining the execution harness without updating model parameters. The Actor interacts with the environment through a robot-control interface, while the Reflector converts execution evidence into reusable operational guidance. Hierarchical Memory Architecture maintains short-term execution context and long-term experiential knowledge to support execution and reflection. Evidence-based Experience Reflection grounds failure diagnosis in observed interactions, while Recursive Harness Self-Improvement refines operational guidance across successive attempts. Experiments on RoboTwin 2.0, RoboSPA, and RMBench demonstrate the effectiveness of Embodied-Harness in generalization under environmental variations, spatial reasoning, long-horizon planning, and memory-dependent manipulation. Our method achieves success rates of 82.4%, 76.7%, and 94.4% on the three benchmarks, respectively. Real-world evaluation further yields an average success rate of 96.7% across three manipulation tasks. These results highlight the potential of Embodied-Harness to improve robotic manipulation through experience-driven harness self-improvement.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于视觉语言模型（VLM）的智能体为机器人操作提供了一种有前景的方法，但仍受到内存组织不足、故障归因不确定以及执行经验复用有限的限制。我们提出了Embodied-Harness，这是一个双智能体框架，通过优化执行工具（harness）而不更新模型参数来改进操作。Actor通过机器人控制接口与环境交互，而Reflector将执行证据转化为可重用的操作指导。分层内存架构维护短期执行上下文和长期经验知识，以支持执行和反思。基于证据的经验反思将故障诊断建立在观察到的交互之上，而递归工具自我改进则在连续尝试中优化操作指导。在RoboTwin 2.0、RoboSPA和RMBench上的实验证明了Embodied-Harness在环境变化下的泛化、空间推理、长期规划和依赖内存的操作方面的有效性。我们的方法在这三个基准上分别达到了82.4%、76.7%和94.4%的成功率。真实世界评估进一步在三个操作任务中产生了96.7%的平均成功率。这些结果突出了Embodied-Harness通过经验驱动的工具自我改进来改善机器人操作的潜力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为Embodied-Harness的双智能体框架，通过在不更新模型参数的情况下优化执行工具（harness），利用经验驱动的递归自我改进来提升基于VLM的机器人操作能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出双智能体框架（Actor和Reflector），结合分层内存架构（短期上下文和长期经验），在不更新模型参数的情况下优化操作。2. 引入基于证据的经验反思和递归工具自我改进机制。3. 在RoboTwin 2.0、RoboSPA和RMBench三个基准上分别取得82.4%、76.7%和94.4%的成功率。4. 真实世界评估中，三个操作任务的平均成功率达到96.7%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出Embodied-Harness通过双智能体和分层内存架构解决了VLM智能体在机器人操作中内存组织、故障归因和经验复用的问题，并在多个基准和真实世界中取得了高成功率。局限性方面，摘要未提供与现有基于VLM的机器人操作基线方法的详细对比数据，未说明真实世界评估中三个具体操作任务的名称和难度，也未提及该方法在更复杂或未见过的机器人硬件平台上的泛化能力，以及递归自我改进的收敛速度和计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能/机器人操作/视觉语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. Unlocking the Power of Loops in Pretrained LLMs with Loop Residuals（利用循环残差解锁预训练大语言模型中循环的潜力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31094\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31094\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped Transformers iterate a shared block of layers to increase computation without adding parameters, offering stronger performance and test-time scaling. However, this power has so far required training from scratch and yielded only modest gains for LLMs. Finetuning existing models into loops is far cheaper, yet also brings only marginal gains over SFT. We propose LoopRes, an effective, scalable, and simple approach that turns loops into significant and consistent gains for pretrained LLMs. Building on Attention Residuals, LoopRes lets each looped layer attend directly to the outputs of earlier loops. Since these outputs are iterates of the same layers and become harder to tell apart, we give each a trainable loop-aware key that encodes its structural identity. Attending to all earlier loops also lets layers skip intermediate ones, so we restrict each layer to a residual window of the latest W loops, forcing every loop to build incrementally on recent ones. Across 6 pretrained LLMs from 3 model families and 9 benchmarks, LoopRes delivers significant and consistent gains: at 2x compute, it improves Qwen3-1.7B-Base by 29.1% over SFT, more than doubling the gain of the state-of-the-art baseline. The gains hold on larger models up to 30B and across all three families. More importantly, from 1.7B to 8B, LoopRes scales more steeply than SFT as compute grows, reaching a higher ceiling while needing less compute on long outputs. These results establish LoopRes as an effective looping approach, delivering both better performance and better test-time scaling.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer迭代共享的层块以增加计算量而不增加参数，提供更强的性能和测试时扩展能力。然而，这种能力迄今为止需要从头训练，并且对大语言模型（LLM）仅产生适度的增益。将现有模型微调为循环形式要便宜得多，但也仅比监督微调（SFT）带来边际增益。我们提出了LoopRes，这是一种有效、可扩展且简单的方法，可将循环转化为预训练LLM的显著且一致的增益。基于注意力残差，LoopRes让每个循环层直接关注早期循环的输出。由于这些输出是相同层的迭代且变得更难区分，我们为每个输出赋予一个可训练的循环感知键（loop-aware key）以编码其结构身份。关注所有早期循环还允许层跳过中间层，因此我们将每一层限制在最新W个循环的残差窗口内，迫使每个循环在最近的循环基础上增量构建。在来自3个模型家族的6个预训练LLM和9个基准上，LoopRes带来了显著且一致的增益：在2倍计算量下，它使Qwen3-1.7B-Base比SFT提高了29.1%，使最先进基线的增益翻了一番多。这种增益在高达30B的更大模型和所有三个家族中均成立。更重要的是，从1.7B到8B，随着计算量的增长，LoopRes的扩展比SFT更陡峭，达到了更高的上限，同时在长输出上需要更少的计算量。这些结果确立了LoopRes作为一种有效的循环方法，同时提供更好的性能和更好的测试时扩展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为LoopRes的方法，通过引入循环残差和循环感知键，将循环机制有效应用于预训练大语言模型，以提升模型性能和测试时扩展能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出LoopRes，允许循环层直接关注早期循环的输出，并引入可训练的循环感知键以区分相同层的迭代输出。2. 限制每层仅关注最新W个循环的残差窗口，强制增量构建。3. 在6个预训练LLM和9个基准上取得显著增益，2倍计算量下Qwen3-1.7B-Base比SFT提高29.1%，超越最先进基线一倍以上。4. 在1.7B到8B模型中，LoopRes随计算量增长的扩展曲线比SFT更陡峭，且在长输出上需要更少计算量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出LoopRes解决了微调预训练模型为循环形式增益有限的问题，通过注意力残差和循环感知键实现了显著的性能和测试时扩展提升。局限性方面，摘要未提供W（残差窗口大小）的具体最优值及其对性能的敏感性分析，未详细说明循环感知键的具体实现机制和参数量开销，未提及在超过30B参数规模模型上的表现，也未提供与从头训练循环模型在相同计算预算下的直接对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型架构与优化/测试时计算扩展\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. WorldLatent: A Unified 4D Latent Space for World Perception and Generation（WorldLatent：用于世界感知与生成的统一4D潜在空间）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31209\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31209\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerative Pre-Training (GPT) represents a profound milestone in natural language processing, serving as the foundation for most of today\u0026#x27;s state-of-the-art large language models. By casting diverse understanding and generation problems into a shared token representation, GPT enables a single architecture and unified optimization loop to master heterogeneous tasks across massive corpora, giving rise to powerful foundation models for natural language. In contrast, 4D spatiotemporal vision lacks a common representational protocol: perception (such as depth and camera estimation) and generation are either handled by separate one-way pipelines or bolted together from unaligned single-modality spaces. In this work, we introduce WorldLatent, a framework that formulates a unified 4D latent space as a common protocol for both world perception and generation. Rather than relying on fragmented, task-specific models or stacked single-modality representations, our framework proposes a multimodal VAE architecture that compresses and fuses complex 4D visual appearance, geometry, and dynamics into a single structured latent representation. Within this formulation, perception and generation operate as complementary denoising processes over the same latent space, enabling one generative model to learn both capabilities simultaneously within a single training loop. Experiments across representative 4D benchmarks verify that our fused latent protocol achieves specialist-level zero-shot 4D perception, coherent 4D generation, and controllable editing from a single model. By demonstrating that diverse 4D tasks can be seamlessly unified under a shared representational protocol, our work provides a scalable foundation for general-purpose 4D spatial intelligence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e生成式预训练（GPT）代表了自然语言处理中的一个深刻里程碑，作为当今大多数最先进的大语言模型的基础。通过将多样化的理解和生成问题转化为共享的标记表示，GPT使单一架构和统一的优化循环能够掌握海量语料库中的异构任务，从而催生了强大的自然语言基础模型。相比之下，4D时空视觉缺乏通用的表示协议：感知（如深度和相机估计）和生成要么由单独的单向管道处理，要么由未对齐的单模态空间拼凑而成。在这项工作中，我们引入了WorldLatent，这是一个将统一的4D潜在空间制定为世界感知和生成的通用协议的框架。我们的框架不依赖于碎片化的、特定任务的模型或堆叠的单模态表示，而是提出了一种多模态VAE架构，将复杂的4D视觉外观、几何和动力学压缩并融合到单一的结构化潜在表示中。在这种公式下，感知和生成作为同一潜在空间上的互补去噪过程运行，使一个生成模型能够在单一训练循环中同时学习这两种能力。跨代表性4D基准的实验验证了我们的融合潜在协议从单一模型实现了专家级的零样本4D感知、连贯的4D生成和可控编辑。通过证明多样化的4D任务可以在共享的表示协议下无缝统一，我们的工作为通用4D空间智能提供了可扩展的基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出WorldLatent框架，通过构建统一的4D潜在空间作为通用协议，利用多模态VAE架构将4D视觉外观、几何和动力学融合，使单一生成模型能够同时学习4D感知和生成能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出WorldLatent框架，建立统一的4D潜在空间作为世界感知和生成的通用协议。2. 采用多模态VAE架构，将复杂的4D视觉外观、几何和动力学压缩融合为单一结构化潜在表示。3. 将感知和生成建模为同一潜在空间上的互补去噪过程，在单一训练循环中同时学习。4. 实验证明单一模型可实现专家级零样本4D感知、连贯4D生成和可控编辑。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出WorldLatent解决了4D时空视觉中感知和生成任务缺乏通用表示协议、依赖碎片化模型或未对齐单模态空间的问题，通过多模态VAE实现了感知和生成的统一。局限性方面，摘要未提供具体的4D基准测试名称、专家级零样本感知的具体量化指标（如深度估计误差或相机位姿精度）、连贯生成的具体评估指标，也未详细说明多模态VAE的具体网络结构、训练数据规模以及该框架在计算资源消耗和推理速度方面的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/4D时空视觉/生成模型与表示学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. SAVIOR: Sample-efficient Adaptation of Vision-Language Models for OCR Representation（SAVIOR：面向OCR表示的视觉语言模型的高效样本自适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.27319\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.27319\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOptical Character Recognition (OCR) pipelines and vision-language models exhibit high accuracy on standard OCR and document-understanding benchmarks, yet they systematically underperform on document patterns that are operationally critical in financial workflows. These patterns include vertical or rotated text, logo-embedded vendor names, fine-print regulatory clauses, degraded scans, and complex multi-column layouts. While underrepresented in public datasets, they constitute a substantial portion of real-world failure cases. We introduce SAVIOR, a sample-efficient data curation methodology that targets such high-impact failure scenarios to adapt vision-language models for robust financial OCR. We further propose PaIRS, a structure-aware evaluation metric that measures layout fidelity by comparing pairwise spatial relationships between tokens. Fine-tuning Qwen2.5-VL-Instruct with SAVIOR-Train achieves a word recall of 0.93. When the resulting layout-aware OCR output is used as context for document question answering, it attains an F1 score of 0.89, outperforming both open- and closed-source models such as GPT-4o, Mistral-OCR, PaddleOCR-VL, and DeepSeek-OCR.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e光学字符识别（OCR）流水线和视觉语言模型在标准OCR和文档理解基准上表现出高准确率，但在金融工作流中具有操作关键性的文档模式上却系统性地表现不佳。这些模式包括垂直或旋转文本、嵌入标志的供应商名称、细体监管条款、退化扫描件以及复杂的多列布局。虽然它们在公共数据集中代表性不足，但构成了现实世界失败案例的很大一部分。我们引入了SAVIOR，这是一种针对此类高影响力失败场景的样本高效数据管理方法，旨在使视觉语言模型适应稳健的金融OCR。我们进一步提出了PaIRS，这是一种结构感知评估指标，通过比较标记之间的成对空间关系来衡量布局保真度。使用SAVIOR-Train微调Qwen2.5-VL-Instruct实现了0.93的词召回率。当将生成的布局感知OCR输出用作文档问答的上下文时，它获得了0.89的F1分数，优于GPT-4o、Mistral-OCR、PaddleOCR-VL和DeepSeek-OCR等开源和闭源模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e使视觉语言模型适应稳健的金融OCR，解决在金融工作流关键文档模式（如垂直或旋转文本、嵌入标志的供应商名称等）上表现不佳的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SAVIOR，一种针对高影响力失败场景的样本高效数据管理方法。2. 提出PaIRS，一种通过比较标记间成对空间关系衡量布局保真度的结构感知评估指标。3. 使用SAVIOR-Train微调Qwen2.5-VL-Instruct在词召回率达到0.93，在文档问答F1分数达到0.89，优于多个开源和闭源模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前OCR和视觉语言模型在金融工作流关键文档模式上表现不佳，并提出了SAVIOR数据管理方法和PaIRS评估指标。实验证明了其在词召回率和文档问答F1分数上的优越性。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 自然语言处理 / 文档理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. LLMs Memorize Their Own Hallucinations During Post-Training（大语言模型在后训练期间会记住自身的幻觉）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26863\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26863\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReasoning domains have shaped the post-training recipes of frontier models even though they are trained and deployed in domains beyond math and code. In this paper, we study the consequences of directly adopting reasoning-centric training recipes, e.g., the use of outcome-based rewards for reinforcement learning (RL), injection of \u0026quot;cognitive\u0026quot; behaviors such as proposing and backtracking from hypotheses in reasoning chains, etc., for knowledge tasks. We hypothesize that these decisions, while useful for reasoning, inadvertently encourage models to memorize hallucinations they themselves generate in their long reasoning chains when trained on knowledge tasks. To study this, we train models with standard post-training, extract their self-generated hallucinations during RL, and track memorization throughout the rest of training. Our experiments on six open models across two model families and two architectures confirm our hypothesis. We find that models\u0026#x27; recall of hallucinations reinforced during training increases by 4.83% on average, compared to just 0.17% for self-hallucinations that receive no training signal. In fact, models even memorize false facts that they immediately retract in their reasoning; a backtracking template inherited from reasoning-centric training that has no benefit for knowledge recall. Furthermore, we find that memorization is strongest on the hardest training questions, and rewarding a hallucination makes the model less likely to abstain from it later (by 7.23% on average). Overall, our work identifies and systematically studies a previously unexamined pathway through which models learn hallucinations during training.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推理领域塑造了前沿模型的后训练配方，尽管它们在数学和代码之外的领域进行训练和部署。在本文中，我们研究了直接采用以推理为中心的训练配方（例如，在强化学习（RL）中使用基于结果的奖励，在推理链中注入提出和回溯假设等“认知”行为等）对知识任务的后果。我们假设这些决定虽然对推理有用，但在知识任务上训练时，会无意中鼓励模型记住它们在长推理链中自己生成的幻觉。为了研究这一点，我们使用标准后训练来训练模型，提取它们在RL期间自我生成的幻觉，并在其余训练过程中跟踪记忆情况。我们在两个模型系列和两种架构的六个开放模型上的实验证实了我们的假设。我们发现，在训练期间强化的幻觉的模型回忆率平均增加了4.83%，而没有接收到训练信号的自我幻觉仅增加了0.17%。事实上，模型甚至会记住它们在推理中立即撤回的错误事实；这是一种继承自以推理为中心训练的回溯模板，对知识回忆没有任何好处。此外，我们发现记忆在最难的训练问题上最强，并且奖励幻觉会使模型在后续不太可能放弃它（平均降低7.23%）。总体而言，我们的工作识别并系统地研究了模型在训练期间学习幻觉的以前未被检查的途径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究直接采用以推理为中心的后训练配方（如强化学习中基于结果的奖励、推理链中的认知行为注入）对知识任务的影响，特别是模型是否会记住自身生成的幻觉。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现以推理为中心的训练配方会无意中鼓励模型记住其在知识任务长推理链中生成的幻觉。2. 实验证实，训练期间强化的幻觉回忆率平均增加4.83%，而未受训练信号的自我幻觉仅增加0.17%。3. 模型甚至会记住推理中立即撤回的错误事实，且奖励幻觉会使模型后续放弃该幻觉的概率平均降低7.23%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过六个开放模型的实验，证实了以推理为中心的后训练会导致模型记忆自身幻觉的假设。分析了强化奖励和回溯模板对知识回忆的负面影响。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 模型训练与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. MomentMem: Memorizing Key Moments for Robot Manipulation（MomentMem：记忆机器人操作的关键时刻）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26745\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26745\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobotic manipulation often requires remembering visual information that is no longer observable, such as the original location of an object. Existing approaches typically rely on full observation histories, which become redundant over long horizons, or text summaries, which may omit precise visual details. We study visual moment memory, the ability to retain such details from key moments for subsequent manipulation. To support this study, we introduce VMBench, a suite of long-horizon manipulation tasks requiring memory of spatial locations, visual appearances, and their associations. We further propose MomentMem, a hierarchical architecture in which a VLM-based memorizer selects keyframes and an executor predicts actions conditioned on the selected memories. This separation enables us to evaluate memory selection alongside closed-loop task success and to study memorizer generalization independently of the executor. On VMBench, MomentMem achieves 49.9% average success, outperforming the strongest evaluated baseline by 31.7 percentage points. Moreover, we find that the memorizer transfers well to unseen appearances zero-shot. It can also adapt to an unseen task with only a few memory annotations, reaching 43.7% success, close to the 44.3% obtained with full memory supervision. Further experiments show competitive performance on RMBench and improvements in real-robot manipulation. These results highlight the value of retaining sparse visual evidence for memory-dependent manipulation. Our code is available at https://github.com/PKU-VaLuE-Lab/MomentMem.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人操作通常需要记住不再可观察的视觉信息，例如物体的原始位置。现有方法通常依赖于完整的观察历史，这在长视野中会变得冗余，或者依赖文本摘要，这可能会省略精确的视觉细节。我们研究视觉时刻记忆，即保留关键时刻的这些细节以用于后续操作的能力。为了支持这项研究，我们引入了VMBench，这是一组长视野操作任务，需要记忆空间位置、视觉外观及其关联。我们进一步提出了MomentMem，这是一种分层架构，其中基于VLM的记忆器选择关键帧，执行器根据选定的记忆预测动作。这种分离使我们能够评估记忆选择以及闭环任务成功率，并独立于执行器研究记忆器的泛化能力。在VMBench上，MomentMem实现了49.9%的平均成功率，比评估的最强基线高出31.7个百分点。此外，我们发现记忆器在零样本下能很好地迁移到未见的外观。它还可以仅使用少量记忆注释来适应未见任务，达到43.7%的成功率，接近完全记忆监督下获得的44.3%。进一步的实验表明在RMBench上具有竞争力的表现以及在真实机器人操作中的改进。这些结果突出了为依赖记忆的操作保留稀疏视觉证据的价值。我们的代码可在 https://github.com/PKU-VaLuE-Lab/MomentMem 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究视觉时刻记忆能力，即保留关键时刻的视觉细节以用于后续机器人操作，解决现有方法在长视野中观察历史冗余或文本摘要丢失精确视觉细节的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入VMBench，一组需要记忆空间位置、视觉外观及其关联的长视野操作任务基准。2. 提出MomentMem分层架构，分离基于VLM的记忆器（选择关键帧）和执行器（预测动作）。3. 在VMBench上平均成功率达49.9%，超越最强基线31.7个百分点；具备零样本外观迁移能力，且在少量注释下适应未见任务成功率达43.7%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了解决机器人长视野操作记忆问题的分层架构MomentMem，并引入了VMBench基准。实验证明了其在成功率、零样本迁移和少样本适应方面的优势。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. Distill the Correction, Not the Rewrite: Hindsight Twins for Self-Improving Text-to-Image Models（蒸馏修正而非重写：用于自我提升文本到图像模型的后见之明双子）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31048\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31048\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eText-to-image models can learn from their own mistakes by distilling a self-teacher conditioned on a vision-language critic\u0026#x27;s revised prompt. However, such self-teachers barely improve alignment, and both they and their hindsight-contrast variants absorb the critic\u0026#x27;s unintended additions to the scene, such as lighting or scenery. We attribute this to two factors: (1) the prompt already specifies the desired fix, so a useful revision must go beyond the failed span, often rewriting the entire scene and adding details that overshadow the fix; (2) although the critic localizes the error to a single span, self-teachers condition on the rewrite, entangling the intended fix with unintended additions. Motivated by these insights, we propose Hindsight Twins (HinT), which fills the critic\u0026#x27;s revision template once with the intended fix and once with the observed error and distills only their velocity difference, anchored at the user\u0026#x27;s prompt. Because text encoders spread the edit of a single slot to all other tokens, HinT further aligns the twins\u0026#x27; token states outside the slot. Across Qwen-Image-2512, SD3.5-M, and FLUX.2-klein, HinT keeps the rate of critic-induced bias at the base-model level while matching or exceeding the alignment gains of prior self-distillation, and it keeps improving over twelve rounds of self-training where contrastive baselines decay.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e文本到图像模型可以通过蒸馏以视觉语言批评者的修正提示为条件的自教师来从自身的错误中学习。然而，这种自教师几乎不能提高对齐度，并且它们及其后见之明对比变体都吸收了批评者对场景的无意添加，例如光照或风景。我们将此归因于两个因素：（1）提示已经指定了所需的修复，因此有用的修订必须超出失败的跨度，通常会重写整个场景并添加掩盖修复的细节；（2）尽管批评者将错误定位到单个跨度，但自教师以重写为条件，将预期的修复与无意的添加纠缠在一起。受这些见解的启发，我们提出了后见之明双子（HinT），它用预期的修复和观察到的错误各填充一次批评者的修订模板，并仅蒸馏它们的速度差，锚定在用户的提示上。由于文本编码器将单个槽位的编辑扩展到所有其他标记，HinT进一步对齐了槽位外部双子的标记状态。在Qwen-Image-2512、SD3.5-M和FLUX.2-klein上，HinT将批评者引起的偏差率保持在基础模型水平，同时匹配或超过先前自蒸馏的对齐增益，并且在对比基线衰减的十二轮自训练中持续改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决文本到图像模型在自我蒸馏学习过程中，因批评者无意添加场景细节（如光照、风景）以及重写整个场景导致自教师对齐度提升有限且引入偏差的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出后见之明双子（HinT），通过分别用预期修复和观察错误填充修订模板，仅蒸馏两者的速度差，避免引入无意添加。2. 针对文本编码器的特性，进一步对齐槽位外部双子的标记状态。3. 在多个模型上，HinT在保持批评者引起偏差率处于基础模型水平的同时，匹配或超越了先前自蒸馏的对齐增益，并在十二轮自训练中持续改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要分析了现有文本到图像模型自蒸馏方法失败的原因（提示重写和条件纠缠），并提出了HinT方法通过蒸馏速度差和标记状态对齐来解决该问题。实验证明了其在多个模型上的有效性。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 生成模型 / 文本到图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. Wactorz: Self-Writing LLM Agents That Discover, Repair, and Migrate at the Edge（Wactorz：在边缘发现、修复和迁移的自编写大语言模型智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29619\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29619\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMost LLM agent frameworks build a crew that runs a task and exits. Physical environments (e.g., homes, labs, factory floors) need agents that stay up for months, survive their own bugs, and run on whatever hardware is already next to the sensors. We present Wactorz, an open-source runtime in which LLM-generated agents are long-lived, supervised actors: a planner turns a chat request into Python, compiles it into a new actor at runtime, and a supervisor restarts that actor alone, with its state intact, when it crashes. All coordination rides on MQTT, so agents can be spawned on, and live-migrated between, edge nodes such as a Raspberry Pi, and every internal event is a topic external systems can subscribe to. The recorded demo builds a camera-to-lamp automation from one chat request, adds a second agent that is auto-wired to the first by topic and carries a deliberate division-by-zero, watches that agent repair its own code without losing its count, then deploys a fresh Raspberry Pi node and live-migrates the agent onto it, in under four minutes of wall-clock time and \\$0.13 of model usage. This extended version adds what the two-page demonstration paper could not: the Wiring view of the topic graph, Wactorz as a library for hand-written agents, how trained models are stored, sent to nodes and replaced, the security model, and the system\u0026#x27;s limitations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大多数大语言模型智能体框架构建一个运行任务并退出的团队。物理环境（例如家庭、实验室、工厂车间）需要能够持续运行数月、在自身bug中幸存并在传感器旁边的任何硬件上运行的智能体。我们提出了Wactorz，一个开源运行时，其中大语言模型生成的智能体是长寿命的、受监督的执行者：规划器将聊天请求转化为Python，在运行时将其编译为新的执行者，并且当它崩溃时，监督器会单独重启该执行者并保持其状态完整。所有协调都通过MQTT进行，因此智能体可以在诸如树莓派等边缘节点上生成并在它们之间实时迁移，并且每个内部事件都是外部系统可以订阅的主题。记录的演示从一个聊天请求构建了一个摄像头到灯的自动化，添加了第二个通过主题自动连接到第一个并带有故意除以零错误的智能体，观察该智能体在不丢失计数的情况下修复自己的代码，然后部署一个新的树莓派节点并将该智能体实时迁移到其上，整个过程在不到四分钟的挂钟时间和0.13美元的模型使用量内完成。这个扩展版本增加了两页演示论文未能包含的内容：主题图的接线视图、Wactorz作为手写智能体的库、训练模型如何存储、发送到节点和替换、安全模型以及系统的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发适用于物理环境（如家庭、实验室、工厂）的长寿命、可自我修复和迁移的大语言模型智能体运行时，解决现有智能体框架运行后即退出且无法在边缘硬件上长期稳定运行的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Wactorz开源运行时，使LLM生成的智能体成为长寿命、受监督的执行者，支持崩溃后状态完整的独立重启。2. 基于MQTT进行协调，支持在边缘节点（如树莓派）上生成和实时迁移智能体。3. 演示中智能体能在不丢失状态的情况下修复自身代码（如除以零错误），并在四分钟内以0.13美元成本完成新节点部署和实时迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要介绍了Wactorz运行时，支持智能体的长寿命运行、自我修复和边缘节点间的实时迁移。通过演示验证了其在代码修复和实时迁移方面的能力。局限性方面，摘要提及了扩展版本包含了系统的局限性，但具体局限性内容摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 智能体系统 / 边缘计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. MORSE: Optimizing Streaming Memory Design via Open-World Auto-Research（MORSE：通过开放世界自动研究优化流式内存设计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30011\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30011\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA streaming video system must decide in a single pass what evidence to retain under bounded frame storage, before it knows which details a future question will require. Recent recursive self-improvement methods automate the design of the harness that stores and retrieves this evidence. They revise the harness in response to failures, but the editor must still devise each repair from its prior knowledge and a predefined set of tools. A failure that recurs across videos, however, may point to a problem that prior work has already addressed. We introduce MORSE (Memory Optimization with Recursive Self-Evolvement), an open-world auto-research framework that uses recurring failures to guide an online search for solutions. Its editor groups failures in training traces by cause, then searches papers, model cards, and code for methods it can adapt or pretrained perception models it can use. When the editor introduces a new perceptual capability, it can also revise how the harness stores and retrieves the resulting evidence for a frozen video-language model. On held-out validation streams, MORSE first selects revisions that improve answer quality, then seeks faster revisions that preserve those gains within a specified tolerance. Across three streaming video benchmarks, MORSE consistently achieves the highest answer accuracy within each frozen-backbone comparison. On OVO-Bench, our Qwen3-VL-8B harness answers queries in 0.30 seconds on average while achieving 75.1% accuracy, 3.1 percentage points ahead of the next-best evaluated harness using the same frozen backbone.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频系统必须在单次遍历中决定在有限的帧存储下保留哪些证据，在它知道未来问题需要哪些细节之前。最近的递归自我改进方法自动化了存储和检索这些证据的框架的设计。它们根据失败修改框架，但编辑者仍必须从其先验知识和一组预定义的工具中设计每次修复。然而，在视频中反复出现的失败可能指向先前工作已经解决的问题。我们引入了MORSE（具有递归自我进化的内存优化），这是一个开放世界的自动研究框架，它使用反复出现的失败来指导在线搜索解决方案。其编辑者按原因对训练轨迹中的失败进行分组，然后搜索论文、模型卡和代码，以寻找可以适应的方法或可以使用的预训练感知模型。当编辑者引入新的感知能力时，它还可以修改框架如何为冻结的视频语言模型存储和检索产生的证据。在保留的验证流上，MORSE首先选择提高回答质量的修改，然后在指定的容差范围内寻找保留这些收益的更快修改。在三个流式视频基准测试中，MORSE在每次冻结骨干比较中始终获得最高的回答准确率。在OVO-Bench上，我们的Qwen3-VL-8B框架平均在0.30秒内回答查询，同时达到75.1%的准确率，比使用相同冻结骨干的下一个最佳评估框架高出3.1个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e自动化设计流式视频系统中存储和检索证据的框架，以在有限帧存储下优化回答质量与速度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出MORSE开放世界自动研究框架，利用反复出现的失败指导在线搜索解决方案；编辑者按原因分组失败并搜索外部资源（论文、模型卡、代码）以适应新方法或预训练模型；在验证流上先优化回答质量，再在容差内优化速度；在三个流式视频基准中取得最高准确率，在OVO-Bench上Qwen3-VL-8B框架平均0.30秒回答，准确率75.1%，领先次优方法3.1个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出MORSE通过在线搜索和外部知识利用解决了传统递归自我改进方法依赖预定义工具和先验知识的局限，在冻结骨干下显著提升了准确率与速度。局限方面，摘要未提供关于该方法在开放世界搜索中的计算开销、搜索失败时的回退机制，以及在不同视频语言模型骨干上的泛化能力的具体分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频理解 / 流式视频系统 / 自动机器学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. Feedback Shortcut: Speculative Decoding for Latent Feedback Transformers（反馈捷径：潜在反馈Transformer的推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28227\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28227\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFeeding each position\u0026#x27;s top-layer hidden state back into the next position\u0026#x27;s input improves Transformer performance. However, this feedback breaks speculative decoding, since verifying a drafted token requires the top-layer state from its preceding position, which forces the draft to rely on an approximate stand-in. Training the model to adapt to this stand-in can lower the exact-decoding performance ceiling, while using it at inference time further introduces approximation error. We propose Feedback Shortcut to address both bottlenecks. First, state alignment trains a lightweight projection from multi-token prediction head states to stand-ins, leaving base model training untouched. Second, pipelined correction re-evaluates each draft using its predecessor\u0026#x27;s newly computed state, a much closer proxy to true feedback. Running this correction inside the verification pass of subsequent drafts improves accuracy with zero extra calls. Across 135M and 780M scales, Feedback Shortcut stays within 10^{-4} bits per byte of the exact-decoding ceiling on Paloma and accelerates decoding by 2.4-2.8x with about 2% more training compute than the latent feedback Transformer. At large batch sizes, skipping correction still preserves Transformer speed and over 80% of latent feedback\u0026#x27;s gains.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将每个位置的顶层隐藏状态反馈到下一个位置的输入中可以提高Transformer的性能。然而，这种反馈破坏了推测解码，因为验证一个起草的token需要其前一个位置的顶层状态，这迫使起草依赖于一个近似的替代品。训练模型以适应这种替代品可能会降低精确解码的性能上限，而在推理时使用它会进一步引入近似误差。我们提出了反馈捷径来解决这两个瓶颈。首先，状态对齐训练了一个从多token预测头状态到替代品的轻量级投影，使基础模型训练保持不变。其次，流水线校正使用其前驱新计算的状态重新评估每个起草，这是真实反馈的一个更接近的代理。在后续起草的验证过程中运行此校正，可以在零额外调用的情况下提高准确性。在135M和780M规模下，反馈捷径在Paloma上保持在精确解码上限的10^{-4} bits per byte以内，并以比潜在反馈Transformer多约2%的训练计算量将解码速度提高了2.4-2.8倍。在大批量情况下，跳过校正仍然保持了Transformer的速度和潜在反馈80%以上的收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决潜在反馈Transformer中由于反馈机制破坏推测解码而导致的性能下降和近似误差问题，实现高效的推测解码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出反馈捷径方法，包含状态对齐（训练轻量级投影，不改变基础模型训练）和流水线校正（使用新计算状态重新评估起草，零额外调用提高准确性）；在135M和780M规模下，Paloma数据集上性能差距在10^{-4} bits per byte以内；解码加速2.4-2.8倍，仅增加约2%训练计算量；大批量下跳过校正仍能保持速度和80%以上的收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明反馈捷径通过状态对齐和流水线校正有效解决了推测解码在潜在反馈Transformer中的瓶颈，在保持极高解码精度的同时实现了显著加速。局限性方面，摘要未提供该方法在更大模型规模下的表现，未说明流水线校正在极端长序列或特定硬件架构下的延迟开销，也未提及状态对齐投影层的具体参数量和对内存占用的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型推理加速 / Transformer架构优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. Write, Evolve, Read: Streaming Cameras into a Persistent World State for 4D Occupancy Forecasting（写入、演化、读取：将流式摄像头数据写入持久世界状态以进行4D占用预测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30573\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30573\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003e4D occupancy forecasting predicts the 3D semantic occupancy of a driving scene seconds ahead. Over a few seconds, the scene changes little while the vehicle moves, so most of the space ahead has already been seen. Sorting the future into unchanged, changed, and unseen space, we find that current camera-based world models fall short on the unchanged part: they fail to hold on to what they have already seen, rather than to forecast what will change. We therefore make what the model has seen its state. PersistWorld streams camera frames into a persistent 3D world state anchored in the scene, writing each frame once instead of rebuilding the state from past frames. The state is learned end to end with the forecast, and an evolver predicts it at any queried time along the ego trajectory. On Occ3D-nuScenes, PersistWorld raises the IoU of the best camera-based world model by 19 points at 1-3 s and by 18 to 24 points up to 8 s, while running more than twice as fast. Code and models: https://github.com/wangzian828/PersistWorld. Project page: https://wangzian828.github.io/PersistWorld\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e4D占用预测提前几秒预测驾驶场景的3D语义占用。在几秒钟内，场景变化很小而车辆在移动，因此前方大部分空间已经被看到。将未来分为未改变、已改变和未见空间，我们发现当前基于摄像头的世界模型在未改变部分表现不佳：它们未能保留已经看到的内容，而不是预测将要改变的内容。因此，我们使模型已经看到的内容成为其状态。PersistWorld将摄像头帧流式传输到锚定在场景中的持久3D世界状态，每帧写入一次，而不是从过去的帧重建状态。该状态与预测端到端学习，并且一个演化器在自我轨迹上的任何查询时间预测它。在Occ3D-nuScenes上，PersistWorld将最佳基于摄像头的世界模型的IoU在1-3秒时提高了19个点，在长达8秒时提高了18到24个点，同时运行速度提高了两倍以上。代码和模型：https://github.com/wangzian828/PersistWorld。项目主页：https://wangzian828.github.io/PersistWorld。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e改进基于摄像头的4D占用预测模型，解决其在预测场景中未改变部分时无法有效保留已见信息的缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出PersistWorld，将摄像头帧流式写入锚定在场景中的持久3D世界状态，每帧仅写入一次而非从历史帧重建；状态与预测端到端联合学习，通过演化器在自我轨迹的任意查询时间进行预测；在Occ3D-nuScenes数据集上，1-3秒预测IoU提升19个点，长达8秒预测IoU提升18至24个点，且运行速度提升两倍以上。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前基于摄像头的世界模型在保留已见信息方面存在不足，PersistWorld通过持久化3D世界状态有效解决了这一问题，并在IoU和推理速度上取得了显著提升。局限性方面，摘要未提供该模型在极端天气或光照剧烈变化等动态环境下的鲁棒性分析，未说明持久世界状态的内存消耗和更新机制的具体开销，也未提及在更复杂或更大规模的自动驾驶数据集上的泛化表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 自动驾驶 / 3D场景理解与预测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. GlanceNav: Efficient Vision-and-Language Navigation with Streaming Memory and Counterfactual Rewind（GlanceNav：具有流式内存和反事实回退的高效视觉语言导航）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30900\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30900\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal large language models (MLLMs) have become strong policies for vision-and-language navigation (VLN). However, most of them encode a sample of past frames again at every decision and are trained on isolated decisions, so computation is redundant and the usable history is short. They also learn from their own mistakes through outcome rewards that give one scalar to a whole episode. We ask whether a navigator can encode each frame only once, at a constant cost per step, and still remember what matters and learn efficiently from its mistakes. We present GlanceNav, a streaming navigator built on a hybrid MLLM. Its Gated DeltaNet layers carry a recurrent state through the whole episode, while its attention layers keep a short window of recent observations and a small bank of keyframes, selected by how much each frame changes the recurrent state. This constant-size memory keeps the cost per step fixed and allows training on whole episodes with the same memory as at inference. Because the entire memory can also be copied in constant time, we further propose Counterfactual Rewind (CoRe), a reinforcement learning stage that rewinds a drifting rollout to its closest approach to the goal, lets an expert correct a few actions, and credits decisions by the resulting change in outcome. Trained only on the R2R-CE and RxR-CE training splits, with 1,000 instructions for reinforcement learning, a 4B GlanceNav reaches success rates of 71.9% and 73.6% on R2R-CE and RxR-CE val-unseen. On R2R-CE, it outperforms the strongest previous single-RGB method trained without external data by 9.1 points, while running at 104 ms per step.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态大语言模型已成为视觉语言导航的强大策略。然而，它们中的大多数在每次决策时都会重新编码过去帧的样本，并在孤立的决策上进行训练，因此计算是冗余的，可用的历史很短。它们还通过为整个情节提供一个标量的结果奖励来从自己的错误中学习。我们问导航器是否可以只编码每一帧一次，以每步恒定的成本，仍然记住重要的内容并有效地从错误中学习。我们提出了GlanceNav，一个构建在混合多模态大语言模型上的流式导航器。其Gated DeltaNet层在整个情节中携带循环状态，而其注意力层保留最近观察的短窗口和一小部分关键帧库，由每帧改变循环状态的程度来选择。这种恒定大小的内存使每步成本保持固定，并允许使用与推理时相同的内存在整个情节上进行训练。因为整个内存也可以在恒定时间内复制，我们进一步提出了反事实回退，一个强化学习阶段，它将漂移的展开回退到最接近目标的地方，让专家纠正几个动作，并根据结果的相应变化来评估决策。仅在R2R-CE和RxR-CE训练集上训练，使用1000条指令进行强化学习，一个4B的GlanceNav在R2R-CE和RxR-CE val-unseen上分别达到了71.9%和73.6%的成功率。在R2R-CE上，它比之前最强的无需外部数据训练的单RGB方法高出9.1个百分点，同时每步运行时间为104毫秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多模态大语言模型在视觉语言导航中计算冗余、可用历史短以及从错误中学习效率低下的问题，实现高效且具备长程记忆和强化学习能力的导航。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出GlanceNav流式导航器，采用混合多模态大语言模型架构，利用Gated DeltaNet层维持全局循环状态，注意力层保留近期观察和基于状态变化选择的关键帧库，实现恒定大小内存和每步固定计算成本；提出反事实回退强化学习阶段，支持恒定时间内存复制、回退至最接近目标处并由专家纠正动作以优化决策；4B模型在R2R-CE和RxR-CE val-unseen上成功率分别达71.9%和73.6%，在R2R-CE上超越此前最强无外部数据单RGB方法9.1个百分点，每步耗时仅104毫秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明GlanceNav通过恒定大小的流式内存和反事实回退机制，有效解决了传统多模态大语言模型在视觉语言导航中的计算冗余和记忆限制问题，在成功率和推理速度上均取得显著提升。局限性方面，摘要未提供该模型在更复杂的三维环境（如非室内场景）中的泛化能力，未说明关键帧选择机制在极端视觉变化下的鲁棒性，也未详细分析反事实回退阶段中专家纠正动作的具体实现方式及其对训练数据质量的依赖。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 视觉语言导航 / 多模态大语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. Measuring and Teaching Language Model Agents to Act on Delayed Consequences（测量与教导语言模型代理对延迟后果采取行动）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28158\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28158\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage model agents are increasingly asked to run ongoing multi-day operations rather than finish isolated single-turn tasks. In daily operations, today\u0026#x27;s choices reshape later observations and cash constraints because empty shelves hide lost walk-in demand, short-shipped customers quietly shrink future orders weeks later, and emergency buying drains working capital. We introduce SMB Bench, a calibrated 90-day wholesale simulator with 18 causally paired tasks and an 859-run frontier trace dataset, to ask what experience and learning signal make an agent better at noticing, attributing, and acting on the delayed consequences of its own decisions in unseen businesses. Across 16 frontier models, only 3 outperform a fixed buying rule; models often record a relevant diagnosis in their notes without changing later purchases in time, showing that diagnosing a problem, changing behavior, and improving a business are separate achievements. To study how experience improves those failures in an open model (Qwen3.8-27B), we used training-business records to identify operational rules and archived frontier quarters as starting states to continue from rather than transcripts to copy. On an unseen test business under identical evaluation instructions, the trained policy followed customer-protection commitments more consistently and reduced severe-loss quarters, while the additional profit benefit remained uncertain. Carrying those commitments through the quarter exposed the cost of fulfilling them, as early-quarter stocking habits left the buyer relying on emergency supply and a deteriorating supplier. The results separate recognizing a delayed effect, acting on it consistently, and coordinating surrounding decisions so that the response improves profit. SMB Bench connects these observations to a learning method by turning archived decisions and their consequences into reusable training experience.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型代理越来越多地被要求运行持续的多天操作，而不是完成孤立的单轮任务。在日常操作中，今天的选择会重塑随后的观察和现金约束，因为空货架掩盖了失去的进店需求，发货不足的客户在几周后悄悄减少未来的订单，而紧急购买会耗尽营运资金。我们引入了SMB Bench，一个校准的90天批发模拟器，包含18个因果配对任务和一个859次运行的前沿轨迹数据集，以询问什么经验和学习信号能使代理更好地在未见过的业务中注意、归因并对其自身决策的延迟后果采取行动。在16个前沿模型中，只有3个优于固定购买规则；模型经常在其笔记中记录相关诊断，但没有及时改变随后的购买，表明诊断问题、改变行为和改善业务是独立的成就。为了研究经验如何改善开放模型（Qwen3.8-27B）中的这些失败，我们使用训练业务记录来识别操作规则，并使用存档的前沿季度作为继续的起始状态，而不是复制转录本。在相同评估指令下的未见测试业务中，训练后的策略更一致地遵循客户保护承诺并减少了严重亏损季度，而额外的利润收益仍不确定。在整个季度中履行这些承诺暴露了履行它们的成本，因为季度初的库存习惯使买家依赖紧急供应和恶化的供应商。结果区分了识别延迟效应、一致地对其采取行动以及协调周围决策以使响应改善利润。SMB Bench通过将存档的决策及其后果转化为可重用的训练经验，将这些观察与学习方法联系起来。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估并提升语言模型代理在持续多天业务操作中识别、归因并针对自身决策的延迟后果采取行动的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SMB Bench，包含90天批发模拟器、18个因果配对任务和859次运行的前沿轨迹数据集；发现16个前沿模型中仅3个优于固定购买规则，且诊断问题、改变行为与改善业务是独立成就；针对Qwen3.8-27B模型，利用训练业务记录和存档前沿季度作为起始状态进行训练；训练后策略能更一致地遵循客户保护承诺并减少严重亏损季度，但额外利润收益不确定，且履行承诺暴露了依赖紧急供应的成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SMB Bench有效揭示了当前前沿语言模型在处理延迟后果时的能力缺陷，即诊断问题与实际改变行为之间存在脱节。通过特定的训练方法，模型在遵循承诺和减少亏损方面有所改善，但未能有效协调周围决策以提升利润。局限性方面，摘要未提供该模拟器在更广泛的行业或更复杂的供应链环境中的泛化验证，未说明Qwen3.8-27B模型在利润提升上表现不确定的具体原因，也未详细探讨训练数据中操作规则的提取方法及其对模型泛化能力的潜在限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能代理 / 强化学习 / 商业决策与模拟\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. KernelShift: Benchmarking Kernel Optimization Across Evolving Hardware（KernelShift：跨演进硬件的核优化基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29590\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29590\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEfficient AI computation depends on hardware that evolves over time, shifting the strategies needed to implement performant code. For CPU kernels, a key evolving factor is the set of available architectural extensions, which expose specialized hardware instructions that change the techniques used to optimize kernels. We study how effectively coding agents use these new, potentially unfamiliar extensions to write fast code. We introduce KernelShift, a benchmarking pipeline and a set of environments for evaluating coding agents in kernel optimization across evolving CPU architectures. Its agent-assisted, human-verified pipeline turns code repositories into benchmark instances, and its environments let agents optimize code with feedback from the target hardware. Using this pipeline, we construct 99 kernels from real-world, actively developed repositories (ncnn, llama.cpp, Arm SIMD Loops, and KleidiAI), including inference workloads derived from real model executions. KernelShift supports incorporating new kernels and hardware configurations as libraries and processors evolve. We evaluate agents with proprietary and open-weight models across progressively newer architectural extensions (Arm Neon, SVE, SVE2, and SME2), examining how performance changes as hardware evolves. On established extensions, agents beat the auto-vectorized compiler everywhere (2.4-19.8x) and exceed general-purpose libraries such as ncnn (getting up to 2.74x over its Neon kernels), but fall behind Arm\u0026#x27;s hand-tuned KleidiAI kernels (0.70x). In end-to-end inference of two LLMs, agent-written kernels achieve a 1.3-1.6x prefill speedup over llama.cpp\u0026#x27;s fast path. However, current agents do not yet reliably adapt to new extensions that require unfamiliar programming models, such as SME2\u0026#x27;s matrix tiles.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e高效的AI计算依赖于随时间演进的硬件，这改变了实现高性能代码所需的策略。对于CPU核，一个关键的演进因素是可用的架构扩展集，这些扩展暴露了专门改变用于优化核的技术的硬件指令。我们研究了编码代理如何有效地使用这些新的、可能不熟悉的扩展来编写快速代码。我们引入了KernelShift，一个基准测试管道和一组环境，用于评估编码代理在跨演进CPU架构的核优化中的表现。其代理辅助、人工验证的管道将代码库转化为基准实例，其环境让代理通过目标硬件的反馈来优化代码。使用该管道，我们从真实世界、积极开发的代码库（ncnn、llama.cpp、Arm SIMD循环和KleidiAI）中构建了99个核，包括从真实模型执行中衍生的推理工作负载。KernelShift支持随着库和处理器的演进而合并新的核和硬件配置。我们在具有专有和开放权重模型的代理中，跨逐渐更新的架构扩展（Arm Neon、SVE、SVE2和SME2）进行评估，检查性能如何随硬件演进而变化。在已建立的扩展上，代理在所有地方都击败了自动向量化编译器（2.4-19.8倍），并超过了通用库如ncnn（在其Neon核上获得高达2.74倍的性能），但落后于Arm手工调优的KleidiAI核（0.70倍）。在两个LLM的端到端推理中，代理编写的核在llama.cpp的快速路径上实现了1.3-1.6倍的预填充加速。然而，当前的代理还不能可靠地适应需要不熟悉编程模型的新扩展，例如SME2的矩阵图块。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估编码代理在跨演进CPU架构（如Arm Neon, SVE, SVE2, SME2）的核优化中的表现，并构建基准测试管道和环境（KernelShift）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入KernelShift基准测试管道和环境，将真实代码库转化为基准实例，支持代理在目标硬件反馈下优化代码。2. 构建了99个来自真实活跃代码库（如ncnn, llama.cpp等）的核，支持新核和硬件配置的扩展。3. 评估表明，代理在已建立扩展上显著超越自动向量化编译器（2.4-19.8倍）和通用库（最高2.74倍），但在端到端LLM推理中实现1.3-1.6倍预填充加速的同时，仍无法可靠适应需要新编程模型的扩展（如SME2）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的基准构建和实验结果，证明了代理在已知架构扩展上的优化能力，但也明确指出了其在面对新架构扩展（如SME2）时的局限性。局限性在于当前代理无法可靠适应需要不熟悉编程模型的新扩展。摘要未提供关于代理具体使用的算法细节、失败案例的具体错误分析以及SME2编程模型的具体技术难点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机体系结构与人工智能系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. Innata-0: A Native Embodied World System with Model-Agent Co-Design（Innata-0：具有模型-代理协同设计的原生具身世界系统）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30254\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30254\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe physical world is open-ended, dynamic, and partially observable. While foundation models have advanced embodied intelligence, standalone models struggle with long-horizon execution, and simply integrating models with agents may lead to inconsistencies between planning and physical control. To support reliable and adaptive behaviors in the physical world, we introduce Innata-0, a native embodied world system. Innata-0 jointly designs an embodied world-action model and an agent to combine their complementary strengths. The model, Innata-0-WAM, adopts a tri-tower Mixture-of-Transformers architecture that integrates understanding, prediction, and action generation. The agent, Innata-0-Agent, coordinates long-horizon execution through memory, verification, and recovery. A co-design protocol is further proposed to align model training with agent execution and leverage validated experiences to support subsequent adaptation and model improvement. Extensive evaluations demonstrate strong embodied capabilities across understanding, world prediction, and robotic manipulation. Innata-0 represents our first step toward physical intelligence, and we see it as the beginning of a much longer journey.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e物理世界是开放式的、动态的且部分可观测的。虽然基础模型推动了具身智能的发展，但独立模型在长期执行中表现挣扎，而简单地将模型与代理结合可能导致规划与物理控制之间的不一致。为了支持物理世界中可靠和自适应的行为，我们引入了Innata-0，一个原生具身世界系统。Innata-0联合设计了一个具身世界-动作模型和一个代理，以结合它们互补的优势。该模型Innata-0-WAM采用三塔Transformer混合架构，集成了理解、预测和动作生成。代理Innata-0-Agent通过记忆、验证和恢复来协调长期执行。进一步提出了一种协同设计协议，以使模型训练与代理执行对齐，并利用验证过的经验来支持后续的适应和模型改进。广泛的评估展示了在理解、世界预测和机器人操作方面强大的具身能力。Innata-0代表了我们迈向物理智能的第一步，我们将其视为一段更长旅程的开始。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种原生具身世界系统（Innata-0），通过模型-代理协同设计，结合具身世界-动作模型和代理的互补优势，以支持物理世界中可靠和自适应的长期行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Innata-0系统，联合设计具身世界-动作模型（Innata-0-WAM）和代理（Innata-0-Agent）。2. Innata-0-WAM采用三塔Transformer混合架构，集成理解、预测和动作生成；Innata-0-Agent通过记忆、验证和恢复协调长期执行。3. 提出协同设计协议，对齐模型训练与代理执行，利用验证经验支持适应和模型改进。4. 广泛评估展示了在理解、世界预测和机器人操作方面的强大能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一个结合模型和代理的协同设计系统，并声称在理解、预测和操作方面取得了强大能力。然而，摘要
