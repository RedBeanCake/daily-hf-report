have held #1 on L1 since 2026-10-27, albeit a short loss on 2026-11-07. All 235 problems have a site-verified correct kernel; on the 209 public-board problems they are 4.40x faster than the benchmark\u0026#x27;s reference baseline. The search starts from zero: agents get each problem\u0026#x27;s PyTorch definition but no reference kernels or official scores. A per-problem archive outside the model holds every correct kernel and its lineage. An LLM controller reads it, picks a parent or a new design, and gives each parallel child agent one direction. Checks outside the model decide correctness. At equal wall time, it beat a coded UCB style tree on 35 of 38 problems by making 2.4x as many correct attempts. Over a thousand agents ran at once, and one warm restart fix raised their evaluation rate 3.6x. We find that the rate of reliable measurements, not the number of agents, limits how far such a search scales. Our code and kernels are available on URL.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了CompoundingKernel，一个通过搜索编写GPU内核的自我提升智能体系统。截至2026年11月11日，其生成的内核在SOL-ExecBench（NVIDIA B200）的公开L1、L2和量化排行榜上排名第一。自2026年10月27日以来，它们一直在L1上保持第一名，尽管在2026年11月7日有过短暂的丢失。所有235个问题都有经过网站验证的正确内核；在209个公开排行榜问题上，它们比基准的参考基线快4.40倍。搜索从零开始：智能体获取每个问题的PyTorch定义，但没有参考内核或官方分数。模型外部的每个问题存档保存每个正确的内核及其演化谱系。LLM控制器读取它，选择一个父代或新设计，并给每个并行的子智能体一个方向。模型外部的检查决定正确性。在相同的实际运行时间内，它通过进行2.4倍的正确尝试，在38个问题中的35个上击败了编码的UCB风格树。超过一千个智能体同时运行，一次热重启修复使其评估率提高了3.6倍。我们发现，可靠测量的速率，而不是智能体的数量，限制了这种搜索的扩展程度。我们的代码和内核可在URL上获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个通过搜索自动编写和优化GPU内核的自我提升智能体系统，从零开始在没有参考内核的情况下生成高性能内核。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e系统在SOL-ExecBench的多个排行榜上取得第一名，生成的内核比基线快4.40倍。采用LLM控制器和模型外存档指导并行子智能体进行搜索，在相同时间内比UCB风格树产生更多正确尝试。发现可靠测量的速率是限制搜索扩展的瓶颈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了系统通过LLM控制器和并行智能体搜索生成GPU内核的机制，并在SOL-ExecBench上取得了排名第一和显著加速的成果。研究指出可靠测量的速率限制了搜索的扩展。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 智能体与代码生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models（VSpark：自回归视觉-语言-动作模型的推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22666\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22666\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOur aim is to accelerate autoregressive vision-language-action models (VLAs), which generate robot actions one token at a time. Speculative decoding makes this possible: a lightweight draft model proposes several tokens at once, and the VLA verifies them in a single pass, accepting only those that match its own predictions, so decoding remains lossless. The speedup, however, is limited in robot control, where many different tokens encode nearly the same motion and a draft close to the correct action is still rejected. To address this, our approach, VSpark, is built upon three design choices: (i) rollouts collected with calibrated action noise, which expose the draft to a wider range of robot states; (ii) feature alignment, which trains the draft to match the VLA\u0026#x27;s hidden features rather than its output tokens alone; and (iii) continuation reuse, which keeps the predictions the VLA has already computed along rejected drafts as candidates for the next verification step, instead of discarding them. On four VLAs with different action tokenizers and four manipulation benchmarks, VSpark achieves 1.28x to 2.10x speedup while keeping the VLA\u0026#x27;s decoding lossless.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们的目标是加速自回归视觉-语言-动作模型（VLA），它们一次生成一个token的机器人动作。推测解码使这成为可能：一个轻量级的草稿模型一次提出几个token，VLA在一次传递中验证它们，只接受那些与其自身预测匹配的token，因此解码保持无损。然而，在机器人控制中，加速受到限制，因为许多不同的token编码几乎相同的动作，并且接近正确动作的草稿仍会被拒绝。为了解决这个问题，我们的方法VSpark建立在三个设计选择之上：（i）使用校准的动作噪声收集的推演，这使草稿暴露于更广泛的机器人状态；（ii）特征对齐，训练草稿以匹配VLA的隐藏特征而不仅仅是其输出token；（iii）延续重用，保留VLA沿着被拒绝的草稿已经计算的预测作为下一步验证的候选，而不是丢弃它们。在具有不同动作分词器的四个VLA和四个操作基准上，VSpark实现了1.28倍到2.10倍的加速，同时保持VLA的解码无损。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e加速自回归视觉-语言-动作模型的推理过程，通过推测解码技术提高机器人动作生成的效率，同时保持解码无损。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VSpark方法，通过引入带校准动作噪声的推演、特征对齐以及延续重用三个设计选择，解决了机器人控制中因token编码相似导致草稿被拒绝的问题。在多个VLA和操作基准上实现了1.28x至2.10x的无损加速。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统推测解码在机器人控制中因动作token的语义相似性而受限，VSpark通过特征对齐和延续重用等机制有效提升了草稿接受率。实验在多种VLA和操作基准上验证了加速效果。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能 / 视觉-语言-动作模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. Language Models Can Rewrite Their Own Weights（语言模型可以重写自身的权重）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21885\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21885\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage models are trained once, frozen and deployed: improving one again takes another training run, and a prompt, a scaffold or extra computation at inference is gone once the task ends. A frontier model has been shown to edit the weights of a much smaller one. We ask whether a model can rewrite its own weights to make itself better, and find that it can, by its own reasoning, with no gradients and no training; we call this self-rewriting. Given its weights, graded answers and the ability to run itself, a 27B model diagnoses its failure and edits the weights behind it. It surpasses itself: its own edit makes it 6.6 points more accurate on 490 problems it never saw, in a test fixed in advance, and another session\u0026#x27;s edit also makes it significantly better. It keeps getting better: it submits an edit only when its own tests support it, each edit replacing the last, and over its first eight such sessions its accuracy only rises. Unlike test-time scaling, the gain persists in its weights and adds no cost per answer; unlike training, it needs no pre- or post-training infrastructure, only an open model and hours on one GPU. It repairs a damaged copy of itself: it locates the corrupted matrix and rewrites it with values of its own, never reading the undamaged weights; found on text math problems alone, the repair lifts the copy on six image benchmarks it never saw from 7% to 70% accuracy, 83% of the undamaged model\u0026#x27;s. And the ability emerges with scale: across four sizes of one family, the 2B model makes no edit and the 4B and 9B models break themselves; only the 27B model works on itself as a human would, comparing its hidden states on answers that finish and on answers that run out of tokens, weakening the direction that separates them. Like a human, a model need not separate training from inference; improving a language model may come to take a conversation rather than a training run.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型通常只训练一次，冻结后部署：再次改进需要另一次训练运行，而提示、脚手架或推理时的额外计算在任务结束后就消失了。前沿模型已被证明可以编辑小得多模型的权重。我们询问模型是否可以重写自身的权重以变得更好，并发现它可以，通过其自身的推理，无需梯度和训练；我们称之为自我重写。给定其权重、分级答案和运行自身的能力，一个27B模型诊断其失败并编辑背后的权重。它超越了自身：其自身的编辑使其在预先固定的测试中，对490个它从未见过的问题准确率提高了6.6分，另一次会话的编辑也使其显著提高。它不断变得更好：它只在自身测试支持时提交编辑，每次编辑替换上一次，在其前八次此类会话中，其准确率只升不降。与测试时扩展不同，这种增益持久存在于其权重中，且每个答案不增加成本；与训练不同，它不需要预训练或后训练基础设施，只需要一个开放模型和在单个GPU上运行数小时。它修复了自身的一个损坏副本：它定位损坏的矩阵并用自身的值重写它，从不读取未损坏的权重；仅在文本数学问题上发现，这种修复将其在六个它从未见过的图像基准上的准确率从7%提升至70%，达到未损坏模型的83%。并且这种能力随规模涌现：在一个系列的四个尺寸中，2B模型不进行编辑，4B和9B模型破坏了自身；只有27B模型像人类一样对自身进行操作，比较完成的答案和耗尽token的答案的隐藏状态，削弱分隔它们的方向。像人类一样，模型无需将训练与推理分离；改进语言模型可能只需一次对话而非一次训练运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索语言模型是否能够通过自身推理重写自身权重以提升性能，而无需梯度或额外训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出自我重写概念，27B模型能在无梯度、无训练的情况下通过推理诊断失败并编辑自身权重。2. 在490个未见问题上准确率提升6.6分，且增益持久存在于权重中，不增加推理成本。3. 能够修复损坏的模型副本，将图像基准准确率从7%提升至70%。4. 该能力具有规模效应，仅在27B模型上成功涌现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法无需预训练或后训练基础设施，仅需单GPU运行数小时，且能持续自我改进。局限性方面，摘要未提供关于该方法在非数学或非图像等其他任务类型上的适用性、权重编辑过程的具体计算开销、以及长期自我改进的稳定性等详细数据或分析，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Direct3D-V3: Latent-Free Diffusion Transformers in the Native Voxel Domain（Direct3D-V3：原生体素域中的无潜在空间扩散Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26511\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26511\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eNative 3D generation has largely been built around latent diffusion, with recent advances concentrating on stronger variational autoencoders (VAE) and increasingly elaborate latent representations, from vecset and triplanes to structured sparse voxels. Despite their architectural differences, these methods all share the same premise: geometry is first compressed into a latent space and only then modeled by the generator. We take a different route and propose Direct3D-V3, a latent-free diffusion transformer (DiT) framework that discards the VAE altogether and operates in the native voxel domain, directly modeling raw SDF voxel grids during both training and sampling. To make this direct voxel formulation geometrically reliable, we introduce an implicit manifold regularization over neighboring voxels to suppress non-watertight surfaces, and convert predicted SDF grids into meshes via Marching Cubes so that rendered normal losses can supervise the model directly from its predicted SDF. To improve alignment between the conditioning image and generated geometry, Direct3D-V3 also predicts the camera parameters of the conditioning image as an auxiliary task, encouraging the DiT to learn the mapping from image observations to 3D shape. This latent-free design removes the reconstruction bottleneck, brings training under an objective in the native voxel domain, and yields meshes with substantially richer local detail. The predicted camera and native SDF voxel output further make Direct3D-V3 extensible to generative reconstruction, where diffusion is interleaved with normal-guided refinement to improve alignment with the observed view while the generative prior completes unseen regions. Project page: https://dreamtechai.github.io/Direct3D-V3.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e原生3D生成主要围绕潜在扩散构建，最近的进展集中在更强大的变分自编码器和日益复杂的潜在表示上，从向量集和三平面到结构化的稀疏体素。尽管架构不同，这些方法都共享相同的前提：几何首先被压缩到潜在空间，然后才由生成器建模。我们采取了一条不同的路线，提出了Direct3D-V3，这是一个无潜在空间的扩散Transformer框架，它完全摒弃了变分自编码器，并在原生体素域中操作，在训练和采样期间直接对原始符号距离函数字节网格进行建模。为了使这种直接的体素公式在几何上可靠，我们在相邻体素上引入了隐式流形正则化以抑制非水密表面，并通过移动立方体算法将预测的符号距离函数网格转换为网格，以便渲染的法线损失可以直接从模型预测的符号距离函数中监督模型。为了改善条件图像和生成几何之间的对齐，Direct3D-V3还将条件图像的相机参数预测作为辅助任务，鼓励扩散Transformer学习从图像观察到3D形状的映射。这种无潜在空间的设计消除了重建瓶颈，将训练置于原生体素域的目标之下，并产生具有更丰富局部细节的网格。预测的相机和原生符号距离函数体素输出进一步使Direct3D-V3可扩展到生成式重建，其中扩散与法线引导的细化交织在一起，以改善与观察视图的对齐，同时生成先验完成未见区域。项目主页：https://dreamtechai.github.io/Direct3D-V3。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种无潜在空间的扩散Transformer框架Direct3D-V3，在原生体素域中直接对原始符号距离函数体素网格进行建模，以进行原生3D生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 摒弃变分自编码器，直接在原生体素域操作，消除潜在空间压缩带来的重建瓶颈。2. 引入隐式流形正则化抑制非水密表面，并利用移动立方体算法转换网格，通过渲染法线损失直接监督模型。3. 将相机参数预测作为辅助任务，改善条件图像与生成几何的对齐。4. 可扩展至生成式重建，结合法线引导细化与生成先验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出无潜在空间设计能产生局部细节更丰富的网格，并消除了重建瓶颈。局限性方面，摘要未提供关于该模型在训练时间、内存消耗、生成速度、具体定量评估指标以及与其他基于变分自编码器方法的详细对比数据，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与3D生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU（Accord：基于单目相机和IMU的通用在线度量定位与稠密建图）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25279\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25279\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDense metric mapping from a single camera and IMU remains challenging: visual-inertial odometry (VIO) provides metric motion but sparse geometry, whereas feed-forward depth models predict dense structure without ensuring metric scale. We present Accord, which constructs an accurate online dense metric map from any camera with an IMU. A VIO filter publishes metric poses, a depth foundation model conditioned on them predicts depth for short keyframe windows, and a factor graph fuses the resulting submaps. Recent work has explored several approaches to this problem. What is essential is the multi-view agreement (Accord), which is considered in SLAM as a source of geometric self-consistency. Accord anchors each keyframe window to metric 3D points triangulated from the filter poses, then exploits bidirectional dense depth agreement between co-visible images to estimate and correct per-image scale errors while preserving the metric scale established by the anchors. Context keyframes further improve depth prediction, and the resulting submaps are fused in a factor graph. We evaluate a single mapping configuration across five public camera-IMU setups and a new Phone-rig/GoPro dataset. With nothing tuned per dataset/setup and every map aligned only by Accord\u0026#x27;s own trajectory, Accord achieves consistently best/second-best mean F-score at 5 cm on every platform. Accord is open-source along with the phone-rig dataset for the benefit of the research community\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用单目相机和IMU进行稠密度量建图仍然具有挑战性：视觉惯性里程计提供度量运动但几何稀疏，而前馈深度模型预测稠密结构却无法确保度量尺度。我们提出了Accord，它可以从任何带有IMU的相机构建准确的在线稠密度量地图。视觉惯性里程计滤波器发布度量位姿，以它们为条件的深度基础模型预测短关键帧窗口的深度，因子图融合生成的子图。最近的工作探索了该问题的几种方法。本质上是多视图一致性，在同步定位与建图中被视为几何自洽性的来源。Accord将每个关键帧窗口锚定到从滤波器位姿三角测量的度量3D点，然后利用共视图像之间的双向稠密深度一致性来估计和校正每张图像的尺度误差，同时保留锚点建立的度量尺度。上下文关键帧进一步改善了深度预测，生成的子图在因子图中融合。我们在五个公开的相机-IMU设置和一个新的手机阵列与GoPro数据集上评估了单一的建图配置。在无需针对每个数据集或设置进行任何调整，且每张地图仅通过Accord自身的轨迹对齐的情况下，Accord在每个平台上始终获得5厘米处最佳或第二佳的平均F分数。Accord连同手机阵列数据集一起开源，以造福研究社区。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Accord系统，利用单目相机和IMU构建准确的在线稠密度量地图，解决视觉惯性里程计几何稀疏和前馈深度模型缺乏度量尺度的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 结合视觉惯性里程计滤波器提供的度量位姿与深度基础模型，通过因子图融合子图。2. 核心在于多视图一致性，利用双向稠密深度一致性估计和校正单图尺度误差，同时保持度量尺度。3. 在五个公开数据集和一个新数据集上，使用单一配置且无需针对数据集调参，在5厘米阈值下均取得最佳或第二佳的平均F分数。4. 代码及新数据集开源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该系统具有通用性，无需针对特定数据集或硬件设置进行调参即可取得顶尖性能。局限性方面，摘要未提供关于系统在不同极端环境下的鲁棒性、计算资源消耗、实时性表现以及与其他最先进方法的具体F分数数值对比，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与机器人学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. TwinLab-Bench: Evaluating AI Scientists in Agentic Twins of Real Labs（TwinLab-Bench：在真实实验室的智能体孪生中评估AI科学家）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26248\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26248\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI agents are increasingly expected to act as AI scientists, which requires three increasingly open abilities: carrying out a given computational workflow correctly, choosing the next measurements from a given design space, and designing their own experiments. Existing benchmarks mainly evaluate the first two abilities, in a terminal or in a closed loop that selects from predefined candidates. Evaluating the third ability requires reliably executing an experiment that an agent designs, with readings grounded in a real laboratory. We introduce TwinLab-Bench, which evaluates AI scientists on self-designed experiments in 52 tasks from laboratories in the physical sciences, the life sciences, and engineering. The benchmark supports more than 100 experimental action types, and the agent\u0026#x27;s report is scored by comparison with a hidden answer taken from real laboratory records. Each task has its own TwinLab agent, an agent that serves as the environment and executes the experiments that the tested agent designs, reading the raw materials of the laboratory and calling calculators that are built from its records. Compared with a language model that sees only the task description, the TwinLab agent almost eliminates readings that deviate from the real records and inconsistent answers to a repeated request, and closed-book probes control for answers recalled from memory. We find that these tasks remain hard for frontier models: the strongest, Claude Fable 5.2, averages a score of only 45.0, and we conduct an empirical study of where it fails.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAI智能体越来越被期望充当AI科学家，这需要三种日益开放的能力：正确执行给定的计算工作流、从给定的设计空间中选择下一次测量，以及设计自己的实验。现有基准主要评估前两种能力，在终端中或在从预定义候选中进行选择的闭环中。评估第三种能力需要可靠地执行智能体设计的实验，且读数需基于真实实验室。我们引入了TwinLab-Bench，它在来自物理科学、生命科学和工程实验室的52个任务中评估AI科学家的自主设计实验能力。该基准支持超过100种实验动作类型，智能体的报告通过与取自真实实验室记录的隐藏答案进行比较来评分。每个任务都有其自己的TwinLab智能体，该智能体作为环境并执行被测智能体设计的实验，读取实验室的原材料并调用基于其记录构建的计算器。与仅查看任务描述的语言模型相比，TwinLab智能体几乎消除了偏离真实记录的读数和对重复请求的不一致回答，并且闭卷探测控制了从记忆中回忆的回答。我们发现这些任务对前沿模型来说仍然很难：最强的Claude Fable 5.2平均得分仅为45.0，我们对其失败之处进行了实证研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出TwinLab-Bench基准，用于评估AI智能体作为AI科学家自主设计并执行物理、生命和工程科学实验的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 填补了评估AI科学家自主设计实验能力的空白，包含52个真实实验室任务。2. 支持超100种实验动作，通过TwinLab智能体模拟真实实验室环境执行实验并基于真实记录评分。3. 有效消除了偏离真实记录的读数和模型记忆偏差。4. 揭示了前沿模型在此类任务上的巨大挑战，最强模型平均分仅为45.0。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该基准通过TwinLab智能体模拟真实实验室环境，确保了实验读数的真实性并控制了记忆偏差。局限性方面，摘要未提供关于TwinLab智能体模拟物理或化学实验的精确度、基准中各学科任务的难度分布、以及除了最强模型之外其他模型的具体得分和失败原因分析细节，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与智能体基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. DailySafe: Benchmarking Dynamic Safety Awareness in Everyday Multi-Turn Multimodal Interactions（DailySafe：评估日常多轮多模态交互中的动态安全意识）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26298\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26298\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs multimodal large language models (MLLMs) become increasingly integrated into everyday life, their ability to provide safe and reliable assistance in realistic daily activities remains insufficiently explored. Existing safety benchmarks primarily focus on isolated harmful requests or adversarial scenarios, overlooking the safety risks that may arise as ordinary tasks unfold. In practice, users pursue legitimate goals through multi-turn, multimodal interactions, where seemingly benign requests may become safety-critical when considered alongside earlier actions and visual observations. This calls for Dynamic Safety Awareness, the ability to track evolving task conditions, recognize implicit contextual risks, and provide safe and helpful assistance. To systematically evaluate this capability, we introduce DailySafe, a benchmark comprising 195 naturalistic multi-turn, multi-image interactions across 10 everyday domains and 42 task categories. Grounded in authentic user dialogue topics and documented safety knowledge, DailySafe captures realistic scenarios where safety-critical evidence is progressively revealed across conversational turns and visual observations. Using case-specific safety annotations, DailySafe assesses whether MLLMs can recognize and appropriately address evolving risks while supporting users\u0026#x27; legitimate goals, bringing multimodal safety evaluation closer to real-world everyday AI assistance. DailySafe is publicly available at: https://github.com/XuankunRong/DailySafe.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着多模态大语言模型日益融入日常生活，它们在现实日常活动中提供安全可靠协助的能力仍未得到充分探索。现有安全基准主要关注孤立的有害请求或对抗性场景，忽视了普通任务展开过程中可能出现的安全风险。在实践中，用户通过多轮多模态交互追求合法目标，其中看似无害的请求在与早期动作和视觉观察结合考虑时，可能会变得具有安全关键性。这呼唤动态安全意识，即跟踪不断变化的任务条件、识别隐式上下文风险并提供安全有帮助的协助的能力。为了系统地评估这种能力，我们引入了DailySafe，这是一个包含195个自然的多轮、多图像交互的基准，跨越10个日常领域和42个任务类别。基于真实的用户对话主题和记录的安全知识，DailySafe捕捉了安全关键证据在对话轮次和视觉观察中逐步揭示的现实场景。使用特定案例的安全注释，DailySafe评估多模态大语言模型是否能够在支持用户合法目标的同时识别并适当处理不断演变的风险，使多模态安全评估更接近现实世界的日常AI协助。DailySafe公开于：https://github.com/XuankunRong/DailySafe。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出DailySafe基准，系统评估多模态大语言模型在日常多轮多模态交互中的动态安全意识，即跟踪任务变化、识别隐式上下文风险并提供安全协助的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 关注日常多轮多模态交互中逐渐显现的安全风险，弥补了现有基准仅关注孤立有害请求的不足。2. 包含195个自然交互案例，覆盖10个日常领域和42个任务类别。3. 基于真实对话和安全知识，安全关键证据在对话和视觉中逐步揭示。4. 评估模型在支持合法目标的同时处理动态风险的能力，使评估更贴近现实应用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明DailySafe通过多轮多图像交互和逐步揭示的安全证据，更真实地反映了日常场景中的动态安全风险。局限性方面，摘要未提供关于基准中具体模型的评估得分、不同领域或任务类别下的难度差异、以及模型在处理动态风险时的具体失败模式分析，这些均写为摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与多模态大模型安全\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. System 1 agents: a method for local, reliable and fast agentic AI（系统1智能体：一种局部、可靠且快速的智能体AI方法）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21053\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21053\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgentic artificial intelligence could automate analyses of sensitive clinical data, but current agents depend on large language models (LLMs). Cloud LLMs expose patient data. Local LLMs hallucinate, and an invented value in a tool call propagates through every later step. Here we present a method to build System 1 agents: local agents that call tools without generating text. A deterministic compiler turns each tool\u0026#x27;s schema and the request into multiple-choice questions whose options come from the request and the schema, then a one-pass decision model answers them. On 1,952 requests to 157 biomedical tools, the best System 1 agent chose the right tool, or correctly declined, for 97.0% of requests, significantly ahead of all 18 local LLM-agent settings (best 95.2%). The System 1 agent filled 97.0% of 6,056 stated argument values. No System 1 call contained invented content, against 5.5-19.7% of LLM calls. The System 1 Agents framework is freely available as open-source software at https://github.com/eltzanis/SystemOneAgents.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体人工智能可以自动化分析敏感的临床数据，但当前的智能体依赖于大型语言模型（LLM）。云端LLM会暴露患者数据。局部LLM会产生幻觉，并且在工具调用中捏造的值会传播到随后的每一个步骤中。在此，我们提出了一种构建系统1智能体的方法：调用工具而不生成文本的局部智能体。一个确定性编译器将每个工具的模式和请求转化为多项选择题，其选项来自请求和模式，然后由单次遍历决策模型回答这些问题。在对157个生物医学工具的1,952个请求中，最佳的系统1智能体为97.0%的请求选择了正确的工具或正确拒绝，显著领先于所有18种局部LLM-智能体设置（最佳为95.2%）。系统1智能体填充了6,056个声明参数值中的97.0%。没有系统1调用包含捏造内容，而LLM调用中有5.5-19.7%包含捏造内容。系统1智能体框架作为开源软件在 https://github.com/eltzanis/SystemOneAgents 免费提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一种不生成文本、在本地运行且可靠的智能体AI方法，以自动化分析敏感临床数据，避免云端LLM的数据泄露和局部LLM的幻觉问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出系统1智能体方法，通过确定性编译器将工具模式和请求转化为多项选择题，由单次遍历决策模型回答；在157个生物医学工具的1,952个请求中，正确选择或拒绝率达97.0%，显著优于局部LLM；参数值填充率达97.0%，且无捏造内容（对比LLM的5.5-19.7%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效解决了局部LLM的幻觉问题并保护了数据隐私，在工具调用和参数填充上表现出高准确率和零捏造率。局限性方面，摘要未提供该方法的计算成本、更广泛领域的泛化能力或具体局限性信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/智能体系统/医疗信息学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks（虚假成功，无声失败：审计模拟操作基准的成功检查器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25179\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25179\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSimulated manipulation benchmarks measure policy performance using hand-written success checkers that label each episode as a success or failure. Passing an expert demonstration shows that a checker accepts one way of completing the task. Learned policies, however, may stop after partial progress or complete the task in a different way. A checker may then accept an incomplete execution (phantom success) or reject an execution that satisfies the instruction (silent failure). In this paper, we introduce SimAudit, an LLM-based pipeline that audits success checkers against task instructions. SimAudit analyzes the instruction and checker code to identify scenarios where the two may disagree, recreates those scenarios in simulation, and runs the original checker. Multi-view renderings are then used to verify whether the observed behavior satisfies the instruction. Across RoboTwin 2.0, RoboCasa365, and RoboDojo, 183 simulated test cases produced the predicted checker verdict. Visual verification and deduplication yielded 61 distinct defects across 49 tasks, including 40 phantom successes and 21 silent failures. Most defects in RoboCasa365 accepted incomplete executions, most in RoboDojo rejected valid executions, and both error types were common in RoboTwin 2.0. These findings suggest that validating success checkers requires testing both incomplete executions and valid alternatives to expert demonstrations, and motivate more rigorous evaluation protocols for future benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e模拟操作基准使用手写的成功检查器来衡量策略性能，将每个片段标记为成功或失败。通过专家演示表明检查器接受一种完成任务的方式。然而，学习到的策略可能会在部分进展后停止，或者以不同的方式完成任务。此时，检查器可能会接受不完整的执行（虚假成功）或拒绝满足指令的执行（无声失败）。在本文中，我们引入了SimAudit，一个基于LLM的流水线，用于根据任务指令审计成功检查器。SimAudit分析指令和检查器代码以识别两者可能产生分歧的场景，在模拟中重现这些场景，并运行原始检查器。然后使用多视图渲染来验证观察到的行为是否满足指令。在RoboTwin 2.0、RoboCasa365和RoboDojo中，183个模拟测试用例产生了预测的检查器裁决。视觉验证和去重产生了49个任务中的61个不同缺陷，包括40个虚假成功和21个无声失败。RoboCasa365中的大多数缺陷接受了不完整的执行，RoboDojo中的大多数缺陷拒绝了有效的执行，而这两种错误类型在RoboTwin 2.0中都很常见。这些发现表明，验证成功检查器需要测试不完整的执行和专家演示的有效替代方案，并激发了对未来基准更严格的评估协议。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e审计模拟操作基准中手写成功检查器的准确性，识别并量化“虚假成功”（接受不完整执行）和“无声失败”（拒绝有效执行）缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出基于LLM的SimAudit流水线，通过分析指令和检查器代码识别分歧场景并在模拟中重现验证；在三个基准（RoboTwin 2.0, RoboCasa365, RoboDojo）中发现49个任务的61个缺陷（40个虚假成功，21个无声失败）；揭示了不同基准中错误类型的分布差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SimAudit有效发现了现有基准中成功检查器的缺陷，强调了验证检查器需要考虑不完整执行和替代方案。局限性方面，摘要未提供SimAudit流水线自身的计算成本、局限性或对其他未测试基准的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/强化学习/基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Embeddings vs. Grep: Rethinking the Dense Advantage in Code Search（嵌入与Grep：重新思考代码搜索中的稠密优势）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.20455\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.20455\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode-search benchmarks show dense encoders well ahead of BM25, yet coding agents do well with grep. What does this dense advantage measure? Existing benchmarks cannot tell: they use curated queries, old code and a handicapped BM25. To find out, we build Repo-Premium, a realistic repository-level code-search benchmark. It ranks files in real repositories, with curated and raw queries in Python, JavaScript, TypeScript, Go, Rust and Java, pull requests from 2022 to 2026, and a preregistered test pool over 91 repositories. Our experiments trace the advantage to two sources: evaluation choices that favor dense retrieval, such as splitting files into chunks for BM25 and counting edited tests as relevant, and queries that lack the code\u0026#x27;s rare identifiers. Expanding the query with LLM-written identifiers (generate-then-grep) helps BM25 far more than dense retrieval, letting it match dense retrieval in every Python pool, even on pull requests opened after the LLM was released. No method we tried predicts which retriever will win on a given query. From these results we derive three guidelines: measure dense gains against a fair lexical baseline, fuse dense retrieval with BM25, and add the code\u0026#x27;s words to queries that lack them.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代码搜索基准显示稠密编码器远领先于BM25，但编码智能体使用grep表现很好。这种稠密优势衡量的是什么？现有基准无法说明：它们使用精选查询、旧代码和受限的BM25。为了找出原因，我们构建了Repo-Premium，一个真实的仓库级代码搜索基准。它对真实仓库中的文件进行排名，包含Python、JavaScript、TypeScript、Go、Rust和Java的精选和原始查询，2022年至2026年的拉取请求，以及在91个仓库上的预注册测试池。我们的实验将优势追溯到两个来源：偏向稠密检索的评估选择，例如将文件分块用于BM25以及将编辑过的测试计为相关，以及缺乏代码中罕见标识符的查询。使用LLM编写的标识符扩展查询（生成后grep）对BM25的帮助远大于对稠密检索的帮助，使其在每个Python池中匹配稠密检索，甚至在LLM发布后打开的拉取请求上也是如此。我们尝试的方法都无法预测哪种检索器会在给定查询上获胜。从这些结果中，我们得出三条指南：针对公平的词汇基线衡量稠密增益，将稠密检索与BM25融合，并将代码的词汇添加到缺乏这些词汇的查询中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究代码搜索基准中稠密编码器相对于BM25的“稠密优势”的真实来源，并构建更真实的仓库级代码搜索基准以重新评估两者性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建Repo-Premium真实仓库级代码搜索基准，涵盖多语言、多年份拉取请求及91个仓库；发现稠密优势源于偏向稠密检索的评估设置及缺乏罕见标识符的查询；提出“生成后grep”方法，利用LLM扩展查询使BM25在Python池中匹配稠密检索；提出三条代码检索评估与优化指南。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明现有基准的评估设置和查询构建夸大了稠密检索的优势，BM25在合理扩展查询后表现优异。局限性方面，摘要未提供Repo-Premium基准的具体规模细节、其他语言池的详细实验结果或该方法在工业级代码库中的实际部署局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程/信息检索/代码智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. In Situ Training of Optical Neural Networks by Coding Agents（编码智能体原位训练光学神经网络）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23875\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23875\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOptical neural networks promise fast, energy-efficient computing, but every device departs from its design and must be trained with the hardware. In situ training relies on an expert-built calibrated digital model of each device or on gradient-free trial and error. Coding agents, large language models that write and run programs, have shown an emergent ability to understand and edit the weights of digital neural networks. Here we introduce optics as code, a method in which a coding agent trains an optical neural network from measurements alone, through a harness that returns camera images of its probes and requires a hypothesis per request. We discovered that the agent forms a physical understanding of the optics and reparametrizes the network with interpretable optical elements tuned on the hardware. It outperforms gradient-free methods in classification and image encoding, approaching backpropagation through a calibrated model at a fraction of the cost. Needing neither per-device calibration nor gradients through the hardware, and improving with more capable models, optics as code offers a practical route to large, scalable optical neural networks and a general tool for calibrating and optimizing optical experiments.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e光学神经网络有望实现快速、节能的计算，但每个器件都偏离其设计，必须与硬件一起训练。原位训练依赖于专家构建的每个器件的校准数字模型或无梯度的试错法。编码智能体（编写和运行程序的大型语言模型）已展现出理解和编辑数字神经网络权重的涌现能力。在此，我们引入“光学即代码”，这是一种编码智能体仅通过测量训练光学神经网络的方法，通过一个返回其探针相机图像并要求每次请求提供一个假设的测试工具来实现。我们发现智能体形成了对光学的物理理解，并使用在硬件上调优的可解释光学元件对网络进行重新参数化。它在分类和图像编码方面优于无梯度方法，以极低的成本接近通过校准模型的反向传播。既不需要逐器件校准，也不需要穿过硬件的梯度，并随着更强大模型的出现而改进，“光学即代码”为大型、可扩展的光学神经网络提供了一条实用途径，并为校准和优化光学实验提供了一个通用工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用编码智能体仅通过硬件测量（无需预校准数字模型或硬件梯度）原位训练光学神经网络。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出“光学即代码”方法，编码智能体通过返回相机图像的测试工具仅凭测量训练光学神经网络；智能体展现出对光学的物理理解并使用可解释光学元件重新参数化网络；在分类和图像编码上优于无梯度方法，以极低成本接近校准模型的反向传播；无需逐器件校准和硬件梯度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效降低了光学神经网络训练的成本和校准需求，且智能体具备物理理解能力。局限性方面，摘要未提供该方法的具体训练时间、硬件平台细节、与反向传播方法的具体性能差距数字，以及在更复杂光学系统上的泛化局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e光学计算/人工智能/神经形态计算\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. SpecWM: Turning Verification into Refinement for Streaming World Models（SpecWM：将验证转化为流式世界模型的细化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26211\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26211\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecently, video world models have advanced interactive generation, with large models offering higher quality and smaller models enabling faster inference. Existing speculative methods combine their strengths through fast draft generation and selective target regeneration guided by rewards on decoded frames. However, verification covers only the external scorer\u0026#x27;s evaluation dimensions and adds decoding and scoring costs. Moreover, these scores provide no correction, requiring costly target regeneration for rejected drafts. To address these limitations, we propose Speculative World Model (SpecWM), a unified, training-free inference framework for streaming world models. It verifies draft chunks using the target\u0026#x27;s latent velocity field. Verification also yields a reusable correction; two thresholds select Accept, Refine, or Reject. Specifically, one-step refinement reuses it to improve perceptual quality, while three-step refinement strengthens camera following and trajectory consistency. These findings motivate transition-aware refinement. On WBench Navigation, SpecWM improves visual quality at 1.63times speedup over the target and raises NavScore from the draft\u0026#x27;s 75.99 to 85.63, achieving the best quality-speed-control trade-off. Additionally, our LongSpecBench shows sustained quality and control over long, multi-turn rollouts, while experiments on Hy-Nomas validate SpecWM across backbones and denoising budgets.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近，视频世界模型推进了交互式生成，大模型提供更高的质量，小模型实现更快的推理。现有的推测方法通过快速草稿生成和在解码帧上奖励引导的选择性目标重新生成来结合它们的优势。然而，验证仅涵盖外部评分器的评估维度，并增加了解码和评分成本。此外，这些评分不提供纠正，需要昂贵的目标重新生成来拒绝草稿。为了解决这些限制，我们提出了推测世界模型（SpecWM），一个用于流式世界模型的统一、免训练推理框架。它使用目标的潜在速度场验证草稿块。验证还产生可重用的纠正；两个阈值选择接受、细化或拒绝。具体而言，单步细化重用纠正来提高感知质量，而三步细化增强了相机跟随和轨迹一致性。这些发现激发了转换感知的细化。在WBench Navigation上，SpecWM在目标1.63倍加速下提高了视觉质量，并将NavScore从草稿的75.99提高到85.63，实现了最佳的质量-速度-控制权衡。此外，我们的LongSpecBench显示了在长多轮展开中持续的质量和控制，而在Hy-Nomas上的实验验证了SpecWM跨骨干网络和去噪预算的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种用于流式视频世界模型的免训练推理框架（SpecWM），通过将验证过程转化为细化过程，解决现有推测方法中验证成本高且缺乏纠正机制的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SpecWM框架，利用目标潜在速度场验证草稿块并生成可重用纠正；通过单步细化提升感知质量，三步细化增强相机跟随和轨迹一致性；在WBench Navigation上实现1.63倍加速，NavScore从75.99提升至85.63；在LongSpecBench和Hy-Nomas上验证了长序列生成和跨骨干/去噪预算的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SpecWM有效平衡了生成质量、速度和控制，通过重用验证信息降低了重新生成的成本。局限性方面，摘要未提供该框架的具体计算开销、在不同视频分辨率或更复杂物理交互场景下的具体表现局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成/世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. A CPU Inside an LLM: Zero-Gradient Compilation of Exact Circuits into Pretrained Weights（大语言模型中的CPU：将精确电路零梯度编译到预训练权重中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26450\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26450\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePretrained language models (LMs) remain unreliable on exact multi-digit arithmetic without gradient fine-tuning or external tool interpreters. We introduce closed-form, zero-gradient circuit-grafting primitives that compile deterministic computation directly into pretrained LM weights using zero training examples and zero runtime hooks, while bounding per-layer normalization drift and preserving natural-language (NL) competence. Our construction combines three analytical mechanisms: (1) two-layer Mellin-GLU quadrature over bias-free SwiGLU/GeGLU layers, turning unknown per-token RMSNorm scaling into translation along a log-spaced gate grid (\u0026gt;250times dynamic range) with IEEE 754 error bounds; (2) cross-token scale cancellation via signed Chebyshev Indefinite-RoPE self-sink attention and memoryless SiLU-antisymmetric GatedDeltaNet shifts; and (3) axis-aligned width extension (d to d+K) with d/(d+K) norm compensation, Base-1000 canonical BPE emission, and differential (+254,-256) tied unembeddings. An automated 5-stage compiler synthesizes 4-8 digit signed {+,-,times} circuits in constant TC^0 depth alongside 3-literal Boolean (100%, N=1{,}728; plus 42-layer Gemma 4 E4B audits) and 5-bit Majority/Parity (100%) circuits. On 6-digit arithmetic (N=1{,}200, BF16), IBM Granite 4.2 3B (1.07M-1.33M active non-zeros, le 0.036%) and Alibaba Qwen 3.5 4B (2.25M-2.39M non-zeros, le 0.057%) reach 99.17% and 100.00% ALU-prefix accuracy (100% with an FP32 sidecar) and 98%-100% mid-sentence resumption, outperforming 12.8K-sample LoRA (42.2% / 61.7%, 0% inline continuation). A factorized block-sparse sidecar holds A100 memory at 7.89 / 10.65 GiB (4.60 / 8.14 GiB under INT8/INT4 + FP32 sidecar) while passing all 14/14 pre-registered \u0026gt;2K-token Tango splits (N=4{,}392; 0/11,134 OOD triggers).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e预训练语言模型（LM）在没有梯度微调或外部工具解释器的情况下，在精确的多位算术上仍然不可靠。我们引入了封闭形式的零梯度电路嫁接原语，使用零训练样本和零运行时钩子将确定性计算直接编译到预训练的LM权重中，同时限制每层归一化漂移并保留自然语言（NL）能力。我们的构造结合了三种分析机制：（1）在无偏置的SwiGLU/GeGLU层上进行两层Mellin-GLU求积，将未知的每标记RMSNorm缩放转化为沿着对数间隔门网格（\u0026gt;250倍动态范围）的平移，并具有IEEE 754误差界限；（2）通过带符号的Chebyshev不定-RoPE自汇注意力和无记忆SiLU-反对称GatedDeltaNet移位实现跨标记尺度抵消；（3）轴对齐的宽度扩展（d到d+K），具有d/(d+K)范数补偿、Base-1000规范BPE发射和差分（+254,-256）绑定反嵌入。一个自动化的5阶段编译器在恒定的TC^0深度合成4-8位带符号的{+,-,×}电路，以及3文字布尔电路（100%，N=1,728；加上42层Gemma 4 E4B审计）和5位多数/奇偶校验（100%）电路。在6位算术上（N=1,200，BF16），IBM Granite 4.2 3B（1.07M-1.33M活跃非零值，≤0.036%）和阿里巴巴Qwen 3.5 4B（2.25M-2.39M非零值，≤0.057%）达到了99.17%和100.00%的ALU前缀准确率（使用FP32侧车时为100%）和98%-100%的句中恢复率，优于12.8K样本的LoRA（42.2% / 61.7%，0%内联继续）。分解的块稀疏侧车将A100内存保持在7.89 / 10.65 GiB（在INT8/INT4 + FP32侧车下为4.60 / 8.14 GiB），同时通过了所有14/14预注册的\u0026gt;2K标记Tango分割（N=4,392；0/11,134 OOD触发器）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将确定性计算（如精确多位算术和布尔电路）直接编译到预训练语言模型权重中，无需梯度微调或外部工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出零梯度电路嫁接原语，结合三种分析机制（Mellin-GLU求积、跨标记尺度抵消、轴对齐宽度扩展），实现零训练样本和零运行时钩子的确定性计算编译；自动化5阶段编译器合成多种电路；在多位算术和逻辑电路上实现极高准确率，显著优于LoRA微调；通过分解的块稀疏侧车有效控制内存占用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详尽的实验数据和技术细节，证明了该方法在精确计算上的有效性及内存效率。关于该方法在更复杂自然语言任务中的泛化能力、编译过程的计算开销、以及对非算术任务潜在负面影响的评估，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 模型编辑与知识编译\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. Do Probing and Steering Favor the Same Directions Within and Across Language Models?（探测与引导在语言模型内部及跨模型之间是否偏好相同的方向？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19499\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19499\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA direction in a language model\u0026#x27;s hidden state can be used to probe whether a concept is present or to steer the model toward it. Although probe directions are often reused for steering, the direction that best detects a concept need not be the one that best changes it. We study this distinction in three instruction-tuned models from different families. We construct a one-parameter family of directions ranging from a covariance-adjusted discriminant to the mean difference, and evaluate probing and additive steering, which adds the direction to the hidden state, along the family at a fixed side effect. For truthfulness and sentiment, in every model, the best probe is not the best steering direction: steering consistently favors directions closer to the mean difference. This separation holds across 59 of 60 layer-model-concept combinations in a layer sweep, with matched probe and steering texts in all six model-concept combinations, and under a rotation-based steering operator. The exact steering optimum is less stable: for sentiment, an intermediate direction produces a 27-56% stronger steering effect than the mean difference, but this gain shrinks or disappears with matched texts and depends on the layer and the operator.\u003cbr\u003e  The two roles also transfer differently across models. A probe transferred by a linear map fitted on neutral text retains 81-91% of the target model\u0026#x27;s above-chance probing performance, while the transferred mean difference retains less of its steering effect in 11 of 12 model pairs. This is a consistent tendency, although our predefined criteria classify only three pairs, and nine remain inconclusive. Finally, as an application on PopQA, steering toward \u0026quot;unknown\u0026quot; increases abstention by 18-44 percentage points on uncertain errors, versus 2-5 on confident errors, while rarely correcting errors in cases where a correct answer is reachable.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型隐藏状态中的一个方向可用于探测某个概念是否存在，或引导模型朝向该概念。尽管探测方向经常被重复用于引导，但最能检测概念的方向未必是最能改变它的方向。我们在来自不同系列的三个指令微调模型中研究了这种区别。我们构建了一个单参数方向族，范围从协方差调整后的判别式到均值差，并在固定副作用下，沿着该方向族评估探测和加性引导（将方向添加到隐藏状态）。对于真实性和情感，在每个模型中，最佳探测方向不是最佳引导方向：引导一致地偏好更接近均值差的方向。这种分离在层扫描的60个层-模型-概念组合中的59个中成立，在所有六个模型-概念组合中具有匹配的探测和引导文本，并且在基于旋转的引导算子下也成立。精确的引导最优值不太稳定：对于情感，中间方向产生的引导效果比均值差强27-56%，但这种增益在文本匹配时缩小或消失，并取决于层和算子。这两个角色在跨模型转移时也表现不同。通过在中性文本上拟合的线性映射转移的探测，保留了目标模型高于随机探测性能的81-91%，而转移的均值差在12个模型对中的11个中保留了较少的引导效果。这是一种一致的倾向，尽管我们的预定义标准仅对三对进行了分类，九对仍不确定。最后，作为在PopQA上的应用，向“未知”引导使不确定错误的弃权率增加了18-44个百分点，而自信错误仅增加2-5个百分点，同时在正确答案可达的情况下很少纠正错误。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究语言模型隐藏状态中用于概念探测和概念引导的方向是否相同，以及这两种方向在跨模型转移时的表现差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现最佳探测方向与最佳引导方向存在显著分离，引导更偏好接近均值差的方向；精确的引导最优值不稳定，受文本匹配、层和算子影响；探测方向跨模型转移时性能保留较好，而引导方向保留较差；在PopQA应用中，向“未知”引导能有效增加不确定错误的弃权率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详实的跨模型、跨层、跨概念的实验数据，证明了探测与引导方向的分离现象及跨模型转移的差异。关于该发现对模型可解释性或对齐技术的具体改进方案，以及跨模型转移中九对不确定结果的具体原因，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型 / 模型可解释性与机制分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning（一个先验，两种动态：重新利用视频扩散Transformer进行自监督潜在动作学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26617\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26617\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideos reveal how the world changes, but rarely the actions that cause those changes. Latent action learning recovers such supervision from visual transitions, yet often learns the underlying dynamics largely from scratch. We ask whether a pretrained video generator can instead provide the prior for both inverse and forward dynamics. We introduce O^{2}LaF, built on a simple principle: one prior, two dynamics. We initialize both models from the same pretrained video DiT and adapt them to their distinct roles: a feed-forward transition encoder with learnable action queries for inverse dynamics, and a causal, action-conditioned video generator for forward dynamics. By controlling information access and optimizing both dynamics end-to-end through a compact bottleneck, O^{2}LaF learns transferable actions from unlabeled videos. Across navigation and robotic manipulation, O^{2}LaF sets a new state of the art in few-shot action probing and enables stronger zero-shot action transfer across visual contexts and embodiments. Beyond generative video priors, we further extend our framework to predictive representation priors such as V-JEPA2, achieving competitive performance. Our findings suggest a broader paradigm for latent-action learning: repurposing pretrained video models to discover transferable actions and predict their consequences.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频揭示了世界如何变化，但很少揭示导致这些变化的动作。潜在动作学习从视觉转换中恢复这种监督，但通常从头学习底层动态。我们询问预训练视频生成器是否可以反过来为逆动态和正动态提供先验。我们引入了O^{2}LaF，建立在一个简单的原则上：一个先验，两种动态。我们从同一个预训练视频DiT初始化这两个模型，并使它们适应其不同的角色：用于逆动态的具有可学习动作查询的前馈转换编码器，以及用于正动态的因果、动作条件视频生成器。通过控制信息访问并通过紧凑的瓶颈端到端优化这两种动态，O^{2}LaF从无标签视频中学习可转移的动作。在导航和机器人操作中，O^{2}LaF在少样本动作探测中设定了新的最先进水平，并实现了跨视觉上下文和具身形式的更强零样本动作转移。除了生成视频先验，我们进一步将框架扩展到预测表示先验（如V-JEPA2），取得了具有竞争力的性能。我们的发现提出了潜在动作学习的更广泛范式：重新利用预训练视频模型来发现可转移的动作并预测其后果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用预训练视频生成器作为先验，同时学习逆动态（从视觉转换中恢复动作）和正动态（预测动作后果），以实现自监督的潜在动作学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出O^{2}LaF框架，基于“一个先验，两种动态”原则，从同一预训练视频DiT初始化逆动态和正动态模型；通过紧凑瓶颈端到端优化，从无标签视频中学习可转移动作；在导航和机器人操作任务中，少样本动作探测达到SOTA，并实现强大的跨视觉上下文和具身形式的零样本动作转移；框架可扩展至预测表示先验（如V-JEPA2）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了该方法在无标签视频动作学习、少样本探测和零样本跨域转移方面的卓越性能，并验证了框架的扩展性。关于动作表示的语义可解释性、在更复杂长序列任务中的表现、以及计算资源消耗的具体数据，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 机器人学 / 视频理解与自监督学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. Inhabitant: An Agent Framework for Long-Horizon Human-Scene Interaction with Spatial Control and Quantitative Feedback（Inhabitant：一个具有空间控制和定量反馈的长时程人-场景交互智能体框架）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25005\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25005\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent work on human-scene interaction (HSI) generation moves from single interactions to long-horizon interaction, where a language-model agent plans and executes a sequence of interactions in a 3D scene under one instruction. However, existing agents struggle in challenging everyday scenarios (e.g., picking up a toy and throwing it into a basket) because they lack spatial control over the motion and quantitative feedback on its execution, and they often fail to complete the interaction sequence. To address these gaps, we present Inhabitant, a training-free agent framework in which the agent specifies each motion through positions, paths and poses, measures how the executed interaction deviates from its intent, and revises the control specification accordingly. For an extensive evaluation in such scenarios, we build Inhabit, a benchmark of 75 household tasks in 31 furniture layouts of an apartment, in which every task chains one to three goals on movable objects and is carried out by the whole body, excluding fingers. On Inhabit, Inhabitant completes 98.7\\% of the tasks with Claude Opus 5.5, and 93.3\\% and 82.7\\% with Claude Sonnet 5.5 and Gemini 4 Argon, respectively. Ablations confirm that without spatial control the agent fails most tasks, and without quantitative feedback its motion becomes less precise. Code is available on the project page.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近关于人-场景交互（HSI）生成的工作从单一交互转向长时程交互，其中语言模型智能体在一个指令下在3D场景中规划并执行一系列交互。然而，现有智能体在具有挑战性的日常场景（例如，拿起玩具并扔进篮子里）中表现挣扎，因为它们缺乏对运动的空间控制和对其执行的定量反馈，并且经常无法完成交互序列。为了解决这些差距，我们提出了Inhabitant，一个免训练的智能体框架，其中智能体通过位置、路径和姿势指定每个运动，测量执行的交互如何偏离其意图，并相应地修改控制规范。为了在此类场景中进行广泛评估，我们构建了Inhabit，一个包含公寓31种家具布局中75项家务任务的基准，其中每项任务链接可移动对象上的一到三个目标，并由除手指外的整个身体执行。在Inhabit上，Inhabitant使用Claude Opus 5.5完成了98.7%的任务，使用Claude Sonnet 5.5和Gemini 4 Argon分别完成了93.3%和82.7%的任务。消融实验证实，如果没有空间控制，智能体会失败大多数任务；如果没有定量反馈，其运动变得不那么精确。代码可在项目页面上获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决长时程人-场景交互中智能体缺乏空间控制和定量反馈导致任务失败的问题，实现复杂日常场景下的多步交互规划与执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练智能体框架Inhabitant，通过位置、路径和姿势进行空间控制，并引入定量反馈机制测量并修正执行偏差；构建Inhabit基准，包含31种家具布局下的75项全身家务任务；在Inhabit基准上，结合不同大语言模型（如Claude Opus 5.5）实现极高的任务完成率（最高98.7%）；消融实验证实了空间控制和定量反馈的必要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的基准构建细节和不同模型下的高任务完成率数据，证明了框架的有效性。关于动作生成的物理合理性（如是否发生穿模）、计算延迟、以及在更复杂或动态环境中的泛化能力评估，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图形学 / 3D场景理解与智能体规划\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. S1CogBench: What System One Decision Models Can and Cannot Do on Cognitive Experiments（S1CogBench：系统一决策模型在认知实验中能做什么和不能做什么）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.00911\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.00911\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecision-making in humans and AI involves multiple cognitive abilities. System One decision models produce fast, structured choices. Their cognitive strengths and limitations, however, remain poorly understood. We introduce S1CogBench, a benchmark of 24 established cognitive tasks and 27 evaluation modes, evaluating seven open models and the API model Jev. It combines human-response prediction, autonomous execution, and controlled task manipulations to reveal strengths and failures that aggregate scores miss. We find distinct behavioral profiles across the evaluated models. In these models, strong performance on some learning tasks coexists with failures to gather information or adapt to feedback, while high accuracy does not guarantee human-like responses to changing task demands. Shared readout controls show that model rankings depend partly on how choices are extracted. Separate latency comparisons with generative language models show that long responses are much slower than direct decisions, whereas matched one-token generation adds little overhead. To our knowledge, S1CogBench is the first benchmark of System One decision models on established cognitive experiments. It provides a common empirical basis for identifying their capabilities and limitations before integrating them into automated decision systems.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人类和人工智能的决策涉及多种认知能力。系统一决策模型产生快速、结构化的选择。然而，它们的认知优势和局限性仍然知之甚少。我们引入了S1CogBench，一个包含24个既定认知任务和27种评估模式的基准，评估了七个开源模型和API模型Jev。它结合了人类响应预测、自主执行和受控任务操作，以揭示聚合分数所遗漏的优势和失败。我们在评估的模型中发现了不同的行为特征。在这些模型中，在某些学习任务上的强劲表现与无法收集信息或适应反馈的情况共存，而高准确率并不能保证对不断变化的任务需求做出类似人类的响应。共享读取控制表明，模型排名部分取决于如何提取选择。与生成式语言模型的单独延迟比较表明，长响应比直接决策慢得多，而匹配的单标记生成几乎不增加开销。据我们所知，S1CogBench是第一个在既定认知实验上评估系统一决策模型的基准。它为在将它们集成到自动决策系统之前识别其能力和局限性提供了共同的实证基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估系统一（System One）决策模型在认知实验中的认知优势与局限性，揭示其在人类响应预测、自主执行和任务操作中的真实能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出S1CogBench基准，包含24个认知任务和27种评估模式，评估7个开源模型和1个API模型；结合多种评估方式揭示聚合分数遗漏的模型行为特征（如高准确率与无法适应反馈共存）；发现模型排名受选择提取方式影响；延迟对比显示单标记生成开销极小，而长响应显著慢于直接决策。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了基准的规模、评估维度以及发现的模型行为特征和延迟特性。关于各模型在具体认知任务上的详细得分数据、“系统一决策模型”的具体架构定义，以及这些认知局限性在下游实际决策任务中的具体负面影响，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 认知科学 / 模型评估与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning（抑制隐藏在视频大模型微调收益背后的捷径）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25776\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25776\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSupervised fine-tuning (SFT) is the stage in which Video Large Language Models (VideoLLMs) advance their capability to reason over video. However, the VideoLLM also learns to answer from textual regularities of its training data, a shortcut that bypasses the video. The regularities behind the shortcut are hard to define at the data level, and the shortcut forms regardless of training epoch, data size, or backbone. The shortcut is hidden behind a rise in accuracy within the training distribution, yet it is not required for the rise and even costs SFT the gain the video offers under distribution shift. We therefore propose Video-Evidence Training via Orthogonal projection (VETO), which intervenes on the fine-tuning update where the shortcut is written rather than on the data. VETO calibrates the subspace that the text alone occupies in the activations of the base model and projects the update onto its orthogonal complement. The VideoLLM is thus left to ground its answer in the full input, with the shortcut suppressed as it forms and never defined. Across seven VideoLLMs, VETO preserves the gain of SFT on the training distribution and suppresses the shortcut. On six benchmarks under shift it gains more than SFT and answers from the full input rather than the shortcut. Code is available at https://github.com/Youngwoo-git/VETO.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e监督微调（SFT）是视频大语言模型（VideoLLMs）提升视频推理能力的阶段。然而，VideoLLM也学会了根据其训练数据的文本规律来回答问题，这是一种绕过视频的捷径。捷径背后的规律在数据层面很难定义，并且无论训练轮数、数据规模或主干网络如何，该捷径都会形成。捷径隐藏在训练分布内准确率的提升背后，但它并非提升所必需，甚至在分布偏移下使SFT失去了视频所提供的收益。因此，我们提出了通过正交投影进行视频证据训练（VETO），它在捷径被写入的地方干预微调更新，而不是在数据层面进行干预。VETO校准了基模型激活中仅由文本占据的子空间，并将更新投影到其正交补集上。因此，VideoLLM被迫将其答案基于完整输入进行接地，捷径在形成时被抑制且从未被定义。在七个VideoLLMs上，VETO保留了SFT在训练分布上的收益并抑制了捷径。在分布偏移下的六个基准测试中，它的收益超过SFT，并且基于完整输入而非捷径进行回答。代码可在 https://github.com/Youngwoo-git/VETO 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视频大语言模型在监督微调过程中学习文本规律捷径而绕过视频推理的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VETO方法，通过在微调更新阶段进行正交投影干预，校准文本占据的子空间并投影到正交补集，从而在捷径形成时进行抑制；在7个VideoLLMs上保留训练分布收益，并在6个分布偏移基准上超越SFT。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出捷径在数据层面难以定义且不受训练轮数、数据规模或主干网络影响，VETO通过在更新阶段干预而非数据层面干预来解决问题。局限性方面，摘要未提供关于VETO计算开销、正交投影对模型其他能力的潜在负面影响以及在不同类型视频任务上的具体性能差异等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与自然语言处理交叉（视频大语言模型/多模态学习）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. PlayCraft: Designing Engaging Games from Agent Play Experience（PlayCraft：从智能体游玩体验中设计引人入胜的游戏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26624\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26624\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent AI agents can generate playable games, but these games are not necessarily engaging. Mastery is a key source of engagement, yet designing for it requires extensive human play and tuning. We propose PlayCraft, an automated framework that uses a vision-based agent to play games and draws on its detailed play experience to revise them for mastery. Starting from an initial game, PlayCraft alternates between playing and crafting. In the playing stage, a player agent watches the game screen, uses the controls, and pursues the game objective over repeated episodes while retaining memory. After each episode, it reports its progress, outcomes, decisions, and reflections. In the crafting stage, a crafter agent uses these reports to revise the game. It estimates player abilities, predicts performance at different proficiency levels, and compares those predictions with a target learning progression. It diagnoses the game and addresses the gaps by giving players meaningful opportunities to improve through better decisions and execution. We evaluate games in fresh runs with player agents across three intelligence settings, measuring learning gain and learning slope. Compared with the initial games, PlayCraft yields larger learning gains and steeper learning slopes in most games. It also outperforms the baselines on the macro-average of each metric at every intelligence setting.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的AI智能体可以生成可玩的游戏，但这些游戏不一定引人入胜。精通（Mastery）是引人入胜的关键来源，但为其设计需要大量的人类游玩和调试。我们提出了PlayCraft，这是一个自动化框架，使用基于视觉的智能体来玩游戏，并利用其详细的游玩体验来修改游戏以达到精通。从初始游戏开始，PlayCraft在游玩和制作之间交替。在游玩阶段，玩家智能体观看游戏屏幕，使用控制，并在保留记忆的情况下在重复的回合中追求游戏目标。在每个回合之后，它报告其进度、结果、决策和反思。在制作阶段，制作者智能体使用这些报告来修改游戏。它评估玩家能力，预测不同熟练度水平下的表现，并将这些预测与目标学习进度进行比较。它诊断游戏并通过为玩家提供通过更好决策和执行来提高的有意义机会来解决差距。我们在三种智能设置下使用玩家智能体在全新运行中评估游戏，测量学习增益和学习斜率。与初始游戏相比，PlayCraft在大多数游戏中产生了更大的学习增益和更陡的学习斜率。它在每种智能设置下的每个指标的宏观平均值上也优于基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个自动化框架PlayCraft，利用视觉智能体的游玩体验来自动修改和打磨AI生成的游戏，以提升玩家的精通感和游戏参与度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出PlayCraft框架，通过玩家智能体和制作者智能体的交替工作，利用智能体的详细游玩报告来评估玩家能力并调整游戏难度与学习进度；在三种智能设置下的评估中，相比初始游戏实现了更大的学习增益和更陡的学习斜率，且优于基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明PlayCraft通过智能体反思和预测来调整游戏，提升了学习增益和斜率。局限性方面，摘要未提供该框架在人类玩家实际测试中的表现、智能体视觉和决策能力的局限性对游戏修改的影响、以及计算成本等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与游戏设计/人机交互（AI智能体/游戏生成）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. NarrowSpec: Draft Hidden Width Need Not Match the Target in Speculative Decoding（NarrowSpec：推测解码中草稿模型的隐藏宽度无需与目标模型匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23835\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23835\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpeculative decoding is widely used to speed up generation in large language models (LLMs), with a small draft model proposing tokens that one forward pass of the target model verifies. Draft models that read the target\u0026#x27;s hidden states, such as DFlash and EAGLE-3, typically inherit the target\u0026#x27;s hidden width. We show that the draft\u0026#x27;s whole residual stream can run at half or a quarter of that width while largely preserving acceptance. For DFlash, which borrows the target\u0026#x27;s vocabulary projection, the trained output adapter folds into it, giving one narrower projection with logits unchanged up to floating-point rounding. We test two drafter families, DFlash and EAGLE-3, on two targets, Qwen3-8B (NVFP4) and GPT-OSS-20B (MXFP4), in SGLang on a B200 and a DGX Spark (GB10). At batch size 1 and temperature 0, narrowing the draft to half or a quarter width speeds up end-to-end decoding by 1.06-1.12x on B200 and 1.13-1.44x on GB10. The speedup holds at larger batch sizes. From batch 32 to the largest batch each GPU fits, narrowing reaches up to 1.21x on both GPUs, and no narrow draft is slower than full width.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推测解码被广泛用于加速大语言模型（LLMs）的生成，由一个小的草稿模型提出token，由目标模型的一次前向传播进行验证。读取目标模型隐藏状态的草稿模型（如DFlash和EAGLE-3）通常继承目标的隐藏宽度。我们表明，草稿模型的整个残差流可以以其一半或四分之一的宽度运行，同时很大程度上保留接受率。对于借用目标词汇投影的DFlash，训练好的输出适配器折叠进其中，给出一个更窄的投影，其logits在浮点舍入误差内保持不变。我们在SGLang中的B200和DGX Spark (GB10) 上，针对两个目标模型Qwen3-8B (NVFP4) 和 GPT-OSS-20B (MXFP4)，测试了两个草稿模型系列DFlash和EAGLE-3。在批量大小为1且温度为0时，将草稿宽度缩小到一半或四分之一，在B200上端到端解码加速1.06-1.12倍，在GB10上加速1.13-1.44倍。该加速在更大的批量大小下依然成立。从批量大小32到每个GPU能容纳的最大批量，缩小宽度在两个GPU上最高达到1.21倍加速，且没有窄草稿比全宽度慢。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索并验证在推测解码中，读取目标模型隐藏状态的草稿模型无需继承目标模型的隐藏宽度，通过缩小草稿模型的残差流宽度来加速解码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e证明草稿模型的残差流可以缩小至目标模型的一半或四分之一而基本保持接受率；针对DFlash，将输出适配器折叠入词汇投影中实现更窄投影且logits不变；在B200和GB10上测试DFlash和EAGLE-3，batch size 1时实现1.06-1.44倍加速，大batch size下最高达1.21倍加速且无性能下降。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的硬件、模型和加速比数据，证明了缩小草稿宽度的有效性。局限性方面，摘要未提供缩小宽度对极端长文本生成、不同温度设置（除0外）或更复杂任务下接受率的具体影响，以及该方法在其他非DFlash/EAGLE-3架构上的泛化能力等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型推理加速（推测解码/模型优化）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. Lang-SVG: Hierarchical Image Vectorization with Language Priors（Lang-SVG：具有语言先验的层次化图像矢量化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15941\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15941\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eImage vectorization reconstructs raster images as compact scalable vector graph- ics (SVG), providing a structured and editable code representation of images. However, most existing vectorization methods optimize for pixel-level render- ing fidelity, often producing SVGs that lack alignment with human-perceived object-part hierarchies, making them difficult to manipulate. To address this, we propose Lang-SVG, which introduces an explicit tree structure to organize SVG primitives with semantic labels and parent-child relationships. Lang-SVG incorporates granularity-controllable and open-vocabulary segmentation priors to initialize object-part hierarchies and leverages multimodal large language models (MLLMs) with SVG tree context to assign semantic labels to unlabeled nodes. To reduce redundancy, we introduce depth-adaptive simplification to reduce shape complexity and Tree-Guided Pruning and Merging to eliminate redundant SVG nodes. L1-SAM-Prompting further recovers missing regions to improve recon- struction fidelity and structural completeness. Beyond reconstruction fidelity, we introduce a new evaluation protocol that measures structural quality and semantic part alignment. Experiments demonstrate that Lang-SVG achieves state-of-the-art performance in both rendering fidelity and structural quality. Project website: https://xiliu8006.github.io/Lang-SVG/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e图像矢量化将光栅图像重建为紧凑的可缩放矢量图形（SVG），提供图像的结构化且可编辑的代码表示。然而，大多数现有的矢量化方法优化像素级渲染保真度，通常生成的SVG缺乏与人类感知的对象-部分层次结构的对齐，使其难以操作。为了解决这个问题，我们提出了Lang-SVG，它引入了显式的树结构来组织带有语义标签和父子关系的SVG图元。Lang-SVG结合了粒度可控和开放词汇的分割先验来初始化对象-部分层次结构，并利用带有SVG树上下文的多模态大语言模型（MLLMs）为未标记的节点分配语义标签。为了减少冗余，我们引入了深度自适应简化来降低形状复杂性，并引入树引导的剪枝和合并来消除冗余的SVG节点。L1-SAM-Prompting进一步恢复缺失区域，以提高重建保真度和结构完整性。除了重建保真度，我们引入了一个新的评估协议，用于测量结构质量和语义部分对齐。实验表明，Lang-SVG在渲染保真度和结构质量方面均达到了最先进（state-of-the-art）的性能。项目网站：https://xiliu8006.github.io/Lang-SVG/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Lang-SVG方法，通过引入语言先验和显式树结构，解决现有图像矢量化方法生成的SVG缺乏人类感知的对象-部分层次结构对齐、难以操作的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e引入显式树结构组织SVG图元，结合粒度可控和开放词汇分割先验初始化层次结构，利用MLLMs分配语义标签；提出深度自适应简化、树引导剪枝与合并减少冗余，以及L1-SAM-Prompting恢复缺失区域；提出衡量结构质量和语义部分对齐的新评估协议，在渲染保真度和结构质量上达到SOTA。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出Lang-SVG通过多模态大模型和树结构提升了SVG的语义对齐和结构质量，并提出了新的评估协议。局限性方面，摘要未提供该方法在处理极高分辨率图像时的计算效率、MLLMs推理带来的额外时间开销、以及在不同复杂场景下的具体失败案例等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/图形学（图像矢量化/多模态大模型应用）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. Squoosh Bench: Evaluating UX-1 on 318 Historical Website A/B Tests（Squoosh Bench：在318个历史网站A/B测试中评估UX-1）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25200\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25200\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eExperimentation teams must decide which proposed website changes to test with live traffic. We evaluated whether forecasts from simulated shoppers could inform that choice. We screened 412 historical website A/B tests and evaluated four systems on the 318 that ran longer than 21 days. Each system predicted an original win, a variant win, or an inconclusive result. Page roles were masked and recorded outcomes were withheld during inference. Squoosh UX-1, a model fine-tuned on human browsing data, simulated 1,000 shoppers per arm and correctly classified 267 of 318 outcomes (84.0%, 95% Wilson interval 79.5-87.6%, treating experiments as independent). Qwen3 Next 80B, the strongest general-purpose configuration on outcome accuracy, correctly classified 196 of 318 (61.6%). UX-1 favored the variant in 126 experiments. In the live tests, 118 of those variants won (93.7%), four lost, and four had inconclusive results. The remaining 192 experiments included 19 additional variant wins.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e实验团队必须决定将哪些提议的网站更改与实时流量进行测试。我们评估了来自模拟购物者的预测是否可以为该选择提供信息。我们筛选了412个历史网站A/B测试，并在运行时间超过21天的318个测试上评估了四个系统。每个系统预测原始版本获胜、变体获胜或结果不确定。页面角色在推理期间被掩码，记录的结果被隐藏。Squoosh UX-1是一个在人类浏览数据上微调的模型，每个分支模拟1,000名购物者，并正确分类了318个结果中的267个（84.0%，95% Wilson区间79.5-87.6%，将实验视为独立）。Qwen3 Next 80B是结果准确性上最强的通用配置，正确分类了318个中的196个（61.6%）。UX-1在126个实验中偏好变体。在实时测试中，这些变体中有118个获胜（93.7%），4个失败，4个结果不确定。其余192个实验包括19个额外的变体获胜。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估基于人类浏览数据微调的模拟购物者模型（Squoosh UX-1）在预测历史网站A/B测试结果（原始版本获胜、变体获胜或不确定）方面的有效性，以辅助实验团队决策。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在318个运行超21天的历史A/B测试上评估，UX-1每臂模拟1000名购物者，正确分类267个结果（准确率84.0%，95% Wilson区间79.5-87.6%），显著优于通用模型Qwen3 Next 80B（61.6%）；UX-1偏好的126个变体中，有118个在实时测试中实际获胜（93.7%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的评估数据集规模、准确率及置信区间数据，证明了UX-1在A/B测试预测中的高准确性和实用性。局限性方面，摘要未提供其余两个评估系统的具体名称、模拟购物者与真实用户在长期行为上的差异、以及该模型在不同类型网站或不同文化背景下的泛化能力等局限信息，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与电子商务/推荐系统（A/B测试预测/用户行为模拟）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. AURA: AUdio-dRiven streaming Avatar（AURA：音频驱动的流式化身）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26540\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26540\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCurrent audio-driven video diffusion models can synthesize realistic talking-head videos but generally require dozens of diffusion denoising steps over multi-second video chunks, making them unsuitable for streaming applications such as voice assistants and virtual avatars, where low-latency and online causal generation are required properties. AURA generates video chunk by chunk with a rolling KV cache, requiring only the audio of the current chunk to start generating, rather than a multi-second audio look-ahead like bidirectional models. It comes in two sizes: AURA 1.3B streams 576p video in real time on a single GPU (20.7 fps for a 16 Hz playback rate), making it suited to interactive avatar applications, and AURA 5B streams 720p video at 9.7 fps. Our two-stage distillation pipeline first aligns the causal student with the teacher, by training it to match the teacher\u0026#x27;s trajectories with fewer diffusion steps and a chunk-wise sliding window causal attention mask, then applies Distribution Matching Distillation (DMD) with backward simulation to close the remaining quality gap. On standard talking-head benchmarks, AURA 1.3B runs 23x faster than its own bidirectional teacher and reaches a quality comparable to TalkVerse at a lower resolution, and AURA 5B matches its TalkVerse teacher at 720p while running 17x faster. To support reproducibility and further research on streaming avatar generation, we release the weights of both models along with a dataset of 30K synthetic videos and their precomputed teacher trajectories.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e当前的音频驱动视频扩散模型可以合成逼真的说话头视频，但通常需要在多秒的视频块上进行数十次扩散去噪步骤，这使其不适用于语音助手和虚拟化身等流媒体应用，这些应用需要低延迟和在线因果生成等特性。AURA 使用滚动 KV 缓存逐块生成视频，仅需当前块的音频即可开始生成，而不是像双向模型那样需要多秒的音频前瞻。它有两种尺寸：AURA 1.3B 在单个 GPU 上实时流式传输 576p 视频（16 Hz 播放速率为 20.7 fps），使其适用于交互式化身应用，而 AURA 5B 以 9.7 fps 流式传输 720p 视频。我们的两阶段蒸馏管道首先通过将因果学生与教师对齐，训练它以更少的扩散步骤和逐块滑动窗口因果注意力掩码来匹配教师的轨迹，然后应用带有反向模拟的分布匹配蒸馏（DMD）来弥合剩余的质量差距。在标准的说话头基准测试中，AURA 1.3B 的运行速度比其自身的双向教师快 23 倍，并在较低分辨率下达到与 TalkVerse 相当的质量，而 AURA 5B 在 720p 分辨率下与其 TalkVerse 教师相匹配，同时运行速度提高了 17 倍。为了支持可重复性和对流式化身生成的进一步研究，我们发布了这两个模型的权重以及包含 3 万个合成视频及其预计算教师轨迹的数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种适用于流媒体应用（如语音助手和虚拟化身）的低延迟、在线因果生成的音频驱动视频扩散模型（AURA），以实现实时流式传输说话头视频。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 AURA 模型，使用滚动 KV 缓存逐块生成视频，仅需当前块音频，无需多秒音频前瞻。2. 提供两种尺寸：AURA 1.3B（单GPU实时流式传输576p，20.7 fps）和 AURA 5B（流式传输720p，9.7 fps）。3. 采用两阶段蒸馏管道：首先使用较少的扩散步骤和逐块滑动窗口因果注意力掩码对齐因果学生与教师，然后应用带反向模拟的分布匹配蒸馏（DMD）弥补质量差距。4. AURA 1.3B 比双向教师快 23 倍，AURA 5B 比教师快 17 倍，且质量相当。5. 开源了两个模型的权重以及包含 3 万个合成视频及其预计算教师轨迹的数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：AURA 通过逐块生成和两阶段蒸馏成功解决了音频驱动视频扩散模型在流媒体应用中延迟高、需要多秒音频前瞻的问题，实现了单GPU上的实时或接近实时的流式传输，并在速度和生成质量上取得了显著平衡。局限：摘要未提供关于模型在更高分辨率下的表现、复杂场景下的泛化能力以及长期流式传输中的累积误差评估等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. TwinD: Generalizing Deepfake Detection from Blending to Entire Face Synthesis（TwinD：将深度伪造检测从混合泛化到整脸合成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25935\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25935\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFacial deepfake detectors are usually trained on blending fakes, where a generated face is pasted back into a real frame. Recent generators synthesize the entire face and leave no traces of blending. On a benchmark of 19 datasets released from 2019 to 2026, the best prior facial deepfake detector reaches a mean AUROC of 96.2% on ten blending datasets, but none exceeds 78.1% on five datasets of entire face synthesis (EFS). AI-generated content (AIGC) detectors do not close this gap. We propose TwinD, a detector trained on FaceForensics++ fakes and two kinds of twins: fakes made from a real frame. A reconstruction twin is a real frame reconstructed by an autoencoder, with the real pixels put back in a random region. It targets the neural traces of a decoder. A blob twin blends an altered copy of a real frame with the frame itself, targeting blending artifacts. It needs no generator and no face-shaped mask. Together, these twins provide two complementary forensic cues that generalize to unseen manipulations. TwinDreaches a mean AUROC of 96.3%, 8.9 points above the prior state-of-the-art, with 98.1% on the blending datasets and 95.6% on the EFS datasets. Trained on twins alone, without a deepfake dataset, single models still reach 94.3% on average over three seeds. For reproducibility, the code, trained model, and training data are at: https://github.com/yermandy/TwinD\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e面部深度伪造检测器通常是在混合伪造上训练的，即把生成的脸粘贴回真实帧中。最近的生成器会合成整张脸，不留任何混合痕迹。在 2019 年至 2026 年发布的 19 个数据集的基准测试中，先前最好的面部深度伪造检测器在 10 个混合数据集上达到了 96.2% 的平均 AUROC，但在 5 个整脸合成（EFS）数据集上均未超过 78.1%。AI 生成内容（AIGC）检测器未能弥补这一差距。我们提出了 TwinD，一种在 FaceForensics++ 伪造数据和两种孪生数据（由真实帧制成的伪造数据）上训练的检测器。重建孪生是由自编码器重建的真实帧，真实像素被放回随机区域。它针对的是解码器的神经痕迹。斑点孪生将真实帧的修改副本与该帧本身混合，针对混合伪影。它不需要生成器也不需要人脸形状掩码。这两种孪生数据共同提供了两种互补的取证线索，可泛化到未见过的操纵。TwinD 达到了 96.3% 的平均 AUROC，比先前的最先进水平高出 8.9 个百分点，在混合数据集上达到 98.1%，在 EFS 数据集上达到 95.6%。仅在孪生数据上训练而不使用深度伪造数据集，单模型在三个种子上的平均准确率仍能达到 94.3%。为了可重复性，代码、训练模型和训练数据位于：https://github.com/yermandy/TwinD\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为 TwinD 的面部深度伪造检测器，旨在解决现有检测器在整脸合成（EFS）伪造数据上泛化能力差的问题，提升对不留混合痕迹的最新生成器伪造人脸的检测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 TwinD 检测器，利用两种孪生伪造数据（重建孪生和斑点孪生）结合 FaceForensics++ 数据进行训练。2. 重建孪生通过自编码器重建真实帧并放回随机区域，针对解码器的神经痕迹；斑点孪生混合真实帧的修改副本与原帧，针对混合伪影，且无需生成器和人脸掩码。3. 在 19 个数据集的基准测试中，TwinD 平均 AUROC 达到 96.3%，比先前 SOTA 高 8.9 个百分点，在 EFS 数据集上达到 95.6%。4. 仅使用孪生数据训练（不使用真实深度伪造数据集），单模型平均 AUROC 仍可达 94.3%。5. 开源了代码、训练模型和训练数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：TwinD 通过引入针对解码器神经痕迹和混合伪影的两种互补孪生数据，有效提取了泛化到未见操纵的取证线索，显著提升了模型在整脸合成（EFS）数据集上的检测性能，弥补了现有检测器在面对最新全脸生成器时的性能差距。局限：摘要未提供关于模型在不同压缩率、分辨率变化、对抗性攻击下的鲁棒性评估以及在视频序列检测中的表现和计算复杂度等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像伪造检测 / 多媒体安全\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n\u003e 今日无新增趋势项目（已在近期总结过）。"</script>
