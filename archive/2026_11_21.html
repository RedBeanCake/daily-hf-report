    <h1>前沿科研情报 - 2026-11-21</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection（WeVisForensics：用于全能AI生成视频检测的自我进化智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 47 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21373\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21373\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeVisForensics, an agentic framework in which a main investigator agent coordinates a self-evolving library of forensic inspector sub-agents spanning visual and audio cues. The investigator learns which artifact type to examine, over which window, and when to conclude, and these interactions provide shared feedback for both levels of agents. Our dual-timescale policy optimization strategy, DTPO, closes this loop through fast reinforcement learning of the investigator and slower refinement of the inspectors, guided by annotated artifact intervals, to report subtle artifacts they once dismissed. Furthermore, we curate ForenCue-30K, combining role-specific forensic annotations and interaction trajectories to supervise individual inspections and their coordination, with an accompanying reinforcement-learning pool. Experiments show that WeVisForensics averages 95.2% detection accuracy across in-domain, out-of-domain and agentic benchmarks, 9.0% above the strongest prior detector, while grounding its verdicts in localized evidence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频生成的最新进展要求基于明确的取证证据进行可靠的检测。然而，当前方法主要依赖于单次思维链推理，这会忽略短暂或局部的伪影，或者依赖于预定义的多智能体工作流，这些工作流在选择相关检查时灵活性有限。即使具有自适应调查能力，仅优化调查策略也不能直接提高固定专家的取证能力。我们引入了WeVisForensics，这是一个智能体框架，其中主调查智能体协调一个跨越视觉和音频线索的自我进化的取证检查器子智能体库。调查器学习要检查哪种伪影类型、在哪个时间窗口上检查以及何时得出结论，这些交互为两个层级的智能体提供共享反馈。我们的双时间尺度策略优化策略DTPO通过调查器的快速强化学习和检查器的较慢优化来闭合这一循环，在带注释的伪影间隔的指导下，报告他们曾经忽略的细微伪影。此外，我们整理了ForenCue-30K数据集，结合特定角色的取证注释和交互轨迹来监督单独的检查及其协调，并附带一个强化学习池。实验表明，WeVisForensics在域内、域外和智能体基准测试中平均检测准确率达到95.2%，比最强的先前检测器高出9.0%，同时将其裁决基于局部证据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种基于明确取证证据的可靠AI生成视频检测方法，以克服现有单次推理忽略局部伪影及预定义多智能体工作流灵活性不足的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WeVisForensics框架，包含主调查智能体和自我进化的取证检查器子智能体库；引入双时间尺度策略优化策略（DTPO）实现调查器与检查器的协同优化；构建ForenCue-30K数据集用于监督检查与协调。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在域内、域外和智能体基准上达到了95.2%的平均准确率，比先前最强检测器高9.0%，并能基于局部证据做出裁决。局限性方面，摘要未提供具体的计算开销、推理延迟或针对特定生成模型的失败案例分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频取证与检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation（Mind2Act World：机器人操作中具身心智、物理动作及心智-动作组合的诊断基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 45 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26444\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26444\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEmbodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a failure comes from reasoning, execution, or their composition. We introduce Mind2Act World, a diagnostic benchmark of 30 simulated manipulation tasks from five real-world application domains. Each task has three difficulty levels and two scene settings (Clean and Random), yielding 180 configurations. The tasks form three views: Mind tests decisions based on past observations, Act tests precise and timely execution, and Mind2Act combines both in closed-loop tasks where action outcomes guide later decisions. Comparing the three views shows whether a system lacks a capability or fails to compose capabilities it already has. A diagnosis harness further attributes the failed episodes of three representative systems to Mind, Act, or their composition and summarizes each system in a profile card. Our evaluation of multimodal agents, vision-language-action models (VLAs), and world-action models (WAMs) shows that competence in a single view does not carry over to Mind2Act tasks. Even the strongest agent succeeds in 52.7% of Mind and 39.0% of Act episodes but in only 12.0% of Mind2Act episodes. The strongest agent retains task state but struggles with sustained contact, whereas end-to-end policies execute practiced motions but retain little task state. These findings point to composing reasoning and execution through environmental feedback as the main open problem.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具身智能旨在让机器人以类似人类的适应性和可靠性执行复杂的物理任务，这需要三种互补的能力：基于历史的认知推理、精确及时的物理执行，以及通过环境反馈将推理与执行进行组合。然而，现有基准要么在同一任务中评估推理和执行，要么单独评估它们而不评估其组合，因此它们几乎无法揭示失败是源于推理、执行还是它们的组合。我们引入了Mind2Act World，这是一个包含来自五个真实世界应用领域30个模拟操作任务的诊断基准。每个任务有三个难度级别和两种场景设置（干净和随机），产生180种配置。这些任务构成三个视角：Mind测试基于过去观察的决策，Act测试精确及时的执行，Mind2Act在闭环任务中结合两者，其中动作结果指导后续决策。比较这三个视角可以显示系统是缺乏某种能力，还是未能组合其已有的能力。诊断工具进一步将三个代表性系统的失败片段归因于Mind、Act或它们的组合，并在档案卡中总结每个系统。我们对多模态智能体、视觉-语言-动作模型（VLA）和世界-动作模型（WAM）的评估表明，单一视角的能力不能迁移到Mind2Act任务。即使是最强的智能体在52.7%的Mind片段和39.0%的Act片段中成功，但在Mind2Act片段中仅成功12.0%。最强的智能体能保留任务状态但在持续接触方面表现挣扎，而端到端策略能执行练习过的动作但几乎不保留任务状态。这些发现指出，通过环境反馈组合推理和执行是主要的未解决问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个诊断基准（Mind2Act World），用于分别评估和组合评估机器人在物理任务中的认知推理（Mind）、物理执行（Act）以及两者通过环境反馈的组合能力（Mind2Act），以定位系统失败的具体原因。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出包含30个模拟操作任务、180种配置的Mind2Act World基准，分为Mind、Act和Mind2Act三个视角；开发诊断工具将系统失败归因于具体能力缺失或组合失败；揭示单一视角能力无法迁移至组合任务的现象。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的评估数据，最强智能体在Mind和Act视角的成功率分别为52.7%和39.0%，而在Mind2Act视角仅为12.0%。分析指出最强智能体难以维持持续接触，端到端策略难以保留任务状态。局限性方面，摘要未提供该基准在真实物理机器人上的验证结果、具体使用的五个应用领域的名称，以及多模态智能体、VLA和WAM的具体模型名称。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 具身智能与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding（WeMM-Video：推动开源全能模态视频理解的前沿）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 39 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26409\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26409\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct responses and a thinking mode for explicit step-by-step reasoning. The models are trained on a large-scale multimodal corpus of approximately 1.2 trillion tokens through progressive pre-training and a multi-stage post-training pipeline incorporating multi-teacher OPD, anti-repetition MrDPO, and specialist RL. Evaluated across more than 120 benchmarks, WeMM-Video demonstrates superior performance in omni-modal video understanding and reasoning, while maintaining highly competitive capabilities across general audio, silent video, image, and text tasks. Specifically, in omni-modal video evaluations, our flagship WeMM-Video-35B-A3B establishes a new open-source state of the art, substantially outperforming proprietary models such as Qwen3.5-Omni-Flash and Seed2.0-Mini-0428 while narrowing the gap with the strong Gemini-3.0-Flash, and our compact WeMM-Video-9B surpasses the larger open-source Qwen3-Omni-30B-A3B-Instruct. We publicly release the WeMM-Video family along with our evaluation and reproduction pipeline to foster further research and development in the open-source community.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频理解，特别是伴随音频的视频理解，仍然是多模态智能的核心挑战。在本报告中，我们引入了WeMM-Video，这是一个中英双语全能模态基础模型系列，包含2B、4B、9B和35B-A3B变体。以联合视听感知和推理为中心，WeMM-Video在混合思考范式内统一了文本、图像、音频和视频处理，无缝支持用于快速直接响应的非思考指令模式和用于显式逐步推理的思考模式。这些模型在约1.2万亿个token的大规模多模态语料库上进行训练，通过渐进式预训练和包含多教师OPD、防重复MrDPO以及专家RL的多阶段后训练流水线。在超过120个基准测试中评估，WeMM-Video在全能模态视频理解和推理方面展现出卓越的性能，同时在通用音频、无声视频、图像和文本任务中保持高度竞争力的能力。具体而言，在全能模态视频评估中，我们的旗舰WeMM-Video-35B-A3B确立了新的开源最先进水平，大幅超越了Qwen3.5-Omni-Flash和Seed2.0-Mini-0428等专有模型，同时缩小了与强大的Gemini-3.0-Flash的差距，而我们紧凑的WeMM-Video-9B超越了更大的开源Qwen3-Omni-30B-A3B-Instruct。我们公开发布WeMM-Video系列以及我们的评估和复现流水线，以促进开源社区的进一步研究和开发。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个中英双语全能模态基础模型系列（WeMM-Video），统一处理文本、图像、音频和视频，以解决伴随音频的视频理解挑战，并支持混合思考范式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e推出包含2B至35B-A3B多种变体的WeMM-Video模型家族；采用约1.2万亿token语料库训练，结合渐进式预训练与多阶段后训练（多教师OPD、防重复MrDPO、专家RL）；支持非思考指令模式与思考模式；在120多个基准上取得全能模态视频理解的开源SOTA。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明WeMM-Video-35B-A3B在全能模态视频评估中超越Qwen3.5-Omni-Flash和Seed2.0-Mini-0428，并缩小了与Gemini-3.0-Flash的差距；WeMM-Video-9B超越了Qwen3-Omni-30B-A3B-Instruct。局限性方面，摘要未提供在120多个基准测试中的具体得分数字、模型推理的计算成本或延迟，以及多教师OPD、防重复MrDPO和专家RL的具体技术实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与多模态学习 / 视频与多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. Probing the \u0026quot;Conscious\u0026quot; Mind: Selective Access and Global Workspace in Vision-Language Models（探测“有意识”的心智：视觉-语言模型中的选择性访问与全局工作区）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 34 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26590\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26590\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map intermediate states to a shared semantic space defined by the decoder\u0026#x27;s output vocabulary to compare concept accessibility across modalities. MC-Lens supports internal concept interventions to examine the role of accessed concepts in downstream computation. (i) Accessibility and selective access. Multimodal concept information is readable in intermediate states and selectively accessible as tasks require. We extend \u0026quot;readout carriers\u0026quot; from one name token to a token set to better capture and express concept information and support counterfactual experiments. (ii) Concepts in downstream computation. Counterfactual experiments show that accessed concept information participates in downstream computation and reasoning. (iii) Development of cross-modal alignment and selective access. We develop two J-space metrics tracking the development of cross-modal concept alignment more clearly than hidden state cosine in controlled VLM training. The experiment also shows that reliable selective access develops later than concept accessibility. (iv) Shared functions across models. Across VLM families and sizes, we find shared patterns of concept accessibility, query-dependent selectivity and cross-task intervention effects despite differences in internal organisation. These findings offer an experimental basis to study GWT in multimodal artificial systems and how it can guide cross-modal alignment improvements.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉-语言模型（VLM）整合视觉和文本信息，但其输出并未揭示内部概念表示。全局工作区理论（GWT）提出，信息从并行的大脑过程中被选择，在共享工作区中整合，并提供给专门的过程。我们引入了多模态概念透镜（MC-Lens），一种多模态雅可比透镜，来研究VLM概念处理中的这些功能。其视觉编码器和语言解码器透镜将中间状态映射到由解码器输出词汇定义的共享语义空间，以比较跨模态的概念可访问性。MC-Lens支持内部概念干预，以检查访问的概念在下游计算中的作用。（i）可访问性与选择性访问。多模态概念信息在中间状态中是可读的，并且根据任务需要可选择性地访问。我们将“读出载体”从一个名称标记扩展到标记集，以更好地捕获和表达概念信息并支持反事实实验。（ii）下游计算中的概念。反事实实验表明，访问的概念信息参与了下游计算和推理。（iii）跨模态对齐与选择性访问的发展。我们开发了两种J空间指标，在受控的VLM训练中，比隐藏状态余弦更清晰地跟踪跨模态概念对齐的发展。实验还表明，可靠的选择性访问发展得晚于概念可访问性。（iv）跨模型的共享功能。在不同的VLM家族和规模中，尽管内部组织存在差异，我们发现了概念可访问性、依赖查询的选择性以及跨任务干预效应的共享模式。这些发现为研究多模态人工系统中的GWT以及如何指导跨模态对齐改进提供了实验基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究视觉-语言模型（VLM）内部概念处理的选择性访问和全局工作区功能，以揭示其内部概念表示及跨模态对齐机制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出多模态概念透镜（MC-Lens），将中间状态映射到共享语义空间以比较跨模态概念可访问性；将“读出载体”扩展为标记集以支持反事实实验；开发两种J空间指标以跟踪跨模态概念对齐发展；发现不同VLM间存在概念可访问性和干预效应的共享模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出多模态概念信息在中间状态可读且可选择性访问，反事实实验证明其参与下游计算；可靠的选择性访问发展晚于概念可访问性。局限性方面，摘要未提供所测试的具体VLM家族和规模名称、J空间指标的具体数学公式或数值结果，以及GWT理论在人工系统中的具体量化验证指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能基础 / 模型可解释性与认知科学交叉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. Coda-DaVinci: Reimagining Video Generation with Code2Video（Coda-DaVinci：使用Code2Video重塑视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 32 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26595\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26595\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium-grained proxies favor consistency. Physics simulation and proxy-aligned prompting further improve average quality. Guided by these findings, we introduce Coda-DaVinci, a task-adaptive agentic framework for Code2Video generation that selects between proxy-guided and direct generation, adapts modeling granularity to each entity, and coordinates simulation with proxy-grounded prompting. Its multi-agent harness preserves scene assets and guides repairs through visual inspection and independent review. Experiments demonstrate leading instruction following on VTR and scene consistency on R2M, improved physical plausibility over direct generation, and higher visual realism than the compared Code2Video baselines. Long-video evaluations further show gains in event structure and consistency across successive interactions, while revealing limitations in transition stability and adherence to scene settings.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eCode2Video使用智能体编写的3D代理来引导视频生成，从而实现对结构和动态的显式控制。然而，如何构建代理和提示以获得最佳下游质量仍未得到充分探索，该范式的能力和局限性也是如此。通过对照实验和盲评人类评估，我们研究了代理粒度、物理模拟和提示。结果揭示了依赖于任务的权衡：粗粒度代理有利于自然运动，而中等粒度代理有利于一致性。物理模拟和与代理对齐的提示进一步提高了平均质量。在这些发现的指导下，我们引入了Coda-DaVinci，一个用于Code2Video生成的任务自适应智能体框架，它在代理引导和直接生成之间进行选择，使每个实体的建模粒度自适应，并协调模拟与基于代理的提示。其多智能体工具保留了场景资产，并通过视觉检查和独立审查引导修复。实验表明，在VTR上具有领先的指令遵循能力，在R2M上具有场景一致性，相比直接生成提高了物理合理性，并且比比较的Code2Video基线具有更高的视觉真实感。长视频评估进一步显示了在连续交互中事件结构和一致性的提升，同时揭示了在过渡稳定性和遵循场景设置方面的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决Code2Video范式中如何构建3D代理和提示以优化下游视频生成质量的问题，开发一个任务自适应的智能体框架以实现结构与动态的显式控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e揭示代理粒度、物理模拟和提示在视频生成中的任务依赖权衡；提出Coda-DaVinci框架，自适应选择代理引导或直接生成，并为每个实体调整建模粒度；引入多智能体工具通过视觉检查和独立审查保留场景资产并引导修复。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Coda-DaVinci在VTR的指令遵循和R2M的场景一致性上表现领先，提升了物理合理性和视觉真实感，长视频在事件结构和一致性上有增益。局限性方面，摘要明确指出在过渡稳定性和遵循场景设置方面存在局限。未提供的信息包括VTR和R2M的具体全称或指标得分、物理模拟的具体引擎或方法、以及多智能体工具的具体架构细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与多智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Posterior Matching Distillation（后验匹配蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 30 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26629\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26629\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDiffusion distillation accelerates image and video generation by compressing a pretrained teacher\u0026#x27;s iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student\u0026#x27;s output distribution to the teacher\u0026#x27;s. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distribution-based distillation family that combines mode-covering posterior sampling with any-step generation. At zero population loss, PMD recovers the teacher\u0026#x27;s full posterior of clean images at each trained noise level. Its stochastic student supports any-step sampling budgets within the trained timestep grid without further training. To learn these posteriors, PMD matches exponentially reweighted averages of student samples conditioned on a fixed noisy state to corresponding teacher posterior means. Under Gaussian corruption, exponentially tilted posterior mean is a single teacher evaluation at a shifted input. We prove that, matching tilted means over an open neighborhood uniquely identifies the full posterior. PMD thus supervises the entire conditional distribution through a family of mean constraints, without any auxiliary student-score network. Experiments on SDXL and FLUX.2 [klein] 4B demonstrate that PMD achieves the best FID among 4-step methods on both models, while maintaining competitive or leading performance across prompt-alignment and perceptual-quality metrics.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩散蒸馏通过将预训练教师的迭代采样过程压缩为少数几次网络评估，从而加速图像和视频生成。基于分布的方法通过匹配学生的输出分布与教师的分布来实现这一点。这种匹配通常由逆向KL目标驱动，其模式寻求偏差有利于主导的教师模式，而牺牲了样本间的多样性。我们引入了后验匹配蒸馏（PMD），这是基于分布的蒸馏家族的新成员，它将覆盖模式的后验采样与任意步生成相结合。在总体损失为零的情况下，PMD在每个训练的噪声水平下恢复教师的完整干净图像后验。其随机学生支持在训练的时间步网格内的任意步采样预算，而无需进一步训练。为了学习这些后验，PMD将固定噪声状态下条件的学生样本的指数重加权平均值与相应的教师后验均值进行匹配。在高斯损坏下，指数倾斜后验均值是在偏移输入处的单次教师评估。我们证明，在开放邻域上匹配倾斜均值可以唯一地确定完整后验。因此，PMD通过一系列均值约束来监督整个条件分布，而无需任何辅助的学生得分网络。在SDXL和FLUX.2 [klein] 4B上的实验表明，PMD在这两个模型上的4步方法中实现了最佳的FID，同时在提示对齐和感知质量指标上保持具有竞争力或领先的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e加速图像和视频生成的扩散蒸馏，通过压缩预训练教师的迭代采样过程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出后验匹配蒸馏（PMD），结合覆盖模式的后验采样与任意步生成；在零总体损失下恢复教师完整后验；支持任意步采样预算而无需额外训练；通过匹配指数倾斜后验均值监督整个条件分布，无需辅助学生得分网络；在SDXL和FLUX.2上4步方法中实现最佳FID，且提示对齐和感知质量指标具有竞争力或领先。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出PMD解决了基于分布的蒸馏中逆向KL目标带来的模式寻求偏差问题，通过匹配后验均值来监督条件分布。局限性方面，摘要未提供具体的局限性分析，仅提到了在SDXL和FLUX.2 [klein] 4B上的实验结果，未提及其他模型或更高分辨率及复杂场景下的表现。摘要未提供具体的FID数值、提示对齐和感知质量的具体指标得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像与视频生成 / 扩散模型蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation（掩码并非物体：用于3D高斯分割的体积监督）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 30 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21383\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21383\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003e3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure to group per-pixel contributors and directly supervises all Gaussians in selected depth clusters, bypassing contribution-weighted gradient delivery. To evaluate volumetric completeness, we introduce Removal-3D, a synthetic object-removal benchmark, and the Removal Depth Error (RDE), a metric comparing predicted and ground-truth depth changes. Across four rendering-based baselines, VODA consistently improves volumetric segmentation on Removal-3D while maintaining or improving performance on LERF and ScanNet. Further analysis shows that VODA recovers lower-contribution Gaussians, while simple gradient reweighting and spatial propagation fail to reproduce comparable gains.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e3D高斯泼溅支持对高斯基元进行物体级操作，然而现有的分割方法主要通过渲染视图进行训练和评估。这种不匹配可能会从不完整的3D选择中产生准确的渲染掩码，因为alpha混合特征监督将学习集中在主导贡献者上，而使被遮挡或低贡献的高斯受到微弱的监督。我们提出了VODA，一种即插即用的监督目标，它利用局部深度结构对每像素贡献者进行分组，并直接监督选定深度簇中的所有高斯，从而绕过基于贡献加权的梯度传递。为了评估体积完整性，我们引入了Removal-3D，一个合成物体移除基准，以及移除深度误差（RDE），一种比较预测和真实深度变化的指标。在四个基于渲染的基线中，VODA在Removal-3D上持续提高了体积分割性能，同时在LERF和ScanNet上保持或提高了性能。进一步的分析表明，VODA恢复了低贡献的高斯，而简单的梯度重加权和空间传播未能重现可比的增益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e改进3D高斯泼溅中的物体级分割，解决现有基于渲染视图训练和评估导致的3D选择不完整问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出VODA，一种即插即用的监督目标，利用局部深度结构分组像素贡献者并直接监督深度簇中的所有高斯；引入Removal-3D合成物体移除基准和RDE指标以评估体积完整性；在Removal-3D上持续提高体积分割，在LERF和ScanNet上保持或提升性能；成功恢复低贡献高斯，优于简单的梯度重加权和空间传播。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出VODA通过直接监督深度簇中的所有高斯，解决了alpha混合特征监督导致的低贡献和高斯被遮挡部分监督不足的问题。局限性方面，摘要未提供具体的局限性分析，未提及VODA在动态场景、极大场景或复杂光照条件下的表现。摘要未提供Removal-3D、LERF和ScanNet上的具体数值指标，也未说明四个基于渲染的基线的具体名称。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉 / 3D高斯泼溅与分割\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth（Depth Pro 2：清晰且时间一致的度量单目深度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 27 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26603\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26603\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present Depth Pro 2, an approach to estimating dense metric depth for images and video at full resolution. By analyzing prior methods for monocular depth estimation, we find that they commonly trade off temporal consistency and boundary sharpness: multi-frame methods favor consistency, single-frame methods favor sharpness. To overcome this trade-off, we train a single, scalable network that processes both images and video and predicts depth maps at native resolution. Depth Pro 2 produces depth maps that are metrically accurate, sharp, and temporally consistent all at once, outperforming prior work in all of these dimensions. We release a family of models that define a new Pareto frontier in terms of metric accuracy, sharpness, temporal consistency, and runtime. We release code and weights at https://apple-aiml-research.github.io/ml-depth-pro-2/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了Depth Pro 2，一种在全分辨率下估计图像和视频的密集度量深度的方法。通过分析单目深度估计的先前方法，我们发现它们通常在时间一致性和边界清晰度之间进行权衡：多帧方法倾向于一致性，单帧方法倾向于清晰度。为了克服这种权衡，我们训练了一个单一的、可扩展的网络，该网络同时处理图像和视频，并以原生分辨率预测深度图。Depth Pro 2生成的深度图同时具备度量准确性、清晰度和时间一致性，在所有这些维度上均优于先前工作。我们发布了一系列模型，在度量准确性、清晰度、时间一致性和运行时间方面定义了新的帕累托前沿。我们在 https://apple-aiml-research.github.io/ml-depth-pro-2/ 发布了代码和权重。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在全分辨率下估计图像和视频的密集度量单目深度，克服先前方法在时间一致性和边界清晰度之间的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Depth Pro 2，使用单一可扩展网络同时处理图像和视频并以原生分辨率预测深度图；生成的深度图同时具备度量准确性、清晰度和时间一致性，优于先前工作；发布了一系列模型，在度量准确性、清晰度、时间一致性和运行时间方面定义了新的帕累托前沿；开源了代码和权重。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出Depth Pro 2通过单一网络处理图像和视频，解决了多帧方法和单帧方法在时间一致性和边界清晰度之间的权衡问题。局限性方面，摘要未提供具体的局限性分析，未提及在极端光照、弱纹理或快速运动场景下的表现。摘要未提供具体的度量准确性、清晰度、时间一致性和运行时间的数值指标，也未说明帕累托前沿的具体对比基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 深度估计 / 单目深度估计\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning（EgoCaptioner：迈向全面且细粒度的第一人称视频字幕生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 24 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26380\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26380\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEgocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer\u0026#x27;s motion. Existing caption formats also offer limited support for combining detailed narration with precise timing. We present EgoCaptioner, which pairs a video-level overview of the setting, participants, and the wearer\u0026#x27;s overall activity with timed steps whose narration adapts to varying perceptual demands and marks key moments at specific timestamps. We develop a coarse-to-fine annotation pipeline that establishes event structure before expanding step descriptions, yielding 50,000 training examples from eight egocentric video sources. Complementary rewards assess factual accuracy and coverage, measure step-level temporal alignment, and penalize fragmented or redundant narration, guiding caption refinement through Group Relative Policy Optimization (GRPO). To improve the reliability of factual supervision, we supplement caption references with pose-derived motion facts when sensor data are available. Across five egocentric benchmarks, EgoCaptioner achieves leading performance among evaluated open-source models in caption quality, caption-conditioned question answering, and temporal alignment. It also surpasses Gemini 3.1 Pro on PhysCapBench and all evaluated proprietary baselines on Minerva-Ego under the caption-to-QA protocol. Ablations support the complementary roles of factual and temporal rewards and show that coarse-to-fine annotation provides more effective supervision than single-pass annotation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e第一人称视频字幕生成需要细粒度的细节和准确的时间安排，然而当前的多模态大语言模型经常遗漏短暂动作、混淆其顺序或误解佩戴者的运动。现有的字幕格式也对将详细叙述与精确时间结合的支持有限。我们提出了EgoCaptioner，它将关于场景、参与者和佩戴者整体活动的视频级概述与定时步骤配对，其叙述适应不同的感知需求并在特定时间戳标记关键时刻。我们开发了一种从粗到细的标注流程，在扩展步骤描述之前建立事件结构，从八个第一人称视频源中产生了50,000个训练样本。互补的奖励评估事实准确性和覆盖率，测量步骤级的时间对齐，并惩罚碎片化或冗余的叙述，通过组相对策略优化指导字幕细化。为了提高事实监督的可靠性，当传感器数据可用时，我们用姿态衍生的运动事实补充字幕参考。在五个第一人称基准测试中，EgoCaptioner在评估的开源模型中在字幕质量、字幕条件问答和时间对齐方面取得了领先的性能。它还在PhysCapBench上超越了Gemini 3.1 Pro，并在Minerva-Ego上的所有评估的专有基线中在字幕到问答协议下取得了超越。消融实验支持了事实和时序奖励的互补作用，并表明从粗到细的标注比单次标注提供了更有效的监督。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e生成全面且细粒度的第一人称视频字幕，解决当前多模态大语言模型遗漏短暂动作、混淆顺序、误解运动以及现有格式难以结合详细叙述与精确时间的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出EgoCaptioner，结合视频级概述与适应感知需求的定时步骤叙述；开发从粗到细的标注流程，从8个数据源生成50,000个训练样本；使用互补奖励和组相对策略优化指导字幕细化；利用姿态衍生的运动事实增强事实监督；在5个第一人称基准中开源模型领先，超越Gemini 3.1 Pro及专有基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出EgoCaptioner通过从粗到细的标注流程、互补奖励机制以及姿态衍生的运动事实，解决了第一人称视频字幕生成中的细节遗漏和时间不准问题。局限性方面，摘要未提供具体的局限性分析，未提及模型在计算资源消耗、推理速度或处理极长视频时的表现。摘要未提供5个第一人称基准的具体名称，也未提供字幕质量、问答和时间对齐的具体数值指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频理解 / 第一人称视频字幕生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. HiUni: Harmonizing Understanding and Generation in Shared Visual Space（HiUni：在共享视觉空间中协调理解与生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 23 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26107\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26107\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unification. In this paper, we present HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly extended into a unified model with extensive parameter sharing. Specifically, HiUni reuses the same language-aligned ViT and dense Transformer backbone for both capabilities, while confining task-specific computation to the output side. Yet such a design introduces two key challenges. Generation in pixel space is difficult to optimize, and semantic abstraction in pretrained ViT discards fine spatial details required for synthesis. To address these challenges, HiUni introduces a Pixel Diffusion Head tailored to direct pixel-space optimization and a lightweight HiGate pathway that provides fine-grained spatial details near the output stage. Extensive experiments show that HiUni achieves a similar average understanding score to the pretrained VLM while attaining competitive performance on image generation and editing. Controlled comparisons and analyses further demonstrate that a single dense backbone can effectively support both capabilities without task-specific backbone computation, highlighting a simpler path toward unified multimodal modeling.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e统一的多模态模型旨在单一框架内支持视觉理解和生成。然而，主流方法通常分离其视觉表示或骨干计算以适应这两个任务的不同要求，这限制了统一的程度。在本文中，我们提出了HiUni，重新审视了这一设计选择，并探索预训练的视觉语言模型是否可以直接扩展为具有广泛参数共享的统一模型。具体而言，HiUni为这两种能力重用相同的语言对齐ViT和密集Transformer骨干，同时将特定任务的计算限制在输出端。然而，这种设计引入了两个关键挑战。像素空间中的生成难以优化，并且预训练ViT中的语义抽象丢弃了合成所需的精细空间细节。为了应对这些挑战，HiUni引入了专为直接像素空间优化定制的像素扩散头，以及在输出阶段附近提供细粒度空间细节的轻量级HiGate路径。大量实验表明，HiUni实现了与预训练VLM相似的平均理解分数，同时在图像生成和编辑方面取得了具有竞争力的性能。受控的比较和分析进一步证明，单一密集骨干可以有效支持这两种能力，而无需特定任务的骨干计算，凸显了通往统一多模态建模的更简单路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在单一框架内实现视觉理解和图像生成与编辑的统一，探索预训练视觉语言模型通过广泛参数共享直接扩展为统一模型的可能性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出HiUni，重用相同的语言对齐ViT和密集Transformer骨干，将特定任务计算限制在输出端；引入像素扩散头以直接优化像素空间，引入轻量级HiGate路径提供细粒度空间细节；实现与预训练VLM相似的平均理解分数，并在图像生成和编辑上取得竞争力性能；证明单一密集骨干无需特定任务骨干计算即可有效支持理解和生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出HiUni通过共享骨干网络并引入像素扩散头和HiGate路径，解决了像素空间生成优化困难和预训练ViT丢失空间细节的问题，实现了理解和生成的统一。局限性方面，摘要未提供具体的局限性分析，未提及模型在视频理解、3D视觉或其他模态上的扩展性，也未说明在极高分辨率图像生成或复杂推理任务上的表现。摘要未提供具体的平均理解分数、图像生成和编辑的评估指标数值，也未说明与哪些具体基线进行了对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态学习 / 统一视觉理解与生成模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. TuringSpace: Grounding Spatial Intelligence in Action with Interactive CAPTCHAs（TuringSpace：通过交互式验证码将空间智能落地于动作中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25387\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25387\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHumans act in the visual world by inferring the 3D layout behind a 2D view, predicting how an action changes it, and correcting themselves after seeing the result. Can multimodal large language models (MLLMs) do the same? CAPTCHAs offer a natural test, since humans solve them through this very loop, clicking and dragging on the screen and adjusting after each result. Yet existing CAPTCHA benchmarks are largely solved and rarely spatial, while spatial benchmarks rarely require action. We therefore present TuringSpace, a synthetic web environment of 125 interactive CAPTCHAs that span five spatial abilities and must be solved through clicks and drags on the screen. Every task is a program that generates new instances with a checker and an oracle, so the tasks also form a scalable training gym. Humans solve 94.1% of the tasks, whereas the best model, GPT-6 Astra, still fails 25.9% of them, and the best open-weight model, Kimi K3, fails 68.0%. Our further analysis shows that most failures come from misreading the screenshot, and that model reasoning rarely corrects a wrong belief but hallucinates evidence to defend it. To test whether such spatial abilities can be learned, we fine-tune Qwen3.5-9B on this gym. Its success rate rises from 1.6% to 33.1%, above Kimi K3, and it improves on all seven out-of-distribution benchmarks, including a 9.9-point gain on the real-world indoor videos of VSI-Bench. These results show that grounding spatial intelligence in screen actions exposes what MLLMs lack and offers a scalable way to teach it, with gains that transfer to real-world scenes. We will release TuringSpace to support further study.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人类通过在2D视图背后推断3D布局、预测动作如何改变它以及在看到结果后纠正自己来在视觉世界中行动。多模态大语言模型（MLLMs）能做到同样吗？验证码提供了一个自然的测试，因为人类正是通过这个循环来解决它们的，在屏幕上点击和拖动并在每次结果后进行调整。然而，现有的验证码基准大部分已被解决且很少涉及空间，而空间基准很少需要动作。因此，我们提出了TuringSpace，一个包含125个交互式验证码的合成网络环境，涵盖五种空间能力，必须通过在屏幕上的点击和拖动来解决。每个任务都是一个程序，生成带有检查器和预言机的新实例，因此这些任务也构成了一个可扩展的训练场。人类解决了94.1%的任务，而最好的模型GPT-6 Astra仍然失败了25.9%，最好的开源权重模型Kimi K3失败了68.0%。我们的进一步分析表明，大多数失败来自于误读截图，并且模型推理很少纠正错误的信念，而是产生幻觉证据来为其辩护。为了测试这种空间能力是否可以被学习，我们在这个训练场上微调了Qwen3.5-9B。其成功率从1.6%上升到33.1%，高于Kimi K3，并且在所有七个分布外基准上都有提升，包括在VSI-Bench的真实世界室内视频上获得了9.9分的提升。这些结果表明，将空间智能落地于屏幕动作中暴露了MLLMs所缺乏的东西，并提供了一种可扩展的教学方法，其收益可以转移到真实世界的场景中。我们将发布TuringSpace以支持进一步的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和提升多模态大语言模型（MLLMs）在交互式验证码环境中的空间智能和屏幕动作能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了TuringSpace，一个包含125个交互式验证码的合成网络环境，涵盖五种空间能力；发现GPT-6 Astra和Kimi K3等顶尖模型在此任务上表现不佳，主要失败原因是误读截图和幻觉辩护；微调Qwen3.5-9B不仅大幅提升了在该环境中的成功率，还在七个分布外基准（包括VSI-Bench）上实现了泛化提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了TuringSpace的具体规模（125个验证码）、人类和模型的具体表现数字（人类94.1%，GPT-6 Astra失败25.9%，Kimi K3失败68.0%），以及微调Qwen3.5-9B的具体提升（1.6%到33.1%，VSI-Bench提升9.9分）。局限性方面，摘要未提供关于模型在更复杂真实世界3D交互中的表现局限，也未提供微调数据的具体规模或计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型 / 空间智能与具身交互\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. ZeroVLN: Learning to Navigate without Supervised Fine-Tuning of the VLM Brain（ZeroVLN：无需对VLM大脑进行监督微调的导航学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 21 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26414\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26414\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRepresentative vision-language navigation (VLN) methods typically couple a vision-language model (VLM) brain with a learnable action head and fine-tune the VLM brain on navigation-domain data to predict geometric goals. However, such adaptation can substantially alter base VLM weights and degrade general visual capabilities. We introduce ZeroVLN, a slow-fast navigation framework that achieves effective navigation with zero navigation-domain SFT of the VLM brain. Rather than teaching the brain to predict geometric goals, we equip it with a semantic tool-calling interface for conveying movement decisions to an action expert in natural language. We first adapt the action expert to carry out these movement requests, then jointly improve the brain\u0026#x27;s movement decisions and the action expert\u0026#x27;s continuous execution through closed-loop reinforcement learning (RL). Trained on the same navigation episodes, ZeroVLN substantially outperforms representative SFT-based hierarchical VLN methods on standard VLN-CE (continuous environments) benchmarks, while inducing only minor changes to the brain\u0026#x27;s weights and largely preserving its general capabilities. To our knowledge, ZeroVLN is the first slow-fast VLN framework with zero navigation-domain SFT of the VLM brain, and the first to jointly optimize its slow and fast policies through closed-loop agentic RL in VLN-CE.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代表性的视觉语言导航（VLN）方法通常将视觉语言模型（VLM）大脑与可学习的动作头结合，并在导航领域数据上微调VLM大脑以预测几何目标。然而，这种适应会大幅改变基础VLM权重并降低通用视觉能力。我们引入了ZeroVLN，一个慢快导航框架，在VLM大脑零导航领域监督微调（SFT）的情况下实现有效导航。我们没有教大脑预测几何目标，而是为其配备了语义工具调用接口，以自然语言将移动决策传达给动作专家。我们首先使动作专家适应执行这些移动请求，然后通过闭环强化学习（RL）联合改善大脑的移动决策和动作专家的连续执行。在相同的导航片段上训练，ZeroVLN在标准VLN-CE（连续环境）基准上大幅优于代表性的基于SFT的分层VLN方法，同时仅引起大脑权重的微小变化并很大程度上保留了其通用能力。据我们所知，ZeroVLN是第一个VLM大脑零导航领域SFT的慢快VLN框架，也是第一个在VLN-CE中通过闭环智能体RL联合优化其慢速和快速策略的框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在不进行导航领域监督微调（SFT）的情况下，训练视觉语言模型（VLM）实现有效的视觉语言导航（VLN），同时保留其通用视觉能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出ZeroVLN慢快导航框架，实现VLM大脑零导航领域SFT；通过语义工具调用接口将移动决策传达给动作专家；通过闭环强化学习（RL）联合优化大脑的移动决策和动作专家的连续执行；在VLN-CE基准上大幅优于基于SFT的方法，且仅引起大脑权重微小变化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要说明了ZeroVLN的核心机制（语义工具调用、闭环RL）和主要结果（在VLN-CE基准上优于SFT方法，保留通用能力）。局限性方面，摘要未提供具体的性能提升数字、计算资源消耗，也未提及在离散环境或其他非VLN-CE基准上的表现，以及动作专家在极端情况下的执行失败率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉语言导航 / 强化学习与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators（AltRA-Test：无需共享标注者的LLM评委替代标注者检验）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26073\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26073\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly used as judges and graders to replace human annotators, raising the question of when such replacement is statistically justified. To support such decisions, the Alternative Annotator Test (Alt-Test) was introduced for dense settings where all items are annotated by the same annotators. However, in many large-scale annotation settings, items are annotated by different subsets of annotators. We therefore propose the Alternative Annotator Test with Resampled Annotations (AltRA-Test), a statistical test that does not require that all items are annotated by the same annotators. AltRA-Test uses a bootstrap that resamples items, draws k human annotations for each item, and substitutes one of them with an LLM annotation. This produces paired all-human and mixed human-LLM panels. A replacement is supported when the inter-annotator agreement (IAA) of the mixed panel is statistically non-inferior to the IAA of the all-human panel, i.e., when the LLM preserves the signal that the human annotators share. We establish that AltRA-Test is a consistent test of asymptotic level alpha. We then evaluate it through simulations and real-world experiments in which we test 18 LLMs and 5 prompting techniques on 20 datasets across text, image, audio, and video. Across these evaluations, about 100 items often suffice for the test. In simulations, where we know whether the LLM is a better or a worse annotator than the humans, AltRA-Test makes more correct replacement decisions than existing baselines. In real-world data experiments, LLMs pass the test in about half of the setups, depending mainly on the task. Since replacement is not always justified, we encourage researchers to test it for their task.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLMs）越来越多地被用作评委和评分者来替代人类标注者，这引发了这种替代在何时具有统计学合理性的问题。为了支持此类决策，引入了替代标注者检验（Alt-Test），适用于所有项目由相同标注者标注的密集设置。然而，在许多大规模标注设置中，项目由标注者的不同子集进行标注。因此，我们提出了带有重采样标注的替代标注者检验（AltRA-Test），这是一种不要求所有项目由相同标注者标注的统计检验。AltRA-Test使用一种自举法，对项目进行重采样，为每个项目抽取k个人类标注，并用一个LLM标注替换其中一个。这产生了配对的全人类和混合人类-LLM面板。当混合面板的标注者间一致性（IAA）在统计上不劣于全人类面板的IAA时，即当LLM保留了人类标注者共享的信号时，支持进行替代。我们确立了AltRA-Test是一个渐近水平alpha的一致检验。然后，我们通过模拟和真实世界实验对其进行评估，在这些实验中，我们在跨文本、图像、音频和视频的20个数据集上测试了18个LLM和5种提示技术。在这些评估中，大约100个项目通常就足以进行测试。在模拟中，当我们知道LLM是比人类更好还是更差的标注者时，AltRA-Test比现有基线做出更多正确的替代决策。在真实世界数据实验中，LLM在大约一半的设置中通过了测试，这主要取决于任务。由于替代并非总是合理的，我们鼓励研究人员针对其任务进行测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种统计检验方法（AltRA-Test），用于在大规模标注设置（项目由不同标注者子集标注）中，评估大语言模型（LLM）替代人类标注者是否具有统计学合理性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出AltRA-Test，不要求所有项目由相同标注者标注，通过重采样和自举法生成全人类与混合面板进行对比；证明了该检验是一致检验；在18个LLM、5种提示技术和20个多模态数据集上进行了评估；约100个项目即可满足测试需求；在模拟和真实实验中均表现出优于基线的正确决策能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了AltRA-Test的机制、理论性质（一致检验）、评估规模（18个LLM，5种提示，20个数据集，约100个项目）以及实验结果（一半设置通过测试）。局限性方面，摘要未提供具体的IAA数值差异、显著性水平alpha的具体设定值，也未详细说明不同模态数据集上通过测试的具体比例差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型评估 / 统计检验与标注质量\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. WAM-Policy: World Action Models with On-Policy Distillation for Quadrupedal Loco-Manipulation（WAM-Policy：用于四足运动操作的在策略蒸馏世界动作模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 16 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24011\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24011\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eArm-free quadrupeds can perform loco-manipulation, walking on three legs while manipulating with a front leg, yet no existing policy for it follows language instructions. World action models (WAMs) have emerged as effective language-conditioned manipulation policies, but are pretrained for robot arms and sample slowly. WAM-Policy turns one WAM into a quadrupedal loco-manipulation policy via two stages. The first, Cross-Morphology Policy Adaptation and Acceleration, adapts the arm-centric WAM to quadrupeds and distills the transferred policy into a student with one video and two action steps by on-policy self-distillation (OPSD). This student, however, is bounded by its teacher, which only imitates demonstrations. The second stage, Task-Specific Improvement and Merging, therefore tunes the teacher by reinforcement learning (RL) and merges the slow specialists into one few-step student by multi-teacher on-policy distillation (M-OPD). On QLM-Bench, ten simulated tasks with 1,000 demonstrations synthesized without teleoperation, the transferred policy reaches 77.0%, and the OPSD student keeps 76.7% while sampling 14 times faster. Task-specific RL and M-OPD lift it to 85.0%. We also deploy the OPSD student on a real Unitree Go2 Air. WAM-Policy thus achieves a stronger quadrupedal policy at a fraction of the inference cost.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e无臂四足机器人可以执行运动操作，即用三条腿行走同时用前腿进行操作，然而现有针对此的策略没有遵循语言指令的。世界动作模型（WAMs）已成为有效的语言条件操作策略，但它们是预训练用于机械臂的且采样缓慢。WAM-Policy通过两个阶段将一个WAM转化为四足运动操作策略。第一阶段，跨形态策略适应与加速，将以臂为中心的WAM适应于四足机器人，并通过在策略自蒸馏（OPSD）将转移的策略蒸馏成具有一个视频和两个动作步骤的学生模型。然而，该学生受限于其仅模仿示范的教师模型。因此，第二阶段，特定任务改进与合并，通过强化学习（RL）微调教师模型，并通过多教师在策略蒸馏（M-OPD）将缓慢的专家合并为一个少步学生模型。在QLM-Bench上，十个模拟任务，具有1,000个无需遥操作合成的示范，转移策略达到77.0%，OPSD学生保持76.7%同时采样快14倍。特定任务RL和M-OPD将其提升至85.0%。我们还将OPSD学生部署在真实的Unitree Go2 Air上。因此，WAM-Policy以极低的推理成本实现了更强的四足策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将预训练用于机械臂的世界动作模型（WAM）转化为遵循语言指令的四足机器人运动操作策略，并解决其采样缓慢的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WAM-Policy，通过两阶段将WAM转化为四足运动操作策略；第一阶段使用在策略自蒸馏（OPSD）实现跨形态适应并加速14倍；第二阶段使用强化学习（RL）和多教师在策略蒸馏（M-OPD）提升性能至85.0%；成功部署于真实的Unitree Go2 Air机器人。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了QLM-Bench上的具体性能数字（转移策略77.0%，OPSD学生76.7%且快14倍，最终85.0%），以及1000个无需遥操作的示范。局限性方面，摘要未提供真实机器人部署的具体成功率或失败原因，未说明强化学习的具体奖励函数设计，也未提及在更复杂或非模拟环境中的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 四足机器人与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. RL Post-Training in Diffusion Transformers Is Activation Steering（扩散Transformer中的强化学习后训练即为激活引导）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26627\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26627\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning (RL) post-training substantially improves the visual quality, text rendering, and compositional accuracy of diffusion transformers. Because capabilities such as rendering requested text or composing multiple objects are inherently prompt-dependent, a natural hypothesis is that improving them requires learning complex, input-dependent transformations. To isolate how much of these gains an input-independent shift explains, we probe each RL-tuned model with a deliberately simple parameterization: a fixed set of steering vectors added to the block outputs of the frozen base model. On SD3.5-M, these vectors hold 65x fewer parameters than the RL-tuned LoRA (0.29M against 18.8M). We fit them to match the velocity predictions of public RL-tuned checkpoints, with no reward in the objective. Although the vectors are identical for every prompt, token, and sampling seed, they recover 90.0-96.3% of the reward gains of six RL-tuned image models, and 89.8% and 111.9% on two RL-tuned video models. Initialized at zero and trained with online RL, the vectors alone exceed the reward gains of weight-based RL on text rendering (OCR) and human preference (PickScore) on SD3.5-M. A constant shift thus suffices for most of the gain of policy-gradient RL post-training: without new input-dependent transformations, it steers the pretrained generator toward what it can already compute.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e强化学习（RL）后训练大幅提升了扩散Transformer的视觉质量、文本渲染和组合准确性。由于渲染请求文本或组合多个对象等能力本质上依赖于提示，一个自然的假设是提升它们需要学习复杂的、依赖于输入的变换。为了隔离这些收益中有多少可以由独立于输入的偏移来解释，我们用故意简单的参数化来探测每个RL微调模型：一组固定的引导向量，添加到冻结基础模型的块输出上。在SD3.5-M上，这些向量包含的参数比RL微调的LoRA少65倍（0.29M对18.8M）。我们拟合它们以匹配公开RL微调检查点的速度预测，目标中没有奖励。尽管这些向量对每个提示、标记和采样种子都是相同的，它们恢复了六个RL微调图像模型90.0-96.3%的奖励收益，以及在两个RL微调视频模型上89.8%和111.9%的收益。初始化为零并使用在线RL训练，仅这些向量在SD3.5-M上的文本渲染（OCR）和人类偏好（PickScore）方面就超过了基于权重的RL的奖励收益。因此，恒定偏移足以解释策略梯度RL后训练的大部分收益：无需新的依赖于输入的变换，它将预训练生成器引导至其已经能够计算的内容。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究扩散Transformer中强化学习（RL）后训练提升视觉质量、文本渲染和组合准确性的内在机制，验证独立于输入的激活引导是否能解释大部分性能收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现使用固定引导向量（参数量仅为LoRA的1/65）添加到冻结基础模型上，能恢复90.0-96.3%的图像模型和89.8-111.9%的视频模型的RL奖励收益；在SD3.5-M上，仅使用引导向量进行在线RL训练，在文本渲染和人类偏好上超越了基于权重的RL；证明恒定偏移足以解释策略梯度RL后训练的大部分收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的参数对比（0.29M vs 18.8M，少65倍）和收益恢复比例（图像90.0-96.3%，视频89.8%和111.9%）。局限性方面，摘要未提供具体使用的6个图像模型和2个视频模型的名称或类型，未说明引导向量的具体维度或网络层分布，也未探讨这种方法在更复杂生成任务（如长视频或3D生成）中的适用性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e扩散模型 / 强化学习与模型解释\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. WM^MLLM: Turning MLLMs into World Models（WM^MLLM：将多模态大语言模型转化为世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24193\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24193\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo world models keep the world in the context of a generator, so a revisit is synthesized again and earlier edits can drift or disappear. We present WM^MLLM, the first interactive world model built on multimodal large language models (MLLMs), for persistent, editable world generation from a single image. WM^MLLM keeps the world state outside every generator, as a panorama with a revision history, and lets the MLLMs write it: they turn each request into operations on this state, select where a local edit is written, and check every candidate before it becomes the next state. Image generators only propose views, and video only presents them. Users can walk to new places and return, edit objects through text or a box, place subjects, and change lighting, weather or season. By construction, a revisit at the same revision reproduces the earlier view exactly, a local edit leaves every panorama pixel outside its region unchanged, and each request starts from the result of the previous one. Against six world model baselines on MBench-A, WM^MLLM has the highest mean on all four environment-recovery metrics (Epipolar 91.5 versus 0.1 to 74.0) and completes the most camera round trips (85.3% versus at most 50.9%). It has the best value in all 15 CompBench columns against 15 baselines. On 112 local edits judged blind, selecting the region to write after generation raises completion from 34.8% to 83.0%. On 258 WBench and MBench-A items, all 46 revisits recover their earlier views, and all 97 local edits that pass the check leave panorama pixels outside their region unchanged.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频世界模型将世界保持在生成器的上下文中，因此重新访问会被重新合成，早期的编辑可能会漂移或消失。我们提出了 WM^MLLM，这是首个构建于多模态大语言模型（MLLMs）之上的交互式世界模型，用于从单张图像进行持久、可编辑的世界生成。WM^MLLM 将世界状态保持在每个生成器之外，作为一个带有修订历史的全景图，并让 MLLMs 对其进行写入：它们将每个请求转化为对该状态的操作，选择局部编辑写入的位置，并在每个候选成为下一个状态之前进行检查。图像生成器仅提出视图，视频仅展示它们。用户可以走到新地方并返回，通过文本或边界框编辑对象，放置主体，并改变光照、天气或季节。通过结构设计，在相同修订处重新访问可以完全重现早期视图，局部编辑保持其区域外的每个全景像素不变，并且每个请求都从上一个请求的结果开始。在 MBench-A 上对比六个世界模型基线，WM^MLLM 在所有四个环境恢复指标上具有最高的平均值（对极 91.5 对比 0.1 到 74.0），并完成了最多的相机往返（85.3% 对比最多 50.9%）。在对比 15 个基线的 15 个 CompBench 列中，它具有最佳值。在对 112 个局部编辑进行盲评时，在生成后选择写入区域将完成率从 34.8% 提高到 83.0%。在 258 个 WBench 和 MBench-A 项目上，所有 46 次重新访问都恢复了其早期视图，并且所有通过检查的 97 次局部编辑都保持了其区域外的全景像素不变。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建首个基于多模态大语言模型的交互式世界模型，实现从单张图像进行持久且可编辑的世界生成，解决视频世界模型中重新访问时编辑漂移或消失的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 将世界状态作为带有修订历史的全景图保存在生成器外部，由MLLMs进行写入和检查。2. 支持用户走到新地方并返回、通过文本或框编辑对象、放置主体及改变环境条件。3. 在MBench-A上，环境恢复指标和相机往返完成率显著优于6个基线；在CompBench的15个指标上均优于15个基线。4. 生成后选择写入区域将局部编辑完成率从34.8%提升至83.0%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过架构设计保证了状态的一致性和编辑的精确性，实验数据详实。但摘要未提供该模型在计算资源消耗、生成速度或处理极长序列与复杂场景时的具体表现和局限性，也未提及与基于3D表示的世界模型的对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大语言模型 / 世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Training Vision Models for LLM-Driven Weight-Space Programming（训练视觉模型以用于LLM驱动的权重空间编程）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26408\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26408\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIt has been demonstrated that, in certain settings, large language models can perform weight-space programming to directly modify the weights of neural networks. However, it is unknown how dedicated training of these networks can contribute to the successes of weight-space programming. We present a benchmark of LLM-driven weight-space programming on vision models, in which five LLMs edit convolutional networks and vision transformers on relabeling and error-correction tasks on Waterbirds, CIFAR-100, PACS and Entity-30. We report more than 2,600 such edit processes, whereby each edit is scored on held-out images for success, side effects and accuracy loss. We compare standard training with label smoothing, gradient-based editable training, and our Edit-Ready Training (ERT), a novel method that rehearses the direct, closed-form weight edits LLMs perform. We show that preparing networks for editing raises the success of LLM edits substantially where standard networks are hard to edit. ERT further achieves the highest mean score for GPT-6 Astra and Claude Opus 5.5 across all evaluated baselines. We will release our LLM testing framework alongside all tasks, editing trajectories and scores. Project page: https://viscom.uni-ulm.de/wsp\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e已有证明，在某些设置下，大型语言模型可以执行权重空间编程以直接修改神经网络的权重。然而，目前尚不清楚对这些网络进行专门训练如何有助于权重空间编程的成功。我们提出了一个在视觉模型上进行 LLM 驱动权重空间编程的基准，其中五个 LLM 在 Waterbirds、CIFAR-100、PACS 和 Entity-30 的重标记和错误纠正任务上编辑卷积网络和视觉 Transformer。我们报告了超过 2600 个这样的编辑过程，其中每次编辑都在保留图像上根据成功、副作用和准确率损失进行评分。我们将带有标签平滑的标准训练、基于梯度的可编辑训练与我们的 Edit-Ready Training (ERT) 进行了比较，ERT 是一种新颖的方法，它排练 LLM 执行的直接、闭式权重编辑。我们表明，为编辑准备网络可以大幅提高 LLM 编辑的成功率，而在标准网络中这些编辑很难实现。ERT 进一步在所有评估的基线中为 GPT-6 Astra 和 Claude Opus 5.5 实现了最高的平均分。我们将发布我们的 LLM 测试框架以及所有任务、编辑轨迹和分数。项目主页：https://viscom.uni-ulm.de/wsp\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个用于视觉模型的LLM驱动权重空间编程基准，研究专门训练（如ERT）如何提升LLM直接修改神经网络权重的成功率，并在重标记和错误纠正任务上进行评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了视觉模型上LLM驱动权重空间编程的基准，涵盖4个数据集和2种任务。2. 报告了超过2600次编辑过程，并从成功率、副作用和准确率损失三个维度进行评估。3. 提出Edit-Ready Training (ERT) 方法，通过排练LLM执行的直接闭式权重编辑来准备网络。4. ERT在GPT-6 Astra和Claude Opus 5.5上取得了所有评估基线中的最高平均分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了丰富的实验设置和评估维度，证明了专门训练对权重空间编程的积极作用。但摘要未提供ERT方法的具体计算开销、不同LLM之间的详细性能差异、以及该方法在更复杂视觉任务或更大规模模型上的泛化能力等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习 / 模型编辑 / 大语言模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. Accelerating Mixture of Block Attention via Dynamic Routing, KV-Centric Execution and Runtime Pipelining（通过动态路由、以KV为中心的执行和运行时流水线加速块注意力混合）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26268\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26268\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMixture of Block Attention (MoBA) reduces long-context computation by selecting key-value (KV) blocks for each query. FlashMoBA implements MoBA efficiently but retains a fixed Top-k budget and query-centric schedule. Fixed Top-k applies one budget across different score distributions and couples routing to task granularity; query-range ownership fragments K/V reuse when several ranges select the same column. We present LightningMoBA, which co-designs selection and execution through dynamic routing, KV-centric ownership, and runtime pipelining. Dynamic routing thresholds MoBA\u0026#x27;s per-query block scores and directly emits variable-cardinality sparse metadata. KV-centric ownership groups selected rows by (query head, KV block) column, splits high-fanout columns into bounded tasks, and reuses each task\u0026#x27;s loaded KV tile. On Hopper, pipelining overlaps regular K/V transfers and irregular query gathers with Tensor Core computation. Together, these mechanisms decouple retention from GPU scheduling granularity. At matched Top-16 retention across five checkpoints, LightningMoBA accelerates end-to-end generation by 1.20 to 1.60x while raising mean RULER score from 74.42 to 75.28.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e块注意力混合（MoBA）通过为每个查询选择键值（KV）块来减少长上下文计算。FlashMoBA 高效地实现了 MoBA，但保留了固定的 Top-k 预算和以查询为中心的调度。固定的 Top-k 在不同的分数分布上应用单一预算，并将路由与任务粒度耦合；当多个范围选择同一列时，查询范围所有权会碎片化 K/V 重用。我们提出了 LightningMoBA，它通过动态路由、以 KV 为中心的所有权和运行时流水线协同设计选择和执行。动态路由对 MoBA 的每查询块分数进行阈值处理，并直接发出可变基数的稀疏元数据。以 KV 为中心的所有权按（查询头，KV 块）列对选定的行进行分组，将高扇出列拆分为有界任务，并重用每个任务加载的 KV 图块。在 Hopper 上，流水线将常规的 K/V 传输和不规则的查询收集与 Tensor Core 计算重叠。这些机制共同将保留率与 GPU 调度粒度解耦。在五个检查点上匹配 Top-16 保留率的情况下，LightningMoBA 将端到端生成加速了 1.20 到 1.60 倍，同时将平均 RULER 分数从 74.42 提高到 75.28。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出LightningMoBA，通过动态路由、以KV为中心的执行和运行时流水线协同设计，解决现有FlashMoBA中固定Top-k预算和查询中心调度导致的K/V重用碎片化和调度粒度耦合问题，从而加速长上下文计算。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出动态路由，对每查询块分数进行阈值处理并直接发出可变基数稀疏元数据，解耦路由与任务粒度。2. 引入以KV为中心的所有权，按列分组并拆分高扇出列，重用加载的KV图块，解决K/V重用碎片化问题。3. 在Hopper架构上实现运行时流水线，将K/V传输、查询收集与Tensor Core计算重叠。4. 在匹配Top-16保留率下，端到端生成加速1.20至1.60倍，RULER平均分从74.42提升至75.28。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了系统级优化的三个核心机制，并给出了明确的加速比和精度提升数据。但摘要未提供该方法在不同硬件架构（非Hopper）上的表现、内存占用的具体变化、以及在不同上下文长度下的扩展性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机系统 / 深度学习加速 / 注意力机制优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. Learning What Actions Change: Action Effect Matching for Dynamics-Faithful World Models（学习动作改变了什么：用于动态忠实世界模型的动作效果匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25980\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25980\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld models aim to predict environment dynamics under actions, enabling the prediction of action consequences without executing them in the real world. Yet despite producing increasingly realistic videos, current world models often fail to capture how small action changes affect future observations. This limits their use in tasks such as robotic policy evaluation and model-based planning, where nearly identical actions can lead to qualitatively different outcomes. To address this, we propose AFFECT, an auxiliary training objective for learning the distribution of visual changes induced by action perturbations. Specifically, we inject temporally correlated noise into the actions of a policy trained on task-agnostic human teleoperation. We then train the world model so that its generated videos respond to this noise as the recorded videos do, without requiring repeated executions from the same initial state. Across OGBench simulation and real-world DROID and ALOHA-2 setups, AFFECT makes world-model rollouts more faithful to real outcomes. On DROID, the Pearson correlation between policy success rates in the world model and on the real robot rises from 0.47 to 0.79, alongside up to 23% lower FVD. These gains carry over to planning, where selecting actions with AFFECT-trained world models improves task success by up to 8.3%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界模型旨在预测动作下的环境动态，从而无需在真实世界中执行即可预测动作后果。然而，尽管生成了越来越逼真的视频，当前世界模型通常无法捕捉微小的动作变化如何影响未来的观察。这限制了它们在机器人策略评估和基于模型的规划等任务中的使用，在这些任务中，几乎相同的动作可能导致质量上不同的结果。为了解决这个问题，我们提出了 AFFECT，一种用于学习由动作扰动引起的视觉变化分布的辅助训练目标。具体而言，我们将时间相关噪声注入到在任务无关的人类遥操作上训练的策略的动作中。然后我们训练世界模型，使其生成的视频对这种噪声的响应与记录的视频一样，而无需从同一初始状态重复执行。在 OGBench 仿真以及真实世界的 DROID 和 ALOHA-2 设置中，AFFECT 使世界模型的推演更忠实于真实结果。在 DROID 上，世界模型中策略成功率与真实机器人上的皮尔逊相关性从 0.47 上升到 0.79，同时 FVD 降低高达 23%。这些收益延续到了规划中，其中使用 AFFECT 训练的世界模型选择动作可将任务成功率提高高达 8.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出AFFECT辅助训练目标，使世界模型能够准确捕捉微小动作变化对未来观察的影响，解决当前世界模型在动作扰动下动态预测不忠实的问题，以提升机器人策略评估和规划的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出AFFECT辅助训练目标，通过向动作注入时间相关噪声，训练世界模型学习视觉变化分布。2. 无需从同一初始状态重复执行，即可使生成的视频对噪声的响应与真实记录一致。3. 在DROID真实机器人设置中，世界模型与真实机器人的策略成功率皮尔逊相关性从0.47提升至0.79，FVD降低高达23%。4. 在规划任务中，使用AFFECT训练的世界模型可将任务成功率提高高达8.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了AFFECT在提高世界模型动态忠实度方面的有效性，并提供了仿真和真实机器人环境下的具体提升数据。但摘要未提供AFFECT带来的额外训练时间成本、在更复杂或未见过的任务环境中的泛化能力，以及噪声注入策略对不同动作空间的敏感性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 世界模型 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher（AutoMaster：通过使同一模型成为更好的教师来实现自主后训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26510\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26510\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eTask success alone does not specify which behaviors post-training should reinforce. Even successful teacher trajectories can contain unsupported assumptions, unproductive repetition, or superficial verification. We propose Skill-FT (Skill-Guided Fine-Tuning), which uses natural-language skills to suppress undesirable habits and elicit underrepresented effective behaviors during teacher rollouts, then fine-tunes a target model on the resulting trajectories. We introduce AutoMaster, an autonomous post-training system in which an LLM agent develops these interventions through trajectory analysis, skill design, data selection, and feedback from rollouts and target-model evaluation. Across Terminal, Search, and software engineering tasks with 4B and 9B target models, AutoMaster improves mean performance over Vanilla SFT on successful unguided teacher trajectories by 1.42-8.99 percentage points, with the teacher, task pool, training set size, and SFT recipe held fixed. Together with the ablations and trajectory analyses, these results suggest that behavioral shaping can make a fixed model a more effective teacher. We further find that retaining skill instructions during SFT yields higher mean performance than removing them across all six settings, despite their absence at evaluation and identical supervised outputs. These findings suggest that preserving skill context as part of a training demonstration can support better behavioral internalization.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e仅凭任务成功并不能指明后训练应该强化哪些行为。即使是成功的教师轨迹也可能包含未经支持的假设、无效的重复或肤浅的验证。我们提出了 Skill-FT（技能引导微调），它使用自然语言技能在教师推演期间抑制不良习惯并引出代表性不足的有效行为，然后在生成的轨迹上微调目标模型。我们引入了 AutoMaster，这是一个自主后训练系统，其中 LLM 智能体通过轨迹分析、技能设计、数据选择以及来自推演和目标模型评估的反馈来开发这些干预措施。在 Terminal、Search 和软件工程任务中，使用 4B 和 9B 目标模型，AutoMaster 在成功的无引导教师轨迹上比 Vanilla SFT 的平均性能提高了 1.42-8.99 个百分点，同时保持教师、任务池、训练集大小和 SFT 配方不变。结合消融实验和轨迹分析，这些结果表明行为塑造可以使固定模型成为更有效的教师。我们进一步发现，在所有六种设置中，在 SFT 期间保留技能指令比移除它们产生更高的平均性能，尽管在评估时它们不存在且监督输出相同。这些发现表明，将技能上下文作为训练演示的一部分保留下来可以支持更好的行为内化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出AutoMaster自主后训练系统和Skill-FT方法，利用自然语言技能引导教师模型生成高质量轨迹，以抑制不良习惯并引出有效行为，从而在固定教师模型的情况下提升目标模型的后训练效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Skill-FT，利用自然语言技能在教师推演中抑制不良习惯并激发有效行为。2. 引入AutoMaster系统，由LLM智能体自主进行轨迹分析、技能设计、数据选择和反馈迭代。3. 在4B和9B模型上，相比Vanilla SFT，平均性能提升1.42至8.99个百分点，且控制了教师、任务池等变量。4. 发现SFT期间保留技能指令能带来更高的平均性能，有助于行为内化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细说明了AutoMaster的工作机制和显著的实验提升，证明了行为塑造对固定模型作为教师的有效性。但摘要未提供AutoMaster自主设计技能的失败率或计算成本、保留技能指令对推理阶段延迟的影响，以及在更广泛任务类型上的泛化局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型后训练 / 强化学习与模仿学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. On-Policy Morphing into Hybrid Attention Models（混合注意力模型的在线策略转换）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24809\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24809\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHybrid attention models combine full and linear attention to achieve a better quality--efficiency trade-off. Converting pretrained Transformers into such models requires identifying which layers should retain full attention under a prescribed budget. We identify two off-policy mismatches in FlashMorph\u0026#x27;s layer selection: (i) continuous branch interpolation and teacher-forced hidden states differ from discrete hybrid computation; and (ii) frozen model weights fail to account for parameter adaptation during subsequent recovery. We introduce FlashMorph2, an on-policy layer-selection method that (I) evaluates sampled discrete hybrid architectures end to end using their own hidden states, and (II) jointly optimizes layer-selection scores and model weights under the recovery objective to reflect post-adaptation performance. Experiments across Qwen3 model scales and linear-attention variants show that FlashMorph2 consistently outperforms existing layer-selection methods, improving average scores over FlashMorph by +2.42 points on RULER, +1.08 on LongBench, and +0.76 on recall-intensive tasks, while completing layer selection in only 0.72--3.57 GPU hours across 0.6B--8B models, demonstrating high efficiency and scalability.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e混合注意力模型结合了全注意力和线性注意力，以实现更好的质量-效率权衡。将预训练的Transformer转换为这类模型需要在规定的预算下确定哪些层应该保留全注意力。我们发现了FlashMorph层选择中的两个离策略不匹配问题：（i）连续分支插值和教师强制的隐藏状态与离散混合计算不同；（ii）冻结的模型权重未能考虑后续恢复过程中的参数适应。我们引入了FlashMorph2，一种在线策略层选择方法，该方法（I）使用其自身的隐藏状态端到端地评估采样的离散混合架构，并且（II）在恢复目标下联合优化层选择分数和模型权重，以反映适应后的性能。在Qwen3模型规模和线性注意力变体上的实验表明，FlashMorph2始终优于现有的层选择方法，在RULER上的平均得分比FlashMorph提高了+2.42分，在LongBench上提高了+1.08分，在回忆密集型任务上提高了+0.76分，同时在0.6B至8B模型上仅用0.72至3.57个GPU小时就完成了层选择，展示了高效率和可扩展性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在预算限制下，将预训练Transformer转换为混合注意力模型时，确定哪些层应保留全注意力（层选择）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了FlashMorph2，一种在线策略层选择方法，通过端到端评估离散混合架构并联合优化层选择分数与模型权重，解决了FlashMorph中的离策略不匹配问题。在多个模型规模和基准上显著提升了性能，且计算效率极高。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有方法FlashMorph的离策略不匹配问题，并通过在线策略评估和联合优化提出了FlashMorph2。实验证明了其在Qwen3模型和线性注意力变体上的优越性能和高效性。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 模型架构优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. Online Mistake Detection in Instruction-Conditioned Procedural Video（指令条件程序视频中的在线错误检测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25567\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25567\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAn assistant monitoring a person performing a procedure is most useful when it can detect mistakes while there is still time to recover. This requires judging actions against task instructions as the video unfolds, identifying the attempted step, locating it in time, and assessing its execution. Existing online detectors do not use the instruction text, while instruction-conditioned methods operate offline. In this paper, we study online, instruction-conditioned mistake detection in egocentric videos. Using only observed video, task instructions, and prior predictions, our model identifies and localizes completed action attempts and classifies them as correct, modified, slip, corrections, or additions; omitted steps are determined after the video ends. We compare a modular pipeline, with separate step identification, temporal localization, and execution verification, to a joint model that predicts all outputs in a single step. To support supervised learning from mistakes, we repartition EgoPER to include erroneous videos in all splits. The approaches achieve similar step-segmentation F1@0.5 (93.6% and 92.1%), while the joint model achieves higher binary mistake-detection F1@0.5 (84.1% vs. 80.7%), with its largest gain on slips (56.4% vs. 37.5%). Component-level analysis suggests that error propagation between stages contributes to the modular approach\u0026#x27;s lower detection score. On test videos containing mistakes, both designs outperform released AEM and ESTANet checkpoints under our evaluation protocol.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e监控人员执行程序的助手在能够于还有时间恢复时检测到错误时最为有用。这需要在视频展开时根据任务指令判断动作，识别尝试的步骤，在时间上定位它，并评估其执行情况。现有的在线检测器不使用指令文本，而指令条件方法则离线运行。在本文中，我们研究了第一人称视频中的在线、指令条件错误检测。仅使用观察到的视频、任务指令和先前的预测，我们的模型识别并定位已完成的动作尝试，并将它们分类为正确、修改、失误、纠正或添加；省略的步骤在视频结束后确定。我们将具有单独的步骤识别、时间定位和执行验证的模块化管道与在单步中预测所有输出的联合模型进行了比较。为了支持从错误中进行监督学习，我们重新划分了EgoPER，以在所有分割中包含错误视频。这些方法实现了相似的步骤分割F1@0.5（93.6%和92.1%），而联合模型实现了更高的二元错误检测F1@0.5（84.1%对80.7%），其在失误上的增益最大（56.4%对37.5%）。组件级分析表明，阶段之间的错误传播导致了模块化方法较低的错误检测分数。在包含错误的测试视频上，这两种设计在我们的评估协议下均优于发布的AEM和ESTANet检查点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在第一人称视频中，结合任务指令进行在线的错误检测，包括识别、定位和评估动作执行情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了结合任务指令的在线错误检测方法，比较了模块化管道和联合模型。联合模型在二元错误检测（特别是失误检测）上表现更好。重新划分了EgoPER数据集以支持错误监督学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明联合模型由于避免了模块化管道中阶段间的错误传播，在错误检测上优于模块化方法。实验在重新划分的EgoPER数据集上进行。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频理解与动作检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era（重复的批评：大语言模型时代同行评审的声明级同质化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.26286\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.26286\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePeer review relies on several readers finding different problems. We measure critique overlap in conference and journal reviews. At ICLR, measured overlap rose from 12.0% in 2026 to 21.3% in 2027, in reviews from the same stage of the review process, with year-on-year rises at NeurIPS, ICML and the F1000 and PLOS journals. A third ICLR review of a paper added 5.46 new problems to the other two in 2027, against 6.12 in 2026. We apply MELD, a detector of LLM-generated text, to all reviews. Within a paper, two reviews that MELD flags overlap more than two unflagged reviews: by 3.0 points at ICLR in 2024-2025, by 4.5 points in 2026-2027, and by 5.4 points across five journal sources. These results provide evidence that LLM-flagged reviews of one paper are less distinct from each other than unflagged reviews, and suggest that the diversity of critiques among reviews of a single paper is falling.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e同行评审依赖于多个读者发现不同的问题。我们测量了会议和期刊评审中的批评重叠度。在ICLR，在评审过程同一阶段的评审中，测量的重叠度从2026年的12.0%上升到2027年的21.3%，在NeurIPS、ICML以及F1000和PLOS期刊中也出现了同比上升。2027年，一篇论文的第三份ICLR评审为另外两份评审增加了5.46个新问题，而2026年为6.12个。我们将MELD（一种大语言模型生成文本的检测器）应用于所有评审。在同一篇论文中，MELD标记的两份评审的重叠度高于未标记的两份评审：在2024-2025年的ICLR中高出3.0分，在2026-2027年高出4.5分，在五个期刊来源中高出5.4分。这些结果提供了证据，表明同一篇论文的被MELD标记的评审之间的区别小于未标记的评审，并表明单篇论文评审之间批评的多样性正在下降。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e测量和分析会议及期刊同行评审中批评内容的重叠度，特别是大语言模型生成文本对评审多样性的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现ICLR等顶会及期刊的评审重叠度逐年上升。利用MELD检测器发现，被标记为LLM生成的评审之间的重叠度显著高于未被标记的评审，表明LLM的使用正在降低单篇论文评审批评的多样性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过统计数据证明了同行评审同质化的趋势，并建立了LLM生成文本与评审多样性下降之间的关联。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理应用 / 科学文本分析\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. CompoundingKernel: Self-Improving from Zero to First（CompoundingKernel：从零到第一的自我提升）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19230\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19230\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present CompoundingKernel, a self-improving agent system that writes GPU kernels by search. As of 2026-11-11, its generated kernels rank #1 on the public L1, L2 and Quantization boards of SOL-ExecBench (NVIDIA B200). They
