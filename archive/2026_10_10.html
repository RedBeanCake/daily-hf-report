    <h1>前沿科研情报 - 2026-10-10</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. AgentGarten: Code Worlds for Evolving Agents (AgentGarten：用于进化智能体的代码世界)\n- **社区热度**: `👍 130 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12374)\n- **研究任务**: 构建真实、状态一致且实时的交互式虚拟世界，让智能体通过探索和交互进行学习，解决环境保真度与视觉真实感难以兼顾的瓶颈。\n- **核心亮点**: 提出 AgentGarten 框架，将模拟器与游戏引擎结合，通过共享神经渲染器构建实时交互环境；提出“对抗强迫（Adversarial Forcing）”方法训练神经渲染器；智能体通过视觉观察进行交互，并将经验蒸馏为“剧本（playbooks）”供后续智能体继承和进化。\n- **深度解析**: 传统强化学习通常需要数百万次交互，而该方法通过代码定义世界规则并由神经渲染器生成视觉观察，实现了环境与智能体的协同进化。实验表明，智能体仅需 4 轮学习即可获得显著提升，摘要未提供具体对比数字。由于新环境可通过代码编写并通过统一接口渲染，环境的数量和难度可以随智能体能力同步扩展。\n- **领域归类**: [强化学习, 虚拟环境, 智能体, 神经渲染]\n---\n\n### 2. TokenRouter: Efficient Serving System for Token-Level LLM Routing (TokenRouter：面向 Token 级 LLM 路由的高效服务系统)\n- **社区热度**: `👍 99 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12242)\n- **研究任务**: 解决在细粒度 Token 级路由下，现有大语言模型推理服务系统面临的步骤失步、批处理延迟高以及实现复杂等挑战，提升推理效率。\n- **核心亮点**: 提出 TokenRouter 系统，采用“以请求为中心的编程，以模型为中心的执行”原则；为每个 LLM 启动子服务器并异步调度请求；子服务器采用延迟批处理调度器，其最优超参数由系统吞吐量数学模型推导得出。\n- **深度解析**: 现有的粗粒度路由（会话或查询级）已广泛应用，但细粒度的 Token 级路由能带来更大的效率和质量提升。TokenRouter 在多种路由算法、工作负载和模型对上，实现了比现有系统高 2.01 到 64.15 倍的解码吞吐量，大幅推进了 Token 级 LLM 路由的服务效率。\n- **领域归类**: [大语言模型, 推理优化, 分布式系统, 路由算法]\n---\n\n### 3. From Traces to Agentic Worlds: Agentic Language World Models for Interactive Environment Simulation (从轨迹到智能体世界：用于交互式环境模拟的智能体语言世界模型)\n- **社区热度**: `👍 83 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06100)\n- **研究任务**: 在原始系统不可访问或难以复现的情况下，利用历史交互轨迹构建逼真、有状态的交互式环境副本，用于训练和评估 LLM 智能体。\n- **核心亮点**: 提出 Trace2Env 框架，无需学习（learning-free）；将历史轨迹重构为包含环境模式、接地证据（grounded evidence）和诱导行为知识的“世界手册（worldbook）”；运行时，世界模型智能体结合世界手册和持久的情节状态来推断每个动作的观察和持久状态效应。\n- **深度解析**: 在 9 个环境中，Trace2Env 在下一观察保真度和长期交互一致性上优于传统的基于提示的语言世界模型（LWM）。在多轮交互中，针对 Trace2Env 生成的任务智能体动作在真实环境中重放时保持有效的频率更高，表明其模拟动态更好地保留了早期动作的后果。摘要未提供具体指标数字。\n- **领域归类**: [大语言模型, 智能体, 世界模型, 环境模拟]\n---\n\n### 4. SuperNav: An Agentic Navigation System for Any Task in Any Scene (SuperNav：适用于任何场景中任何任务的智能体导航系统)\n- **社区热度**: `👍 61 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12126)\n- **研究任务**: 为通用服务机器人开发导航系统，使其能够在陌生环境中处理多样化的人类请求，结合任务通用性与场景通用性。\n- **核心亮点**: 提出 SuperNav 系统，不对预训练的多模态大语言模型（MLLM）进行导航特定微调，而是为其配备专门的智能体框架（harness）；包含导航技能、物理交互工具、任务进度和上下文管理；通过统一的视觉-点接口（visual-point interface）连接决策与运动。\n- **深度解析**: 核心洞察是让 MLLM 专注于解释请求、理解场景和做决策，而将运动执行委托给导航工具。在实例级、多目标和需求驱动任务上优于 4 个评估基线，摘要未提供具体提升数字。在 HM3D 上的类别级评估和真实四足机器人上的部署证明了其跨环境适用性。\n- **领域归类**: [机器人, 导航系统, 多模态大语言模型, 具身智能]\n---\n\n### 5. Learn2Play Bench: How Well Do LLM Agents Learn from Experience in Unfamiliar Environments? (Learn2Play Bench：LLM 智能体在陌生环境中从经验中学习的能力如何？)\n- **社区热度**: `👍 57 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08215)\n- **研究任务**: 评估 LLM 智能体在陌生和动态环境中从经验中学习的能力，区分通过交互学习新知识与利用预训练知识进行推理。\n- **核心亮点**: 引入 Learn2Play Bench，一个基于新设计的文本游戏的基准测试，游戏规则新颖或反直觉，迫使智能体通过交互获取知识；提供可复现的反馈和自动评分；通过改变游戏实例测试知识迁移。\n- **深度解析**: 揭示了三个发现：(1) 经验保留：保留动作和反馈的完整记录比总结成规则更有效；(2) 人机差距：顶尖人类玩家的峰值分数高于评估的智能体，人类探索更多样化的策略且较少重复动作；(3) 框架（Harness）的重要性：在骨干模型固定的情况下，改变框架可以在降低推理成本的同时提高性能。摘要未提供具体分数或提升百分比。\n- **领域归类**: [大语言模型, 智能体评估, 基准测试, 经验学习]\n---\n\n### 6. MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement (MiMo-V2.6：扩展强化学习以实现自我提升)\n- **社区热度**: `👍 55 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11959)\n- **研究任务**: 通过扩展强化学习（RL）计算，推动大型基础模型向自我提升方向发展，提升模型智能。\n- **核心亮点**: 推出 MiMo-V2.6 系列全模态模型；在 RL 前进行广泛的多模态语料中间训练；从三个维度扩展 RL 计算：(1) 更大批次和更高吞吐量（异步训练，每步 1,568 个样本，2.7-3.7B token，上下文长达 1M）；(2) 更多样复杂的环境（代码、通用、视觉、网络领域）；(3) 更多评分器计算（分组智能体评分）。冻结 MoE 路由并建立多层防御防止奖励黑客（reward hacking）。\n- **深度解析**: 构建了混合任务智能体 RL 的基础设施，包括统一轨迹表示、高并发多框架 rollout、控制与数据平面解耦以及训练推理一致性。开源了训练动态、RL 环境和 RL 框架。摘要未提供具体基准测试得分。\n- **领域归类**: [大语言模型, 强化学习, 模型训练, 全模态模型]\n---\n\n### 7. Multi-Agent Egocentric World Model with Fine-Grained Embodied Interaction (具有细粒度具身交互的多智能体自我中心世界模型)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12299)\n- **研究任务**: 解决多智能体自我中心世界建模问题，使多个智能体能够在共享环境中通过细粒度动作进行交互和同步自我流（ego-stream）生成。\n- **核心亮点**: 提出 ME-World（多智能体自我中心世界模型），在共享 token 序列中联合去噪多个自我流；以所有智能体的目标视角姿态为条件，并以共享环境记忆为基础进行生成；引入共享世界一致性指标（环境、更新和身份一致性）。\n- **深度解析**: 现有的多智能体世界模型多依赖粗糙动作（如移动、相机控制），ME-World 探索了细粒度具身交互，要求跨视角动作一致性、共享环境一致性以及交互引起的状态更新一致性。实验表明，ME-World 在共享世界一致性、动作控制、身份保持和视频质量上优于现有方法。摘要未提供具体指标数字。\n- **领域归类**: [计算机视觉, 世界模型, 多智能体系统, 视频生成]\n---\n\n### 8. In-context Robot Learning Made Simple: A Democratized Recipe for Manipulation Tasks (让上下文机器人学习变得简单：面向操作任务的民主化方案)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38173)\n- **研究任务**: 明确机器人上下文学习（ICL）的问题定义，解决视觉提示中同时传达多种信息导致的歧义，并开发一个极简且可复现的 ICL 框架。\n- **核心亮点**: 提供了机器人 ICL 的清晰问题定义，明确了学习目标；开发了 SimpleICL 框架，包含视觉提示编码器和低成本数据收集协议；无需大规模预训练或专门的数据基础设施，即可在仿真和真实环境中取得强劲表现。\n- **深度解析**: 视觉演示同时传达了动作轨迹、物体语义、操作可供性等多种信息，该研究解决了机器人究竟应该遵循什么信息的根本性提示歧义。广泛实验揭示了机器人 ICL 的几个关键特性，包括动作、语义、组合和可供性辨别能力。摘要未提供具体性能数字或数据集名称。\n- **领域归类**: [机器人, 上下文学习, 操作任务, 具身智能]\n---\n\n### 9. DreamTrue: Action-Faithful Robot World Model with Counterfactual Post-Training (DreamTrue：具有反事实后训练的动作忠实机器人世界模型)\n- **社区热度**: `👍 33 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12468)\n- **研究任务**: 构建多视角、跨具身的机器人世界模型，以实现动作忠实且符合物理规律的视频预测，解决现有数据集中校准不精确和失败交互覆盖不足的问题。\n- **核心亮点**: 将动作轨迹渲染为图像空间条件，并引入离线几何校准；引入反事实后训练（counterfactual post-training），修改记录的动作轨迹以生成更广泛动作和接触配置下的未来视频；构建人工标注的视频数据集训练具身视频奖励模型，指导强化学习后训练。\n- **深度解析**: 在 AgiBot 上，DreamTrue 实现了最先进的动作跟随，并将人工评估的交互缺陷率从 48.12% 降至 6.25%。该模型在 AgiBot World Challenge 2026 世界模型赛道中排名第一，证明了其在物理合理交互结果预测上的有效性。\n- **领域归类**: [机器人, 世界模型, 视频预测, 强化学习]\n---\n\n### 10. OuroWorld: Bringing Any 3D World Alive as Diverse, Endlessly Looping 3D Cinemagraphs (OuroWorld：让任何 3D 世界焕发活力，生成多样化、无限循环的 3D 动态照片)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12461)\n- **研究任务**: 将静态的 3D 高斯溅射（3DGS）场景转化为 3D 动态照片（3D cinemagraph），即具有生动、多样化运动且能从任何视角无缝循环的动态场景。\n- **核心亮点**: 提出无掩码（mask-free）框架 OuroWorld；利用视觉语言模型推断合理动态并引导视频模型合成参考视频；提出“不一致性鲁棒周期 4DGS”，通过傅里叶级数变形场保证循环，通过锚定在参考视角的 Grounded Drift Field 吸收跨视角不一致性。\n- **深度解析**: 该方法不局限于流体状运动，能够捕捉一般变形、物体运动和光照变化。引入了无真实标签（ground-truth-free）的评估方法。在 39 个重建和生成的场景中，OuroWorld 优于所有基线，并在用户研究对比中赢得了 70.8% 到 99.0% 的比较。\n- **领域归类**: [计算机视觉, 3D 生成, 动态场景, 神经渲染]\n---\n\n### 11. TestPrism: Rethinking Test Evaluation Beyond a Single Reference (TestPrism：超越单一参考的测试评估重新思考)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12289)\n- **研究任务**: 评估大语言模型（LLM）代码智能体生成的测试质量，解决仅依赖单一参考解决方案评估测试的局限性。\n- **核心亮点**: 提出TestPrism数据集和主要指标“联合成功函数”（Joint Success Function）；提出TestHelix方法，结合异构合成、同伴交叉验证和递归自我改进（RSI）来提升测试质量。\n- **深度解析**: 传统评估只对比单一参考，会高估测试质量。TestPrism要求生成的测试在初始状态失败，接受所有有效候选，拒绝所有无效候选。在14个基线配置下，联合成功率仅28.00%（单一参考为59.67%）。TestHelix通过异构合成测试和修复对、同伴交叉验证和RSI，在两个模型上比原生比较器提升了8.67到9.00个百分点。\n- **领域归类**: [软件工程, 代码生成, 大语言模型评估]\n---\n\n### 12. MC-Sparse: Deconstructing and Closing the Dense-Sparse Attention Gap in Diffusion Transformers (MC-Sparse：解构并弥合扩散Transformer中稠密与稀疏注意力的差距)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06801)\n- **研究任务**: 降低扩散Transformer在长序列生成任务（如视频和高分辨率3D资产生成）中的延迟，同时保持高稀疏度下的生成质量和保真度。\n- **核心亮点**: 提出Meta-Cached Sparse Attention (MC-Sparse)，一个免训练框架。通过选择单个KV token并将相似query组织成tile对齐组，缓存元数据并在后续去噪步骤中重用。\n- **深度解析**: 现有稀疏注意力在高稀疏度下会降低质量，作者发现退化源于token分组约束、不准确的交互选择以及丢弃token丢失的注意力贡献。MC-Sparse在视频和3D生成模型中实现了比现有基线更高的保真度和更大的去噪加速。在Minimax-H3-Base上实现1.80倍加速，在3D资产生成上实现2.32倍加速，且质量损失可忽略不计。\n- **领域归类**: [计算机视觉, 视频生成, 3D生成, 模型加速]\n---\n\n### 13. Beyond Spatio-Temporal Priors: A Generalizable Approach for Dense Correspondence Matching (超越时空先验：一种可泛化的密集对应匹配方法)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12421)\n- **研究任务**: 在图像编辑和参考引导生成（IEG）等任务中，建立保持身份一致的密集对应匹配，克服传统时空先验（如平滑运动和刚性几何）在这些任务中失效的问题。\n- **核心亮点**: 提出FreeMatching框架，结合生成和语义基础表示，以及来自经典数据集、跟踪视频和合成场景的异构监督；引入教师引导的迭代细化。\n- **深度解析**: 传统先验在IEG中会打破物理连续性但保留视觉身份。FreeMatching利用教师引导迭代细化，无需密集对应标注即可改善IEG中的对应。单个模型在具有挑战性的IEG图像对上显著提升对应质量，同时在经典基准上保持竞争力，还可作为评估身份保持的定量指标，得分与人类判断相关。摘要未提供具体的定量实验数字。\n- **领域归类**: [计算机视觉, 图像编辑, 密集对应匹配]\n---\n\n### 14. U-Space: Uncovering When and Why Uncertainty Arises in Language Models (U-Space：揭示语言模型中不确定性产生的时间与原因)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09087)\n- **研究任务**: 量化和解释大语言模型在推理过程中产生的不确定性，解决现有方法需要重复生成或单独训练组件，且标量估计无法揭示不确定性来源和演变的问题。\n- **核心亮点**: 引入U-Space，一个低维子空间，使模型不断演变的不确定性可测量和可解释。识别怀疑和确定的语义锚点，映射其反嵌入方向到残差空间，组合成正交基。U-Lens将每个token状态投影到这些基向量上，生成可解释的token级不确定性图。\n- **深度解析**: 现有不确定性量化方法存在局限，且生成长度与不确定性估计强相关。U-Space基于机制可解释性，无需正确性标签、重复生成或训练。在推理基准测试中，其置信度得分在标准和长度控制评估下均优于现有基线，且比监督估计器转移更可靠。摘要未提供具体的定量实验数字。\n- **领域归类**: [自然语言处理, 大语言模型, 不确定性量化, 机制可解释性]\n---\n\n### 15. Post-Training Frontier Text-to-Image Models by Composing Preference and Rubric Rewards (通过组合偏好和规则奖励对前沿文本到图像模型进行后训练)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02967)\n- **研究任务**: 解决开放域文本到图像生成模型后训练中，单一奖励信号无法捕捉人类偏好全貌的挑战。\n- **核心亮点**: 开发了一种基于互补奖励信号组合的简单有效后训练方法。奖励系统包括偏好奖励和基于规则的奖励。提出了一种简单的奖励组合策略来平衡偏好优化和规则满足。\n- **深度解析**: 简单的加权平均会导致次优优化。在Arena文本到图像排行榜中，RL训练的Flux2dev的Elo评分比基础模型高69分，后训练的Ideogram-4以1223.5的Elo超越所有开源模型。发布了Arena-T2I-Training（1K子集）以支持可重复研究。\n- **领域归类**: [计算机视觉, 文本到图像生成, 强化学习, 模型后训练]\n---\n\n### 16. Memento 3: Model-Based Recursive Self-Improvement through Reflective Rulebooks (Memento 3：通过反思规则手册实现基于模型的递归自我改进)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11794)\n- **研究任务**: 使冻结的LLM智能体能够通过外部记忆持续学习显式的世界模型，在陌生环境中推断世界运作方式并根据新证据修改理解。\n- **核心亮点**: 智能体维护一个自然语言规则手册作为持久语义记忆，记录可修改的环境动态假设。将其编译为可执行代码进行预测和规划。通过观察、反思、规则修改、编译和验证的持续循环，利用预测误差改进规则手册和代码。\n- **深度解析**: 更新代码仅在LLM判断其忠实于规则手册且单元格精确重放重现观察到的转换时才被接受。在ARC-AGI-3上，单模型智能体清除了所有25个公开游戏的所有关卡，平均相对人类动作效率（RHAE）为100.0，使用人类动作计数的44%。在Atari Pong案例研究中，学习的反馈控制器在三集不同开局的评估中均以21:0获胜。\n- **领域归类**: [人工智能, 智能体, 强化学习, 世界模型]\n---\n\n### 17. SparseDecoding: Decoding-Aware Pruning for Accurate and Efficient LLM Inference (SparseDecoding：面向准确高效LLM推理的解码感知剪枝)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12327)\n- **研究任务**: 解决大语言模型推理解码阶段因内存受限导致的显著延迟问题，特别是现有基于Hessian的无训练剪枝方法在解码时因分布偏移导致性能下降，以及对SpMV（稀疏矩阵向量乘法）支持有限的问题。\n- **核心亮点**: 提出SparseDecoding，一个专为准确高效LLM解码定制的解码感知剪枝框架。算法上，从密集模型自回归生成期间收集的逐层激活构建校准矩阵；系统上，开发了带有位掩码索引和固定步长遍历的优化N:M稀疏矩阵向量内核。\n- **深度解析**: 现有方法用自然序列计算Hessian，而解码时模型输入自生成token，导致分布偏移。SparseDecoding对齐了剪枝目标与解码激活。在Llama-3.1-8B、Llama-3.3-70B、Qwen3-14B/32B等模型上的实验表明，在长文本生成基准上持续优于标准固定文本校准，并在A100 GPU上实现高达1.48倍的端到端挂钟解码加速。\n- **领域归类**: [自然语言处理, 大语言模型, 模型压缩, 推理加速]\n---\n\n### 18. LEGO: A Lifting-Free Approach for Exocentric-to-Egocentric Video Generation (LEGO：一种无提升的异中心到自中心视频生成方法)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12442)\n- **研究任务**: 从单个异中心（exocentric）录像生成自中心（egocentric）视频，解决两个相机重叠少且目标视角大部分未观察到的新视角合成挑战。\n- **核心亮点**: 提出一种无提升（lifting-free）方法：使用学习到的视角合成器（LVSM风格的transformer），微调后直接渲染自中心视角，无需深度、点云或重投影，在内部解决跨视角对应。\n- **深度解析**: 当前SOTA方法通过估计深度、提升为点云并重渲染来显式重建场景，这会将深度误差转化为错位内容。LEGO的概率映射根据学习到的对应分布对每个区域在候选源位置上求平均，保留结构而平均掉精细纹理。这种权衡适合扩散生成器。分布的集中度还产生每区域置信度，用于掩码低置信度区域并引导生成器。该方法一致优于显式管线且无需重新训练即可泛化。摘要未提供具体的定量实验数字。\n- **领域归类**: [计算机视觉, 视频生成, 新视角合成]\n---\n\n### 19. OneSearch-VL: Unified Multimodal Deep Research Agent for Image and Video (OneSearch-VL：面向图像和视频的统一多模态深度研究智能体)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12419)\n- **研究任务**: 解决单图像、多图像和视频深度研究中，需要保留局部视觉锚点、实体关系、来源支持的事实和产生答案的操作之间依赖关系的挑战。\n- **核心亮点**: 引入以视觉基础证据图（VGEG）为中心的统一智能体，将依赖关系编码为共享的任务级参考。基于VGEG的数据引擎构建问题并过滤专家轨迹。推导证据感知视觉基础规则奖励（EVGR）监督RL。构建OneSearch-MI-Bench和OneSearch-Video-Bench进行评估。\n- **深度解析**: 使用OneSearch-VL-SFT-110K和OneSearch-VL-RL-10K进行训练。OneSearch-VL-8B在两个新基准上比带有工具访问的Qwen3-VL-8B分别提升了20.2和17.6个百分点，同时在7个图像基准和VideoDR上也取得了显著提升。\n- **领域归类**: [多模态, 智能体, 视觉问答, 深度研究]\n---\n\n### 20. Reasoning-Informed Visual Editing (推理驱动的视觉编辑)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12343)\n- **研究任务**: 解决大型多模态模型（LMMs）在视觉编辑中面临的挑战，特别是在遵循复杂指令、保持外观一致性和支持灵活输入格式方面。\n- **核心亮点**: 引入RISEBench及更全面的RISEBench++，首个评估推理驱动视觉编辑（RISE）的基准。将分类法扩展为包含时间、因果、空间、逻辑、反事实推理及混合推理的层次方案。引入RISE-Agent，一个免训练的智能体框架。\n- **深度解析**: RISEBench++包含6个推理维度、12个子类和65种细粒度任务类型。扩展到1000个人工标注测试用例（中英双语）。评估了58种视觉编辑方法（34个开源、19个闭源、5个智能体方法），最强方法GPT-Image-2.5 Sunburst准确率仅为56.6%。RISE-Agent在多种RISE任务中优于大多数现有方法。\n- **领域归类**: [计算机视觉, 多模态, 视觉编辑, 基准测试]\n---\n\n### 21. Foundations of Large Language Models (大语言模型基础)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2501.09223)\n- **研究任务**: 介绍和梳理大语言模型的基础概念与核心知识体系。\n- **核心亮点**: 本书主要关注基础概念而非全面覆盖所有前沿技术。全书分为六个主要章节，分别探讨预训练、生成模型、提示工程、对齐、推理（inference）和推理（reasoning）。\n- **深度解析**: 该书面向高校学生、自然语言处理及相关领域的专业人士和从业者，也可作为任何对大语言模型感兴趣的人的参考书。关于具体的实验结果、数字、数据集或技术细节，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 教育/书籍]\n---\n\n### 22. What Did the Agent Actually Do? Evidence-Grounded Oversight for Long-Horizon Agents (智能体究竟做了什么？面向长程智能体的基于证据的监督)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06406)\n- **研究任务**: 研究如何监控长程智能体，识别其具有重大影响的决策并定位相关证据，以帮助用户评估其影响并进行有效监督。\n- **核心亮点**: 提出了AgentMonBench基准测试，涵盖需求与行为对齐、对重大自主决策的认知两个维度。提出了基于证据的行为图（EBG），这是一种无需训练的方法，将带有来源链接的证据分组为行为并组织成图，帮助监控器在上下文中解释行为。\n- **深度解析**: 在8个模型上的实验表明，与直接访问原始上下文相比，EBG在大多数设置下提高了决策识别和证据定位的能力，且其增益在输入规模和超参数设置上具有持续性。关于具体的准确率数字或评估指标，摘要未提供。\n- **领域归类**: [智能体, 软件工程, 模型评估]\n---\n\n### 23. SparseEngine: Sparse-First Inference Engine (SparseEngine：稀疏优先推理引擎)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39068)\n- **研究任务**: 解决长上下文大语言模型智能体在KV缓存内存和注意力计算上面临的压力，提供一个从头构建的稀疏优先推理引擎。\n- **核心亮点**: 提出SparseEngine，通过共享生命周期契约，让每种方法控制其KV表示和计算，同时与通用服务基础设施协调状态转换。支持4个类别的15种方法，并通过Chain Cache和可控的前缀缓存剪枝实现跨请求状态管理。\n- **深度解析**: 在保持方法质量的同时，SparseEngine在使用KV驱逐时实现了超过10倍的吞吐量提升，在匹配并发下比vLLM解码速度快2.5倍以上，在智能体基准测试上实现了超过2倍的端到端加速。关于具体的基准测试名称，摘要未提供。\n- **领域归类**: [大语言模型, 推理加速, 系统优化]\n---\n\n### 24. VibeEdit: Image Editing with Canvas Instructions (VibeEdit：基于画布指令的图像编辑)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12229)\n- **研究任务**: 解决文本引导图像编辑中，当多个对象外观相似时，识别目标对象或区域繁琐的问题，提出一种新的图像编辑接口和方法。\n- **核心亮点**: 引入了一种新接口，允许用户直接在图像上放置空间标记和简短注释形成“画布指令”。VibeEdit无需单独的文本提示即可执行对象添加、删除、替换等操作。构建了155万个带有对象掩码的编辑对，采用层解耦条件编码、区域加权监督微调及基于评分标准的强化学习。\n- **深度解析**: 在包含419个案例的人工构建基准上评估，VibeEdit的VLM评分标准得分为79.9，区域外PSNR为32.8 dB，显著优于得分最高的文本指令基线FireRed（67.4和24.0 dB）。关于具体的模型参数量或训练细节，摘要未提供。\n- **领域归类**: [计算机视觉, 图像编辑, 多模态]\n---\n\n### 25. USDCraft: Geometrically Grounded Programmatic Modeling of Articulated 3D Assets for Simulation (USDCraft：面向仿真的基于几何的程序化关节3D资产建模)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11322)\n- **研究任务**: 解决真实到仿真机器人操作中，当真实世界对象不在训练分布内或网格不完整时，关节3D资产部署困难的问题。\n- **核心亮点**: 将关节资产重建公式化为基于部分几何证据的程序化建模。提出USDCraft框架，利用预训练LLM编写和修改可执行代码，无需特定任务训练即可生成仿真就绪的关节资产。提出源几何分析和迭代几何重查机制。\n- **深度解析**: 视觉反馈和物理创作指导完善了建模过程，生成具有显式物理属性的关节USD资产，可直接加载到Isaac Sim中。实验证明了其在两个基准测试上领先的关节恢复能力及在真实-仿真-真实操作中的有效性。关于具体的成功率数字或基准名称，摘要未提供。\n- **领域归类**: [机器人学, 3D视觉, 仿真]\n---\n\n### 26. OmniCapBench: A Deep-Structured Evaluation Framework for Fine-Grained Audio-Visual Captioning (OmniCapBench：面向细粒度音视频字幕的深度结构化评估框架)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12458)\n- **研究任务**: 解决现有多模态大语言模型音视频字幕评估基准中，整体评分缺乏定位、局部探测缺乏覆盖以及无约束LLM评判引入不稳定性的问题。\n- **核心亮点**: 提出OmniCapBench，将预测目标从自由文本转向包含实体引用、视觉镜头和音频事件三个轨道的原子、可验证评估单元集合。包含786个密集标注的视频，支持确定性约束检查和局部LLM语义比较。\n- **深度解析**: 该框架能够有效区分MLLM的感知错误，包括时间定位失败、身份漂移、跨模态错位和幻觉描述。评估揭示了前沿MLLM强大的局部感知能力但较弱的长程音视频推理能力。关于具体的模型得分或排名，摘要未提供。\n- **领域归类**: [多模态, 模型评估, 音视频理解]\n---\n\n### 27. SanSi: A Looped Typed Decision Model for System 1.5 Thinking (SanSi：面向系统1.5思考的循环类型决策模型)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07730)\n- **研究任务**: 研究在单次前向传播（系统1）和生成式推理之间的一种中间思考方式，即“系统1.5思考”，通过循环递归应用相同层来修正隐藏状态而不生成文本。\n- **核心亮点**: 提出SanSi，将预训练的循环语言模型转化为类型决策模型。在每个循环后读取选项概率，并使用适当的评分规则训练每个循环，使得单个模型在单次运行中可服务于从1个循环到8个循环的任意计算预算。\n- **深度解析**: 在来自59个来源的10,027个测试决策上，SanSi达到72.0%的准确率，比同形状非循环模型高13.5个百分点，比同尺寸较新非循环模型高5.3个百分点。作为强化学习策略优化的评判器时，使生成器的F1提高了7.7个百分点。关于具体的模型名称，摘要未提供。\n- **领域归类**: [大语言模型, 推理优化, 强化学习]\n---\n\n### 28. Embodied Turing Machines: Stateful Code for Robot Recursive Self-Improvement (具身图灵机：用于机器人递归自我改进的状态化代码)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12369)\n- **研究任务**: 提出一种不同于传统VLA或Agent Harness的机器人控制新范式，将具身世界视为具身图灵机，完全通过代码进行决策。\n- **核心亮点**: 提出“仅代码即策略”（COAP）：代码从相机图像和本体感觉中测量和跟踪状态，并完全基于此做出所有决策。具有显式状态、可控执行和可扩展性三大优势，适合作为递归自我改进（RSI）的媒介。\n- **深度解析**: 在RoboDojo的42个双臂任务上，生成的库在测试时无需模型即可达到70.24%的成功率。COAP还可作为VLA和Agent Harness的高效数据引擎。关于具体的基线对比数据，摘要未提供。\n- **领域归类**: [机器人学, 具身智能, 代码生成]\n---\n\n### 29. ViSkill: Reinforcing VLM Agents with Evolving Visual-Native Skills (ViSkill：使用进化视觉原生技能强化VLM智能体)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12403)\n- **研究任务**: 解决现有技能增强智能体方法过度依赖文本导致丢失关键几何结构，以及技能构建与策略优化分离的问题。\n- **核心亮点**: 提出ViSkill，一种视觉原生技能学习框架，将成功的交互编码为VLM智能体可直接访问的复合视觉技能卡。检索到的技能指导推理和奖励塑造，成功轨迹被蒸馏回库中，形成技能积累与策略提升相互强化的闭环。\n- **深度解析**: 在Sokoban、FrozenLake和PrimitiveSkill上评估，ViSkill总体成功率为0.89，使用冷启动初始化后升至0.91，优于所有评估的基线，且收敛速度快于标准PPO。关于具体的基线名称，摘要未提供。\n- **领域归类**: [智能体, 强化学习, 视觉语言模型]\n---\n\n### 30. V-CoLA: Vision Token Compression with Linear Attention (V-CoLA：基于线性注意力的视觉Token压缩)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11251)\n- **研究任务**: 解决视觉语言模型中视觉token主导输入序列导致的计算开销问题，特别是针对包含线性注意力的混合架构，现有压缩方法难以泛化的问题。\n- **核心亮点**: 提出V-CoLA，一种专为线性注意力设计的高效免训练token压缩框架。引入了感知唯一性重要性标准来识别关键视觉token，并结合自适应token合并策略。所有组件在实现层面进行了优化，以兼容线性注意力的分块并行性。\n- **深度解析**: 实验表明，V-CoLA仅使用50.0%的视觉token即可达到原始性能的99.5%，使用12.5%的token也能达到88.0%以上的性能，同时提供1.86倍至6.15倍的预填充加速。关于具体的基准测试名称，摘要未提供。\n- **领域归类**: [多模态, 推理加速, 视觉语言模型]\n---\n\n### 31. ReSPO: Reshaped Sequence Policy Optimization for Gradient Starvation in Off-Policy Learning (ReSPO：针对离线策略学习中梯度饥饿问题的重塑序列策略优化)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35433)\n- **研究任务**: 解决可验证奖励强化学习（RLVR）中由于重用 rollout 导致当前策略与数据生成策略不匹配，进而引发的“梯度饥饿”问题。\n- **核心亮点**: 提出 ReSPO（重塑序列策略优化），用基于 α-散度变分目标和指数方差控制倾斜的平滑双分支序列级核替换了传统的裁剪（clipping）操作。正分支保留未充分生成的正响应的非零梯度权重，负分支抑制严重过度生成的负响应。\n- **深度解析**: 实验表明，ReSPO 能有效从长正推理轨迹中学习，加速早期优化，提高最终训练分数和保留基准性能。摘要未提供具体的实验数字和数据集细节，仅提及在密集和 MoE Qwen3 模型上进行了验证。\n- **领域归类**: [强化学习, 大语言模型, 策略优化]\n---\n\n### 32. Do LLMs Understand Sequential Structure? A Controlled Study of Inference and Generation (大语言模型理解序列结构吗？推理与生成的对照研究)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04977)\n- **研究任务**: 探究大语言模型（LLMs）是否能恢复潜在的序列结构，而不仅仅是表面的动作频率，特别是在行为模拟中。\n- **核心亮点**: 通过受控的双人石头剪刀布交互和单人随机 n-gram 续写任务进行测试。研究框架将分布匹配与条件规则遵循分离开来，以评估模型识别潜在策略、遵循简单马尔可夫规则以及维持高阶条件依赖的能力。\n- **深度解析**: 结果表明，更长的上下文并不能提高识别能力，正确的识别并不能确保忠实的模拟，且高阶依赖关系会显著降低规则恢复能力。表面上的行为保真度可能掩盖了错误的生成机制。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [大语言模型, 认知与行为分析, 序列建模]\n---\n\n### 33. From Prompting to Composing: A Spatial Canvas Interface for Poster Generation (从提示到组合：用于海报生成的空间画布界面)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12230)\n- **研究任务**: 解决海报生成中用户需要将二维构图意图编码为一维文本提示的间接交互问题。\n- **核心亮点**: 引入“空间画布界面”，允许用户通过语义、身份、文本和像素四种互补的绑定类型在空间中直接组合生成意图。开发了 Compo 模型，支持用户显式构建画布的直接推理模式，以及将高级请求自动转化为画布的代理模式。\n- **深度解析**: 提出了一种可扩展的管道，自动构建不同绑定类型及其组合的监督数据。引入了评估绑定类型及联合组合依从性的基准。实验表明 Compo 在组合可控性和视觉质量上优于通用图像生成模型和专用海报生成系统。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [计算机视觉, 图像生成, 人机交互]\n---\n\n### 34. SpaceCast-Bench: Evaluating Predictive Spatial Reasoning in Vision-Language Models (SpaceCast-Bench：评估视觉语言模型中的预测性空间推理)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12402)\n- **研究任务**: 评估视觉语言模型（VLMs）的预测性空间推理能力，即从观察中构建场景、预测干预如何改变场景并推理未见结果的能力。\n- **核心亮点**: 提出首个直接评估该能力的基准 SpaceCast-Bench，包含 182 个真实场景的 3,862 个问题，涵盖 16 种任务类型和 3 个级别（静态感知、局部预测、全局预测），逐步要求场景理解、空间状态更新和关系推理。\n- **深度解析**: 评估 21 个模型发现，最强模型准确率仅为 58.0%，远低于人类的 87.2%，空间专用模型接近随机。分析表明桥接视图对整合分布式观察至关重要，显式 3D 证据比生成的结果图像或视频更可靠。在程序生成数据上微调 Qwen3-VL-4B 可将其准确率从 34.0% 提升至 65.7%。\n- **领域归类**: [视觉语言模型, 空间推理, 基准测试]\n---\n\n### 35. SpatialOPSD: Self-Distilling Spatial Intelligence from Verified Coding Agent Traces (SpatialOPSD：从验证过的代码智能体轨迹中自蒸馏空间智能)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11366)\n- **研究任务**: 解决空间代码智能体在推理时开销巨大且依赖外部工具的问题，探索多模态大语言模型（MLLM）能否内化这种智能体能力以实现完全无工具运行。\n- **核心亮点**: 提出 SpatialOPSD，一种在策略自蒸馏框架，将验证过的智能体轨迹作为特权信息内化到独立的 MLLM 中。引入“重复感知蒸馏”（结合重复掩码和似然正则化）以缓解特权信息泄露。\n- **深度解析**: 在多个基准测试上的实验表明，自蒸馏的 SpatialOPSD 在空间和分布外（OOD）数据集上的平均准确率均高于 SFT 和 GRPO，展现出优越的性能和泛化能力。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [多模态大语言模型, 空间推理, 知识蒸馏]\n---\n\n### 36. Retrieval-Centric Deep Learning in Growing Nonparametric Neural Networks (增长型非参数神经网络中的检索中心深度学习)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03858)\n- **研究任务**: 探索一种通用的深度学习层，在训练时为每个数据点存储键值表示对，并在推理时通过注意力机制检索和重组，从而形成一个不断增长的神经网络。\n- **核心亮点**: 建立了基于函数梯度的核化注意力层学习规则（基于 RBF 和类似 softmax 的核），确立了“检索中心深度学习”（RCDL）范式，解决了将线性注意力学习规则直接应用于高级核时无法进行原则性优化的问题。\n- **深度解析**: 在图像分类和合成师生学习任务上展示了 RCDL 的性能和学习效率。此外，将双形式神经网络中的线性注意力替换为高级变体（MesaNet/DeltaNet），与常规固定大小神经网络最近提出的优化器建立了形式上的联系。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [深度学习理论, 非参数模型, 注意力机制]\n---\n\n### 37. Chaos in the Text: Revealing the Modality Preference in Mixed-Modality Retrievers (文本中的混沌：揭示混合模态检索器中的模态偏好)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11816)\n- **研究任务**: 系统考察密集检索器在包含文本、图像及融合图文文档的混合语料库中的表现，解决其对模态组合高度敏感的问题。\n- **核心亮点**: 发现检索性能随图像文档被语义对应的文本表示替换而呈现明显的 V 型曲线，无关文本比无关图像导致更严重的性能下降（称为“文本中的混沌”）。提出 Trident 方法，构建文本、图像和融合视图作为同等正例进行联合优化。\n- **深度解析**: 分析揭示了“模态偏好”现象，即文本表示获得系统上更高的相似度分数，导致无关文本排名高于相关图像。Trident 在基于 CLIP 和 VLM 的架构上均提升了混合模态检索性能，降低了对模态组合和文本干扰的敏感性。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [信息检索, 多模态学习, 密集检索]\n---\n\n### 38. A Closer Look at Agentic BBO: Benchmarking LLM Agents for Black-Box Optimization (深入探讨智能体黑盒优化：大语言模型智能体黑盒优化基准测试)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12183)\n- **研究任务**: 解决现有智能体黑盒优化（BBO）研究因任务域和系统配置不同导致结果难以比较的问题，提供一个跨领域的统一基准。\n- **核心亮点**: 引入 AgenticBBO-Bench，涵盖合成函数、超参数优化、数据库调优、芯片设计和分子设计五个领域，采用统一的有限预算评估协议。\n- **深度解析**: 实验表明，智能体 BBO 在所有五个领域的家族平均得分均高于直接基于 LLM 的方法，并在四个领域优于最佳数值优化器。研究发现额外的数值工具并不能一致地提升性能，任务语义广泛有用但特定先验不太可靠。在五项任务前沿挑战中，GPT-6 Astra 和 DeepSeek-V4.1-Flash 在性能和成本的帕累托前沿上表现突出。摘要未提供具体的实验数字和数据集细节。\n- **领域归类**: [大语言模型智能体, 黑盒优化, 基准测试]\n---\n\n### 39. REMORY: Learning Residual Memory for Context Compaction (REMORY：学习用于上下文压缩的残差记忆)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11287)\n- **研究任务**: 解决长视野智能体在有限上下文窗口中压缩历史时，仅靠文本摘要可能无法支持后续所有决策的问题。\n- **核心亮点**: 引入 REMORY，一种神经记忆网络，通过生成有界的软记忆 token 序列来补充摘要。这些 token 以摘要为条件并附加在其后，形成序列维度上的残差连接类比，帮助冻结的 LLM 近似使用完整历史时产生的延续。\n- **深度解析**: 在 SummHay 上，REMORY 在洞察覆盖率几乎不变的情况下提高了来源归因，并仅使用 5.2% 的输入位置就接近了全上下文的联合得分。在长视野智能体基准上，Qwen3.8-27B 和 GLM-5.3-Flash 表现出一致的增益，并在 BrowseComp 和 Terminal-Bench 2.1 上大幅减少了重复的工具输出和工具错误。\n- **领域归类**: [大语言模型, 上下文压缩, 智能体]\n---\n\n### 40. WorldGuide: Goal-Directed Video World Model for Procedural Task Execution (WorldGuide：用于程序化任务执行的目标导向视频世界模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12459)\n- **研究任务**: 解决长视野程序化任务中视频生成需要适应实际生成状态的问题，填补决定动作与成功实现动作之间的差距。\n- **核心亮点**: 将程序化视频生成转化为视觉世界空间中的闭环任务执行，提出 WorldGuide。给定初始图像和目标，预测原子动作、生成视频片段，并利用生成结果选择下一动作或终止。引入 WorldGuide Bench（约 59K 步级注释视频，涵盖 245 个任务和 27 个程序化类别）。\n- **深度解析**: Planner 和 Executor 在相同的步级程序化演示上训练。WorldGuide 在 WorldGuide-Bench 上达到 33.33% 的任务成功率（MiniMax-H3 为 29.90%），在 VideoCraft-Bench 上达到 47.69%（MiniMax-H3 为 32.73%），证明了将规划与学习到的执行相结合对于目标导向程序化视频生成的重要性。\n- **领域归类**: [视频生成, 世界模型, 闭环控制]\n---\n\n### 41. Synthesis Through Simulation: Generating Coherent Enterprise Data via Scalable Agent-System Interaction (通过模拟进行合成：通过可扩展的智能体-系统交互生成连贯的企业数据)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10549)\n- **研究任务**: 解决企业AI中工具调用智能体在大规模训练和评估时，因商业和法律限制导致的企业系统、数据和数据库模式不可用的问题，提出一种替代的表格数据合成方法。\n- **核心亮点**: 提出“通过模拟合成”（STS）范式，利用LLM智能体在模拟企业环境中执行操作生成数据，保证结构有效性；提出通用填充器（GP），在无数据库模式访问的情况下实现0.88的平均边缘保真度和100%的约束满足。\n- **深度解析**: 摘要未提供关于该框架在具体企业系统中的部署延迟或更复杂的业务逻辑处理细节。但其核心逻辑在于将“结构有效性”与“分布建模”解耦，通过模拟环境本身来保证数据合法性，从而绕开了传统数据合成中高度依赖数据库模式（schema）的痛点。\n- **领域归类**: [数据合成, 智能体, 企业AI]\n---\n\n### 42. Can AI Agents Make Open-Ended Scientific Discovery? Evidence from Station (AI智能体能进行开放式科学发现吗？来自Station的证据)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08927)\n- **研究任务**: 探究AI系统是否能够在缺乏明确指标的情况下，自主进行开放式的科学发现任务。\n- **核心亮点**: 在开放世界环境Station中引入Supervisor机制和周期性Meta Reflection机制，鼓励持续探索；在基于ICLR论文构建的任务中，Station平均重新发现62.7%的原始研究标准，显著优于基线模型。\n- **深度解析**: 摘要未提供关于Station环境中智能体具体交互协议或Meta Reflection机制的底层实现细节。但其研究意义在于证明了在缺乏明确中间指标的情况下，通过引入监督与反思机制，AI智能体能够在开放世界中自主探索并取得接近人类研究者的科学发现。\n- **领域归类**: [科学发现, 智能体, 开放世界环境]\n---\n\n### 43. One Block, Multiple Depths: Recurrent Vision Transformers with Depth-Programmed Experts (一个模块，多种深度：具有深度编程专家的循环视觉Transformer)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12448)\n- **研究任务**: 探索如何在不增加推理计算量（FLOPs）和中间特征蒸馏的情况下，使用单个循环应用的Transformer模块匹配全深度视觉编码器的准确率。\n- **核心亮点**: 提出reViT，将每个循环深度的前馈网络（FFN）表示为小型共享专家库的凸组合，通过连续的归一化深度坐标进行编程；在ImageNet-1k和DINOv2蒸馏中，reViT-B/16在存储参数减少约70%的情况下达到DeiT III的精度。\n- **深度解析**: 摘要未提供关于该模型在更高分辨率图像或更复杂视觉任务上的具体表现数字。但其核心创新在于通过“权重空间合并”和“弹性深度训练”，打破了传统Transformer深度与参数量的强绑定，为视觉模型的轻量化和灵活部署提供了新思路。\n- **领域归类**: [计算机视觉, 视觉Transformer, 模型压缩]\n---\n\n### 44. SpaceFlow: Locally Controllable 3D Generation (SpaceFlow：局部可控的3D生成)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12399)\n- **研究任务**: 解决当前3D生成方法缺乏显式局部控制的问题，实现从文本描述和几何图元集合中进行局部可控的3D生成。\n- **核心亮点**: 提出无需训练的SpaceFlow流程，利用几何图元作为对象部分的代理并分配局部控制级别；在生成流过程中强制执行空间约束，并在外观合成时限制跨部分泄漏，实现高控制区域的几何保真度和低控制区域的合理形状变化。\n- **深度解析**: 摘要未提供关于该流程在处理极度复杂拓扑结构时的具体成功率或渲染时间等技术细节。但其巧妙之处在于利用“无需训练”的生成流和图元代理，将全局控制转化为局部控制，有效解决了3D生成中“牵一发而动全身”的几何与外观冲突问题。\n- **领域归类**: [3D生成, 计算机视觉, 可控生成]\n---\n\n### 45. Accurate but Not Humble: Evaluating Epistemic Humility in LLM Agents under Knowledge Conflict (准确但不谦逊：评估知识冲突下LLM智能体的认知谦逊)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12360)\n- **研究任务**: 评估大语言模型智能体在面临知识冲突（参数化知识与检索证据矛盾，或上下文来源不一致）时，识别、处理并沟通不确定性的“认知谦逊”能力。\n- **核心亮点**: 提出通过识别（Identify）、解决（Solve）和上报（Escalate）三个轨迹级行为维度来操作化认知谦逊；发现高任务准确率并不必然意味着更高的认知谦逊，且模型级干预虽能提升认知谦逊，但往往以牺牲任务准确率为代价。\n- **深度解析**: 摘要未提供关于所评估的四种智能体的具体名称或知识冲突数据集的详细规模数字。但其深刻揭示了当前LLM智能体的一个关键盲区：高准确率往往掩盖了模型在面临矛盾信息时的“盲目自信”，认知谦逊实际上是模型、框架与环境共同作用的涌现属性。\n- **领域归类**: [大语言模型, 智能体评估, 认知谦逊]\n---\n\n### 46. Scaling to Tens of Thousands of Test-Time Iterations with Loop-Native Attention Residuals (利用循环原生注意力残差扩展至数万次测试时迭代)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11570)\n- **研究任务**: 解决循环Transformer在增加循环迭代次数时，因噪声状态更新覆盖正确中间推论而导致推理准确率下降的问题，支持大规模的测试时迭代。\n- **核心亮点**: 提出InfiLoop（循环原生残差连接），结合基于内容的加权和学习的时序衰减来维护循环状态的运行摘要；一个7M参数的InfiLoop模型在Sudoku-Extreme上达到97.9%的精确准确率，并在超过20,000次有效步骤的测试时循环中持续提升。\n- **深度解析**: 摘要未提供关于InfiLoop在除数独和ARC-AGI-2之外的其他推理任务上的具体准确率数字。但其核心突破在于通过“循环原生残差连接”解决了长程传播中的误差累积问题，证明了在测试时增加推理深度可以直接转化为推理能力的实质性提升。\n- **领域归类**: [推理模型, Transformer架构, 测试时计算]\n---\n\n### 47. Frozen Models, Evolving Expertise: Model-Agnostic Learning from Deployment Experience for Multimodal Medical AI (冻结的模型，演进的专业知识：多模态医疗AI从部署经验中进行模型无关的学习)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09146)\n- **研究任务**: 解决大语言模型和视觉语言模型在部署后冻结、无法从解决的病例中学习的问题，特别是在医学领域知识快速更新的背景下。\n- **核心亮点**: 提出一种模型无关的框架，通过技能（Skill）、知识记忆（Knowledge Memory）和多模态知识库（Multimodal Knowledge Base）三种外部专业知识形式，使冻结模型能从部署经验中学习；在六个基准测试中，医疗任务性能相比基础模型提升高达34.2%。\n- **深度解析**: 摘要未提供关于该框架在真实临床环境中的具体部署成本或不同外部专业知识形式的消融实验数字。但其核心价值在于提出了一种“模型无关”的持续学习范式，通过外部记忆和技能模块，让冻结的医疗大模型能够安全、可靠地吸收最新临床证据。\n- **领域归类**: [医疗AI, 持续学习, 多模态大模型]\n---\n\n### 48. Pumpire: Unified Benchmark for Metric Distance Estimation (Pumpire：度量距离估计的统一基准)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12423)\n- **研究任务**: 评估图像级和视频级3D基础模型（无论是否带有深度先验）在重建几何中直接估计度量点对距离的能力。\n- **核心亮点**: 提出Pumpire统一基准和pumpire-6k大规模数据集（包含100个真实世界场景、6400帧及物理测量的点对距离）；直接评估重建几何的点对距离误差，填补了以往评估协议在感知和估计重建3D空间物理尺度能力上的空白。\n- **深度解析**: 摘要未提供关于29种基线配置的具体排名或误差数值细节。但其填补了3D基础模型评估中的一个关键空白：以往评估多关注几何相似度或深度估计，而Pumpire直接聚焦于“物理尺度感知”这一更基础的能力，为3D模型在真实世界物理交互中的应用提供了重要基准。\n- **领域归类**: [3D视觉, 基准测试, 基础模型]\n---\n\n### 49. Incremental Open-Ended Deep Research with Structured Harness (基于结构化框架的增量式开放式深度研究)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11566)\n- **研究任务**: 解决现有开放式深度研究（OEDR）系统每次从零生成报告导致效率低下的问题，实现随着新信息出现时研究报告的持续维护和增量更新。\n- **核心亮点**: 提出增量式开放式深度研究（Incremental-OEDR）设定及结构化框架（Structured Harness），将报告表示为大纲、章节和证据的结构化集合；在DeepResearch Bench上，相比传统OEDR，内容级ROUGE-L F1提高0.51，Token消耗降低33%，搜索调用减少61%。\n- **深度解析**: 摘要未提供关于该框架在处理极度矛盾信息时的具体冲突解决机制或长链任务的具体衰减数字。但其通过结构化框架将非结构化报告转化为可检索、可复用的证据池，有效打破了传统深度研究系统“每次从零开始”的效率瓶颈，实现了知识的高质量累积。\n- **领域归类**: [深度研究, 智能体, 信息检索]\n---\n\n### 50. Investigating the Role of Reasoning-Language Alignment in Monolingual Retrieval-Augmented Generation (探究单语检索增强生成中推理-语言对齐的作用)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03136)\n- **研究任务**: 探究在检索增强生成（RAG）场景下，当模型需要阅读并整合大量目标语言检索证据时，强制模型使用特定语言进行推理对准确率的影响。\n- **核心亮点**: 构建了基于桌面角色扮演游戏《黑暗之眼》的纯德语RAG问答测试床；发现使推理语言与查询及检索文档语言对齐（如强制德语推理）有助于提升性能，但其上限仍受制于模型原生的无约束英语推理能力。\n- **深度解析**: 摘要未提供关于该测试床的具体问题数量或不同语言对齐策略下的详细准确率数字。但其深刻揭示了在RAG场景中，强制使用检索文档语言进行推理的收益源于“语言一致性”而非“语言熟练度”，并指出突破多语言RAG性能上限仍需依赖模型原生的多语言推理能力。\n- **领域归类**: [检索增强生成, 多语言大模型, 推理机制]\n---\n\n### 51. EDiS: Edge Disjoint Subgraph Sparsification Framework for Graph Neural Networks (EDiS：用于图神经网络的边不相交子图稀疏化框架)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09059)\n- **研究任务**: 降低图神经网络（GNN）稀疏训练的计算成本，解决决定保留哪些边成本高昂、固定拓扑结构限制训练以及跨 epoch 变化需要重复采样或重新计算的问题。\n- **核心亮点**: 提出 EDiS 框架，将一次性结构提取与每个 epoch 的图组合分离。将图分解为可缓存的边不相交子图，然后在每个 epoch 根据边预算约束重新组合，无需重新提取结构。\n- **深度解析**: 默认构建使用基于特征的分数和连续最大分数覆盖森林。论文提供了对每个 epoch 采样器（组合步骤）的组合分析，证明在默认覆盖森林选择器下，存储的分解能确定性地保留高分割边，并推导出与选择器无关的条件边界。在 19 个节点分类基准测试（包括同配、异配和大规模）中，与 17 个基线相比，EDiS 在相同边预算下取得了最高的平均基准分数和最低的平均排名。消融实验表明，在紧凑的边预算下，结构分解和 epoch 变化的优势最为明显。摘要未提供具体的基准测试名称和具体的准确率/ROC-AUC 数字。\n- **领域归类**: [图神经网络, 模型加速, 图稀疏化]\n---\n\n### 52. CARE: Certifying Acceleration for Vision-Language-Action Inference (CARE：为视觉-语言-动作推理认证加速)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08917)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型推理加速可能丢弃信息并导致原本能解决的任务失败的问题，提供加速诱导失败风险的认证。\n- **核心亮点**: 提出 CARE 方法，用于认证加速器的选择。通过在校准集上进行配对 rollout，提供有限样本保证，确保加速诱导的失败风险保持在用户指定的预算内。部署最快的认证候选者，若无合格者则回退到参考策略。\n- **深度解析**: 加速诱导的失败通过从相同初始条件进行的配对 rollout 来定义。CARE 仅依赖终端结果和测量的计算，适用于不同的加速机制。在四个 LIBERO 套件上使用 OpenVLA-OFT，CARE 认证了 9.0--10.8 倍的加速，同时保证（95% 置信度下）至少保留 85.8% 的参考解决 episode。在严格预算下，无保证的选择器在高达 75% 的试验中超出预算，而 CARE 保持在预算内，其顺序形式比穷举评估少使用 78.9% 的 rollout。CARE 还泛化到 π_{0.5} 的流步减少，以及 Crafter 中的 Qwen3.5-9B 和 Llama-3.1-8B 智能体。摘要未提供具体的其他底层加速机制技术细节。\n- **领域归类**: [具身智能, 视觉-语言-动作模型, 推理加速, 安全性与认证]\n---\n\n### 53. On-Policy Distillation Teaches New Skills but Not New Knowledge (在策略蒸馏教授新技能但不教授新知识)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09639)\n- **研究任务**: 探究在策略蒸馏（OPD）增强语言模型推理能力时，学生模型是获得了新的事实知识，还是获得了用于多步推理的组合技能。\n- **核心亮点**: 发现反向 KL OPD 可靠地跨未见过的推理结构转移组合技能，但转移的事实知识极少。将蒸馏配方解耦揭示了这种不对称性的来源：用正向 KL 替换反向 KL 可恢复事实转移，而学生 rollout 专门改善多步推理的执行。\n- **深度解析**: 使用受控的合成框架，测量学生的初始能力，并独立控制教师的额外事实、组合技能或两者。在来自三个家族的四个模型上进行了实验。在近期事实问答和竞赛数学上的实验显示，在反向 KL OPD 下存在类似的不平衡，产生显著的推理增益而没有事实记忆扩展。结果表明，在策略蒸馏不会扩展模型的参数化知识，而是教它组织和组合其已有的知识。摘要未提供具体的模型名称、事实 QA 和竞赛数学的具体数据集名称及准确率数字。\n- **领域归类**: [大语言模型, 知识蒸馏, 模型推理, 事实知识]\n---\n\n### 54. BrickBench: Evaluating Agentic Brick Design (BrickBench：评估智能体积木设计)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12452)\n- **研究任务**: 评估智能体在文本条件下的乐高套装设计能力，要求生成的组件不仅满足语义和设计标准，还能在物理上被搭建。\n- **核心亮点**: 提出 BrickBench 基准测试和 BrickAgent 环境。智能体需要从离散库中选择零件，并联合推理局部和全局约束。在三个不同规模和零件可用性的设置中评估有效性、对齐和设计。\n- **深度解析**: 研究发现，领先的智能体在很大程度上满足了可验证的物理和语义要求，但在设计上仍不及人类设计。摘要未提供具体的实验结果数字、数据集规模或具体的基线对比数据。\n- **领域归类**: [智能体评估, 3D 设计, 基准测试, 物理约束推理]\n---\n\n### 55. Skill Constellations: Tracing the Supply Chain of Agent Skills on GitHub (技能星座：追踪 GitHub 上智能体技能的供应链)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11169)\n- **研究任务**: 追踪 AI 编码智能体（如 Claude Code 和 Codex）在 GitHub 上共享和复制技能（SKILL.md 指令和脚本）的供应链，揭示其来源、安全修复的传播范围以及需要审查的仓库。\n- **核心亮点**: 贡献了第一个带日期的智能体技能复制网络，基于 GitSkills 中每个 SKILL.md 的 git 历史构建，涵盖 GitHub 上 2,193,119 次技能采用。发现少数仓库是几乎所有复制的来源，且 GitHub stars 无法识别它们。技能复制几乎不随源改变，因此源的修复很少到达它们。\n- **深度解析**: 论文拟合了一个模型来预测哪些仓库被他人复制，并用于对仓库进行审计排名。审查其排名最高的 100 个仓库可以防止 14.9% 的高风险技能后续采用，而排名最高的 100 个 starred 仓库只能防止 0.5%。建议平台分发版本化引用而不是副本。摘要未提供具体的预测模型名称或技术细节。\n- **领域归类**: [AI 安全, 软件供应链, 代码智能体, 开源生态分析]\n---\n\n### 56. A GPU-Parallel Framework for Heterogeneous Multi-Task Reinforcement Learning (用于异构多任务强化学习的 GPU 并行框架)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.03335)\n- **研究任务**: 解决现有基准测试很少将 GPU 并行仿真规模与异构操作任务和标准化多任务强化学习评估相结合的问题，实现单个策略在多个异构任务上的高效联合训练和评估。\n- **核心亮点**: 引入 Hebero（异构机器人学习基准），一个 GPU 并行的 Isaac Lab 基准，支持 40 个异构任务。提出示范引导策略优化（DGPO），重用示范进行密集跟踪奖励和非对称价值学习。在 DGPO 框架内引入 IW-ABC，使用轻量级的每任务学习进度信号来协调自适应行为克隆。\n- **深度解析**: 缩放实验表明，在固定的挂钟预算下，增加每个任务的并行副本可以提高成功率。使用每个任务 50 个示范，IW-ABC 在状态输入下达到 90.1% 的平均成功率，比最强基线 FAMO-ABC 高出 7.8 个百分点。其视觉版本达到 93.5% 的平均成功率。真实世界实验表明，在仿真中训练的单个多任务策略可以在物理 Piper 机器人上成功执行四个任务。摘要未提供具体的硬件配置或更详细的网络结构。\n- **领域归类**: [强化学习, 机器人学习, GPU 并行仿真, 多任务学习]\n---\n\n### 57. Mara Chain: Rethinking Failure as a Stepping Stone for AI System Auto-Evolution (Mara Chain：将失败重新思考为 AI 系统自动进化的垫脚石)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35855)\n- **研究任务**: 优化已部署的 AI 系统（通过编辑提示、技能、线束和代码而非模型权重），解决现有“提议-评估-选择”过程中丢弃包含关键信息的候选方案导致后续提议重蹈覆辙的问题。\n- **核心亮点**: 引入 Mara Chain 细化过程，将被拒绝的候选方案转化为垫脚石。保留被拒绝的候选方案，并使用跨先前尝试积累的证据对其进行迭代细化。限制每个细化链的固定深度，并应用帕累托过滤的 Top-N 选择来限制候选池。\n- **深度解析**: 在 AppWorld 技能优化、TerminalBench 2.1 线束优化和 MuSiQue 检索管道优化中，Mara Chain 以更少的 rollout 带来更大的任务性能提升。在 AppWorld 上，相对性能比 GEPA、ACE 和 SkillOpt-Lite 高出最多 20.5%，达到目标分数所需的 rollout 比 GEPA 少 65.5%。在 TerminalBench 2.1 上，通过率比 AHE 和 Meta-Harness 分别提高 20.2 和 22.5 个百分点。在 MuSiQue 上，测试 nDCG@10 和 Recall@10 比手写检索管道分别提高 0.104 和 0.131。摘要未提供具体的模型参数量或硬件细节。\n- **领域归类**: [AI 系统优化, 提示工程, 自动进化, 智能体技能优化]\n---\n\n### 58. Incidental information contaminates patient notes and disrupts clinical reasoning in large language models (偶然信息污染患者笔记并干扰大语言模型的临床推理)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08585)\n- **研究任务**: 评估大语言模型在支持环境文档和临床推理时，对患者就诊中偶然（无关）信息的敏感性，研究这种信息如何污染患者笔记并干扰临床推理。\n- **核心亮点**: 发现前沿模型在 35% 的笔记中插入了闲聊交流，尽管平均质量分数在五分制中最多变化 0.20 分。在 3.7% 的前沿笔记中，模型错误归因了旁白或在临床上使用了它们。在 -10 dB 的背景语音下，48.2% 的转录本发生泄漏，四个开放权重模型生成的下游笔记中有 5.3% 受到污染。提出临床推理和 LLM 干扰的双重编码假设。\n- **深度解析**: 在 576 个患者-临床医生对话和 57 个模拟录音咨询中进行了实验。初步证据表明，与偶然信息干扰相关的 LLM 组件也支持临床推理。建议在临床使用前评估对偶然信息的抵抗力，并设置防止污染同时保留临床推理的安全措施。摘要未提供具体的模型名称，只提到了“前沿模型”和“四个开放权重模型”。\n- **领域归类**: [医疗 AI, 大语言模型, 临床推理, 鲁棒性与安全性]\n---\n\n### 59. SpecFold: Folding Multi-Branch Redundancy for Faster Speculative Decoding in Diffusion Language Models (SpecFold：折叠多分支冗余以加速扩散语言模型中的推测解码)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04875)\n- **研究任务**: 加速扩散大语言模型（DLLMs）的生成过程，解决多分支推测解码中每个推测验证步骤内存在的多分支计算冗余问题。\n- **核心亮点**: 提出 SpecFold，一种算法-系统协同设计，利用多分支冗余降低多分支推测验证的成本。算法上，执行 token 级残差门控，通过折叠注意力和 FFN 选择性地重用父计算，同时保留残差隐藏状态。系统上，Triton kernel 实现通过高效的稀疏多分支执行将细粒度重用转化为端到端吞吐量增益。\n- **深度解析**: SpecFold 与时间缓存正交，并与现有的 DLLM 推测策略兼容。在两个 DLLM 家族、五个模型和五个标准基准测试中，SpecFold 的吞吐量比 Spiffy 高出最多 1.64 倍，比 vanilla 解码高出最多 1.99 倍，同时保持相当的任务性能。摘要未提供具体的 DLLM 模型名称、参数量或基准测试名称。\n- **领域归类**: [大语言模型, 扩散模型, 推理加速, 推测解码]\n---\n\n### 60. You Changed Your Mind, The Model Didn't: Demystifying Intent in Multi-Turn Dialogue (你改变了主意，模型却没有：揭秘多轮对话中的意图)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06496)\n- **研究任务**: 解决大语言模型在多轮任务中，当用户提出修改但最终拒绝时，模型仍被提及的拒绝修改所干扰，未能保持用户最终意图的问题。\n- **核心亮点**: 引入 Intent-Eval 基准测试，涵盖工具操作、代码、数据库和数学。发现模型容易受到被拒绝的提议和被取代的要求的影响，存在“提及即生效”的混淆。提出 Intent-OPSD，一种决策条件下的在策略自蒸馏框架，由同一模型初始化的 Teacher 和 Student 组成。\n- **深度解析**: 冻结的 Teacher 提供与用户决策匹配的完整任务的主动意图监督，训练 Student 在完整对话上遵循反映用户意图的主动要求。准确率下降会随着交互的继续而加深或持续。摘要未提供具体的准确率数字、数据集规模或基线对比数据。\n- **领域归类**: [大语言模型, 多轮对话, 意图识别, 自蒸馏]\n---\n\n### 61. Learning to Steer, Steering to See: Unveiling the Geometry of RLVR in Large Language Models via Trainable Vectors (学习转向，转向观察：通过可训练向量揭示大语言模型中 RLVR 的几何结构)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34344)\n- **研究任务**: 研究带有可验证奖励的强化学习（RLVR）在大语言模型中的训练动态，通过向量转向（vector steering）技术识别激活空间中与 RL 增益相关的低维有效流形。\n- **核心亮点**: 揭示了 RLVR 训练的两个几何属性：(1) 有效流形容量：复制 RL 增益所需的容量可以很小，但不能无限压缩，受干预维度和依赖输入的表达能力限制；(2) 控制流形分离：有效控制方向主要位于激活主方差的低方差补集中。基于此提出了 Alpha-Stabler 框架，包含用于早期崩溃预警的 Predictor 和在反向传播中移除激活梯度主方差分量的 Controller。\n- **深度解析**: 实验在 5 个大语言模型和 6 个可验证奖励任务上进行，支持了上述几何发现。Alpha-Stabler 框架成功将训练稳定了 2,000 步，并持续提高了 RL 增益，为鲁棒的后训练提供了实用见解。代码已开源。\n- **领域归类**: [大语言模型, 强化学习, 模型训练与优化]\n---\n\n### 62. MARGIN: Runtime Confidence Calibration for Multi-Agent Foundation Model Coordination (MARGIN：用于多智能体基础模型协调的运行时置信度校准)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.22949)\n- **研究任务**: 解决在多智能体基础模型协调中，不同模型自报告的置信度含义不同且随工作负载变化的问题，提出一种无需重训模型的运行时置信度校准方法。\n- **核心亮点**: 提出 MARGIN（通过增量归一化进行多智能体运行时分级）。该方法从观察到的答案结果中学习模型特定的置信度修正，通过跟踪置信带内的近期准确率和声明置信度，使用其比率来修正报告的置信度，并将稀疏带修正混合为模型级估计，最终用于加权集体决策中的候选答案。\n- **深度解析**: 评估覆盖了代码生成、问答和数学任务，使用了包含 18 个模型的池子和 9 个模型的子集进行分布偏移实验。在 BigCodeBench 上发现模型平均置信度与准确率呈负相关。MARGIN 在代码生成和问答的分布偏移实验中，预期校准误差低于多数基线。在代码生成协调实验中，校准使答案选择准确率分别提高了 4.3 和 14.0 个百分点。\n- **领域归类**: [多智能体系统, 模型评估与校准, 基础模型协调]\n---\n\n### 63. Distilling Routed 3D Privilege for Spatial Reasoning in Vision-Language Models (蒸馏路由 3D 特权以增强视觉语言模型的空间推理)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12355)\n- **研究任务**: 解决视觉语言模型（VLMs）由于 RGB 输入不直接提供几何证据而导致空间推理能力薄弱的问题。\n- **核心亮点**: 提出 GPD（几何特权蒸馏），在策略自蒸馏（OPSD）中将几何证据作为特权。将深度、语义和鸟瞰图（BEV）线索渲染为紧凑文本并路由给教师模型；引入特权 KL 散度，仅应用于错误轨迹以增强 GRPO，而部署时的模型保持纯 RGB 输入。\n- **深度解析**: 在 4B 骨干网络上，GPD 在 VSI-Bench 上达到 57.1 分，在 MindCube、SPARBench、MMSI-Bench 和 ViewSpatial 上平均达到 37.6 分，优于 GRPO 和答案特权 OPSD。消融实验证实了 3D 和答案特权的互补性、问题条件路由优于全上下文注入的优势，以及将蒸馏限制在错误轨迹上的好处。\n- **领域归类**: [视觉语言模型, 空间推理, 知识蒸馏]\n---\n\n### 64. Predicting Cable Dynamics with Physical Attention Bias (利用物理注意力偏置预测电缆动力学)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11975)\n- **研究任务**: 提高可变形线性物体（如电缆）学习模拟器预测未见电缆运动和长序列稳定性的能力，重点解决电缆接触自身或地面时的预测误差。\n- **核心亮点**: 提出物理注意力偏置（physical attention bias），在注意力 logits 上添加具有学习率的加性项。研究比较了无偏置、单独使用沿电缆的弧长距离（控制弹性力）或空间欧几里得距离（控制接触），以及在不相交的注意力头上分配这两种距离的效果。\n- **深度解析**: 物理偏置改善了未见电缆的预测。当注意力是连接远端线段的唯一机制时增益最大：弧长偏置将预测误差降低了 15%，并使线段长度漂移减少了一半以上。单独的欧几里得偏置接近无偏置注意力，而在各个头上分配两种距离在所有报告的指标上表现最好或接近最好。代码和运行记录已开源。\n- **领域归类**: [物理模拟, 注意力机制, 可变形物体动力学]\n---\n\n### 65. MIRA: A Musical Intent Refinement Agent for Aligning Text-to-Music Generation with User Intent (MIRA：用于使文本到音乐生成与用户意图对齐的音乐意图细化智能体)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10355)\n- **研究任务**: 解决文本到音乐生成中，全局文本-音频相关性分数掩盖了特定要求（如乐器、结构、节奏、情绪 progression）失败的问题，使生成结果更精准地匹配用户意图。\n- **核心亮点**: 将文本到音乐意图对齐定义为满足每个请求的独立可验证项目（rubric）。提出 MIRA 智能体，在测试时将请求意图落地为 rubrics，然后在有界预算下搜索提示修订，迭代生成音乐，根据 rubrics 进行验证，并使用反馈引导轨迹感知树搜索。\n- **深度解析**: 构建了 MuRA-Bench，一个由音乐专家策划的真实世界平台请求基准。实验表明，MIRA 提高了意图对齐，使开源生成器在性能上可与 Suno 和 Mureka 等商业系统相媲美，但具体的性能提升数值摘要未提供。\n- **领域归类**: [文本到音乐生成, 智能体 (Agent), 意图对齐与评估]\n---\n\n### 66. SatNav: A Scalable Benchmark for Long-Horizon UAV Vision-Language Navigation from Satellite Imagery (SatNav：基于卫星图像的可扩展长视野无人机视觉语言导航基准)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.31507)\n- **研究任务**: 解决城市无人机（UAV）视觉语言导航（VLN）中，现有基准依赖昂贵的 3D 资产导致难以扩展、地理多样性和场景规模受限的问题。\n- **核心亮点**: 引入 SatNav，一个基于高分辨率卫星图像的可扩展、长视野无人机 VLN 基准。使用卫星裁剪作为无人机俯视图的近似。通过自动化管道构建了 Boundary（边界）、Landmark（地标）和 Route（路线）三个任务族，以测试长视野记忆和地理空间推理。\n- **深度解析**: 从 18 个城市的 59 个场景构建了 118K 个情节，平均轨迹长度 379 米。对经典 VLN 智能体和基于大型视觉语言模型（LVLMs）的智能体进行基准测试，表明城市规模导航仍具挑战性。引入了 SwiftVLN 模块化框架并进行内存设计消融。卫星到无人机的迁移实验表明，卫星训练的模型可在真实无人机观测上运行。\n- **领域归类**: [视觉语言导航, 无人机, 基准测试, 卫星图像]\n---\n\n### 67. SPW-Nav: A Streaming Panoramic World Model for Language-Guided Navigation (SPW-Nav：用于语言引导导航的流式全景世界模型)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08941)\n- **研究任务**: 解决现有全景生成器遵循预定义轨迹、交互式世界模型通过低级动作在透视视图中行动的问题，实现语言引导的实时全景视频生成。\n- **核心亮点**: 提出 SPW-Nav，一个流式全景世界模型，理解运动指令并从单个全景图实时流式传输 2K 360 度视频。将指令解释为相机运动，采用球面旋转解耦、姿态对齐条件化，以及结合多步记忆与少步生成器来应对指令变化。\n- **深度解析**: 构建了 SPW-NavSet，包含相机轨迹和验证指令的全景视频数据集。SPW-Nav 能够实时流式传输一分钟的视频。在相机跟随准确性和视频质量方面优于先前的全景生成器，并支持即时指令切换，但具体的对比数值摘要未提供。\n- **领域归类**: [世界模型, 全景视频生成, 语言引导导航]\n---\n\n### 68. TerraVis: Towards Evaluation of World-Grounded Visual Consistency in Text-to-Image Generation via MLLM Workflows (TerraVis：通过 MLLM 工作流评估文本到图像生成中基于现实世界的视觉一致性)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02959)\n- **研究任务**: 解决文本到图像模型生成的图像虽然逼真美观，但可能违反现实世界合理性（如物体结构畸形、解剖学不可能、物理交互不合理、空间关系不一致），且现有指标无法很好捕捉这些问题。\n- **核心亮点**: 引入 TerraVis 框架，定义了涵盖对象、交互和场景级别失败的结构化分类法。采用多阶段评估框架：首先使用 MLLM 评估图像资格，然后检测 18 种分类定义的违规类型，并将其分类为轻微或主要，从而得出整体世界一致性分数。\n- **深度解析**: 在两个广泛使用的基准测试上的多种开源和专有文本到图像模型中，TerraVis 与人类对世界一致性的判断实现了现有指标中最强的相关性，但具体的相关系数数值摘要未提供。结果表明，在传统指标上表现强劲的模型仍可能存在严重的世界一致性失败。代码已开源。\n- **领域归类**: [文本到图像生成, 模型评估, 视觉一致性, 多模态大语言模型 (MLLM)]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [BerriAI/litellm](https://github.com/BerriAI/litellm)\n- **今日趋势**: ⭐ 60,575 | 🍴 12,178 | 📈 今日新增 95 stars\n- **项目简介**: 一个快速、轻量级的 AI 网关，用于统一调用和管理多种大语言模型 API。\n- **核心价值**: \n  - **目标人群**: 需要集成、管理和监控多个 LLM API 的开发者与 AI 应用构建者。\n  - **技术核心**: 采用 Rust 核心与 Python SDK，支持以 OpenAI 格式调用 100+ 种 LLM API，并具备成本追踪、安全护栏、负载均衡和日志记录功能。\n  - **是否 AI/大模型相关**: 是。\n---\n### [Robbyant/lingbot-map](https://github.com/Robbyant/lingbot-map)\n- **今日趋势**: ⭐ 17,634 | 🍴 1,946 | 📈 今日新增 109 stars\n- **项目简介**: 用于流式 3D 重建的几何上下文 Transformer 模型。\n- **核心价值**: \n  - **目标人群**: 计算机视觉、3D 重建领域的研究人员和开发者。\n  - **技术核心**: 基于几何上下文 Transformer 架构，实现流式 3D 重建（ECCV 2026 最佳论文候选）。\n  - **是否 AI/大模型相关**: 是。\n---\n### [Tencent-Hunyuan/Hy-MT2](https://github.com/Tencent-Hunyuan/Hy-MT2)\n- **今日趋势**: ⭐ 1,181 | 🍴 114 | 📈 今日新增 147 stars\n- **项目简介**: 仓库描述未提供。\n- **核心价值**: \n  - **目标人群**: 仓库描述未提供。\n  - **技术核心**: 仓库描述未提供。\n  - **是否 AI/大模型相关**: 无法判断（仓库描述未提供，不根据项目名猜测）。\n---\n### [unslothai/unsloth](https://github.com/unslothai/unsloth)\n- **今日趋势**: ⭐ 77,631 | 🍴 7,161 | 📈 今日新增 140 stars\n- **项目简介**: 提供本地 UI 界面，用于运行和训练大语言模型及扩散模型。\n- **核心价值**: \n  - **目标人群**: 需要在本地运行、微调或训练 AI 模型的开发者、研究人员和 AI 爱好者。\n  - **技术核心**: 提供本地 UI，支持 GGUF、MLX 等多种格式及 Qwen、DeepSeek、Gemma、FLUX 等主流模型的运行与训练。\n  - **是否 AI/大模型相关**: 是。\n---\n### [headroomlabs-ai/headroom](https:
