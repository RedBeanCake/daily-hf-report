    <h1>前沿科研情报 - 2026-08-13</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. OpenART: Scaling Agent Red Teaming via Open-Ended Environment Evolution (OpenART：通过开放式环境演化扩展智能体红队测试)\n- **社区热度**: `👍 145 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.00677)\n- **研究任务**: 解决现有安全基准无法捕捉智能体在长期、持久环境中累积风险的问题，对智能体进行可扩展的红队测试（安全评估）。\n- **核心亮点**: 提出了OpenART，一个包含超过10,000个跨50个领域的有状态场景的开放式竞技场；提出了演化马尔可夫超图攻击（EMHA），一种无需参数更新的黑盒策略，通过环境演化进行反馈驱动的攻击。\n- **深度解析**: EMHA在所有配置中实现了85.0%的汇总攻击成功率（ASR）。在复杂环境中，其相对于仅指令演化的优势从约2%增加到超过17%，表明环境演化在任务复杂度增加时越来越多地暴露安全失败。分析还表明，智能体的特定运行时实现在底层模型能力之外解释了很大一部分安全差异。\n- **领域归类**: [AI安全, 智能体, 红队测试, 环境演化]\n---\n\n### 2. Spark-to-Paper: End-to-End Research Paper Generation as a Composable Skill (Spark-to-Paper：作为可组合技能的端到端研究论文生成)\n- **社区热度**: `👍 141 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11924)\n- **研究任务**: 将研究想法转化为完整的论文，包括文献检索、实验设计与执行、根据证据修改声明、生成出版级图表以及在长生成过程中保持一致性。\n- **核心亮点**: 提出了Spark-to-Paper，一个在现有代码助手内作为13个可组合技能实现的端到端论文生成系统；将基于模型的判断与确定性操作分离，将实验规划与报告分离；结合了确定性完整性检查与自我批评，限制了“自我反驳循环”失败模式；生成可编辑的矢量图。\n- **深度解析**: 在8个受控研究主题中，引用有效率达到99.5%，图表可编辑率达到96.4%。受控消融实验表明，完整的完整性和审查堆栈将捏造检测率从单次草稿的14%提高到92%，对抗性审查达到74%的精确度。整个系统使用11.9M tokens，每篇手稿成本8.1美元，平均需要3.2小时。\n- **领域归类**: [自然语言处理, 自动化科研, 智能体, 论文生成]\n---\n\n### 3. AI4AI at Test-Time: Strong-to-Weak Capability Transfer via Harnesses (测试时的AI辅助AI：通过执行环境实现强到弱的能力迁移)\n- **社区热度**: `👍 74 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12307)\n- **研究任务**: 探索在测试时（无需参数更新）将大模型（强模型）的能力迁移到小模型（弱模型）上，通过构建推理时的执行环境（harnesses）来帮助弱模型更可靠地解决任务。\n- **核心亮点**: 提出了强到弱的脚手架（strong-to-weak scaffolding）方法，使用更强的构建模型为更弱的目标模型构建推理时的执行环境；在4个心智理论（Theory-of-Mind）基准上验证，无需更新参数即可大幅提升目标模型性能。\n- **深度解析**: 这种测试时的能力迁移非常有效，将目标模型的平均性能从0.49几乎翻倍至0.91。分析表明，性能提升主要来自于将不稳定的模型推理卸载到确定性代码、特定基准的路由以及严格的回答格式执行中，而不是鼓励目标模型进行更广泛的推理或采样。构建模型的推理努力单调提高环境质量，且较弱的目标模型获得最大的收益。\n- **领域归类**: [模型压缩, 推理优化, 智能体, 能力迁移]\n---\n\n### 4. Mechanist: AI as a Scientific Instrument for Discovering the Mechanisms of Intelligence (Mechanist：将AI作为发现智能机制的科学仪器)\n- **社区热度**: `👍 71 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12036)\n- **研究任务**: 解决AI模型能力和风险背后的机制难以理解的问题，实现AI智能底层机制的自主发现，以弥合模型能力与人类理解/控制能力之间的差距。\n- **核心亮点**: 提出了Mechanist，一个将AI作为科学仪器自主发现AI智能机制的智能体系统；构建了包含约13,000篇论文的可解释性知识图谱，并与跨越26个领域的4300万篇论文的多学科数据库集成；整理了32种基础机制分析、因果干预和验证方法的库。\n- **深度解析**: 与现有系统相比，Mechanist能生成更有价值的机制假设并更可靠地执行实验。它展示了从发现模型行为到解释和控制AI模型的进展：首先揭示了科学实验室中一个反直觉的安全风险（不安全特征可通过看似安全的训练数据跨模态转移）；然后开发了信念机制理论（揭示模型如何表示世界知识、形成信念等）；最后将这些机制洞察转化为实际干预，提高模型性能并引导科学基础模型生成具有特定属性的DNA序列。\n- **领域归类**: [可解释性, AI安全, 智能体, 自动化科学发现]\n---\n\n### 5. SkillZip: Contract-Preserving Graph Compression for Scalable Agent Skill Libraries (SkillZip：用于可扩展智能体技能库的保留契约图压缩)\n- **社区热度**: `👍 59 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.05604)\n- **研究任务**: 解决随着智能体技能库增长，如何在有限的上下文预算下暴露最小且足够的可执行上下文的问题，实现技能库的高效压缩和复用。\n- **核心亮点**: 提出了SkillZip，一个执行感知的过程抽象框架，在段落级图上执行保留契约的压缩；将重复的契约有效模式重写为可逆的端口宏，同时保留边界签名、依赖闭合等；推理时水合紧凑上下文，仅在需要时展开宏；ReZip进一步整合新技能并利用执行证据修改高风险宏。\n- **深度解析**: 在技术和具身智能体基准上的综合实验表明，SkillZip比最强基线高出多达12.2分，同时实现了3.46倍的压缩比，依赖保留率为99.2%，验证器可达率为98.7%。扩展分析进一步证实了在200到100K个技能的技能库中稳健的检索能力。\n- **领域归类**: [智能体, 上下文优化, 技能库管理, 图压缩]\n---\n\n### 6. Can LLM Agents Stick to the Script? A Benchmark for Long-Horizon Consistency in Interactive Narratives (LLM智能体能坚持剧本吗？交互式叙事中长程一致性的基准测试)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08160)\n- **研究任务**: 解决大语言模型在交互式叙事（如AI游戏）中，面对不受限的用户干预时，难以保持长程逻辑一致性和叙事完整性的问题。\n- **核心亮点**: 将挑战形式化为“叙事承诺保留（NCP）”，并引入NCP-Bench，一个包含100个源自电影简介的叙事环境的基准测试；每个环境包含结构化的叙事规范（轨迹、承诺和初始事实），可在玩家智能体与叙述者智能体的交互过程中自动检查。\n- **深度解析**: 实验揭示了巨大的长程一致性差距：高语言质量不能保证承诺保留；即使在对抗性干预下，强模型也经常生成逻辑冲突的内容。表现最好的模型（GPT-5.2）在20轮后仅达到42%的存活率，各模型的事实冲突率在40%到68%之间，且在100轮限制内只有孤立的运行满足了所有成就承诺。\n- **领域归类**: [自然语言处理, 智能体, 游戏AI, 基准测试]\n---\n\n### 7. StateFlow: Building, Evolving, and Accessing 3D World States for Previsualization (StateFlow：为预可视化构建、演化和访问3D世界状态)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12314)\n- **研究任务**: 解决现有生成方法在电影、游戏等预可视化中，通过单次图像或视频合成联合控制所有因素导致可控性弱、迭代编辑支持有限的问题。\n- **核心亮点**: 提出了StateFlow，一个以状态为中心的生成式预可视化框架；使用可编辑的3D世界来组织场景结构、演化和摄像机，将其维护为持久的结构化3D状态；包含三个阶段：状态构建（将2D内容提升为连贯的3D世界）、状态演化（将用户意图转化为结构化状态转换）、状态访问（使用渲染反馈反射优化摄像机计划）。\n- **深度解析**: 摘要未提供具体的实验数字或对比基线，但指出实验表明StateFlow为视频创作和类似游戏的原型制作生成了高质量的3D世界。\n- **领域归类**: [计算机视觉, 3D生成, 视频生成, 预可视化]\n---\n\n### 8. Self-Geometry: GT-Free and Plug-and-Play Test-Time Adaptation for Geometrically Consistent 3D Vision Foundation Models (Self-Geometry：用于几何一致的3D视觉基础模型的免真值即插即用测试时自适应)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.10708)\n- **研究任务**: 解决视觉基础模型（VFMs）在单次前向传播中预测深度、相机位姿和点图时，缺乏显式多视图几何一致性导致的不一致问题。\n- **核心亮点**: 提出了Self-Geometry，一个即插即用的测试时自适应（TTA）管道，使用2D像素对应作为伪真值直接施加显式多视图几何约束；包含几何解耦优化（结合多视图一致性和对极一致性损失与梯度解耦）、帧角邻居（基于SO(3)测地距离的视图采样器）和轻量级TTA（通过LoRA自适应VFMs）。\n- **深度解析**: 摘要未提供具体的实验提升数字，但指出该方法在6个VFMs（VGGT, π^3, DA3-Giant/Large/Base/Small）和4个基准测试（7Scenes, ETH3D, ScanNet++, HiRoom）的位姿和几何估计中实现了一致的提升。\n- **领域归类**: [计算机视觉, 3D视觉, 测试时自适应, 基础模型]\n---\n\n### 9. Self-Evolving Embodied Agents via Skill-Harness Evolution (通过技能-环境演化实现自进化具身智能体)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11350)\n- **研究任务**: 解决具身智能体适应新环境时，监督微调和强化学习需要额外数据、奖励和训练，而无训练方法依赖可能不可用的可编程机器人API的问题，实现免训练的具身适应。\n- **核心亮点**: 提出了SHAPER，一个免训练的自进化具身适应框架，保持模型参数冻结，通过目标环境推演演化可复用技能和上下文代码环境（harness）来改进非参数智能体系统；同一个冻结模型可同时作为规划器和优化器。\n- **深度解析**: 摘要未提供具体的实验数字，但指出在VLABench和ESI-Bench上对SHAPER进行了评估，并与纯执行、监督微调和测试时扩展基线进行了比较。结果表明，当模型训练昂贵、不可用或不受欢迎时，技能和环境优化是具身智能体自进化的实用途径。\n- **领域归类**: [具身智能, 智能体, 强化学习/免训练适应, 技能演化]\n---\n\n### 10. From Synthesis to Removal: Physics-Grounded Reflection Simulation and Diffusion-Based Video Dereflection (从合成到去除：基于物理的反射模拟与基于扩散的视频去反射)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11562)\n- **研究任务**: 解决通过玻璃拍摄的视频中常包含反射，而视频反射去除由于缺乏配对视频数据、时间连贯的去除模型和专用评估基准而未被充分探索的问题。\n- **核心亮点**: 提出了一个闭环框架，统一了基于物理的反射模拟、基于扩散的视频去反射和基准评估；S2R-Synthesis管道生成配对的反射和无反射视频；S2R-Removal是首个基于扩散的视频反射去除模型，在单步去噪中恢复清晰的透射；构建了S2R-Bench，首个视频反射去除基准。\n- **深度解析**: 摘要未提供具体的实验数字，但指出在S2R-Bench和多个公开图像基准上的实验表明，该方法实现了最先进的性能，并且推理速度甚至比非扩散基线更快，验证了S2R-Synthesis的有效性。\n- **领域归类**: [计算机视觉, 视频处理, 图像/视频恢复, 扩散模型]\n---\n\n### 11. ToolHazard: Scaling Adversarial Environments for Security Evaluation and Alignment of LLM-based Agents (ToolHazard：扩展用于基于 LLM 的 Agent 安全评估与对齐的对抗环境)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11878)\n- **研究任务**: 评估和对齐基于大语言模型（LLM）的智能体在集成外部工具时的安全性，特别是针对环境状态中嵌入的间接提示注入攻击。\n- **核心亮点**: 提出了 ToolHazard 框架，通过环境模拟器、攻击者代理和用户模拟器，自动合成可执行的状态环境、发现注入点并生成长期任务，从而构建了 ToolHazard-Bench 用于压力测试。\n- **深度解析**: 现有研究依赖人工环境或随机模拟，限制了可扩展性。ToolHazard 减少了人工工程，支持领域扩展。实验揭示了智能体的显著漏洞，证明注入时机和位置影响攻击效果。此外，利用该框架生成的对齐数据能在提升安全性的同时保留良性任务的效用。摘要未提供具体的漏洞比例、具体的基线模型名称或具体的对齐数据规模。\n- **领域归类**: [AI 安全, 智能体 (Agents), 提示注入, 大语言模型]\n---\n\n### 12. The Illusion of Visual Tool-Use: A Causal Audit of Thinking with Images (视觉工具使用的错觉：对“用图像思考”的因果审计)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.06270)\n- **研究任务**: 审计和评估多模态大语言模型在使用视觉工具（如裁剪和缩放）进行“用图像思考”时的实际因果有效性。\n- **核心亮点**: 将视觉工具使用建模为因果图，在策略、轨迹和步骤三个层面进行干预审计，揭示了“视觉工具使用的错觉”，即尽管总体准确率有提升，但在广泛的运行中视觉工具使用并未产生因果效力。\n- **深度解析**: 研究发现模型使用视觉操作往往收益微小甚至为负，且 token 成本高昂。审计发现了两种失败模式：“调用而不看”（返回的观察对答案无因果影响）和“看而不计划”（观察有信息量但调用计划不连贯）。摘要未提供具体的模型名称、具体的准确率数值或具体的 token 成本数字。\n- **领域归类**: [多模态大模型, 因果推理, 模型评估, 视觉工具使用]\n---\n\n### 13. AVA-Encoder: Towards Agent-Native Video Representation Learning (AVA-Encoder：面向 Agent 原生的视频表示学习)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12313)\n- **研究任务**: 学习一种既忠实于电影内容又可直接用于智能体推理和操作的“Agent 原生”视频表示，以解决创意智能体缺乏从高质量人类电影中有效学习的方法的问题。\n- **核心亮点**: 提出了 Agentic Video Auto-Encoder (AVA-Encoder)，将视频转化为知识图谱（KG）表示并进行重建，利用文本梯度优化框架进行策略训练，并发布了相关框架、基准和高质量电影 KG 数据集。\n- **深度解析**: 该框架将视频结构化为层次和状态节点（存储文本）以及链接资产层（存储图像、音视频）。实验表明，AVA-Encoder 比最强外部基线提升了 20.7 个百分点；在纯策略设置下，其伪训练的镜头级策略优于人工微调策略，且系统提示 token 减少了 74.3%。摘要未提供具体的外部基线名称和具体的数据集规模。\n- **领域归类**: [视频表示学习, 智能体 (Agents), 知识图谱, 视频生成]\n---\n\n### 14. Simplex Relaxation for Discrete Diffusion (离散扩散的单纯形松弛)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.10615)\n- **研究任务**: 改进离散扩散模型（用于分类生成）的训练目标和反向转移过程，而不改变底层的分类损坏过程。\n- **核心亮点**: 提出了 Simplax 方法，一种精确的 Dirichlet-categorical 增强技术，将损坏的分类状态与辅助的单纯形值变量耦合，产生了可处理的 Rao-Blackwellized 反向桥目标和随机反向采样器。\n- **深度解析**: Simplax 在无条件 OpenWebText 生成中改善了生成困惑度与熵的权衡。在数独任务中，仅在 30 线索谜题上训练的模型在所有评估的线索密度（包括最低的唯一可解 17 线索机制）上均达到了最高准确率，并在无条件生成中实现了最高有效性。摘要未提供具体的困惑度数值、熵数值或准确率百分比。\n- **领域归类**: [生成模型, 离散扩散模型, 文本生成, 逻辑推理]\n---\n\n### 15. Agent Safety Should Be a Runtime Contract (智能体安全应作为一种运行时契约)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11274)\n- **研究任务**: 重新定义自主 AI 智能体的安全保障机制，主张将安全从训练时（如 RLHF）的属性转变为执行时由系统环境（harness）强制执行的运行时契约。\n- **核心亮点**: 提出运行时契约包含“预防面”（阻止危险动作）和“证据面”（提供可验证的证明），并形式化了智能体轨迹模式和证据链，强调安全的正确单位是“带有可检查证据的轨迹”而非模型本身。\n- **深度解析**: 作者通过四项公共证据支持该观点，包括 52 起 AI 智能体安全事故调查、31 个核心案例的虚假完成审计、12 个公共智能体系统的轨迹模式审计，以及顶会论文审计（显示训练时与部署时发表比例存在 8-12 倍的不平衡）。摘要未提供具体的安全事故细节或具体的论文不平衡精确数值。\n- **领域归类**: [AI 安全, 智能体 (Agents), 运行时监控, AI 对齐]\n---\n\n### 16. Persistent Recursive Worlds Enable Autonomous Software Evolution (持久递归世界实现自主软件演进)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.10450)\n- **研究任务**: 解决复杂软件系统开发时间超出单个编码智能体寿命的问题，探索以持久项目而非持久智能体为中心来组织长期软件开发。\n- **核心亮点**: 提出 EvoX Genesis，将软件表示为持久递归世界，允许局部智能体寿命有限。通过递归委派和版本控制推进项目，实现了从零构建大型编译器和重构大型遗留代码库的自主演进。\n- **深度解析**: 使用 DeepSeek V4 Flash 构建了一个约 250k 行的 Rust C 编译器，运行超 120 小时，归档超 1000 个智能体情节，花费 44 美元，并通过了完整的 c-testsuite 等测试。此外，将超 100k 行的 Fortran MESA 模块重构为近 90k 行的 Rust，在 6 个数值工作负载上实现了 1.55 至 6.87 倍的中位加速。摘要未提供具体的测试通过率百分比或具体的加速基准细节。\n- **领域归类**: [软件工程, 智能体 (Agents), 代码生成, 自主系统]\n---\n\n### 17. MBA: Multimodal Benchmark and Agents for Real-World Business Ideation (MBA：面向真实世界商业构思的多模态基准与智能体)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11616)\n- **研究任务**: 训练和评估用于真实世界商业构思的多模态智能体，突破现有方法局限于纯文本范式的限制。\n- **核心亮点**: 提出了首个商业构思多模态基准 MBA-Bench（包含 6 个领域的 30K 样本），并设计了 MBA-b（盲）和 MBA-k（已知）两种评估设置，通过结合创造力和可行性奖励的 LoRA SFT 和 GRPO 训练智能体。\n- **深度解析**: MBA-Bench 利用自动图像描述和 GPT-4o 生成参考想法。实验表明，MBA-b 和 MBA-k 分别比仅标题基线高出 63.9% 和 77.1%，比多模态基线高出 25.6% 和 35.8%。摘要未提供具体的评估指标名称（除创造力和可行性外）、具体的基线模型名称或具体的 Judge 模型细节。\n- **领域归类**: [多模态大模型, 智能体 (Agents), 商业应用, 模型评估]\n---\n\n### 18. AutoWorldModel-Bench: A State-Centric Benchmark for Automated World-Model Research (AutoWorldModel-Bench：面向自动化世界模型研究的以状态为中心的基准)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11216)\n- **研究任务**: 评估前沿编码智能体作为自主研究人员，在固定计算预算下自主改进世界模型起点的能力，而非仅仅执行规范工程任务。\n- **核心亮点**: 提出了 AutoWorldModel-Bench，一个涵盖 8 个游戏环境的闭环基准，使用统一的结构化状态表示。智能体在此基准上进行了开放式研究式的修改，而非简单的超参数调整。\n- **深度解析**: 在 64 个会话中，Codex-5.4 和 Claude Opus 4.6 在 63 个会话中改进了起点。91% 的会话中获胜的编辑是研究风格的非平凡修改（如新目标、表示、展开程序或架构更改）。摘要未提供具体的改进幅度数值、具体的游戏环境名称或具体的计算预算大小。\n- **领域归类**: [世界模型, 智能体 (Agents), 自动化科学研究, 基准测试]\n---\n\n### 19. Poor Man's Agentic Modeling: Simulating Large LLM-Agent Societies on a Laptop (穷人的智能体建模：在笔记本电脑上模拟大型 LLM 智能体社会)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11215)\n- **研究任务**: 降低模拟大型大语言模型（LLM）智能体社会的计算成本，使其能够在普通笔记本电脑上运行，同时保留宏观层面的社会行为特征。\n- **核心亮点**: 利用统计物理学观察，将每个 LLM 智能体替换为从少量廉价查询中拟合的低参数模型。引入了“[交互顺序 x 记忆]”分类法来映射感知和记忆，并预测代理误差的趋势。\n- **深度解析**: 该方法在 EconAgent 及另外 7 个 LLM 模拟上进行了验证，使用几美元克隆智能体决策。预测的误差趋势在逐个单元格中成立，且两个被反驳的预测也由理论定量匹配。摘要未提供具体的低参数模型类型、具体的参数数量、具体的误差数值或具体的模拟社会规模。\n- **领域归类**: [多智能体系统, 计算效率, 统计物理学, 社会模拟]\n---\n\n### 20. Hand Visibility Detector: Per-Keypoint Visibility Estimation for Hands (手部可见性检测器：手部逐关键点可见性估计)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11574)\n- **研究任务**: 将手部关节的可见性估计作为一个独立任务进行系统研究，以评估遮挡情况下手部姿态估计结果的可靠性。\n- **核心亮点**: 提出了 Hand Visibility Detector 模型，用于估计单个手部关节的可见性，并证明了利用大规模数据预训练的手部姿态估计（HPE）模型作为骨干网络可以在此任务中获得高性能。\n- **深度解析**: 该模型在通过多视图三角测量进行 3D 手部姿态标注的下游任务中展现了实用性，可见性加权三角测量减少了重投影误差。摘要未提供具体的重投影误差减少数值、具体的数据集名称、具体的 HPE 骨干网络名称或具体的准确率指标。\n- **领域归类**: [计算机视觉, 手部姿态估计, 3D 视觉, 遮挡处理]\n---\n\n### 21. Parameter Exploration for RLVR via Variational Learning (通过变分学习进行强化学习的参数空间探索)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09805)\n- **研究任务**: 解决大语言模型（LLM）强化学习（RLVR）中的探索问题。\n- **核心亮点**: 提出参数空间探索（parameter-space exploration），通过从后验分布中采样不同的策略来生成 rollout，并引入了“扰动参数策略优化（3PO）”方法族。\n- **深度解析**: 现有的 LLM 强化学习方法主要在动作空间控制探索（如温度缩放），但这只能影响输出分布的方差，不能重新排序 token，容易导致训练发散或停滞。本文转向参数空间探索，使用不同的采样策略和 rollout 分组进行奖励估计。在 OLMo-3-1025-7B 和 Qwen2.5-Math-7B 上的数学推理和代码生成任务实验表明，3PO 在几乎相同的 FLOPs 成本下，持续提高了平均下游性能。此外，使用多个参数样本在训练期间产生的零优势组和格式错误或错误的 rollout 数量均少于 GRPO 和动作空间基线。\n- **领域归类**: [强化学习, 大语言模型, 参数探索]\n---\n\n### 22. NeuPAT: Neuron-aware Plasticity Allocation Tuning for Language-Preserving MLLMs (NeuPAT：用于保留语言能力的多模态大模型的神经元感知可塑性分配微调)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08107)\n- **研究任务**: 解决多模态大语言模型（MLLMs）在扩展多模态能力时，预训练阶段获得的语言能力受损（灾难性遗忘）的问题。\n- **核心亮点**: 提出 NeuPAT 框架，这是一个轻量级且与架构无关的方法，能够在多模态指令微调期间分配神经元级别的更新约束。\n- **深度解析**: 研究发现预训练 LLM 中的神经元在多模态学习期间表现出异质可塑性：部分神经元对保留语言能力至关重要，而另一些则更适应多模态知识。NeuPAT 使用小规模探测阶段来估计神经元适应模式，选择性地保护语言敏感神经元，同时通过更具可塑性的神经元促进多模态适应。实验表明，在 11 个语言基准测试中，NeuPAT 恢复了由普通微调引起的 94.5% 的语言能力退化，同时保持了相当的多模态性能。\n- **领域归类**: [多模态大模型, 灾难性遗忘, 参数高效微调]\n---\n\n### 23. AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models (AtlasVLA：用于视觉-语言-动作模型的持久世界-自我状态建模)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.06729)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在部分可观测和长视野任务中，由于仅依赖单个腕部相机导致的感知遗忘和时序任务进度遗忘问题。\n- **核心亮点**: 提出 AtlasVLA 框架，通过双重记忆架构（4D 持久世界状态记忆和 ego-工作状态记忆）将直接的反应式操作转变为基于持久世界-自我状态的主动推理。\n- **深度解析**: 4D 持久世界状态记忆将瞬态 2D 观察提升为全局更新的体素哈希空间状态，以解决视觉盲区；ego-工作状态记忆则用于跟踪历史 ego 状态和任务进度。通过在联合世界-自我状态上条件化扩散 Transformer (DiT)，模型实现了稳健的空间推理。在 LIBERO、RLBench 和真实世界基准测试中，AtlasVLA 仅使用腕部相机即达到 SOTA 性能，在 LIBERO-Long 上绝对成功率提高 9.4%，在真实世界长视野任务中提高 17.5%，显著优于多视角基线。\n- **领域归类**: [具身智能, 视觉-语言-动作模型, 机器人控制]\n---\n\n### 24. Ready Cohorts: Bounding GPU Opportunity and Avoiding Host Round Trips in LLM-Agent Control (Ready Cohorts：界定 GPU 机会并避免 LLM-Agent 控制中的主机往返)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12123)\n- **研究任务**: 优化 LLM-Agent 服务中模型调用与工具调用之间小型确定性转换的控制路径，探索 GPU 执行并发工作的时机以及 GPU 计算路由决策保留在设备上的影响。\n- **核心亮点**: 形式化了“就绪队列边界（ready-cohort boundary）”，并提出一种机制将 GPU 计算的决策保留在设备上，从而避免返回主机并重新调度。\n- **深度解析**: 论文使用固定分区份额 F、精确离线份额 P*、局部上限 U 和在线实现份额 A 来形式化就绪队列边界。在特定条件下的泊松重放实验中，精确打包恢复了在固定窗口边界丢失的 81.83% 的机会。在独立机制研究中，将 GPU 计算的二进制决策保留在设备上（而不是返回 4 字节到主机），在所有 36 种配置中均比主机往返更快，同位置行中位数比率在 1.19x 到 2.39x 之间。所有测试的 14,557,440 次批量调用均与单独实现的主机预言机匹配。研究确立了 GPU Agent 控制的两个可测量门槛：截止期限可行的队列供应和观察放置。\n- **领域归类**: [大语言模型系统, 推理优化, 智能体控制]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [unslothai/unsloth](https://github.com/unslothai/unsloth)\n- **今日趋势**: 70,859 stars / 6,396 forks\n- **项目简介**: 一个用于在本地运行和训练大语言模型及扩散模型的图形界面工具。\n- **核心价值**: 项目用途为提供本地UI以运行和训练大语言模型（LLMs）和扩散模型；目标人群为AI开发者、研究人员及本地模型部署与微调爱好者；技术核心在于本地化图形界面及对多种主流大模型和扩散模型（如Qwen、Kimi、Gemma、DeepSeek、FLUX等）的运行与训练支持；该项目与AI/大模型相关。\n---\n### [megadose/holehe](https://github.com/megadose/holehe)\n- **今日趋势**: 12,247 stars / 1,653 forks\n- **项目简介**: 一款用于检测邮箱在各大网站注册情况并利用忘记密码功能检索信息的工具。\n- **核心价值**: 项目用途为检查电子邮件是否被用于Twitter、Instagram等不同网站，并通过忘记密码功能检索网站信息；目标人群为安全研究人员、渗透测试人员及开源情报（OSINT）调查员；技术核心在于利用网站的忘记密码功能进行邮箱注册状态检测和信息检索；该项目与AI/大模型不相关。\n---\n### [soxoj/maigret](https://github.com/soxoj/maigret)\n- **今日趋势**: 36,732 stars / 2,844 forks\n- **项目简介**: 一款通过用户名从3000多个网站收集个人档案信息的开源情报（OSINT）工具。\n- **核心价值**: 项目用途为通过用户名从3000多个网站收集关于个人的档案信息；目标人群为安全研究人员、OSINT调查员、记者及执法人员；技术核心在于跨数千个网站的用户名枚举与数据收集；该项目与AI/大模型不相关。\n---\n### [NVIDIA-NeMo/Automodel](https://github.com/NVIDIA-NeMo/Automodel)\n- **今日趋势**: 818 stars / 251 forks\n- **项目简介**: NVIDIA推出的用于大语言模型和视觉语言模型的PyTorch分布式原生训练库。\n- **核心价值**: 项目用途为提供用于大语言模型（LLMs）和视觉语言模型（VLMs）的分布式训练支持；目标人群为AI研究人员、深度学习工程师及大模型训练开发者；技术核心在于PyTorch分布式原生训练能力以及开箱即用的Hugging Face集成；该项目与AI/大模型相关。\n---\n### [skypilot-org/skypilot](https://github.com/skypilot-org/skypilot)\n- **今日趋势**: 10,483 stars / 1,187 forks\n- **项目简介**: 一个将碎片化AI计算资源整合为统一AI超级计算机的计算平台。\n- **核心价值**: 项目用途为面向前沿团队提供AI计算平台，将碎片化的AI计算资源整合为一台AI超级计算机；目标人群为前沿AI团队、AI研究人员及需要大规模计算资源的企业和机构；技术核心在于AI计算资源池化、分布式计算调度及多云/多集群管理；该项目与AI/大模型相关。\n\u003c/details\u003e"</script>
