### 17. Reroute, Don't Remove: Recoverable Visual Token Routing for Vision-Language Models (重路由而非移除：视觉语言模型的可恢复视觉 token 路由)
- **社区热度**: `👍 11 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.12412)
- **研究任务**: 多模态模型效率优化
- **核心亮点**: 通过可恢复的路由机制处理视觉 token，比直接 pruning 效果更好且可逆。
- **深度解析**: 视觉语言模型处理图片时 token 太多，通常做法是直接删减（pruning）。这篇论文 propose 了“路由” instead of“删除”。它把不重要的视觉 token 路由到浅层或特定路径，但保留恢复的可能性。这样既减少了计算量，又防止了关键信息丢失，平衡了速度和精度。
- **领域归类**: [多模态] [模型效率]

- **深度解析**: 重点在于数据清洗策略、架构微调细节以及训练超参数的透明化。没有引入复杂的黑盒模块，而是通过优化现有扩散模型的训练流程和数据配比，达到了与闭源模型相当的效果，强调开源 reproducibility。
- **领域归类**: [计算机视觉，生成模型]

- **深度解析**: 针对 LLM 代理系统，该方法在提示词或上下文的特定位置嵌入特定技能指令。利用模型对位置信息的敏感性，使注入的技能在正常交互中不触发安全过滤，但在特定条件下被激活，揭示了代理系统的位置安全漏洞。
