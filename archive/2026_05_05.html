### 1. UniVidX: A Unified Multimodal Framework for Versatile Video Generation via Diffusion Priors (UniVidX：基于扩散先验的统一多功能视频生成框架)
- **社区热度**: `👍 65 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00658)
- **研究任务**: 视频生成
- **核心亮点**: 用一个模型搞定多种视频生成任务，直接复用扩散模型先验。
- **深度解析**: 不再为每个任务单独训模型，而是把文本、图像等不同条件统一编码，利用预训练扩散模型的权重作为初始化。通过调整注意力机制和条件嵌入，实现文生视频、图生视频等任务的切换，减少了重复训练成本。
- **领域归类**: [视频生成] [多模态] [扩散模型]
---

### 2. Web2BigTable: A Bi-Level Multi-Agent LLM System for Internet-Scale Information Search and Extraction (Web2BigTable：面向互联网级信息搜索与提取的双层多智能体 LLM 系统)
- **社区热度**: `👍 23 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.27221)
- **研究任务**: 信息搜索与提取
- **核心亮点**: 设计了双层智能体架构，能大规模地从网上抓取并结构化信息。
- **深度解析**: 上层智能体负责规划搜索路径和任务分解，下层智能体负责具体执行网页浏览和数据抽取。通过这种分工，解决了单个 Agent 在处理大规模网络数据时容易迷失或上下文溢出问题，最终输出结构化表格。
- **领域归类**: [智能体] [信息提取] [LLM 应用]
---

### 3. Map2World: Segment Map Conditioned Text to 3D World Generation (Map2World：基于分割地图条件的文本到 3D 世界生成)
- **社区热度**: `👍 10 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00781)
- **研究任务**: 3D 场景生成
- **核心亮点**: 用 2D 分割地图控制 3D 世界生成，布局更可控。
- **深度解析**: 传统文生 3D 很难控制物体位置。这篇论文引入语义分割地图作为条件输入，先把 3D 场景的布局在 2D 平面上定好，再生成 3D 几何和纹理。保证了生成场景的空间结构符合预期，适合游戏或仿真场景搭建。
- **领域归类**: [3D 生成] [AIGC] [条件生成]
---

### 4. Prox-E: Fine-Grained 3D Shape Editing via Primitive-Based Abstractions (Prox-E：基于原始抽象的细粒度 3D 形状编辑)
- **社区热度**: `👍 9 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.23774)
- **研究任务**: 3D 形状编辑
- **核心亮点**: 把 3D 形状拆成几何图元，实现细粒度编辑。
- **深度解析**: 直接编辑网格或体素很难精准控制局部。该方法先将 3D 模型抽象为一组基本几何图元（如立方体、圆柱），用户修改图元参数后再还原为高精度模型。解决了复杂形状局部修改难保持一致性的问题。
- **领域归类**: [3D 编辑] [几何处理]

### 8. Stable-GFlowNet: Toward Diverse and Robust LLM Red-Teaming via Contrastive Trajectory Balance (Stable-GFlowNet：通过对比轨迹平衡实现多样且鲁棒的 LLM 红队测试)

- **领域归类**: [LLM 安全] [生成模型] [红队测试]
