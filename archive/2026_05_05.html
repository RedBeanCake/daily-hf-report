### 1. MolmoAct2: Action Reasoning Models for Real-world Deployment (MolmoAct2：面向实际部署的动作推理模型)
- **社区热度**: `👍 109 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02881)
- **研究任务**: 具身智能动作生成与推理
- **核心亮点**: 在 Molmo 基础上强化动作推理能力，重点解决模型在真实物理环境部署的稳定性问题。
- **深度解析**: 主要针对现有视觉语言模型在控制机器人时动作不连贯的问题。作者在 Molmo 架构中增加了专门的动作推理头，优化了策略输出逻辑。通过引入仿真到现实的微调数据，减少了模型在真机操作时的失误率，使其更适合实际落地。
- **领域归类**: [具身智能, 机器人学, 多模态模型]
---

### 2. From Context to Skills: Can Language Models Learn from Context Skillfully? (从上下文到技能：语言模型能否熟练地从上下文学习？)
- **社区热度**: `👍 100 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.27660)
- **研究任务**: 上下文学习（ICL）能力评估
- **核心亮点**: 探究大模型是通过上下文真正学会了技能，还是仅仅在模仿表面模式。
- **深度解析**: 设计了一系列需要逻辑推理和技能迁移的测试任务，对比模型在不同上下文示例下的表现。研究发现模型在简单任务上表现像学会了，但在复杂技能迁移上仍依赖记忆匹配。论文提出了新的评估指标，用于区分真正的技能习得和表面模仿。
- **领域归类**: [大模型基础理论, 学习机制, 评估基准]
---

### 3. Repetition over Diversity: High-Signal Data Filtering for Sample-Efficient German Language Modeling (重复胜过多样：面向样本高效德语语言模型的高信号数据过滤)
- **社区热度**: `👍 12 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.28075)
- **研究任务**: 低资源语言数据清洗与建模
- **核心亮点**: 提出对于德语等低资源语言，高质量数据的重复训练比多样化数据更有效。
- **深度解析**: 针对德语语料不足的问题，对比了多种数据过滤策略。实验表明，去除噪声后，重复使用高信号密度的核心语料，能比使用多样化但含噪的数据更快地提升模型性能。该方法显著降低了训练所需的 token 数量，适合资源受限场景。
- **领域归类**: [数据工程, 自然语言处理, 低资源语言]
---

### 4. Persistent Visual Memory: Sustaining Perception for Deep Generation in LVLMs (持久视觉记忆：维持大型视觉语言模型深度生成中的感知能力)
- **社区热度**: `👍 11 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00814)
- **研究任务**: 多模态生成长上下文记忆
- **核心亮点**: 解决 LVLM 在生成长序列内容时丢失早期视觉信息的问题。
- **深度解析**: 在大型视觉语言模型中引入了一个持久视觉记忆模块。该模块能够缓存关键的视觉特征，并在生成过程的后续步骤中反复调用。这避免了模型随着生成步数增加而“忘记”输入图像细节，提升了长文本或多步生成任务的一致性。
- **领域归类**: [多模态模型, 计算机视觉, 生成式 AI]
---

### 5. OceanPile: A Large-Scale Multimodal Ocean Corpus for Foundation Models (OceanPile：面向基础模型的大规模多模态海洋语料库)
- **社区热度**: `👍 8 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00877)
- **研究任务**: 垂直领域数据集构建
- **核心亮点**: 发布了首个大规模海洋科学多模态数据集，填补领域空白。
- **深度解析**: 收集了包括卫星图像、水下传感器数据、科研论文文本在内的多种海洋相关数据。经过清洗和对齐，构建了一个标准化的训练语料库。旨在支持训练专门用于海洋监测、气候分析的基础模型，降低领域模型的训练门槛。
- **领域归类**: [数据集, 科学 AI, 多模态]
---

### 6. AcademiClaw: When Students Set Challenges for AI Agents (AcademiClaw：当学生为 AI 代理设定挑战时)
- **社区热度**: `👍 6 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02661)
- **研究任务**: AI 代理能力评估与人机交互
- **核心亮点**: 利用学生设计的复杂任务来测试 AI 代理在实际学术场景中的能力。
- **深度解析**: 传统的代理评测多由专家设计，可能脱离实际需求。该项目让大学生根据自己的学习难点设计任务挑战 AI。收集到的任务更具多样性和实际针对性，能更真实地反映代理在处理学术工作流时的鲁棒性和实用性。
- **领域归类**: [AI 代理, 评估基准, 人机交互]
---

### 7. ComboStoc: Combinatorial Stochasticity for Diffusion Generative Models (ComboStoc：扩散生成模型的组合随机性)
- **社区热度**: `👍 5 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2405.13729)
- **研究任务**: 扩散模型生成优化
- **核心亮点**: 通过引入组合随机性机制，改善扩散模型的生成多样性和质量。
- **深度解析**: 针对扩散模型在采样过程中随机性不足导致生成结果单一的问题，提出了一种组合随机性方法。在噪声调度或采样步骤中混合多种随机策略，增加了生成空间的探索能力。实验显示该方法在不增加太多计算成本的情况下，提升了生成样本的丰富度。
- **领域归类**: [生成式 AI, 扩散模型, 图像生成]
---

### 8. PhysicianBench: Evaluating LLM Agents in Real-World EHR Environments (PhysicianBench：在真实电子病历环境中评估大语言模型代理)
- **社区热度**: `👍 3 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02240)
- **研究任务**: 医疗领域 AI 代理评测
- **核心亮点**: 使用真实脱敏电子病历数据构建评测环境，而非合成数据。
- **深度解析**: 现有医疗评测多用虚构病例，无法反映真实系统复杂性。该基准接入真实的电子病历（EHR）系统接口，测试代理在读取病史、开具检查、诊断建议等流程中的表现。重点评估代理在处理不完整信息和遵循医疗规范方面的能力。
- **领域归类**: [医疗 AI, AI 代理, 评估基准]
---

### 9. T^2PO: Uncertainty-Guided Exploration Control for Stable Multi-Turn Agentic Reinforcement Learning (T^2PO：不确定性指导的稳定多轮代理强化学习探索控制)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02178)
- **研究任务**: 强化学习与多轮对话代理
- **核心亮点**: 利用不确定性估计来控制强化学习中的探索行为，防止多轮对话训练发散。
- **深度解析**: 针对多轮对话代理在强化学习训练时容易不稳定、奖励波动大的问题，改进了 PPO 算法。引入模型对当前状态的不确定性评分，动态调整探索步长。当模型不确定时减少激进探索，从而保证训练过程的收敛性和稳定性。
- **领域归类**: [强化学习, AI 代理, 对话系统]
---

### 10. Hierarchical Abstract Tree for Cross-Document Retrieval-Augmented Generation (用于跨文档检索增强生成的分层抽象树)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00529)
- **研究任务**: 检索增强生成（RAG）
- **核心亮点**: 提出分层树结构来组织跨文档检索内容，提升信息整合效率。
- **深度解析**: 传统 RAG 在处理多个文档时容易信息碎片化。该方法将检索到的文档片段构建成分层抽象树，上层为概要，下层为细节。生成模型沿树结构遍历，能更好地综合不同文档中的冲突或互补信息，提高回答的准确性和逻辑性。
- **领域归类**: [RAG, 自然语言处理, 信息检索]
---

### 11. Generative Modeling with Orbit-Space Particle Flow Matching (轨道空间粒子流匹配生成建模)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02222)
- **研究任务**: 生成模型优化
- **核心亮点**: 把流匹配过程映射到轨道空间，优化粒子传输路径。
- **深度解析**: 传统流匹配直接在数据空间做传输，这篇将传输过程投影到轨道空间，通过约束粒子轨迹减少路径弯曲，从而提升采样效率和生成质量。
- **领域归类**: [生成模型，流匹配]

### 12. Perceptual Flow Network for Visually Grounded Reasoning (用于视觉接地推理的感知流网络)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02730)
- **研究任务**: 多模态推理
- **核心亮点**: 设计了一种感知流机制，让推理过程更紧密地结合视觉特征。
- **深度解析**: 针对多模态模型推理时视觉信息利用不充分的问题，引入感知流网络，动态引导注意力聚焦于相关视觉区域，提升接地推理准确率。
- **领域归类**: [多模态，视觉推理]

### 13. Motion-Aware Caching for Efficient Autoregressive Video Generation (用于高效自回归视频生成的运动感知缓存)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.01725)
- **研究任务**: 视频生成加速
- **核心亮点**: 利用视频帧间运动信息复用 KV 缓存，减少重复计算。
- **深度解析**: 自回归视频生成计算量大，这篇通过检测帧间运动变化，动态决定哪些缓存可以复用，哪些需要重新计算，从而加速生成过程。
- **领域归类**: [视频生成，推理优化]
