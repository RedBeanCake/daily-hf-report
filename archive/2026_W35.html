    <h1>AI 技术周报 - 2026-W35</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 每周论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. InfinityEdit: Infinite Video Editing with a Lightweight Edit-Ignition Adapter (InfinityEdit：使用轻量级编辑触发适配器进行无限视频编辑)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20910)\n- **研究任务**: 无限视频编辑（Infinite video editing），即在给定前序视频片段和编辑请求的情况下，生成延续视频流并应用请求编辑的下一个片段，支持无界的编辑指令序列。\n- **核心亮点**: 提出了 InfinityEdit，一个轻量级的编辑适配器，包含三个注意力模块（历史交叉注意力、时间因果自注意力、编辑交叉注意力），使流式视频生成器具备无界编辑能力。推理时仅在编辑请求到达的块中激活适配器，后续块由原始模型生成并重置锚帧，从而在应用编辑的同时保留原始模型的无限生成能力。\n- **深度解析**: 现有的视频编辑方法多依赖固定时间跨度内的逐帧原地编辑，无法处理开放式的视频流（如直播游戏风格化或持续镜头的相机移动）。该研究将任务定义为“无限视频编辑”，解决了两个核心挑战：编辑必须是忠实的延续而非逐帧重写，且生成质量必须在编辑累积时保持稳定。通过设计数据收集管道和轻量级适配器，实现了在流式生成中动态、稳定地应用编辑。\n- **领域归类**: [计算机视觉, 视频生成与编辑, 多模态大模型]\n---\n\n### 2. Graph Engineering in the Era of LLM Agents: From Individual Intelligence to System Intelligence (LLM 智能体时代的图工程：从个体智能到系统智能)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21156)\n- **研究任务**: 提出并定义“图工程”（Graph Engineering）这一新兴范式，用于组织和协调下一代多智能体系统，以实现“系统智能”（System Intelligence）。\n- **核心亮点**: 指出随着任务复杂度的增加，单一智能体的个体智能达到瓶颈，必须转向系统智能。引入“图工程”范式，通过构建显式、动态、演进的图结构来表示任务、智能体和系统状态，为组织复杂目标、协调异构智能体、建模系统动态和实现可扩展的智能体演化提供统一基础。\n- **深度解析**: 论文回顾了 LLM 智能体从提示工程、上下文工程、工具工程到循环工程的演进。强调仅增强单个智能体无法解决架构不匹配问题，智能必须在系统层面进行分布和组织。图工程不同于以往优化个体交互的范式，它利用图结构来管理工作、协调异构智能体并维护不断演进的执行状态，是构建复杂、自适应多智能体系统的关键。\n- **领域归类**: [人工智能, 大语言模型, 多智能体系统, 图计算]\n---\n\n### 3. Let's Scale Step by Step: Compute-Efficient Hyperparameter Transfer for Large-Scale Mixture-of-Experts (让我们逐步扩展：大规模混合专家模型的计算高效超参数迁移)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20061)\n- **研究任务**: 在模型规模和 Token 预算极大的情况下，为大规模混合专家（MoE）模型寻找最优学习率等超参数，解决全量搜索计算成本过高的问题。\n- **核心亮点**: 提出了一种计算高效的两步超参数迁移框架。首先，针对使用多头潜在注意力（MLA）和 Muon 优化器的 MoE 架构，制定了最大更新参数化（μP）适配，证明最优学习率在不同宽度缩放的模型间一致迁移。其次，通过建立预测性缩放定律，将这种迁移性沿 Token 维度扩展，利用小代理模型在有限预算下的线性回归，高保真地外推至海量训练范围（如 10 万亿 Token，R²=0.95）。\n- **深度解析**: 训练超大规模 MoE 模型时，超参数（尤其是学习率）的网格搜索成本极其高昂。该研究通过理论推导和实验验证，证明了在小规模代理模型上确定的最优学习率可以准确迁移到全尺寸目标模型。该方法在预训练一个拥有 1550 亿总参数、170 亿激活参数的基础模型时得到了应用，以极小的消融成本实现了稳定的训练和评估结果，大幅降低了大规模模型训练的试错成本。\n- **领域归类**: [机器学习, 大语言模型训练, 混合专家模型 (MoE), 超参数优化]\n---\n\n### 4. ParaTempo: Efficient Parallel Reasoning via Temporal Confidence (ParaTempo：通过时间置信度实现高效并行推理)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.16425)\n- **研究任务**: 优化大型推理模型的并行推理过程，在探索多条解题路径以提高准确性和鲁棒性的同时，降低随推理深度和分支数量增加而增长的计算成本。\n- **核心亮点**: 提出了一种无需训练的异步并行推理框架 ParaTempo，由“时间置信度”（temporal confidence）驱动。这是一种分支局部的答案空间收敛度量。当积累足够证据时，ParaTempo 利用该信号进行控制：剪枝低置信度分支，提前退役持续提交主导答案的分支，将释放的计算资源重新分配给新分支，并在置信度加权投票集中时全局停止生成。\n- **深度解析**: 现有的并行推理管理方法通常依赖最终答案共识、局部 Token 置信度或孤立的中间探测，这些信号往往存在延迟、与推理进度关联弱或噪声过大的问题。ParaTempo 通过定期探测分支的暂定答案概率分布，量化近期中间探测对主导答案的集中程度。该方法无需推理轨迹间的同步，即可自适应地分配计算资源。在数学和科学推理基准上的实验表明，它在保持竞争力的准确率的同时，平均延迟降低了 21.8-32.2%，总 Token 使用量减少了 18.1-30.3%。\n- **领域归类**: [自然语言处理, 大语言模型推理, 并行计算, 搜索策略]\n---\n\n### 5. OmniAssistBench: Assistant-style Interaction Benchmark for Omni-LLMs (OmniAssistBench：面向全模态大语言模型的助手式交互基准测试)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21360)\n- **研究任务**: 评估全模态大语言模型（Omni-LLMs）作为实时视频助手的能力，即持续感知环境并引导用户实现特定目标，解决静态离线数据集无法评估动态交互路径的问题。\n- **核心亮点**: 引入了 OmniAssistBench 基准测试。为解决同一用户目标可通过多种方法实现导致交互路径发散的问题，为模型提供源自源视频的预定义先验，要求其引导用户沿着完全相同的路线进行。由于真实的交互视频稀少，通过逆向工程现有互联网视频构建数据集，推断逻辑用户目标并将视频分割为多轮片段以模拟连续交互。该严谨的流程耗费了超过 1000 个专家工时。\n- **深度解析**: 传统的被动视频理解无法评估交互式助手的主动帮助能力。OmniAssistBench 填补了这一空白。评估结果显示，闭源的 Gemini-3-Pro 得分 66.4（满分 100），开源的 Qwen3-Omni-Instruct 得分 51.2。尽管当前模型通常能理解用户输入，但它们经常提供错误或不完整的答案，特别是在处理视觉提示（如手势）、在多轮交互中维持历史上下文以及延迟响应直到目标事件发生等方面存在明显不足，表明距离成为可靠的助手还有很大提升空间。\n- **领域归类**: [计算机视觉, 多模态大模型, 视频理解, 基准测试与评估]\n---\n\n### 6. Every Coin Has Two Sides: On the Dual Nature of Generalization in On-Policy Distillation of Large Language Models (硬币都有两面：大语言模型在策略蒸馏中泛化的双重性质)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.16647)\n- **研究任务**: 研究大语言模型在策略蒸馏（On-policy distillation, OPD）中的泛化行为，理解其在域内分布偏移、跨域迁移和多教师设置下的表现。\n- **核心亮点**: 发现 OPD 转移的是教师的推理行为而非特定问题的答案：训练难度几乎不重要，甚至教师从未解决的问题也是有用的。迁移强烈依赖于教师和学生的起源关系：同源对能在语言、推理范围甚至其他领域使学生接近教师，而跨源对主要拟合训练分布。这种广泛的泛化是一把双刃剑：由于将提示路由到领域专家无法限制每个教师的影响，组合它们会在其能力之间产生依赖于混合的“跷跷板”效应。\n- **深度解析**: 现有的 OPD 研究多在单一领域和接近训练数据的基准上评估，对其泛化行为理解不足。本文通过控制变量法进行了一项受控研究。研究揭示了 OPD 泛化的条件，并提供了诊断多教师 OPD 的有用视角。指出在多教师设置下，由于无法隔离各个教师的影响，简单组合多个领域专家模型会导致能力上的相互制约（跷跷板效应），这为理解和优化多教师蒸馏策略提供了重要指导。\n- **领域归类**: [自然语言处理, 大语言模型, 知识蒸馏, 模型泛化]\n---\n\n### 7. EviRank: Structured Relevance Evidence for Multimodal Image Re-ranking (EviRank：用于多模态图像重排的结构化相关性证据)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20886)\n- **研究任务**: 解决现实世界中多模态和组合式图像搜索查询（如“找这件粉色的衬衫”）的重排问题，将多模态图像重排重新定义为语义约束满足问题。\n- **核心亮点**: 提出 EviRank，将任何查询（纯文本、纯图像或组合）解析为统一的证据包：跨越六个语义槽（如实体、属性、关系）的类型化标准，每个标准标记为必需、禁止或可忽略。重排过程简化为基于证据的验证，结合了确定性的评分标准和基于证据的列表级比较，这是一种无需训练的单一程序。显式证据还可作为结构化监督信号，用于可选地蒸馏一个轻量级学生模型。\n- **深度解析**: 现有的重排器要么将多方面的相关性压缩为不透明的嵌入，要么依赖容易遗漏或幻觉细粒度约束的自由形式思维链。EviRank 借鉴了 NLP 中基于评分标准和检查表的评估方法，通过显式的结构化证据来解决这一问题。在跨越文本到图像、图像到图像和组合图像检索的五个基准测试中，EviRank 达到了最先进（SOTA）的性能，并且蒸馏后的学生模型在成本大幅降低的情况下保留了教师模型 90% 以上的能力。\n- **领域归类**: [计算机视觉, 信息检索, 多模态学习, 图像重排]\n---\n\n### 8. Beyond Correctness: Benchmarking and Aligning Response Behaviors in Hybrid-Thinking MLLMs (超越正确性：混合思考多模态大语言模型中响应行为的基准测试与对齐)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12781)\n- **研究任务**: 评估和对齐混合思考多模态大语言模型（MLLMs）在“深思熟虑思考”和“非思考推理”两种模式下的响应行为，解决非思考模式下响应模式失败率较高导致的系统性不对齐问题。\n- **核心亮点**: 引入了 PatternEval，一个包含 2415 个多模态提示的故障丰富诊断基准，测试四种反复出现的故障：思维链泄漏、响应重复、逻辑矛盾和表演性推理。基于此诊断，开发了响应级奖励模型 PatternRM 和 PatternRL，在强化学习过程中引入特定于模式的惩罚。在 Qwen3-VL-4B 和 Qwen3-VL-8B 上的实验表明，结合特定模式惩罚的强化学习可以减轻跨模式不对齐，同时仅带来微小的任务性能权衡。\n- **深度解析**: 混合思考 MLLM 允许在单一模型中交替使用深思熟虑和非思考推理。虽然推理预算不同，但交付的响应应满足相同的面向用户的标准。仅靠正确性不足以表征响应质量。研究发现，不同提供商的模型中普遍存在响应模式故障，且非思考推理的故障率明显更高。PatternEval 和 PatternRL 提供了一个评估和训练框架，用于在混合思考接口中对齐用户可见的响应模式，提升了模型在实际应用中的可靠性和一致性。\n- **领域归类**: [多模态大模型, 强化学习, 模型对齐, 基准测试与评估]\n---\n\n### 9. UniSpace: Unified Visual Representation and Scalable Multimodal Modeling (UniSpace：统一的视觉表示与可扩展的多模态建模)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08676)\n- **研究任务**: 探索是否可以在由预训练语义 ViT 构建的单一视觉表示空间中对理解、生成和编辑进行建模，解决语义视觉编码器最终 Token 丢弃细粒度视觉细节导致像素重建差的问题。\n- **核心亮点**: 发现冻结的语义 ViT 的 Transformer 块并非本质上无法保留视觉细节，而是原始的 Patch 参数化驱使表示走向语义抽象。基于此，引入“Patch 重参数化”（Patch Reparameterization），在保留原始语义路径的同时，添加一个感知重建的 Patch 嵌入，为相同的冻结 ViT 块提供细粒度视觉信息。进一步将该表示扩展为 UniSpace，一个 80 亿参数的 Transformer 专家混合（Mixture-of-Transformer-Experts）模型，在同一个视觉空间中执行理解、生成和编辑，无需单独的 VAE 路径。\n- **深度解析**: 语义视觉编码器是多模态理解和图像生成语义调节的核心接口，但其在重建敏感任务中表现不佳。本文通过 Patch 重参数化技术，使得重参数化后的预训练 ViT 能够作为统一视觉接口。系统级评估证明了其在文本到图像生成和基于指令的图像编辑方面的实用性，展示了在不牺牲多模态理解能力的情况下，实现高保真图像重建和有利于重建-生成权衡的可扩展多模态建模。\n- **领域归类**: [计算机视觉, 多模态大模型, 图像生成与编辑, 视觉表示学习]\n---\n\n### 10. AgentMercury: Your Agent Can Synthesize Verifiable Environments for Business Scenarios at scale (AgentMercury：你的智能体可以大规模合成面向业务场景的可验证环境)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20634)\n- **研究任务**: 解决智能体训练环境通常围绕预定义任务和基准构建、难以扩展以反映现实和不断演变的业务工作流的问题，提出一种从高级业务场景大规模合成可执行环境的框架。\n- **核心亮点**: 引入 AgentMercury，一种可扩展的框架，用于从高级业务场景合成可执行环境。它不针对特定任务构建环境，而是首先实例化一个包含实体、服务、工具、状态和可执行跨服务不变量的持久世界，随后从中涌现出多样化的任务和交互轨迹。构建了跨越 14 个行业和 50 个国家的 4783 个可执行环境，并将其用作强化学习的训练基质。\n- **深度解析**: 传统的以任务为中心的环境构建范式限制了智能体在真实业务场景中的泛化能力。AgentMercury 通过生成面向业务的环境，为强化学习提供了丰富且通用的学习信号。实验表明，在这些环境中训练的策略在企业工作流和跨域基准上均有显著提升（例如 Qwen3.5-4B 在 EnterpriseOps-GYM 上从 12.3 提升至 15.7，在 AIME26 上从 45.9 提升至 56.0）。此外，研究还证明环境构建过程本身是可以学习的，通过在构建轨迹上微调 Qwen3.5-35B-A3B，可执行世界创作的成功率从 3.3% 大幅提升至 83.3%。\n- **领域归类**: [人工智能, 智能体 (Agents), 强化学习, 环境合成与模拟]\n---\n\n### 11. Towards Faithful Simulation of Human Shopping Behavior (迈向忠实的人类购物行为模拟)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20707)\n- **研究任务**: 在电商场景中模拟逼真的用户购物行为，以支持离线评估和强化学习。\n- **核心亮点**: 提出了 RecVerse，一个基于 GUI 的模拟代理，通过截图感知页面并生成忠实的多轮轨迹。采用认知启发的分层记忆（工作记忆、情景记忆、偏好记忆）解决记忆挑战；采用轨迹级强化学习（RL）目标解决优化挑战。同时发布了 USB（用户模拟基准），一个用于多轮用户模拟的交互式电商 GUI 轨迹数据集。\n- **深度解析**: 现有的 LLM/VLM 模拟器在重现真实浏览会话时面临两大挑战：记忆挑战（长程观察历史难以处理）和优化挑战（逐步监督导致过度探索或过度被动等不真实模式）。RecVerse 将记忆更新视为动作，让代理自适应学习记忆时机和内容；通过轨迹级 RL 对齐宏观动作类型分布和微观购物意图。实验表明 RecVerse 在行为保真度和意图一致性上显著优于现有基线，但摘要未提供具体的实验指标数字。\n- **领域归类**: [电子商务, 强化学习, 智能体模拟, 多模态大模型]\n---\n\n### 12. Human-Centric Intelligence in the Era of Foundation Models: A Survey (基础模型时代的人类中心智能：综述)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18184)\n- **研究任务**: 弥合人类中心智能与基础模型之间的鸿沟，梳理和重构基础模型时代的人类中心智能研究框架。\n- **核心亮点**: 引入了一个全谱人类上下文分类法，将人类视为通过视觉外观和空间几何观察的主体、通过运动动力学和交互建模的动态参与者、以及通过世界模拟和具身代理的情境化代理，整合了六个相互关联的层次。系统回顾了方法基础、数据族、计算架构范式及训练推理优化策略。\n- **深度解析**: 该综述指出人类中心智能尚未完全与基础模型融合以取得可比进展，且研究在任务、模态和社区间呈碎片化。文章不仅提供了连贯的框架和实用参考，还讨论了迈向可扩展、可信、物理接地气和可部署的人类中心智能的开放挑战和未来方向，并在项目页面提供了持续更新的文献和资源集合。摘要未提供具体的实验结果或数字。\n- **领域归类**: [计算机视觉, 综述, 人类中心智能, 基础模型]\n---\n\n### 13. Llama-Mobile: Efficient 2.7-Bit Quantization of VLMs (Llama-Mobile：视觉语言模型的高效2.7位量化)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21134)\n- **研究任务**: 在资源受限的移动硬件上实现视觉语言模型（VLM）的高效推理部署。\n- **核心亮点**: 提出了一种 VLM 量化框架，结合了一种利用模型自身生成训练数据且无需访问训练设置的量化流水线，以及一种支持在 Arm CPU 上高效执行的新型 2.7位/参数 格式。\n- **深度解析**: 该方法将 Llama 3.2 11B Vision Instruct 模型压缩至 3.7 GB（使用 8位 激活），并在标准视觉问答任务集上保持了强劲的性能。摘要未提供具体的准确率等实验数字。\n- **领域归类**: [模型压缩, 量化, 视觉语言模型, 移动端部署]\n---\n\n### 14. Daedalus-150M: A Convolution-Attention Hybrid Designed for CPU Inference (Daedalus-150M：专为CPU推理设计的卷积-注意力混合模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20210)\n- **研究任务**: 设计一种专为普通 CPU、单用户、单 Token 生成、4位权重场景优化的小型语言模型架构。\n- **核心亮点**: 采用卷积-注意力混合架构，18个块中仅6个保留全注意力，其余12个使用短卷积（内存宽度仅为两个时间步），使得三分之二的网络无需重新读取不断增长的缓存。在 59.9B tokens 上从头训练。\n- **深度解析**: 模型在五任务基准上得分 47.31（预设基准线为 42.20），超越了使用多3到6倍数据训练的 GPT-2 124M 等模型，并超过了处理过万亿 tokens 的 MobileLLM-125M。验证 bits-per-byte 为 0.8685。与同规模全注意力模型相比，混合模型在质量指标上高出 0.81%，4位文件小 6.3%，在 2048 上下文下解码速度快 1.76倍（对比外部相似模型快 2.08倍）。速度优势随上下文长度增加而增加（简单的带宽计算仅预测 1.17倍，说明不仅是内存体积的原因）。作者还报告了未成功的尝试：未缓解的 4位质量成本、约一半卷积通道失效且无法移除、以及超出模型规模所需的词表大小。\n- **领域归类**: [模型架构, 小型语言模型, CPU推理, 卷积神经网络]\n---\n\n### 15. CLEAR: Continuous Latent Adapter Routing for Utility-Preserving LLM Safety Alignment (CLEAR：用于保留效用的LLM安全对齐的连续潜在适配器路由)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.21278)\n- **研究任务**: 解决大语言模型（LLM）安全对齐过程中因全局应用安全微调而导致的模型效用下降问题。\n- **核心亮点**: 提出 CLEAR，一种条件安全适应框架，使用轻量级隐藏状态门连续控制安全低秩适配器的激活强度，旨在减少有害补全的同时避免对冻结主干网络进行不必要的更改。\n- **深度解析**: 在 Llama-3-8B-Instruct 上，CLEAR 将 HarmBench 的攻击成功率（ASR）从 32.3% 降至 0.5%，同时保留了基础模型的大部分效用，并在 GSM8K 上实现了比全局 SFT 或 LoRA 高出 7.1个百分点 的准确率。摘要未提供其他基准的具体数字。\n- **领域归类**: [大语言模型, 安全对齐, 模型微调, 模型效用]\n---\n\n### 16. FlavourBench: Ranking Frontier Language Models with Executable Culinary Ground Truth (FlavourBench：使用可执行的烹饪真实数据对前沿语言模型进行排名)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20574)\n- **研究任务**: 引入一种自动化的基准测试方法，通过提供密集、可执行的烹饪真实数据（Ground Truth）来评估和排名前沿语言模型，避免依赖人类偏好或脆弱的精确匹配。\n- **核心亮点**: 每个任务提供 8 种食材，要求模型选择 3 种食材组合。在模型执行前，Epicure 系统对所有 56 种可能的组合进行评分。评估了 27 个前沿端点，每个模型在每个面板和家族中恰好有 89 个有效响应（总计 14,418 个模型-任务单元格）。\n- **深度解析**: FlavourBench Score 是冻结任务分数的等家族平均值。使用 50,000 次锚点聚类 bootstrap 重复进行同步 95% 分数带，并使用 100,000 次符号翻转抽取进行 351 对模型对比。两个独立编译的面板相关性为 r = 0.89（秩 rho = 0.80）。Grok 4.6 的点估计值最大，为 65.1（同步 95% CI 61.0-69.2）；351 对模型中有 101 对被解决。发布了提示词、组合分数图、原始响应等完整数据。摘要未提供其他具体模型的得分数字。\n- **领域归类**: [模型评估, 基准测试, 语言模型, 自动化评估]\n---\n\n### 17. Partition the Support, Reconstruct the Residual: Training-Free Sparse Attention for Video Generation and World Models (划分支持域，重构残差：用于视频生成和世界模型的免训练稀疏注意力)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18484)\n- **研究任务**: 通过免训练的块稀疏注意力加速视频 Transformer，同时解决行级注意力集中无法直接指定可执行稀疏算子的问题。\n- **核心亮点**: 提出 SparsePR，结合了响应耦合划分（Response-Coupled Partitioning）和探针拟合残差重构（Probe-Fitted Residual Reconstruction）。利用采样查询的键响应形成配对的 K/V 组，其质心诱导共享路由的查询-响应坐标。\n- **深度解析**: 一小部分精确查询行校准了从探针残差中观察到的输出子空间内的特定调用仿射校正。在四个异构视频生成和世界模型中，SparsePR 一致地减少了注意力重构误差。消融实验表明探针拟合占据了大部分误差减少。SparsePR 在 22.0-26.0% 的实际执行对密度下保持了生成质量，并实现了 1.48x-2.61x 的端到端加速。摘要未提供具体的视频生成指标数字。\n- **领域归类**: [注意力机制优化, 视频生成, 世界模型, Transformer加速]\n---\n\n### 18. Hadith computational science in the age of large language models: a critical narrative review (大语言模型时代的圣训计算科学：批判性叙事综述)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.20364)\n- **研究任务**: 批判性地审查大语言模型（LLM）、检索管道和 Transformer 模型如何重塑圣训（Hadith）计算科学，评估现有进展的稳健性并指出未解决的问题。\n- **核心亮点**: 结合对现有综述的批判、代表性原始研究的论文级评估，以及伊斯兰学者和领域专家对真实性、权威性和负责任使用的观点综合。指出数据资源扩大、分割任务成熟，但受限于狭窄语料库、基准可比性弱等问题。\n- **深度解析**: 文章认为圣训计算不应仅被视为孤立的模型性能问题，而应作为需要知识整合、溯源和专家监督的证据基础设施问题。指出了超越主流基准的重要空白，如非经典语料库、注释文献、与古兰经的跨源链接等，并定义了使该领域在方法论上更强大、对伊斯兰学术更有用的研究议程。摘要未提供具体的实验结果或数字。\n- **领域归类**: [自然语言处理, 综述, 领域应用(人文学科), 大语言模型]\n---\n\u003c/details\u003e\n\n"</script>
