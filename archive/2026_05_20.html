- **深度解析**: 针对 Agent 技能杂乱难管的问题，设计了 SkillsVote 机制。系统不仅负责收集技能，还通过投票机制评估技能质量进行推荐，并在使用反馈中自动演进技能库。重点是解决了技能冗余和过时问题，让 Agent 能动态维护自己的工具集。

- **深度解析**: 长视频生成主要瓶颈在显存和算力。这篇论文利用 NVIDIA 的 FP4 精度格式，重构了并行计算基础设施。通过在底层算子上支持低精度并行，在不明显损失画质的前提下，大幅提升了长序列视频生成的吞吐量和长度上限。
- **领域归类**: [Video Generation], [Infrastructure], [Quantization]

- **深度解析**: 传统多模态模型往往针对不同任务单独微调。Lance 设计了一个统一架构，利用多任务之间的协同效应（Synergy），让视觉、语言等任务在共享参数中互相促进。结果是减少了对特定任务数据的依赖，提升了模型在未见任务上的泛化能力。
- **领域归类**: [Multimodal], [Model Architecture], [Multi-task Learning]
