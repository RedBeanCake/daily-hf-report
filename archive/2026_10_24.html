    <h1>前沿科研情报 - 2026-10-24</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. WeVisOne-VL: Unified Visual Perception from Objects to Pixels (WeVisOne-VL：从对象到像素的统一视觉感知)\n- **社区热度**: `👍 220 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31329)\n- **研究任务**: 统一对象级和像素级的视觉感知，支持多种视觉任务（如目标检测、指代定位、计数、OCR、分割和抠图），实现从点、框到掩码和 alpha 抠图的任意粒度定位。\n- **核心亮点**: 通过特殊的 `\u003cOBJ\u003e` token 将轻量级像素解码器集成到视觉语言模型（VLM）中，生成实例级像素输出；采用三阶段课程监督微调（SFT）结合混合任务强化学习（RL）进行训练。\n- **深度解析**: 该模型旨在解决现有 VLM 在细粒度视觉感知方面不可靠的问题。在 30 多个基准测试中表现出领先性能，并对对象缺失的查询保持稳健的拒绝能力。摘要未提供具体的实验结果数字、数据集名称或详细的技术参数。\n- **领域归类**: [计算机视觉, 视觉语言模型, 图像分割, 目标检测]\n---\n\n### 2. Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation (让 MLLM 潜在特征发挥作用：用于电影级视频生成的因子感知预测学习)\n- **社区热度**: `👍 162 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30926)\n- **研究任务**: 电影级视频生成，具体包括从稀疏输入到视频的生成、因子感知编辑以及多镜头生成。\n- **核心亮点**: 提出因子感知预测学习（FAPL）框架，通过三个互补的学习信号（潜在生成器接地、因子感知控制、时间推理）有效利用多模态大语言模型（MLLM）的潜在特征。\n- **深度解析**: 摘要未提供具体的实验结果数字或数据集名称。技术细节包括：首先使用冻结的 MLLM 和连接器训练视频扩散 Transformer (DiT) 以强化对 MLLM 潜在特征的使用；其次通过成对视频和因子跨度替换训练 DiT 实现因子感知控制；最后冻结 DiT，通过文本和完整视频观察优化 MLLM 和连接器以实现时间推理。\n- **领域归类**: [视频生成, 多模态大语言模型, 扩散模型]\n---\n\n### 3. Deep Search in Real-World Web Environments (真实世界 Web 环境中的深度搜索)\n- **社区热度**: `👍 147 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30181)\n- **研究任务**: 评估智能体在真实、开放的 Web 环境中执行多步深度搜索，自主探索、发现并连接多个独立来源的证据，最终得出唯一事实答案的能力。\n- **核心亮点**: 构建了 OpenDS-World 基准，包含 200 个跨越多种信息模态、异构文件格式和交互式访问要求的挑战性任务，并经过独立人工验证以确保证据有效性和答案唯一性。\n- **深度解析**: 在统一工具环境和执行协议下评估了 12 个前沿模型。最佳模型准确率为 39.0%，而人类在 1000 次独立尝试中的准确率为 21.1%。分析揭示了不同模型在研究策略、工具协调和长视野搜索管理方面存在显著差异和持续挑战。摘要未提供具体的数据集名称（除 OpenDS-World 外）或更详细的技术细节。\n- **领域归类**: [智能体, 网页交互, 信息检索, 基准测试]\n---\n\n### 4. Editing Images into Reusable Layers via Compositional Edit-Prior Distillation (通过组合编辑先验蒸馏将图像编辑为可重用图层)\n- **社区热度**: `👍 73 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24738)\n- **研究任务**: 高质量图像编辑，具体为在修改目标区域的同时保留无关区域内容，并生成可重用的 RGBA 图层，支持灵活的图层级操作和多图层分解。\n- **核心亮点**: 提出 LayerEditor 统一框架，核心是上下文 RGB-Alpha Token 建模；提出组合编辑先验蒸馏以保留预训练模型的编辑能力；构建了包含 10 万对图像编辑及有序 RGBA 图层注释的大规模数据集 LayerEditor-100K。\n- **深度解析**: 摘要未提供具体的实验结果数字。技术细节包括：在单一 token 序列中联合表示编辑后的画布和有序的 RGB-Alpha 图层序列，实现语义编辑和对单个图层内容的显式控制。通过蒸馏将编辑先验转移到编辑画布和由预测图层组成的图像上。\n- **领域归类**: [计算机视觉, 图像编辑, 图像生成, 图层分解]\n---\n\n### 5. IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems (IQuest-Q1：提升代理 CLI 系统的基础能力)\n- **社区热度**: `👍 53 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30949)\n- **研究任务**: 开发用于代理命令行界面（CLI）系统的基础模型，增强其在编码和通用任务上的能力。\n- **核心亮点**: 提出 IQuest-Q1，一个总参数 320B、激活参数 15B 的稀疏混合专家（MoE）模型；采用三阶段训练流程（稳定预训练、细粒度中期训练、多脚手架多版本后训练）并结合模型合并技术。\n- **深度解析**: 摘要未提供具体的实验结果数字或数据集名称。技术细节包括：预训练结合 Stable SplitNorm、Muon 和 muP，并在第二阶段增加编码数据混合；中期训练扩展数据混合并渐进式扩展上下文；后训练结合 SFT、领域专用 RL 和 MOPD。模型合并技术用于整合不同阶段的专家和检查点，同时减轻参数更新之间的冲突。\n- **领域归类**: [大语言模型, 混合专家模型 (MoE), 代码生成, 智能体]\n---\n\n### 6. Toward Recursive Self-Improvement in Physical AI (迈向物理 AI 的递归自我改进)\n- **社区热度**: `👍 45 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29677)\n- **研究任务**: 探索和研究物理 AI（如机器人学习）中的递归自我改进（RSI）机制，即系统不仅改进其行为，还改进其改进自身的过程。\n- **核心亮点**: 将递归自我改进（RSI）的概念从数字代理引入物理世界（机器人学习），综合现有研究并提出评估原则与未来研究方向。\n- **深度解析**: 摘要未提供具体的实验结果数字或数据集名称。文章指出，物理 RSI 需要通过代价高昂的试验从部分观察中学习，并考虑不断变化的操作条件和潜在的不可逆后果。收益的传递取决于反馈是否解决学习需求、接收组件是否能利用变化、价值是否在任务或硬件变化中存活，以及持续练习是否安全且负担得起。现有研究主要集中在操作领域，但尚未分离出可归因于递归的收益。\n- **领域归类**: [机器人学习, 物理 AI, 递归自我改进, 综述/观点]\n---\n\n### 7. Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models (深度融合记忆：大语言模型的块级参数记忆)\n- **社区热度**: `👍 38 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25100)\n- **研究任务**: 为大语言模型设计有效的参数化外部记忆架构，以获取和利用预训练之外的外部知识，避免灾难性遗忘和推理时检索的开销。\n- **核心亮点**: 提出深度融合记忆（DFM）架构，采用块级参数记忆；通过因果记忆预测器和门控交叉注意力将记忆融合到中间隐藏状态；大幅减少了构建训练数据所需的检索查询和检索项数量。\n- **深度解析**: 在 6 个问答（QA）任务上，DFM 在 Mistral-7B-v0.3 上比最强基线提升 12.71%，在 Qwen3-8B-Base 上提升 11.19%。在领域适应方面，相比 Qwen3-4B-Base 和 Qwen3-8B-Base 分别平均提升 6.51 和 4.38 分。技术细节上，DFM 仅需现有方法 1/32 的检索查询和 1/2048 的检索项来构建训练数据，且推理时无需显式检索。摘要未提供具体的数据集名称。\n- **领域归类**: [大语言模型, 参数化记忆, 知识检索, 问答系统]\n---\n\n### 8. What Generation Knows: Unlocking Fine-Grained Understanding in Unified Multimodal Models (生成所知何事：解锁统一多模态模型中的细粒度理解)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23987)\n- **研究任务**: 提升统一多模态模型（UMMs）在细粒度视觉理解方面的能力，区分局部属性和空间关系中的微小差异。\n- **核心亮点**: 提出 GAFU 后训练框架，直接利用原生生成侧表示来增强细粒度理解；将生成侧视觉表示压缩为紧凑的 \\(G\\) tokens，使理解路径能够进行任务条件检索。\n- **深度解析**: 研究发现生成侧表示对细粒度语义变化更敏感，能捕捉理解侧遗漏的任务相关变化，并依赖于正确的空间组织。在 VStar-Bench、OmniSpatial 和 VSR-Bench 上，GAFU 相比相同数据训练的 SFT 基线，最大相对提升分别为 20.00%、17.94% 和 8.62%。摘要未提供具体的数据集构建细节或其他技术细节。\n- **领域归类**: [多模态大语言模型, 细粒度视觉理解, 视觉语言模型]\n---\n\n### 9. LaLa-World: Scaling Latent World Models with Natural Language Actions (LaLa-World：使用自然语言动作扩展潜在世界模型)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27851)\n- **研究任务**: 构建跨多种领域和数据源的潜在世界模型（LWMs），用于基于想象的规划和下游策略微调。\n- **核心亮点**: 提出 LaLa-World（语言条件潜在世界模型），使用自然语言同时描述数值动作和视觉变化，实现异构数据集的联合训练；基于语言模型构建预测器。\n- **深度解析**: 与基于 RAEv2 的视频生成模型基线相比，LaLa-World 在达到相当规划性能的同时，训练成本减少了 6 倍，规划速度快了 13.9 倍。其衍生模型 LaLa-Policy 在 LIBERO 和 RoboCasa 数据集上的表现与 Cosmos Policy 具有竞争力，且推理速度最快提升 5.5 倍。摘要未提供具体的准确率数字或其他技术细节。\n- **领域归类**: [机器人学习, 世界模型, 强化学习, 语言条件模型]\n---\n\n### 10. Meta Expert: Cross-Layer Expert Sharing for Storage- and Retrieval-Efficient MoE (Meta Expert：面向存储与检索高效 MoE 的跨层专家共享)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27598)\n- **研究任务**: 优化稀疏激活的混合专家（MoE）模型架构，解决不同层专家之间存在的存储内容相似性和冗余问题，提高存储和检索效率。\n- **核心亮点**: 提出跨层共享的 Meta Expert 架构，替代传统的分层局部专家（Local Expert）；在保持激活数量和专家粒度不变的情况下，仅使用 70%--80% 的专家即可匹配 Vanilla MoE 的性能。\n- **深度解析**: 摘要未提供具体的实验结果数字（如准确率提升百分比）或数据集名称。技术细节与理论分析表明，Meta Expert 模型表现出更低的参数冗余、更低的交叉熵损失和更高的下游任务准确率。此外，与局部专家相比，Meta Expert 为隐藏状态提供了更灵活的残差路径，从而提高了信息检索效率。\n- **领域归类**: [大语言模型, 混合专家模型 (MoE), 模型架构优化, 参数效率]\n\n### 11. Policy-Mask: Budget-Aware Adaptation of Diffusion Features to Discriminative Tasks (Policy-Mask：面向判别任务的预算感知扩散特征自适应)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28889)\n- **研究任务**: 从冻结的扩散模型中选择中间特征，用于分割、分类和语义对应等下游判别任务。\n- **核心亮点**: 提出 Policy-Mask 方法，在给定通道预算的条件下，联合选择时间步、网络块和通道子集；通过按子集基数归一化通道得分贡献，解决了特征维度增长导致的梯度主导问题，稳定了联合训练；该方法还可适配 PixArt-Σ 和 SD3.5 MMDiT 等扩散 Transformer 架构。\n- **深度解析**: 现有方法通常依赖人工固定选择或仅优化少数超参数。Policy-Mask 训练了一个预算条件策略来联合优化三个维度的选择。在匹配预算下，该方法在 ADE20K（38.9 mIoU）、CIFAR-100（128维下 75.4% top-1）和 SPair-71k（76.3 PCK@0.1）上均超越了固定提取和特征过滤基线。消融实验表明，块选择对下游精度有实质性影响，且保留 256 个通道是紧凑扩散表征的一个实用操作点。\n- **领域归类**: [计算机视觉, 扩散模型, 特征提取]\n---\n\n### 12. Self-Distilling Future Video Representations for World Action Models (FRED：面向世界动作模型的自蒸馏未来视频表征)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30320)\n- **研究任务**: 利用预训练视频扩散模型学习通用机器人策略（世界动作模型 WAMs），提高单步去噪提取的未来视频表征质量，从而提升动作预测的准确性。\n- **核心亮点**: 提出 FRED 框架，利用自蒸馏技术从噪声中预测未来表征，并以真实未来观测提取的表征作为目标；引入历史观测作为时间上下文条件，帮助更好地预测未来表征。\n- **深度解析**: 现有的 WAMs 通过在单步去噪的中间未来视频表征上调节动作解码器来提高推理效率，但这使得动作预测直接依赖于这些表征的质量。FRED 显著提升了单步去噪表征的质量。在真实操作场景中，FRED 在长视野和零样本域外任务上增益显著；在仅通过人类视频演示（机器人训练数据中缺失）的任务中，其人机技能转移任务成功率达到 50.0%，远超最佳对比基线的 19.4%。\n- **领域归类**: [机器人学习, 视频生成, 世界模型]\n---\n\n### 13. Heartbeat Thinking: Speculative Reasoning and Tool Execution While Listening in Realtime Voice Agents (Heartbeat Thinking：实时语音智能体在聆听时的推测性推理与工具执行)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26233)\n- **研究任务**: 解决使用工具的语音智能体在用户语音结束后仍需等待的问题，利用语音过程中的部分信息进行提前计算和工具调用。\n- **核心亮点**: 提出 Heartbeat Thinking 范式，通过新的 Thinker 调用处理更新输入，同时允许正在进行的调用和已分派的工具继续执行；定期调用读取最新部分转录和共享的已完成推理/工具结果记录，以解决缺失参数并发起依赖调用。\n- **深度解析**: 现有的推测方法在语音更新时可能会截断工具调用，将计算时间与语音更新耦合。Heartbeat Thinking 将两者解耦，把聆听时间转化为可重用的准备时间。在 SpeechFCEval、FDBench v3 和 AudioCRAG 上，该方法提高了推测工具覆盖率或检索重用率。特别是在 FDBench v3 上，工具覆盖率提高了 16 个百分点，平均最终响应延迟降低了 36.4%。\n- **领域归类**: [语音智能体, 自然语言处理, 工具调用]\n---\n\n### 14. Beyond Watching and Searching: Benchmarking Agents for Video-centered Deep Research Reports (OmniDR-Bench：面向以视频为中心的深度研究报告的智能体基准测试)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31158)\n- **研究任务**: 评估以源视频为中心的深度研究报告生成任务，要求智能体识别研究问题、检索外部多模态证据并生成交互式报告。\n- **核心亮点**: 提出 Video-Centered Deep Research Report Generation 任务及 OmniDR-Bench 基准；提出 Omni Atomic Rubric Trees (Omni-ARTs) 评估方法，包含音视频定位、多模态证据使用和交互式展示三个维度；发布包含 50 个中英文任务、6414 个评估标准的基准数据集。\n- **深度解析**: 当前深度研究智能体基准缺乏对视频中心研究的支持，而该任务能帮助用户定位视频相关时刻、验证声明等。Omni-ARTs 通过独立证据收集、自动检查等行为校准构建。在 18 种智能体配置中，最佳系统得分为 63.3/100。结果表明，当前智能体在更广泛的内容覆盖、跨模态因果逻辑分析及更准确的引用支持方面仍需改进。\n- **领域归类**: [多模态大模型, 智能体评估, 视频理解]\n---\n\n### 15. Code2Video-Compass: A Comprehensive Benchmark for General-Purpose Code-Based Video Generation across T2V, I2V, and V2V (Code2Video-Compass：面向通用代码视频生成的综合基准)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28416)\n- **研究任务**: 评估多模态大语言模型（MLLMs）将视觉和时间需求转化为可执行程序，以生成完整视频的能力（代码视频生成）。\n- **核心亮点**: 提出 Code2Video-Compass 基准，包含 2104 个任务，涵盖 10 个类别、24 个子类及构建、动态动画、状态依赖三个复杂度维度；提出结合 12 个客观指标和 5 个主观指标（由 MLLM 评判）的双层评估框架。\n- **深度解析**: 代码视频生成相比直接生成具有细粒度控制和组件复用优势，但现有基准多针对特定任务。Code2Video-Compass 填补了跨 T2V、I2V、V2V 完整视频创建的评估空白。对 15 个最新 MLLM 的评估表明，即使是领先模型在可靠生成符合文本和视觉要求的高质量完整视频方面仍面临挑战，且性能通常随着构建、动态动画和状态依赖复杂度的增加而下降。\n- **领域归类**: [多模态大模型, 视频生成, 基准测试]\n---\n\n### 16. RLSplat: Resource-Linear Budget Control for Feed-forward 3D Gaussian Splatting (RLSplat：面向前馈 3D 高斯溅射的资源线性预算控制)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27712)\n- **研究任务**: 在前馈 3D 高斯溅射（FF3DGS）中实现资源线性控制，使表示大小、推理延迟和峰值内存随高斯预算的减少而线性降低。\n- **核心亮点**: 提出 RLSplat 框架，学习高斯分配策略将预算精确分配到局部场景区域，直接生成请求数量的高斯（而非先预测密集高斯再剪枝）；通过资源线性高斯解码（每个高斯仅通过分层邻居搜索关注附近高斯），使解码成本随高斯数量减少而线性下降。\n- **深度解析**: 现有预算可控 FF3DGS 方法通常先预测密集高斯再剪枝，导致推理延迟和峰值内存几乎恒定，忽略了推理本身的成本。RLSplat 解决了这一问题。在零样本评估中，RLSplat 在每个预算下均优于先前方法；在低预算下，即使高斯数量少 4 倍，也能超越最强基线，同时速度提升 4.1 倍，峰值内存减少 9.6 倍。\n- **领域归类**: [3D 视觉, 3D 高斯溅射, 计算机图形学]\n---\n\n### 17. RouteWeaver: Weaving Mode Selection and Execution into Unified LLM Routing (RouteWeaver：将模式选择与执行编织入统一的 LLM 路由)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19705)\n- **研究任务**: 在大型语言模型（LLM）路由中，打破现有方法固定执行范式（如单轮、多轮或智能体路由）的限制，实现动态模式选择与模型协调。\n- **核心亮点**: 提出 RouteWeaver 统一路由框架，在单一 LLM 策略中集成多种路由模式，联合学习使用哪种模式及在该模式下如何选择模型；开发 COMET-GRPO 训练方法解耦轨迹级优势；引入渐进式探索，使路由器先学习如何执行每种模式，再决定何时使用它。\n- **深度解析**: 现有 LLM 路由受限于预定义的执行范式，限制了其对不同查询需求的适应性。RouteWeaver 通过渐进式探索避免了策略崩溃。在数学、编码、知识、逻辑推理和事实召回五个领域的评估中，平均准确率达到 61.4%，比最强基线相对提升 11.03%。消融实验证明，如果没有渐进式探索，路由策略会完全崩溃退化为单轮执行。\n- **领域归类**: [大语言模型, 模型路由, 强化学习]\n---\n\n### 18. Cola2: Co-Adaptive Hierarchical Language Modeling with Continuous Semantic Compression and Balanced Discrete Generation (Cola2：具有连续语义压缩和平衡离散生成的协同自适应分层语言建模)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31305)\n- **研究任务**: 在分层语言生成中，研究连续语义压缩、重建与生成的平衡，以及连续-离散协同自适应问题。\n- **核心亮点**: 提出 Cola2 框架，动态将文本分割为语义跨度，通过无辅助损失的负反馈控制压缩率；结合重建和生成监督学习紧凑的预测潜在表征；使用块因果掩码扩散解码器，并通过无分类器引导调整平衡；推理时对生成的文本在固定跨度布局下重新编码以保持潜在历史一致。\n- **深度解析**: 分层语言生成的有效性取决于潜在空间压缩的内容及离散生成器如何使用它。Cola2 在约 2100 亿训练 token 的五个下游任务上验证了核心设计。使用 3460.3 亿源 token 的未收敛 checkpoint 在 8 个任务上平均达到 60.10，并在 HellaSwag 和 StoryCloze 上超越了预训练预算大 43 倍以上的 Llama-3-8B，展示了连续潜在分层语言生成的潜力。\n- **领域归类**: [自然语言处理, 语言建模, 生成模型]\n---\n\n### 19. Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought (Raw-RAG：复杂的智能体记忆真的是必需的吗？朴素 RAG 比我们想象的更强大)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30755)\n- **研究任务**: 探究在长期对话理解中，广泛使用的复杂智能体记忆系统（涉及变异、结构组织、学习检索策略等）是否绝对必要。\n- **核心亮点**: 提出 Raw-RAG，一个使用密集检索和重排序处理原始历史记录的朴素 RAG 基线；在 7 个基准-模型设置中的 6 个中排名第一，超越最强对比智能体记忆系统 0.13 到 5.53 分；证明原始历史检索的高证据覆盖率可以抵消较低的利用率。\n- **深度解析**: 复杂智能体记忆系统通常包含许多复杂操作。Raw-RAG 仅通过检索原始对话历史为 reader LLM 提供证据。证据分析表明，有用证据包括答案值及推导所需的依赖路径。即使完全访问转换后的记忆存储，与原始证据相比仍存在准确率差距，强调了保留原始信息的重要性。该发现挑战了复杂智能体记忆在所评估对话任务中的必要性。\n- **领域归类**: [自然语言处理, 检索增强生成 (RAG), 长期记忆]\n---\n\n### 20. FilmFlow: Agentic System for 3D Virtual Film Cinematography (FilmFlow：面向 3D 虚拟电影摄影的智能体系统)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30753)\n- **研究任务**: 将电影摄影意图（自然语言指令或参考视频）转化为动态 3D 环境中可控、可执行的相机轨迹。\n- **核心亮点**: 提出 FilmFlow 智能体框架，包含 Director（导演）智能体构建可执行相机计划，以及 Interpreter（解释器）、Scout（侦察）和 Critic（评论家）三个辅助智能体；引入 CinemaBench 基准，包含 150 个 Blender 场景、750 个文本指导任务和 60 个参考视频。\n- **深度解析**: 复杂的相机运动对视觉叙事至关重要，但转化为可执行轨迹具有挑战性。Director 通过组合控制平移、旋转和构图的并发原子操作来构建计划，Critic 提供视觉反馈以迭代优化计划。在评估的基线中，FilmFlow 取得了最强的基准性能和最高的用户偏好，展示了在可执行 3D 摄影中有效的空间推理、时间协调和视觉构图能力。\n- **领域归类**: [多智能体系统, 3D 视觉/图形学, 视频/电影生成]\n\n### 21. RTAformer: Relation-Transition-Aware Transformer for Video Scene Graph Generation (RTAformer：用于视频场景图生成的关系转换感知Transformer)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20091)\n- **研究任务**: 视频场景图生成（VidSGG），旨在捕捉视频中的对象及其不断演变的关系。\n- **核心亮点**: 提出了一阶段框架 RTAformer，分别对实体持久性和关系变化进行建模，解决了现有方法中因过度强调一致性而导致的“关系语义惯性”问题。\n- **深度解析**: 现有方法在聚合跨帧信息时容易忽视关系的突变，导致模型在底层关系改变后仍保留先前的预测。RTAformer 通过注入相邻帧关系查询之间的校准差异来引导谓词更新，并在训练期间进行跨帧实例对齐以减少表征漂移。在 Action Genome 数据集上的实验表明，该方法在召回率和平均召回率上优于现有方法，且在使用匹配骨干网络的对比中，其在关系转换帧上的提升比非转换帧更大。\n- **领域归类**: [计算机视觉, 视频理解, 场景图生成]\n---\n\n### 22. Verus-Insight: Towards Explainable Artifact Detection in AI-Generated Videos (Verus-Insight：面向AI生成视频的可解释伪影检测)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30866)\n- **研究任务**: AI生成视频的伪影检测与来源预测，旨在提高合成视频检测的可靠性和可解释性。\n- **核心亮点**: 将伪影检测结构化为三个互补能力（检查规划、证据验证、证据聚合），并提出 Verus-Insight 模型和 Verus-Bench 基准测试。\n- **深度解析**: 现有的基于伪影的检测器往往无法识别细微伪影，或在不忠实识别底层证据的情况下做出正确决策。Verus-Insight 通过基于人类锚定的全流程监督和渐进式能力训练，增强了细粒度伪影检测和视频级检测能力。同时推出的 Verus-Bench 提供了带有细粒度人类感知伪影标注的评估基准。实验表明，该模型在细粒度伪影分析和AI生成视频检测中表现优异，能更可靠地将相关检查目标转化为受支持的伪影证据，且不会增加虚假的伪影声明。\n- **领域归类**: [计算机视觉, 视频生成, 深度伪造检测]\n---\n\n### 23. Rethinking Sequence Compression with Test-time Regression (通过测试时回归重新思考序列压缩)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31574)\n- **研究任务**: 高效语言和 multimodal 模型中的序列压缩，解决传统池化或学习投影方法性能不佳的问题。\n- **核心亮点**: 提出 TTR-Compressor，通过测试时回归（test-time regression）将输入 token 定义为回归问题，其拟合系数构成压缩表示。\n- **深度解析**: 该方法通过反向传播端到端学习回归问题，同时在前向传播中通过闭式解高效计算系数。TTR-Compressor 作为块级稀疏注意力的压缩器，在 RULER 基准上大幅提升了性能；作为多模态大语言模型的视觉 token 合并器，在减少 55.6% 视觉 token 的情况下匹配了标准 MLP 合并器的性能。这确立了测试时回归作为高效语言和 multimodal 模型序列压缩有效原语的地位。\n- **领域归类**: [自然语言处理, 多模态大模型, 模型压缩与加速]\n---\n\n### 24. AgentVQA: A Unified Benchmark for Agentic Visual Understanding (AgentVQA：面向智能体视觉理解的统一基准)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31494)\n- **研究任务**: 评估视觉语言模型（VLMs）在智能体上下文（agentic contexts）中的表现。\n- **核心亮点**: 引入了 AgentVQA 离线基准，涵盖 Web 智能体、机器人、第一人称视频、游戏和空间规划 5 个智能体领域，用于快速可靠地比较跨智能体领域的模型性能。\n- **深度解析**: 在线评估成本高且难以扩展，现有的离线 VQA 基准又存在局限和碎片化。AgentVQA 从 23 个源数据集中手动挑选了 1000 个具有挑战性的真实世界智能体示例，并调整用于可靠的离线评估。在评估的 22 个模型中，最佳模型准确率仅为 58.5%。跨领域分析表明，错误主要源于无法准确定位和维持当前及 evolving 视觉状态的表示（如定位 UI 元素、解释运动、跟踪状态变化、推断 3D 空间关系），而非任务误解或下游逻辑推理失败。\n- **领域归类**: [多模态大模型, 智能体(Agents), 基准测试]\n---\n\n### 25. AnyGameRenderer: Entity-Consistent Generative Rendering Across Games and an Entity-Level Benchmark (AnyGameRenderer：跨游戏的实体一致性生成渲染及实体级基准)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31466)\n- **研究任务**: 将 AI 编码智能体生成的简陋游戏画面转化为具有高质量视觉效果的视频，同时保持布局、相机和实体位置/时序不变。\n- **核心亮点**: 提出 AnyGameRenderer，一个 video-to-video 生成渲染器，无需复杂的引擎 G-buffer 或类别标签，仅使用纯视频作为输入，并能保持实体对应关系。\n- **深度解析**: 该模型通过 LoRA 微调 33B 的 MiniMax-H3 ref2va 视频生成模型实现，训练数据包含来自 AI 游戏创建工具、虚幻引擎和真实游戏录制的配对片段。为了评估实体对应关系，作者提出了一个包含 59 个保留案例和 753 个实体的实体级基准。与基础模型相比，AnyGameRenderer 更好地保持了实体对应关系（时间匹配率从 50.9% 提升至 62.9%，遗漏的数量变化从 34.7% 降至 21.3%，幻觉或未渲染的实体减少）。\n- **领域归类**: [计算机视觉, 视频生成, 游戏与AI编码]\n---\n\n### 26. MolLean: A Process-Verifiable Language for Chemical Reasoning (MolLean：一种用于化学推理的过程可验证语言)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20459)\n- **研究任务**: 解决化学思维链中可能出现的结构和属性声明幻觉问题，实现可验证的化学推理。\n- **核心亮点**: 引入 MolLean，一种将化学推理建立在显式分子状态上的过程可验证语言，并配套提出 MolLean-MCP 状态工具接口。\n- **深度解析**: MolLean 使用基于 Lean 的分层内核检查分子读取的状态转换和断言，并通过类型化见证协议分离原生结构检查与外部测量。MolLean-MCP 在生成过程中暴露这些转换和检查，使模型能接收反馈决定下一步行动。在 12 个任务的 8800 个匹配样本上评估，使用 Qwen3.6-27B 时，全轨迹细化（whole-trace refinement）在所有 12 个任务上均优于直接思维链；MolLean-MCP 通过逐步验证反馈进一步补充了全轨迹细化，在反应任务中表现更好。\n- **领域归类**: [自然语言处理, 科学计算与化学, 可解释AI与形式化验证]\n---\n\n### 27. RIDAR: Safeguarding Research Integrity in Autonomous Research Agents via Automated Detection and Runtime Intervention (RIDAR：通过自动检测和运行时干预保障自主研究智能体的研究完整性)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31372)\n- **研究任务**: 检测并干预自主研究智能体在研究过程中出现的研究完整性违规（RIVs）行为。\n- **核心亮点**: 提出 RIDAR 框架，包含涵盖 14 种 RIV 类型的 RIVT 分类法、用于事后检测的 RIDAR-post-hoc 以及用于运行时干预的 RIDAR-runtime。\n- **深度解析**: 自主研究智能体容易出现损害研究有效性、可重复性或忠实度的 RIVs。RIDAR-post-hoc 在包含 60 个专家标注轨迹的 RIV-Gold 基准上达到了 85.2% 的 F1 性能；应用于包含 50 个不同研究任务的 300 个智能体轨迹的 RIV-Wild 数据集时，在 99.7% 的轨迹中检测出 3964 个 RIV 实例。RIDAR-runtime 能够在智能体运行时动态检测和纠正 RIV，使任务完成时剩余的 RIV 减少了 36.8%。\n- **领域归类**: [智能体(Agents), AI安全与对齐, 科学研究自动化]\n---\n\n### 28. Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models (继承而非发明：追踪推理模型中 `{wait}` 标记的来源)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30882)\n- **研究任务**: 探究强化学习（RL）推理模型中用于重新考虑步骤的 `{wait}` 标记究竟是由 RL 发现还是从训练数据中继承的。\n- **核心亮点**: 通过追踪开源模型的训练历史，证明零 RL（zero-RL）几乎从不创造该标记，`{wait}` 实际上是随着训练数据“继承”而来的。\n- **深度解析**: 研究表明，在缺乏该词的基础上，RL 能大幅提高 MATH-500 准确率，而 `{wait}` 依然几乎不存在。该标记主要来源于 OLMo-3 的中期训练和推理轨迹的微调。对于基础模型已使用该标记的情况，发布的 RL-Zero 配方（如 OLMo-3, MiMo）会使其数量倍增，而无 KL 散度的 GRPO 则不会；微调后的 RL 几乎不改变它，而特定的 GRPO 配方甚至会抹去微调植入的标记。此外，作者警告不要仅凭标记频率来判断 RL 诱导的推理，并指出 LLM-as-a-judge 可能会反转人类标注的趋势。\n- **领域归类**: [自然语言处理, 强化学习, 模型训练与分析]\n---\n\n### 29. SCOPE: Compiling Natural-Language Policies into Neurosymbolic Predicate Programs (SCOPE：将自然语言策略编译为神经符号谓词程序)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31062)\n- **研究任务**: LLM 智能体的策略执行，从单轮内容审核转向评估多轮对话和工具调用轨迹的复合策略。\n- **核心亮点**: 提出 SCOPE，将自然语言策略编译为由小模型、确定性提取器和代码组成的可执行神经谓词程序，并通过对抗生成反例进行联合优化。\n- **深度解析**: 微调的护栏模型在复合策略上表现不佳，而 LLM-as-a-judge 成本高且不稳定。SCOPE 将策略分解为在显式逻辑下组合的窄神经决策。在真实世界策略任务基准上的评估表明，SCOPE 在任务和模型上实现了最高的平均准确率。使用最弱执行器优化的程序可以无需进一步优化即迁移到其他模型，在廉价模型上部署即可达到与前沿推理模型相当的准确率。此外，SCOPE 的预测更稳定，且每个裁决都可通过产生它的谓词输出进行解释。\n- **领域归类**: [自然语言处理, 智能体(Agents), AI安全与护栏]\n---\n\n### 30. Agent Mosaic: Recognizing Confidentiality Leaks in Agentic LLM Systems (Agent Mosaic：识别智能体 LLM 系统中的机密性泄露)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30418)\n- **研究任务**: 量化和识别 LLM 智能体在处理机密数据时，通过检索多个文档并拼凑出敏感结论而导致的“马赛克效应”机密性泄露风险。\n- **核心亮点**: 通过合成和实时智能体实验，量化了马赛克效应导致的机密泄露率，并揭示了即使增加可见的分类标题和明确的聚合规则，不安全的泄露依然大量存在。\n- **深度解析**: 研究使用了 30 个合成的网络安全、医疗和军事示例，从 3 个 LLM 智能体的受控模拟中获得了 10800 个最终答案，并从两个开源框架的实时智能体中获得了 1440 个答案。表现最好的模型 GPT-5.6-Sol 在模拟中有 7.08% 的答案泄露了禁止的组合信息，实时框架中的泄露率更高。即使添加了安全防护，模拟答案中仍有 32.37% 存在不安全泄露。此外，增加拒绝率并不能保证机密性，因为许多拒绝本身就泄露了禁止的结论。这表明在混合权限用户的环境中，必须对智能体的推断和披露施加更强的控制。\n- **领域归类**: [智能体(Agents), AI安全与隐私, 大语言模型应用]\n---\n\n### 31. What Makes a Good Unmasking Policy? A Controlled Study of Learned Unmasking in Diffusion Language Models (什么是好的解掩码策略？扩散语言模型中学习解掩码的对照研究)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31576)\n- **研究任务**: 研究扩散语言模型中学习到的解掩码策略，探讨监督信号、输入状态、模型容量以及函数评估次数（NFE）减少对策略开销的影响，以改善速度-准确率的权衡。\n- **核心亮点**: 发现仅依赖隐藏状态效果较弱，但与置信度结合可互补；在NFE减少约10%时足以抵消策略开销；提出基于轨迹收缩目标的策略，在LLaDA-8B-Instruct上训练出856K参数的小策略，在GSM8K上实现最佳准确率-NFE前沿和最高吞吐量。\n- **深度解析**: 摘要指出，该研究将监督策略视为通过教师蒸馏解码过程，并独立考察了教师标记的可提交预测、策略模仿的状态、策略观察的内容以及NFE减少的阈值。此外，分析表明在低NFE下，标记与最终输出匹配的预测过于宽松。\n- **领域归类**: [自然语言处理, 扩散模型, 语言模型解码]\n---\n\n### 32. F2G-Pose: Geometry-Aware Foundation Feature Lifting for Direct RGB-D Category-Level Object Pose Estimation (F2G-Pose：用于直接RGB-D类别级物体位姿估计的几何感知基础特征提升)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31623)\n- **研究任务**: 类别级RGB-D物体位姿估计，即在没有特定实例CAD模型或参考视图的情况下，从单次RGB-D观察中恢复物体的3D旋转、平移、度量尺寸和相机坐标系下的完整形状。\n- **核心亮点**: 提出F2G-Pose，一个实时、直接、单遍的框架。将密集视觉基础特征提升为部分点云，使用DGCNN编码局部几何，并通过混合专家Transformer整合物体级结构。在SOPE和ROPE上达到SOTA精度，位姿推理达28 FPS。\n- **深度解析**: 摘要指出，现有基于中间结构的方法易产生误差传播，而扩散模型推理延迟高且后处理复杂。该研究通过冻结外部预训练的RADIO骨干网络，并仅在位姿标注的合成SOPE数据上训练任务特定网络，解决了可靠性与效率的平衡问题。\n- **领域归类**: [计算机视觉, 3D视觉, 机器人感知]\n---\n\n### 33. Reading, Writing, Sharing, and Interacting with the World through Video (通过视频阅读、书写、分享和与世界互动)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31668)\n- **研究任务**: 以世界建模为统一视角，综述视频基础模型和视频世界模型的发展，探讨视频观察与不断演变的世界之间的关系。\n- **核心亮点**: 将观察到的视频视为潜在时间世界的部分、有损且按时间排序的投影，围绕四种互补操作组织文献：阅读（推断世界属性）、书写（合成视频）、分享（整合理解与生成）、互动（预测和更新世界状态）。\n- **深度解析**: 摘要指出，该综述区分了观察或生成序列中的时间连贯性与底层世界状态的一致性，并追踪了研究重点从片段级识别和感知保真度向持久状态、可控演化、物理和因果有效性以及基于互动和下游决策的评估的转变。\n- **领域归类**: [计算机视觉, 视频生成, 世界模型]\n---\n\n### 34. Foundation4D: Towards a unified perception and reconstruction model for autonomous vehicles (Foundation4D：面向自动驾驶汽车的统一感知与重建模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30340)\n- **研究任务**: 从多相机驾驶视频中统一进行几何估计、3D检测、语义占据和高斯重建。\n- **核心亮点**: 提出Foundation4D，共享骨干网络使用分解的时空注意力高效结合多相机和时间观察。发布了包含密集深度和语义占据标签的PAI-Foundation4D基准测试（1253个驾驶片段）。在Waymo、nuScenes和OpenOccupancy上均取得SOTA性能。\n- **深度解析**: 摘要提供了任务组合研究的分析结果：将检测与几何和占据联合训练，可使顶级mAP提高1.2个点；将几何与检测联合训练，可使相机到装备的平移误差降低13.4%。此外，利用预测的几何和轨迹作为无激光雷达NuRec的先验，支持驾驶场景重建。\n- **领域归类**: [计算机视觉, 自动驾驶, 3D重建]\n---\n\n### 35. Who Takes the Lead? Model Ability and Task-Conditioned Collaboration with Humans (谁主导？模型能力与任务条件化的人机协作)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27148)\n- **研究任务**: 研究语言模型智能体与人类伙伴在共享目标下的协作分工，探讨模型能力如何影响其对人类的依赖和任务分配。\n- **核心亮点**: 引入共享控制迷宫任务，通过改变人类的最短路径优势来控制条件。评估了GPT 5.6 Sol等四个模型，发现 solo 性能越强的模型，越能根据路线条件选择性地让人类参与，而 solo 性能较弱的模型则缺乏这种选择性。\n- **深度解析**: 摘要指出，随着语言模型智能体能力增强，人类参与率的下降不应简单视为协作失败，而可能是正确的劳动分工。研究通过控制谁持有优势，揭示了强模型能够根据任务条件进行合理的任务分配（如人类无优势时几乎独立行动，人类路线更短时约80%的初始决策会引入人类）。\n- **领域归类**: [人工智能, 人机协作, 智能体]\n---\n\n### 36. MambaAct: Efficient Mamba Action Experts for Flow-Matching Vision-Language-Action Models (MambaAct：用于流匹配视觉-语言-动作模型的高效Mamba动作专家)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22951)\n- **研究任务**: 解决流匹配视觉-语言-动作（VLA）模型在实时控制中因迭代去噪导致动作专家重复评估而产生的高推理成本问题。\n- **核心亮点**: 提出MambaAct，用紧凑的基于Mamba的动作专家替换基于Transformer的动作专家。动作专家体积缩小10倍，在LIBERO上减少64.8%的去噪延迟，真实世界部署减少58.8%，同时LIBERO平均成功率提高1.08个百分点。\n- **深度解析**: 摘要指出，Mamba在动作专家中作为动作混合器，对噪声连续动作序列的依赖关系进行建模。为了避免重复的标记级交叉注意力，通过轻量级上下文压缩器门控和调制每个Mamba动作块，从而在保持视觉-语言条件的同时大幅提升效率。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 高效推理]\n---\n\n### 37. SplatLab: Autonomous Scientific Discovery for 3DGS Research (SplatLab：面向3DGS研究的自主科学发现系统)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30468)\n- **研究任务**: 构建一个用于3D高斯溅射（3DGS）的自主研究系统，实现从基线复现到提出扩展、训练、消融、撰写手稿的端到端自动化。\n- **核心亮点**: SplatLab通过五个设计选择实现自主发现：候选者从验证复现骨干中变异插件；使用级联加权Elo锦标赛评估GPU PSNR；常驻证伪器在失败时扣除Elo分数；每个报告的数字都绑定到记录的训练运行。在PSNR目标运行中，其手稿比复现目标高出+0.18至+3.78 dB。\n- **深度解析**: 摘要指出，该系统将研究周期从研究生数月的时间压缩到几天 mostly 自主计算的时间。通过Elo锦标赛和证伪器结合，确保候选方案在压力测试中的生存率，并将所有声明与具体的训练日志绑定，保证了科学发现的可重复性和严谨性。\n- **领域归类**: [计算机视觉, 3D高斯溅射, AI for Science]\n---\n\n### 38. TILDE: Teacher-in-the-Loop Distillation from Embodied Foundation Models (TILDE：从具身基础模型中进行教师在环蒸馏)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25376)\n- **研究任务**: 将具身基础模型（EFMs）的强大操作能力转移到无需动作预训练的策略中，解决复现预训练需要大量机器人数据和计算的问题。\n- **核心亮点**: 提出TILDE，结合学生诱导状态下的在环策略蒸馏与从教师执行的恢复轨迹中学习。提出AutoDAgger，利用机器人奖励模型监控任务进度并触发教师干预，使恢复轨迹收集速度比人在环方法快2倍以上。在三个真实世界任务中，性能比行为克隆提高高达4.1倍。\n- **深度解析**: 摘要指出，TILDE统一了从示范中学习、在环教师监督和教师纠正行为的学习，支持有效的跨架构蒸馏。AutoDAgger通过奖励模型自动判断何时需要教师接管，从而高效收集错误恢复数据，降低了人工干预成本。\n- **领域归类**: [机器人学, 具身智能, 模仿学习]\n---\n\n### 39. SEAM: Spectral Embedding Alignment and Merging for Low-Resource TTS (SEAM：面向低资源TTS的频谱嵌入对齐与合并)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26252)\n- **研究任务**: 解决条件文本到语音（TTS）模型扩展词汇量时通常需要大量配对音频微调的问题，实现低资源和跨语言适应。\n- **核心亮点**: 提出SEAM，一种零音频初始化方法，从已知子词素构建未见词素的嵌入。应用频谱滤波器保留时间语音顺序，并使用闭式岭回归将新嵌入与预训练条件流形对齐。相比随机初始化和平均池化，样本复杂度降低75%。\n- **深度解析**: 摘要指出，与忽略序列结构的标准池化策略不同，SEAM通过频谱滤波和岭回归在理论上提供了轻量级、可重现的解决方案，有效解决了低资源语音合成中词汇扩展的瓶颈。\n- **领域归类**: [语音处理, 文本到语音, 低资源学习]\n---\n\n### 40. Skeleton-Grounded Latent Action Model for Robot World Models (面向机器人世界模型的骨骼接地潜在动作模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31474)\n- **研究任务**: 解决机器人世界模型中潜在动作模型将机器人运动与物体响应及其他场景变化混合的问题，实现可控的机器人世界建模。\n- **核心亮点**: 提出SkeLAM，将潜在动作分解为由机器人骨骼监督接地的运动学分量和保留互补视觉动态的残差分量。在DROID上，与DreamDojo相比，末端执行器ADE降低19.5%，LPIPS降低11.1%。\n- **深度解析**: 摘要指出，世界模型通过独立的条件路径结合运动学和残差分量，分支丢弃减少了对未来残差信息的依赖。轻量级适配器将机器人动作映射到运动学空间，支持零样本的人到机器人运动迁移，且策略评估显示预测成功率与真实机器人执行的成功率一致。\n- **领域归类**: [机器人学, 世界模型, 视频预测]\n---\n\n### 41. BrickWright: Agentic Creation of Physically Feasible Brick Builds (BrickWright：物理可行积木构建的智能体创建)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.31651)\n- **研究任务**: 从文本或图像提示生成物理上可行的乐高积木构建（3D建模）。\n- **核心亮点**: 提出 BrickWright 框架和 BrickLayer 工具包（包含组装 API 和物理可行性验证器），使预训练智能体能够生成 100% 物理有效的积木组装，并在文本到积木任务上超越专用模型。\n- **深度解析**: 前沿代码智能体在 3D 建模中常生成无效组装（如悬浮、碰撞或断开部分）。BrickWright 通过提供组装和物理验证工具解决了这一问题。其核心组件 BrickLayer 包含降低推理成本的 API 和提供物理可行性反馈的验证器。在 512 个提示样本上，基线智能体物理有效率仅为 9% 至 69%，而 BrickWright 引导的智能体达到 100% 有效率，同时提升或保持了提示遵循度。\n- **领域归类**: [3D建模, 智能体, 代码生成, 物理仿真]\n---\n\n### 42. Realism VS Accuracy: Event Sequence Forecasting from a Generative Modeling Perspective (真实性与准确性：从生成建模视角的事件序列预测)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12586)\n- **研究任务**: 将多步事件序列预测作为条件生成建模问题进行研究，同时评估预测的准确性和分布真实性。\n- **核心亮点**: 揭示了预测准确性与分布真实性之间存在根本的权衡，并提出 Wasserstein BaryBooster 算法，将分布真实性转化为预测准确性，实现最先进的预测性能。\n- **深度解析**: 事件序列预测广泛应用于金融、医疗、商业流程智能等领域。本文构建了一个包含双重评估指标、强统计基线、相邻领域模型和真实数据集的基准。评估发现，现有方法无法同时在准确性和真实性上表现优异。为此，作者引入 Wasserstein BaryBooster 算法，通过聚合真实性强的扩散模型样本来提升预测准确性，证明了分布真实性可以有效转化为预测准确性。\n- **领域归类**: [时间序列预测, 生成模型, 扩散模型, 基准测试]\n---\n\n### 43. Bridging Exploration and Persona: Information-Directed Dueling for Test-Time Agent Personalization (连接探索与人设：用于测试时智能体个性化的信息导向决斗)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24385)\n- **研究任务**: 在测试时通过轻量级交互，使大语言模型智能体适应依赖于查询的用户偏好（人设选择）。\n- **核心亮点**: 提出 ID-TAP 框架，结合查询条件神经效用模型和轻量级 Bradley-Terry 探索器，在固定的 10 轮比较预算内，在多个基准测试中实现了最强的综合个性化性能。\n- **深度解析**: 有效的测试时个性化要求智能体根据候选响应间的二元比较在线信号适应偏好。ID-TAP 是一个受信息导向搜索（IDS）启发的可扩展神经决斗强盗框架。它通过相似性加权的热启动在相关查询间转移比较证据，神经模型在共享统计能力的同时保留特定查询的分数。在 7 个用户条件生成基准上，ID-TAP 在固定预算内展现了最优的聚合性能，证明了信息导向的挑战者选择是测试时人设适应的有效设计。\n- **领域归类**: [大语言模型, 强化学习, 个性化, 在线学习]\n---\n\n### 44. IF-MAP: Influence-Function-Inspired Agent Prioritization in Multi-Agent Systems (IF-MAP：多智能体系统中受影响力函数启发的智能体优先级排序)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24383)\n- **研究任务**: 在基于大语言模型的多智能体系统中，识别应优先改进的智能体，以在有限资源下实现最大的系统级性能提升。\n- **核心亮点**: 提出 IF-MAP 方法，通过黑盒方式测量语义提示扰动下的损失变化来评估智能体改进潜力，在提示优化和模型升级中显著提升了系统性能并大幅降低了 Token 消耗。\n- **深度解析**: 改进多智能体系统中的所有智能体成本高昂，而失败归因无法直接揭示系统级收益。IF-MAP 通过在低维提示嵌入子空间拟合正则化局部响应模型，利用估计的响应范数作为优先级分数，无需访问模型参数或梯度。在 6 个多智能体工作流（代码生成、问答、数学推理）中，优化选定智能体的提示带来了 3.81% 的宏观平均增益（统一选择为 1.85%）；升级选定智能体带来 7.62-16.42% 的增益（统一选择为 3.81-8.62%）。此外，该方法分别减少了 Qwen3-8B 和 DeepSeek-V3.2 的 Token 使用量 74.2% 和 35.2%，并减少了目标模型 63.6-64.9% 的 Token 消耗。\n- **领域归类**: [多智能体系统, 大语言模型, 资源优化, 提示工程]\n---\n\n### 45. HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second (HyperDrone：每秒数百万帧的仿真到现实迁移)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28950)\n- **研究任务**: 开发极快的四旋翼模拟器，支持高性能批量渲染，并实现从仿真到现实世界的视觉控制策略迁移。\n- **核心亮点**: 推出 HyperDrone 模拟器及 HyperLux 光线追踪引擎，渲染速度比现有最先进模拟器快 20 倍以上，在消费级 GPU 上最高保真设置下可达数百万 FPS，并成功将纯仿真训练的视觉策略部署到真实微型无人机上。\n- **深度解析**: HyperDrone 结合了高度优化的多旋翼动力学和 HyperLux 光线追踪引擎。HyperLux 支持多种现代硬件后端（Nvidia OptiX, Vulkan, Apple Metal, WebGPU），可渲染 RGB、深度、语义/实例分割、表面法线和光流等观测数据，并支持反射、真实光照、运动模糊、抗锯齿和物理渲染（PBR）等高保真效果。即使在最高保真设置下，也能在消费级 GPU 上实现数百万 FPS。作者利用该模拟器纯在仿真中训练了基于视觉的偏航控制策略，并将其成功迁移到配备摄像头的真实小型四旋翼（Crazyflie）上，实现了完全机载运行。\n- **领域归类**: [机器人学, 强化学习, 计算机图形学, 仿真器]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [SnailSploit/Claude-Red](https://github.com/SnailSploit/Claude-Red)\n- **今日趋势**: 8,269 stars / 1,083 forks | 今日新增 209 stars\n- **项目简介**: 为 Claude 技能系统打造的攻击性安全（红队）专家级技能库。\n- **核心价值**: \n  - **项目用途**: 提供针对特定攻击面的结构化安全技能，用于增强 Claude 在攻击性安全方面的能力。\n  - **目标人群**: 安全研究人员、渗透测试人员、红队专家。\n  - **技术核心**: 结构化的 SKILL.md 文件，涵盖 SQL 注入、shellcode、EDR 绕过和漏洞利用开发等专家级方法论。\n  - **AI/大模型相关性**: 是（专为 Claude 大模型技能系统设计的提示词/
