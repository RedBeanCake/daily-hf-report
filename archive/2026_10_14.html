    <h1>前沿科研情报 - 2026-10-14</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. GroundingPI: A Grounding Foundation Model towards Physical Intelligence with Visual Primitives (GroundingPI：面向物理智能与视觉基元的定位基础模型)\n- **社区热度**: `👍 245 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39601)\n- **研究任务**: 解决视觉语言动作（VLA）和世界动作模型（WAM）在复杂、微小目标场景下定位精度不足和速度不够的问题，为物理智能提供精确、快速的视觉定位基础。\n- **核心亮点**: 提出了一个 4B 参数的定位基础模型 GroundingPI，将点和框生成为共享词汇表中的量化坐标。训练结合了多模态与空间预训练、监督微调以及基于 GRPO 的强化学习。在 34 个定位基准上取得 SOTA（平均 73.68%），超越 GPT-6 Astra，并在机器人操作和自动驾驶等下游任务中显著提升性能。\n- **深度解析**: 摘要指出，模型通过量化坐标生成点和框，实验表明密集定位和 OCR 对感知学习有催化作用，证明了定位作为物理智能感知基础的潜力。关于具体的预训练数据规模比例、更详细的网络架构技术细节以及下游任务的具体提升数字，摘要未提供。\n- **领域归类**: [计算机视觉, 机器人学, 自动驾驶, 基础模型]\n---\n\n### 2. Thinking Inertia: LLMs Keep Thinking When Told Not To (思维惯性：大语言模型在被要求不思考时仍会继续思考)\n- **社区热度**: `👍 214 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11765)\n- **研究任务**: 研究大语言模型（LLMs）在“不思考（no-thinking）”模式下的行为表现，评估如何衡量不思考能力以及该能力在不同任务和模型中的变化。\n- **核心亮点**: 提出了衡量“不思考”的三个层级指标：空思考率、问题-预回答相关性、LLM-as-judge 显式推理率。发现模型存在“思维惯性”，即使在严格的控制下也无法可靠地消除显式推理，且在开放式任务中更为普遍。\n- **深度解析**: 摘要指出，研究评估了 6 种提示干预在 6 个 LLM 上的表现，发现在开放式任务中仅输出答案的合规性与任务准确率之间存在权衡。关于具体的 6 个模型名称、提示干预的具体内容以及准确率的详细数字，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 模型评估]\n---\n\n### 3. AgentSWE: Can Coding Agents Build the Agent You Actually Want? (AgentSWE：编码智能体能构建出你真正想要的智能体吗？)\n- **社区热度**: `👍 201 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13361)\n- **研究任务**: 评估编码智能体在根据用户需求构建定制化智能体时的真实能力，检验其交付的智能体是否真正满足需求。\n- **核心亮点**: 引入了 AgentSWE 基准，涵盖智能体开发生命周期的三个阶段：创建、编辑和优化。包含 25 个任务，采用委托形式，通过冻结提交在保留用例上进行验收，评估智能体是否真正交付了符合需求的产品。\n- **深度解析**: 摘要指出，评估发现交付内容与需求之间的差距是常态，并识别了过拟合可见用例、空洞运行时等失败模式。关于具体的编码智能体名称、任务通过率或详细的失败率数字，摘要未提供。\n- **领域归类**: [软件工程, 智能体, 代码生成]\n---\n\n### 4. Scaling Agentic Data for Long-Horizon Terminal Intelligence (扩展智能体数据以实现长视野终端智能)\n- **社区热度**: `👍 132 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13166)\n- **研究任务**: 解决长视野终端智能体在真实世界专业任务中缺乏高质量轨迹数据的问题，避免环境合成提前完成关键工作从而剥夺智能体探索和实施的需要。\n- **核心亮点**: 引入了全自动数据合成引擎 TerminalHorizon，从真实专业工作出发识别遗漏的关键工作并逐步扩展任务。基于此构建了 1.5K 任务环境，并对 Qwen3.5-27B 进行监督微调得到 TerminalHorizon-27B。\n- **深度解析**: 摘要指出，TerminalHorizon-27B 在 12 个基准上取得了显著的性能提升，并在多个案例研究中展示了持续实验和改进的能力。关于具体的性能提升数字、案例研究的具体结果指标以及 RSI 的全称，摘要未提供。\n- **领域归类**: [智能体, 数据合成, 大语言模型]\n---\n\n### 5. VIS-Ground: Video Interactive Storytelling with Contextual Grounding (VIS-Ground：具有上下文定位的视频交互式故事讲述)\n- **社区热度**: `👍 75 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09326)\n- **研究任务**: 解决视频交互式故事讲述中观众干预生成时产生的潜在依赖问题，研究在交互式延续期间生成模型应定位何种上下文，以及如何将异构非结构化输入转化为定位上下文。\n- **核心亮点**: 将上下文定位定义为将异构输入转化为可执行约束模型的过程。提出 VIS-Ground，包含结构化上下文抽象、生成约束归纳和约束视频生成，通过规划、验证、修改和渲染来执行约束。\n- **深度解析**: 摘要指出，VIS-Ground 在三个视频生成骨干网络上取得最高综合得分，平均绝对提高 10.3 分。关于具体的骨干网络名称、其他详细的评估指标以及依赖提取的具体挑战细节，摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 多模态]\n---\n\n### 6. GroundAnything: Reconciling Parallel Decoding with Precise Visual Grounding at Flash Speed (GroundAnything：在极速下协调并行解码与精确视觉定位)\n- **社区热度**: `👍 71 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39600)\n- **研究任务**: 解决自回归定位模型序列化空间预测带来的顺序延迟问题，探索将双向扩散应用于视觉定位，以实现快速并行解码和精确定位。\n- **核心亮点**: 提出 4B 参数的定位基础模型 GroundAnything，通过分块去噪协调快速并行解码与精确定位。其自回归变体在 30 个基准上取得同规模 SOTA，熵引导解码和自推测模式进一步提升了速度和精度。\n- **深度解析**: 摘要指出，GroundAnything-VLM 达到 72.42% 的平均分，自推测模式实现 4.51 倍加速。关于具体的基础设施实验加速数字、30 个基准的具体名称以及 GPT-6 Astra 的详细对比细节，摘要未提供。\n- **领域归类**: [计算机视觉, 基础模型, 视觉定位]\n---\n\n### 7. Multi-Stream Attention Residuals (多流注意力残差)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13630)\n- **研究任务**: 改进注意力残差机制，将其从单流 softmax 注意力扩展为多头深度注意力，以在增加最小额外开销的情况下获得显著的性能提升。\n- **核心亮点**: 提出多流注意力残差（MSAR），通过多尺度因果卷积获取流多样性，允许不同的头通过不同的上下文视图检索历史表示。支持多流计算而无需持久化多流存储或通信。\n- **深度解析**: 摘要指出，MSAR 在 18B 和 28B MoE 规模的 12 个下游基准上优于先前变体，实现 1.58 倍等损失计算加速。关于具体的 12 个基准名称、详细的性能指标数字以及 MoE 的具体架构细节，摘要未提供。\n- **领域归类**: [深度学习, 模型架构, 注意力机制]\n---\n\n### 8. Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents (相关性并不意味着适用性：面向个人 GUI 智能体的经验激活)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33304)\n- **研究任务**: 解决个人图形用户界面（GUI）智能体在利用交互历史时，检索到的相关经验在后续决策中适用性不高的问题，区分任务层面的“相关性”和决策时刻的“适用性”。\n- **核心亮点**: 提出无需训练的框架 ExpActivator，将个性化重新定义为经验激活。在执行期间将新屏幕与历史状态匹配，仅当当前时间和场景提供足够支持时才激活循环意图，从而精准提供适用的经验参考。\n- **深度解析**: 摘要指出，ExpActivator 在四个 GUI 骨干网络上将步骤成功率提高 28%，使用约五分之一的历史 token，MCC 达到最强基线的 2.3 倍。关于具体的骨干网络名称、其他评估指标以及历史 token 的具体数量，摘要未提供。\n- **领域归类**: [智能体, 人机交互, 图形用户界面]\n---\n\n### 9. CrossTimeEdit: A Decade-Spanning Cross-View Dataset and Reward-Guided Editing for Historical Street-View Generation (CrossTimeEdit：跨越十年的跨视角数据集与奖励引导的历史街景生成编辑)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36616)\n- **研究任务**: 解决历史街景图像覆盖不均的问题，通过生成合理的过去外观来恢复已改变的结构，同时保留持久的场景内容。\n- **核心亮点**: 构建了跨越十年的跨视角数据集 VIGOR-his（包含 43,653 个四元组）。提出 CrossTimeEdit 模型，将历史街景生成重新表述为编辑任务，并使用 Flow-GRPO 和 GDPO 优化多奖励目标。\n- **深度解析**: 摘要指出，CrossTimeEdit 在三个编辑标准上比预训练基线提高 17.12%。关于具体的对比模型名称、更详细的指标数字以及数据集的具体划分细节，摘要未提供。\n- **领域归类**: [计算机视觉, 图像编辑, 数据集]\n---\n\n### 10. SpatialASM: Internalizing Active Mentalization for Spatial Reasoning (SpatialASM：内化主动心理化以进行空间推理)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13832)\n- **研究任务**: 解决大型视觉语言模型（LVLMs）在解决复杂空间推理任务时，缺乏主动从任务相关视角重新审视场景并在心理上重建空间布局的能力。\n- **核心亮点**: 提出 SpatialASM 框架，通过训练时的空间模拟将主动空间心理化（ASM）内化到 LVLMs 中。采用新视角生成器产生显式 ASM 轨迹和自动构建的视角采取任务作为监督信号。\n- **深度解析**: 摘要指出，SpatialASM 在 7 个基准上提高了 4 个 LVLM 骨干网络的空间推理性能，并保留了通用视觉能力。关于具体的平均准确率提升数字、骨干网络名称以及 CoT 监督的具体数据规模，摘要未提供。\n- **领域归类**: [计算机视觉, 空间推理, 大视觉语言模型]\n---\n\n### 11. T3lescope: Arbitrary-Resolution High-Fidelity Generative Surface Reconstruction from Images (T3lescope：从图像进行任意分辨率的高保真生成式表面重建)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03308)\n- **研究任务**: 从具有位姿的多视角图像中重建高保真3D场景网格，无需逐场景优化，支持从单个物体到大型户外场景的跨尺度重建。\n- **核心亮点**: 提出 T3lescope 方法，在推理时采用从粗到细的级联方式，将单一固定分辨率的生成器应用于不同场景尺度。模型在训练时共享权重且不固定层级，推理时动态决定层级、单元尺度和位置。\n- **深度解析**: 现有的逐场景优化方法在观测稀疏或表面光滑/透明时缺乏3D先验，而现有生成方法通常受限于固定分辨率和有限空间范围，难以保持全局几何一致性。T3lescope 通过粗层级建立场景布局，细层级在逐渐变细的空间单元内对继承的几何进行扰动和去噪以恢复细节。在室内、户外和城市尺度场景中（摘要未提供具体数据集名称），该方法优于前馈和生成基线，匹配或超越逐场景优化，并能恢复精细结构及光滑/透明表面，展现出跨场景、视角数量和图像分辨率的良好泛化能力（摘要未提供具体的定量评估数字）。\n- **领域归类**: [计算机视觉, 3D重建, 生成模型]\n---\n\n### 12. Systematic Multi-Agent Vision-and-Language Navigation: Formulation, Benchmark, and Method (系统化多智能体视觉语言导航：公式化、基准测试与方法)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35965)\n- **研究任务**: 将多智能体视觉语言导航（VLN）系统化为一个受约束的协调问题，解决现实世界中需要机器人团队协作完成超越单个智能体能力的任务。\n- **核心亮点**: 首次系统化形式化多智能体 VLN 为受约束协调问题（包含依赖和资源约束）；构建了 MAVLN 基准；提出了 TRISS 协调导航系统，结合 LLM 子任务调度器、共享拓扑记忆和冲突感知执行机制。\n- **深度解析**: 针对多智能体协作中的子任务依赖和资源约束，研究提出了一个包含四个阶段的验证构建管道来实例化 MAVLN 任务，包含 11,724 个 episode 和 145 个场景（摘要未提供具体场景数据集名称），并配备了约束感知指标。TRISS 系统利用 LLM 进行子任务调度，通过共享拓扑记忆将个体探索转化为团队知识，并通过冲突感知机制实现无碰撞的并发意图执行。实验表明 TRISS 是一个全面的基线，并揭示了在调度、规划和执行方面仍有巨大的改进空间（摘要未提供具体的任务成功率等数字结果）。\n- **领域归类**: [机器人学, 多智能体系统, 视觉语言导航]\n---\n\n### 13. ARCS: Towards Precise Text-to-SQL via Structured Disambiguation (ARCS：通过结构化消歧实现精确的 Text-to-SQL)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09396)\n- **研究任务**: 解决 Text-to-SQL 系统中由于用户问题存在微妙、特定领域或数据的歧义而导致的错误，提出一种通过显式、受约束的交互来解决歧义的“结构化消歧”新范式。\n- **核心亮点**: 提出“结构化消歧”范式以替代传统的自由对话澄清；构建了 ARCS（SQL消歧语料库），这是首个包含真实数据库自然发生的无约束歧义的 Text-to-SQL 基准，并对所有有效歧义点、解释和 SQL 查询进行了完整标注。\n- **深度解析**: 传统的对话式澄清效率低且不符合实际工作流。ARCS 基准揭示了在存在歧义时 Text-to-SQL 依然极具挑战性：gpt-6-sol 的端到端执行准确率仅为 51%，没有开源模型超过 27%（摘要未提供 ARCS 的具体数据规模数字）。这表明即使是最先进的模型在处理自然歧义时也存在严重不足，凸显了结构化消歧的必要性。\n- **领域归类**: [自然语言处理, 数据库, Text-to-SQL]\n---\n\n### 14. Learning More by Training Less: Uncertainty-Guided Progressive Contraction for Efficient Reasoning Post-Training (少训练多学习：用于高效推理后训练的不确定性感知的渐进收缩框架)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12933)\n- **研究任务**: 探索在不牺牲能力的前提下，推理监督数据可以压缩到什么程度，提出一种不确定性感知的渐进收缩框架，将监督和优化集中在对学习最有价值的推理轨迹上。\n- **核心亮点**: 提出两阶段收缩框架：第一阶段通过构建蒙特卡洛推理树暴露过程级不确定性，将原始语料收缩为紧凑的教师信息池；第二阶段在 SFT 期间进行在线路由，根据学生不断变化的学习状态集中优化。\n- **深度解析**: 该方法大幅减少了学生的训练预算。实验表明，该方法仅使用全数据 SFT 优化预算的 0.22%（训练曝光量减少 450 倍以上），同时保持或提高了推理性能。该框架在异构学生模型家族、黑盒教师以及弱到强迁移中表现出良好的泛化能力，证明其不仅是加速训练的方法，还能增强推理能力（摘要未提供具体的推理基准名称和详细的性能提升数字）。\n- **领域归类**: [大语言模型, 后训练优化, 推理能力]\n---\n\n### 15. Initialization Improves LLM-Driven Discovery (初始化改善 LLM 驱动的科学发现)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00707)\n- **研究任务**: 研究在 LLM 驱动的科学发现（如算法、定理、药物发现）中，先前迭代种群与最终发现成功之间的关系，并解决迭代优化中的模式崩溃问题。\n- **核心亮点**: 开发了包含 12 个 harness 的“Modular”套件；发现早期发现的性能可以预测最终成功；提出一种普遍适用的干预措施，通过初始阶段的并行探索来初始化后续的迭代优化。\n- **深度解析**: 研究发现发现成功对 harness 设计非常脆弱和敏感，“模式崩溃”（迭代多样性急剧下降）是常见的失败模式。现有的旨在延长崩溃的多样性诱导干预效果不一致。相反，早期发现的性能具有预测性。通过引入初始并行探索阶段进行初始化，该方法在许多 harness 和目标应用中提供了一致的增益，证实了初始化在 LLM 驱动发现中的重要性（摘要未提供具体的 5 个发现任务名称及具体的性能提升数字）。\n- **领域归类**: [大语言模型应用, 科学发现, 优化算法]\n---\n\n### 16. Branching On-Policy Distillation (分支在策略蒸馏)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13481)\n- **研究任务**: 解决在策略蒸馏（OPD）中由于单一轨迹在每个决策点只实现一个延续，导致在有限采样预算下监督覆盖率受限的问题。\n- **核心亮点**: 提出 BranchOPD，利用学生不确定性和师生分歧选择信息量大的决策点，从共享前缀重新采样学生策略延续，并对主轨迹和分支应用 token 级教师监督；引入协议边界修复（PBR）以减轻重复和无效生成。\n- **深度解析**: BranchOPD 在数学的 token 级决策和智能体任务的轮内决策中运行。共享前缀复用显著降低了学生生成的 token 成本（ALFWorld 降低约 19%，WebShop 降低约 31%）。在所有评估基准上，BranchOPD 优于 Vanilla OPD 和 Multi-Rollout OPD (n=7)，在 16 个采样答案的平均数学准确率上比 Vanilla OPD 提高 18.55 个百分点，在 ALFWorld ID/OOD 成功率上提高 13.8 个百分点。机制分析表明，在不确定决策处进行分支能扩大后续行为覆盖率（摘要未提供具体的基准测试完整名称）。\n- **领域归类**: [大语言模型, 知识蒸馏, 智能体]\n---\n\n### 17. Visual Grounding Safety in Vision-Language Models (视觉语言模型中的视觉定位安全性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05637)\n- **研究任务**: 系统分析视觉语言模型（VLMs）在生成结构化输出（如点和边界框）以供下游接口、智能体和机器人执行时的安全对齐问题。\n- **核心亮点**: 将三个安全基准转化为 15,401 对仅在请求输出（自由文本 VQA 或定位点/框）上不同的有害请求对；提出一种结合定位形式拒绝、能力定位数据和自蒸馏良性数据的微调方法。\n- **深度解析**: 研究发现，对于以问题形式提出的有害请求，模型通常会拒绝，但当相同请求要求定位时，模型往往会遵从（定位拒绝率比 VQA 拒绝率低 31-59 个百分点），且安全系统提示无法弥补这一差距。提出的微调方法在 Qwen3-VL-8B 和 VisionReasoner-7B 上，将 VLSU 和 BBQ-V 的定位拒绝率提高了 77-95 个百分点，在 Asimov-2.0 上提高了 64-85 个百分点，同时保留了定位能力并限制了过度拒绝（摘要未提供具体的 VQA 基础拒绝率数字）。\n- **领域归类**: [视觉语言模型, 安全与对齐, 视觉定位]\n---\n\n### 18. Prospective Hindsight: Self-Calibrating Reinforcement Learning via Prediction-Reality Gaps (前瞻性后见之明：通过预测-现实差距实现自校准强化学习)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02740)\n- **研究任务**: 解决长视野智能体强化学习中仅依赖回顾性训练信号（动作时的信念对梯度不可见）的问题，提出一种自校准训练原则。\n- **核心亮点**: 引入 Prospective Hindsight (PH)，利用智能体的前瞻性预测（反馈前）与回顾性评估（反馈后）之间的差距（即“惊喜”信号）来增强梯度贡献；通过停止梯度的惊喜加权优势，将校准作为优化的副产品。\n- **深度解析**: 由于前瞻性预测器与策略共享参数，两者共同进化，逐渐将注意力转移到智能体剩余的盲点上。在单轮可验证任务和多轮个人智能体任务（在 GRPO、在策略蒸馏及其组合下）中，PH 提高了任务性能和校准能力，在不同模型规模上具有一致的增益。值得注意的是，主要的错误校准模式在不同机制间发生结构性转变（单轮中过度自信失败，多轮中自信不足成功），但同一训练原则成功解决了这两种问题（摘要未提供具体的任务名称、模型规模数字及具体的性能提升指标）。\n- **领域归类**: [强化学习, 大语言模型, 自我校准]\n---\n\n### 19. Evaluating LLM Creativity through Long-Tail Performance (通过长尾性能评估大语言模型的创造力)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12998)\n- **研究任务**: 解决大语言模型创造力基准在任务和指标设计上差异巨大的问题，探索它们是否捕捉到了共同的创造力概念，并提出将其形式化为参考输入输出分布长尾中的特定任务性能。\n- **核心亮点**: 提出创造力共享目标可形式化为长尾性能；引入 q@Tail(α)，一种低成本的创造力诊断方法，用于测量现有基准长尾部分上的平均任务质量。\n- **深度解析**: 研究使用 n-gram 在预训练数据中的缺失作为新颖性代理，在 15 个基准和 26 个开放权重模型上进行了实证评估（摘要未提供具体的基准和模型名称）。结果表明，创造力基准比标准基准更处于长尾区域。此外，在创造力和标准基准上，较高长尾子集的模型排名与 LM-Arena 中的人类创造力判断更一致。将 q@Tail(α) 应用于促进创造力的方法，揭示了通过增强长尾性能来改善 LLM 创造力仍有很大空间（摘要未提供具体的 q@Tail 数值）。\n- **领域归类**: [大语言模型, 模型评估, 创造力]\n---\n\n### 20. Same Output, Different Gold: Measuring How Reference Choice Moves a Multilingual Benchmark Score (相同输出，不同金标准：衡量参考选择如何影响多语言基准分数)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03825)\n- **研究任务**: 研究基准测试中参考标准（Gold reference）的选择对系统输出评分的影响，指出方法论关注几乎完全集中在系统输出上而忽视了参考标准。\n- **核心亮点**: 利用一个包含六种语言的个人身份信息基准的保留注释记录（摘要未提供具体基准名称），在固定评分输出的情况下交换参考标准，量化了参考选择对分数的影响；提出“参考敏感度带”概念。\n- **深度解析**: 研究发现，由于未记录的聚合默认设置，导致发布的参考标准部分复制了被评分的输出。在固定输出的情况下，交换参考标准导致一个输出的 F1 分数移动了 4.95 分，另一个移动了 2.00 分，最差语言移动了 7.55 分。两个输出之间的比较也发生了移动（配对交互为 +2.95 分），甚至直接改变了一种语言的边际优势。研究呼吁将参考敏感度带与分数一起报告（摘要未提供具体的六种语言名称）。\n- **领域归类**: [自然语言处理, 模型评估, 多语言处理]\n---\n\n### 21. UNITAS: A 3D-Native World Action Model for Embodied Manipulation (UNITAS：用于具身操作的3D原生世界动作模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12099)\n- **研究任务**: 构建一个能够回答耦合物理问题的世界动作模型（WAM），即给定任务指令，预测机器人应执行的动作以及该动作将如何改变周围的物理世界。\n- **核心亮点**: 提出了首个3D原生的世界动作模型 UNITAS，在共享的度量3D空间内统一了观察、动作和场景动态，支持跨机器人形态和人手的通用表示。\n- **深度解析**: 现有的世界动作模型多基于预训练视频生成器，通过图像或视觉潜变量表示世界演变，但图像是依赖视角的投影，像素距离无法直接编码物理距离。UNITAS 采用3D原生表示，将人手和机器人夹爪表示为3D点轨迹（动作流），场景点位移表示为场景流。模型包含世界对齐的3D位置嵌入（用于视觉token接地）和物理时间轨迹分词器。拥有17亿参数的 UNITAS 在 RoboTwin 数据集上实现了最佳的动作条件场景预测（位移误差比 PointWorld 低49%），在 LIBERO 数据集上操作成功率达99.8%，在真实世界任务中平均成功率达85%。\n- **领域归类**: [具身智能, 机器人操作, 3D视觉, 世界模型]\n---\n\n### 22. SPLATIFY: Reproduce, Discover, Innovate! From Papers and Ideas to Trainable 3DGS Code (SPLATIFY：复现、发现与创新！从论文和想法到可训练的3DGS代码)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09116)\n- **研究任务**: 解决3D高斯溅射（3DGS）研究中重新实现论文耗时费力的问题，自动将3DGS论文转化为可训练的基于 gsplat 的代码实现。\n- **核心亮点**: 提出了一个多智能体框架 SPLATIFY，通过上下文无关语法、忠实复现架构、知识驱动的组合改进、跨学科方法发现以及专属评估框架，实现从论文到代码的自动转化与创新。\n- **深度解析**: SPLATIFY 包含五项创新：1）为 gsplat 设计了带有扩展点的上下文无关语法，确保生成的代码满足架构不变量；2）引入 fork 感知引用恢复、Graph-of-Thought 合成、RAG 引导的上下文示例选择和视觉反馈等机制以实现忠实复现；3）通过知识驱动的组合改进，自主发现弱点并组合正则化器、损失和密集化策略以超越原始结果；4）跨学科方法发现，从3DGS文献外检索物理先验并与渲染知识结合；5）构建了包含30篇论文的 SPLATIFY-Bench 评估框架。在无公开代码的论文上，该框架匹配专家实现，将开发时间从数周缩短至数分钟，并通过组合发现将 PSNR 最高提升2.4 dB。此外，还展示了体积星云渲染等科学领域的全新方法。\n- **领域归类**: [3D视觉, 代码生成, 多智能体系统, 3D高斯溅射]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [debpalash/VoiceStudio](https://github.com/debpalash/VoiceStudio)\n- **今日趋势**: ⭐ 62,734 | 🍴 6,990 | 📈 今日 +2,277 stars\n- **项目简介**: 开源的本地化 ElevenLabs 替代品，支持语音克隆、设计、视频配音、听写、转录和有声书创建等 646 种语言处理。\n- **核心价值**: \n  - **用途**: 提供完全本地的多语言语音处理、克隆与生成工具。\n  - **目标人群**: 内容创作者、开发者及需要多语言语音处理的用户。\n  - **技术核心**: 本地化语音克隆、语音合成（TTS）、语音识别（ASR）及多语言处理技术。\n  - **AI/大模型相关**: 是（涉及语音克隆、转录等 AI 语音技术）。\n\n### [Alishahryar1/free-claude-code](
