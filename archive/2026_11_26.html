models to perceive complex scenes, control actions, and make decisions over long horizons. Existing game benchmarks primarily test language models as computer-use agents that query a language model throughout play, incurring repeated inference cost and, in real-time games, acting while the environment continues to evolve. We ask whether coding agents can learn from game interaction to develop standalone game-playing programs that run without language model inference. We thus introduce Coding4Games, a benchmark for evaluating whether coding agents can develop standalone programs that play modern games through visual observations and standard game inputs. Coding4Games has three defining features: 1) Diverse Modern Games, covering 15 games with diverse visual, strategic, and control demands; 2) Development-Test Separation, in which a coding agent uses a sandbox and the standard player interface to iteratively develop a program, after which the selected program is frozen and independently tested without language-model inference; and 3) Outcome and Process Evaluation, which measures not only game performance and reliability but also how agents use feedback, revise programs, and resolve problems during development. Across 15 games, the best program per game outscores the strongest GUI baseline on 13 and ties it on one. The human player outscores all agents on 10 games. We additionally examine the effects of development budgets. Coding4Games evaluates whether coding agents can turn their understanding of complex interactive environments into programs that work reliably on their own.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e游戏，尤其是现代3A游戏，挑战语言模型感知复杂场景、控制动作并在长期范围内做出决策。现有的游戏基准主要测试语言模型作为计算机使用智能体，在整个游戏过程中查询语言模型，从而产生重复的推理成本，并且在实时游戏中，在环境继续演变时采取行动。我们询问编码智能体是否可以从游戏交互中学习，以开发无需语言模型推理即可运行的独立游戏程序。因此，我们引入了Coding4Games，这是一个评估编码智能体是否能开发出通过视觉观察和标准游戏输入玩现代游戏的独立程序的基准。Coding4Games具有三个定义特征：1）多样化的现代游戏，涵盖15个具有不同视觉、战略和控制需求的游戏；2）开发-测试分离，其中编码智能体使用沙盒和标准玩家接口迭代开发程序，之后冻结所选程序并在没有语言模型推理的情况下独立测试；3）结果和过程评估，不仅衡量游戏性能和可靠性，还衡量智能体在开发过程中如何使用反馈、修改程序和解决问题。在15个游戏中，每个游戏最好的程序在13个游戏中得分超过最强的GUI基线，在1个游戏中与之持平。人类玩家在10个游戏中得分超过所有智能体。我们还额外研究了开发预算的影响。Coding4Games评估编码智能体是否能将其对复杂交互环境的理解转化为能够独立可靠运行的程序。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估编码智能体是否能通过视觉观察和标准游戏输入，开发出不依赖语言模型推理的独立游戏程序来玩现代电子游戏。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Coding4Games基准，包含15款现代游戏；具有开发-测试分离特征，冻结程序后独立测试无需推理；包含结果和过程评估；最佳程序在13款游戏中超越最强GUI基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出现有游戏基准在游玩时持续查询语言模型，导致重复推理成本和环境演变问题。Coding4Games通过开发-测试分离，要求智能体开发独立程序来解决此问题。实验在15款游戏上进行，对比了GUI基线和人类玩家，并考察了开发预算的影响。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 游戏智能体与代码生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation（Nemotron-Labs-VisualCreation：用于智能体视觉创作的像素即代码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31358\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31358\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemotron-native harness coordinates planning and raster candidate selection, with targeted repair for editable structured and hybrid artifacts. To support this interface, we develop Nemotron-Labs-Image-Tokenizer, the autoregressive raster generator Nemotron-Labs-Image-30B-A3B, and the structured-code model family Nemotron-Labs-VisionCode. On approximately 178K images spanning six visual domains, our tokenizer improves reconstruction PSNR from 26.08 to 29.57 dB over Emu3.5 IBQ. It also provides 7.13x faster encoding and 10.93x faster decoding at batch size one on A100. In standalone evaluation, one Nemotron-Labs-VisionCode variant surpasses Kimi K3.1 Pro on the aggregate across Chart2Code, MMSVG, Design2Code, and Image2Struct. At the system level, the Nemotron-native configuration raises GenEval2 Soft-TIFA GM from 31.71 to 52.56 using the same raster generator. With our best setting, Nemotron-Labs-VisualCreation achieves performance competitive with GPT Image 2 and Nano Banana Pro across most benchmarks with available comparisons.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉创作需要富有表现力的图像以及对文本、布局和结构的精确控制。我们引入了Nemotron-Labs-VisualCreation，这是一个通过像素即代码连接这些能力的智能体框架。光栅图像由学习到的离散视觉token表示，而结构化产物使用显式程序。一个共享的生成和渲染接口将这些表示连接到跨图像、矢量图形、网页和文档的视觉反馈。一个Nemotron原生框架协调规划和光栅候选选择，并对可编辑的结构化和混合产物进行针对性修复。为了支持该接口，我们开发了Nemotron-Labs-Image-Tokenizer、自回归光栅生成器Nemotron-Labs-Image-30B-A3B以及结构化代码模型家族Nemotron-Labs-VisionCode。在跨越六个视觉领域的大约178K张图像上，我们的分词器将重建PSNR从Emu3.5 IBQ的26.08 dB提高到29.57 dB。它还在A100上批量大小为1时提供7.13倍更快的编码和10.93倍更快的解码。在独立评估中，一个Nemotron-Labs-VisionCode变体在Chart2Code、MMSVG、Design2Code和Image2Struct的总和上超过了Kimi K3.1 Pro。在系统级别，Nemotron原生配置使用相同的光栅生成器将GenEval2 Soft-TIFA GM从31.71提高到52.56。在我们的最佳设置下，Nemotron-Labs-VisualCreation在大多数有可用比较的基准测试中实现了与GPT Image 2和Nano Banana Pro相竞争的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e实现具有表现力的图像以及对文本、布局和结构的精确控制的视觉创作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Nemotron-Labs-VisualCreation智能体框架，通过像素即代码连接光栅图像和结构化产物；开发Image-Tokenizer、Image-30B-A3B和VisionCode模型；Tokenizer显著提升PSNR和编解码速度；系统级配置大幅提升GenEval2指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出视觉创作需要表现力和精确控制。该框架通过共享接口连接光栅和结构化表示，并使用Nemotron原生框架协调规划和修复。实验在约178K张图像上评估了Tokenizer的重建PSNR和速度，并在多个基准上评估了VisionCode，系统级评估了GenEval2。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态生成与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. VenusOCR2.0: Towards Efficient and Effective Document Parsing（VenusOCR2.0：迈向高效且有效的文档解析）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32617\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32617\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present VenusOCR2.0, a compact 1B-parameter vision-language recognizer designed for both high-accuracy and high-throughput document parsing across text, tables, and formulas. To continuously improve recognition quality without self-training collapse, we build a bounded recursive self-improvement (RSI) data engine where the model acts strictly as a weakness probe, while external multi-expert medoid consensus, VLM visual verification, and factorized synthesis supply reliable supervision across pretraining, curated SFT, and RLVR. VenusOCR2.0 couples a dynamic-resolution SigLIP2 encoder and 2x2 spatial token merging with a Qwen3-0.6B decoder, adopting compact atomic OTSL tokens to shorten table sequences and reduce structural errors. To further eliminate the autoregressive decoding bottleneck, we introduce PTPv2, a lightweight (sim67M) decoupled parallel draft module that combines frozen multi-layer verifier conditioning, a standalone learned mask, and block-causal all-position next-token prediction. On OmniDocBenchv1.6, VenusOCR2.0 achieves an overall score of 96.45 and a state-of-the-art 98.57 formula CDM, substantially outperforming massive general-purpose VLMs such as Gemini-3-Pro (92.91) and Qwen3-VL-235B (89.78). Deployed in vLLM on a single H20 GPU, PTPv2 delivers a 2.96x single-request speedup and up to 2.36x higher batched throughput while guaranteeing lossless, token-for-token equivalence with standard autoregressive decoding.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了VenusOCR2.0，一个紧凑的10亿参数视觉语言识别器，专为跨文本、表格和公式的高精度和高吞吐量文档解析而设计。为了在没有自训练崩溃的情况下持续提高识别质量，我们构建了一个有界递归自我改进数据引擎，其中模型严格作为弱点探针，而外部多专家中心共识、VLM视觉验证和因式分解合成在预训练、精选SFT和RLVR中提供可靠的监督。VenusOCR2.0将动态分辨率SigLIP2编码器和2x2空间token合并与Qwen3-0.6B解码器结合，采用紧凑的原子OTSL token来缩短表格序列并减少结构错误。为了进一步消除自回归解码瓶颈，我们引入了PTPv2，一个轻量级的解耦并行草稿模块，它结合了冻结的多层验证器条件、独立学习的掩码和块因果全位置下一token预测。在OmniDocBenchv1.6上，VenusOCR2.0获得了96.45的总分和98.57的最先进公式CDM，大幅超越了Gemini-3-Pro（92.91）和Qwen3-VL-235B（89.78）等庞大的通用VLM。部署在单个H20 GPU的vLLM上，PTPv2提供了2.96倍的单请求加速和高达2.36倍的更高批处理吞吐量，同时保证与标准自回归解码的无损、逐token等价。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e实现跨文本、表格和公式的高精度和高吞吐量文档解析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出10亿参数的VenusOCR2.0；构建有界递归自我改进数据引擎防止自训练崩溃；结合动态分辨率SigLIP2编码器、2x2空间token合并和Qwen3-0.6B解码器，采用原子OTSL token；引入轻量级PTPv2并行草稿模块消除自回归解码瓶颈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出需要高精度和高吞吐量的文档解析，并面临自训练崩溃和自回归解码瓶颈。VenusOCR2.0通过递归自我改进数据引擎、紧凑的架构设计和PTPv2模块解决这些问题。实验在OmniDocBenchv1.6上评估，总分和公式CDM大幅超越大参数通用VLM，PTPv2在单H20 GPU上显著提升速度且保持无损。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 文档解析与OCR\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. LoopDVR: Looped Transformer for Efficient Dense Visual Recognition（LoopDVR：用于高效密集视觉识别的循环Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32067\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32067\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe propose LoopDVR, a framework for converting pretrained Transformer-based dense visual recognition models into parameter-efficient looped networks. Rather than reducing the network width or depth directly, LoopDVR reuses Transformer blocks across layers in both the ViT backbone and Transformer decoder, reducing the number of parameters while retaining the original computational structure. However, naively sharing parameters can disrupt the distinct transformations learned at different depths. To address this challenge, we identify suitable sharing groups based on inter-layer representation dissimilarity and keep the final backbone block independent for multi-scale feature construction. We then initialize each shared backbone block with the pretrained weights of its group\u0026#x27;s terminal layer to better preserve the learned representations. An independent Loop Adapter at each layer further helps retain depth-specific transformations within shared blocks. Subsequently, we distill visual representations into the looped backbone and integrate it with a looped decoder for task-specific training. Experiments demonstrate that LoopDVR achieves the best accuracy--parameter trade-offs across dense recognition tasks. Compared with the reference models, it reduces parameters by approximately 28% while maintaining competitive accuracy. Notably, LoopDet-S achieves 50.9 box AP with only 7.0M parameters, highlighting its effectiveness in compact models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了LoopDVR，一个将预训练的基于Transformer的密集视觉识别模型转换为参数高效的循环网络的框架。LoopDVR没有直接减少网络宽度或深度，而是在ViT主干和Transformer解码器的各层之间重用Transformer块，在保留原始计算结构的同时减少了参数数量。然而，简单地共享参数可能会破坏在不同深度学习的独特变换。为了应对这一挑战，我们基于层间表示的不相似性识别出合适的共享组，并保持最终的主干块独立以进行多尺度特征构建。然后，我们用其组终端层的预训练权重初始化每个共享的主干块，以更好地保留学习到的表示。每层一个独立的循环适配器进一步帮助在共享块内保留特定深度的变换。随后，我们将视觉表示蒸馏到循环主干中，并将其与循环解码器集成以进行特定任务的训练。实验表明，LoopDVR在密集识别任务中实现了最佳的准确率-参数权衡。与参考模型相比，它在保持具有竞争力的准确率的同时，将参数减少了约28%。值得注意的是，LoopDet-S仅使用7.0M参数就达到了50.9的box AP，突出了其在紧凑模型中的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将预训练的基于Transformer的密集视觉识别模型转换为参数高效的循环网络，以减少参数数量同时保持计算结构和准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出LoopDVR框架，在ViT主干和Transformer解码器中跨层重用Transformer块以减少参数。2. 基于层间表示不相似性识别共享组，保持最终主干块独立，并使用终端层权重初始化共享块。3. 引入独立的循环适配器以保留特定深度的变换。4. 在密集识别任务中实现最佳的准确率-参数权衡，参数减少约28%，LoopDet-S以7.0M参数达到50.9 box AP。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出简单共享参数会破坏不同深度的独特变换，LoopDVR通过分组共享、独立最终块、特定初始化及循环适配器解决了这一问题。局限性方面，摘要未提供关于模型在特定极端场景下的表现、循环层数对性能的具体影响曲线，以及与其他非循环参数高效微调方法的详细对比，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 密集视觉识别 / 模型压缩与高效推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Residual Guidance for Real-Time Interactive Video Generation（实时交互式视频生成的残差引导）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32820\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32820\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReal-time interactive video generation allows users to change the prompt during generation to steer the evolving video. However, existing streaming models, which generate videos chunk by chunk, often keep following the previous prompt after a switch. We trace this failure to context inertia, where the previous chunk acts as a strong prior that suppresses the new prompt. Furthermore, we find that this inertia persists even when the cache retains only the previous chunk, yet discarding the context breaks visual continuity, which limits approaches that edit the cache. Rather than editing the cache, we propose Residual Guidance (RG), a simple, training-free method that counteracts context inertia with a correction measured outside the cache. Specifically, RG denoises the re-noised previous chunk once under the new prompt without the cache and adds the resulting residual to the early denoising steps of the next chunk, where its content is largely decided and the new prompt is most suppressed. Across settings ranging from a single switch to long multi-switch generation, RG substantially improves prompt switching capability on existing streaming models, including those with dedicated switching mechanisms, while largely retaining visual quality. As it requires no training or per-model tuning and adds only one forward pass per chunk, RG can be easily integrated into existing real-time video generation pipelines.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e实时交互式视频生成允许用户在生成过程中更改提示词以引导不断发展的视频。然而，现有的逐块生成视频的流式模型在切换后通常继续遵循之前的提示词。我们将这种失败归因于上下文惯性，即前一个块作为强烈的先验抑制了新提示词。此外，我们发现即使缓存仅保留前一个块，这种惯性依然存在，而丢弃上下文会破坏视觉连续性，这限制了编辑缓存的方法。我们没有编辑缓存，而是提出了残差引导（RG），这是一种简单、无需训练的方法，通过在缓存外测量的校正值来抵消上下文惯性。具体而言，RG在无缓存的情况下在新提示词下对重新加噪的前一个块进行一次去噪，并将产生的残差添加到下一个块的早期去噪步骤中，此时其内容已基本决定且新提示词被最大程度地抑制。在从单次切换到长多次切换生成的各种设置中，RG大幅提高了现有流式模型（包括具有专用切换机制的模型）的提示词切换能力，同时很大程度上保留了视觉质量。由于它不需要训练或针对每个模型的调整，并且每个块仅增加一次前向传播，因此RG可以轻松集成到现有的实时视频生成管道中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决实时交互式视频生成中流式模型在切换提示词时因上下文惯性而无法遵循新提示词的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现流式视频生成中的上下文惯性问题，即前一个块抑制新提示词，且丢弃上下文会破坏视觉连续性。2. 提出残差引导（RG），一种无需训练的方法，通过在缓存外计算校正值来抵消上下文惯性。3. RG将新提示词下去噪前一个块的残差加到下一个块的早期去噪步骤中。4. 在单次和多次切换设置中大幅提升提示词切换能力，保留视觉质量，且每块仅增加一次前向传播，易于集成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出上下文惯性导致提示词切换失败，且直接丢弃上下文会破坏视觉连续性。RG通过在缓存外计算残差并注入下一块早期去噪步骤来解决此问题。局限性方面，摘要未提供RG方法在极端复杂场景下的具体视觉质量下降数值、与其他缓存编辑方法的详细定量对比，以及多次频繁切换时的延迟增加情况，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成 / 交互式生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. Mega-MMDF and DeepfakeBench-MM: Benchmarking Multimodal Deepfake Detection Across Diverse Forgery Pipelines（Mega-MMDF 与 DeepfakeBench-MM：跨多种伪造管道对多模态深度伪造检测进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 7 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2510.22622\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2510.22622\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAudio-visual deepfakes can spread misinformation and enable impersonation, undermining trust in digital media. However, existing datasets provide limited coverage of forgery operations and their combinations, constraining detector development and systematic evaluation. We introduce Mega-MMDF, containing 100,000 real and 1.2 million forged clips across 22 pipelines spanning modality-specific manipulations, stacked forgeries, and joint audio-video generation. To assess its training value and enable fair comparisons, we develop DeepfakeBench-MM, which standardizes training and evaluation across 8 datasets and 10 detectors. Training-based detectors achieve their highest mean AUC when trained on Mega-MMDF, with gains of up to 0.0784 over the best alternative training dataset for each detector. Experiments on data scale and pipeline coverage further support the value of large, diverse training data. Cross-pipeline evaluations reveal bidirectional and asymmetric generalization. Training on composite forgeries does not necessarily enable detection of their constituent operations in isolation. Our analysis of altered inputs shows that modality masking can increase false alarms and missed detections, and temporal misalignment can raise mean predicted forgery probabilities. Together, these resources provide a foundation for understanding and improving multimodal deepfake detection, with publicly available code and dataset access subject to application and usage terms.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视听深度伪造可以传播错误信息并实现身份冒充，破坏对数字媒体的信任。然而，现有数据集对伪造操作及其组合的覆盖有限，限制了检测器的开发和系统评估。我们引入了Mega-MMDF，包含10万个真实和120万个伪造片段，涵盖22种管道，包括特定模态的操作、堆叠伪造和联合音视频生成。为了评估其训练价值并实现公平比较，我们开发了DeepfakeBench-MM，在8个数据集和10个检测器上标准化了训练和评估。基于训练的检测器在Mega-MMDF上训练时达到了最高的平均AUC，与每个检测器的最佳替代训练数据集相比，增益高达0.0784。关于数据规模和管道覆盖率的实验进一步支持了大型、多样化训练数据的价值。跨管道评估揭示了双向和不对称的泛化。在复合伪造上训练并不一定能使其能够单独检测其组成操作。我们对改变输入的分析表明，模态掩码会增加误报和漏报，时间不对齐会提高平均预测伪造概率。这些资源共同为理解和改进多模态深度伪造检测提供了基础，公开可用的代码和数据集访问需遵守申请和使用条款。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建涵盖多种伪造操作及其组合的大规模多模态深度伪造数据集（Mega-MMDF）和标准化评估基准（DeepfakeBench-MM），以推动多模态深度伪造检测器的发展和系统评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Mega-MMDF数据集，包含10万真实和120万伪造片段，覆盖22种伪造管道（特定模态、堆叠、联合生成）。2. 开发DeepfakeBench-MM基准，在8个数据集和10个检测器上标准化训练和评估。3. 检测器在Mega-MMDF上训练获得最高平均AUC，比最佳替代数据集提升高达0.0784。4. 发现跨管道泛化是双向且不对称的，复合伪造训练不一定能检测孤立组成操作；模态掩码增加误报和漏报，时间不对齐提高预测伪造概率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出现有数据集覆盖有限，Mega-MMDF通过大规模和多样化管道解决了这一问题，并揭示了跨管道泛化的不对称性以及模态掩码和时间不对齐对检测的影响。局限性方面，摘要未提供检测器在特定未知管道上的具体泛化数值、模态掩码和时间不对齐的具体量化影响程度，以及数据集在真实世界复杂场景下的鲁棒性测试，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多媒体安全 / 深度伪造检测与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. PINE: Point, Instance and Normal Estimation in One-Step Diffusion Model（PINE：在单步扩散模型中进行点、实例和法线估计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29389\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29389\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnderstanding a scene requires both geometry and semantics: geometry recovers its spatial structure, and semantics separates it into objects. Current models obtain the two from separate networks or separate passes. We present PINE, a one-step Omni Diffusion Transformer that predicts the point map, the surface normals, and the instance map of an image in one forward pass. PINE treats each map as a token stream, and a stream mask decides which streams interact. A camera-aware ray encoding positions every token by its camera ray rather than its pixel. Grounding attention adds the affinity of pretrained DINOv3 features to the attention logits. Trained on only 139K synthetic images for geometry, PINE achieves state-of-the-art point maps whether or not intrinsics are given and the best average rank on surface normals. It also exceeds SAM on large objects with less than 1 percent of its training images, and it predicts all three maps 5.7x faster than MoGe-3 with SAM.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e理解场景需要几何和语义：几何恢复其空间结构，语义将其分离为对象。当前模型从单独的网络或单独的通道获取这两者。我们提出了PINE，一个单步全能扩散Transformer，在一次前向传播中预测图像的点图、表面法线和实例图。PINE将每个图视为一个标记流，流掩码决定哪些流进行交互。相机感知光线编码通过其相机光线而非像素来定位每个标记。接地注意力将预训练的DINOv3特征的亲和力添加到注意力对数中。仅使用139K张几何合成图像进行训练，PINE无论是否提供内参都能实现最先进的点图，并在表面法线上获得最佳平均排名。它还在大对象上超过了SAM，且训练图像不到SAM的1%，并且它预测所有三个图的速度比带有SAM的MoGe-3快5.7倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在单次前向传播中同时预测图像的点图、表面法线和实例图，以统一场景的几何和语义理解。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出PINE，一种单步全能扩散Transformer，在一次前向传播中同时预测点图、表面法线和实例图。2. 将每个图视为标记流，通过流掩码控制交互；使用相机感知光线编码定位标记。3. 引入接地注意力，将预训练DINOv3特征的亲和力加入注意力对数。4. 仅用139K合成图像训练，在点图和表面法线估计上达到SOTA；大对象实例分割超过SAM（训练数据不到其1%）；预测速度比MoGe-3加SAM快5.7倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前模型分别获取几何和语义，PINE通过单步扩散模型统一了这三项任务，并利用流掩码、相机感知光线编码和接地注意力等机制提升性能。局限性方面，摘要未提供在真实世界复杂场景下的具体性能指标、对非合成数据或无内参情况下的具体误差数值，以及模型在极高分辨率图像上的推理时间和显存消耗，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉与场景理解 / 扩散模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. Distill to Loop: Turning Pretrained Diffusion Transformers into Looped Models with Adjustable Depth（蒸馏至循环：将预训练扩散Transformer转换为具有可调深度的循环模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31977\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31977\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped transformers reuse one block of shared weights along the depth of the network. Recent looped diffusion transformers are trained from scratch, which repeats the full pretraining cost although strong pretrained non-looped diffusion transformers exist. We propose Distill to Loop (Dooop), which distills a pretrained non-looped diffusion transformer into a looped student whose blocks are initialized from the teacher\u0026#x27;s. We cast distillation as a fixed-point iteration toward the teacher, in which the output after every loop is trained toward the teacher, and each loop is one step of an ordinary differential equation in depth. As a result, one model runs any number of loops at test time without retraining, and the higher-order ODE solvers of diffusion model sampling can be applied along the depth dimension for better results. Meanwhile, because a looped model produces an output after every loop, we also construct loop guidance between the outputs of different loop counts, which improves the generated samples at little extra compute. On SD3-medium, a looped student with about 37% of the teacher\u0026#x27;s parameters matches the teacher on average over GenEval, ImageReward, PickScore and HPSv2.1 with two to four loops, and with two loops it uses about 58% of the teacher\u0026#x27;s compute. And on a four-step SD3-medium, loop guidance raises the average of the four metrics from 88.2 to 99.2.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer沿网络深度重用一块共享权重。最近的循环扩散Transformer是从头训练的，这重复了完整的预训练成本，尽管存在强大的预训练非循环扩散Transformer。我们提出了蒸馏至循环（Dooop），它将预训练的非循环扩散Transformer蒸馏为一个循环学生模型，其块从教师模型初始化。我们将蒸馏转化为向教师的不动点迭代，其中每次循环后的输出都向教师训练，每次循环是深度上常微分方程的一步。因此，一个模型在测试时可以运行任意数量的循环而无需重新训练，并且扩散模型采样的高阶常微分方程求解器可以沿深度维度应用以获得更好的结果。同时，由于循环模型在每次循环后都会产生输出，我们还构建了不同循环次数输出之间的循环引导，这在很少的额外计算下改善了生成的样本。在SD3-medium上，一个具有教师模型约37%参数的循环学生模型在GenEval、ImageReward、PickScore和HPSv2.1上平均匹配教师模型，使用两到四次循环，并且使用两次循环时它使用了教师模型约58%的计算量。而在四步SD3-medium上，循环引导将这四个指标的平均值从88.2提高到99.2。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将预训练的非循环扩散Transformer蒸馏为具有可调深度的循环模型，以减少参数量和计算成本，同时保持生成质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Dooop方法，将预训练非循环扩散Transformer蒸馏为循环学生模型，块从教师初始化。2. 将蒸馏视为向教师的不动点迭代，每次循环是深度上常微分方程的一步，测试时可运行任意循环数无需重训。3. 构建不同循环次数输出间的循环引导，以极少额外计算提升生成质量。4. 在SD3-medium上，37%参数量的学生模型经2至4次循环平均匹配教师，2次循环仅需58%计算量；4步SD3-medium中循环引导将四项指标均值从88.2提升至99.2。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出从头训练循环扩散Transformer成本高昂，Dooop通过蒸馏预训练非循环模型解决了这一问题，并引入常微分方程视角和循环引导机制。局限性方面，摘要未提供在更多循环次数（如大于4次）下的性能饱和情况、循环引导在不同基础模型（非SD3）上的泛化能力，以及高阶常微分方程求解器沿深度维度应用时的具体数值稳定性问题，这些在摘要中均未提及。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像生成 / 模型压缩与知识蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. Separating Measurement Failures from Defence Failures in Split Language-Model Privacy（在分割语言模型隐私中分离测量失败与防御失败）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31752\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31752\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSplit-training privacy evaluations fail through distinct mechanisms. Evaluators can overlook an exposed gradient channel, align reconstructions against shifted labels, or deploy uncalibrated probes before testing a candidate defence, while calibrated attacks can also refute real defences. Separating these failure modes alters which claims survive. We conduct a retrospective evidentiary reanalysis across four split-LLM campaigns and two cross-cutting scope checks covering host key custody and variational mutual-information bounds, mapping every recorded claim to one of five admissibility states (breach, non-detection, undetermined coverage, invalid measurement, or out-of-scope inference). Across a 19-configuration exploration, only four of 24 required probes qualified, yet those four calibrated probes still established qualified privacy breaches in 13 configurations, while utility or learning-gain failures eliminated the remaining 6. In a seven-cell defence-redesign pilot, 2 quantised configurations failed utility gates, calibrated next-byte structure probes breached the 0.02 gate on all 7 cells (0.097 to 0.112), and qualified punctuation-property probes reached 0.79 to 0.89, yielding 4 failed and 3 undetermined composite privacy assessments (the latter from marginal null-band excursions on punctuation bindings). Negative evidence against both defence families remains intact. Scope checks further show that shared-key orthogonal wrappers protect passive network captures without hiding activations from a compromised restoring host, and why near-zero variational lower bounds leave worst-case leakage unconstrained. Rerunnable scripts verify 1,522 checks across 122 SHA-256-pinned artifacts while preserving each campaign\u0026#x27;s native seed intervals and retrospective boundaries.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e分割训练隐私评估通过不同的机制失败。评估者可能会忽略暴露的梯度通道，将重建与偏移标签对齐，或在测试候选防御之前部署未校准的探针，而校准的攻击也可以反驳真实的防御。分离这些失败模式会改变哪些主张能够存续。我们在四个分割大语言模型（split-LLM）活动和两个涵盖主机密钥托管和变分互信息边界的交叉范围检查中进行了回顾性证据重新分析，将每个记录的主张映射到五种可接受状态之一（破坏、未检测、未确定覆盖、无效测量或超出范围推断）。在19种配置的探索中，24个所需探针中只有4个合格，但这4个校准的探针仍在13种配置中确立了合格的隐私破坏，而效用或学习增益失败则排除了其余6种。在一个七单元防御重新设计试点中，2个量化配置未能通过效用门，校准的下一字节结构探针在所有7个单元（0.097至0.112）中突破了0.02门，合格的标点属性探针达到0.79至0.89，产生4个失败和3个未确定的综合隐私评估（后者来自标点绑定的边际零带偏移）。针对两个防御家族的负面证据依然完整。范围检查进一步表明，共享密钥正交包装器可以保护被动网络捕获，而无需向受损的恢复主机隐藏激活，以及为什么接近零的变分下界使最坏情况下的泄漏不受约束。可重新运行的脚本在122个SHA-256固定的制品上验证了1,522次检查，同时保留了每个活动的原生种子区间和回顾性边界。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和重新分析分割语言模型（split-LLM）训练中的隐私防御和测量失败模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出将隐私评估的失败模式分离为测量失败和防御失败；对四个split-LLM活动进行回顾性证据重新分析，将主张映射到五种可接受状态；在19种配置探索中，4个校准探针在13种配置中确立了隐私破坏；在七单元防御重新设计试点中，发现量化配置和探针的具体突破情况；提供可重新运行的脚本验证1,522次检查。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出评估者常因忽略梯度通道、标签偏移或未校准探针导致测量失败，而校准攻击也可能反驳真实防御。研究通过重新分析发现大量探针不合格，且部分防御配置在效用或隐私指标上失败。范围检查显示共享密钥正交包装器无法向受损主机隐藏激活，且接近零的变分下界使最坏情况泄漏不受约束。关于本研究的其他具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能安全与隐私\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. GRAPE-Bench: When Vision Degrades, Does Video Reasoning Hold?（GRAPE-Bench：当视觉退化时，视频推理是否依然稳健？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33020\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33020\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDespite strong performance on standard benchmarks, video reasoning models remain vulnerable to visual degradation, raising concerns about their reliability in safety-critical scenarios. Existing benchmarks address this concern in part by simulating visual degradation or probing model reasoning with challenging questions, leaving open how well models handle naturally degraded video and whether they can make the simpler judgments that matter for safe driving. To this end, we introduce GRAPE-Bench, which jointly evaluates video reasoning across visual degradation conditions and question difficulty. It combines a synthetic set spanning twelve corruption types across daily-life and driving videos with real-world footage of driving at night or in rain, snow, or fog. Each video is paired with three progressively challenging questions, from fundamental judgments with potential safety implications to demanding reasoning stress tests. Across open-weight and frontier models, we observe ranking reversals between synthetic and real-world conditions and level-specific weaknesses obscured by overall accuracy. Synthetic-data fine-tuning improves Qwen3.5-9B\u0026#x27;s real-world accuracy from 76.7% to 81.1%, while clean-privileged on-policy distillation reaches 80.4% in a separate reasoning-enabled setting. Through preference steering, we further demonstrate continuous control over a frozen model\u0026#x27;s trade-off between safety-relevant judgments and challenging reasoning, with little change in overall accuracy. Together, GRAPE-Bench provides a unified testbed for evaluating, improving, and controlling video reasoning under degraded visual conditions.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e尽管在标准基准测试中表现强劲，视频推理模型仍然容易受到视觉退化的影响，引发了人们对其在安全关键场景中可靠性的担忧。现有的基准测试通过模拟视觉退化或用具有挑战性的问题探测模型推理来部分解决这一问题，但模型处理自然退化视频的效果如何，以及它们是否能做出对安全驾驶至关重要的更简单判断，仍是未知数。为此，我们引入了GRAPE-Bench，它联合评估了视觉退化条件和问题难度下的视频推理。它结合了一个包含12种损坏类型的合成集（涵盖日常生活和驾驶视频）以及在夜间或雨、雪、雾中驾驶的真实世界录像。每个视频都配有三个逐渐增加难度的问题，从具有潜在安全影响的基本判断到要求苛刻的推理压力测试。在开源和前沿模型中，我们观察到合成条件和真实世界条件之间的排名逆转，以及被整体准确率掩盖的特定级别弱点。合成数据微调将Qwen3.5-9B的真实世界准确率从76.7%提高到81.1%，而在单独的推理启用设置中，清洁特权在策略蒸馏达到了80.4%。通过偏好引导，我们进一步展示了对冻结模型在安全相关判断和具有挑战性的推理之间权衡的连续控制，且整体准确率几乎没有变化。总之，GRAPE-Bench为在退化视觉条件下评估、改进和控制视频推理提供了一个统一的测试平台。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估视频推理模型在视觉退化条件和问题难度下的表现，并提供改进和控制模型的方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出GRAPE-Bench，联合评估视觉退化条件和问题难度下的视频推理；结合12种损坏类型的合成集和真实世界恶劣天气或夜间驾驶录像；发现合成与真实世界条件下模型排名逆转及特定级别弱点；通过合成数据微调将Qwen3.5-9B真实世界准确率从76.7%提升至81.1%；通过偏好引导实现对冻结模型在安全判断与复杂推理间权衡的连续控制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出视频推理模型在视觉退化下表现脆弱，现有基准未能充分评估自然退化视频和简单安全判断。GRAPE-Bench填补了这一空白，揭示了模型在真实与合成条件下的表现差异。关于本研究的具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. AdProducer: Towards Agentic Advertising Video Generation（AdProducer：面向智能体广告视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31466\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31466\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advances in video generation have made automated advertising production increasingly feasible. However, an effective advertisement must faithfully represent the product and communicate its selling points through compelling visual storytelling, which requires more than visual synthesis: it calls for deeper product understanding and strategic decisions about how to present product value. Crucially, product research and creative design are closely intertwined, as the information gathered about a product determines which features can be faithfully demonstrated and how they should be presented. In this paper, we introduce AdProducer, the first end-to-end agentic framework for advertising video creation, transforming concise creative briefs into finished advertisements. Our multimodal agent autonomously researches products through web and image search and translates its findings into selling-point-driven storyboards that guide a frozen video generator. To achieve this, we develop a dedicated data construction pipeline that yields two training datasets, AdProducer-SFT and AdProducer-RL, and train the agent through supervised fine-tuning followed by reinforcement learning with joint optimization of storyboard- and video-level rewards. We further introduce AdCreation-Bench, comprising 305 advertising briefs across eight domains, with two complementary metrics: PG-Score for product correctness and creative execution, and Ad-Score for overall advertising effectiveness assessed by an independent judge. Experiments demonstrate that AdProducer improves the PG-Score of MiniMax H3 from 17.3 to 51.3 and generalizes to Veo 3.1 without additional training, improving its score from 28.0 to 35.9, with consistent gains in Ad-Score, VideoScore2, and human evaluations. Code, models, and data are released.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e近年来视频生成的进展使得自动化广告制作越来越可行。然而，有效的广告必须忠实地展示产品，并通过引人入胜的视觉故事传达其卖点，这需要的不仅仅是视觉合成：它需要对产品有更深入的理解，以及关于如何展示产品价值的战略决策。至关重要的是，产品研究和创意设计紧密交织，因为收集到的关于产品的信息决定了哪些特征可以被忠实地展示以及应该如何展示。在本文中，我们引入了AdProducer，这是第一个用于广告视频创建的端到端智能体框架，将简洁的创意简报转化为完整的广告。我们的多模态智能体通过网络和图像搜索自主研究产品，并将其发现转化为以卖点驱动的故事板，从而指导冻结的视频生成器。为了实现这一目标，我们开发了一个专门的数据构建流程，生成两个训练数据集AdProducer-SFT和AdProducer-RL，并通过监督微调训练智能体，随后进行强化学习，联合优化故事板级和视频级奖励。我们进一步引入了AdCreation-Bench，包含跨八个领域的305个广告简报，具有两个互补的指标：用于产品正确性和创意执行的PG-Score，以及由独立评估者评估的整体广告效果Ad-Score。实验表明，AdProducer将MiniMax H3的PG-Score从17.3提高到51.3，并在无需额外训练的情况下泛化到Veo 3.1，将其分数从28.0提高到35.9，在Ad-Score、VideoScore2和人工评估中取得了一致的提升。代码、模型和数据已发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个端到端的智能体框架（AdProducer），将创意简报自动转化为广告视频，并构建评估基准（AdCreation-Bench）以衡量广告视频生成的质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出首个端到端广告视频创建智能体框架AdProducer，结合产品研究与创意设计；多模态智能体自主进行网络和图像搜索并生成卖点驱动的故事板；构建AdProducer-SFT和AdProducer-RL数据集，采用监督微调与强化学习联合优化；提出AdCreation-Bench（305个简报，8个领域），包含PG-Score和Ad-Score指标；AdProducer将MiniMax H3的PG-Score从17.3提升至51.3，并无训练泛化至Veo 3.1（28.0至35.9）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出有效广告需要深入的产品理解和战略决策，而不仅仅是视觉合成。AdProducer通过智能体自主研究和故事板生成解决了这一问题。关于本研究的具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态生成与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. Clinical3D-Bench: Evaluating and Improving Spatial Intelligence of Multimodal LLMs in Hospital Environments（Clinical3D-Bench：评估和提升多模态大语言模型在医院环境中的空间智能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32094\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32094\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpatial reasoning in hospitals requires tracking look-alike equipment, interpreting patient-relative directions, and judging passage widths, yet existing benchmarks provide limited coverage of these abilities. We introduce Clinical3D-Bench, a simulated benchmark with 3,368 questions of eight types on egocentric walkthroughs of 373 hospital-room layouts. Layouts follow hospital design guidelines, answers are computed from the 3D scenes, and paired scene states test whether models change their answers when relevant evidence changes. Videos are photorealistic, and ten physicians screened the layouts. Among 35 multimodal large language models (MLLMs), the best open and proprietary models reach 45.7% and 53.6% macro accuracy, against 40.8% for an answer prior and 79.0% for physicians on a subset, and 27 of 32 open models score below 40% on two-way patient-relative directions. Fine-tuning on Clinical3D-45K, our 44,750-question training set, lifts two MLLMs 16-20 points above the best proprietary model. 3D maps given to the fine-tuned MLLM as input go largely unused: replacing them with another video\u0026#x27;s, even when they are ground truth, barely changes its accuracy. The proposed GeoJeV instead lets the MLLM compute with 3D: it reconstructs a scene memory from each video, selects 3D operations and their arguments from the MLLM\u0026#x27;s question state, and adds their evidence to its option scores. It achieves the highest accuracy of all evaluated models, narrowing the gap to physicians.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e医院中的空间推理需要追踪外观相似的设备、解释相对于患者的方向，并判断通道宽度，然而现有的基准测试对这些能力的覆盖有限。我们引入了Clinical3D-Bench，这是一个模拟基准，包含3,368个属于八种类型的问题，基于373个医院房间布局的第一人称视角漫游。布局遵循医院设计指南，答案从3D场景中计算得出，配对的场景状态测试模型在相关证据改变时是否会改变其答案。视频是逼真的，十名医生对布局进行了审查。在35个多模态大语言模型（MLLM）中，最好的开源和专有模型分别达到45.7%和53.6%的宏观准确率，而答案先验为40.8%，医生在子集上的准确率为79.0%，并且32个开源模型中有27个在双向患者相对方向上得分低于40%。在我们的44,750个问题训练集Clinical3D-45K上进行微调，使两个MLLM的提升幅度比最好的专有模型高出16-20分。作为输入提供给微调后MLLM的3D地图基本未被使用：用另一个视频的3D地图替换它们，即使是真实情况，也几乎不会改变其准确率。提出的GeoJeV则让MLLM使用3D进行计算：它从每个视频重建场景记忆，从MLLM的问题状态中选择3D操作及其参数，并将其证据添加到其选项分数中。它在所有评估模型中实现了最高的准确率，缩小了与医生之间的差距。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估多模态大语言模型（MLLMs）在医院环境中的空间推理能力，并提出方法提升其空间智能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Clinical3D-Bench，包含373个医院房间布局的3,368个问题，涵盖8种类型，由医生审查；评估35个MLLMs，最佳开源和专有模型准确率分别为45.7%和53.6%，远低于医生的79.0%；构建44,750个问题的训练集Clinical3D-45K，微调使模型提升16-20分；发现模型基本未使用输入的3D地图；提出GeoJeV方法，使MLLM通过重建场景记忆和选择3D操作进行计算，达到所有评估模型的最高准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出医院空间推理需要追踪相似设备、理解相对方向和判断通道宽度，现有基准覆盖不足。Clinical3D-Bench填补了这一空白，并揭示了当前MLLM在空间推理上的严重不足。研究发现微调模型基本未使用输入的3D地图。关于本研究的其他具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型与空间推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. LoopedWAM: Looped World Action Models for Elastic Inference（LoopedWAM：用于弹性推理的循环世界动作模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25595\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25595\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld action models (WAMs) couple generative video modeling with robotic action prediction but typically require large video and action transformers, limiting deployment efficiency. We present LoopedWAM, a compact WAM that recurrently applies a shared six-block core in each expert, executing 30 transformer layers while storing only 12 blocks per expert. To account for their asymmetric inference costs, the video and action experts can operate at different depths: visual features are computed once per query, whereas action computation repeats at every sampling step. We further propose elastic self-distillation, which trains a single elastic checkpoint, LoopedWAM-E, across action-depth and sampling-step budgets. With only 0.58B policy parameters and no robot pretraining, LoopedWAM achieves 96.1% success on LIBERO, 91.9% on RoboTwin 2.0, and 52.2% on RoboCasaGR1, while using 7.4times less peak GPU memory than Fast-WAM under matched inference measurements. On LIBERO, LoopedWAM-E achieves 96.0% success in 27.6 ms or 95.2% in 24.7 ms on an H100, providing multiple accuracy-latency operating points from a single checkpoint; with two sampling steps and four action loops, it stays within 0.5 points of LoopedWAM on all three benchmarks. Ablations demonstrate that weight-shared depth preserves competitive performance, while aggressive action-depth reduction requires explicit budget-aware training. On a real AgileX PiPER arm, LoopedWAM succeeds in 71.3% of 80 trials across four tasks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界动作模型（WAMs）将生成式视频建模与机器人动作预测结合起来，但通常需要大型视频和动作Transformer，限制了部署效率。我们提出了LoopedWAM，一种紧凑的WAM，它在每个专家中循环应用共享的六块核心，执行30个Transformer层，同时每个专家仅存储12个块。为了解释它们不对称的推理成本，视频和动作专家可以在不同深度运行：视觉特征每次查询计算一次，而动作计算在每个采样步骤重复。我们进一步提出了弹性自蒸馏，它在动作深度和采样步骤预算上训练单个弹性检查点LoopedWAM-E。LoopedWAM仅具有0.58B策略参数且无需机器人预训练，在匹配的推理测量下，在LIBERO上实现了96.1%的成功率，在RoboTwin 2.0上实现了91.9%，在RoboCasaGR1上实现了52.2%，同时使用的峰值GPU内存比Fast-WAM少7.4倍。在LIBERO上，LoopedWAM-E在H100上以27.6毫秒实现96.0%的成功率，或以24.7毫秒实现95.2%，从单个检查点提供多个准确率-延迟操作点；在两个采样步骤和四个动作循环下，它在所有三个基准测试中保持在LoopedWAM的0.5分以内。消融实验表明，权重共享深度保持了具有竞争力的性能，而激进的动作深度减少需要明确的预算感知训练。在真实的AgileX PiPER机械臂上，LoopedWAM在四个任务的80次试验中成功率为71.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种紧凑且高效的世界动作模型（LoopedWAM），结合生成式视频建模与机器人动作预测，并实现弹性推理以平衡准确率与延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出LoopedWAM，通过循环应用共享六块核心执行30层Transformer，每专家仅存储12块；视频和动作专家在不同深度运行以应对不对称推理成本；提出弹性自蒸馏训练单一弹性检查点LoopedWAM-E；仅0.58B参数且无机器人预训练，在LIBERO、RoboTwin 2.0和RoboCasaGR1上分别达96.1%、91.9%和52.2%成功率，峰值GPU内存比Fast-WAM少7.4倍；在真实AgileX PiPER机械臂上80次试验成功率达71.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出WAMs通常需要大型Transformer限制了部署效率。LoopedWAM通过权重共享和弹性推理解决了这一问题，在保持高成功率的同时大幅降低内存和延迟。研究指出激进的动作深度减少需要明确的预算感知训练。关于本研究的其他具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. Measuring Layer-wise Intrinsic Dimensionality of FFNs in LLMs via PCA（通过PCA测量LLM中FFN的逐层内在维度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32782\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32782\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eModern large language models (LLMs) keep the feed-forward network (FFN) intermediate width identical across every layer, a convention inherited from the original Transformer. Yet mechanistic work suggests layers at different depths do qualitatively different work, raising a natural question: are their capacity demands also non-uniform, and if so, can a fixed parameter budget be allocated more wisely than uniformly? To probe this, we apply principal component analysis (PCA) to the input of each FFN down-projection and measure, for every layer, its intrinsic dimensionality as the smallest number of principal components needed to reconstruct the activation up to a fixed cosine similarity. Scanning 58 open-weight LLMs spanning 14 families and 70M to 72B parameters, we find a recurring middle-heavy profile in which middle layers carry higher intrinsic dimensionality than edge layers; the profile is robust to the calibration corpus, even across English and Chinese, and is largely preserved through post-training fine-tuning. As a direct test that this signal is structurally meaningful, we use it to guide width pruning in a knowledge-distilled student under a matched parameter budget: the PCA-guided allocation outperforms the uniform-width convention by +2.3 points on Qwen3-8B and +2.5 on Qwen2.5-3B, while lower-dispersion teachers show smaller gaps (+0.9 on Gemma-3-4B, +0.5 on LLaMA-3-8B), and a budget-matched inverted control does worst on all four teachers. Across these four teachers, the size of the gap tracks how unevenly the teacher\u0026#x27;s intrinsic dimensionality is distributed across layers (a single-number summary we call σ_{99}), and the advantage persists through downstream supervised fine-tuning. Code is available at https://github.com/naver-ai/lidf.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e现代大型语言模型（LLMs）在每一层保持相同的前馈网络（FFN）中间宽度，这一惯例继承自最初的Transformer。然而，机制层面的研究表明，不同深度的层执行着定性上不同的工作，这引发了一个自然的问题：它们的能力需求是否也不均匀，如果是，固定的参数预算能否比均匀分配更明智地分配？为了探究这一点，我们将主成分分析（PCA）应用于每个FFN下投影的输入，并测量每一层的内在维度，即重建激活值至固定余弦相似度所需的最少主成分数量。扫描了跨越14个系列、参数量从70M到72B的58个开源权重LLM，我们发现了一个反复出现的“中间重”特征，即中间层比边缘层具有更高的内在维度；该特征对校准语料库具有鲁棒性，即使在英语和中文之间也是如此，并且在后训练微调过程中基本保持不变。作为该信号具有结构意义的直接测试，我们使用它来指导在匹配参数预算下知识蒸馏学生的宽度剪枝：PCA指导的分配在Qwen3-8B上比均匀宽度惯例高出+2.3分，在Qwen2.5-3B上高出+2.5分，而较低离散度的教师模型显示出较小的差距（Gemma-3-4B上+0.9分，LLaMA-3-8B上+0.5分），并且预算匹配的倒置控制在所有四个教师模型上表现最差。在这四个教师模型中，差距的大小追踪了教师模型的内在维度在层间分布的不均匀程度（我们称之为σ_{99}的单数字总结），并且该优势在下游监督微调中持续存在。代码可在 https://github.com/naver-ai/lidf 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究大型语言模型中不同层的前馈网络（FFN）能力需求是否均匀，并通过主成分分析（PCA）测量每一层的内在维度，以优化参数预算分配。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现LLM中FFN内在维度呈现“中间重”特征，且对语料库和微调具有鲁棒性。2. 提出利用PCA测量的内在维度指导知识蒸馏学生的宽度剪枝，在匹配参数预算下优于均匀宽度分配。3. 证明了内在维度分布的不均匀程度（σ_{99}）与性能提升幅度相关。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供关于该方法在更大规模模型或不同架构上的泛化能力局限，也未提供PCA计算在超大模型上的具体计算开销或内存限制等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 模型压缩与优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. InstructReplay: Replaying Assistant Turns to Preserve General Behavior During Factual Fine-Tuning（InstructReplay：在事实微调期间重放助手回合以保留通用行为）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32918\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32918\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFine-tuning an instruction-tuned language model on new facts often erodes its general abilities. We find that standard fine-tuning lowers instruction-following, reasoning and coding benchmarks by 35 points on average, and that these losses track a collapse in answer length: fine-tuned models at least halve their responses, and the further a response drifts from the initial model\u0026#x27;s length, the more often it fails. We propose InstructReplay: the initial model answers a set of general instructions once, and during fine-tuning the model is kept close to the initial model on these answers. Across three model families and two domains, InstructReplay reduces the average decline on five general benchmarks from 28.1 to 2.4 points and keeps answer length close to the initial model\u0026#x27;s, while learning the new facts as well as standard fine-tuning. It balances learning and retention better than seven adaptation methods in all six settings. Controlled comparisons attribute the gain to replaying the model\u0026#x27;s own answers to general instructions rather than to the form of the loss.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在新的事实上微调指令微调的语言模型通常会削弱其通用能力。我们发现，标准微调平均会使指令遵循、推理和编码基准下降35分，并且这些损失与回答长度的崩溃相吻合：微调后的模型将其回答至少缩短了一半，并且回答偏离初始模型长度的程度越高，失败的可能性就越大。我们提出InstructReplay：初始模型对一组通用指令回答一次，在微调期间，模型在这些回答上保持接近初始模型。在三个模型系列和两个领域中，InstructReplay将五个通用基准上的平均下降从28.1分减少到2.4分，并保持回答长度接近初始模型，同时学习新事实的效果与标准微调一样好。在所有六种设置中，它比七种适应方法更好地平衡了学习和保留。受控比较将收益归因于重放模型自己对通用指令的回答，而不是损失的形式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决在指令微调语言模型上进行新事实微调时导致的通用能力（如指令遵循、推理和编码）下降及回答长度崩溃的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现标准事实微调会导致通用基准分数平均下降35分，且与回答长度减半密切相关。2. 提出InstructReplay方法，通过在微调时重放初始模型对通用指令的回答，将通用基准平均下降从28.1分降至2.4分。3. 证明性能提升源于重放模型自身的回答内容，而非特定的损失函数形式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供该方法在更长时间微调或更复杂事实更新场景下的局限，也未提供重放通用指令的具体计算开销或数据收集成本等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 模型微调与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. Do learned image captioning metrics generalize? Auditing duplicated samples in human-judgment benchmarks（学习到的图像描述指标是否泛化？审计人类判断基准中的重复样本）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30488\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30488\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLearned image captioning metrics are trained and tested on human judgments, so their reported correlation is a claim about generalization. We audit this claim for the three most recent collections of such judgments, Polaris, Nebula, and Spica, matching images at the pixel level. First, test samples reappear in training sets: the Spica training set contains about two-thirds of the Polaris test set, with identical human ratings. Second, controlled retraining shows that duplicates can inflate a metric: for Pearl, the gain is confined to the duplicated samples and grows with every epoch; for DENEB, it stays below one point. The gain depends on the learner and on how often a training set repeats a sample. Third, Kendall\u0026#x27;s τ over all samples is the sum of two terms, detecting captions with the lowest human score and ranking the others; the first supplies most of the reported correlation and is nearly saturated. The recent test sets cannot order Polos, DENEB and Pearl consistently, and a ridge regression on frozen features matches or exceeds all three. Fourth, we propose a protocol that ranks a learned metric only with a model trained without test samples, reports both terms, and compares metrics by paired tests. Under it, zero-shot vision--language judges rank first on the three recent test sets, and a fine-tuned judge ranks first on the three earlier benchmarks. The same analysis applies to any evaluator learned from human judgments; filter lists and code are released at https://github.com/morninghut/ic-dataset-audit .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e学习到的图像描述指标在人类判断上进行训练和测试，因此它们报告的相关性是对泛化能力的一种声明。我们审计了最近三个此类判断集合（Polaris、Nebula和Spica）的这一声明，在像素级别匹配图像。首先，测试样本在训练集中重新出现：Spica训练集包含了大约三分之二的Polaris测试集，且具有相同的人类评分。其次，受控重训练表明重复会夸大指标：对于Pearl，收益仅限于重复样本并随每个epoch增长；对于DENEB，它保持在1分以下。收益取决于学习器以及训练集重复样本的频率。第三，所有样本上的Kendall\u0026#x27;s τ是两个项的总和，检测具有最低人类分数的描述并对其他描述进行排名；第一项提供了大部分报告的相关性且几乎饱和。最近的测试集无法一致地对Polos、DENEB和Pearl进行排序，并且在冻结特征上的岭回归匹配或超过了所有这三个指标。第四，我们提出了一种协议，仅使用在没有测试样本的情况下训练的模型来对学习指标进行排名，报告这两个项，并通过配对测试比较指标。在该协议下，零样本视觉-语言判断者在最近的三个测试集上排名第一，而微调的判断者在早期的三个基准上排名第一。相同的分析适用于任何从人类判断中学习到的评估器；过滤列表和代码发布在 https://github.com/morninghut/ic-dataset-audit 。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e审计学习到的图像描述指标在人类判断基准上的泛化能力声明，通过检查数据泄露（重复样本）和评估指标的真实排序能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现近期人类判断基准存在严重的测试集与训练集数据泄露（如Spica训练集包含约2/3的Polaris测试集）。2. 揭示数据重复会夸大指标表现，且Kendall\u0026#x27;s τ的高相关性主要来源于对最低分描述的检测。3. 提出新的评估协议，证明零样本视觉-语言判断器在近期测试集上表现优于微调的学习指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供新协议下各指标的具体数值表现等实验结果，也未提供该审计方法在其他任务中的适用性等局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态学习 / 评估指标\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. Align the Pair, Not the Sample: Representation Alignment for Faster and Better One-Step Generato（对齐配对而非样本：用于更快更好单步生成器的表示对齐）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29547\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29547\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRepresentation alignment markedly accelerates diffusion training, but one-step generators raise a question that diffusion does not: which training path should receive the loss? A one-step generator sees two kinds of inputs. Corrupted real images come with their clean counterpart, which provides an instance-paired target. Samples generated from pure noise have no corresponding real image, yet this is where the final model operates. We study this question on Priming, which trains one-step generators from scratch by reconstructing corrupted images and then matching feature distributions with optimal transport. Aligning the generative path, the natural choice, collapses recall (0.45!to!0.15--0.25) in all 17 configurations we test, including five target constructions and loss weights down to 0.05. Aligning the paired reconstruction path with a frozen DINOv2 encoder instead helps in every setting we test. A short analysis explains this asymmetry: when the target carries no instance information about the input, the optimal aligned feature is constant within each class, so the loss pulls samples toward class prototypes. A control confirms this: aligning the paired path to a random same-class image instead of the input\u0026#x27;s own image removes most of the gain. Inside the generator, paired-path alignment creates an interface block through which post-training routes noise, and the image semantics carried through it predict sample quality across 16 models. The resulting recipe, \\method, accelerates both training stages on ImageNet 256!times!256: it matches the 160-epoch baseline with 2times fewer priming epochs, surpasses its final quality with 4times fewer post-training updates, and lowers FID to 1.30 (B) and 1.155 (L) at the standard budget. A joint single-stage variant trains native one-step generators and reaches FID 1.22 with 115M parameters.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e表示对齐显著加速了扩散训练，但单步生成器提出了一个扩散模型没有的问题：损失应该接收哪个训练路径？单步生成器看到两种输入。损坏的真实图像带有其干净的对应物，这提供了实例配对的目标。从纯噪声生成的样本没有对应的真实图像，但最终模型正是在这里运行。我们在Priming上研究这个问题，Priming通过重建损坏的图像然后使用最优传输匹配特征分布，从头开始训练单步生成器。对齐生成路径（自然的选择）在我们测试的所有17种配置中导致召回率崩溃（0.45!to!0.15--0.25），包括五种目标构造和低至0.05的损失权重。使用冻结的DINOv2编码器对齐配对重建路径反而在我们测试的每种设置中都有帮助。简短的分析解释了这种不对称性：当目标不携带关于输入的实例信息时，最佳对齐特征在每个类别内是恒定的，因此损失将样本拉向类别原型。控制实验证实了这一点：将配对路径对齐到随机的同类图像而不是输入自身的图像会消除大部分收益。在生成器内部，配对路径对齐创建了一个接口块，后训练通过该接口块路由噪声，并且通过它携带的图像语义预测了16个模型的样本质量。产生的配方，\\method，加速了ImageNet 256!times!256上的两个训练阶段：它用少2times倍的priming epochs匹配160-epoch基线，用少4times倍的后训练更新超过其最终质量，并在标准预算下将FID降低到1.30 (B) 和 1.155 (L)。联合单阶段变体训练原生单步生成器，并在115M参数下达到1.22的FID。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决单步生成器在表示对齐训练中面临的训练路径选择问题（对齐生成路径还是配对重建路径），以加速训练并提升生成质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现对齐生成路径会导致召回率崩溃，而对齐配对重建路径（使用冻结DINOv2）在所有测试设置中均有效。2. 揭示了对齐收益的机制：当目标无实例信息时，对齐会将样本拉向类别原型，且生成器内部形成的接口块特征可预测样本质量。3. 提出的方法在ImageNet 256!times!256上显著加速训练，并将FID降至1.30/1.155，单阶段变体达到1.22。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供该方法在更高分辨率图像或更复杂数据集上的实验结果，也未提供联合单阶段变体的具体架构细节等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 生成模型 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. Interpretable Prototype-Conditioned Adaptation for Weather Forecasting（用于天气预报的可解释原型条件适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25848\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25848\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eData-driven weather forecasting requires distinguishing local states and their temporal evolution. However, learned patterns remain implicit in neural forecasters, making their influence difficult to interpret. Failing to distinguish local evolution can lead to similar forecasts for locations that develop differently, increasing prediction error. This motivates explicit references for distinguishing and interpreting local patterns. Prototypes provide explicit pattern references, but sample- or task-level conditioning leaves open how to adapt to distinct locations and variable groups. To deal with this problem, we design ProtoCast, which uses group-specific prototype banks to adapt local features while accounting for cross-variable dependencies. Specifically, (1) we combine each group\u0026#x27;s historical features and temporal change with forecast context from cross-variable attention for evolution-aware prototype matching. (2) Sparse mixtures of prototype-specific low-rank operators tailor corrections to each group and location. A gated attention block then exchanges the corrected features across groups before prediction. Each group\u0026#x27;s correction decomposes into explicit prototype contributions before this fusion. (3) We jointly train the forecasting network and operators from scratch and refit each group\u0026#x27;s prototypes before every training epoch. Slot tracking preserves prototype-operator associations, making each prototype\u0026#x27;s contribution to local corrections more interpretable. Experiments on GlobalForecast and TyphoonTracking show improved forecasting accuracy, while prototype deletion links local feature contributions to changes in prediction error. This work advances the development of more accurate and interpretable data-driven weather forecasting models. Project page: https://zhixuanli.github.io/projects/li2026protocast\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e数据驱动的天气预报需要区分局部状态及其时间演变。然而，学习到的模式在神经预报器中仍然是隐式的，使得它们的影响难以解释。未能区分局部演变可能导致对发展不同的位置做出相似的预报，从而增加预测误差。这激发了用于区分和解释局部模式的显式参考。原型提供了显式的模式参考，但样本级或任务级条件作用留下了如何适应不同位置和变量组的开放问题。为了解决这个问题，我们设计了ProtoCast，它使用特定于组的原型库来适应局部特征，同时考虑跨变量依赖性。具体而言，（1）我们将每组的历史特征和时间变化与来自跨变量注意力的预报上下文结合，进行演变感知的原型匹配。（2）原型特定的低秩算子的稀疏混合物为每组和位置定制校正。然后，门控注意力块在预测前跨组交换校正后的特征。每个组的校正在此融合前分解为显式的原型贡献。（3）我们从零开始联合训练预报网络和算子，并在每个训练epoch前重新拟合每组的原型。槽位跟踪保留了原型-算子关联，使每个原型对局部校正的贡献更具可解释性。在GlobalForecast和TyphoonTracking上的实验显示了预报准确性的提高，同时原型删除将局部特征贡献与预测误差的变化联系起来。这项工作推动了更准确和可解释的数据驱动天气预报模型的发展。项目页面：https://zhixuanli.github.io/projects/li2026protocast\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决数据驱动天气预报中局部状态和时间演变模式难以解释的问题，通过引入原型条件适应机制来区分和解释局部模式，提高预报准确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ProtoCast模型，利用特定于组的原型库适应局部特征，并结合跨变量注意力进行演变感知的原型匹配。2. 使用原型特定的低秩算子稀疏混合物定制校正，并通过门控注意力块跨组交换特征。3. 通过槽位跟踪保留原型-算子关联，实现原型对局部校正贡献的可解释性，并在GlobalForecast和TyphoonTracking数据集上提升了预报准确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供具体的误差降低数值等实验结果，也未提供该模型在极端天气事件预测或更长预测时效下的表现局限及计算复杂度等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e地球科学 / 气象预测 / 可解释人工智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. Can an Agent Trust Its Own Zoom? Cross-Magnification Provenance Verification for Whole-Slide Images（智能体能信任自己的缩放吗？全切片图像的跨放大倍率来源验证）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29150\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29150\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual agents navigate whole-slide images through magnified observations associated with claimed locations. However, a visually plausible observation does not necessarily originate from its claimed location, particularly across magnifications and in regions with similar tissue structures. We formulate cross-magnification provenance verification (CMPV) to evaluate whether visual evidence supports a claimed spatial association, recover the source when possible, and abstain when evidence is insufficient. We introduce PyraFault, a benchmark of 3.06 million coordinate-supervised examples from 2,200 cases across five TCGA cohorts, covering within-context substitutions, absent-source faults, and geometric perturbations. We further propose ZoomTrace, a claim-independent verifier that estimates the observation\u0026#x27;s source before evaluating its agreement with the claimed location. It combines physical-scale alignment, visual retrieval, geometric refinement, and reliability estimation using spatially disjoint competing matches. On 503,320 test examples, ZoomTrace achieves 0.969 AUPRC and 0.987 AUROC, compared with 0.789 and 0.903 for Efficient LoFTR. Further evaluations reveal trade-offs in reliability estimation and limitations in vision-language models, cross-dataset retrieval, and calibration. Integrating ZoomTrace into visual agent tool paths reduces exposure to corrupted observations and silent failures, while downstream accuracy improvements depend on the agent and verification threshold.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉智能体通过与声明位置相关的放大观察来导航全切片图像。然而，视觉上合理的观察不一定源自其声明的位置，特别是在跨放大倍率以及具有相似组织结构的区域中。我们制定了跨放大倍率来源验证（CMPV）任务，以评估视觉证据是否支持声明的空间关联，在可能的情况下恢复来源，并在证据不足时放弃。我们引入了PyraFault，这是一个包含306万个坐标监督示例的基准，来自5个TCGA队列的2200个病例，涵盖了上下文内替换、缺失来源故障和几何扰动。我们进一步提出了ZoomTrace，这是一个独立于声明的验证器，在评估观察结果与声明位置的一致性之前估计观察结果的来源。它结合了物理尺度对齐、视觉检索、几何细化以及使用空间不相交的竞争匹配进行可靠性估计。在503320个测试示例上，ZoomTrace实现了0.969的AUPRC和0.987的AUROC，而Efficient LoFTR分别为0.789和0.903。进一步的评估揭示了可靠性估计中的权衡，以及视觉语言模型、跨数据集检索和校准方面的局限性。将ZoomTrace集成到视觉智能体工具路径中可减少暴露于损坏观察和静默故障的情况，而下游准确率的提高取决于智能体和验证阈值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e制定跨放大倍率来源验证（CMPV）任务，评估视觉证据是否支持声明的空间关联，恢复来源或在证据不足时放弃，并提出ZoomTrace验证器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入包含306万个坐标监督示例的PyraFault基准，涵盖多种故障类型。2. 提出ZoomTrace验证器，结合物理尺度对齐、视觉检索等技术，在503320个测试示例上达到0.969 AUPRC和0.987 AUROC，优于Efficient LoFTR。3. 将ZoomTrace集成到智能体工具路径中可减少损坏观察和静默故障。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ZoomTrace在CMPV任务上取得了显著的性能提升，并揭示了可靠性估计的权衡以及视觉语言模型、跨数据集检索和校准的局限性。下游准确率的提高依赖于具体的智能体和验证阈值。摘要未提供关于具体视觉语言模型局限性的详细实验结果、具体校准方法的细节，以及下游任务具体提升的数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 医学图像分析 / 视觉智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. SpatialArena: Where Do Geometric Foundation Models Stand?（SpatialArena：几何基础模型处于什么水平？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32816\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32816\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003e3D perception is shifting from task-specific pipelines to geometric foundation models: monocular depth networks, feed-forward 3D/4D reconstruction models, and vision--language models that predict geometry. However, their progress cannot be measured reliably. Published numbers are not comparable, because every paper samples frames, sets resolutions, and selects test splits differently. They are not robust because the alignment required for every up-to-scale prediction can outweigh the gap between models: fitting depth in the wrong space nearly triples its error, and standard trajectory alignment understates the error of failing methods by up to 2.6times. And they rarely cover long recordings, dynamic scenes, or aerial views. We present SpatialArena, an open arena that scores geometric models with the same metrics and rules, with robust and deterministic alignment. SpatialArena spans five tasks, from monocular depth to SLAM. It covers 23 public datasets with 418,929 images across indoor, outdoor, aerial, object-centric, and dynamic scenes, together with Spatial Arena, our own captures with accurate poses and depth. Evaluating 52 models, we find that single-image depth is close to saturation on public benchmarks but not on large, uncontrolled scenes, and that progress now comes from consistency across frames and views, where feed-forward 3D/4D models match or surpass monocular specialists and overtake video depth models. The benchmark, toolbox, and leaderboard will be publicly released.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e3D感知正从特定任务的流水线转向几何基础模型：单目深度网络、前馈3D/4D重建模型以及预测几何的视觉语言模型。然而，它们的进展无法被可靠地衡量。发布的数字不可比较，因为每篇论文采样帧、设置分辨率和选择测试分割的方式都不同。它们不够稳健，因为每个按比例预测所需的对齐可能会超过模型之间的差距：在错误的空间中拟合深度会使其误差几乎增加两倍，而标准轨迹对齐会将失败方法的误差低估多达2.6倍。而且它们很少涵盖长时录制、动态场景或航空视角。我们提出了SpatialArena，这是一个开放的竞技场，使用相同的指标和规则对几何模型进行评分，具有稳健且确定性的对齐。SpatialArena涵盖从单目深度到SLAM的五个任务。它涵盖了23个公共数据集的418929张图像，涉及室内、室外、航空、以对象为中心和动态场景，以及Spatial Arena（我们自己捕获的具有准确姿势和深度的数据）。在评估了52个模型后，我们发现单图像深度在公共基准上接近饱和，但在大型、不受控制的场景中并非如此，并且现在的进展来自于跨帧和视图的一致性，其中前馈3D/4D模型匹配或超过了单目专家模型，并超越了视频深度模型。该基准、工具箱和排行榜将公开发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出SpatialArena，一个使用统一指标、规则和稳健确定性对齐来评估几何基础模型（涵盖单目深度到SLAM等五个任务）的开放基准平台。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示了现有评估中因采样、分辨率、测试集选择及对齐方式不同导致的不可比和不稳健问题（如错误空间拟合使误差增加近三倍，标准轨迹对齐低估误差达2.6倍）。2. 构建了包含23个公共数据集（418929张图像）及自采数据的SpatialArena，涵盖五种场景和五个任务。3. 评估52个模型发现单目深度在大型非受控场景未饱和，且前馈3D/4D模型在跨帧/视图一致性上已匹配或超越单目专家及视频深度模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前3D感知评估存在不可比和不稳健的严重问题，并提出了统一的评估框架。分析表明，当前几何基础模型的进展主要体现在多帧/多视图一致性上。局限性方面，摘要提到单图像深度在大型不受控场景中未饱和，且现有方法很少覆盖长时录制、动态场景或航空视角（尽管SpatialArena试图覆盖这些）。摘要未提供52个模型的具体得分排名、自采数据（Spatial Arena）的具体规模细节，以及各模型在不同任务上的具体性能差异数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉 / 基础模型评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. Factorized Context Attention: From Emulated to Native Grid Probing（分解上下文注意力：从模拟网格探测到原生网格探测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32423\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32423\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eModels read a book, an hour of video, or an image in one forward pass. As the context grows, this pass slows down, loses accuracy, and stops at the context window. Sparse attention is efficient, but keeps the other two limitations. Grid probing, a recent training-free method, recovers the accuracy and extends the reach by asking a frozen model the same question about short local and strided spans of the input, but every question repeats the whole computation, since each span is encoded again. Our insight is that grid probing is emulated attention, an attention pattern reproduced from outside the model through prompts, since each probe only restricts which part of the input the question can see. We introduce Factorized Context Attention (FCA), a training-free block-sparse attention that runs the same pattern natively, as the attention of the model itself. FCA encodes the input once into a KV cache, reads all spans as masked sequences in one batched forward, and uses a stair position schedule to keep every span inside the trained position range. Across long video understanding, long-context text inference and image grounding, FCA matches the accuracy and the reach of grid probing at a fraction of its cost. It gains about 10 points over the single pass on long video and 9 to 14 points on long novels, finds needles in videos of over a thousand frames and in texts four times the length of the window, and answers a later question about the same input in as little as a tenth of the time of grid probing. Native attention thus keeps what emulated attention gains without its cost, all with existing frozen language and vision-language models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e模型在一次前向传播中阅读一本书、一小时的视频或一张图像。随着上下文的增长，这次传播会变慢、失去准确性，并在上下文窗口处停止。稀疏注意力很高效，但保留了其他两个局限性。网格探测是一种最近的免训练方法，通过对输入的短局部和跨步跨度向冻结模型提出相同的问题来恢复准确性并扩展范围，但每个问题都会重复整个计算，因为每个跨度都会被重新编码。我们的见解是，网格探测是模拟注意力，一种通过提示从模型外部重现的注意力模式，因为每次探测仅限制问题可以看到输入的哪一部分。我们引入了分解上下文注意力（FCA），这是一种免训练的块稀疏注意力，它以原生方式运行相同的模式，作为模型自身的注意力。FCA将输入一次编码到KV缓存中，在一次批量前向传播中将所有跨度作为掩码序列读取，并使用阶梯位置调度将每个跨度保持在训练的位置范围内。在长视频理解、长上下文文本推理和图像定位方面，FCA以其一小部分的成本匹配了网格探测的准确性和范围。它在长视频上比单次传播提高了约10分，在长篇小说上提高了9到14分，能在超过一千帧的视频和四倍窗口长度的文本中找到关键信息，并在最短为网格探测十分之一的时间内回答关于相同输入的后续问题。因此，原生注意力保留了模拟注意力所获得的优势而没有其成本，所有这些都适用于现有的冻结语言和视觉语言模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出分解上下文注意力（FCA），一种免训练的块稀疏注意力机制，旨在以原生方式实现网格探测的注意力模式，解决长上下文处理中单次前向传播变慢、失准及受限于上下文窗口的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示网格探测本质上是模拟注意力，存在重复计算的开销。2. 提出FCA，通过一次KV缓存编码和批量掩码序列读取，结合阶梯位置调度，原生实现该注意力模式。3. 在长视频、长文本和图像定位任务中，FCA以极低成本达到网格探测的准确率，长视频提升约10分，长文本提升9到14分，处理时间缩短至网格探测的十分之一，并支持超长上下文的检索。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明FCA成功将模拟注意力转化为原生注意力，在保持准确率的同时大幅降低了计算成本和时间。局限性方面，摘要未明确提及FCA本身的局限性，但指出其依赖于现有的冻结模型。摘要未提供FCA在不同任务上的具体基础准确率数值、具体的计算资源消耗对比数据，以及阶梯位置调度在不同模型架构上的泛化性验证细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 计算机视觉 / 注意力机制与长上下文处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. Escriba-OCR: A 1B Vision-Language Model for Error-Preserving Transcription of Handwritten Portuguese Essays（Escriba-OCR：用于手写葡萄牙语作文保错转录的10亿参数视觉语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29874\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29874\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFeedback tools and research on learner writing need transcriptions of handwritten essays that keep exactly what the student wrote: misspellings, line breaks, struck-through words and insertions. Vision-language models (VLMs) read handwriting well, but they also tend to rewrite it into correct language. We measure this on BRESSAY, 1,000 handwritten Brazilian Portuguese essays, with a benchmark that adds error preservation, invented errors, edit-markup precision and recall and line structure to the character error rate (CER) and uses paired bootstrap confidence intervals. We restrict the study to open-weight models that schools can run on their own hardware. Of 22 open baselines, the best, Qwen3-VL 235B-A22B, reaches 5.6% CER on the 199 test pages; none reproduces the edit markup reliably, and every VLM replaces 39-78% of the words absent from a Portuguese dictionary with dictionary words. We fine-tune LightOnOCR-3-1B on the 647 training pages in 85 minutes on one GPU. The resulting Escriba-OCR-1B reaches 2.06% CER, 3.5 points below the best baseline (95% CI [-4.2, -2.9]); under the ICDAR 2024 competition metric it reaches 2.1% CER, below the best published page-level results (2.2-2.4%). It recovers 67% of insertions and 77% of illegible deletions, and reproduces the line structure of 97% of the pages, but still normalises 60% of likely misspellings. Three seeds agree within 0.04 CER points, and quantised to 4 bits the model runs on an ordinary CPU at about one minute per page. On 40 letters of another corpus it matches its base model (without that model\u0026#x27;s appended comments) but misreads unseen words more often; weight interpolation recovers half the gap. A teacher\u0026#x27;s review finds that 45% of the judgeable apparent corrections are errors in the BRESSAY ground truth, so dictionary-based scores likely understate preservation. We release the model, the benchmark code and the review data.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e关于学习者写作的反馈工具和研究需要手写作文的转录，这些转录必须完全保留学生写下的内容：拼写错误、换行、划掉的单词和插入内容。视觉语言模型能很好地阅读手写体，但它们也倾向于将其重写为正确的语言。我们在BRESSAY（1000篇巴西葡萄牙语手写作文）上衡量了这一点，该基准在字符错误率（CER）的基础上增加了错误保留、发明错误、编辑标记精确率和召回率以及行结构，并使用配对自举置信区间。我们将研究限制在学校可以在自己硬件上运行的开源权重模型。在22个开源基线中，最好的Qwen3-VL 235B-A22B在199个测试页上达到了5.6%的CER；没有模型能可靠地重现编辑标记，每个VLM都将39-78%的不在葡萄牙语词典中的单词替换为了词典中的单词。我们在一个GPU上用85分钟在647个训练页上微调了LightOnOCR-3-1B。得到的Escriba-OCR-1B达到了2.06%的CER，比最佳基线低3.5个百分点（95% CI [-4.2, -2.9]）；在ICDAR 2024竞赛指标下，它达到了2.1%的CER，低于已发布的最佳页面级结果（2.2-2.4%）。它恢复了67%的插入内容和77%的难以辨认的删除内容，并重现了97%页面的行结构，但仍然将60%的可能拼写错误进行了标准化。三个随机种子在0.04个CER点内达成一致，量化到4位后，该模型在普通CPU上运行，每页大约需要一分钟。在另一个语料库的40封信件上，它匹配其基础模型（没有该模型附加的评论），但更经常误读未见过的单词；权重插值恢复了一半的差距。一位老师的审查发现，45%的可判断的明显纠正实际上是BRESSAY真实标签中的错误，因此基于词典的分数可能低估了保留率。我们发布了模型、基准代码和审查数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估并改进视觉语言模型在手写葡萄牙语作文转录中保留学生原始错误（如拼写错误、编辑标记等）的能力，提出Escriba-OCR-1B模型及相应的评估基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建了BRESSAY基准（1000篇作文），引入错误保留、编辑标记等评估维度，发现22个开源VLM均无法可靠保留错误（替换39-78%的词典外单词）。2. 微调得到Escriba-OCR-1B，CER降至2.06%（比最佳基线低3.5%），在ICDAR 2024指标下达2.1%，恢复67%插入和77%删除，重现97%行结构。3. 模型支持4位量化在普通CPU上运行（约1分钟/页），并揭示了基于词典的评估可能低估错误保留率（45%的明显纠正实为真实标签错误）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Escriba-OCR-1B在保持低CER的同时显著提升了错误和结构保留能力，且具备在普通硬件上部署的潜力。局限性方面，模型仍会将60%的可能拼写错误标准化，且在另一语料库上更频繁误读未见过的单词。摘要未提供BRESSAY基准中各VLM在编辑标记精确率和召回率上的具体数值、权重插值方法的具体细节，以及模型在45%真实标签错误情况下的最终修正表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 光学字符识别 / 教育技术\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. OWE-Bench: A long-horizon benchmark for measuring real-world engineering（OWE-Bench：衡量现实世界工程的长周期基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30017\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30017\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present OWE-Bench (OpenWorldEngineer-Bench), a benchmark of 26 long-horizon engineering tasks written by domain experts in software engineering, physical engineering, machine learning, and scientific computing. Tasks range from optimizing kernels and designing an aircraft, to identifying the faults responsible for an earthquake. Each task requires significant domain knowledge and engineering work, with models averaging hundreds of millions of tokens per task. Solutions are scored on practical measures such as speed, cost and accuracy, both on provided cases the agent could test against and on hidden cases that an engineer would expect from the task description. The best-performing frontier model so far, Claude Fable 5.2, scores 54.6% and averages 211 million tokens per task. We highlight two findings. First, when models are given more time, they use more test-time compute and achieve higher scores. Models also scale differently with test-time compute: GPT-6 Astra achieves higher scores at shorter time limits and at equal token use, while Claude Fable 5.2 uses more tokens at longer limits to achieve the highest overall score. Second, each model scores lower on hidden cases than on the provided cases, by an average of 18 points, which we call the deployment gap. Models also fail to predict the deployment gap, overestimating their performance on hidden test cases by an average of 21 points. We hope that OWE-Bench grounds progress toward agents whose engineering solutions perform as well in deployment as they do in testing.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了OWE-Bench（OpenWorldEngineer-Bench），这是一个包含26个长周期工程任务的基准，由软件工程、物理工程、机器学习和科学计算领域的专家编写。任务范围从优化内核和设计飞机，到识别导致地震的故障。每个任务都需要大量的领域知识和工程工作，模型在每个任务上平均消耗数亿个token。解决方案根据速度、成本和准确性等实际指标进行评分，既包括智能体可以测试的提供案例，也包括工程师根据任务描述期望的隐藏案例。迄今为止表现最好的前沿模型Claude Fable 5.2得分54.6%，每个任务平均消耗2.11亿个token。我们强调了两个发现。首先，当给模型更多时间时，它们会使用更多的测试时计算并获得更高的分数。模型在测试时计算上的扩展方式也不同：GPT-6 Astra在较短的时间限制和相同的token使用量下获得更高的分数，而Claude F
