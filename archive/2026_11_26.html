able 5.2在较长的时间限制下使用更多的token以获得最高的总体分数。其次，每个模型在隐藏案例上的得分都低于提供的案例，平均低18分，我们称之为部署差距。模型也未能预测部署差距，平均高估了其在隐藏测试案例上的表现21分。我们希望OWE-Bench能推动智能体的进步，使其工程解决方案在部署中的表现与在测试中一样好。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出OWE-Bench，一个包含26个由领域专家编写的长周期现实世界工程任务的基准，旨在评估智能体在速度、成本和准确性等实际指标上的表现，并衡量其在提供案例和隐藏案例上的性能差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建了涵盖软件、物理、机器学习和科学计算的26个长周期工程任务基准，模型单任务平均消耗数亿token。2. 揭示了测试时计算的扩展差异：GPT-6 Astra在短时间/等token下得分更高，而Claude Fable 5.2在长时间/多token下取得最高总分（54.6%，均耗2.11亿token）。3. 发现并量化了部署差距：模型在隐藏案例上平均比提供案例低18分，且模型平均高估自身在隐藏案例上的表现21分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明OWE-Bench有效衡量了长周期工程任务中模型的实际表现，并揭示了测试时计算扩展的异质性以及模型在未见数据（隐藏案例）上的性能衰减（部署差距）和自我评估偏差。局限性方面，摘要未提供26个任务的具体分布细节、不同模型在各个具体任务上的得分差异、以及速度/成本指标的具体量化数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 智能体评估 / 软件工程与复杂任务基准\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. FATCAT: Fault Injection Attacks Targeting Chip-level Alignment（FATCAT：针对芯片级对齐的故障注入攻击）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31129\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31129\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eModel alignment is the primary safety and security mechanism for enforcing refusal of malicious prompts in modern foundation models; yet, existing adversarial evaluations implicitly assume underlying hardware integrity. In this paper, we present FATCAT, the first physical fault-injection attacks capable of eliminating refusal in modern large language and vision-language models. Specifically, we present a non-invasive electromagnetic (EM) fault injection attack targeting GPU-accelerated Systems-on-Chip with physical access, requiring neither software execution privileges nor model-layer access. By leveraging an autonomous Radio Frequency (RF) side-channel trigger to synchronize EM faults to the prompt prefill phase, the attack corrupts safety-critical memory transactions across off-chip LPDDR5 DRAM and on-chip LPDDR physical interfaces without crashing the system while preserving model coherence. Evaluated on an NVIDIA Jetson Orin Nano and AGX Thor running Llama 3.2 1B and Gemma 3 1B, localized physical faults reliably force models to fulfill restricted requests, demonstrating that model-level alignment provides no robust security guarantees without hardware-level fault tolerance. Finally, we demonstrate the physical-world consequences of this vulnerability on an active 6-DoF robotic manipulator controlled by a SmolVLA vision-language-action policy. Our attack silently corrupts the model forcing the arm into abrupt, hazardous lunges; in two instances the robotic arm attempted to pinch the paper author -- proving that hardware faults can directly translate into real physical harm.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e模型对齐是现代基础模型中强制执行拒绝恶意提示的主要安全和安保机制；然而，现有的对抗性评估隐含地假设了底层硬件的完整性。在本文中，我们提出了FATCAT，这是首个能够消除现代大型语言和视觉语言模型拒绝行为的物理故障注入攻击。具体而言，我们提出了一种针对具有物理访问权限的GPU加速系统级芯片的非侵入式电磁（EM）故障注入攻击，既不需要软件执行权限，也不需要模型层访问权限。通过利用自主射频（RF）侧信道触发器将电磁故障与提示预填充阶段同步，该攻击在不使系统崩溃并保持模型连贯性的同时，破坏了跨片外LPDDR5 DRAM和片上LPDDR物理接口的安全关键内存事务。在运行Llama 3.2 1B和Gemma 3 1B的NVIDIA Jetson Orin Nano和AGX Thor上进行的评估表明，局部物理故障能可靠地迫使模型执行受限请求，证明如果没有硬件级容错，模型级对齐无法提供稳健的安全保证。最后，我们在由SmolVLA视觉-语言-动作策略控制的活跃6自由度机械臂上展示了该漏洞在物理世界中的后果。我们的攻击在暗中破坏模型，迫使机械臂进行突然、危险的前冲；在两次实例中，机械臂试图夹住论文作者——证明硬件故障可以直接转化为真实的物理伤害。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种物理故障注入攻击（FATCAT），以消除现代大型语言和视觉语言模型中的拒绝行为，评估模型级对齐在缺乏硬件级容错时的安全性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出首个能消除现代大模型拒绝行为的物理故障注入攻击FATCAT。2. 攻击是非侵入式的电磁故障注入，针对GPU加速SoC，无需软件权限或模型层访问。3. 利用自主RF侧信道触发器同步故障至提示预填充阶段，破坏安全关键内存事务而不崩溃系统。4. 在NVIDIA Jetson设备上验证了Llama 3.2 1B和Gemma 3 1B的拒绝行为被消除。5. 在真实物理世界中的6自由度机械臂上展示了漏洞后果，导致危险动作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究证明了物理层面的电磁故障注入可以破坏模型的安全对齐机制，导致模型执行受限请求，并在真实机器人平台上引发了危险的物理动作，揭示了模型级对齐在缺乏硬件容错时的脆弱性。局限：摘要未提供关于防御此类物理攻击的缓解措施、攻击在不同硬件架构上的泛化能力、以及除电磁注入外其他物理攻击方式的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能安全与对抗性攻击 / 硬件安全\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. RECAP: Training Long-horizon LLM Agents with Context Compaction（RECAP：使用上下文压缩训练长视野大语言模型智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31258\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31258\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eContext compaction enables large language model agents to tackle long-horizon tasks within limited context budgets by replacing interaction histories with compressed summaries. However, learning effective compaction jointly with the agent policy remains challenging, as summaries affect task success over many subsequent interactions. We introduce RECAP, a reinforcement learning (RL) framework based on the principle that a summary should preserve the behavior induced by the original interaction history. We formalize this principle with a behavior distortion objective that measures the divergence between the agent\u0026#x27;s subsequent behavior under compressed and original contexts. We show that the gradient of the distortion objective decomposes into two complementary learning signals: distortion-based reward for summary generation and self-distillation for subsequent actions. Experiments on Qwen3.5-4B show that RECAP consistently outperforms the task-reward-only RL baselines on both environments, leading to an absolute improvement of 4.6% and 4.3% on BrowseComp-plus and SWE-bench Verified, respectively. Ablations further highlight the value of jointly supervising summary generation and post-compaction behavior for RECAP.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e上下文压缩通过用压缩摘要替换交互历史，使大语言模型智能体能够在有限的上下文预算内处理长视野任务。然而，与智能体策略联合学习有效的压缩仍然具有挑战性，因为摘要会影响许多后续交互的任务成功率。我们引入了RECAP，一个基于“摘要应保留由原始交互历史诱导的行为”这一原则的强化学习（RL）框架。我们使用行为失真目标将该原则形式化，该目标衡量智能体在压缩上下文和原始上下文下后续行为之间的差异。我们表明，失真目标的梯度分解为两个互补的学习信号：用于摘要生成的基于失真的奖励和用于后续动作的自蒸馏。在Qwen3.5-4B上的实验表明，RECAP在两种环境中均持续优于仅任务奖励的RL基线，在BrowseComp-plus和SWE-bench Verified上分别带来了4.6%和4.3%的绝对提升。消融实验进一步突出了联合监督摘要生成和压缩后行为对RECAP的价值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出RECAP强化学习框架，通过与智能体策略联合学习有效的上下文压缩，使大语言模型智能体能够在有限上下文预算内处理长视野任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出RECAP框架，基于摘要应保留原始交互历史诱导行为的原则。2. 形式化行为失真目标，衡量压缩和原始上下文下后续行为的差异。3. 将失真目标的梯度分解为基于失真的摘要生成奖励和后续动作的自蒸馏两个互补信号。4. 在Qwen3.5-4B上，BrowseComp-plus和SWE-bench Verified分别绝对提升4.6%和4.3%。5. 消融实验证明联合监督摘要生成和压缩后行为的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：RECAP通过行为失真目标将上下文压缩与智能体策略联合训练，解决了长视野任务中上下文预算受限的问题，并在BrowseComp-plus和SWE-bench Verified上取得了显著的性能提升。局限：摘要未提供关于RECAP在其他长视野任务或更大规模模型上的泛化能力、计算开销、以及与其他上下文压缩方法（非RL基线）的详细对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型 / 强化学习 / 智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e48. Foresight Forcing: Learning Spatial Foresight for Robotic Manipulation（Foresight Forcing：学习机器人操作的空间预见）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30963\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30963\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobotic manipulation policies can improve action prediction by anticipating how objects move and how their spatial relationships change. World Action Models (WAMs) learn to predict future visual observations, but their training objectives typically leave the underlying 3D geometric transitions implicit. To alleviate this problem, we introduce Foresight Forcing (F^{2}), a WAM that learns a spatial transition representation from changes in a pretrained 3D feature space. During training, a frozen 3D foundation model extracts patch-wise feature differences from aligned current and future observations that provide dense supervision for geometry-aware feature transitions. We distill these targets into spatial transition queries, which are progressively refined from the current observation, language instruction, and proprioceptive state, and use them alongside current visual features to generate actions. At deployment, the policy predicts the queries without future observations or the 3D teacher. Experiments on LIBERO, LIBERO-Plus, and RoboTwin2.0 demonstrate strong manipulation performance and improved robustness, including 95.01% average success on RoboTwin2.0 Full. On six real-world manipulation tasks, F^{2} achieves a mean task score of 85.8%.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人操作策略可以通过预测物体如何移动及其空间关系如何变化来改善动作预测。世界动作模型（WAMs）学习预测未来的视觉观察，但其训练目标通常使底层的3D几何转换保持隐式。为了缓解这个问题，我们引入了Foresight Forcing（F^{2}），一种从预训练3D特征空间的变化中学习空间转换表示的WAM。在训练期间，冻结的3D基础模型从对齐的当前和未来观察中提取逐块特征差异，为几何感知的特征转换提供密集监督。我们将这些目标提炼为空间转换查询，这些查询从当前观察、语言指令和本体感受状态中逐步细化，并将它们与当前视觉特征一起使用以生成动作。在部署时，策略在没有未来观察或3D教师的情况下预测查询。在LIBERO、LIBERO-Plus和RoboTwin2.0上的实验展示了强大的操作性能和提高的鲁棒性，包括在RoboTwin2.0 Full上95.01%的平均成功率。在六个真实世界操作任务上，F^{2}达到了85.8%的平均任务得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Foresight Forcing (F^2) 世界动作模型，通过学习预训练3D特征空间的变化来获取空间转换表示，以改善机器人操作策略的动作预测。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Foresight Forcing (F^2)，一种从预训练3D特征空间变化中学习空间转换表示的世界动作模型。2. 训练时使用冻结的3D基础模型提取逐块特征差异，提供几何感知特征转换的密集监督。3. 将目标提炼为空间转换查询，结合当前观察、语言指令和本体感受状态逐步细化以生成动作。4. 部署时无需未来观察或3D教师模型。5. 在LIBERO、LIBERO-Plus和RoboTwin2.0上表现优异，RoboTwin2.0 Full平均成功率达95.01%，真实世界6个任务平均得分85.8%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：F^2通过引入预训练3D基础模型提供的密集监督，将隐式的3D几何转换显式化，提升了机器人操作策略的性能和鲁棒性，并在仿真和真实世界任务中取得了高成功率。局限：摘要未提供关于该模型在更复杂或未见过的操作任务上的泛化能力、推理延迟、以及与其他显式3D几何建模方法的详细对比。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e49. Small Learned Projections for Semantic-Reversal-Aware Retrieval with Spectral Acceleration: A Four-Domain Empirical Study（用于谱加速的语义反转感知检索的小型学习投影：一项四领域实证研究）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31442\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31442\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDense-embedding retrievers can fail adversarially: when a query is answered by a document A and reversed by a near-copy B that differs from A by a small meaning-changing edit (a \u0026quot;trap\u0026quot;), raw cosine over E5-Large-v2 places B in the top-10 for 82-100% of queries at a pool of 5,000. We study two things. First, a small learned projection W: R^1024 -\u0026gt; R^d (d in {11, 32}), trained by a deterministic recipe on a declared set of cases, that suppresses the trap: for the declared cases, HN@10 = 0.0000 (no trap in the top-10) in all twelve (domain, pool-size) settings across four independent domains (legal, medical, patent, financial) and pools up to 100,000, while the correct paraphrase is retained for 93-99% of cases, under exact nearest-neighbour search. Second, a boundary-conditioned accelerator that serves the projection at that scale: an acceleration of spectral graph retrieval (SpectRAG) that replaces a dense eigendecomposition with a boundary-value solve, holding HN@10 = 0.0000 at n = 100,000 in every domain and retrieving the ~300-query suite in 0.6-1.1 s (~2-4 ms per query on average). Because the lens\u0026#x27;s output is the stored representation (a few floats per document), a hardened, specialised index per domain or tenant is ~90x smaller and dimension-proportionally faster than the full embedding, making many small declared indexes a practical alternative to one large vector store. The claim is scoped to the declared cases on the measured pools, with no probabilistic bound; the correct-answer rate drops for a reworded query against an unchanged corpus (about 0.79, trap suppression still holding). A projection transfers only partly to other domains, which we report in full. The recipe, lenses, trap sets and evaluation harness are released under AGPL-3.0; the accelerator\u0026#x27;s implementation is a reserved commercial component, and every HN number is reproducible under exact search.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e密集嵌入检索器可能会遭遇对抗性失败：当查询由文档A回答，并被一个与A仅相差微小改变含义的编辑（“陷阱”）的近副本B反转时，在5000的池中，E5-Large-v2上的原始余弦相似度会将B置于82-100%查询的top-10中。我们研究了两件事。首先，一个小型学习投影W: R^1024 -\u0026gt; R^d（d属于{11, 32}），通过确定性方法在声明的案例集上训练，以抑制陷阱：对于声明的案例，在所有四个独立领域（法律、医疗、专利、金融）和高达100,000的池的十二个（领域，池大小）设置中，HN@10 = 0.0000（top-10中无陷阱），同时在精确最近邻搜索下，93-99%的案例保留了正确的释义。其次，一个在该规模下服务投影的边界条件加速器：谱图检索（SpectRAG）的加速，用边界值求解替换密集特征分解，在每个领域n = 100,000时保持HN@10 = 0.0000，并在0.6-1.1秒内检索约300个查询的套件（平均每个查询约2-4毫秒）。因为透镜的输出是存储的表示（每个文档几个浮点数），每个领域或租户的硬化、专用索引比完整嵌入小约90倍，且按维度比例更快，使得许多小型声明索引成为一个大型向量存储的实用替代方案。该声明的范围限于测量池上的声明案例，没有概率界限；对于针对未更改语料库的改述查询，正确答案率下降（约0.79，陷阱抑制仍然保持）。投影仅部分转移到其他领域，我们对此进行了完整报告。方法、透镜、陷阱集和评估工具在AGPL-3.0下发布；加速器的实现是保留的商业组件，每个HN数字在精确搜索下都是可复现的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究并解决密集嵌入检索器在面对语义反转（陷阱）时的对抗性失败问题，通过小型学习投影和谱图检索加速来实现语义反转感知的检索。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现E5-Large-v2在5000池中82-100%的查询会将语义反转的近副本置于top-10。2. 提出小型学习投影（降至11或32维），在四个领域的12种设置和高达10万池中实现HN@10=0.0000，同时保留93-99%的正确释义。3. 提出边界条件加速器，将SpectRAG的密集特征分解替换为边界值求解，10万规模下平均查询时间2-4毫秒。4. 专用索引比完整嵌入小约90倍且更快。5. 开源了方法、透镜、陷阱集和评估工具（AGPL-3.0）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过降维投影和谱图检索加速，有效抑制了密集嵌入检索器中的语义反转陷阱，并在四个领域的实证研究中证明了其在保持高正确率和极低延迟方面的有效性。局限：摘要明确指出该声明仅限于声明案例和测量池，无概率界限；改述查询会导致正确答案率下降至约0.79；投影仅能部分迁移到其他领域；加速器实现为商业保留组件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e信息检索 / 自然语言处理 / 对抗性机器学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e50. ReFocus: Progress-Guided Adaptive Practice for Long-Horizon Robotic Manipulation Reinforcement Learning（ReFocus：用于长视野机器人操作强化学习的进度引导自适应练习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32639\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32639\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOnline reinforcement learning (RL) enables vision-language-action policies to improve through environmental interaction. However, in long-horizon manipulation, sparse success/failure feedback provides little information about where policies encounter bottlenecks. Moreover, repeated full-task rollouts also leave these bottlenecks weakly analyzed and insufficiently practiced. To this end, we introduce ReFocus, a progress-guided multi-round RL framework that alternates between Global and Local RL to identify task-specific bottlenecks and allocate additional practice to them. Specifically, during Global RL, we decompose each task into a Directed Acyclic Graph (DAG) of subtasks. Then a DAG-based Progress Reward is leveraged for both policy training and bottleneck diagnosis. Based on the identified bottlenecks, ReFocus selects Adaptive Practice Windows, defining task segments from an entry stage to a target stage. It allocates additional interaction to these segments during Local RL while updating the entire policy. After that, it evaluates the policy to perform the full task for the next round of RL, forming an iteration between Global and Local RL. Experiments on LIBERO-Long and RoboCasa365 show that ReFocus achieves success rates of 97.8% and 51.3%, respectively, compared with 90.6% and 39.3% for the π_{0.5} baseline. Furthermore, we evaluate a real-world adaptation on three long-horizon tasks. On BreadBaker, ReFocus achieves 95% success, compared with 30% for the π_{0.5}. Project page: https://refocus-robotics.github.io.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在线强化学习（RL）使视觉-语言-动作策略能够通过环境交互进行改进。然而，在长视野操作中，稀疏的成功/失败反馈几乎不能提供关于策略在哪里遇到瓶颈的信息。此外，重复的完整任务展开也使得这些瓶颈分析薄弱且练习不足。为此，我们引入了ReFocus，一个进度引导的多轮RL框架，在全局和局部RL之间交替，以识别特定任务的瓶颈并为其分配额外的练习。具体而言，在全局RL期间，我们将每个任务分解为子任务的有向无环图（DAG）。然后利用基于DAG的进度奖励进行策略训练和瓶颈诊断。基于识别出的瓶颈，ReFocus选择自适应练习窗口，定义从进入阶段到目标阶段的任务片段。它在局部RL期间将额外的交互分配给这些片段，同时更新整个策略。之后，它评估策略以执行完整任务，进行下一轮RL，形成全局和局部RL之间的迭代。在LIBERO-Long和RoboCasa365上的实验表明，ReFocus分别达到了97.8%和51.3%的成功率，而π_{0.5}基线分别为90.6%和39.3%。此外，我们在三个长视野任务上评估了真实世界的适应情况。在BreadBaker上，ReFocus达到了95%的成功率，而π_{0.5}为30%。项目主页：https://refocus-robotics.github.io。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出ReFocus进度引导的多轮强化学习框架，通过在全局和局部RL之间交替，识别长视野机器人操作任务中的瓶颈并分配额外练习，以改进视觉-语言-动作策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ReFocus框架，通过交替全局和局部RL来识别任务瓶颈并分配额外练习。2. 全局RL中将任务分解为有向无环图（DAG），利用基于DAG的进度奖励进行策略训练和瓶颈诊断。3. 选择自适应练习窗口，在局部RL中为瓶颈片段分配额外交互。4. 在LIBERO-Long和RoboCasa365上成功率分别达97.8%和51.3%，显著优于π_{0.5}基线（90.6%和39.3%）。5. 在真实世界BreadBaker任务中达到95%成功率（基线30%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：ReFocus通过将任务分解为DAG并利用进度奖励，有效解决了长视野操作中稀疏反馈导致的瓶颈分析不足问题，在仿真和真实世界长视野任务中显著提升了策略的成功率。局限：摘要未提供关于该框架在不同类型长视野任务上的泛化能力、DAG构建的自动化程度、以及计算和交互开销的详细分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e51. RoMo Hands: A Large Scale Richly Organized Text to Hand Motion Dataset（RoMo Hands：一个大规模且组织丰富的文本到手部运动数据集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31766\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31766\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWhile text-driven body motion generation has matured, pure-hand synthesis remains bottlenecked by data. Existing datasets often treat hands as rigid end-effectors, lack fine-grained captions, or are too limited in scale to support robust generalization. We introduce RoMo Hands, an in-the-wild, text-paired dataset of ~542K sequences (884 hours, 95.5M frames at 30 fps) which is an order of magnitude larger than prior work. To ensure high-quality supervision, a stringent dexterity filter discards low-articulation sequences, focusing the distribution on complex bimanual movement. Each clip is paired with five captions at increasing granularities from global semantic tags to atomic finger states, organized under a hierarchical taxonomy. To bridge the gap between body and hand architectures, we propose a novel 393-D bimanual representation that adapts redundant body-motion paradigms to the high-DoF kinematics of hands. Systematic benchmarking of diffusion, masked-token, and autoregressive generators reveals distinct trade-offs under these hand-specific adaptations, including a sharp divergence between semantic alignment and kinematic plausibility. Our dataset, representation, and benchmark establish a rigorous foundation for the next generation of dexterous motion synthesis. Project page: https://romodataset.github.io/romo-hands/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e虽然文本驱动的身体运动生成已经成熟，但纯手部合成仍然受到数据的瓶颈限制。现有数据集通常将手视为刚性末端执行器，缺乏细粒度的描述，或者规模太小而无法支持鲁棒的泛化。我们引入了 RoMo Hands，这是一个自然场景下（in-the-wild）、与文本配对的数据集，包含约 542K 个序列（884 小时，30 fps 下 95.5M 帧），其规模比先前的工作大一个数量级。为了确保高质量的监督，一个严格的灵活性过滤器会丢弃低关节活动的序列，将分布集中在复杂的双手运动上。每个片段都配有五个不同粒度的描述，从全局语义标签到基础手指状态，并在分层分类法下进行组织。为了弥合身体和手部架构之间的差距，我们提出了一种新颖的 393 维双手表示法，将冗余的身体运动范式适应于手部的高自由度运动学。对扩散、掩码令牌和自回归生成器进行系统基准测试揭示了在这些手部特定适应下的不同权衡，包括语义对齐和运动学合理性之间的急剧分歧。我们的数据集、表示法和基准测试为下一代灵活运动合成奠定了严格的基础。项目页面：https://romodataset.github.io/romo-hands/.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e文本驱动的手部运动生成与数据集构建\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出RoMo Hands数据集，包含约542K个序列（884小时，95.5M帧），规模比先前工作大一个数量级；2. 引入严格的灵活性过滤器以聚焦复杂双手运动，并为每个片段提供5个不同粒度的文本描述；3. 提出393维双手表示法以适应手部高自由度运动学；4. 系统评估了扩散、掩码令牌和自回归生成器在手部运动合成中的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过构建大规模、细粒度、高质量的手部运动数据集及提出适配手部高自由度的393维表示法，解决了纯手部合成数据受限的问题，并提供了多种生成器的基准测试以揭示语义对齐与运动学合理性之间的权衡。局限性：摘要未提供生成器具体的性能指标数字，也未提及该数据集和表示法在下游具体任务中的实际部署效果或局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图形学 / 运动生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e52. EEGJev: A System One Decision Model and Benchmark for Multi-Task EEG Question Answering（EEGJev：用于多任务脑电图问答的系统一决策模型与基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32100\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32100\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA single electroencephalographic (EEG) recording can support multiple decoding tasks. Fixed-label tests cannot show how EEG foundation models handle changing questions or options. We introduce EEGJev, a fast decision model that scores candidate answers in one pass. Our benchmark, EEGJev-Bench, covers six question types across 19 public EEG sources. We held the recording and options fixed while switching between questions about attributes paired during training, such as facial expression and the hand participants were asked to use. Across 13 test sources, EEGJev selected a label for the requested attribute with 99.70% accuracy (49.20% under uniform choice). Balanced accuracy for the specific answer was 62.04%. Its 95th-percentile response time was shorter than NeuroLM\u0026#x27;s on matched validation questions answered individually. EEGJev lets users switch decoding targets by changing the question. With EEGJev-Bench, researchers can test whether new decoders follow the question more reliably, identify the correct answer more often, or both.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e单次脑电图（EEG）记录可以支持多种解码任务。固定标签测试无法展示脑电图基础模型如何处理变化的问题或选项。我们引入了 EEGJev，一种快速决策模型，可在一次遍历中对候选答案进行评分。我们的基准测试 EEGJev-Bench 涵盖了来自 19 个公共脑电图源的六种问题类型。我们在保持记录和选项固定的同时，在关于训练期间配对属性的问题之间进行切换，例如面部表情和参与者被要求使用的手。在 13 个测试源中，EEGJev 以 99.70% 的准确率（在均匀选择下为 49.20%）为请求的属性选择了一个标签。特定答案的平衡准确率为 62.04%。其第 95 百分位数的响应时间短于 NeuroLM 在单独回答的匹配验证问题上的响应时间。EEGJev 允许用户通过更改问题来切换解码目标。借助 EEGJev-Bench，研究人员可以测试新的解码器是否更可靠地遵循问题、更频繁地识别正确答案，或两者兼而有之。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e多任务脑电图（EEG）信号解码与问答\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出EEGJev快速决策模型，支持通过改变问题在一次遍历中对候选答案进行评分，实现解码目标的动态切换；2. 构建EEGJev-Bench基准测试，涵盖19个公共EEG源的6种问题类型；3. 在13个测试源中，请求属性标签选择准确率达99.70%，特定答案平衡准确率为62.04%；4. 第95百分位数响应时间短于NeuroLM模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究提出了一种能够通过改变问题动态切换解码目标的EEG快速决策模型，并构建了涵盖多种问题类型和公开数据源的基准测试，有效解决了固定标签测试无法评估模型处理变化问题能力的局限。局限性：摘要未提供关于模型在不同EEG源或不同问题类型上的具体性能差异，也未详细说明该模型在处理更复杂或未见过的认知任务时的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e生物医学工程 / 脑机接口与信号处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e53. Fractal Neural Synthesis: Constant-Storage Procedural Weight Derivation via Complex Quadratic Boundary Dynamics（分形神经合成：通过复二次边界动力学实现恒定存储的过程权重推导）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32393\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32393\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eConventional neural networks store synaptic parameters as explicit tensors whose persistent Flash footprint scales linearly (O(W)) with parameter count, constraining resource-limited edge microcontrollers. We formulate and systematically evaluate Fractal Neural Synthesis (FNS), a procedural weight derivation architecture that replaces hidden-layer matrices with a constant 24-byte coordinate seed Theta = (c_x, c_y, ell) in F_64^3 anchored near the complex quadratic bifurcation boundary dM of f_c(z) = z^2 + c. We introduce a large-bailout (R = 256) smooth escape kernel, four zero-overhead geometric sampling apertures--Cartesian Grid, coprime 3x3 Rule-of-Thirds (Z/9Z), phi-Vogel spiral, and multi-scale Harmonic Tripod--and prove conditional Kolmogorov (K_Kolm \u0026lt;= 192 + c_0 bits) and Shannon entropy bounds. Across magnifications zeta in [10^0, 10^8], C^1 Fourier and lattice-noise bases collapse to post-standardization rank ~2.25 and SHA-256 PRNG exhibits avalanche discontinuity (rho ~ 0.019, 50.6% micro-step retention), whereas dM uniquely sustains both rank (~10.0) and local continuity (rho in [0.81, 0.97], 89.2% retention). Under leak-free 10-fold CV across four zero-scaler-byte non-linear benchmarks, FNS with an INT8 readout surpasses 0-hidden Linear-INT8 by +3.6 to +10.8 pp while delivering 10.7x-129x total Flash reduction (725x-2,773x hidden reduction) relative to converged Float32 MLPs (90.30% Ionosphere in 285 B; 97.22% Optical Digits in 2,598 B; 97.90% PenDigits in 2,598 B; 87.00% Satimage in 1,570 B).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e传统的神经网络将突触参数存储为显式张量，其持久的 Flash 占用空间随参数数量线性（O(W)）缩放，限制了资源受限的边缘微控制器。我们制定并系统评估了分形神经合成（FNS），这是一种过程权重推导架构，它用锚定在 f_c(z) = z^2 + c 的复二次分岔边界 dM 附近的 F_64^3 中的恒定 24 字节坐标种子 Theta = (c_x, c_y, ell) 替换隐藏层矩阵。我们引入了一个大逃逸（R = 256）平滑逃逸核，四个零开销几何采样孔径——笛卡尔网格、互质 3x3 三分法则（Z/9Z）、phi-Vogel 螺旋和多尺度谐波三脚架——并证明了条件柯尔莫哥洛夫（K_Kolm \u0026lt;= 192 + c_0 位）和香农熵界。在 [10^0, 10^8] 的放大倍数 zeta 下，C^1 傅里叶和格噪声基坍缩到标准化后秩 ~2.25，且 SHA-256 PRNG 表现出雪崩不连续性（rho ~ 0.019，50.6% 微步保留），而 dM 独特地维持了秩（~10.0）和局部连续性（rho 在 [0.81, 0.97] 之间，89.2% 保留）。在无泄漏的 10 折交叉验证中，跨越四个零缩放器字节非线性基准，带有 INT8 读出头的 FNS 比 0 隐藏层 Linear-INT8 高出 +3.6 到 +10.8 个百分点，同时相对于收敛的 Float32 MLP 实现了 10.7 倍到 129 倍的总 Flash 缩减（隐藏层缩减 725 倍到 2,773 倍）（Ionosphere 90.30% 使用 285 B；Optical Digits 97.22% 使用 2,598 B；PenDigits 97.90% 使用 2,598 B；Satimage 87.00% 使用 1,570 B）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e资源受限边缘设备上的神经网络权重压缩与过程推导\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出分形神经合成（FNS），使用恒定的24字节坐标种子替换隐藏层矩阵，实现过程权重推导；2. 引入大逃逸平滑逃逸核及四种零开销几何采样孔径，并证明了条件柯尔莫哥洛夫和香农熵界；3. 实验表明复二次分岔边界dM能独特维持高秩和局部连续性；4. 在四个非线性基准上，FNS(INT8)相比0隐藏层Linear-INT8准确率提升3.6至10.8个百分点，并实现10.7至129倍的总Flash存储缩减。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过利用复二次分岔边界的动力学特性，提出了一种仅需恒定24字节种子即可推导神经网络权重的架构，极大地降低了边缘微控制器的存储需求，同时在多个基准测试中保持了较高的准确率。局限性：摘要未提供该模型在更复杂的深度学习任务或更大规模数据集上的表现，也未提及权重推导过程在推理阶段的计算开销和延迟局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 神经网络架构与模型压缩\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e54. Point Dynamics as Proxy for Robotic World Models（点动力学作为机器人世界模型的代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25946\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25946\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobotic world models predict future video frames from the current observation and a sequence of robot actions. While recent models follow the given actions closely, manipulated objects often collapse or move inconsistently with the action. We attribute this to the conditioning: an action, or a rendering of the robot, specifies where the robot goes but not how the scene responds, leaving a single video model to infer the interaction dynamics implicitly while also rendering appearance. We therefore separate dynamics prediction from visual rendering, with 3D point dynamics as the proxy between them. Specifically, we lift the first frame into 3D points, simulate how they respond to the robot\u0026#x27;s motion with a learned point dynamics model, and render the simulated points back into pixel-aligned videos that any video model can read. In controlled experiments on the DROID dataset with two video renderers of different architectures, this point dynamics proxy reduces object motion error by 8.6% and 6.2% without degrading image quality, and by 8.1% on a real bimanual robot. Moreover, the video follows the simulation: more accurate dynamics yield more accurate object motion, and editing the points steers the video. This suggests that advances in dynamics modeling can translate into more faithful robotic world models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人世界模型从当前观察和一系列机器人动作预测未来的视频帧。虽然最近的模型紧密跟随给定的动作，但被操作的物体经常崩溃或以与动作不一致的方式移动。我们将此归因于条件作用：动作或机器人的渲染指定了机器人去到哪里，但没有指定场景如何响应，留下单个视频模型在渲染外观的同时隐式推断交互动力学。因此，我们将动力学预测与视觉渲染分离，以 3D 点动力学作为它们之间的代理。具体而言，我们将第一帧提升为 3D 点，使用学习到的点动力学模型模拟它们如何响应机器人的运动，并将模拟的点渲染回任何视频模型都可以读取的像素对齐视频中。在 DROID 数据集上对具有不同架构的两个视频渲染器进行的受控实验中，这种点动力学代理在不降低图像质量的情况下将物体运动误差分别降低了 8.6% 和 6.2%，并在真实的双臂机器人上降低了 8.1%。此外，视频跟随模拟：更准确的动力学会产生更准确的物体运动，编辑点可以引导视频。这表明动力学建模的进步可以转化为更忠实的机器人世界模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e机器人世界模型中的交互动力学预测与视频生成\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出将动力学预测与视觉渲染分离，使用3D点动力学作为机器人世界模型中交互动力学的代理；2. 将首帧提升为3D点，利用学习的点动力学模型模拟机器人运动响应，并渲染回像素对齐视频；3. 在DROID数据集和真实双臂机器人上，该方法在不降低图像质量的前提下，分别将物体运动误差降低了8.6%、6.2%和8.1%；4. 证明了更准确的动力学模拟能产生更准确的物体运动，且编辑点可引导视频生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究通过引入3D点动力学作为代理，成功将交互动力学预测与视觉渲染解耦，解决了现有机器人世界模型中物体运动不一致或崩溃的问题，显著降低了物体运动误差。局限性：摘要未提供该代理方法在更复杂场景中的泛化能力，也未详细说明点动力学模型本身的训练数据需求、计算复杂度以及在长序列预测中的误差累积局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 世界模型与视频预测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e55. Degradation of Language Models under Controlled Load: Synchronization, Rule Execution and Misfires on the Background（受控负载下语言模型的退化：同步、规则执行与背景误触发）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.27404\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.27404\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs the load grows, a language model makes more and more errors, but different processes stand behind this decline in quality. The model may lose the correspondence with the source text, it may keep its place in the text but execute a rule wrongly, or it may change a word that no rule concerns. In this work the degradation of a model under controlled load is separated into these three components: synchronization, rule execution and misfires. The load is set by rules that replace one word with another in a meaningless text, and each kind of load (the text length, the position of a word in the answer, the replacement density, the number of rules and the place of a rule in the list) is set separately. The alignment of the answer with the reference makes it possible to follow the outcome of every word, and a statistical model that takes into account that the spread of difficulty between requests itself depends on the load restores, for each component, the laws of its dependence on every kind of load. These laws make up the passport of a model. The paper presents the method of the separation, the principles of constructing the laws and the passports of seven models built by this method; the separation opens the way to studying the fine structure of the behavior of a neural network.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着负载的增加，语言模型会犯越来越多的错误，但质量下降的背后是不同的过程。模型可能会失去与源文本的对应关系，可能会在文本中保持位置但错误地执行规则，或者可能会更改没有规则涉及的单词。在这项工作中，受控负载下模型的退化被分为这三个组成部分：同步、规则执行和误触发。负载由在无意义文本中用一个词替换另一个词的规则来设置，并且每种负载（文本长度、答案中单词的位置、替换密度、规则数量以及规则在列表中的位置）都是单独设置的。答案与参考的对齐使得跟踪每个单词的结果成为可能，并且考虑到请求之间难度分布本身取决于负载的统计模型，为每个组成部分恢复了其对每种负载的依赖规律。这些规律构成了模型的通行证。本文介绍了分离方法、构建规律和通行证的原则，以及通过该方法构建的七个模型的通行证；这种分离为研究神经网络行为的精细结构开辟了道路。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e语言模型在受控负载下的行为退化分析与机制解耦\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 将语言模型在受控负载下的退化解耦为三个独立组成部分：同步（失去与源文本对应）、规则执行错误和误触发（更改无规则涉及的词）；2. 设计受控负载实验，通过替换无意义文本中的词汇来独立控制文本长度、位置、替换密度等负载因素；3. 提出一种统计模型，恢复每个退化组成部分对各类负载的依赖规律，形成模型的“通行证”；4. 基于该方法构建并分析了七个语言模型的通行证，为研究神经网络行为的精细结构提供新途径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该研究提出了一种创新的方法，将语言模型在负载增加时的错误细分为同步、规则执行和误触发三个维度，并通过受控文本替换实验和统计模型揭示了各维度与不同负载因素的依赖规律，有助于深入理解模型行为的精细结构。局限性：摘要未提供这七个模型的具体名称或类型，也未给出各退化成分随负载变化的具体数学公式或量化指标，同时未提及该方法在评估实际复杂任务中模型退化时的适用性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 语言模型评估与可解释性\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [HKUDS/CLI-Anything](https://github.com/HKUDS/CLI-Anything)\n- **今日趋势**: 65,645 stars, 5,971 forks, 今日新增 1,094 stars\n- **项目简介**: 致力于让所有软件实现智能体（Agent）原生化。\n- **核心价值**: \n  - **项目用途**: 使所有软件具备 Agent（智能体）原生能力。\n  - **目标人群**: 仓库描述未提供。\n  - **技术核心**: CLI（命令行接口）与 Agent-Native（智能体原生）技术。\n  - **AI/大模型相关性**: 是（涉及 AI Agent 智能体技术）。\n---\n### [XiaoYouChR/Ghost-Downloader-3](https://github.com/XiaoYouChR/Ghost-Downloader-3)\n- **今日趋势**: 18,207 stars, 1,085 forks, 今日新增 950 stars\n- **项目简介**: 一款功能全面的综合性下载工具。\n- **核心价值**: \n  - **项目用途**: 提供一站式、集大成的文件下载服务。\n  - **目标人群**: 仓库描述未提供。\n  - **技术核心**: 仓库描述未提供（仅知基于 Python 语言开发）。\n  - **AI/大模型相关性**: 否。\n---\n### [vllm-project/vllm-ascend](https://github.com/vllm-project/vllm-ascend)\n- **今日趋势**: 3,151 stars, 2,843 forks, 今日新增 8 stars\n- **项目简介**: 为华为昇腾硬件提供 vLLM 推理框架的社区维护插件。\n- **核心价值**: \n  - **项目用途**: 在华为昇腾（Huawei Ascend）硬件上为 vLLM 提供硬件插件支持。\n  - **目标人群**: 仓库描述未提供。\n  - **技术核心**: vLLM 硬件插件开发与华为昇腾（Ascend）算力平台适配。\n  - **AI/大模型相关性**: 是（vLLM 为知名的大语言模型推理框架）。\n---\n\u003c/details\u003e"</script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const markdown = JSON.parse(document.getElementById("raw-md").textContent);
        const target = document.getElementById("content");
        if (!window.marked || !window.DOMPurify) {
          target.textContent = markdown;
          return;
        }
        const rendered = marked.parse(markdown);
        target.innerHTML = DOMPurify.sanitize(rendered);
      });
    </script>
</body>
</html>
