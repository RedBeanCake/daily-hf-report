    <h1>前沿科研情报 - 2026-11-26</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. Antom 3-in-1 Transformer: A Payment Foundation Model（Antom 3合1 Transformer：一种支付基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 99 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25403\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25403\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe report the development of Antom 3-in-1 Transformer, a payment foundation model that integrates sequence, tabular, and graph representations for payment risk detection. The model contains approximately 7B parameters, with approximately 1.7B activated per task route. Antom 3-in-1 Transformer is pretrained to learn reusable behavioral and relational representations, primarily on Ant International\u0026#x27;s internal payment data. In a cross-business transfer experiment, pretraining improves the target business metric by 34.5% over the same architecture trained from scratch. With only 25% of the training labels, the pretrained model outperforms the full-label scratch baseline in Average Precision (AP) and Recall@0.5% on different merchant domains. In a four-month online experiment on Ant International\u0026#x27;s billion-scale payment platform, the model reduced the overall loss rate by 37.88% relative to XGB-Online.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们报告了 Antom 3合1 Transformer 的开发，这是一种用于支付风险检测的支付基础模型，它集成了序列、表格和图表示。该模型包含大约 7B 参数，每个任务路由激活大约 1.7B 参数。Antom 3合1 Transformer 经过预训练以学习可重用的行为和关系表示，主要基于蚂蚁国际的内部支付数据。在跨业务迁移实验中，与从头训练的相同架构相比，预训练将目标业务指标提高了 34.5%。在仅有 25% 训练标签的情况下，预训练模型在不同商户领域的平均精度（AP）和 Recall@0.5% 上优于全标签从头训练的基线模型。在蚂蚁国际十亿级支付平台上进行的为期四个月的在线实验中，该模型相对于 XGB-Online 将整体损失率降低了 37.88%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e支付风险检测（集成序列、表格和图表示）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 Antom 3-in-1 Transformer，包含约 7B 参数，每个任务路由激活约 1.7B 参数。2. 跨业务迁移实验中，预训练使目标业务指标比从头训练提升 34.5%。3. 仅使用 25% 训练标签时，在不同商户领域的 AP 和 Recall@0.5% 上优于全标签从头训练基线。4. 在十亿级支付平台的四个月在线实验中，整体损失率比 XGB-Online 降低 37.88%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该模型通过预训练学习可重用表示，在少样本（25%标签）和跨业务场景下表现出显著优势，并在线上线下实验中均取得实质性指标提升，证明了其在支付风控中的有效性。局限：摘要未提供关于模型推理延迟、计算资源消耗、不同商户领域具体表现差异以及预训练数据的具体规模和分布等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e金融科技 / 支付风控 / 基础模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe（懒惰智能体违背自身信念作答：基于可验证信念的强化学习教导它们依据信念行动）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 88 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32884\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32884\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI agents working on long tasks often commit to an answer before they have enough evidence, a behavior called laziness. In our evaluations, they frequently commit even while their stated belief still names several possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During training, however, the simulator can compute the exact posterior over the answer at every step and tell whether the evidence is already enough. We propose Reinforcement Learning with Verifiable Beliefs (RLVB), which rewards the agent for taking further steps while this posterior still allows several answers and for committing once the evidence is sufficient. The reward needs no judge, critic or reward model, and it never reads the belief line the agent writes before each action. We also introduce Pro Worlds, a benchmark of visual puzzles where the agent views a large world through a small window. We evaluate three vision-language models on three benchmarks, two of which are never seen in training. RLVB improves the base model in all nine settings, by 17.1% on average. Under the outcome reward, GRPO and PPO fall below the base model on average. RLVB also outperforms PPO with a process reward from an LLM judge by 9.3% on average while using 1.6 times fewer GPU-hours. The trained agent answers with sufficient evidence in 51%, 12% and 74% of the episodes on the three benchmarks, against 8%, 0.4% and 36% for the base model. Its accuracy gain therefore comes from answering more often at high levels of evidence. The belief line shows how the agent reaches this evidence: it acts on its own belief. It commits at only 0.1 to 2.2% of the turns at which the evidence is insufficient and its line still names several answers, against 3 to 68% for the base model.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在长任务中工作的 AI 智能体经常在拥有足够证据之前就确定答案，这种行为被称为懒惰。在我们的评估中，它们经常在所陈述的信念仍然指出几个可能答案时就做出承诺。回合结束时的结果奖励仅对最终答案评分，因此无法教导智能体何时做出承诺，因为幸运的猜测与有证据支持的答案获得相同的奖励。然而，在训练期间，模拟器可以在每一步计算答案的精确后验概率，并判断证据是否已经足够。我们提出了基于可验证信念的强化学习（RLVB），当后验概率仍允许几个答案时，奖励智能体采取进一步步骤，并在证据充分时做出承诺。该奖励不需要评判者、评论家或奖励模型，并且它从不读取智能体在每次行动前写下的信念行。我们还引入了 Pro Worlds，这是一个视觉谜题基准，智能体通过一个小窗口观察大世界。我们在三个基准上评估了三个视觉语言模型，其中两个在训练中从未见过。RLVB 在所有九种设置中都提升了基础模型，平均提升 17.1%。在结果奖励下，GRPO 和 PPO 平均低于基础模型。RLVB 还平均比带有 LLM 评判者过程奖励的 PPO 高出 9.3%，同时使用的 GPU 时间减少了 1.6 倍。训练后的智能体在三个基准的 51%、12% 和 74% 的回合中以充分的证据作答，而基础模型分别为 8%、0.4% 和 36%。因此，其准确率提升来自于在高水平证据下更频繁地作答。信念行显示了智能体如何达到这一证据：它依据自己的信念行动。在证据不足且其信念行仍指出多个答案的回合中，它仅在 0.1% 到 2.2% 的回合中做出承诺，而基础模型为 3% 到 68%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决长任务中 AI 智能体在证据不足时过早给出答案（即“懒惰”）的问题，通过强化学习教导智能体在证据充分时才做出承诺。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出基于可验证信念的强化学习（RLVB），利用模拟器计算的后验概率指导智能体在证据充分时承诺，无需外部评判或奖励模型。2. 引入 Pro Worlds 视觉谜题基准。3. RLVB 在所有 9 种设置中平均提升基础模型 17.1%，优于 GRPO 和 PPO。4. 相比带 LLM 过程奖励的 PPO，RLVB 平均高出 9.3% 且 GPU 时间减少 1.6 倍。5. 显著降低智能体在证据不足时的错误承诺率（从 3-68% 降至 0.1-2.2%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：RLVB 通过利用模拟器提供的精确后验概率作为内在奖励信号，有效解决了传统结果奖励无法区分“幸运猜测”和“证据支持”的问题，显著减少了智能体的“懒惰”行为，并在多个基准上提升了准确率，同时降低了计算成本。局限：摘要未提供关于 RLVB 在无法提供精确后验概率的现实世界任务中的泛化能力、Pro Worlds 基准的具体规模，以及该方法的计算开销细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习 / 智能体行为优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. Rewirable Circuits in Transformers with Loom Attention（使用 Loom 注意力在 Transformer 中实现可重连电路）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 85 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30634\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30634\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe propose loom attention, which allows a Transformer to dynamically rewire its circuits at every token by interweaving a head\u0026#x27;s vertical attention over the outputs of earlier heads (to obtain its query, key and value) with its horizontal attention over tokens. We instantiate vertical attention efficiently with normalized and gated linear attention over a per-token matrix memory, which stores the compressed head outputs and serves as a second residual stream. This yields LoomFormer, a dual-stream architecture that splits control and content between the vector and matrix streams. Across model sizes and training token budgets in language modeling and downstream tasks, LoomFormer matches Transformers trained with over 3x compute and recent residual-stream baselines (HC/mHC, MUDDFormer, AttnRes) trained with ~1.7-2.8x. For example, trained on the same 300B tokens with only 2% extra FLOPs, LoomPythia-2.8B achieves ~1.6x the average downstream gain of mHC-Pythia-2.8B over Pythia-2.8B, and matches (0-shot) or surpasses (5-shot) Pythia-12B. Code is available at https://github.com/Caiyun-AI/LoomFormer\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了织机注意力（loom attention），它允许 Transformer 在每个 token 处动态重连其电路，通过将一个头的垂直注意力（针对早期头的输出，以获取其查询、键和值）与其在 token 上的水平注意力交织在一起。我们通过在每 token 矩阵内存上使用归一化和门控线性注意力来高效实例化垂直注意力，该内存存储压缩的头输出并作为第二个残差流。这产生了 LoomFormer，一种在向量流和矩阵流之间划分控制和内容的双流架构。在语言建模和下游任务中跨模型大小和训练 token 预算，LoomFormer 匹配了使用超过 3x 计算量训练的 Transformer 以及使用约 1.7-2.8x 计算量训练的最近残差流基线（HC/mHC、MUDDFormer、AttnRes）。例如，在相同的 300B 个 token 上训练，仅增加 2% 的 FLOPs，LoomPythia-2.8B 实现了 mHC-Pythia-2.8B 相对于 Pythia-2.8B 平均下游收益的约 1.6x，并匹配（0-shot）或超越（5-shot）Pythia-12B。代码可在 https://github.com/Caiyun-AI/LoomFormer 获取\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种新的注意力机制（Loom 注意力）和双流传架构（LoomFormer），使 Transformer 能够在每个 token 处动态重连其电路，以提高模型效率和性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 Loom 注意力，交织垂直注意力（头输出间）和水平注意力（token 间），实现每个 token 的动态电路重连。2. 提出 LoomFormer 双流传架构，划分控制和内容。3. 在相同 token 预算下，仅增加 2% FLOPs，LoomPythia-2.8B 的下游平均收益达到 mHC-Pythia-2.8B 的 1.6x。4. 匹配 3x 以上计算量训练的 Transformer 和 1.7-2.8x 计算量训练的残差流基线。5. 0-shot 匹配 Pythia-12B，5-shot 超越 Pythia-12B。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：LoomFormer 通过引入矩阵流和垂直注意力，以极小的计算开销（仅增加 2% FLOPs）实现了显著的性能提升，证明了动态电路重连在提升 Transformer 表达能力和计算效率方面的巨大潜力。局限：摘要未提供关于 Loom 注意力在长上下文处理中的具体表现、矩阵内存的显存占用开销，以及在非语言建模任务（如多模态或代码生成）上的具体实验细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 深度学习架构 / Transformer 改进\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. Don\u0026#x27;t Sleep, Keep Watch: Proactive Perception for Computer-Use Agents（别睡觉，保持警惕：计算机使用智能体的主动感知）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 84 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28947\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28947\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eComputer-use agents (CUAs) built on vision-language models are increasingly entrusted with long-horizon tasks in live desktop, web, and mobile environments, where the screen keeps changing on its own. However, current CUAs lack real-time situational awareness: they perceive the environment through discrete snapshots, and the substantial inference latency of VLMs, compounded by highly dynamic interfaces, opens a perception-action gap in which the observed state frequently becomes stale before the corresponding action is executed. To bridge this gap, we present NightWatch, a plug-and-play framework that endows any CUA with continuous, temporally grounded perception without changing the agent\u0026#x27;s model, prompt, or action space. NightWatch couples the VLM agent with NightWatch-0.8B, a lightweight System-1 model that performs streaming monitoring of the interface state and keeps the agent synchronized with the evolving environment at low computational cost and latency, thereby grounding each decision in the current state rather than an outdated snapshot and reducing both stale actions and idle waiting while preserving task success. Experiments on desktop and dynamic web environments (OSWorld-Verified and DynaCU-Bench) show that NightWatch, driven by a watcher of only 0.8B parameters, reduces non-reasoning wall-clock time by 33% and wasted time by 53% on OSWorld while keeping task success on par, raises success on DynaCU-Bench from 39.5% to 44.2% with the large VLM agent, and is more efficient than passive-watching baselines such as AOI and PUSV under the same screenshot-only input, as well as a System-1 decision model more than 30times its size. Overall, NightWatch demonstrates that the timing of perception is as critical as its content, marking a step toward agents that maintain continuous awareness of their environment rather than perceiving it turn by turn.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于视觉语言模型构建的计算机使用智能体（CUA）越来越多地被委托在实时桌面、网络和移动环境中执行长期任务，在这些环境中屏幕会自行不断变化。然而，当前的 CUA 缺乏实时态势感知：它们通过离散快照感知环境，VLM 的巨大推理延迟加上高度动态的界面，产生了一个感知-行动差距，在这个差距中，观察到的状态在执行相应动作之前经常变得过时。为了弥合这一差距，我们提出了 NightWatch，一个即插即用的框架，它赋予任何 CUA 连续的、时间接地的感知，而无需改变智能体的模型、提示或动作空间。NightWatch 将 VLM 智能体与 NightWatch-0.8B 结合，这是一个轻量级的 System-1 模型，执行界面状态的流式监控，并以低计算成本和延迟使智能体与不断发展的环境保持同步，从而将每个决策建立在当前状态而非过时的快照上，减少过时动作和空闲等待，同时保持任务成功率。在桌面和动态网络环境（OSWorld-Verified 和 DynaCU-Bench）上的实验表明，由仅 0.8B 参数的观察器驱动的 NightWatch，在 OSWorld 上将非推理挂钟时间减少了 33%，浪费的时间减少了 53%，同时保持任务成功率持平；在 DynaCU-Bench 上将大型 VLM 智能体的成功率从 39.5% 提高到 44.2%；并且在相同的仅截图输入下，比 AOI 和 PUSV 等被动观察基线以及大小超过其 30 倍的 System-1 决策模型更有效。总体而言，NightWatch 证明了感知的时间与其内容同样关键，标志着智能体朝着保持对环境的持续感知而非逐轮感知的方向迈进了一步。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决计算机使用智能体（CUA）在动态环境中因感知延迟导致的“感知-行动差距”问题，实现连续、实时的态势感知。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出即插即用框架 NightWatch，无需修改原 CUA 模型、提示或动作空间即可实现连续感知。2. 引入 NightWatch-0.8B 轻量级 System-1 模型进行流式界面监控。3. 在 OSWorld 上减少 33% 非推理挂钟时间和 53% 浪费的时间，成功率持平。4. 在 DynaCU-Bench 上将大型 VLM 智能体成功率从 39.5% 提升至 44.2%。5. 效率优于被动观察基线（AOI、PUSV）及大 30 倍的 System-1 决策模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：NightWatch 通过引入轻量级的 System-1 监控模型，有效解决了 VLM 推理延迟带来的状态过时问题，在不增加原模型负担的情况下显著提升了 CUA 在动态环境中的执行效率和成功率，证明了感知时机的重要性。局限：摘要未提供关于 NightWatch-0.8B 在极端复杂或全新界面环境下的泛化能力、流式监控的具体帧率或延迟数值，以及该框架在移动端环境的具体实验结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 计算机使用智能体 / 视觉语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. ACAP: Asynchronous Coding Agents for Efficient Robot Control（ACAP：用于高效机器人控制的异步编码智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 61 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31205\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31205\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCoding agents can construct and revise robot behavior during execution, but using one agent for the whole robot can delay otherwise independent work. We introduce Asynchronous Coding Agents as Policy (ACAP), an asynchronous framework that organizes one robot as a team of persistent agents. Each member reasons and acts for a configurable control group, such as an arm with its gripper or the torso and chassis, enabling asynchronous reasoning and execution. However, different robot components often have physical dependencies that require coordination. To address this challenge, ACAP introduces a hyper-agent that assigns tasks, coordinates dependencies, and dynamically allocates control between the lead and member agents. This allows independent work to progress concurrently while supporting tightly coupled manipulation when necessary. Across 72 real-world rollouts covering 25 task/platform settings, ACAP reduces task-balanced time cost by 28.2% compared with a single-agent Direct Policy, with improvements across Fully Parallel, Parallel-Sequential, and Collaborative tasks. Across all eight Collaborative settings, ACAP also achieves lower mean time cost than Fixed Delegation, where only member agents can control their assigned groups. An additional 90-rollout study shows lower mean 30-minute-capped time cost than Direct on all six tasks. We further demonstrate mobile manipulation using the same member interface for chassis and torso control. We present the framework and a real-world rollout dataset containing observations, generated programs, actions, and feedback to support research on how coding agents reason and act in the physical world.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e编码智能体可以在执行期间构建和修改机器人行为，但对整个机器人使用一个智能体会延迟原本独立的工作。我们引入了异步编码智能体策略（ACAP），这是一个异步框架，将一个机器人组织为一个持久智能体团队。每个成员为可配置的控制组进行推理和行动，例如带有夹爪的机械臂或躯干和底盘，从而实现异步推理和执行。然而，不同的机器人组件通常具有需要协调的物理依赖关系。为了应对这一挑战，ACAP 引入了一个超级智能体，用于分配任务、协调依赖关系，并在主导智能体和成员智能体之间动态分配控制权。这允许独立工作并发进行，同时在必要时支持紧密耦合的操作。在涵盖 25 个任务/平台设置的 72 次真实世界部署中，与单智能体直接策略相比，ACAP 将任务平衡时间成本降低了 28.2%，在完全并行、并行-顺序和协作任务中均有改进。在所有 8 个协作设置中，ACAP 还实现了比固定委派（仅成员智能体可以控制其分配的组）更低的平均时间成本。一项额外的 90 次部署研究表明，在所有 6 个任务上，其平均 30 分钟上限时间成本低于直接策略。我们进一步展示了使用相同的成员接口进行底盘和躯干控制的移动操作。我们提出了该框架和一个包含观察、生成程序、动作和反馈的真实世界部署数据集，以支持关于编码智能体如何在物理世界中推理和行动的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决单智能体控制整个机器人导致的效率低下问题，通过异步框架协调多机器人组件的独立与耦合任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 ACAP 异步框架，将机器人组织为持久智能体团队，实现组件级异步推理与执行。2. 引入超级智能体分配任务、协调物理依赖并动态分配控制权。3. 在 72 次真实世界部署中，相比单智能体直接策略，任务平衡时间成本降低 28.2%。4. 在 8 个协作设置中，平均时间成本低于固定委派策略。5. 在 90 次部署研究中，6 个任务的平均 30 分钟上限时间成本均低于直接策略。6. 开源真实世界部署数据集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：ACAP 通过多智能体异步协作和超级智能体的动态协调，有效解决了机器人多组件控制中的物理依赖与并发执行问题，显著降低了任务时间成本，并在多种任务类型（并行、顺序、协作）中展现了优越性。局限：摘要未提供关于超级智能体在极端冲突依赖下的协调失败率、不同组件间通信延迟的具体影响，以及该框架在更多样化或未知机器人平台上的泛化能力细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 多智能体系统 / 编码智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Self-Evolving Evaluation Environments for Computer-Use Agents（计算机使用代理的自进化评估环境）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 45 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30962\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30962\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eComputer-use agents (CUAs) are rapidly improving, yet their evaluation remains largely static. Existing benchmarks provide a strong foundation, but fixed difficulty ceilings, limited feature coverage, and coarse aggregate scores progressively weaken their discriminative and diagnostic value. We introduce CUA-SEE, a closed-loop evaluation environment that co-evolves tasks and executable verifiers from rollout evidence. It disentangles three objectives: benchmark evolution expands evaluation scope through cohort-calibrated difficulty and coverage growth; diagnostic evolution increases resolution through agent-conditional capability-boundary probes; and verifier evolution improves precision by translating changing requirements into state-grounded checkpoints with adversarial validation. Across multiple agents, applications, and rounds, CUA-SEE generates challenging, measurable tasks while preserving process-level evidence. Our results position adaptive evaluation as a scalable counterpart to self-evolving agents, continuously tracking what agents can do, where their boundaries lie, and how reliably progress is measured.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e计算机使用代理（CUA）正在快速改进，但其评估在很大程度上仍然是静态的。现有的基准测试提供了坚实的基础，但固定的难度上限、有限的特征覆盖范围以及粗糙的聚合分数逐渐削弱了它们的区分和诊断价值。我们引入了 CUA-SEE，一个闭环评估环境，可以从 rollout 证据中共同进化任务和可执行验证器。它解耦了三个目标：基准进化通过队列校准的难度和覆盖范围增长来扩展评估范围；诊断进化通过代理条件能力边界探测来提高分辨率；验证器进化通过将不断变化的需求转化为基于状态的检查点并进行对抗性验证来提高精度。在多个代理、应用和轮次中，CUA-SEE 生成具有挑战性、可衡量的任务，同时保留过程级证据。我们的结果将自适应评估定位为自进化代理的可扩展对应物，持续跟踪代理能做什么、它们的边界在哪里以及如何可靠地衡量进展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e为计算机使用代理（CUA）构建自进化的闭环评估环境，以解决现有静态基准测试在难度上限、特征覆盖和聚合分数方面的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 CUA-SEE 闭环评估环境，从 rollout 证据中共同进化任务和可执行验证器。2. 解耦三个目标：基准进化（扩展评估范围）、诊断进化（提高分辨率）和验证器进化（提高精度）。3. 在多个代理、应用和轮次中生成具有挑战性且可衡量的任务，并保留过程级证据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该研究提出了一种自适应评估方法，通过共同进化任务和验证器来持续跟踪代理的能力边界和进展，解决了静态评估的局限。局限：摘要未提供具体的实验性能提升数字、对比的基线模型名称或具体的应用场景细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能评估 / 计算机使用代理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. S-Mind: Internalizing Multi-View Geometry for Spatial Intelligence（S-Mind：为空间智能内化多视图几何）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 41 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28649\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28649\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpatial intelligence, the ability to reason about 3D space from visual observations, becomes essential as multimodal large language models (MLLMs) move into the physical world. Beyond perceiving each view, it rests on two cornerstones of human cognition: fusing multiple views into one coherent 3D scene and mentally transforming that scene to new viewpoints as reasoning unfolds. Yet our spatial probes reveal that MLLMs largely lack both capabilities, even after spatial fine-tuning. We therefore present S-Mind, which internalizes multi-view geometry within the MLLM through a compact set of spatial tokens. It supervises these tokens to hold the fused 3D scene and re-emits them to re-express this scene from every viewpoint the reasoning adopts. Across four spatial benchmarks, S-Mind improves its Qwen3.5 backbones by up to 22.26 points and surpasses frontier general models such as GPT-6-Astra (+0.45), Kimi-K3.1-Pro (+1.97), and GLM-5.3-Flash (+7.80) in average accuracy. Moreover, the same probes confirm that it acquires both capabilities, reaching fusion and transformation accuracies of 65.11% and 82.17%, against at most 16.02% and 37.28% for the baselines. At inference, S-Mind also runs about 100x faster than a tool-based agent on the same backbone. Instilled through these spatial tokens during training, spatial capability becomes intrinsic to the backbone and persists even when the tokens are withheld, offering a promising path toward spatial intelligence in MLLMs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e空间智能，即从视觉观察中推理 3D 空间的能力，随着多模态大语言模型（MLLM）进入物理世界而变得至关重要。除了感知每个视图之外，它还依赖于人类认知的两个基石：将多个视图融合为一个连贯的 3D 场景，并在推理展开时将该场景在心理上转换到新的视点。然而，我们的空间探测表明，即使经过空间微调，MLLM 也很大程度上缺乏这两种能力。因此，我们提出了 S-Mind，它通过一组紧凑的空间标记在 MLLM 内部化多视图几何。它监督这些标记以保留融合的 3D 场景，并重新发射它们以从推理采用的每个视点重新表达该场景。在四个空间基准测试中，S-Mind 将其 Qwen3.5 主干网络提高了多达 22.26 分，并在平均准确率上超越了 GPT-6-Astra（+0.45）、Kimi-K3.1-Pro（+1.97）和 GLM-5.3-Flash（+7.80）等前沿通用模型。此外，相同的探测证实它获得了这两种能力，融合和转换准确率分别达到 65.11% 和 82.17%，而基线模型最多分别为 16.02% 和 37.28%。在推理时，S-Mind 在相同主干网络上的运行速度也比基于工具的代理快约 100 倍。通过在训练期间通过这些空间标记灌输，空间能力成为主干网络的内在能力，即使在扣留标记的情况下也能持续存在，为 MLLM 中的空间智能提供了一条有前途的路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提升多模态大语言模型（MLLM）的空间智能，使其具备将多视图融合为连贯3D场景以及将场景心理转换到新视点的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 S-Mind，通过紧凑的空间标记在 MLLM 内部化多视图几何，监督标记保留融合场景并从不同视点重新表达。2. 在四个空间基准上，Qwen3.5 主干提升达 22.26 分，超越 GPT-6-Astra、Kimi-K3.1-Pro 和 GLM-5.3-Flash。3. 融合和转换准确率分别达 65.11% 和 82.17%，远超基线。4. 推理速度比基于工具的代理快约 100 倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：研究通过引入空间标记成功将多视图几何能力内化到 MLLM 中，显著提升了空间推理能力、准确率及推理速度。局限：摘要未提供四个空间基准的具体名称、空间标记的具体数量或网络结构细节，也未说明在扣留标记时具体保留了多少性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型 / 空间智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. PartAgent: Agentic 3D Part Segmentation via Expert Integration and Closed-Loop Refinement（PartAgent：通过专家集成和闭环细化的代理式 3D 部件分割）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 33 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32554\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32554\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSegmenting a 3D object into semantically meaningful parts requires joint reasoning about geometric structure and semantic context. Pretrained 3D experts provide spatially grounded region proposals, while 2D experts provide semantic cues for identifying object parts. The challenge is to integrate these complementary capabilities into a framework that can both produce meaningful part segmentations and progressively refine them. We present PartAgent, a training-free agentic framework for 3D part segmentation built upon two complementary modules: (i) Structural-Semantic Expert Integration combines regions predicted by the 3D expert with multiview semantic evidence from the 2D expert through image-to-surface correspondences, constructing compositional part partitions at multiple granularities. (ii) Observation-Driven Closed-Loop Partition Refinement observes the current partition and its supporting evidence to select targeted inspection, evidence repair, composition, or reselection actions. It verifies proposed changes and uses the updated state and action outcomes to guide subsequent decisions. On PartObjaverse-Tiny-WT, PartAgent achieves 68.41 mIoU, outperforming the strongest competing method by 8.53 points. Across 3DCoMPaT200, PartNeXt, PartNetE, and PartObjaverse-Tiny, PartAgent achieves the highest mIoU on each dataset, averaging 69.36 across the four datasets, 7.28 points above the highest mean among competing methods.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将 3D 对象分割为具有语义意义的部件需要对几何结构和语义上下文进行联合推理。预训练的 3D 专家提供空间接地的区域提议，而 2D 专家提供用于识别对象部件的语义线索。挑战在于将这些互补的能力整合到一个框架中，该框架既能产生有意义的部件分割，又能逐步细化它们。我们提出了 PartAgent，一个用于 3D 部件分割的免训练代理框架，建立在两个互补模块之上：（i）结构-语义专家集成通过图像到表面对应将 3D 专家预测的区域与 2D 专家的多视图语义证据相结合，构建多个粒度的组合部件分区。（ii）观察驱动的闭环分区细化观察当前分区及其支持证据，以选择有针对性的检查、证据修复、组合或重新选择操作。它验证提出的更改并使用更新的状态和操作结果来指导后续决策。在 PartObjaverse-Tiny-WT 上，PartAgent 实现了 68.41 mIoU，比最强的竞争方法高出 8.53 分。在 3DCoMPaT200、PartNeXt、PartNetE 和 PartObjaverse-Tiny 上，PartAgent 在每个数据集上实现了最高的 mIoU，在四个数据集上平均达到 69.36，比竞争方法中的最高平均值高出 7.28 分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个免训练的代理式框架（PartAgent），用于3D部件分割，通过整合3D和2D专家的能力并进行闭环细化来实现语义上有意义的部件分割。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出免训练代理框架 PartAgent，包含结构-语义专家集成和观察驱动的闭环分区细化两个模块。2. 在 PartObjaverse-Tiny-WT 上达到 68.41 mIoU，超越最强竞争方法 8.53 分。3. 在 3DCoMPaT200、PartNeXt、PartNetE 和 PartObjaverse-Tiny 四个数据集上平均 mIoU 达 69.36，超越竞争方法最高均值 7.28 分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该研究通过结合3D和2D专家的优势以及闭环细化机制，在多个3D部件分割数据集上取得了显著的性能提升，且无需训练。局限：摘要未提供具体的推理时间、计算资源消耗、3D/2D专家的具体模型名称，以及闭环细化过程中的具体迭代次数或收敛条件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e3D 视觉 / 部件分割\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. LingSante MedGuard Technical Report（LingSante MedGuard 技术报告）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 30 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.25509\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.25509\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAs medical AI is increasingly used for patient consultation and clinical decision support, identifying harmful, non-compliant, or ethically problematic responses is essential for responsible deployment. Assessing these risks requires checking clinical claims against relevant evidence, verifying calculations, and applying medical requirements under their intended conditions. We introduce LingSante MedGuard, a capability-enhanced guardrail that integrates supervision from a medical guardrail teacher model and six specialized medical capability experts into a unified model. The guardrail teacher supervises risk decisions and explanations across medical safety, compliance, and ethics, while the capability experts support medical rule understanding, numerical reasoning, multimodal hallucination detection, agentic safety verification, risk localization, and multimodal entity understanding. We consolidate these sources of supervision through offline supervised fine-tuning on teacher-generated demonstrations, followed by multi-teacher on-policy distillation using feedback on student-generated responses. We further introduce LingSante MedGuardBench, a benchmark comprising 11 risk-detection subsets spanning medical safety, compliance, and ethics. At 4B, 9B, and 27B scales, LingSante MedGuard achieves mean benchmark F1 scores of 82.3%, 82.4%, and 87.4%, respectively. The 4B model also achieves 73.9% mean accuracy across MedHallu and MedHALT-NOTA under retrieval-enabled evaluation. Additional evaluations of the verification components show improvements in evidence-supported consistency, source traceability, and rule-guided rationale quality across model scales. These results support the integration of specialized medical capabilities into a unified guardrail for medical risk assessment and evidence-based medical safety verification.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着医疗 AI 越来越频繁地用于患者咨询和临床决策支持，识别有害、不合规或存在伦理问题的响应对于负责任的部署至关重要。评估这些风险需要根据相关证据检查临床声明、验证计算并在预期条件下应用医疗要求。我们引入了 LingSante MedGuard，一个增强能力的护栏，它将来自医疗护栏教师模型和六个专门的医疗能力专家的监督整合到一个统一模型中。护栏教师监督跨医疗安全、合规性和伦理的风险决策和解释，而能力专家支持医疗规则理解、数值推理、多模态幻觉检测、代理安全验证、风险定位和多模态实体理解。我们通过离线监督微调（基于教师生成的演示）整合这些监督来源，随后使用对学生生成响应的反馈进行多教师在策略蒸馏。我们进一步引入了 LingSante MedGuardBench，一个包含 11 个风险检测子集的基准，涵盖医疗安全、合规性和伦理。在 4B、9B 和 27B 规模下，LingSante MedGuard 的平均基准 F1 分数分别达到 82.3%、82.4% 和 87.4%。4B 模型在启用检索的评估下，在 MedHallu 和 MedHALT-NOTA 上的平均准确率也达到了 73.9%。对验证组件的额外评估显示，在各个模型规模上，证据支持的一致性、来源可追溯性和规则引导的理由质量均有所提高。这些结果支持将专门的医疗能力整合到统一的护栏中，用于医疗风险评估和基于证据的医疗安全验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个用于医疗风险评估和安全验证的统一增强型护栏模型（LingSante MedGuard），以识别医疗AI响应中的有害、不合规或伦理问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出 LingSante MedGuard，整合医疗护栏教师模型和六个专门医疗能力专家的监督。2. 引入 LingSante MedGuardBench，包含 11 个涵盖安全、合规和伦理的风险检测子集。3. 在 4B、9B、27B 规模下平均 F1 分数分别达 82.3%、82.4%、87.4%。4. 4B 模型在 MedHallu 和 MedHALT-NOTA 上平均准确率达 73.9%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：研究通过多教师蒸馏和整合多个专门医疗专家的能力，构建了一个强大的医疗安全护栏，并在自建基准和现有基准上取得了高F1和准确率。局限：摘要未提供与现有医疗护栏模型的具体性能对比数据，未说明六个能力专家的具体架构，也未提及模型在真实临床环境中的部署测试结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医疗人工智能 / 安全与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies（具身 AI 未通过镜子测试：简单的镜子如何破坏机器人策略）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 27 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33010\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33010\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCan a simple mirror expose the limitations of today\u0026#x27;s robotic manipulation policies? Inspired by the mirror self-recognition test in animal cognition, we investigate whether robot policies can reliably manipulate physical objects in scenes containing their reflections. We introduce RoboDojo-Mirror, a benchmark built on RoboDojo that preserves task objectives, success criteria, and policy checkpoints while comparing a mirror-free baseline with single-mirror, dual-mirror, and mirrored-tabletop conditions. Across five policies spanning Vision-Language-Action models, World Action Models, and agentic policies, every mirror condition reduces aggregate success rates: averaged over the three conditions, the drop ranges from 10.8 to 56.7 percentage points across policies, and it reaches 62.5 points on the mirrored tabletop. Because a mirror is also a physical obstacle, we compare it against geometrically matched non-reflective panels; 50--88\\% of mirror-specific failures occur without recorded robot--panel contact, so direct collisions alone do not explain the degradation. Trajectory and contact analyses instead reveal recurring behaviors consistent with phantom targeting of reflected objects and spatial mislocalization of real ones. Targeted diagnostics further characterize grasping near reflections, policy-dependent pushing progress, and physical-target interaction under main-camera occlusion. Real-robot experiments with π_{0.5} and FastWAM also show lower overall success rates under the upright-mirror and mirrored-tabletop conditions. These findings reveal a shared vulnerability to reflective environments across diverse robot policies and motivate reflection-aware evaluation of embodied intelligence. Code is available at https://github.com/iPPLab/robodojo-mirror.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e一面简单的镜子能否暴露当今机器人操作策略的局限性？受动物认知中镜子自我识别测试的启发，我们调查了机器人策略是否能在包含其反射的场景中可靠地操作物理对象。我们引入了 RoboDojo-Mirror，这是一个建立在 RoboDojo 上的基准，它保留了任务目标、成功标准和策略检查点，同时比较了无镜基线与单镜、双镜和镜面桌面条件。在跨越视觉-语言-动作模型、世界动作模型和代理策略的五种策略中，每种镜子条件都降低了总体成功率：在三种条件的平均值上，不同策略的下降幅度从 10.8 到 56.7 个百分点不等，在镜面桌面上达到了 62.5 个百分点。由于镜子也是物理障碍物，我们将其与几何匹配的非反射面板进行了比较；50-88% 的镜子特定故障在没有记录的机器人-面板接触的情况下发生，因此直接碰撞并不能单独解释性能的下降。轨迹和接触分析反而揭示了与反射物体的幻影目标和真实物体的空间错误定位相一致的反复出现的行为。有针对性的诊断进一步表征了反射附近的抓取、依赖于策略的推动进展以及主相机遮挡下的物理目标交互。使用 π_{0.5} 和 FastWAM 的真实机器人实验也显示，在直立镜和镜面桌面条件下总体成功率较低。这些发现揭示了不同机器人策略在反射环境中的共同脆弱性，并激发了对具身智能的反射感知评估。代码可在 https://github.com/iPPLab/robodojo-mirror 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e调查和评估机器人操作策略在包含镜面反射的物理环境中的可靠性和局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入 RoboDojo-Mirror 基准，比较无镜基线与多种镜子条件（单镜、双镜、镜面桌面）。2. 发现镜子条件使五种策略的总体成功率下降 10.8 到 56.7 个百分点，镜面桌面下降达 62.5 个百分点。3. 证明性能下降并非由于直接碰撞（50-88%的故障无接触记录），而是由于幻影目标和空间错误定位。4. 在真实机器人（π_{0.5} 和 FastWAM）上验证了该脆弱性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：研究通过精心设计的基准和真实机器人实验，系统性地揭示了当前多种机器人策略在反射环境中的共同脆弱性，并排除了物理碰撞作为主要原因。局限：摘要未提供具体五种策略的名称（仅提及类别）、真实机器人实验的具体成功率下降数值，以及针对反射脆弱性的具体改进方案或缓解策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身人工智能 / 机器人操作\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. ThinkMorph-SSL: Scaling Interleaved Multimodal Reasoning with Pretext Tasks（ThinkMorph-SSL：利用预训练任务扩展交错多模态推理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 21 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32183\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32183\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePeople reason with pictures as well as words. Interleaved multimodal reasoning gives models a similar way to solve problems by creating intermediate images and using them to guide further reasoning. Training models with this ability usually relies on task-specific demonstrations, which are difficult to collect. We introduce ThinkMorph-SSL, a two-stage training recipe that uses images themselves as a source of supervision. The first stage, pretext reasoning, converts visual pretext tasks, such as image colorization and denoising, into instruction-free interleaved traces. Models describe a corrupted or transformed image, generate a restored or canonical image, and interpret the result. The second stage uses automatically constructed demonstrations for question-driven instruction tuning. At the same instruction-tuning budget, models trained with pretext reasoning outperform those trained with instruction tuning alone. The full recipe improves over the base model by an average of 11.33 accuracy points across twelve benchmarks. These results show that supervision derived from images can build the visual skills needed for interleaved reasoning and improve learning from task-specific demonstrations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e人们不仅用文字推理，也用图片推理。交错多模态推理为模型提供了一种类似的问题解决方式，即创建中间图像并利用它们来引导进一步的推理。训练具有这种能力的模型通常依赖于特定任务的示范，而这些示范很难收集。我们引入了 ThinkMorph-SSL，这是一种两阶段训练方法，利用图像本身作为监督信号来源。第一阶段，预训练推理，将视觉预训练任务（如图像着色和去噪）转化为无指令的交错轨迹。模型描述受损或变换的图像，生成恢复或规范的图像，并解释结果。第二阶段使用自动构建的示范进行问题驱动的指令微调。在相同的指令微调预算下，使用预训练推理训练的模型优于仅使用指令微调训练的模型。完整的训练方法在十二个基准测试中使基础模型的平均准确率提高了 11.33 个点。这些结果表明，源自图像的监督可以构建交错推理所需的视觉技能，并改善从特定任务示范中的学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种两阶段训练方法（ThinkMorph-SSL），利用图像本身作为监督信号，以解决交错多模态推理训练中特定任务示范难以收集的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出两阶段训练方法，第一阶段将视觉预训练任务转化为无指令的交错轨迹，第二阶段进行问题驱动的指令微调。2. 在相同指令微调预算下，结合预训练推理的模型性能优于仅使用指令微调的模型。3. 在12个基准测试中，平均准确率比基础模型提高11.33个点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该方法通过图像自身生成监督信号，有效降低了对特定任务示范的依赖，并在多个基准上取得了显著的性能提升，证明了图像监督在构建交错推理视觉技能方面的有效性。局限：摘要未提供关于该方法在不同模态组合、更复杂推理任务或计算成本方面的具体局限性和详细分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习与推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. Qwen-Image-HD: Autoregressive Diffusion for High Definition Image Generation（Qwen-Image-HD：用于高清图像生成的自回归扩散模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32736\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32736\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFine-tuning a generator on a complete high-resolution canvas requires long image sequences and substantial computation, yet local regions can still exhibit unnatural repetitive stripes when training resources are limited. We introduce Qwen-Image-HD, which adapts Qwen-Image 2.0 to high-resolution synthesis through local training and blockwise autoregressive generation. Each prediction covers a target tile at 1K scale, conditioned on high-resolution upper and left neighbors and a compressed historical thumbnail. These conditions provide adjacent fine-scale structures and an overview of the scene generated so far. To integrate these complementary cues, we map both forms of history and the target to a shared canvas coordinate system to express their spatial relationships and scale differences. On Qwen-Image-Bench at 4K, Qwen-Image-HD achieves stronger overall evaluation performance than direct 4K generation with FLUX-3-Image-Klein. Compared with full-image 4K supervised fine-tuning of the same backbone, it achieves better generation quality with lower training compute and higher inference efficiency, while exhibiting fewer unnatural repetitive stripes in original-resolution comparisons. We further introduce a Wavefront-AutoRegressive inference schedule that generates tiles on the same anti-diagonal concurrently across GPUs to reduce single-image latency.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在完整的高分辨率画布上微调生成器需要长图像序列和大量计算，而且在训练资源有限时，局部区域仍可能出现不自然的重复条纹。我们引入了 Qwen-Image-HD，它通过局部训练和分块自回归生成，使 Qwen-Image 2.0 适应高分辨率合成。每次预测覆盖 1K 尺度的目标图块，条件为高分辨率的上方和左侧邻居以及压缩的历史缩略图。这些条件提供了相邻的精细结构和到目前为止生成的场景的概览。为了整合这些互补的线索，我们将这两种形式的历史和目标映射到共享的画布坐标系中，以表达它们的空间关系和尺度差异。在 4K 的 Qwen-Image-Bench 上，Qwen-Image-HD 取得了比使用 FLUX-3-Image-Klein 直接进行 4K 生成更强的整体评估性能。与同一骨干网络的全图像 4K 监督微调相比，它以更低的训练计算量和更高的推理效率实现了更好的生成质量，同时在原始分辨率比较中表现出更少的不自然重复条纹。我们进一步引入了波前自回归推理调度，跨 GPU 并发生成同一反对角线上的图块，以减少单张图像的延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 Qwen-Image-HD，通过局部训练和分块自回归生成，解决高分辨率图像生成中计算量大及局部出现不自然重复条纹的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 采用局部训练和分块自回归生成，每次预测覆盖1K尺度目标图块，结合高分辨率邻居和压缩历史缩略图作为条件。2. 将历史和目标映射到共享画布坐标系以整合空间关系和尺度差异。3. 在4K Qwen-Image-Bench上整体评估性能优于FLUX-3-Image-Klein的直接4K生成。4. 相比全图像4K微调，训练计算量更低，推理效率更高，重复条纹更少。5. 提出波前自回归推理调度，跨GPU并发生成反对角线图块以降低延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该研究通过分块自回归和局部条件约束，有效降低了高分辨率图像生成的训练和推理成本，同时提升了生成质量并减少了伪影。波前调度进一步提升了推理效率。局限：摘要未提供关于该方法在极端分辨率下的表现、生成多样性限制或与其他最新自回归与扩散混合模型对比的详细局限性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. KMed-31B Technical Report（KMed-31B 技术报告）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28719\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28719\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present KMed-31B, a medical large language model post-trained from an open-weight model for on-premises deployment with limited hardware. Post-training a model for diverse medical tasks remains difficult, because improving one kind of task can lower performance on another. We attribute this to differences between tasks in expected output and available feedback. Medical question answering and diagnosis prediction have reference answers, whereas clinical inquiry has no single correct response and is judged with rubrics. We therefore divide medical training tasks into four categories by these two properties, train one specialist per category with a reward that its feedback supports, and integrate the specialists into a single student with Multi-teacher On-policy Delta Distillation (MOPD^2). For clinical inquiry, we build Synthetic Health Dialogue, a simulated corpus of consultations with lay users and clinicians whose patient cases span common clinical presentations in primary care. Relative to its base model, KMed-31B raises HealthBench Hard from 22.95 to 41.87 and HealthBench Professional from 37.92 to 50.20 in non-thinking mode, and from 23.80 to 51.48 and from 41.97 to 59.18 in thinking mode, while its scores on four multiple-choice medical benchmarks are maintained or slightly improved. KMed-31B has the highest unadjusted HealthBench Hard score among the compared models, including proprietary ones, and scores higher on HealthBench Professional than every open-weight model we compare, including models with more than ten times as many total parameters. Applied to another base model, Qwen3.8-27B, the same training recipe also raises both HealthBench scores. We describe the training recipe, data construction, and settings in detail so that institutions requiring on-premises deployment can develop medical models from open-weight foundations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了 KMed-31B，这是一个从开放权重模型后训练而来的医疗大型语言模型，用于在硬件有限的本地环境中部署。针对多种医疗任务对模型进行后训练仍然很困难，因为提高一种任务的性能可能会降低另一种任务的性能。我们将此归因于任务在预期输出和可用反馈方面的差异。医疗问答和诊断预测有参考答案，而临床询问没有单一正确答案，而是通过评分标准进行评判。因此，我们根据这两个属性将医疗训练任务分为四类，为每个类别训练一个专家，并使用其反馈支持的奖励，然后通过多教师在线策略增量蒸馏（MOPD^2）将这些专家整合到一个单一的学生模型中。对于临床询问，我们构建了合成健康对话，这是一个与外行用户和临床医生咨询的模拟语料库，其患者病例涵盖了初级保健中常见的临床表现。相对于其基础模型，KMed-31B 在非思考模式下将 HealthBench Hard 从 22.95 提高到 41.87，HealthBench Professional 从 37.92 提高到 50.20，在思考模式下分别从 23.80 提高到 51.48，从 41.97 提高到 59.18，同时在四个多项选择医疗基准测试中的分数得到保持或略有提高。KMed-31B 在比较的模型（包括专有模型）中具有最高的未调整 HealthBench Hard 分数，并且在 HealthBench Professional 上的得分高于我们比较的每个开放权重模型，包括总参数量超过其十倍的模型。将相同的训练方法应用于另一个基础模型 Qwen3.8-27B，也提高了两项 HealthBench 分数。我们详细描述了训练方法、数据构建和设置，以便需要本地部署的机构能够从开放权重基础开发医疗模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 KMed-31B 医疗大语言模型及相应的后训练方法，解决在硬件受限的本地部署场景下，多任务医疗训练中存在的能力冲突问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 根据预期输出和可用反馈将医疗任务分为四类，分别训练专家模型，并使用多教师在线策略增量蒸馏整合为单一模型。2. 构建了涵盖初级保健常见临床表现的合成健康对话模拟语料库。3. 相比基础模型，在HealthBench Hard和Professional上显著提升，且四项多项选择基准分数保持或略升。4. 在对比模型中取得最优的HealthBench Hard和Professional成绩。5. 训练方法可迁移至其他基础模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该研究通过任务分类和专家蒸馏策略，有效缓解了医疗多任务训练中的性能冲突，并在多个权威基准上取得了领先成绩，同时提供了详细的本地部署训练方案。局限：摘要未提供关于该模型在真实临床环境中的实际部署反馈、长文本病历处理能力或特定罕见病诊断方面的局限性和评估细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医疗人工智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. ICLWorld: Benchmarking In-Context Learning of Agents from Digital to Physical Worlds（ICLWorld：从数字世界到物理世界的智能体上下文学习基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 18 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32649\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32649\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn-context learning (ICL) lets agents acquire new rules from context and adapt to user-specific requirements at inference time. The same frontier agents now operate both computers and robots, yet their ICL remains insufficiently assessed: existing benchmarks are largely offline, rely on text or static images, and risk training-data contamination, while robot evaluations are limited to method-level ablations. We present ICLWorld, an online benchmark that evaluates the ICL of agents from digital to physical worlds, covering computer use and robot use, together with UIverse, a unified harness that turns every environment into a user interface. We build 30 environments, record 630 demonstration videos (10+ hours), and design 160 tasks with customized, often counter-intuitive rules that cannot be satisfied without learning from the context. Each task comes with three rule versions, given as text or video, and we test generalization at three levels, from replaying the demonstration to new instances and unseen environments. Across six frontier models, the strongest agents, Claude Opus 5.5 and GPT-6 Astra, succeed on 82% and 76% of computer-use runs but only 27% and 26% of robot-use runs, and a no-rule control reduces success to at most 8%. GPT-6 Astra succeeds under all three rule versions on only 38% of computer-use tasks, half its rate under a single rule, and answers 98% of robot rule questions correctly yet completes only 20% of these tasks. Frontier agents learn rules comparably well from video and from text and transfer them across environments, whereas weaker agents rely on text and lose most of their video-based success once the demonstrated situation is resampled. These findings reveal substantial gaps between the digital and the physical world and between identifying a rule and acting on it.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e上下文学习使智能体能够从上下文中获取新规则，并在推理时适应特定用户的要求。相同的前沿智能体现在既操作计算机又操作机器人，但它们的上下文学习仍未得到充分评估：现有基准大多是离线的，依赖文本或静态图像，并存在训练数据污染的风险，而机器人评估仅限于方法级别的消融实验。我们提出了 ICLWorld，这是一个在线基准，评估从数字世界到物理世界的智能体的上下文学习，涵盖计算机使用和机器人使用，以及 UIverse，一个将每个环境转化为用户界面的统一框架。我们构建了 30 个环境，录制了 630 个示范视频（10 小时以上），并设计了 160 个具有定制的、通常反直觉规则的任务，这些任务如果不从上下文中学习就无法满足。每个任务都有三个规则版本，以文本或视频形式给出，我们在三个级别测试泛化能力，从重放示范到新实例和未见环境。在六个前沿模型中，最强的智能体 Claude Opus 5.5 和 GPT-6 Astra 在计算机使用运行中分别有 82% 和 76% 的成功率，但在机器人使用运行中仅有 27% 和 26% 的成功率，而无规则对照将成功率降低至最多 8%。GPT-6 Astra 在三个规则版本下仅在 38% 的计算机使用任务中成功，这是其在单一规则下成功率的一半，并且正确回答了 98% 的机器人规则问题，但仅完成了这些任务的 20%。前沿智能体从视频和文本中学习规则的效果相当，并能跨环境迁移，而较弱的智能体依赖文本，一旦示范情况被重新采样，就会失去大部分基于视频的成功率。这些发现揭示了数字世界和物理世界之间，以及识别规则和执行规则之间存在巨大差距。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 ICLWorld 在线基准和 UIverse 统一框架，评估前沿智能体在数字世界和物理世界中的上下文学习能力及泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建了包含30个环境、630个示范视频和160个反直觉规则任务的在线基准，涵盖计算机和机器人使用。2. 设计了文本和视频两种规则版本，并在三个级别测试泛化能力。3. 揭示了最强模型在计算机使用和机器人使用上的巨大成功率差距。4. 发现模型能正确回答规则问题但实际执行成功率低，表明识别规则与执行规则间存在差距。5. 发现前沿模型从视频和文本学习效果相当且可跨环境迁移，而弱模型依赖文本且泛化差。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该基准全面评估了智能体在数字和物理环境中的上下文学习及泛化能力，揭示了当前最强模型在物理世界执行、规则理解与实际行动之间的显著差距，为智能体能力评估提供了重要依据。局限：摘要未提供关于该基准在更复杂多步物理任务、多智能体协作场景或不同硬件平台机器人上的具体局限性和评估细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e智能体与机器人\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. PhyCoVE: Benchmarking Physical Counterfactual Video Editing across Diverse Material Dynamics（PhyCoVE：跨多种材料动力学基准测试物理反事实视频编辑）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29184\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29184\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePhysical counterfactual video editing turns a source video and a language-specified physical edit at a given execution frame into a counterfactual video that shows how the scene would evolve after the edit. Existing evaluations with counterfactual target videos mainly cover object removal or specific rigid-body motions, although real scenes also involve elastic deformation, fluid flow, and interactions among rigid bodies, elastic solids, and fluids. We introduce PhyCoVE, a benchmark of 533 cases on 110 source videos that covers rigid, elastic, and fluid dynamics in five interaction patterns, with edits that remove an object, change a physical quantity, or insert a new object. For the simulated cases, a language model proposes scene designs, coding agents build them with solvers suited to each material and physically based rendering and then simulate each edit from the source scene state, and humans check every stage. For the real cases, we record continuously from one camera position before and after each edit. We also propose counterfactual fidelity, a metric that applies across materials and their interactions and measures how much of the physical change from the source video to the target video a generated video reproduces. We evaluate seven open-source and commercial video editing models and find that counterfactual fidelity ranks them nearly as human preference does, but even the best model reproduces only about one seventh of the physical change. The models change how a scene looks but rarely how it evolves, whereas a physical edit requires understanding the dynamics that it changes. Physical counterfactual video editing thus remains far from solved, and PhyCoVE provides a foundation for developing and evaluating methods for it.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e物理反事实视频编辑将源视频和在给定执行帧处由语言指定的物理编辑转化为反事实视频，展示编辑后场景将如何演变。现有的反事实目标视频评估主要涵盖物体移除或特定的刚体运动，尽管真实场景还涉及弹性变形、流体流动以及刚体、弹性固体和流体之间的相互作用。我们引入了 PhyCoVE，这是一个包含 110 个源视频的 533 个案例的基准，涵盖了五种交互模式中的刚体、弹性和流体动力学，编辑操作包括移除物体、改变物理量或插入新物体。对于模拟案例，语言模型提出场景设计，编码智能体使用适合每种材料的求解器和基于物理的渲染来构建它们，然后从源场景状态模拟每次编辑，人类检查每个阶段。对于真实案例，我们在每次编辑前后从一个相机位置连续录制。我们还提出了反事实保真度，这是一种适用于各种材料及其相互作用的指标，衡量生成的视频再现了从源视频到目标视频的多少物理变化。我们评估了七个开源和商业视频编辑模型，发现反事实保真度对它们的排名几乎与人类偏好一样，但即使是最好的模型也仅再现了大约七分之一的物理变化。这些模型改变了场景的外观，但很少改变其演变方式，而物理编辑需要理解它所改变的动态。因此，物理反事实视频编辑仍远未解决，PhyCoVE 为其开发和评估方法提供了基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出 PhyCoVE 基准和反事实保真度指标，用于评估视频编辑模型在涵盖多种材料物理交互场景下的物理反事实视频编辑能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建了包含533个案例、110个源视频的基准，涵盖5种交互模式下的刚体、弹性和流体动力学。2. 模拟案例由语言模型设计、编码智能体构建并物理模拟，人类逐阶段检查；真实案例采用单相机连续录制。3. 提出反事实保真度指标，衡量生成视频再现物理变化的程度，其排名与人类偏好高度一致。4. 评估发现即使最好的模型也仅能再现约七分之一的物理变化，模型多改变外观而少改变演变动态。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该研究填补了复杂物理动力学反事实视频编辑评估的空白，提出的反事实保真度指标有效且与人类偏好一致。评估结果揭示了当前模型在理解物理动态演变方面的严重不足。局限：摘要未提供关于该基准在更复杂的多物理场耦合场景、长视频时序一致性或计算资源消耗方面的具体局限性和分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视频编辑与生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. CoT-Proxy: Cross-Format Transfer for Distilling Long-Horizon Policies（CoT-Proxy：用于蒸馏长视界策略的跨格式迁移）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33148\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33148\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReasoning models become long-horizon agents through reinforcement learning or, more cheaply, through fine-tuning on a stronger teacher\u0026#x27;s trajectories, which contain the teacher\u0026#x27;s chain-of-thought as well as its actions. The standard fine-tuning approach imitates both, yet the strongest teachers are closed models whose chain-of-thought is hidden behind an API. We show that the chain-of-thought can be left out altogether and that the long-horizon policy can be distilled from the teacher\u0026#x27;s actions alone. The student is trained on these trajectories with its reasoning block left empty, while a KL loss on a replay buffer of its own generations limits drift from its initial model. Surprisingly, the policy learned from these trajectories with an empty reasoning block carries over to inference with thinking enabled, where the student reasons in its own style while acting like the teacher, an effect we call cross-format transfer. Distilling the actions of Qwen3.6-27B raises the task success of Qwen3-4B on AppWorld from 7% to 18% and that of Qwen3-32B from 12% to 25%. We further introduce CoT-proxies, short summaries of the teacher\u0026#x27;s reasoning placed after the empty reasoning block, which raise Qwen3-4B further, to 35%. Since neither actions nor CoT-proxies need the hidden chain-of-thought, the recipe applies unchanged to closed teachers. Distilling GPT-5.6 Luna from its visible outputs and the reasoning summaries its API returns raises Qwen3-4B from 7% to 48% on AppWorld and from 3% to 28% on SWE-bench Verified.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推理模型通过强化学习或更廉价地通过在更强教师的轨迹（包含教师的思维链及其动作）上进行微调，成为长视界智能体。标准的微调方法同时模仿两者，但最强的教师是闭源模型，其思维链隐藏在API之后。我们证明思维链可以完全省略，长视界策略可以仅从教师的动作中蒸馏出来。学生在这些轨迹上进行训练，其推理块留空，同时在其自身生成的重放缓冲区上的KL损失限制了其从初始模型的漂移。令人惊讶的是，从这些具有空推理块的轨迹中学习到的策略可以迁移到启用思考的推理中，此时学生以自己的风格进行推理，同时像教师一样行动，我们将这种效应称为跨格式迁移。蒸馏Qwen3.6-27B的动作将Qwen3-4B在AppWorld上的任务成功率从7%提高到18%，将Qwen3-32B从12%提高到25%。我们进一步引入CoT-proxies，即放置在空推理块之后的教师推理的简短摘要，这将Qwen3-4B的成功率进一步提高到35%。由于动作和CoT-proxies都不需要隐藏的思维链，该配方无需更改即可应用于闭源教师。从其可见输出及其API返回的推理摘要中蒸馏GPT-5.6 Luna，将Qwen3-4B在AppWorld上的成功率从7%提高到48%，在SWE-bench Verified上从3%提高到28%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从闭源教师模型中蒸馏长视界策略，使其在无需访问隐藏思维链的情况下学习教师的动作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 证明可以仅从教师动作中蒸馏长视界策略，完全省略思维链。2. 发现跨格式迁移效应：在推理块留空时训练的策略，在启用思考推理时能让学生以自身风格推理并像教师一样行动。3. 提出CoT-proxies（教师推理的简短摘要），进一步提升学生模型性能。4. 方法适用于闭源教师，通过蒸馏GPT-5.6 Luna的可见输出和API返回的推理摘要，显著提升了Qwen3-4B在AppWorld和SWE-bench Verified上的成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：该方法通过空推理块训练和KL损失限制漂移，实现了跨格式迁移，有效解决了闭源模型思维链不可见的问题。引入CoT-proxies进一步利用可用的推理摘要。关于该方法在不同类型任务上的泛化能力、推理块留空对学生模型内在推理能力长期影响的分析，以及CoT-proxies生成质量的评估等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型微调与蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Reinforcing Diffusion Models by Instantaneous Trajectory Distribution Matching（通过瞬时轨迹分布匹配强化扩散模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30986\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30986\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eForward diffusion reinforcement learning (RL)---enabling deterministic ODE sampling without trajectory backpropagation---has grown increasingly popular for efficiently aligning diffusion models. However, we reveal that existing methods essentially rely on signed reward-weighted regression (RWR), regressing the trainable policy velocity onto rollouts from a behavior distribution. Unbiased baseline subtraction implicitly assumes that the policy velocity equals the behavior marginal velocity---an idealized assumption violated under classifier-free guidance (CFG) rollouts, offline/off-policy updates, and imperfect online self-consistency. This behavior--policy mismatch breaks baseline invariance and injects baseline-induced gradient drift, destabilizing training. To resolve this issue, we propose Instantaneous Trajectory Distribution Matching (iTDM), taking the infinitesimal limit of Trajectory Distribution Matching toward a time-local reward-guided target via the posterior-score identity to yield a sample-level gradient anchored at the behavior velocity without learning an additional reward-tilted target score. Tracking this velocity with an online auxiliary denoiser guarantees exact baseline invariance at the auxiliary optimum, effectively suppressing baseline drift across both online and offline RL. Extensive experiments across compositional generation, text rendering, and preference alignment show that iTDM achieves state-of-the-art in-domain and out-of-domain performance across group-wise online/offline RL and pairwise offline RL. Notably, on the challenging GenEval2 benchmark, iTDM converges nearly 3\\times faster than competing methods while scaling smoothly to 0.87 without collapse. Furthermore, iTDM scales effectively to the 5.6B FLUX.3 model, achieving better performance across both in-domain and unseen metrics. Code is available at https://github.com/Luo-Yihong/iTDM\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前向扩散强化学习（RL）——无需轨迹反向传播即可实现确定性ODE采样——在高效对齐扩散模型方面越来越受欢迎。然而，我们揭示现有方法本质上依赖于带符号的奖励加权回归（RWR），将可训练策略速度回归到行为分布的展开上。无偏基线减法隐式地假设策略速度等于行为边际速度——这是一个理想化的假设，在无分类器引导（CFG）展开、离线/离策略更新以及不完美的在线自一致性下被违反。这种行为-策略不匹配破坏了基线不变性，并注入了基线诱导的梯度漂移，使训练不稳定。为了解决这个问题，我们提出了瞬时轨迹分布匹配（iTDM），通过后验得分恒等式将轨迹分布匹配的无穷小极限引向时间局部的奖励引导目标，从而产生锚定在行为速度上的样本级梯度，而无需学习额外的奖励倾斜目标得分。使用在线辅助去噪器跟踪该速度，保证了在辅助最优时的精确基线不变性，有效地抑制了在线和离线RL中的基线漂移。在组合生成、文本渲染和偏好对齐方面的大量实验表明，iTDM在成组在线/离线RL和成对离线RL中实现了最先进的域内和域外性能。值得注意的是，在具有挑战性的GenEval2基准上，iTDM的收敛速度比竞争方法快近3倍，同时平滑扩展到0.87而不崩溃。此外，iTDM有效地扩展到5.6B的FLUX.3模型，在域内和未见指标上均取得了更好的性能。代码可在 https://github.com/Luo-Yihong/iTDM 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决前向扩散强化学习中由于行为-策略不匹配导致的基线诱导梯度漂移问题，以稳定扩散模型的对齐训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示现有前向扩散RL方法本质上依赖带符号的奖励加权回归，并指出无偏基线减法在CFG展开、离线/离策略更新等情况下会因行为-策略不匹配而失效。2. 提出瞬时轨迹分布匹配（iTDM），通过无穷小极限和后验得分恒等式，生成锚定在行为速度上的样本级梯度。3. 使用在线辅助去噪器跟踪速度，保证精确的基线不变性，抑制在线和离线RL中的基线漂移。4. 在组合生成、文本渲染和偏好对齐实验中达到SOTA，在GenEval2上收敛速度快近3倍且平滑扩展至0.87，并有效扩展至5.6B的FLUX.3模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：iTDM通过理论推导和辅助去噪器有效解决了现有扩散RL方法中的梯度漂移和不稳定问题，在多个任务和基准上展现了优越的收敛速度和扩展性。关于iTDM在更大规模模型（超过5.6B）上的扩展性验证、辅助去噪器带来的额外计算开销分析，以及在更复杂或多样化生成任务中的具体失败案例等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 扩散模型与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. MAGPIE: Agentic Multi-Reference Image Generation via Executable Scene Construction（MAGPIE：通过可执行场景构建的智能体多参考图像生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32462\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32462\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMulti-reference image generation requires a model to preserve the appearance of selected subjects while arranging them according to an instruction. Despite recent progress in reference-based generation and compositional control, reliably organizing selected subjects into the intended scene remains challenging. Although existing methods provide various forms of compositional guidance, the planned relationships are not always explicitly instantiated for inspection and refinement before image synthesis. To address this limitation, we introduce MAGPIE, which represents the intended composition as a simplified 3D scene defined by an executable Blender program. A coding agent links each scene instance to its reference, checks the geometry and rendered view against the instruction, and revises the program to correct discrepancies. The final proxy rendering serves as a visual plan for the image generator. Using MAGPIE-Instruct-3K, we train the generator to follow this plan while drawing each subject\u0026#x27;s appearance from its reference. MAGPIE improves both Qwen and FLUX on DreamOmni2 and SconeEval. With FLUX, it improves overall success on DreamOmni2 by 28.21 percentage points over the original backbone and achieves the highest overall score among the models evaluated on SconeEval.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多参考图像生成要求模型在保留选定主体外观的同时，根据指令对它们进行排列。尽管基于参考的生成和组合控制最近取得了进展，但可靠地将选定主体组织到预期场景中仍然具有挑战性。尽管现有方法提供了各种形式的组合指导，但在图像合成之前，计划的关系并不总是被显式实例化以供检查和细化。为了解决这一限制，我们引入了MAGPIE，它将预期组合表示为由可执行Blender程序定义的简化3D场景。一个编码智能体将每个场景实例链接到其参考，根据指令检查几何形状和渲染视图，并修改程序以纠正差异。最终的代理渲染作为图像生成器的视觉计划。使用MAGPIE-Instruct-3K，我们训练生成器遵循该计划，同时从每个主体的参考中提取其外观。MAGPIE在DreamOmni2和SconeEval上提升了Qwen和FLUX的表现。使用FLUX时，它在DreamOmni2上的整体成功率比原始主干提高了28.21个百分点，并在SconeEval评估的模型中取得了最高的整体得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多参考图像生成中难以可靠地将选定主体按指令组织到预期场景中的问题，通过在合成前显式实例化和细化组合关系来提高生成质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出MAGPIE，将预期组合表示为由可执行Blender程序定义的简化3D场景。2. 引入编码智能体，负责链接场景实例与参考、检查几何和渲染视图是否符合指令，并修改程序纠正差异。3. 使用最终的代理渲染作为图像生成器的视觉计划，并通过MAGPIE-Instruct-3K数据集训练生成器遵循该计划。4. 在DreamOmni2和SconeEval基准上显著提升了Qwen和FLUX的表现，其中FLUX在DreamOmni2上的整体成功率提高28.21个百分点，在SconeEval上取得最高整体得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：MAGPIE通过引入可执行的3D场景构建和编码智能体，有效解决了多参考图像生成中空间组合关系难以精确控制的问题。利用代理渲染作为视觉计划，显著提升了生成成功率。关于Blender程序生成和修改的成功率与耗时分析、编码智能体在复杂指令下的失败案例、以及该方法对非刚性或复杂拓扑主体外观保留的具体局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像生成与多模态\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. LeadVLA: Learning Follower-Aware Route Execution for Robot Leading（LeadVLA：学习感知跟随者的机器人引导路线执行）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30149\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30149\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobot leading requires executing a route while continuously adapting to a designated follower. Existing robot-leading systems often mediate follower understanding and physical route execution through explicit states, planners, or modular interfaces; directly learning this coupling through end-to-end trajectory prediction can instead entangle route execution with follower response. We introduce LeadVLA, a structured multimodal policy that preserves the route as an explicit Path reference while learning a Pace for route progress and a Residual for local follower- and scene-conditioned adaptation. To make this problem trainable and measurable, we develop LeadInfra, a configurable Unreal Engine-based closed-loop data-generation infrastructure from which we instantiate an approximately 4M-sample training corpus, and LeadBench, a standardized benchmark with 108 fully held-out closed-loop episodes. LeadVLA achieves the highest task success (39.6%) among evaluated robot policies on LeadBench while maintaining strong route fidelity and follower responsiveness, and transfers to unseen real-world environments without real-world policy fine-tuning. Project Page: https://louiszengCN.github.io/LeadVLA_PAGE/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人引导需要在执行路线的同时持续适应指定的跟随者。现有的机器人引导系统通常通过显式状态、规划器或模块化接口来中介跟随者理解和物理路线执行；通过端到端轨迹预测直接学习这种耦合反而会将路线执行与跟随者响应纠缠在一起。我们引入了LeadVLA，一种结构化多模态策略，它将路线保留为显式的路径参考，同时学习用于路线进度的步调和用于局部跟随者和场景条件适应的残差。为了使该问题可训练和可测量，我们开发了LeadInfra，一个基于Unreal Engine的可配置闭环数据生成基础设施，从中实例化了约400万样本的训练语料库，以及LeadBench，一个包含108个完全保留的闭环episode的标准化基准。LeadVLA在LeadBench上评估的机器人策略中取得了最高的任务成功率（39.6%），同时保持了强大的路线保真度和跟随者响应能力，并在无需真实世界策略微调的情况下迁移到未见过的真实世界环境中。项目主页：https://louiszengCN.github.io/LeadVLA_PAGE/\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决机器人引导任务中路线执行与跟随者适应相耦合的问题，避免端到端轨迹预测带来的纠缠，实现感知跟随者的结构化路线执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出LeadVLA，一种结构化多模态策略，将路线作为显式路径参考，并分别学习控制路线进度的步调和适应局部跟随者及场景的残差。2. 开发LeadInfra，一个基于Unreal Engine的闭环数据生成基础设施，提供约400万样本的训练语料库。3. 提出LeadBench，包含108个完全保留的闭环episode的标准化基准。4. LeadVLA在LeadBench上取得39.6%的最高任务成功率，保持高路线保真度和跟随者响应能力，并能零样本迁移至未见过的真实世界环境。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：LeadVLA通过解耦路径参考、进度控制和局部适应，有效避免了端到端方法中路线执行与跟随者响应的纠缠。结合大规模仿真数据和标准化基准，验证了其在仿真中的高成功率及向真实世界的迁移能力。关于在真实世界环境中的具体成功率数据、仿真到现实迁移时的具体性能下降幅度、以及LeadBench基准的规模是否足以覆盖所有复杂跟随者行为的分析等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 具身智能与多模态策略\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. On-Policy Codec Distillation for Efficient All-in-One Video Generation（用于高效多合一视频生成的在策略编解码器蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31184\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31184\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eModern visual generative models operate on tokens, and every visual asset they receive, whether an identity, a scribble, a depth map, or a motion video, is tokenized and appended to the input token sequence. Consequently, conditioning quickly dominates the computation cost. Yet most of these tokens carry redundant spatiotemporal information. Our key insight is that identifying what is genuinely new is exactly the problem that classical video codecs have long solved. Thus, we first introduce a codec-based token pruning method that discards redundant tokens. Then, we propose an on-policy self-distillation (OPSD) strategy to train a DiT adapter capable of learning the codec pruning pattern well without quality degradation. Together, they form On-Policy Codec Distillation (CodecOPSD). We scale CodecOPSD to 16 condition modalities on our own video diffusion model, where it prunes 66% of the condition tokens on average with almost no quality drop. Therefore, denoising becomes 2x faster, and the cache memory shrinks by up to 73% in KV cache mode. CodecOPSD also extends to other state-of-the-art pretrained image and video generative models, where its benefit grows further with more conditions, longer frames, and higher resolution.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e现代视觉生成模型在token上运行，它们接收的每个视觉资产，无论是身份、涂鸦、深度图还是运动视频，都会被token化并追加到输入token序列中。因此，条件控制很快主导了计算成本。然而，这些token中的大多数携带了冗余的时空信息。我们的关键洞察是，识别什么是真正新的信息，正是经典视频编解码器长期以来解决的问题。因此，我们首先引入了一种基于编解码器的token剪枝方法，丢弃冗余token。然后，我们提出了一种在策略自蒸馏（OPSD）策略，用于训练一个DiT适配器，使其能够很好地学习编解码器剪枝模式而不会导致质量下降。两者共同构成了在策略编解码器蒸馏（CodecOPSD）。我们将CodecOPSD扩展到我们自己视频扩散模型上的16种条件模态，它平均剪枝了66%的条件token，且几乎没有质量下降。因此，去噪速度提高了2倍，在KV缓存模式下缓存内存最多缩小了73%。CodecOPSD还扩展到其他最先进的预训练图像和视频生成模型，其中随着更多条件、更长帧和更高分辨率，其收益进一步增长。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视觉生成模型中因条件token化导致的计算成本过高问题，通过去除冗余时空信息token来加速视频生成并降低内存消耗。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出基于编解码器的token剪枝方法，利用经典视频编解码器的原理丢弃冗余的条件token。2. 提出在策略自蒸馏（OPSD）策略，训练DiT适配器学习剪枝模式且无质量下降，两者结合形成CodecOPSD。3. 在16种条件模态的视频扩散模型上，平均剪枝66%的条件token，去噪速度提升2倍，KV缓存内存最多减少73%，且几乎无质量损失。4. 方法可扩展至其他SOTA预训练图像和视频生成模型，且在条件更多、帧更长、分辨率更高时收益更大。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e基于摘要的分析：CodecOPSD通过结合经典编解码器剪枝和在策略自蒸馏，有效去除了视觉生成模型中的冗余条件token，显著提升了推理速度并大幅降低了KV缓存内存占用，且保持了生成质量。关于DiT适配器训练的具体开销、剪枝操作对极端复杂或高动态场景中细节保留的潜在影响分析，以及在非自研模型上扩展时的具体性能指标对比等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与模型加速\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. RoomTokens: Masked Diffusion over Structured Tokens for Indoor Scene Synthesis（RoomTokens：用于室内场景合成的结构化Token掩码扩散模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30219\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30219\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerating 3D indoor scenes requires a representation that captures object semantics, instance identity, height structure, and orientation while respecting room geometry. Methods that model scenes as sequences of object vectors learn spatial constraints implicitly, leaving collisions and boundary violations to losses or post-processing; semantic-map methods make occupancy explicit, but collapse instance and directional structure. We introduce RoomTokens, a sliced structured-token representation in which each token stores semantic class, instance-color identity, and facing field. This representation allows a scene to be generated as a discrete grid while preserving cues for instance grouping, orientation estimation, and 3D extent prediction. To learn the RoomToken distribution, we propose MDIRT (Masked Diffusion over RoomTokens), a masked discrete diffusion model that denoises semantic/instance-color/facing channels jointly with a shared cross-slice backbone. Architectural tokens are clamped as explicit floor- plan constraints, so the model samples furniture layouts that respect room geometry while retaining instance and object-attribute structure. Experiments on 3D-FRONT show that RoomTokens with MDIRT improve layout fidelity and physical consistency over sequence/vector- and map-based methods, suggesting structured spatial tokens as a practical choice for discrete 3D scene synthesis.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e生成3D室内场景需要一种能够捕获物体语义、实例身份、高度结构和方向，同时尊重房间几何形状的表示方法。将场景建模为物体向量序列的方法隐式地学习空间约束，将碰撞和边界违规留给损失函数或后处理；语义图方法使占用显式化，但会折叠实例和方向结构。我们引入了RoomTokens，这是一种切片结构化token表示，其中每个token存储语义类别、实例-颜色身份和朝向场。这种表示允许将场景生成为离散网格，同时保留用于实例分组、方向估计和3D范围预测的线索。为了学习RoomToken分布，我们提出了MDIRT（RoomTokens上的掩码扩散），这是一种掩码离散扩散模型，它使用共享的跨切片骨干网络联合去噪语义/实例-颜色/朝向通道。建筑token被固定为显式的平面图约束，因此模型在保留实例和物体属性结构的同时，采样出尊重房间几何形状的家具布局。在3D-FRONT上的实验表明，带有MDIRT的RoomTokens在布局保真度和物理一致性方面优于基于序列/向量和基于地图的方法，表明结构化空间token是离散3D场景合成的实用选择。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e生成尊重房间几何形状并捕获物体语义、实例身份、高度结构和方向的3D室内场景。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出RoomTokens（切片结构化token表示）和MDIRT（掩码离散扩散模型），将场景生成为离散网格，同时保留实例分组、方向估计和3D范围预测的线索；将建筑token固定为显式平面图约束以尊重房间几何形状。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出序列/向量方法隐式学习空间约束导致碰撞，语义图方法折叠实例和方向结构。RoomTokens和MDIRT通过结构化token和掩码扩散解决了这些问题。实验在3D-FRONT数据集上进行，证明了布局保真度和物理一致性的提升。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D场景生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. SpecEngineeringBench: Evaluating Coding Agents as Autonomous Specification Engineers（SpecEngineeringBench：评估作为自主规范工程师的编码智能体）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32973\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32973\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutonomous specification engineering requires coding agents to translate functional requirements into executable tests and use the results to discover and validate defects. However, existing benchmarks evaluate coding agents on explicitly specified test generation tasks, commonly providing an issue description, a designated test entry point, or files to inspect, leaving the ability to determine what to test and where to investigate insufficiently evaluated. Relying on such clues bypasses the challenge of mapping requirements to implementations and proactively uncovering unknown defects. We propose SpecEngineeringBench, comprising 100 instances from 78 open-source Python repositories across 16 application categories, with multiple recorded defects in each instance. Two independent tasks evaluate complementary capabilities: generating test suites and discovering defects through execution analysis. The evaluation combines test validity, defect detection, and coverage with localization precision and recall. Across seven frontier coding agents, results reveal that test validity and coverage decouple from defect exposure: agents achieve a 91.47% Head Pass Rate and 80.48% Change-focused Coverage alongside a 26.36% Fail-to-Pass Rate, while localization recall drops from 78.11% at the file level to 51.29% at the function level. Autonomous test generation improves file, function, and hunk localization recall by 4.99, 2.77, and 2.69 percentage points over relying solely on existing repository test suites.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自主规范工程要求编码智能体将功能需求转化为可执行测试，并使用结果来发现和验证缺陷。然而，现有的基准在明确指定的测试生成任务上评估编码智能体，通常提供问题描述、指定的测试入口点或要检查的文件，导致确定测试内容和调查位置的能力评估不足。依赖这些线索规避了将需求映射到实现并主动发现未知缺陷的挑战。我们提出了SpecEngineeringBench，包含来自16个应用类别的78个开源Python存储库的100个实例，每个实例中记录了多个缺陷。两个独立的任务评估互补的能力：生成测试套件和通过执行分析发现缺陷。评估结合了测试有效性、缺陷检测和覆盖率以及定位精确度和召回率。在七个前沿编码智能体中，结果显示测试有效性和覆盖率与缺陷暴露解耦：智能体实现了91.47%的首次通过率和80.48%的变更聚焦覆盖率，同时失败到通过率为26.36%，而定位召回率从文件级别的78.11%下降到函数级别的51.29%。与仅依赖现有存储库测试套件相比，自主测试生成将文件、函数和代码块定位召回率分别提高了4.99、2.77和2.69个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估编码智能体作为自主规范工程师的能力，即翻译功能需求为可执行测试并发现和验证缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SpecEngineeringBench基准，包含100个实例和多个记录缺陷；评估生成测试套件和通过执行分析发现缺陷两个独立任务；发现测试有效性和覆盖率与缺陷暴露解耦，自主测试生成能提升定位召回率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前基准提供过多线索，规避了映射需求和主动发现缺陷的挑战。SpecEngineeringBench通过要求智能体自主决定测试内容和位置来解决此问题。实验在7个前沿编码智能体上进行，揭示了有效性/覆盖率与缺陷暴露的解耦现象，以及自主测试生成对定位召回率的提升。局限：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 代码智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Coding4Games: Can Modern Coding Agents Play Modern Video Games?（Coding4Games：现代编码智能体能玩现代电子游戏吗？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31974\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31974\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGames, especially modern AAA games, challenge language
