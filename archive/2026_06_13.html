### 1. EvoArena: Tracking Memory Evolution for Robust LLM Agents in Dynamic Environments (EvoArena：追踪动态环境中鲁棒 LLM 智能体的记忆演化)
- **社区热度**: `👍 97 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.13681)
- **研究任务**: 动态环境下的 LLM 智能体记忆管理
- **核心亮点**: 提出了一套追踪智能体记忆随环境变化而演化的评估框架。
- **深度解析**: 针对现有智能体在环境变动时记忆更新不及时的问题，构建了动态测试环境。方法上记录了智能体在不同时间步的记忆写入、读取和遗忘过程，通过量化记忆一致性来评估鲁棒性。实验表明，具备记忆演化追踪能力的智能体在长周期任务中成功率更高。
- **领域归类**: [Agent, Memory, Benchmark]

### 2. SpatialClaw: Rethinking Action Interface for Agentic Spatial Reasoning (SpatialClaw：重构智能体空间推理的动作接口)
- **社区热度**: `👍 77 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.13673)

- **核心亮点**: 设计了一种新的动作接口，提升了智能体对三维空间关系的理解与操作能力。
- **深度解析**: 传统文本或二维坐标接口难以表达复杂空间关系。该工作将空间动作抽象为特定的原语集合，结合了相对位置编码和空间约束检查。模型输出不再仅仅是文本，而是包含空间参数的结构化动作。在导航和物体操纵任务上，比基线模型减少了约 30% 的空间冲突错误。
- **领域归类**: [Agent, Spatial Reasoning, Interface]

- **社区热度**: `👍 72 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.13392)

- **核心亮点**: 提出了一种适用于长上下文的高效稀疏注意力算法。
- **深度解析**: 针对长序列推理中 KV 缓存过大导致显存不足的问题，设计了混合稀疏模式。结合了滑动窗口注意力与全局关键 token 选择，保留了大部分上下文信息的同时显著降低了计算量。在同等显存占用下，支持的上下文长度比标准 Dense Attention 提升了 4 倍， perplexity 损失控制在 1% 以内。
- **领域归类**: [LLM, Efficiency, Attention]
