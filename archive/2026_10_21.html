    <h1>前沿科研情报 - 2026-10-21</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Scaling Parameter-Efficient Fine-Tuning for Brain Encoding (扩展参数高效微调用于脑编码)\n- **社区热度**: `👍 219 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26802)\n- **研究任务**: 脑编码（预测神经对刺激的反应）。\n- **核心亮点**: 提出 BrainLoRA，利用参数高效微调（PEFT）有效适配高达 104B 参数的多模态预训练骨干进行脑编码，在 Algonauts 2025 挑战赛中取得最佳公开性能，并通过 200+ 模型集成在排行榜位列第一。\n- **深度解析**: 利用骨干的因果结构单次前向传播预测多时间点以降低特征提取成本；采用低秩适配器（LoRA）和轻量级读取头；模态归因恢复了典型的感觉拓扑，神经适应增加了音频输入和跨模态混合的贡献；开发了 multi-LoRA 内核加速多 LoRA 联合训练。摘要未提供更深层的底层数学推导细节。\n- **领域归类**: [脑机接口, 参数高效微调, 多模态学习]\n---\n\n### 2. MemT-1.0: Towards Memory-Native Evolution (MemT-1.0：迈向记忆原生演化)\n- **社区热度**: `👍 107 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26825)\n- **研究任务**: 基础模型的记忆原生演化，使模型能够持续积累和利用信息。\n- **核心亮点**: 提出 MemT-1.0 架构，将记忆内化为模型计算的一部分，发布 Nano 和 Flash 模型家族，在 128K 上下文长度下实现显著的推理加速和存储缩减，并提升了智能体任务的成功率。\n- **深度解析**: 采用 Gated DeltaNet-2 实现稳定的 token 级记忆更新机制，引入 Mixture-of-Storage 扩展原生记忆容量；基于 34B tokens 数据进行继续预训练和后训练的两阶段 pipeline；在 128K tokens 历史长度下，Nano 模型实现约 1.86 倍端到端推理加速，持久存储相比全上下文 KV cache 减少 66 倍。摘要未提供具体的 Mixture-of-Storage 内部路由机制细节。\n- **领域归类**: [大语言模型, 记忆机制, 架构设计]\n---\n\n### 3. Learning from Fleet Experience: A Collective Learning Paradigm for Robots (从车队经验中学习：一种机器人的集体学习范式)\n- **社区热度**: `👍 107 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25736)\n- **研究任务**: 机器人策略学习，通过共享部署过程中的执行经验来提升策略可靠性。\n- **核心亮点**: 提出集体经验学习（CEL）范式及失败引导的经验检索微调（FERT）方法，无需收集额外的专家纠正数据，在真实操作任务中实现了极高的成功率。\n- **深度解析**: FERT 利用机器人执行中的失败上下文，从车队共享的成功经验中检索相关轨迹片段，并将其动作作为策略更新的监督信号；开发容错异步训练系统（FATS）协调经验收集与策略分发；在 5 个真实任务中成功率达 93.3-99.2%，96 台机器人协作将手机包装成功率从 79.2% 提升至 98.3%。摘要未提供 FATS 系统的具体异步通信协议细节。\n- **领域归类**: [机器人学习, 强化学习, 多智能体系统]\n---\n\n### 4. Holi-World: Building Holistic World Intelligence from Human-Ego Experience (Holi-World：从人类自我中心经验构建整体世界智能)\n- **社区热度**: `👍 103 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26549)\n- **研究任务**: 从人类自我中心（第一人称）经验中学习世界结构、物体语义和交互历史，构建整体世界智能。\n- **核心亮点**: 提出 HOLI-WORLD 集成生态系统，涵盖经验捕获、自动数据构建、模型学习和独立评估，发布了相关数据集、基准及 HOLIWORLD-VL-4B 模型。\n- **深度解析**: HOLIWORLD-Foundry 结合静态和动态感知自动构建连接场景结构与物体状态的世界记录；HOLIWORLD-Data 包含约 100 个自收集场景和约 80K QA 对；HOLIWORLD-Bench 提供独立人工标注用于评估；在 ScanNet 等基准上表现良好，训练后显著提升模型的空间和时间推理能力。摘要未提供 Foundry 中静态与动态感知融合的具体算法细节。\n- **领域归类**: [计算机视觉, 具身智能, 数据集与基准]\n---\n\n### 5. EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience (EgoXperience：从人类经验中学习基于世界的自我中心表征)\n- **社区热度**: `👍 96 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26625)\n- **研究任务**: 从自我中心视频中联合重建观察者运动、场景几何以及手物交互，实现一致的世界坐标系下的三维重建。\n- **核心亮点**: 提出 EgoXperience 全栈范式及 EgoX 模型，仅需单次前向传播即可实现相机、场景、手和物体的联合度量重建，大幅降低重建误差。\n- **深度解析**: 开发 EgoX-Engine 自动标注引擎，结合几何验证的物体跟踪与基于 SLAM 的世界对齐；构建 50 小时的 EgoX-Data-6M 数据集（含秒级任务描述）及 1 小时的 EgoX-Bench 评估基准；相比最强基线，相机、手和深度误差分别降低 68.9%、65.6% 和 42.9%，物体姿态分数提高 28.0%。摘要未提供 EgoX 模型内部网络架构的具体参数细节。\n- **领域归类**: [计算机视觉, 三维重建, 自我中心视觉]\n---\n\n### 6. OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners (OR-License：评估大语言模型智能体作为真实世界运筹学实践者)\n- **社区热度**: `👍 94 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24087)\n- **研究任务**: 评估大语言模型（LLM）智能体直接处理原始客户商业材料并生成专业运筹学（OR）解决方案的能力。\n- **核心亮点**: 提出 OR-License 端到端基准，包含来自真实付费项目的工业场景实例，并引入 ORSim 客户模拟器和部署调整质量（DAQ）评估指标，揭示了当前 LLM 在真实 OR 任务中的能力边界。\n- **深度解析**: 基准包含 31 个实例和 10 个工业场景，源自总额 368 万美元的付费项目，保留原始需求和数据边界；引入 ORSim 模拟器披露商业事实；评估 11 个前沿 LLM，最强配置（Claude Code）严格可行性达 88.39%，DAQ 为 0.87（专家参考为 1）；任务均衡的研究链完成率仅为 24% 至 45%。摘要未提供 ORSim 模拟器的具体状态机或对话生成细节。\n- **领域归类**: [大语言模型, 智能体评估, 运筹学]\n---\n\n### 7. ScaleNav: Scalable Internet Video Pretraining for Language-Conditioned Local Navigation (ScaleNav：用于语言条件局部导航的可扩展互联网视频预训练)\n- **社区热度**: `👍 84 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25690)\n- **研究任务**: 语言条件局部导航，即机器人根据文本指令导航至初始观察中可见的目标位置并停止。\n- **核心亮点**: 提出 ScaleNav 统一世界-动作框架，利用大规模互联网自我中心视频进行预训练以学习视觉动态，有效缩小 sim-to-real 差距并在真实四足机器人上实现泛化。\n- **深度解析**: 采用三阶段训练：首先进行指令条件视频预训练学习视觉动态；其次通过动作对齐利用模拟数据训练动作块预测；最后进行联合微调；在 Short-Horizon OVON 和 HabitatGS-LN 基准上成功率分别达 86.5% 和 94.9%。摘要未提供视频预训练阶段的具体损失函数或视觉动态建模细节。\n- **领域归类**: [机器人导航, 具身智能, 视频预训练]\n---\n\n### 8. SpecMRL: Redesign Matryoshka Representation Learning within Parametric Spectrum (SpecMRL：在参数谱内重新设计俄罗斯套娃表征学习)\n- **社区热度**: `👍 79 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26824)\n- **研究任务**: 改进俄罗斯套娃表征学习（MRL），使其在压缩表征维度时能更有效地保留信息，支持灵活的表征大小。\n- **核心亮点**: 提出 SpecMRL，通过参数导出的谱基重组特征空间，在更激进的压缩下显著优于标准 MRL，仅用一半维度即可超越全维度 MRL 的性能。\n- **深度解析**: 引入按特征重要性组织的参数导出谱基，前缀读取在学到的谱空间中进行，以更好地优先处理信息丰富的方向；在 MTEB 基准上，所有评估的降低维度均优于 MRL，且仅使用一半的嵌入维度即可超越全维度 MRL 的性能表现。摘要未提供参数导出谱基的具体数学构造和特征重要性计算细节。\n- **领域归类**: [自然语言处理, 表征学习, 模型压缩]\n---\n\n### 9. OpenVLHarness: Real World Visual Agentic Tool-Use with Multimodal Memory (OpenVLHarness：具有多模态记忆的真实世界视觉智能体工具使用)\n- **社区热度**: `👍 79 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26860)\n- **研究任务**: 增强多模态大语言模型（MLLM）在需要外部证据、感知和数值测量的复杂视觉推理任务中的表现。\n- **核心亮点**: 提出 OpenVLHarness 框架，结合能力层与持久多模态记忆，支持迭代获取、检查和组合多模态证据，在多个基准上显著提升性能并大幅降低 Token 成本。\n- **深度解析**: 能力层提供任务级工具接口并将异构后端输出转换为模型可读观察；持久多模态记忆将图像、结构化数据等作为可寻址工件保留；编码接口允许执行生成的程序以组合多工具结果；在 22 个基准上平均提升 9.7-12.6 分，GPT-6 Luna 在中等推理努力下超越最大努力基线，且 Token 成本最多仅为 37%。摘要未提供持久多模态记忆的具体存储结构和检索算法细节。\n- **领域归类**: [多模态大模型, 智能体, 工具使用]\n---\n\n### 10. Self-Evolving Coding Agents via Harness-Policy Optimization (通过 Harness-策略优化实现自我进化的编码智能体)\n- **社区热度**: `👍 39 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22791)\n- **研究任务**: 提升大语言模型（LLM）编码智能体的性能，解决策略模型与环境交互中介（harness）协同进化的问题。\n- **核心亮点**: 提出 Self-HPO 递归自我改进框架，交替优化 harness 和策略模型，使智能体能够分析自身失败并动态调整交互环境，显著提升编码任务解决率。\n- **深度解析**: 在 H-step 中策略分析失败并提出新 harness 候选，在 P-step 中通过强化学习更新策略，训练中发现的困难任务构成下一轮 harness 搜索集；在 Qwen3.5-35B-A3B 上平均解决率从 57.8% 提升至 64.8%，联合优化的增益大于各自单独优化的增益之和。摘要未提供强化学习阶段的具体奖励函数设计或 harness 候选生成的提示词工程细节。\n- **领域归类**: [大语言模型, 代码生成, 强化学习]\n---\n\n### 11. CoworkEnv: Synthesizing Training Environments for Long-Horizon Cowork Agents (CoworkEnv：为长周期协作智能体合成训练环境)\n- **社区热度**: `👍 37 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24960)\n- **研究任务**: 为AI协作智能体合成可执行的训练环境，使其能够协调工具、跨轮次通信，并根据工作流约束对变化的工作空间状态采取行动。\n- **核心亮点**: 提出 CoworkEnv 框架，利用工作流需求指导任务构建，通过程序化验证和反馈修复来检查生成的规范和评分行为。教师执行产生用于监督微调（SFT）的演示，学生交互提供用于强化学习（RL）的 rollouts 和奖励。\n- **深度解析**: \n  - **技术细节**: 工作流需求指导任务构建，程序化验证与反馈修复检查规范。教师执行产生 SFT 演示，学生交互提供 RL 的 rollouts 和奖励。\n  - **实验结果与数字**: 在 Qwen3-VL-8B-Instruct 上，SFT 将 Claw-Eval 平均分从 46.6 提升至 64.1，多轮任务提升 31.9 分；SFT-only 扩展至 ClawMark 证明了跨基准的适用性；RL 训练动态比较初步证明构建的环境支持策略优化。\n  - **数据集**: Claw-Eval, ClawMark。\n- **领域归类**: [AI Agent, 强化学习, 监督微调, 环境合成]\n---\n\n### 12. MT Forcing: Towards Stable and Consistent Multi-Turn Image Editing with Autoregressive Diffusion (MT Forcing：利用自回归扩散实现稳定且一致的多轮图像编辑)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25404)\n- **研究任务**: 解决多轮图像编辑中存在的视觉质量不稳定（伪影累积、细节退化）和图像内容不一致（保留区域和先前编辑发生意外变化）的问题。\n- **核心亮点**: 提出 MT Forcing 训练范式，基于自回归扩散的统一多模态模型。包括单轮分布匹配蒸馏（Single-Turn DMD）和教师强制引导（Teacher-Forcing Guidance），以提供视觉质量指导并鼓励跨轮次内容一致性。\n- **深度解析**: \n  - **技术细节**: 提出 Single-Turn DMD，使用在单轮中应用累积编辑的教师来监督学生自 rollout；引入 Teacher-Forcing Guidance，在预热期间监督参考轨迹上的历史依赖转换，并在蒸馏期间作为正则化器。\n  - **实验结果与数字**: 摘要未提供（仅提及显著提升多轮图像编辑能力，无具体数值）。\n  - **数据集**: 摘要未提供。\n- **领域归类**: [计算机视觉, 图像编辑, 扩散模型, 多模态]\n---\n\n### 13. Interlock: From Local Correctness to Task Completion in Long-Horizon Agents (Interlock：在长周期智能体中从局部正确走向任务完成)\n- **社区热度**: `👍 32 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19686)\n- **研究任务**: 解决大语言模型智能体在执行长周期任务时，虽能满足单个要求但无法维持关系，导致局部正确但结果不完整（未能完成任务）的问题。\n- **核心亮点**: 提出 Interlock 框架，将每个任务表示为类型化的完成图（含接地边、耦合超边、实现边），编译为可重置工作区、公共请求和评估标准，并通过智能体裁判检查执行工件并运行验证脚本。\n- **深度解析**: \n  - **技术细节**: 包含源覆盖审查和公共输入审查；智能体作为裁判检查执行工件并运行验证脚本，保留满足所有强制性要求的轨迹。\n  - **实验结果与数字**: 在两个 Qwen3.6 骨干网络上微调，AutomationBench 任务通过率提高 4.00-4.50 个百分点，JobBench 加权分数提高 3.20-6.64 分，Harvey LAB 标准通过率提高 3.89-4.16 个百分点。\n  - **数据集**: AutomationBench, JobBench, Harvey LAB。\n- **领域归类**: [AI Agent, 任务合成, 长周期任务, 大语言模型]\n---\n\n### 14. AnyGoal: On World Model Generalization Beyond Expert Rollouts (AnyGoal：超越专家轨迹的世界模型泛化研究)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26844)\n- **研究任务**: 研究世界模型在数据覆盖率、动态泛化和下游规划性能之间的关系，特别是世界模型能否将熟悉的状态和动作因素重新组合成有效的动态（组合泛化）。\n- **核心亮点**: 引入 AnyGoal 基准及开源库，构建目标偏移任务变体。任务设计使得单个状态因素和动作在训练支持范围内，但它们的组合在专家轨迹中代表性不足。\n- **深度解析**: \n  - **技术细节**: 通过组合泛化视角研究世界模型，检查不同模型家族、交互机制和评估指标下的动态和表示失败，研究当前世界模型在目标偏移预测和规划中的泛化能力及挑战。\n  - **实验结果与数字**: 摘要未提供（仅提及当前模型在重组下持续表现出失败，无具体数值）。\n  - **数据集**: AnyGoal 基准（基于广泛使用的世界模型环境构建，具体基础环境名称摘要未提供）。\n- **领域归类**: [世界模型, 强化学习, 组合泛化, 基准测试]\n---\n\n### 15. Kronecker Delta Rule for Long Context Linear Attention (用于长上下文线性注意力的克罗内克 delta 法则)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26834)\n- **研究任务**: 提出一种新的线性注意力架构 KronLSTM，基于克罗内克 delta 法则，用于关联矩阵记忆的新型更新规则，特别适用于长上下文语言建模。\n- **核心亮点**: KronLSTM 扩展了 xLSTM 家族，引入记忆修正机制，在矩阵空间中仅沿单一方向修改记忆，从而最小化对先前存储信息的干扰。其记忆动态可数学描述为收敛到稳态分布的马尔可夫链。\n- **深度解析**: \n  - **技术细节**: 记忆矩阵的期望范数在整个输入序列中保持一致有界，确保稳定的记忆动态，无需额外的记忆状态归一化和稳定机制。代码和模型已开源。\n  - **实验结果与数字**: 摘要未提供（仅提及与现有线性注意力架构具有竞争力且通常更优，无具体数值）。\n  - **数据集**: 摘要未提供（仅提及长上下文基准测试，无具体名称）。\n- **领域归类**: [自然语言处理, 线性注意力, 架构设计, 长上下文]\n---\n\n### 16. RoAR-VAE: Improving Latent Diffusability through Robust Prediction (RoAR-VAE：通过鲁棒预测提升潜在扩散性)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26216)\n- **研究任务**: 设计一种有效的视觉分词器，在保持图像保真度的同时，生成下游扩散模型能够高效学习的潜在表示，提升潜在扩散性。\n- **核心亮点**: 提出 RoAR-VAE，基于鲁棒预测原则。包含两个互补目标：RobustAlign（从损坏的潜在变量预测预训练的语义特征）和 RobustRecon（重建干净图像），使有用信息在扩散模型倾向于较早学习的高方差潜在方向上更容易访问。\n- **深度解析**: \n  - **技术细节**: 重新审视 REPA-E 发现，移除其扩散目标和专用生成块，保留从损坏潜在变量进行的语义预测，在匹配设置下可产生相当的下游生成性能。\n  - **实验结果与数字**: 在相同训练预算下，平均生成基准性能比最强基线分词器提高 2.19 分，小文本重建准确率比 FLUX.1-VAE 提高 16.93 个百分点。\n  - **数据集**: 摘要未提供具体数据集名称（仅提及生成基准和小文本重建任务）。\n- **领域归类**: [计算机视觉, 扩散模型, 视觉分词器, VAE]\n---\n\n### 17. MemPilot: Orchestrating On-Demand Multimodal Memory Curation for LLM Agents (MemPilot：为 LLM 智能体编排按需多模态记忆管理)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06830)\n- **研究任务**: 解决现有智能体记忆系统以与查询无关的方式构建记忆导致不必要预处理成本和丢弃关键细节的问题，实现对性能、成本和延迟的灵活控制。\n- **核心亮点**: 提出 MemPilot 框架，通过强化学习优化多步 LLM 策略，迭代选择从与查询无关的记忆中检索，或将原始多模态历史的特定查询管理委托给异构 LLM 和 VLM。该策略联合控制证据量、管理指令、模型选择和视觉访问。\n- **深度解析**: \n  - **技术细节**: 采用目标优势解耦（objective-wise advantage decoupling）分别估计每个目标的优势再聚合；引入基于前缀的边际效用估计（prefix-based marginal utility estimation）用于多步 rollouts 的细粒度信用分配。\n  - **实验结果与数字**: 摘要未提供（仅提及展现出良好的性能-成本-延迟权衡，无具体数值）。\n  - **数据集**: 摘要未提供（仅提及 5 个多模态智能体记忆基准，无具体名称）。\n- **领域归类**: [AI Agent, 记忆管理, 强化学习, 多模态]\n---\n\n### 18. AdaExploreBench: Benchmarking LLM Agents for Proactive Exploration and Test-time Adaptation in Evolving Environments (AdaExploreBench：评估 LLM 智能体在演化环境中的主动探索与测试时适应能力)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25950)\n- **研究任务**: 评估大语言模型智能体在陌生和演化环境中主动探索、理解环境动态并适应的能力，特别是主动发现环境工作原理并在环境演化时进行适应。\n- **核心亮点**: 引入 AdaExploreBench 基准，将环境动态实例化为隐藏规则，要求智能体主动获取证据并推断规则。引入隐式规则漂移，潜在规则在没有公告的情况下发生变化，要求智能体从性能下降中检测到先验知识过时并重新探索。\n- **深度解析**: \n  - **技术细节**: 揭示了当前 LLM 智能体的一个关键瓶颈：一旦有信息丰富的证据，它们通常能进行有效推理，但难以主动获取正确的证据并识别先前获取的证据何时不再有效。\n  - **实验结果与数字**: 在 8 个领先的 LLM 上实验，GPT-6 Sol 仅达到 61.9% 的校准准确率；提供充足证据或移除规则漂移可使平均性能显著提高近 10%。\n  - **数据集**: AdaExploreBench（提及 8 个领先 LLM，具体基础环境名称摘要未提供）。\n- **领域归类**: [AI Agent, 基准测试, 主动探索, 测试时适应]\n---\n\n### 19. InfiniDream: Open-Ended Photorealistic 3D Worlds Through Procedural Generation (InfiniDream：通过程序化生成实现开放式照片级真实 3D 世界)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26853)\n- **研究任务**: 解决现有基于 VLM 的代码生成方法产生的 3D 资产相对简单，而复杂的照片级真实程序化系统需要大量手动开发，且受限于预定义工厂和 API 的问题。\n- **核心亮点**: 引入 InfiniDream 框架，提出符号约束资产生成（Symbolically Constrained Asset Generation），利用现有程序化算法创建新颖的照片级真实资产；开发端到端的文本到世界管道，结合语义场景规划与确定性视锥引导网格放置。\n- **深度解析**: \n  - **技术细节**: 构建具有精确对象放置、程序化填充和动画的大规模 3D 世界。多样性分析、消融研究和人类偏好评估进一步验证了框架的有效性。\n  - **实验结果与数字**: 摘要未提供（仅提及在 4 个感知指标上有所提升，无具体数值）。\n  - **数据集**: 100 个对象和 20 个场景生成任务（未提及具体数据集名称）。\n- **领域归类**: [计算机视觉, 3D生成, 程序化生成, 视觉语言模型]\n---\n\n### 20. HarnessPro: Recursive Harness Self-Improvement with Pareto Optimization for Performance-Cost Trade-offs (HarnessPro：基于帕累托优化的递归 Harness 自改进以实现性能-成本权衡)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26770)\n- **研究任务**: 解决 AI 智能体的 Harness（执行环境/框架）开发中，通过递归自改进（RSI）提升性能往往伴随执行成本增加的问题，实现无标签的 Harness 演化以在提升任务性能的同时降低执行成本。\n- **核心亮点**: 提出 HarnessPro，一种无标签方法。候选 Harness 使用 LLM 生成的测试进行评估。专门智能体诊断执行轨迹并规划更新，使用归一化加权平方距离选择，提供关注成本（lite）、平衡（medium）和关注性能（heavy）的 Harness。\n- **深度解析**: \n  - **技术细节**: 选定的 Harness 进入下一次迭代，执行反馈指导进一步更新。代码已开源。\n  - **实验结果与数字**: 在 Terminal-Bench 2、SWE-Bench Pro 和 ProgramBench 上，使用 GPT-5.5 与 Codex 时，heavy 模式相比 RHO 平均通过率提高 2.0 个百分点，平均单任务成本降低 26.1%。使用 GLM-5.2 与 Claude Code 时也保持此优势。\n  - **数据集**: Terminal-Bench 2, SWE-Bench Pro, ProgramBench。\n- **领域归类**: [AI Agent, 自改进, 帕累托优化, 性能-成本权衡]\n---\n\n### 21. Manga2Animate: An Agentic Framework for Faithful Manga Animation with Script and Storyboard Planning (Manga2Animate：一个用于忠实漫画动画的代理框架，包含剧本和故事板规划)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26851)\n- **研究任务**: 将现有漫画改编成连贯且忠于原作的动画。\n- **核心亮点**: 提出 Manga2Animate 多智能体框架，将任务分解为动画剧本和视觉故事板两种中间表示。每种表示由创建者智能体生成，并由配对的审查者智能体对照源漫画面板进行审查。采用特定表示的选择和双层反馈机制逐步优化，最后合成最终动画。\n- **深度解析**: 现有方法要么主要通过文本访问漫画（丢失角色和艺术风格），要么直接将漫画页输入视频生成模型（误解结构并产生错误情节）。Manga2Animate 通过多智能体协作和中间表示，确保生成的每个阶段都扎根于源漫画。广泛实验和用户研究证明其比现有最先进方法更忠实、镜头间更一致，但具体的实验结果数字、数据集名称及规模摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 多智能体系统]\n---\n\n### 22. BlenderWorld: Benchmarking Visual Agents for 3D Creation from Real-World References (BlenderWorld：基于真实世界参考的3D创建视觉智能体基准测试)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23986)\n- **研究任务**: 评估多模态大语言模型（MLLMs）作为自主智能体在真实世界场景下，从多样化参考中创建和编辑3D模型的能力。\n- **核心亮点**: 引入 BlenderWorld，首个专门评估前沿模型在逼真3D创建任务上的综合基准。包含223个任务（涵盖建筑、产品、自然环境、科学可视化），由文本、图像、视频和结构化规范输入驱动。建立统一评估协议：从多个视角渲染提交的 Blender 项目，并根据2651个任务特定的二元评分标准及整体视觉质量分数进行评估。\n- **深度解析**: 基准测试了13个前沿模型，GPT-6-Astra 得分最高（79.9），其次是 Opus-5（73.0）和 GPT-5.6-Sol（67.7）。研究发现关键瓶颈：当前模型能解析广泛指令，但在 Blender 中处理细粒度3D空间连贯性和准确结构复制方面仍面临巨大困难。关于具体的数据集构建细节和其他未提及的实验结果数字摘要未提供。\n- **领域归类**: [多模态大模型, 3D生成, 智能体评估]\n---\n\n### 23. RoboValue: A Fine-Grained Sim-and-Real Benchmark for Unified Evaluation of Robotic Value Models (RoboValue：用于统一评估机器人价值模型的细粒度仿真与真实世界基准)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26663)\n- **研究任务**: 统一评估机器人价值模型（从视觉观察和指令中评估任务执行，为策略学习和执行监控提供反馈）的可靠性。\n- **核心亮点**: 引入 RoboValue，一个细粒度的仿真与真实世界基准。通过共享接口评估四个互补能力维度：任务状态理解、时间进度监控、故障与恢复推理、价值一致性。提供 RoboValue-Dataset，涵盖15个仿真和20个真实世界操作任务，提供专家演示和带注释的轨迹。\n- **深度解析**: 在零样本和单样本设置下评估了代表性模型，揭示了在细粒度指令基础、依赖历史的进度跟踪和恢复评估方面存在错误。相同的语义子任务在不同有效执行顺序下可能获得截然不同的价值增益。具体的实验结果数字和更多数据集细节摘要未提供。\n- **领域归类**: [机器人学, 强化学习, 基准测试]\n---\n\n### 24. Think Visually Across Space and Time: Grounded Reasoning for Video Segmentation (跨越空间与时间的视觉思考：视频分割的接地推理)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25090)\n- **研究任务**: 视频推理分割（VRS），要求模型识别隐式描述的目标并预测其像素级掩码轨迹，同时解决决定答案的空间关系和时间事件。\n- **核心亮点**: 引入时间视频原语链（TCoVP），一种时空接地的视频思维链形式，将与查询相关的观察组织成按时间顺序排列的推理链。每个原语将实体引用与时间支持和带时间戳的空间证据关联起来。构建了 TCoVP-SFT-15k 和 TCoVP-RL-13k 数据集，通过监督微调和链对齐强化学习来学习这种表示。\n- **深度解析**: 纯文本思维链无法使底层视觉参考显式化，存在视频参考鸿沟。TCoVP 通过将空间和时间证据组织在推理过程中，解决了这一问题。在5个 VRS 基准和3个模型骨干上进行了广泛实验，证明了 TCoVP 的强大性能，但具体的实验结果数字摘要未提供。\n- **领域归类**: [计算机视觉, 视频分割, 思维链推理]\n---\n\n### 25. Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy (物理递归自我改进能力从何而来？LLM作为策略的观察缩放定律)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26848)\n- **研究任务**: 系统研究物理递归自我改进（Physical RSI）的机制、缩放行为和泛化能力。\n- **核心亮点**: 引入 PhysRSI-eval，通过五轴指标（首次尝试性能、效率、成功率、预算、从失败中改进）量化物理 RSI。在固定交互预算下，在18个操作任务上评估不同的 VLM。提出“物理桶假说”：不同的能力可能限制改进的不同部分。\n- **深度解析**: 五轴指标能区分公共基准平均分相近的系统，且高分不一定伴随早期或高效的收益。研究了从两个视角的观察缩放：从公共能力预测 VLM 智能体的相对性能，以及从早期物理反馈预测后期进展。进行了工作空间干预，发现特定场景的适应和可重用经验可以共存。具体的实验结果数字和数据集细节摘要未提供。\n- **领域归类**: [具身智能, 视觉语言模型, 缩放定律]\n---\n\n### 26. Evidence-First Agentic Verification (证据优先的智能体验证)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17724)\n- **研究任务**: 解决长周期、半可验证智能体任务中，评估证据分散在环境状态和执行轨迹中导致评判者忽略证据或接受无根据声明（包括智能体自身的成功报告）的问题。\n- **核心亮点**: 引入 Sauron，一种证据优先的智能体验证器，同时调查状态和轨迹，并在独立验证声明的来源后才依赖该声明。通过有界查询和相关标准的联合调查减少上下文使用和冗余工作，每个裁决都带有支持证据的可审计收据。\n- **深度解析**: 当基于规则的裁决作为强化学习奖励时，错误会强化不良行为。在100个个人助手片段的2586个人工标记标准上，Sauron 在所有8个测试骨干上实现了最高的 F1，且成本低于最强基线 Gandalf。使用 GPT-5.6 Sol 时，F1 达到0.96（Gandalf为0.92），成本降低23%。在包含13个系列的故障注入套件上，检测到97%的注入故障，仅标记2%的干净对照。具体的数据集细节摘要未提供。\n- **领域归类**: [智能体评估, 强化学习, 验证与安全性]\n---\n\n### 27. AffordanceWAM: Affordance-Aware Joint World-Action Modeling for Robot Manipulation (AffordanceWAM：用于机器人操作的可供性感知联合世界-动作建模)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.22332)\n- **研究任务**: 实现可泛化的机器人操作，解决动作标记机器人视频成本高且多样性有限，而自我中心人类视频缺乏机器人动作且存在具身差异的问题。\n- **核心亮点**: 引入 AffordanceWAM，一种可供性感知的生成式世界动作模型。基于预训练的视频扩散 Transformer，使用分别参数化的世界和动作专家，通过掩码联合自注意力耦合，在统一的流匹配目标下联合预测未来 RGB 观察、标量可供性场、可供性热图和连续机器人动作。\n- **深度解析**: 人类视频监督所有三个未来世界流，而机器人轨迹额外提供动作监督，从而实现无需人类动作标签或重定向的迁移。在 RoboCasa、CALVIN ABC-\u003eD 和真实世界操作上进行了实验，证明了相比仅 RGB 和仅机器人数据基线的一致性提升。在固定机器人监督下，随着可供性标注人类视频规模增加，RoboCasa 性能单调提升。具体的实验结果数字摘要未提供。\n- **领域归类**: [机器人学, 世界模型, 视频生成]\n---\n\n### 28. FineSplat: Fine Patches, Local Groups, Detailed Splats (FineSplat：细粒度图像块、局部组、详细溅射)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25011)\n- **研究任务**: 前馈3D高斯溅射（3DGS）中的细粒度几何和外观恢复。\n- **核心亮点**: 引入 FineSplat，一个围绕细粒度图像块构建的前馈3DGS框架。开发了一种双重分组策略，结合视图分组（实现相邻视图间的高效交互）和3D空间分组（将几何相关的标记提升到3D场景空间中重新连接）。利用重建误差作为直接反馈，提供显式的基于渲染的信号来恢复细粒度结构和外观。\n- **深度解析**: 全局多视图注意力在高令牌分辨率下计算成本过高，双重分组策略解决了这一问题。重建误差反馈克服了单次前馈预测的局限性。采用紧凑的高斯生成方案，在相同或更小的高斯预算下，以显著优势实现了最先进结果，恢复了更丰富的几何和外观。具体的实验结果数字和数据集摘要未提供。\n- **领域归类**: [计算机视觉, 3D重建, 神经渲染]\n---\n\n### 29. Frechet Forcing: Training Long-Horizon Streaming World Models from Short Clips (Frechet Forcing：从短片段训练长视野流式世界模型)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25666)\n- **研究任务**: 解决流式视频世界模型在长视野推演中因预测误差复合而导致的漂移问题，特别是在没有长视频或外部教师模型的情况下进行训练。\n- **核心亮点**: 提出 Fréchet Forcing，在三个约束下微调世界模型及其部署的多步采样器：生成锚定、上下文保真度（对潜在统计量计算 Fréchet 距离）、现实匹配（在冻结的感知空间中对真实帧计算 Fréchet 距离）。所有目标均从短真实片段中得出，无需教师模型、在线评论家或长视频。\n- **深度解析**: 在253帧片段上预训练的 MiniWorld-1B，在381帧片段上微调最多36个 GPU 小时，产生的推演在4000帧以上保持稳定，并在机器人操作和相机控制探索中继续遵循动作。具体的实验结果数字摘要未提供。\n- **领域归类**: [世界模型, 视频生成, 强化学习]\n---\n\n### 30. DeOverlay: A Benchmark and Source-Anchored Flow for Video Overlay Removal (DeOverlay：视频叠加移除的基准测试与源锚定流模型)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26081)\n- **研究任务**: 视频叠加移除，旨在恢复被字幕、标题和标志遮挡的场景，同时保留周围内容。\n- **核心亮点**: 提出 DeOverlay，一种源锚定流模型，通过固定源引导从源潜在空间重建干净视频。训练一个共享速度网络，使用区域加权流匹配进行连续校正。开发了可见性归一化时间聚合以选择局部源线索。引入 DVTE-Bench，包含1631个配对视频，涵盖8个文本叠加类别。\n- **深度解析**: 现有方法在有用源信息被遮挡时会留下残留叠加或扭曲场景结构。DeOverlay 通过全局源上下文和编辑区域嵌入补充局部线索。在完整发布集上，DeOverlay 在所有5个重建和感知指标上优于4个基线，Mask LPIPS 和 Mask VFID 分别降低58.3%和70.3%。具体的其他实验结果数字摘要未提供。\n- **领域归类**: [计算机视觉, 视频处理, 图像修复]\n---\n\n### 31. State World Models: Execute the Rules, Generate the Pixels (状态世界模型：执行规则，生成像素)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26811)\n- **研究任务**: 解决现有世界模型在生成动作条件视频时，无法确保动作遵循依赖于当前帧不可见状态的持久规则的问题。\n- **核心亮点**: 提出 Stateful Harness 框架，将世界演化与视频渲染分离以支持有状态和受规则约束的交互；构建 WorldState-Bench 基准测试以评估规则遵从度。\n- **深度解析**: 该框架在指定规则下维护一个不断演化的世界状态，使用冻结的视频模型渲染每个事件，并用生成的片段更新下一轮的世界状态。WorldState-Bench 包含 50 对反事实双胞胎对（共享初始帧和动作，但隐藏状态和所需结果不同）。实验表明，在仅提示规则的情况下，11 个视频后端中最好的仅能在 32% 的对中生成正确结局；而完整的 Stateful Harness 框架在使用相同冻结模型的情况下，将这一比例提升至 92%，证明了分离规则执行与视频渲染的有效性。\n- **领域归类**: [计算机视觉, 世界模型, 视频生成]\n---\n\n### 32. Harnessing Textual Refusal Directions for Multimodal Safety (利用文本拒绝方向提升多模态安全)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.31876)\n- **研究任务**: 探索多模态大语言模型（MLLMs）的安全性，解决不安全多模态数据难以收集、需针对每种模态重新收集且存在伦理法律风险的问题。\n- **核心亮点**: 提出 MARS（模态无关拒绝引导）方法，无需多模态安全数据即可注入多模态安全性；证实了从 LLM 主干网络提取的文本拒绝方向可以跨模态（图像、视频）泛化。\n- **深度解析**: MARS 是一种轻量级的免训练方法，通过激活居中纠正模态错位，在几何定义的信任区域内自适应缩放引导强度，并在第一个生成的 token 处选择最佳干预层。在 5 个 SOTA MLLMs 上的评估表明，MARS 在保持实用性（避免过度拒绝）的同时实现了一致的安全提升。研究揭示了安全相关结构在模态间是共享的，文本拒绝方向是多模态对齐中强大且未被充分探索的基础。\n- **领域归类**: [自然语言处理, 多模态大模型, 模型安全与对齐]\n---\n\n### 33. ACEdit: Stable Multi-Turn Image Editing via Asymmetric Conditioning (ACEdit：通过非对称条件实现稳定的多轮图像编辑)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22328)\n- **研究任务**: 解决图像编辑模型在多轮编辑过程中，由于每次编辑引入的微小分布偏移不断累积，导致质量逐渐下降的问题。\n- **核心亮点**: 引入一种非对称条件（Asymmetric Conditioning）训练方案，利用 Self-Forcing 原则使多轮图像编辑在累积分布偏移下保持稳定。\n- **深度解析**: 核心挑战在于模型自生成的编辑轨迹会偏离真实轨迹，导致直接监督不可靠。该方法通过蒸馏目标解决此问题：学生模型在训练时顺序编辑自己的输出，而教师模型则锚定原始干净图像并接收复合编辑指令，从而提供可靠的训练信号。实验表明，该方案大幅减少了长序列多轮编辑中的质量退化，同时保持了编辑质量和指令遵循能力。\n- **领域归类**: [计算机视觉, 图像编辑, 生成模型]\n---\n\n### 34. LIBERO-Industry: Benchmarking Robotic Manipulation under Industrial Process Constraints (LIBERO-Industry：在工业过程约束下对机器人操作进行基准测试)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16782)\n- **研究任务**: 解决现有评估框架在评估通用机器人策略时，未能系统性地捕捉柔性制造（如高混合低产量电子组装）中工业过程约束的问题。\n- **核心亮点**: 提出 LIBERO-Industry 基准测试，将产品变体、移动物流、有限执行窗口和严格几何公差等工业约束转化为可控任务条件和可衡量的成功标准。\n- **深度解析**: 该基准包含 3 个经典任务场景（静到动、动到静、动到动），共 216 个任务，系统地改变物体几何形状、传送带速度、交互窗口持续时间和几何接受区域大小。在 5 个通用机器人策略（包括视觉-语言-动作模型和世界-动作模型）上的实验表明，随着工业约束的引入和组合，性能逐渐下降。在共享的微调和评估协议下，LIBERO-Industry 联合训练条件比原始 LIBERO 条件实现了更高的目标任务完成率。\n- **领域归类**: [机器人学, 强化学习, 基准测试]\n---\n\n### 35. Remembering Has a Price: Learning Memory Worth under Resource Constraints (记忆是有代价的：在资源约束下学习记忆价值)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26453)\n- **研究任务**: 解决终身学习智能体在严格的生成、交互和记忆预算（资源稀缺）下，现有终身记忆方法失效甚至不如无记忆智能体的问题。\n- **核心亮点**: 提出 TokenWorth 轻量级在线记忆框架，从稀疏的执行反馈中学习依赖于查询的记忆价值，并一致地应用于记忆检索和有界记忆管理。\n- **深度解析**: 在资源稀缺时，检索相关但无效的记忆会消耗宝贵的上下文并阻碍下游执行。TokenWorth 的核心在于确定哪些经验值得保留和重用。在 3 个 LifelongAgentBench 环境中（包括本地和 API 部署），TokenWorth 在评估方法中实现了最高的任务成功率，同时使用的输出 token 最少。结果表明，资源约束下有效的终身适应取决于学习“什么值得记忆”，而不是“记忆更多”。\n- **领域归类**: [自然语言处理, 智能体, 终身学习]\n---\n\n### 36. Learning to Discriminate Scene Structures Makes Self-Supervised Depth Learning Scalable (学习区分场景结构使自监督深度学习的可扩展性更强)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23600)\n- **研究任务**: 解决自监督单目深度估计在多样化场景上训练时性能下降，模型倾向于编码特定于数据集的结构偏差而非可迁移场景几何的问题。\n- **核心亮点**: 提出 MaSS 框架，引入专门的结构表示路径，通过场景结构区分目标学习通用的、布局感知的结构表示，使自监督深度学习可扩展至多样化数据。\n- **深度解析**: MaSS 将结构表示与上下文特征显式解耦。在 4 个多样化数据集上单独和联合训练评估，MaSS 大幅超越先前的自监督方法，并首次从混合域训练中持续获益。在 8 个额外数据集上的零样本评估证明了其卓越的泛化能力，尤其是在完全分布外的场景上表现突出。\n- **领域归类**: [计算机视觉, 自监督学习, 深度估计]\n---\n\n### 37. Self-Evaluating Recursive Agents (自评估递归智能体)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04902)\n- **研究任务**: 解决递归语言模型智能体（将任务分解并委派给同一策略的子实例）训练困难的问题，特别是自创的中间子任务缺乏真实标签且外部验证成本高昂。\n- **核心亮点**: 提出 SERA（自评估递归智能体），将评估转化为策略本身的一种学习能力，通过生成对齐的评估标准（rubrics）来驱动任务分解和解决能力的提升。\n- **深度解析**: SERA 要求父节点在委派前为每个子任务编写加权成功标准，并通过针对验证结果的排序目标训练 rubric 生成。核心发现是，由于评估和执行共享相同的权重，训练策略生成对齐的 rubric 能直接提升其解决子任务的能力。在推理时，学到的 rubric 还可作为树搜索的选择器。在 TextCraft-Synth 和 TextWorld-Sync 上，SERA 分别比强基线平均提升了 5.38 和 13.14 分，推理时的 rubric 引导树搜索在 TextWorld-Sync 上进一步提升了 2.43 分。\n- **领域归类**: [自然语言处理, 智能体, 强化学习]\n---\n\n### 38. ECHO: Efficient Causal Self-Recursion Beyond Auxiliary Multi-Token Prediction (ECHO：超越辅助多 Token 预测的高效因果自递归)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24766)\n- **研究任务**: 解决现有多 Token 预测（MTP）方法作为辅助设计的局限性，即每增加一个预测视野就需要额外的模块和计算开销。\n- **核心亮点**: 提出 ECHO（高效因果自递归），移除辅助模块成本，让主干网络的最后一层预测所有视野，并结合动态深度采样（DDS）降低深层视野的训练成本。\n- **深度解析**: ECHO 将未来预测转化为自回归目标的一部分，而非附加任务。在预训练中，增加深度转化为下游准确性（特别是推理和代码），且 MTP 训练开销减半。在推理时，预训练模型可作为自身的草稿生成器（drafter），在开放式高熵生成中保持草稿-目标对齐。该优势在 token 预算翻倍、重复预训练和监督微调后依然存在。\n- **领域归类**: [自然语言处理, 大语言模型, 模型训练与推理优化]\n---\n\n### 39. Policy Is Not Capability: Some Safety Benchmarks Measure Which Definition of \"Unsafe\" You Trained On (策略并非能力：一些安全基准测试衡量的是你基于哪种“不安全”定义进行训练)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25060)\n- **研究任务**: 揭示护栏分类器评估中的问题，指出“不安全”并非文本的固有属性，而是策略的属性，并探讨安全基准测试受标签定义影响的程度。\n- **核心亮点**: 利用工业部署中的意外数据（约 5.3 万个提示词用两种操作定义标注两次），证明安全基准测试的分数很大程度上由标签定义而非模型能力决定。\n- **深度解析**: 研究发现，安全基准测试的分数可以通过仅改变 0.03% 的参数在其整个范围内移动。例如，HarmBench-copyright 的分数在 0-100 之间波动，且受标签定义影响极大（方差达 0.99）。对于蒸馏学生模型，教师的软标签也会产生同样影响，表明教师来源是未记录的混淆因素。作者主张护栏评估应将数据污染、种子底线和评估定义作为首要变量进行报告。\n- **领域归类**: [自然语言处理, 模型安全与对齐, 基准测试]\n---\n\n### 40. A Conditional No-Hair Theorem for Transformers: How Language Models Forget Their Prompt (Transformer 的条件无毛定理：语言模型如何遗忘其提示词)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24133)\n- **研究任务**: 研究自回归 Transformer 在生成 t 个 token 后，对其初始提示词（prompt）的保留程度和遗忘机制。\n- **核心亮点**: 提出“条件无毛定理”，证明在给定已生成文本的情况下，提示词对下一个 token 的影响随 t 的增长而消失；证明了隐藏状态距离随 t 呈幂律衰减。\n- **深度解析**: 研究发现，训练后的模型遗忘很快（衰减指数约 0.55-0.7），未训练的模型遗忘较慢（约 0.2-0.5）。机制是几何性的：提示词的直接影响随着上下文增长而被稀释，而“中继”（后续 token 传递早期 token 从提示词读取的信息）只能增加对数因子。这意味着提示词的任何幸存属性（如语言）必须由生成的文本本身来承载。取消稀释（如使用 logit bias）可以阻止衰减，证明稀释是测量到的遗忘的必要且充分条件。\n- **领域归类**: [自然语言处理, 大语言模型, 理论分析]\n\n### 41. UniAVC: Unified Audio-Video Creation via Progressive Training and Asymmetric Scheduling (UniAVC：通过渐进式训练和非对称调度实现统一的音视频创作)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24791)\n- **研究任务**: 实现统一的音视频创作，即使用单一模型完成文本条件下的联合合成、双向跨模态生成以及指令引导的跨模态编辑。\n- **核心亮点**: 提出 UniAVC 模型，通过渐进式训练策略和模态解耦的非对称噪声调度，解决了音视频联合生成中配对数据稀缺以及单一噪声调度忽略模态物理差异的问题。\n- **深度解析**: 现有方法高度依赖稀缺的音视频配对数据，且采用统一的噪声调度，忽略了视频需要长时间高噪声来组织空间和运动结构，而稀疏的音频信号可以更早稳定。UniAVC 首先在单模态数据集上训练各个分支，使其具备完整的生成和编辑能力，随后再利用配对数据挖掘跨模态对应关系。同时，模态解耦调度器从共享时间步独立扭曲噪声调度，使得系统能够保持一个模态干净以约束另一个模态（实现意图感知编辑），或在推理后仅对不满意的分支进行自我优化。该模型无需特定任务的适配器即可 spanning 多种创作任务。\n- **领域归类**: [多模态生成, 音视频合成, 扩散模型]\n---\n\n### 42. Competing Learning in Hybrid Architectures (混合架构中的竞争学习)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26830)\n- **研究任务**: 解决现代混合语言模型架构（结合线性时间递归和 softmax 注意力）中，不同混合器竞争学习相同函数导致注意力层无法有效学习上下文检索功能的问题。\n- **核心亮点**: 揭示了混合架构中的“竞争学习”现象，并提出了一种分阶段训练程序，显著提升了模型在语言建模、常识推理及各类检索任务上的表现。\n- **深度解析**: 现代递归层通过将上下文压缩为固定大小的状态来保证高吞吐量，但在上下文信息检索上不如 softmax 注意力。研究发现，在典型数据分布下，递归层学习检索函数的速度快于 softmax 注意力，导致注意力层的学习信号被抑制而无法学会检索。通过在训练中途停止递归层的权重更新，可以有效帮助注意力层学习检索功能。基于此提出的分阶段训练程序，在高达 1B 参数的模型上实证表明，能大幅改善语言建模损失、常识推理以及不同上下文长度下的检索相关任务。具体的模型层数或隐藏层维度等细节摘要未提供。\n- **领域归类**: [自然语言处理, 模型架构, 训练策略]\n---\n\n### 43. Factorization-Guided Training and Inference for Diffusion-Drafted Speculative Decoding (扩散草稿推测解码的因式分解引导训练与推理)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23935)\n- **研究任务**: 提高基于扩散模型的推测解码（Speculative Decoding）的吞吐量，解决高提案容量或高平均接受 token 数（MAT）不一定带来高吞吐量的问题。\n- **核心亮点**: 提出 DScout 方法，利用两种互补的因式分解来引导扩散草稿的训练和推理，在 Qwen3 系列模型上实现了显著的推理加速。\n- **深度解析**: 扩散草稿虽能并行生成提案，但验证机制只接受连续前缀，早期拒绝会使后续正确预测失效，且每轮延迟增加会抵消 MAT 的提升。DScout 在训练时将逐位置损失因式分解为包含、权重和预测损失，指导混合视野训练、块内解掩码和接受加权损失，使监督与前缀接受对齐以提高 MAT。在推理时，将吞吐量因式分解为 MAT 与每轮延迟的比率，从而指导目标条件深度、草稿深度和推理块大小的选择。在六个基准测试中，DScout 在 Qwen3-4B 和 Qwen3-8B 上分别实现了 3.84 倍和 4.14 倍的自回归解码平均加速，比 SOTA 基线分别提高 9.1% 和 7.1%。其推理配置策略还能提供高达 9.75% 的额外平均加速。\n- **领域归类**: [自然语言处理, 模型推理加速, 推测解码]\n---\n\n### 44. Co-Evolving Acting and Forecasting for Language Agents (语言智能体的协同演化行动与预测)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20597)\n- **研究任务**: 解决语言智能体在强化学习训练中，因长视野 rollout 成本高且仅依赖终端标量奖励，导致中间步骤监督未被充分利用的问题。\n- **核心亮点**: 提出 CoPE 方法，引入多步动作目标，使智能体的行动和预测能力在训练中协同演化，在多个基准测试中超越现有基线且无推理开销。\n- **深度解析**: 现有的价值目标或观察目标难以构建：前者来自单一标量信号，后者（如网页、日志）长且嘈杂且只向前看一步。CoPE 增加了第三种多步动作目标：在成功的 on-policy 轨迹上，训练策略主干生成跟随每个历史的动作序列。每个动作在从先前历史预测时也会受到监督，形成一个时间集成供共享主干吸收，实现行动与预测的协同演化。推理时策略仍单步行动，无额外开销。在 ALFWorld、ScienceWorld、WebShop、τ^2-bench 和 AppWorld 五个基准上，CoPE 的聚合性能强于 GRPO 等基线；在 ScienceWorld 上，其样本效率比 ECHO 和 GRPO 分别高 1.9 倍和 2.0 倍，且无需额外模型或独立预训练。\n- **领域归类**: [强化学习, 智能体, 自然语言处理]\n---\n\n### 45. World Model Interpretability: From Decoding Representations to Understanding Latent Worlds (世界模型可解释性：从解码表征到理解潜在世界)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25296)\n- **研究任务**: 探讨联合嵌入预测架构（JEPA）等新兴世界模型中潜在世界的可解释性问题，推动可解释性研究从“解码表征”向“理解潜在世界”转变。\n- **核心亮点**: 提出了一套包含 Ground（基础）、Structure（结构）、Verify（验证）和 Act（行动）四个阶段的研究议程，为潜在世界的可解释性指明了方向。\n- **深度解析**: 这是一篇观点/展望（Perspective）文章。JEPA 正从表征学习转向支持预测、规划和控制的潜在世界模型，但其潜在世界缺乏人类可解释的接口。作者认为，随着 JEPA 潜在变量成为预测和动作的内部状态，可解释性必须超越“它们编码了什么”，转向“潜在变量如何交互、演化并因果驱动预测”。现有的 JEPA 可解释性工作为 Ground 阶段提供了早期证据，而对潜在结构的系统分析、因果验证和干预的具体探索细节摘要未提供。该议程旨在呼吁更广泛的潜在世界可解释性研究。\n- **领域归类**: [世界模型, 可解释性, 表征学习]\n---\n\n### 46. StopLoss: Teaching Agents to Predict Failure and Stop Early (StopLoss：教智能体预测失败并提前停止)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25525)\n- **研究任务**: 降低代码智能体在注定验证失败的运行中消耗的计算资源成本，实现低成本的早期失败预测与停止。\n- **核心亮点**: 引入 StopLoss 小型外部监控器，通过从完成的轨迹和验证器结果中学习失败识别，以极低成本实现早期停止，大幅节省计算资源。\n- **深度解析**: 代码智能体经常在注定失败的运行上继续工作，而让前沿模型监控成本高昂。StopLoss 受金融止损启发，利用最终结果标记早期的局部窗口，微调的语言模型可以在单次前向传播中对最近的工具步骤进行评分，并通过在成功运行上校准的阈值将分数转化为中止决策，无需更改执行器。在 GPT 家族的 SWE-rebench 轨迹上训练，并在 SWE-bench Verified 和 Pro 子集上评估。结果监督将失败预测从接近随机提升到有用的信号，每次检查的成本比任何测试的通用判断器低一到两个数量级。相比完成所有任务，StopLoss 在 Verified 上将每次保留解决的成本降低了 4.5%（保留 99% 的成功运行），在 Pro 子集上降低了高达 31%（使用 Qwen3-8B 主干时达到 48%）。\n- **领域归类**: [智能体, 软件工程, 效率优化]\n---\n\n### 47. Progress-Aware Distillation for Mitigating Stagnation in Small Language Model Agents (进度感知蒸馏：缓解小语言模型智能体的停滞问题)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19439)\n- **研究任务**: 解决小语言模型（SLM）智能体在蒸馏后长交互轨迹中容易陷入“进度停滞”（陷入无效循环、难以取得有意义进展）的问题。\n- **核心亮点**: 提出进度感知蒸馏（ProD），显式检测并惩罚学生生成轨迹中的停滞现象，通过自适应边际动态惩罚，提升蒸馏 SLM 智能体的成功率和任务完成效率。\n- **深度解析**: 将大模型的智能体能力蒸馏到 SLM 是提升效率的途径，但随着交互轨迹变长，蒸馏的学生智能体容易出现进度停滞。系统分析表明该现象在不同 SLM 和任务域中一致存在。ProD 将学生和教师之间的停滞差距编码为自适应边际，动态惩罚可能的停滞。通过迭代应用此过程，学生智能体逐渐逼近教师行为。在 8 个 SLM（参数量从 0.6B 到 8B）上的广泛实验表明，ProD 在域内和域外基准测试中显著缓解了进度停滞，同时提高了成功率和任务完成效率。具体的基准测试名称和详细的成功率数字摘要未提供。\n- **领域归类**: [智能体, 模型蒸馏, 小语言模型]\n---\n\n### 48. N-Gram Memories at Two Bits: Quantizing Lookup Tables in Large Language Models (两比特 N-Gram 记忆：大语言模型中查找表的量化)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21810)\n- **研究任务**: 压缩大语言模型中条件记忆（Conditional memory）的完整嵌入表，降低存储需求同时保持重建质量。\n- **核心亮点**: 提出条件程序（CP），一种压缩表示，仅重建输入请求的行。通过两比特代码和高斯网格等重建程序，大幅降低存储和输出 KL 散度。\n- **深度解析**: 条件记忆通过选择性查找扩展语言模型容量，但必须为每个可能的输入保留完整的嵌入表。CP 用短代码和局部尺度表示每一行，并共享跨表的重建程序。使用高斯网格、范数恢复和独立可解码的行记录实例化该表示。CP 的两比特代码使输出 KL 散度比 2 比特就近舍入降低了 41% 到 63%。对三个训练好的 n-gram 记忆族的分析表明，高斯状坐标统计与行之间的学习关系共存；在匹配的存储预算下，共享网格优于拟合码本和测试的低秩残差变体。对于 DeepSeek 模型，它将表存储从 203GB 减少到 51GB，为 GPU 上的更大工作负载留出了空间。\n- **领域归类**: [模型压缩, 量化, 大语言模型]\n---\n\n### 49. HandsOn: A Large-Scale Simulation Benchmark for Generalizable Dexterous Manipulation (HandsOn：面向可泛化灵巧操作的大规模仿真基准)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26765)\n- **研究任务**: 提供一个可组合的仿真平台和基准，用于评估跨具身（cross-embodiment）的灵巧操作泛化能力。\n- **核心亮点**: 推出 HandsOn 平台，支持多种机械臂和灵巧手，包含约 200 种资产和 18,000 个人类演示，提供 Core-50 和 Transfer-16 任务集，揭示了当前方法的失败模式。\n- **深度解析**: 通用操作需要在不同具身、物体和任务需求下保持可靠行为。HandsOn 支持 5 种机械臂、6 种灵巧手和约 200 种刚性、关节和可变形资产。基准包含 18,000 个策划的人类演示和 66 个人类验证的任务：Core-50 支持基于演示的学习和执行测试，Transfer-16 评估资产和关系迁移、技能组合和可变形操作（无目标任务训练演示）。在扩散、VLA、世界-动作和提示 VLM 等方法中，最佳训练的多任务策略在 Core-50 上达到 29.1% 的成功率。未经基准微调的 GPT-6 使用 move_eef 进行手掌和手指控制，在 660 次试验中于 Core-50 和 Transfer-16 上分别达到 5.2% 和 1.9% 的成功率。诊断暴露了接触建立、动作协调和维持目标等方面的失败。\n- **领域归类**: [机器人学, 灵巧操作, 仿真基准]\n---\n\n### 50. HSPR: Recovering Software-Agent Benchmark Scores via Hierarchical Posterior Inference (HSPR：通过分层后验推断恢复软件智能体基准分数)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24611)\n- **研究任务**: 在评估软件智能体时，通过少量任务子集准确恢复完整基准的分数和排名，降低评估成本。\n- **核心亮点**: 提出分层分数后验恢复（HSPR），结合源拟合响应因子与不确定的组成功率，利用后验引导采集选择后续任务，在 10% 任务预算下实现最低的评估误差。\n- **深度解析**: 在完整基准上评估软件智能体成本高昂，小子集虽能保留排名但分数可能不准。历史响应提供了有用结构，但源响应相同的任务对新目标智能体可能有不同结果。HSPR 结合源拟合的响应因子和不确定的组成功率。观察到的目标结果更新目标潜在状态和组率的后验；后验引导采集选择后续任务。其基于分数的标准等于完整分数后验方差的预期单步减少。观察到的成功和未查询任务的后验预测计数产生完整分数后验。最终估计使用其中位数与源选择的校准。在 SWE-bench 家族的四个任务库的 10% 任务预算下，HSPR 在三个库上实现了最低的平均绝对误差（MAE），在所有四个库上实现了最低的最大绝对误差（MaxErr）。具体的误差数值摘要未提供。\n- **领域归类**: [智能体评估, 软件工程, 统计推断]\n---\n\n### 51. Text-to-Image Generative Modeling Without Language Pretraining (无需语言预训练的文本到图像生成建模)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26863)\n- **研究任务**: 探究互联网规模的语言预训练对于实现强大的文本到图像（T2I）生成是否绝对必要。\n- **核心亮点**: 提出 Halcyon 模型家族，完全从头开始在 1 亿图像文本对数据集（GPIC）上进行早期融合的多模态自回归预训练，证明了无需互联网规模语言预训练即可实现强大的 T2I 生成。\n- **深度解析**: Halcyon-0.52B 在预训练计算量减少 18.2 倍的情况下超越了 LlamaGen-XL/8（48.0 vs. 63.3 gFD），Halcyon-1.6B 在计算量减少 275 倍的情况下超越了 JiT-T2I-XXL/8++（35.3 vs. 41.0 gFD）。控制实验表明纯文本预训练并不能提升 T2I 生成效果。此外，通过将 caption dropout 替换为图像到文本（I2T）监督，该模型还能学习图像描述，且在相同预训练预算下保持了具有竞争力的 T2I 生成质量。\n- **领域归类**: [多模态生成, 文本到图像, 自回归模型]\n---\n\n### 52. Sparse Feature Policy Unlearning Mitigates State Hallucination in Vision-Language-Action Models (稀疏特征策略遗忘缓解视觉-语言-动作模型中的状态幻觉)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09496)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在真实环境部署中出现的“状态幻觉”问题，即模型在机器人-物体状态未实际达成时，仍继续表现出仿佛该状态已实现的不可靠行为。\n- **核心亮点**: 提出 SOUL（稀疏特征策略遗忘）方法，通过选择性遗忘与状态幻觉相关的策略知识，大幅减少幻觉失败并提高任务成功率，同时不损害现有的操作能力。\n- **深度解析**: 研究发现状态幻觉与模型对任务相关视觉区域注意力减弱有关。通过稀疏自编码器的机制分析，发现与幻觉相关的稀疏特征会在失败时被激活。SOUL 方法利用这些在幻觉失败和成功行为中识别出的稀疏特征，分别作为显式的遗忘和保留目标，从而在模拟和真实环境中有效修正了 VLA 模型的不良知识。\n- **领域归类**: [具身智能, 机器人操作, 视觉-语言-动作模型, 模型可解释性]\n---\n\n### 53. RSIFlow: Adaptive Self-Improvement Workflows with an Evolving Meta-Agent (RSIFlow：具有进化元代理的自适应自我改进工作流)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21791)\n- **研究任务**: 解决大语言模型（LLM）智能体在递归自我改进（RSI）过程中，如何适应不断变化的性能瓶颈并通过执行反馈改进工作流编排的问题。\n- **核心亮点**: 提出 RSIFlow 框架，将自适应工作流编排与元代理能力进化相结合，在多个基准测试中实现了最先进的平均性能。\n- **深度解析**: RSIFlow 通过分析任务-智能体轨迹和环境反馈来诊断性能瓶颈，从而动态选择针对特定组件的改进工作流。随后，元代理将工作流的结果提炼为特定组件的技能和跨组件的原则，进而进化其自身的执行工具（harness），以优化后续的工作流编排。消融实验证实了自适应工作流编排和元工具进化对整体性能的贡献。\n- **领域归类**: [大语言模型智能体, 自我改进, 工作流编排]\n---\n\n### 54. Empowering Edge Agents: A Systematic Analysis of Edge-Cloud Collaboration in LLM Agent Execution (赋能边缘智能体：LLM 智能体执行中边缘-云协作的系统分析)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17816)\n- **研究任务**: 评估和分析大语言模型（LLM）智能体在长视野（long-horizon）场景执行中，边缘计算与云端模型协作的效果与影响。\n- **核心亮点**: 引入 EC2-Bench 基准测试，提供统一的评估框架，系统揭示了边缘-云协作在任务性能、资源使用和隐私暴露之间的权衡关系。\n- **深度解析**: 研究表明，与纯边缘或纯云执行相比，边缘-云协作能实现更好的综合平衡。随着边缘模型能力的增强，协作执行的性能逐渐逼近纯云执行，且不同策略间的性能差异缩小，但隐私暴露仍高度依赖于具体策略。此外，更强的边缘能力会促使协作模式从外部控制或直接的云端执行，转向更多由边缘控制的协作模式。研究还指出，云调用决策和指令遵循是边缘侧实现有效协作的关键能力。\n- **领域归类**: [大语言模型智能体, 边缘计算, 云边协同, 系统评估]\n---\n\n### 55. Heterogeneous Agentic Coevolution (异构智能体协同进化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16078)\n- **研究任务**: 解决将递归自我改进扩展到具有强领域专长但依赖人类设计改进的专用基础模型时所面临的挑战，即当专用模型改进时，推进它的策略也必须随之适应。\n- **核心亮点**: 提出 HACE（异构智能体协同进化）框架，通过相互学习联合进化专用基础模型和 LLM 智能体，在推荐系统、生物学和材料科学三个领域均超越了现有的自我改进方法。\n- **深度解析**: HACE 通过监督学习改进专用模型（专家），同时使用基于当前专家验证性能增益指导的策略强化自训练来训练 LLM 智能体。智能体的探索结果反过来为后续的专家训练提供信息。为了维持这种相互学习，HACE 还采用进化搜索来优化两者的交互工具（harness），使它们能够根据能力的进化自适应地调整信息交换和训练经验选择的方式。\n- **领域归类**: [大语言模型智能体, 自我改进, 协同进化, 领域专用模型]\n---\n\n### 56. HERA: Harness-Environment Co-Evolution for Reliable Agentic Abstention (HERA：用于可靠智能体弃权的工具-环境协同进化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06563)\n- **研究任务**: 解决大语言模型（LLM）智能体在复杂工具使用环境中无法识别任务不可行且无有效解的可靠性差距（即智能体弃权问题），并提升其对未见失败模式的泛化能力。\n- **核心亮点**: 提出 HERA 框架，通过自动构建可解与不可解任务对以及工具-环境协同进化过程，显著提高了智能体的弃权准确率和可解任务完成率。\n- **深度解析**: HERA 包含两个核心部分：一是通过受控环境突变将可解任务转化为需要弃权的案例，自动构建验证对；二是利用之前任务的性能失败来驱动工具（harness）适应，并生成针对弱点的新环境和任务。在保留的评估任务上，HERA 将弃权准确率从 61.7% 提升至 83.3%，可解任务完成率从 68.3% 提升至 76.7%。此外，进化出的最佳工具可跨 19 个其他 LLM 迁移，平均提高 15.3 个百分点的弃权准确率，使较小模型能以估计低 85% 的成本匹配更强大模型的性能。\n- **领域归类**: [大语言模型智能体, 可靠性, 弃权机制, 协同进化]\n---\n\n### 57. Training Reasoning Models to Generate Diverse Scientific Ideas (训练推理模型以生成多样化的科学想法)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22324)\n- **研究任务**: 解决大语言模型在自动化研究管线第一步（生成想法）时，过度优化单个想法质量而忽视想法集合多样性的问题。\n- **核心亮点**: 提出使用集合级强化学习目标进行训练，使 8B 模型在生成基于文档的科学想法时，实现了比 Claude Opus 4.8 和 GPT-6 Astra 更高的创意效用（结合质量与多样性）。\n- **深度解析**: 在训练设置中，模型在单次生成中写出 K 个结构化想法卡片，并对整个集合进行联合评分，每个想法的质量由其与之前生成的想法的距离加权，从而引导模型使新想法区别于先前想法。人类专家初步研究表明，该模型生成的想法集合与 Claude Opus 4.8 同样有希望且包含略多的独特想法。此外，编码智能体运行的概念验证实验表明，增加的多样性并未损害想法的可执行性（success@k 与 Claude Opus 4.8 相当）。\n- **领域归类**: [大语言模型, 科学发现, 想法生成, 强化学习]\n---\n\n### 58. Token-Set Choice Confounds POPE: A Systematic Audit of Yes/No Extraction in VLM Hallucination Evaluation (Token 集选择混淆了 POPE：对 VLM 幻觉评估中 Yes/No 提取的系统审计)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25964)\n- **研究任务**: 复现并审计视觉语言模型（VLM）在 POPE 基准测试上的幻觉缓解结果，排查评估代码中因 Token 读取选择导致的指标偏差。\n- **核心亮点**: 发现并证实了 POPE 评估协议中存在协议级的 Token 提取混淆问题，不当的 Token ID 读取方式会导致 F1 分数产生高达 6.13 分的虚假提升，掩盖了真实的模型表现。\n- **深度解析**: 作者在复现时发现，原评估代码使用双 Token logit 读取（比较 \"yes\" 和 \"no\" 的特定词表 ID 3582 和 1217），但由于 SentencePiece 分词器在提示后缀后添加了空格字节，模型实际输出的是带空格的 Token（3869 和 1939），导致原 ID 在 9000 个问题中从未被生成。使用覆盖空格前缀的 8-Token 查找修正后，基线 F1 分数发生了显著偏移，超过了调查的 6 篇论文中 5 篇报告的幻觉缓解增益。进一步的跨模型和跨分词器家族审计证实，这一混淆是协议层面的问题，逐字移植错误 ID 甚至会将 F1 降至 0.00。\n- **领域归类**: [视觉语言模型, 幻觉评估, 基准测试, 评估方法论]\n---\n\n### 59. ActionRoPE: action as coordinates for spatially consistent control in planar-camera game world models (ActionRoPE：将动作作为平面相机游戏世界模型中空间一致控制的坐标)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25861)\n- **研究任务**: 解决平面相机世界（如俯视和等距游戏）模型中，传统动作控制作为特征条件导致空间一致性差的问题，实现更忠实的空间一致控制。\n- **核心亮点**: 提出 ActionRoPE 无参数动作接口和坐标条件噪声调度（CNS），将动作驱动的相机位移直接转换为世界坐标旋转位置，大幅减少了重访漂移。\n- **深度解析**: ActionRoPE 将动作效果直接表示在世界坐标中，使对应同一世界位置的 Token 跨时间保留相同的位置地址。这暴露了生成中的空间不对称性（初始观察覆盖的已知区域与待合成的新区域）。为此提出的 CNS 根据这种已知-新结构分配 Token 级去噪调度，使已观察区域更早稳定，新内容参考其生成。与四种代表性动作条件机制相比，该方法更忠实地遵循指令运动，将最强基线的重访漂移减少了 66%，且该接口可跨 1.3B 到 33B 参数规模的视频骨干和分布外场景迁移。\n- **领域归类**: [世界模型, 游戏生成, 视频生成, 空间一致性控制]\n---\n\n### 60. Vision-Language-Delta-Action: Learning Compact Deltas as Actionable Transition Interfaces for Robotic Manipulation (视觉-语言-Delta-动作：学习紧凑 Delta 作为机器人操作的可操作转换接口)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25874)\n- **研究任务**: 解决现有视觉-语言-动作（VLA）模型直接学习观察到动作映射带来的巨大学习负担，以及世界-动作模型（WAM）对完整未来状态建模浪费容量的问题。\n- **核心亮点**: 提出 VLDA 范式，将完整未来预测重新表述为紧凑的可操作转换建模，通过引入紧凑的 Delta 变量作为视觉语言理解与动作生成之间的接口，提升了长视野操作的一致性、鲁棒性和泛化能力。\n- **深度解析**: VLDA 的核心是捕获潜在世界状态变化的 Delta 变量。它通过统一目标学习 Delta：局部转换滤波器（LT-Filter）捕获以任务为中心的变化并抑制静态重建偏差，全局转换锚点（GT-Anchor）提供粗粒度正则化以保留状态变化的整体方向。随后，Delta 驱动的动作细化（DDAR）将 Delta 接地到动作流形中，作为结构化种子指导动作去噪。该方法在开源框架 LoongForge 中实现，实验验证了其作为直接动作预测和完整未来状态建模替代方案的有效性。\n- **领域归类**: [具身智能, 机器人操作, 视觉-语言-动作模型, 世界模型]\n---\n\n### 61. QD-Rec: Open-Ended Evolution of Recommendations via Quality-Diversity (QD-Rec：通过质量-多样性实现推荐的开放式进化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23470)\n- **研究任务**: 在决策制定中生成高质量且多样化的推荐选项及自然语言理由。\n- **核心亮点**: 提出 QD-Rec 方法，结合上下文多臂老虎机（contextual bandit）选择物品，并利用基础模型生成假设（即推荐理由），通过质量-多样性机制将新颖或更优的推荐存入档案。\n- **深度解析**: 针对高风险决策场景中单一排序列表的局限性，将开放式搜索范式引入推荐系统，强调提供多样且理由充分的选项，从而为决策者提供更具实用价值的参考。\n- **领域归类**: [推荐系统, 基础模型, 开放式搜索, 决策支持]\n---\n\n### 62. Predicting Privileged Information Effectiveness for On-Policy Self-Distillation (预测在策略自蒸馏中特权信息的有效性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22512)\n- **研究任务**: 评估和预测在策略自蒸馏（OPSD）训练过程中特权信息（PI）的有效性。\n- **核心亮点**: 系统评估了 16 种 PI 配置，提出使用基于 KL 散度的指标（特别是 error-step KL contrast）在训练前预测 PI 效用，并证明有效 PI 与 GRPO 结合可超越强基线。\n- **深度解析**: 解决了以往研究将特权信息视为固定设计选择而忽视其内容和构建方式影响的问题，为多轮智能体设置下如何构建和评估特权信息提供了实用的指导原则。\n- **领域归类**: [大语言模型, 知识蒸馏, 智能体训练, 强化学习]\n---\n\n### 63. Measuring Mechanistic Uncertainty in Large Language Models via Causal Robustness (通过因果鲁棒性测量大语言模型中的机制不确定性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22636)\n- **研究任务**: 通过评估模型内部机制的稳定性来量化大语言模型的不确定性。\n- **核心亮点**: 提出“机制不确定性”概念和“因果鲁棒性边际”指标，利用 Jacobian Lens 概念引导向量进行量化，证明错误和不确定响应对内部干预更敏感。\n- **深度解析**: 旨在解决大语言模型在关键领域中因幻觉导致的不确定性量化难题，从内部机制稳定性的全新视角补充了传统基于输出结果的不确定性评估方法。\n- **领域归类**: [大语言模型, 不确定性量化, 可解释性, 机制可解释性]\n---\n\n### 64. Any 3D Scene is Worth 1K Tokens: 3D-Grounded Representation for Scene Generation at Scale (任何 3D 场景都值 1K 个 Token：用于大规模场景生成的 3D 基础表示)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.11331)\n- **研究任务**: 实现大规模、具有 3D 空间一致性的场景生成。\n- **核心亮点**: 摒弃 2D 潜空间，直接利用 2D 基础模型构建高维隐式 3D 潜空间，并使用 Diffusion Transformers 在该 3D 潜空间中直接进行扩散建模。\n- **深度解析**: 针对现有 2D 多视图或视频扩散模型在 3D 场景生成中存在的表示冗余和空间一致性不足的根本缺陷，提出从 2D 潜空间向 3D 潜空间的范式转变，以提升生成效率和空间一致性。\n- **领域归类**: [3D 生成, 扩散模型, 计算机视觉, 潜空间表示]\n---\n\n### 65. CyberArena: Benchmarking AI Agents in Live Symmetric Attack-and-Defense Combat (CyberArena：在实时对称攻防战斗中评估 AI 智能体)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19005)\n- **研究任务**: 在动态、对称的实时攻防战斗环境中评估 AI 智能体的网络安全能力。\n- **核心亮点**: 提出 CyberArena 动态对称对抗基准，让智能体在隔离沙箱中同时进行攻防，并引入动力学模型将比赛动态转化为多维能力评分。\n- **深度解析**: 旨在解决现有静态网络安全基准无法评估智能体在真实、动态、高压环境下同时攻防和自适应能力的局限，提供了一个可扩展的实战化实验平台。\n- **领域归类**: [AI 智能体, 网络安全, 基准测试, 对抗评估]\n---\n\n### 66. Beyond Maliciousness: Static and Runtime Attack-Surface Profiling of Agent Skills (超越恶意性：智能体技能的静态与运行时攻击面分析)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19264)\n- **研究任务**: 对工具使用智能体的技能（Agent Skills）进行静态和运行时的攻击面分析，评估其实际权限和潜在风险。\n- **核心亮点**: 提出两阶段攻击面分析方法，揭示了智能体技能市场中普遍存在的权限声明不准确和权限模型失效的问题，强调基于能力的攻击面分析是恶意检测的必要补充。\n- **深度解析**: 指出当前智能体技能市场的权限模型形同虚设，用户安装时无法察觉实际授予的庞大攻击面，呼吁安全评估必须从依赖“恶意性检测”转向关注“技能实际能做什么”。\n- **领域归类**: [AI 智能体安全, 攻击面分析, 权限管理, 静态与动态分析]\n---\n\n### 67. SPARC: Spoken Profile Authorship Recognition Corpus (SPARC：语音档案作者身份识别语料库)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25265)\n- **研究任务**: 评估转录文本（而非声学信号）中保留的说话人身份和人口统计属性信息，并测试语音匿名化在文本层面的有效性。\n- **核心亮点**: 引入 SPARC 基准数据集，证明大语言模型仅通过转录文本就能进行说话人身份和属性（性别、口音）验证，并发现限制文本长度（如 50 词）可有效降低身份关联风险。\n- **深度解析**: 填补了语音匿名化研究中忽视文本内容泄露说话人信息的空白，揭示了大语言模型在文本层面的强大作者身份识别能力及其对隐私保护的潜在威胁。\n- **领域归类**: [语音处理, 隐私保护, 作者身份识别, 大语言模型]\n---\n\n### 68. Legal Guidance in the Wild: How Users Seek Legal Help in Real-World LLM Conversations (现实世界中的法律指导：用户如何在真实 LLM 对话中寻求法律帮助)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.25159)\n- **研究任务**: 分析和分类真实世界大语言模型对话中用户寻求法律指导的行为和查询模式。\n- **核心亮点**: 提出多轴法律查询分类法，构建并公开了基于 WildChat 的法律对话黄金评估集，揭示了绝大多数法律相关对话都在寻求个性化实践指导。\n- **深度解析**: 旨在理解和规范用户在现实场景中向大模型寻求法律帮助的行为，为大规模研究对话 AI 中的法律指导提供了可复现的数据集和分析框架。\n- **领域归类**: [自然语言处理, 法律 AI, 对话系统, 数据集构建]\n---\n\n### 69. RealityBench: Simulated Environments to Evaluate a Vision Language Model's Ability to Document Human Physical Work (RealityBench：评估视觉语言模型记录人类物理工作能力的模拟环境)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14397)\n- **研究任务**: 评估视觉语言模型（VLM）在理解和记录人类物理工作（如屋顶太阳能安装、车辆维修）方面的能力。\n- **核心亮点**: 构建 RealityBench 模拟环境基准，包含 11 个物理工作环境，设计了“可接受性”和“文档”两项任务，全面评估了 26 个 VLM 在复杂物理场景下的理解与记录能力。\n- **深度解析**: 针对物理工作场景数据专有且高方差的痛点，利用 Blender 构建可控的模拟环境，揭示了当前 VLM 在读取测量值、理解空间关系及判断工作合规性方面的显著短板。\n- **领域归类**: [视觉语言模型, 基准测试, 物理世界理解, 计算机视觉]\n---\n\n### 70. Competence-Based Evaluation of Logical Reasoning in Large Language Models (大语言模型逻辑推理的基于能力评估)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22894)\n- **研究任务**: 提出并应用“基于能力评估”（CBE）范式，更准确地测量大语言模型的逻辑推理泛化能力。\n- **核心亮点**: 提出基于能力评估（CBE）范式，通过参数化生成器在保持核心能力不变的情况下缩放复杂度，揭示了即使是最强的 LLM 也无法在问题族中稳定保持推理能力。\n- **深度解析**: 指出传统基于单一准确率的评估方法无法反映模型的真实推理泛化能力，CBE 范式通过控制变量和复杂度缩放，为诊断模型逻辑推理的真实短板提供了更严谨的评估协议。\n- **领域归类**: [大语言模型, 逻辑推理, 基准测试, 能力评估]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [MadsLorentzen/ai-job-search](https://github.com/MadsLorentzen/ai-job-search)\n- **今日趋势**: 59,998 stars, 18,777 forks, 今日新增 3,890 stars\n- **项目简介**: 基于 Claude Code 构建的本地化 AI 求职申请框架。\n- **核心价值**: \n  - **用途**: 评估职位发布、定制简历、撰写求职信以及准备面试。\n  - **目标人群**: 求职者。\n  - **技术核心**: 基于 Claude Code 构建，支持在本地机器上运行，用户可通过 Fork 完全掌控。\n  - **AI/大模型相关**: 是（基于 Claude Code 的 AI 框架）。\n\n---\n\n### [Comfy-Org/ComfyUI](https://github.com/Comfy-Org/ComfyUI)\n- **今日趋势**: 140,608 stars, 16,645 forks, 今日新增 1,201 stars\n- **项目简介**: 全球最快的本地推理引擎，提供基于节点/图界面的强大模块化扩散模型 GUI、API 和后端。\n- **核心价值**: \n  - **用途**: 提供扩散模型的图形用户界面、API 和后端，用于高效的本地推理。\n  - **目标人群**: 扩散模型/AI 绘画开发者、创作者及研究人员。\n  - **技术核心**: 基于图/节点界面的模块化架构，具备极高的本地推理性能。\n  - **AI/大模型相关**: 是（扩散模型与本地推理引擎）。\n\n---\n\n### [Graphify-Labs/graphify](https://github.com/Graphify-Labs/graphify)\n- **今日趋势**: 129,955 stars, 12,514 forks, 今日新增 906 stars\n- **项目简介**: 将代码库及其文档、数据库模式等转换为可查询知识图谱的工具，支持多种 AI 编程助手。\n- **核心价值**: \n  - **用途**: 将代码库、文档、SQL 模式、配置文件和 PDF 转换为可查询的知识图谱。\n  - **目标人群**: 开发者、使用 AI 编程助手（如 Claude Code, Cursor, Codex, Gemini CLI）的用户。\n  - **技术核心**: 本地确定性 AST（抽象语法树）解析，无向量存储，每条边都有解释，作为多种 AI CLI 的技能（skill）运行。\n  - *
