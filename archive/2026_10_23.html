    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. StreamEval: Evaluating Interactive Streaming Video Generation Models (StreamEval：评估交互式流式视频生成模型)\n- **社区热度**: `👍 283 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28402)\n- **研究任务**: 评估交互式流式视频生成模型在虚拟人对话、虚拟人表演、世界生成、指令编辑和参考编辑五个任务上的表现。\n- **核心亮点**: 提出StreamEval统一基准，包含300个时长15至300秒的脚本测试用例。从任务执行、状态一致性、视觉保真度和音视频协调四个维度，通过10个任务特定指标在0-100分制下进行评估。揭示了高视觉质量与可靠请求执行或持续状态一致性之间的脱节。\n- **深度解析**: 实验结果方面，评估了37个不同模型。最高任务特定得分分别为：7个虚拟人表演模型中Following得分36.90，文本条件世界生成中Following得分25.93，3个参考编辑模型中Edit Success得分15.00。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [视频生成, 多模态评估, 基准测试]\n---\n\n### 2. SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes? (SpatialScout：VLM智能体能主动探索和映射3D场景吗？)\n- **社区热度**: `👍 128 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26659)\n- **研究任务**: 评估视觉语言模型（VLM）智能体在主动对象级3D映射方面的能力，即通过自主探索构建准确的度量地图。\n- **核心亮点**: 引入SpatialScout基准，包含80个不同的室内场景和3140个目标对象。智能体需要在有限的交互预算内控制相机探索场景，并在共享坐标系中估计对象中心，任务涉及视角选择、跨视图关联、几何估计和地图修正。\n- **深度解析**: 实验结果方面，最强模型Claude Opus 5.5的平均重叠得分为41.71%，47.23%的目标超过0.5的IoU阈值，仅3.25%超过0.9。这表明从恢复粗略对象布局到构建完整、精确的度量地图之间存在巨大差距。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [3D视觉, 空间智能, 智能体]\n---\n\n### 3. DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations (DONIC：基于人类演示的通用灵巧双手跟踪控制)\n- **社区热度**: `👍 124 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29997)\n- **研究任务**: 解决真实生活中常见的双手灵巧行为，开发能够跨操作类别和人类运动源联合训练的通用双手跟踪器。\n- **核心亮点**: 提出DONIC和包含1575个序列、229个对象的多视角数据集BiHOI。DONIC结合近端策略优化（PPO）与行为克隆，采用以对象为中心的每手奖励和Clip-Centered Advantages，使单一策略能够学习异构参考下的协调操作。\n- **深度解析**: 实验结果方面，在未见过的训练对象轨迹上，单一检查点达到86.79%的成功率，在保留对象上达到57.32%，分别比最先进的双手跟踪基线高出77.36和45.73个百分点。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [机器人, 具身智能, 强化学习]\n---\n\n### 4. Cache Engineering for Agents (面向智能体的缓存工程)\n- **社区热度**: `👍 107 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28577)\n- **研究任务**: 解决大语言模型（LLM）智能体在处理长轨迹时面临的KV缓存I/O、存储成本以及上下文长度限制问题。\n- **核心亮点**: 提出“缓存工程”新方案，允许智能体通过drop（排除选定缓存）和repos（调整保留键的位置编码）直接控制活跃KV缓存，而无需修改轨迹或重新填充。设计了AKV服务引擎，提供无状态接口并内部管理有状态缓存重用、驱逐和恢复。\n- **深度解析**: 实验结果方面，工具响应滚动丢弃缓存策略使平均基准得分提高1.7分，平均成本降低27.7%。结合AKV，输出吞吐量达到1.2倍，P95请求延迟加速1.5倍。缓存策略的递归自我改进比专家设计进一步降低7.1%的成本。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [LLM推理, 系统优化, 智能体]\n---\n\n### 5. Looking Ahead: Modeling Future Evolution in Autoregressive Video Generation (展望未来：自回归视频生成中的未来演化建模)\n- **社区热度**: `👍 100 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29989)\n- **研究任务**: 解决自回归视频扩散模型在逐块生成视频时，无法准确捕捉场景视觉演化过程的问题。\n- **核心亮点**: 引入未来块预测（FCP）作为辅助目标，与教师强制去噪联合优化。在无法访问中间视觉上下文的情况下预测时间上分离的块，无需额外的预训练视觉编码器，且不改变自回归推理过程。\n- **深度解析**: 技术细节方面，该方法无需额外预训练视觉编码器且不改变自回归推理。实验结果方面，以较低的整体训练计算预算实现了优于标准教师强制自回归训练物理合理性，并促进了更结构化的表示空间。摘要未提供具体的实验数字、数据集或其他未提及的技术细节。\n- **领域归类**: [视频生成, 自回归模型, 世界模型]\n---\n\n### 6. Agent World Model in the Wild: Computer-Use Agent Environment Synthesis (野生环境中的智能体世界模型：计算机使用智能体环境合成)\n- **社区热度**: `👍 62 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.26828)\n- **研究任务**: 为训练通用计算机使用智能体（CUA）合成可控的环境和任务，解决在真实计算机系统中直接扩展学习的挑战和安全风险。\n- **核心亮点**: 提出WildAWM，一个完全由开源模型驱动的可扩展管道，构建同时支持GUI、模型上下文协议（MCP）服务和CLI的可执行环境。引入基于执行的质量门控来解决任务合成中的可解性、难度和可靠验证器问题。\n- **深度解析**: 实验结果方面，合成了341个长视野环境-任务对，部分需要超过100个智能体步骤，GPT-6-Astra仅解决60%。在这些合成世界中训练的两个不同大小的Qwen模型在8个分布外基准上取得了实质性收益。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [智能体, 环境合成, 世界模型]\n---\n\n### 7. PrismaCoder: Pushing the Boundaries of Open Multimodal Code Intelligence through Decomposed Rubric Synthesis (PrismaCoder：通过分解规则合成推动开放多模态代码智能的边界)\n- **社区热度**: `👍 48 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20538)\n- **研究任务**: 提升开放多模态代码智能，解决现有数据在程序正确性、构建质量和视觉渲染正确性方面缺乏全面评估信号的问题。\n- **核心亮点**: 提出PrismaForge层次化数据管道，核心是合成的分解规则（rubric），将因素分解为可检查的标准，同时用作过滤器和强化学习奖励。基于此构建了PrismaCoder-2M，这是目前最多样的开放多模态代码智能数据集。\n- **深度解析**: 实验结果方面，训练的PrismaCoder-9B和PrismaCoder-35B模型以较大优势领先开放SOTA并媲美领先的专有系统。分析表明基于规则的管道提高了跨模型骨干的多模态编码性能。摘要未提供具体的实验数字、数据集或其他未提及的技术细节。\n- **领域归类**: [多模态代码生成, 数据合成, 强化学习]\n---\n\n### 8. Right Screen, Wrong Transition: World Models as Verifiers for GUI Agents (正确的屏幕，错误的转换：世界模型作为GUI智能体的验证器)\n- **社区热度**: `👍 47 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.11942)\n- **研究任务**: 解决GUI智能体的安全问题，即安全是转换（transition）的属性而非屏幕的属性，提出一种能验证转换是否正确的世界模型。\n- **核心亮点**: 提出LGWM，一个无解码器、动作条件世界模型，直接在185万个真实GUI转换上训练，预测下一个屏幕的表示而非文本、代码或图像。验证简化为向量比较，同一信号可揭示不匹配是否有害。\n- **深度解析**: 实验结果方面，在RSWT-BENCH上评估，免训练得分在17毫秒/决策内达到0.987 AUC，比生成式GUI世界模型高约10个AUC点，延迟低三个数量级。残差方向在分离有害和良性违规方面达到0.953 AUC。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [GUI智能体, 安全, 世界模型]\n---\n\n### 9. Scaling in Games: Continued Pre-Training For Embodied Agents In Diverse Virtual Worlds (游戏中的扩展：多样化虚拟世界中具身智能体的持续预训练)\n- **社区热度**: `👍 46 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28698)\n- **研究任务**: 研究持续预训练（CPT）在数据量、多样性和模型大小三个轴上对虚拟世界中具身智能体学习的影响及泛化能力。\n- **核心亮点**: 设计了120种训练配置，跨越4种模型大小（0.8B至27B）、6种数据预算（50至1600小时）和5种混合比例。通过三级验证损失和游戏玩法基准评估性能与泛化能力，并拟合了经验扩展定律。\n- **深度解析**: 实验设置包含120种训练配置，跨越4种模型大小（0.8B至27B）、6种数据预算（50至1600小时）和5种混合比例。实验结果方面，拟合了经验扩展定律，模型在3D世界中与Minecraft专家和前沿模型具有竞争力。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [具身智能, 游戏AI, 持续预训练]\n---\n\n### 10. Spectral-Spatial Interpretation (光谱-空间解释)\n- **社区热度**: `👍 45 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21114)\n- **研究任务**: 解决多光谱数据中通道相关性通常在空间上局部化且具有物理意义的问题，提出一种全网格归因方法以提供完整的解释。\n- **核心亮点**: 引入光谱-空间解释（SSI），在每个空间位置上固定观察到的周围上下文，定义该位置通道的条件博弈，并应用Shapley值。生成完整的光谱-空间归因矩阵，满足局部Shapley公平性。\n- **深度解析**: 实验结果方面，在HLS Burn Scar上，SSI在仅使用约6%评估预算的情况下优于MC-Owen估计器。在CUB-200、EuroSAT和HLS Burn Scar上，实现了最佳的联合删除和插入AUC。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [可解释性AI, 多光谱图像, 计算机视觉]\n\n### 11. Socratic Skill Learning: Interleaving Teaching and Practice for Transferable Agent Skills (苏格拉底式技能学习：交织教学与实践以获取可迁移的智能体技能)\n- **社区热度**: `👍 30 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17860)\n- **研究任务**: 学习可跨会话复用的可迁移智能体技能（Agent Skills），使任务知识能够在不同会话中有效复用。\n- **核心亮点**: 提出苏格拉底式技能学习（SSL），将专家教学与学生实践交织。教育者引导调查，而学生作为唯一的环境操作者和技能作者，能够质疑、测试和调整建议。此外，提出 Issue-Guided SSL，通过跟踪未解决的问题来优化审查过程，大幅降低 Token 消耗。\n- **深度解析**: \n  - **技术细节**：SSL 中教育者（Educator）引导调查，学生（Student）是唯一的环境操作者和技能作者，可质疑、测试和调整建议。Issue-Guided SSL 跟踪技能修订中未解决的问题，以选择和聚焦审查过程。\n  - **数据集**：构建了 SkillTransferBench，包含 35 个任务族和 408 个可执行案例，主要评估队列包含 22 个任务族和 155 个案例。\n  - **实验结果**：在主要队列上，Fixed-Window SSL 效用达 0.801（无技能为 0.723，Trace2Skill 为 0.761，SKILL-KD 为 0.751）。Issue-Guided SSL 效用达 0.805，相比 Fixed-Window SSL 减少了 61.7% 的教育者 Token 和 16.9% 的总获取 Token。\n- **领域归类**: [智能体, 技能学习, 大语言模型]\n---\n\n### 12. Retrieval Augmented Generation Compositionality (检索增强生成的组合性)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29722)\n- **研究任务**: 评估检索增强生成（RAG）管道中各项技术组合后的实际效果，探究孤立评估的增益在组合后是否依然有效。\n- **核心亮点**: 提出开源框架 LASAGNA 用于受控的 RAG 评估；揭示了 RAG 组件组合时的非叠加效应、检索质量与回答忠实度之间的权衡，以及最佳组合随语料库规模变化的现象。\n- **深度解析**: \n  - **技术细节**：测试了 450 种配置，涵盖嵌入、分块、检索、重排、查询增强、上下文压缩和智能体验证等技术。\n  - **数据集**：8 个基准测试和语料库，文档规模从 5K 到 200K 不等。\n  - **实验结果**：三种独立的强检索技术预测组合提升 47%，但实际仅提升 17%；优化检索可能损害忠实度；在小语料库上表现最好的组合在大规模语料库上未必最佳。\n- **领域归类**: [检索增强生成(RAG), 自然语言处理, 模型评估]\n---\n\n### 13. AgenticRoboRL: Bringing Coding-Agent Post-Training to Agentic Robotics (AgenticRoboRL：将代码智能体的后训练引入智能机器人)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28589)\n- **研究任务**: 通过后训练（Post-training）提升机器人规划器（Robot planners）的能力，以替代依赖强大闭源模型或外部记忆的传统方法。\n- **核心亮点**: 提出 AgenticRoboRL 框架，结合监督微调和多轮强化学习。通过特定于执行机制的适配器连接规划器交互与任务结果，实现跨不同机器人执行机制的统一 RL 训练。\n- **深度解析**: \n  - **技术细节**：框架结合监督微调与多轮强化学习。使用适配器连接记录的规划器交互与任务结果，保持执行组件固定，从而适应 VLA 技能调用和控制代码生成等不同机制。\n  - **数据集**：在 LIBERO-PRO 上进行测试。\n  - **实验结果**：9B 参数规划器的成功率从 18.1% 提升至 71.0%（无外部记忆），接近 Codex (GPT-5.5) 使用外部记忆达到的 72.1%。\n- **领域归类**: [具身智能/机器人, 强化学习, 大语言模型]\n---\n\n### 14. Memory-Centric Continual Learning for AI Agents (以记忆为中心的AI智能体持续学习)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29357)\n- **研究任务**: 解决基础模型驱动的智能体在长期部署中因权重固定和上下文限制而难以从经验中持续学习的问题，将外部记忆从被动检索转变为驱动真正的持续学习。\n- **核心亮点**: 提出以记忆为中心的持续学习（MCCL）框架，包含三轴分类法（定义记忆状态和管理策略的双循环生命周期）、评估协议（隔离真正的行为增益）以及记忆缩放框架。\n- **深度解析**: \n  - **技术细节**：三轴分类法按状态存储位置（基底）、形式（资产）和管理方式（策略）组织记忆。双循环生命周期在内循环更新记忆状态，在外循环基于任务反馈优化管理策略。评估协议测量干扰下的保留、对变化的适应和任务迁移。记忆缩放框架建模智能体性能随经验、存储容量和计算预算的缩放。\n  - **数据集**: 摘要未提供\n  - **实验结果**: 摘要未提供\n- **领域归类**: [智能体, 持续学习, 记忆机制]\n---\n\n### 15. Multimodal Embodied Agents: A Unified Capability-centric Perspective from Computer-Use to Robot-Use (多模态具身智能体：从计算机使用到机器人使用的统一能力视角)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30108)\n- **研究任务**: 探讨多模态智能体从“计算机使用”转向“机器人使用”时的核心变化，建立统一的能力评估框架以设计和衡量物理智能体。\n- **核心亮点**: 定义多模态具身智能体（MMEAs），提出以能力为中心的 PAPAV 统一框架（感知、预期、规划、行动、验证），并揭示了物理约束对智能体设计的影响及当前基准测试的盲区。\n- **深度解析**: \n  - **技术细节**：PAPAV 框架包含五个功能：感知当前状态、预期行动效果、规划可行路线、通过接口或身体行动、验证结果。指出五种物理约束（如部分可观察性、不可验证结果）减少了预先固定的选择并压缩了纠错空间。\n  - **数据集**：评估了 64 个基准测试。\n  - **实验结果**：在 64 个基准中，显式评估集中在“行动”上，仅有 5 个评估“预期”，3 个评估“验证”，这两者大多隐藏在任务成功率背后。\n- **领域归类**: [具身智能, 多模态智能体, 机器人学]\n---\n\n### 16. TraceForge: Distilling with Your Own Thinking (TraceForge：用自身的思维进行蒸馏)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29680)\n- **研究任务**: 在无法获取前沿模型详细推理轨迹的情况下，通过生成符合学生模型自身风格的推理轨迹来进行知识蒸馏。\n- **核心亮点**: 提出两阶段训练方法（监督+对抗），利用生成器根据上下文和教师答案生成学生模型风格的推理轨迹，并通过评判者评估真实性。证明了“用学生自身风格编写的推理轨迹更易于学习”。\n- **深度解析**: \n  - **技术细节**：两阶段训练：生成器学习从上下文和答案重新生成家族自身的推理轨迹，评判者学习判断轨迹的真实程度。独立评判者按 0 到 1 的评分标准评估真实性。\n  - **数据集**：在 5 个基准测试上进行评估，使用相同的 5000 个问题和相同的教师答案。\n  - **实验结果**：生成的轨迹平均真实性得分为 0.68，真实轨迹为 0.66，评判者从四个候选中选择的轨迹为 0.82。在代码任务上，HumanEval+ 提升 3.7 分，MBPP+ 提升 7.1 分，且 MBPP+ 的优势在每个检查点都保持。\n- **领域归类**: [知识蒸馏, 大语言模型, 推理能力]\n---\n\n### 17. DeLoop: Repeated Actions as Self-Supervision for Long-Horizon Agents (DeLoop：将重复动作作为长程智能体的自监督信号)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19376)\n- **研究任务**: 解决语言模型智能体在长程任务中因上下文压缩等原因频繁陷入重复动作（循环）的问题，减少无效步骤。\n- **核心亮点**: 提出 DeLoop 自监督训练方法，利用智能体自身 rollout 中的循环动作作为负样本，随后的首个非循环动作作为正样本，通过直接偏好优化（DPO）进行学习，无需任务奖励或 LLM 评判。\n- **深度解析**: \n  - **技术细节**：将循环动作视为负例，同一 rollout 中后续第一个非循环动作视为正例，使用直接偏好优化（DPO）进行训练。\n  - **数据集**：在 CodeGym 数据集上进行测试（压缩上下文条件下）。\n  - **实验结果**：在 Qwen3-8B 上，包含循环的任务比例从 57.3% 降至 6.1%，每个任务的步骤数减少约三分之一，任务成功率相似。在 Qwen3-32B 上，减少循环和步骤的同时，任务成功率从 37.7% 提升至 44.8%。\n- **领域归类**: [智能体, 自监督学习, 偏好优化]\n---\n\n### 18. PACE: Periodic and Channel-Aligned Encoding of Four-Bit Recurrent States (PACE：四比特循环状态的周期性通道对齐编码)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29545)\n- **研究任务**: 降低线性注意力语言模型中固定大小循环状态的存储精度（至 4 比特），以允许更多序列共享加速器，同时避免精度下降。\n- **核心亮点**: 提出后处理 4 比特状态量化器 PACE，通过降低量化频率和在通道内共享量化尺度，并结合混合精度（保留误差累积最长的头部为 8 比特），在降低内存的同时保持解码速度和模型性能。\n- **深度解析**: \n  - **技术细节**：PACE 每隔几个生成的 token 才对状态进行一次舍入，中间生成的 token 保留在小缓冲区中。发现门控增量状态的大值集中在列中，因此在列内共享量化尺度。将保留舍入误差时间最长的注意力头保持为 8 比特。\n  - **数据集**: 摘要未提供\n  - **实验结果**：在 4B 到 35B 参数的四个混合模型上，混合 4/8 比特头的 PACE 在三个较大模型上与 8 比特 DAMP 竞争力相当，但内存仅为其约三分之二；全 4 比特头的 PACE 在同等内存下得分高于 Q-Mamba；每几个 token 舍入一次保留了缓冲区的解码加速。\n- **领域归类**: [模型量化, 线性注意力, 模型推理优化]\n---\n\n### 19. Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures (构建AI研究团队以自主发现线性注意力架构)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28887)\n- **研究任务**: 通过构建具有不同专业背景的持久化 AI 研究员团队，在有限的实验预算下平衡探索与利用，以加速科学发现（特别是线性注意力架构的搜索）。\n- **核心亮点**: 提出一种由不同学科背景 AI 研究员组成的团队设计，他们保留私有研究历史、共享实验证据，并通过自适应分配获取研究机会，从而避免陷入局部最优并实现持续自主发现。\n- **深度解析**: \n  - **技术细节**：团队成员具有不同学科背景，保持私有研究历史，共享实验证据，通过自适应分配接收研究机会。\n  - **数据集**: 摘要未提供\n  - **实验结果**：在 1.3B 规模的语言建模、常识推理以及合成和真实世界检索任务中搜索线性注意力架构时，该团队表现优于 GDN2。消融实验表明，去除学科背景会导致搜索过早停滞，去除私有历史会降低进展，统一选择不如自适应分配。\n- **领域归类**: [AI for Science, 多智能体系统, 架构搜索]\n---\n\n### 20. ALPS: Visual State Encoders for World Models (ALPS：用于世界模型的视觉状态编码器)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30120)\n- **研究任务**: 为世界模型构建统一的视觉基础编码器，使其能够同时支持物理状态预测、自然语言对齐和像素重建，以单一表示支持预测、指令和检查。\n- **核心亮点**: 提出预训练视觉状态编码器 ALPS，在单个 patch token 集合中统一了物理状态信息、原生语言对齐和像素重建三种能力，并通过跨视图自蒸馏进行微调。\n- **深度解析**: \n  - **技术细节**：仅使用静态图像和文本，从头预训练 ViT-B/16，采用语言、重建和空间对应目标，然后通过跨视图自蒸馏进行细化。\n  - **数据集**：在 15 个公开编码器上进行统一评估；下游任务使用 LIBERO、PushT、Wall 和 Granular。\n  - **实验结果**：ALPS 在 ViT-B 模型中实现了最低的 LIBERO 状态探测聚合误差（匹配 3.5 倍大的 V-JEPA 2-L）。冻结的 ALPS token 与原生文本塔配对时，在 LIBERO 上达到最高的平均策略成功率（85.5%），在 PushT、Wall 和 Granular 的世界模型规划中匹配或超过领先的编码器，并允许将预测的未来 token 直接解码为像素以进行视觉检查。\n- **领域归类**: [世界模型, 计算机视觉, 具身智能]\n---\n\n### 21. Harness Scaling for Generalizable Agentic Reinforcement Learning (面向可泛化智能体强化学习的执行环境扩展)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29458)\n- **研究任务**: 提高智能体强化学习（Agentic RL）在不同执行环境（harness）配置下的泛化与迁移能力。\n- **核心亮点**: 提出“Harness Scaling”这一新的扩展维度，通过构建分解的执行环境空间并组织跨环境训练，使模型能够结合全局覆盖与受控变化，从而显著提升对未见白盒配置以及外部黑盒执行环境的泛化能力。\n- **深度解析**: 摘要未提供具体的基准测试名称、模型规模数字或具体的强化学习算法名称。\n- **领域归类**: [强化学习, 智能体 (Agents)]\n---\n\n### 22. Real In, Real Out: What If We Only Use Real Data for Scene Text Editing? (真实进，真实出：如果我们仅使用真实数据进行场景文本编辑会怎样？)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27592)\n- **研究任务**: 场景文本编辑（STE），旨在仅使用真实数据的情况下，保持原始风格修改文本内容。\n- **核心亮点**: 摒弃传统的合成数据依赖，提出 TextRIRO 方法。通过字符列打乱与图像裁剪（Shuffle\u0026Crop）破坏文本语义但保留风格线索，构建自监督成对数据；并基于此构建了 TextRIRO-3M 大规模真实长文本识别数据集，有效缩小了合成到真实的领域差距。\n- **深度解析**: 摘要未提供具体的准确率或视觉质量量化指标数字。\n- **领域归类**: [计算机视觉, 图像编辑, 扩散模型]\n---\n\n### 23. Sparsity Should Be ALLOTted by Output: Training-Free Allocation of Block-Sparse Attention for Video Diffusion Transformers (稀疏度应按输出分配：视频扩散 Transformer 块稀疏注意力的免训练分配)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29441)\n- **研究任务**: 优化视频扩散 Transformer 中块稀疏注意力的稀疏度分配，以降低计算成本并最大化视频保真度。\n- **核心亮点**: 提出免训练的 ALLOT 方法。将每个层-去噪步骤对视为单元，通过单元探测和轨迹校准估计其对最终视频误差的贡献，从而在延迟预算下联合优化稀疏度分配，取代了现有的启发式规则。\n- **深度解析**: 结合 XAttention，该方法在 HunyuanVideo 上实现了 11.8 dB 的 PSNR 提升，并在 Wan2.1、Wan2.2 和 HunyuanVideo 的 9 种设置中表现出优于或持平默认策略的性能。\n- **领域归类**: [视频生成, 扩散模型, 模型加速与优化]\n---\n\n### 24. CompactSplat: Spatially Adaptive Gaussian Distribution for Feedforward Scene Reconstruction (CompactSplat：用于前馈场景重建的空间自适应高斯分布)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13177)\n- **研究任务**: 从稀疏视图进行前馈 3D 场景重建，优化 3D 高斯泼溅（3DGS）的原语分配以恢复准确几何和精细纹理。\n- **核心亮点**: 提出内容感知的 3D 高斯分配框架 CompactSplat。结合纹理引导的空间划分，在复杂区域集中密集高斯，在平坦区域平铺扩展的尺度调制高斯，并支持推理时动态稀疏控制，以无缝平衡渲染保真度与内存占用。\n- **深度解析**: 在 RealEstate10K、DL3DV 和 ScanNet 数据集上进行了实验，摘要未提供具体的量化指标数字。\n- **领域归类**: [计算机视觉, 3D 重建, 3D 高斯泼溅 (3DGS)]\n---\n\n### 25. RealMe: Immersive Volumetric Video from Minimal Captures (RealMe：从最小化捕获中生成沉浸式体积视频)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30023)\n- **研究任务**: 从稀疏和低分辨率的捕获资源中生成高分辨率、4D 一致的沉浸式体积视频。\n- **核心亮点**: 提出 RealMe 框架，利用高分辨率视频扩散模型和布局感知位置嵌入，将有限捕获增强为 2K 分辨率的 4D 一致体积视频，并引入潜在频率损失以在潜在空间中提供频域监督，缩小生成视频与真实捕获之间的数据差距。\n- **深度解析**: 在 DNA-Rendering 基准和自采的 RealVV 数据集上进行了评估，摘要未提供具体的视觉保真度和 4D 一致性量化指标数字。\n- **领域归类**: [计算机视觉, 视频生成, 3D/4D 重建]\n---\n\n### 26. Automating ML for Science: Can Frontier Agents Climb Scientific Hills in the Wild? (科学机器学习自动化：前沿智能体能在野外攀登科学高峰吗？)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28763)\n- **研究任务**: 评估和提升前沿 AI 智能体在自动化科学机器学习（ML for Science）任务中的端到端研究和工程能力。\n- **核心亮点**: 引入 Agent4Sci 测试平台，揭示当前智能体主要依赖工程技巧而非科学洞察的局限。通过引入研究构思、实验管理等轻量级插件技能，显著提升了智能体的性能，并促使其产生更多样化、与领域相关的干预。\n- **深度解析**: 测试平台涵盖 11 个领域的 20 个基准；引入插件技能后，Claude Opus 的平均相对提升从 10.4% 提高至 20.1%，Codex 从 4.4% 提高至 8.1%。\n- **领域归类**: [AI 智能体 (Agents), 科学机器学习 (AI for Science), 自动化机器学习]\n---\n\n### 27. Entertain, then Cancel: How Thinking Makes Reasoning Models Read Some and Or Literally (先接受，后取消：思考如何让推理模型对“一些”和“或”进行字面解读)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21204)\n- **研究任务**: 研究推理模型中增加“思考”时间对日常语言逻辑词（如“some”、“or”）语用推理（会话含义）解释的影响。\n- **核心亮点**: 发现增加思考时间会导致推理模型取消“some”和“or”的语用含义，转而进行字面逻辑解读。通过追踪发现模型会先产生语用推理随后再取消，并提出了在推理早期截断以恢复语用含义而不损失字面准确性的探索性方法。\n- **深度解析**: 在大多数测试的开放推理模型和 GPT-5 中观察到了这一现象，摘要未提供具体的评估数据集名称和量化指标数字。\n- **领域归类**: [自然语言处理, 大语言模型推理, 认知与语言学]\n---\n\n### 28. SpatialBrain: Spatial Intelligence Growing from Experience (SpatialBrain：从经验中增长的空间智能)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29317)\n- **研究任务**: 提升视觉语言模型的空间推理能力，使其能够基于经验自主决定何时使用直接观察、何时进行 3D 重建、测量或转换参考系。\n- **核心亮点**: 提出 SpatialBrain 框架，通过 3DFusionMemory、空间技能库和空间认知模块，在不微调视觉语言骨干网络的情况下，从执行经验中学习空间推理决策策略，并将完成的轨迹抽象为过程记录以实现知识积累。\n- **深度解析**: 在 5 个空间推理基准上进行了评估，其中 4 个优于直接回答基线，1 个持平，摘要未提供具体的基准测试名称和量化指标数字。\n- **领域归类**: [计算机视觉, 视觉语言模型, 空间推理]\n---\n\n### 29. Qwen-Audio-3.1-ASR Technical Report (Qwen-Audio-3.1-ASR 技术报告)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28711)\n- **研究任务**: 开发和改进音频语言模型，提升多语言与方言语音识别、说话人分离转录以及通用音频理解能力。\n- **核心亮点**: 发布 Qwen-Audio-3.1-ASR 家族，支持 30 种语言和 16 种中国方言。增强了说话人分离转录（输出包含说话人标签、时间戳和文本的结构化输出）和通用音频理解能力，并提供异步文件转录、低延迟流式等多种部署变体。\n- **深度解析**: 摘要未提供具体的语音识别率（如 WER/CER）等量化指标数字。\n- **领域归类**: [语音处理, 音频语言模型, 自动语音识别 (ASR)]\n---\n\n### 30. Think Harder Where It Matters: Item-Level Adaptive Recursion for Sequential Recommendation (在关键处更深入思考：用于序列推荐的项目级自适应递归)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30128)\n- **研究任务**: 优化序列推荐系统中的计算资源分配，实现项目级别的自适应推理深度，以替代固定的全局计算深度。\n- **核心亮点**: 提出 LoopRec 方法，通过递归应用单个权重共享块和轻量级门控机制，为每个项目独立做出退出或继续的二元决策。这使得低频项目和近期交互自然获得更深的计算，将固定的全局深度转化为学习到的项目级属性。\n- **深度解析**: 在 4 个骨干网络家族的公共基准上进行了实验，摘要未提供具体的数据集名称和量化指标数字。\n- **领域归类**: [推荐系统, 序列推荐, 模型优化]\n\n### 31. Agentic World Action Models (代理世界动作模型)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30136)\n- **研究任务**: 解决机器人操作中世界动作模型缺乏组合技能重用机制，以及代理机器人缺乏物理动力学预测基础的问题。\n- **核心亮点**: 提出 AW-0 框架，将基于代码的规划与联合视频和动作预测相结合。在统一的混合 Transformer 架构中，代码专家生成参数化技能例程，视频和动作专家生成未来视觉状态和低级运动指令。此外，引入自动化数据整理流程，将轨迹标记为对齐的程序并整合为可重用技能库。\n- **深度解析**: 代码在该架构中发挥双重作用：既在世界模型内构建多步预测和控制，又作为可重用程序供后续代理执行。该模型在 RoboTwin 2.0 和物理双臂操作任务上进行了评估，展现了在任务表现、语言跟随、语义推理和鲁棒性方面的提升，但摘要未提供具体的实验结果数字。\n- **领域归类**: [机器人学, 具身智能, 世界模型]\n---\n\n### 32. From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation (从 VLM 规划器到机器人代理：用于历史依赖操作的自进化外壳)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29560)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在处理长视野任务时，难以保留任务进度和过去交互结果等非马尔可夫依赖的问题。\n- **核心亮点**: 提出 SERA（自进化机器人代理），通过可编辑的“外壳（harness）”将高级 VLM 组织为机器人代理，以维护任务上下文并通过执行经验改进规划。系统使用固定的 VLA 执行器提供低级控制，并利用环境展开（rollouts）来提出和评估外壳修订。\n- **深度解析**: 在 RoboMME 数据集上的评估表明，SERA 通过自动选择实现了 51.38% 的总体成功率，相比未使用自进化机制的 44.38% 有显著提升。研究证明，代理规划是处理历史依赖机器人操作的一个有前景的方向。\n- **领域归类**: [机器人学, 具身智能, 视觉语言动作模型]\n---\n\n### 33. Evolving with Open Worlds: Towards Recursive Self-Improvement for Future Forecasting (与开放世界共同进化：面向未来预测的递归自我改进)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29784)\n- **研究任务**: 实现 AI 系统的递归自我改进（RSI），使其能够在动态变化的开放环境中，从自身交互经验中持续学习和改进未来事件预测能力。\n- **核心亮点**: 引入 DeepEvolve 系统，代理在不断发展的环境中交互，通过内化和外化经验进行改进。采用递归进化引擎，将预测背后的推理轨迹转化为能力；解耦搜索与预测以适应易受污染的实时环境；提炼可重用技能以从有限的实时轨迹中进化。\n- **深度解析**: 在外部 FutureX 排行榜上，自我改进的预测器连续三周在所有系统中排名第一，评级提升高达 195%。在合成评估中，在四个基础 LLM 中排名前三，比最强基线高出多达 10.7 个 Bradley-Terry 分。摘要未提供合成评估的具体数据集名称。\n- **领域归类**: [大语言模型, 智能体, 自我改进]\n---\n\n### 34. CulturalRiddles: A Multicultural Benchmark of Riddles (CulturalRiddles：多文化谜语基准测试)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29968)\n- **研究任务**: 评估大语言模型在理解和代表多样化文化方面的能力，解决现有基准以英语为中心、缺乏文化覆盖和真实文化语境应用的问题。\n- **核心亮点**: 提出 CulturalRiddles 基准，包含由人类通过参与式社区努力完全创建的、扎根于文化的原创谜语。涵盖 62 种文化（45 个国家，51 种语言）。解答这些谜语需要溯因和组合推理，以及详细的事实、社会知识和文化特定联想。\n- **深度解析**: 对 28 种 LLM 配置进行了自动和大规模人类评估。结果显示，即使是前沿模型在某些社区的准确率也最高仅为 22%。作者公开释放了所有工件，并开放了贡献流程以扩展基准的语言和文化覆盖范围。摘要未提供具体的评估数据集细节。\n- **领域归类**: [自然语言处理, 基准测试, 跨文化理解]\n---\n\n### 35. Which Agent's Skill Should Change? Group-Relative Credit Assignment for Evolving Multi-Agent Teams (哪个代理的技能应该改变？用于进化多代理团队的组相对信用分配)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27227)\n- **研究任务**: 在合作语言模型代理中，解决共享团队奖励归因不准确的问题（即“存在即责任”的误区），准确将信用分配给负责的代理和技能以优化可重用技能。\n- **核心亮点**: 提出 GRSE（组相对技能进化），受 GRPO 启发，通过在相同技能库下多次执行同一问题并对比执行结果来分配行为信用，同时对失败进行结构化诊断。\n- **深度解析**: 在 HotpotQA 和 LoCoMo 数据集上使用两个开放权重 actor 进行评估。GRSE 在 HotpotQA 和 LoCoMo 除开放域外的所有类别中均优于 MASkills，在多跳问题上提升最大（+6.7 和 +3.2 F1）。在鲁棒性测试中，从植入有害技能的库开始，GRSE 能正确归因并恢复干净库的分数（+6.3 分），而 MASkills 会错误归因导致分数下降。\n- **领域归类**: [多智能体系统, 强化学习, 信用分配]\n---\n\n### 36. From RL Papers to Framework Code: Inclusion and Review in Seven Open-Source Training Frameworks (从强化学习论文到框架代码：七个开源训练框架中的纳入与审查)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28027)\n- **研究任务**: 衡量开源强化学习（RL）后训练框架纳入新 RL 方法的频率和特征，分析学术界论文与工业界框架实现之间的转化与审查情况。\n- **核心亮点**: 追踪了七个开源框架的提交历史，并将其与 2025 年 1 月至 2026 年 6 月的 6939 篇 arXiv 论文关联。分析了 1598 篇提出通用 RL 训练方法的论文，发现只有 37 篇被至少一个框架纳入。\n- **深度解析**: 在五个季度队列中，180天内纳入的数量保持在 5 到 7 篇，而队列规模从 72 篇增长到 386 篇。被纳入的论文更常训练 30B 或更大参数规模的策略（41% 对 10%），且更常修改现有损失函数中的系数、裁剪、掩码或权重（29% 对 9%）。超过 90% 未被纳入的通用方法在框架的 issue/PR 中没有相关讨论。摘要未提供具体的框架名称列表。\n- **领域归类**: [强化学习, 开源框架, 科研生态]\n---\n\n### 37. WorldStream: Streaming Interactive 3D Worlds with Hierarchical Planning and Persistent State (WorldStream：具有分层规划和持久状态的流式交互 3D 世界)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28827)\n- **研究任务**: 构建一个开放式 3D 世界模型，同时实现超越预定义地图的可玩地形扩展、对运行中世界的开放式语言响应，以及恢复带有编辑记录的已访问地点。\n- **核心亮点**: 提出 WorldStream，采用类型化决策模型上的分层规划器，分为 Macro（宏观，修复定居点、生态等结构）和 Micro（微观，在测量地形下细化 tile 语义）。确定性局部代码将计划编译为地形、道路等。流式处理分离了规划与编译的时机。\n- **深度解析**: 世界记录保留了计划、种子、对象身份、可变状态和编辑，返回的 tile 会据此重新编译。模型可对现有实体（包括有状态 NPC）采取行动，编辑当前区域或将意图附加到未计划区域。摘要未提供具体的实验结果、数字和数据集。\n- **领域归类**: [计算机图形学, 世界模型, 3D生成]\n---\n\n### 38. ACE-Brain-0.6: Scaling Spatial Grounding for Physical Foundation Models (ACE-Brain-0.6：扩展物理基础模型的空间定位)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27040)\n- **研究任务**: 通过扩展视觉定位（visual grounding）来增强通用具身操作模型的感知基础，提高其在视觉干扰中确定与任务相关实体交互位置的空间感知能力。\n- **核心亮点**: 开发统一的数据管道，结合机器人操作记录与多源互补视觉数据，自动注释并转换为可验证的定位监督。使用约 150 万个样本微调 Qwen3.5-9B 得到 ACE-Brain-0.6。\n- **深度解析**: 在七个公开定位基准中的四个上超越 GPT-6 Astra，总体平均得分为 75.41，而 Astra 为 73.68。在固定的 Qwen3.5-9B 微调设置下，随着连续数据发布扩大训练集，聚合定位性能稳步提升。摘要未提供具体的基准测试数据集名称。\n- **领域归类**: [具身智能, 视觉定位, 多模态大模型]\n---\n\n### 39. VX-One: Typed, Calibrated Decision Heads for Real-Time Perimeter Triage (VX-One：用于实时边界分诊的类型化、校准决策头)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30090)\n- **研究任务**: 解决网络边界分诊中延迟与语义的权衡问题，即签名引擎快但对未知攻击盲目，而生成模型语义好但慢且输出不可解析。\n- **核心亮点**: 提出 VX-One，一个小型多头网络（100K-10M 参数），输出类型化决策原语（校准门、闭集选择、序数分数），多任务训练，每头温度校准（CPU 上 p50 约 0.7-1.7 ms）。评估了包含 Suricata（52,674 条规则）和 VX-One 的两阶段级联。\n- **深度解析**: 在 UNSW-NB15、CIC-IDS2017、EMBER2024 数据集上评估。VX-One 在 UNSW-NB15 和 CIC-IDS2017 的时间漂移下赢得检测（0.711 vs 0.637），但 XGBoost 赢得多类归因。留一法族门在 9/9 UNSW 折叠中检测到未见过的族，但在 CIC recon 族上低于随机。无负载重建中签名引擎仅解决约 0.1% 的流量，灰度区约 99.9% 由第二阶段恢复（联合召回率 \u003e=0.978）。校准在时间漂移下崩溃（ECE 0.04-\u003e0.40）。\n- **领域归类**: [网络安全, 异常检测, 机器学习应用]\n---\n\n### 40. Answering in the User's Variety: Calibrated Accommodation Pairs for Post-Training (以用户的变体回答：用于后训练的校准适应对)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28474)\n- **研究任务**: 解决聊天模型倾向于使用标准英语回复，而忽略用户所用方言（如 AAE、Singlish）的问题，研究后训练阶段如何改变模型匹配用户的倾向。\n- **核心亮点**: 追踪了从 SFT 到 DPO 和 RL 的每个后训练阶段对模型匹配用户倾向的影响。引入校准适应对（CAP），这是一种偏好数据，奖励匹配用户的方言密度，同时为标准英语用户保留标准英语。\n- **深度解析**: 在 10 个开放模型谱系上进行分析，发现后训练使回复标准化，且 DPO 更新仍倾向于匹配英国和澳大利亚拼写，而非 AAE 和 Singlish。在完全开放的模型上，CAP 提高了未训练特征的收敛性，且未增加标准英语用户的方言使用，也未损害指令跟随能力。摘要未提供具体的实验结果数字和数据集。\n- **领域归类**: [自然语言处理, 模型对齐, 社会语言学]\n---\n\n### 41. RubatoCodec: Budgeted Adaptive Speech Tokenization with Streaming Decoding (RubatoCodec：具有流式解码的预算自适应语音分词)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29434)\n- **研究任务**: 解决神经语音编解码器在可变帧率下序列长度随内容变化的问题，实现具有精确话语级事件预算和流式解码的语音分词。\n- **核心亮点**: 提出 RubatoCodec，基于 X-Codec-2 构建。其自适应触发机制利用编解码器特征和波形频谱的变化来划分语音事件，无需学习边界预测器，支持离散代码和显式时长表示，允许生成器逐事件进行预测和解码。\n- **深度解析**: 实验表明，自适应分配在低事件率下的重建保真度和可懂度优于固定速率编码。在大规模多语言语音上训练的模型在英语、日语和普通话上实现了具有竞争力的重建质量（具体评估基准数据集名称摘要未提供）。在匹配的文本到语音比较中，自适应表示降低了 WER 并提高了 UTMOS/UTMOSv2。生成器还能学习编解码器的事件预算，无需显式的生成时速率约束。\n- **领域归类**: [语音处理, 语音编解码, 文本到语音生成]\n---\n\n### 42. Toward Part-Aware Choral Transcription with singing voice assignment (面向具有演唱声部指派的声部感知合唱转录)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09861)\n- **研究任务**: 解决合唱自动音乐转录（AMT）中无法将女高音、女低音、男高音和男低音（SATB）转录为独立声部轨道的问题。\n- **核心亮点**: 提出 PawCT，据作者所知是首个端到端神经框架，能从合唱音频中识别活跃的 SATB 声部并转录为独立的音符级轨道。结合了声部特定的起始/结束/帧预测、声部存在估计，以及基于 SATB 音高范围的范围先验（RP）及其有序连续性（OC）扩展。\n- **深度解析**: 在 YouChorale 数据集上，PawCT-RP-OC 在 50 毫秒起始容差下达到 0.225 的宏声部感知音符 F1，比改编的合唱基线（0.165）高出 36.4%（具体基线模型名称摘要未提供）。其声部不可知变体 PagCT 达到 0.382 的 50 毫秒起始 F1，优于之前的 SOTA（0.237）。在 CSD 和 Cantoria 上进行了跨数据集评估。\n- **领域归类**: [音频处理, 音乐信息检索, 自动音乐转录]\n---\n\n### 43. Hidden Messages Between Diffusion Language Model Agents: Causal Evidence for Latent Communication (扩散语言模型智能体之间的隐藏信息：潜在通信的因果证据)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28905)\n- **研究任务**: 探究扩散语言模型（dLLM）智能体之间是否可以通过连续的隐藏状态传递紧凑的隐藏信息，并验证接收方是否能理解和使用该信息。\n- **核心亮点**: 提出“隐藏信息”机制，发送方将去噪状态压缩为四个带符号的密集向量，接收方在保留自身上下文的情况下消费这些向量。通过移除或替换信息来测试通道和内容的重要性。\n- **深度解析**: 实验提供了扩散 LM 智能体间连续隐藏通信的因果证据。在 Tiny-A2D 和 Dream-7B 上，移除信息分别导致 +63.6 和 +100.0 分的优势丧失。在 QASC 任务中，匹配通信准确率达 80.8%，错误示例信息降至 46.8%（内容效应 +34.0 分）。一次晚期传输达 87.8%，超过四次循环交换 7.0 分，表明信息转移的时机可能比交换次数更重要。\n- **领域归类**: [自然语言处理, 多智能体系统, 扩散语言模型]\n---\n\n### 44. DiffResearch: Accelerating Deep Research with Diffusion Language Models (DiffResearch：利用扩散语言模型加速深度研究)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28909)\n- **研究任务**: 解决深度研究系统因自回归模型从左到右解码导致的端到端延迟瓶颈问题。\n- **核心亮点**: 提出 DiffResearch，将扩散语言模型（dLLM）置于多智能体深度研究框架每个阶段的核心。引入 dFast 分解模式，在生成完成前读取中间去噪状态并提取子查询。\n- **深度解析**: 在 100 个 Deep Research Bench 任务上，扩散骨干网络端到端速度约快 6 倍，规划和写作时间减少一个数量级（具体对比的 AR 模型名称摘要未提供）。dFast 模式在单独分解时提供 1.99 倍中位数加速，不损失报告质量，并在 RACE 评估中获最佳整体分数。在公开排行榜快照中，基于更强扩散模型的实例排名高于多个商业系统（具体商业系统名称摘要未提供）。\n- **领域归类**: [自然语言处理, 智能体系统, 扩散语言模型, 深度研究]\n---\n\n### 45. ToM2Vec: Continuous Theory-of-Mind Tokens for Multi-Agent Coordination (ToM2Vec：用于多智能体协调的连续心智理论令牌)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.29934)\n- **研究任务**: 解决大型语言模型（LLM）智能体在文本表示空间中难以在不确定性下推理以捕获多个可能伙伴状态（心智理论，ToM）的问题。\n- **核心亮点**: 引入 ToM2Vec，通过固定预算的连续推理令牌在潜在空间学习形成抽象的心智理论。训练时监督来自伙伴的实际思想，测试时生成的 ToM 令牌作为智能体思想和行动的调节器。\n- **深度解析**: 在 Overcooked-AI、多方谈判等环境中，ToM2Vec 表现出一致提升（具体基线模型名称摘要未提供）。潜在推理至关重要，用文本表达会导致性能下降。训练可泛化到未见过的伙伴模型（包括 GPT-5.4）。分析表明，潜在令牌编码的是 ToM 而非特定任务信息，能提高回答关于伙伴信念、欲望和下一步行动的能力。\n- **领域归类**: [自然语言处理, 多智能体系统, 心智理论, 潜在推理]\n---\n\n### 46. VerifierBench: Benchmarking the Generation of Executable Verifiers for LLM Agents (VerifierBench：对 LLM 智能体生成可执行验证器的基准测试)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.28679)\n- **研究任务**: 研究验证器生成问题，即智能体根据指令和环境编写可执行验证器，以接受所有有效解并拒绝无效解。\n- **核心亮点**: 引入 VerifierBench，包含来自 6 个智能体基准的 222 个任务（具体基准名称摘要未提供），含 4993 个隐藏测试用例。引入 Verifier4Verifier (V4V) 六步审计筛选源验证器和测试套件。\n- **深度解析**: 19 个模型的归一化平衡准确率在 10.6 到 62.1 之间。生成的验证器拒绝无效解比接受有效解更可靠，但这掩盖了过度严格的验证：大多数错误拒绝来自于不接受任何测试解的验证器。案例研究揭示了关于解格式、工具使用和代码更改的无根据假设。建议测试验证器是否既接受正确解，又接受任务允许的其他解。\n- **领域归类**: [自然语言处理, 智能体评估, 基准测试, 代码验证]\n---\n\n### 47. Looped Uniform Diffusion Language Models (循环均匀扩散语言模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30066)\n- **研究任务**: 解决均匀扩散语言模型（UDLMs）因必须从不可靠上下文中去噪，导致比掩码扩散语言模型（MDLMs）更耗费 FLOPs 的问题，旨在提高训练效率。\n- **核心亮点**: 将选择性循环（在每个去噪步骤中递归应用少量早期 Transformer 层）引入 UDLMs，保持训练目标和采样器不变。\n- **深度解析**: 循环显著提高训练效率：循环 UDLMs 在 OpenWebText 上减少高达 2.8 倍、在 FineWeb-Edu 上减少 3.3 倍的训练 FLOPs，即可达到非循环 UDLMs 在约 0.5 万亿 token 上训练的验证 NLL（具体模型参数量摘要未提供）。在匹配的 NFE 预算下，生成困惑度比非循环低高达 9.8%。训练时更频繁采样较小循环计数，可在下游任务中减少 12% 的循环使用而不降低准确率。\n- **领域归类**: [自然语言处理, 扩散语言模型, 模型训练优化]\n---\n\n### 48. Exploring The Empirical Privacy Landscape of Synthetic Data (探索合成数据的经验隐私景观)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22659)\n- **研究任务**: 研究在敏感数据上训练语言模型时，数据级和训练级干预措施如何在能力增益与隐私泄露风险之间取得平衡。\n- **核心亮点**: 在带有金丝雀（canaries）的合成医疗记录上进行受控比较（具体数据集名称摘要未提供）。提出隐私感知重写，通过唯一性感知指令替换私人细节来指导合成数据生成。\n- **深度解析**: 直接微调能力最强但泄露最多，DP-SGD 减少泄露但损害能力。生成合成数据提供了更好平衡，特别是隐私感知重写相比天真释义提高了隐私保护。能力更强的重写模型通常降低下游泄露风险，但测试时计算增加带来的收益不一致。\n- **领域归类**: [自然语言处理, 隐私与安全, 合成数据, 医疗 NLP]\n---\n\n### 49. Quant-Arena: Benchmarking LLM Agents for Quantitative Trading Research (Quant-Arena：量化交易研究 LLM 智能体基准测试)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.30113)\n- **研究任务**: 评估大型语言模型（LLM）是否能完成量化研究的完整循环（提出假设、实现信号、历史测试、决策），而不仅仅是评估公式或代码。\n- **核心亮点**: 引入 Quant-Arena，用于真实 A 股市场数据端到端量化研究的基准和排行榜。模型构建特征和评分代码，在 2022-2023 年接收反馈，并冻结策略在 2024 年评估。\n- **深度解析**: 使用现金账户评估器应用交易约束和成本（包括模拟订单簿估计的市场影响）。分数由实现超额收益主导。评估了 9 个前沿模型，GPT-6 Astra 得分最高，但没有模型在 2024 年击败等权市场（其余 8 个模型名称摘要未提供）。\n- **领域归类**: [自然语言处理, 智能体评估, 量化金融, 基准测试]\n---\n\n### 50. Design Anything, Design at Scale (设计万物，规模化设计)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.24771)\n- **研究任务**: 解决智能体 AI 在长周期和大规模项目中保持与设计意图对齐，以及多个工件之间意图保留的挑战。\n- **核心亮点**: 引入 Design Anything，通过意图-执行图将设计意图保留在模型外部，并将交付物绑定到工作流步骤。引入 DesignAnything-Bench，包含 19 个设计领域的 228 个任务（具体领域名称摘要未提供）。\n- **深度解析**: 在固定 LLM 下，Design Anything 使用 DeepSeek V4.1 Flash High 和 GPT-5.6 Sol High 分别满足 85.0% 和 92.5% 的简报事实约束，比最强同模型基线高出 15.4% 和 14.4%。在 24 个工件任务中增益达 25.1% 和 23.0%。在 19 个领域中的 18 个领域约束满足领先或持平。专业设计师在盲评中偏好其完整的交付物集。\n- **领域归类**: [自然语言处理, 智能体系统, 多模态生成, 设计自动化]\n---\n\n### 51. Language Models Learn to Improve Language Models (语言模型学会改进语言模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.23344)\n- **研究任务**: 利用大语言模型自动化语言模型的研发改进，探索递归自我改进的路径。具体而言，训练 LLM 通过强化学习生成有效的语言模型改进提案。\n- **核心亮点**: 提出 LM2LM 框架，使用研究世界模型（RWM）作为强化学习的奖励模型来提供可扩展的反馈信号。RWM 是一个冻结的 LLM，根据上下文中的真实实验记录预测提案收益。同时，定期执行当前策略中 RWM 排名靠前的提案，并将实测结果加入上下文以维持反馈可靠性。\n- **深度解析**: 该方法针对两个核心挑战进行设计：一是真实反馈训练成本极高（强化学习需要评估数万个提案，每个提案可能需要完整的模型训练运行）；二是代理反馈在策略优化过程中可能因提案分布偏移而变得不可靠。摘要未提供具体的训练超参数或 RWM 的架构细节。实验在八个自回归和扩散语言模型开发环境中进行评估，LM2LM 使 Qwen3.8-27B 在留出任务上的真实执行评估中超越了 GPT-6-sol（即使后者在上下文中获得了 300 条真实实验记录），同时数据生成成本降低了 33%。此外，LM2LM 还能泛化到训练期间未见过的模型家族。\n- **领域归类**: [大语言模型, 强化学习, AI自动化研究, 递归自我改进]\n---\n\n### 52. RoboCasa-Shift: Stage-Aware Robustness Evaluation of Vision-Language-Action Policies in Long-Horizon Household Manipulation (RoboCasa-Shift：长时程家庭操作任务中视觉-语言-动作策略的阶段感知鲁棒性评估)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.27861)\n- **研究任务**: 构建一个诊断性鲁棒性基准，用于评估视觉-语言-动作（VLA）策略在长时程家庭操作任务中面对分布偏移时的鲁棒性表现，揭示传统聚合任务成功率所掩盖的失败模式。\n- **核心亮点**: 提出 RoboCasa-Shift 基准，基于 RoboCasa365 构建，结合了受控单因素偏移、匹配(clean-perturbed)成对轨迹（每对共享相同底层设置，仅在目标偏移因素上不同），以及基于仿真器的阶段感知诊断方法。对 GR00T N1.5 在四个长时程任务上进行了评估，涵盖四种扰动因素和三个校准严重度级别，共计 1,040 次正式轨迹运行。\n- **深度解析**: 研究发现 VLA 的鲁棒性响应在不同因素和任务间差异显著，且增加严重度并不总是导致单调性能下降。例如，某种相机条件下端到端成功率变化 ΔSR=0，但 80 个匹配轨迹中有 8 个的结果发生了改变。阶段感知分析进一步表明，相同的端到端性能下降可能对应不同的执行深度分布：相机 L_2 和高斯模糊 L_1 均产生 ΔSR=0.188，但第一阶段失败率分别为 19.0% 和 36.4%。这些发现表明 VLA 鲁棒性应被视为执行过程的多维属性，而非单一的端到端性能指标。代码已公开。摘要未提供具体的模型训练细节或更多量化实验结果。\n- **领域归类**: [机器人操作, 视觉-语言-动作模型, 鲁棒性评估, 基准测试, 家庭服务机器人]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [fastapi/fastapi](https://github.com/fastapi/fastapi)\n- **今日趋势**: 103,595 stars / 10,083 forks / 今日新增 96 stars\n- **项目简介**: 一个高性能、易学、编码快速且适用于生产环境的 Python Web 框架。\n- **核心价值**: \n  - **项目用途**: 用于构建高性能的后端服务和 Web API。\n  - **目标人群**: 后端开发者、Python 程序员。\n  - **技术核心**: 基于 Python 的高性能 Web 框架技术。\n  - **AI/大模型相关性**: 否。\n\n---\n\n### [Z4nzu/hackingtool](https://github.com/Z4nzu/hackingtool)\n- **今日趋势**: 81,265 stars / 9,160 forks / 今日新增 51 stars\n- **项目简介**: 面向黑客的多合一综合黑客工具集。\n- **核心价值**: \n  - **项目用途**: 提供一站式的黑客与渗透测试工具集合。\n  - **目标人群**: 黑客、安全研究人员、渗透测试人员。\n  - **技术核心**: 集成多种黑客工具的聚合平台技术。\n  - **AI/大模型相关性**: 否。\n\n---\n\n### [NanmiCoder/MediaCrawler](https://github.com/NanmiCoder/MediaCrawler)\n- **今日趋势**: 67,706 stars / 12,905 forks / 今日新增 108 stars\n- **项目简介**: 支持小红书、抖音、快手、B站、微博、百度贴吧、知乎等主流社交媒体的图文、视频及评论爬虫工具。\n- **核心价值**: \n  - **项目用途**: 抓取国内各大主流社交媒体平台的内容数据（笔记、视频、帖子、评论等）。\n  - **目标人群**: 数据分析师、爬虫开发者、新媒体运营人员。\n  - **技术核心**: 针对各大社交平台（小红书、抖音、快手、B站、微博、贴吧、知乎）的数据抓取与解析技术。\n  - **AI/大模型相关性**: 否。\n\n---\n\n### [BerriAI/litellm](https://github.com/BerriAI/litellm)\n- **今日趋势**: 61,826 stars / 12,576 forks / 今日新增 101 stars\n- **项目简介**: 一个极速的 AI 网关，支持通过统一格式调用 100 多种大语言模型 API。\n- **核心价值**: \n  - **项目用途**: 作为 AI 网关统一管理、调用和监控多种大语言模型（LLM）API，提供成本追踪、安全护栏、负载均衡和日志记录。\n  - **目标人群**: AI 应用开发者
