- **核心亮点**: 用业务规则做课程学习，防止模型在学工具检索时忘记原有知识。
- **深度解析**: 企业里微调 LLM 去调用工具，容易导致模型忘记原本的业务知识（灾难性遗忘）。这篇提出了 TRACE 方法，设计了一套基于业务规则的推理训练课程。让模型循序渐进地学习如何检索工具，同时在训练中加入知识保留约束。效果是在提升工具调用准确率的同时，保住了模型原有的业务理解能力。
- **领域归类**: [Enterprise AI, Tool Use, Fine-tuning]

### 24. Evidence Attribution in Visual Document Understanding without Coordinates or Region Labels (无需坐标或区域标签的视觉文档理解证据归因)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.24651)
- **研究任务**: 视觉文档理解 (VDU)
- **核心亮点**: 不用标坐标框也能让模型知道答案出自文档的哪个部分。
- **深度解析**: 通常做文档理解需要人工标注答案对应的坐标框，成本很高。这篇论文提出了一种新方法，不需要区域标签（Region Labels）。模型通过注意力机制或内部特征对齐，自动定位证据来源。技术方案省去了繁琐的标注环节，降低了数据准备成本，同时保持了证据归因的可解释性。
- **领域归类**: [Multimodal, Document AI]

### 25. Characterizing Warp Divergence from Pascal to Blackwell (从 Pascal 到 Blackwell 的 Warp 发散特征分析)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.23402)
- **研究任务**: GPU 架构性能分析
- **核心亮点**: 分析了历代 NVIDIA GPU 的 Warp 发散情况，给底层优化提供参考。
- **深度解析**: 这是一篇系统层面的论文。主要测试了从 Pascal 架构到最新 Blackwell 架构的 GPU 在线程束（Warp）发散上的表现。方法是运行一系列基准测试，统计不同架构下的指令执行效率。结果揭示了新架构在处理分支发散时的改进，对写 CUDA  kernel 和优化高性能计算任务有直接指导意义。
- **领域归类**: [Systems, GPU Architecture, HPC]

### 26. UltraViT: Latency-Optimized On-device Vision Encoder for Large Vision-Language Models (UltraViT：大型视觉语言模型的低延迟端侧视觉编码器)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.23373)
- **研究任务**: 端侧大型视觉语言模型 (LVLM)
- **核心亮点**: 专门优化了延迟，让视觉编码器能跑在手机等边缘设备上。
- **深度解析**: 大模型的视觉编码器通常太大，端侧跑不动。这篇提出了 UltraViT，通过剪枝、量化或结构重设计，大幅降低了计算延迟。技术方案是在保持特征提取能力的前提下，减少参数量和计算复杂度。效果是能在不显著损失精度的情况下，实现实时的端侧视觉处理。
- **领域归类**: [Computer Vision, Edge AI, Model Optimization]
