### 1. DanceOPD: On-Policy Generative Field Distillation (DanceOPD：_on-policy_ 生成场蒸馏)
- **社区热度**: `👍 52 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.27377)
- **研究任务**: 生成模型蒸馏
- **核心亮点**: 提出了一种_on-policy_ 策略，用于将大型生成模型的知识蒸馏到小型模型中。
- **深度解析**: 传统蒸馏多用离线数据，这篇主张用当前策略采样出的_on-policy_ 数据进行蒸馏，能更好地匹配生成分布。技术上是构建了一个生成场（Generative Field），让学生模型直接在采样过程中学习老师模型的分布特征，减少分布偏移。
- **领域归类**: [生成模型], [模型压缩]
---

### 2. ViQ: Text-Aligned Visual Quantized Representations at Any Resolution (ViQ：任意分辨率下的文本对齐视觉量化表示)
- **社区热度**: `👍 34 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.27313)
- **研究任务**: 多模态表示学习
- **核心亮点**: 实现了一种不受输入分辨率限制的视觉量化方法，且能与文本嵌入对齐。
- **深度解析**: 解决了现有视觉量化模型（如 VQ-VAE）对分辨率敏感的问题。通过设计特定的量化码本和对齐损失，让视觉 token 在不同分辨率下保持一致性，并直接映射到文本空间，方便下游多模态任务调用。
- **领域归类**: [多模态], [表示学习]
---

### 6. JetSpec: Breaking the Scaling Ceiling of Speculative Decoding with Parallel Tree Drafting (JetSpec：用并行树草稿打破推测解码的扩展 ceiling)
- **社区热度**: `👍 19 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.18394)

- **深度解析**: 传统推测解码是串行生成草稿。这篇改用树状结构并行生成多个候选路径，再利用验证机制一次性接受最长匹配路径。减少了验证次数，提高了吞吐量，尤其在长序列生成上效果明显。
- **领域归类**: [LLM 推理], [系统优化]
