### 1. Long-Horizon-Terminal-Bench: Testing the Limits of Agents on Long-Horizon Terminal Tasks with Dense Reward-Based Grading (长周期终端任务基准：基于密集奖励评分的 Agent 极限测试)
- **社区热度**: `👍 41 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.08964)
- **研究任务**: Agent 长周期任务评估
- **核心亮点**: 提出了一个使用密集奖励信号而非二元成功/失败评分的 Agent 基准测试。
- **深度解析**: 针对终端任务构建了一套长周期测试集，传统评估只看最终成败，这篇工作引入了密集奖励 grading，能更细粒度地区分 Agent 在长序列任务中的表现差异，便于定位中间步骤的错误。
- **领域归类**: `[Agent, Evaluation]`
---

### 2. Scalable Visual Pretraining for Language Intelligence (面向语言智能的可扩展视觉预训练)
- **社区热度**: `👍 39 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.09657)
- **研究任务**: 多模态预训练
- **核心亮点**: 验证了大规模视觉预训练能直接提升模型的语言智能任务表现。
- **深度解析**: 不在语言数据上死磕，而是通过扩大视觉预训练数据的规模，将视觉中学到的结构和推理能力迁移到语言任务上，证明了跨模态 scaling 的有效性。
- **领域归类**: `[Multimodal, LLM]`
---

### 3. Video Generation Models are General-Purpose Vision Learners (视频生成模型是通用视觉学习者)
- **社区热度**: `👍 34 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.09024)
- **研究任务**: 视觉表示学习
- **核心亮点**: 发现视频生成模型无需重度微调即可作为有效的通用视觉编码器。
- **深度解析**: 把训练好的视频生成模型拿来直接做下游视觉任务，发现其内部特征包含了鲁棒的时空信息，省去了专门训练视觉编码器的成本，实现了生成模型的多用途复用。
- **领域归类**: `[Video, Representation Learning]`
---

### 4. Trust Region Policy Distillation (信任域策略蒸馏)
- **社区热度**: `👍 17 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.04751)
- **研究任务**: 强化学习策略蒸馏
- **核心亮点**: 在策略蒸馏过程中引入信任域约束以防止性能崩塌。
- **深度解析**: 针对蒸馏过程中学生策略偏离教师策略过大的问题，限制了更新步长，确保蒸馏过程中的稳定性，特别适合强化学习场景下的策略迁移。
- **领域归类**: `[RL, Distillation]`
---

### 5. KronQ: LLM Quantization via Kronecker-Factored Hessian (KronQ：基于克罗内克因子化海森矩阵的 LLM 量化)
- **社区热度**: `👍 12 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.07964)
- **研究任务**: 大模型量化
- **核心亮点**: 利用克罗内克因子化近似海森矩阵来实现高精度的低比特量化。
- **深度解析**: 量化通常会损失精度，这篇工作用二阶信息（海森矩阵）来识别敏感权重，但为了计算效率用了克罗内克因子分解近似，在保持低显存占用的同时减少了量化误差。
- **领域归类**: `[Efficiency, Quantization]`
---

### 6. From RGB Generation to Dense Field Readout: Pixel-Space Dense Prediction with Text-to-Image Models (从 RGB 生成到密集场读取：基于文生图模型的像素空间密集预测)
- **社区热度**: `👍 9 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.06553)
- **研究任务**: 密集预测任务
- **核心亮点**: 复用文生图模型进行深度、法线等像素级密集预测任务。
- **深度解析**: 不训练专门的编码器，而是从扩散模型的生成过程中提取中间特征图，直接读取像素空间的密集信息，证明了生成模型内部蕴含了几何结构知识。
- **领域归类**: `[Computer Vision, Generation]`
---

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.09661)
- **研究任务**: 全景图像生成
- **核心亮点**: 实现了高保真度的真实世界 360 度全景图像生成。
- **深度解析**: 解决了全景图生成中常见的投影失真和全局不一致问题，通过特定的生成架构优化，确保生成的全景图在拼接处无缝且符合真实世界物理规律。
- **领域归类**: `[Image Generation, 360 Vision]`

### 8. Self-Guided Test-Time Training for Long-Context LLMs (长上下文 LLM 的自引导测试时训练)
- **社区热度**: `👍 7 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.09415)
- **研究任务**: 测试时训练 / 长上下文
- **核心亮点**: 在推理阶段通过自引导机制自适应调整模型以应对长上下文。
- **深度解析**: 针对长上下文导致的性能下降，在测试时利用输入数据本身对模型状态或参数进行微调，不需要额外标注，缓解了长序列下的遗忘或注意力分散问题。
- **领域归类**: `[LLM, Inference]`

### 9. Towards Mechanistically Understanding Why Memorized Knowledge Fails to Generalize in Large Language Model Finetuning (迈向机理理解：为何大模型微调中记忆知识无法泛化)
- **社区热度**: `👍 5 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.08393)
- **研究任务**: 可解释性 / 微调
- **核心亮点**: 从机理层面分析了微调过程中记忆知识为何难以泛化到新数据。
- **深度解析**: 使用可解释性工具追踪模型内部的知识存储路径，发现微调时模型倾向于死记硬背特定样本而非学习通用规律，指出了导致过拟合的具体神经元激活模式。
- **领域归类**: `[Interpretability, LLM Training]`
---

### 10. Flow-ERD: Agent-type Aware Flow Matching with Entropy-Regularized Distillation for Diverse Traffic Simulation (Flow-ERD：基于熵正则蒸馏的代理类型感知流匹配用于多样交通仿真)
- **社区热度**: `👍 4 Upvotes`

- **研究任务**: 交通仿真 / 流匹配

- **深度解析**: 在生成交通流时，不仅考虑匹配真实分布，还通过熵正则化鼓励生成结果的多样性，同时区分不同类型的代理（如轿车、卡车），使仿真场景更丰富真实。
- **领域归类**: `[Simulation, Generative Models]`
