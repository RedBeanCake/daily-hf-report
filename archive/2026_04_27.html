### 1. Agentic World Modeling: Foundations, Capabilities, Laws, and Beyond (智能体世界建模：基础、能力、定律及展望)
- **社区热度**: `👍 140 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.22748)
- **研究任务**: 智能体与世界模型的理论框架构建
- **核心亮点**: 系统性地定义了智能体在世界模型中的基础能力边界与交互定律。
- **深度解析**: 文章没有提出单一模型，而是梳理了 Agentic World Modeling 的理论地基。它讨论了智能体如何在世界模型中进行感知、规划与行动，提出了若干交互定律，旨在统一当前分散的智能体与世界模型研究，为后续构建更通用的仿真环境提供理论支撑。
- **领域归类**: [Agent, World Model, Theory]

### 2. Video Analysis and Generation via a Semantic Progress Function (基于语义进度函数的视频分析与生成)
- **社区热度**: `👍 30 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.22554)
- **研究任务**: 视频生成与理解
- **核心亮点**: 提出语义进度函数，通过语义状态变化而非帧间预测来控制视频生成。
- **深度解析**: 传统视频生成多依赖像素或潜空间的时间连续性，该方法引入一个显式的“语义进度函数”，将视频内容映射为语义状态的演进。生成和分析过程均围绕该函数进行，从而更好地控制视频内容的逻辑连贯性和语义一致性。
- **领域归类**: [Video Generation, Computer Vision]
---

### 3. DiffNR: Diffusion-Enhanced Neural Representation Optimization for Sparse-View 3D Tomographic Reconstruction (DiffNR：扩散增强的神经表示优化用于稀疏视角 3D 断层重建)
- **社区热度**: `👍 26 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.21518)
- **研究任务**: 3D 重建（稀疏视角）
- **核心亮点**: 利用扩散模型先验增强神经表示，解决稀疏视角下的重建模糊问题。
- **深度解析**: 针对断层扫描中视角数据不足导致的重建质量下降，该方法在神经表示优化过程中嵌入扩散模型先验。通过扩散模型提供的分布约束，补偿稀疏数据缺失的信息，显著提升了 3D 重建的清晰度和几何准确性。
- **领域归类**: [3D Vision, Diffusion Model, Reconstruction]
---

### 4. LLM Safety From Within: Detecting Harmful Content with Internal Representations (源自内部的 LLM 安全：利用内部表示检测有害内容)
- **社区热度**: `👍 21 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.18519)
- **研究任务**: LLM 安全与对齐
- **核心亮点**: 不依赖输出文本，直接通过模型内部隐藏层状态检测有害内容。
- **深度解析**: 传统安全过滤多在输出层进行，该方法转向模型内部表示。通过探针或分类器监控隐藏层激活模式，在生成完成前识别潜在的危害意图。这种方法更底层，能捕捉到输出文本尚未显现的风险信号。
- **领域归类**: [LLM Safety, Interpretability]
---

### 5. FlowAnchor: Stabilizing the Editing Signal for Inversion-Free Video Editing (FlowAnchor：稳定免反转视频编辑的编辑信号)
- **社区热度**: `👍 10 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.22586)
- **研究任务**: 视频编辑
- **核心亮点**: 设计锚点机制稳定流匹配模型的编辑信号，无需耗时的反向扩散过程。
- **深度解析**: 针对基于流匹配（Flow Matching）的视频编辑，提出 FlowAnchor 模块。它在编辑过程中固定关键信号锚点，防止编辑方向漂移，从而实现了无需图像反转（Inversion）即可保持视频时序一致性的编辑效果，降低了计算成本。
- **领域归类**: [Video Editing, Generative Model]
---

- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.22436)

- **深度解析**: 现有基准多在封闭环境，该工作构建了“野外”搜索场景。它包含多样化的信息检索任务和决策路径，用于评估智能体在不可控真实环境中的搜索策略、工具使用及信息整合能力，填补了开放域 agent 评测的空白。

### 7. Contexts are Never Long Enough: Structured Reasoning for Scalable Question Answering over Long Document Sets (上下文永远不够长：面向长文档集可扩展问答的结构化推理)
- **社区热度**: `👍 7 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.22294)
- **研究任务**: 长上下文问答
- **核心亮点**: 通过结构化推理方法，突破上下文窗口限制处理长文档集问答。
- **深度解析**: 针对文档集合长度超出模型上下文窗口的问题，该方法不单纯依赖扩展窗口，而是将推理过程结构化。通过分块、索引和结构化推理链，使模型能可扩展地处理海量文档，避免信息丢失且保持推理逻辑完整。
- **领域归类**: [LLM, Long Context, QA]

### 11. Sessa: Selective State Space Attention (Sessa：选择性状态空间注意力)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.18580)
- **研究任务**: 序列建模效率优化
- **核心亮点**: 提出一种选择性机制，动态混合状态空间模型（SSM）与注意力机制，兼顾长序列建模能力与计算效率。
- **深度解析**: 针对传统 Attention 计算成本高、纯 SSM 模型细节捕捉弱的问题，设计了一个门控选择模块。该模块根据 token 重要性，自动分配使用 SSM 还是 Attention 进行处理。这样既保留了 SSM 的线性复杂度优势，又在关键位置保留了 Attention 的全局交互能力，适合长上下文场景。
- **领域归类**: [模型架构] [效率优化] [序列建模]
---

### 12. EmbodiedMidtrain: Bridging the Gap between Vision-Language Models and Vision-Language-Action Models via Mid-training (EmbodiedMidtrain：通过中期训练弥合视觉语言模型与视觉语言动作模型之间的差距)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.20012)
- **研究任务**: 具身智能模型训练策略
- **核心亮点**: 在视觉语言预训练和动作微调之间引入“中期训练”阶段，有效对齐视觉语言特征与机器人动作空间。
- **深度解析**: 直接使用 VLM 微调为 VLA 模型常因分布差异导致效果不佳。该方法增加了一个中间步骤，利用机器人轨迹数据对模型表征进行适配，但不直接训练动作头。这一步骤缩小了通用视觉语言特征与具体控制信号之间的鸿沟，提升了后续微调的收敛速度和最终策略性能。
- **领域归类**: [具身智能] [机器人学习] [多模态]
---

- **领域归类**: [信息检索] [垂直领域应用] [自然语言处理]

### 14. DiagramBank: A Large-scale Dataset of Diagram Design Exemplars with Paper Metadata for Retrieval-Augmented Generation (DiagramBank：一个带有论文元数据的大规模图表设计范例数据集，用于检索增强生成)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.20857)
- **研究任务**: 多模态数据集构建与 RAG
- **核心亮点**: 发布大规模图表数据集，包含图表图像及对应论文元数据，用于增强生成系统对图表的检索与理解能力。
- **深度解析**: 现有 RAG 系统多针对文本，缺乏对科学图表的有效支持。该工作收集了大量论文中的图表，并关联了标题、摘要、章节等元数据。这些数据可用于训练多模态检索器，使模型在生成报告或论文时，能够检索并参考高质量的图表设计范例，提升生成内容的专业性和可视化质量。
- **领域归类**: [数据集] [多模态] [检索增强生成]

### 15. Learning Evidence Highlighting for Frozen LLMs (为冻结大语言模型学习证据高亮)
