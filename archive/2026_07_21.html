### 11. Group Entropy-Controlled Policy Optimization (组熵控制策略优化)

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.16850)

- **深度解析**: 传统 PPO 算法通常对每个 token 或动作单独计算熵损失，容易导致探索噪声过大。该方法提出在组级别（如一个完整句子或语义段）计算熵值，约束整体分布而非局部点。这样既保留了必要的探索能力，又避免了策略在训练早期崩塌，实验显示在复杂指令跟随任务上收敛更快。
- **领域归类**: [强化学习] [大模型对齐]
