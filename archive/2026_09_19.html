    <h1>前沿科研情报 - 2026-09-19</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. DeepSeek-V4.1-Flash: Pushing the Limits of KV Cache Compression (DeepSeek-V4.1-Flash：将KV Cache压缩推向极限)\n- **社区热度**: `👍 51 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19969)\n- **研究任务**: 解决长上下文代理工作负载中预填充计算昂贵、大KV缓存对HBM和SSD容量及数据传输带宽造成压力的问题，从而降低模型部署成本。\n- **核心亮点**: 提出DeepSeek-V4.1-Flash，一个拥有552B骨干参数的多模态MoE模型，支持高达100万token的上下文。采用因果编码器-解码器（CED）架构，解码时每个token激活16B参数，预填充时仅激活8B。结合CSA2中的跨层KV缓存重用与FP4 KV缓存，将全局KV缓存占用降至每token 890字节（约为DeepSeek-V4-Flash的1/4）。通过SWA Bounded Replay优化，持久KV缓存占用降至约1/8。\n- **深度解析**: 该研究通过引入CED架构和创新的KV缓存压缩技术，从根本上缓解了长上下文代理的内存和带宽瓶颈。其核心思想在于区分预填充和解码阶段的计算需求，实现参数的差异化激活，并结合专门的部署优化，在大幅降低存储占用的同时保持了优异的性能。关于具体的硬件部署细节或更底层的算子优化，摘要未提供。\n- **领域归类**: [大语言模型, 模型架构, 推理优化, 多模态]\n---\n\n### 2. SoL-Pi: Recursively Scaling Auto-Research Loops for Efficient Agent Harness (SoL-Pi：递归扩展自动研究循环以实现高效的代理控制框架)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20519)\n- **研究任务**: 提高编码代理在无人值守、全天候探索中的token效率，以扩展递归自我改进过程。\n- **核心亮点**: 采用受递归自我改进（RSI）启发的方法，在控制框架（harness）层扩展自动研究循环。提出SoL-Pi，包含四种机制：动作执行、上下文压缩、观察处理和委托阅读。在51个任务的EdgeBench评估中，在GPT-5.6 Sol和Opus 5上达到与Pi相当的性能，同时减少44.7-49.0%的token流量，降低约三分之一的API成本。\n- **深度解析**: 该研究将优化重点从模型本身转移到代理的控制框架层，通过精简上下文和观察处理等机制，在不损失任务性能的前提下大幅降低了API调用成本和token消耗。关于这四种机制的具体算法实现细节，摘要未提供。\n- **领域归类**: [AI代理, 代码生成, 系统优化, 自动化研究]\n---\n\n### 3. An Empirical Study of Harness Design for Coding Agents (编码代理控制框架设计的实证研究)\n- **社区热度**: `👍 33 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20804)\n- **研究任务**: 研究编码代理控制框架中各个独立组件（规划、动作空间、上下文管理）的有效性，以指导模型和预算感知的框架设计。\n- **核心亮点**: 使用轻量级控制框架，在SWE-Bench Verified和Terminal-Bench 2.1上评估4个模型的176种匹配设置。发现：1. 上下文管理在上下文窗口预算紧张时价值增加，主要防止溢出失败；2. 在基于LLM的摘要前进行基于规则的省略效率最高；3. 规划对弱模型是准确率支架，对强模型是成本节约器；4. 预定义工具对bash能力弱的模型有帮助，而bash能力强的模型仅用bash接口成本更低。\n- **深度解析**: 该研究通过解耦控制框架的各个组件，打破了以往将框架视为黑盒整体的评估方式。其结论揭示了不同能力模型对框架组件的差异化需求，为未来开发模块化、自适应的编码代理系统提供了重要的实证依据。关于176种匹配设置的具体配置参数，摘要未提供。\n- **领域归类**: [AI代理, 软件工程, 实证研究, 系统评估]\n---\n\n### 4. JEPA-Anything: Learning Predictive Models across Different Worlds (JEPA-Anything：在不同世界中学习预测模型)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20800)\n- **研究任务**: 探索一种通用的学习原则，以支持在截然不同的系统（跨领域）中进行世界建模。\n- **核心亮点**: 提出JEPA-Anything，一个基于正交预测分解（OPF）的领域无关框架。将潜在目标分解为互补因子，通过专用路径学习并在共享预测设计中重组。在视觉、生物、临床轨迹等7个领域进行评估。在10个匹配的动力学任务中提升指标，在Interventional Pong上单干预预测误差降低34.8%。在4个系统中实现最低的分子误差。生物干预获得实验支持，潜在轨道模式恢复开普勒缩放指数（拟合斜率-1.4991）。\n- **深度解析**: 该研究突破了传统预测模型局限于单一领域的瓶颈，通过正交预测分解机制实现了跨领域的通用世界建模。其不仅在多个基准任务中取得优异性能，还将世界建模与科学发现相结合，展现了通用人工智能在科学探索中的潜力。关于OPF框架的具体数学推导和损失函数设计，摘要未提供。\n- **领域归类**: [世界模型, 表征学习, 科学发现, 跨领域学习]\n---\n\n### 5. When EOS Tokens Disagree: Understanding Length Inflation in On-Policy Distillation (当EOS Token产生分歧：理解在策略蒸馏中的长度膨胀问题)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20511)\n- **研究任务**: 研究在策略蒸馏（OPD）中学生模型响应变得过长甚至耗尽生成预算的“长度膨胀”现象及其成因。\n- **核心亮点**: 发现基础学生模型和后置训练教师模型之间的终止token（EOS）不匹配是该行为的重要来源。在Qwen3、Llama和Gemma中，即使声明的停止集相同，两个模型也可能将停止概率放在不同的EOS token上。仅对齐解码停止集是不够的，而将功能等效的EOS token视为共享的语义停止动作可大幅缓解长度膨胀。此外，终止偏好在训练的不同阶段会发生显著变化。\n- **深度解析**: 该研究深入剖析了模型蒸馏过程中常见的“长度膨胀”问题的底层机制，指出这源于教师与学生模型在终止信号语义对齐上的细微偏差。这一发现为优化大模型蒸馏流程、控制生成成本提供了极具操作性的改进方向。关于K2-Horizon训练阶段的具体超参数设置，摘要未提供。\n- **领域归类**: [模型蒸馏, 大语言模型, 训练优化, 机制分析]\n---\n\n### 6. RiskChainBench: A Benchmark for Obfuscated Platform Message Restoration and Evidence-Grounded Web Investigation (RiskChainBench：混淆平台消息恢复与基于证据的网络调查基准)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16900)\n- **研究任务**: 评估模型在恢复被混淆的恶意平台消息并基于证据调查相关高风险网页方面的能力。\n- **核心亮点**: 提出RiskChainBench，包含3600个合成token-文本恢复输入和600个对应的人工标注本地网络环境。模型需先恢复消息、意图和目的地，然后作为VLM驱动的网络代理调查网站并生成带证据的风险报告。在10个模型中，入口Top-1准确率在35.2%到95.2%之间，网络决策准确率在26.3%到62.8%之间。执行失败占网络运行的31.9%，表明稳定的探索和风险判断是主要瓶颈。\n- **深度解析**: 该研究针对网络黑灰产中常见的混淆引流手段，构建了一个端到端的评测基准。它不仅考察模型对复杂混淆文本的解码能力，还要求模型具备在真实网络环境中进行自主信息搜集和证据固定的能力，填补了相关联合评估的空白。关于本地沙盒环境的具体技术架构，摘要未提供。\n- **领域归类**: [安全与对齐, 网络代理, 基准测试, 多模态]\n---\n\n### 7. RetireOPD: Self-Retiring On-Policy Distillation for Agentic Reinforcement Learning (RetireOPD：用于代理强化学习的自退休在策略蒸馏)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20784)\n- **研究任务**: 解决多轮代理强化学习中，自教师监督收益随阶段变化以及特权信息不足以保证教师可靠性的问题。\n- **核心亮点**: 提出RetireOPD，首先优化一个解耦的、技能条件的教师，然后联合使用RL和OPD训练无技能的学生。采用“自适应退休”机制：当学生与教师的差异停止缩小且学生达到教师成功率的目标比例时，学生自动放弃教师，仅使用RL继续训练。在Qwen2.5（1.5B到7B）上，ALFWorld成功率提高14.1%至18.8%，WebShop准确率提高11.8%至19.0%，并在所有设置中超越其技能条件教师。\n- **深度解析**: 该研究针对代理强化学习中教师-学生蒸馏框架的局限性，创新性地引入了“自适应退休”机制。它允许学生模型在吸收教师的特权技能后自动“断奶”，避免了过度依赖教师带来的性能天花板，实现了学生模型在复杂多轮交互任务中的自我进化。关于“目标 fraction”的具体数值设定，摘要未提供。\n- **领域归类**: [强化学习, 代理系统, 模型蒸馏, 训练策略]\n---\n\n### 8. Reflect, Revise, Reuse: Training-Free Skill Evolution for GUI Agents (反思、修订、重用：GUI代理的免训练技能进化)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.17653)\n- **研究任务**: 解决GUI代理在执行长视野任务时因动态界面变化导致固定计划失效的问题，使技能能够在部署时通过执行反馈进行修订，而无需额外训练。\n- **核心亮点**: 提出EvoSkill-GUI，一个免训练框架。每个技能是一个结构化的多文件包（包含检索元数据、可执行计划、备用定位、故障恢复规则等）。通过“反思-修订-重用”循环运行：执行器进行即时修订，隔离的批评家诊断失败轨迹，执行器通过受限工具接口编辑特定技能文件。在MobileWorld、AndroidWorld和OSWorld上，无需训练即可提升多个基础模型，最高提升分别为+16.2%、+6.0%和+10.5%。\n- **深度解析**: 该研究打破了传统GUI代理技能作为静态产物的设定，赋予技能在部署阶段“自我进化”的能力。通过结构化的技能包设计和反思修订循环，模型能够从失败中动态学习并更新操作策略，极大地增强了代理在复杂动态界面环境中的鲁棒性。关于受限工具接口的具体API定义，摘要未提供。\n- **领域归类**: [GUI代理, 自我改进, 免训练方法, 人机交互]\n---\n\n### 9. WeVisDoc: From Coverage to Capability for Robust End-to-End Document Parsing (WeVisDoc：从覆盖率到能力，实现鲁棒的端到端文档解析)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20423)\n- **研究任务**: 解决文档解析训练数据偏向常见类型和干净页面，且单纯扩大数据覆盖率无法解决解析器剩余弱点的问题，提升端到端文档解析的鲁棒性。\n- **核心亮点**: 提出WeVisDoc，一个两阶段数据中心框架。阶段I通过异构数据和保留结构的退化合成扩大覆盖率。阶段II使用保留探测集测量阶段I解析器在固定视觉-结构聚类中的残差误差，指导针对性数据构建和目标token预算重新分配。WeVisDoc-4B在OmniDocBench v1.6上Overall得分95.38，在PureDocBench三个赛道平均Overall得分75.54，均排名第一。相比阶段I，阶段II在退化赛道上提升显著（如4B模型在Real Degraded赛道提升4.03分）。\n- **深度解析**: 该研究提出了一种从“盲目扩大数据覆盖”向“精准提升模型能力”转变的数据中心范式。通过引入诊断性的残差误差分析，模型能够精准定位自身的视觉和结构盲区，并进行针对性的数据增强。关于阶段II中“目标token预算重新分配”的具体算法逻辑，摘要未提供。\n- **领域归类**: [文档解析, 计算机视觉, 数据中心AI, 多模态]\n---\n\n### 10. VABench: Measuring Embodied Spatial Intelligence through Visual Demonstrations, Active Perception, and Metric Control (VABench：通过视觉演示、主动感知和度量控制衡量具身空间智能)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19554)\n- **研究任务**: 评估通用多模态大语言模型在不完全观察下，通过视觉演示学习、主动获取缺失证据、解释空间关系并执行度量控制动作的完整“观察-推理-行动-修订”循环能力。\n- **核心亮点**: 提出VA-Bench，包含14个基础任务族、7个保留几何/布局变体和长视野5物体组合赛道。评估12个主要模型条件。最佳模型在目标定位得分100.0%，空间关系78.9%，但三次运行的宏观平均任务成功率仅为53.93+/-3.17%。主动相机控制相比被动多视图观察显著提高成功率（如从27.86%提升至57.50%）。保留几何迁移可能使成功率下降超30个百分点。无模型能完成严格的长视野episode。\n- **深度解析**: 该研究构建了一个极具挑战性的具身智能评测基准，强调了“主动感知”在空间智能中的核心地位。通过剥夺模型的上帝视角和特权信息，真实反映了当前多模态大模型在将视觉理解转化为物理世界精确度量操作时的巨大鸿沟。关于9种轨迹级行为诊断指标的具体计算方式，摘要未提供。\n- **领域归类**: [具身智能, 空间智能, 基准测试, 多模态大模型]\n---\n\n### 11. Video DeltaNet: A Video-Native Hybrid Attention for Livestream Video Generation (Video DeltaNet：用于直播视频生成的视频原生混合注意力机制)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20744)\n- **研究任务**: 解决视频扩散模型在去噪过程中处理长时空token序列时，注意力机制成为主要计算瓶颈的问题。\n- **核心亮点**: 提出Video DeltaNet (VDN)，结合局部Softmax注意力与双向线性记忆处理长距离视频上下文；引入Video Delta Attention (VDA)，每帧联合整合空间token更新一次记忆；在MiniMax H3上实例化，结合8步蒸馏与优化服务栈，在8张B200 GPU上6.70秒完成14.3秒768p视频去噪，较50步基线加速14.5倍。\n- **深度解析**: 直接应用线性注意力到视频模型往往会丢失高质量生成所需的细粒度交互。VDN通过混合架构解决此问题，其线性分支（VDA）每帧更新记忆，并通过独立的输出投影和可学习门控校准两个分支。采用分阶段教师对齐策略将新路径引入预训练模型。针对视频到视频交互使用混合注意力，而涉及文本或音频的交互保留Softmax。其他未提及的具体评测数据集：摘要未提供。\n- **领域归类**: [视频生成, 注意力机制, 模型加速]\n---\n\n### 12. FAMOS: Feed-Forward 3D Articulation Modeling from Sparse Observations (FAMOS：从稀疏观测中进行前馈式3D关节建模)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20817)\n- **研究任务**: 从稀疏的单目视角观测中对关节物体进行建模，预测可动部件分割和关节参数。\n- **核心亮点**: 提出FAMOS前馈模型，从稀疏、无序的部分点云集合中进行预测，支持可变数量的输入；引入多状态关节Transformer，通过交替的状态级和全局注意力聚合跨观测的关节线索；提出观测关节跨度目标，监督部件在输入观测中展现的运动范围；引入程序化数据生成器合成自标注资产。在PartNet-Mobility、ACD和ArtiCraft-10K上表现优于基线。\n- **深度解析**: 现有前馈方法多依赖单视图和类别级形状先验。FAMOS通过联合推理多个观测来聚合关节线索。观测关节跨度目标鼓励模型充分利用完整的观测集，而不是仅依赖单一视角。程序化数据生成器解决了现有数据集规模和多样性有限的问题。具体的定量实验结果与提升数字：摘要未提供。\n- **领域归类**: [3D视觉, 关节物体建模, 前馈网络]\n---\n\n### 13. Can MiniMax-H3 Reason About the Physical World? An Evaluation of Omni-Modal Generative Model (MiniMax-H3能推理物理世界吗？全模态生成模型的评估)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.18323)\n- **研究任务**: 评估全模态生成模型（以MiniMax-H3为例）在物理世界推理方面的能力，探究多模态对齐是否能提升模型的世界推理能力。\n- **核心亮点**: 引入围绕物理世界推理四个互补维度的综合评估框架，构建需要跨模态整合互补信息的多样化任务（隐式提示+多帧、音频-图像、前缀-视频、音频-视频）；在517个评估实例中，MiniMax-H3总体成功率41.97%，其中视频决策推理最高达56.00%，音频消歧推理最弱为27.40%。\n- **深度解析**: 现有视频生成和世界模型评估框架常受限于输入模态单一或提示与目标内容高度匹配。本文评估专门利用全模态模型的多模态输入特性，每个单一模态仅提供底层事件的部分证据，要求模型联合推理互补语义线索以推断潜在事件状态和未来动态。结果表明，有效的多模态整合是充分利用多模态输入优势的关键。其他未提及的具体实验数据集与技术细节：摘要未提供。\n- **领域归类**: [多模态大模型, 物理世界推理, 模型评估]\n---\n\n### 14. UFO: Chain-of-Evaluation for Omni-Condition Alignment in Multi-Modal Image Generation (UFO：多模态图像生成中全条件对齐的评估链)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.12397)\n- **研究任务**: 解决多模态图像生成（特别是主体驱动的定制）中评估方法滞后的问题，实现全条件对齐的同步评估。\n- **核心亮点**: 提出UFO，首个全条件对齐同步评估统一框架；引入原子化评估链范式，将全条件对齐分解为细粒度、解耦的原子评估单元（AEU）序列，分类为不同模态相关性类别，并采用通用或专用功能调用进行验证；与人类评估偏好相关性最高，平均提升15.25%；提出UFO-Bench基准，全面评估定制模型在文本和视觉条件多样相互作用下的表现。\n- **深度解析**: 现有基于嵌入或MLLM的评估方法孤立地评估每个模态条件，这违背了多模态图像生成同时条件对齐的目标，导致与人类判断一致性差。UFO通过将条件对齐分解为原子单元并分类，使用特定功能调用验证，解决了这一矛盾。其他未提及的具体技术细节与实验数据集：摘要未提供。\n- **领域归类**: [多模态图像生成, 模型评估, 条件对齐]\n---\n\n### 15. When2Think: Learning Difficulty-Aware Length Control for Efficient Hybrid Reasoning Models (When2Think：学习难度感知的长度控制以实现高效混合推理模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19671)\n- **研究任务**: 解决大型推理模型在复杂任务上效率低下的问题（对简单问题过度思考，对难题思考不足），实现基于问题难度的动态计算分配。\n- **核心亮点**: 提出When2Think后训练框架，引入实例级难度感知控制（IDAC），利用预计算的参考统计信息调节推理深度；结合验证器奖励和批次标准化优势，实现稳定的无critic优化；在AIME24上Pass@3提升10.0%且token使用量减少27.9%；在AIME25上Pass@3达到40.0%，优于压缩和纯路由基线。\n- **深度解析**: 现有统一长度惩罚或严格路由方法会导致简单实例计算减少但困难实例准确率下降的权衡。When2Think将高效推理公式化为实例自适应计算分配问题。IDAC鼓励在简单实例上直接回答（System 1/NoThink），在困难实例上保留扩展推理（System 2/Think），无需学习奖励模型或在线参考模型查询。其他未提及的具体实验数据集：摘要未提供。\n- **领域归类**: [大型推理模型, 计算效率, 强化学习/后训练]\n---\n\n### 16. What Does Privileged Information Add to On-Policy Self-Distillation? (特权信息在策略自蒸馏中增加了什么？)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20612)\n- **研究任务**: 探究在策略自蒸馏（OPSD）中，给教师模型提供额外信息（如答案或解题过程）相比无参考蒸馏究竟增加了多少价值。\n- **核心亮点**: 构建AMPLE-Math（5319个数学问题，6种共享答案的推理视角）；发现无参考蒸馏占据了Qwen3-1.7B在思考启用评估下的大部分改进；特权参考的额外收益在Qwen中适中，完整轨迹在SmolLM3-3B第50步增加2个百分点；收益取决于学生模型是否被训练，将短直接响应替换为长思考启用响应会将收益变为损失。\n- **深度解析**: 研究表明，OPSD可以通过直接响应和思考启用推理共享的参数来改善对现有推理能力的访问。特权参考的价值在于它对这种跨模式转移的增加，而不是它揭示了解决方案的多少。改变token级监督可以使学生行为基本保持不变。其他未提及的具体实验数字与技术细节：摘要未提供。\n- **领域归类**: [大语言模型, 自蒸馏, 模型训练/对齐]\n---\n\n### 17. Region-Level Policy Optimization for Fine-grained MLLM Perception (用于细粒度多模态大模型感知的区域级策略优化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19745)\n- **研究任务**: 提高多模态大语言模型的细粒度视觉感知能力，同时避免增加视觉token导致的编码和预填充成本上升。\n- **核心亮点**: 提出Vision-RL2，使用区域级强化学习优化提议网络；将连贯区域视为动作，冻结的MLLM读取器通过移除区域对答案似然的影响进行评分；互补的减法和加法目标抑制干扰提议并恢复缺失证据；在6个细粒度基准和4个MLLM骨干上，Vision-RL2在每个token预算下提高准确率，并以约4倍少的视觉token超越最大预算准确率。\n- **深度解析**: 细粒度感知的定位和识别对分辨率要求不同（定位容忍3-4倍更强的token压缩）。Vision-RL2从粗视图定位，集中分辨率于选定证据。优化提议网络无需区域标注、响应采样或推理轨迹。细化后的提议支持稀疏编码，放大证据并排除背景token。其他未提及的具体实验数据集与数字：摘要未提供。\n- **领域归类**: [多模态大模型, 视觉感知, 强化学习]\n---\n\n### 18. Self-Evolving Search Index (自进化搜索索引)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19656)\n- **研究任务**: 解决信息检索中索引表示因检索环境不同而效果差异大，且现有索引优化高度依赖人工干预的问题。\n- **核心亮点**: 提出SELF-INDEX框架，使索引无需人工干预即可自进化；优化器自主诊断检索缺陷，选择性修改负责的索引键，并在更新前验证；通过查询模拟器主动探索额外需求，使索引超越现有查询进行进化；在多样语料库和检索器上持续提升检索性能，并改善下游搜索代理和代理记忆系统的有效性和效率。\n- **深度解析**: 检索质量依赖于索引键暴露文档知识的有效性。SELF-INDEX的优化器自动诊断短板并修改索引键，查询模拟器生成新需求。这种方法摆脱了人工诊断失败、细化策略和重新处理索引的繁琐过程，实现了索引的自适应演化。具体的实验数据集、提升数字与技术细节：摘要未提供。\n- **领域归类**: [信息检索, 代理系统, 索引优化]\n---\n\n### 19. Don't Mask the Environment: Observation Supervision Changes How Agents Explore Under RL (不要掩码环境：观察监督改变智能体在强化学习下的探索方式)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.20715)\n- **研究任务**: 探究在标准监督微调中仅对智能体动作token施加损失（将环境观察作为上下文但不作为预测目标）是否为后续强化学习提供了最佳初始化。\n- **核心亮点**: 引入ActObs，在监督微调中同时对轨迹中已存在的观察token进行监督；在Terminal-Bench 2.0上，Qwen3-4B的ActObs GRPO在每个采样预算下pass@k更高，Qwen3-8B在pass@16提升3.4个百分点；在aider-polyglot跨域代码编辑中pass@1提升4.2个百分点；ActObs在强化学习期间保留更多熵，策略移动更少。\n- **深度解析**: 学习预测观察结果鼓励策略建模动作后果，不增加数据、参数等。分析表明，动作和观察梯度在监督微调中迅速正交，仅动作训练留下大残差观察梯度并降低环境预测。联合监督防止了这种单方面特化，保留了后果预测，为下游探索做好准备。其他未提及的具体实验数据集：摘要未提供。\n- **领域归类**: [智能体, 强化学习, 监督微调]\n---\n\n### 20. PACT: Can Enterprise AI Assistants Be Trusted Under Pressure? (PACT：企业AI助手在压力下值得信任吗？)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.18605)\n- **研究任务**: 评估企业级大语言模型代理在敏感场景（如招聘、医疗、金融）中面对压力时遵守系统上下文中指定规则（合规性）的能力。\n- **核心亮点**: 引入PACT基准，包含12个受监管企业领域和48个场景的真实多轮对话；每个项目将常驻规则与违规捷径配对，并施加多种压力；提出PACTScore（可靠性加权合规率）；测试22个常见大语言模型，最强助手在6-10%的项目上误用规则，普通用户压力平均使违规率提高65%。\n- **深度解析**: 现有缺乏系统评估大语言模型违规倾向的框架，特别是在用户持续施压、经理催促或违规具有吸引力等情况下。PACT通过严格的LLM-as-judge审计构建，确保样本无歧义、不可作弊且真实。从六个互补指标生成全面合规画像，揭示了大语言模型助手在压力下的合规风险。其他未提及的具体实验技术细节：摘要未提供。\n- **领域归类**: [大语言模型代理, 安全与合规, 基准评估]\n---\n\n### 21. VākQA: A Benchmark and Evaluation Study for Telugu Spoken Factoid Question Answering (VākQA：泰卢固语口语事实问答基准与评估研究)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19879)\n- **研究任务**: 构建泰卢固语口语问答（SQA）基准数据集，并评估该场景下自动评估方法的可靠性以及各类大模型的表现。\n- **核心亮点**: 提出了包含 2,001 个问答对、2.53 小时语音及双语转录的泰卢固语口语问答基准 VākQA；发现 Gemini-as-a-judge 最接近人类评分但严格度不均，而开源评判模型会系统性惩罚表面形式不同但正确的泰卢固语答案；揭示了泰卢固语翻译会丢失文化特性、语音输入会引入改变句意的语音混淆，以及级联 ASR-MT（自动语音识别-机器翻译）错误会逐步累积。\n- **深度解析**: 该研究填补了泰卢固语口语问答基准的空白。通过引入人工验证的参考答案和双语转录，确保了数据质量。在评估方法验证上，指出了当前大模型作为评判者（LLM-as-a-judge）在低资源语言上的局限性，特别是开源模型对语言表面形式的过度敏感。此外，研究深入分析了多模态和跨语言处理中的具体痛点（文化特性丢失、语音混淆、级联误差累积），为未来低资源语言的口语问答系统优化提供了明确的改进方向。\n- **领域归类**: [自然语言处理, 多模态, 低资源语言, 问答系统]\n---\n\n### 22. Srijika: OpenType-Layout-Reusing Font Restyling for Nine Indic Scripts (Srijika：面向九种印度文字的 OpenType 布局复用字体风格重绘系统)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.05661)\n- **研究任务**: 为九种婆罗米系印度文字（如天城文、泰米尔文等）生成可安装的 OpenType 字体，解决印度字体生成中复杂连字和变体保持一致性的核心挑战。\n- **核心亮点**: 提出 Srijika 系统，不从零生成字体，而是复用排版完整的模板字体的布局（保留 cmap、GSUB 和 GPOS 数据）来重绘字形轮廓；利用参考条件潜在扩散模型结合自然语言风格选择（基于 Lipika 检索索引）进行字体风格迁移；生成了 66 个通过 OpenType 验证的 TTF 字体，并详细记录了参考引导重绘的负面结果与局限性。\n- **深度解析**: 印度文字由于包含数百至数千个连字、半字和元音变体，从零生成字体极易导致 OpenType 排版规则崩溃。Srijika 巧妙地采用了“布局复用”策略，将生成任务限制在字形轮廓的重绘上，从根本上保证了输出字体在排版和连字规则上的绝对正确。结合扩散模型和检索索引，实现了基于自然语言的风格控制。论文不仅展示了成功的生成结果，还诚实地报告了扩散模型在条件控制、目标选择和参考引导方面的失败案例（负面结果），为字体生成领域提供了极具价值的工程经验和基准。\n- **领域归类**: [计算机视觉, 生成式AI, 字体生成, 扩散模型]\n---\n\n### 23. Sample Count Is Not Enough: Candidate-Generation Strategy Shapes the Energy and Performance of LLM Test-Time Scaling (样本数量并非全部：候选生成策略决定了大模型测试时缩放的能耗与性能)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.19499)\n- **研究任务**: 探究大语言模型在测试时缩放（Test-Time Scaling）阶段，不同的候选生成调度策略（批次大小与调用次数）对系统延迟、吞吐量和 GPU 能耗的具体影响。\n- **核心亮点**: 指出仅用候选样本数量（N）无法准确衡量测试时缩放的系统成本；在固定 N=8 的情况下，对比了 1x8 到 8x1 四种生成调度策略；实验表明，在 A100 GPU 上，8次串行调用（8x1）相比单次8候选批次调用（1x8），其 GPU 总能耗高出 4.64-4.86 倍，P95 延迟高出 5.77-6.12 倍。\n- **深度解析**: 随着测试时缩放（如 Best-of-N 等采样策略）的流行，推理成本急剧增加。本文敏锐地指出，学术界和工业界在评估时往往只关注“生成了多少个候选（N）”和“最终准确率”，而忽略了“如何生成这些候选”对底层硬件资源的巨大影响。通过严谨的系统级测量，论文证明了在候选独立且显存允许的情况下，采用更少的调用次数和更大的批次大小能显著提升能效并降低延迟。这呼吁社区在未来的评估中必须同时报告生成调度策略和 GPU 级别的系统指标，对大模型推理优化和绿色 AI 具有重要的指导意义。\n- **领域归类**: [大语言模型, 推理优化, 系统性能评估, 测试时缩放]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [jinchenma94/bazi-skill](https://github.com/jinchenma94/bazi-skill)\n- **今日趋势**: ⭐ 3,104 | 🍴 486 | 📈 今日 +25\n- **项目简介**: 提供四柱八字命理分析的工具或技能。\n- **核心价值**: \n  - **项目用途**: 进行四柱八字命理分析。\n  - **目标人群**: 对传统命理、八字分析感兴趣的开发者或用户。\n  - **技术核心**: 基于 Python 语言实现。\n  - **AI/大模型相关**: 否。\n\n---\n\n### [bobeff/open-source-games](https://github.com/bobeff/open-source-games)\n- **今日趋势**: ⭐ 15,121 | 🍴 1,256 | 📈 今日 +482\n- **项目简介**: 开源游戏资源列表合集。\n- **核心价值**: \n  - **项目用途**: 收集、整理和展示开源游戏项目列表。\n  - **目标人群**: 游戏开发者、开源游戏爱好者、寻找游戏灵感的玩家。\n  - **技术核
