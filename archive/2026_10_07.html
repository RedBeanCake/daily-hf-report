    <h1>前沿科研情报 - 2026-10-07</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Kandinsky 6.0 Video: Foundation Models for Synchronized Video and Audio Generation (Kandinsky 6.0 Video：用于同步视频和音频生成的基础模型)\n- **社区热度**: `👍 113 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05608)\n- **研究任务**: 实现高质量的同步文本到音视频生成（T2AV）和图像到音视频生成（I2AV）。\n- **核心亮点**: 推出 Lite (3B) 和 Pro (29B) 两个版本，可生成 5 秒 1080P 视频及 44kHz 同步音频（含唇音同步）；采用双流 CrossDiT 架构和连续预训练策略；全面开源代码、模型权重及 diffusers 集成。\n- **深度解析**: 该模型通过双向交叉注意力连接预训练视频流和新训练的音频流，实现时序和语义对齐。训练采用连续预训练策略，先从头训练音频流，再进行音视频联合训练，随后辅以监督微调（SFT）、基于强化学习的后训练和蒸馏。关于具体的训练数据集名称，摘要未提供，仅提及使用了大规模音频语料库和配对音视频数据。实验结果表明，Pro 版本在人类评估中明显优于前代 5.0 版本，且在语音质量上与业界领先模型具有竞争力。\n- **领域归类**: [多模态生成, 音视频生成, 扩散模型]\n---\n\n### 2. ALoDLM: Adaptively Looped Diffusion Language Models (ALoDLM：自适应循环扩散语言模型)\n- **社区热度**: `👍 48 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04198)\n- **研究任务**: 提升扩散语言模型（DLMs）的生成质量，缩小其与同等规模自回归（AR）模型之间的质量差距。\n- **核心亮点**: 提出 token 自适应的潜在循环机制，根据 token 预测难度动态分配计算深度；在 1.7B 和 8B 参数规模下，11 个基准测试的平均得分超越所有评估的 DLM 和 AR 基线，同时保留了快速并行解码的优势。\n- **深度解析**: 现有 DLM 对所有未知位置应用统一的计算深度，导致“计算难度不匹配”。ALoDLM 通过迭代细化潜在表示，将已确定的 token 反馈为离散上下文，未解决的 token 则保留潜在状态进行额外循环。技术细节上，模型将 token 级计算调度公式化为隐变量，并推导出条件负证据下界（NELBO）进行联合学习。关于具体的评估数据集名称，摘要未提供，仅提及使用了 11 个基准测试。实验结果表明，ALoDLM 在生成质量和推理效率之间取得了极佳的平衡。\n- **领域归类**: [自然语言处理, 扩散语言模型, 推理加速]\n---\n\n### 3. Memadapter: Counterfactual Adaptation Against Memory-induced Sycophancy (MemAdapter：对抗记忆引发的谄媚的反事实适应)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05162)\n- **研究任务**: 缓解基于长期记忆的 LLM Agent 因过度迎合用户历史信念（即使该信念不准确或已过时）而产生的“谄媚”问题。\n- **核心亮点**: 提出 MemAdapter 框架，通过反事实归纳、上下文感知反思和基于证据的推理三个组件自适应整合检索记忆；在 3 个基准测试中一致提升了 Agent 的记忆可靠性。\n- **深度解析**: 现有方法假设谄媚源于错误记忆并试图过滤，但客观正确的记忆在不同上下文中也可能引发谄媚。MemAdapter 利用反事实推理揭示记忆的潜在风险，通过自反思校准其推理影响，并最终基于适当证据生成响应。关于具体的实验数据集名称，摘要未提供，仅提及在 3 个基准测试上进行了验证。实验结果表明，该方法在多种场景下有效提升了 Agent 推理的客观性和可靠性。\n- **领域归类**: [LLM Agent, 长期记忆, 对齐与安全性]\n---\n\n### 4. In-Distribution Forcing for Long Video Generation at Test Time (测试时分布内强制：用于长视频生成)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03120)\n- **研究任务**: 解决自回归（AR）视频扩散模型在生成长视频时出现的颜色/纹理漂移和运动衰减问题。\n- **核心亮点**: 提出测试时框架 ID-Forcing，通过核心机制“自缓存（self-caching）”防止 KV 缓存变成分布外（OOD），将短视频模型无缝扩展至分钟级长视频生成，大幅减少漂移现象。\n- **深度解析**: 现有方法依赖 KV 条件化，但假设缓存 KV 在分布内，导致长视频生成时出现“KV 来源问题”。ID-Forcing 通过自缓存机制，使每个 chunk 在缓存时不关注先前的 KV entry，从而保持滚动窗口严格在分布内。关于具体的评估数据集名称，摘要未提供，仅提及在标准视频生成基准上进行了测试。实验结果（包括自定义漂移指标和用户研究）表明，该方法在保持标准基准竞争力的同时，显著优于先前工作在缓解漂移方面的表现。\n- **领域归类**: [视频生成, 扩散模型, 长视频生成]\n---\n\n### 5. LMBuild: Evaluating LLM Agents for Generating Buildable and Functional Structures (LMBuild：评估 LLM Agent 生成可建造和功能结构的能力)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04292)\n- **研究任务**: 评估 LLM Agent 生成不仅在几何上优雅，而且在物理上可建造并具备预期功能的 3D 结构的能力。\n- **核心亮点**: 提出 LMBuild 基准，将对象表示为包含部件分解、关节、材料和序列的组装结构；提供交互环境、结合 CAD 与维基百科知识的基准，以及涵盖结构、功能、设计和物理实现的综合评估框架。\n- **深度解析**: 现有评估多关注几何质量而忽视物理可实现性。LMBuild 通过评估 30 个系统发现，前沿闭源模型在结构健全性上不再是瓶颈，但功能可供性和物理可操作性仍具挑战；强模型更擅长创建新组件，弱模型依赖检索；提供功能规范能大幅提升部件完整性。技术细节上，框架包含交互式工具环境。数据集方面，使用了现有的 CAD 数据集并辅以维基百科知识。实验结果揭示了当前模型在物理世界结构生成中的深层推理短板。\n- **领域归类**: [LLM Agent, 3D 生成, 物理仿真与评估]\n---\n\n### 6. Foundations of Proactive Agents: Principles, Technical Layers, and Proactivity-Gym (主动式 Agent 的基础：原则、技术层与 Proactivity-Gym)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37267)\n- **研究任务**: 设计、实现和评估能够在用户请求前主动提供支持的 LLM Agent，同时避免误读上下文或破坏用户信任。\n- **核心亮点**: 提出围绕任务能力、时间分配和信任（3T）的三大联合原则及五维设计空间；推出基于模拟的评估测试台 PROACTIVITY-GYM，揭示 LLM 评委常混淆任务能力与信任，并通过人类研究验证了联合优化 3T 的重要性。\n- **深度解析**: 主动式 Agent 能将闲置算力转化为有用支持，但不当干预会增加审查成本或损害信任。该研究将目标连接到任务范围、预期视野等五个维度，并需要用户和环境表示等系统建模支持。关于具体的评估数据集名称，摘要未提供，仅提及使用了多天场景和人格条件模拟用户。实验结果（23 个模型配置评估和 30 人人类研究）表明，干预错位会导致信任急剧下降，且用户更偏好睡眠时的辅助以维持专注。\n- **领域归类**: [LLM Agent, 主动式交互, 人机交互评估]\n---\n\n### 7. Self-Generated Feedback Destabilizes Test-Time Training: A Causal Decomposition of Long-Horizon Adaptation (自生成反馈破坏测试时训练：长程适应的因果分解)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05076)\n- **研究任务**: 探究并解决测试时训练（TTT）中，模型从自身生成输出学习时导致的模型不稳定和性能下降问题。\n- **核心亮点**: 通过因果分解发现，保留生成文本的更新会恶化模型在独立人类文本上的预测；提出“固定生成”和“结算（Settlement）”机制，在提交更新前于独立真实文本上评估候选状态，从而在保留真实文本适应能力的同时消除损害。\n- **深度解析**: 在 TTT 中，模型更新会改变生成下一个样本的模型，形成反馈循环。研究在 128K token 流中验证了这一问题（涉及 125M、760M、3B 配置及 Qwen3-4B）。技术细节上，通过“固定生成”（冻结模型生成）消除了 98% 的损害，并通过“记录重放”和“配对单步更新”追踪了因果路径。关于具体的评估数据集名称，摘要未提供，仅提及使用了独立人类文本和真实文本。实验结果表明，“结算”机制能在 125M 和 760M 模型上留下极小的平均端点差距（0.07 和 -0.02 nats），同时保留适应能力。\n- **领域归类**: [测试时训练, 大语言模型, 模型稳定性]\n---\n\n### 8. Optimizing the Optimizer: Language Models Discover Faster Molecular Relaxation (优化优化器：语言模型发现更快的分子弛豫方法)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06577)\n- **研究任务**: 利用语言模型和自动研究（autoresearch）改进量子化学工作流中的几何优化器，以减少力调用次数。\n- **核心亮点**: Agent 重写优化器代码，从最快的开源优化器 Sella 出发，搜索出 AutoSella 优化器家族；在 r2SCAN-3c DFT 级别，最佳变体仅需 Sella 40.2% 至 77.2% 的力调用即可达到相同的能量减少。\n- **深度解析**: 几何优化在量子化学中成本高昂。该研究让 Agent 在两个准入门（拒绝过早停止和不泛化的改进）约束下重写优化器。技术细节上，Agent 在搜索过程中并未使用 DFT 梯度。关于具体的评估数据集名称，摘要未提供，仅提及使用了保留分子基准和搜索中未使用的势函数。实验结果表明，AutoSella 在未见过的分子基准和势函数上均能一致减少力调用，显著提升了优化效率。\n- **领域归类**: [AI for Science, 量子化学, LLM Agent, 自动研究]\n---\n\n### 9. Towards Looped Models Done Right, Part II: Rethinking at Fixed Points (正确实现循环模型（第二部分）：在不动点处的重新思考)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06833)\n- **研究任务**: 优化循环语言模型的训练和推理效率，通过使循环状态更接近不动点来降低计算成本。\n- **核心亮点**: 改进塑造不动点的深度先验和输入注入机制（学习先验和正交注入）；实现训练截断反向传播、解码终端 KV 共享、预填充加速 1.79 倍以及 RL 梯度计算加速 2 倍，且在各个参数规模上降低了困惑度。\n- **深度解析**: 循环模型的每次循环都会增加成本，若状态接近不动点，则路径不再重要。技术细节上，研究从预测反馈中学习深度先验（带熵项保持宽泛），并采用正交注入移除状态沿输入分量的放大或抵消效应。关于具体的评估数据集名称，摘要未提供。实验结果表明，在 100M 到 1.6B 参数规模上，新方法均降低了困惑度；在 1.6B 规模下，结合学习的先验和 3 倍小的 KV 缓存，可匹配固定深度训练使用全缓存的下游平均性能。\n- **领域归类**: [大语言模型架构, 循环模型, 推理与训练优化]\n---\n\n### 10. Data Unlearning via Inverse Distillation (通过逆蒸馏实现数据遗忘)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36099)\n- **研究任务**: 在降低多步匹配模型（如 flow 和 diffusion 模型）推理成本的同时，抑制其生成训练集中特定不良子集（遗忘集）的能力。\n- **核心亮点**: 提出逆蒸馏遗忘（IDU）统一框架，将教师多步模型蒸馏为单步学生生成器，同时实现数据遗忘；仅需预训练教师和遗忘集数据，无需保留数据或额外分类器。\n- **深度解析**: 多步模型推理成本高且可能重现不良数据。IDU 将蒸馏公式化为数据分布上的 min-max 目标，表示为遗忘集和生成分布的混合，通过比较教师训练分布，在最优时仅恢复保留数据。技术细节上，该方法无需访问保留训练样本。数据集方面，在 MNIST 和 CIFAR-10 上进行了 flow-matching 和基于分数的扩散设置实验。实验结果表明，IDU 大幅减少了遗忘类的生成频率，同时完美保留了保留类的生成质量，是首个实现无条件模型同时遗忘和蒸馏的统一框架。\n- **领域归类**: [生成模型, 机器遗忘, 知识蒸馏]\n---\n\n### 11. CANOPY: Adaptive-Granularity Evidence Compression for Multimodal RAG (CANOPY：面向多模态RAG的自适应粒度证据压缩)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00923)\n- **研究任务**: 多模态检索增强生成（RAG）中的检索后证据压缩，解决在异构项目（文本、表格、图像、视频）中保留多少上下文的问题。\n- **核心亮点**: 提出CANOPY框架，将检索项表示为层次结构，利用在黄金证据上微调的节点编码器对区域进行评分；通过父节点相对细化在不同粒度上选择多个区域，无需调用LLM进行节点级剪枝；引入评论家（critic）机制，在证据不足时请求针对性的后续检索。\n- **深度解析**: 在包含3300万项的异构语料库上的5个问答基准测试中，CANOPY的平均回答准确率高于评估的检索基线。消融实验表明，额外检索是多跳问答准确率提升的主要动力。在未路由的Qwen3-VL-8B-Instruct设置中，压缩使读者输入的证据token减少了14.2-27.7%，同时保持了相当的回答准确率。\n- **领域归类**: [多模态, 检索增强生成 (RAG), 自然语言处理]\n---\n\n### 12. SearchJev: A Fast and Calibrated System-1 Model for Search Agents (SearchJev：用于搜索智能体的快速且校准的系统1模型)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05107)\n- **研究任务**: 优化搜索智能体在相关性、证据充分性和搜索动作方面的短决策过程，解决生成式语言模型带来的延迟和置信度不可靠问题。\n- **核心亮点**: 提出SearchJev，一个快速且校准的“系统1”模型，将搜索决策与“系统2”推理和生成分离；给定搜索状态和决策模式，直接对合法选项评分而无需自回归输出生成；提出用于校准决策的软标签学习（SLCD）方法，从不确定监督中学习决策概率并校准置信度。\n- **深度解析**: 在双系统搜索智能体中，SearchJev处理短决策并将不确定的判断委托给系统2。引入SearchDecision-Bench基准测试。在该基准上，SearchJev的决策质量优于同等大小的Qwen3.5自回归模型，决策速度提升5.2-5.3倍，平均预期校准误差降低41-74%。在BrowseComp-Plus上，双系统智能体在主动搜索时间上实现了3.7-4.7倍的加速，同时将回答准确率从45%提高到最高54%。\n- **领域归类**: [智能体 (Agents), 搜索系统, 大语言模型]\n---\n\n### 13. Representation-Space MMD for Diffusion Language Models (扩散语言模型的表示空间最大均值差异)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06648)\n- **研究任务**: 扩散语言模型（DLMs）的后训练优化，旨在最小化生成分布与参考分布在冻结的预训练DLM特征空间中的最大均值差异（MMD）。\n- **核心亮点**: 提出一种后训练方法，通过在单个提取器遍历中保留单个token位置的上下文特征来获得多个观测值；对离散模型使用策略梯度优化，对连续模型通过生成的潜变量直接微分；无需完整的采样轨迹或联合训练的辅助模型即可实现高效后训练。\n- **深度解析**: 实验表明，在OpenWebText上，该方法在可比熵下实现了更低的生成困惑度，在GSM8K上实现了更好的准确率-计算权衡。在具有混合掩码-均匀扩散的16B DMax-LLaDA2.0模型上，该方法增加了解码并行度，并在数学和代码基准测试中保持了相似或更高的准确率。\n- **领域归类**: [自然语言处理, 扩散模型, 模型训练与优化]\n---\n\n### 14. ASCENT: Online Test-Time Training of Long-Horizon Agents via Self-Distillation of Verified Experience (ASCENT：通过验证经验的自蒸馏对长程智能体进行在线测试时训练)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05303)\n- **研究任务**: 大语言模型（LLM）智能体在部署期间解决长程任务时的在线测试时训练（OaTTT），利用其自身的执行轨迹进行持续改进。\n- **核心亮点**: 提出ASCENT框架，通过自蒸馏验证经验来更新智能体权重。使用LLM的稳定版本（冻结的初始副本）接收验证轨迹作为特权信息并预测下一个token分布，将其蒸馏到持久的LoRA快速权重中；通过移除无效动作回合，蒸馏增强的特权经验以实现更高效的执行。\n- **深度解析**: 在ALFWorld、WebShop和AppWorld的不同模型规模上，ASCENT随着经验的积累提高了任务成功率和交互效率，优于在线适应方法，并能迁移到未见过的场景。摘要未提供具体的实验数字或数据集规模。\n- **领域归类**: [智能体 (Agents), 强化学习与自蒸馏, 大语言模型]\n---\n\n### 15. OSWorld-Pro: Process-based Evaluation for Computer Use Agents (OSWorld-Pro：计算机使用智能体的基于过程评估)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24890)\n- **研究任务**: 计算机使用智能体（CUAs）的过程级评估，解决现有评估仅关注最终交付物而缺乏对智能体失败原因透明度的问题。\n- **核心亮点**: 引入OSWorld-Pro，包含300多个任务和2800多个子目标，基于67000多个人工注释进行CUAs的过程评估；使用稳健的与人类对齐的LLM-Judges评估子目标的完成情况，揭示模型在一系列顺序依赖的子目标中取得的进展。\n- **深度解析**: 研究发现OSWorld-Pro对最先进的LLM也具有挑战性，例如Claude Opus 5的最高表现仅为75.7%，而在OSWorld上为83.4%。此外，研究识别了各种模型的关键过程失败模式（如与子目标无关的动作和基于点击的错误），为提高CUAs的性能和效率提供了见解。摘要未提供其他具体的实验数字。\n- **领域归类**: [智能体 (Agents), 模型评估, 计算机使用]\n---\n\n### 16. OmniReasoning: Pushing the Limits of Audio-Visual Joint Reasoning (OmniReasoning：突破音视频联合推理的极限)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39490)\n- **研究任务**: 评估和提升全模态模型在音频和视觉联合推理方面的能力，解决现有基准、数据和方法将模态独立处理的问题。\n- **核心亮点**: 引入OmniReasoningBench基准测试（包含1150个问题）；开发数据引擎OmniQA，自动生成需要音视频联合推理的证据基础QA对及带时间戳的线索链；提出模态分解自蒸馏（MFSD）方法，在特定模态线索上下文下评估采样响应，解耦单个线索及其跨模态交互的贡献以进行token级信用分配。\n- **深度解析**: 使用其训练数据和学习方法，OmniReasoning-30B-A3B模型在OmniVideoBench上达到50.0%，在OmniReasoningBench上达到42.5%，分别比基础模型Qwen3-Omni-30B-A3B-Thinking提高了12.8和9.3个百分点。此外，在Video-MME-v2等通用和长视频基准测试中也取得了实质性提升。\n- **领域归类**: [多模态, 音视频推理, 模型训练与优化]\n---\n\n### 17. RobotUse: Allocating Computation, Context, and Decisions (RobotUse：分配计算、上下文和决策)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04929)\n- **研究任务**: 机器人智能体的架构设计，解决现有接口将选择留在预定义工具中或要求智能体管理详细执行代码及其不断增长的历史的问题。\n- **核心亮点**: 引入RobotUse，一个围绕指定和修改物理动作来组织计算、上下文和决策的机器人智能体框架。智能体通过视觉选择目标和姿态，后端处理几何、运动规划和控制；子智能体保留每个子目标内的详细交互并返回后续决策所需的信息；通过更新持久的“剧本（playbook）”让智能体从执行中学习。\n- **深度解析**: 在RoboLab上，RobotUse实现了45%的任务成功率，比CaP-X高出6.7个百分点，同时保持了紧凑的决策上下文并减少了对预定义动作抽象的依赖。此外，RobotUse能够从真实世界执行中的不完美反馈（imperfect feedback）中学习，并将学到的知识迁移到后续任务中。\n- **领域归类**: [机器人, 智能体 (Agents), 具身智能]\n---\n\n### 18. Noise Out, Bias In: Targeted Bias Injection in Diffusion Language Models via Closed-Loop Activation Steering (噪声出，偏见入：通过闭环激活引导在扩散语言模型中注入目标偏见)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05894)\n- **研究任务**: 针对掩码扩散语言模型（dLLMs）的安全性研究，探索攻击者如何利用模型在去噪步骤中暴露答案分布的特性进行目标偏见注入。\n- **核心亮点**: 提出一种目标偏见注入攻击，利用简单的比例积分（PI）控制器跟踪去噪过程中的目标答案概率，并动态调整引导向量的强度，从而将冻结的dLLM引导至攻击者选择的人口统计学答案。\n- **深度解析**: 在正确答案为弃权的模糊BBQ问题上，该攻击将LLaDA-8B-Instruct对目标群体的偏好从1.8个百分点提高到16.7个百分点；在SocialStigmaQA上，将污名化答案的选择率从17.6%提高到58.1%。拟合其他人口统计目标时，答案偏移高达37个百分点，每次攻击在单个GPU上约需40分钟。反馈是攻击成功的关键，恒定强度的引导效果远不及此。\n- **领域归类**: [模型安全, 扩散语言模型, 对抗攻击]\n---\n\n### 19. Certification of Real Images through Calibrated Content Authentication (通过校准内容认证对真实图像进行认证)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05870)\n- **研究任务**: 深度伪造检测与真实图像认证，解决生成模型能够精确复制真实内容导致仅靠内容无法揭示真实来源的根本模糊性问题。\n- **核心亮点**: 提出一种检测范式，输出对“真实性是否可合理否认”的校准预测：任何已知生成器的忠实重建确立了合理的否认，而校准确定了已知生成器的内容无法被复制的频率；评估了20个深度伪造检测器对抗过去四年发布的10个生成器。\n- **深度解析**: 评估发现，检测器准确率随时间下降（从99.5%降至76%），对抗性扰动使所有基线检测器准确率降至2%以下。所提出的检测器可被校准，使得最多1%的生成内容被错误认证（此时大多数基线检测器召回率接近零，包括最强基线的93%准确率）。在受攻击样本上校准更严格的安全阈值可在评估的有界扰动攻击空间内保持此界限。此外，事后可验证性正在减弱，3000张Reddit图像中有1116张抵抗2022年生成器的复制，但只有55到79张抵抗2024年生成器的复制。\n- **领域归类**: [模型安全, 深度伪造检测, 多媒体取证]\n---\n\n### 20. When to Switch: Reliable Action-Chunk Extension for Vision-Language-Action Models (何时切换：视觉-语言-动作模型的可靠动作块扩展)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05719)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在机器人操作中因推理成本高导致的“停停走走”执行问题，通过扩展动作块（action chunk）来减少策略调用，同时解决长块执行不可靠的问题。\n- **核心亮点**: 提出RACE（可靠动作块扩展）框架，通过分析发现长块中的动作误差集中在操作子技能之间的转换处；RACE从辅助的单步去噪传递中预测转换时机，并以此作为条件生成动作，从而减少子技能转换处的误差并实现更长动作块的可靠执行。\n- **深度解析**: 在仿真基准测试中，RACE在相同块长度下优于微调；使用2倍长的块，其成功率超越了最近最先进的VLA；使用4倍长的块仍具竞争力。在真实机器人上，RACE使用4倍长的块，将由“停停走走”引起的空闲时间减少了约5倍，同时实现了比相同块长度微调更高的成功率。\n- **领域归类**: [具身智能, 机器人操作, 视觉-语言-动作模型]\n---\n\n### 21. Base Models Can Reason By Taking a Cue From Training Data (基础模型可以通过从训练数据中获取线索来进行推理)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06851)\n- **研究任务**: 研究训练数据如何在基础模型响应的起始 token 与随后的推理行为之间建立关联，并探索通过固定起始 token 提示来激发模型推理能力的方法。\n- **核心亮点**: 发现固定特定的起始 token 提示（如 \".\\n\\nOkay\" 或 \"Alright,\"）能使基础模型在数学和编程任务上的表现与经过强化学习（RL）训练的模型相当（例如 Olmo-3-7B 在 MATH-500 上的 pass@1 准确率从 42% 提升至 78%）；通过因果数据干预可以将任意词（如 \"chicken\"）变成有效的推理提示，或移除现有提示的效果；提示的隐藏状态表示与训练集中的不同文档类型相关；在语言模型安全方面，不同提示会引发对应不同训练数据类型的拒绝和顺从行为。\n- **深度解析**: 该研究揭示了基础模型推理能力与训练数据中特定 token 提示之间的深层联系。研究表明，RL 实际上只是让这些提示出现得更快，而直接固定它们就能恢复大部分性能增益。此外，研究通过因果干预证明了这种关联的可塑性，并拓展到了模型安全领域。其他实验数据集：摘要未提供。\n- **领域归类**: [自然语言处理, 模型推理, 强化学习, 模型安全]\n---\n\n### 22. Video2Skill: From Streaming Experience to Reusable Embodied Skills (Video2Skill：从流式经验到可复用的具身技能)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36691)\n- **研究任务**: 提出流式具身技能发现（SESD）问题，即让模型按顺序观看视频并维护一个持久的技能库以塑造后续决策，并引入 Video2Skill 基准测试来系统评估该能力。\n- **核心亮点**: 引入 Video2Skill 基准测试，涵盖机器人桌面操作和人类厨房活动，测试时间定位、事件分组和技能复用/创建决策三大核心能力；在 19 个开源 VLM 的评估中发现，许多模型在事件分组上接近随机水平，且模型规模并不能稳定提升性能；指出联合模型和基于文本描述更新库的模型存在不同的错误模式；提出反事实库状态重平衡（CLaRe）等微调方法，但发现训练后的模型很少扩展技能库，识别现有技能不足成为核心挑战。\n- **深度解析**: 本文聚焦于具身智能中从连续视频流中自动发现和提取可复用技能的关键难题。实验表明，当前的视觉语言模型（VLM）在将连续事件组织为可复用技能方面表现不佳。研究深入剖析了感知与库更新耦合方式导致的错误，并指出“认识到现有技能不足”是当前技能发现的核心瓶颈，为未来具身智能的持续学习和技能库构建指明了方向。其他实验数据集：摘要未提供。\n- **领域归类**: [具身智能, 计算机视觉, 机器人学, 视觉语言模型]\n---\n\n### 23. ProgressCompass: Embodied Progress Reward Models Are Lost Without the Right Context (ProgressCompass：缺乏正确上下文的具身进度奖励模型会迷失方向)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36684)\n- **研究任务**: 解决在长任务中仅凭当前帧无法准确估计任务进度的问题（即上下文依赖的进度估计），构建 ContextProgress-Bench 基准，并提出 ProgressCompass 自主代理循环来为进度奖励模型（PRM）提供所需上下文。\n- **核心亮点**: 构建 ContextProgress-Bench 基准，包含 24 个操作任务和 120 个片段，涵盖状态回忆、序列跟踪和循环消歧三种设置；诊断发现，即使读取完整历史的 PRM 也会迷失，但提供正确上下文后，5 个模型的进度误差降低了 77-82%；提出 ProgressCompass 自主代理循环，利用通用 VLM 提供上下文，使冻结的 PRM 进度误差降低 63%，排序一致性提高 76%。\n- **深度解析**: 该研究切中了具身智能长任务评估中的一个痛点：进度奖励模型在缺乏历史上下文时无法准确评估当前进度。作者通过构建专门的基准测试，严谨地证明了“上下文依赖”是导致 PRM 失效的主要原因。提出的 ProgressCompass 方法巧妙地利用通用 VLM 作为“指南针”为冻结的 PRM 补充上下文，以极低的成本大幅提升了进度估计的准确性，为长序列具身任务的监控提供了高效方案。其他实验数据集：摘要未提供。\n- **领域归类**: [具身智能, 强化学习, 奖励模型, 视觉语言模型]\n---\n\n### 24. UndoBench: Separating Task Competence from Recovery Capability in Tool-Using AI Agents (UndoBench：在工具使用 AI 代理中分离任务能力与恢复能力)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05622)\n- **研究任务**: 解决现有基准测试混淆了 AI 代理的基线规划能力与操作故障恢复能力的问题，引入 UndoBench 基准测试，通过反事实配对试验解耦这两种能力。\n- **核心亮点**: 引入 UndoBench，涵盖 8 个企业领域的 36 个基础工作流和 36 个故障场景；在 12 个保留测试工作流上的评估（5760 次执行/2880 次配对试验）显示，名义任务能力达到 83.54%，而条件恢复成功率（CRSR）仅为 46.72%，且朴素重试在 53.33% 的试验中产生了重复的外部影响；发现恢复能力具有阶段依赖性：在突变前方法表现相似，部分突变期间朴素重试等方法失效，而在提交后确认前，验证和服务器端幂等性可显著提高安全性。\n- **深度解析**: 本文深刻揭示了当前工具使用 AI 代理评估中的一个重大盲区：高任务完成率掩盖了其在发生故障时糟糕的恢复能力。通过精心设计的 UndoBench 和反事实配对试验，作者成功将“任务能力”与“恢复能力”解耦。实验数据令人警醒：代理在正常情况下的表现尚可，但一旦遇到故障，恢复成功率骤降，且容易产生破坏性的重复操作，为构建更安全的企业级 AI 代理提供了关键评估标准。其他实验数据集：摘要未提供。\n- **领域归类**: [AI 代理, 基准测试, 软件工程, 系统可靠性]\n---\n\n### 25. PerturBot: Breaking Shortcut Priors in Vision-Language-Action Models with Perturbative Training (PerturBot：通过扰动训练打破视觉-语言-动作模型中的捷径先验)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04616)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在复杂任务中依赖模态捷径（如视觉、词汇或运动线索）而忽略真正决定动作的任务证据的问题，提出 PerturBot 训练方法和 GroundingFscore 评估指标。\n- **核心亮点**: 指出 VLA 模型存在模态捷径问题（如手腕相机附近的物体 displaces 目标，或熟悉的名词触发固定操作）；提出 PerturBot 方法，通过应用保留任务的视角扰动、丰富指令以包含决策相关的描述，以及添加重新标记的随机/失败轨迹，使捷径失效并让任务证据更易被使用；提出 GroundingFscore 离线指标，用于诊断策略对模态捷径的依赖程度。\n- **深度解析**: 该研究直击当前 VLA 模型训练中的核心痛点——“捷径学习”。模型往往通过记住数据中的表面相关性来“作弊”，而非真正理解任务逻辑。PerturBot 通过数据层面的扰动和增强，强制模型关注真正的任务证据。更具价值的是，GroundingFscore 指标使得研究者能够在离线状态下诊断模型是否过度依赖捷径。这为 VLA 模型的训练和评估提供了一套完整的框架，确保模型在规模扩展时能够健康地提升泛化能力。具体实验数据集：摘要未提供。\n- **领域归类**: [具身智能, 机器人学, 视觉语言动作模型, 模型训练]\n---\n\n### 26. RealtimeWAM: One-Step Asynchronous World Action Models (RealtimeWAM：单步异步世界动作模型)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06617)\n- **研究任务**: 解决现有世界动作模型（WAM）中专家内迭代（多步动作去噪）和专家间等待（视频和动作专家顺序执行）限制推理效率的问题，提出 RealtimeWAM 以实现单步动作生成和异步推理。\n- **核心亮点**: 提出教师锚定一致性蒸馏（TACD）解决局部-全局误差差距，利用冻结教师的多步展开终点提供显式监督，实现准确的单步动作生成；提出跨专家波前流水线（CEWP），通过块级共享视频 KV 缓存重叠两个专家，消除不必要的专家级等待；在 LIBERO、LIBERO-Plus 和 RoboTwin 等基准测试中，RealtimeWAM 保持近乎无损的性能（下降 \u003c1%），同时实现显著的端到端加速（如在 H100 上加速 25 倍）。\n- **深度解析**: 本文致力于大幅提升世界动作模型的推理效率，以满足实时控制的需求。针对 WAM 架构中的两大效率瓶颈，TACD 通过蒸馏技术将多步去噪压缩为单步生成，且巧妙利用教师模型的终点状态弥补单步生成的误差；CEWP 则通过流水线设计和 KV 缓存共享，实现了视频和动作专家的异步并行计算。实验证明，该方法在几乎不牺牲性能的前提下实现了高达 25 倍的加速，为 WAM 在实时机器人控制等场景中的部署扫清了障碍。其他实验数据集：摘要未提供。\n- **领域归类**: [具身智能, 机器人学, 模型加速, 世界模型]\n---\n\n### 27. Rethinking Long-Video Efficiency: A Joint Allocation Perspective on Frames, Pixels, and Front-End Latency (重新思考长视频效率：帧、像素和前端延迟的联合分配视角)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04318)\n- **研究任务**: 解决视觉语言模型（VLM）在高效处理长视频时，如何在帧分辨率、时间覆盖率和前端解码延迟之间进行联合分配和权衡的问题，提出 LoHi 框架。\n- **核心亮点**: 通过实证研究得出三个发现：在匹配的 token 预算下，密集的低分辨率采样优于稀疏的原生分辨率采样；对分辨率敏感的任务受益于选定的高分辨率帧；前端解码占据了小时级长视频的主要耗时；提出 LoHi 框架，结合密集的低分辨率视频流和稀疏的高分辨率图像帧；在三个长视频基准上，LoHi 在匹配 token 预算下比原生分辨率基线平均准确率提高 10.6 个百分点，比最强 prior 方法提高 5.2 个百分点，并将前端解码延迟降低高达 7 倍。\n- **深度解析**: 该研究打破了长视频理解中“固定原生分辨率下选择信息帧”的传统思维，提出了帧、像素和前端延迟联合优化的全新视角。作者敏锐地指出前端解码延迟才是长视频处理的真正瓶颈，并据此设计了 LoHi 框架。通过“密集低分辨率+稀疏高分辨率”的混合策略，LoHi 既保证了时间上的全面覆盖，又保留了关键帧的空间细节，同时大幅削减了前端解码的计算开销。具体长视频基准数据集名称：摘要未提供。\n- **领域归类**: [计算机视觉, 视觉语言模型, 视频理解, 模型效率]\n---\n\n### 28. QuantCode Model: Specializing Language Models for Executable Algorithmic Trading Code (QuantCode 模型：为可执行算法交易代码特化语言模型)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39420)\n- **研究任务**: 研究如何将大语言模型特化为能够生成可执行的算法交易代码（将自然语言策略转化为特定交易框架的正确程序逻辑），通过持续预训练和监督微调（SFT）两种机制进行探索，并在 QuantCode-Bench 上进行评估。\n- **核心亮点**: 构建 QuantCode-Bench（包含 400 个 Backtrader 策略生成任务）及类 SWE-bench 的仓库级测试轨道；持续预训练提升了 Qwen 等模型的 Judge Pass 率；在持续预训练后应用 SFT 使 Qwen3.6-35B-A3B 的 Judge Pass 达到 58.2%，成功回测率达 83.5%，代理评估的首轮成功率从 22.3% 提升至 58.3%，最终成功率（最多 10 轮）从 47.5% 提升至 79.5%；发现领域特化会导致解析器兼容的结构化工具调用能力下降，针对性的恢复 SFT 可恢复工具调用格式，但无法恢复基础检查点的仓库级代理性能。\n- **深度解析**: 本文聚焦于大模型在金融算法交易这一高门槛垂直领域的代码生成能力。作者不仅构建了专门的评估基准，还系统地对比了持续预训练和 SFT 在特化模型时的不同作用。研究揭示了一个重要现象：虽然 SFT 能显著提升特定任务的代码生成和回测成功率，但领域特化会引发“能力保留失败”，即破坏模型原有的结构化工具调用能力。这一发现提醒研究者，在进行垂直领域模型特化时，必须显式地评估和恢复基础能力。其他实验数据集：摘要未提供。\n- **领域归类**: [自然语言处理, 代码生成, 金融科技, 模型微调]\n---\n\n### 29. Dynamic Harness Search: Building Multi-Agent Systems Per-Query via Prediction (动态 Harness 搜索：通过预测为每个查询构建多智能体系统)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04137)\n- **研究任务**: 解决多智能体系统的 Harness（指定角色、指令、工具和通信结构）需要根据查询动态定制的问题，提出 SHIFT 方法，将执行移出每个查询的搜索循环，通过预测来构建 Harness。\n- **核心亮点**: 引入 SHIFT 方法，利用本地 LLM 架构师学习 Harness 构建动作的策略和价值函数，通过蒙特卡洛树搜索（MCTS）预测效用（平衡准确率与执行成本）来构建 Harness；在 6 个基准的 9193 个任务上，SHIFT 使用 Gemini 3.5 Flash 执行器达到了约 80% 的最高平均准确率，超越 17 个基线，超出最强基线 7.2 个百分点；SHIFT 的廉价模式在减少 32% 执行 token 的同时仍实现了最高准确率；证明联合选择结构、指令和工具比仅选择指令或工具的效果高出多达 9.1 个百分点。\n- **深度解析**: 该研究针对多智能体系统配置高度依赖具体查询的痛点，提出了一种基于预测的动态搜索框架 SHIFT。传统方法要么依赖昂贵的推理时执行，要么依赖人工设计，而 SHIFT 通过训练一个本地 LLM 架构师来预测不同 Harness 设计的效用，从而利用 MCTS 高效搜索最优配置。这种方法不仅大幅降低了搜索成本，还实现了性能的最优化，为构建自适应、高效率的多智能体系统提供了一种极具前瞻性的自动化设计范式。具体基准数据集名称：摘要未提供。\n- **领域归类**: [AI 代理, 多智能体系统, 自动化机器学习, 提示工程]\n---\n\n### 30. World Editing: Intervening on Executable Worlds at Increasing Depth (世界编辑：在不断增加的深度上干预可执行世界)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02331)\n- **研究任务**: 将“世界编辑”定义为在保持应不变属性的同时干预现有可执行世界，引入“干预深度”作为描述编辑耦合强度的轴，并通过工业级游戏模组化实例化该能力，引入 IGMWorld 和 IGMBench 基准。\n- **核心亮点**: 引入 IGMBench 基准，包含 Minecraft 和 Terraria 的 110 个任务及超过 1.1K 个可执行状态和行为标准，涵盖属性、实体、动力学和系统干预；发现前沿编码代理已具备相当的世界编辑能力（最强配置在严格任务级标准下解决 78.2% 的任务，标准级性能达 94.8%）；可靠性通常随干预深度增加而降低；大多数失败的编辑仍能成功构建和加载，表明主要难点在于使编辑后的世界按要求运行；视觉一致性仍是一个弱点，所有配置的共同视觉通过率均低于 50%。\n- **深度解析**: 本文开创性地将“世界编辑”从世界生成和交互中独立出来，作为一个独特的 AI 能力进行研究。通过引入“干预深度”概念和基于沙盒游戏的 IGMBench 基准，作者为评估 AI 修改复杂可执行环境的能力提供了标准化框架。实验表明，当前的 AI 代理已经能够完成大量浅层编辑任务，但在面对深层系统级干预时仍显吃力，且在视觉一致性上存在明显短板。这项研究拓展了 AI 在虚拟环境中的应用边界，为游戏开发和复杂系统的自动化修改提供了重要的评估基线。其他实验数据集：摘要未提供。\n- **领域归类**: [计算机视觉, 游戏 AI, 世界模型, 基准测试]\n\n### 31. LiFT: Loop Flow Transformers (循环流Transformer)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05538)\n- **研究任务**: 通过循环应用共享的Diffusion Transformer核心来扩展生成模型的计算能力，同时大幅减少参数量和计算开销。\n- **核心亮点**: 提出LiFT模型，通过连续深度坐标索引回归目标，使得训练好的模型能够无限循环推理而无需重新训练或提前退出；在ImageNet 256x256上以更少的参数和计算量实现了更低的FID。\n- **深度解析**: 摘要指出LiFT通过连续深度坐标索引回归目标，使得模型能够循环远超训练深度，且无需重新训练。关于具体的网络层数配置、损失函数的数学表达式以及DiT核心的具体修改细节，摘要未提供。\n- **领域归类**: [计算机视觉, 生成模型, 扩散模型]\n---\n\n### 32. How to Loop MoE: Flatten the Experts, Untie the Attention (如何循环MoE：扁平化专家，解绑注意力)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35751)\n- **研究任务**: 探索如何有效地将循环机制应用于稀疏混合专家（MoE）模型，以提高参数利用率和模型性能。\n- **核心亮点**: 提出Foil方法，通过“扁平化专家”（减半专家层、翻倍每层专家数和循环次数）和“解绑注意力”（每次循环使用独立注意力参数），在固定参数和计算量下显著降低预训练损失并改善路由平衡。\n- **深度解析**: 摘要详细说明了Foil通过“扁平化专家”和“解绑注意力”来提升MoE性能，并指出循环与加宽专家层的收益相互放大。关于具体的专家数量、层数配置以及路由算法的数学细节，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 混合专家模型]\n---\n\n### 33. What Matters for Latent Reasoning with Flow Matching (流匹配潜在推理的关键要素)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06666)\n- **研究任务**: 研究如何使大语言模型在连续潜在空间中进行有效的推理（潜在推理），并满足有用性、多样性、可解释性、可改进性和高效性五个核心要求。\n- **核心亮点**: 提出基于流匹配的潜在推理方法FLaRe，通过明确潜在空间的编码、训练位置、答案读取方式以及使用模型自身验证的思考进行最终训练，全面满足了潜在推理的五个要求，并在准确率接近显式思维链的同时大幅降低延迟。\n- **深度解析**: 摘要提出了FLaRe的五个设计要素（潜在空间编码、塑造、训练位置、读取方式、最终训练阶段）以满足潜在推理的五个要求。关于流匹配的具体数学公式、潜在空间的维度设置以及具体的网络架构，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 模型推理]\n---\n\n### 34. What Gradients Add to Text Leakage in Split Language Models, Counted per Token and per Document (分割语言模型中梯度对文本泄漏的影响：按Token与按文档的量化分析)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04128)\n- **研究任务**: 评估在分割学习（Split Learning）中，服务器返回的梯度对客户端文本隐私泄漏的具体影响，并提出更合理的泄漏评估指标。\n- **核心亮点**: 量化了梯度在文本重建中的作用，发现加入梯度后Token恢复率从94.20%提升至97.38%，文档完全重建率从13.71%大幅提升至37.77%；指出按文档统计比按Token统计更能反映防御方法（如Secret mixup）的真实隐私保护效果。\n- **深度解析**: 摘要量化了梯度在文本重建中的作用，并对比了按Token和按文档统计泄漏的差异，指出Secret mixup防御的局限性。关于具体的攻击算法实现细节、梯度反演的数学推导以及Qwen3-0.6B的具体泄漏数字，摘要未提供。\n- **领域归类**: [安全与隐私, 联邦学习, 模型安全]\n---\n\n### 35. From Knowledge Access to Source Learning: Developing Source-Specific Competence (从知识访问到源学习：培养特定源能力)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02150)\n- **研究任务**: 研究大语言模型智能体如何从单纯“访问”外部知识源，转变为针对特定持久权威源进行“学习”，从而构建可重用的特定源理解能力。\n- **核心亮点**: 提出SourceLearn框架，结合“自导向源学习”（自适应重访未理解内容）和“任务导向源学习”（利用下游经验发现知识组织需求），将重复访问转化为对源的渐进式理解；在多个基准测试中显著优于现有RAG和记忆基线。\n- **深度解析**: 摘要提出了SourceLearn框架的两种学习机制（自导向和任务导向），并报告了在5个基准和3个LLM后端上的提升。关于具体的基准测试名称、LLM后端的具体型号以及“持久源模型”的具体表示形式，摘要未提供。\n- **领域归类**: [自然语言处理, 智能体, 检索增强生成]\n---\n\n### 36. Periscope: Extending Frozen Language Models Beyond Their Context Window (Periscope：将冻结语言模型的上下文窗口向外延伸)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04047)\n- **研究任务**: 在不修改或重新训练冻结语言模型的情况下，突破其原生上下文窗口限制，实现对超长文本的有效阅读和理解。\n- **核心亮点**: 提出免训练推理方法Periscope，通过将文本分块并构建局部与全局步长跨度的“证据图”来定位关键信息，无需完整读取长文本；在多个长文本基准上表现优异，且极大降低了显存需求（27B模型在单张80GB GPU上可处理4.5M token上下文）。\n- **深度解析**: 摘要详细描述了Periscope通过构建局部与全局步长跨度的“证据图”来定位关键信息的免训练推理机制，并给出了显存优化的具体数字。关于具体的块大小参数设置、窗口大小的数学推导细节以及InfiniteBench的具体得分，摘要未提供。\n- **领域归类**: [自然语言处理, 长文本处理, 推理优化]\n---\n\n### 37. Training Numerical Intelligence via Auto-Diagnosis and Skill Discovery (通过自动诊断与技能发现训练数值智能)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03872)\n- **研究任务**: 提升AI智能体在生成科学代码和数值求解器时的自我改进能力，使其不仅能生成代码，还能诊断性能问题并发现更优的数值算法。\n- **核心亮点**: 提出ADSD框架，采用“诊断优先”范式，将数值诊断结果转化为可重用的“求解器技能”；在四个复杂的数值计算领域中显著提升了求解器的准确性、鲁棒性和效率，在GOC-500任务中将平均误差降低了近71倍。\n- **深度解析**: 摘要介绍了ADSD的“诊断优先”范式，将数值诊断转化为可重用的求解器技能，并给出了GOC-500上的误差降低数字。关于具体的诊断算法实现细节、技能发现的具体机制以及在另外三个数值领域的具体提升数字，摘要未提供。\n- **领域归类**: [人工智能 for 科学, 代码生成, 智能体]\n---\n\n### 38. Prism: Dynamic Sparse Attention for Native 2K Joint Video-Audio Generation Model Training (Prism：用于原生2K联合视频-音频生成模型训练的动态稀疏注意力)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05416)\n- **研究任务**: 解决在高分辨率（2K）下原生训练联合视频-音频生成模型时，全注意力机制计算成本过高且注意力分散导致学习信号稀释的问题。\n- **核心亮点**: 提出动态稀疏注意力框架Prism，通过将token序列划分为时空宏区，并结合视频特征方差与音视频交叉注意力范数来动态调整注意力块形状和稀疏度，使注意力聚焦于语义连贯和音视频强耦合区域；在实现2.5倍训练加速的同时提升了生成质量。\n- **深度解析**: 摘要说明了Prism通过时空宏区和音视频特征动态调整注意力块形状的机制，并报告了2.5倍的训练加速。关于具体的超参数设置、宏区的划分阈值以及具体的生成质量评估指标数值，摘要未提供。\n- **领域归类**: [计算机视觉, 多模态生成, 视频与音频生成]\n---\n\n### 39. Beyond Semantic Similarity: Performance and Costs of Agentic Retrieval for Complex Tasks (超越语义相似度：复杂任务中智能体检索的性能与成本)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05750)\n- **研究任务**: 评估在复杂检索任务中，结合大语言模型推理能力与检索器探索能力的“智能体检索”（Agentic Retrieval）的有效性及其带来的计算成本。\n- **核心亮点**: 证实了智能体检索在复杂和跨域检索任务中显著优于标准密集检索（nDCG@10提升8.7分），具有极强的泛化能力；同时量化了其高昂的成本代价（耗时增加约160倍，Token消耗巨大），为未来低成本检索智能体的研究指明了方向。\n- **深度解析**: 摘要对比了智能体检索与标准检索在性能和成本上的差异，证实了其在复杂任务中的有效性及高昂的Token消耗。关于具体的LLM模型名称、检索器具体架构以及ViDoRe v3和BRIGHT的具体得分，摘要未提供。\n- **领域归类**: [信息检索, 智能体, 大语言模型应用]\n---\n\n### 40. Learning to Learn a Language (学习如何学习一门语言)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05879)\n- **研究任务**: 探索大语言模型是否能够在完全不接触真实语言数据的情况下，仅通过合成非语言先验数据预训练，从而获得“学习语言”的元能力（即上下文学习语言的能力）。\n- **核心亮点**: 提出Prior-Fitted Language Model (PFLM)，仅在合成非语言先验上预训练，冻结权重后即可通过上下文前缀“学会”预测多种真实语言、进行数学计算以及压缩代码和语音等非文本数据，证明了模型学到的是“学习语言”的能力而非特定语言本身。\n- **深度解析**: 摘要介绍了PFLM仅在合成非语言先验上预训练的设计，并展示了其在多语言预测、数学计算和数据压缩上的能力。关于具体的结构因果模型数学定义、预训练的具体Token数量以及Wikipedia数据集的具体划分方式，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 预训练与元学习]\n---\n\n### 41. Code2Games: Enabling Coding Agents for Gaming World Generation (Code2Games：赋能代码智能体生成游戏世界)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05033)\n- **研究任务**: 根据自然语言游戏意图，生成包含场景结构、空间布局、游戏目标及可执行逻辑的高质量、结构化游戏世界。\n- **核心亮点**: 提出 Code2Games 智能体框架，通过共享场景-玩法表示在 Blender 基础世界上构建游戏；引入执行引导的重建过程以适配 Unreal Engine 5；提出包含 10 个固定提示的 GameCode4D 基准测试。\n- **深度解析**: 现有的代码智能体在生成游戏组件时难以保持跨组件的一致性。Code2Games 通过协调场景分析、玩法规划等模块解决此问题，并利用编译诊断、运行时反馈和游戏玩法测试结果来修复引擎适配时的不一致。摘要未提供具体的基线方法名称和具体的性能提升数值。\n- **领域归类**: [AI Agent, 游戏生成, 3D 内容生成]\n---\n\n### 42. The Missing Primitive: Diagnosing and Repairing Mathematical Reasoning in Large Language Models (缺失的原语：诊断与修复大语言模型中的数学推理)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02191)\n- **研究任务**: 系统诊断大语言模型在数学推理中的结构性理解能力，并利用诊断发现来改进模型的后训练效果。\n- **核心亮点**: 引入“数学原语（Mathematical Primitive）”概念，提出包含发现、生成、消化、执行四个维度的评估基准；发现“发现（Discovery）”是数学推理的主要瓶颈，并提出原语特权自蒸馏框架进行针对性修复。\n- **深度解析**: 论文指出单纯的解题准确率掩盖了模型真实的能力分布。通过诊断发现模型具备潜在的执行力，但受限于发现能力，且这类失败在后训练中易于修复。提出的自蒸馏框架能有选择性地将原语引导的推理转移给学生模型。摘要未提供具体的基准测试名称、模型规模数值以及具体的准确率提升数字。\n- **领域归类**: [大语言模型, 数学推理, 模型评估与诊断]\n---\n\n### 43. PaLoRA: Paced Low-Rank Adaptation for Continual Learning (PaLoRA：面向持续学习的配速低秩自适应)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04226)\n- **研究任务**: 解决基于 LoRA 的持续学习方法中，因依赖固定小学习率启发式策略而导致的灾难性遗忘问题。\n- **核心亮点**: 揭示有限精度更新会导致知识泄漏，推导出梯度步长幅度限制应随历史知识有效秩自适应增加的“配速定律（pacing law）”；提出 PaLoRA 方法，结合自适应 SVD 截断、零空间投影和秩感知自适应配速。\n- **深度解析**: 传统的持续学习依赖小学习率来限制梯度，但这无法阻止遗忘随历史知识有效秩增加而加剧。PaLoRA 从理论上解决了稳定性与可塑性的平衡问题。在具有挑战性的 50 个任务的 ImageNet-A 和 ImageNet-R 基准上实现了 4% 的准确率大幅提升。\n- **领域归类**: [持续学习, 参数高效微调, 计算机视觉]\n---\n\n### 44. PluginRSI: Recursive Improvement of Agent Harnesses with Reusable Plugins (PluginRSI：利用可复用插件递归改进智能体外围系统)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32423)\n- **研究任务**: 优化大语言模型智能体的外围系统（Harness），解决现有方法在搜索完整程序时机制难以隔离和复用的问题。\n- **核心亮点**: 提出 PluginRSI，将 Harness 表示为原子化插件（Plugins）的组合；独立改进插件并积累在共享库中，在每次迭代中重新组合成新的 Harness，支持跨模型迁移并加速后续优化。\n- **深度解析**: 语言模型外围的 Harness 对智能体性能至关重要。以往搜索完整程序的方式缺乏模块化。PluginRSI 通过插件化和共享库机制，实现了机制的复用与累积演化，演化的插件库能显著加速在未见任务上的收敛。摘要未提供具体的软件工程、命令行交互和问答任务的数据集名称及具体的性能提升数值。\n- **领域归类**: [AI Agent, 提示工程, 软件工程]\n---\n\n### 45. GeoSET: Generalist Foundation Model for SAR-to-EO Image Translation (GeoSET：面向 SAR 到 EO 图像翻译的通用基础模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37496)\n- **研究任务**: 构建一个通用的合成孔径雷达（SAR）到光电（EO）图像翻译基础模型，解决现有模型仅针对单一数据集特化的问题。\n- **核心亮点**: 构建包含超 300 万高质量 SAR-EO 对的大规模异构语料库；开发抗散斑 SAR 编码器并预训练条件生成器；支持通过 LoRA 高效微调（仅更新 0.60% 参数，约 1 小时/数据集），在 6 个下游基准上达到 SOTA。\n- **深度解析**: 针对 SAR 和 EO 图像在不同传感器、分辨率和地理区域的差异，GeoSET 作为首个通用模型，通过大规模预训练和参数高效微调实现了良好的跨域迁移，大幅降低了下游适配的成本。摘要未提供具体的 FID 和 DISTS 指标数值以及 6 个下游基准的具体名称。\n- **领域归类**: [计算机视觉, 图像翻译, 遥感图像处理]\n---\n\n### 46. HLA-WM: Hybrid Linear Attention for Long-Horizon Video World Models (HLA-WM：面向长视界视频世界模型的混合线性注意力)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05739)\n- **研究任务**: 解决长视界视频世界模型中，循环线性注意力（如 Gated DeltaNet）存在的严重长程遗忘问题。\n- **核心亮点**: 提出免训练的混合线性注意力框架 HLA-WM，结合粗粒度几何引导检索与细粒度循环线性状态计算；利用相机几何检索相关历史块并重组为查询特定的循环状态，大幅降低内存占用。\n- **深度解析**: Softmax 注意力内存开销大，而线性注意力会遗忘。HLA-WM 利用 GDN 的仿射结构缓存块级转换摘要，实现了选择性可寻址的循环记忆。在 60 秒 SANA-WM-Bench 上，PSNR 提升 0.74 dB，旋转误差降低 28.5%，历史状态内存减少 12 倍，推理吞吐量最多仅降低 1.6%。\n- **领域归类**: [视频生成, 世界模型, 注意力机制]\n---\n\n### 47. SoK: Semantic Decision Engines in Network Control Loops (知识系统化：网络控制循环中的语义决策引擎)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06425)\n- **研究任务**: 系统梳理和评估语义决策引擎在网络控制循环中的实际应用、时间预算匹配及性能表现。\n- **核心亮点**: 系统化了 139 个论文族，发现绝大多数声称适应控制循环的引擎缺乏实际测量支持；指出缺乏确定性计算步骤是主要差距所在，并推导了最小报告记录、设计规则和研究议程。\n- **深度解析**: 语义决策引擎在实际网络控制中可能错过截止时间或选择不可行操作。论文通过大规模文献梳理揭示了当前研究与实际工程需求之间的脱节，特别是在决策排队和重放执行时间场景下，孤立的请求测试无法反映真实的系统表现。摘要未提供具体的 139 个论文族名称及具体的网络控制场景细节。\n- **领域归类**: [计算机网络, 语义通信, 系统评估]\n---\n\n### 48. OpenRUA: Robot-Use Agents Are Zero-Shot Visuomotor Policies (OpenRUA：机器人使用智能体即零样本视觉运动策略)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02459)\n- **研究任务**: 探索现成的代码智能体能否在不依赖定制抽象层的情况下，直接作为零样本视觉运动策略控制物理机器人。\n- **核心亮点**: 提出 OpenRUA，采用零抽象 Harness 设计，仅提供 ROS 2 终端访问和文档；将感知重构为文件 I/O，操作重构为代码编写；使用 Claude Opus 5 取得极高成功率，并展现出编写感知和闭环控制程序的涌现行为。\n- **深度解析**: 打破了以往为机器人控制智能体设计复杂定制工作流的范式。极简设计证明了原生接口足以让代码智能体自发构建运动控制客户端和闭环控制程序。在 CaP-Bench 上达到 99.0% 成功率，LIBERO-PRO 上达到 87.0%；96.80% 的 episodes 中自发编写感知程序，50.13% 构建闭环控制程序。\n- **领域归类**: [具身智能, 机器人控制, AI Agent]\n---\n\n### 49. TextReg: Mitigating Prompt Distributional Overfitting via Regularized Text-Space Optimization (TextReg：通过正则化文本空间优化缓解提示词分布过拟合)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.21318)\n- **研究任务**: 解决大语言模型提示词优化过程中出现的“提示词分布过拟合”问题，提升提示词的分布外（OOD）泛化能力。\n- **核心亮点**: 将提示词过拟合形式化为“表示低效”（容量成本与作用域狭窄的耦合增长）；提出 TextReg 正则化框架，通过正则化文本梯度实现软惩罚，结合双证据梯度净化、语义编辑正则化等机制。\n- **深度解析**: 现有的提示词优化方法容易导致提示词变长且局限于训练样本的特定规则。TextReg 从离散文本空间优化的表示控制角度出发，有效抑制了过拟合，大幅提升了泛化能力。摘要未提供具体的推理基准测试名称，但指出相比 TextGrad 准确率提升高达 11.8%，相比 REVOLVE 提升高达 16.5%。\n- **领域归类**: [提示工程, 大语言模型, 泛化能力]\n---\n\n### 50. OmniConfess: Eliciting Token Confessions to Mitigate Omni-Modal Hallucination (OmniConfess：激发 Token 坦白以缓解全模态幻觉)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02999)\n- **研究任务**: 缓解全模态大语言模型（OmniLLMs）在生成内容依赖错误证据时产生的幻觉问题。\n- **核心亮点**: 提出免训练的 OmniConfess 方法，通过受控的逐通道证据干预，以 token 分辨率重新评分候选响应，生成结构化的“逐 token-通道坦白（confession）”以揭示证据依赖性；构建包含 3540 个样本的 OmniHalluBench 基准。\n- **深度解析**: 全模态模型在处理文本、图像、音频和视频时容易因证据混淆产生幻觉。OmniConfess 能够精确定位生成内容所依赖的具体模态证据，从而保留有根据的内容并纠正由无关或矛盾证据驱动的错误生成。摘要未提供具体的幻觉缓解准确率数值及 6 个数据集的具体名称。\n- **领域归类**: [多模态大模型, 幻觉缓解, 模型评估]\n---\n\n### 51. Adaptive Fused Prior Transfer for Controllable Generative Image Compression (用于可控生成图像压缩的自适应融合先验迁移)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.16817)\n- **研究任务**: 解决极低码率下图像重建难以保留精细纹理和局部结构的问题，提出一种可控的生成式图像编解码器。\n- **核心亮点**: 提出 AFP-GIC，从冻结的预训练 AdaCode 模型迁移自适应融合先验。编码器端融合先验特征引导潜在表示形成，解码器从压缩表示和控制变量预测兼容的融合先验，无需传输融合先验本身即可实现先验引导重建。\n- **深度解析**: 摘要指出，更好的解码器端融合先验对齐收紧了重建误差上界，且融合先验族包含单码本选择作为特例。实验表明，在统一基准下，AFP-GIC 比 DC-VIC 降低 18.1% 解码延迟，减少 3110 万（20.5%）推理参数。在 Kodak、CLIC2020 和 DIV2K 数据集上，PSNR 和 SSIM 具竞争力，且在 NIQE 分数和极低码率视觉对比中感知增益最明显。\n- **领域归类**: [计算机视觉, 图像压缩, 生成模型]\n---\n\n### 52. LLM-as-Jev: LLMs Are Already Jev-Style Decision Models -- When and How to Fine-Tune Them (LLM-as-Jev：大语言模型已是 Jev 风格决策模型——何时及如何微调它们)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02076)\n- **研究任务**: 研究通用大语言模型（LLM）在开箱即用情况下作为返回预定义选项分类概率分布的 Jev 风格决策模型的能力，以及何时真正需要微调。\n- **核心亮点**: 提出 LLM-as-Jev 框架，直接从带括号的数字标识符的下一个 token 概率中提取校准后的决策。提供免训练推理方法和微调目标（通过树分解列表损失优化候选选择，并用 KL 散度惩罚将辅助预测锚定到基础模型）。\n- **深度解析**: 在 Qwen3.5-4B 和 Qwen3-0.6B 上评估发现，现代 LLM 天生是有效的决策模型：无需训练，4B 模型即可匹配基于相同骨干构建的社区 Jev 风格模型，优于字母 logit 读取，支持任意选项数量，并原生处理图像的多模态决策。微调提供的是针对性而非普遍收益：大幅提升较弱模型和特定任务（如多选项意图路由），但对强骨干模型收益递减。KL 锚点防止了对话文本生成中的行为退化，LoRA 在能力强的模型上表现最佳。\n- **领域归类**: [自然语言处理, 大语言模型, 决策模型]\n---\n\n### 53. Collaborative Personalized Preference Alignment for LLMs under Data Deficiency (数据缺乏下大语言模型的协同个性化偏好对齐)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05898)\n- **研究任务**: 解决在用户特定反馈稀缺的情况下，如何协同学习对齐器初始化以支持对多样化用户偏好的少样本适应问题。\n- **核心亮点**: 提出近似帕累托最优（APO）方法。首先对更新兼容的用户进行分组以减少干扰；在每组内，结合梯度下降与受控上升来协调竞争目标，向偏好特定的帕累托前沿点移动，生成接近组内用户最优的初始化；然后通过少样本局部适应的更新迭代优化。\n- **深度解析**: 摘要指出，该方法为单步局部协同更新建立了条件次优界，并表征了初始化误差如何影响后续随机适应。在 Fed-ChatbotPA 和 UltraFeedback 数据集上的实验表明，仅使用 20 个局部样本即可取得优于现有方法的一致性提升。\n- **领域归类**: [自然语言处理, 大语言模型, 偏好对齐, 联邦学习]\n---\n\n### 54. COSMI: COmpositional Synthesis of Multi-object Interactions (COSMI：多对象交互的组合合成)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03252)\n- **研究任务**: 解决人体-对象交互生成模型受限于数据的问题，通过组合单对象交互来合成多对象交互。\n- **核心亮点**: 提出 COSMI 数据集和方法。通过组合接触一致的单交互片段、镜像平衡手部、跨身体转移，并利用语言模型和几何检查仅允许语义和物理上合理的配对，使数据集随片段组合增长。训练了一个文本到交互的扩散 Transformer，使用权重共享的对象槽生成可变数量的对象。\n- **深度解析**: COSMI 数据集包含 22.2 万个序列和 275 小时数据，最多支持 5 个对象，是最大多对象捕获数据集的近 30 倍。在包含未见对象和未见交互组合的基准上，模型泛化到未见组合。COSMI 在文本对齐和接触准确性上优于基线，在未见对象上优势最大。\n- **领域归类**: [计算机视觉, 3D视觉, 人体-对象交互, 生成模型]\n---\n\n### 55. Learning Latent Protein Languages for Autoregressive Generation (学习潜在蛋白质语言用于自回归生成)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03978)\n- **研究任务**: 解决自回归 Transformer 在蛋白质序列和结构生成中相对较弱的问题，研究目标表示的作用并引入两种学习的潜在蛋白质语言。\n- **核心亮点**: 引入蛋白质潜在语言（PLL）和结构潜在语言（SLL）。PLL 将序列映射到基于冻结 ESM-2 编码器构建的 4096 态上下文字母表；SLL 调整 GCP-VQVAE Lite 并保留解码为骨架坐标。分别预训练自回归 Transformer 模型（PLLM 和 SLLM）。\n- **深度解析**: 在匹配的下游序列训练下，PLLM 拟合的计算缩放指数为 0.038，而氨基酸自回归模型为 0.020。在无条件序列生成中，PLLM 将低于 1.5-bit 残基组成熵阈值的样本比例降低了 54%。对于序列到结构预测，用 SLL 替换原始分词器使最佳验证困惑度降低了 34%。对于长蛋白质，潜在 token 采样比基于 MSA 的 AlphaFold2 快约 1000 倍。SLLM 在多样性和新颖性上与其他生成模型相比具有优势。\n- **领域归类**: [人工智能, 生物计算, 蛋白质生成, 自回归模型]\n---\n\n### 56. FairRSFM: A Biome-Aware Benchmark and Debiasing Framework for Remote Sensing Foundation Models (FairRSFM：遥感基础模型的生物群落感知基准与去偏框架)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05790)\n- **研究任务**: 解决遥感基础模型（RSFM）评估中聚合指标掩盖不同生态区域性能差异的问题，提出评估生态组鲁棒性的基准和去偏框架。\n- **核心亮点**: 引入 FairRSFM，将 14 个陆地生物群落类的地理参考样本映射为 6 个生态宏观组，在统一的冻结骨干评估协议下评估模型。涵盖 m-EuroSAT 等 4 个下游数据集。评估了 BOLP、DBR 和 GroupDRO 等缓解基线。\n- **深度解析**: 实验表明聚合性能一致掩盖了跨架构和任务的生物群落依赖差异。例如，Prithvi-EO-2.0 在 m-EuroSAT 上总体 macro-F1 达 90.98%，但最差组平均分仅 83.72%；m-SA-Crop-Type 从总体 27.30% mIoU 降至旱生和矿物组的 18.47%。BOLP 在不更新骨干的情况下将 Prithvi-EO-2.0 在 m-BigEarthNet 上的最差组 F1@opt 从 46.12% 提升至 50.27%。\n- **领域归类**: [计算机视觉, 遥感, 基础模型, 公平性与去偏]\n---\n\n### 57. DeskForge: Dense Supervision from Desktop Environments for Computer-Use Agents (DeskForge：来自桌面环境的计算机使用智能体密集监督)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02320)\n- **研究任务**: 解决计算机使用智能体在复杂桌面场景中难以可靠定位动作目标的问题，提供大规模密集监督数据。\n- **核心亮点**: 引入 DeskForge，一个可控的桌面环境，通过组合和探索真实应用生成大规模监督。它改变应用状态、内容、窗口布局等，融合截图、无障碍树和窗口几何生成密集元素注释。构建了包含 120 万个注释桌面观察和 1.597 亿元素实例的 DeskForge-1M 语料库。\n- **深度解析**: 在 20 万个接地示例上微调 4 个视觉语言模型，均在保留桌面条件和 5 个外部 GUI 接地基准上取得提升。Qwen3.5-4B 在 ScreenSpot-Pro 上准确率提高 11.51 个百分点，在 OSWorld-G 上提高 10.11 个百分点。在固定规划器下，微调后的动作模型解决了更多 WebArena-Infinity 和 OpenApps 任务，Qwen3.5-4B 分别从 119 个任务中的 31 个增加到 50 个，从 100 个任务中的 3 个增加到 15 个。\n- **领域归类**: [人工智能, 智能体, 计算机使用, 视觉语言模型]\n---\n\n### 58. MM-ABC: Towards Generalist Mobile Manipulation via Seeing, Coordinating and Imagining (MM-ABC：通过观察、协调与想象实现通用移动操作)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35652)\n- **研究任务**: 解决移动操作中的空间感知和异构机械臂与底盘动作协调控制挑战，提出支持跨流高效协作的基础模型。\n- **核心亮点**: 提出 MM-ABC，结合稀疏多层 VLM 特征进行空间感知；使用仅训练的未来分支（利用世界想象和几何意图作为额外监督）；以及 MM-APT，通过掩码联合注意力和干净动作 x 预测协调独立的操作和移动流。\n- **深度解析**: 在超过 5000 小时、跨越 40 万+ episodes、12 个数据集和 17 个实体的异构机器人数据上预训练。消融实验表明，用速度预测替换干净动作预测会使 RoboCasa365 复合可见任务成功率从 32.8% 降至 29.2%。在 EBench 上达到 44.71% 成功率，RoboCasa365 为 61.2%，LIBERO 为 99.1%，LIBERO-Plus 为 82.8%（无扰动训练），5 个真实世界任务平均成功率为 83%。\n- **领域归类**: [机器人学, 移动操作, 基础模型, 强化学习]\n---\n\n### 59. Empirical Variational Autoencoder (经验变分自编码器)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06545)\n- **研究任务**: 提出一种用于连续值（非向量量化）序列的通用生成框架。\n- **核心亮点**: 提出经验变分自编码器（EVA），基于 VAE 的证据下界，但从训练数据中经验性地学习自回归潜在先验，仅需在 VAE 顶部添加一个额外的单线性层即可实现。用自预测先验替代传统的标准高斯约束。\n- **深度解析**: 摘要指出，EVA 显著缓解了传统 VAE 中常见的先验和后验之间的潜在分布差距，从而实现了序列数据生成的高保真祖先采样。在图像和声音合成上的大量实验表明，尽管推理时间快得多，EVA 仍能达到与自回归扩散基线相当的生成质量。\n- **领域归类**: [机器学习, 生成模型, 变分自编码器, 序列生成]\n---\n\n### 60. GeoCR: Learning a Generalist Cloud Removal Prior from Heterogeneous Observations (GeoCR：从异构观测中学习通用去云先验)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32510)\n- **研究任务**: 解决去云方法通常局限于单个数据集和输入配置的问题，提出一个统一多种去云任务的通用模型。\n- **核心亮点**: 引入 GeoCR，在单一网络中统一仅基于 RGB 和基于多光谱的去云（支持单/多时相 cloudy 观测及可选 SAR 引导）。通过紧凑的输入输出分支扩展预训练的 RGB 自编码器，保持编码器/解码器主干冻结。共享潜在接口使单个流 Transformer 能够联合建模干净的 RGB 和非 RGB 潜在表示。\n- **深度解析**: 在包含 883,331 张无云目标图像的 10 个数据集训练集上联合预训练。同一预训练检查点支持直接推理和通过 LoRA 高效适应。在 SEN12MS-CR、Sen2_MTC_New 和 CUHK-CR2 等测试集的全波段和仅 RGB 设置下，GeoCR 取得了最佳的 FID 和 DISTS 指标，优于现有模型。\n- **领域归类**: [计算机视觉, 遥感, 图像恢复, 去云]\n---\n\n### 61. Intent Interpretation at RIC Timescales: Jev Decision Models versus Large Language Models in 6G Open RAN (RIC时间尺度下的意图解释：6G Open RAN中的Jev决策模型与大语言模型对比)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23136)\n- **研究任务**: 比较在6G Open RAN的RAN智能控制器（RIC）循环中，将意图转化为A1策略时，决策模型（如Jev-1.13.0）与生成式大语言模型（LLMs）的性能差异，特别是评估LLM的额外延迟是否会影响控制截止时间、RIC容量或无线电性能。\n- **核心亮点**: 在RANIntent v1基准、闭环ns-3仿真和真实A1/E2路径上进行了对比。Jev-1.13.0在99.8%的调用中满足1秒近实时预算，而两个托管LLM仅分别满足17.9%和0%。在理想执行下，受影响类别的服务级别协议（SLA）违规率向意图请求方向移动了3.96个百分点。\n- **深度解析**: 该研究通过实证对比揭示了在严格时间约束下，类型化决策模型在实时性上显著优于生成式大语言模型，为6G Open RAN的控制器选型提供了直接依据。关于LLM逐token生成导致延迟增加的具体底层计算机制，以及Jev模型满足实时预算的深层架构设计细节，摘要未提供。\n- **领域归类**: [6G通信, Open RAN, 大语言模型, 意图驱动网络]\n---\n\n### 62. Learning Steadily: Accumulating Relative Point Margin Scores for Face Image Quality Assessment (稳步学习：累积相对点边界分数用于人脸图像质量评估)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.31662)\n- **研究任务**: 解决与人脸识别（FR）集成的面部图像质量评估（FIQA）方法中的时间不稳定性问题，即训练过程中特征空间演变导致单epoch质量估计波动，从而破坏可靠的质量预测。\n- **核心亮点**: 提出CARPM-FIQA，一种在整个训练轨迹中累积相对点边界测量（类内紧凑度与类间分离度的比率）的稳定策略。在SynFIQA数据集和8个基准测试上，结合4个FR模型，CARPM-FIQA在pAUC-EDC和AUC-EDC平均排名中位列17种方法中的第4和第6，同时保持了FR集成的性能优势。\n- **深度解析**: 该方法证明了时间聚合策略可以有效稳定深度学习中因特征表示演变而导致的目标值波动，为FIQA提供了原则性的解决方案。关于累积平均在数学上如何具体降低方差并保证收敛的深层理论推导细节，摘要未提供。\n- **领域归类**: [计算机视觉, 人脸识别, 图像质量评估, 深度学习]\n---\n\n### 63. CurveCodec 2: Skeleton-agnostic animation compression with a learned entropy model (CurveCodec 2：基于学习熵模型的骨骼无关动画压缩)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04211)\n- **研究任务**: 探索骨骼运动压缩中冗余的位置，以及编解码器的哪些部分应由学习模型接管，以在保持生产级误差界限的同时，为任意骨骼实现高效压缩。\n- **核心亮点**: 提出CurveCodec 2，将每条子轨迹编码为对数映射中的曲线，在闭环中量化并精简为率失真选择的关键帧，残差在小型学习模型下进行熵编码。在4472个片段的测试集上，在最坏情况契约下仅需ACL字节数的0.37倍（0.01厘米精度），在平均契约下仅需0.22倍（0.1厘米精度），且可在单CPU核心上解码，无需重新训练即可迁移至训练集中未出现的物种。\n- **深度解析**: 研究表明网络真正学到的是编解码器必须发送的残差分布，明确了学习模型在动画编解码器中的最佳作用域。关于最近邻oracle为何不如线性插值，以及学习模型具体如何拟合残差分布的深层网络结构细节，摘要未提供。\n- **领域归类**: [计算机图形学, 动画压缩, 熵编码, 深度学习]\n---\n\n### 64. Arm-wise Compositional Generalization in Dual-Arm Vision-Language-Action Models (双臂视觉-语言-动作模型中按臂划分的组合泛化)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06184)\n- **研究任务**: 研究双臂协作中的组合泛化能力，即如何以新的方式跨双臂组合熟悉的原子技能，并评估不同训练和架构选择在满足不同协调要求时对这种能力的支持。\n- **核心亮点**: 引入ACG-Bench基准，包含8个任务族的23个任务-条件对。提出AE-VLA架构，结合臂token分组、技能特定LoRA适配器（SkillLoRA）和按臂注意力（AWA）。在仿真中，AE-VLA达到21.53%的泛化成功率，远超Single π_0.5 (2.94%)、MA-VLA (3.06%) 和独立控制策略 (5.53%)。在物理SO101机器人上，AE-VLA在5个未见条件下平均成功率达39.00%，而最强基线仅为10.00%。\n- **深度解析**: 该研究为设计能够超越固定训练例程的双臂策略提供了实证指导，突出了技能条件参数与注意力结构的互补性。关于臂token分组、SkillLoRA和AWA组合产生互补效应的深层注意力机制，以及独立控制策略效果不佳的具体原因，摘要未提供。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 组合泛化, 强化学习]\n---\n\n### 65. Closing the Context Gap: Activation Alignment for Tabular In-Context Learning (弥合上下文差距：用于表格上下文学习的激活对齐)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06679)\n- **研究任务**: 解决表格基础模型在上下文学习（ICL）中，由于必须处理所有训练样本导致每次预测成本高昂的问题，在减少上下文样本数量以降低成本时，如何避免性能大幅下降。\n- **核心亮点**: 提出“激活对齐”方法，通过在合成无标签数据上训练一个轻量级线性变换，将受数据限制的“学生”模型的中间激活映射到使用全数据的“教师”模型的激活。在TabArena基准的38个分类数据集上，对齐后的学生在所有上下文预算下均取得显著提升，在低数据机制下恢复了教师近一半的预测优势，且训练无需GPU，仅需数秒至数分钟。\n- **深度解析**: 该方法提供了一种实用、低开销的途径，在实现紧凑上下文推理速度的同时，弥合了与全上下文教师之间的显著性能差距。关于为何简单的线性变换足以对齐中间激活，以及该对齐方法在不同表格基础模型间泛化能力的底层机制，摘要未提供。\n- **领域归类**: [表格数据, 上下文学习, 基础模型, 知识蒸馏]\n---\n\n### 66. Sharpen Without Search: On-Policy Distillation of Sequence-Level Power Distribution (无搜索锐化：序列级功率分布的同策略蒸馏)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06804)\n- **研究任务**: 解决语言模型在采样时，由于错误答案的总概率高于单个正确答案，导致通常采样出错误答案的问题。旨在通过训练模型在单次生成中产生高概率的正确答案，从而避免依赖需要大量候选项的功率分布采样。\n- **核心亮点**: 提出同策略功率蒸馏（OPPD），运行序列蒙特卡洛采样器，由被训练模型生成候选，并由冻结教师的功率分布进行加权。OPPD在MATH500和GSM8K上将单次生成准确率分别提高了23.0和27.3个百分点，且单次生成得分比64个候选的功率采样高出2.4和3.5分。与GRPO相比，OPPD在MATH500、GSM8K和AIME上分别高出3.8、4.0和5.4分，且在GRPO之后应用OPPD可额外增加高达9.3分。\n- **深度解析**: 该研究成功将序列级的功率分布锐化能力蒸馏到单次生成中，大幅降低了推理时的搜索成本，且与GRPO等强化学习方法具有互补性。关于OPPD如何具体吸收1.19到2.02之间的锐化指数，以及序列级功率分布在数学上如何改变模型损失景观的深层细节，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 强化学习, 推理能力]\n---\n\n### 67. Labels Override Definitions in Jev-Style Typed Decision Models (Jev风格类型化决策模型中标签覆盖定义)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02586)\n- **研究任务**: 研究Jev风格的类型化决策模型在推理时，其输出概率是遵循选项的书面定义，还是倾向于选项的短标签（即探究“选项-标签偏差”现象）。\n- **核心亮点**: 发现四个开源权重模型和11个分类任务中，答案主要受标签驱动。删除所有定义准确率几乎不变，而将选项重命名为A和B会使准确率提升+0.1511。研究定位到该故障源于提示渲染（prompt rendering）方式（如laya写“{label}: {definition}”而von只写定义），而非之前认为的约束决策头，并提供了两次调用测试帮助从业者识别其模型情况。\n- **深度解析**: 该研究纠正了以往将类型化决策模型的标签偏差归咎于约束决策头的错误认知，准确定位了问题根源在于提示词渲染格式，为开发者调试和修复模型行为提供了直接指导。关于提示渲染格式导致模型忽略定义而依赖标签的深层注意力分配机制，摘要未提供。\n- **领域归类**: [大语言模型, 模型评估, 提示工程, 决策模型]\n---\n\n### 68. iADD: Improving Alignment and Diversity in Diffusion Policy Optimization (iADD：改善扩散策略优化中的对齐与多样性)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.01789)\n- **研究任务**: 解决基于强化学习的扩散模型后训练（如DDPO）在奖励优化过程中以牺牲多样性和质量为代价的问题，旨在实现对齐与多样性之间更好的权衡。\n- **核心亮点**: 通过理论分析证明，先前工作中认为的“仅更新扩散模型后期时间步”实际上可能对多样性有害。提出基于强理论基础的增量Feynman-Kac训练方法，以实现最佳的“对齐-多样性”权衡。在三个不同任务上的广泛实验和消融研究验证了该方法在对齐和多样性方面的显著性能提升。\n- **深度解析**: 该研究从理论层面修正了扩散模型后训练中关于时间步更新的认知，并引入了增量Feynman-Kac框架来平衡对齐与多样性。关于增量Feynman-Kac训练的具体数学推导细节，以及“后期时间步更新有害”的具体理论证明过程，摘要未提供。\n- **领域归类**: [生成模型, 扩散模型, 强化学习, 策略优化]\n---\n\n### 69. Foresight: planning future perception in streaming VLMs without retraining (Foresight：在流式VLM中无需重新训练规划未来感知)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03123)\n- **研究任务**: 解决现有流式视觉-语言模型（VLMs）在推理过程中计算路径固定、无法根据不断变化的场景动态自适应调整计算的问题，旨在无需重新训练的情况下动态配置未来计算。\n- **核心亮点**: 提出FORESIGHT双流架构，包含两个共享权重的Siamese LLM、输入编码器和KV缓存。第一个LLM处理当前token，第二个LLM提前运行以预测未来上下文、规划计算并生成响应。在冻结的Qwen3-VL-8B骨干上，FORESIGHT在OmniPro Online评估中达到23.0的平均联合F1，比最强训练基线高9.5%，并在StreamingBench和OVO-Bench上分别提升6.7和15.4。\n- **深度解析**: 该研究挖掘了流式VLMs固有的未来 anticipation 能力，通过双流架构和轻量级重配置协议，实现了计算资源的动态自适应分配，大幅提升了流式视频理解的鲁棒性。关于第二个LLM如何具体预测未来上下文，以及模式引导解码和基于差异的更新如何保持极低开销的具体技术细节，摘要未提供。\n- **领域归类**: [计算机视觉, 视觉-语言模型, 流式处理, 动态计算]\n---\n\n### 70. Adapting prior-data fitted networks for tabular anomaly detection (调整先验数据拟合网络用于表格异常检测)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06693)\n- **研究任务**: 研究如何调整和利用先验数据拟合网络（PFNs，如TabPFN）的特征表示，以解决表格数据中由于缺乏强深度表示和异常检测中缺乏监督信号及参考集可能包含异常而导致的困难。\n- **核心亮点**: 首先使用冻结的TabPFN特征，通过计算样本在特征空间中到最近邻的距离进行评分（ZEN方法），取得了强劲结果。随后，使用参考集对模型进行微调（FOCUS方法），使特征更好地区分正常样本和异常。在ADBench基准上，ZEN达到了高于所有基线的平均AUROC，FOCUS进一步提升了性能，且该方法可跨PFN模型泛化。\n- **深度解析**: 该研究成功将PFNs强大的表格特征表示能力迁移至异常检测领域，通过免微调和微调两阶段策略，有效克服了异常检测中缺乏监督信号和参考集污染的难题。关于ZEN和FOCUS具体如何识别并处理参考集中的异常，以及选择了哪些具体层进行特征提取的技术细节，摘要未提供。\n- **领域归类**: [表格数据, 异常检测, 先验数据拟合网络, 特征表示]\n\n### 71. MEA: A Reward-Driven multi-Agent System for Faithful Model Explanations (MEA：一种用于忠实模型解释的奖励驱动多智能体系统)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02480)\n- **研究任务**: 解决机器学习模型在高风险领域中缺乏透明度的问题，降低领域专家使用事后解释方法的知识门槛，提供忠实于模型底层行为的自然语言解释。\n- **核心亮点**: 提出了 MEA 多智能体框架，包含 Proposer（提议者）和 Actor（执行者）两个智能体。Proposer 根据问题和数据模态自动选择并配置解释工具；Actor 则针对“忠实度”进行端到端优化，将工具输出转化为基于模型行为的自然语言解释。此外，研究引入了涵盖特征归因、反事实推理和虚假特征检测的多种问题类型，并配备了基于扰动的忠实度评估指标。\n- **深度解析**: 摘要指出，前沿大语言模型（LLMs）会系统性地产生不忠实的解释。MEA 通过结合模态自适应惩罚的忠实度奖励进行优化，在六个数据集上持续优于事后解释器、智能体和闭源基线模型（具体的数据集名称摘要未提供）。与未训练的主干模型相比，奖励驱动优化带来了显著的忠实度提升：表格数据提升 28%，文本提升 21%，视觉提升 34%。该研究表明，AI 智能体本身可以作为机器学习可解释性的可扩展、自适应接口，突破了传统固定、单一用途工具的限制。\n- **领域归类**: [可解释性人工智能 (XAI), 多智能体系统, 大语言模型应用]\n---\n\n### 72. DEPICT: Scoring Text-to-Image Alignment by Answer Agreement (DEPICT：通过答案一致性对文本到图像的对齐进行评分)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03617)\n- **研究任务**: 评估文本到图像（T2I）生成模型的对齐质量，解决现有评估指标在捕捉细粒度细节（如缺失对象、属性交换、计数错误）以及处理否定语义方面的不足。\n- **核心亮点**: 提出了一种无需训练的评估指标 DEPICT。它用“基于图像的答案”和“仅基于文本（标题）的答案”之间的预期一致性来替代固定的参考答案，并根据标题对问题的决定性程度对问题进行加权。此外，DEPICT 将这种一致性得分与全局（holistic）得分合并，以恢复问题分解过程中丢失的上下文信息。\n- **深度解析**: 现有的微调指标受限于单一骨干网络和训练分布，全局指标会遗漏细粒度细节，而分解指标依赖固定的“是”假设，容易误判。DEPICT 通过一致性规则，将否定语义的准确率从 19% 大幅提升至 88%。在五个基准测试和三个模型家族的十一个骨干网络上的评估表明，DEPICT 超越了所有无需训练的指标，并在三个人类相关性基准测试中的两个上超过了微调评估器（具体的基准测试名称和骨干网络型号摘要未提供）。\n- **领域归类**: [计算机视觉, 多模态学习, 文本到图像生成评估]\n---\n\n### 73. InterMimicGen: Scaling Humanoid Loco-Manipulation through Self-Evolving Motion Imitation (InterMimicGen：通过自进化运动模仿扩展人形机器人移动操作)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06850)\n- **研究任务**: 解决捕捉到的人-物交互数据稀疏、异构且机器人无法直接执行的问题，为人形机器人的移动操作（loco-manipulation）提供丰富、可扩展且高质量的监督信号。\n- **核心亮点**: 提出了 InterMimicGen，一个自进化的运动模仿框架，使机器人运动数据和跟踪策略相互促进。主要包含三个步骤：1) 整合人类动作捕捉数据并重定向为人形机器人参考动作，保留全身协调和灵巧手-物关系；2) 训练一个基于物理的通用跟踪器在仿真中执行这些参考动作；3) 构建数据飞轮，通过对交互位置和身体执行方式进行微调，并仅保留成功完成任务的变体来播种下一轮，实现数据的自我进化。\n- **深度解析**: 实验结果表明，该框架实现了跨机器人配置的接触保持重定向、使用单一通用策略的广泛跟踪、在增强轮次中不断增长的可执行运动，以及向真实机器人的物理迁移。关于具体的实验数据集名称、详细的定量评估指标和成功率等数字，摘要未提供。该框架为从异构的人类演示到持续扩展的人形机器人学习运动资源提供了一条统一的路径。\n- **领域归类**: [机器人学, 强化学习, 模仿学习]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [earthtojake/text-to-cad](https://github.com/earthtojake/text-to-cad)\n- **今日趋势**: 总 Stars: 17,871 | Forks: 1,797 | 今日新增: 620\n- **项目简介**: 赋予AI代理CAD（计算机辅助设计）超能力的工具。\n- **核心价值**: \n  - **项目用途**: 为AI代理提供CAD设计能力。\n  - **目标人群**: AI代理开发者、CAD设计师。\n  - **技术核心**: AI代理与CAD软件的集成与交互。\n  - **是否AI/大模型相关**: 是。\n---\n### [ayghri/i-have-adhd](https://github.com/ayghri/i-have-adhd)\n- **今日趋势**: 总 Stars: 54,292 | Forks: 3,120 | 今日新增: 318\n- **项目简介**: 防止编程代理隐藏答案并提供ADHD（注意力缺陷多动障碍）友好输出的技能插件。\n- **核心价值**: \n  - **项目用途**: 优化编程代理的输出格式，防止关键答案被隐藏，使其对ADHD用户更友好。\n  - **目标人群**: 编程代理用户、患有ADHD的开发者或普通用户。\n  - **技术核心**: 代理输出格式化与提示词/技能优化。\n  - **是否AI/大模型相关**: 是。\n---\n### [p-e-w/heretic](https://github.com/p-e-w/heretic)\n- **今日趋势**: 总 Stars: 33,663 | Forks: 3,753 | 今日新增: 331\n- **项目简介**: 针对语言模型的全自动审查移除工具。\n- **核心价值**: \n  - **项目用途**: 自动移除语言模型的内容审查与输出限制。\n  - **目标人群**: 大模型开发者、需要无限制模型输出的研究人员或用户。\n  - **技术核心**: 语言模型审查机制的绕过或移除技术。\n  - **是否AI/大模型相关**: 是。\n---\n### [anthropics/knowledge-work-plugins](https://github.com/anthropics/knowledge-work-plugins)\n- **今日趋势**: 总 Stars: 26,335 | Forks: 3,078 | 今日新增: 124\n- **项目简介**: 主要为知识工作者在Claude Cowork中使用的插件开源仓库。\n- **核心价值**: \n  - **项目用途**: 提供用于Claude Cowork的插件集合，增强知识工作者的工作流。\n  - **目标人群**: 知识工作者、Claude Cowork用户。\n  - **技术核心**: Claude Cowork插件开发与生态集成。\n  - **是否AI/大模型相关**: 是。\n---\n### [0x4m4/hexstrike-ai](https://github.com/0x4m4/hexstrike-ai)\n- **今日趋势**: 总 Stars: 12,458 | Forks: 2,537 | 今日新增: 59
