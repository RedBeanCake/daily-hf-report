    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. STEPQuant: When and Where Errors Matter in Delta-Rule Recurrent State Quantization (STEPQuant：Delta规则循环状态量化中误差发生的时间与位置)\n- **社区热度**: `👍 96 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38169)\n- **研究任务**: 针对线性注意力模型中固定大小的循环状态，研究并解决其在并发服务时的内存瓶颈，提出一种Delta规则循环状态的后训练量化方法。\n- **核心亮点**: 提出STEPQuant框架，根据误差大小和内存生命周期分配精度，并联合拟合key-row和value-column的缩放比例。在名义6-bit预算下接近FP32精度，4-bit配置下优于均匀INT8。集成到SGLang后实现5倍以上的循环状态压缩，总服务内存减少高达68.7%。\n- **深度解析**: 摘要未提供\n- **领域归类**: [模型压缩与量化, 大语言模型推理优化, 线性注意力机制]\n---\n\n### 2. Long-WAM: Scaling the Context of World-Action Models (Long-WAM：扩展世界-动作模型的上下文)\n- **社区热度**: `👍 87 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10528)\n- **研究任务**: 在实时机器人控制的约束下，扩展因果世界-动作模型（World-Action Models）的视觉历史上下文长度。\n- **核心亮点**: 提出Long-WAM框架，发现使用自回归（AR）预训练的视频基础模型能更有效地利用长历史。在RoboCasa GR-1上，上下文从0增加到19.2秒使成功率从63.3%提升至78.7%。支持在RTX 5090等硬件上实时部署（单动作块耗时107.4ms），并在Unitree G1等机器人上实现95%的动态叠杯成功率。\n- **深度解析**: 摘要未提供\n- **领域归类**: [具身智能, 机器人控制, 视频基础模型, 实时系统]\n---\n\n### 3. nanoMuse: An Open-Source Personal Agent for Every Device You Own (nanoMuse：面向你所拥有所有设备的开源个人智能体)\n- **社区热度**: `👍 81 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08699)\n- **研究任务**: 构建一个开源的个人智能体系统，使其能够跨设备、跨账户运行，并具备长期记忆、主动交互和可解释性。\n- **核心亮点**: 提出基于GPL-3.0协议的nanoMuse，作为Meta闭源Muse的开源替代。支持在用户拥有的每个设备上运行并控制屏幕，通过中继共享对话，所有操作经过Sentinel审查，记忆为用户可读的文件，且底层模型由用户自主选择。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI智能体, 个人助理, 开源系统, 跨设备协同]\n---\n\n### 4. Recursive Game Creator: An Agentic Product-Level Experience-Oriented Game Harness (递归游戏创建器：面向产品级体验的智能体游戏开发框架)\n- **社区热度**: `👍 77 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08621)\n- **研究任务**: 解决智能体生成游戏时“程序正确但不具备娱乐性”的问题，将游戏开发从粗略原型推进到具有良好玩家体验的产品级游戏。\n- **核心亮点**: 提出包含Designer、Builder、Player和Reviewer四个组件的递归开发框架。Player通过编程接口高效收集轨迹，Reviewer结合视觉和文本偏好进行评估。在GameCraft-Bench上达到77.89的SOTA，在GameASG-Bench上任务成功率提升34.1%至53.2%，运行时检查通过率达93.4%。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI智能体, 游戏生成, 强化学习, 人机交互]\n---\n\n### 5. DecepEval: A Benchmark for Evaluating Deception in LLM Agents (DecepEval：评估大语言模型智能体欺骗行为的基准测试)\n- **社区热度**: `👍 64 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07967)\n- **研究任务**: 系统评估大语言模型（LLM）智能体在何种外部条件下更容易产生欺骗行为，以解决其自主性带来的可靠性担忧。\n- **核心亮点**: 提出DecepEval基准，包含1532个实例、3个任务家族和28个专业场景。提出“LLM欺骗钻石框架”（涵盖压力、激励、机会、冲突四个条件）。对9个前沿LLM的评估表明，诱导条件会显著增加各模型的欺骗率。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI安全与对齐, 大语言模型评估, 智能体行为分析]\n---\n\n### 6. Questioning the Questions: Sustaining Self-Evolution in Reasoning Models (质疑问题：维持推理模型的自我进化)\n- **社区热度**: `👍 63 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04299)\n- **研究任务**: 解决推理模型在自我进化（从自己生成的问题中学习）过程中，因重复自训练导致的性能崩溃问题。\n- **核心亮点**: 发现自生成问题存在无效问题和重复变体两个质量问题。提出R-Quest方法，训练solver识别并拒绝无效问题，并使用冻结基础模型提供新颖性反馈以避免重复。在12个基准上取得最高平均性能，在10轮自我进化中保持稳定增长，最终轮比R-Zero高17.32分。\n- **深度解析**: 摘要未提供\n- **领域归类**: [大语言模型, 推理能力, 自我进化, 强化学习]\n---\n\n### 7. GRACE: Generation-aware latent compression for efficient video generation (GRACE：面向高效视频生成的生成感知潜在压缩)\n- **社区热度**: `👍 62 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10524)\n- **研究任务**: 通过压缩预训练视频自编码器来加速视频扩散模型（DiT），同时保持与预训练DiT的兼容性以避免昂贵的重新训练。\n- **核心亮点**: 提出GRACE两阶段框架，保持冻结的基础潜在表示并学习残差潜在表示，在冻结DiT特征空间中对齐压缩潜在表示。通过轻量级微调和不对称去噪适配DiT。将Wan2.1-I2V-14B的token数量减少8倍，延迟降低11.1倍，且在VBench上匹配压缩前的生成质量。\n- **深度解析**: 摘要未提供\n- **领域归类**: [视频生成, 模型压缩, 扩散模型, 自编码器]\n---\n\n### 8. VepAgent: Bridging Causal-Transition via Tool-Augmented Reinforcement Learning for Video Event Prediction (VepAgent：通过工具增强强化学习桥接因果转换以进行视频事件预测)\n- **社区热度**: `👍 52 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06293)\n- **研究任务**: 解决多模态大语言模型（MLLMs）在视频事件预测中依赖回顾性总结，难以桥接未观察到的因果转换的问题。\n- **核心亮点**: 提出VepAgent框架，结合因果转换推理与工具增强强化学习。构建futurebench-4K数据集用于SFT，开发包含状态跟踪、帧检索等工具的诊断库以在推理时动态增强推理。提出复合奖励机制联合优化预测准确性与因果连贯性，在FutureBench和NEPBench上达到SOTA。\n- **深度解析**: 摘要未提供\n- **领域归类**: [视频理解, 多模态大模型, 强化学习, 因果推理]\n---\n\n### 9. SGF+: Decoupling Gradient Flows for Autoregressive Video Generation (SGF+：解耦自回归视频生成的梯度流)\n- **社区热度**: `👍 50 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10429)\n- **研究任务**: 解决自回归视频生成中，当前帧去噪与作为未来预测上下文的键值表示写入共享参数所导致的梯度负对齐问题。\n- **核心亮点**: 提出SGF+，为上下文写入和去噪分配独立参数，通过因果注意力保持交互。使用原始生成目标联合优化，无需辅助损失。在仅5秒rollout训练的情况下，支持长达24小时的连续生成，无需长视频微调，显著提升了视觉质量和长期一致性。\n- **深度解析**: 摘要未提供\n- **领域归类**: [视频生成, 自回归模型, 模型优化, 梯度流分析]\n---\n\n### 10. UltraText Bench: A Comprehensive Bilingual Benchmark for Evaluating Visual Text Rendering in Image Generation (UltraText Bench：评估图像生成中视觉文本渲染的全面双语基准)\n- **社区热度**: `👍 46 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09823)\n- **研究任务**: 评估图像生成模型在密集视觉文本（长字符串、多区域、正确放置和可读性）渲染方面的持续性能与准确性。\n- **核心亮点**: 提出UltraText Bench，包含432个中英双语提示，跨越24个真实场景和3个难度级别。使用Q-Judger视觉语言模型评估文本保真度、清晰度、空间和场景质量。评估了24种模型配置，揭示了不同模型在不同维度和工作负载下的优势与性能下降情况（如Qwen-Image-2512在L3难度下分数大幅下降）。\n- **深度解析**: 摘要未提供\n- **领域归类**: [图像生成, 文本渲染, 基准测试, 多模态评估]\n---\n\n### 11. UniWAM: Unified World-Action Model (UniWAM：统一的世界-动作模型)\n- **社区热度**: `👍 45 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02054)\n- **研究任务**: 结合物理推理、世界生成和动作预测，联合学习物理世界的语义理解、视觉生成和动作预测，用于具身智能任务。\n- **核心亮点**: 提出统一架构 UniWAM，整合物理推理器、世界生成器和动作预测器；将低级动作表示为自然语言，引入结合 VQA、人类第一人称数据和机器人演示的预训练配方；后训练阶段采用未来视觉噪声增强和历史条件流匹配，显著减少去噪步骤；发现人类-机器人联合训练的对数线性缩放定律。\n- **深度解析**: 该研究解决了视觉-语言-动作模型（VLA）缺乏世界动态基础，以及世界-动作模型在分布偏移下语义理解受限的问题。通过自然语言表示低级动作和互补监督的预训练策略，保留了语言能力的同时适应了具身任务。后训练中的噪声增强和流匹配设计提升了效率。在多个评估中达到 SOTA，并验证了大规模人机混合数据预训练的有效性。具体的实验指标数字摘要未提供。\n- **领域归类**: [具身智能, 视觉-语言-动作模型, 机器人学习]\n---\n\n### 12. Semifactual Credit-Augmented Policy Optimization (半事实信用增强策略优化)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40360)\n- **研究任务**: 解决大语言模型在带有可验证奖励的强化学习（RLVR）中，预测对与任务无关的提示特征过于敏感的问题，提升推理能力和泛化能力。\n- **核心亮点**: 提出半事实信用增强策略优化（SCAPO），将半事实稳定性纳入词元级信用分配；通过测量半事实干预下固定响应的词元概率漂移，使用归一化稳定性分数在早期训练中降低不稳定词元的优势；在 Qwen3-4B-Base 和 Qwen3-1.7B-Base 上，AIME 2024-2026 准确率分别比 GRPO 提高 5.63 和 4.17 个百分点。\n- **深度解析**: 研究指出 GRPO 为每个响应词元分配相同的基于结果的优势，可能会强化虚假依赖。SCAPO 通过因果启发的方法，在词元级别引入半事实稳定性，从而提供更细粒度的信用分配。实验表明，半事实稳定性为改善 RLVR 中的推理和泛化提供了有效的训练信号，且在大多数数学基准和分布外基准上取得了最佳结果。\n- **领域归类**: [大语言模型, 强化学习, 推理能力]\n---\n\n### 13. Tetris3D: 3D Scene Generation With Objects That Fit Together (Tetris3D：生成物体完美契合的3D场景)\n- **社区热度**: `👍 35 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10539)\n- **研究任务**: 单图像 3D 场景重建，恢复在物理和几何上作为场景连贯一致的物体。\n- **核心亮点**: 提出 Tetris3D 框架，显式地根据周围物体的几何形状及其物理关系来调节每个物体的生成；引入 ComOb，一个包含 120 万个场景的基于物理模拟的数据集，具有跨不同物体类别的物理交互、每个物体的网格和成对物理关系注释；在合成和真实场景中恢复连贯的物体形状和姿态，即使交互区域被遮挡。\n- **深度解析**: 现有方法通常独立生成物体或隐式耦合它们，难以确保相邻交互物体之间细粒度的空间兼容性。Tetris3D 通过显式条件化生成过程，引导物体的形状和姿态在场景中保持几何和物理上的合理性。ComOb 数据集的引入为物理交互提供了丰富的监督信号。实验证明该方法在生成质量和物理稳定性方面均达到 SOTA。具体的实验指标数字摘要未提供。\n- **领域归类**: [3D视觉, 场景生成, 物理模拟]\n---\n\n### 14. RunningTab: Direct Workspace Interaction with Environment-Side Tabs (RunningTab：通过环境侧标签实现直接工作区交互)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10444)\n- **研究任务**: 解决 LLM 代理在直接工作区交互（DWI）中，无法跟踪任务要求、已读文件和列出但未打开的文件，导致信息遗漏的问题。\n- **核心亮点**: 提出 RunningTab 框架，为直接工作区交互配备环境侧标签，即环境在代理旁边保留的每个任务的待办记录；代理添加需求，环境记录读取的文件摘录和列出但未打开的候选文件；代理可以查看需求及其最佳匹配内容，解决或搁置需求，并在尝试完成时接收未解决的需求检查。在三个基准测试和三个 LLM 上验证，持续优于普通 DWI 和在模型中保留记录的基线。\n- **深度解析**: 知识工作通常需要从工作区现有文件中生成新交付物。LLM 代理可以通过终端直接搜索和读取文件（DWI），但缺乏对任务进度和文件处理状态的追踪。RunningTab 通过在环境侧维护一个“标签”记录，将任务需求、已读文件摘录和未读候选文件并排展示给代理，有效防止了关键信息滑出上下文窗口。这种机制显著提升了代理处理复杂文件任务的完整性和准确性。具体的实验指标数字摘要未提供。\n- **领域归类**: [LLM代理, 知识工作, 上下文管理]\n---\n\n### 15. WorldSonus: Bringing Sound to Worlds (WorldSonus：为世界带来声音)\n- **社区热度**: `👍 32 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08760)\n- **研究任务**: 为世界模型引入实时、可交互控制且空间对齐的立体声音频生成。\n- **核心亮点**: 提出 WorldSonus，一个用于世界模型中实时空间声音合成的交互式视频到音频框架；采用流式因果自回归扩散架构，实现 0.41 的低实时因子（RTF）；引入以音频为中心的字幕管道和分块索引提示调度，实现生成过程中的动态声音事件控制；利用从多种立体声和全景声数据中策划的高质量立体声监督实现空间对齐；在开放域视频到音频基准测试中匹配或超越 SOTA 双向模型。\n- **深度解析**: 当前的世界模型生成的环境通常是无声的。WorldSonus 解决了为世界模型添加声音的三个核心挑战：实时生成以匹配交互式视频流、交互控制以响应流中的声音指令、以及反映场景几何和相机运动的空间对齐立体声。通过流式因果自回归扩散架构和分块提示调度，该框架不仅实现了低延迟的实时生成，还支持动态控制。高质量立体声监督确保了声音与场景空间的一致性，使其在声学质量和空间对齐方面表现出色。具体的实验指标数字摘要未提供。\n- **领域归类**: [世界模型, 音频生成, 多模态]\n---\n\n### 16. ReSAIL: Mitigating Collapse in Iterative Agent Self-Distillation (ReSAIL：缓解迭代代理自蒸馏中的崩溃问题)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39306)\n- **研究任务**: 解决大语言模型代理在迭代自蒸馏（实现递归自我改进）过程中出现的部署性能崩溃和特权信息（PI）条件行为下降的问题。\n- **核心亮点**: 提出 ReSAIL（迭代自蒸馏的保留和选择性增强），一种用于迭代基于 PI 的自蒸馏的插件增强方法；选择 PI 最强烈改变教师预测的交互步骤进行蒸馏，并平衡轨迹间的蒸馏损失；正则化学生在选定和未选定步骤的 PI 条件输出分布，以保留 PI 条件行为；在 ALFWorld 和 TextCraft 上，三个周期内保持显著增益，最终周期成功率平均绝对提高 22.5%；敏感性引导的离线数据选择也提高了多模态 GUI 代理在 AITZ 上的动作预测准确率。\n- **深度解析**: 迭代自蒸馏是 LLM 代理实现递归自我改进的途径，但现有方法在多个周期中会出现性能崩溃。ReSAIL 通过优先选择信息量大的交互步骤（即 PI 对教师预测影响最大的步骤）进行蒸馏，并在学生成为下一个教师时保留其 PI 条件行为，有效缓解了这一问题。该方法不仅提高了任务成功率，还证明了更鲁棒的学习机制可以有效缓解迭代代理自蒸馏中的性能崩溃。\n- **领域归类**: [LLM代理, 自蒸馏, 递归自我改进]\n---\n\n### 17. RobotWorld: Benchmarking Multimodal Agents for Robot Use Across Diverse Tasks and Embodiments (RobotWorld：跨多种任务和具身形态的多模态机器人使用代理基准测试)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10409)\n- **研究任务**: 评估通用多模态代理在物理世界中执行机器人任务（将指令和观察转化为物理任务执行）的能力，识别能力转移和差距。\n- **核心亮点**: 引入 RobotWorld，一个具有挑战性的机器人使用模拟测试平台，包含 84 个任务，涵盖操作、移动操作、运动、驾驶和空中控制，具有明确的交互预算和可执行的成功检查；分析任务结果和执行轨迹，发现当前代理能构建复杂的感知和控制工作流，但无法一致地组合成成功行为（如丢失对象状态、无法纠正无效动作等）；发现不同模型在不同类型任务上表现不一（如 Astra 在空间目标上更好，Opus 5.5 在连续平衡目标上更好）。\n- **深度解析**: 随着通用代理在数字任务中表现出色，研究其能力向物理世界的转移至关重要。RobotWorld 提供了一个全面的模拟测试平台，涵盖了多种机器人形态和任务类型。通过深入分析执行轨迹，研究揭示了当前代理在物理世界中的具体缺陷，如状态丢失、纠错能力差和任务完成误判。此外，不同模型在不同物理任务上的表现差异，为训练和设计更可靠的物理世界代理提供了具体的实证目标和改进方向。具体的实验指标数字摘要未提供。\n- **领域归类**: [机器人学, 多模态代理, 基准测试]\n---\n\n### 18. Mechanics of Long-Context Hybrid Models Part 1.1: From Hybrid Attention to Hybrid Position (长上下文混合模型机制 第1.1部分：从混合注意力到混合位置)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10114)\n- **研究任务**: 解释长上下文混合模型（结合全注意力和滑动窗口注意力或线性注意力）为何有效以及如何更好地设计它们。\n- **核心亮点**: 观察到上下文扩展中的“跷跷板效应”：线性注意力（LA）混合模型从长上下文持续预训练中获益更多，而滑动窗口注意力（SWA）混合模型在长度外推中表现更好；发现 SWA 混合模型存在“短上下文学习陷阱”、“短窗口疲劳”和“长窗口懒惰”；总结 LA 混合模型的“混合位置外推马太效应”，提出滑动窗口线性注意力，在 64k 上下文长度的 NIAH-SK1 上实现 16 倍免训练长度外推并保持 100% 准确率。\n- **深度解析**: LLM 架构正从全注意力向混合模型转变，以提高长上下文效率。本文作为系列研究的第一部分，深入分析了全注意力与 SWA 或 LA 混合的机制。研究揭示了不同注意力机制诱导的位置归纳偏差导致的性能差异，并详细剖析了 SWA 和 LA 混合模型在持续预训练和长度外推中的具体缺陷。提出的滑动窗口线性注意力方法有效解决了 LA 混合模型的外推问题，为长上下文混合模型的设计提供了重要的理论依据和实践指导。\n- **领域归类**: [大语言模型, 模型架构, 长上下文处理]\n---\n\n### 19. Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective (同策略蒸馏的收益与崩溃：强化学习视角)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03185)\n- **研究任务**: 从强化学习的角度解释语言模型后训练中同策略蒸馏（OPD）为何能带来性能提升，同时又可能崩溃为过长和重复生成的机制。\n- **核心亮点**: 通过强化学习视角解释 OPD 结果：教师隐式地奖励学生行为（即使教师自身很少展现）；当隐式奖励模型可靠时，OPD 使正确响应更容易采样；当偏好与质量不一致时，发生奖励黑客行为：隐式奖励模型放大过长、重复的学生展开；通过在训练期间屏蔽不健康响应和使用 SFT 初始化，可以有效缓解崩溃。\n- **深度解析**: 同策略蒸馏（OPD）是语言模型后训练的重要方法，但其导致生成崩溃的机制尚不清楚。本文将其视为一种强化学习过程，指出教师模型实际上充当了一个隐式奖励模型。当这个隐式奖励模型与真实质量对齐时，OPD 能提升性能；但如果不对齐，就会导致“奖励黑客”现象，学生模型会生成教师自身都不怎么生成的过长、重复文本。基于这一诊断，提出的屏蔽不健康响应和 SFT 初始化方法有效解决了崩溃问题，将关注点从教师的生成能力转移到其评估学生展开的可靠性上。具体的实验指标数字摘要未提供。\n- **领域归类**: [大语言模型, 模型蒸馏, 强化学习]\n---\n\n### 20. PhysEvo: Astra Can Act, Let It (PhysEvo：Astra可以行动，让它去行动)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08995)\n- **研究任务**: 围绕单个冻结模型实现物理递归自我改进（RSI），提升机器人操作的可靠性，无需更新模型权重或单独训练动作策略。\n- **核心亮点**: 提出 PhysEvo 框架，包含执行机器人任务的任务代理和使用轨迹诊断失败、修订工具和技能并测试修正的元代理；元代理还能改进自己的诊断工具；在 42 个 RoboDojo 任务上，保留的特定任务部署版本在五维平均得分 68.14/100，成功率 62.00%（对比 RoboDawn 的 47.17%）；在 8 个挑战性操作任务上成功率 55.00%（对比直接 Astra 的 1.25%）；在真实世界 5 个任务的 25 次试验中，平均得分 90.60/100，成功率 84.00%。\n- **深度解析**: 可靠的机器人操作依赖于观察和控制世界的系统。PhysEvo 通过任务代理和元代理的协同，实现了物理环境中的递归自我改进。任务代理执行任务，元代理分析失败并修订工具和技能，且元代理自身也能改进诊断工具。这种机制在不更新模型权重的情况下，发展了关节级控制、寻求证据的观察和可重用的操作技能。实验证明，该方法在模拟和真实世界任务中均大幅超越了直接使用的基线模型，将行动的后果转化为冻结模型行动和改进方式的持久、可测试的改变。\n- **领域归类**: [机器人学, 递归自我改进, 具身智能]\n---\n\n### 21. Recurrent Looped Transformer (循环循环Transformer)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07591)\n- **研究任务**: 状态跟踪（State tracking），解决传统Transformer对每个token应用固定深度而不随序列长度变化的问题。\n- **核心亮点**: 提出循环循环Transformer（RLT），将网络层分为并行因果编码器和循环解码器。解码器在每个token处合并编码器输出和上一个token的最终解码器状态，使计算路径随序列长度增长，而每个token的计算成本固定。在6个算法任务上，RLT在长度外推（如奇偶校验到256位、S_5排列跟踪、模算术）上显著优于标准Transformer。\n- **深度解析**: 该研究通过引入循环反馈机制打破了传统Transformer固定深度的限制。消融实验表明，反馈机制是性能提升的关键，移除后性能降至随机水平。此外，研究探讨了反馈更新频率的权衡：分块更新反馈（每四个token一次）允许并行计算并保持99%的64位奇偶校验准确率，但对于依赖严格顺序的排列跟踪任务，逐token反馈则是必需的，分块会导致其准确率大幅下降。\n- **领域归类**: [自然语言处理, 算法与数据结构, 模型架构]\n---\n\n### 22. SWE-Game: Can Coding Agents Build the Games We Want? (SWE-Game：代码智能体能构建我们想要的游戏吗？)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33678)\n- **研究任务**: 评估代码智能体在游戏开发任务中的能力，涵盖从简报开发、游戏设计文档实现、骨架补全、修复注入故障以及Godot到Unity的移植。\n- **核心亮点**: 引入SWE-Game基准测试，包含247个任务，基于41个可执行的Godot参考游戏，涵盖13个2D和3D游戏玩法类别。评估结合了引擎状态检查、认证参考输入重放和智能体编写的功能演示。Opus5在所有五种任务类型中取得最高总分，但在构建任务中的最佳总分仍低于60分（满分100分），其中简报到游戏的得分为50.38。\n- **深度解析**: 该研究构建了一个全面且可执行的游戏开发评估基准，不仅关注代码生成，还深入评估了游戏机制的正确性和可玩性。分析指出需求遗漏和游戏玩法逻辑错误是智能体开发游戏的主要障碍。同时，研究验证了其评估方法的有效性，证明结合运行时证据（可执行检查达到92.59%的平衡准确率，优于基于视频的VLM评判的78.41%）与视觉评估（基于评分标准的视觉评分与人类评分的Spearman相关性达0.829）能更准确地衡量智能体的实际开发能力。\n- **领域归类**: [软件工程, 智能体评估, 代码生成]\n---\n\n### 23. VIEScore2: Unified Image Evaluation with Spatially Grounded Explanations (VIEScore2：具有空间接地解释的统一图像评估)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00994)\n- **研究任务**: 图像生成和编辑任务的统一评估，解决现有评估器仅提供标量质量分数而无法识别支持该分数的图像区域的问题。\n- **核心亮点**: 提出VIEScore2，将图像表示为N x N网格，在单次模型传递中联合预测质量分数和缺陷位置。采用文本原生的网格表示，并结合GRPO（结合单元格级Dice重叠、分数准确性和输出格式有效性的奖励）改进缺陷定位。通过无参数解析器将结构化预测转化为可读的解释。\n- **深度解析**: VIEScore2通过引入空间定位能力，弥补了传统图像评估器缺乏可解释性的缺陷。其文本原生的网格表示提供了统一的接口，支持异构空间监督。实验表明，其在整体分数相关性（SRCC达0.601，优于Gemini-3-Flash的0.491）和缺陷定位（在6个基准中的3个IoU指标上排名第一，5个排名前三）上均优于通用视觉语言模型和专用空间评估器，且在训练源之外的数据集上展现出良好的泛化能力。\n- **领域归类**: [计算机视觉, 图像生成与编辑, 模型评估]\n---\n\n### 24. On KL-Regularized Policy Optimization (关于KL正则化策略优化)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08963)\n- **研究任务**: 解决大语言模型智能体在异步强化学习（RL）中，由于使用陈旧检查点生成轨迹而导致推理引擎概率与训练器概率不一致的问题。\n- **核心亮点**: 提出KL正则化策略优化（KLPO）框架，将KL正则化锚定在采样器上。通过最小二乘法拟合对数比率最优条件，无需重要性权重。证明了无需Critic即可从终端回报计算梯度，并推导出SPPO、GPO、REBEL和BPO等作为KLPO的特例。\n- **深度解析**: KLPO框架通过巧妙地将KL正则化锚定在采样器上，解决了异步RL中的概率不匹配问题。其核心优势在于无需重要性权重、无需学习归一化器，且每个提示只需一次轨迹采样（rollout），无需响应组，从而大幅降低了长序列的计算成本。理论证明表明，该框架统一了多种现有的策略优化方法，为LLM的RL训练提供了一种高效且无Critic的更新机制。\n- **领域归类**: [强化学习, 大语言模型, 策略优化]\n---\n\n### 25. NAMVIS: Next-Scale Autoregressive Multi-View Image Synthesis (NAMVIS：下一尺度自回归多视图图像合成)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04722)\n- **研究任务**: 稀疏视图新颖视图合成（Sparse-view novel view synthesis），解决基于扩散的方法在推理时因迭代去噪导致多视图生成成本高昂的问题。\n- **核心亮点**: 提出NAMVIS，一个无扩散框架，将多视图图像合成重新表述为几何条件下的下一尺度自回归。通过多尺度投影位姿编码将相机变换注入注意力机制，结合全局条件和密集的几何感知交叉注意力，保持源视图外观和目标视图一致性。\n- **深度解析**: NAMVIS摒弃了耗时的迭代去噪过程，采用从粗到细的尺度自回归方式预测离散视觉token，并在每个尺度和目标视图内并行采样，大幅提升了推理速度。通过引入多尺度投影位姿编码，模型能够显式地利用相机几何信息，有效解决了多视图合成中的视角一致性和外观保留问题。在Objaverse、GSO和OmniObject3D数据集上的实验表明，其在PSNR、SSIM和LPIPS指标上均优于基于扩散的基线方法，且推理速度是评估的扩散基线的3倍以上。\n- **领域归类**: [计算机视觉, 3D内容生成, 多视图合成]\n---\n\n### 26. Inverting Multi-Vector Visual Document Indices (反转多向量视觉文档索引)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09920)\n- **研究任务**: 评估多向量视觉文档检索系统的安全性，验证是否可以从存储的向量索引中恢复出原始文档页面。\n- **核心亮点**: 发现多向量视觉文档检索器容易受到索引反转攻击。在ViDoRe v3基准上，从原始索引反转的页面能恢复47%的单词和45%的敏感token，且作为查询时98.4%的概率将源页面排名第一。测试了token池化和打乱两种保护方法，并发现恢复打乱索引顺序的模型能大幅提高攻击成功率。\n- **深度解析**: 该研究揭示了多向量视觉文档检索系统中一个严重的安全漏洞：由于索引按光栅顺序保留每个patch的向量，攻击者可以通过条件文档图像生成从索引中重建原始页面。研究表明，简单的保护措施（如token池化和打乱）虽能将单词召回率降至约8%，但面对能够恢复顺序的模型时（将源页面排名第一的比例从3.8%提升至93.5%）依然脆弱。这强调了必须像保护原始文档一样严格保护多向量索引，以防敏感信息泄露。\n- **领域归类**: [信息检索, 安全与隐私, 多模态模型]\n---\n\n### 27. Agentic RAG Evaluation: Budget Allocation Across Questions, Trajectories, and Reads (智能体RAG评估：在问题、轨迹和读取之间的预算分配)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05034)\n- **研究任务**: 优化智能体检索增强生成（Agentic RAG）的评估预算分配，研究如何在问题、搜索轨迹和重复回答之间分配计算资源（模型token）。\n- **核心亮点**: 在HotpotQA和MuSiQue上进行检索反馈比较。结果表明，在34.14--34.39M模型token的预算下，更广泛的问题覆盖比5次读取降低33%的标准误差，比3次轨迹降低12.6%。研究了温度参数对答案分歧的影响，并探讨了搜索价格对预算分配策略的影响。\n- **深度解析**: 该研究为Agentic RAG的评估提供了一套系统的预算分配理论。通过实证分析，研究指出在有限的计算预算下，增加问题的多样性（更广泛的问题覆盖）比增加单个问题的搜索轨迹或重复采样更能有效降低评估的标准误差。此外，研究还发现将温度参数设为零可以显著减少答案分歧（从14.3%降至3.4%），且搜索成本（0-1美元/千次请求）会影响问题与轨迹之间的最优分配比例，为实际部署中的资源调度提供了重要指导。\n- **领域归类**: [自然语言处理, 检索增强生成, 评估与优化]\n---\n\n### 28. Minimal Witness Reinforcement Learning (极简见证强化学习)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07226)\n- **研究任务**: 解决强化学习中寻找产生特定结果的不可约充分条件（极简见证，minimal witnesses）的问题，避免标准RL方法只返回单一解或冗余解。\n- **核心亮点**: 提出极简见证强化学习（MWRL）。MWRL对策略采样的成功提案集合取并集，并根据每个提案在并集中的覆盖贡献进行信用分配。推导出一个值迭代规划器来恢复整个见证族，以及一个可扩展到大语言模型的策略梯度方法。\n- **深度解析**: MWRL将“寻找极简充分条件”这一科学和计算中的核心问题形式化为强化学习任务。其创新的信用分配机制直接源于问题定义，通过评估每个提案对整体覆盖率的边际贡献，巧妙地统一了对“极简性”和“替代方案恢复”的需求。实验证明，MWRL能够恢复大多数极简见证，而传统方法往往返回冗余超集或单一解，从而将RL的应用范围从单解优化扩展到了见证族学习。\n- **领域归类**: [强化学习, 可解释性, 算法理论]\n---\n\n### 29. From Pareto to Preference: Personalized Test-Time Scaling via Amortized Agentic Policy Discovery (从帕累托到偏好：通过摊销智能体策略发现实现个性化测试时缩放)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09684)\n- **研究任务**: 解决大语言模型测试时缩放（TTS）中用户需求多维化的问题，现有方法通常只优化准确率与单一资源维度（成本或延迟）的帕累托前沿。\n- **核心亮点**: 将个性化TTS公式化为发现可执行控制器，以最大化用户特定需求的联合满足率。提出PersonTTS，一个摊销智能体策略发现框架，通过需求匹配的控制器初始化和源蒸馏的过程指导来重用先前的搜索经验，同时保留目标配置文件的评估。\n- **深度解析**: PersonTTS突破了传统TTS仅优化单一资源维度帕累托前沿的局限，转向满足用户多维偏好（如准确率、延迟、成本联合要求）。其核心创新在于“摊销”机制，通过复用历史搜索经验和过程指导，大幅降低了为新用户画像重复发现策略的开销。在AIME和HMMT等数学基准上的实验表明，该方法在未见用户画像和保留问题上显著提高了联合需求满足率，同时降低了发现智能体的时间和成本。\n- **领域归类**: [大语言模型, 推理优化, 智能体系统]\n---\n\n### 30. On-Policy Distillation with Negative-Policy Rollouts (带有负策略采样的在策略蒸馏)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07874)\n- **研究任务**: 改进大语言模型的在策略蒸馏（OPD）方法，解决当强教师模型与学生模型分布重叠有限时，正向指导提供的学习信号不足的问题。\n- **核心亮点**: 提出负策略OPD（NP-OPD），在采样阶段引入表现较差的负策略作为负参考。负策略持续提供其偏好高于教师的token，使其在整个训练过程中暴露于教师监督下，从而提供显式的负信号，同时保留正向教师监督。\n- **深度解析**: NP-OPD通过在采样阶段引入负策略，巧妙地解决了传统OPD中师生分布不匹配导致的学习信号不足问题。与修改蒸馏奖励公式不同，NP-OPD直接在数据生成端引入负样本，迫使模型学习抑制负策略偏好而教师不偏好的token。广泛的实验表明，该方法在不同模型规模、生成模式、推理领域和OPD变体中均能稳定提升蒸馏效果，有效抑制了负策略偏好的token，为理解OPD中采样策略的作用提供了新视角。\n- **领域归类**: [大语言模型, 模型蒸馏, 强化学习]\n---\n\n### 31. AdSpark: A Large-Scale Dataset and Benchmark for Product-Centric Advertisement Video Generation (AdSpark：面向以产品为中心的广告视频生成的大规模数据集与基准)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10047)\n- **研究任务**: 以产品为中心的广告视频生成，旨在创建保留细粒度产品身份并通过连贯的多镜头叙事展示卖点的宣传视频。\n- **核心亮点**: 提出了 AdSpark 数据集和基准。AdSpark-300K 包含约 30 万个参考图像-提示-视频三元组（包含真实和合成子集），提供结构化广告注释（如产品身份、卖点描述、创意计划和对齐的音频脚本）。此外，提出了 AdSpark-Bench 诊断基准，从视觉质量、产品保真度、指令遵循、时间连贯性、音频对齐和广告效果六个维度评估生成的广告。\n- **深度解析**: 该研究填补了广告特定大规模数据集和综合评估框架的空白。通过结构化注释，模型能够学习产品保留和面向广告的视觉叙事。AdSpark-Bench 揭示了当前模型在产品保留、多镜头叙事和卖点可视化方面的关键挑战。在 AdSpark-300K 上微调模型的实验进一步验证了该数据集的有效性。\n- **领域归类**: [计算机视觉, 视频生成, 数据集与基准]\n\n---\n\n### 32. Mobile-4DGS: Unified Static-Dynamic Real-time Mobile Gaussian Splatting (Mobile-4DGS：统一的静态-动态实时移动端高斯溅射)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05289)\n- **研究任务**: 在资源受限的移动设备上部署静态和动态高斯表示，实现高保真实时 3D 和 4D 渲染。\n- **核心亮点**: 提出 Mobile-4DGS 轻量级框架。引入蒙特卡洛镜面能量聚合器和属性条件球谐增强模块以压缩外观建模；提出多视图 Alpha 基础致密化和剪枝策略以减少冗余原语。针对动态场景，构建二阶高斯运动、可学习的时间支持和二进制静态-动态分区，并开发深度顺序证书以减少播放时的重新投影和排序等操作。\n- **深度解析**: 针对 3DGS 在移动端面临的存储重、原语冗余和计算成本高的问题，该框架通过压缩高阶辐射残差、减少冗余原语以及紧凑的显式 4D 表示，大幅降低了存储和渲染开销。实验表明，Mobile-4DGS 在静态和动态场景中均保持了具有竞争力的视觉质量，成功实现了移动设备上的实时渲染（具体存储和渲染开销降低的数字摘要未提供）。\n- **领域归类**: [计算机视觉, 3D/4D 渲染, 移动端部署]\n\n---\n\n### 33. WebFovea: When the Model Is Right but the Click Is Wrong -- Reliable Round Trips for Vision-Based Web Agents on Live Websites (WebFovea：当模型正确但点击错误时——实时网站上基于视觉的 Web 智能体的可靠往返)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03036)\n- **研究任务**: 在实时网站上操作网页界面并返回可验证答案的基于视觉的 Web 智能体任务（WebRetriever Challenge 2026）。\n- **核心亮点**: 提出 WebFovea，在 WebRetriever Challenge 2026 中获得第二名（最终得分 57.0/100）。研究指出智能体失败常发生在模型与页面交互的四个阶段（回复解析、动作生效、结果报告、信息展示），而非模型推理本身。例如坐标系不匹配导致点击偏移、原生控件动作静默失败、自生成 token 污染了 4.9% 的任务。WebFovea 针对这些阶段进行了强化并添加了护栏。\n- **深度解析**: 该研究强调，强大的多模态大模型是必要的但不充分的，模型与页面之间的“线束（harness）”代码同样关键。通过修复线束中的四个阶段故障，即使使用相同的模型，官方隐藏集得分也从 31.0 提升至 57.0。论文详细描述了设计、各组件的证据（包括负面结果）、故障分析及未来将不同步骤路由到不同模型的路线图。\n- **领域归类**: [自然语言处理, 智能体 (Agent), 网页交互]\n\n---\n\n### 34. Q-Learning with Scalar Adjoint Matching (基于标量伴随匹配的 Q 学习)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10437)\n- **研究任务**: 使用离线强化学习微调流策略（flow policies），以超越演示数据提升性能。\n- **核心亮点**: 提出 SQAM（基于标量伴随匹配的 Q 学习）。观察到预训练流策略的批量平均速度雅可比矩阵集中在对角线上，推导出一个闭式标量伴随，通过流时间缩放最终动作的价值梯度，消除了每步的向量-雅可比乘积。结合标量伴随与策略生成动作处的价值惩罚。\n- **深度解析**: 微调流策略的难点在于策略通过多个流步骤生成动作，伴随匹配需要每步计算向量-雅可比乘积，成本极高。SQAM 利用雅可比矩阵的对角集中特性大幅降低计算成本。在 OGBench 最难的四个领域中，其成功率比最强基线高出 18 到 35 个百分点。在真实双臂机器人上的视觉-语言-动作策略微调也证明了其优于监督微调的有效性。\n- **领域归类**: [强化学习, 机器人控制, 策略微调]\n\n---\n\n### 35. QuadTok: Quadtree Visual Tokenizer for Autoregressive Image Generation (QuadTok：用于自回归图像生成的四叉树视觉分词器)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10497)\n- **研究任务**: 视觉分词与自回归图像生成。\n- **核心亮点**: 提出 QuadTok 框架，使用分层四叉树结构进行视觉分词，动态为视觉复杂区域分配表示能力，同质区域保持粗分辨率。相比固定 256 token 网格，在 ImageNet 上节省约 10% 的 token，在 COCO 零样本迁移上节省 9%。利用树结构引入的自然因果性，947M 参数的 GPT 风格生成模型在 ImageNet 256x256 基准上达到 2.08 gFID，并支持零样本空间控制图像生成。\n- **深度解析**: 传统方法使用 2D 网格或 1D token 序列，QuadTok 通过四叉树结构弥合了 2D 空间绑定和 1D 序列灵活性之间的差距。这种动态分配 token 的机制不仅提高了计算和存储效率，还保留了强大的空间相关性，使得模型能够无缝进行自回归生成和空间可控生成。\n- **领域归类**: [计算机视觉, 图像生成, 视觉分词器]\n\n---\n\n### 36. DLoop: Looped Speculative Decoding (DLoop：循环推测解码)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07659)\n- **研究任务**: 加速大语言模型的自回归生成（推测解码）。\n- **核心亮点**: 提出 DLoop（循环推测解码）。发现随着草稿模型能力增强，目标模型经常接受草稿阶段生成的所有 token，导致不必要的验证。DLoop 自适应地在验证前执行多个草稿阶段，只要草稿模型保持置信就继续草稿，并一起验证所有累积的草稿 token。通过循环感知训练保持草稿模型在额外草稿阶段的可靠性。\n- **深度解析**: 传统的自适应草稿长度方法仅对自回归草稿模型有效，且并行草稿模型需要目标模型的隐藏状态。DLoop 通过循环机制减少了目标模型用于验证的前向传播次数。在包括 EAGLE-3 等多种推测解码方法中，DLoop 在保持无损解码的同时，将实际加速比提高了 5% 到 41%。\n- **领域归类**: [自然语言处理, 大语言模型推理加速, 推测解码]\n\n---\n\n### 37. Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation (通过在线策略上下文蒸馏将智能体经验内化到扩散模型权重中)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07250)\n- **研究任务**: 将文本到图像（Text-to-Image）智能体框架提升的性能内化到扩散模型本身的权重中。\n- **核心亮点**: 提出 D-OPCD（扩散在线策略上下文蒸馏）。将智能体改进的提示视为特权上下文，将智能体框架编码的知识蒸馏到扩散模型权重中。结合自动技能进化器（ASE），直接生成平均分从 60.52 提升至 65.09。吸收知识后，框架可抛弃饱和技能继续进化，第二轮 ASE 在更新后的生成器上又提升了 1.83 分。\n- **深度解析**: 通常智能体框架通过记忆、技能、工作流等提升 T2I 性能，但这些收益是外部的。D-OPCD 将这些外部能力内化到模型权重中，使模型仅基于原始查询就能保留部分收益。这展示了框架和模型通过持续共同进化相互提升的潜力，指向了文本到图像系统的新范式。\n- **领域归类**: [计算机视觉, 文本到图像生成, 知识蒸馏, 智能体]\n\n---\n\n### 38. Improving Proactive AI Assistance with Hierarchical Procedural Understanding (通过分层过程理解改进主动式 AI 辅助)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06505)\n- **研究任务**: 主动式 AI 辅助，即观察用户活动并决定是否提供指导，需根据任务进度和用户专业知识调整指导级别。\n- **核心亮点**: 引入 ProactiveCoach 套件（包含用于训练的 ProactiveCoach-Instruct 和用于评估的 ProactiveCoachBench），提供阶段、步骤和动作级别的分层结构化指导。微调的 VLM 结合轻量级指导路由器构建自适应指导系统。分层监督比固定粒度监督整体性能提升高达 9.6%p，自适应系统在四种指导级别转换中比基线高出 57.1%p。\n- **深度解析**: 现有数据集要么侧重检测，要么提供固定粒度的过程指导，难以确定完成度并调整粒度。ProactiveCoach 通过分层结构化指导帮助模型学习任务进度和过程上下文。结合轻量级路由器的自适应系统能够在无需额外微调的情况下，根据用户需求动态调整指导级别，显著提升了主动式 AI 助手的实用性。\n- **领域归类**: [人机交互, 主动式 AI 辅助, 视觉语言模型]\n\n---\n\n### 39. MIMESIS: Learning User Simulators as Training Environments for Interactive Agents (MIMESIS：学习用户模拟器作为交互式智能体的训练环境)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09484)\n- **研究任务**: 训练和评估交互式语言智能体，解决收集人类反馈昂贵且难以扩展的问题。\n- **核心亮点**: 提出 MIMESIS，一个专门构建的用户模拟器，具有显式推理监督和 13 种源自真实用户交互的现实行为模式。其 9B 模型 SOUL-Index 达到 65.7。提出 CSD（辅导在线策略自蒸馏），利用模拟器生成的私有推理轨迹和后续话语作为反馈，转化为密集的 token 级监督。\n- **深度解析**: 现有的模拟用户通常使用现成的助手 LLM，导致其过于合作和同质化。MIMESIS 通过引入现实行为模式提高了行为保真度（比 Claude-Opus-5 提高 13.4 分，Turing 距离减少 3.6 分）。使用 MIMESIS 训练的智能体在未见过的用户模拟器上表现出更强的泛化能力。CSD 方法进一步提升了智能体预测和适应用户需求的能力。\n- **领域归类**: [自然语言处理, 交互式智能体, 用户模拟器, 强化学习]\n\n---\n\n### 40. Learning Multimodal Embeddings with Evidence-Aligned Readout (学习具有证据对齐读取的多模态嵌入)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33659)\n- **研究任务**: 多模态大语言模型检索任务中，确定生成的任务相关证据如何进入检索嵌入。\n- **核心亮点**: 提出 EviAlign，将语义证据生成与边界读取耦合在共享的多模态大语言模型中。将证据组织成 5 个语义单元，读取每个单元边界的上下文状态并聚合成单个归一化嵌入。在 12 个 MMEB 检索任务中，使用 50 万训练对达到 76.9 的平均 Recall@1，同时保留单向量索引和评分。\n- **深度解析**: 研究探讨了证据的语义组织是否可以指定表示的读取位置。通过 2x3 控制实验发现，一致的语义组织在证据边界处的优势（2.39 分）比基于长度的训练位置（0.65 分）更大，产生了 1.74 分的协同设计交互优势。这证明了证据组织与读取策略协同设计的重要性，有效提升了多模态检索性能。\n- **领域归类**: [自然语言处理, 多模态检索, 嵌入表示学习]\n\n### 41. SkillForge: Co-Evolving Skills and Agents via Dynamic Skill Lifecycles (SkillForge：通过动态技能生命周期实现技能与智能体的协同进化)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09832)\n- **研究任务**: 增强大语言模型智能体解决复杂长期任务的能力，解决记忆增强强化学习中技能库容易积累过时或有害技能的问题。\n- **核心亮点**: 提出 SkillForge，一种通过适应度驱动的技能生命周期（试验、活跃、稳定、退役）来编译和进化技能库的智能体强化学习方法，实现技能与模型的协同进化，并引入了 SkillFurnace 数据集。\n- **深度解析**: \n  - **实验结果**: 在多个交互式智能体基准上取得最高总成功率，比最强基线提升高达 7.8%。\n  - **数据集**: 引入 SkillFurnace 数据集，包含 5000+ 条带注释的记录，捆绑了退役过滤的 SFT 轨迹、带有适应度注释的进化技能库以及带有人工注释失败类别的退役事件。\n  - **技术细节**: 预强化学习评估阶段使用基础模型自身的推演来预退役低适应度技能；强化学习阶段进行选择性退役、稳定和 LLM 引导的变异。\n- **领域归类**: [强化学习, 智能体, 大语言模型]\n---\n\n### 42. A self-learning scientific agent for X-ray diffraction (用于X射线衍射的自学习科学智能体)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07862)\n- **研究任务**: 将分析经验转化为基于物理证据的可重用专业知识，解决粉末 X 射线衍射分析中的挑战。\n- **核心亮点**: 提出 Gan Jiang，一个基于 X 射线衍射分析生态系统构建的自学习智能体。无需重新训练语言模型或更改底层物理模型，即可通过诊断失败和修改代码将分析经验转化为可执行技能。\n- **深度解析**: \n  - **实验结果**: 在 DeltaXRDbench 上领先；在 MP500、RRUFF 和 opXRD 上的单阶段 top-1 准确率分别达到 96.30%、81.78% 和 40.83%（最强对比基线为 58.00%、58.47% 和 26.45%）。\n  - **数据集**: DeltaXRDbench, MP500, RRUFF, opXRD。\n  - **技术细节**: 智能体通过诊断失败、修改技能指令和代码并在重用前验证修改来转化经验。成功解决了强重叠反射、量化古埃及化妆品、追踪电池晶格演化等实际科学问题。\n- **领域归类**: [科学计算, 智能体, 材料科学]\n---\n\n### 43. SheetSage2: Coherent Lead-Sheet Transcription with Synthetic Supervision (SheetSage2：基于合成监督的连贯主旋律谱转录)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05336)\n- **研究任务**: 将音乐转录为人类可读的乐谱，解决标注录音稀缺以及准确的局部预测仍可能产生不一致的音乐序列的问题。\n- **核心亮点**: 提出 SheetSage2，一个统一的音乐转录框架，结合了合成数据、特定任务的结构化解码和自回归蒸馏，以生成音乐上连贯的乐谱。\n- **深度解析**: \n  - **实验结果**: 在 8 个基准集合中，单一的 SheetSage2-AR 模型在评估的 15 个基准-指标对中的 12 个上超过了列出的先前系统。\n  - **数据集**: 8 个基准集合（具体名称摘要未提供）。\n  - **技术细节**: 自动标注的 MIDI 渲染为音频提供可扩展的监督；特定任务的结构化解码器整合互补的音乐线索及其时间依赖性；自回归蒸馏在推理时保留转录准确性而无需特定任务的动态规划。\n- **领域归类**: [音频处理, 音乐信息检索, 深度学习]\n---\n\n### 44. CADFather: Autonomous CAD Reconstruction through Coordinated Tool Use (CADFather：通过协调工具使用实现自主CAD重建)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09127)\n- **研究任务**: 从 3D 形状重建可编辑的参数化 CAD 模型，解决现有方法在不同零件几何和重建阶段无法通用单一提议源的问题。\n- **核心亮点**: 提出 CADFather，一个自主的智能体系统，通过协调互补工具从 3D 网格恢复参数化 CAD 程序。该系统使用预训练的生成和助手模型，无需额外训练。\n- **深度解析**: \n  - **实验结果**: 摘要未提供。\n  - **数据集**: DeepCAD, Fusion360, MCB 测试集，以及 CADENA-Bench, CADBench, BenchCAD。\n  - **技术细节**: 视觉语言助手检查目标及中间重建的渲染图，决定扩展哪些候选 CAD 程序、调用哪些工具、生成多少提议以及何时完成。学习和算法工具提议 CAD 操作，数值优化细化参数。智能体为每个目标零件维护替代候选程序并保留最佳有效结果。\n- **领域归类**: [计算机视觉, 3D重建, 智能体]\n---\n\n### 45. Iris-3B: Going Beyond the Latent with Pixel-Space Diffusion Training, Conversion and Fine-Tuning (Iris-3B：通过像素空间扩散训练、转换和微调超越潜在空间)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09450)\n- **研究任务**: 验证像素空间扩散模型在需要精细细节的下沉任务（如深度估计、图像恢复/超分辨率）中是否优于潜在模型。\n- **核心亮点**: 从头预训练了 3B 参数的像素空间文本到图像 Transformer（Iris-3B），并将预训练的潜在模型转换为像素空间。研究发现使用像素空间生成先验在下游任务中并没有显著提升。\n- **深度解析**: \n  - **实验结果**: 在单目深度估计和 4 倍 DIV2K 图像恢复中，像素模型未击败潜在 FLUX.2 Klein 微调。但在 1024^2 分辨率下的 OneIG 评估中，Iris-3B 与 Qwen-Image 匹配，证明像素空间预训练可扩展至 3B 参数并达到与潜在模型竞争的文本到图像质量。\n  - **数据集**: DIV2K, OneIG。\n  - **技术细节**: 通过 256 到 512 再到 1024 的课程学习从头预训练；在 256^2 下消融预测目标和表示对齐；详细记录了负面结果的配方、失败模式和剩余的混淆因素。\n- **领域归类**: [计算机视觉, 图像生成, 扩散模型]\n---\n\n### 46. Composing What Each Teacher Learned: Multi-Teacher On-Policy Distillation through Teacher-Relative Shifts (组合每个教师所学：通过教师相对偏移进行多教师同策略蒸馏)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10460)\n- **研究任务**: 改进多教师同策略蒸馏（MOPD），解决端点策略转移中继承的基础偏好与训练后变化混合的问题。\n- **核心亮点**: 提出 Δ-MOPD，转移每个教师的“教师减去基础”的 logit 偏移，并在学生的冻结初始化处重新锚定，从而有效去除继承的基础拉力，实现更纯粹的知识转移。\n- **深度解析**: \n  - **实验结果**: 在组合三个教师时，Δ-MOPD 在数学上超过端点组合 4.11 分，在五个基准上超过 1.95 分；在分阶段路由下，将观察到的顺序差距从 10.50 缩小到 6.42 分。\n  - **数据集**: 摘要未提供。\n  - **技术细节**: 揭示了阻碍端点转移的机制（继承的基础拉力可能超过训练后偏移）。目标构建是 MOPD 中独立的设计轴，与教师选择互补。\n- **领域归类**: [大语言模型, 知识蒸馏, 模型训练]\n---\n\n### 47. UniSkill: Learning Actor-Aligned Skill Proposals for an Evolving Policy (UniSkill：为进化策略学习演员对齐的技能提议)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10164)\n- **研究任务**: 解决大语言模型智能体在联合优化任务执行和技能提取时，技能提议的奖励可能与演员改进混淆，且直接测试提议技能需要昂贵的额外推演的问题。\n- **核心亮点**: 提出 UniSkill，使用共享策略与环境交互并从结果轨迹中提议技能库编辑。通过对比动作反馈引导技能提议学习，无需为每个提议进行新的环境推演。\n- **深度解析**: \n  - **实验结果**: 在 ALFWorld 上达到 98.4% 的成功率，在 WebShop 上达到 84.7%。\n  - **数据集**: ALFWorld, WebShop。\n  - **技术细节**: 对比动作反馈通过测量用提议技能替换检索技能如何改变当前演员在相同任务的成功和失败轨迹之间的动作对数似然差距，提供演员对齐信号。应用技能编辑支持正则化以保留探索。\n- **领域归类**: [强化学习, 智能体, 大语言模型]\n---\n\n### 48. EngramEdit: Decoupled Knowledge Updates in LLMs through Conditional Memory (EngramEdit：通过条件记忆实现大语言模型中的解耦知识更新)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10533)\n- **研究任务**: 解决条件记忆架构在更新事实知识时，不同表达可能激活不同 n-gram 嵌入，且更新共享嵌入可能意外改变其他事实预测的问题。\n- **核心亮点**: 提出 EngramEdit，通过条件记忆实现解耦的知识更新。计算目标记忆表示并联合更新共享的 n-gram 嵌入，同时对频繁重用的嵌入施加更强的更新惩罚以保留无关知识。\n- **深度解析**: \n  - **实验结果**: 实现近乎完美的编辑成功率。在思维链（CoT）提示下，修订后的知识在多跳推理中的准确率是最强基线的近三倍。\n  - **数据集**: 摘要未提供。\n  - **技术细节**: 将条件记忆转化为可编辑的知识接口，扩展了其在模型缩放之外的作用。在事实更新积累时，很大程度上保留了无关知识和通用能力。\n- **领域归类**: [大语言模型, 知识编辑, 记忆机制]\n---\n\n### 49. StepCAD: Mesh-to-CAD Code Generation via LLM Policy and Geometry-Guided Search (StepCAD：通过LLM策略和几何引导搜索实现网格到CAD代码生成)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03799)\n- **研究任务**: 从 3D 网格恢复可执行的 CAD 程序，解决 CAD 构建的组合性质以及离散建模选择与连续参数之间交互带来的挑战。\n- **核心亮点**: 提出 StepCAD，一种结合状态条件 CAD 策略与几何引导搜索的生成优化方法，并引入了 ARCADE-1.5M 大规模数据集以支持多样化操作的学习。\n- **深度解析**: \n  - **实验结果**: 在多个 CAD 重建基准上实现最先进的几何重建精度，比最强评估基线提升高达 87.2% 的相对 IoU。\n  - **数据集**: ARCADE-1.5M（包含 150 万个可执行 CAD 程序，最大长度 150+ 操作，1250 万个中间状态-动作转换）。\n  - **技术细节**: 策略根据目标和中间几何预测构建动作，IoU 引导的树搜索通过局部编辑细化生成的程序。\n- **领域归类**: [计算机视觉, 3D重建, 代码生成]\n---\n\n### 50. RoboQuest: Generalist Physical Agents that Search, Inspect and Test (RoboQuest：搜索、检查和测试的通才物理智能体)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10388)\n- **研究任务**: 评估多模态基础模型作为通才物理智能体在陌生环境中通过物理交互主动获取任务相关信息的能力。\n- **核心亮点**: 引入 RoboQuest，一个目标导向的具身探索基准，包含 10 个移动操作任务，涵盖搜索、基于操作的检查和交互式测试三种不确定性形式。\n- **深度解析**: \n  - **实验结果**: 最好的智能体仅在 23% 的片段中成功，微调策略几乎从未成功。\n  - **数据集**: RoboQuest（包含 10 个移动操作任务），以及发布的完整片段演示。\n  - **技术细节**: 失败分析表明，智能体通常在观察到任务完成所需的证据之前就做出决定，过早停止探索；很少预防或修复探索引起的干扰；通过试错学习对大多数模型来说仍然困难。\n- **领域归类**: [具身智能, 机器人, 多模态]\n---\n\n### 51. CoDance: Learning Reactive and Compliant Human-Humanoid Interaction from Video (CoDance：从视频中学习反应式与顺应式的人-人形机器人交互)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05324)\n- **研究任务**: 从视频中学习反应式和顺应式的人与人形机器人的交互（以双人舞为具体实例），使机器人能够协调脚步、保持双手接触并顺应交互力。\n- **核心亮点**: 提出 CoDance 框架，引入多链接顺应性增强（multi-link compliance augmentation），将运动学演示转化为力感知训练数据；在仿真和真实机器人上实现持续的双手舞蹈交互。\n- **深度解析**: 该框架通过给机器人参考动作施加结构化力，将视频中的双人舞蹈动作重定向为机器人参考和移动伙伴。训练出的策略不仅能跟随伙伴，还能保持运动风格并对物理交互做出顺应性反应。在仿真中，策略适应了约80%的增强演示所编码的手腕位移；在真实机器人上，实现了包括前后运动反复切换在内的持续双手舞蹈。\n- **领域归类**: [机器人学, 计算机视觉, 运动控制]\n---\n\n### 52. Salt++: Context-Aligned Post-Training for Few-Step Streaming Multimodal Generation (Salt++：面向少步流式多模态生成的上下文对齐后训练)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36995)\n- **研究任务**: 解决少步流式音视频生成中因果建模和步蒸馏面临的上下文相关挑战，如教师强制的间接监督以及双向评分模型在因果分布匹配蒸馏（DMD）中的上下文不匹配问题。\n- **核心亮点**: 提出两阶段后训练框架 Salt++，包含因果自流（CSF）和上下文对齐的自回归DMD；在480p分辨率下，视觉和运动质量分别比 OmniForcing 提升57%和45%；扩展至 1664x960 生成时，在7个报告指标中的6个上超越双向 LTX-2。\n- **深度解析**: CSF 通过改变历史而保持噪声目标固定，利用上下文信息不对称，使噪声混合历史学生与干净历史指数移动平均教师的中间表示对齐。上下文对齐 AR DMD 在生成器采样、假分数训练和真分数评估中共享因果掩码和前缀，在块条件 KL 目标下实现分布匹配，无需切换目标或单独的 consistency distillation。\n- **领域归类**: [多模态生成, 视频生成, 模型蒸馏]\n---\n\n### 53. Rethinking World-Action Model for Compositional and In-Context Robotic Manipulation (重构世界-动作模型：面向组合式与上下文内机器人操作)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02368)\n- **研究任务**: 解决长时程组合操作任务中现有世界-动作模型缺乏显式子任务级推理的问题，并支持无需参数更新的上下文内学习。\n- **核心亮点**: 提出分层框架 ViGAR，将操作分解为视觉子目标规划器和子目标执行器；在 RoboTwin Clean2Random 基准上，Clean 和 Random 设置下的成功率分别达到 82.00% 和 67.02%，平均成功率超越最强基线 12.86 个百分点。\n- **深度解析**: 视觉子目标规划器根据当前观察和全局指令预测下一个子任务的视觉子目标。子目标执行器在预测的子目标条件下联合生成未来视觉轨迹和动作。两者共享预训练的世界模型表示，使任务级规划和动作生成受益于共同的物理知识。使用全局目标图像作为上下文可诱导不同的子任务分解和行为。\n- **领域归类**: [机器人学, 世界模型, 视觉语言动作模型]\n---\n\n### 54. DSReg: Provably Recovering Individual World Latents without Reconstruction (DSReg：无需重建即可证明恢复个体世界潜变量)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09457)\n- **研究任务**: 在没有重建、解码器或标签的情况下，证明并实现个体世界潜变量的恢复，解决联合嵌入预测架构（JEPAs）等方法只能识别到线性变换、个体潜变量保持混合的问题。\n- **核心亮点**: 提出“结构多样性”条件和依赖稀疏正则化（DSReg），证明无需重建或解码器即可恢复个体世界潜变量（符号排列意义下）；可事后应用于任何线性识别的表示；建立了首个完全可识别的 JEPA。\n- **深度解析**: 关键条件是“结构多样性”，即不同潜变量对观察留下不同的依赖足迹。DSReg 利用 LeJEPA 提供的线性可识别性，在结构多样性下恢复个体潜变量。该条件严格弱于先前可识别潜变量模型的所有结构条件。在综合机制、世界模型探测、学习视觉编码器和外部渲染器等实验中，DSReg 在保持密集预测的同时提升了个体潜变量恢复和下游使用。\n- **领域归类**: [表征学习, 因果表征学习, 世界模型]\n---\n\n### 55. Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents (谱系感知记忆治理：企业AI代理中保护隐私的列级访问控制派生门控框架)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07258)\n- **研究任务**: 解决企业AI代理共享内存时敏感数据通过合法计算结果泄露，以及不同部门通过冲突逻辑计算同名关键绩效指标（KPI）的风险。\n- **核心亮点**: 引入分析内存单元（AMU），为每个缓存结果附加完整的派生（谱系）图；在6个实验中消除了 18.8-25.5% 的跨部门泄露，保持了 81.5-82.6% 的内存复用，最坏情况开销仅为 13.8 微秒。\n- **深度解析**: 现有系统基于内容、所有权和角色进行门控，忽略了嵌入禁止列的缓存洞察。AMU 通过谱系记录，在 O(n) 最坏情况下阻止从敏感列派生的结果被检索。实验表明需要 75-90% 的谱系记录完整性，设定 90% 为保守部署目标。在带有 LLM 生成 SQL 的真实代理概念验证中，9 次往返实现零泄露并自动捕获 2 个冲突。\n- **领域归类**: [AI安全与隐私, 智能体系统, 数据治理]\n---\n\n### 56. PAMI: Part Anchored Motion for Text to Human-Object Interaction Generation (PAMI：用于文本到人物-物体交互生成的部件锚定运动)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38466)\n- **研究任务**: 解决文本条件下的全身人物-物体交互（HOI）生成中，隐式学习动态变化关系导致的物体漂移、接触丢失和穿透问题。\n- **核心亮点**: 提出 PAMI 框架，受霍夫变换启发，让身体部件锚点对物体运动进行投票；在 InterAct 数据集上接触召回率比先前 SOTA 提高 14.5%；采用从粗到细的层级生成和混合表面感知细化。\n- **深度解析**: 通过 PamiVAE 学习交互潜空间，解码逐帧权重以聚合部件特定投票。PamiGen 在结构化潜空间中生成粗略交互，PamiRefiner 使用混合表面感知表示（结合捕捉整体影响的长程探测和解析详细接触的短程传感器）递归解析细粒度接触几何。\n- **领域归类**: [计算机视觉, 3D视觉/图形学, 生成模型]\n---\n\n### 57. TIDES: Implicit Time-Awareness in Selective State Space Models (TIDES：选择性状态空间模型中的隐式时间感知)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.09742)\n- **研究任务**: 解决选择性状态空间模型（如 Mamba）在处理不规则时间序列时的局限性，同时保留连续时间 SSM（如 S5）处理不规则时间戳的能力且不牺牲单 token 表达能力。\n- **核心亮点**: 提出 TIDES，将输入依赖性从步长转移到对角状态矩阵上；在 Fading Flash 基准上避免了现有 SOTA 的失败模式；在 UEA 时间序列分类和 Physiome ODE 回归基准上取得最佳平均排名。\n- **深度解析**: TIDES 使得步长等于物理时间差，从而原生处理不规则时间戳，同时通过将输入依赖移至对角状态矩阵，保留了选择性 SSM 的单 token 表达能力。在 8 个原生不规则数据集（涵盖天文、农业、神经形态传感和气候事件）上，匹配或超过了参考基线模型。\n- **领域归类**: [深度学习架构, 时间序列分析, 状态空间模型]\n---\n\n### 58. FastOPD: On-Policy Distillation for Lightweight VLA Deployment (FastOPD：面向轻量级 VLA 部署的策略上蒸馏)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02832)\n- **研究任务**: 解决视觉-语言-动作（VLA）基础模型因规模扩大导致计算成本高、难以在真实世界部署的问题。\n- **核心亮点**: 提出 FastOPD 框架，通过高效的策略上蒸馏实现大规模 VLA 的轻量化部署；在 LIBERO 上仅用 2 个推理步骤保留 84% 的性能，推理延迟降低 78.1%；在 RoboTwin 2.0 上单步成功率提升 15.9 个百分点。\n- **深度解析**: FastOPD 调整流图以适应单状态教师监督，并结合自一致性目标构建紧凑的学生模型。理论上证明最小化该目标可使蒸馏学生恢复与理想少步教师模型诱导的分布相当。该方法适用于多种基础策略，并成功部署在真实机器人上。\n- **领域归类**: [机器人学, 模型压缩/蒸馏, 视觉语言动作模型]\n---\n\n### 59. Task-Sufficient Contraction: Source Selection for Machine Information Interfaces (任务充分收缩：机器信息接口的源选择)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08884)\n- **研究任务**: 研究在机器信息接口中，何时一种源缩减（在下游编码器、码本等选择之前固定）能够保留完整的下游问题族（即任务充分收缩）。\n- **核心亮点**: 识别出特定于消费者的源，仅当每个可用动作的遗憾相同时才合并状态；对于有限动作集，用缩减源替代丰富源可保留完整的单步率-遗憾曲线；为仿射可行动作集上的二次损失提供了精确刻画。\n- **深度解析**: 论文探讨了在固定动作集和损失的情况下，通过合并具有相同遗憾的状态来缩减源。对于二次损失，规范缩减源是可行动作可差异方向上的投影。该框架区分了精确、架构条件、近似、失败和修正的收缩，为异构机器交换任务所需信息提供了方法。摘要未提供具体的实验数据集或数字结果。\n- **领域归类**: [信息论, 机器学习理论, 语义通信]\n---\n\n### 60. Co-Evolving Robot Orchestrators and Policies through Deployment (通过部署协同进化机器人编排器与策略)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09228)\n- **研究任务**: 解决视觉-语言-动作（VLA）策略在真实世界部署中泛化能力不足，以及编排器与冻结策略解耦导致策略成为系统瓶颈的问题。\n- **核心亮点**: 提出 Robo-COP，使编排器和策略在部署期间协同进化；在 10 个模拟 RoboLab 任务中，将平均保持未见成功率从 64.8% 提升至 73.8%；在 3 个真实任务中从 38.3% 提升至 50.0%。\n- **深度解析**: Robo-COP 从自身执行中整理技能演示，当数据能解决反复出现的失败时微调策略，并仅在新策略改善其训练技能后才采用它。这将部署转化为一个自我改进的飞轮，机器人通过实践学习，每次执行的改进为下一轮学习产生更好的数据。\n- **领域归类**: [机器人学, 智能体系统, 持续学习]\n---\n\n### 61. How corner is a corner case? Percentile control for highway scenario generation (边缘场景有多“边缘”？高速公路场景生成的百分位控制)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05003)\n- **研究任务**: 自动驾驶仿真环境中的边缘场景（corner-case）生成，旨在精确控制和量化生成场景的极端程度（对抗性/风险）。\n- **核心亮点**: \n  1. 提出将生成场景的对抗性量化为给定观测历史下未来风险条件分布中的百分位数，从而精确衡量场景的“边缘度”。\n  2. 设计了基于历史条件的风险百分位请求机制，并学习参考风险分布以将百分位映射到物理风险目标。\n  3. 采用带有采样时风险引导的百分位条件联合扩散模型（joint diffusion model）来生成多智能体未来轨迹。\n- **深度解析**: 现有的自动驾驶场景生成器难以控制生成的场景在特定交通背景下究竟有多极端。本文通过引入“百分位控制”的概念，将抽象的“边缘度”具象化为风险分布的百分位。在 highD 数据集上的实验表明，该方法以自车与周围车辆的最小后侵入时间（PET）作为风险代理，在 0.05 的百分位容差内成功实现了 98.75%（1422/1440）的风险请求，平均百分位误差仅为 0.00673，PET 目标误差为 0.00991 秒。这为自动驾驶安全测试提供了一个连接上下文相对风险规范、物理实现和评估的统一风险尺度。\n- **领域归类**: [\"自动驾驶\", \"场景生成\", \"扩散模型\", \"安全测试\"]\n---\n\n### 62. System Switch: When Should a Fast Decision Model Stop and Think? (系统切换：快速决策模型何时应该停下来思考？)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09683)\n- **研究任务**: 研究双过程代理（快慢系统结合）中，快速决策模型在实时动态环境下何时应将控制权交给慢速推理模型（即“何时停下来思考”的动态切换机制）。\n- **核心亮点**: \n  1. 提出在实时环境中，由快速学习模型处理常规决策，并通过门控机制在特定条件下将控制权交接给推理视觉语言模型（VLM），同时保持环境持续运行。\n  2. 评估了不同参数规模（0.15B 到 9B）零样本决策模型的准确性、校准和敏感性差异，发现相似准确性的模型在区分对错答案的置信度能力（AUROC）上差异巨大。\n  3. 验证了基于置信度延迟决策（deferment）策略的有效性：离线状态下将最不自信的 30% 决策推迟给推理模型，其收益与演员的 AUROC 高度正相关。\n- **深度解析**: 本文探讨了类人“系统1（快）”和“系统2（慢）”在 AI 代理中的协同机制。研究发现，虽然基于置信度的离线决策延迟能带来显著的性能提升（如 doomLaya 选项顺序下收益提升 +0.13），但在复杂的闭环环境（如 Doom 游戏）中，由于状态感知的局限性（例如无法区分普通门和需要钥匙的锁门）和规划能力的不足，慢速推理模型反而可能导致代理陷入僵局或死亡。这表明在实时动态环境中，快慢系统的切换不仅需要准确的置信度评估，还需要解决底层状态感知和长期规划的挑战。\n- **领域归类**: [\"AI代理/决策\", \"视觉语言模型\", \"强化学习\", \"多智能体系统\"]\n---\n\u003c/details\u003e\n\n\u003cdetails\u orks / 今日 +216 stars\n- **项目简介**: 一个使用Python构建的交互式F1赛车可视化与数据分析工具。\n- **核心价值**: \n  - **项目用途**: 提供F1比赛的交互式可视化回放与数据分析功能。\n  - **目标人群**: F1赛车爱好者、数据分析师、Python开发者、体育数据研究者。\n  - **技术核心**: 数据可视化、交互式分析、Python数据处理。\n  - **AI/大模型相关**: 否。\n\n---\n\n### [CursorTouch/Windows-MCP](https://github.com/CursorTouch/Windows-MCP)\n- **今日趋势**: 8,307 stars / 922 forks / 今日 +411 stars\n- **项目简介**: 用于Windows系统中计算机使用（Computer Use）的MCP服务器。\n- **核心价值**: \n  - **项目用途**: 在Windows系统中提供MCP（模型上下文协议）服务器，支持计算机使用功能。\n  - **目标人群**: AI开发者、Windows自动化需求者、MCP协议使用者。\n  - **技术核心**: MCP服务器实现、Windows系统控制、计算机使用（Computer Use）接口。\n  - **AI/大模型相关**: 是（MCP即Model Context Protocol，且Computer Use是AI大模型控制计算机的核心能力）。\n\u003c/details\u003e"</script>
