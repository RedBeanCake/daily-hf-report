ng Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnderwater image enhancement is challenging to evaluate due to the lack of clean reference images, so researchers rely on no-reference image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learned underwater, vision-language and general-purpose metrics against human preferences on five references: four published opinion-score sets and a new paired-comparison study. For each metric, we measure how often it selects the same image as people when comparing versions of the same scene. We further test whether simple image edits and small adversarial perturbations raise metric scores above the enhancement people preferred, and whether scores decrease as repeated generative edits add noise. Our results show that no metric consistently matches human preferences. The best worst-case Cohen\u0026#x27;s kappa over the five references is only 0.23 (Q-Align), while two raters in our study agree with a median kappa of 0.41. The widely used UCIQE often favors edits that people reject. On a Nano Banana Pro replica chain that should leave the image unchanged, only 22 of 73 scores decrease at every checkpoint, while noise grows by 2.5 times. We also introduce TrustUIQA, a benchmark that combines the human references, our study choices, the edited, attacked and generated images, and the scores of every metric on every image. The code is available at https://github.com/TrustUIQA/TrustUIQA and TrustUIQA at https://huggingface.co/datasets/TrustUIQA/TrustUIQA.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e由于缺乏干净的参考图像，水下图像增强很难评估，因此研究人员依赖于无参考图像质量评估（NR-IQA）指标。然而，这些指标是否与人类判断一致仍不清楚。我们在五个参考集上评估了73种手工水下、学习水下、视觉语言和通用指标与人类偏好的对比：四个已发表的意见得分集和一个新的成对比较研究。对于每个指标，我们测量在比较同一场景的不同版本时，它选择与人类相同图像的频率。我们进一步测试了简单的图像编辑和小的对抗性扰动是否会将指标得分提高到人们偏好的增强之上，以及随着重复的生成编辑增加噪声，得分是否会下降。我们的结果表明，没有指标能一致地匹配人类偏好。在五个参考集上，最坏情况下的最佳Cohen\u0026#x27;s kappa仅为0.23（Q-Align），而我们研究中的两名评分者同意的中位kappa为0.41。广泛使用的UCIQE经常偏好人们拒绝的编辑。在应保持图像不变的Nano Banana Pro复制链上，73个得分中只有22个在每个检查点下降，而噪声增长了2.5倍。我们还引入了TrustUIQA，这是一个结合了人类参考、我们研究的选择、编辑、攻击和生成图像，以及每个指标在每个图像上得分的基准。代码可在 https://github.com/TrustUIQA/TrustUIQA 获取，TrustUIQA数据集可在 https://huggingface.co/datasets/TrustUIQA/TrustUIQA 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估现有水下无参考图像质量评估（NR-IQA）指标与人类感知的一致性，并构建一个综合基准测试（TrustUIQA）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在五个参考集上评估了73种不同的水下及通用图像质量指标与人类偏好的对齐程度。2. 发现没有任何指标能一致匹配人类偏好，最佳最坏情况Cohen\u0026#x27;s kappa仅为0.23。3. 揭示了现有指标（如UCIQE）的缺陷，例如偏好被人类拒绝的编辑，且在图像不变但噪声增加时得分未持续下降。4. 提出TrustUIQA基准，整合人类参考、编辑/攻击/生成图像及所有指标得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要通过大量实验证明了现有水下图像质量指标与人类感知的严重脱节，并提供了新的基准。局限性方面，摘要未提供TrustUIQA基准中人类评分者的具体数量及背景、73种指标的具体分类表现差异、以及该基准在指导新型指标设计方面的具体实验验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/图像质量评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams（JFinBench：来自最新认证考试的可定期刷新日本金融基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18130\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18130\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly applied to finance, creating a need for benchmarks that evaluate their capabilities across financial systems with different regulations and practices. However, existing financial benchmarks provide limited coverage of country-specific financial systems, and they are difficult to keep up to date as released questions leak into training data. We introduce JFinBench, a Japanese financial benchmark comprising 321 examples from the 2026 editions of six regularly administered certification exams covering accounting, tax, financial planning, and banking. To construct it, we develop a human-in-the-loop agentic pipeline in which a coding agent writes exam-specific conversion code and a review page, while a human verifies every example and feeds corrections back to the agent. This pipeline adapts to heterogeneous exam formats and reduces the effort of incorporating new exam editions, enabling periodic refreshes that mitigate data contamination. Evaluating 12 recent LLMs, we find that Claude Fable 5 and GPT-6 Astra exceed 93% overall, while even the best open-weight model, Kimi K3.1 Pro, trails Claude Fable 5 by 12 percentage points. When models can additionally use a terminal and web access, they retrieve the knowledge they lack and every model improves. The gap narrows but about 4 points remain, and the ranking of models stays largely the same, suggesting that knowledge held in the model itself remains valuable even with tools. We release the dataset, the evaluation code, and the construction pipeline.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）越来越多地应用于金融领域，这产生了评估它们在不同法规和实践的金融系统中能力的需求。然而，现有的金融基准对特定国家的金融系统覆盖有限，并且由于发布的问题会泄露到训练数据中，它们很难保持最新。我们引入了JFinBench，这是一个日本金融基准，包含来自2026年版六项定期管理的认证考试的321个示例，涵盖会计、税务、财务规划和银行业。为了构建它，我们开发了一个人在回路的智能体管道，其中编码智能体编写特定于考试的转换代码和审查页面，而人类验证每个示例并将纠正反馈给智能体。该管道适应异构的考试格式，并减少了纳入新考试版本的工作量，从而能够进行定期刷新以缓解数据污染。在评估了12个最新的大型语言模型后，我们发现Claude Fable 5和GPT-6 Astra的整体得分超过93%，而即使是最好的开源权重模型Kimi K3.1 Pro也比Claude Fable 5落后12个百分点。当模型可以额外使用终端和网络访问时，它们检索了所缺乏的知识，每个模型都有所提高。差距缩小了，但仍剩下大约4分，并且模型的排名基本保持不变，这表明即使有工具，模型本身掌握的知识仍然具有价值。我们发布了数据集、评估代码和构建管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个可定期刷新的日本金融基准（JFinBench），以评估大型语言模型在特定国家金融系统中的能力，并缓解数据污染问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出JFinBench，包含321个来自2026年六项日本金融认证考试的示例。2. 开发人在回路的智能体管道，自动转换考试格式并由人类验证，支持定期刷新以缓解数据污染。3. 评估12个LLM，发现闭源模型（如Claude Fable 5和GPT-6 Astra）得分超93%，最佳开源模型落后12个百分点。4. 引入工具（终端和网络）后所有模型得分提升，但排名基本不变，证明模型内部知识依然关键。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了JFinBench在评估特定领域和地区金融知识方面的有效性，以及人在回路管道在保持数据时效性上的优势。局限性方面，摘要未提供该基准在更广泛金融任务上的泛化能力、智能体管道在无人工干预时的具体错误率、以及工具使用场景下具体检索失败的原因。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/金融领域大模型评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. Disen-Forcing: Disentangling Semantic Anchoring from Motion for Autoregressive Video Diffusion（Disen-Forcing：在自回归视频扩散中解耦语义锚定与运动）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.02822\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.02822\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoregressive video diffusion models (AR-VDMs) enable real-time, long-horizon video generation but degrade rapidly once the inference horizon outruns the training horizon, due to compounding exposure bias. To stabilize long rollouts, recent methods heuristically adopt frame sink, keeping initial frames as a persistent model context, inspired by attention sinks in LLMs. We revisit this design and find that the mechanism by which initial frames stabilize long-range consistency in AR-VDMs is not an LLM-style attention sink; instead, long-range consistency is anchored through a sparse subset of attention heads, while the majority of heads predominantly capture local temporal dynamics. This observation reveals an over-conditioning pathology in existing frame-sink strategies: by universally exposing every head to the pinned initial-frame context, the model becomes prone to collapsing motion toward the low-dynamic modes of the teacher during model distillation. We propose Disen-Forcing, a distillation-time plug-in for AR-VDMs that disentangles and reinforces this head specialization through disentangled context routing and motion-disentangling regularization. On long-horizon video generation benchmarks, Disen-Forcing simultaneously improves long-range consistency and motion dynamics of base AR-VDMs, a trade-off that sink-based methods fail to balance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自回归视频扩散模型（AR-VDMs）能够实现实时、长视野的视频生成，但由于复合暴露偏差，一旦推理视野超出训练视野，其性能会迅速下降。为了稳定长程展开，最近的方法受LLM中注意力汇聚的启发，启发式地采用帧汇聚，将初始帧保留为持久的模型上下文。我们重新审视了这一设计，发现初始帧在AR-VDMs中稳定长程一致性的机制并非LLM式的注意力汇聚；相反，长程一致性是通过注意力头的稀疏子集来锚定的，而大多数头主要捕捉局部时间动态。这一观察揭示了现有帧汇聚策略中的一种过度条件化病理：通过普遍地将每个头暴露于固定的初始帧上下文，模型在模型蒸馏期间容易将运动坍缩向教师的低动态模式。我们提出了Disen-Forcing，这是一种用于AR-VDMs的蒸馏时插件，通过解耦上下文路由和运动解耦正则化来解耦并强化这种头的专业化。在长视野视频生成基准上，Disen-Forcing同时改善了基础AR-VDMs的长程一致性和运动动态，这是基于汇聚的方法无法平衡的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决自回归视频扩散模型（AR-VDMs）在长视野生成中因复合暴露偏差导致的性能下降问题，并改进现有的帧汇聚策略。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示AR-VDMs中长程一致性并非通过LLM式的注意力汇聚实现，而是由稀疏注意力头子集锚定，多数头捕捉局部动态。2. 指出现有帧汇聚策略存在过度条件化病理，导致蒸馏时运动向低动态模式坍缩。3. 提出Disen-Forcing蒸馏时插件，通过解耦上下文路由和运动解耦正则化强化头的专业化。4. 在长视野视频生成基准上，同时提升了长程一致性和运动动态，打破了现有方法的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要深入分析了AR-VDMs中注意力头的作用机制，并提出了有效的蒸馏时插件以解决长程生成中的运动坍缩问题。局限性方面，摘要未提供Disen-Forcing插件对训练时间或计算资源的具体增加开销、在不同基础模型架构上的泛化表现、以及长视野视频生成基准的具体名称和定量提升指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成与扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. AI Reviews Are Biased Towards the Appendix（AI 审稿偏向于附录）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17811\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17811\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly used by reviewers to highlight weaknesses during the reviewing process, and their outputs often shape the reviews that humans submit. Prior work studies how LLM reviews align with human ones, yet we know little about which parts of a paper these models actually criticize. In this work, we investigate 2,000 papers from ACL, EMNLP, COLM, and ICLR, and show that the latest GPT and Claude models draw about 50% or more of their review weaknesses from the appendix. This behavior holds across the API, coding-agent, and web access methods for using LLMs to review a paper. In contrast, we find that humans draw only 8.4% of their weaknesses from the appendix, and these weaknesses primarily revolve around a paper\u0026#x27;s presentation and content related to its core idea. Meanwhile, LLMs draw weaknesses from deep in the appendix that concern fine-grained technical details not central to the paper\u0026#x27;s contributions. We anticipate that our analysis will contribute to the scholarly discourse on AI reviews. Our code is publicly available at: https://github.com/cincynlp/review_appendix.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）越来越多地被审稿人用于在审稿过程中指出弱点，其输出通常会影响人类提交的审稿意见。先前的研究探讨了 LLM 审稿意见与人类审稿意见的对齐程度，但我们对这些模型实际上批评论文的哪些部分知之甚少。在这项工作中，我们调查了来自 ACL、EMNLP、COLM 和 ICLR 的 2,000 篇论文，并表明最新的 GPT 和 Claude 模型将其审稿弱点中约 50% 或更多归因于附录。这种行为在使用 LLM 审稿的 API、代码代理和网页访问方法中均成立。相比之下，我们发现人类仅将 8.4% 的弱点归因于附录，且这些弱点主要围绕论文的表述及其核心思想相关的内容。同时，LLM 从附录深处提取弱点，这些弱点涉及并非论文贡献核心的细粒度技术细节。我们预计我们的分析将对 AI 审稿的学术讨论做出贡献。我们的代码已在以下网址公开：https://github.com/cincynlp/review_appendix。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e调查大型语言模型（LLM）在论文审稿过程中指出弱点时，具体批评论文的哪些部分，并对比人类审稿人的行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现最新的 GPT 和 Claude 模型将约 50% 或更多的审稿弱点归因于附录，而人类仅占 8.4%；LLM 倾向于提取附录深处非核心的细粒度技术细节作为弱点；该行为在 API、代码代理和网页访问等多种使用方式中保持一致。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 LLM 审稿存在过度关注附录中非核心细节的偏见，这可能扭曲审稿重点。局限性方面，摘要未提供关于这种偏见对最终录用决定影响的具体数据，也未提供消除或缓解该偏见的实验结果，且未说明不同学科或论文类型中该现象的差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 学术审稿与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Interpreting Coding Agents Through Their Behavioral Trajectories（通过行为轨迹解释代码代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17440\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17440\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStandard coding-agent benchmarks primarily evaluate binary task success, treating execution as a black box and obscuring the behaviors that produce those outcomes. We analyze a large corpus of 143,209 execution trajectories from 125 agent configurations spanning 117 unique models. To enable comparisons across heterogeneous agent interfaces, we develop a rule-based parser that maps raw execution traces to high-level actions such as repository search, file editing, and test execution, and audit its predictions against a six-model consensus reference on 500 events. We find that agents with similar solve rates can nevertheless differ substantially in how they explore, modify and verify code. Moreover, without using task outcomes, token counts, or tool names as features, aggregate behavioral profiles retrieve the corresponding agent stack across disjoint repository sets and programming languages, although task composition is not fully controlled in the cross-repository setting. Through analyses of frontier models and agent scaffolds, we further show that scaffold choice and reasoning effort systematically shift agents\u0026#x27; search, editing, and testing behavior. We release the deterministic parser together with the full annotation and analysis pipeline alongside an annotated trajectory subset.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e标准的代码代理基准主要评估二元任务成功率，将执行视为黑盒，从而掩盖了产生这些结果的行为。我们分析了一个包含 143,209 条执行轨迹的大型语料库，这些轨迹来自跨越 117 个独特模型的 125 种代理配置。为了实现跨异构代理接口的比较，我们开发了一个基于规则的解析器，将原始执行轨迹映射到高级操作（如仓库搜索、文件编辑和测试执行），并在 500 个事件上根据六模型共识参考对其预测进行了审计。我们发现，具有相似解决率的代理在探索、修改和验证代码的方式上仍可能存在显著差异。此外，在不使用任务结果、token 数量或工具名称作为特征的情况下，聚合行为特征可以在不相交的仓库集和编程语言中检索出相应的代理堆栈，尽管在跨仓库设置中任务组合未得到完全控制。通过对前沿模型和代理脚手架的分析，我们进一步表明，脚手架的选择和推理工作量会系统地改变代理的搜索、编辑和测试行为。我们发布了该确定性解析器以及完整的注释和分析流程，并附带了一个注释的轨迹子集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e分析和解释代码代理的执行行为轨迹，以超越传统的二元任务成功率评估，揭示产生结果的具体行为模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了包含 143,209 条轨迹的大型语料库，并开发了基于规则的解析器将原始轨迹映射为高级操作；发现解决率相似的代理在探索、修改和验证代码的行为上存在显著差异；聚合行为特征能够在不使用任务结果等特征的情况下跨仓库和语言检索代理堆栈；证明脚手架选择和推理工作量会系统性地改变代理行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明通过行为轨迹可以深入理解代码代理的内部机制，且行为特征具有跨域检索能力。局限性方面，摘要未提供在跨仓库设置中完全控制任务组合的方法，未提供该解析器在其他未测试代理接口上的泛化能力数据，也未提供行为差异如何具体指导代理架构优化的实验结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 代码代理与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game（Re-Search：通过双人提问游戏剖析大语言模型的思想生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14487\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14487\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eResearch ideation is iterative: researchers refine their ideas step by step based on feedback. Yet existing evaluations obscure this search process, making it difficult to understand how LLMs explore the space of research ideas and what limits their progress. We introduce Re-Search, which adapts the format of Twenty Questions to research ideation: given only the research problem of a published paper, a model must rediscover the paper\u0026#x27;s core idea by asking yes-or-no questions. Built from 200 ICML 2026 papers, Re-Search tracks how a model\u0026#x27;s idea evolves as it asks questions and receives binary oracle feedback, isolating ideation from execution. Across six recent LLMs, nearly all progress happens within the first 30 of 100 questions, which largely decide how the game ends; after that, most models plateau. Through controlled interventions on the candidate questions and the hypothesis space, we find that the bottleneck is generation, not judgment: models recognize a good idea or a good question when one is offered, but often cannot produce it on their own. We further analyze the ideation traces and find that models fail by either over-exploiting one direction or over-exploring too many. These findings point to concrete design principles for autoresearch systems: since models can judge candidates they cannot produce, enriching the search with externally sourced ideas and questions may be more effective than improving any single model\u0026#x27;s generation ability.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e研究构思是迭代的：研究人员根据反馈逐步完善他们的想法。然而，现有的评估掩盖了这一搜索过程，使得难以理解 LLM 如何探索研究想法的空间以及什么限制了它们的进展。我们引入了 Re-Search，它将“二十个问题”游戏的格式应用于研究构思：在仅给出已发表论文的研究问题的情况下，模型必须通过提出是非问题来重新发现论文的核心思想。Re-Search 基于 200 篇 ICML 2026 论文构建，跟踪模型在提问和接收二元预言机反馈时想法的演变，将构思与执行隔离开来。在六个最新的 LLM 中，几乎所有进展都发生在 100 个问题中的前 30 个之内，这在很大程度上决定了游戏的结局；此后，大多数模型趋于平稳。通过对候选问题和假设空间进行受控干预，我们发现瓶颈在于生成而非判断：当提供一个好想法或好问题时，模型能够识别，但通常无法自行产生。我们进一步分析了构思轨迹，发现模型失败的原因要么是过度开发一个方向，要么是过度探索太多方向。这些发现为自动研究系统指出了具体的设计原则：由于模型能够判断它们无法产生的候选项，用外部来源的想法和问题丰富搜索可能比提高任何单一模型的生成能力更有效。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和剖析大语言模型（LLM）在研究构思（ideation）过程中的迭代搜索行为，隔离构思与执行，以理解 LLM 如何探索研究想法空间及其进展限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Re-Search 框架，通过“二十个问题”游戏格式让模型通过是非问题重构论文核心思想；发现 LLM 的构思进展主要集中在前 30 个问题内，之后趋于平稳；通过受控干预证明构思瓶颈在于生成能力而非判断能力；发现模型失败模式为过度开发单一方向或过度探索过多方向。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Re-Search 有效隔离了构思与执行，并揭示了 LLM 在想法生成中的具体瓶颈和失败模式，为自动研究系统提供了设计原则。局限性方面，摘要未提供该框架在 ICML 2026 之外其他会议或领域的泛化测试结果，未说明“外部来源想法”的具体实现和效果数据，且未提供模型在超过 100 个问题后的长期表现分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 自动研究与大语言模型评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. eDMD: Endpoint Distribution Matching for Few-Step Diffusion Distillation（eDMD：用于少步扩散蒸馏的端点分布匹配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17194\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17194\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDistribution matching distillation (DMD) has emerged as a leading paradigm for distilling diffusion models into few-step students, where an auxiliary fake score model tracks the student\u0026#x27;s distribution and the discrepancy between the teacher and fake predictions drives the student toward the teacher. In multi-step distillation, although only the student\u0026#x27;s final output is delivered, existing methods train the fake model on intermediate states or across all denoising steps. Consequently, the student\u0026#x27;s update signal becomes entangled with intermediate distributions, which can distort the matching direction and remain nonzero even after the student\u0026#x27;s final outputs already match the teacher distribution. To resolve this mismatch, we propose Endpoint Distribution Matching Distillation (eDMD), which trains a single shared fake model exclusively on the student\u0026#x27;s final outputs and uses it to correct every denoising step. Our theoretical analysis proves that this endpoint reference guarantees that the distribution matching term vanishes if and only if the student\u0026#x27;s final output distribution matches the teacher\u0026#x27;s, regardless of intermediate distributions. Beyond the fake reference, we further strengthen teacher supervision through a precise teacher (PT) that replaces single-step guided predictions with short multi-step trajectories on the final noise interval, paired with a calibrated query density for intermediate steps. Experiments on SD3-Medium, FLUX.2-klein (4B and 9B), and Qwen-Image-2.1 demonstrate that eDMD consistently outperforms existing distribution matching methods for 4-step generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e分布匹配蒸馏（DMD）已成为将扩散模型蒸馏为少步学生模型的领先范式，其中辅助的假分数模型跟踪学生模型的分布，教师模型与假预测之间的差异驱动学生模型向教师模型靠拢。在多步蒸馏中，尽管仅传递学生模型的最终输出，但现有方法在中间状态或所有去噪步骤上训练假模型。因此，学生模型的更新信号与中间分布纠缠在一起，这可能会扭曲匹配方向，并且即使学生模型的最终输出已经匹配教师分布，该信号仍保持非零。为了解决这种不匹配，我们提出了端点分布匹配蒸馏（eDMD），它专门在学生模型的最终输出上训练单个共享假模型，并使用它来纠正每个去噪步骤。我们的理论分析证明，无论中间分布如何，这种端点参考保证了当且仅当学生模型的最终输出分布与教师模型匹配时，分布匹配项才会消失。除了假参考之外，我们还通过精确教师（PT）进一步加强教师监督，该精确教师在最终噪声区间上用短多步轨迹替换单步引导预测，并配以中间步骤的校准查询密度。在 SD3-Medium、FLUX.2-klein（4B 和 9B）和 Qwen-Image-2.1 上的实验表明，eDMD 在 4 步生成中始终优于现有的分布匹配方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多步扩散模型蒸馏中学生模型更新信号与中间分布纠缠的问题，提出一种新的分布匹配蒸馏方法以提升少步生成质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出端点分布匹配蒸馏（eDMD），仅在学生最终输出上训练共享假模型以纠正所有去噪步骤；理论证明端点参考能确保分布匹配项在最终输出匹配时消失；引入精确教师（PT）机制，在最终噪声区间使用短多步轨迹替代单步引导预测；在 SD3-Medium、FLUX.2-klein 和 Qwen-Image-2.1 上，4 步生成性能一致优于现有分布匹配方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 eDMD 从理论和实验上解决了现有 DMD 方法中更新信号与中间分布纠缠的问题，提升了少步生成的性能。局限性方面，摘要未提供 eDMD 在超过 4 步生成中的表现对比，未说明训练假模型和精确教师机制带来的额外计算开销，也未提供在更高分辨率或更复杂数据集上的评估结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 扩散模型与图像生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. Parsed, Plausible, Wrong: Output Format Controls Silent Errors in Small-Model Semantic Parsing（解析正确、看似合理但错误：输出格式控制小模型语义解析中的静默错误）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17169\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17169\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA small fine-tuned parser that emits a well-formed but wrong tree fails silently: nothing downstream can tell. We ask whether the output format, a free design choice, controls how often this happens. On the PIZZA ordering benchmark we fine-tune two sub-billion models (Qwen3.5-0.8B and LFM2.5-350M) with LoRA on six lossless encodings of the same target tree, from 44.3 down to 10.9 tokens per order, including two matched-length pairs that vary surface form at fixed length. Across 300 runs (5 training pool sizes, 5 seeds) with a hierarchical bootstrap and Holm correction fixed before the results were read, shortening alone never helps, but writing the target in ordinary words does. The word encoding is the most accurate format on both models (87.5% vs. 85.8% exact match for the native s-expression on Qwen) while emitting 4.1x fewer tokens, and it cuts the silent error rate by 2.3x on Qwen and 1.8x on LFM2, separating at every pool size. Error analysis locates much of the gain in negation. All runs also learn to refuse off-menu input (held out: 95.9-99.0% handled) and to apply in-utterance self-corrections. Strict refusal has a measured price: 2.1-10.1% of real, mostly polite, orders are refused.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e一个微调过的小解析器如果输出一个结构良好但错误的树，就会发生静默失败：下游任务无法察觉。我们询问输出格式（一种自由的设计选择）是否控制了这种情况发生的频率。在 PIZZA 点餐基准上，我们使用 LoRA 对两个十亿参数以下的模型（Qwen3.5-0.8B 和 LFM2.5-350M）进行微调，使用同一目标树的六种无损编码，从每单 44.3 个 token 减少到 10.9 个 token，包括两对在固定长度下改变表面形式的匹配长度对。在 300 次运行（5 个训练池大小，5 个随机种子）中，采用分层 bootstrap 和 Holm 校正在读取结果前固定，仅缩短长度从未有帮助，但用普通词汇书写目标则有帮助。词汇编码在两个模型上都是最准确的格式（在 Qwen 上为 87.5% 对原生 s 表达式的 85.8% 精确匹配），同时输出的 token 数量减少了 4.1 倍，并且它将 Qwen 的静默错误率降低了 2.3 倍，将 LFM2 的降低了 1.8 倍，在每个池大小下均表现出差异。错误分析发现大部分增益在于否定词的处理。所有运行还学会了拒绝菜单外的输入（保留测试集：处理了 95.9-99.0%）并应用话语内自我纠正。严格的拒绝有其可衡量的代价：2.1-10.1% 的真实（主要是礼貌的）订单被拒绝。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e研究输出格式（一种自由的设计选择）如何影响小型微调语义解析器产生静默错误（即输出结构良好但语义错误）的频率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现仅缩短输出长度无法减少静默错误，而使用普通词汇编码不仅能提高精确匹配率（Qwen 达 87.5%），还能减少 4.1 倍 token 输出；词汇编码将 Qwen 和 LFM2 的静默错误率分别降低了 2.3 倍和 1.8 倍；模型学会了拒绝菜单外输入（处理率 95.9-99.0%）并进行自我纠正；严格的拒绝会导致 2.1-10.1% 的真实订单被误拒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明输出格式的选择对小型模型的静默错误率有显著影响，词汇编码在准确性和效率上均优于原生 s 表达式。局限性方面，摘要未提供该结论在其他语义解析基准上的泛化验证，未说明词汇编码在更复杂语法结构下的具体表现，且未提供解决真实订单误拒问题的方案。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 语义解析与小模型优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. BrickFlow: Connectivity-Guided Brick Reconstruction（BrickFlow：连接引导的积木重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17321\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17321\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGiven a set of LEGO parts and an image of an assembled object, our task is to infer the pose of each part to assemble the object. In contrast with traditional 3D reconstruction, doing so requires satisfying discrete physical constraints, which provide structure but render the problem combinatorial and highly sensitive to small pose errors. To learn a prior over how parts fit together, we train a set-conditioned SE(3) flow model on procedurally generated assemblies. We then finetune this model to inject image conditioning, using 1% as much data. However, while the learned flow captures global structure, it does not enforce connectivity. To address this, we introduce an analytic connectivity-field guidance to pull predictions toward connected assemblies at test time. Through this, we demonstrate improved build quality with model size, pretraining, and guidance. We make our models and data available for research purposes at https://kulits.github.io/BrickFlow/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e给定一组乐高零件和一个组装物体的图像，我们的任务是推断每个零件的姿态以组装该物体。与传统的3D重建相比，这样做需要满足离散的物理约束，这些约束提供了结构，但也使问题变得组合化，并对微小的姿态误差高度敏感。为了学习零件如何组合在一起的先验，我们在程序生成的组件上训练了一个集合条件SE(3)流模型。然后，我们微调该模型以注入图像条件，仅使用1%的数据。然而，虽然学习到的流捕获了全局结构，但它没有强制执行连接性。为了解决这个问题，我们引入了一个解析连接场引导，在测试时将预测拉向连接的组件。通过这种方法，我们证明了随着模型规模、预训练和引导的增加，构建质量得到了改善。我们将模型和数据用于研究目的，发布在 https://kulits.github.io/BrickFlow/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e给定一组乐高零件和组装物体的图像，推断每个零件的姿态以组装物体。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 训练集合条件SE(3)流模型学习零件组合先验，并微调注入图像条件（仅用1%数据）。2. 引入解析连接场引导，在测试时将预测拉向连接的组件，解决流模型不强制执行连接性的问题。3. 证明了模型规模、预训练和引导对构建质量的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统3D重建与积木重建的区别在于离散物理约束导致组合问题和姿态误差敏感性。方法上结合了流模型和解析连接场引导。局限性方面，摘要未提供具体的评估指标、对比基线或具体的失败案例，仅定性说明了构建质量的改善。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与3D重建\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. LuthorSQL: A One-Pass Text-to-SQL Model as System 1 for a Slower LLM Agent（LuthorSQL：作为较慢LLM代理系统1的单遍Text-to-SQL模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17780\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17780\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier LLM agents that query databases with tools are among the most accurate text-to-SQL systems, but per-query calls to a hosted model are slow, costly, and expose sensitive organizational queries to external APIs. For example, a Claude Opus 5.5 agent serving 10,000 queries a day costs over $70,000 a year at list price. To what extent can local hardware already owned by an organization offload this burden without compromising the agent\u0026#x27;s accuracy? We present LuthorSQL, a non-autoregressive 7B text-to-SQL model that serves as a rapid System 1 gate for a slower LLM agent (System 2), escalating queries only when uncertain. LuthorSQL makes a single forward pass to predict slot scores over a bounded grammar for query plans, compiles and runs up to 32 candidate plans, and chooses an answer using a trained validator. On its own, LuthorSQL reaches 68.03% execution accuracy on BIRD\u0026#x27;s hidden test set at 0.84 s per question on a single GPU, maintains its accuracy in 9 GB with 8-bit quantized weights, and transfers zero-shot to Snowflake, BigQuery, MySQL, PostgreSQL, and DuckDB within 3.1 points of its native SQLite accuracy. Combined with Claude Opus 5.5 in a pre-registered confidence cascade over 227 questions on databases published after Opus\u0026#x27;s training cutoff, LuthorSQL answers nearly half of all questions locally and cuts API cost by 33.3% at the same accuracy. Finally, contamination probing shows that Opus reproduces 48-92% of public benchmark gold queries verbatim without seeing the schema; however, its tool-assisted accuracy holds on renamed schemas and reaches 95.6-97.4% on post-cutoff databases. Code and data: https://github.com/IAMIbrahimmemon/luthorsql\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e使用工具查询数据库的前沿LLM代理是最准确的text-to-SQL系统之一，但对托管模型的每次查询调用缓慢、昂贵，并将敏感的组织查询暴露给外部API。例如，每天处理10,000个查询的Claude Opus 5.5代理按标价每年成本超过70,000美元。组织已拥有的本地硬件在多大程度上可以在不损害代理准确性的情况下减轻这种负担？我们提出了LuthorSQL，一个非自回归的7B text-to-SQL模型，作为较慢LLM代理（System 2）的快速System 1门控，仅在不确定时升级查询。LuthorSQL进行单次前向传播以预测查询计划有界语法上的槽位分数，编译并运行多达32个候选计划，并使用训练有素的验证器选择答案。单独使用时，LuthorSQL在BIRD的隐藏测试集上达到68.03%的执行准确率，在单个GPU上每个问题耗时0.84秒，在9 GB的8位量化权重下保持其准确率，并以零样本方式转移到Snowflake、BigQuery、MySQL、PostgreSQL和DuckDB，与原生SQLite准确率相差在3.1个百分点以内。与Claude Opus 5.5结合，在Opus训练截止日期后发布的数据库上的227个问题进行预注册的置信度级联，LuthorSQL在本地回答了几乎所有问题中的近一半，并在相同准确率下将API成本降低了33.3%。最后，污染探测表明，Opus在没有看到模式的情况下逐字重现了48-92%的公共基准黄金查询；然而，其工具辅助准确率在重命名模式上保持不变，并在截止日期后的数据库上达到95.6-97.4%。代码和数据：https://github.com/IAMIbrahimmemon/luthorsql\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个快速的本地text-to-SQL模型（LuthorSQL），作为较慢LLM代理的门控（System 1），以在不牺牲准确性的情况下降低API调用成本、延迟和数据泄露风险。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出非自回归7B模型LuthorSQL，单次前向传播预测槽位分数，编译运行最多32个候选计划并用验证器选择答案。2. 在BIRD隐藏测试集上达68.03%准确率，单GPU推理0.84秒，8位量化仅需9GB，零样本迁移至多种数据库误差在3.1%内。3. 与Claude Opus 5.5组成置信度级联系统，本地处理近半问题，降低33.3% API成本且准确率不变。4. 揭示了Opus在基准测试中的记忆污染问题及其在重命名模式和截止日期后数据库上的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详实的实验数据（如准确率、推理时间、成本降低比例、量化大小等），证明了LuthorSQL的高效性和迁移能力。局限性方面，摘要未提供LuthorSQL在复杂查询或特定数据库方言上的具体失败分析，也未详细说明验证器的具体架构或置信度级联的阈值设定细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与数据库查询\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Dual Flow: Joint Image-Measurement Interpolation for Inverse Problems（Dual Flow：用于逆问题的联合图像-测量插值）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.05843\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.05843\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerative model-based approaches to linear inverse problems typically use the acquired noisy measurement to condition or guide sampling in the image domain. In this work, we introduce Dual Flow, a novel joint-flow model for solving linear inverse problems by jointly estimating the clean image and corresponding noise-free measurement from the observation. Specifically, Dual Flow formulates image reconstruction and measurement denoising as a coupled estimation problem, using coupled flows in the image and measurement domains. The acquired noisy measurement is used only to initialize the measurement state; thereafter, image and measurement states are jointly updated based on their current values. By construction, the final image and measurement estimates are guaranteed to satisfy the underlying forward model. We derive the sampling updates for the joint-flow which involves the conditional mean of the clean image given the joint state. We further derive a closed-form expression for a sufficient statistic of the joint state and show that the required conditional mean can be obtained by solving an image-domain Gaussian denoising problem involving operator-dependent, correlated noise. We train a velocity-prediction network using this formulation to estimate the conditional mean from the derived sufficient statistic. Extensive experiments across various linear inverse problems and image datasets demonstrate state-of-the-art performance in both distortion metrics and perceptual quality. Dual Flow requires no hyperparameter tuning beyond the number of inference steps and achieves shorter reconstruction times than competing methods. Additional analyses assess robustness to model mismatch, as well as the ability to generate diverse plausible reconstructions and characterize reconstruction uncertainty.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于生成模型的线性逆问题方法通常使用获取的噪声测量来调节或引导图像域中的采样。在这项工作中，我们引入了Dual Flow，一种新颖的联合流模型，通过从观测中联合估计干净图像和相应的无噪声测量来解决线性逆问题。具体而言，Dual Flow将图像重建和测量去噪表述为耦合估计问题，在图像和测量域中使用耦合流。获取的噪声测量仅用于初始化测量状态；此后，图像和测量状态根据它们当前的值进行联合更新。通过构造，最终的图像和测量估计保证满足底层的前向模型。我们推导了联合流的采样更新，其中涉及给定联合状态的干净图像的条件均值。我们进一步推导了联合状态充分统计量的闭式表达式，并表明所需的条件均值可以通过求解涉及依赖于算子的相关噪声的图像域高斯去噪问题来获得。我们使用这种公式训练了一个速度预测网络，以从推导出的充分统计量中估计条件均值。在各种线性逆问题和图像数据集上的大量实验表明，在失真指标和感知质量方面均达到了最先进的性能。Dual Flow除了推理步数外不需要超参数调整，并且比竞争方法实现了更短的重建时间。额外的分析评估了对模型不匹配的鲁棒性，以及生成多样化合理重建和表征重建不确定性的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决线性逆问题，通过从观测中联合估计干净图像和相应的无噪声测量来进行图像重建和测量去噪。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Dual Flow联合流模型，将图像重建和测量去噪表述为耦合估计问题，在图像和测量域使用耦合流。2. 最终估计通过构造保证满足底层前向模型。3. 推导了联合流采样更新及充分统计量的闭式表达式，将条件均值估计转化为图像域高斯去噪问题。4. 无需超参数调整（除推理步数外），重建时间短，且在失真和感知质量上达到SOTA。5. 具备对模型不匹配的鲁棒性，能生成多样化重建并表征不确定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细阐述了Dual Flow的数学推导（如充分统计量闭式解、条件均值转化为高斯去噪），并强调了其无需调参、速度快、满足前向模型保证等优势。局限性方面，摘要未提供具体的数据集名称、具体的SOTA数值对比、前向模型的具体类型，也未说明在极端噪声或严重模型失配下的具体性能下降情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图像重建\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. EvenVLM: A Text and Multimodal Dataset for the Even Language with Vision-Language Fine-Tuning（EvenVLM：用于Even语言并带有视觉语言微调的文本和多模态数据集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16500\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16500\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present EvenVLM, the first text and multimodal (VQA) dataset for Even (Lamut), an endangered Northern Tungusic language spoken by approximately 6,800 people in Siberia. Our dataset comprises 50,521 structured Even-Russian entries extracted from dictionary and phrasebook sources via GPT-4o Mini-based parsing, from which we synthetically generate 107,543 training examples spanning translation, grammar, reading comprehension, and semantic classification. To address tokenization inefficiency on Even\u0026#x27;s agglutinative morphology, we propose a three-step tokenizer expansion algorithm that adds Even-specific graphemes (eng, oe, o-umlaut), whitelisted vocabulary, and BPE merges, reducing average tokens per word by 27% (4.99 to 3.64). Using LoRA fine-tuning of Qwen3-VL-4B, we adapt the model for text tasks (0.53% trainable parameters, rank 32) and separately for visual question answering (rank 64, frozen vision encoder). Our best configuration achieves 11.4% exact match and a 13.6 weighted score on text benchmarks, 0.1283 chrF for sentence translation, and 65% accuracy on VQA (up from 0% for the base model and text-only fine-tuning). We release our datasets, evaluation benchmarks, and training pipeline to support further research on Even and other low-resource languages.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了EvenVLM，这是针对Even（Lamut）语的首个文本和多模态（VQA）数据集，Even语是一种在西伯利亚约6,800人使用的濒危北通古斯语。我们的数据集包含50,521个结构化的Even-俄语条目，这些条目通过基于GPT-4o Mini的解析从词典和短语手册来源提取，我们从中合成了107,543个训练样本，涵盖翻译、语法、阅读理解和语义分类。为了解决Even语黏着语形态导致的分词效率低下问题，我们提出了一种三步分词器扩展算法，添加了Even语特有的字素（eng, oe, o-umlaut）、白名单词汇和BPE合并，将每个词的平均token数减少了27%（从4.99降至3.64）。使用Qwen3-VL-4B的LoRA微调，我们使模型适应文本任务（0.53%可训练参数，秩32）并单独适应视觉问答（秩64，冻结视觉编码器）。我们的最佳配置在文本基准上实现了11.4%的精确匹配和13.6的加权分数，句子翻译的chrF为0.1283，VQA准确率为65%（基础模型和纯文本微调为0%）。我们发布数据集、评估基准和训练流程，以支持对Even语及其他低资源语言的进一步研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建首个针对濒危语言Even语的文本和多模态（VQA）数据集，并微调视觉语言模型以支持该语言的文本和视觉问答任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发布首个Even语文本和多模态数据集（包含50,521个词典条目和107,543个合成训练样本）。2. 提出三步分词器扩展算法，解决黏着语分词效率问题，平均token数减少27%。3. 使用LoRA微调Qwen3-VL-4B，在VQA任务上达到65%准确率（基础模型为0%），并在文本任务上取得一定性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了数据集的规模、构建方法（GPT-4o Mini提取与合成）以及分词器优化的具体效果。局限性方面，摘要未提供文本任务中各项子任务（如翻译、语法）的具体细分指标，未说明合成数据可能引入的噪声或幻觉问题，也未对比其他低资源语言模型或大模型在Even语上的基线表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与低资源语言\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. MemInStream: Memorizing or Merely Recognizing? Rethinking Streaming Video Memory Evaluation（MemInStream：记忆还是仅仅识别？重新思考流式视频记忆评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15640\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15640\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video understanding aims to continuously process incoming visual observations, making the retention and retrieval of relevant information increasingly important as the video history grows. Although existing benchmarks include memory-related questions, question-answering accuracy alone does not reliably measure memory capabilities. Incorrect predictions may arise from failures in visual understanding rather than forgetting, whereas correct predictions may rely on linguistic priors or recent observations without requiring historical memory. To address these ambiguities, we introduce MemInStream, a benchmark dedicated to evaluating memory capabilities in streaming video understanding. We develop an evidence-controlled validation protocol that associates each question with temporally localized evidence intervals. The protocol validates evidence solvability and memory necessity by retaining questions that models can answer from the annotated evidence but cannot resolve using recent observations, post-evidence observations, or textual input alone. This helps disentangle memory limitations from understanding failures while reducing memory-independent shortcuts. MemInStream provides a systematic evaluation of memory capabilities through four major categories, covering Episodic Retrieval, State Tracking \\\u0026amp; Updating, Multi-Evidence Integration, and Contextual Memory across diverse video scenarios. Overall, MemInStream provides a comprehensive and reliable benchmark for systematically evaluating memory capabilities in streaming video understanding.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频理解旨在持续处理传入的视觉观察，随着视频历史的增长，相关信息的保留和检索变得越来越重要。尽管现有的基准测试包含与记忆相关的问题，但仅凭问答准确率并不能可靠地衡量记忆能力。不正确的预测可能源于视觉理解的失败而不是遗忘，而正确的预测可能依赖语言先验或最近的观察，而不需要历史记忆。为了解决这些歧义，我们引入了MemInStream，一个专门用于评估流式视频理解中记忆能力的基准测试。我们开发了一种证据控制的验证协议，将每个问题与时间局部化的证据区间相关联。该协议通过保留那些模型可以从注释证据中回答，但无法仅使用最近观察、证据后观察或纯文本输入解决的问题，来验证证据的可解性和记忆的必要性。这有助于将记忆限制与理解失败区分开来，同时减少不依赖记忆的捷径。MemInStream通过四个主要类别提供对记忆能力的系统评估，涵盖不同视频场景中的情节检索、状态跟踪与更新、多证据整合和上下文记忆。总体而言，MemInStream为系统评估流式视频理解中的记忆能力提供了一个全面且可靠的基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个专门用于评估流式视频理解中记忆能力的基准测试（MemInStream），以解决现有基准中问答准确率无法可靠衡量记忆能力的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 指出现有基准中问答准确率无法区分视觉理解失败与记忆遗忘，且存在依赖语言先验或近期观察的捷径。2. 提出MemInStream基准及证据控制验证协议，通过时间局部化证据区间验证证据可解性和记忆必要性。3. 涵盖情节检索、状态跟踪与更新、多证据整合和上下文记忆四大类记忆能力评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要清晰地定义了流式视频记忆评估的痛点（理解失败与遗忘的混淆、非记忆捷径），并提出了严谨的证据控制验证协议来消除这些歧义。局限性方面，摘要未提供具体的视频数据集规模、模型在该基准上的具体表现数字、四大类别的具体样本数量，也未说明该协议在自动化构建基准时的可行性或潜在的人工标注偏差。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. OneSteer: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control（OneSteer：通过单步扩散全身控制解锁可转向的通用仿人运动跟踪）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2610.41354\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2610.41354\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDeployment objectives often specify desired outcomes without providing revised trajectories, while parts of the original reference must still be followed. We present OneSteer, a one-step diffusion whole-body controller that combines general motion tracking with selective test-time steering. To accommodate new objectives, differentiable task costs guide optimization of the generator\u0026#x27;s input noise with frozen weights, while body-group reference masks relax selected tracking requirements. Predicted state-action plans provide a shared interface for task optimization and feedback-conditioned execution. For nominal tracking, the model trained from scratch achieves the lowest local tracking error among the evaluated baselines on successful held-out AMASS and BONES clips. For steering, one frozen distilled controller adapts across diverse deployment objectives in simulation, raising the clean passage rate under a 1.25 m bar from 2% to 90%. On a physical Unitree G1, OneSteer completes all 27 nominal tracking trials across nine diverse whole-body motion sequences without falling. With a steering cost derived from a signed distance field built using only onboard LiDAR, it also passes under a 1.1 m low bar in four of five attempts and steps over a 12 cm hurdle without falling in all three attempts. Beyond control, prediction variation in the model trained from scratch ranks likely tracking failures without physics rollouts. This scoring method is more than 10x faster than simulation-based scoring with five rollouts per clip and guides targeted fine-tuning. Project page: https://onesteer.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e部署目标通常指定期望的结果而不提供修改后的轨迹，同时仍需遵循原始参考的一部分。我们提出了 OneSteer，一种单步扩散全身控制器，它将通用运动跟踪与选择性的测试时转向相结合。为了适应新目标，可微任务成本引导具有冻结权重的生成器输入噪声的优化，同时身体组参考掩码放宽了选定的跟踪要求。预测的状态-动作计划为任务优化和反馈条件执行提供了共享接口。对于标称跟踪，从头训练的模型在成功的保留 AMASS 和 BONES 剪辑中，在评估的基线中实现了最低的局部跟踪误差。对于转向，一个冻结的蒸馏控制器在仿真中适应不同的部署目标，将 1.25 米横杆下的干净通过率从 2% 提高到 90%。在物理 Unitree G1 上，OneSteer 在九个不同的全身运动序列中完成了所有 27 次标称跟踪试验而没有摔倒。利用仅使用机载激光雷达构建的符号距离场得出的转向成本，它还在五次尝试中的四次中通过了 1.1 米的低横杆，并在所有三次尝试中跨过了 12 厘米的障碍物而没有摔倒。除了控制之外，从头训练的模型中的预测变化无需物理回滚即可对可能的跟踪失败进行排名。这种评分方法比每个剪辑五次回滚的基于仿真的评分快 10 倍以上，并指导有针对性的微调。项目页面：https://onesteer.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种结合通用运动跟踪与选择性测试时转向的单步扩散全身控制器（OneSteer），以适应部署目标指定期望结果但不提供修改后轨迹的需求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出OneSteer，结合通用运动跟踪与测试时转向，通过可微任务成本优化输入噪声并使用身体组参考掩码放宽跟踪要求。2. 在标称跟踪中，从头训练的模型在AMASS和BONES数据集上实现最低局部跟踪误差。3. 在仿真中，冻结的蒸馏控制器将1.25米横杆下的干净通过率从2%提升至90%。4. 在物理Unitree G1上，完成27次标称跟踪试验未摔倒；在1.1米低横杆下5次尝试通过4次，跨越12厘米障碍物3次未摔倒。5. 利用预测变化对跟踪失败进行排名，评分速度比基于仿真的评分快10倍以上。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了OneSteer在仿真和物理机器人上的卓越跟踪和转向能力，并提供了具体的成功率数据，同时提出了一种无需物理回滚的快速失败排名方法。局限性方面，摘要未提供关于计算资源消耗的具体数值、在更复杂环境下的泛化能力评估、以及与其他最新非基线方法的详细对比等局限信息。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/运动控制/强化学习与扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. Restoring Diversity in Distilled Image and Video Generators by Probing Activations（通过探测激活恢复蒸馏图像和视频生成器中的多样性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18550\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18550\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDistilling diffusion models into few-step student models substantially reduces sampling latency, but induces severe diversity collapse: samples generated from different random seeds show minimal variation. In this work, we investigate the root cause of this failure by probing the internal representations of student models relative to their teachers. We find that distilled students maintain total activation variance comparable to their teachers, but concentrate it into substantially fewer directions. This directional collapse is localized to an identifiable intermediate block at the initial denoising step. Consequently, diversity collapse stems from a misallocation of activation variance rather than an inherent loss of generative capacity. Guided by this finding, we propose ReDiverse to reinstate the missing variance directions. At training time, ReDiverse-FT fine-tunes a lightweight adapter that regresses student activations onto the teacher\u0026#x27;s, reviving the teacher\u0026#x27;s feature variance characteristic. At inference time, ReDiverse-TF introduces a training-free mechanism that steers activations along precomputed teacher principal directions. Across image and video distillation benchmarks, ReDiverse consistently restores sample diversity while preserving generation quality, further supported by the user study.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将扩散模型蒸馏为少步学生模型可显著降低采样延迟，但会引发严重的多样性崩溃：从不同随机种子生成的样本表现出极小的变化。在这项工作中，我们通过探测学生模型相对于其教师的内部表示来调查这种失败的根本原因。我们发现，蒸馏学生保持了与其教师相当的总激活方差，但将其集中到大幅更少的方向上。这种方向性崩溃局限于初始去噪步骤中一个可识别的中间块。因此，多样性崩溃源于激活方差的错误分配，而不是生成能力的固有损失。在这一发现的指导下，我们提出了 ReDiverse 来恢复缺失的方差方向。在训练时，ReDiverse-FT 微调一个轻量级适配器，将学生激活回归到教师的激活上，恢复教师的特征方差特征。在推理时，ReDiverse-TF 引入了一种免训练机制，沿着预先计算的教师主方向引导激活。在图像和视频蒸馏基准测试中，ReDiverse 一致地恢复了样本多样性，同时保持了生成质量，用户研究进一步支持了这一点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e调查扩散模型蒸馏为少步学生模型时引发严重多样性崩溃的根本原因，并提出ReDiverse方法来恢复缺失的方差方向，以在保持生成质量的同时恢复样本多样性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现多样性崩溃的根本原因是激活方差的错误分配（集中在大幅更少的方向上），而非生成能力的固有损失，且该方向性崩溃局限于初始去噪步骤的特定中间块。2. 提出ReDiverse方法，包含训练时的ReDiverse-FT（微调轻量级适配器回归学生激活到教师激活）和推理时的ReDiverse-TF（免训练机制，沿预计算教师主方向引导激活）。3. 在图像和视频蒸馏基准测试中，一致地恢复了样本多样性并保持了生成质量，且得到了用户研究的支持。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要深入分析了蒸馏模型多样性崩溃的内在机制，并提出了包含训练和推理阶段的两阶段解决方案，在图像和视频任务上均验证了有效性。局限性方面，摘要未提供具体的性能提升数值、计算开销的增加情况、以及在更高分辨率或更复杂视频生成任务中的具体表现和局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/生成模型/模型蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. Alloy: A Multi-Material Physics Engine for Robot Learning（Alloy：用于机器人学习的多材料物理引擎）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16312\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16312\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobots handle much more than rigid objects: towels, cables, water, sand. The simulators used to train robots at scale are strongest on rigid bodies, and adding another material usually means a second engine and hand-written glue between the two. We present Alloy, an open-source physics engine for robot learning in which rigid robots, cloth, cables, liquids, granular material and soft bodies share one scene. Each object is described once; Alloy assigns it to a solver suited to its material, couples the solvers inside every control step, and runs the scene in many parallel worlds on one GPU, or on a CPU. Every world carries a health grade, to help tell a failure of the physics from a failure of the policy. Alloy is built on Newton, MuJoCo Warp and Warp, and it is written to be driven by coding agents: its documentation ships inside the package, every error names its fix, and the engine is exposed as tools over the Model Context Protocol. In a cold test, agents that had never seen Alloy installed a pre-release from the package index and trained policies for walking, cable handling and pouring on a single GPU. We also report how throughput grows with the number of worlds, depth-camera throughput, agreement with closed-form references, and a reliability test over a thousand worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人处理的不仅仅是刚性物体：毛巾、电缆、水、沙子。用于大规模训练机器人的模拟器在刚体方面最强，添加另一种材料通常意味着需要第二个引擎以及两者之间手写的粘合代码。我们提出了 Alloy，一个用于机器人学习的开源物理引擎，其中刚性机器人、布料、电缆、液体、颗粒材料和软体共享一个场景。每个对象只描述一次；Alloy 将其分配给适合其材料的求解器，在每个控制步骤内耦合这些求解器，并在一个 GPU 或 CPU 上的许多并行世界中运行场景。每个世界都带有一个健康等级，以帮助区分物理失败和策略失败。Alloy 构建于 Newton、MuJoCo Warp 和 Warp 之上，它被编写为由编码代理驱动：其文档随包一起发布，每个错误都指明其修复方法，并且引擎作为 Model Context Protocol 上的工具暴露。在冷启动测试中，从未见过 Alloy 的代理从包索引安装了预发布版本，并在单个 GPU 上训练了用于行走、电缆处理和倾倒的策略。我们还报告了吞吐量如何随世界数量的增长而增长、深度相机吞吐量、与封闭形式参考的一致性，以及超过一千个世界的可靠性测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一个名为Alloy的开源多材料物理引擎，使刚性机器人、布料、电缆、液体、颗粒材料和软体能够在同一场景中共享，并支持由编码代理驱动，以解决现有模拟器在处理非刚性材料时需要多个引擎和手写粘合代码的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Alloy，支持刚性机器人、布料、电缆、液体、颗粒材料和软体在同一场景中共享，每个对象描述一次并自动分配给合适的求解器，在每个控制步骤内耦合。2. 支持在单个GPU或CPU上的多个并行世界中运行场景，并为每个世界提供健康等级以区分物理失败和策略失败。3. 专为编码代理驱动设计，文档内置，错误提示修复方法，并通过Model Context Protocol暴露为工具。4. 冷启动测试证明未见过的代理能自动安装并训练行走、电缆处理和倾倒策略。5. 报告了吞吐量随世界数量增长、深度相机吞吐量、与封闭形式参考的一致性以及千个世界的可靠性测试结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细介绍了Alloy引擎的多材料耦合能力、并行计算架构以及为编码代理优化的设计，并通过冷启动测试和多维度指标验证了其可用性。局限性方面，摘要未提供具体的吞吐量数值、深度相机吞吐量的具体帧率、与封闭形式参考一致性的具体误差数值，也未提及在极复杂多材料交互场景下的计算瓶颈或物理仿真的具体精度局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/物理仿真/多材料模拟\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [NVIDIA/SkillEvaluator](https://github.com/NVIDIA/SkillEvaluator)\n- **今日趋势**: 2,650 stars / 358 forks (今日新增 953 stars)\n- **项目简介**: 一个用于评估AI代理技能和插件的多层框架。\n- **核心价值**: \n  - **项目用途**: 为AI代理的技能和插件提供全面的质量评估与行为影响测量。\n  - **目标人群**: AI开发者、AI代理构建者及研究人员。\n  - **技术核心**: 包含质量门控、语义重叠检测、合成评估数据集生成，以及衡量技能对代理行为影响的实时评估机制。\n  - **与AI/大模型相关**: 是\n\n---\n\n### [google-research/paper-orchestra](https://github.com/google-research/paper-orchestra)\n- **今
