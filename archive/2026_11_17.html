    <h1>前沿科研情报 - 2026-11-17</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. Envisioning Agentic Robotics: A New Era of Robotic Systems（展望智能体机器人：机器人系统的新纪元）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 107 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18359\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18359\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy. Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework, or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore, we identify the principles that carry over from digital to physical agents and the challenges that must be addressed to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively broader responsibility, from executing individual primitives to fulfilling standing roles.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eGPT-6 Astra的发布标志着机器人学中新范式的出现：智能体机器人。在几周内，配备智能体控制装置的前沿模型在许多具身基准测试中匹配或超过了特定任务策略。智能体机器人系统不再为每个任务族训练专用策略，而是将基础模型应用于开放世界具身任务。它在一个闭环中运行：观察环境、解释用户意图、对任务进行推理、调用技能和工具、验证结果并调整其策略。尽管取得了这些进展，社区尚未在共享定义、可靠的评估框架或研究路线图上达成共识。我们认为，由基础模型和具身控制装置共同实现的“具身系统2”构成了智能体机器人的决策核心。其核心挑战是在有限的反应时间、机械限制、不可预测的环境变化和不可逆后果等物理约束下，将通用推理转化为有效且可验证的动作。基于这一视角，我们提出了一个评估框架，用于衡量模型能力和闭环系统性能。此外，我们确定了从数字智能体转移到物理智能体的原则，以及实现可靠物理自主性必须解决的挑战。在“具身系统2”和评估框架的基础上，我们展望了通向持续自主性的研究路线图：以逐渐扩大的责任安全、可靠地执行工作的能力，从执行单个原语到履行固定角色。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出智能体机器人的定义、核心概念（具身系统2）、评估框架以及通向持续自主性的研究路线图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出“具身系统2”作为智能体机器人的决策核心概念。2. 提出衡量模型能力和闭环系统性能的评估框架。3. 识别从数字到物理智能体的迁移原则及实现物理自主性的挑战。4. 提出通向持续自主性的研究路线图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了一种概念框架（具身系统2）和评估框架，并规划了研究路线图。局限性方面，摘要指出社区尚未在共享定义、可靠评估框架或研究路线图上达成共识，且核心挑战在于物理约束（反应时间、机械限制等）下的动作转化。摘要未提供具体的实验结果、数字、数据集或具体的技术实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent（Gamer：用于长视野实时游戏智能体的通用视觉-语言-动作基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 87 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18397\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18397\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning. A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces and complex 3D simulated worlds. We first continue pre-training on a dataset constructed from tens of thousands of hours of device-level keyboard and mouse interaction. These trajectories span simulated games and embodied environments, allowing the model to learn environmental dynamics across both physical and virtual domains. Sparse-thinking instruction tuning then substantially reduces redundant computation while preserving the reasoning needed for complex decisions. We train the policy for long-horizon interaction with a stable multi-turn reinforcement learning method that addresses finite context windows, accumulated rollout errors, and sparse rewards. For real-time interaction, a cloud-edge inference engine serves numerous simulated game environments concurrently, supports unbounded-context execution, and keeps online inference latency low. Across multiple challenging 3D open-world games, Gamer demonstrates solid generalization and operational efficiency comparable to skilled players. It also achieves competitive results on a range of conventional 2D game benchmarks. These results suggest that even repetitive keyboard and mouse trajectories can support substantial gains from scaling data and learning algorithms. Training on these trajectories helps Gamer learn complex skills more steadily in environments with both physical and digital properties. This approach offers a path toward generalist agents that can interact across digital and physical worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们引入了Gamer，一个为复杂交互环境中的长视野任务构建的通用智能体框架。其端到端架构结合了感知、记忆管理和多步推理。共享的训练和部署管道支持与传统的2D图形界面和复杂的3D模拟世界进行交互。我们首先在一个由数万小时设备级键盘和鼠标交互构建的数据集上继续进行预训练。这些轨迹跨越模拟游戏和具身环境，使模型能够学习物理和虚拟领域的环境动态。随后，稀疏思维指令微调大幅减少了冗余计算，同时保留了复杂决策所需的推理能力。我们使用一种稳定的多轮强化学习方法训练长视野交互策略，该方法解决了有限的上下文窗口、累积的展开误差和稀疏奖励问题。为了进行实时交互，云边缘推理引擎同时服务于众多模拟游戏环境，支持无界上下文执行，并保持较低的在线推理延迟。在多个具有挑战性的3D开放世界游戏中，Gamer展示了稳固的泛化能力和与熟练玩家相当的运行效率。它还在一系列传统的2D游戏基准测试中取得了具有竞争力的结果。这些结果表明，即使是重复的键盘和鼠标轨迹也能支持从数据和学习算法扩展中获得实质性收益。在这些轨迹上进行训练有助于Gamer在具有物理和数字属性的环境中更稳定地学习复杂技能。这种方法为能够跨数字和物理世界交互的通用智能体提供了一条路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个用于复杂交互环境中长视野任务的通用智能体框架（Gamer），结合视觉、语言、动作，支持2D和3D环境交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出端到端架构，结合感知、记忆管理和多步推理，支持2D和3D环境。2. 利用数万小时键鼠交互数据进行预训练，并采用稀疏思维指令微调减少冗余计算。3. 提出稳定的多轮强化学习方法解决上下文窗口、累积误差和稀疏奖励问题。4. 设计云边缘推理引擎实现低延迟实时交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了Gamer在3D开放世界游戏和2D游戏基准上的泛化能力和运行效率。局限性方面，摘要提到多轮强化学习需要解决有限上下文窗口、累积展开误差和稀疏奖励问题，且重复的键鼠轨迹可能存在局限，但通过数据扩展获得了收益。摘要未提供具体的基准测试名称、具体的数值指标（如胜率、得分）以及具体的模型参数量等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/游戏智能体/多模态基础模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender（VibePrevisBench：评估Blender中4D场景生成的智能体编码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 83 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.15789\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.15789\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eControllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including scripts, photos, continuations, and reference videos. Each delivery is scored along two evaluation dimensions. Rule-based Scene Check re-runs the code and compares the exported 4D scene with hidden ground truth facts in nine dimensions. VLM-based Screen Check asks a VLM judge whether the facts that pass can be recognized in the proxy video. We analyze the evaluation results and trajectories of 11 frontier coding agents and identify three key observations. First, multimodal understanding separates the agents, especially in understanding space and camera motion. Second, all agents seem to already master basic camera work and staging, and fail at challenging requests. Third, agents inspect their own renders but fail to correct their errors. Agents thus need better visual understanding of space and camera, explicit checks for challenging requests, and item-by-item verification of renders against the brief.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e可控的真实世界视频生成模型可以以渲染的灰盒代理视频为条件，从而固定布局、运动和相机。编码智能体可以通过在Blender中重建4D场景来构建此类视频，但目前还没有基准测试同时检查这些视频及其背后的长篇幅、多镜头场景。我们引入了VibePrevisBench，一个用于4D场景重建的基准测试：智能体将简报转化为可执行的4D场景并渲染其代理视频。其242个任务涵盖四种输入类型，包括脚本、照片、续集和参考视频。每次交付沿两个评估维度进行评分。基于规则的场景检查重新运行代码，并将导出的4D场景与九个维度的隐藏地面真实事实进行比较。基于VLM的屏幕检查要求VLM评判者判断通过的事实是否可以在代理视频中被识别。我们分析了11个前沿编码智能体的评估结果和轨迹，并确定了三个关键观察结果。首先，多模态理解将智能体区分开来，特别是在理解空间和相机运动方面。其次，所有智能体似乎已经掌握了基本的相机工作和场面调度，但在具有挑战性的请求上失败了。第三，智能体检查自己的渲染但未能纠正其错误。因此，智能体需要更好的空间和相机视觉理解、对挑战性请求的显式检查，以及将渲染与简报进行逐项验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出VibePrevisBench基准测试，用于评估编码智能体在Blender中进行4D场景重建和代理视频渲染的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出VibePrevisBench，包含242个任务，涵盖脚本、照片、续集和参考视频四种输入。2. 采用基于规则的场景检查（9个维度）和基于VLM的屏幕检查双重评估维度。3. 评估了11个前沿编码智能体，发现多模态理解（特别是空间和相机运动）是区分智能体的关键。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要分析了11个前沿编码智能体在242个任务上的表现，指出智能体掌握了基本相机工作但在挑战性请求上失败，且无法纠正自身渲染错误。局限性方面，摘要明确指出智能体缺乏对空间和相机的良好视觉理解，缺乏对挑战性请求的显式检查，以及缺乏逐项验证能力。摘要未提供具体的准确率数值、具体智能体名称或具体的失败案例细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成/基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. MIRIX-2.0: Multi-Agent Memory System（MIRIX-2.0：多智能体记忆系统）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 45 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12068\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12068\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLong-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest baseline by 14.3 points, and with AutoDream disabled it gains 31.0 and 22.0 points over HyperMem on single-hop and multi-hop document QA. As procedural memory, it yields the highest mean success among the compared memory methods on ALFWorld and WebShop and reaches 49.2% on MetaClaw-Bench, against 44.0% for MetaClaw\u0026#x27;s skill library. Six typed memory agents keep complete records as the system of record, and a provenance hypergraph indexes episodic and semantic records with n-ary frames that cite their rows. Retrieval runs under explicit budgets, so the evidence a question inspects does not grow with the history. AutoDream merges duplicate anchors outside the write path without rewriting any record, and it distills task sessions into skills. With AutoDream disabled, MIRIX-2.0 answers faster than HyperMem on all five timed benchmarks. It needs no fine-tuning, runs with closed and open models, and its code is public.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e长期记忆使LLM智能体能够个性化、保持一致性并重用以前有效的方法。参数化记忆需要训练，整合可能会永久丢失细节，而保留每条记录会留下一个不断增长的需要搜索的存储库。我们提出了MIRIX-2.0，一个旨在同时兼顾实用性、准确性和高效性的多智能体记忆系统。在五个问答基准中的四个上，它是所比较系统中最准确的。它在LoCoMo上达到91.4%，在LongMemEval-S上达到72.6%，比最强基线领先14.3分，并且在禁用AutoDream的情况下，它在单跳和多跳文档问答上比HyperMem分别高出31.0分和22.0分。作为程序性记忆，它在ALFWorld和WebShop上产生了所比较记忆方法中最高的平均成功率，并在MetaClaw-Bench上达到49.2%，而MetaClaw的技能库为44.0%。六个类型化记忆智能体保留完整记录作为记录系统，并且一个来源超图使用引用其行的n元框架对情景和语义记录进行索引。检索在明确的预算下运行，因此问题检查的证据不会随着历史记录的增长而增长。AutoDream在写入路径之外合并重复的锚点而不重写任何记录，并将任务会话提炼为技能。在禁用AutoDream的情况下，MIRIX-2.0在所有五个计时基准上的回答速度都比HyperMem快。它不需要微调，可与封闭和开放模型一起运行，并且其代码是公开的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出MIRIX-2.0多智能体记忆系统，旨在解决LLM智能体长期记忆中的实用性、准确性和效率问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在5个QA基准中的4个上达到最高准确率（LoCoMo 91.4%，LongMemEval-S 72.6%）。2. 在ALFWorld和WebShop上平均成功率最高，在MetaClaw-Bench上达到49.2%。3. 采用6个类型化记忆智能体和来源超图进行索引，检索在明确预算下运行。4. 提出AutoDream机制合并重复锚点并提炼技能，禁用时回答速度仍快于HyperMem。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的实验结果，证明MIRIX-2.0在多个基准测试（LoCoMo, LongMemEval-S, ALFWorld, WebShop, MetaClaw-Bench）上优于基线（如HyperMem）。局限性方面，摘要提到参数化记忆需要训练、整合会丢失细节、保留所有记录会导致搜索库不断增长，而MIRIX-2.0通过明确预算检索和AutoDream机制缓解了这些问题。摘要未提供具体的模型架构细节、具体的数据集规模或AutoDream合并锚点的具体算法细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/大语言模型智能体/记忆系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. MMFlash: Faster Speculative Decoding for Vision-Language Models（MMFlash：视觉语言模型更快的推测解码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 35 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18482\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18482\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSpeculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that acceptance rates decrease from 46% in the lowest visual-dependence quartile to 22% in the highest, with this disparity persisting after multimodal training. Motivated by this observation, we propose MMFlash, a simple and effective framework that adaptively upweights visually dependent tokens that the drafter predicts poorly. For long video inputs, MMFlash further employs sparse attention to reduce redundant attention computation and improve drafting quality. Across various multimodal benchmarks, MMFlash achieves lossless decoding speedups of up to 3.58times, outperforming EAGLE-3 and DFlash by up to 195.4% and 17.1%, respectively.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e推测解码通过让轻量级起草器提出标记以供目标模型并行验证来加速生成。诸如DFlash之类的扩散起草器在单次前向传播中提出整个标记块，但主要关注纯文本任务，使得多模态起草未被充分探索。为了研究这种设置，我们首先引入了基于有无视觉输入的下一个标记分布之间的KL散度的标记级视觉依赖性度量。我们发现，接受率从视觉依赖性最低四分位数的46%下降到最高四分位数的22%，并且这种差异在多模态训练后依然存在。受这一观察的启发，我们提出了MMFlash，一个简单有效的框架，它自适应地提高起草器预测不佳的视觉依赖标记的权重。对于长视频输入，MMFlash进一步采用稀疏注意力来减少冗余注意力计算并提高起草质量。在各种多模态基准测试中，MMFlash实现了高达3.58倍的无损解码加速，分别比EAGLE-3和DFlash高出195.4%和17.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出MMFlash框架，用于加速视觉语言模型的多模态推测解码，解决多模态起草中视觉依赖标记预测不佳的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入基于KL散度的标记级视觉依赖性度量，发现视觉依赖性高的标记接受率显著降低（从46%降至22%）。2. 提出MMFlash框架，自适应提高起草器预测不佳的视觉依赖标记的权重。3. 针对长视频输入采用稀疏注意力减少冗余计算并提高起草质量。4. 在多模态基准上实现高达3.58倍无损解码加速，显著优于EAGLE-3和DFlash。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的实验数据，证明MMFlash在解码速度上的显著提升（3.58倍加速，比EAGLE-3和DFlash分别高出195.4%和17.1%），并揭示了视觉依赖性对接受率的影响（46%到22%）。局限性方面，摘要指出多模态起草未被充分探索，且扩散起草器主要关注纯文本任务，导致视觉依赖标记的接受率在多模态训练后依然较低。摘要未提供具体的基准测试名称、具体的模型参数量或稀疏注意力的具体实现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/多模态模型/模型加速与推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding（重新思考尖峰：通过步长感知解码缓解多模态扩散语言模型中的幻觉）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 35 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.12901\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.12901\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advancements in multimodal diffusion language models (MDLMs) have exhibited strong global modeling capabilities through iterative refinement. We observe that mask uncertainty follows an overall downward trend during iterative denoising, while a few denoising steps exhibit localized entropy spikes closely associated with hallucinations. We argue that anomalous steps can be identified by measuring the entropy deviation of each denoising step from its neighboring temporal window. We hypothesize that discrete token commitment discards the distributional information at masked positions, limiting the continued interaction between candidate semantics and the context during entropy spikes. With this goal, we present StepRefine, a plug-and-play decoding strategy that leverages semantic context to achieve reliable denoising. The core of our method lies in a step-aware switch between discrete denoising and latent refinement. The model employs probability-weighted embeddings at entropy spike steps to preserve diverse reasoning hypotheses and performs multiple rounds of continuous refinement. Meanwhile, a refinement controller monitors distributional stability to reduce unnecessary loops and switch the model back to standard discrete denoising. Through extensive experiments, StepRefine demonstrates significant hallucination mitigation across different MDLMs on multimodal benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近，多模态扩散语言模型（MDLMs）通过迭代细化展现了强大的全局建模能力。我们观察到，在迭代去噪过程中，掩码不确定性呈现整体下降趋势，而少数去噪步骤表现出与幻觉密切相关的局部熵尖峰。我们认为，可以通过测量每个去噪步骤与其相邻时间窗口的熵偏差来识别异常步骤。我们假设，离散token承诺丢弃了掩码位置的分布信息，限制了在熵尖峰期间候选语义与上下文之间的持续交互。基于这一目标，我们提出了StepRefine，一种即插即用的解码策略，利用语义上下文实现可靠的去噪。我们方法的核心在于离散去噪和潜在细化之间的步长感知切换。模型在熵尖峰步骤采用概率加权嵌入来保留多样化的推理假设，并执行多轮连续细化。同时，细化控制器监控分布稳定性以减少不必要的循环，并将模型切换回标准离散去噪。通过大量实验，StepRefine在不同的MDLMs和多模态基准测试中展示了显著的幻觉缓解效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e缓解多模态扩散语言模型（MDLMs）在迭代去噪过程中产生的幻觉。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现去噪过程中的局部熵尖峰与幻觉密切相关；提出StepRefine即插即用解码策略，通过步长感知切换离散去噪和潜在细化，在熵尖峰步骤使用概率加权嵌入保留推理假设，并通过细化控制器监控分布稳定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了通过监测熵偏差来识别异常步骤的假设，并设计了StepRefine策略。局限性方面，摘要未提供具体的实验数据集名称、具体的性能提升数字以及该方法在其他非多模态基准上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations（V-JEPA-LM：超越静态、文本对齐表示读取动态的视频语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 21 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17831\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17831\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld-model video encoders such as V-JEPA learn how scenes change (direction, speed, order, state) from video alone. To answer questions, they are joined to a language model trained on captions and question-answer pairs. But each caption or question names only a few attributes of a clip, so the model learns to retrieve those attributes rather than to read the clip, and the dynamics the encoder carries go unused: on the same items, a linear probe reads speed from frozen V-JEPA features at 87% while the VLM answers at chance. We show where dynamics lives in a frozen encoder: in a subspace shared across videos for predictive encoders such as V-JEPA, but not as a shared component of frame-wise, text-aligned encoders such as SigLIP. We then build counterfactual supervision that makes the language model read it: pixel transformations turn public videos into answer-balanced variants whose answers are set by the transformation and differ only in the change. Trained in a single stage on 4.53M public samples with 32 visual tokens per frame, where open video LLMs use several stages, 9M to 172M samples and 64 to 256 tokens per frame on average, the resulting V-JEPA-LM models (1B to 8B, Qwen3 and Llama) lead every size class in average score across eleven video benchmarks; our 4B model scores 72.1, against 61.1 for the best open 4B and 64.8 for the best open 8B model. A controlled encoder x supervision study shows that the encoder decides what can be read and the supervision what is read: at a matched budget, counterfactual supervision adds 4.5 points on average and 38 on the speed questions of natural benchmarks. Code and models: https://github.com/kkt94/Llama-V-JEPA-LM.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e诸如V-JEPA等世界模型视频编码器仅从视频中学习场景如何变化（方向、速度、顺序、状态）。为了回答问题，它们与在字幕和问答对上训练的语言模型结合。但是每个字幕或问题仅命名视频片段的少数属性，因此模型学习检索这些属性而不是读取视频片段，编码器携带的动态信息未被使用：在相同项目上，线性探针从冻结的V-JEPA特征中以87%的准确率读取速度，而VLM的回答仅凭猜测。我们展示了动态信息存在于冻结编码器的何处：对于诸如V-JEPA的预测编码器，它存在于跨视频共享的子空间中，但对于诸如SigLIP的逐帧、文本对齐编码器，则不是共享组件。然后我们构建反事实监督使语言模型读取它：像素变换将公共视频转化为答案平衡的变体，其答案由变换设定且仅在变化上有所不同。在单个阶段使用4.53M个公共样本（每帧32个视觉token）进行训练，而开放视频LLM使用多个阶段、9M到172M个样本以及平均每帧64到256个token，生成的V-JEPA-LM模型（1B到8B，Qwen3和Llama）在11个视频基准测试的每个规模类别中平均得分领先；我们的4B模型得分为72.1，而最佳开放4B模型为61.1，最佳开放8B模型为64.8。受控的编码器乘监督研究表明，编码器决定了能读取什么，监督决定了读取什么：在匹配的预算下，反事实监督平均增加4.5分，在自然基准的速度问题上增加38分。代码和模型：https://github.com/kkt94/Llama-V-JEPA-LM。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视频语言模型（VLM）在结合世界模型视频编码器时，未能有效利用编码器中的动态信息（如速度、方向等）来回答问题的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现VLM倾向于检索文本属性而忽略视频动态信息；提出反事实监督机制，通过像素变换生成答案平衡的变体，迫使语言模型读取动态信息；在单阶段、较少数据和较少视觉token下，V-JEPA-LM在11个视频基准上取得同规模最优成绩（4B模型得分72.1）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的实验数据（如4.53M样本，32视觉token，4B模型72.1分等），证明了方法的有效性。局限性方面，摘要未提供模型在特定复杂场景下的失败案例，未详细说明反事实监督中像素变换的具体类型及其对非速度类动态属性（如状态、顺序）的具体提升数字，也未提及推理成本或延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. DySENSE: Dynamic Spatiotemporal ENergy Synthesis and Emulation with Satellite Imagery（DySENSE：结合卫星图像的动态时空能源合成与仿真）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17878\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17878\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCities account for over two-thirds of the world\u0026#x27;s energy and more than 70% of global carbon dioxide emissions. City energy is essential for achieving the 2050 net-zero target and the UN\u0026#x27;s Sustainable Development Goals 7 and 11. Although existing studies have made progress, they are limited by data and methodological gaps. Existing studies are largely predictive for existing cities rather than generative for future cities; fine-grained, aligned monthly dynamic energy data are scarce; and existing GenAI models struggle to generate dynamic urban functional monthly energy. We present DySENSE, a joint multimodal GenAI framework that synthesizes static urban satellite imagery together with spatially aligned, dynamic monthly building energy consumption maps. We decouple long-term static urban morphology from short-term dynamic energy consumption. By conditioning on static urban land use, DySENSE can generate realistic, diverse and new static urban imagery with aligned energy maps. By conditioning on dynamic monthly and climate prompts, DySENSE can jointly generate dynamic, monthly energy consumption maps while keeping the urban morphology static. Experiments across four cities (New York, Washington, Norfolk, Busan) demonstrated that DySENSE can generate annotated high-fidelity synthetic energy data using less than 25% labelled data, boosting downstream prediction performance by 8% mIoU, and achieving strong energy dynamic consistency. Compared to existing methods, DySENSE significantly improved prediction performance (8.7% accuracy) and reduced prediction error (9%-18% CVRMSE, ASHRAE). DySENSE offers an effective foundation for energy-efficient cities, peak-load analysis, building performance simulation and dynamic demand response for city, energy, and building science. The data and code: https://huggingface.co/datasets/skl24/MUSE2 and https://github.com/kailaisun/DySENSE\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e城市消耗了世界上超过三分之二的能源，并产生了全球70%以上的二氧化碳排放。城市能源对于实现2050年净零目标和联合国可持续发展目标7和11至关重要。尽管现有研究取得了进展，但它们受到数据和方法差距的限制。现有研究主要是对现有城市进行预测，而不是对未来城市进行生成；缺乏细粒度、对齐的月度动态能源数据；且现有的GenAI模型难以生成动态的城市功能月度能源。我们提出了DySENSE，一个联合多模态GenAI框架，可合成静态城市卫星图像以及空间对齐的动态月度建筑能源消耗图。我们将长期的静态城市形态与短期的动态能源消耗解耦。通过以静态城市土地利用为条件，DySENSE可以生成逼真的、多样化的新型静态城市图像及对齐的能源图。通过以动态月份和气候提示为条件，DySENSE可以在保持城市形态静态的同时，联合生成动态的月度能源消耗图。在四个城市（纽约、华盛顿、诺福克、釜山）的实验表明，DySENSE可以使用不到25%的标记数据生成带注释的高保真合成能源数据，将下游预测性能提高8% mIoU，并实现强大的能源动态一致性。与现有方法相比，DySENSE显著提高了预测性能（8.7%准确率）并降低了预测误差（9%-18% CVRMSE，ASHRAE）。DySENSE为城市、能源和建筑科学的节能城市、峰值负荷分析、建筑性能仿真和动态需求响应提供了有效的基础。数据和代码：https://huggingface.co/datasets/skl24/MUSE2 和 https://github.com/kailaisun/DySENSE\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决现有城市能源研究中缺乏细粒度动态数据、难以生成未来城市动态月度能源消耗图的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出DySENSE联合多模态GenAI框架，解耦长期静态城市形态与短期动态能源消耗；通过条件生成实现静态图像与动态能源图的联合合成；在四个城市的实验中，使用不到25%的标记数据即可生成高保真合成数据，提升下游预测性能8% mIoU，准确率提升8.7%，误差降低9%-18% CVRMSE。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了具体的实验城市（纽约等）和明确的性能提升数字（8% mIoU, 8.7% accuracy, 9%-18% CVRMSE）。局限性方面，摘要未提供该框架在生成极端气候或特殊城市形态下的表现，未说明生成单张或单月数据的具体计算成本，也未提及模型在未见过的第五个城市上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能应用 / 城市计算与能源\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. Loopback Transformer: Towards a Unified View of Residual Looped Transformers（Loopback Transformer：迈向残差循环Transformer的统一视角）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.07226\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.07226\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped Transformers reduce parameter count by repeatedly applying shared blocks, but parameter sharing alone does not determine how the results of repeated computation are reused. We take the depth-memory view of residual connections and analyze which representation is stored after each block application and how later reads weight it. A full block output contains both its input and its new update, so weighting that output also reweights the history already carried by the input. Reading individual updates instead, with the shared stack\u0026#x27;s input kept on a separate path, gives separate controls over input strength, total update weight, and allocation across updates. The Loopback Transformer implements these controls: geometric decay sets the total update weight and supplies a recency prior, and attention learns how to allocate that weight. On ClimbMix, Loopback reaches lower validation loss than standard Transformer baselines with 40-75% of their Transformer parameters (excluding token embeddings and the output head) at reference scales from 191M to 3B, with training tokens and executed depth matched. It also has higher mean accuracy over thirteen downstream tasks at 1.4B and 3B. At 191M, 374M, and 778M, it has the lowest validation loss and the highest thirteen-task mean among the standard Transformer and seven looped residual designs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer通过重复应用共享块来减少参数数量，但仅靠参数共享并不能决定重复计算的结果如何被重用。我们采用残差连接的深度-内存视角，分析在每次块应用后存储了哪种表示，以及后续读取如何对其进行加权。完整的块输出包含其输入及其新更新，因此对该输出进行加权也会重新加权输入已携带的历史。相反，读取单个更新，并将共享堆栈的输入保持在单独的路径上，可以对输入强度、总更新权重以及跨更新的分配进行单独控制。Loopback Transformer实现了这些控制：几何衰减设置总更新权重并提供近期先验，注意力机制学习如何分配该权重。在ClimbMix上，Loopback在191M到3B的参考规模下，使用标准Transformer基线40-75%的参数（不包括token嵌入和输出头），在匹配训练token和执行深度的情况下，达到了更低的验证损失。它在1.4B和3B规模下的13个下游任务中也具有更高的平均准确率。在191M、374M和778M规模下，它在标准Transformer和七种循环残差设计中具有最低的验证损失和最高的13任务平均值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e优化循环Transformer中重复计算结果的重用机制，通过控制输入强度、更新权重和分配来降低参数量并提升模型性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e从深度-内存视角分析残差连接，提出Loopback Transformer，通过独立路径控制输入和更新权重；使用几何衰减设置总更新权重并结合注意力机制分配权重；在ClimbMix上，使用40-75%的参数达到更低的验证损失，并在1.4B和3B规模下13个下游任务平均准确率更高。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了明确的参数比例（40-75%）、模型规模（191M到3B）以及对比基线（标准Transformer和七种循环残差设计）。局限性方面，摘要未提供13个下游任务的具体名称和各自准确率提升的数字，未说明几何衰减超参数的敏感性分析，也未提及该方法在更大规模（如超过3B）或更长上下文下的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大模型架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. G-CAST: Governed Continual Self-Training for E-Commerce Agents under Evolving Demands（G-CAST：需求不断演变下的电商智能体受治理持续自训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17814\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17814\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWith the rapid advancement of Large Language Models (LLMs), an increasing number of users are turning to LLM-powered agents for conversational shopping in e-commerce. However, the user needs continue to change as new product categories, procurement scenarios, and feature requests emerge. At the same time, the product\u0026#x27;s execution harness-including its tools, skills, and operating procedures-continues to evolve to support increasingly sophisticated interactions. These changes create two practical challenges: 1) Demand drift alters the distribution, intent, and complexity of user requests, causing a model trained once to fall behind; 2) Harness evolution requires the model to use newly introduced capabilities correctly without losing behavior that users already rely on. Periodic manual retraining is too delayed and labor-intensive for this setting. To address these challenges, we present G-CAST, a governed continual self-training system that converts daily production evidence under evolving demand and capability contracts into reward-routed, entropy-prioritized training data and governed reward evolution. Governed checkpoint transition under cumulative evaluation controls each model update, enabling the agent to learn newly introduced behaviors without sacrificing previously accepted capabilities. Experiments on a real production e-commerce agent show that G-CAST achieves stronger adaptation to newly introduced demand while better preserving previously accepted behavior compared with a strong autonomous post-training baseline. Ablations further show that both reward-routed, entropy-prioritized data orchestration and governed reward evolution are important to these gains. G-CAST is now deployed in Yuancai(http://cai.1688.com/), a B2B procurement agent on Alibaba\u0026#x27;s 1688 platform.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e随着大型语言模型（LLMs）的快速发展，越来越多的用户转向由LLM驱动的智能体进行电商对话购物。然而，随着新产品类别、采购场景和功能请求的出现，用户需求不断变化。同时，产品的执行工具——包括其工具、技能和操作程序——也在不断发展以支持日益复杂的交互。这些变化带来了两个实际挑战：1）需求漂移改变了用户请求的分布、意图和复杂性，导致仅训练一次的模型落后；2）工具演进要求模型正确使用新引入的功能，同时不丢失用户已经依赖的行为。定期的手动重新训练对于这种环境来说太滞后且耗费人力。为了应对这些挑战，我们提出了G-CAST，一个受治理的持续自训练系统，它将不断演变的需求和能力契约下的日常生产证据转化为奖励路由、熵优先的训练数据和受治理的奖励演进。在累积评估下的受治理检查点转换控制每次模型更新，使智能体能够学习新引入的行为而不牺牲先前被接受的能力。在真实生产电商智能体上的实验表明，与强大的自主后训练基线相比，G-CAST实现了对新引入需求的更强适应性，同时更好地保留了先前被接受的行为。消融实验进一步表明，奖励路由、熵优先的数据编排和受治理的奖励演进对这些收益都很重要。G-CAST现已部署在阿里巴巴1688平台上的B2B采购智能体元采（http://cai.1688.com/）中。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决电商对话购物智能体在面对用户需求漂移和执行工具演进时，一次性训练模型落后以及手动重训成本高的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出G-CAST受治理持续自训练系统，将日常生产证据转化为奖励路由和熵优先的训练数据；通过受治理的检查点转换控制模型更新，在学习新行为的同时保留旧能力；在真实生产电商智能体上优于自主后训练基线，并已部署于阿里1688平台的元采智能体。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了实际应用场景（阿里1688元采）和解决的痛点（需求漂移、工具演进）。局限性方面，摘要未提供具体的定量评估指标（如准确率提升百分比、具体保留了多少旧能力等），未说明累积评估的具体指标和阈值设定，也未提及该系统在处理极端长尾需求或全新未知工具时的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能应用 / 智能体与推荐系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. Mobile AI Factory: Building Specialized Language Models for Your Mobile Device（移动AI工厂：为你的移动设备构建专用语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.13509\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.13509\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSmall language models (SLMs) running on mobile devices can keep user data private and work without connectivity. But they perform well only when fine-tuned for the target task and sized for the target device, a process that today requires repeated expert tuning. We present {\\it Mobile AI Factory}, an agentic system that builds a fine-tuned, quantized SLM for a given task and phone. Given a task specification and a target phone, an orchestrator LLM chooses whether to tune hyperparameters, mine real data, or generate synthetic examples, while fixed rules roll back changes that hurt accuracy. The factory searches from small to large models across base models and quantizations, adapts its accuracy goal as it searches, and uses real measurements of the target phone across inference engines and backends. We evaluate Mobile AI Factory on ten tasks and four Android phones. On an unseen testset, its on-device models outperform two five-shot frontier models on five tasks, by up to 0.34, and match them on three more. Its search comes within 0.03 of exhaustively training all 27 model variants on an entity extraction task, while using 19times less GPU time. Phone measurements also matter: the best configuration changes across phones. Without phone measurements, Claude Opus 5.5, given the full hardware and model specifications, misses the app\u0026#x27;s requirements in 25\\% of easy and moderate cases and in 60\\% of hard ones. Code is available at: https://github.com/evanly-gh/SLM_Factory.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在移动设备上运行的小型语言模型（SLM）可以保护用户数据隐私并在无网络连接的情况下工作。但它们只有在针对目标任务进行微调并针对目标设备调整大小时才能表现良好，而这一过程今天需要反复的专家调优。我们提出了Mobile AI Factory，一个代理系统，为给定任务和手机构建微调、量化的SLM。给定任务规范和目标手机，编排LLM选择是否调优超参数、挖掘真实数据或生成合成示例，同时固定规则回滚损害准确性的更改。该工厂在基础模型和量化之间从小型到大型模型进行搜索，在搜索时调整其准确性目标，并使用目标手机在推理引擎和后端的真实测量数据。我们在十个任务和四款Android手机上评估了Mobile AI Factory。在未见的测试集上，其设备端模型在五个任务上超越了两个五样本前沿模型，最高超出0.34，并在另外三个任务上与它们持平。在实体提取任务上，其搜索在穷举训练所有27个模型变体的0.03以内，同时使用的GPU时间减少了19倍。手机测量数据也很重要：最佳配置在不同手机之间发生变化。如果没有手机测量数据，Claude Opus 5.5在获得完整的硬件和模型规格的情况下，在25%的简单和中等情况以及60%的困难情况下未能满足应用程序的要求。代码可在：https://github.com/evanly-gh/SLM_Factory 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e为特定任务和移动设备自动构建微调且量化的小型语言模型（SLM）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了一个代理系统Mobile AI Factory，能自动搜索模型、量化和超参数；利用目标手机的实际测量数据进行搜索；在10个任务和4款手机上评估，设备端模型在5个任务上超越前沿模型，搜索效率比穷举训练高19倍；证明了手机实际测量数据的重要性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在10个任务和4款Android手机上的评估结果，包括与前沿模型的对比（5个任务超越最高0.34，3个任务持平），以及与穷举训练的对比（差距0.03，GPU时间减少19倍）。同时指出了无手机测量数据时Claude Opus 5.5的失败率（简单/中等25%，困难60%）。关于系统在其他操作系统上的表现、长期稳定性及具体任务失败原因，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e移动计算与小型语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. MEM-SQL: Memory-Empowered Text-to-SQL（MEM-SQL：记忆赋能的文本到SQL）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18338\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18338\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eText-to-SQL systems translate natural language questions into SQL queries over increasingly complex databases. However, widely used benchmarks evaluate questions independently, overlooking settings where earlier queries over the same database can supply joins or calculations for a new question. We introduce HARE (History-AwaRe Text-to-SQL BEnchmark) to measure the accuracy and cost of adapting historical SQL. HARE comprises 1,600 requests derived from a fixed pool of 823 verified queries across four datasets. Annotations record which components each request preserves and which edits it requires, distinguishing whole-query adaptation from partial reuse. Our method, MEM-SQL (Memory-EMpowered Text-to-SQL), stores whole-query templates, reusable SQL blocks, and mappings from domain concepts to schema elements. MEM-SQL uses a layer only if every requirement assigned to it has a match above that layer\u0026#x27;s threshold. With On-demand Schema Linking (OSL), MEM-SQL consults the schema only when no layer qualifies or the generator judges retrieved evidence insufficient. Across six language models on HARE, mean execution accuracy rises from 37.1% for Direct Generation without history to 50.0% for MEM-SQL, with 76.6% fewer input tokens and 68.8% lower latency on average. Further analysis shows that requests reusing several verified queries remain a bottleneck, with accuracy falling from 56.7% to 29.7%, most sharply when reused components must be placed in a new query structure or combined with a shared join. Applying OSL to three other memory designs consistently reduces generation cost, while its accuracy benefit depends on the memory design. Verified history can thus make generation both more accurate and cheaper, but its value depends on the evidence retained and when the system consults the schema.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e文本到SQL系统将自然语言问题转化为针对日益复杂的数据库的SQL查询。然而，广泛使用的基准测试独立评估问题，忽略了同一数据库上的早期查询可以为新问题提供连接或计算的设置。我们引入了HARE（历史感知文本到SQL基准）来衡量调整历史SQL的准确性和成本。HARE包含1,600个请求，源自四个数据集中823个经过验证的查询的固定池。注释记录了每个请求保留了哪些组件以及需要哪些编辑，区分了整查询调整与部分重用。我们的方法MEM-SQL（记忆赋能文本到SQL）存储整查询模板、可重用的SQL块以及从领域概念到模式元素的映射。MEM-SQL仅当分配给它的每个要求都有高于该层阈值的匹配时才使用该层。借助按需模式链接（OSL），MEM-SQL仅在没有层符合条件或生成器判断检索到的证据不足时才查询模式。在HARE上的六个语言模型中，平均执行准确率从没有历史的直接生成的37.1%上升到MEM-SQL的50.0%，输入token平均减少76.6%，延迟平均降低68.8%。进一步分析表明，重用多个已验证查询的请求仍然是一个瓶颈，准确率从56.7%下降到29.7%，当重用的组件必须放置在新的查询结构中或与共享连接结合时下降最为明显。将OSL应用于其他三种记忆设计一致地降低了生成成本，而其准确性收益取决于记忆设计。因此，经过验证的历史可以使生成更准确且更便宜，但其价值取决于保留的证据以及系统何时查询模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用历史SQL查询信息提高文本到SQL（Text-to-SQL）系统的准确性和效率，并评估历史适应的准确性与成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了HARE基准测试，包含1600个请求以评估历史SQL的适应；提出了MEM-SQL方法，存储查询模板、可重用SQL块和概念映射，并结合按需模式链接（OSL）；在6个语言模型上，平均执行准确率从37.1%提升至50.0%，输入token减少76.6%，延迟降低68.8%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在HARE基准上6个语言模型的评估结果，准确率提升及成本降低的具体数字。同时指出了重用多个已验证查询时的准确率下降瓶颈（从56.7%降至29.7%）。关于更复杂数据库模式下的泛化能力、OSL在不同记忆设计下准确性收益的具体差异数据，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e数据库与自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. JVT: Just Video Transformer makes pixel-space video diffusion simple（JVT：纯粹的Video Transformer让像素空间视频扩散变得简单）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18549\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18549\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDirect diffusion modeling of high-dimensional raw video data is challenging, and existing pixel-space methods often rely on specialized architectures. We introduce JVT (Just Video Transformer), a simple large-patch DiT-style Transformer for pixel-space video diffusion, without a pretrained autoencoder, auxiliary detailers, cascaded stages, or U-Net-style skip connections. We systematically examine video patch embeddings, register tokens, and adaptive layer normalization to identify design choices that balance generation quality and computational efficiency. The resulting JVT design achieves generation quality competitive with latent diffusion baselines in both class-conditioned and unconditional settings. The pixel-space formulation of JVT also naturally supports joint generation of pixel-aligned modalities. We demonstrate this capability through camera-conditioned RGB-disparity generation, which improves camera following relative to RGB-only baselines and yields explicit scene geometry without an additional reconstruction model at inference. These results highlight the potential of simple DiT-style Transformers for pixel-space video diffusion, and we hope our findings offer useful insights and practical guidance for future research.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e对高维原始视频数据进行直接扩散建模具有挑战性，现有的像素空间方法通常依赖于专门的架构。我们引入了JVT（Just Video Transformer），一种用于像素空间视频扩散的简单大补丁DiT风格Transformer，无需预训练自编码器、辅助细节器、级联阶段或U-Net风格的跳跃连接。我们系统地检查了视频补丁嵌入、寄存器令牌和自适应层归一化，以确定平衡生成质量和计算效率的设计选择。最终的JVT设计在类条件和无条件设置中均实现了与潜在扩散基线相当的生成质量。JVT的像素空间公式还自然支持像素对齐模态的联合生成。我们通过相机条件RGB-视差生成展示了这一能力，与仅RGB基线相比，它改善了相机跟随，并在推理时无需额外的重建模型即可产生明确的场景几何。这些结果突出了简单DiT风格Transformer在像素空间视频扩散中的潜力，我们希望我们的发现能为未来的研究提供有用的见解和实践指导。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在像素空间中直接进行视频扩散建模，无需复杂的辅助架构，实现高质量且计算高效的视频生成及像素对齐模态的联合生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了JVT，一种无需预训练自编码器、辅助细节器、级联阶段或跳跃连接的简单大补丁DiT风格Transformer；系统评估了补丁嵌入、寄存器令牌和自适应层归一化；在类条件和无条件设置下生成质量与潜在扩散基线相当；支持相机条件RGB-视差联合生成，改善相机跟随并直接输出场景几何。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要说明了JVT在类条件和无条件设置下与潜在扩散基线具有竞争力的生成质量，以及在相机条件RGB-视差生成中的能力。关于具体的定量评估指标数值、与其他最先进像素空间方法的详细对比数据、以及训练和推理的具体计算资源消耗，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. Aligning AI Teams（对齐AI团队）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17820\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17820\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePrevious work has shown that alignment training on individual LLM agents can fail to transfer to multi-agent settings. We investigate the underlying mechanisms for this failure, and explore interventions to preserve alignment transfer to multi-agent LLM teams. We focus on two software-engineering tasks (sepsis triage, a news recommender) and ten consulting-proposal generation tasks. We present four findings: (1) The single-vs-team safety gap does not show a clear trend with more capable models. We find that Anthropic\u0026#x27;s Mythos Preview shows the largest gap on one of our tasks but the smallest on another; (2) Many natural interventions, such as having agents critique each other\u0026#x27;s work or coordinate in a group chat, do not reliably bring agent teams back to single-agent alignment behavior; (3) diffusion of responsibility substantially accounts for the safety gap: agents in teams are less likely to proactively check for system-level safety failures and more likely to ignore, rationalize, or deflect responsibility for issues when they arise; (4) having a designated safety lead agent ensure system-level safety, and having a coordinator agent publish a safety specifications document are effective at restoring single-agent alignment. We also release magelab, a multi-agent LLM orchestration and experimentation framework. Our findings can help practitioners design agent teams that successfully preserve the behaviors expected of aligned individual agents.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e先前的工作表明，对单个LLM代理的对齐训练可能无法转移到多代理设置中。我们调查了这种失败的潜在机制，并探索了保留对齐转移到多代理LLM团队的干预措施。我们专注于两个软件工程任务（败血症分诊、新闻推荐器）和十个咨询提案生成任务。我们提出四个发现：（1）单个与团队的安全差距并未随着模型能力的增强而显示出明确的趋势。我们发现Anthropic的Mythos Preview在我们的一个任务中显示出最大的差距，但在另一个任务中差距最小；（2）许多自然的干预措施，例如让代理相互批评他们的工作或在群聊中协调，并不能可靠地将代理团队带回单代理对齐行为；（3）责任分散在很大程度上解释了安全差距：团队中的代理不太可能主动检查系统级的安全故障，并且在问题出现时更可能忽略、合理化或推卸责任；（4）指定一个安全主管代理确保系统级安全，并让协调代理发布安全规范文档，在恢复单代理对齐方面是有效的。我们还发布了magelab，一个多代理LLM编排和实验框架。我们的发现可以帮助从业者设计能够成功保留对齐个体代理预期行为的代理团队。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e调查单个LLM代理的对齐训练在多代理设置中失效的潜在机制，并探索保留对齐转移到多代理LLM团队的干预措施。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现单代理与团队的安全差距不随模型能力增强呈现明确趋势；发现责任分散是导致安全差距的重要原因；发现自然的干预措施（如相互批评或群聊协调）无法可靠恢复单代理对齐行为；发现指定安全主管代理和发布安全规范文档能有效恢复单代理对齐；发布了magelab多代理编排框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了在2个软件工程任务和10个咨询提案生成任务上的四个主要发现，包括模型能力与安全差距的趋势、自然干预的无效性、责任分散机制以及特定干预措施（安全主管、规范文档）的有效性。关于具体的定量安全指标数据、干预措施在不同规模团队中的效果对比、以及magelab框架的具体性能基准，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能安全与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs（GH-AWTrace：GitHub代理工作流执行日志的大规模数据集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 12 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.06866\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.06866\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verified GitHub Agentic Workflows across 5,051 repositories to 4,112,526 run records and 562,877 nonempty execution log archives. The dataset preserves execution evidence subject to GitHub\u0026#x27;s log-retention limits and links it to repository metadata and generated workflow configurations. Illustrative cases show how the logs expose tool denials, provider failures, changes in an agent\u0026#x27;s approach, and delegation among agents. These observations enable research on execution failures, tool use, and the relationship between reported run outcomes and visible task progress. Coverage varies across workflows, and the logs provide partial observations rather than complete agent trajectories. Video: https://youtu.be/KIlfmZhHxtA\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代理工作流使AI代理能够按计划或响应存储库事件执行重复的存储库任务。现有研究检查了工作流定义和输出，但对执行期间发生的情况提供的证据有限。我们提出了GH-AWTrace，一个将5,051个存储库中的25,014个经过验证的GitHub代理工作流链接到4,112,526条运行记录和562,877个非空执行日志存档的数据集。该数据集在GitHub的日志保留限制下保留了执行证据，并将其链接到存储库元数据和生成的工作流配置。说明性案例展示了日志如何暴露工具拒绝、提供商故障、代理方法的改变以及代理之间的委托。这些观察结果使得对执行失败、工具使用以及报告的运行结果与可见任务进度之间关系的研究成为可能。工作流之间的覆盖率各不相同，并且日志提供的是部分观察而不是完整的代理轨迹。视频：https://youtu.be/KIlfmZhHxtA\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提供一个大规模数据集，用于记录和分析GitHub代理工作流在执行期间的实际行为、失败和工具使用情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了GH-AWTrace数据集，包含5051个仓库中的25014个验证过的GitHub代理工作流，链接了4112526条运行记录和562877个非空执行日志存档；展示了日志如何暴露工具拒绝、提供商故障、方法改变和代理间委托；支持对执行失败、工具使用及运行结果与任务进度关系的研究。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了数据集的具体规模（25,014个工作流，5,051个仓库，4,112,526条运行记录，562,877个日志存档），并说明了其支持的分析和说明性案例。摘要明确指出工作流之间的覆盖率各不相同，且日志提供的是部分观察而非完整的代理轨迹，同时受限于GitHub的日志保留限制，关于完整代理轨迹的获取方法及覆盖率提升策略，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程与数据集\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. WebArena-Pro: A Heterogeneous, Multimodal, Reproducible Benchmark for Web Agents（WebArena-Pro：面向Web智能体的异构、多模态、可复现基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17955\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17955\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWeb agents powered by large language and vision-language models are increasingly applied to realistic browser work that spans heterogeneous applications, multimodal content, and stateful workflows. However, existing reproducible web-agent benchmarks cover only a small number of web applications drawn from a few software categories, and restrict modality to text and vision. Live benchmarks broaden site coverage but sacrifice reproducibility, since pages and data drift between runs. Moreover, existing benchmarks do not meaningfully evaluate whether agents can understand and use audio and video content embedded within web tasks. To address these gaps, we introduce WebArena-Pro, a benchmark comprising 300 tasks across 20 self-hosted web applications in six domain categories, spanning distinct interface conventions, workflows, and data models. Across the evaluated agents, the best performance is achieved by both Codex with GPT 6.1 Sol and Claude Code with Claude Opus 5.5 at 62.3%, followed by OpenCode with Kimi 3.1 Pro at 60.7%. The strongest GenericAgent configurations, Gemini 3.1 Pro omni and Gemma4 31B, both achieve 30.3%. Among reproducible, human-curated web agent benchmarks, WebArena-Pro provides the broadest application coverage and the most comprehensive multimodal support to date. The benchmark treats audio and video as core observations alongside text and vision, with dedicated actions for extracting information from each. WebArena-Pro runs each task in isolation and supports reproducible, parallel evaluation. Tasks are authored through a dedicated annotator interface, filtered by LLM-assisted triage, and finally validated by humans before release. Project page: https://webarena-pro.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e由大型语言和视觉语言模型驱动的Web智能体正越来越多地应用于跨越异构应用程序、多模态内容和有状态工作流的真实浏览器工作。然而，现有的可复现Web智能体基准仅涵盖从少数软件类别中提取的少量Web应用程序，并将模态限制为文本和视觉。实时基准扩大了站点覆盖范围，但牺牲了可复现性，因为页面和数据在运行之间会发生漂移。此外，现有基准没有有意义地评估智能体是否能够理解和使用嵌入在Web任务中的音频和视频内容。为了解决这些差距，我们引入了WebArena-Pro，这是一个包含300个任务的基准，跨越6个领域类别的20个自托管Web应用程序，涵盖不同的界面约定、工作流和数据模型。在评估的智能体中，Codex与GPT 6.1 Sol以及Claude Code与Claude Opus 5.5均取得了最佳性能，达到62.3%，其次是OpenCode与Kimi 3.1 Pro，达到60.7%。最强的GenericAgent配置，Gemini 3.1 Pro omni和Gemma4 31B，均达到30.3%。在可复现、人工策划的Web智能体基准中，WebArena-Pro提供了迄今为止最广泛的应用覆盖率和最全面的多模态支持。该基准将音频和视频与文本和视觉一起视为核心观察，并具有用于从每个模态中提取信息的专用动作。WebArena-Pro在隔离状态下运行每个任务，并支持可复现的并行评估。任务通过专用的注释界面编写，由LLM辅助分类进行过滤，并在发布前由人类最终验证。项目主页：https://webarena-pro.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个异构、多模态、可复现的Web智能体基准测试（WebArena-Pro），以评估智能体在跨越多种应用、多模态内容和有状态工作流的真实浏览器任务中的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 包含300个任务，涵盖6个领域的20个自托管Web应用，提供广泛的覆盖率和多模态支持（包括音频和视频）。2. 任务在隔离环境中运行，支持可复现的并行评估。3. 任务通过专用界面编写，经LLM辅助过滤和人工验证。4. 评估结果显示Codex+GPT 6.1 Sol和Claude Code+Claude Opus 5.5表现最佳（62.3%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出WebArena-Pro解决了现有基准在应用覆盖率、多模态支持（特别是音视频）和可复现性方面的不足。局限性方面，摘要未提供关于该基准的具体局限性分析，仅说明了其构建方法和评估结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自然语言处理/智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Evidence-Governed Adoption of Self-Generated Updates in Autonomous AI Agents（自主AI智能体中自生成更新的证据治理采纳）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16378\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16378\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutonomous agents modify prompts, memories, tools, workflows, and policies using interaction histories. Yet a plausible modification is not necessarily suitable for persistent adoption: candidate selection is adaptive, evaluators may be imperfect, and local gains can hide degradation against an earlier baseline. We introduce Evidence-Governed Evolution (EGE), a framework for governing adoption of self-generated agent modifications. EGE separates candidate generation from confirmatory adoption, evaluates frozen candidates on fresh paired audits, requires meaningful improvement on a prespecified primary objective, protects declared capabilities through reference-relative non-inferiority tests, and applies governance constraints before bounded canary deployment. We establish an evaluator-calibrated simultaneous lower-bound construction for a countable sequence of adaptively generated candidates. It combines candidate-wise Hoeffding bounds with independent calibration samples comparing the operational evaluator with a prespecified reference procedure. We also formalise reference replacement through bridge tests, derive a cumulative degradation bound along a versioned reference lineage, and provide an audit-planning condition relating effect-size margin, sample sizes, and acceptance probability. A Monte Carlo stress test illustrates calibration under candidate-dependent evaluator optimism; it is a stylised statistical experiment, not an evaluation of a deployed agent. The guarantees are conditional on bounded paired scores, fresh sampling, a valid reference-evaluation construct, and declared evaluation distributions; they do not establish universal agent safety or robustness to arbitrary distribution shift.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自主智能体利用交互历史修改提示、记忆、工具、工作流和策略。然而，合理的修改不一定适合持久采纳：候选选择是自适应的，评估器可能不完美，局部收益可能掩盖了相对于早期基线的退化。我们引入了证据治理演化（EGE），一个用于治理自生成智能体修改采纳的框架。EGE将候选生成与确认性采纳分离，在新鲜的配对审计上评估冻结的候选，要求在预先指定的主要目标上取得有意义的改进，通过相对于参考的非劣效性测试保护声明的能力，并在有界的金丝雀部署之前应用治理约束。我们为可数序列的自适应生成候选建立了评估器校准的同时下界构造。它将候选级的Hoeffding界与独立校准样本相结合，以比较操作评估器与预先指定的参考程序。我们还通过桥接测试形式化了参考替换，推导了沿版本化参考谱系的累积退化界，并提供了关联效应量边际、样本大小和接受概率的审计规划条件。蒙特卡洛压力测试说明了在候选依赖的评估器乐观情况下的校准；这是一个风格化的统计实验，而不是对部署智能体的评估。这些保证以有界的配对分数、新鲜采样、有效的参考评估构造和声明的评估分布为条件；它们没有建立通用的智能体安全性或对任意分布偏移的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出证据治理演化（EGE）框架，用于治理自主AI智能体中自生成修改（如提示、记忆、工具等）的持久采纳，防止局部收益掩盖相对于基线的退化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出EGE框架，分离候选生成与确认性采纳，并在新鲜配对审计上评估。2. 建立评估器校准的同时下界构造，结合Hoeffding界与独立校准样本。3. 形式化参考替换，推导累积退化界，并提供审计规划条件。4. 通过蒙特卡洛压力测试说明了评估器乐观情况下的校准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明EGE框架通过严格的统计和评估约束来管理智能体的自我修改，确保改进的真实性和能力的保持。局限性方面，摘要明确指出这些保证是有条件的（依赖于有界配对分数、新鲜采样等），且没有建立通用的智能体安全性或对任意分布偏移的鲁棒性；此外，蒙特卡洛测试仅为风格化统计实验，非真实部署智能体的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/自主智能体/机器学习理论\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. Continual-ARC: Measuring Skill Acquisition over a Working Lifetime（Continual-ARC：衡量工作生命周期中的技能获取）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14505\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14505\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgent harnesses have emerged as a promising mechanism for continual learning, alongside test-time parametric learning. However, the current benchmarks have several limitations: they generally focus on a single applied domain, serve each instance only once, and assume a single family of learner, so memory-based and weight-based systems are rarely compared on the same scale. We propose Continual-ARC, a lifelong stream built from the three ARC-AGI editions, whose tasks need no domain knowledge. The same tasks return after dormant gaps with fresh instances, while new tasks keep arriving. On each instance, the learner may pay for demonstrations, submit answers, or act inside the harness, with retries permitted on incorrect submissions, which are paid for. Each instance is scored based on the share of this feedback budget consumed. Since a learner may keep anything between instances, memory-based and weight-based systems are scored on the same scale. After the stream, the learner is frozen and tested on fresh instances of the tasks it met, which measures memorization, and on unseen tasks, which measures generalization. We run an agent harness with frozen weights, with and without persistence, on Qwen3.5-9B and GLM-5.3 Flash, comparing them with two prompting floors, a program-induction method and Qwen3.5-9B\u0026#x27;s weights trained to imitate GLM-5.3 Flash. Persistence in the harness generally does not improve memorization unless provided with explicit expert guidance. Most harness-based methods still learn less than a floor that simply caches each task\u0026#x27;s demonstrations, across all models we tested. No harness-based method gains on unseen tasks, whereas weight-based learning shows substantial gains. This opens the door to future weight-based continual learning that could teach models to drive harnesses in new domains.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体工具（Agent harnesses）已成为持续学习的一种有前途的机制，与测试时参数学习并列。然而，当前的基准测试有几个局限性：它们通常专注于单一应用领域，每个实例仅服务一次，并假设单一的学习者家族，因此基于记忆和基于权重的系统很少在同一尺度上进行比较。我们提出了Continual-ARC，一个由三个ARC-AGI版本构建的终身流，其任务不需要领域知识。相同的任务在休眠间隔后带着新实例返回，同时新任务不断到达。在每个实例上，学习者可以付费获取演示、提交答案或在工具内行动，允许对错误提交进行重试（需付费）。每个实例根据消耗的反馈预算份额进行评分。由于学习者在实例之间可以保留任何内容，基于记忆和基于权重的系统在同一尺度上进行评分。在流结束后，学习者被冻结并在其遇到的任务的新实例上进行测试（衡量记忆），以及在未见任务上进行测试（衡量泛化）。我们在Qwen3.5-9B和GLM-5.3 Flash上运行带有冻结权重的智能体工具（有和没有持久性），将它们与两个提示基线、一种程序归纳方法以及模仿GLM-5.3 Flash训练的Qwen3.5-9B权重进行比较。工具中的持久性通常不会改善记忆，除非提供明确的专家指导。在我们测试的所有模型中，大多数基于工具的方法学习的内容仍少于简单地缓存每个任务演示的基线。没有基于工具的方法在未见任务上取得收益，而基于权重的学习显示出实质性收益。这为未来基于权重的持续学习打开了大门，可以教模型在新领域中驱动工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出Continual-ARC基准，用于衡量智能体在工作生命周期（终身流）中的技能获取，并在同一尺度上比较基于记忆和基于权重的持续学习系统。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 构建由三个ARC-AGI版本组成的终身任务流，任务无需领域知识，且包含休眠间隔和新任务。2. 引入基于反馈预算消耗的评分机制，允许在同一尺度上比较基于记忆和基于权重的系统。3. 评估了多种模型和方法（如Qwen3.5-9B, GLM-5.3 Flash等）在记忆和泛化任务上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明实验发现工具中的持久性通常不能改善记忆（除非有专家指导），且大多数基于工具的方法表现不如简单的演示缓存基线；基于工具的方法在未见任务上无收益，而基于权重的学习有实质性收益。局限性方面，摘要指出当前基准通常专注单一领域、单实例服务和单一学习者家族，Continual-ARC旨在解决这些问题，但摘要未提供Continual-ARC本身的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/持续学习/基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means（eDIAR：通过e-means实现无需训练的长会议和大型档案开放说话人流式说话人日志）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18529\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18529\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMeetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online, but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational corpora are prepared, and it reaches the clustering quality of Lloyd\u0026#x27;s k-means several times faster. The method needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e会议长达一小时，事先没有人知道会有多少人发言。具有固定数量输出槽的神经日志系统（如Streaming Sortformer和Nemotron-3）准确且在线运行，但它们命名的说话人数量不能超过其槽数。我们在不重新训练的情况下去除了这一限制。槽头继续决定谁在活跃以及语音何时重叠，并且仅在每个槽都被使用后，才在单个槽内使用官方e-means算法对说话人嵌入进行聚类。在流式系统中，重新聚类限制在有界窗口内，标签在几秒钟内被修订，身份锚定在头的槽上。所得系统对说话人数量没有限制，并且在说话人多于槽数时保持准确，而固定槽模型会崩溃。在长达一小时的会议中，它比累积错误的Streaming Sortformer准确得多，且其每次更新的成本不随会议增长。相同的配方将四槽Streaming Sortformer转变为开放说话人系统。跨录音，e-means使得逐帧链接大型档案的说话人变得负担得起，这是在准备对话语料库时出现的任务，并且它以比Lloyd的k-means快几倍的速度达到聚类质量。该方法几乎不需要调优，e-means使用其默认配方从几百个到超过一百万个嵌入运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出eDIAR系统，通过结合e-means算法，在不重新训练的情况下打破固定输出槽神经日志系统的说话人数量限制，实现长会议和大型档案的开放说话人流式日志。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 无需重新训练即可移除固定槽模型对说话人数量的限制。2. 在流式系统中，重新聚类限制在有界窗口内，身份锚定在槽上，更新成本不随会议长度增长。3. 在长达一小时的会议中，准确率远高于累积错误的Streaming Sortformer。4. e-means算法几乎无需调优，处理几百到上百万个嵌入的速度比Lloyd的k-means快数倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明eDIAR有效解决了固定槽模型在说话人数量超过槽数时崩溃的问题，且在长会议中保持高准确率和恒定的更新成本。局限性方面，摘要未提供关于该方法的局限性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/语音处理/说话人日志\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving（CANTraj：从自然驾驶中的CAN信号恢复车辆轨迹）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18442\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18442\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOpen driving releases and usage-based insurance programs often claim to prevent privacy breaches by omitting GPS records when sharing or collecting vehicle data. However, removing GPS coordinates from driving logs does not erase the location information carried by vehicle signals. While prior route-inference attacks have demonstrated that speed, steering, and driving events can be matched to road networks to reconstruct trajectories, existing studies rely on inconsistent prior assumptions and evaluation metrics and are tested only on small, restricted datasets, making their results difficult to compare and their real-world effectiveness uncertain. We release CANTraj, a naturalistic driving dataset pairing decoded CAN events with time-aligned GNSS trajectories (3,940 drives, 454 drivers), and CANTraj-Bench for evaluating trajectory recovery (3,675 drives, 431 drivers, 1,380 hours, 85,919 km). On 776 evaluation drives from 94 unseen drivers, we compare six re-implemented attacks and benchmark baselines under explicit information-access protocols, paired comparisons, and metrics incorporating failures. Experiments show that combining steering signals with road-network constraints yields the largest gain: With a known start and heading, adding steering to speed raises the online map filter\u0026#x27;s five-minute route recovery from 56% to 87%, with a median average displacement error of 43 m versus 921 m for map-free dead reckoning. Offline beam search recovers 88% of test routes with the heading and 81% without it. Because methods fail on different windows, we also evaluate an LLM harness that selects among candidate routes on 659 five-minute windows; its best configuration recovers 79% of routes on test and 83% on few-shot, outperforming the best baseline on test and matching it on few-shot. Data and code at huggingface.co/datasets/HenryYHW/CANTraj and github.com/WangYuHang-cmd/GPS--CAN.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e开放驾驶数据集和基于使用的保险计划通常声称通过在共享或收集车辆数据时省略GPS记录来防止隐私泄露。然而，从驾驶日志中删除GPS坐标并不能消除车辆信号携带的位置信息。虽然先前的路线推断攻击已经证明速度、转向和驾驶事件可以匹配到道路网络以重建轨迹，但现有研究依赖于不一致的先验假设和评估指标，并且仅在小而受限的数据集上进行测试，使其结果难以比较且实际有效性不确定。我们发布了CANTraj，一个将解码的CAN事件与时间对齐的GNSS轨迹配对的真实驾驶数据集（3,940次驾驶，454名驾驶员），以及用于评估轨迹恢复的CANTraj-Bench（3,675次驾驶，431名驾驶员，1,380小时，85,919公里）。在来自94名未见驾驶员的776次评估驾驶中，我们在明确的信息访问协议、配对比较和包含失败的指标下，比较了六种重新实现的攻击和基准基线。实验表明，将转向信号与道路网络约束相结合可产生最大收益：在已知起点和航向的情况下，将转向添加到速度可使在线地图过滤器的五分钟路线恢复率从56%提高到87%，中位平均位移误差为43米，而无地图航位推算为921米。离线波束搜索使用航向恢复了88%的测试路线，不使用航向恢复了81%。由于方法在不同的窗口上失败，我们还评估了一个在659个五分钟窗口上选择候选路线的LLM工具；其最佳配置在测试中恢复了79%的路线，在少样本中恢复了83%，在测试中优于最佳基线，在少样本中与之匹配。数据和代码位于 huggingface.co/datasets/HenryYHW/CANTraj 和 github.com/WangYuHang-cmd/GPS--CAN。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e发布CANTraj真实驾驶数据集和CANTraj-Bench评估基准，用于评估从车辆CAN信号（如速度、转向）中恢复车辆轨迹的隐私攻击方法的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发布了包含3,940次驾驶（454名驾驶员）的CANTraj数据集和包含3,675次驾驶（1,380小时，85,919公里）的CANTraj-Bench。2. 评估了6种重新实现的攻击和基线，发现结合转向信号与道路网络约束收益最大（5分钟路线恢复率从56%提升至87%）。3. 离线波束搜索在无航向情况下仍能恢复81%的路线。4. 评估了LLM工具选择候选路线，最佳配置在测试集恢复79%，少样本恢复83%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明即使移除GPS，车辆CAN信号仍包含大量位置信息，现有攻击方法（特别是结合转向和路网约束）能高效恢复轨迹，证明了隐私泄露风险。局限性方面，摘要指出先前研究依赖不一致的假设和指标且数据集小，CANTraj解决了这一问题，但摘要未提供CANTraj数据集或评估方法本身的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/隐私安全/智能交通系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. Emergent Biological Capabilities in a Foundation Model for Molecular Interactions（分子相互作用基础模型中涌现的生物学能力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14504\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14504\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFoundation models trained on large unlabeled corpora develop emergent capabilities, tasks that go beyond the training objective. We extend this paradigm to multimodal biology with Bonbon, a foundation model for molecular interactions trained on approximately 3.2 trillion tokens of paired protein-ligand sequences. From a single representation space, Bonbon exhibits three zero-shot emergent capabilities at hierarchical levels of resolution: functional (mechanism of action), residue (binding site localization, including orthosteric/allosteric discrimination), and bond (covalent versus non-covalent engagement). All three capabilities generalize to out-of-distribution complexes. Bonbon was trained on protein-ligand sequences alone, without any task-specific supervision and without structural coordinates. We conducted controlled scaling experiments across six model scales from 42M to 1.6B parameters; every capability evaluated shows a sharp jump at the largest scale on continuous metrics, even as pretraining loss decreases smoothly. This demonstrates that loss-based scaling laws alone are insufficient to predict when zero-shot emergent capabilities become available. The capabilities reported here emerge after training at a 1:2,000 parameter-to-token ratio to accommodate the sparsity of paired biological interaction data. The same frozen representations achieve state-of-the-art binding and affinity prediction at five orders of magnitude greater speed than co-folding methods. In prospective wet-lab validation across nine disease targets spanning seven protein families, Bonbon achieves a 61.5% dose-response hit rate on de novo compounds, yielding structurally novel molecules not previously reported to inhibit these proteins, including for out-of-distribution targets.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在大型无标注语料库上训练的基础模型会发展出涌现能力，即超越训练目标的任务。我们将这一范式扩展到多模态生物学领域，推出了Bonbon，这是一个用于分子相互作用的基础模型，在大约3.2万亿个成对蛋白质-配体序列的token上进行了训练。从单一的表示空间中，Bonbon在分层分辨率上展现出三种零样本涌现能力：功能（作用机制）、残基（结合位点定位，包括正构/变构区分）和键（共价与非共价结合）。这三种能力都能泛化到分布外的复合物。Bonbon仅使用蛋白质-配体序列进行训练，没有任何特定任务的监督，也没有结构坐标。我们在从4200万到16亿参数的六个模型规模上进行了受控的缩放实验；评估的每种能力在最大规模下的连续指标上都显示出急剧的跳跃，即使预训练损失平滑下降。这表明，仅基于损失的缩放规律不足以预测零样本涌现能力何时变得可用。这里报告的能力是在1:2000的参数与token比例下训练后涌现的，以适应成对生物相互作用数据的稀疏性。相同的冻结表示实现了最先进的结合和亲和力预测，速度比共折叠方法快五个数量级。在跨越七个蛋白质家族的九个疾病靶点的前瞻性湿实验验证中，Bonbon在从头设计的化合物上实现了61.5%的剂量反应命中率，产生了以前未报道过能抑制这些蛋白质的结构新颖分子，包括针对分布外的靶点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发用于分子相互作用的多模态基础模型，并评估其在分子层面的零样本涌现能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Bonbon模型，在3.2万亿成对蛋白质-配体序列上训练，无需任务特定监督或结构坐标。2. 展现三种零样本涌现能力（功能、残基、键级别），且能泛化至分布外复合物。3. 发现基于损失的缩放规律不足以预测涌现能力，能力在最大参数规模（1.6B）时出现跳跃。4. 冻结表示在结合和亲和力预测上达到SOTA，速度比共折叠方法快五个数量级。5. 湿实验验证中，对从头化合物实现61.5%命中率，发现新抑制剂。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该模型在分子相互作用预测和生成方面具有强大能力，且揭示了参数-数据比例（1:2000）和缩放规律在生物基础模型中的特殊性。局限性方面，摘要未提供模型在更广泛生物任务上的表现、计算资源消耗、以及湿实验验证中61.5%命中率的具体失败原因或假阳性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算生物学与人工智能/基础模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. HALO: Human-Aligned Data Collection for WhoLe-body MObile Manipulation（HALO：用于全身移动操作的人类对齐数据采集）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.16439\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.16439\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLearning whole-body mobile manipulation requires demonstrations that coordinate bimanual actions with locomotion across extended workspaces. However, existing interfaces trade off direct robot control, perception and action alignment, and natural operator mobility, making such demonstrations difficult to collect. We introduce HALO, a human-aligned data collection system for whole-body mobile manipulation. The system aligns the operator\u0026#x27;s perception and action space with the robot while preserving direct physical feedback and natural locomotion. Operators guide the robot end-effectors through kinesthetic teaching and move a low-resistance platform without the deployed mobile base while performing bimanual manipulation. This interface enables more natural whole-body demonstrations, but the close human-robot coupling introduces discrepancies between the demonstration and deployment settings. We address these discrepancies with deployment-aligned demonstration processing, which calibrates and temporally aligns platform motion with the deployed base response and masks and inpaints demonstrator hands in recorded observations. Compared with Mobile ALOHA and VR teleoperation, HALO enables up to 2.9x faster demonstration collection while maintaining comparable or higher success rates. Policies trained with HALO perform precise manipulation tasks, including zip-tie fastening, and achieve a 73.3% success rate on a six-stage long-horizon mobile manipulation task involving repeated coordinated base and arm motion. Project page: https://robbyant-research.github.io/Lingbot-ALOHA/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e学习全身移动操作需要能够协调双臂动作与跨扩展工作区运动的演示。然而，现有接口在直接机器人控制、感知与动作对齐以及操作者自然移动性之间进行权衡，使得收集此类演示变得困难。我们引入了HALO，一个用于全身移动操作的人类对齐数据采集系统。该系统将操作者的感知和动作空间与机器人对齐，同时保留直接的物理反馈和自然的运动。操作者通过力觉教学引导机器人末端执行器，并在执行双臂操作时移动一个低阻力平台，而不使用部署的移动底盘。该接口实现了更自然的全身演示，但紧密的人机耦合引入了演示和部署设置之间的差异。我们通过部署对齐的演示处理来解决这些差异，该方法校准并在时间上将平台运动与部署的底盘响应对齐，并在记录的观察中掩码和修复演示者的手。与Mobile ALOHA和VR遥操作相比，HALO能够实现高达2.9倍更快的演示收集，同时保持相当或更高的成功率。使用HALO训练的策略能够执行精确的操作任务，包括扎带紧固，并在涉及重复协调底盘和手臂运动的六阶段长视野移动操作任务中实现73.3%的成功率。项目主页：https://robbyant-research.github.io/Lingbot-ALOHA/\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种用于全身移动操作的人类对齐数据采集系统（HALO），以解决现有接口在收集协调双臂动作与移动的演示时的权衡问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出HALO系统，通过力觉教学和低阻力平台实现操作者感知/动作空间与机器人的对齐，保留物理反馈和自然运动。2. 引入部署对齐的演示处理技术，校准平台运动与底盘响应，并掩码/修复操作者手部。3. 相比Mobile ALOHA和VR遥操作，演示收集速度提升高达2.9倍，且成功率相当或更高。4. 训练的策略能执行扎带紧固等精确任务，并在六阶段长视野任务中达到73.3%成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了HALO系统在数据采集效率和任务成功率上的优势，并有效解决了人机耦合带来的演示与部署差异。局限性方面，摘要未提供系统在不同类型机器人硬件上的泛化能力、低阻力平台的具体物理限制、以及73.3%成功率下失败案例的具体原因分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/移动操作与数据采集\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Do Underwater Image Quality Metrics Agree with Human Perception? A Benchmark with Human Choices, Simple Edits and Generative Drift（水下图像质量指标与人类感知一致吗？包含人类选择、简单编辑和生成漂移的基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.18429\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.18429\"\u003eHuggi
