hat achieve near-zero attack success rates on static attacks and can withstand strong adaptive attacks, while maintaining benign task utility close to that of the undefended baseline.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLM）代理通常与不受信任的外部数据交互，使它们暴露于间接提示注入（IPI）攻击中，这些攻击劫持代理执行攻击者选择的任务。为了大规模发现这些漏洞，自动红队方法通常利用强化学习（RL）生成实现高攻击成功率（ASR）的攻击。模型开发者使用内部红队发现的攻击通过对抗训练在部署前加固代理，这种在网络安全中称为紫队的协作攻防过程。然而，我们表明在红队期间实现高ASR并不能保证随后的对抗训练带来鲁棒性提升。具体来说，我们发现两种最先进的基于RL的红队方法（RL-Hammer和PISmith）遭受模式崩溃，重复发现相似的攻击策略，其额外的成功未能为对抗训练增加额外的鲁棒性改进。为了弥补这一差距，我们引入了PIPETTE，一个统一的提示注入紫队框架，能有效地将红队发现转化为防御者的鲁棒性改进。PIPETTE采用基于字典学习的奖励，鼓励红队期间更广泛地覆盖攻击策略。它还集成了一个专为IPI防御定制的在策略对抗训练管道，使代理在抵抗攻击的同时完成合法的用户任务。在代理基准（AgentDojo和ASB）上的广泛评估表明，PIPETTE产生的防御者在静态攻击上实现了接近零的攻击成功率，并能承受强大的自适应攻击，同时保持良性任务效用接近未防御基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一个统一的提示注入紫队框架（PIPETTE），将红队发现的攻击有效转化为大语言模型代理的防御鲁棒性提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e揭示高攻击成功率的强化学习红队方法存在模式崩溃，无法有效提升对抗训练的鲁棒性；采用基于字典学习的奖励以鼓励更广泛的攻击策略覆盖；集成专为间接提示注入防御定制的在策略对抗训练管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前基于RL的红队方法存在模式崩溃，导致高攻击成功率无法转化为对抗训练后的鲁棒性提升。PIPETTE通过字典学习奖励扩大攻击策略覆盖，并结合在策略对抗训练解决了此问题。评估表明其在AgentDojo和ASB基准上对静态攻击实现接近零的ASR，抵御自适应攻击且保持良性任务效用。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大模型安全与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. LogT: Logically Think with Images for Visual Search（LogT：面向视觉搜索的图像逻辑思考）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.19200\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.19200\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThinking with images empowers vision-language models (VLMs) to use an external Zoom-in tool for fine-grained visual search. Recent works employ supervised fine-tuning (SFT) and reinforcement learning (RL) with tool-specific designs to enable such capabilities. However, achieving logical reasoning alongside accurate and efficient tool use remains a significant challenge. To address this, we shift the focus away from increasing RL complexity and instead identify SFT data quality as a key bottleneck. We then propose LogT (short for Logically Think with Images), a fully automated SFT data engine that explicitly enforces logic-chain-guided reasoning. LogT generates an SFT dataset featuring challenging, visually grounded questions and structured tool-use traces with human-like logic. We validate our approach by fine-tuning two base models, Qwen2.5-VL-7B and InternVL3.5-8B, on the dataset and evaluating them across seven benchmark test sets. We show that LogT-SFT based on Qwen2.5-VL-7B outperforms the state-of-the-art trained with both SFT and RL, despite using 3.1times less data and \u0026gt;120times fewer GPU hours. Furthermore, applying a simple RL recipe without tool-specific design on LogT-SFT yields a model that surpasses prior methods with complex RL setups by a substantial 9.59-point margin. In addition to strong performance gains, our model exhibits higher tool-use accuracy and efficiency, as well as more structured and logically consistent reasoning traces, directly validating the effectiveness of our approach.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e用图像思考使视觉语言模型（VLMs）能够使用外部放大工具进行细粒度视觉搜索。最近的工作采用监督微调（SFT）和具有工具特定设计的强化学习（RL）来启用此类能力。然而，在实现逻辑推理的同时准确高效地使用工具仍然是一个重大挑战。为了解决这个问题，我们将重点从增加RL复杂性转移到识别SFT数据质量作为关键瓶颈。然后我们提出了LogT（Logically Think with Images的简称），一个完全自动化的SFT数据引擎，显式地强制执行逻辑链引导的推理。LogT生成一个SFT数据集，具有挑战性的、视觉基础的问题和具有类似人类逻辑的结构化工具使用轨迹。我们通过微调两个基础模型（Qwen2.5-VL-7B和InternVL3.5-8B）并在七个基准测试集上评估它们来验证我们的方法。我们表明，基于Qwen2.5-VL-7B的LogT-SFT优于同时使用SFT和RL训练的最先进模型，尽管使用的数据少了3.1倍，GPU时间少了大于120倍。此外，在没有工具特定设计的LogT-SFT上应用简单的RL配方，产生的模型以9.59分的巨大优势超越了具有复杂RL设置的先前方法。除了强大的性能提升外，我们的模型还表现出更高的工具使用准确性和效率，以及更结构和逻辑一致的推理轨迹，直接验证了我们方法的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提升视觉语言模型在细粒度视觉搜索中结合逻辑推理与外部放大工具准确高效使用的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出完全自动化的SFT数据引擎LogT，显式强制执行逻辑链引导的推理；生成包含挑战性视觉问题和类人逻辑结构化工具使用轨迹的SFT数据集；在减少3.1倍数据和大于120倍GPU时间的情况下超越现有SFT和RL方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出实现逻辑推理与准确高效工具使用的挑战在于SFT数据质量而非RL复杂性。LogT通过自动化数据引擎生成逻辑链引导的SFT数据，在Qwen2.5-VL-7B和InternVL3.5-8B上验证，以极少的数据和计算资源超越了现有最先进方法，并在叠加简单RL后进一步提升9.59分。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉语言模型与工具使用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. TabBioMed: A Large-Scale Benchmark for Biomedical Tabular Learning（TabBioMed：生物医学表格学习的大规模基准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23779\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23779\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent advances in machine learning have accelerated biomedical prediction, but evaluation on structured biomedical data remains fragmented, especially for datasets with high dimensionality, large sample size, missingness, and class imbalance. We introduce TabBioMed, a large-scale benchmark of 94 curated public biomedical tabular datasets spanning electronic health records, drug discovery, genomics, transcriptomics, proteomics, metabolomics, single-cell omics, and systems biology. TabBioMed unifies these datasets through a standardized, dataset-aware preprocessing and evaluation framework, enabling reproducible comparison across classification, regression, and multi-target tasks. We benchmark 23 models across classical baselines, gradient-boosted trees, neural tabular architectures, and tabular foundation models. Foundation models deliver the strongest family-level predictive performance. However, their gains are regime-dependent: tree-based models and tuned multilayer perceptrons remain highly competitive, often dominating under inference-time or training-cost constraints. Overall, TabBioMed shows that biomedical tabular learning is strongly context-dependent, with optimal model choice depending on data regime, task type, and computational budget. We release TabBioMed with curated datasets and splits, preprocessing code, baselines, and results, providing a reproducible benchmark for practical model selection and future methods development in biomedical machine learning, available at https://github.com/AI-sandbox/TabBioMed.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器学习的最新进展加速了生物医学预测，但在结构化生物医学数据上的评估仍然碎片化，特别是对于具有高维度、大样本量、缺失和类别不平衡的数据集。我们引入了TabBioMed，一个包含94个精选公共生物医学表格数据集的大规模基准，涵盖电子健康记录、药物发现、基因组学、转录组学、蛋白质组学、代谢组学、单细胞组学和系统生物学。TabBioMed通过标准化的、数据集感知的预处理和评估框架统一了这些数据集，实现了跨分类、回归和多目标任务的可重复比较。我们对23个模型进行了基准测试，涵盖经典基线、梯度提升树、神经表格架构和表格基础模型。基础模型提供了最强的家族级预测性能。然而，它们的增长是依赖于环境的：基于树的模型和微调的多层感知器仍然具有高度竞争力，通常在推理时间或训练成本约束下占据主导地位。总体而言，TabBioMed表明生物医学表格学习强烈依赖于上下文，最佳模型选择取决于数据环境、任务类型和计算预算。我们发布了TabBioMed，包含精选数据集和划分、预处理代码、基线和结果，为生物医学机器学习中的实用模型选择和未来方法开发提供了可重复的基准，可在 https://github.com/AI-sandbox/TabBioMed 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提供一个大规模、标准化的生物医学表格数据基准（TabBioMed），以统一评估和比较各类机器学习模型在结构化生物医学数据上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e包含94个精选公共生物医学表格数据集，涵盖多个生物医学领域；提供标准化的、数据集感知的预处理和评估框架；对23个模型（包括基础模型、树模型等）进行跨任务基准测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出当前生物医学表格数据评估碎片化。TabBioMed通过整合94个数据集和标准化框架解决了这一问题。基准测试表明表格基础模型家族级性能最强，但树模型和微调MLP在计算成本受限时仍具竞争力，证明模型选择高度依赖上下文、任务和预算。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习基准与生物医学信息学\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. Thinking Fast, Anywhere: One System-1 for the Decision Points of Any Agent Workflow（快速思考，无处不在：适用于任何智能体工作流决策点的单一系统1）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23751\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23751\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutonomous LLM agents incur substantial cost and latency by invoking a large model (System-2) at every step, even when many intermediate actions choose among a small set of known candidates. Existing dual-system agents offload such decisions to a lightweight System-1 model, but rely on workflow-specific hooks authored per environment. We present AnyS1, a framework that turns human-authored procedural skills, whose instructions naturally specify where choices arise and which options apply, into a shared, domain-general source of decision points. Offline, AnyS1 mines grounded enumerable decisions across over 1,000 public skills, gathers execution-grounded trajectory states inside isolated containers to construct Any-DP, and trains a single calibrated 4B pointer System-1 with label smoothing. At run time, compiled workflows resolve routine decisions in one forward pass and fall back to System-2 when confidence falls below a calibrated threshold. Across three unseen benchmarks and distinct System-2 model families, AnyS1 preserves task reliability while cutting episode cost by 75-91% and model-call time by 63-92% relative to an uncompiled System-2 agent, and maintains performance under zero-shot threshold transfer.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自主大语言模型智能体在每一步都调用大型模型（系统2），从而产生巨大的成本和延迟，即使许多中间动作只是在一小群已知候选者中进行选择。现有的双系统智能体将此类决策卸载到轻量级的系统1模型，但依赖于为每个环境编写的特定于工作流的钩子。我们提出了 AnyS1，一个框架，它将人类编写的过程技能（其指令自然地指定了选择出现的位置和适用的选项）转化为共享的、领域通用的决策点来源。在离线阶段，AnyS1 在超过 1,000 个公开技能中挖掘有基础的 enumerable（可枚举）决策，在隔离容器中收集基于执行的轨迹状态以构建 Any-DP，并使用标签平滑训练一个单一的校准 4B 指针系统1。在运行时，编译后的工作流在一次前向传递中解决常规决策，并在置信度低于校准阈值时回退到系统2。在三个未见过的基准测试和不同的系统2模型家族中，AnyS1 在保持任务可靠性的同时，与未编译的系统2智能体相比，将 episode（回合）成本降低了 75-91%，模型调用时间减少了 63-92%，并在零样本阈值迁移下保持了性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e降低自主大语言模型智能体在中间决策步骤中的计算成本和延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 AnyS1 框架，利用人类编写的过程技能提取通用决策点；离线构建 Any-DP 数据集并训练单一 4B 指针系统1模型；运行时通过置信度阈值动态回退至系统2；在多个基准测试中大幅降低成本和延迟，同时保持任务可靠性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 AnyS1 有效降低了成本和延迟，且具备跨模型和零样本迁移能力。但摘要未提供关于该方法在更复杂、非枚举型决策或长尾任务中的表现，也未提及构建 Any-DP 和训练 4B 模型的具体离线成本与时间开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/大语言模型智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. UltraTex: Aligning Physical Knowledge for High-Fidelity PBR Texture Generation（UltraTex：对齐物理知识以实现高保真PBR纹理生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24941\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24941\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerating physically based rendering (PBR) texture maps for a 3D mesh from a single reference image is highly ambiguous, as the observed appearance entangles material identity, surface reflectance, and illumination. While current generative methods produce realistic albedo maps, they still struggle to infer accurate metallic and roughness attributes for relighting. We present UltraTex, a cascaded multi-view framework that moves beyond appearance matching by integrating physical knowledge into multi-view diffusion-based PBR generation. UltraTex first jointly predicts albedo and world-space shading normals to generate more detailed albedo maps, and then predicts metallic-roughness (MR) maps conditioned on the generated albedo, reference image, and material semantic priors. To inject material semantics, a lightweight adapter transforms hidden-layer features of a vision-language model (VLM) into intrinsic material representation tokens, providing part-level knowledge anchors for MR estimation. To model material-light interaction, photometric representation alignment guides intermediate diffusion features toward ground-truth material renderings under controlled lighting. This makes metallic and roughness variations observable through highlight intensity, specular sharpness, and local reflectance contrast, providing stronger guidance for fine-grained material prediction without explicit lighting supervision. Extensive experiments show that UltraTex generates high-quality textures and outperforms existing open-source and commercial methods in visual fidelity, material accuracy, and physical plausibility.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从单张参考图像为 3D 网格生成基于物理的渲染（PBR）纹理图具有高度歧义性，因为观察到的外观将材质身份、表面反射率和光照纠缠在一起。虽然当前的生成方法能生成逼真的反照率图，但它们仍然难以推断出用于重新照明的准确金属度和粗糙度属性。我们提出了 UltraTex，这是一个级联多视图框架，通过将物理知识整合到基于多视图扩散的 PBR 生成中，超越了单纯的外观匹配。UltraTex 首先联合预测反照率和世界空间着色法线，以生成更详细的反照率图，然后在生成的反照率、参考图像和材质语义先验的条件下预测金属度-粗糙度（MR）图。为了注入材质语义，一个轻量级适配器将视觉语言模型（VLM）的隐藏层特征转换为内在材质表示 token，为 MR 估计提供部分级别的知识锚点。为了对材质-光照相互作用进行建模，光度表示对齐将中间扩散特征引导至受控光照下的真实材质渲染。这使得金属度和粗糙度的变化可以通过高光强度、镜面锐度和局部反射率对比度来观察，为细粒度材质预测提供更强的指导，而无需显式的光照监督。大量实验表明，UltraTex 生成高质量的纹理，并在视觉保真度、材质准确性和物理合理性方面优于现有的开源和商业方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从单张参考图像生成高保真、物理准确的基于物理的渲染（PBR）纹理图（特别是金属度和粗糙度属性）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出级联多视图框架 UltraTex，将物理知识融入多视图扩散 PBR 生成；利用 VLM 提取材质语义先验作为知识锚点；通过光度表示对齐隐式建模材质-光照交互，无需显式光照监督；在视觉保真度、材质准确性和物理合理性上优于现有方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 UltraTex 在生成高质量 PBR 纹理方面表现优异，解决了金属度和粗糙度推断的难题。但摘要未提供具体的定量评估指标（如 PSNR、SSIM 等），未提及该方法在极端光照条件或复杂几何结构下的局限性，也未说明计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/3D生成与渲染\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. VAE Rhythm: Temporal Decoding Traces for AI-Generated Video Detection（VAE 节奏：用于 AI 生成视频检测的时间解码痕迹）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21114\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21114\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisible artifacts are an unreliable cue for detecting generated videos, because newer generators learn to remove them. We instead detect a trace left by the generation pipeline itself. Most video generators decode latents with a 3D causal VAE that groups consecutive frames in time, so the fidelity of generated frames rises and falls periodically with their position in a group. We call this periodic trace VAE Rhythm. Real videos are captured frame by frame and do not have it. To reveal it without training, we propose a phase scan. The scan reconstructs a clip with an off-the-shelf VAE from successive start offsets and measures the periodicity of the reconstruction error across these offsets. We find VAE Rhythm in most of the 39 variants of 31 generators we test, including the closed-source Sora, Kling 3.0 and Seedance 2.0. We use the rhythm as a zero-shot score, as a plug-in for existing detectors and as a data engine that pairs real videos with their VAE reconstructions to train our detector CaDet. On DF26, the training-free rhythm score outperforms all 15 retrained baselines, and as a plug-in it improves all 19 tested detectors by 6.7% to 23.7% AUROC. CaDet achieves the best AUROC on AIGVDBench, DF26 and three 2026 closed-source models, and its variant trained without any generated video still exceeds 90% on AIGVDBench.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e可见伪影是检测生成视频的不可靠线索，因为较新的生成器学会了去除它们。我们转而检测生成管道本身留下的痕迹。大多数视频生成器使用 3D 因果 VAE 解码潜变量，该 VAE 在时间上对连续帧进行分组，因此生成帧的保真度会随着其在组中的位置而周期性地上升和下降。我们称这种周期性痕迹为 VAE 节奏（VAE Rhythm）。真实视频是逐帧捕获的，没有这种痕迹。为了在不训练的情况下揭示它，我们提出了一种相位扫描（phase scan）。该扫描使用现成的 VAE 从连续的起始偏移量重建片段，并测量跨这些偏移量的重建误差的周期性。我们在测试的 31 个生成器的 39 个变体中的大多数中发现了 VAE 节奏，包括闭源的 Sora、Kling 3.0 和 Seedance 2.0。我们将该节奏用作零样本分数、现有检测器的插件，以及将真实视频与其 VAE 重建配对以训练我们的检测器 CaDet 的数据引擎。在 DF26 上，免训练的节奏分数优于所有 15 个重新训练的基线，并且作为插件，它将所有 19 个测试检测器的 AUROC 提高了 6.7% 到 23.7%。CaDet 在 AIGVDBench、DF26 和三个 2026 闭源模型上取得了最佳的 AUROC，其未经任何生成视频训练的变体在 AIGVDBench 上仍然超过 90%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过检测视频生成管道留下的时间解码痕迹（VAE节奏），来检测 AI 生成的视频。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现并利用 3D 因果 VAE 解码导致的帧保真度周期性变化（VAE 节奏）作为检测线索；提出免训练的相位扫描方法揭示该痕迹；该节奏可作为零样本分数或现有检测器的插件；提出 CaDet 检测器，在多个基准和闭源模型上取得最佳 AUROC。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 VAE 节奏是一种有效且通用的检测线索，CaDet 表现优异。但摘要未提供关于该痕迹在未来可能不使用 3D 因果 VAE 或采用非分组解码机制的生成器中的有效性，也未详细说明在极低分辨率或高度压缩视频下的鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/多媒体安全与伪造检测\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. Chorus: Shared N-gram Embeddings with Layer-wise Adaptation（Chorus：具有逐层适应性的共享 N-gram 嵌入）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23386\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23386\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLanguage models can gain capacity at little computational cost from n-gram embedding tables: large tables of learned vectors for short sequences of consecutive tokens, which are looked up and added to the model\u0026#x27;s input or to its intermediate layers. Recent designs commonly use a separate n-gram embedding table for each layer, which makes the tables costly in memory and prevents layers from sharing what they learn. Sharing a single table, however, gives every layer the same embedding and leaves no room for layer-wise preferences, and it performs poorly in practice. We propose Chorus, in which one set of n-gram embedding tables serves the whole network and every layer reads it in its own way. Each layer maps the refined embedding through its own projection layer, after rescaling its components by factors computed from its current hidden state. Chorus matches the quality of existing n-gram methods with 87% smaller tables: with 1.2B table parameters it predicts text better than FactorEngram and DeepSeek\u0026#x27;s Engram do with 9.6B. It outperforms Engram, TN-gram and FactorEngram in every setting where we compared them, across table sizes from 20M to 9.6B parameters. We also show that the recently proposed memory-efficient optimizer Ember works well with Chorus, saving 99.2% of table-optimizer memory compared with AdamW without degrading training performance. These results enable further scaling of n-gram embedding tables along the table-size axis by reducing memory use and allowing shared knowledge to be reused across layers.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型可以从 n-gram 嵌入表中以极小的计算成本获得容量：这些是用于连续 token 短序列的大型学习向量表，它们被查找并添加到模型的输入或中间层。最近的设计通常为每一层使用单独的 n-gram 嵌入表，这使得表在内存上成本高昂，并阻止了层之间共享它们所学到的内容。然而，共享单个表会给每一层提供相同的嵌入，没有为逐层偏好留下空间，并且在实践中表现不佳。我们提出了 Chorus，其中一组 n-gram 嵌入表服务于整个网络，每一层都以自己的方式读取它。每一层在通过根据其当前隐藏状态计算的因子重新缩放其组件后，通过其自己的投影层映射精化的嵌入。Chorus 以缩小 87% 的表匹配了现有 n-gram 方法的质量：使用 1.2B 表参数，它预测文本的效果优于 FactorEngram 和 DeepSeek 的 Engram 使用 9.6B 参数的效果。在我们比较的每种设置中，在从 20M 到 9.6B 参数的表大小范围内，它都优于 Engram、TN-gram 和 FactorEngram。我们还表明，最近提出的内存高效优化器 Ember 与 Chorus 配合良好，与 AdamW 相比节省了 99.2% 的表优化器内存，且不会降低训练性能。这些结果通过减少内存使用并允许跨层重用共享知识，使得 n-gram 嵌入表能够沿着表大小轴进一步扩展。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过共享 n-gram 嵌入表并引入逐层适应性机制，在大幅减少内存占用的同时提升语言模型的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Chorus 框架，实现全网络共享 n-gram 嵌入表，并通过逐层投影和基于隐藏状态的缩放实现逐层适应性；在表参数减少 87% 的情况下达到或超越现有方法（如 1.2B 超越 9.6B）；结合 Ember 优化器节省 99.2% 的优化器内存。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Chorus 在参数效率和内存占用上具有显著优势，且性能优异。但摘要未提供关于该方法在极长上下文或罕见 n-gram 组合下的表现，未说明逐层投影带来的额外计算开销，也未提及在下游特定任务（如推理、代码生成）上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型架构与优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. FVScore: Specification-Driven Neuro-Symbolic Video Evaluation（FVScore：规范驱动的神经常符号视频评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22673\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22673\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Faithfulness Video Score (FVSCORE), a neuro-symbolic framework for specification-driven video generation evaluation. Existing evaluators rely on holistic MLLM judgments or vision-language metrics, yet aligning their scores with human judgments and tracing them to specific temporal violations remain open challenges. FVSCORE addresses these limitations by compiling each video into explicit propositions capturing prompt requirements and implicit propositions capturing unstated physical, temporal, and cross-modal constraints. It grounds each proposition using specialized perceptual tools and evaluates the resulting confidence traces with soft temporal operators inspired by Linear Temporal Logic. A Significance-Aware Calibration step then aligns verification with human perception by retaining only perceptually significant violations before producing a timestamp- and evidence-grounded report. We conduct extensive experiments across public and complex multi-event benchmarks with the strongest video models to date, demonstrating that FVSCORE outperforms holistic and agent-based evaluators in human correlation while providing highly accurate and interpretable feedback.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们引入了忠实度视频分数（FVSCORE），一个用于规范驱动的视频生成评估的神经常符号框架。现有的评估器依赖于整体的多模态大语言模型（MLLM）判断或视觉语言指标，然而将它们的分数与人类判断对齐并追踪到特定的时间违规仍然是一个未解决的挑战。FVSCORE 通过将每个视频编译为捕获提示词要求的显式命题和捕获未说明的物理、时间和跨模态约束的隐式命题来解决这些限制。它使用专门的感知工具对每个命题进行基础化，并使用受线性时序逻辑启发的软时序算子评估由此产生的置信度痕迹。然后，重要性感知校准步骤通过仅保留感知上显著的违规来将验证与人类感知对齐，然后生成基于时间戳和证据的报告。我们在迄今为止最强的视频模型的公开和复杂多事件基准测试中进行了大量实验，表明 FVSCORE 在人类相关性方面优于整体和基于智能体的评估器，同时提供高度准确和可解释的反馈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过规范驱动的神经常符号框架（FVSCORE），对视频生成结果进行与人类判断对齐且可解释的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 FVSCORE 框架，将视频编译为显式和隐式命题；利用专门感知工具进行基础化，并结合线性时序逻辑的软时序算子评估置信度；引入重要性感知校准步骤以对齐人类感知；在人类相关性上优于现有整体和基于智能体的评估器，并提供可解释反馈。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 FVSCORE 在人类相关性和可解释性方面表现优异。但摘要未提供具体的评估指标数值（如相关系数），未说明专门感知工具的具体类型及其各自的误差率，也未提及该框架在处理高度抽象或主观提示词时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/视频生成与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. NexSight: Verifiable Tasks for Fine-Grained Agentic Long-Video Understanding（NexSight：用于细粒度智能体长视频理解的可验证任务）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22790\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22790\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFine-grained questions about long videos ask how many times an action occurs, in what order events unfold, or exactly when a state changes. Answering them can require finding brief moments scattered across hours of footage. Agentic models that decide when and where to look promise to find these moments, yet this ability is hard both to measure and to learn. Sparse supporting evidence may establish that an action occurred without establishing its total count; verifying timeline-wide claims requires checking for missed occurrences and double counting. Answer-only supervision, in turn, does not explicitly supervise the search for evidence. We present NexSight, which builds verifiable tasks to both evaluate and train agentic long-video understanding. Its agentic pipeline, SightForge, accepts a task only if a verifier blind to the draft answer can reconstruct it from evidence densely reacquired from the raw video and counterexample checks fail to refute it. This yields SightLine, 310 evidence-traceable tasks from 108 long videos, evaluated through SightLoop, a shared multiscale harness supporting temporal exploration, local inspection, evidence integration, and revisiting while recording returned observations. On disjoint videos, solver trajectories on verified tasks become step-level supervision for observation decisions. The strongest model reaches only 54.52% on SightLine, yet 79.35% when given the annotated evidence. With under 6K examples, Sight-35B nearly doubles its base model\u0026#x27;s interactive accuracy (21.29% to 42.26%), outperforms the 397B model of its family, begins using explicit spatial inspection after post-training, which its base model never uses, and gains over 8 points on two external long-video benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e关于长视频的细粒度问题会询问某个动作发生了多少次、事件按什么顺序展开，或者状态究竟在何时发生变化。回答这些问题可能需要在数小时的素材中寻找散落的短暂瞬间。决定何时何地观察的智能体模型有望找到这些瞬间，但这种能力既难以衡量也难以学习。稀疏的支持性证据可能证明某个动作发生过，但无法确定其总次数；验证时间线上的声明需要检查是否遗漏了发生次数以及是否重复计数。另一方面，仅答案的监督并没有明确监督对证据的搜索。我们提出了NexSight，它构建可验证任务来评估和训练智能体长视频理解。其智能体流程SightForge仅在验证者对草稿答案盲视的情况下，能够从原始视频中密集重新获取的证据重构答案，且反例检查未能反驳它时，才接受一个任务。这产生了SightLine，包含来自108个长视频的310个证据可追溯任务，通过SightLoop进行评估，SightLoop是一个共享的多尺度框架，支持时间探索、局部检查、证据整合和重访，同时记录返回的观察结果。在不相交的视频上，已验证任务上的求解器轨迹成为观察决策的步骤级监督。最强的模型在SightLine上仅达到54.52%，但在提供注释证据时达到79.35%。在不到6K个样本的情况下，Sight-35B将其基础模型的交互准确率几乎翻倍（从21.29%提高到42.26%），超越了其家族中的397B模型，在后训练后开始使用显式的空间检查（其基础模型从未使用过），并在两个外部长视频基准上获得了超过8分的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和训练智能体长视频理解，特别是解决关于长视频的细粒度问题（如动作发生次数、事件顺序、状态变化时间）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出NexSight构建可验证任务；提出SightForge智能体流程进行任务验证；构建包含310个任务的SightLine数据集；提出支持多尺度探索的SightLoop评估框架；Sight-35B模型在不到6K样本下将交互准确率从21.29%提升至42.26%，并超越同家族397B模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要表明仅答案监督不足以指导证据搜索，NexSight通过引入可验证任务和步骤级监督解决了这一问题。Sight-35B通过少量样本实现了显著的性能提升和空间检查能力的涌现。局限：摘要未提供具体的外部长视频基准名称、Sight-35B的具体架构细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与长视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. DrawScore: Evaluating Generated CAD Models against Engineering Drawings（DrawScore：根据工程图评估生成的CAD模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24681\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24681\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutomatic CAD generation is commonly evaluated with volumetric IoU, Chamfer Distance, and surface F-score, which barely penalize local errors that occupy only a small fraction of a part\u0026#x27;s volume or surface area, such as a misplaced hole or a slot on the wrong face, even though such errors are critical to manufacturing. We formalize these metrics in a unified integral form and show that the weight of a local error decays as the (k+q)-th power of its size, where k is the dimension of the integration domain and q is determined by the penalty function. Guided by this analysis, we propose DrawScore, which projects both models into three orthographic views with visible and hidden lines, as in engineering drawings, and applies a saturating penalty along the projected curves, so that the weight of a local error decays only linearly. Controlled experiments confirm the predicted decay orders, and on outputs of existing CAD generation agents, DrawScore exposes errors in outputs that IoU rates as nearly perfect. DrawScore further improves generation as a reinforcement learning reward and, for CAD generation from engineering drawings, serves as a test-time verifier without 3D ground truth or an additional reward model. Our code is available at https://github.com/UESTC-Simon/DrawScore.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自动CAD生成通常使用体积IoU、Chamfer距离和表面F-score进行评估，这些指标几乎不会惩罚仅占零件体积或表面积很小一部分的局部错误，例如错位的孔或错误面上的槽，即使这些错误对制造至关重要。我们在统一的积分形式中形式化了这些指标，并表明局部错误的权重以其大小的(k+q)次幂衰减，其中k是积分域的维度，q由惩罚函数决定。在这一分析的指导下，我们提出了DrawScore，它将两个模型投影到具有可见线和隐藏线的三个正交视图中，如同工程图一样，并沿投影曲线应用饱和惩罚，使得局部错误的权重仅线性衰减。对照实验证实了预测的衰减阶数，并且在现有CAD生成智能体的输出上，DrawScore暴露了IoU评为近乎完美的输出中的错误。DrawScore作为强化学习奖励进一步改善了生成，并且对于从工程图生成CAD，它作为测试时验证器，无需3D真实值或额外的奖励模型。我们的代码可在 https://github.com/UESTC-Simon/DrawScore 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种新的评估指标DrawScore，用于解决现有CAD生成评估指标（如体积IoU、Chamfer距离、表面F-score）难以惩罚对制造至关重要的局部小错误的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在统一积分形式下形式化现有评估指标，证明局部错误权重随其大小的(k+q)次幂衰减；提出DrawScore，通过正交视图投影和沿投影曲线的饱和惩罚，使局部错误权重仅线性衰减；DrawScore能暴露IoU评为完美的输出中的错误；可作为强化学习奖励改善生成，并作为无需3D真实值的测试时验证器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要指出传统指标对局部小错误惩罚不足，DrawScore通过改变投影和惩罚方式使错误权重线性衰减，有效解决了该问题，并在强化学习和测试时验证中展现了实用性。局限：摘要未提供对照实验的具体数值结果、DrawScore的计算复杂度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机辅助设计与三维生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Evidence-Based Credit Assignment for Search-Augmented Language Models（基于证据的搜索增强语言模型信用分配）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23824\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23824\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning from terminal answer rewards enables search-augmented language models to interleave reasoning and retrieval without step-level annotations, yet outcome supervision assigns identical credit to every search in a trajectory regardless of whether it retrieved useful information. This limitation is especially severe when all sampled rollouts for a question fail, collapsing group-centered outcome advantages to zero even when trajectories gather markedly different evidence. We present Evidence-based Credit Assignment (ECA), which augments terminal outcome rewards with a training-only auxiliary signal measuring how retrieved documents improve the likelihood of a reference answer. Rather than scoring the full dialogue prefix, ECA queries a frozen snapshot of the current policy under an evidence-only prompt containing solely the question and the deduplicated documents observed so far, isolating the utility of retrieved passages from surface variations in generated thoughts or search queries. Within this framework, we compare two return formulations, ECA-Step (which accumulates step-clipped potential increments) and ECA-Horizon (which preserves the telescoping horizon gain in potential), paired with cross-fold group normalization, novelty gating, and search-local token assignment. Across seven Search QA benchmarks, ECA-Horizon improves strict macro exact match over an outcome-only GRPO baseline by 1.03 and 4.80 percentage points on Qwen2.5-3B- and 7B-Instruct, respectively, outperforming both RLOO and GiGPO. Zero-shot evaluation on MultiHop-RAG further demonstrates strong transfer to multi-hop inference queries.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e来自终端答案奖励的强化学习使搜索增强语言模型能够在没有步骤级注释的情况下交替进行推理和检索，然而结果监督对轨迹中的每次搜索分配相同的信用，无论其是否检索到有用信息。当问题的所有采样展开都失败时，这种局限性尤为严重，即使轨迹收集了明显不同的证据，也会将基于组的结果优势折叠为零。我们提出了基于证据的信用分配（ECA），它用仅在训练时使用的辅助信号来增强终端结果奖励，该信号衡量检索到的文档如何提高参考答案的可能性。ECA不对完整的对话前缀进行评分，而是在仅包含问题和迄今为止观察到的去重文档的证据提示下，查询当前策略的冻结快照，从而将检索段落的效用与生成思想或搜索查询的表面变化隔离开来。在这个框架内，我们比较了两种回报公式，ECA-Step（累积步骤截断的潜在增量）和ECA-Horizon（保留潜在的伸缩视界增益），并配合跨折组归一化、新颖性门控和搜索局部标记分配。在七个搜索问答基准上，ECA-Horizon在Qwen2.5-3B-和7B-Instruct上分别将严格宏精确匹配比仅结果的GRPO基线提高了1.03和4.80个百分点，优于RLOO和GiGPO。在MultiHop-RAG上的零样本评估进一步证明了对多跳推理查询的强迁移能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决搜索增强语言模型在强化学习中结果监督对每次搜索分配相同信用的问题，提出基于证据的信用分配（ECA）方法以衡量检索文档对参考答案可能性的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出ECA方法，通过仅在训练时使用的辅助信号增强终端结果奖励；利用冻结策略快照和仅证据提示隔离检索效用；比较了ECA-Step和ECA-Horizon两种回报公式；ECA-Horizon在Qwen2.5-3B和7B模型上分别提升1.03和4.80个百分点，优于RLOO和GiGPO；在MultiHop-RAG上展现出强零样本迁移能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要表明ECA通过引入衡量检索文档效用的辅助信号，解决了传统结果监督中信用分配不合理的问题，特别是避免了所有展开失败时优势归零的情况。ECA-Horizon在多个基准上取得了显著提升。局限：摘要未提供七个搜索问答基准的具体名称、ECA-Step的具体实验结果、辅助信号的计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. Thinking Harder Doesn\u0026#x27;t Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents（更努力地思考不会带来更好的选择：推理努力增加了LLM购物代理的置信度而非正确性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22033\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22033\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly deployed as autonomous shopping agents that process multimodal product listings (consisting of visual and text data) and recommend purchases on behalf of consumers. Naturally, one might assume that models with more thinking power would make higher-quality purchasing decisions. To test this belief, we ask two questions about such agents: does asking a model to think harder make it choose better products, and does the confidence it reports tell us the likelihood it may be wrong? We benchmark ten frontier models on three product-choice benchmarks built from WebShop, Amazon\u0026#x27;s SQID and Wayfair\u0026#x27;s WANDS platforms to see if LLMs with more thinking power actually make better-quality product purchase decisions. Across all three benchmarks, we found that increasing the thinking effort does not increase decision quality in a statistically meaningful way. The same change in thinking effort raises stated confidence at a statistically significant level, so extra thinking buys confidence rather than correctness. We also measure the calibration of these models (how well their reported confidence percentage matches their true correctness percentage) in these tasks and show that most models are not well-calibrated at every effort level. We also find that errors are strongly shared: when one model errs in a task, several others tend to err on that same task. Furthermore, on tasks where several models all err, a large number of them pick the same wrong product.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLM）越来越多地被部署为自主购物代理，处理多模态产品列表（由视觉和文本数据组成）并代表消费者推荐购买。自然地，人们可能会假设具有更强思考能力的模型会做出更高质量的购买决策。为了检验这一信念，我们对这类代理提出两个问题：要求模型更努力地思考是否能让它选择更好的产品，它报告的置信度是否能告诉我们它出错的可能性？我们在基于WebShop、亚马逊的SQID和Wayfair的WANDS平台构建的三个产品选择基准上对十个前沿模型进行了基准测试，以查看具有更强思考能力的LLM是否真的能做出更高质量的产品购买决策。在所有三个基准上，我们发现增加思考努力并没有在统计学上有意义地提高决策质量。思考努力的相同变化在统计学上显著地提高了报告的置信度，因此额外的思考买到的是置信度而不是正确性。我们还测量了这些模型在这些任务中的校准情况（它们报告的置信度百分比与真实正确性百分比的匹配程度），并表明大多数模型在每个努力水平上都校准不佳。我们还发现错误是强烈共享的：当一个模型在一个任务中出错时，其他几个模型往往也会在同一任务中出错。此外，在多个模型都出错的任务中，大量模型选择了相同的错误产品。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估大型语言模型作为自主购物代理时，增加推理努力（思考能力）是否能提高产品选择决策的质量，以及模型报告的置信度是否能反映其出错的可能性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e在三个产品选择基准上测试了十个前沿LLM购物代理；发现增加思考努力并未在统计学上显著提高决策质量；发现增加思考努力在统计学上显著提高了模型报告的置信度；发现大多数模型在各个努力水平上校准不佳；发现模型间的错误具有强烈的共享性，常选择相同的错误产品。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要揭示了LLM购物代理的一个反直觉现象，即增加推理努力只能提升模型的自信程度（置信度），而无法提升实际决策的正确性，且模型存在严重的校准不良和错误共享问题。局限：摘要未提供十个前沿模型的具体名称、三个基准的具体准确率或置信度数值、错误共享的具体比例。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大型语言模型应用与电子商务\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. Learning Anisotropic Prediction Targets for Flow Models（学习流模型的各项异性预测目标）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17767\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17767\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFlow-based generative models are trained on a hand-chosen prediction target, such as the velocity, the noise, or the clean data. This choice strongly affects training and sample quality. We introduce Anisotropic Flow Models (AnisoFlow), which replaces a fixed prediction target with a fully learnable one. AnisoFlow learns to scale the noise component of the target anisotropically, assigning a separate nonnegative weight to each direction in a jointly learned basis. A closed-form map recovers the velocity from the network\u0026#x27;s prediction, leaving the architecture, flow-matching loss, and sampler unchanged. Since recovery is exact, training optimizes the target purely to make it easier for the network to predict. We theoretically analyze the resulting prediction error and predict that the preferred noise weight in each direction scales near-linearly with data variance, in agreement with the weights learned empirically in pixel space. AnisoFlow improves FID from 1.90 to 1.55 over the JiT baseline on ImageNet 256times256, by learning only the prediction target, without representation alignment or architectural changes. In pixel-space text-to-image generation, AnisoFlow improves image quality and, through better-conditioned velocity recovery, largely removes patch-seam artifacts under reduced-precision inference.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于流的生成模型在手选预测目标（如速度、噪声或干净数据）上进行训练。这种选择强烈影响训练和样本质量。我们引入了各向异性流模型（AnisoFlow），它将固定的预测目标替换为完全可学习的目标。AnisoFlow学习各向异性地缩放目标的噪声分量，在联合学习的基础中为每个方向分配单独的非负权重。一个闭式映射从网络的预测中恢复速度，保持架构、流匹配损失和采样器不变。由于恢复是精确的，训练纯粹为了优化目标以使其更容易被网络预测。我们从理论上分析了由此产生的预测误差，并预测每个方向上首选的噪声权重与数据方差呈近线性缩放，这与在像素空间中经验学习的权重一致。AnisoFlow仅通过学习预测目标，无需表示对齐或架构更改，就将ImageNet 256times256上的FID从JiT基线的1.90提高到1.55。在像素空间文本到图像生成中，AnisoFlow提高了图像质量，并通过条件更好的速度恢复，在降低精度的推理下很大程度上消除了拼块接缝伪影。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决基于流的生成模型中固定预测目标（如速度、噪声或干净数据）对训练和样本质量影响较大的问题，提出一种完全可学习的各向异性预测目标方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出AnisoFlow，用完全可学习的目标替换固定预测目标，各向异性地缩放噪声分量；闭式映射精确恢复速度，无需改变架构、损失或采样器；理论分析预测首选噪声权重与数据方差近线性缩放，与经验学习一致；在ImageNet 256times256上将FID从1.90降至1.55；在像素空间文生图中提升图像质量并消除低精度推理下的拼块接缝伪影。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：摘要表明AnisoFlow通过引入可学习的各向异性预测目标，在不改变模型架构和采样器的情况下，有效提升了流模型的生成质量（FID降低）并减少了低精度推理下的伪影。理论分析与经验结果相吻合。局限：摘要未提供联合学习基础的具体维度、闭式映射的具体数学形式、其他数据集上的FID结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e生成模型与计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. RICoT: Recurrent Interleaved Chain-of-Thought for Page Stream Segmentation（RICoT：用于页面流分割的循环交错思维链）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22382\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22382\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) have renewed interest in Page Stream Segmentation (PSS), splitting a multi-page file into its constituent documents. Yet published LLM methods still frame the task as boundary classification over one or a few neighboring pages, and commercial document-splitting APIs do not disclose their methods. We reimagine PSS for LLMs as a sequential process over the whole stream and propose RICoT (Recurrent Interleaved Chain-of-Thought), a prompting framework that works through the pages as a reader would: within a sliding window it reasons about each page and commits its boundary decision before moving on, and across windows it carries forward a compact record of what it has read, keeping per-call cost bounded. We also introduce FinancePSS-205, a benchmark of 205 real-world, de-identified financial page streams, to be released publicly. On FinancePSS-205, RICoT matches or outperforms pairwise and windowed prompting with the same backbone for each of three open-weight LLMs; on a TABME test subset, RICoT with GLM-5 reaches document F1 0.847 and boundary F1 0.915, above published zero-shot results. A 2B-parameter student, trained on a larger teacher\u0026#x27;s decisions with and without the page-level reasoning, performs comparably in both modes and comes within 0.05 document F1 of the strongest prompted model on FinancePSS-205.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型（LLMs）重新引发了人们对页面流分割（PSS）的兴趣，即将多页文件拆分为其组成文档。然而，已发表的LLM方法仍将任务界定为对一个或几个相邻页面的边界分类，且商业文档拆分API未公开其方法。我们将PSS重新构想为LLM在整个流上的顺序过程，并提出了RICoT（循环交错思维链），这是一种提示框架，它像读者一样处理页面：在滑动窗口内，它对每一页进行推理并在继续之前提交其边界决策，在窗口之间，它传递一个关于其已读内容的紧凑记录，从而保持每次调用的成本有界。我们还引入了FinancePSS-205，这是一个包含205个真实世界、去标识化的金融页面流的基准，将公开发布。在FinancePSS-205上，对于三个开放权重LLM中的每一个，RICoT匹配或优于具有相同主干的成对和窗口提示；在TABME测试子集上，带有GLM-5的RICoT达到文档F1 0.847和边界F1 0.915，高于已发表的零样本结果。一个20亿参数的学生模型，在较大教师模型的决策（有和没有页面级推理）上进行训练，在两种模式下表现相当，并在FinancePSS-205上距离最强提示模型仅差0.05的文档F1。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e页面流分割，即将多页文件拆分为其组成文档。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出RICoT提示框架，将PSS重构为顺序过程，通过滑动窗口和紧凑记录控制成本；引入包含205个真实金融页面流的FinancePSS-205基准；在FinancePSS-205和TABME测试子集上，RICoT在多个开放权重LLM上匹配或优于基线方法，且2B参数学生模型通过蒸馏教师决策取得了接近最强提示模型的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出RICoT通过滑动窗口和传递紧凑记录解决了LLM处理长页面流的成本问题，并在两个基准上验证了其有效性，同时展示了知识蒸馏在降低模型参数量时的潜力。关于具体的推理延迟、内存消耗对比或更广泛的领域泛化性等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/文档理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. BiCAT: Bimanual Coordination Action Tokenization（BiCAT：双臂协调动作分词）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23499\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23499\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoregressive vision-language-action (VLA) models predict discrete action tokens with the next-token objective of their vision-language backbone, so the action tokenizer defines the interface between the policy and the robot. In bimanual manipulation, the two arms share a repertoire of movements yet coordinate through complementary roles, and an action representation should capture both. However, most existing tokenizers encode both arms as a single concatenated action vector, in which motion patterns common to the two arms are not shared and cross-arm dependencies remain entangled within each token. The policy must therefore learn both aspects implicitly. We propose Bimanual Coordination Action Tokenization (BiCAT), which shares one motion representation across arms while conditioning each arm\u0026#x27;s tokens on its partner through symmetric cross-arm attention and a joint decoder. The policy then predicts all tokens of each arm in parallel, generating the left arm first and the right arm conditioned on it. Across ten RoboTwin 2.0 tasks and six real-world tasks on three embodiments, BiCAT achieves the highest success among the compared tokenizers. In simulation, it improves mean success by 17.6 percentage points over the strongest of eight baselines, with the largest gains on tasks that require close coordination between the arms, while requiring only 40.5 ms per action chunk. These results suggest that the action tokenizer is a natural place to model bimanual coordination.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自回归视觉-语言-动作（VLA）模型使用其视觉-语言主干的下一个词元目标来预测离散动作词元，因此动作分词器定义了策略与机器人之间的接口。在双臂操作中，两只手臂共享动作库但通过互补角色进行协调，动作表示应同时捕获这两者。然而，大多数现有的分词器将两只手臂编码为单个连接的动作向量，其中两臂共有的运动模式未被共享，且跨臂依赖关系在每个词元内保持纠缠。因此，策略必须隐式地学习这两个方面。我们提出了双臂协调动作分词（BiCAT），它在手臂之间共享一个运动表示，同时通过对称跨臂注意力和联合解码器将每只手臂的词元以其伙伴为条件。然后，策略并行预测每只手臂的所有词元，先生成左臂，然后以左臂为条件生成右臂。在十个RoboTwin 2.0任务和三个实体上的六个真实世界任务中，BiCAT在比较的分词器中取得了最高的成功率。在仿真中，与八个基线中最强的一个相比，它将平均成功率提高了17.6个百分点，在需要手臂紧密协调的任务上获得了最大的收益，同时每个动作块仅需40.5毫秒。这些结果表明，动作分词器是建模双臂协调的自然位置。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e双臂机器人操作中的动作分词，将动作表示为离散词元以用于自回归视觉-语言-动作模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出BiCAT动作分词器，通过共享运动表示、对称跨臂注意力和联合解码器显式建模双臂协调；在10个仿真任务和6个真实世界任务中取得最高成功率，仿真平均成功率比最强基线提高17.6个百分点，且推理速度快，每个动作块仅需40.5毫秒。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明BiCAT通过显式建模跨臂依赖和共享运动模式，解决了现有分词器中动作模式不共享和依赖纠缠的问题，显著提升了需要紧密协调的任务成功率。关于不同实体间泛化能力的详细对比、失败案例分析或真实世界任务中具体误差指标等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学/具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. Movie2Game-Bench: Holistic Evaluation of Film-to-Game Adaptation Beyond Playability（Movie2Game-Bench：超越可玩性的电影到游戏改编的全面评估）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24669\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24669\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAdapting a film into a game requires selecting source elements and translating them into player actions, rules, and feedback. We introduce Movie2Game-Bench (M2G-bench), a benchmark for evaluating film-to-game adaptation beyond playability. M2G-bench combines general evaluation, movie-specific evaluation, and playtesting by three GUI model players. The protocol connects source content to gameplay steps and implementation evidence, capturing both content preservation and interactive realization. The benchmark comprises 22 films and 658 source-specific reference items. Evaluating 14 models on the same films with their selected primary harnesses reveals complementary strengths in game quality, adaptation, and player experience. A shared weakness concerns playable sequences: this category has the lowest content-presence mean in all 14 models, averaging 37.9 out of 100 compared with 54.8 for iconic elements. Among judgments of retained emotionaldevelopment content, narrative choices account for 60.0% and scenario operation for 7.2%. These findings identify two linked priorities for film-to-game adaptation: preserving source situations that can support gameplay and connecting retained content to player actions and consequences.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e将电影改编为游戏需要选择源元素并将其转化为玩家动作、规则和反馈。我们引入了Movie2Game-Bench（M2G-bench），这是一个用于评估超越可玩性的电影到游戏改编的基准。M2G-bench结合了通用评估、电影特定评估以及由三个GUI模型玩家进行的试玩。该协议将源内容连接到游戏步骤和实现证据，捕获内容保留和交互式实现。该基准包含22部电影和658个源特定参考项。在相同电影上使用其选择的主要工具评估14个模型，揭示了它们在游戏质量、改编和玩家体验方面的互补优势。一个共同的弱点涉及可玩序列：该类别在所有14个模型中具有最低的内容存在均值，平均为100分中的37.9分，而标志性元素为54.8分。在保留的情感发展内容的判断中，叙事选择占60.0%，场景操作占7.2%。这些发现确定了电影到游戏改编的两个关联优先事项：保留能够支持游戏的源情境，以及将保留的内容与玩家动作和后果联系起来。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估电影到游戏的改编质量，涵盖内容保留和交互式实现，超越单纯的可玩性评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出M2G-bench基准，包含22部电影和658个参考项，结合通用评估、电影特定评估和GUI模型玩家试玩；评估了14个模型，发现可玩序列内容保留得分最低，平均为37.9分；指出改编的两大优先事项：保留支持游戏的源情境，以及将内容与玩家动作和后果相连。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出M2G-bench提供了一个多维度的评估框架，并通过14个模型的评估揭示了当前模型在可玩序列内容保留上的显著短板。关于GUI模型玩家试玩的具体设置细节、不同模型在特定电影上的表现差异以及评估协议中主观指标的一致性验证等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能/多模态生成与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. Out of Sight, Still in Mind: Token Compression for Omni-LLMs（眼不见，心仍记：全模态大语言模型的词元压缩）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2607.21179\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2607.21179\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eThe goal of this paper is to reduce the input token cost of Omni-modal large language models (Omni-LLMs) at inference time. Omni-LLMs reason jointly over audio, video and text, but the cost of the three streams is highly unbalanced: visual tokens account for the vast majority of the input, and are highly redundant. In this paper, we propose ReMo, a training-free framework that compresses visual tokens by redistributing their information across modalities: a visual token is kept only if its information appears nowhere else. ReMo achieves this in two ways: (i) it aligns audio and video in a shared space via closed-form calibration, and removes visual tokens already explained by the audio or by other visual tokens; and (ii) it replaces object-level visual tokens, identified by a lightweight object detector, with compact text proxies, short descriptions of each object and its location, conveying the same content in far fewer tokens. On Qwen2.5-Omni at two model scales, ReMo removes 54% of the input tokens with comparable accuracy. It performs comparably to the full-token model, reaching 101.2% and 101.4% of its average accuracy over five audio-visual benchmarks.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e本文的目标是在推理时降低全模态大型语言模型（Omni-LLMs）的输入词元成本。Omni-LLMs对音频、视频和文本进行联合推理，但三个流的成本高度不平衡：视觉词元占据了输入的绝大部分，且高度冗余。在本文中，我们提出了ReMo，一个免训练框架，通过跨模态重新分配视觉词元的信息来压缩它们：仅当视觉词元的信息在其他地方未出现时才保留它。ReMo通过两种方式实现这一点：（i）它通过闭式校准在共享空间中对齐音频和视频，并移除已由音频或其他视觉词元解释的视觉词元；（ii）它将由轻量级对象检测器识别的对象级视觉词元替换为紧凑的文本代理，即每个对象及其位置的简短描述，以更少的词元传达相同的内容。在两个模型规模的Qwen2.5-Omni上，ReMo移除了54%的输入词元，且精度相当。它的表现与全词元模型相当，在五个视听基准上达到了其平均精度的101.2%和101.4%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e全模态大语言模型推理时的视觉词元压缩，以降低输入词元成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练框架ReMo，通过跨模态信息重分配压缩视觉词元：利用闭式校准对齐音视频以移除冗余视觉词元，并用轻量级文本代理替换对象级视觉词元；在Qwen2.5-Omni上减少54%输入词元的同时，在五个视听基准上达到了全词元模型平均精度的101.2%和101.4%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ReMo通过跨模态对齐和对象级文本代理有效解决了视觉词元高度冗余的问题，在大幅降低计算成本的同时保持了模型性能。关于不同模态缺失情况下的鲁棒性测试、文本代理生成带来的额外延迟以及在更复杂长视频任务中的具体表现等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. Let Samples Sing in Chorus: Mitigating Spurious Correlations via Cross-view Consensus（让样本齐唱：通过跨视图共识缓解虚假相关性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22668\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22668\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDeep models often rely on spurious correlations that fail on underrepresented groups. Existing methods either correct human-specified bias attributes or infer unknown biases from the learned representation space. However, annotated attributes may differ from the shortcuts actually used by a model, while a single representation provides incomplete and potentially noisy evidence. Our key insight is that a bias obscured in one feature space may be clearer in another. In this work, we propose CHORD (Cross-view Harmonic Outlier Reversal for Debiasing), a multi-view framework that allows samples to \u0026quot;sing in chorus\u0026quot; across diverse representation spaces to achieve robust cross-view consensus. CHORD aggregates aggregates within-class partitions in each view, which is a proxy for specifying candidate biases, to debias the target representation and classifier without bias supervision. Experiments on seven benchmarks across vision, language, speech, and medical imaging show consistent improvements in worst-group accuracy. Code and checkpoints are available at https://github.com/davelee-uestc/chord_debiasing_public .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e深度模型通常依赖于在代表性不足的群体上失败的虚假相关性。现有方法要么纠正人类指定的偏差属性，要么从学习到的表示空间推断未知偏差。然而，注释属性可能与模型实际使用的捷径不同，而单一表示提供不完整且可能嘈杂的证据。我们的关键见解是，在一个特征空间中模糊的偏差在另一个特征空间中可能更清晰。在这项工作中，我们提出了CHORD（用于去偏的跨视图谐波异常值反转），这是一个多视图框架，允许样本在不同的表示空间中“齐唱”以实现稳健的跨视图共识。CHORD聚合每个视图中的类内划分（这是指定候选偏差的代理），以在没有偏差监督的情况下去偏目标表示和分类器。在视觉、语言、语音和医学成像的七个基准上的实验表明，最差组准确率得到了一致的提高。代码和检查点可在 https://github.com/davelee-uestc/chord_debiasing_public 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e缓解深度模型中的虚假相关性，提高模型在代表性不足群体上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CHORD多视图框架，通过在不同表示空间中聚合类内划分来实现跨视图共识，无需偏差监督即可去偏目标表示和分类器；在视觉、语言、语音和医学成像等7个基准上，一致地提高了最差组准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出CHORD利用多视图特征空间中偏差清晰度的差异，通过无监督的跨视图共识有效缓解了虚假相关性问题，且跨模态泛化性强。关于计算开销分析、不同视图选择对性能的影响以及在极端长尾分布下的具体表现等局限，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习/鲁棒性与公平性\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. IDEA: Intent-Dominance Evidence Audit for Inference-Time Backdoor Detection in GUI Agents（IDEA：用于GUI智能体推理时后门检测的意图-主导证据审计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24102\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24102\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eOrganizations increasingly deploy downloaded open-weight GUI agents. A backdoored agent passes acceptance tests on clean data and misbehaves only when a visual trigger appears on screen, turning an unvetted checkpoint into a supply-chain risk. However, existing sample-level detectors target image classifiers and CLIP-style encoders, leaving step-level backdoor detection for GUI agents unaddressed. On clean steps, the instruction drives the action; when an unreferenced screen region hijacks the step, the instruction loses control over the decision state or that region dictates it instead. We term this signature intent--evidence dominance inversion and propose IDEA (Intent-Dominance Evidence Audit) to detect backdoor activation at inference time for each step without trigger knowledge or attack data. Specifically, Intent Counterfactual Probing (ICP) measures how far redirected instructions move the decision state, and Region Causal Audit (RCA) quantifies how far ablating a candidate region moves it. A gated conformal score compares both displacements against clean steps at the same distance from the clean manifold, providing a finite-sample false-positive guarantee. Extensive experiments on Qwen2.5-VL-3B across five attack families show that IDEA consistently detects backdoor activation under a controlled false-positive rate and outperforms state-of-the-art detection methods, while localizing the trigger region for every alarm and adding only modest inference overhead.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e组织越来越多地部署下载的开源权重GUI智能体。被植入后门的智能体在干净数据上通过验收测试，并且仅在屏幕上出现视觉触发器时表现异常，从而将未经审查的检查点转化为供应链风险。然而，现有的样本级检测器针对图像分类器和CLIP风格的编码器，使得GUI智能体的步骤级后门检测仍未得到解决。在干净步骤中，指令驱动动作；当未被引用的屏幕区域劫持该步骤时，指令失去对决策状态的控制，或者该区域取而代之地决定它。我们将这种特征称为意图-证据主导反转，并提出IDEA（意图-主导证据审计），以在推理时检测每个步骤的后门激活，而无需触发器知识或攻击数据。具体而言，意图反事实探测（ICP）测量重定向指令使决策状态移动的距离，区域因果审计（RCA）量化消融候选区域使其移动的距离。门控共形分数将这两种位移与距离干净流形相同距离的干净步骤进行比较，提供有限样本的假阳性保证。在Qwen2.5-VL-3B上跨五个攻击系列的广泛实验表明，IDEA在受控的假阳性率下一致地检测后门激活，并优于最先进的检测方法，同时为每个警报定位触发区域，并且仅增加适度的推理开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在推理时检测GUI智能体每个步骤的后门激活，而无需触发器知识或攻击数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出意图-证据主导反转特征，并设计IDEA方法用于步骤级后门检测。2. 引入意图反事实探测（ICP）和区域因果审计（RCA）量化决策状态位移。3. 使用门控共形分数提供有限样本的假阳性保证。4. 在Qwen2.5-VL-3B上跨五个攻击系列实验，实现受控假阳性率下的后门检测，优于现有方法，并能定位触发区域且推理开销适度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明IDEA有效解决了GUI智能体步骤级后门检测的问题，通过ICP和RCA量化位移，并利用共形分数控制假阳性。局限性方面，摘要未提供关于该方法在其他基础模型上的泛化能力、对更复杂或未知攻击家族的防御效果，以及“适度”推理开销的具体量化数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能安全与GUI智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. Choosing Quantized Code LLMs by File Size and Energy per Solved Task（根据文件大小和每解决任务能耗选择量化代码大语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17605\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17605\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA developer running a code assistant on a laptop downloads one model file, and local inference moves the energy of every request onto that machine. A common rule says a larger model at lower precision tends to beat a smaller one at higher precision. We ran 24 GGUF files of Qwen2.5-Coder at four sizes on a fanless MacBook Air M2 and priced each in energy per solved task on 542 EvalPlus tasks. The result is a selection guide indexed by Ollama\u0026#x27;s listed file size, with an evidence label on each pick. At 1 and 2 GB it picks the q4_K_M files of the 1.5B and 3B models, both on the correctness and energy frontier under every accounting. At 3 GB as listed, the larger-model rule picks 7B-q2_K, the only measured 7B file that fits, and there it does not pay. That file brings no significant gain in solves over the 2 GB pick, 3B-q4_K_M, and the 90% CI limits any 3B-q4_K_M deficit to 2.4 points. Yet 7B-q2_K needs 2.03 times the energy per solved task on CPU, GPU and memory rails, or 1.66 to 1.81 times on whole-system power. On HumanEval+, five alternating session pairs give a ratio of 1.925 against 1.956 in the main grid. At 8 GB, 7B-q6_K buys a significant gain over the 2 GB pick at a higher energy price. From 1.5B up, q4_K_M trails the highest precision measured at its size by less than 3 points (90% CI). We release per-task results, power logs and the analysis script.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在笔记本电脑上运行代码助手的开发者下载一个模型文件，本地推理将每个请求的能耗转移到该机器上。一个常见的规则是，较低精度的较大模型往往能击败较高精度的较小模型。我们在无风扇MacBook Air M2上运行了四种大小的24个Qwen2.5-Coder的GGUF文件，并根据542个EvalPlus任务中每个解决任务的能耗对它们进行定价。结果是一个由Ollama列出的文件大小索引的选择指南，每个选择都带有证据标签。在1和2 GB时，它选择了1.5B和3B模型的q4_K_M文件，在每种计算下均处于正确性和能耗前沿。在列出的3 GB时，较大模型规则选择了7B-q2_K，这是唯一符合的测量7B文件，但这并不划算。该文件在解决数量上相较于2 GB选择（3B-q4_K_M）没有显著增益，且90%置信区间将任何3B-q4_K_M的劣势限制在2.4分以内。然而，7B-q2_K在CPU、GPU和内存轨道上每解决任务需要2.03倍的能耗，或在整机功耗上需要1.66到1.81倍的能耗。在HumanEval+上，五个交替会话对在主流网格中给出1.925对1.956的比率。在8 GB时，7B-q6_K以更高的能耗代价获得了相较于2 GB选择的显著增益。从1.5B起，q4_K_M落后于其尺寸下测量的最高精度不到3分（90%置信区间）。我们发布了每任务结果、功耗日志和分析脚本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和选择量化代码大语言模型，以在本地推理中平衡模型文件大小、任务解决正确率与能耗。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 在MacBook Air M2上评估了24个Qwen2.5-Coder GGUF文件在542个EvalPlus任务上的表现与能耗。2. 提供了基于Ollama文件大小的模型选择指南，挑战了“低精度大模型优于高精度小模型”的常见规则（如3GB下7B-q2_K能耗高但收益不显著）。3. 发现q4_K_M量化格式在正确性和能耗上表现优异，与同尺寸最高精度差距小于3分。4. 开源了每任务结果、功耗日志和分析脚本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了详细的文件大小、能耗倍数（如2.03倍、1.66-1.81倍）和置信区间（90% CI限制在2.4分或3分以内）等具体数据，证明了其选择指南的可靠性。局限性方面，摘要未提供该指南在其他硬件平台（如非M2芯片或带风扇设备）上的适用性，未提及对更长上下文或更复杂代码生成任务的评估，也未说明“定价”的具体经济成本换算。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型评估与系统优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. AVTR: Adaptive Multimodal Reasoning with Visual Imagination（AVTR：具有视觉想象力的自适应多模态推理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24161\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24161\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVision-Language Models increasingly rely on textual reasoning to solve advanced multimodal tasks. Despite its effectiveness, this paradigm faces two fundamental limitations. First, relying on textual reasoning alone can limit perceptual ability in vision-centric questions, where accurate answers depend on interpreting task-relevant visual evidence. Second, applying textual reasoning uniformly across inputs overlooks question-dependent variation in both reasoning modality and depth, often producing verbose and unnecessary traces when little logical inference is required. To this end, we propose Adaptive Visual-Textual Reasoning (AVTR), which introduces visual imagination as a complementary reasoning modality to textual thinking, enabling the model to revisit its visual observations and distill the salient evidence through generative visual reflection. Furthermore, we formulate reasoning-modality selection as a learned routing problem, allowing a single policy to adaptively harness the complementary strengths of visual reflection and textual reasoning in response to the perceptual and inferential demands of the input. Across 16 benchmarks, AVTR improves the average score by 4.5 points over Qwen3.5 baseline, while reducing inference latency by 33\\%. It also scales effectively into a smaller size backbone, outperforming the evaluated 2B-scale baselines.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉-语言模型越来越依赖文本推理来解决高级多模态任务。尽管其有效，但这种范式面临两个基本局限。首先，仅依赖文本推理会限制以视觉为中心的问题中的感知能力，而准确的答案取决于解释与任务相关的视觉证据。其次，在所有输入上统一应用文本推理忽略了推理模态和深度上依赖于问题的变化，当只需要很少的逻辑推理时，通常会产生冗长且不必要的轨迹。为此，我们提出了自适应视觉-文本推理（AVTR），它引入视觉想象作为文本思考的补充推理模态，使模型能够重新审视其视觉观察，并通过生成式视觉反思提炼显著证据。此外，我们将推理模态选择表述为一个学习路由问题，允许单一策略根据输入的感知和推理需求，自适应地利用视觉反思和文本推理的互补优势。在16个基准测试中，AVTR比Qwen3.5基线平均得分提高了4.5分，同时将推理延迟降低了33%。它还能有效地扩展到更小的主干尺寸，优于评估的2B规模基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视觉-语言模型在高级多模态任务中仅依赖文本推理导致的感知能力受限和推理轨迹冗余问题，实现自适应的多模态推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出自适应视觉-文本推理（AVTR），引入视觉想象作为补充推理模态，通过生成式视觉反思提炼显著视觉证据。2. 将推理模态选择建模为学习路由问题，使单一策略能根据输入需求自适应结合视觉反思与文本推理。3. 在16个基准测试中，相比Qwen3.5基线平均得分提升4.5分，推理延迟降低33%。4. 能够有效扩展至更小尺寸的主干网络，优于2B规模的基线模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了现有纯文本推理范式的两个局限，并提出了结合视觉想象和学习路由的AVTR方法，实验结果显示了显著的性能提升（+4.5分）和延迟降低（-33%）。局限性方面，摘要未提供16个基准测试的具体名称和各项细分得分，未说明“视觉想象”和“生成式视觉反思”的具体计算开销，也未提及在极端视觉噪声或需要极深逻辑推理场景下的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型与视觉推理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. PGPO: Prototype-Guided Progressive Obfuscation for Privacy-Preserving LLM-Enhanced Recommendation（PGPO：用于隐私保护LLM增强推荐的原型引导渐进式混淆）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23236\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23236\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLM-enhanced recommender systems encode item side information into semantic embeddings, but these embeddings may leak sensitive textual attributes through inversion attacks. Existing input-side defenses rely on trusted collection or local token perturbation, often disrupting the inter-item semantic topology needed for recommendation. To address it, we introduce relational fidelity as the key objective, requiring semantic shift for privacy while preserving relative item relations for utility. Based on this principle, we propose prototype-guided progressive obfuscation (PGPO), which learns topology-aware obfuscation anchors for high-influence prototype words and propagates them through a static semantic graph. PGPO is optimized with GRPO using individual dissimilarity, structural consistency, and semantic constraint rewards. Experiments on two benchmarks show strong inversion defense with near-upper-bound recommendation performance. The code is available at https://github.com/Shengxiang-Lin/PGPO.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLLM增强的推荐系统将项目侧信息编码为语义嵌入，但这些嵌入可能通过反转攻击泄露敏感的文本属性。现有的输入端防御依赖于受信任的收集或局部token扰动，通常会破坏推荐所需的项间语义拓扑。为了解决这个问题，我们引入关系保真度作为关键目标，要求为了隐私进行语义偏移，同时保留相对项关系以保证效用。基于这一原则，我们提出了原型引导渐进式混淆（PGPO），它为高影响力原型词学习拓扑感知的混淆锚点，并通过静态语义图传播它们。PGPO使用GRPO进行优化，利用个体相异性、结构一致性和语义约束奖励。在两个基准测试上的实验表明，其具有强大的反转防御能力，同时推荐性能接近上限。代码可在 https://github.com/Shengxiang-Lin/PGPO 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e防止LLM增强推荐系统中的语义嵌入通过反转攻击泄露敏感文本属性，同时保持推荐所需的项间语义拓扑和推荐效用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 引入“关系保真度”作为关键目标，在实现隐私保护的语义偏移的同时保留相对项关系。2. 提出原型引导渐进式混淆（PGPO），为高影响力原型词学习拓扑感知的混淆锚点并通过静态语义图传播。3. 使用GRPO结合个体相异性、结构一致性和语义约束奖励进行优化。4. 在两个基准测试上实现了强大的反转防御，且推荐性能接近上限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有输入端防御破坏项间语义拓扑的问题，提出PGPO通过原型引导和图传播在隐私和效用之间取得平衡，并使用GRPO优化。局限性方面，摘要未提供两个基准测试的具体名称、数据集规模、反转攻击的具体类型和成功率指标，也未详细说明“接近上限”的具体数值差距以及GRPO训练的计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e推荐系统隐私保护与自然语言处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. A Foundation Model to Measure and Predict Human Behaviour（一个用于测量和预测人类行为的基础模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24830\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24830\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) are increasingly used to infer psychological attributes, predict individual behaviour, and simulate human populations. However, despite generating plausible responses, they often misrepresent individuals and distort population statistics. Here we introduce Chiron, a foundation model to measure and predict human behaviour. We jointly fine-tune an LLM to represent psychological constructs, predict individual behaviour, and align population response distributions with human statistics. The training and evaluation data span 36 behavioural domains and 78 social science experiments, comprising 288,307 person records, 1,411,750 atomic behavioural decisions, and 99,953 psychometric assessments over 109 psychological constructs. In our evaluations, Chiron\u0026#x27;s psychological measurements agree more closely with human self-reports and exhibit fewer biases that undermine psychometric validity. It predicts individual behaviour more accurately than frontier LLMs (up to 28.4% relative improvement). In simulations of social science experiments, it more accurately captures the direction and magnitude of human experimental effects (82.2--94.3% lower effect-size estimation error). Together, these results establish Chiron as a unified computational instrument for measuring and predicting human behaviour.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLMs）越来越多地用于推断心理属性、预测个体行为并模拟人类群体。然而，尽管能生成看似合理的响应，它们经常错误表征个体并扭曲群体统计数据。在此，我们引入Chiron，一个用于测量和预测人类行为的基础模型。我们联合微调一个LLM以表征心理构念、预测个体行为，并使群体响应分布与人类统计数据对齐。训练和评估数据跨越36个行为领域和78个社会科学实验，包含288,307条个人记录、1,411,750个原子行为决策，以及针对109个心理构念的99,953项心理测量评估。在我们的评估中，Chiron的心理测量与人类自我报告更一致，并表现出更少破坏心理测量有效性的偏差。它比前沿LLM更准确地预测个体行为（相对提升高达28.4%）。在社会科学实验的模拟中，它更准确地捕捉人类实验效应的方向和大小（效应量估计误差降低82.2%至94.3%）。综合这些结果，确立了Chiron作为测量和预测人类行为的统一计算工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e测量和预测人类行为，包括推断心理属性、预测个体行为以及模拟人类群体，同时纠正现有LLM在表征个体和扭曲群体统计方面的缺陷。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Chiron基础模型，联合微调LLM以表征心理构念、预测个体行为并对齐群体响应分布。2. 训练和评估数据规模庞大，涵盖36个行为领域、78个社会科学实验、超28.8万条个人记录和超141万个原子行为决策。3. 心理测量与人类自我报告更一致，偏差更少。4. 个体行为预测准确率比前沿LLM提升高达28.4%，社会科学实验效应量估计误差降低82.2%至94.3%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细列出了庞大的训练和评估数据规模（如288,307条记录、1,411,750个决策），并提供了具体的性能提升数字（28.4%相对提升，82.2-94.3%误差降低），证明了Chiron在人类行为预测上的有效性。局限性方面，摘要未提供36个行为领域和78个实验的具体名称，未说明模型在不同文化、年龄或特定人口统计学群体中的泛化能力和偏差情况，也未提及模型推理时的计算资源消耗。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算社会科学与人类行为建模\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. Recurrent Domain Incremental Adaptation of Time-Series Foundation Models（时间序列基础模型的循环域增量适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24075\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24075\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePretrained Time-Series Foundation Models (TSFMs) provide strong representations for downstream classification tasks. Yet adapting a TSFM under changing operating conditions remains challenging. A model must improve on each newly observed condition without sacrificing conditions it has already learned, often from only a small labeled calibration set and without knowing the operating condition at inference time. We find that this difficulty has an important geometric structure. Under an operating-condition shift, the embedding space of a TSFM does not move uniformly: some local regions change substantially, while others remain nearly unchanged. Consequently, a global adaptation can unnecessarily move embeddings that were already correctly classified. To address this, we propose the novel PACT (Piecewise Adaptation via Chart Transport). PACT partitions the frozen source embedding space into local charts and learns lightweight residual transports for the regions affected by each new condition. An explicit identity path is always retained, and a learned gate softly selects among the identity and accumulated transports for each input. The pretrained TSFM encoder, classifier head, and previously learned transports remain fixed. With only 5% labeled calibration data per arriving condition and no condition identity at test time, PACT maintains an average macro-F1 above 0.95 across a four-condition bearing-fault stream. Under homogeneous tasks and label spaces, similar retention-adaptation behavior is observed across public benchmarks. Code is available at https://github.com/Sachithx/PACT.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e预训练的时间序列基础模型（TSFMs）为下游分类任务提供了强大的表示。然而，在不断变化的操作条件下适应TSFM仍然具有挑战性。模型必须在每个新观察到的条件下进行改进，而不牺牲它已经学到的条件，通常仅从一小部分带标签的校准集中进行，并且在推理时不知道操作条件。我们发现这种困难具有重要的几何结构。在操作条件偏移下，TSFM的嵌入空间不会均匀移动：一些局部区域发生实质性变化，而其他区域几乎保持不变。因此，全局适应可能会不必要地移动已经正确分类的嵌入。为了解决这个问题，我们提出了新颖的PACT（通过图表传输的分段适应）。PACT将冻结的源嵌入空间划分为局部图表，并为受每个新条件影响的区域学习轻量级残差传输。始终保留显式身份路径，并且学习的门在每个输入的身份和累积传输之间进行软选择。预训练的TSFM编码器、分类器头和先前学习的传输保持固定。在每个到达条件仅有5%带标签校准数据且在测试时没有条件身份的情况下，PACT在四条件轴承故障流中保持平均macro-F1高于0.95。在同质任务和标签空间下，在公开基准测试中观察到类似的保留-适应行为。代码可在 https://github.com/Sachithx/PACT 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在不断变化的操作条件下，利用少量带标签校准数据对时间序列基础模型进行循环域增量适应，同时保持对已学条件的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现TSFM嵌入空间在操作条件偏移下具有非均匀移动的几何结构；提出PACT方法，将嵌入空间划分为局部图表并学习轻量级残差传输；保留显式身份路径并通过门控机制软选择；在仅有5%校准数据且测试时未知条件身份的情况下，在四条件轴承故障流中保持平均macro-F1高于0.95。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出全局适应会不必要地移动已正确分类的嵌入，PACT通过分段适应解决了这一问题。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e时间序列分析 / 持续学习 / 领域适应\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. Replay, Don\u0026#x27;t Resample: Off-Policy Consolidation of Long-Horizon RL Experts（重放，不要重采样：长视界强化学习专家的离策略整合）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24059\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24059\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFrontier post-training follows a common recipe: train one expert per domain with reinforcement learning (RL), then consolidate the experts into one model via multi-teacher on-policy distillation (MOPD). Such consolidation is expensive: the student samples in every environment again, an expert scores every sampled token, and the student inherits the drift of the final experts. Yet we argue that the experts\u0026#x27; RL runs have already produced what consolidation needs: rollouts with their sampling probabilities and rewards, in the order the experts learned from them. We propose multi-expert replay policy distillation (MRPD), which replays these training logs through the student in the experts\u0026#x27; order. At each step, the policy gradient is recomputed on these scored trajectories, and the final experts\u0026#x27; distributions are distilled at the logged prefixes. Following the experts\u0026#x27; own trajectory reduces the training-inference mismatch and keeps the student within the clip range, so the replay is off-policy in origin but quasi-on-policy throughout consolidation. MRPD samples nothing and calls no environment or reward model: the trainer is the sole process, and consolidating the experts costs only about a seventh of the compute used to train them. On three long-horizon agentic domains (reasoning, search and SQL), MRPD yields the best student model, substantially outperforming online RL baselines, and surpassing MOPD from the same experts at a fraction of MOPD\u0026#x27;s cost. Our analysis on the same logs shows that the replayed trajectories carry most of the gain, and that both the policy gradient and the distillation term add to it. Most interestingly, the order of the logs matters more than their amount or rewards, suggesting that expert training logs are a curriculum, not a data mixture.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e前沿的后训练遵循一个常见的配方：使用强化学习（RL）为每个领域训练一个专家，然后通过多教师在线策略蒸馏（MOPD）将专家整合为一个模型。这种整合非常昂贵：学生在每个环境中再次采样，专家对每个采样的token进行评分，并且学生继承了最终专家的漂移。然而我们认为，专家的RL运行已经产生了整合所需的内容：具有其采样概率和奖励的展开，按照专家学习它们的顺序。我们提出了多专家重放策略蒸馏（MRPD），它按专家的顺序通过这些训练日志在学生中进行重放。在每一步，在这些评分轨迹上重新计算策略梯度，并在记录的前缀处蒸馏最终专家的分布。遵循专家自身的轨迹减少了训练-推理的不匹配，并使学生在裁剪范围内，因此重放最初是离策略的，但在整个整合过程中是准在线策略的。MRPD不进行任何采样，也不调用任何环境或奖励模型：训练器是唯一的过程，整合专家的成本仅约为训练它们所用计算量的七分之一。在三个长视界智能体领域（推理、搜索和SQL），MRPD产生了最好的学生模型，大幅优于在线RL基线，并以MOPD成本的一小部分超越了来自相同专家的MOPD。我们对相同日志的分析表明，重放的轨迹带来了大部分增益，并且策略梯度和蒸馏项都对其有所增加。最有趣的是，日志的顺序比其数量或奖励更重要，这表明专家训练日志是一个课程，而不是数据混合。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将多个通过强化学习训练的长视界专家模型整合为一个单一的学生模型，同时降低计算成本并避免在线策略蒸馏的昂贵开销和模型漂移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出多专家重放策略蒸馏（MRPD），按专家学习顺序重放训练日志；重放过程不进行采样、不调用环境或奖励模型，计算成本仅为训练专家的约七分之一；在推理、搜索和SQL三个长视界领域大幅优于在线RL基线，并以更低成本超越MOPD；发现日志顺序比数量或奖励更重要，表明训练日志起到课程作用。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明MRPD通过重放轨迹减少了训练-推理不匹配，且策略梯度和蒸馏项共同贡献了性能增益。局限性摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习 / 模型蒸馏 / 模型整合\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e48. Kezek: Splitting Mono Two-Person Conversations into Per-Speaker Tracks for Full-Duplex Dialogue Data（Kezek：将单声道双人对话拆分为全双工对话数据的每说话人轨道）\u003c/h3\u
