    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. Jeveration: System One Models Now Generate（Jeveration：系统一模型现可生成图像）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 110 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24738\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24738\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eSystem One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent whole. We therefore condition all positions on a shared random state to coordinate parallel predictions, so that each draw yields a different but coherent image. Since the model tends to ignore this state under direct image supervision, we first learn a distribution over discrete image codes to guide single-pass generation. Beyond text-to-image generation, we further unify image-to-image generation and dense prediction within the same architecture, so that one checkpoint supports all three tasks, each in one forward pass. Experiments show that Jeveration generates a 512x512 image in 78 ms, up to 122x faster than existing unified models, while maintaining competitive image quality and dense prediction performance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e诸如Jev之类的系统一模型通过快速、并行的预测返回决策。在本文中，我们介绍了Jeveration，展示了相同的决策范式也可以在单次前向传播中生成高质量图像。Jeveration构建于冻结的视觉-语言模型之上，将其视觉-语义知识重新用于整体图像生成。关键挑战在于保持全局一致性。单个提示允许许多有效的图像，但并行预测必须收敛于一个连贯的整体。因此，我们将所有位置条件化于共享的随机状态以协调并行预测，使得每次抽取都能产生不同但连贯的图像。由于该模型在直接图像监督下倾向于忽略该状态，我们首先学习离散图像代码上的分布以引导单次生成。除了文本到图像的生成，我们进一步在同一架构内统一了图像到图像的生成和密集预测，使得一个检查点支持所有三种任务，且每种任务都在单次前向传播中完成。实验表明，Jeveration在78毫秒内生成512x512的图像，比现有的统一模型快达122倍，同时保持了具有竞争力的图像质量和密集预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在单次前向传播中生成高质量图像，并统一文本到图像生成、图像到图像生成和密集预测任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Jeveration，利用冻结的视觉-语言模型在单次前向传播中生成高质量图像。2. 通过将位置条件化于共享随机状态来协调并行预测，保持全局一致性。3. 学习离散图像代码分布以引导单次生成，解决直接图像监督下模型忽略随机状态的问题。4. 统一架构支持文本到图像、图像到图像和密集预测三种任务。5. 生成512x512图像仅需78毫秒，比现有统一模型快达122倍，且保持竞争力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Jeveration在速度和多任务统一上具有显著优势。然而，摘要未提供关于模型参数量、具体视觉-语言模型基座、以及在不同复杂提示下图像质量的具体量化评估细节。此外，摘要未提及该模型在生成复杂空间关系或长文本提示时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与多模态生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. The Resolution Hypothesis: Agent Evolution\u0026#x27;s Key Is Identifying Improvements（分辨率假说：智能体进化的关键在于识别改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 35 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23068\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23068\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across seven evolution methods and six models (over 10M LLM calls), we find support for the hypothesis at both levels where evaluation scores are used. At the candidate level (choosing artifacts), helpful candidate artifacts exist, but selection is no better than random at telling them from harmful ones, so errors accumulate across rounds. At the method level (ranking methods), typical margins of a few percentage points are smaller than the difference between two independent runs of the same method, so published rankings often rest on luck. Together, these findings indicate that agent evolution is often bottlenecked by reliably identifying improvements. This calls for a shift in how we develop and evaluate self-improving agents, from designing ever more candidate improvement systems to making true improvements detectable and accumulable.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e智能体进化遵循一个简单的循环：提议者编写候选工件（提示、技能、记忆），选择器接受得分较高的工件。这个循环已显示出前景，但实践者面临一个难题：方法在论文中互有胜负，且进化在某些任务上经常无法自举。我们将这个难题追溯到分辨率假说：智能体进化停滞不是因为方法未能提出更好的工件，而是因为嘈杂的评估无法可靠地识别它们。在七种进化方法和六个模型（超过1000万次大语言模型调用）中，我们在使用评估分数的两个层面上发现了支持该假说的证据。在候选层面（选择工件），存在有益的候选工件，但选择器在区分它们与有害工件方面并不比随机选择好，因此误差在多轮中累积。在方法层面（对方法排名），几个百分点的典型边际小于同一方法两次独立运行之间的差异，因此发表的排名通常依赖于运气。综上所述，这些发现表明智能体进化通常受制于可靠地识别改进。这呼吁在开发和评估自我改进智能体的方式上发生转变，从设计越来越多的候选改进系统转向使真正的改进可检测和可累积。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探究智能体进化过程中停滞的原因，验证“分辨率假说”，即智能体进化受阻是因为嘈杂的评估无法可靠识别改进，而非提议者无法提出更好的工件。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出“分辨率假说”，指出智能体进化停滞的瓶颈在于嘈杂的评估无法可靠识别改进。2. 在候选层面发现选择器区分有益和有害工件的能力不优于随机，导致误差累积。3. 在方法层面发现方法间得分差异小于独立运行的方差，表明现有排名具有偶然性。4. 基于超过1000万次大语言模型调用，在七种进化方法和六个模型上验证了假说。5. 呼吁将研究重点从设计候选改进系统转向使真正的改进可检测和可累积。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了大规模实验支持分辨率假说，揭示了当前智能体进化评估的不可靠性。但摘要未提供具体是哪些进化方法或模型表现最差，也未提出解决评估噪声的具体技术方案，仅指出了研究方向应从设计改进系统转向提高检测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. ALIVE: Making Streaming Video Models Interactive（ALIVE：使流式视频模型具备交互能力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 32 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21366\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21366\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and local advantages to refine decisions, responses, and silence across multi-turn interactions. We also introduce FSI-Bench to evaluate feedback seeking and subsequent task completion. ALIVE achieves the highest overall scores among the compared models on four public benchmarks and FSI-Bench, demonstrating strong streaming understanding and interactive capabilities.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频大语言模型可以持续观察世界，但通常孤立地处理用户请求。我们引入了ALIVE，一个支持主动监控、流式任务协调和寻求反馈交互的交互式流式视频模型。我们构建了ALIVE-SFT-288K和ALIVE-RL-3K用于两阶段训练。对比监督微调教授何时以及如何响应，而带有行为对齐信用分配（BACA）的强化学习结合了轨迹级和局部优势，以在多轮交互中优化决策、响应和沉默。我们还引入了FSI-Bench来评估寻求反馈和后续任务完成情况。ALIVE在四个公共基准和FSI-Bench上的比较模型中取得了最高的总体分数，展示了强大的流式理解和交互能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发一种支持主动监控、流式任务协调和寻求反馈交互的交互式流式视频模型（ALIVE），以提升流式视频大语言模型的多轮交互和任务协调能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出ALIVE，支持主动监控、流式任务协调和寻求反馈的交互。2. 构建ALIVE-SFT-288K和ALIVE-RL-3K数据集进行两阶段训练。3. 采用对比监督微调决定响应时机和方式，并使用行为对齐信用分配（BACA）强化学习优化多轮交互中的决策、响应和沉默。4. 提出FSI-Bench基准评估寻求反馈及后续任务完成情况。5. 在四个公共基准和FSI-Bench上取得最高总体分数。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ALIVE在流式视频理解和交互方面取得了领先性能，并提出了新的训练方法和评估基准。然而，摘要未提供四个公共基准的具体名称、FSI-Bench的详细构成，也未说明BACA方法的具体实现细节以及模型在长视频流处理时的计算开销或局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习与视频理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling（PROLA：用于预测性时空天气降尺度的主正交低秩自适应）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 27 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.11318\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.11318\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eHigh-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution trajectories. To this end, we propose a framework that decomposes prediction into spatial and temporal stages using a shared pretrained backbone, fixed numerical scaffolds, and lightweight residual heads. For backbone adaptation, we introduce PROLA (PRincipal-Orthogonal Low-rank Adaptation), which allocates a fixed low-rank budget between pretrained weights\u0026#x27; principal directions and their orthogonal complement. PROLA further rescales rank-1 optimizer updates using gradient signals, improving adaptation without increasing trainable rank. Experiments in the PSWD setting show that PROLA outperforms representative low-rank adaptation baselines. Further experiments across diverse datasets and tasks support the broader applicability of PROLA, showing that its benefits extend beyond the primary weather downscaling setting.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e高分辨率天气预测对于解析粗粒度全球预测所遗漏的局部大气模式非常重要。大型预训练天气骨干网络改善了全球预测，但调整它们以从最近的粗粒度状态生成未来高分辨率场仍然具有挑战性且成本高昂。我们将这种设置形式化为预测性时空天气降尺度（PSWD），这是一项在预测未来高分辨率轨迹的同时联合细化空间和时间分辨率的任务。为此，我们提出了一个框架，使用共享的预训练骨干网络、固定的数值支架和轻量级残差头将预测分解为空间和时间阶段。对于骨干网络自适应，我们引入了PROLA（主正交低秩自适应），它在预训练权重的主方向及其正交补之间分配固定的低秩预算。PROLA进一步使用梯度信号重新缩放秩为1的优化器更新，在不增加可训练秩的情况下改善自适应。在PSWD设置中的实验表明，PROLA优于具有代表性的低秩自适应基线。跨多个数据集和任务的进一步实验支持了PROLA的更广泛适用性，表明其优势超出了主要的天气降尺度设置。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决从粗粒度状态预测未来高分辨率天气场的挑战，提出预测性时空天气降尺度（PSWD）任务，并开发PROLA（主正交低秩自适应）方法以高效微调预训练天气骨干网络。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 形式化预测性时空天气降尺度（PSWD）任务，联合细化时空分辨率并预测未来高分辨率轨迹。2. 提出分解预测为空间和时间阶段的框架，使用共享预训练骨干、固定数值支架和轻量级残差头。3. 提出PROLA（主正交低秩自适应），在预训练权重的主方向和正交补之间分配固定低秩预算。4. PROLA利用梯度信号重新缩放秩为1的优化器更新，在不增加可训练秩的情况下提升自适应效果。5. 实验证明PROLA在PSWD中优于代表性低秩自适应基线，且在多个数据集和任务中具有广泛适用性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了PROLA在天气降尺度及其他任务中的有效性和广泛适用性，通过主方向和正交补的预算分配及梯度重缩放提升了低秩微调效率。但摘要未提供具体的预训练骨干网络名称、PSWD任务中使用的具体数据集名称、评估指标，以及PROLA相比基线提升的具体数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e地球科学与人工智能交叉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development（Game2Player：通过环境-玩家协同开发扩展视觉智能体的游戏体验）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 25 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24154\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24154\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGames are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at scale. In the Game2Player loop, a Builder agent adapts existing web games, exposes their internal state, and defines tasks with state-based progress measures and success checks. A Coding Player and a VLM Player then attempt the tasks and report problems to the Builder for repair, so that play serves as both environment validation and training data collection. With Game2Player, we build 568 verified web games with 3,436 tasks, collect 15.7K trajectories (307 hours of gameplay), and hold out 50 games as the benchmark PlayerBench. To evaluate the collected experience as training data, we train VLM agents with progress-weighted SFT, assigning greater weight to steps that advance task progress. Game2Player-9B improves progress from 14.3% to 31.2% on PlayerBench and from 30.0% to 53.1% on the external GameWorld benchmark. More broadly, our work suggests a path for visual agents to scale their gameplay experience by building, verifying, and learning from existing game worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e游戏是视觉智能体的丰富测试平台，需要感知、长期规划和精确控制。然而，收集人类游戏数据成本高昂，且从游戏视频中学习需要推断缺失的动作。现有数据集也涵盖有限的游戏范围，通常没有明确的任务或可验证的结果。为了解决这些差距，我们引入了Game2Player，一个协同开发游戏环境和玩家的框架，以大规模收集多样且可验证的游戏体验。在Game2Player循环中，构建者智能体改编现有的网页游戏，暴露其内部状态，并定义具有基于状态的进度度量和成功检查的任务。然后，编码玩家和VLM玩家尝试这些任务并向构建者报告问题以进行修复，因此游戏既作为环境验证又作为训练数据收集。通过Game2Player，我们构建了568个经过验证的网页游戏，包含3,436个任务，收集了15.7K条轨迹（307小时的游戏时间），并留出50个游戏作为基准PlayerBench。为了评估收集的体验作为训练数据的效果，我们使用进度加权监督微调（SFT）训练VLM智能体，为推进任务进度的步骤分配更大的权重。Game2Player-9B在PlayerBench上的进度从14.3%提高到31.2%，在外部GameWorld基准上的进度从30.0%提高到53.1%。更广泛地说，我们的工作为视觉智能体通过构建、验证和学习现有游戏世界来扩展其游戏体验提供了一条路径。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决视觉智能体在游戏环境中训练数据收集成本高、缺失动作推断难及现有数据集缺乏明确任务和可验证结果的问题，提出Game2Player框架以协同开发游戏环境和玩家，大规模收集多样且可验证的游戏体验。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Game2Player框架，通过构建者智能体改编网页游戏并定义任务，编码玩家和VLM玩家尝试任务并反馈修复，实现环境与玩家的协同开发。2. 构建了568个验证网页游戏（3,436个任务），收集15.7K条轨迹（307小时），并留出50个游戏作为PlayerBench基准。3. 采用进度加权监督微调（SFT）训练VLM智能体，为推进任务进度的步骤分配更大权重。4. Game2Player-9B在PlayerBench上进度从14.3%提升至31.2%，在GameWorld基准上从30.0%提升至53.1%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了Game2Player在构建大规模可验证游戏数据集及提升VLM智能体游戏进度方面的显著效果。但摘要未提供构建者智能体、编码玩家和VLM玩家的具体模型架构或提示词设计细节，也未说明进度加权SFT中权重的具体计算方式，以及该框架在更复杂或非网页类游戏中的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视觉智能体与强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning（CurvDelta：用于手术学习与遗忘的低曲率Delta建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24654\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24654\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA central challenge in adapting large language models (LLMs) is capability preservation: an adaptation can achieve its target while degrading general capabilities. We introduce CurvDelta, a scalable framework that incorporates the preservation constraint into the parameterization of the model update. By analyzing the local geometry of the preservation constraint around the pre-adaptation model, CurvDelta constructs a low-curvature space in which parameter updates leave the preservation loss nearly invariant. We make its construction practical for LLMs through Kronecker-factored approximate curvature (K-FAC) and a factorized projection. We also introduce CurvLoRA, a low-rank variant within the same preservation geometry, designed for more efficient adaptation. Both methods apply to preservation-constrained adaptation tasks such as capability learning and selective unlearning. We evaluate our methods on mathematical reasoning, code generation, and knowledge unlearning. For mathematical reasoning and code generation, our approaches achieve competitive downstream performance while better preserving general capabilities, offering a favorable acquisition--retention trade-off relative to the baselines. For knowledge unlearning, our main results on TOFU and MUSE show a better balance between targeted forgetting and knowledge retention than the baselines, with retention performance close to the from-scratch retraining reference.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e适应大型语言模型（LLMs）的一个核心挑战是能力保留：适应可以实现其目标，同时降低通用能力。我们引入了CurvDelta，一个可扩展的框架，它将保留约束纳入模型更新的参数化中。通过分析预适应模型周围保留约束的局部几何，CurvDelta构建了一个低曲率空间，其中参数更新使保留损失几乎保持不变。我们通过Kronecker分解近似曲率（K-FAC）和分解投影使其对LLMs的构建变得实用。我们还引入了CurvLoRA，一种在同一保留几何内的低秩变体，旨在实现更高效的适应。这两种方法都适用于保留约束的适应任务，如能力学习和选择性遗忘。我们在数学推理、代码生成和知识遗忘方面评估了我们的方法。对于数学推理和代码生成，我们的方法在更好地保留通用能力的同时实现了有竞争力的下游性能，相对于基线提供了有利的获取-保留权衡。对于知识遗忘，我们在TOFU和MUSE上的主要结果显示，在目标遗忘和知识保留之间比基线有更好的平衡，保留性能接近从头开始重新训练的参考。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e大型语言模型的保留约束适应任务，包括能力学习（数学推理、代码生成）和选择性知识遗忘。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出CurvDelta框架，利用K-FAC和分解投影构建低曲率空间以保留通用能力；提出CurvLoRA低秩变体以提高效率；在获取-保留权衡和目标遗忘-知识保留平衡上优于基线，保留性能接近从头重新训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在数学推理、代码生成和知识遗忘（TOFU, MUSE数据集）上有效，且保留性能接近从头重新训练。局限性方面，摘要未提供具体的性能提升或下降数字、计算开销对比、除TOFU和MUSE外的其他遗忘数据集表现，也未提及标题中提到的真实手术场景的应用验证。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型微调与对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. HINT-WAM: Hindsight-Informed Training for World Action Models（HINT-WAM：用于世界动作模型的后见之明信息训练）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24789\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24789\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld action models (WAMs) have shown promising generalization and data efficiency in robot manipulation by coupling action generation with predictions of future visual dynamics. Translating these capabilities into reliable task execution, however, remains a challenge for existing post-training methods. Offline supervised fine-tuning provides dense supervision on expert trajectories, but its flow-matching action expert is trained only on noised demonstration actions and never on the intermediate states produced by its own sampler; task-specific adaptation can also compromise pretrained capabilities. On-policy reinforcement learning trains on the policy\u0026#x27;s own behavior, yet sparse task rewards make exploration and credit assignment difficult, while dense reward shaping still provides scalar evaluations rather than direct action targets. We introduce HINT-WAM, the first on-policy self-distillation framework that supervises the action expert on its own sampling trajectories using hindsight, the future video of the demonstration, as privileged information available to the WAM itself. For each demonstration observation, the student generates its action through its own denoising trajectory, and at the states along this trajectory the same model acts as a teacher conditioned additionally on this hindsight, providing a conditional action distribution as a dense training target, while the student sees only deployment-time inputs and needs no environmental rewards or simulator interaction. To transfer this supervision to a flow-matching action expert, HINT-WAM distills the teacher into the student with an energy score, a distribution-level objective that matches the teacher\u0026#x27;s action distribution from the student\u0026#x27;s own samples rather than regressing its velocity field. The project web is available in https://tuandattt.github.io/hintwam/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界动作模型（WAMs）通过将动作生成与未来视觉动态预测相结合，在机器人操作中展现了良好的泛化和数据效率。然而，将这些能力转化为可靠的任务执行对现有的后训练方法仍然是一个挑战。离线监督微调在专家轨迹上提供密集监督，但其流匹配动作专家仅在加噪演示动作上训练，从未在其自身采样器产生的中间状态上训练；特定任务的适应也可能损害预训练能力。在线策略强化学习在策略自身的行为上训练，但稀疏的任务奖励使得探索和信用分配困难，而密集奖励塑造仍然提供标量评估而不是直接的动作目标。我们引入了HINT-WAM，这是第一个在线策略自蒸馏框架，它使用后见之明（即演示的未来视频，作为WAM本身可用的特权信息）在其自身的采样轨迹上监督动作专家。对于每个演示观察，学生通过其自身的去噪轨迹生成其动作，并且在该轨迹上的状态处，同一模型作为教师，额外以此后见之明为条件，提供条件动作分布作为密集训练目标，而学生仅看到部署时的输入，不需要环境奖励或模拟器交互。为了将这种监督转移到流匹配动作专家，HINT-WAM使用能量分数（一种分布级目标，从学生自身的样本中匹配教师的动作分布，而不是回归其速度场）将教师蒸馏到学生中。项目网站可在 https://tuandattt.github.io/hintwam/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e机器人操作中的世界动作模型（WAMs）后训练，以将泛化和数据效率转化为可靠的任务执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出首个在线策略自蒸馏框架HINT-WAM，利用后见之明（未来视频）作为特权信息提供密集训练目标；使用能量分数进行分布级蒸馏，无需环境奖励或模拟器交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有离线监督微调和在线策略强化学习在WAMs后训练中的局限，并提出了HINT-WAM解决这些问题。局限性方面，摘要未提供具体的机器人操作任务成功率、泛化指标、计算成本、能量分数蒸馏的具体数值，或与其他后训练方法的定量对比结果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 强化学习与视觉动态模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. LightTAR: Light and Fast Target-Aware Representations for Multimodal Tabular Learning（LightTAR：用于多模态表格学习的轻量快速目标感知表示）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 20 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17600\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17600\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMultimodal tabular learning involves classification and regression on tables combining structured numerical and categorical features with unstructured text and images. These unstructured fields are commonly represented by pretrained encoder embeddings reduced with principal component analysis (PCA). This reduction prioritizes input variance but may overlook information relevant to predicting the target. We introduce LightTAR, a simple, inexpensive method that adapts dimensionality reduction to the prediction task. LightTAR augments the standard PCA representation with a few target-aware features extracted jointly from the final and an intermediate encoder layer using regularized partial least squares (PLS). We evaluate LightTAR with 21 tabular models, including tree ensembles, neural networks, and tabular foundation models. LightTAR improves average predictive performance for all models and, averaged across models, improves prediction on almost every MulTaBench dataset. These gains come with a small increase in total runtime relative to PCA representations. LightTAR integrates directly into existing encoding pipelines, improving tabular learners\u0026#x27; predictive performance without modifying the encoder or the learner.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多模态表格学习涉及对结合了结构化数值和分类特征以及非结构化文本和图像的表格进行分类和回归。这些非结构化字段通常由通过主成分分析（PCA）降维的预训练编码器嵌入表示。这种降维优先考虑输入方差，但可能会忽略与预测目标相关的信息。我们引入了LightTAR，一种简单、廉价的方法，使降维适应预测任务。LightTAR使用正则化偏最小二乘法（PLS）从最终和中间编码器层联合提取少量目标感知特征，从而增强标准PCA表示。我们使用21种表格模型评估了LightTAR，包括树集成、神经网络和表格基础模型。LightTAR提高了所有模型的平均预测性能，并且在对模型进行平均后，在几乎每个MulTaBench数据集上都改善了预测。这些增益伴随着相对于PCA表示的总运行时间的微小增加。LightTAR直接集成到现有的编码管道中，在不修改编码器或学习器的情况下提高表格学习者的预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e多模态表格学习中的特征降维与表示优化，用于提升分类和回归任务的预测性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出LightTAR方法，利用正则化偏最小二乘法（PLS）从编码器层提取目标感知特征以增强PCA表示；在21种表格模型和几乎整个MulTaBench数据集上提升平均预测性能，且运行时间增加微小；无需修改编码器或学习器即可直接集成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明LightTAR在多种模型和MulTaBench数据集上均有效，且计算开销小。局限性方面，摘要未提供具体的性能提升百分比、运行时间增加的具体数值、所提取目标感知特征的具体数量，以及除MulTaBench外的其他数据集表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器学习 / 多模态表格学习与特征工程\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. WorldRuler: Interactive World Modeling under Configurable Rules（WorldRuler：可配置规则下的交互式世界建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 18 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24869\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24869\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRules govern how player actions change interactive worlds. Different rules create distinct gameplay experiences within similar scenes and action spaces. For customizable gameplay, generative world models must follow user-defined rules beyond real-world behaviors. However, realizing user-defined rules presents two challenges: Rule-State Persistence and Rule-to-Visual Realization. The former requires preserving rule definitions, dependencies, and world states across saving and loading, so that restored worlds follow the established rules. The latter requires accurately realizing rule-induced changes on designated objects and attributes, particularly when affected objects are unseen. In this paper, we propose WorldRuler, which organizes rule definitions, dependencies, and object states in an executable 3D rule graph and connects rule execution, video generation, and perceptual feedback in a closed loop. The graph supports joint saving and restoration of rules and world states, while dynamic object binding grounds rule-specified entities in visual instances and uses stored states to constrain generation from their first appearance. We further introduce object attribute state replacement and counterfactual reconstruction training, enabling accurate attribute control and compatible appearance and motion changes while limiting interference with unrelated content. We develop an automated data collection and annotation pipeline using GTA-V and Habitat to construct RuleVerse, a dataset of rule-driven interactions with detailed state and event annotations, including cases where rules take effect before affected objects become visible. Extensive experiments demonstrate the effectiveness of WorldRuler in preserving rule-state consistency across saving and loading and accurately realizing rule outcomes on designated objects and attributes.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e规则控制玩家动作如何改变交互式世界。不同的规则在相似的场景和动作空间中创造不同的游戏体验。对于可定制的游戏玩法，生成式世界模型必须遵循用户定义的规则，而不仅仅是现实世界的行为。然而，实现用户定义的规则面临两个挑战：规则-状态持久性和规则到视觉的实现。前者要求在保存和加载之间保留规则定义、依赖关系和世界状态，以便恢复的世界遵循已建立的规则。后者要求在指定的对象和属性上准确实现规则引起的变化，特别是当受影响的对象是未见过的时。在本文中，我们提出了WorldRuler，它在可执行的3D规则图中组织规则定义、依赖关系和对象状态，并在规则执行、视频生成和感知反馈之间形成闭环连接。该图支持规则和世界观状态的联合保存和恢复，而动态对象绑定将规则指定的实体接地到视觉实例中，并使用存储的状态从它们首次出现时约束生成。我们进一步引入了对象属性状态替换和反事实重建训练，实现了准确的属性控制以及兼容的外观和动作变化，同时限制了对无关内容的干扰。我们使用GTA-V和Habitat开发了一个自动化数据收集和标注管道，以构建RuleVerse，这是一个由规则驱动的交互数据集，具有详细的状态和事件标注，包括规则在受影响对象变得可见之前生效的情况。大量实验证明了WorldRuler在保存和加载之间保持规则-状态一致性以及在指定对象和属性上准确实现规则结果方面的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e生成式交互式世界建模，旨在使生成式世界模型遵循用户定义的可配置规则，实现规则-状态持久性和规则到视觉的准确实现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出WorldRuler，利用可执行3D规则图组织规则与状态，支持联合保存和恢复以及动态对象绑定；引入对象属性状态替换和反事实重建训练以实现准确属性控制；构建RuleVerse数据集，包含规则在对象可见前生效的复杂交互。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了系统架构和数据集构建，并声称实验证明了其在规则-状态一致性和视觉实现上的有效性。局限性方面，摘要未提供具体的视频生成评估指标、RuleVerse数据集的具体规模、生成视频的长度或分辨率，以及与其他世界模型基线的定量对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 交互式世界建模与视频生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. Code World Model 2.0: Towards Infinite Controllable Video Generation（Code World Model 2.0：迈向无限可控视频生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22925\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22925\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVisual proxies decouple explicit world-state simulation from photorealistic video synthesis, offering a controllable interface for both offline clip creation and real-time interactive streaming. Yet a practical renderer must address two challenges. Upstream proxies vary from coarse layouts to fine articulated geometry depending on the interaction, and streaming inference must operate in a few causal steps without accumulating drift across self-generated history. We present Invoker-Render, pairing a bidirectional creation model with a causal four-step streaming model under a shared conditioning interface over structural proxies, an appearance reference, and language. Trained on an aligned approximately 200-hour multi-granularity corpus, Invoker-Render honors fine geometric constraints when supplied while synthesizing plausible local motion under coarse proxies, enabling runtime selection of input detail. To bridge bidirectional creation and real-time streaming without compounding step compression and rollout drift, we introduce Progressive Forcing (ProForcing). ProForcing first trains a causal predictor and distills it into a four-step renderer using histories derived from training videos. Training then shifts to continuous self-generated rollouts. A pipelined serving stack supports efficient streaming inference. Experiments show versatile control across proxy families, granularities, and camera paths, consistent gains over recent streaming baselines, and stable 30-minute racing rollouts that preserve scene and subject appearance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视觉代理将显式的世界状态模拟与照片级真实的视频合成解耦，为离线片段创建和实时交互式流媒体提供了可控的接口。然而，实用的渲染器必须解决两个挑战。上游代理根据交互从粗略布局到精细关节几何变化，流媒体推理必须在几个因果步骤中运行，而不会在自生成的历史中积累漂移。我们提出了Invoker-Render，将双向创建模型与因果四步流媒体模型配对，在结构代理、外观参考和语言的共享条件接口下运行。在大约200小时对齐的多粒度语料库上训练，Invoker-Render在提供精细几何约束时遵守这些约束，同时在粗略代理下合成合理的局部运动，从而实现输入细节的运行时选择。为了在不复合步骤压缩和展开漂移的情况下桥接双向创建和实时流媒体，我们引入了渐进式强制（ProForcing）。ProForcing首先训练因果预测器，并使用从训练视频中获得的历史将其蒸馏为四步渲染器。然后训练转移到连续的自生成展开。流水线化的服务堆栈支持高效的流媒体推理。实验表明，在代理家族、粒度和相机路径上具有多功能的控制，相比最近的流媒体基线有一致的增益，并且具有稳定的30分钟赛车展开，保留了场景和主体外观。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e基于视觉代理的可控视频生成，解决从离线片段创建到实时交互式流媒体推理中的多粒度代理控制和长序列漂移问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Invoker-Render，结合双向创建模型与因果四步流媒体模型，支持多粒度代理的运行时选择；引入渐进式强制（ProForcing）技术，通过蒸馏和连续自生成展开解决步骤压缩和漂移问题；支持高效的流水线化流媒体推理。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在多种代理和相机路径下表现良好，且能实现稳定的30分钟长视频生成而不漂移。局限性方面，摘要未提供具体的视频分辨率、帧率、渲染延迟、与其他基线对比的具体定量指标，以及大约200小时语料库的具体构成细节和来源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 可控视频生成与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. StrideWorld: Benchmarking Scene Rigidity and Action Consistency in Interactive Video World Model（StrideWorld：在交互式视频世界模型中对场景刚性和动作一致性进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24408\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24408\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eInteractive video world models turn user commands into the exploration of a generated scene, which requires the scene to keep its 3D structure as the camera moves and each action to keep a stable effect. Existing benchmarks mostly evaluate these properties against references fitted to the video under test, either a scene reconstructed from its own frames or a camera trajectory aligned to the command path with a free scale. Such references can absorb gradual scene deformation and changes in pace and route length, so these errors can pass undetected. We therefore introduce StrideWorld, a benchmark whose references are fixed before the motion they judge. It evaluates scene rigidity against the ground-truth geometry of the start view, and action consistency against the stride of each action, the camera motion of one command. The stride is measured on the model\u0026#x27;s first steps and then used to test the steps that follow, so each model is judged only against its own steps. Its measurements are validated on rendered videos with known camera motion, and its scores agree with human judgments. Across  videos generated by  open models from 140 start views, all models but one deform their scenes as the camera moves, with offsets up to 7.3 times those of a rigid rendering along the same camera path. Most models keep a steady pace when a single action is held. Along composed routes, several models often stall, and most completed routes end away from the positions predicted by each model\u0026#x27;s own strides. Only the two models that scale commands by the estimated scene depth bring most routes close to these positions. Fine-tuning two models on a few rendered clips removes most of their mid-route stalls. Code, data, and a leaderboard are publicly available at https://github.com/chuangwang123/strideworld.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e交互式视频世界模型将用户命令转化为对生成场景的探索，这要求场景在相机移动时保持其3D结构，并且每个动作保持稳定的效果。现有的基准测试大多根据拟合到被测视频的参考来评估这些属性，这些参考要么是从其自身帧重建的场景，要么是与命令路径对齐且尺度自由的相机轨迹。此类参考可以吸收逐渐的场景变形以及节奏和路线长度的变化，因此这些错误可能会在未被检测到的情况下通过。因此，我们引入了StrideWorld，这是一个其参考在它们所评判的运动之前就已固定的基准测试。它根据起始视图的真实几何形状评估场景刚性，并根据每个动作的步幅（即一个命令的相机运动）评估动作一致性。步幅在模型的最初几步进行测量，然后用于测试随后的步骤，因此每个模型仅根据其自身的步骤进行评判。其测量在具有已知相机运动的渲染视频上进行了验证，并且其得分与人类判断一致。在由开放模型从140个起始视图生成的视频中，除一个模型外，所有模型在相机移动时都会使其场景变形，其偏移量高达沿相同相机路径的刚性渲染的7.3倍。当保持单一动作时，大多数模型能保持稳定的节奏。在组合路线上，几个模型经常停滞，并且大多数完成的路线结束于远离每个模型自身步幅所预测的位置。只有两个通过估计的场景深度缩放命令的模型将大多数路线带到了接近这些位置的位置。在少量渲染片段上微调两个模型可以消除它们大部分的中途停滞。代码、数据和排行榜已在 https://github.com/chuangwang123/strideworld 公开提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估交互式视频世界模型在相机移动时的场景刚性（3D结构保持）和动作一致性（稳定效果）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 StrideWorld 基准，其参考在运动前固定，避免现有基准吸收场景变形和节奏变化；通过模型自身初始步幅测量来评估后续步骤；在140个起始视图的开放模型视频上验证，发现除一个模型外均存在场景变形（偏移高达刚性渲染的7.3倍）；发现通过估计场景深度缩放命令的两个模型表现最好；微调可消除中途停滞。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出了现有基准测试在评估场景变形和节奏变化时的盲区，并提出了固定参考的 StrideWorld 基准。局限性方面，摘要未提供具体的视频生成总数，摘要未提供微调所用渲染片段的具体数量，摘要未提供计算资源消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. Piccolo: Co-Evolving Decision Models and Data through Recursive Self-Improvement（Piccolo：通过递归自我改进协同进化决策模型与数据）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24651\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24651\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present Piccolo, a family of multimodal decision models (0.8B to 27B) that coevolves model capabilities and training data via Agentic Data Engineering and recursive self-improvement (RSI). The models predict probabilities over candidate answers for general-purpose text and visual judgments, agent harnesses, data workflows, and interactive games. Piccolo-27B tops the Decision Index Vision Full leaderboard with a score of 75.59, while Piccolo-9B and Piccolo-4B achieve 68.35 and 67.46, respectively. All three rank first on the Private benchmark in their respective model-size categories. Research agents analyze model behavior, construct training data, conduct experiments, and use the results to refine subsequent proposals. Semantic slices and a shared research memory connect these actions across the model family\u0026#x27;s development. With training recipes comprising hundreds of thousands of examples, data selection and feedback-driven refinement are central to the self-improvement process. Our large-scale RSI exploration yields three counter-intuitive insights for decision-model development: (1) Backbone-recipe co-adaptation outweighs raw model recency: earlier backbones can surpass newer generations on visual tasks under identical recipes; (2) Targeted data curation enables 4B-9B models to rival 27B baselines on specialized workflows; and (3) Continuous loss reduction can decouple from and even degrade discrete decision accuracy. Together with the released weights and tools from the Data-Juicer and AgentScope ecosystems, Piccolo provides an actionable blueprint for building frontier decision models and scaling data-driven RSI.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了Piccolo，这是一个多模态决策模型系列（0.8B到27B），它通过智能体数据工程和递归自我改进（RSI）协同进化模型能力和训练数据。这些模型预测通用文本和视觉判断、智能体框架、数据工作流和交互式游戏的候选答案的概率。Piccolo-27B以75.59的得分位居Decision Index Vision Full排行榜榜首，而Piccolo-9B和Piccolo-4B分别达到68.35和67.46。这三个模型在各自模型规模类别的Private基准测试中均排名第一。研究智能体分析模型行为，构建训练数据，进行实验，并利用结果来完善后续提案。语义切片和共享的研究记忆将这些行动连接在模型家族的开发过程中。包含数十万个示例的训练配方中，数据选择和反馈驱动的完善是自我改进过程的核心。我们的大规模RSI探索为决策模型开发得出了三个反直觉的见解：（1）主干-配方协同适应比原始模型的新近性更重要：在相同配方下，较早的主干可以在视觉任务上超越新一代模型；（2）有针对性的数据整理使4B-9B模型能够在专业工作流上与27B基线相媲美；（3）持续的损失减少可以与离散的决策准确性脱钩，甚至使其下降。连同从Data-Juicer和AgentScope生态系统发布的权重和工具，Piccolo为构建前沿决策模型和扩展数据驱动的RSI提供了一个可操作的蓝图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过智能体数据工程和递归自我改进（RSI）协同进化多模态决策模型的能力与训练数据，以提升其在文本与视觉判断、智能体框架等任务上的决策概率预测能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Piccolo 模型系列（0.8B-27B），在 Decision Index Vision Full 和 Private 基准中取得同规模第一；利用研究智能体分析行为、构建数据并迭代优化；得出三个反直觉见解：主干-配方协同适应重于模型新近性、针对性数据整理可使小模型媲美大模型、持续损失减少可能降低离散决策准确性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了模型规模、基准得分以及通过 RSI 获得的三个反直觉见解。局限性方面，摘要未提供训练示例的确切数字，摘要未提供 Private 基准测试的具体构成，摘要未提供较早主干的具体架构名称，摘要未提供计算资源消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 智能体与决策模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. BLIP-Live: Balancing Timeliness \u0026amp; Firing Precision in Proactive Streaming Video Agents（BLIP-Live：在主动流式视频智能体中平衡及时性与触发精度）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21553\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21553\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eStreaming video understanding is becoming increasingly important for real-world interactive systems. Such systems must be proactive for natural and useful human interaction: they should respond as soon as sufficient evidence becomes available while avoiding premature, redundant, or incorrect responses. We present BLIP-Live, a framework unifying data, metrics, harness, and training around a shared formulation of proactivity as effective causal response decisions balancing the two competing objectives of responding vs silence. First, we construct BLIP-Live-780K dataset containing human annotations of proactive response content and timing, which defines this desired behavior. We then propose PAUC-F, a metric to effectively measure our desired proactive behavior. PAUC-F combines existing response timeliness metrics with firing precision to reward early useful responses without rewarding excessive firing. With our desired behavior defined and measurable, we finally investigate model-agnostic inference harnesses that draw out proactive streaming capabilities of offline vision language models (VLMs), together with training pipelines that learn to further improve their proactive responsiveness. Across both settings, we find that combinations of sliding visual windows, online interaction memory, and structured response outputs consistently yield strongest proactive performance. Our experiments result in two models, with our BLIP-Live-Qwen model achieving state-of-the-art performance across four proactive streaming benchmarks, with gains up to 44% over baselines and outperforming multiple closed API models. Our code and data will be released publicly.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e流式视频理解对于现实世界的交互式系统正变得越来越重要。这些系统必须是主动的，以实现自然和有用的人机交互：它们应该在有充分证据可用时立即做出响应，同时避免过早、冗余或不正确的响应。我们提出了BLIP-Live，一个围绕将主动性表述为平衡响应与沉默这两个竞争目标的有效因果响应决策的共享公式，来统一数据、指标、框架和训练的框架。首先，我们构建了BLIP-Live-780K数据集，其中包含人类对主动响应内容和时间的注释，这定义了这种期望的行为。然后我们提出PAUC-F，一种有效测量我们期望的主动行为的指标。PAUC-F将现有的响应及时性指标与触发精度相结合，以奖励早期的有用响应而不奖励过度触发。在定义和可测量我们期望的行为之后，我们最终研究了提取离线视觉语言模型（VLMs）主动流式能力的与模型无关的推理框架，以及学习进一步提高其主动响应能力的训练管道。在这两种设置中，我们发现滑动视觉窗口、在线交互记忆和结构化响应输出的组合始终产生最强的主动性能。我们的实验产生了两个模型，我们的BLIP-Live-Qwen模型在四个主动流式基准测试中实现了最先进的性能，比基线高出高达44%，并超越了多个闭源API模型。我们的代码和数据将公开发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提升流式视频理解系统在交互式应用中的主动性，使其能够在证据充分时及时响应，同时避免过早、冗余或错误的响应，平衡及时性与触发精度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 BLIP-Live 框架，统一数据、指标、推理框架和训练；构建包含人类注释的 BLIP-Live-780K 数据集；提出 PAUC-F 指标，结合及时性与触发精度；发现滑动视觉窗口、在线交互记忆和结构化响应输出的组合效果最佳；BLIP-Live-Qwen 模型在四个基准上比基线提升高达 44%，超越多个闭源 API 模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了完整的框架、数据集和评估指标，并报告了 BLIP-Live-Qwen 的最先进性能。局限性方面，摘要未提供四个主动流式基准测试的具体名称，摘要未提供多个闭源 API 模型的具体指代，摘要未提供模型训练的计算资源消耗或推理延迟等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 流式视频理解与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. StatePortal: Agentic Checkpoint Synthesis for Testing Deep States in Interactive Software（StatePortal：用于测试交互式软件深层状态的智能体检查点合成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23257\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23257\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models have reduced the effort to generate code for interactive software with graphical user interfaces (GUIs). For such software, a key testing bottleneck is reaching a deep state, one that requires a long interaction history. The cost of reaching it recurs across commits, and the GUI automation that could amortize it assumes a DOM or accessibility tree that self-rendered engines do not expose. We introduce StatePortal, an agent that synthesizes a checkpoint, an artifact that restores that state and can be versioned and replayed, from a natural-language functional test case and read-only access to the target\u0026#x27;s source code. The checkpoint is restored through a per-application hook that an onboarding agent binds or synthesizes once without hand-written hook code. Because a checkpoint can satisfy state checks while rendering incorrectly, checkpoints are scored by hybrid programmatic-state and visual evaluation: acceptance requires both a programmatic-state oracle and a visual oracle to pass. We calibrate the visual oracle against a blinded cross-VLM reference. We release DeepStateBench, 61 deep-state tasks across 10 interactive applications that span five language families and six rendering stacks, with source sizes from 874 to 7.2M lines. Across three registered models, a GUI agent seeded with synthesized checkpoints completes 10.4% of trials, compared with 0% without seeding under the same pixel action space, while StatePortal, which also delivers the target action through the hook, completes 27.5%. Over 1,361 replays of 112 checkpoints, 98.90% reproduce the original verdict with zero model calls, and the hybrid oracle detects 96.25% (77/80) of controlled visual faults invisible to programmatic-state checks alone. We open-source our code at https://github.com/pzy2000/State_Portal and website at https://stateportal.mineyosemite.chatgpt.site\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大型语言模型减少了为带有图形用户界面（GUI）的交互式软件生成代码的工作量。对于此类软件，一个关键的测试瓶颈是达到深层状态，即需要漫长交互历史的状态。达到该状态的成本在每次提交时都会重复，而可以分摊该成本的GUI自动化假设存在自渲染引擎不暴露的DOM或可访问性树。我们引入StatePortal，一个智能体，它从自然语言功能测试用例和对目标源代码的只读访问中合成一个检查点，这是一种恢复该状态并可进行版本控制和重放的工件。检查点通过每个应用程序的钩子进行恢复，该钩子由入职智能体绑定或合成一次，无需手写钩子代码。由于检查点可能在渲染不正确时满足状态检查，因此检查点通过混合的程序化状态和视觉评估进行评分：验收需要程序化状态预言机和视觉预言机均通过。我们根据盲化的跨VLM参考校准视觉预言机。我们发布了DeepStateBench，包含跨10个交互式应用程序的61个深层状态任务，这些应用程序涵盖五个语言家族和六个渲染栈，源代码大小从874行到7.2M行不等。在三个注册模型中，以合成检查点为种子的GUI智能体完成了10.4%的试验，而在相同像素动作空间下未使用种子的完成率为0%，同时通过钩子交付目标动作的StatePortal完成了27.5%。在对112个检查点的1,361次重放中，98.90%以零模型调用重现了原始判定，混合预言机检测到了96.25%（77/80）的受控视觉故障，这些故障仅靠程序化状态检查是无法发现的。我们在 https://github.com/pzy2000/State_Portal 开源了我们的代码，网站在 https://stateportal.mineyosemite.chatgpt.site。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决带有 GUI 的交互式软件测试中达到需要漫长交互历史的深层状态的瓶颈，通过合成检查点来恢复和测试这些深层状态。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 StatePortal 智能体，从自然语言测试用例和源代码只读访问中合成检查点；无需手写钩子代码即可恢复状态；采用混合程序化状态和视觉评估进行评分；发布 DeepStateBench（10个应用，61个任务，代码规模874至7.2M行）；StatePortal 将测试完成率从 0% 提升至 27.5%；检查点重放准确率达 98.90%，混合预言机检测出 96.25% 的受控视觉故障。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细描述了 StatePortal 的工作机制、DeepStateBench 的规模以及具体的实验提升数据。局限性方面，摘要未提供三个注册模型的具体名称或规模，摘要未提供五个语言家族和六个渲染栈的具体技术细节，摘要未提供合成检查点所需的时间成本或大语言模型的 token 消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 自动化测试与 GUI 智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. PReMind: When Personal Memory Meets Visual Hazards（PReMind：当个人记忆遇到视觉危险时）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23808\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23808\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePersonalized vision-language assistants use visual observations and personal memories to provide advice tailored to the user. When the observed scene contains a physical hazard, personal context, such as allergies, medical conditions, or mobility constraints, can change what help is appropriate. Responding appropriately therefore requires recognizing the visible hazard and applying the relevant person\u0026#x27;s information. We introduce PReMind-Bench, a diagnostic benchmark that evaluates this combination across diverse hazards and personal-memory conditions. It separately measures memory access, grounding, abstention, and hazard response, and assesses joint success on interdependency cases. Existing models often satisfy one requirement while failing the other, and training only for safety or personalization leaves a gap in joint success. We therefore propose PReMind, a two-phase reinforcement learning framework that combines on-demand and forced-call interactions (memory always retrieved) to jointly train grounded memory use and hazard response. At 4B, PReMind raises joint success from 12.9% to 28.6% over its base on the interdependency set and improves hazard adequacy and correct abstention on the main test. Joint-success gains persist under forced-call evaluation and under a second LLM judge across three Phase II seeds; averaged over these seeds, joint success also improves on unseen hazard groups. These findings highlight the need to evaluate and train personal assistants to connect visual evidence with the relevant person\u0026#x27;s context.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e个性化视觉语言助手使用视觉观察和个人记忆来提供为用户量身定制的建议。当观察到的场景包含物理危险时，个人背景信息（如过敏、医疗状况或行动限制）可以改变所需帮助的适当性。因此，做出适当的响应需要识别可见的危险并应用相关人员的个人信息。我们引入了PReMind-Bench，一个诊断基准，用于评估这种组合在多种危险和个人记忆条件下的表现。它分别测量记忆访问、接地、弃权和危险响应，并评估相互依赖情况下的联合成功。现有模型通常满足一个要求而失败另一个，仅针对安全性或个性化进行训练会在联合成功方面留下差距。因此，我们提出了PReMind，一个两阶段强化学习框架，它结合按需和强制调用交互（始终检索记忆）来联合训练接地的记忆使用和危险响应。在4B规模下，PReMind在相互依赖集上将其基础模型的联合成功率从12.9%提高到28.6%，并在主测试中提高了危险充分性和正确弃权率。联合成功的增益在强制调用评估下以及在三个第二阶段种子上的第二个LLM评判中持续存在；在这些种子的平均值上，联合成功率在未见的危险组上也有所提高。这些发现强调了需要评估和训练个人助手将视觉证据与相关人员的背景信息联系起来。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和训练个性化视觉语言助手，使其在观察到物理危险时，能够结合用户的个人背景信息做出适当、安全的响应。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 PReMind-Bench 诊断基准，分别评估记忆访问、接地、弃权和危险响应及联合成功；提出 PReMind 两阶段强化学习框架，结合按需和强制调用交互联合训练记忆使用和危险响应；4B 模型在相互依赖集上的联合成功率从 12.9% 提升至 28.6%；在强制调用评估、第二个 LLM 评判及未见危险组上均表现出持续的增益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提出了针对个性化视觉语言助手在危险场景下结合个人记忆的诊断基准和训练框架，并报告了 4B 模型的具体性能提升数据。局限性方面，摘要未提供 PReMind-Bench 的具体数据集规模或危险类别数量，摘要未提供第二个 LLM 评判的具体模型名称，摘要未提供训练所需的计算资源消耗等技术细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习 / 视觉语言助手与安全对齐\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. Late Entry in Looped Language Models（循环语言模型中的延迟进入）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24576\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24576\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped language models deepen reasoning at a compact parameter count by iterating a shared layer stack T times per token, turning recurrence depth directly into sequential decoding latency. Conventional early-exit decoding halts after initial passes without cache completion, truncating cached key-value states of past tokens to shallow depth. We study the opposite strategy, late entry, where new tokens skip initial passes and enter directly into the final K \u0026lt; T passes over a deep context cache. Once lightweight fine-tuning resolves hidden-state norm mismatch at the entry boundary, deep cached context substitutes for skipped token-local passes, allowing late entry to outperform matched early exit across model families and pass budgets. To turn this asymmetry into wall-clock speedups without stalling to build deep caches, candidate blocks verify through only the final K passes on the critical path while previously committed tokens complete passes 1 -\u0026gt; T alongside subsequent steps at zero extra serial calls. Projecting these finished T-pass wake states inside the existing output GEMM (Wake verification, governed by logit-margin tolerance tau in [0, inf]) unifies greedy-exact T-pass decoding (tau = 0, matching K = T block decoding within bf16 reduction order), margin-gated verification (tau \u0026gt; 0), and non-rollback lossy late entry (tau = inf) inside a single static CUDA graph. On Ouro-2.6B (T = 4), K = 2 Wake reaches 5.2x greedy-exact speedup at tau = 0 (+26% over K = 4 block decoding on GSM8K) and 6.8x at tau = inf (+16.9 points over trained early exit at matched speed). Scaling test-time recurrence across T in {8, 16, 32, 64} on Huginn-3.5B cuts K = T/4 rollbacks 21.5x with depth, driving greedy-exact (tau = 0) speedups to 6.1x (T = 32) and 8.4x (T = 64, +153% over K = 64 block) and tau = inf speedups to 10.6 to 12.5x.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环语言模型通过为每个标记迭代共享层堆栈T次，以紧凑的参数量深化推理，将循环深度直接转化为顺序解码延迟。传统的提前退出解码在初始遍历后停止而不完成缓存，将过去标记的缓存键值状态截断为浅层深度。我们研究了相反的策略，即延迟进入，其中新标记跳过初始遍历，直接进入深度上下文缓存的最后K \u0026lt; T次遍历。一旦轻量级微调解决了进入边界处的隐藏状态范数不匹配问题，深度缓存上下文就会替代被跳过的标记局部遍历，使得延迟进入能够在模型家族和遍历预算中胜过匹配的提前退出。为了将这种不对称性转化为实际运行时间的加速，而无需停滞以构建深度缓存，候选块仅通过关键路径上的最后K次遍历进行验证，而先前提交的标记在后续步骤中完成第1到T次遍历，且无需额外的串行调用。在现有的输出GEMM中投影这些完成的T次遍历唤醒状态（唤醒验证，由[0, inf]范围内的logit-边距容差tau控制），在单个静态CUDA图中统一了贪心精确的T次遍历解码（tau = 0，在bf16归约顺序内匹配K = T块解码）、边距门控验证（tau \u0026gt; 0）和非回滚有损延迟进入（tau = inf）。在Ouro-2.6B（T = 4）上，K = 2的Wake在tau = 0时达到5.2倍的贪心精确加速（在GSM8K上比K = 4块解码高26%），在tau = inf时达到6.8倍（在匹配速度下比训练后的提前退出高16.9个点）。在Huginn-3.5B上跨T属于{8, 16, 32, 64}扩展测试时循环，将K = T/4的回滚随深度减少了21.5倍，将贪心精确（tau = 0）加速提升至6.1倍（T = 32）和8.4倍（T = 64，比K = 64块高153%），并将tau = inf加速提升至10.6到12.5倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e优化循环语言模型的解码延迟，提出一种名为延迟进入的策略，并结合唤醒验证机制实现实际运行时间的加速。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出延迟进入策略，新标记跳过初始遍历直接进入深度上下文缓存的最后K次遍历，通过轻量级微调解决隐藏状态范数不匹配。2. 提出唤醒验证机制，在单个静态CUDA图中统一贪心精确解码、边距门控验证和非回滚有损延迟进入。3. 在Ouro-2.6B和Huginn-3.5B模型上实现了显著的加速，例如在Huginn-3.5B上T=64时贪心精确加速达8.4倍，tau=inf加速达10.6至12.5倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e该方法通过利用深度缓存上下文替代标记局部遍历，有效减少了解码延迟。然而，摘要未提供该方法在更大规模模型或更复杂任务上的泛化能力评估，未提供轻量级微调的具体计算开销，也未提供在不同硬件架构上的实际部署限制。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 大语言模型推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. RoughCut-Bench: A Benchmark for Automatic Video Rough-Cut with Large Vision-Language Models（RoughCut-Bench：使用大型视觉语言模型进行自动视频粗剪的基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24098\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24098\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo rough-cut is a core stage in media production workflows, organizing raw media materials into an initial video cut. Despite recent advances in large vision-language models (LVLMs) for video-related tasks, automatic rough-cut remains underexplored, without a comprehensive benchmark for evaluation or mature workflows for producing executable cut plans. To address the evaluation gap, we introduce RoughCut-Bench, which covers two practical settings: (1) a visually driven setting over video cases, covering highlight detection and selection, source-video ordering, and adherence to user requirements when provided; and (2) a speech-driven setting over automatic speech recognition (ASR) transcripts, covering filler removal, expression deduplication, and low-value content trimming. Across these settings, the benchmark contains 101 visually driven cases, including 831 raw videos with 1,476 highlight annotations. It also includes 84 speech-driven cases, each consisting of an ASR transcript with annotated cleanup spans. The evaluation compares cut plans with these annotations in both settings and additionally uses a human-aligned agentic evaluator to assess rendered-cut quality in the visual setting. To apply LVLMs to automatic rough-cut, we further propose agentic workflows that guide them to produce structured cut plans from input materials. Experiments show that current LVLMs remain limited in producing expert-aligned cut plans. Our benchmark, code, and prompts are released at https://whalesong-zrs.github.io/RoughCut-Bench-Project-Page.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e视频粗剪是媒体制作工作流程中的核心阶段，将原始媒体材料组织成初始视频剪辑。尽管大型视觉语言模型（LVLMs）在视频相关任务方面取得了最新进展，但自动粗剪仍未得到充分探索，缺乏用于评估的全面基准或用于生成可执行剪辑计划的成熟工作流程。为了弥补评估空白，我们引入了RoughCut-Bench，它涵盖两个实际设置：（1）基于视频案例的视觉驱动设置，涵盖亮点检测和选择、源视频排序以及在提供时遵守用户要求；（2）基于自动语音识别（ASR）转录的语音驱动设置，涵盖填充词删除、表达去重和低价值内容修剪。在这些设置中，该基准包含101个视觉驱动案例，包括831个原始视频和1476个亮点注释。它还包括84个语音驱动案例，每个案例由一个带有注释清理跨度的ASR转录组成。评估在两种设置中将剪辑计划与这些注释进行比较，并额外使用与人类对齐的智能体评估器来评估视觉设置中的渲染剪辑质量。为了将LVLMs应用于自动粗剪，我们进一步提出了智能体工作流程，引导它们从输入材料中生成结构化的剪辑计划。实验表明，当前的LVLMs在生成与专家对齐的剪辑计划方面仍然存在局限性。我们的基准、代码和提示词已发布在 https://whalesong-zrs.github.io/RoughCut-Bench-Project-Page。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建用于评估大型视觉语言模型在自动视频粗剪任务中表现的基准测试RoughCut-Bench，并提出引导模型生成结构化剪辑计划的智能体工作流程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出了RoughCut-Bench，涵盖视觉驱动（101个案例，831个视频，1476个亮点注释）和语音驱动（84个案例，带注释清理跨度的ASR转录）两种实际设置。2. 引入了与人类对齐的智能体评估器来评估视觉设置中的渲染剪辑质量。3. 提出了智能体工作流程以引导LVLMs从输入材料生成结构化剪辑计划，并揭示了当前LVLMs在生成专家级剪辑计划方面的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e该研究填补了自动视频粗剪评估基准的空白，并提供了丰富的多模态数据。然而，摘要未提供当前LVLMs具体在哪些指标上表现不佳的定量数据，未提供智能体工作流程的具体架构细节，也未提供该基准在更广泛视频类型或更长视频时长下的适用性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 多模态大模型应用 / 视频处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. Mechanistic Critics for Sample-Efficient NPU Design-Space Exploration（用于样本高效NPU设计空间探索的机制批评器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24733\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24733\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eNPU design-space exploration for LLM inference mainly relies on an expensive simulator that often returns only scalar feedback such as latency and power. Such feedback can rank evaluated configurations, but gives little information for deciding why a configuration is slow or which architecture parameter should be changed next. This limitation is especially severe because prefill and decode workloads can be limited by different resources, including compute throughput and HBM bandwidth. We propose CriticNPU, a sample-efficient DSE framework built around an online-calibrated mechanistic critic for NPU architecture design. The critic uses explicit hardware limits to evaluate NPU configurations: before simulation, it estimates whether a proposed configuration is likely to improve over the current best and filters weak candidates; after simulation, it aggregates operator-level runtimes into prefill/decode bottleneck summaries and predicts the effect of candidate parameter changes. We instantiate the critic with a Roofline-style model that derives compute and memory limits from architecture parameters and calibrates per-operator-type effective limits using simulator observations. And CriticNPU combines this critic with a workload extractor and an architecture planner to propose configurations. Across six LLM workloads and 16 deployment configurations per model, CriticNPU achieves best-or-tied-best latency in 74% of prefill and 87.5% of decode settings while using roughly half the simulator calls of competitive DSE baselines. We conduct extensive ablation studies and detailed analyses to validate the effectiveness of our method from multiple perspectives. Our code is available at https://github.com/bruno686/CriticNPU.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e用于大语言模型推理的NPU设计空间探索主要依赖于昂贵的模拟器，该模拟器通常仅返回延迟和功耗等标量反馈。此类反馈可以对评估的配置进行排名，但几乎无法提供关于配置为何缓慢或接下来应更改哪个架构参数的信息。这种局限性尤为严重，因为预填充和解码工作负载可能受到不同资源的限制，包括计算吞吐量和HBM带宽。我们提出了CriticNPU，这是一个围绕用于NPU架构设计的在线校准机制批评器构建的样本高效设计空间探索（DSE）框架。该批评器使用显式硬件限制来评估NPU配置：在模拟之前，它估计提议的配置是否可能优于当前最佳配置并过滤掉弱候选者；在模拟之后，它将算子级运行时间聚合为预填充/解码瓶颈摘要，并预测候选参数更改的效果。我们使用Roofline风格模型实例化该批评器，该模型从架构参数推导计算和内存限制，并使用模拟器观察结果校准每种算子类型的有效限制。CriticNPU将该批评器与工作负载提取器和架构规划器结合以提出配置。在6个大语言模型工作负载和每个模型16个部署配置中，CriticNPU在74%的预填充设置和87.5%的解码设置中实现了最佳或并列最佳的延迟，同时仅使用了竞争性DSE基线大约一半的模拟器调用次数。我们进行了广泛的消融研究和详细分析，从多个角度验证了我们方法的有效性。我们的代码可在 https://github.com/bruno686/CriticNPU 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为CriticNPU的样本高效设计空间探索框架，利用在线校准的机制批评器来优化大语言模型推理的NPU架构设计。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出机制批评器，利用显式硬件限制（如Roofline风格模型）在模拟前过滤弱候选者，在模拟后聚合瓶颈摘要并预测参数更改效果。2. 结合工作负载提取器和架构规划器，在6个LLM工作负载和每个模型16个配置中，以约一半的模拟器调用次数，在74%的预填充和87.5%的解码设置中实现最佳或并列最佳延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eCriticNPU通过引入机制批评器显著减少了模拟器调用次数并保持了高准确率，有效解决了传统设计空间探索中反馈信息不足的问题。然而，摘要未提供该框架在更大规模或更复杂NPU架构设计空间中的扩展性表现，未提供Roofline风格模型在极端硬件约束下的校准误差，也未提供工作负载提取器在面对非标准或动态变化LLM推理模式时的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机体系结构 / 硬件设计空间探索 / 大语言模型推理加速\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. Decoding Without a Decoder: Direct Pixel Prediction from Diffusion Transformers（无需解码器：从扩散Transformer直接进行像素预测）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.22287\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.22287\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLatent diffusion models rely on a decoder to map denoised latents to pixels, adding complexity and inference cost. We introduce Decoding Without a Decoder (DWD), which lets a finetuned diffusion transformer produce final pixels directly through a linear head. Unlike previous methods, where the denoising output leads to final pixels, DWD separates the two roles: the original denoising head continues to drive sampling, then the new DWD head predicts the pixels at the final step. We extend pretrained latent models with DWD efficiently by finetuning only the last few transformer blocks, training the DWD head with pixel quality losses while anchoring the denoising head to the pretrained model to preserve the sample trajectory. Across latent image and video generators, DWD removes the decoder and reduces inference cost while maintaining or even improving pixel quality. On Wan video generation, it visibly reduces detail distortion and flickering, lowering warping error by 23%. Remarkably, the same separation also improves pixel diffusion models that do not even use a decoder: a final-step DWD head produces substantially better texture detail in text-to-image generation, and improves ImageNet FID from 1.55 to 1.43, a new state of the art among pixel flow models.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e潜在扩散模型依赖解码器将去噪潜在变量映射到像素，增加了复杂性和推理成本。我们引入了无需解码器（DWD），它让微调后的扩散Transformer通过线性头直接生成最终像素。与以往去噪输出直接生成最终像素的方法不同，DWD分离了这两种角色：原始去噪头继续驱动采样，然后新的DWD头在最后一步预测像素。我们通过仅微调最后几个Transformer块，使用像素质量损失训练DWD头，同时将去噪头锚定到预训练模型以保留采样轨迹，从而有效地使用DWD扩展预训练潜在模型。在潜在图像和视频生成器中，DWD移除了解码器并降低了推理成本，同时保持甚至提高了像素质量。在Wan视频生成中，它明显减少了细节失真和闪烁，将扭曲误差降低了23%。值得注意的是，相同的分离也改善了甚至不使用解码器的像素扩散模型：最后一步的DWD头在文本到图像生成中产生了明显更好的纹理细节，并将ImageNet FID从1.55提高到1.43，这是像素流模型中的最新最先进水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为无需解码器（DWD）的方法，使扩散Transformer能够通过线性头直接生成最终像素，从而移除潜在扩散模型中的解码器以降低推理成本并提升像素质量。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 分离去噪和像素预测角色，原始去噪头驱动采样，新的DWD线性头在最后一步直接预测像素，仅需微调最后几个Transformer块。2. 在潜在图像和视频生成中移除解码器，降低推理成本，在Wan视频生成中将扭曲误差降低23%。3. 将DWD应用于无解码器的像素扩散模型，在文本到图像生成中改善纹理细节，将ImageNet FID从1.55提升至1.43，达到像素流模型的最新最先进水平。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eDWD方法通过角色分离和轻量级微调，成功在降低推理成本的同时提升或保持了图像和视频的生成质量，甚至对无解码器的像素模型也有增益。然而，摘要未提供DWD头在不同分辨率或更复杂场景下的泛化能力数据，未提供仅微调最后几个Transformer块是否会导致模型在长序列或极端条件下的稳定性问题，也未提供该方法在训练阶段引入的额外计算开销。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 生成式模型 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. WaveView: The Novel View Is in the Noise（WaveView：新视角存在于噪声中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23994\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23994\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerative novel view synthesis (NVS) employs a diffusion model to render a static or dynamic scene from a target camera view. Explicit warp methods complete a reprojection of the source with video diffusion models, and implicit methods encode the camera parameters or 3D cues. Both add inference overhead, and the generated layout often drifts from the ground truth. We present WaveView, which injects the warped source into the phase of the initial noise of a pretrained generator. The Dual-Tree Complex Wavelet Packet Transform (DT-CWPT) allows local and anisotropic phase injection. The generator is thus constrained less in disoccluded regions and along the epipolar line. WaveView keeps the architecture and adds negligible overhead. On the DL3DV benchmark, it outperforms all baselines in every overlap bin. In the hardest bin, it gains 0.84 dB PSNR on the covisible region over MetaView, which shares its generator, while running 2.1 times faster. For dynamic NVS, fine-tuning AnyView with the same noise raises its zero-shot PSNR on AnyViewBench from 11.58 to 12.35 dB.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e生成式新视角合成（NVS）采用扩散模型从目标相机视角渲染静态或动态场景。显式变形方法使用视频扩散模型完成源的重新投影，隐式方法对相机参数或3D线索进行编码。两者都增加了推理开销，并且生成的布局通常偏离真实值。我们提出了WaveView，它将变形源注入到预训练生成器初始噪声的相位中。双树复小波包变换（DT-CWPT）允许局部和各向异性相位注入。因此，生成器在去遮挡区域和沿极线受到的约束更少。WaveView保持了原有架构并增加了可忽略不计的开销。在DL3DV基准测试中，它在每个重叠区间均优于所有基线。在最困难的区间，它在共视区域比共享其生成器的MetaView高出0.84 dB PSNR，同时运行速度快2.1倍。对于动态NVS，使用相同噪声微调AnyView可将其在AnyViewBench上的零样本PSNR从11.58 dB提高到12.35 dB。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为WaveView的方法，通过将变形源注入预训练生成器初始噪声的相位中，实现高效且高质量的生成式新视角合成，适用于静态和动态场景。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 利用双树复小波包变换（DT-CWPT）将变形源局部且各向异性地注入初始噪声相位，减少生成器在去遮挡区域和极线处的约束。2. 保持原有架构且推理开销可忽略不计，在DL3DV基准测试的所有重叠区间均优于基线，在最困难区间比MetaView高0.84 dB PSNR且速度快2.1倍。3. 在动态NVS中，使用相同噪声微调AnyView，在AnyViewBench上的零样本PSNR从11.58 dB提升至12.35 dB。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eWaveView通过巧妙的噪声相位注入机制，在不增加推理开销和改变模型架构的前提下，显著提升了静态和动态新视角合成的质量与速度。然而，摘要未提供该方法在极端视角变化或复杂光照条件下的鲁棒性评估，未提供DT-CWPT参数选择对最终生成质量的影响，也未提供该相位注入策略在其他非扩散类生成模型中的适用性局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 新视角合成 / 扩散模型应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. Tideway: Phase-Aware Tiered Memory Management for MoE Inference on Consumer Devices（Tideway：面向消费级设备MoE推理的感知阶段分层内存管理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.14848\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.14848\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language model (LLM) agents are rapidly becoming a dominant paradigm for AI applications. Recently, there is a growing demand to deploy large-scale Mixture-of-Experts (MoE) models locally on consumer PCs to balance data privacy, API costs, and inference efficiency. However, unlike datacenter servers with abundant DRAM, consumer devices are tightly constrained in both GPU VRAM and host RAM, forcing massive MoE weights to spill across VRAM, host RAM, and SSD. Under such spilling, we observe that existing systems fail to fully utilize this memory hierarchy, treating the tiers as independent caches and thrashing in inference.\u003cbr\u003e  We present TIDEWAY, a system for efficient inference of large MoE models on memory-constrained consumer devices. Our core insight is to manage host RAM and GPU VRAM as a unified memory pool. Within this pool, TIDEWAY couples phase-aware memory layouts, which adapt to the distinct access patterns of prefill and decode, with an execution engine that optimizes CUDA Graph execution under expert paging. Our evaluations on representative consumer hardware with frontier MoE models demonstrate that TIDEWAY significantly outperforms state-of-the-art systems. On average, TIDEWAY achieves speedups of 1.97x in end-to-end latency and 2.40x in Time-to-First-Token (TTFT), along with 1.61x higher decode throughput against the fastest baseline.\u003cbr\u003e  Our source code is publicly available at https://github.com/Afterglow231/Tideway .\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e大语言模型（LLM）代理正迅速成为AI应用的主导范式。最近，在消费级PC上本地部署大规模混合专家（MoE）模型以平衡数据隐私、API成本和推理效率的需求日益增长。然而，与拥有丰富DRAM的数据中心服务器不同，消费级设备在GPU VRAM和主机RAM方面受到严格限制，迫使大量MoE权重溢出到VRAM、主机RAM和SSD之间。在这种溢出情况下，我们观察到现有系统未能充分利用这种内存层次结构，将各层视为独立缓存并在推理中产生抖动。我们提出了TIDEWAY，一个用于在内存受限的消费级设备上高效推理大型MoE模型的系统。我们的核心见解是将主机RAM和GPU VRAM作为统一的内存池进行管理。在这个池内，TIDEWAY将感知阶段的内存布局（适应预填充和解码的不同访问模式）与在专家分页下优化CUDA Graph执行的执行引擎相结合。我们在具有前沿MoE模型的代表性消费级硬件上的评估表明，TIDEWAY显著优于最先进系统。平均而言，与最快的基线相比，TIDEWAY在端到端延迟方面实现了1.97倍的加速，在首字时间（TTFT）方面实现了2.40倍的加速，以及1.61倍的更高解码吞吐量。我们的源代码公开在 https://github.com/Afterglow231/Tideway 。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在内存受限的消费级设备上高效推理大型混合专家（MoE）模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e将主机RAM和GPU VRAM作为统一内存池管理；结合感知阶段的内存布局以适应预填充和解码的不同访问模式；执行引擎在专家分页下优化CUDA Graph执行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出消费级设备内存受限导致MoE权重在VRAM、RAM和SSD间溢出，现有系统将其视为独立缓存导致抖动。TIDEWAY通过统一内存池和感知阶段的布局及CUDA Graph优化解决了此问题，并在端到端延迟（1.97倍加速）、TTFT（2.40倍加速）和解码吞吐量（1.61倍提升）上取得显著性能提升。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e系统与大模型推理优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. QDA: Closed-Loop LLM Quantization Design with Agents（QDA：基于智能体的闭环大语言模型量化设计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.23388\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.23388\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePost-training quantization is the standard way to serve large language models at low cost. However, the best quantization recipe differs across models and precisions. As a result, experts must redesign it for every new model, which is time-consuming and often sub-optimal. Fortunately, an LLM agent can take over this design by refining the recipe over rounds of building and evaluating candidates, so that more rounds lead to better recipes. However, evaluating one quantized reasoning model takes tens of GPU-hours, and combining methods from different codebases means porting each to the new architecture by hand. We present QDA, a system in which an agent designs the recipe for each model and precision. To make evaluation fast, QDA scores each candidate in minutes by its output KL divergence from the original model on reasoning traces that the agent never sees, and checks promising ones with long generations to catch failures such as repetition loops. To make building fast, QDA provides a library of public PTQ methods that are compatible with one another and with new model architectures. Across four reasoning models, QDA improves accuracy over the strongest public recipe by 0.9, 1.4 and 2.2 percentage points on average at W4A16, W4A8 and W3A16, using 64 GPU-hours per search. On the 320B-parameter MoE model GLM-5.3-Flash at NVFP4 W4A4, it recovers 98.3% of the FP8 model\u0026#x27;s accuracy, against 96.9% for the best vendor checkpoint. Every QDA checkpoint also runs on existing serving kernels with no inference overhead. We will release the library, the evaluator and the harness.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e训练后量化是以低成本服务大语言模型的标准方法。然而，最佳量化配方因模型和精度而异。因此，专家必须为每个新模型重新设计，这很耗时且通常次优。幸运的是，大语言模型代理可以通过在构建和评估候选者的多轮中改进配方来接管这一设计，因此更多轮次会带来更好的配方。然而，评估一个量化的推理模型需要数十个GPU小时，并且结合来自不同代码库的方法意味着手动将每个方法移植到新架构。我们提出了QDA，一个系统，其中代理为每个模型和精度设计配方。为了使评估快速，QDA在几分钟内通过候选者在代理从未见过的推理轨迹上与原始模型的输出KL散度对其进行评分，并通过长生成检查有希望的候选者以捕获失败（如重复循环）。为了使构建快速，QDA提供了一个相互兼容且与新模型架构兼容的公共训练后量化方法库。在四个推理模型中，QDA在W4A16、W4A8和W3A16下，每次搜索使用64个GPU小时，平均将准确率比最强的公开配方提高了0.9、1.4和2.2个百分点。在NVFP4 W4A4下的320B参数MoE模型GLM-5.3-Flash上，它恢复了FP8模型98.3%的准确率，而最佳供应商检查点为96.9%。每个QDA检查点也在现有服务内核上运行，没有推理开销。我们将发布该库、评估器和测试工具。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用大语言模型代理自动为不同模型和精度设计最优的训练后量化（PTQ）配方。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e利用输出KL散度在几分钟内快速评估候选量化配方；提供相互兼容且支持新架构的公共PTQ方法库以加速构建；通过长生成检查捕获重复循环等失败。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出传统量化配方设计耗时且次优，评估成本高。QDA通过代理闭环设计、基于KL散度的快速评估和兼容的PTQ方法库解决了这些问题。实验显示在W4A16、W4A8、W3A16下准确率分别提升0.9、1.4、2.2个百分点，在GLM-5.3-Flash W4A4下恢复98.3% FP8准确率，且无推理开销。局限性：摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大模型压缩与量化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents（PIPETTE：面向鲁棒大语言模型代理的提示注入紫队测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.24362\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.24362\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language model (LLM) agents routinely interact with untrusted external data, exposing them to indirect prompt injection (IPI) attacks that hijack agents into executing attacker-chosen tasks. To uncover these vulnerabilities at scale, automated red-teaming methods often leverage reinforcement learning (RL) to generate attacks that achieve high attack success rates (ASR). Model developers use the attacks discovered during internal red-teaming to harden agents through adversarial training before deployment, a collaborative offensive-defensive process known in cybersecurity as purple-teaming. However, we show that achieving high ASR during red-teaming does not guarantee robustness gains from subsequent adversarial training. Specifically, we find that two state-of-the-art RL-based red-teaming methods, RL-Hammer and PISmith, suffer from mode collapse, repeatedly discovering similar attack strategies whose additional successes add no additional robustness improvements to adversarial training. To address this gap, we introduce PIPETTE, a unified prompt injection purple-teaming framework that effectively converts red-teaming discoveries into defender robustness improvements. PIPETTE employs a dictionary learning-based reward that encourages broader coverage of attack strategies during red-teaming. It also integrates an on-policy adversarial training pipeline tailored to IPI defense, enabling agents to resist attacks while completing legitimate user tasks. Extensive evaluations across agentic benchmarks (AgentDojo and ASB) demonstrate that PIPETTE produces defenders t
