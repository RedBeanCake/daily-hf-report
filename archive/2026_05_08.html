### 1. Stream-R1: Reliability-Perplexity Aware Reward Distillation for Streaming Video Generation (Stream-R1：面向流式视频生成的可靠性 - 困惑度感知奖励蒸馏)
- **社区热度**: `👍 107 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.03849)
- **研究任务**: 流式视频生成
- **核心亮点**: 在奖励蒸馏过程中，同时考虑生成结果的可靠性和模型困惑度。
- **深度解析**: 针对流式视频生成容易崩坏的问题，改进了奖励蒸馏机制。传统方法只看生成质量，该方法在计算奖励时加入了可靠性（一致性）和困惑度（不确定性）指标，引导模型生成更稳定的视频流。
