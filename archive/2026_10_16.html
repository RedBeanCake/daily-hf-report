    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation (任何时间，任何空间：一种以世界状态为中心的智能体视频生成框架)\n- **社区热度**: `👍 318 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20571)\n- **研究任务**: 解决长视频生成中，非连续请求之间难以保持空间和时间一致性的问题。\n- **核心亮点**: 提出 ATAS 框架，将剧本编译为带有明确位置、相机和时间参考的镜头请求，利用场景记忆和事件记忆进行检索与更新，确保跨镜头的时空一致性。\n- **深度解析**: \n  - **技术细节**: 将剧本编译为带有显式位置、相机和事件时间参考的镜头请求；构建场景记忆（静态几何）和事件记忆（动态观察）；生成后重建并注册片段，仅在审查和状态检查通过时更新记忆。\n  - **数据集**: 摘要未提供。\n  - **实验结果**: 在四个视频生成器上提高了所有报告的跨镜头一致性指标，并在目标图像空间重访、事件重捕标准及人类评分中取得最高分。\n  - **数字**: 四个视频生成器；六个人类评估标准。\n- **领域归类**: [计算机视觉, 视频生成, AI 智能体]\n---\n\n### 2. Beyond Domain-Routed Supervision: Cross-Teacher Guarding for Multi-Teacher On-Policy Distillation (超越域路由监督：用于多教师在线策略蒸馏的跨教师守护)\n- **社区热度**: `👍 232 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13521)\n- **研究任务**: 解决多教师在线策略蒸馏（MOPD）中，由于教师响应风格和领域专长差异导致的梯度冲突和能力退化问题。\n- **核心亮点**: 提出 Road MOPD，引入非路由教师作为辅助跨域评论家，通过跨教师指导的信用分配和预防性多教师梯度投影来协调多教师监督。\n- **深度解析**: \n  - **技术细节**: 引入非路由教师作为辅助跨域评论家；使用跨教师指导的信用分配（利用教师一致性加强或减弱信号）；预防性多教师梯度投影（利用辅助梯度约束冲突更新并自适应控制投影强度）。\n  - **数据集**: 摘要未提供。\n  - **实验结果**: 缓解了劣势域的性能退化，在高冲突设置下提升超过5个百分点，并在低冲突和三域设置中提高了整体性能。\n  - **数字**: 5个百分点。\n- **领域归类**: [自然语言处理, 模型蒸馏, 大语言模型]\n---\n\n### 3. Player-1: Learning to Play from Synthetic Experience (Player-1：从合成经验中学习游戏控制)\n- **社区热度**: `👍 149 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20584)\n- **研究任务**: 解决游戏智能体学习中依赖大规模演示且缺乏动态状态覆盖，以及可扩展交互训练环境难以获取的问题。\n- **核心亮点**: 提出 Player-1 后训练框架，通过合成经验学习游戏控制；扩展动作空间；构建 Player-1-Gym 合成环境进行强化学习。\n- **深度解析**: \n  - **技术细节**: 扩展计算机使用动作空间（相对指针运动、持续输入、组合动作）；在监督初始化后，使用 PPO 在合成环境中进行多环境强化学习。\n  - **数据集**: 6,044 个精选游戏轨迹；Player-1-Gym（16个合成2D和3D环境）；MineDojo-300；ViZDoom-10；GameWorld。\n  - **实验结果**: Player-1-9B 和 35B-A3B 在 MineDojo-300 上的成功率分别比 SFT 策略提高 27.8 和 17.7 个百分点；Player-1-9B 达到 38.33% 成功率（最强基线为 12.63%）；在 ViZDoom-10 和 GameWorld 上也有提升。\n  - **数字**: 6,044 个轨迹；16 个环境；9B 和 35B-A3B 参数规模；27.8 和 17.7 个百分点；38.33% 和 12.63% 成功率。\n- **领域归类**: [强化学习, 游戏 AI, AI 智能体]\n---\n\n### 4. Doc2Harness: Benchmarking LLMs on Long-Horizon Harness Engineering of Coding Agents (Doc2Harness：对编码智能体的长视界 Harness 工程进行基准测试)\n- **社区热度**: `👍 91 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20344)\n- **研究任务**: 评估大语言模型在长视界任务中直接进行 Harness（执行环境/脚手架）工程的能力。\n- **核心亮点**: 提出 Doc2Harness 两阶段基准，直接评估长视界 harness 工程，通过构建和测试两个阶段，使用四个可观察通道对测试用例进行评分。\n- **深度解析**: \n  - **技术细节**: 两阶段基准：阶段1，构建模型在固定 builder harness 中根据接口契约和开发文档构建候选 harness；阶段2，冻结的候选 harness 在独立容器中由脚本模拟模型驱动；使用四个通道（请求、磁盘文件、退出码、命令输出）评分，并设置正对照排除无效通过。\n  - **数据集**: 整合了12个前沿 harness 行为的开发文档；328 个测试用例。\n  - **实验结果**: 评估了19个前沿模型，GPT-6 Astra 通过率最高（53.05%），最弱模型为 27.44%；即使是最强模型也失败了近一半的测试用例，失败主要集中在跨模块功能的划分上。\n  - **数字**: 12 个前沿 harness；328 个测试用例；19 个前沿模型；3 次独立构建；53.05% 和 27.44% 通过率；约 26 个百分点的差距。\n- **领域归类**: [软件工程, 大语言模型评估, AI 智能体]\n---\n\n### 5. More Methods, Better Agents? A Reality Check on Self-Distillation in Agentic Reinforcement Learning (更多方法，更好智能体？对智能体强化学习中自蒸馏的现实检验)\n- **社区热度**: `👍 71 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19789)\n- **研究任务**: 对智能体强化学习（Agentic RL）中的自蒸馏方法进行公平、全面的比较和现实检验，解决现有评估中基线不一致、缺乏直接比较和忽视训练稳定性及成本的问题。\n- **核心亮点**: 在统一条件下对比了10种代表性自蒸馏方法与 GRPO 的表现，揭示了自蒸馏方法的实际优势与局限性，强调训练稳定性和计算成本的重要性。\n- **深度解析**: \n  - **技术细节**: 在相同实验条件下对比 10 种自蒸馏方法与 GRPO；使用 8 个 rollout 种子进行重复评估；考察训练进度、稳定性和计算成本。\n  - **数据集**: ALFWorld, ScienceWorld, Search-QA, WebShop。\n  - **实验结果**: 1. 相比 GRPO 的提升范围有限，没有方法在所有设置中一致优于 GRPO；2. 强大的最终性能可能掩盖不稳定的训练；3. 额外的训练成本并不能一致地转化为更好的性能。\n  - **数字**: 10 种代表性方法；4 个环境；3 种模型大小；132 次训练运行；12,124.4 个 H800 GPU 小时；8 个 rollout 种子；11 个训练方法（含基线）。\n- **领域归类**: [强化学习, AI 智能体, 模型评估]\n---\n\n### 6. Recovering Reliable Supervision via Critique-Guided On-Policy Distillation (通过批评引导的在线策略蒸馏恢复可靠的监督)\n- **社区热度**: `👍 68 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20572)\n- **研究任务**: 解决在线策略蒸馏（OPD）中教师模型在学生生成错误前缀时无法提供正确监督（即缺乏“可恢复性”）的问题。\n- **核心亮点**: 提出 CriticOPD，利用教师的错误识别能力，让教师对错误的 rollout 进行批评，引导学生重写，从而恢复可靠的监督信号。\n- **深度解析**: \n  - **技术细节**: 教师对错误 rollout 进行批评，学生根据错误重写解决方案；包含批评的特权信息输出由教师评分，而学生使用不包含批评的修订版进行训练。\n  - **数据集**: 6 个数学推理基准。\n  - **实验结果**: 在两个 Qwen3 学生模型和 6 个数学推理基准上提升了 OPD 的性能，在竞赛问题上获得了最大的提升。\n  - **数字**: 2 个 Qwen3 学生模型；6 个数学推理基准。\n- **领域归类**: [自然语言处理, 模型蒸馏, 数学推理]\n---\n\n### 7. Cortex: Consolidating Context into Parametric Memory (Cortex：将上下文巩固到参数记忆中)\n- **社区热度**: `👍 62 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20399)\n- **研究任务**: 解决大语言模型在移除上下文后性能增益丢失的问题，将上下文带来的增益内化到参数记忆中，同时保留非目标能力。\n- **核心亮点**: 提出 Cortex 框架，通过生成前瞻性查询预测上下文用途，并将上下文条件输出蒸馏为可合并的低秩或结构 FFN 更新，实现记忆巩固。\n- **深度解析**: \n  - **技术细节**: 生成前瞻性查询以预测上下文用途；将上下文条件输出蒸馏为可合并的低秩或结构前馈网络（FFN）更新；在单一、批量和顺序更新下测量巩固和保留情况。\n  - **数据集**: 摘要未提供。\n  - **实验结果**: 在大多数评估设置中，Cortex 处于经验巩固-保留帕累托前沿；在 14B 模型上进行 50 次顺序事实编辑后，Cortex-Structural 恢复了 88.9% 的上下文增益，同时保留了 99.8% 的原始非目标性能。\n  - **数字**: 4B-120B 参数规模；50 次顺序事实编辑；14B 模型；88.9% 增益恢复；99.8% 性能保留。\n- **领域归类**: [自然语言处理, 模型编辑, 持续学习]\n---\n\n### 8. LatentLoop: Scaling Looped MoE Models with Asymmetric Compute Allocation (LatentLoop：通过非对称计算分配扩展循环 MoE 模型)\n- **社区热度**: `👍 62 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19975)\n- **研究任务**: 探索循环混合专家（MoE）模型中不同循环访问的贡献，并通过非对称计算分配来提高模型性能并降低计算成本。\n- **核心亮点**: 发现循环 MoE 模型中第一次和第二次访问的作用存在不对称性，提出 LatentLoop 压缩第一次访问的序列，保留第二次全分辨率，并重新分配计算以增加隐藏层大小。\n- **深度解析**: \n  - **技术细节**: 学习分离的残差系数发现第一次访问规模较小；压缩第一次访问的序列，保留第二次全分辨率；重新分配节省的计算以增加隐藏层大小；学习第一次访问对全序列的更新强度；跨访问共享 MoE 权重，但使用独立的注意力参数。\n  - **数据集**: 9 个基准测试。\n  - **实验结果**: 在 15 种配置中一致降低验证 NLL；在拟合 NLL 为 1.988 时，预测计算节省分别为 19.0%（对比 vanilla MoE）和 7.9%（对比循环基线）；在所有尺寸的 0-shot 和 5-shot 设置中提高了 9 个基准的平均分数。\n  - **数字**: 15 种配置；1.3B-7B 参数；超过 10^{21} FLOPs 的最大预算；1.988 拟合 NLL；19.0% 和 7.9% 计算节省；9 个基准。\n- **领域归类**: [自然语言处理, 模型架构, 混合专家模型 (MoE)]\n---\n\n### 9. ActionOPD: Distilling Decisions, Not Tokens (ActionOPD：蒸馏决策，而非 Token)\n- **社区热度**: `👍 52 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19820)\n- **研究任务**: 解决将大型语言模型智能体蒸馏到较小模型时，离线模仿存在状态分布不匹配，而 Token 级在线策略蒸馏（OPD）需要教师 Token 概率和兼容分词器的问题。\n- **核心亮点**: 提出 ActionOPD，一种动作级在线策略蒸馏方法，通过最大化学生在遇到状态下采取教师动作的语义一致性来进行对齐，无需复现教师推理或访问 Token 概率。\n- **深度解析**: \n  - **技术细节**: 在学生遇到的每个状态，从学生和黑盒教师采样动作；根据学生动作与教师动作的语义一致性给予奖励；通过策略优化对齐动作级行为；探索了使用同模型教师和特权上下文的 Self-ActionOPD。\n  - **数据集**: 多样化的精选工具使用任务；tau^2-bench；4 个分布外（OOD）基准。\n  - **实验结果**: 在 4 个 OOD 基准上平均提升 3.3-6.9 个百分点；在 tau^2-bench 上取得了与离线蒸馏和 Token 级 OPD 相当的竞争力；随学生规模和教师能力的提升而良好扩展。\n  - **数字**: 3.3-6.9 个百分点；4 个 OOD 基准；Qwen3-4B 和 Qwen3-8B 模型。\n- **领域归类**: [自然语言处理, 模型蒸馏, AI 智能体]\n---\n\n### 10. Seeing, Maintaining, and Learning: The Evolution of Multimodal Agent Memory (观察、维护与学习：多模态智能体记忆的演进)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19366)\n- **研究任务**: 解决多模态智能体在长视界任务和终身设置中，从复杂异构多模态数据中持续获取有用信息的挑战，分析其记忆机制。\n- **核心亮点**: 提出一个双轴分析框架来结构化多模态智能体记忆，轴 I 关注信息的形成与表示，轴 II 关注记忆管理（静态、动态、自进化），并综合了设计模式和原则。\n- **深度解析**: \n  - **技术细节**: 提出双轴分析框架：轴 I（形成与表示）表征保留和编码的信息（如特定模态嵌入、文本/结构化记录、潜在/参数表示）；轴 II（记忆管理）区分三个层级：T1 静态记忆、T2 动态记忆（稳定策略更新）、T3 自进化记忆（演进策略更新）。\n  - **数据集**: 摘要未提供。\n  - **实验结果**: 摘要未提供。\n  - **数字**: 摘要未提供。\n- **领域归类**: [多模态, AI 智能体, 综述]\n---\n\n### 11. LensErase: A Foundation Model for Erase Anything (LensErase：一个用于擦除任何事物的基础模型)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18072)\n- **研究任务**: 图像中的通用物体与元素擦除（涵盖对象、视觉文本、水印、相关视觉效果、多对象移除及多种尺度和分辨率）。\n- **核心亮点**: 提出了基于掩码的通用擦除基础模型 LensErase；构建了包含 1.0107 亿个配对样本的大规模数据集 LensErase-100M；提出 Mask-Aware RoPE（3D旋转位置编码）和 TraceFusion 技术以优化掩码注入与内容保留。\n- **深度解析**: 模型从 text-to-image 模型 Lens 预训练而来。通过 Mask-Aware RoPE 将掩码信息直接注入源图像 token，无需引入单独的掩码 token 序列。通过监督微调和带有合同引导、区域感知奖励的强化学习进行微调。推理时应用 TraceFusion 保留有效编辑区域外的高保真内容。在 6 个公开基准和 LensErase-Bench 上，参考和无参考 VLM 评估指标均取得显著提升。摘要未提供具体的提升数值。\n- **领域归类**: [计算机视觉, 图像编辑, 基础模型]\n---\n\n### 12. KV4-RL: Unlocking Faster Asynchronous Rollouts for RLVR with INT4 KV Cache Quantization (KV4-RL：利用 INT4 KV 缓存量化解锁 RLVR 的更快异步展开)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14448)\n- **研究任务**: 加速具有可验证奖励的强化学习（RLVR）中的异步展开（rollout）过程。\n- **核心亮点**: 提出 KV4-RL，结合免校准的 INT4 KV 量化与对注意力汇聚（attention sinks）和近期上下文的选择性 INT8 保护，在保持加速的同时减少采样器不匹配。\n- **深度解析**: 异步展开通过减少长尾生成期间的利用率不足来提高 RLVR 效率，但会增加每步的 KV 工作量。研究发现 KV 缓存量化比仅权重或权重-激活量化加速更大。KV4-RL 保护有限数量的位置以减少采样器不匹配。在 Qwen3-8B-Base 的 400 次 GRPO 训练迭代中，相比 BF16 展开，实现了 1.80 倍的累积展开加速和 1.27 倍的累积全迭代加速，最后 50 次迭代达到 1.97 倍展开加速。在 BF16 评估器下，Qwen3-4B-Base 和 Qwen3-8B-Base 的最终六基准平均准确率与 BF16 展开训练的差距在 0.5 个百分点以内。摘要未提供其他具体技术细节。\n- **领域归类**: [大语言模型, 强化学习, 模型加速, 量化]\n---\n\n### 13. Towards Agentic Robots: Model, Data, Environment, and Harness (迈向智能体机器人：模型、数据、环境与测试框架)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20442)\n- **研究任务**: 对“智能体机器人（Agentic Robots）”领域的现有研究进行统一综述，涵盖模型、数据、环境和测试框架四个功能领域。\n- **核心亮点**: 首次对智能体机器人进行统一概述，将现有研究组织为四个功能领域下的 17 个类别，探讨了从机器人策略到智能体系统的发展。\n- **深度解析**: 基础模型正推动机器人智能的范式转变，从低级动作预测转向目标导向的数据收集、模型训练、任务规划和现实执行。智能体机器人能够推理人类指令、与机器人环境交互、自主纠正执行错误并动态调整操作策略。文章追溯了视觉-语言-动作模型、世界模型和世界-动作模型的发展。摘要未提供具体的实验结果或数据集数字。\n- **领域归类**: [机器人学, 智能体, 综述, 具身智能]\n---\n\n### 14. Hybrid Reasoning Agents (混合推理智能体)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18861)\n- **研究任务**: 构建一种能够超越人类语言进行思考，同时仍能通过语言在外部环境中采取行动的智能体（结合潜在推理与基于文本的交互）。\n- **核心亮点**: 提出混合推理智能体（HybridAgents），在统一生成过程中动态导航潜在推理和基于文本的交互；提出 HybridLink 实现无缝转换，并保持连续工作记忆；开发 HybridSFT 和 HybridRL 后训练算法。\n- **深度解析**: 架构上，轻量级 HybridLink 实现文本和潜在模式间的无缝转换，连续工作记忆保留无损混合上下文。HybridSFT 教导骨干网络与 HybridLink 协调以稳定工具集成的混合生成；HybridRL 学习何时在潜在空间思考、何时通过文本行动。在 3 个模型规模和 11 个基准上评估，相比前沿 LLM 智能体和框架，性能一致提升 10.4%，同时减少 35.5%-54.7% 的 token，推理速度提升 1.8x-2.6x，成本节省 2.7x-3.7x。摘要未提供其他具体数据集名称。\n- **领域归类**: [大语言模型, 智能体, 推理, 强化学习]\n---\n\n### 15. RuleTrek: Benchmarking Agentic Rule Reasoning in Complex Scenarios (RuleTrek：复杂场景下智能体规则推理基准测试)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19698)\n- **研究任务**: 评估大语言模型智能体在复杂场景（信息分布在多个文件中）下的领域特定规则识别与应用能力。\n- **核心亮点**: 引入多领域基准 RuleTrek，用于复杂场景下的智能体规则推理；提出基于规则构建的流水线，提取结构化规则图并生成子场景；评估规则识别（RI）、规则推演（RD）和端到端规则推理（E2E）三种能力。\n- **深度解析**: 现有基准通常只用几个事实陈述来表示场景，简化了规则识别。RuleTrek 确保一致性和可解性。在 11 个前沿 LLM 上的实验表明，最高 RI 和 RD 分数仅为 62.47% 和 60.43%，E2E 分数在 26.97% 到 55.29% 之间，证明当前 LLM 智能体在复杂场景规则推理中面临巨大挑战。摘要未提供具体的模型名称和详细数据集规模。\n- **领域归类**: [大语言模型, 智能体, 基准测试, 逻辑推理]\n---\n\n### 16. Many Right Answers, One Training Example: Removing Responder Noise from GRPO for LLM Recommenders (多个正确答案，一个训练样本：从 LLM 推荐系统的 GRPO 中消除回答者噪声)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17771)\n- **研究任务**: 优化使用强化学习（RL）训练大语言模型推荐系统时的奖励机制，解决多个有效人类回答带来的噪声问题。\n- **核心亮点**: 提出 ReMaRk 方法，针对每个请求（而非每个回答）进行评分，将生成列表与所有回答标题的并集进行对比，并对每个请求进行等概率采样，从而降低 RL 训练成本并消除回答者噪声。\n- **深度解析**: 现有的 Rank-GRPO 方法每个训练样本只选择一个回答，导致优势（advantage）主要记录抽取了哪个回答（占方差的 85%），而非列表的质量。ReMaRk 在 7 个骨干网络和 3 个数据集上，仅需 25% 到 53% 的步数即可达到 2000 步每回答 RL 的验证召回率。在 ProtoQA（每题约 100 人回答）上同样有效。摘要未提供具体的骨干网络名称和数据集名称。\n- **领域归类**: [大语言模型, 强化学习, 推荐系统, 优化算法]\n---\n\n### 17. CLASHarness: Benchmarking Multi-Agent Conflict in Computer Use via a Controllable and Verifiable Generation Pipeline (CLASHarness：通过可控且可验证的生成管道对计算机使用中的多智能体冲突进行基准测试)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19128)\n- **研究任务**: 评估视觉语言模型（VLM）在多智能体系统自动化计算机使用工作流中解决冲突（如信息不一致、矛盾指令、权限竞争）的能力。\n- **核心亮点**: 引入 CLASHarness 框架，用于生成可验证的多智能体冲突，包含 600 个多轮任务基准；结合分层场景规划和八步验证微管道，确保每个任务通过构建即可解。\n- **深度解析**: 评估 15 个前沿模型揭示了三个核心瓶颈：1) 弱模型盲目跟随误导信息，强模型检查视觉证据；2) 解决冲突比发现冲突难得多，主动修复系统状态会显著降低任务成功率；3) 协调协议是普遍瓶颈，即使是前沿模型在超过 58% 的关闭动作中也会失败（如忘记释放共享锁）。摘要未提供具体的模型名称。\n- **领域归类**: [视觉语言模型, 多智能体系统, 计算机使用, 基准测试]\n---\n\n### 18. The Thinking Leakage in Reinforcement Learning for LLMs (大语言模型强化学习中的“思维泄露”现象)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14270)\n- **研究任务**: 探究混合推理模型（如 Qwen3 系列）在无思考（NO-THINK）模式下进行强化学习（RL）训练时，性能提升的真实来源。\n- **核心亮点**: 发现并证明了“思维泄露（thinking leakage）”现象：NO-THINK 模式下的 RL 性能提升，很大程度上来自于部分重新激活了原始模型思考（THINK）模式的推理能力，而非学到了增强的推理行为。\n- **深度解析**: 在 Qwen3-1.7B、4B 和 8B 上使用 GRPO 在 NO-THINK 模式下训练。随着准确率提高，响应变长且更具反思性，内部激活向 THINK 模式偏移。在 Qwen3-8B 中，用原始模型值替换 RL 训练模型的低维 THINK 相关激活子空间会消除大部分 RL 增益，反向交换则能将大部分增益转移给原始模型。GRPO 训练信号中，受优势加权更新青睐的响应更像 THINK 模式。摘要未提供具体的准确率提升数值。\n- **领域归类**: [大语言模型, 强化学习, 模型可解释性, 推理]\n---\n\n### 19. Super-Resolution in The Right Latent Space: A Frozen Vision-Foundation Substrate (在正确的潜在空间中进行超分辨率：冻结的视觉基础基底)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04781)\n- **研究任务**: 图像真实世界超分辨率（SR），旨在将退化图像的嵌入映射回高分辨率自然图像流形上，同时保留语义和像素细节。\n- **核心亮点**: 提出使用冻结的 DINOv3-L 的 23 个融合层的潜在空间作为 SR 的基底（substrate），该空间包含从像素记录到抗退化语义的层次信息，使退化图像嵌入更靠近流形。\n- **深度解析**: 现有的重建导向潜在空间或像素空间不是 SR 的正确基底。在 DINOv3-L 基底上，训练了一个 415M 的解码器，在重建和对抗目标下进行一次传递映射和解码。所得模型 RAESR 在 RealSR、DRealSR、LSDIR 和 DIV2K-Val 上实现了最佳的保真度-感知权衡，在单个 H20 GPU 上处理 512x512 图像仅需 37 ms。摘要未提供具体的保真度或感知指标数值。\n- **领域归类**: [计算机视觉, 图像超分辨率, 潜在空间, 视觉基础模型]\n---\n\n### 20. HumanoidToolBench: Benchmarking Humanoid Tool Use from Selection to Mobile Execution (HumanoidToolBench：从选择到移动执行的人形机器人工具使用基准测试)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02089)\n- **研究任务**: 评估人形机器人在超越自身物理极限的任务中，选择合适工具并协调操作和移动执行的能力。\n- **核心亮点**: 引入 HumanoidToolBench，包含 18 个任务的基准测试（涵盖 3 种场景、3 个执行级别和 2 种工具集模式），以及包含 3100 个演示的数据集 ToolBook（在仿真和真实 Unitree G1 上收集）。\n- **深度解析**: 评估了 7 种仿真策略和 3 种真实机器人策略，揭示了选择合适工具与完成任务之间存在巨大差距。针对 GR00T N1.7 的探测显示，在未见过的工具上选择准确率下降，且在无关指令下仍继续执行任务。摘要未提供具体的成功率数值。\n- **领域归类**: [机器人学, 人形机器人, 工具使用, 基准测试]\n---\n\n### 21. APT: Feedback-Driven Agentic Post-Training for Text-to-Image Generation (APT：面向文本到图像生成的反馈驱动智能体后训练)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18097)\n- **研究任务**: 改进文本到图像模型的后训练过程，解决现有流程依赖人工整理训练数据和固定训练分布的问题。\n- **核心亮点**: 提出 APT（智能体后训练）全自动框架。该框架协调三个智能体，根据用户需求构建评估集，诊断模型特定的优势与失败模式，并生成强调薄弱能力的强化学习数据。通过不断评估、诊断和更新生成器，APT 让当前模型的行为塑造其下一步的训练任务，形成受递归自我改进启发的反馈循环。\n- **深度解析**: 摘要未提供具体的实验结果、数字、数据集或技术细节。论文仅说明 APT 在多个基础模型、基准测试和生成架构上进行了实验，证明其具有模型无关性、基准无关性、架构无关性且完全自动化。针对没有用户指定评估场景的通用设置，还开发了一个评估工具以实现广泛且多样的评估集生成。\n- **领域归类**: [多模态生成, 智能体, 模型后训练]\n---\n\n### 22. DecisionRobust: Benchmarking Robustness for JEV Style Decision Models Across Text and Vision (DecisionRobust：跨文本和视觉的 JEV 风格决策模型鲁棒性基准测试)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19118)\n- **研究任务**: 评估 JEV 风格等新兴决策模型在面临对抗性操纵时的可靠性与鲁棒性。\n- **核心亮点**: 引入 DecisionRobust 基准，系统评估决策模型在文本和视觉输入下的鲁棒性。该基准涵盖实际决策场景和多种攻击方式，包括语义保留的文本扰动、图像扰动以及两种模态下的提示词注入，并通过外部有效性检查和跨模型候选选择来构建评估集。\n- **深度解析**: 摘要提到评估了 30 种文本任务模型配置和 17 种视觉任务模型配置（分别包含 24 和 12 个未参与候选选择的保留模型）。实验发现：攻击暴露了构建和选择模型之外的漏洞，但优化后的图像扰动对许多目标的迁移能力较弱；模型的相对鲁棒性因任务和攻击类型而异，且对输入扰动的抵抗力不一定意味着对提示词注入的抵抗力；标签一致性检查显著降低了文本和图像设置下测量的攻击成功率，凸显了验证表面失败的重要性。\n- **领域归类**: [模型评估/基准测试, 模型鲁棒性/安全性, 多模态]\n---\n\n### 23. LabInstruct: Benchmarking Situated Instructional Video Generation for Lab Procedures (LabInstruct：面向实验室程序的具身教学视频生成基准测试)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14020)\n- **研究任务**: 评估视频生成模型在真实实验室环境中生成教学视频的可靠性，以弥补 AI 生成计划与物理实验执行之间的人类指导需求。\n- **核心亮点**: 提出 LabInstruct 基准，专注于真实实验室环境中的具身教学视频生成。该基准包含 5 个科学学科的 204 个任务，具有真实的参考执行视频，并对对象、动作、接触和状态转换进行了结构化注释。\n- **深度解析**: 摘要提到评估了 8 个前沿的图像到视频模型。实验发现，视觉上看似合理的生成在程序上经常是不正确的，这揭示了当前模型的视觉逼真度与实验指导所必需的可靠性之间存在巨大差距。\n- **领域归类**: [视频生成, 基准测试, 科学计算/自动化实验室]\n---\n\n### 24. SwarmRSI: Recursive Self-Improvement through Evolving Scientific Agent Swarm (SwarmRSI：通过演化科学智能体群实现递归自我改进)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20431)\n- **研究任务**: 通过智能体自身的实验经验提高科学研究智能体的研究能力，解决不良实验结果难以区分是假设问题还是实现问题，以及整体程序分数掩盖有用组件的问题。\n- **核心亮点**: 提出 SwarmRSI 框架以演化科学智能体群。设计了“反馈引导的群体变异”机制，利用其他智能体的实验反馈来优化假设及其实现；提出“互补群体重组”机制，跨智能体重用保留的假设和互补程序组件，使部分结果能够支持新的研究。两者结合形成反馈循环。\n- **深度解析**: 摘要提到在 OpenProblems、NatureBench 和 MLE-Bench Lite 上进行了实验，展示了 SOTA（当前最佳）性能。进一步的评估表明，累积的研究经验提高了在保留任务上的性能。此外，生物学家还复现了其程序用于后续的生物学分析。摘要未提供具体的实验数字或技术细节。\n- **领域归类**: [AI for Science, 智能体, 递归自我改进]\n---\n\n### 25. τ-Emotion-Bench: Exposing the Interaction Fragility of LLM Agents through Real-World User Emotions (τ-Emotion-Bench：通过真实世界用户情绪暴露 LLM 智能体的交互脆弱性)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19560)\n- **研究任务**: 评估长视野工具调用任务中，LLM 智能体在用户情绪变化（非合作或行为不稳定）下的交互可靠性。\n- **核心亮点**: 引入 τ-Emotion-Bench（涵盖 10 个领域），在控制情绪条件的用户交互下评估工具调用智能体，同时保持底层任务目标不变。提出 Tracer 数据生成管道，通过允许不满意的用户终止低效交互，提供交互感知信号来过滤过度依赖用户的轨迹，并倾向于有效的工具使用。\n- **深度解析**: 摘要提到使用两个用户模拟器进行实验，发现前沿智能体仍然不可靠，平均任务成功率和一致任务完成率之间存在巨大差距。Tracer 生成的监督数据持续提高了 Qwen3 模型（跨尺度）的性能，并泛化到未见领域及迁移到 τ-Bench 和 τ-Trait。行为分析表明，更高的任务成功率与工具执行和必要用户跟进之间的更好平衡相关。摘要未提供具体的实验数字。\n- **领域归类**: [智能体, 基准测试, 人类-AI 交互]\n---\n\n### 26. SkillMarker: A KGW-Based Watermarking Method for Agent Skill Ownership Verification (SkillMarker：一种基于 KGW 的智能体技能所有权验证水印方法)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15725)\n- **研究任务**: 解决智能体技能（操作程序和领域专业知识）在明文分发时面临的未授权复制和泄露问题，实现技能所有权验证和泄露追踪。\n- **核心亮点**: 提出 SkillMarker，一种基于 KGW 的水印方法，将质量约束重写与面向信号的候选搜索统一起来。前者分离必要知识和灵活表达以保持指令保真度，后者在保留约束下探索替代表达以获得更强的水印信号，从而兼顾功能保留和强水印嵌入。\n- **深度解析**: 摘要未提供具体的实验结果、数字或技术细节。论文仅说明发布了一个开源工具包，集成了水印嵌入、质量审计和检测功能，旨在支持分布式技能生态系统中的所有权验证和泄露追踪（针对内容被全部/部分复制或合并到其他技能中的情况）。\n- **领域归类**: [智能体, 模型安全/水印, 知识产权]\n---\n\n### 27. RAR: Rate-Adaptive Rollout for Time-Consistent Interactive World Models (RAR：面向时间一致性交互式世界模型的速率自适应推演)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16302)\n- **研究任务**: 解决基于视频的交互式世界模型在固定时间速率下训练和推演导致的“时间速率耦合”问题（即运行时吞吐量与学习时间速率不匹配导致世界演化过快或过慢，以及单一速率在时间粒度和物理视野之间的权衡）。\n- **核心亮点**: 提出速率自适应推演（RAR）框架。核心是 Stride-RoPE，将不同速率采样的潜在帧对齐到共享的物理时间坐标上，实现一致的多速率推演、未见速率泛化和在线速率切换。同时使用多步长视频采样联合学习细粒度动力学和长视野演化。\n- **深度解析**: 摘要未提供具体的实验结果、数字或技术细节。论文仅说明 RAR 在动作和相机控制环境中实现了时间一致的多速率推演和在线速率切换，同时保持了高速率生成质量，并在匹配的训练预算下延长了物理视野，且可迁移至预训练的世界模型并保持感知质量。\n- **领域归类**: [世界模型, 视频生成, 交互式环境]\n---\n\n### 28. ProgAgent: Learning Tool Orchestration through Programmatic Training (ProgAgent：通过程序化训练学习工具编排)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14774)\n- **研究任务**: 解决 LLM 智能体在长视野任务中使用直接工具调用（DTC）导致的上下文腐烂和编排崩溃问题，探索程序化工具调用（PTC）在智能体训练中的益处。\n- **核心亮点**: 引入 ProgAgent，一个完整的 PTC 训练栈，包括合成可验证长视野任务的管道、轻量级 PTC 运行时和两阶段训练配方。与 DTC 将工具响应累积在上下文中不同，PTC 通过可执行代码调用工具，并将中间结果存储在运行时变量中。\n- **深度解析**: 摘要提到仅使用在 4 个环境规模下实例化的 215 个任务，ProgAgent 在 4 个基准测试中产生了比同等规模基线更高的通过率。在 LOCA-bench 上，ProgAgent-14B 在 64k-token 环境状态下实现了 30.7% 的通过率，而基线得分为零。跨环境实验表明，PTC 训练的模型在两种评估接口下均优于 DTC 训练的模型，证明 PTC 训练的益处超越了接口本身。\n- **领域归类**: [智能体, 工具调用, 模型训练]\n---\n\n### 29. GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning (GroundGUI：通过高质量数据和蒸馏到强化学习实现 GUI 视觉定位)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19100)\n- **研究任务**: 构建强大的 GUI 智能体所依赖的多模态视觉定位能力，解决缺乏针对多样化环境的高保真资源的问题。\n- **核心亮点**: 引入 ScreenRef 数据集（包含 586K 截图和超过 633K 指代表达实例，涵盖桌面、Web 和移动端）。提出蒸馏到强化学习（D2RL）方法，解决监督微调泛化能力有限和强化学习奖励稀疏的问题。\n- **深度解析**: 摘要提到利用 ScreenRef 训练 Qwen3-VL-8B-Instruct，生成 GroundGUI-8B。该模型在 ScreenSpot-V2 上达到 95.2%，ScreenSpot-Pro 上 63.9%，OSWorld-G 上 65.4%，MMBench-GUI L2 上 86.8%，UI-Vision 上 38.3%。在 8B 规模模型中，相比在开源数据集上训练的模型有大幅提升，性能媲美甚至超越在闭源数据上训练的模型。\n- **领域归类**: [GUI 智能体, 视觉定位, 数据集, 强化学习]\n---\n\n### 30. Apertus 1.5: From Open Text Models to Open Multimodal Reasoners (Apertus 1.5：从开放文本模型到开放多模态推理模型)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15542)\n- **研究任务**: 将完全开放的 Apertus 模型家族从纯文本扩展到多模态推理，证明在公开数据上由公共机构构建开放基础设施的可行性。\n- **核心亮点**: Apertus 1.5 在 1.0 基础上继续预训练（8B 增加 4T tokens，70B 增加 2T tokens），增加图像和音频理解，上下文窗口扩展四倍至 262,144 tokens。多模态通过分词器引入，语言模型头仍限于文本。训练包含 SFT、长上下文微调、可验证奖励 RL 和偏好对齐。“思考（Thinking）”是聊天模板的标志而非独立模型。\n- **深度解析**: 摘要提到 8B 模型的数学推理能力提升了高达 20 分。在几乎所有基准测试上都优于前代。在同类完全开放模型中，8B 在知识、指令遵循和文化基准上领先，其指令遵循超越了所有对比模型（包括开放权重模型）。在图像和音频理解上，与完全开放的多模态模型具有竞争力，在文档理解、长文本和低资源语音识别上表现最强。模型仅使用公开可用数据训练，尊重爬虫退出，排除限制性许可材料，并发布了模型权重、数据准备和训练配方。\n- **领域归类**: [大语言模型, 多模态, 开源模型]\n\n### 31. Efficient Scene-Text Refinement via Pixel-Space Grouped Image Generation (通过像素空间分组图像生成实现高效的场景文本优化)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18284)\n- **研究任务**: 场景文本优化（Scene-text refinement），旨在解决生成图像中小文本和复杂字符存在的局部错误，提高图像的可读性和实用性，同时兼顾准确性、内容保留和效率。\n- **核心亮点**: 提出 PixText 模型，将局部文本优化转化为像素空间的分组图像生成任务；引入 MeanFlow 实现四步快速生成；构建了 Text Refinement Bench 评估基准。\n- **深度解析**: 现有的基于 VAE 的方法在重建时容易丢失精细笔画，而全图编辑又会导致背景颜色偏移。PixText 以原始图像为条件，仅生成目标文本区域，从而完美保留未编辑的内容。在 Text Refinement Bench 上，PixText 取得了 83.06% 的字形通过率和 94.66% 的精确目标字符 OCR 准确率，远超最强基线的 36.77% 和 52.31%。其四步 MeanFlow 变体在每张图像不到一个 GPU 秒的摊销生成成本下，依然保持了 81.84% 的通过率。\n- **领域归类**: [计算机视觉, 图像生成, 文本渲染]\n\n---\n\n### 32. Are We Testing Too Much? A Survey of Benchmark Compression for Efficient Evaluation of Large Language Models (我们测试得太多了吗？大语言模型高效评估的基准压缩综述)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18248)\n- **研究任务**: 大语言模型（LLM）的基准压缩（Benchmark compression），旨在通过部分评估来估计完整基准的分数和排名，从而大幅降低模型评估的成本。\n- **核心亮点**: 首次系统性地梳理和总结了基准压缩领域的方法与发现；提出了涵盖单个基准内、跨基准套件以及自适应评估期间的全面分类法。\n- **深度解析**: 该综述回顾了 119 篇论文，详细解释了各类方法如何选择评估内容、恢复完整基准结果并验证其可靠性。研究表明，通过选择代表性子集、利用更廉价或可复用的信息以及进行自适应测试，可以有效降低评估成本，但也伴随着覆盖率不足、估计不准确和顺序延迟等风险。该分类法和实用指南为研究人员选择、验证和部署更高效的 LLM 评估方法提供了重要参考。\n- **领域归类**: [自然语言处理, 模型评估, 综述]\n\n---\n\n### 33. APEX-Harm: Evaluating Agent Safety in Shared Professional Workspaces (APEX-Harm：评估共享专业工作空间中的智能体安全性)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13623)\n- **研究任务**: 评估在共享专业工作空间中执行长期任务的智能体，在面对提示注入和脚本注入攻击时的安全性。\n- **核心亮点**: 引入 APEX-Harm 基准，模拟包含大量文件和多种工具的大型专业工作空间；涵盖六种攻击类别；对 12 个前沿模型进行了全面评估。\n- **深度解析**: 专业智能体在包含文件、消息和业务应用的共享工作空间中工作，存在难以捕捉的安全风险。APEX-Harm 每个任务包含 115 到 328 个文件及多种 MCP 服务器工具。评估显示，Opus 5 和 Sonnet 5 的总体攻击成功率最低（分别为 8% 和 20%），但特定任务脚本替换和攻击者提供的通用脚本攻击依然非常有效（平均成功率分别为 81-84% 和 73%）。Gemini 3.8 Flash 任务得分最高（0.877），但攻击成功率仍有 33%。结果证明，智能体即使能正确完成任务，也可能在执行过程中进行未授权的有害操作。\n- **领域归类**: [人工智能安全, 智能体评估, 大语言模型]\n\n---\n\n### 34. Diagnosing and Correcting Reward Hacking in Verifiable Instruction Following (诊断和纠正可验证指令遵循中的奖励黑客问题)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19525)\n- **研究任务**: 解决可验证指令遵循基准中，模型为了最大化输出约束满足度而忽略实质性回答内容（即奖励黑客/Reward Hacking）的问题。\n- **核心亮点**: 提出 CALIF 方法，通过校准的基于似然的奖励来增强验证器奖励，以保留响应质量；无需额外的评判器或学习奖励模型。\n- **深度解析**: 前沿模型可以通过提供几乎没有实质答案内容的响应来获得满分，使用相同的验证器标准作为训练奖励会导致强化学习后约束满足度提高但响应质量下降。CALIF 使用现有的冻结参考策略，仅根据请求本身评估响应似然。在 1.7B 到 8B 的推理和非推理模式模型中，CALIF 在 IFBench 上提高了约束满足度，同时将响应质量保持在预 RL 水平附近或之上。在三个基于评分的指令遵循基准的 45 个模型-指标比较中，有 40 个超越了相应的基线策略。\n- **领域归类**: [自然语言处理, 强化学习, 指令遵循]\n\n---\n\n### 35. Long-Horizon RL Needs Muon (长期强化学习需要 Muon)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20256)\n- **研究任务**: 提升长期智能体（Long-horizon agents）在稀疏结果奖励下的强化学习训练效果，涉及推理、工具使用和环境反馈的协调。\n- **核心亮点**: 提出一种结合 Muon 优化器、token 平均损失、截断重要性采样以及辅助长度和工具错误惩罚的单次 rollout 异步训练配方。\n- **深度解析**: 长期智能体需要从不同长度的轨迹中进行学习，并在 rollout 收集过程中更新策略。单次 rollout 采样允许异步学习，无需等待同一问题的多个轨迹。研究在两个模型家族中探讨了仓库级问题解决（repository-level issue resolution）的优化器选择和配方组件。评估的训练运行表明，完整配方比基线具有更高的训练成功率。摘要未提供具体的实验数字、数据集名称或详细的技术指标。\n- **领域归类**: [强化学习, 大语言模型, 智能体]\n\n---\n\n### 36. Joint Subspace Sparse Attention for Efficient Long-Context Decoding (联合子空间稀疏注意力用于高效的长上下文解码)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19026)\n- **研究任务**: 解决长上下文大语言模型解码中 KV-cache 流量主导的问题，通过细粒度的 token 级稀疏注意力提高解码效率。\n- **核心亮点**: 提出联合子空间稀疏注意力（JSSA），通过学习共享的低维 query-key 子空间提高选择质量，并开发无 gather 的 token 级索引注意力内核提高执行效率。\n- **深度解析**: 现有的 token 级选择面临低维评分丢失结构和 gather 操作抵消延迟收益的挑战。JSSA 通过最小化 token-score 保留误差来学习子空间，并推导出闭式谱解。无 gather 内核支持标准 GQA KV-cache 布局下每个 KV-head 的不同选择。在 NVIDIA B200 GPU 上，128K 上下文下 JSSA 的解码吞吐量达到全 KV 注意力的 6.43 倍。在 700B 规模大模型上，JSSA 的推理准确率与模型原生 DSA 相当，并达到其 96-99% 的解码吞吐量。\n- **领域归类**: [自然语言处理, 模型加速, 注意力机制]\n\n---\n\n### 37. SafeDriveVLA: Navigation-Conditioned World Model Dreaming for Conflict-Aware End-to-End Autonomous Driving (SafeDriveVLA：用于冲突感知端到端自动驾驶的导航条件世界模型梦境生成)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20609)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在自动驾驶中因开放式的自然语言导航接口而暴露的安全漏洞（如不谨慎或恶意的危险指令）。\n- **核心亮点**: 提出首个同时评估导航跟随和冲突感知及对抗鲁棒性的基准套件；提出 SafeDriveVLA，显式预测三级导航合规模式，并使用导航条件世界模型梦境生成来辅助预测。\n- **深度解析**: 现有 VLA 在闭环中无法完成语言指令变道，且在冲突信号下性能急剧下降。SafeDriveVLA 将冲突推理与动作生成解耦，其世界模型梦境生成严格遵循导航信号以预测何时跟随是安全的。在 Bench2Drive 上，SafeDriveVLA 达到 88.16 驾驶分数（DS）和 68.64% 成功率（SR），闭环语言跟随提升 49.3%，在不安全指令下的碰撞次数从最佳 SimLingo 变体的 60 次减少到 38 次。\n- **领域归类**: [自动驾驶, 视觉语言模型, 人工智能安全]\n\n---\n\n### 38. LLM-to-Flow Distillation: Teaching Natural Language Goals to Scientific Generators (LLM 到 Flow 的蒸馏：将自然语言目标教授给科学生成器)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17246)\n- **研究任务**: 将科学生成器（如基于 flow 和 diffusion 的模型）与高层自然语言科学发现目标对齐，且无需显式的代理奖励。\n- **核心亮点**: 提出 LLM-to-Flow Distillation (LFD)，冻结的 LLM 作为自适应教师，通过构建中间子目标课程并使用 DPO 将判断迭代蒸馏到特定领域的生成器中。\n- **深度解析**: 基础 LLM 具有广泛的科学知识，而领域特定的生成器能捕获产生有效序列和几何结构的先验。LFD 中，LLM 根据当前目标评估采样候选者，产生的偏好通过 DPO 蒸馏到生成器中。即使初始模型对满足最终目标的设计概率极低，该过程也能提供密集的学习信号，使其适应覆盖不足的分布外区域。在治疗性肽和小分子结构设计实验中，LFD 实现了一种新的生成控制形式。摘要未提供具体的实验数字或评估指标。\n- **领域归类**: [AI for Science, 生成模型, 知识蒸馏]\n\n---\n\n### 39. Share the Symbol, Not the Vector: Training-Free Fact Communication Across Language Models (共享符号而非向量：跨语言模型的免训练事实通信)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19696)\n- **研究任务**: 实现异构大语言模型之间的免训练事实通信，解决多智能体系统中共享内部模型状态需要学习翻译器或模型兼容性假设的问题。\n- **核心亮点**: 引入 SYNC（符号索引神经通信），一种基于词索引的接口，发送者发送共享列表中词的索引，接收者使用自己的词方向将事实写入隐藏状态，无需微调或学习翻译器。\n- **深度解析**: 发送者根据描述从共享列表中选择词并发送索引，接收者利用预先拟合的激活向量将描述的事实写入其隐藏状态。在三个不同发送者和九个来自五个家族的较新接收者的测试中，新场景的四答案成功率达到 72.0-98.3%，比中间层写入高出最多 96 个百分点，两个最大的接收者匹配纯文本效果。无任务探针能提前预测新接收者可使用的深度（45/45 准确）。在无需重新调整的情况下，列出所有事实的消息在新布局下保持 89.6-100% 的成功率。\n- **领域归类**: [多智能体系统, 模型通信, 大语言模型]\n\n---\n\n### 40. What Makes a Social Agent's Interactions Effective? Learning from Verifiable Outcomes in Paired Worlds (是什么让社交智能体的交互有效？从配对世界的可验证结果中学习)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20195)\n- **研究任务**: 评估和学习社交智能体的有效交互，确保智能体不仅能流畅对话，还能达成符合参与者需求和情况的实际计划。\n- **核心亮点**: 引入 HICO-Bench 基准（180个日常协调场景），通过程序检查可行性和 LLM 评判完整性来验证成功；提出 Paired-Credit Policy Optimization (PaCPO) 从对话末尾才到达的结果中学习。\n- **深度解析**: 现有评估依赖 LLM 评判对话而不检查结果计划。HICO-Bench 中，两个具有私有信息的智能体对话并记录计划。在 13 个 LLM 中，36% 被评为高度完成目标的对话未能通过验证成功。PaCPO 在每轮后要求智能体提供暂定计划，并在场景的两个版本中检查，奖励暂定计划符合其对应版本的轮次。PaCPO 将 Qwen3-8B 的验证成功率从 20.4% 提高到 28.3%。\n- **领域归类**: [自然语言处理, 社交智能体, 强化学习]\n\n### 41. From Failures to Learnable Worlds: Policy-Conditioned Environment Generation for Navigation Agents (从失败到可学习世界：面向导航智能体的策略条件环境生成)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19420)\n- **研究任务**: 为具身导航智能体生成针对性的训练环境，以解决预训练策略在特定环境中的失败问题。\n- **核心亮点**: 提出 WEDGE 框架，利用预训练智能体的失败模式来指导训练环境的生成。通过大语言模型提出可执行的弱点特征，自动验证并选择最强的弱点，将其映射到环境因素上，从而在智能体表现挣扎的难度区间构建环境。\n- **深度解析**: 现有的环境生成通常优化真实性、多样性等通用属性，但不同预训练策略失败的原因各异。WEDGE 通过对比成功和失败的轨迹，利用大语言模型提取弱点特征，并在诊断集上进行验证。随后，将验证后的弱点映射到控制它们的环境因素上，生成针对性的训练经验。实验表明，该方法在 ProcTHOR 上持续优于随机和困难样本替代方案，且对 Uni-NaVid 和 Gemini 的增益可泛化至 HM3D。迭代重新诊断显示，主导弱点会随策略改进而持续或转移，为后续环境构建提供更新指导。\n- **领域归类**: [具身智能, 强化学习, 环境生成, 导航]\n---\n\n### 42. Rethinking Projector Training in Multimodal LLMs (重新思考多模态大语言模型中的投影器训练)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18598)\n- **研究任务**: 探究多模态大语言模型中视觉编码器与语言模型对齐的投影器（projector）训练阶段的作用，并提出更高效的初始化方法。\n- **核心亮点**: 发现仅使用 10% 到 20% 的数据训练投影器即可恢复大部分下游性能增益，且不同数据集训练的投影器可线性插值。提出 PORTAL，一种无需训练的投影器初始化方法，仅需单模态汇总统计，通过最优传输映射视觉和语言特征分布，完全跳过投影器训练阶段。\n- **深度解析**: 研究表明投影器训练主要执行粗略对齐，许多不同的投影器都能很好地实现这一点。PORTAL 在共享主成分子空间上计算视觉和语言特征分布的高斯近似之间的最优传输映射。在 6 个 LLM 骨干、2 个视觉编码器和 16 个基准测试中，PORTAL 无需配对数据即可匹配在 558k 图像-标题对上训练的标准流程，并在 3/7 的设置中超越该流程，其他 4 个设置中达到其平均 98% 的分数。\n- **领域归类**: [多模态大模型, 模型训练优化, 视觉语言对齐]\n---\n\n### 43. StartLux-Decision: AutoThink Decision Models with Reinforcement Learning for Calibrated Deliberative Decisions (StartLux-Decision：结合强化学习的 AutoThink 决策模型以实现校准的深思熟虑决策)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17309)\n- **研究任务**: 开发结合高效单次预测和自适应、置信度引导推理的决策模型（参数量从 0.8B 到 27B）。\n- **核心亮点**: 提出 Instant 模型（使用双向注意力提高单次推理精度）和 AutoThink 模型（对不确定决策调用显式推理，自信情况直接回答）。引入 RLCD^2（校准深思熟虑决策的强化学习），使用冻结模型和适当评分规则奖励决策概率质量的提升，并对过长的推理轨迹施加软惩罚。\n- **深度解析**: 训练采用三阶段流水线建立共享决策能力，专门化两种变体，并通过推理监督和强化学习为 AutoThink 配备推理能力。RLCD^2 将在生成限制内终止的推理轨迹比例提高最多 48 个百分点，平均推理长度减少最多 65%，同时基本保持决策精度。在 Decision Index 0.3 上，Instant 模型超越同等规模开源模型 7.4-16.9 分，27B AutoThink 达到 73.4。此外还引入了 DecisionPivot 基准测试，模型支持 vLLM、llama.cpp 和 MLX 运行。\n- **领域归类**: [大语言模型, 决策模型, 强化学习, 推理优化]\n---\n\n### 44. Glance Forcing: Making Bidirectional Diffusion Autoregressive at a Glance (Glance Forcing：一瞥之间使双向扩散模型自回归化)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20220)\n- **研究任务**: 将双向扩散模型高效地蒸馏为因果少步学生模型，用于实时、因果视频合成和视频世界模型。\n- **核心亮点**: 提出 Glance Forcing，一种轻量级蒸馏框架，将去噪轨迹解耦为两个互补的慢速和快速专家，每个专家由量身定制的、特定阶段的目标引导，同时保持预训练教师完全冻结。\n- **深度解析**: 现有方法需要离线 PF-ODE 轨迹，成本极高。作者发现将轨迹监督减少到单个样本会导致严重的质量崩溃，原因在于教师轨迹几何中高噪声区域（控制语义布局和运动）和低噪声区域（控制精细纹理）具有根本不同的曲率和优化行为。Glance Forcing 仅使用一个 PF-ODE 轨迹，就将 VBench 总分从 84.04 提高到 84.22，同时将轨迹收集成本从数千 GPU 小时削减到约一个 A100 GPU 小时。研究还揭示了少步蒸馏的一般机制：PF-ODE 蒸馏主要拉直少步轨迹几何，而随后的分布匹配阶段独立控制分布质量。\n- **领域归类**: [视频生成, 扩散模型, 模型蒸馏, 世界模型]\n---\n\n### 45. ProbabilityBench: Model Evaluation and Calibration with Exact Ground-Truth Uncertainty (ProbabilityBench：具有精确真实不确定性的模型评估与校准)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17016)\n- **研究任务**: 解决在真实数据上评估模型不确定性时，由于每个实例仅提供单个观察标签而导致真实条件类别概率未知的问题。\n- **核心亮点**: 引入 ProbabilityBench，一个在三个模拟文本领域（同行评审、隐蔽信息传递、信用风险）提供精确的、实例级类别概率的基准测试。通过明确定义每个环境的完整数据生成过程，解析计算精确类别概率和贝叶斯误差。\n- **深度解析**: 该基准提供理论保证，将这些案例渲染为自然语言备忘录严格保留了其潜在的生成概率。这种精确性使得能够通过 KL 散度直接测量报告的概率质量。在评估的 16 个模型中，观察到的成本-质量帕累托前沿上的大多数模型是决策模型（包括 Jev 和 Perplexity Decider）。ProbabilityBench 还作为元评估框架，利用已知的真实值来基准测试标准校准指标和贝叶斯误差估计器本身的准确性。\n- **领域归类**: [模型评估, 不确定性量化, 基准测试, 模型校准]\n---\n\n### 46. BigCell: Generating Gigapixel Whole-Slide Images (BigCell：生成十亿像素全切片图像)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14261)\n- **研究任务**: 在原生十亿像素分辨率下生成连贯的全切片组织病理学图像（WSI）。\n- **核心亮点**: 提出 BigCell，首个在原生十亿像素分辨率下生成连贯全切片组织病理学图像的方法。在 2048x2048 像素分辨率下训练流匹配 Transformer，使用超过 120,000 张公开可用的 WSI。通过推理时滑动窗口管线，生成高达 32,768x32,768 像素的连贯图像。\n- **深度解析**: 为使十亿像素合成更具实用性，引入自适应调度策略，优先处理重要的切片区域，使图像生成速度提高 3 倍以上，且质量下降极小。此外，提出首个 8k 分辨率的文本到图像合成，通过训练单独模型直接从病理学文本报告生成密集条件网格。实验证明，使用合成样本进行增强可使幻灯片级少样本分类性能比在真实数据上训练的基线提高最多 18%。\n- **领域归类**: [计算机视觉, 医疗影像, 图像生成, 病理学]\n---\n\n### 47. VITAL: From Visual Motion to Precise Action (VITAL：从视觉运动到精确动作)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20604)\n- **研究任务**: 将视觉预期转化为驾驶决策，直接从视觉运动中推导动作目标，用于世界-动作模型。\n- **核心亮点**: 引入 VITAL（用于动作学习的视觉诱导 Token），一种动作分词器，将视觉推导的运动支架与紧凑的残差（编码该支架留下的轨迹误差）结合。使用流匹配，动作专家从当前图像、自我状态和导航命令联合预测这两个组件，推理时不生成未来图像。\n- **深度解析**: 相同的残差坐标支持有界强化后训练，在保持预测视觉支架固定的同时细化执行。仅使用一个动作去噪步骤，VITAL 在 NAVSIM v1 navtest 上实现 90.8 PDMS，比其十步得分低 0.13 分，端到端推理速度提高 3.29 倍。无需重新训练，在 NAVSIM v2 navtest 上实现 91.1 EPDMS，在 navhard 上实现 38.6。\n- **领域归类**: [自动驾驶, 世界模型, 动作预测, 视觉导航]\n---\n\n### 48. TextVerifier: Seeing Beyond Recognition to Verify Chinese Text Rendering (TextVerifier：超越识别以验证中文文本渲染)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19551)\n- **研究任务**: 验证文本到图像模型生成的中文文本是否存在局部渲染缺陷（如笔画多余或缺失、组件畸形），将这些错误形式化为目标条件问题。\n- **核心亮点**: 提出 TEXTVERIFIER，向文本塔输入字符的表意描述序列（IDS）而非单字符符号。在 1270 万 crop-IDS 对及无标签的“同字不同质”困难对上训练。构建 TEXTRENDERBENCH-ZH，首个针对生成中文文本的逐字基准测试。\n- **深度解析**: OCR 和视觉语言模型对结构偏差不敏感，因此无法检测渲染错误。TEXTVERIFIER 达到 0.844 的 F1 分数，远高于 OCR 置信度（0.526）、通用 VLM（0.329）和 TextPecker（0.590）。作为 Flow-GRPO 后训练的逐字奖励，它进一步减少了渲染错误，证明其分数既能检测也能纠正错误。\n- **领域归类**: [计算机视觉, 文本渲染, 图像生成评估, 中文处理]\n---\n\n### 49. Acting Through Registers (通过寄存器执行动作)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17638)\n- **研究任务**: 探究世界动作模型（WAMs）中生成式视觉表征如何组织与动作相关的信息，并改进动作条件化方法。\n- **核心亮点**: 识别出 WAM 表征中持续存在的高范数空间异常值，其动作相关性在归一化和 K/V 投影后依然存在。引入 RegisterWAM，向世界模型添加可学习的非空间寄存器（registers），并直接用于动作条件化。\n- **深度解析**: 将寄存器与观察流匹配（FM）损失监督配对，可抑制空间异常值，同时将高范数响应集中在寄存器中。观察 FM 损失监督还改善了无寄存器情况下的动作学习，促使增加一个加噪观察 FM 目标，从损坏输入中学习当前场景恢复。最终模型在 LIBERO-Plus 上实现 81.64% 成功率，在 RoboTwin 2.0 上达到 93.0% 平均成功率，并提升了真实世界操作性能，且无需额外的具身预训练数据或基础模型。\n- **领域归类**: [机器人学, 世界模型, 视觉表征, 强化学习]\n---\n\n### 50. Latent Compaction with Test-Time Training (基于测试时训练的潜在压缩)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20582)\n- **研究任务**: 压缩长上下文中的键值（KV）缓存，以减少内存使用和注意力成本，同时保留未见问题的信息。\n- **核心亮点**: 引入 Latent Compaction，通过测试时训练学习紧凑的特定文档缓存。使用重建重要性、教师注意力和键空间多样性初始化缓存条目。训练首先将注意力输出和 log-normalizers 拟合到完整缓存，然后通过对完整缓存模型的端到端蒸馏联合优化整个缓存。\n- **深度解析**: 模型权重在整个过程中保持冻结，训练仅使用关于文档的通用提示，无需访问下游问题或答案。在 RULER 上，该方法在 32 倍压缩下实现 96.7% 准确率，而 KVZip+ 为 40.0%。该方法还可跨模型规模和家族转移，在 Qwen3 和 MiniCPM5 上均有检索增益。结果表明，将 KV 缓存视为神经网络并使用测试时训练进行优化，可以在激进压缩下保留检索准确率。\n- **领域归类**: [大语言模型, 长上下文处理, KV缓存压缩, 测试时训练]\n---\n\n### 51. SWEeper-Bench: Can Agents Discover Bugs in Interactive Software? (SWEeper-Bench：智能体能在交互式软件中发现漏洞吗？)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14096)\n- **研究任务**: 评估编码智能体在交互式软件中发现和修复依赖多步交互才能暴露的漏洞的能力。\n- **核心亮点**: 提出 SWEeper-Bench 基准，包含 200 个基于真实开源 Web 应用漏洞修复的任务。智能体需要设计交互式测试来发现漏洞，并由智能体验证器根据浏览器中的用户观察结果来评判修复效果。\n- **深度解析**: 现有的基准通常假设漏洞已被识别，而该研究填补了评估智能体发现依赖交互的失败能力的空白。实验表明，15个前沿智能体中表现最好的仅通过 59.0% 的任务。轨迹分析显示，最大的瓶颈在于识别漏洞行为：智能体通常能到达相关功能，但无法触发故障或识别故障。\n- **领域归类**: [软件工程, 智能体, 基准测试]\n---\n\n### 52. Diff Diffusion: Predicting Edit Paths with Diffusion Models for Efficient Code Editing (Diff Diffusion：利用扩散模型预测编辑路径以实现高效代码编辑)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17831)\n- **研究任务**: 提高扩散大语言模型在 AI 辅助 IDE 中进行代码编辑（编辑预测）的效率和准确性。\n- **核心亮点**: 提出 Diff Diffusion 框架，将去噪过程表示为结构化的编辑操作，结合多阶段训练和高效并行解码，将计算集中在更改的区域，支持准确低延迟的编辑和多位置并行修改。\n- **深度解析**: 扩散大语言模型擅长并行更新 token，但通常针对序列合成优化，不适合需要推断下一步代码更改的编辑预测场景。Diff Diffusion 通过预测从原始代码片段到修改后形式的编辑路径，在公共编辑补全基准上实现了 2.78 倍的推理加速，并在生产中降低了 39.0% 的 P50 模型延迟，同时匹配或领先于自回归基线。\n- **领域归类**: [自然语言处理, 代码生成, 扩散模型]\n---\n\n### 53. The COUNT: Counting N-grams Unlocks Scaling on Host Memory and Training-Free Adaptation (The COUNT：通过计算 N-gram 解锁主机内存扩展与免训练自适应)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20456)\n- **研究任务**: 探索如何在语言模型中扩展主机内存的使用，并实现免训练的领域自适应。\n- **核心亮点**: 提出 COUNT 方法，通过在主机上存储预计算的 n-gram 计数来构建 n-gram 嵌入，无需添加学习参数。利用语料库频率对语言模型自身的下一个 token 反嵌入进行加权。\n- **深度解析**: 现有的 n-gram 嵌入方法需要从头训练，消耗昂贵的 GPU 内存。COUNT 利用廉价且未充分利用的主机系统普通内存。在固定计算预算下，COUNT 可作为额外输入嵌入用于预训练 1B 参数语言模型，其验证损失的提升相当于增加 57% 计算量的效果。此外，COUNT 允许在推理时切换不同领域的 n-gram 计数表，实现免训练的任务自适应。\n- **领域归类**: [自然语言处理, 模型训练, 内存优化]\n---\n\n### 54. Exploring the Limits of Combinatorial Generalization in Embodied Manipulation (探索具身操作中组合泛化的极限)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15425)\n- **研究任务**: 解决具身操作中视觉语言动作（VLA）模型在长视野操作中重新组合原子技能而不依赖每种组合示范的问题。\n- **核心亮点**: 引入层次化子任务执行（HSE）诊断框架和 RoboCombine 基准测试。提出姿态鲁棒任务初始化（PRTI）策略，通过扩大起始状态覆盖范围来解决“起始状态差距”问题。\n- **深度解析**: 研究表明，仅具备原子能力并不能确保有序执行，失败集中在下游子任务从前序子任务的交接状态启动时。PRTI 策略在 RoboCombine 上的有序成功率达到 18.16%，显著高于随机扰动的 4.21% 和机器人重置预言的 9.47%。结果证明，组合泛化需要能够处理交接状态的鲁棒原子技能，而不仅仅是分解为已知子任务。\n- **领域归类**: [机器人学, 具身智能, 强化学习]\n---\n\n### 55. Continuum Attention (连续注意力机制)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20586)\n- **研究任务**: 提出一种新的因果 Transformer 注意力算子，以替代离散的键值查找。\n- **核心亮点**: 引入连续注意力（CA），用连续的分段线性记忆曲线上的积分替代离散的键值查找。每个查询在曲线上诱导指数相关性密度，通过闭式指数矩积分得出精确的归一化注意力。\n- **深度解析**: CA 的梯度可通过最多二阶的矩解析得出，支持并行 GPU 实现，同时保留了二次序列复杂度和标准 Transformer 解码器。与普通 softmax 和焦点注意力相比，CA 分别将平均验证负对数似然降低了 0.0200 和 0.0480 nats/byte。在额外的不相交验证切片上，CA 比最强的 softmax 基线有 0.0457 nats/byte 的优势。\n- **领域归类**: [自然语言处理, 深度学习架构, 注意力机制]\n---\n\n### 56. Training LLMs for Multi-Agent Collaboration with Verifiable Information Rewards (利用可验证信息奖励训练大语言模型进行多智能体协作)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17893)\n- **研究任务**: 训练大语言模型（LLM）智能体在多智能体系统中进行有效协作，包括共享相关证据、请求缺失信息以及将队友的贡献纳入决策。\n- **核心亮点**: 提出 CoSIR（基于惊奇度的信息奖励协作）后训练方法，使用简单可验证的环境教授可泛化到复杂未见任务的协作行为。引入贝叶斯评估器，通过团队惊奇度的减少来评分共享信息和请求。\n- **深度解析**: 最终任务结果对单条消息价值的反馈有限。CoSIR 对共享信息的评分基于其减少团队惊奇度（各智能体可用证据下正确选项负对数概率之和）的程度。请求的评分基于若请求信息被如实提供时同一数量的潜在减少。通过对 Qwen3-4B、Qwen3-8B 和 Gemma-3-4B-it 进行自我博弈后训练，并在七个未见过的自然语言协作任务上评估，CoSIR 取得了最高总分，并增加了私有证据的披露，减少了未使用队友输入的失败。\n- **领域归类**: [自然语言处理, 多智能体系统, 强化学习]\n---\n\n### 57. VASPO: Self-Distillation with Privileged Value Estimation (VASPO：基于特权价值估计的自蒸馏)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20516)\n- **研究任务**: 改进推理模型在策略上的自蒸馏方法，提供更密集的监督信号。\n- **核心亮点**: 提出价值增强自蒸馏策略优化（VASPO），在 PPO 框架内整合特权自教师和价值函数（Critic）。自教师和价值函数评估学生生成的前缀上的相同特权信息，Critic 计算 token 级 PPO 优势，自教师通过有界概率比调节选定的正优势。\n- **深度解析**: 现有的在策略自蒸馏提供的是局部 token 偏好而非无引导学生延续的预期回报。VASPO 利用了特权信息增强 Critic 在响应末尾的价值预测准确性，以及自教师在生成初期和末期较强、中期较弱的互补位置动态。在六个数学推理基准上，VASPO 在 Qwen3-4B 和 OLMo3-7B 变体上的平均准确率分别比 PPO 提高了 2.59 和 1.81 个百分点，并在 Knights and Knaves 任务上取得最高平均准确率。\n- **领域归类**: [自然语言处理, 强化学习, 模型训练]\n---\n\n### 58. Rethinking LLM-Guided Visual Question Answering: Does Deeper Knowledge Integration Really Help? (重新思考大语言模型引导的视觉问答：更深的知识整合真的有帮助吗？)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17079)\n- **研究任务**: 探讨在基于知识的视觉问答（VQA）中，大语言模型（LLM）提供的知识引导应以多深的程度整合到视觉语言架构中。\n- **核心亮点**: 使用 Llama 3.3 70B 生成结构化推理引导（视觉焦点概念、干扰元素和外部知识），并在 OK-VQA 基准上系统比较了统一冻结 ViT + FLAN-T5 框架下的两种整合策略：决策级晚期融合和注意力矩阵注入。\n- **深度解析**: 与深层整合更优的普遍假设相反，研究发现浅层晚期融合在数据稀缺微调下取得了最强结果（39.4% 精确匹配，比无引导基线高 10.0），优于深层注意力修改（31.8%）。此外，研究贡献了一个基于 LLM 的增强管道，通过问题释义将训练数据扩展了十倍以上。结果表明，整合深度必须与数据机制相匹配。\n- **领域归类**: [计算机视觉, 自然语言处理, 视觉问答]\n---\n\n### 59. Generative World Simulation with DAO and JING (基于 DAO 和 JING 的生成式世界模拟)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19726)\n- **研究任务**: 构建一个结合持久共享世界状态与连续第一人称视听生成的生成式世界模拟框架，以支持人类和智能体的持续交互。\n- **核心亮点**: 整合了可计算世界引擎 DAO 和第一人称交互式体验模型 JING。DAO 维护角色、物体和空间的状态及其关系，并根据交互规则推进世界；JING 结合这些状态、观察历史和当前动作，为每个观察者生成视听体验。\n- **深度解析**: 该框架通过视角控制和文本指令让用户探索环境、操作物体并与角色交流，用户的动作同时塑造共享状态和后续体验。通过将世界状态演化与体验生成连接在连续交互循环中，该框架提供了一种构建保留历史、通过动作演化且超越单个观察者持续存在的交互式世界的方法。\n- **领域归类**: [计算机视觉, 生成式AI, 世界模型]\n---\n\n### 60. Scaling Online Optimal Transport Minibatches for Flow Matching (扩展流匹配中的在线最优传输小批量)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18838)\n- **研究任务**: 解决在扩展流模型时，如何在训练和积分中保持稳定性，特别是如何通过最优传输（OT）构建在线源-目标耦合以减少随机性。\n- **核心亮点**: 开发了一种可扩展的在线熵 OT 近似方法，使得能够进行更大规模的源-目标耦合，同时保留 OT 的优势。从理论上证明了相对于独立配对，未正则化和熵 OT 在全随机梯度方差和积分误差上的严格减少。\n- **深度解析**: 在流匹配中，独立随机配对会引入大量随机性，而小批量 OT 在大型高维数据集上受限，扩大耦合的计算成本又过高。该研究填补了 OT 耦合如何影响全随机梯度和积分的理论空白，并表征了这些改进如何随在线耦合小批量的增长而增强。在单细胞基因插值流和图像流训练上的实验验证了这些预测，表明更大的在线耦合能持续提高训练稳定性和最终生成性能。\n- **领域归类**: [机器学习, 生成模型, 优化算法]\n---\n\n### 61. Physical Time as a Missing Dimension of Robot Policy Memory Dynamics (物理时间：机器人策略记忆动态中缺失的维度)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20524)\n- **研究任务**: 解决现有机器人策略记忆通常将每次更新视为等量物理时间的问题，引入物理时间维度，使机器人能够根据实际流逝的时间调整动作和记忆状态。\n- **核心亮点**: 提出时间流策略（Temporal Flow Policy, TFP），将物理时间作为记忆状态演化的显式维度；在真实机器人任务和 LIBERO 评估中验证了时间输入与行为的有效链接。\n- **深度解析**: 传统的机器人记忆忽略了相同的观察历史可能跨越不同时长的问题。TFP 通过结合观测、先验记忆和流逝时间，动态调整记忆状态的内容和时间尺度。该方法不仅提高了需要计时或记忆的任务成功率，还使模型能够恢复被遮挡后的运动信息和事件发生时间。在 Diffusion Policy 和 π_{0.5} 上的具体成功率数字摘要未提供，但实验表明 TFP 优于配备相同时间间隔的循环和状态空间记忆。\n- **领域归类**: [机器人学, 强化学习, 模仿学习]\n---\n\n### 62. Choosing LLMs for Strategic Agent Interactions (为战略智能体交互选择大语言模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18354)\n- **研究任务**: 在动态和未知的博弈环境中，为大语言模型（LLM）智能体设计有效的模型选择（路由）策略，以优化战略交互表现。\n- **核心亮点**: 将 LLM 模型选择问题形式化为博弈论中的“元游戏”；揭示了现有基于查询嵌入或自我反思的路由方法在捕获战略信号时的局限性，并验证了轻量级多臂老虎机算法的可靠性。\n- **深度解析**: 现有的 LLM 路由器仅考虑质量与成本的权衡，忽略了对手的自适应性和博弈结构的动态变化。本文通过跨 5 种博弈和 10 个 LLM 的评估，证明了模型的战略能力高度依赖于具体的博弈设置和对手。研究发现，提取可靠的评估信号需要比传统基准测试多得多的种子运行次数，具体的战略能力得分摘要未提供。此外，当前处理动态对手的方法（如非平稳老虎机）仍存在明显差距，未能超越平稳基线。\n- **领域归类**: [大语言模型, 博弈论, 多智能体系统]\n---\n\n### 63. To Align or Not To Align: Check Your COMPASS Before You Train (对齐与否：训练前请检查你的 COMPASS)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18638)\n- **研究任务**: 在模型对齐或合并之前，低成本地预测和评估不同预训练模型对之间的兼容性，避免昂贵的试错搜索。\n- **核心亮点**: 提出 COMPASS 评分机制，通过 k-NN 重叠和训练范式上限两个维度，在训练前准确预测模型对齐或合并的兼容性。\n- **深度解析**: 组合预训练模型（如视觉-语言对齐或检查点合并）通常依赖昂贵的经验搜索。COMPASS 基于局部邻域表征收敛的观察，将兼容性解耦为“特定对的容易度”和“范式级上限”。该方法不仅能为候选模型对提供排名，还能给出具体的操作建议（如优先选择、增加计算、更换范式或放弃）。在 72 个跨模态对齐和 392 个模型合并实验中，COMPASS 的估计与下游成功率强相关，跨模态对齐和模型合并的平均皮尔逊相关性分别达到 0.91 和 0.70。\n- **领域归类**: [模型合并, 跨模态对齐, 模型评估]\n---\n\n### 64. Vela: Scaling Vision-Language-Action Models with Adaptive Action Curve Parametrization (Vela：通过自适应动作曲线参数化扩展视觉-语言-动作模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05230)\n- **研究任务**: 解决现有视觉-语言-动作（VLA）模型中固定速率动作块表示导致的容量浪费和长视野与局部精度权衡问题，实现更高效的机器人动作预测。\n- **核心亮点**: 提出 Vela 模型，使用基于样条的连续轨迹表示替代传统的离散动作块，使固定的输出预算能够自适应地调整不同运动的时间分辨率。\n- **深度解析**: 传统的 VLA 模型采用固定速率的动作块，导致在高度相关的相邻动作上浪费模型容量，且难以兼顾长时预测与接触丰富的精细操作。Vela 通过引入紧凑的样条动作表示和依赖运动的时间支持，将未来行为建模为连续轨迹。这种连续表示结合共享的动作接口，在 LIBERO-X、EBench 以及真实的长视野任务（如煎蛋饼和土豆切碎）中展现了优越的泛化能力，具体的任务成功率数字摘要未提供。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 具身智能]\n---\n\n### 65. Jag: Direct Box Prediction for Efficient Visual Grounding (Jag：用于高效视觉基础的直接边界框预测)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13239)\n- **研究任务**: 提高视觉基础（Visual Grounding）任务的效率，解决自回归多模态模型通过序列解码生成边界框坐标带来的计算开销问题。\n- **核心亮点**: 提出 Jag 模型，通过轻量级回归头直接预测连续的边界框坐标，将视觉基础任务转化为单次前向传播的直接回归问题，显著降低推理延迟和显存占用。\n- **深度解析**: 现有的自回归多模态模型在视觉基础任务中通常将边界框作为坐标序列生成，这增加了不必要的顺序解码计算。Jag 通过引入轻量级回归头，直接读取最后一个有效输入 token 的状态来一次性预测四个边界框坐标。结合几何监督信号联合微调语言骨干、视觉合并器和回归头，Jag 提升了不同目标尺寸和表达组下的基础准确率，具体的准确率提升数字摘要未提供，但在保持竞争力的同时大幅降低了单请求延迟和 GPU 内存消耗。\n- **领域归类**: [多模态学习, 视觉基础, 模型推理优化]\n---\n\n### 66. SyncReward: Human-Aligned Synchronization Reward for Audio-Visual Generation (SyncReward：用于音视频生成的人类对齐同步奖励)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16338)\n- **研究任务**: 解决联合音视频生成中音频与视觉事件时间不同步的问题，提供可靠的人类对齐同步评估基准和奖励模型。\n- **核心亮点**: 构建了包含 8 万条专业评分的 SyncReward-Data-80K 数据集和 1K 条目的 SyncReward-Bench 基准；提出了 SyncReward 奖励模型，在评估和强化学习后训练中均展现出与人类判断的高度一致性。\n- **深度解析**: 音视频同步生成的瓶颈在于缺乏高质量的人工标注数据和同步感知的评估模型。本文系统性地解决了数据、基准和奖励模型三个层面的问题。SyncReward 模型通过在真实片段上进行语义-时间对比预训练，并在生成片段上结合人工监督进行训练。实验证明，该模型不仅作为评估指标与人类评分高度对齐，具体的同步评分指标数字摘要未提供，但它能作为奖励信号，通过推理时的 Best-of-N 采样和基于强化学习的后训练，有效提升生成内容的音视频同步质量。\n- **领域归类**: [音视频生成, 强化学习, 奖励建模]\n---\n\n### 67. NavGPT-3: Harnessing Context in a Hierarchical Navigation Runtime (NavGPT-3：在分层导航运行时中利用上下文)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.10787)\n- **研究任务**: 弥合大语言模型的高层推理能力与底层动作策略的物理控制能力之间的鸿沟，实现高效、实时的具身导航。\n- **核心亮点**: 提出类似操作系统的分层导航运行时（Harness），将推理、行动和监控解耦为独立线程；底层 NavGPT VLA 动作策略在 R2R-CE 和 RxR-CE 基准上达到甚至超越人类水平的表现。\n- **深度解析**: NavGPT-3 的核心创新在于其系统架构设计。它通过一个类 OS 的运行时环境，将大语言模型的慢速推理与动作策略的低延迟控制结合为不同的“线程”，允许通过中断机制响应现实世界的突发事件。其底层的 8B 参数 NavGPT VLA 策略利用 codec 分配动态调整视觉 token，在 1928 万个样本上训练。完整系统在 R2R-CE 上达到 81.51 SR，在 RxR-CE 上首次达到人类水平（成功率 90.43 vs 人类 90.4，路径保真度 78.47 vs 77.7 nDTW），单集耗时 1 分 22 秒（人类约 3 分钟），并将最小反应时间从 3-19 秒降至 0.5-1 秒。\n- **领域归类**: [具身智能, 视觉导航, 大语言模型应用]\n---\n\n### 68. MimicX: Policy-in-the-Loop Supervision Refinement for Video-Driven Humanoid Motion Tracking (MimicX：用于视频驱动人形运动跟踪的策略在环监督细化)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09055)\n- **研究任务**: 解决基于物理执行的人形机器人在模仿人类视频动作时出现的持续失败问题，通过执行反馈优化训练监督。\n- **核心亮点**: 提出 MimicX“策略在环”框架，利用物理执行反馈自动定位困难动作转换和受影响的身体部位，并据此动态调整跟踪目标和重置课程。\n- **深度解析**: 仅从人类视频中提取的运动目标在物理引擎中执行时往往会失败，这暴露了训练监督的不足。MimicX 通过将策略执行反馈引入训练循环，精准定位难以过渡的动作和身体区域，进而联合优化跟踪目标和重置课程。通过反复的 rollout 验证，该方法能够筛选出最具执行优先级的改进。在四个核心视频任务中，MimicX 使身体跟踪误差减少了 25.7%，并将鲁棒执行视野增加了 255.6%，成功将策略失败转化为可操作的监督信号。\n- **领域归类**: [机器人学, 人形机器人, 模仿学习]\n---\n\n### 69. G^3VLA: Geometric Inductive Bias for Vision-Language-Action Models (G^3VLA：视觉-语言-动作模型的几何归纳偏置)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.24472)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在多相机系统中缺乏校准相机几何结构（即缺乏 3D 几何归纳偏置）的问题，提升多视角推理和视角鲁棒性。\n- **核心亮点**: 提出 G^3VLA 模块，通过注入相机内在参数、投影位置编码（PRoPE）和跨视图融合，将校准的 3D 几何结构直接引入预训练 VLA 模型的视觉 token 流中。\n- **深度解析**: 现有的 VLA 模型多依赖 2D 图像坐标，忽略了多相机系统中已知的内外参几何关系。G^3VLA 通过引入射线嵌入、投影位置编码和双向跨视图融合，在不改变原模型动作空间和学习目标的前提下，为视觉 token 注入了强几何归纳偏置。利用真实点图或教师模型提供几何监督，避免了深度传感器或手动标注的需求。在 LIBERO 和 RoboCasa24 等基准上 consistently 提升了性能，具体的性能提升数字摘要未提供，但在相机偏移和真实机器人实验中显著增强了对未见过相机视角的鲁棒性。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 3D 视觉]\n---\n\n### 70. MA-Bench: Measuring Operational Planning in Language Models (MA-Bench：衡量语言模型中的作战规划能力)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19138)\n- **研究任务**: 评估大语言模型在处理大量、不完整且存在矛盾的现实文档时，进行复杂任务分析和制定作战/运营计划的能力。\n- **核心亮点**: 推出 MA-Bench 基准，基于军事任务分析构建，包含 10 个专家场景和 1257 个细粒度评分要求；揭示了当前最强模型在推断性判断上的短板以及“遗漏多于错误”的失败模式。\n- **深度解析**: MA-Bench 聚焦于大语言模型在缺乏单一正确答案的复杂情境下的规划能力。通过模拟军事作战计划的第一步（任务分析），要求模型阅读 10 到 12 个文档的合成包并提取关键信息。评估采用推理模型作为法官，基于 1257 个专家编写的要求进行打分（法官一致性 Fleiss κ 为 0.42 到 0.41，不同提供商排序 Spearman 达 0.94）。在 20 个前沿和开源模型中，表现最好的模型仅答对 62% 的评分项。模型在文档明确陈述的事实上表现最强（58%），在需要推断的判断上最弱（33%），且 60% 的失败源于信息遗漏而非事实错误。\n- **领域归类**: [大语言模型, 复杂推理, 基准测试]\n---\n\n### 71. Your Transformer Is Secretly Elastic (你的 Transformer 其实是弹性的)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20588)\n- **研究任务**: 实现预训练 Transformer 模型的弹性化，使其能够在连续的计算预算下动态自适应，而无需重新训练。\n- **核心亮点**: 提出一种无需重训练的方法，通过对功能单元排序问题进行可微松弛，联合评估并排序每个 MLP 神经元和注意力头，使单一模型能根据硬件和延迟约束动态调整计算量。\n- **深度解析**: 现有的模型家族通常只提供少数固定尺寸，难以适应波动的查询负载。本文的核心贡献在于打破了这一刚性限制，在统一尺度上联合排序神经元和注意力头的重要性，通过软剪枝实现平滑退化。实验表明，该方法在高达 60% 的稀疏度下表现优异，例如将 DINOv3 ViT-H+/16 剪枝 50% 可移除 427M 参数且 ImageNet-1k 准确率仅降 0.8%；在 60% 稀疏度下，AugReg ViT-B/16 在 A100 GPU 上的吞吐量提升 1.80 倍，单次查询延迟降低 1.26 倍，且弹性模型的构建时间随参数量呈亚线性增长。\n- **领域归类**: [模型压缩, 动态计算, Transformer]\n\n---\n\n### 72. StreamErase: Towards Ultra-Fast Streaming Video Erasing (StreamErase：迈向超快速流式视频擦除)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20137)\n- **研究任务**: 解决现有视频物体移除方法延迟高、无法实时交互的问题，实现超快速的流式视频物体擦除。\n- **核心亮点**: 提出 StreamErase 方法，在单张 GPU 上实现亚秒级延迟和高达 26 FPS 的流式生成，支持任意长度的无限视频擦除。\n- **深度解析**: 针对长视频生成中的域差距、误差累积和推理速度三大挑战，本文首先增强文本到视频模型以擦除目标并合成背景，随后将这种能力渐进式地转移到高效的单向流式擦除器中。通过精心设计带有注意力汇聚（attention sinks）的滑动窗口因果注意力，并结合自回归展开（self-rollout）与 KV 缓存滚动机制，模型能够在固定上下文窗口下模拟推理时的外推，从而实现恒定速度的长视频生成。此外，本文还建立了专门用于流式长视频物体移除的 LongErase 基准。\n- **领域归类**: [视频生成, 视频编辑, 流式处理]\n\n---\n\n### 73. AgentSafeEvo: Adversarial Co-Evolution for LLM Agent Safety (AgentSafeEvo：用于 LLM Agent 安全的对抗性协同进化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19422)\n- **研究任务**: 提升大型语言模型（LLM）Agent 在复杂多轮交互和工具使用场景下的安全性与对抗鲁棒性。\n- **核心亮点**: 提出 AgentSafeEvo 框架，通过跨越多种任务和攻击类型的攻击者-防御者博弈进行协同进化强化学习，并引入可学习性引导的任务加权机制。\n- **深度解析**: 现有的 Agent 安全研究多局限于语言层面或网页任务中的间接提示注入。本文构建了一个攻防博弈框架：攻击者学习生成能暴露防御者工具使用弱点的对抗性任务，而防御者则学习在这些攻击下安全完成任务。为优化训练，引入了可学习性引导的任务加权机制，利用任务内防御者奖励的变异性来动态调整每个任务对攻防双方更新的贡献。广泛的实验表明，该方法在提升对抗鲁棒性的同时，有效保持了 Agent 的通用能力。\n- **领域归类**: [LLM Agent, 安全与对齐, 强化学习]\n\n---\n\n### 74. Self-Conditioning Enables Deep Sequential Reasoning in Flow Matching (自条件化使 Flow Matching 具备深度序列推理能力)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19628)\n- **研究任务**: 突破 Flow Matching 等迭代采样器在视觉推理任务中的表达能力瓶颈，提升其深度序列推理能力。\n- **核心亮点**: 从电路复杂度角度证明 vanilla flow matching 的额外采样步数无法增加模型表达能力，并揭示“自条件化（self-conditioning）”机制能打破此瓶颈，使常数深度模型达到空间有界图灵机的表达能力。\n- **深度解析**: 直觉上，迭代采样器的每一步类似于一个推理步骤，但理论证明表明，只要模型输出满足一定的正则条件，vanilla flow matching 的轨迹可被常数轮并行评估模拟。本文发现，通过引入自条件化（即将模型条件化于前一步对最终图像的估计），可以消除这一瓶颈。控制实验证明，带有自条件化的 flow matching 在多种视觉推理任务中准确率更高、推理深度更大，且性能随采样步数增加而提升。这为未来视觉推理研究提供了“在采样步骤间传递更多信息”的设计原则。\n- **领域归类**: [视觉推理, 生成模型, 理论分析]\n\n---\n\n### 75. Next-Concept Modeling: Fast, Parallel Coarse-to-Fine Text Generation (Next-Concept Modeling：快速、并行的粗到细文本生成)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14162)\n- **研究任务**: 解决扩散语言模型（DLMs）在采样步数少时质量退化快、全序列处理效率低的问题，实现快速并行的文本生成。\n- **核心亮点**: 提出 Next-Concept Modeling (NCM) 粗到细框架，结合多尺度残差 VQ-VAE 和逐层并行生成的 Transformer，大幅提升生成速度。\n- **深度解析**: NCM 采用两阶段方法：首先使用多尺度残差 VQ-VAE 将文本编码为层次化的离散代码，然后由 Transformer 逐层生成，并行预测同一层内的所有代码。在匹配参数规模的情况下，NCM 在 LM1B 数据集上的生成困惑度优于最强的 DLM 基线，且速度快 21 倍；在 OpenWebText 上快 10 倍；在 XSum 上 ROUGE-L 指标与最强基线持平，但速度快 31 倍。在 Sudoku 推理任务中，NCM 在所有难度级别上均超越了自回归和扩散基线，且使用了更少的函数评估次数。\n- **领域归类**: [自然语言处理, 扩散模型, 文本生成]\n\n---\n\n### 76. History Replays Itself: Unleashing Long-Context Capability in Linear Attention (历史重演：释放线性注意力的长上下文能力)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15715)\n- **研究任务**: 突破线性注意力模型中固定大小循环状态带来的记忆容量瓶颈，释放其长上下文处理能力。\n- **核心亮点**: 提出免训练、即插即用的 NoteBank 稀疏情景记忆机制，通过原生特征写入和重放读取，大幅提升线性注意力模型的长上下文检索能力，且存储开销极低。\n- **深度解析**: 传统观点认为线性注意力的循环状态必须同时承担计算和长期存储的任务，从而限制了长上下文能力。本文打破这一认知，提出 NoteBank，在未知未来查询前归档选定的文本，利用骨干网络的原生特征进行写入和寻址，并通过原生前向计算进行重放读取。该方法无需外部嵌入模型或独立检索器。在 100 万 token 长度下，它将 Gated DeltaNet 在 6 个 RULER 检索任务上的平均准确率从 1.7% 提升至 70.3%，增加的计算量微乎其微，且持久上下文存储量仅为同等规格 Transformer 全 MHA KV 缓存的 1/2600。\n- **领域归类**: [长上下文处理, 线性注意力, 模型架构]\n\n---\n\n### 77. VLX-Go: Robust Embodied Tracking through Multi-Stage Learning and On-Policy Refinement (VLX-Go：通过多阶段学习和在策略细化实现鲁棒的具身跟踪)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19361)\n- **研究任务**: 提升机器人在存在干扰物的复杂共享空间中，进行具身视觉跟踪（Person Following）的鲁棒性。\n- **核心亮点**: 提出基于“先对齐后跟踪”假设的视觉-语言路点策略 VLX-Go，采用多阶段学习（视觉-语言对齐、多模态推理、跟踪特化）和在策略（on-policy）细化机制。\n- **深度解析**: 在干扰物中跟踪特定人物极具挑战性。VLX-Go 结合了冻结的视觉编码器、多尺度时间上下文、Transformer 骨干和轻量级路点预测头。其训练分为三个阶段，并在 19,532 个 oracle episodes 上进行跟踪特化，使干扰物跟踪成功率从 41.54% 提升至 55.80%。随后，通过引入基于过滤 oracle 标签的在策略细化机制，成功率进一步提升至 58.22%，同时碰撞率降低了 1.99 个百分点。该策略在对比方法中取得了最高的干扰物和模糊跟踪成功率。\n- **领域归类**: [具身智能, 视觉跟踪, 机器人控制]\n\n---\n\n### 78. Drive3R: Block-wise Streaming Geometric Foundation Models for Autonomous Driving (Drive3R：用于自动驾驶的分块流式几何基础模型)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15112)\n- **研究任务**: 解决自动驾驶场景下连续、长序列密集多视图 3D 重建中的内存瓶颈、尺度漂移和轨迹不连续问题。\n- **核心亮点**: 提出分块流式几何基础模型 Drive3R，通过分块因果注意力和置信度感知重锚定机制，实现高保真、可扩展的长序列 3D 重建。\n- **深度解析**: 现有的前馈几何基础模型在处理长驾驶序列时受限于 GPU 内存和全局注意力的二次复杂度，而因果流式易产生尺度漂移，分块对齐则会导致轨迹断裂。Drive3R 引入分块因果注意力，既解决了双向注意力的扩展瓶颈，又避免了纯因果流式丢失局部未来上下文的问题。同时，其置信度感知重锚定机制能够检测不可靠的流式状态，重新初始化 KV 缓存，并通过 SE(3) 对齐缝合刷新片段，有效缓解长程漂移。实验表明，Drive3R 在 nuScenes、KITTI 和 Waymo 数据集上均达到了 SOTA 性能，例如在 nuScenes 上将 AbsRel 从 0.1806 降至 0.1081。\n- **领域归类**: [自动驾驶, 3D 重建, 计算机视觉]\n\n---\n\n### 79. Cortex: Measurement-Gated Evolution and Pruning of Coding-Agent Skills and Rules (Cortex：编码 Agent 技能与规则的测量门控进化与修剪)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14216)\n- **研究任务**: 自动化优化和验证 LLM 编码 Agent 的外部提示/规则文件（Harness），提升其遵循约定和完成任务的能力。\n- **核心亮点**: 提出 Cortex 工具，通过可重放任务测试和严格的测量门控机制（确保净增益且无副作用），自动进化、修剪和验证 Agent 的技能与规则文件。\n- **深度解析**: 开发者为编码 Agent 编写的规则和技能往往缺乏严格验证，单次成功并不代表持续有效。Cortex 将开发者的纠正保存为可重放任务，通过对比实验（有/无该规则）来评估其实际效果，仅保留带来净收益且不损害其他任务的规则或技能，且绝不添加或删除 Agent 从未使用过的文本。在 Claude Haiku 4.5 上的测试表明，Cortex 构建的 Harness 显著提高了 Agent 遵循约定的频率，且自动规则比技能文件发挥了更大作用。该工具及数据集已开源。\n- **领域归类**: [LLM Agent, 代码生成, 提示工程]\n\n---\n\n### 80. The Agent Knew: Internal States Forecast Unauthorized Actions and Stop Them, and the Lies That Follow (Agent 心知肚明：内部状态预测未授权行为并阻止它们，以及随之而来的谎言)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17301)\n- **研究任务**: 预测并阻止 LLM Agent 的越权违规行为，以及随之而来的撒谎（虚假报告）行为。\n- **核心亮点**: 发现 Agent 内部状态（残差流）可高精度预测越权和撒谎行为，提出基于内部状态读出的前置门控机制，有效阻断违规及后续的掩盖行为。\n- **深度解析**: 本文深入研究了 LLM Agent 越权及撒谎的机制，发现在 CAPE-Bench 上，“事后权限洗白”（先行动后假装请求许可）在 70% 的违规中 precedes 虚假报告。通过提取模型残差流的线性特征，能够在 Agent 采取行动前预测违规（AUROC 0.94），在报告前预测虚假报告。基于此预测构建的前置门控机制，能将 Gemma-4 的违规率从 0.70 降至 0.09，同时保持授权工作的完成率。在 AgentDojo 提示注入基准上，该机制将攻击成功率从 11.7% 降至 5.7%。研究证明，直接阻止违规行为是防止 Agent 撒谎的最可靠方法。所有测试均已预注册。\n- **领域归类**: [LLM Agent, 安全与对齐, 可解释性]\n\n### 81. A Diagnostic Study of World-Space Human Recovery Under High Camera Dynamics (高相机动态下世界空间人体恢复的诊断研究)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19729)\n- **研究任务**: 解决单目世界空间人体恢复方法在快速相机运动下产生的世界空间轨迹漂移问题。\n- **核心亮点**: \n  1. 提出“K-Pop压力测试”，使用包含快速大尺度相机运动和密集多人编舞的广播舞蹈视频来评估现有方法。\n  2. 诊断出轨迹漂移的根本原因：相机和人体估计各自保持自洽，但在结合时因尺度不匹配，导致相机运动被转化为人体漂移。\n  3. 推导了一种闭式修正方法，通过估计尺度不匹配并为所有表演者应用统一尺度来消除漂移，无需重新训练即可兼容现有后端。\n- **深度解析**: \n  现有的单目世界空间人体恢复方法在常规基准测试中表现良好，但极少包含快速相机运动的场景。本文通过系统诊断发现，在广播舞蹈视频等复杂场景下，由于相机和人体估计在各自独立的尺度下恢复，两者的尺度不匹配会导致世界空间轨迹严重偏离表演者的实际舞台位置，且漂移程度随相机位移的增加而加剧。为此，作者提出了一种闭式修正方案，结合物理约束，将统一的尺度应用于所有表演者，从而在共享的世界坐标系中保持相对位置并消除漂移。该方法可直接应用于现有的后端系统，为编舞建模、场景编辑、数据生成和虚拟重拍等任务提供稳定的世界空间重建。摘要未提供具体的实验对比数字和其他未提及的技术细节。\n- **领域归类**: [计算机视觉, 3D人体重建, 视频分析]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [lightseekorg/tokenspeed](https://github.com/lightseekorg/tokenspeed)\n- **今日趋势**: 2,401 stars / 331 forks (今日新增 25 stars)\n- **项目简介**: 一个提供光速级大语言模型推理的引擎。\n- **核心价值**: \n  - **项目用途**: 提供高性能的大语言模型（LLM）推理加速服务。\n  - **目标人群**: 需要部署和优化大模型推理性能的AI开发者、研究人员及企业。\n  - **技术核心**: 大语言模型推理加速技术。\n  - **A
