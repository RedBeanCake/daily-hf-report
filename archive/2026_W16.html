### 21. CT-1: Vision-Language-Camera Models Transfer Spatial Reasoning Knowledge to Camera-Controllable Video Generation (CT-1：视觉 - 语言 - 相机模型将空间推理知识迁移到相机可控视频生成)
- **社区热度**: `👍 0 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.09201)
- **研究任务**: 相机可控的视频生成
- **核心亮点**: 利用 VLM 的空间推理能力，让视频生成模型更懂相机运镜，无需手动标注相机参数。
- **深度解析**: 核心是把 VLM 当作“空间老师”。视频生成模型通常不懂相机轨迹，这篇论文加了一个适配模块，把 VLM 对场景几何的理解传过去。这样生成视频时，相机运动更自然，模型能自动理解推拉摇移的空间逻辑，减少了手动控制的需要。
- **领域归类**: [视频生成，多模态学习]

### 22. Semantic Richness or Geometric Reasoning? The Fragility of VLM's Visual Invariance (语义丰富度还是几何推理？视觉语言模型视觉不变性的脆弱性)
- **社区热度**: `👍 0 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.01848)
- **研究任务**: VLM 视觉鲁棒性评估
- **核心亮点**: 揭示 VLM 在语义和几何信息冲突时表现不稳定，视觉不变性能力较弱。
- **深度解析**: 主要是做压力测试。作者改动了测试图片的几何形状（如旋转、形变）但保留内容语义，看 VLM 还认不认。结果模型经常认错，说明它靠的是统计规律猜语义，不是真的懂几何结构。一旦几何特征变了，模型判断就容易崩。
- **领域归类**: [视觉语言模型，模型评估]
---
### 23. Large Language Models Align with the Human Brain during Creative Thinking (大语言模型在创造性思维期间与人脑对齐)

- **核心亮点**: 发现 LLM 内部激活模式与人脑创意思考时的 fMRI 信号存在显著相关性。
- **深度解析**: 拿人的脑成像数据和模型内部数据做对比。让人做创意题，同时扫脑；让模型做同样的题，看隐藏层激活值。结果显示模型中间层与人脑特定区域响应趋势同步，证明模型在处理创意任务时，模拟了部分类似人的神经思考路径。
- **领域归类**: [神经科学，大模型机理]
