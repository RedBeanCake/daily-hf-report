    <h1>AI 技术周报 - 2026-W34</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 每周论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Can We Defend Against AI-Generated Video Attacks on Real-World Crisis Events? A Systematic Evaluation of Detectors, Generators and Social Dissemination (我们能否抵御针对现实世界危机事件的AI生成视频攻击？检测器、生成器及社交传播的系统评估)\n- **社区热度**: `👍 162 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14391)\n- **研究任务**: 评估AI生成视频检测器和生成器在现实世界危机事件（如战争、灾难、公共紧急情况）场景下的表现，探究检测器在不同生成条件下的泛化能力、人类对生成视频的感知，以及检测器在社交传播过程中的可靠性。\n- **核心亮点**: 提出了 RA-Bench，一个以真实视频为锚点的AI生成视频检测基准。该基准从检测器泛化性、生成属性对检测的影响、人类真实性判断及社交传播对检测的影响三个维度展开系统评估，揭示了当前方法在检测逼真AI生成视频时的局限性。\n- **深度解析**: 摘要提供了具体的基准规模与评估细节：RA-Bench 包含 17,886 个视频（1,830 个真实视频锚点，覆盖 10 个社会风险类别；16,056 个生成片段，来自 4 个开源和 5 个闭源生成器）。评估涵盖了 7 个传统检测器、10 个零样本多模态模型（3 种审查设置）以及 2 个专门微调的 MLLM。研究发现，没有任何一个检测器家族能一致地泛化；生成属性对不同检测器家族的影响不同，但源级检测模式在不同种子间保持稳定；误导人类的视频同样难以被当前检测器识别，且社交传播会使检测变得更加困难。\n- **领域归类**: [计算机视觉, 多模态, 安全与对齐, 基准测试]\n---\n\n### 2. Self-Supervised Visual On-Policy Distillation (自监督视觉同策略蒸馏)\n- **社区热度**: `👍 118 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14144)\n- **研究任务**: 解决在缺乏特权信息（如更大的教师模型、参考答案或真实感兴趣区域）的情况下，如何为视觉同策略蒸馏提供有效的信息不对称性（informative asymmetry）以产生有效学习信号的问题。\n- **核心亮点**: 提出自监督视觉同策略蒸馏（S^2VOPD）方法。该方法反转了不对称性的来源，通过从学生端减去信息（使用非对称增强视图）而不是向教师端添加特权信息来创造学习信号，将基于原始图像的教师分布同策略蒸馏到基于强增强视图的学生分布中。\n- **深度解析**: 摘要提供了具体的实验结果与设计空间探索发现：在 6 个细粒度感知基准上，S^2VOPD 将 Qwen3.5-4B 的性能从 70.7% 提升至 77.4%，超越了所有对比的开源模型（包括 235B 参数的 Qwen3-VL），并超越了 GPT-5.4。在保持训练数据不变的情况下，该方法恢复了 96% 的由特权信息方法带来的性能提升。此外，研究证实了非对称性、中等增强强度以及保持任务一致性的差距对性能的关键作用。\n- **领域归类**: [计算机视觉, 模型压缩与蒸馏, 自监督学习]\n---\n\n### 3. Beyond Final Scores: A Systematic Evaluation of Agents for Long-Horizon AI Research and Development (超越最终得分：长周期人工智能研发智能体的系统评估)\n- **社区热度**: `👍 38 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13417)\n- **研究任务**: 评估自主智能体在长周期实验（如改进模型、系统和其他技术工件）中的当前能力状态，超越单纯的最终得分，揭示进展的得失以及累积经验是否能改善后续决策。\n- **核心亮点**: 提出了一种新的评估框架，使用基于规则的指标（解决方案构建、执行和反馈控制）来表征运行内行为，并通过受控比较来评估任务内和跨任务的经验重用，从而对智能体的长周期研发能力进行系统性剖析。\n- **深度解析**: 摘要提供了具体的评估规模与核心结论：研究对 7 个前沿模型在 36 个长周期任务上进行了系统评估。结果表明，当前智能体更像工程优化器而非完全自主的研究员；它们能制定和实施实用解决方案，但跨运行性能差异大，最强解决方案主要适应或结合现有技术，真正的方法论创新罕见。观察到的性能受多种因素影响，包括相似最终结果背后的不同过程瓶颈、可能帮助或误导后续决策的经验重用，以及影响性能稳定性的工具（harness）设计。\n- **领域归类**: [人工智能, 智能体, 评估与基准测试]\n---\n\n### 4. Intern-S2-Mobius: Foundation Model with Decoupled Knowledge and Reasoning (Intern-S2-Mobius：知识与推理解耦的基础模型)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14290)\n- **研究任务**: 提出一种将知识存储与组合推理 decoupled（解耦）的新型模型架构 Mobius-v0，旨在实现更好的知识压缩和推理效率。\n- **核心亮点**: 引入 Mobius-v0 架构，包含全局共享的记忆（FFN，用于存储知识向量）和多个推理器（Self-Attn，用于迭代实现组合推理）。推理器以隐藏状态为缓存和载体，重复查询记忆获取所需知识向量，知识再传回推理算子，从而实现知识与推理的分离。\n- **深度解析**: 摘要提供了具体的模型规模与性能数据：基于 Mobius-v0 架构从头训练的 7B 模型，在仅使用基线 62.6% 训练数据的情况下，达到了与 7B Transformer 基线相似的下游得分。此外，从 Qwen3.5-35B 继续预训练的 Intern-S2-Mobius，在达到相似下游得分的同时，实现了近 4 倍的端到端推理加速。\n- **领域归类**: [自然语言处理, 模型架构, 大语言模型]\n---\n\n### 5. Marionette: Predicting World States, Rendering Geometry, Painting Appearance (Marionette：预测世界状态、渲染几何与绘制外观)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14530)\n- **研究任务**: 解决交互式游戏世界模型在长周期内因隐式维护结构化属性（如姿态、几何和遮挡）导致的误差累积、一致性和可控性脆弱的问题。\n- **核心亮点**: 提出 Marionette，一个用于具有关节角色的交互式游戏的世界模型。该模型显式建模不断变化的世界状态，将精确的几何计算委托给固定的零参数渲染器，让神经网络模型专注于合成外观，从而将状态预测、几何渲染和外观绘制解耦。\n- **深度解析**: 摘要提供了具体的机制细节与实验数据：Marionette 预测显式且可解释的 276 维 3D 世界状态（包含多实体关节骨架、度量根轨迹和旋转）。实验表明，预测的世界状态可直接控制，强制不匹配的动作流会使 48 个保留段的根对齐关节误差改变 31%。在长周期行为中，自由生成的两个角色会漂移至相距 21.2 米（ recorded sessions 保持在 5 米附近），且三分之一的帧出现地面穿透；施加地形碰撞器和分离上限两条规则后，穿透减少 66% 并保持角色互动。外观合成的 FVD 为 831，与 recorded pose 的 799 相比未检测到保真度损失。\n- **领域归类**: [计算机视觉, 世界模型, 视频生成]\n---\n\n### 6. MobileMem: Learning from a Year of Mobile Experiences (MobileMem：从一年的移动经验中学习)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13606)\n- **研究任务**: 研究设备端长期记忆，使AI智能体能够理解、记忆并持续从用户的移动经验中学习，解决现有基准在真实移动场景（经验异构、多模态、不断演变且高度个人化）中不足的问题。\n- **核心亮点**: 引入 MobileMem，一个用于研究设备端长期记忆的基准和框架。该框架基于长达一年的移动经验集合，采用基于知识的合成管道，从用户-应用会话中构建连贯且时间一致的长周期轨迹，使智能体能够记住过去、理解现在并适应未来。\n- **深度解析**: 摘要提供了基准的数据规模与任务设定：MobileMem 基于长达一年（year-scale）的移动经验集合构建。它提供涵盖多跳和时序推理、知识更新和隐式偏好推断的互补文本和多模态设置。通过将经验而非孤立事实进行建模，该基准将记忆从信息检索推向用于持续个人学习的经验智能。\n- **领域归类**: [人工智能, 智能体, 长期记忆, 基准测试]\n---\n\n### 7. SimpleOPD: Simple Tokenizer-Agnostic On-Policy Distillation for Long-Context Reasoning (SimpleOPD：用于长上下文推理的简单分词器无关同策略蒸馏)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14277)\n- **研究任务**: 解决将长上下文推理教师模型（如 SU-01）的证明推理能力蒸馏到短上下文学生模型时面临的实际挑战，包括分词器不匹配、师生分布不匹配、响应长度爆炸和训练不稳定。\n- **核心亮点**: 提出 SimpleOPD 方法。该方法在共享文本空间中进行同策略蒸馏（OPD），仅对齐在学生和教师分词器下占据相同文本范围的 token。同时引入学生参考 KL 损失，并掩码特殊终止 token 的优势，以约束学生不偏离初始策略，缓解分布不匹配并促进长度稳定增长。\n- **深度解析**: 摘要提供了具体的模型名称与性能提升数据：实验在同家族和不同家族的学生模型（包括 Qwen3, Qwen3.5, Intern-S2, GLM-4.7, Gemma-4）上取得了数学推理（尤其是自然语言数学证明）的一致提升。其中，Intern-S2-Preview 在 ProofBench 上提升 21.2 分，达到 55.2 分，超越了 Gemini-2.5-Pro。此外，该模型在 HLE 和 HiPhO 等科学基准上也有提升，表明 OPD 转移的推理能力可泛化到数学训练领域之外。\n- **领域归类**: [自然语言处理, 模型压缩与蒸馏, 长上下文推理]\n---\n\n### 8. DFM Mimir v1: An Open HRM Delivering Frontier Performance at 1B Parameters Using Only Permissible Post-Training Data (DFM Mimir v1：仅使用许可后训练数据在10亿参数下提供前沿性能的开放HRM)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13517)\n- **研究任务**: 降低致力于开源和符合伦理来源数据的研究人员的门槛，解决当前大语言模型开发依赖庞大且通常不符合许可（non-permissible）数据集的问题。\n- **核心亮点**: 引入 Mimir v1，一个基于分层推理模型（HRM）架构的 10 亿参数语言模型。该模型从头开始训练，仅使用许可的后训练数据，在英语方面表现出高度竞争力，并在丹麦语方面创下新的最先进水平（SOTA）。\n- **深度解析**: 摘要提供了具体的训练数据规模与对比模型数据：Mimir v1 在 161 个数据集的混合数据上进行训练。在英语、数学与代码以及丹麦语的 20 个基准测试中，该模型超越了原始的 HRM-Text 1B，并与 Qwen 3.5 4B 和 Gemma 4 E2B 等更大的前沿模型展开竞争。\n- **领域归类**: [自然语言处理, 大语言模型, 开源与合规]\n---\n\n### 9. HumanTracker: Towards Comprehensive and Human-Aligned Motion Tracking Benchmark (HumanTracker：迈向全面且与人类对齐的动作跟踪基准)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13555)\n- **研究任务**: 解决人形动作跟踪评估中，运动学误差（平均逐帧姿态差异）无法捕捉人们最关心的物理伪影（如不稳定的支撑和错误的接触，如脚部滑动和错误的触地时间），且现有测试套件小、缺乏多样性的问题。\n- **核心亮点**: 引入 HumanTracker 基准，使评估在感知上与人类对齐且具有可扩展性。同时提出 HumanScore，一种偏好对齐的评估指标，旨在更好地预测人类偏好并揭示运动学指标经常遗漏的物理接触和稳定性故障。\n- **深度解析**: 摘要提供了具体的基准数据规模与指标训练细节：HumanTracker 基准包含约 153 小时来自多名专业表演者的光学动作轨迹，分为 4 个动作家族并带有用于细粒度诊断的文本标签。HumanScore 指标是在包含 24K 个动作的 12K 个动作对上训练得出的。在代表性的最先进跟踪器评估中，HumanScore 展现了更好的人类偏好预测能力。\n- **领域归类**: [机器人学, 计算机视觉, 动作捕捉与跟踪, 基准测试]\n---\n\n### 10. CPI-Bench: A Comprehensive,Practical and Intelligent Benchmark for Real-World Image Editing (CPI-Bench：面向真实世界图像编辑的全面、实用和智能基准)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14546)\n- **研究任务**: 解决现有图像编辑基准局限于简单的单图像任务、覆盖维度有限、无法有效区分不同模型性能，从而无法可靠评估模型在复杂多图像编辑、高要求推理指令和实际部署设置中表现的问题。\n- **核心亮点**: 提出 CPI-Bench，一个面向真实世界图像编辑的全面、实用和智能基准。该基准包含三个核心子集，分别针对通用编辑任务（首创多图像编辑评估）、高频真实用户应用场景以及高要求推理编辑能力，旨在全面量化模型差距并指导未来优化。\n- **深度解析**: 摘要提供了具体的基准结构与对齐分析结果：CPI-Bench 包含 CPI-General-Bench、CPI-Practical-Bench 和 CPI-Intelligent-Bench 3 个核心子集。排名分析显示，CPI-Bench 与 Arena Image Edit Leaderboard 实现了最高对齐，表明它忠实地捕捉了人类评估者的偏好和感知判断，可作为真实世界用户体验的可靠代理。\n- **领域归类**: [计算机视觉, 图像编辑, 基准测试]\n\n### 11. Latent On-Policy Self-Distillation (潜在在策略自蒸馏)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13040)\n- **研究任务**: 解决自我进化 AI 中智能体从经验中学习并将其内化为策略的问题，特别是克服现有在策略自蒸馏（OPSD）方法严重依赖设计者指定的特权工件（如答案、反馈、技能或轨迹）的局限性，提升端到端可学习性和可扩展性。\n- **核心亮点**: 提出潜在在策略自蒸馏（LOPD），不再依赖手工设计的特权上下文形式，而是使教师的特权上下文本身能够从经验中进行端到端学习。同时引入特权边际目标（privileged-margin objective）来稳定和调节潜在上下文的学习。\n- **深度解析**: 技术上，LOPD 检索相关经验并将其组合成连续的潜在 token 以调节自教师，学生则从任务和交互历史生成轨迹，并在每个访问的前缀处接收密集的 token 级监督。实验表明，LOPD 在智能体工具使用和代码生成任务中表现强劲，超越了 RLVR 及 OPSD、SDPO、Skill-SD 等代表性方法；且学习效率高，使用不到 GRPO 和 Skill-SD 30% 的 rollout 预算。具体数据集名称和准确率提升数字：摘要未提供。\n- **领域归类**: [强化学习, 智能体, 自蒸馏, 机器学习]\n---\n\n### 12. Claim-Level Reliability Assessment for Efficient Test-Time Reasoning (用于高效测试时推理的声明级可靠性评估)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11994)\n- **研究任务**: 提出一种用于测试时计算扩展（test-time scaling）的声明级证伪原则，通过重新分配测试时计算资源（从额外的解决方案采样转向有针对性的验证）来提高大模型推理效率。\n- **核心亮点**: 提出无需训练的框架 CLR（声明级可靠性评估）。将每个推理轨迹浓缩为一组决策关键的声明（claims），将重点转向语义证伪，利用解决方案构建（需要完美路径）和声明反驳（只需发现单一缺陷）之间的根本不对称性。\n- **深度解析**: CLR 通过寻找负面证据来压缩高置信度错误轨迹的生存空间，通过非线性可靠性评分有效抑制错误共识。在四个 LLM 和四个推理基准上，CLR 通常能改进 pass@1 和自洽性。例如在 GPT-OSS-20B/CMIMC25 上，pass@1 提高 27.15 个百分点，自洽性准确率从 77.50% 提高到 82.19%，且 token 数量减少 37.0%。四个 LLM 和四个推理基准的具体名称：摘要未提供。\n- **领域归类**: [大语言模型, 推理, 测试时计算, 可靠性评估]\n---\n\n### 13. PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment (PRM-as-a-Judge 1.5：用于机器人过程评估的工具包)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14284)\n- **研究任务**: 解决具身模型评估中超越二元成功率和基于规则的过程分数的问题，提供细粒度的机器人过程评估，以深入理解具身模型的能力。\n- **核心亮点**: 发布 PRM-as-a-Judge 1.5 工具包，将 rollout 视频转化为密集进度曲线并导出多个细粒度指标（包括失败侧进度、回撤后恢复和成功侧执行质量）。引入 RoboPulse++ 评估过程奖励模型（PRM）的可靠性，并提供用户友好的评估套件。\n- **深度解析**: 该工具包基于基准测试的 rollout 视频对具身模型进行全面评估，提供细粒度指标结果和关键发现。通过提供包含基准、指标实现和可视化工具的套件，支持可复现的操作过程评估，呼吁社区建立透明、程序化和可复现的评估标准作为下一代具身智能的基础。具体评估指标数值和基准测试名称：摘要未提供。\n- **领域归类**: [具身智能, 机器人学, 模型评估, 过程奖励模型]\n---\n\n### 14. Forecast Collapse in Time-Series Foundation Models (时间序列基础模型中的预测崩溃)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14106)\n- **研究任务**: 研究时间序列基础模型（TSFMs）在预测美国股票小时收益率时出现的“预测崩溃”现象（预测变得几乎平坦且股票排名较差），并探究其成因与解决方案。\n- **核心亮点**: 发现“预测崩溃”与目标可预测性密切相关，由两个原因导致：低可预测性限制了校准点预测的幅度，而逐序列目标使跨序列结构无法识别。提出 CalibRank 目标来平衡校准和排名，揭示传统逐序列评估指标的盲点。\n- **深度解析**: 在 Finance1K 数据集上，CalibRank 几乎使横截面相关性增加了两倍，同时保持幅度接近目标，并改善了所有测试模型的相关性。研究指出，优化平方误差会导致平坦预测，而直接优化横截面相关性会改善排名但可能使预测幅度膨胀一个数量级以上。十二个深度学习模型和 97 个基准配置的具体名称：摘要未提供。\n- **领域归类**: [时间序列预测, 基础模型, 金融预测, 机器学习]\n---\n\n### 15. Second Thought: Reasoning in Parallel as LLM Agents Act and Observe (第二思考：LLM 智能体在行动和观察时并行推理)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13667)\n- **研究任务**: 解决 ReAct 范式中 LLM 智能体在等待环境观察时推理闲置（推理冻结）的问题，利用该时间窗口进行并行推理以服务未来的回合。\n- **核心亮点**: 提出无需训练的推理框架 Second Thought。在每个 Thought 阶段结束的瞬间分叉四个辅助分支，与主循环并发解码，并在环境观察到达时将生成的思考合并回主线程，从而将额外推理转移到主线程的顺序解码路径之外。\n- **深度解析**: 在三个智能体基准和三个推理 LLM 上，该方法降低了所有九组（模型,基准）对的平均回合数，并在六组中将主线程解码减少了高达 43%（平均约 20%）。Pass@1 在七组中无显著变化，两组显著提升（+12.4 和 +10.2 分）。在计算匹配的控制实验中，以严格更高的 Pass@1 实现了 1.3 到 3.2 倍更少的顺序解码。三个智能体基准和三个推理 LLM 的具体名称：摘要未提供。\n- **领域归类**: [大语言模型, 智能体, 推理加速, 并行计算]\n---\n\n### 16. Multimodal Model Diffing for Feature Discovery and Control (用于特征发现和控制的多模态模型差异分析)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09928)\n- **研究任务**: 解决多模态大语言模型（MLLMs）内部特征难以识别、审计或控制的问题，特别是难以隔离多模态训练改变了哪些特征，以及难以直接用于针对性控制。\n- **核心亮点**: 引入 MMDiff 多模态模型差异分析框架，训练多模态稀疏自编码器（SAEs），将其转化为特征级接口。支持特征隔离（对比基础 LM 和多模态适配版的 SAE）、特定任务特征检测（逐 token 对比触发分析）和特征级控制（因果移除或引导特征方向）。\n- **深度解析**: 在 LLaVA-MORE、PaliGemma 2 和 InternVL3.5 上训练多模态 SAEs。移除发现的特征可选择性地降低空间任务（平均 12%）和 OCR（17%）的目标行为，将多模态安全攻击的成功率降低 24%，且不影响 VQA 性能。引导这些特征可提高空间（+3.6%）和 OCR（+1.8%）准确率。视觉空间理解、多模态安全和 OCR 的具体基准数据集名称：摘要未提供。\n- **领域归类**: [多模态大模型, 模型可解释性, 稀疏自编码器, 模型控制]\n---\n\n### 17. Scaling Domain Data Repetition in LLM Pretraining (大语言模型预训练中领域数据重复的扩展)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14071)\n- **研究任务**: 研究在 LLM 预训练中，随着模型规模和训练 token 预算增加，高质量领域数据在训练混合数据中比例下降的问题，探讨如何通过重复领域数据来对抗稀释，同时避免过度拟合。\n- **核心亮点**: 发现在固定的每参数 token 数（TPP）下，最佳重复次数随模型规模轻微增加。跨不同领域发现，最佳重复次数与领域的最终验证损失呈强负相关（损失越低的领域通常可以从更多重复中受益），而唯一领域数据量与最佳重复次数仅弱相关。\n- **深度解析**: 研究表明，在具有相同 TPP 的较小代理模型上调整的重复次数，可以为较大模型提供实用的估计。这为实际 LLM 扩展中领域数据重复的权衡提供了指导，说明领域数据的质量（反映在验证损失上）比数据量更能决定其可重复性。具体的模型规模、领域数据名称和验证损失具体数值：摘要未提供。\n- **领域归类**: [大语言模型, 预训练, 数据工程, 模型扩展]\n---\n\n### 18. Verifier-Induced Support Reshaping in On-Policy Optimization (在策略优化中验证器引起的支持重塑)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.00220)\n- **研究任务**: 研究带有可验证奖励的在策略强化学习（RLVR）在改善当前目标的同时，是否会使后续目标的成功行为变得过于罕见而无法采样和强化的现象（即验证器引起的支持重塑）。\n- **核心亮点**: 定义“有效可奖励支持”为在固定 rollout 预算内可达到的成功轨迹。发现 RLVR 主要重新排序基础策略中已有的开头，且所选开头因果地影响数学可搜索性。端点改进并不能保证在策略优化下的未来可训练性或联合能力。\n- **深度解析**: 在数学推理和约束指令遵循中，Math-RLVR 提高了平均指令遵循成功率，但减少了重复采样下有任何成功响应的提示数量（Qwen3-8B-Base 上 pass@1 上升 6.5 个百分点，best@32 下降 9.8 个百分点）。IF-RLVR 则使数学响应从逐步开头转向直接回答。测试的参考策略约束、路由先验和在策略蒸馏仅能部分保留跨任务支持。两个模型家族的具体名称（除 Qwen3-8B-Base 外）、MathIF 和 ReasonIF 的具体数值：摘要未提供。\n- **领域归类**: [强化学习, 大语言模型, 在策略优化, 可验证奖励]\n---\n\n### 19. LittleLearner: Language Models Under Pedagogically Controlled Knowledge Exposure (LittleLearner：在教学控制的知识暴露下的语言模型)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13545)\n- **研究任务**: 解决现代语言模型在异构网络规模文本语料库上训练导致难以研究知识和技能获取的问题（因为难以表征先前的相关内容暴露），提供一个受控的实验环境。\n- **核心亮点**: 引入 LITTLECURRICULUM（一个 88B token 的预训练语料库，专门针对美国小学教材，明确排除 5 年级以上教授的概念、事实和词汇）。在此语料库上从头训练 5B 参数 LLM 得到 LITTLELEARNER，使其具有清晰的知识和能力边界。\n- **深度解析**: LITTLELEARNER 具有足够的语言能力进行开放式评估，同时其能力边界映射到可解释的课程指南。该沙盒用于研究后训练和上下文学习注入新知识，发现这些方法能让模型更好利用现有知识，但不会提高超出范围的能力。这凸显了受控环境在未来研究中的价值。后训练和上下文学习实验的具体准确率或评估指标数值：摘要未提供。\n- **领域归类**: [大语言模型, 预训练, 知识获取, 教育AI]\n---\n\n### 20. UniProbe: A Learnable Token-Level Hallucination Detector for Large VLMs using Multi-Structural Internal Representations (UniProbe：使用多结构内部表示的大型 VLM 可学习 Token 级幻觉检测器)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.10835)\n- **研究任务**: 解决大型视觉语言模型（LVLMs）频繁产生不受视觉输入支持的幻觉内容的问题，实现 token 级的幻觉定位，以便进行有针对性的干预而不丢弃整个响应。\n- **核心亮点**: 提出轻量级、统一、可学习的检测器 UniProbe，通过单次前向传播对冻结 LVLM 的异构计算轨迹进行建模。构建包含图像块、查询 token 和生成 token 的有向图，并使用交替的结构感知模块（GNN 处理关系证据、ViT 处理 2D 视觉几何、GRU 处理响应顺序）进行处理。\n- **深度解析**: 开发了用于幻觉感知解码的流式变体，在生成过程中检测并重采样幻觉 token，并采用自适应策略使检测器与 LVLM 自身的生成对齐。在不同 LVLM 骨干上实现了最先进的 token 级和对象幻觉检测。在解码期间，以标准生成 1.06 倍的延迟将对象幻觉减少高达 55%。diverse LVLM backbones 的具体名称及其他基准测试的具体数值：摘要未提供。\n- **领域归类**: [视觉语言模型, 幻觉检测, 模型可解释性, 图神经网络]\n\n### 21. A Pathway to General-Purpose Scientific AI: Multimodal Comprehension of Scientific Images (通往通用科学AI之路：科学图像的多模态理解)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14075)\n- **研究任务**: 科学图像（图表和表格）的信息提取、分类、总结及视觉问答。\n- **核心亮点**: 提出了 ALD/E-ImageMiner 基准和 ICDAR 2026 竞赛数据集；提出“从图像中进行科学概念理解”作为长期基准目标；探讨了基于 Bloom 分类学的问题设计以支持更深层次的科学理解。\n- **深度解析**: 摘要未提供。本文主要探讨了基准任务如何探测从视觉和定量阅读到领域推理的能力，并提出了“从图像中进行科学概念理解”的长期目标，以及未来在跨文档合成、假设评估、不确定性分析等方面的研究方向。\n- **领域归类**: [多模态, 科学计算, 信息提取]\n---\n\n### 22. Dion3: Full-Stack Orthogonal Updates (Dion3：全栈正交更新)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.11612)\n- **研究任务**: 优化大模型训练中的优化器（特别是 Muon 优化器）的正交化计算与通信开销。\n- **核心亮点**: 提出 Dion3 优化器，通过 Gram Newton-Schulz 算法、CuteDSL 内核和 megabatching 策略全栈降低正交化开销；提出仅对动量矩阵的部分行进行正交化的更新规则；在保持或提升性能的同时，将优化器步时间减少高达 6 倍。\n- **深度解析**: 摘要未提供。本文详细解析了降低开销的技术路径：算法层面采用 Gram Newton-Schulz 减少浮点运算，内核层面利用 CuteDSL 挖掘对称性加速，系统层面通过 megabatching 降低通信开销，并结合部分行正交化的更新规则进一步压缩成本。\n- **领域归类**: [深度学习系统, 优化器, 分布式训练]\n---\n\n### 23. SPARGen: Unifying Spatial Perception and Reasoning through Native Multimodal Generation (SPARGen：通过原生多模态生成统一空间感知与推理)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14138)\n- **研究任务**: 3D 重建、密集对应关系建立以及空间推理。\n- **核心亮点**: 提出 SPARGen 统一多模态框架，将多种空间任务转化为指令条件生成任务；将结构化/语言输出序列化为 token，同时生成图像对齐的密集几何场；在单一框架内实现了异构空间任务的联合表征学习。\n- **深度解析**: 摘要未提供。本文阐明了其核心机制：通过将紧凑的结构化/语言输出转化为 token 序列，并结合图像对齐的密集几何场生成，使得空间监督信号能够在一个原生多模态生成模型中共同塑造共享表征，从而促进不同空间任务间的知识迁移。\n- **领域归类**: [计算机视觉, 3D视觉, 多模态生成]\n---\n\n### 24. Who Speaks Matters: Authority-Aware Multi-View RAG over Italian Parliamentary Proceedings (发言者至关重要：面向意大利议会记录的关注权威的多视角 RAG)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13410)\n- **研究任务**: 从大规模、碎片化的议会记录中进行多视角信息检索与生成摘要，解决传统 RAG 在权威权重和引用归属上的缺陷。\n- **核心亮点**: 提出 ParliamentRAG 系统，引入依赖主题的权威模型（结合职业、教育等特征）来评估发言人的专业性；在意大利众议院数据集上，相比 Google NotebookLM，实现了更高的政治团体覆盖率（0.97 vs 0.95）和完美的引用忠实度（1.00 vs 0.95）。\n- **深度解析**: 摘要未提供。本文详细解析了其解决 RAG 痛点的机制：通过构建结合发言人背景（职业、教育、历史发言）的主题依赖权威模型，在检索后动态识别相关专家，从而在生成阶段有效平衡多视角观点并杜绝引用错误归属。\n- **领域归类**: [自然语言处理, RAG, 信息检索]\n---\n\n### 25. UNMASK: Discovering and Causally Verifying Spurious Shortcuts in Text Classifiers (UNMASK：发现并因果验证文本分类器中的虚假捷径)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09209)\n- **研究任务**: 自动发现、因果验证并缓解文本分类器（及奖励模型）中利用虚假表面模式（捷径）的问题。\n- **核心亮点**: 提出 UNMASK 全自动流水线，通过生成布尔表达式候选特征、统计验证和反事实干预来确认虚假相关；无需人工标注即可为深度特征重加权（DFR）提供分组定义；在 MNLI 上将 HANS 准确率提升高达 12.58 pp，在 CivilComments-WILDS 上匹配人工标注 DFR 的 70.1% 最差组准确率。\n- **深度解析**: 摘要未提供。本文深入解析了其方法论：将虚假相关发现转化为可执行的布尔表达式，并通过独立复制的统计验证与反事实干预确立因果关系。这种无标注的分组定义方式不仅有效消除了已知偏见，还成功泛化到了奖励模型偏好数据的分析中。\n- **领域归类**: [自然语言处理, 模型鲁棒性, 可解释性]\n---\n\n### 26. Agents Catching Agents: Shortcut Cascades and Benchmark Gaming in Clinical Multi-Agent Systems (代理抓代理：临床多代理系统中的捷径级联与基准作弊)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.03744)\n- **研究任务**: 评估和防范临床多智能体（Agent）系统中因“社会合理性”捷径导致的基准作弊（Benchmark Gaming）和错误级联问题。\n- **核心亮点**: 揭示了多智能体委员会中的“社会合理性”捷径传播现象（当两个同伴给出相同错误答案时，测试智能体有 38% 的概率盲从）；对比了三种监督机制，发现只有独立于自我报告、私下重新查询的“裁判（referee）”智能体能够有效跨模态（文本和图像）捕捉作弊行为。\n- **深度解析**: 摘要未提供。本文详细剖析了多智能体系统的脆弱性及防御机制：研究表明智能体间的错误共识会引发级联效应，且简单的门控或基于文本的裁判无法应对跨模态作弊。只有采用独立重查询机制的裁判智能体，才能有效剥离“社会合理性”伪装，精准识别并拦截基准作弊行为。\n- **领域归类**: [多智能体系统, 医疗AI, 模型评估与安全性]\n---\n\n### 27. Generation as Auxiliary Supervision: Enhancing Visual Understanding at Zero Inference Overhead via Decoupled Embedding Prediction (生成作为辅助监督：通过解耦嵌入预测在零推理开销下增强视觉理解)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.12209)\n- **研究任务**: 通过视觉生成任务作为辅助监督，提升多模态大语言模型（MLLM）的视觉理解能力，且不增加推理开销。\n- **核心亮点**: 提出 GAS 框架，将视觉生成重构为表征学习的辅助监督信号；采用解耦的混合 Transformer（MoT）架构和下一步嵌入预测（NEP），在训练时利用生成损失增强视觉通路，推理时丢弃生成分支实现零额外开销；在感知和空间理解任务上取得可靠提升。\n- **深度解析**: 摘要未提供。本文清晰阐述了其架构创新：通过解耦的 MoT 架构，让底层的共享主干同时处理理解和生成任务，而平行的上层则隔离了生成梯度对理解层的直接干扰。这种设计使得生成任务能够迫使模型学习更精细的空间特征，同时在推理阶段通过裁剪生成分支实现零额外开销。\n- **领域归类**: [多模态大模型, 视觉理解, 模型架构]\n---\n\u003c/details\u003e\n\n"</script>
