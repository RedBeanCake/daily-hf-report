### 1. Soohak: A Mathematician-Curated Benchmark for Evaluating Research-level Math Capabilities of LLMs (Soohak：用于评估大模型研究级数学能力的数学家 curated 基准)
- **社区热度**: `👍 59 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.09063)
- **研究任务**: 大模型数学能力评估基准构建。
- **核心亮点**: 由数学家人工筛选，题目难度达到科研级别，区别于常见的中学数学题。
- **深度解析**: 现有基准（如 GSM8K）太简单，无法区分顶尖模型。这篇论文收集了真正的研究级数学问题，并由专家验证答案。主要用来测试模型在复杂推理和未知问题上的泛化能力，防止刷分。
- **领域归类**: [Benchmark, Math, Evaluation]
