### 1. DelTA: Discriminative Token Credit Assignment for Reinforcement Learning from Verifiable Rewards (DelTA：基于可验证奖励的强化学习判别式 Token 信用分配)
- **社区热度**: `👍 118 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.21467)
- **研究任务**: 强化学习从可验证奖励 (RLVR)
- **核心亮点**: 将序列级奖励细化为 Token 级判别式信用分配，解决稀疏奖励问题。
- **深度解析**: 针对 RLVR 中奖励信号通常只针对整个序列导致信用分配不准的问题，提出了一种判别式方法。该方法能在训练过程中区分哪些 Token 对最终正确结果贡献更大，从而更精准地更新策略模型，提升采样效率和收敛速度。
- **领域归类**: [强化学习] [大模型对齐] [算法优化]
