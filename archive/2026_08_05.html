### 1. LongHorizon-Harness: Advancing Long-Horizon Agents for Real-World Tasks (LongHorizon-Harness：推进现实世界长程任务智能体)
- **社区热度**: `👍 113 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.01964)
- **研究任务**: 长程任务规划与智能体控制
- **核心亮点**: 提出一种约束机制，解决智能体在长序列任务中容易迷失或失败的问题。
- **深度解析**: 针对现实世界任务步骤多、耗时长的特点，设计了一个"Harness"（约束/引导）模块。该模块不直接生成动作，而是对智能体的规划过程进行监控和修正，防止误差累积导致任务中途失败，提升了长程任务的成功率。
- **领域归类**: [Agent, Planning, RL]

### 2. SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks (SwanTale：面向指令与零-shot 任务的统一多说话人语音及音频生成)
- **社区热度**: `👍 111 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.02023)
- **研究任务**: 语音与音频生成
- **核心亮点**: 单个模型同时搞定多说话人语音生成和通用音频生成，支持指令控制。
- **深度解析**: 打破了语音生成和音效生成模型分离的现状。通过统一架构，模型既能根据文本生成特定人的语音，也能根据指令生成环境音效，且支持零样本克隆说话人音色，简化了部署流程。
- **领域归类**: [Audio, Speech, Multimodal]
---
### 3. DAPD: Dual-Anchored Policy Distillation (DAPD：双锚点策略蒸馏)
- **社区热度**: `👍 45 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.01735)
- **研究任务**: 强化学习策略蒸馏
- **核心亮点**: 引入两个参考锚点，稳定学生策略的学习过程。
- **深度解析**: 传统策略蒸馏容易因教师策略噪声导致学生模型学偏。该方法设定两个“锚点”（可能是不同阶段或不同视角的策略分布），让学生模型在两者之间进行平衡学习，减少了蒸馏过程中的性能波动。
- **领域归类**: [RL, Distillation]
---
### 4. Progressive Agent Skill Generation via Reinforcement Learning (基于强化学习的渐进式智能体技能生成)
- **社区热度**: `👍 43 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.01678)

- **核心亮点**: 用强化学习逐步生成技能，而不是一次性训练所有能力。
- **深度解析**: 采用课程学习思想，利用 RL 让智能体先掌握基础技能，再在此基础上生成更复杂的技能。这种渐进式方式降低了搜索空间难度，提高了复杂技能生成的成功率。
- **领域归类**: [RL, Skill Learning]

### 9. Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs (自动驾驶 VLM 中用于可验证推理的未来轨迹延迟暴露)
