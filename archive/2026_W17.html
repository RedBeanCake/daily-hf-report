### 1. Elucidating the SNR-t Bias of Diffusion Probabilistic Models (阐明扩散概率模型中的信噪比 - 时间步偏差)
- **社区热度**: `👍 63 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.16044)
- **研究任务**: 扩散模型理论分析
- **核心亮点**: 发现了扩散模型在不同噪声比例和时间步上存在系统性偏差。
- **深度解析**: 论文分析了扩散生成过程中信噪比（SNR）与时间步（t）的关系，指出当前模型在这两个维度上存在未对齐的偏差，影响了生成质量。作者提出了相应的度量方法，为后续修正采样策略提供了理论依据。
- **领域归类**: [生成式 AI, 扩散模型]

### 2. Maximal Brain Damage Without Data or Optimization: Disrupting Neural Networks via Sign-Bit Flips (无需数据或优化的最大脑损伤：通过符号位翻转破坏神经网络)
- **社区热度**: `👍 30 Upvotes`

- **深度解析**: 提出了一种极简的攻击方式，直接修改模型权重的符号位（Sign-Bit）。实验表明，这种操作能导致模型性能大幅下降，揭示了神经网络参数空间对符号变化的敏感性，对模型存储和传输安全提出了新挑战。
- **领域归类**: [AI 安全, 模型鲁棒性]
