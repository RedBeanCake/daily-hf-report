### 1. The Mirage of Optimizing Training Policies: Monotonic Inference Policies as the Real Objective for LLM Reinforcement Learning (优化训练策略的幻象：单调推理策略作为 LLM 强化学习的真实目标)
- **社区热度**: `👍 99 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.29526)
- **研究任务**: 大语言模型强化学习 (LLM RL)
- **核心亮点**: 指出训练策略优化并不等同于效果提升，主张将推理策略的单调性作为核心优化目标。
- **深度解析**: 论文分析了传统 RLHF 中训练损失下降但推理效果不稳定的现象。提出不再单纯优化训练策略，而是施加约束确保推理阶段的策略输出呈单调改进趋势，从而保证模型性能在实际使用中稳步提升。
- **领域归类**: [LLM, 强化学习, 训练策略]
---

### 2. Embodied.cpp: A Portable Inference Runtime of Embodied AI Models on Heterogeneous Robots (Embodied.cpp：异构机器人上具身 AI 模型的可移植推理运行时)
- **社区热度**: `👍 34 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.02501)
- **研究任务**: 具身 AI 模型部署
- **核心亮点**: 提供了一套 C++ 编写的通用推理运行时，解决不同机器人硬件间的部署兼容性问题。
- **深度解析**: 针对机器人硬件异构导致的模型部署难痛点，封装了统一的推理接口。屏蔽底层硬件差异，使得同一具身 AI 模型无需修改代码即可在不同品牌的机器人上运行，降低部署成本。
- **领域归类**: [具身智能, 系统部署, 推理引擎]
---

### 3. VLA-Corrector: Lightweight Detect-and-Correct Inference for Adaptive Action Horizon (VLA-Corrector：用于自适应动作规划范围的轻量级检测 - 修正推理)
- **社区热度**: `👍 22 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.01804)
- **研究任务**: 视觉 - 语言 - 动作模型 (VLA) 推理优化
- **核心亮点**: 通过轻量级外挂模块，在推理阶段动态检测并修正动作误差，自适应调整规划范围。
- **深度解析**: 在不重新训练主 VLA 模型的前提下，增加一个检测 - 修正模块。该模块实时监控动作序列，发现偏差即刻纠正，并根据任务难度动态调整动作预测的时间 horizon，提升执行成功率。
- **领域归类**: [具身智能, VLA, 推理优化]
---

### 4. OrbitQuant: Data-Agnostic Quantization for Image and Video Diffusion Transformers (OrbitQuant：面向图像和视频扩散 Transformer 的数据无关量化)
- **社区热度**: `👍 19 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.02461)
- **研究任务**: 扩散模型压缩 (量化)
- **核心亮点**: 实现了针对 Diffusion Transformer 架构的量化，且不需要依赖特定校准数据集。
- **深度解析**: 针对 DiT 结构特点设计量化方案，解决了传统量化需要大量校准数据的问题。通过数据无关的权重处理算法，在显著降低显存占用的同时，保持图像和视频生成的质量不受明显影响。
- **领域归类**: [扩散模型, 模型压缩, 量化]
---

### 5. DataComp-VLM: Improved Open Datasets for Vision-Language Models (DataComp-VLM：改进的视觉 - 语言模型开放数据集)
- **社区热度**: `👍 11 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.28551)
- **研究任务**: 多模态数据集构建
- **核心亮点**: 发布了一套经过优化筛选的开放数据集，旨在提升 VLM 的训练效率与性能。
- **深度解析**: 沿用 DataComp 基准方法论，对海量图文数据进行更严格的清洗和过滤。重点优化数据多样性和质量平衡，为社区提供可直接用于训练高性能视觉 - 语言模型的基础数据资源。
- **领域归类**: [多模态, 数据集, VLM]
---

### 6. Securing the AI Agent: A Unified Framework for Multi-Layer Agent Red Teaming (保护 AI 智能体：多层智能体红队测试统一框架)
- **社区热度**: `👍 8 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.02471)
- **研究任务**: AI 智能体安全 (红队测试)
- **核心亮点**: 建立了一套统一框架，支持对 AI 智能体进行模型、工具、环境多层面的安全测试。
- **深度解析**: 针对 Agent 自主交互带来的新安全风险，突破了仅测试模型输出的局限。框架涵盖了对工具调用权限、环境交互逻辑的多层漏洞扫描，系统化评估智能体在复杂工作流中的安全性。
- **领域归类**: [AI 安全, 智能体, 红队测试]
---

### 7. Interpretation-Oriented Cloud Removal via Observation-Anchored Residual Flow with Geo-Contextual Alignment (面向解释性的去云：基于观测锚定残差流与地理上下文对齐)
- **社区热度**: `👍 4 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.01420)
- **研究任务**: 遥感图像去云
- **核心亮点**: 在去除云层的同时，确保地表特征不失真，满足后续地理分析的解释性需求。
- **深度解析**: 采用观测锚定的残差流网络去除云遮挡。引入地理上下文对齐机制，约束生成内容符合实际地物分布，避免去云后产生伪影，保证图像可用于科学的地理信息解释。
- **领域归类**: [计算机视觉, 遥感, 图像 restoration]
---

### 8. MultAttnAttrib: Training-Free Multimodal Attribution in Long Document Question Answering (MultAttnAttrib：长文档问答中无需训练的多模态归因)
- **社区热度**: `👍 4 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.00052)
- **研究任务**: 长文档多模态问答 (归因)
- **核心亮点**: 无需额外训练，利用注意力机制直接定位长文档中答案来源的多模态片段。
- **深度解析**: 针对长文档 QA 难以追溯答案来源的问题，通过分析模型内部的注意力权重分布。直接映射答案 token 到输入文档的特定文本或图像区域，实现高效、无需训练的可解释性归因。
- **领域归类**: [NLP, 多模态, 可解释性]
---

### 9. AGE: Adaptive-masking for Graph Embedding in Graph Retrieval-Augmented Generation (AGE：图检索增强生成中图嵌入的自适应掩码)
- **社区热度**: `👍 3 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.31959)
- **研究任务**: 图检索增强生成 (Graph RAG)
- **核心亮点**: 通过自适应掩码策略优化图嵌入表示，提升检索阶段的相关性匹配精度。
- **深度解析**: 针对 Graph RAG 中节点 embedding 表达不够精准的问题，提出自适应掩码方法。在嵌入学习过程中动态调整节点信息的掩码比例，使生成的向量更适配检索任务，提高召回质量。
- **领域归类**: [图神经网络, RAG, 检索]
---

### 10. AnyBokeh: Physics-Guided Any-to-Any Bokeh Editing with Optical Fingerprint Transfer (AnyBokeh：基于光学指纹迁移的物理引导任意散景编辑)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.31959)
- **研究任务**: 图像编辑 (散景效果)
- **核心亮点**: 基于物理光学原理，实现任意图像间逼真的散景效果合成与移除。
- **深度解析**: 通过提取和迁移镜头的“光学指纹”，模拟真实物理光路产生的散景。支持在不同图像内容间任意转换散景效果，解决了传统方法效果虚假或条件受限的问题。
- **领域归类**: [计算机视觉, 图像编辑, 生成模型]
---

### 11. Generated Contents Enrichment (生成内容增强)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2405.03650)
- **研究任务**: 解决大模型生成内容信息量不足、细节缺失的问题。
- **核心亮点**: 提出了一种无需微调的即插即用方案，利用检索外部知识来充实模型生成内容，提升信息密度。
- **深度解析**: 推理阶段先生成初稿，基于初稿检索相关文档，再将检索结果作为补充上下文喂回模型进行修正或扩充。重点解决生成内容细节空洞的问题，直接能用，不用训模型。
- **领域归类**: [大语言模型，检索增强生成 (RAG)，文本生成]
