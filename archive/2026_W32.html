### 16. RL^2-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models (RL^2-VLA：视觉 - 语言 - 动作模型的自适应 RL 潜在组合引导与测试时缩放)

### 20. Not All Tokens Deserve Equal Credit: Counterfactual Sensitivity Credit Reallocation for Long-CoT Reasoning (并非所有 token 都值得同等信任：用于长 CoT 推理的反事实敏感性信用重分配)

### 21. Beyond Feeling Better: Capability-Sustaining Emotional Dialogue as a Longitudinal Research Paradigm (不止于感觉更好：作为纵向研究范式的可持续能力情感对话)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.27851)
- **研究任务**: 情感对话系统的长期评估
- **核心亮点**: 提出纵向研究范式，关注长期对话中模型能力的维持而非短期情绪改善。
- **深度解析**: 传统评估只看单次交互的情绪反馈，这篇把时间维度拉长，监测模型在长周期内是否保持解决问题的能力和情感支持的一致性。方案是设计长期交互实验，避免模型为了讨好用户而丧失功能性或出现逻辑崩塌，强调“能力可持续”比“暂时感觉好”更重要。
