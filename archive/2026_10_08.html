    <h1>前沿科研情报 - 2026-10-08</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Rethinking Cross-Tokenizer On-Policy Distillation: From Alignment Coverage to Supervision Reliability (重新思考跨分词器的在策略蒸馏：从对齐覆盖到监督可靠性)\n- **社区热度**: `👍 153 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08448)\n- **研究任务**: 跨分词器（Cross-Tokenizer）的在策略蒸馏（On-Policy Distillation），即在教师模型和学生模型使用不同分词器的情况下，利用教师反馈在学生模型自身的生成内容上进行训练，应用于数学推理和代码生成。\n- **核心亮点**: 发现扩大对齐覆盖范围并不能提升学习效果，研究范式应从“最大化对齐覆盖”转向“优先保证监督可靠性”。在严格对齐位置使用紧凑的监督（如限制在共享词表的前16个子集）即可达到与全共享词表相当的准确率并超越基线；而在不匹配组中添加跨度监督虽实现了完全覆盖，却因引入冲突信号导致准确率下降。\n- **深度解析**: 论文探讨了师生模型分词器不同时的序列和词汇级别对齐问题。研究表明，尽管词汇不匹配严重，严格的1:1对齐组已能覆盖学生生成的大部分token。进一步分析发现，在不匹配组中增加均方误差监督会导致梯度方向不一致且幅度增大。关于具体的实验数据集名称：摘要未提供。具体的准确率提升数字：摘要未提供。具体的师生模型名称：摘要未提供。\n- **领域归类**: [自然语言处理, 模型压缩与蒸馏, 大语言模型]\n---\n\n### 2. DuoMatching: Joint-Marginal Distribution Matching for Few-Step Video Generation (DuoMatching：用于少步视频生成的联合-边缘分布匹配)\n- **社区热度**: `👍 67 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03543)\n- **研究任务**: 流式视频生成（Streaming video generation），旨在通过分布匹配蒸馏（DMD）加速视频生成，并提升视觉质量和语义对齐。\n- **核心亮点**: 提出DuoMatching框架，通过统一的联合-边缘分布公式近似真实视频分布。引入LatentBridge解决视频学生和图像教师之间的潜在表示不匹配，并利用潜在变异采样将帧级监督分配到不同时间片段以减少冗余。\n- **深度解析**: 现有的联合匹配在缓解自回归展开漂移方面有效，但在视觉和语义上仍有局限。DuoMatching在联合匹配基础上增加边缘匹配目标，从图像生成器转移互补先验。实验表明该方法在保持运动动态的同时显著提升了视觉质量，人类评估偏好率超过80%。关于具体的实验数据集名称：摘要未提供。具体的基线模型名称：摘要未提供。\n- **领域归类**: [计算机视觉, 视频生成, 扩散模型]\n---\n\n### 3. TRACE: Rollout-Guided Quantization-Aware Training for FP4 Reinforcement Learning of MoE Language Models (TRACE：面向MoE语言模型FP4强化学习的展开引导量化感知训练)\n- **社区热度**: `👍 60 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07767)\n- **研究任务**: 大语言模型后训练中的强化学习加速，特别是针对混合专家模型（MoE）的FP4（4位浮点数）量化训练，以降低展开（rollout）生成时的计算和内存开销。\n- **核心亮点**: 提出TRACE框架，利用展开侧的量化结果指导训练侧的FP4舍入决策，直接减少训练与展开路径的量化差异。同时采用高效的量化信息缓存方案，选择性保留深层尾数和缩放信息，降低存储和通信开销。\n- **深度解析**: 现有FP4 RL方法主要独立优化训练和展开路径，未直接减少两者差异。TRACE通过展开引导的量化感知训练解决了这一问题。在推理、编码和长视野RL任务上，TRACE实现了高达5.4倍的展开加速，且保持了与BF16相当的RL性能。关于具体的MoE模型名称：摘要未提供。具体的任务数据集名称：摘要未提供。\n- **领域归类**: [自然语言处理, 模型量化, 强化学习, 混合专家模型]\n---\n\n### 4. EVISKILL: Grounding Skill Evolution in Replayable Evidence (EVISKILL：基于可重放证据的技能进化基础)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05030)\n- **研究任务**: 大语言模型（LLM）智能体的持续技能进化，即在不更新模型参数的情况下，从交互经验中积累和优化可重用的程序性知识。\n- **核心亮点**: 提出EVISKILL框架，将执行观察组织成“可重放证据卡”，并合成与支撑上下文有明确链接的编辑。通过目标重放重新执行来验证编辑并提供纠正反馈，由全局验证控制其纳入最终技能。\n- **深度解析**: 现有经验驱动方法易丢失支持编辑的行为证据和任务上下文，且全局验证无法完整判断局部更改。EVISKILL通过保留证据并暂时保留受支持的编辑以供细化，解决了这一问题。关于具体的交互基准名称：摘要未提供。具体的LLM骨干名称：摘要未提供。具体的实验性能数字：摘要未提供。\n- **领域归类**: [人工智能, 智能体, 持续学习]\n---\n\n### 5. From Evidence to Action: How Tool-Using Agents Fail (从证据到行动：工具使用智能体如何失败)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07753)\n- **研究任务**: 评估和分析工具使用智能体在从证据收集到执行动作的链条中失败的原因和机制。\n- **核心亮点**: 引入SafeActBench基准，包含656个案例、六个操作领域和五种协议。引入基于来源的证据账本和确定性轨迹评估器，追踪信息建立、动作发生及下游依赖满足的情况。\n- **深度解析**: 研究发现，智能体的失败不仅源于信息缺失，还源于它们使用已建立证据进行决策和执行的方式。失败通常在执行前就开始了（如调查不完整）。一旦获得所需证据，单动作执行通常可靠，但多动作工作流会暴露未解决的先决条件。关于具体的模型名称：摘要未提供。具体的评估数据集名称：摘要未提供。具体的性能数字：摘要未提供。\n- **领域归类**: [人工智能, 智能体, 安全与评估]\n---\n\n### 6. AutoSciBench: Autonomous Benchmark Generation for Evaluating Scientific Agents (AutoSciBench：用于评估科学智能体的自主基准生成)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05140)\n- **研究任务**: 科学智能体的评估，旨在解决现有基准因智能体能力快速提升而饱和，且人工构建和更新基准耗时费力的问题。\n- **核心亮点**: 提出AutoSciBench框架，自动生成并迭代适应科学智能体基准。将任务表示为高层概念和底层配方，利用智能体求解轨迹和评判反馈修改配方以关闭捷径，并将细化经验蒸馏以指导新概念生成。\n- **深度解析**: AutoSciBench通过将任务转向原始数据重新检查和证据整合来避免智能体走捷径。在计算生物学、材料科学和临床成像领域，生成的基准使求解器平均准确率分别降低了22.4和25.5个百分点，且任务质量评分更高。关于具体的评估基准名称：摘要未提供。具体的LLM模型名称：摘要未提供。\n- **领域归类**: [人工智能, 智能体, 基准测试与评估, 科学计算]\n---\n\n### 7. Taming VLAs under Robot Execution Errors: Self-Compensation and Stress Testing (在机器人执行误差下驯服VLA：自补偿与压力测试)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37334)\n- **研究任务**: 视觉-语言-动作（VLA）策略在机器人执行动作出现偏差（由于机械磨损、负载变化等引起）时的鲁棒性提升与部署时适应。\n- **核心亮点**: 提出自补偿VLA方法，在部署时通过命令动作与实际执行动作的残差在线更新策略，无需任务奖励或标签。引入RoboStress仿真基准，结合摩擦、背隙等关节级模型进行压力测试。\n- **深度解析**: VLA策略在实际运动偏离命令动作时往往会失败。自补偿VLA能够在生成命令时预先补偿这些执行误差。在两个物理机械臂上，平均任务成功率提高了30个百分点以上，且泛化到了未见过的物体。关于具体的物理机械臂型号：摘要未提供。具体的任务成功率数字：摘要未提供。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 自适应控制]\n---\n\n### 8. HuatuoGPT-3: RL-Only Domain Adaptation from Base Models (HuatuoGPT-3：从基础模型进行纯强化学习的领域自适应)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05966)\n- **研究任务**: 大语言模型的领域自适应，探索仅使用强化学习（RL-only）将通用LLM转化为特定领域（如医疗）专家的方法，以避免SFT+RL流程的复杂性。\n- **核心亮点**: 提出单阶段策略优化（OnePO），将教师输出视为瞬态指导。结合自适应目标演化（强化对低概率教师token的学习）和教师退役（当前策略超越教师时丢弃）。发布开源医疗LLM系列HuatuoGPT-3。\n- **深度解析**: 纯在策略RL存在冷启动问题，混合策略RL存在梯度饥饿和教师分布锚定问题。OnePO通过动态调整学习重点和及时淘汰教师指导来解决这些问题。其27B变体在HealthBench Professional上达到71.4分，超越GPT-6 Astra。关于具体的基础预训练模型名称：摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 强化学习, 医疗AI]\n---\n\n### 9. World Action Learning via Interaction-Centric Spectral Latent Guidance (通过以交互为中心的频谱潜在引导进行世界动作学习)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.03607)\n- **研究任务**: 机器人策略学习，旨在将人类第一人称视频中的交互知识迁移到机器人控制策略中，解决真实世界机器人演示数据收集昂贵的问题。\n- **核心亮点**: 提出WING框架，将观察者引起的运动与手-物交互分离，提炼出以交互为中心的潜在动作。在频域中识别第一人称潜在动作与机器人行为共享的低频成分，并用于引导动作生成。\n- **深度解析**: 直接转移第一人称视频面临自我相机运动干扰和人类与机器人时间动态不同的挑战。WING利用跨具身任务语义集中在缓慢变化时间结构上的观察，通过频谱引导实现迁移。在LIBERO等基准上成功率极高，并在真实世界任务中表现强劲。关于具体的真实世界操作任务名称：摘要未提供。具体的对比基线方法名称：摘要未提供。\n- **领域归类**: [机器人学, 计算机视觉, 模仿学习]\n---\n\n### 10. UNREAL: Unifying Retrieval and Long-Context with a Single Model (UNREAL：用单一模型统一检索与长上下文)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08463)\n- **研究任务**: 长上下文推理与检索增强生成（RAG）中的证据选择，探索单一模型内部机制是否能跨越不同规模进行证据选择。\n- **核心亮点**: 引入UNREAL框架，一种模型原生的证据选择机制。直接从冻结LLM的内部表示中编码块并推导检索查询，仅增加不到50万可训练参数，骨干网络保持不变。\n- **深度解析**: UNREAL将语料库检索和长上下文推理统一在同一个机制下。在Wikipedia索引上超越了最先进的检索系统（如HotpotQA召回率提升至73.2%）。在长上下文任务中，该机制在生成前移除干扰项，显著提升了准确率，并从约32K tokens起降低了计算开销。关于具体的LLM骨干模型名称：摘要未提供。\n- **领域归类**: [自然语言处理, 检索增强生成, 长上下文处理]\n---\n\n### 11. MiniCorp: The Last Mile of the AI Agent Firm (MiniCorp：AI代理公司的最后一公里)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05912)\n- **研究任务**: 研究AI代理如何集体运营公司，并大规模生成企业数据，以解决企业AGI面临的纵向企业数据稀缺、获取成本高和隐私限制等问题。\n- **核心亮点**: 提出MiniCorp，一个用于模拟公司运营的办公模拟器。它连接了外部世界（客户、竞争对手、市场机制）和内部世界（观察、讨论和决策的代理）。支持检查点回放以比较不同决策的结果，提供纵向和反事实的企业数据。\n- **深度解析**: 摘要未提供具体数字和数据集名称。研究通过对比真实市场的经验研究模式来评估端到端保真度，为代理提供真实的市场反馈。实验表明代理能够跨角色协调并适应市场反馈，在明确的长期战略指导下，即使早期回报微弱也能维持广告探索。\n- **领域归类**: [多智能体系统, 企业模拟, 强化学习]\n---\n\n### 12. Selection-Based Structured Reasoning: Toward Efficient Multimodal Search Agents (基于选择的结构化推理：迈向高效的多模态搜索代理)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.01892)\n- **研究任务**: 解决多模态代理在每次动作前生成自由形式推理时，小模型因容量有限导致推理冗长、指导作用小且推理成本高的问题。\n- **核心亮点**: 提出基于选择的结构化推理（SSR）框架，将推理重构为选择而非开放式生成。将重复的高层推理表示为预先指定的、可重用的自然语言候选项。模型根据当前上下文下的似然性从候选项中进行选择，支持并行评分，利用共享上下文KV缓存并发计算token似然性。\n- **深度解析**: 摘要未提供具体数据集名称。研究在7个多模态搜索基准上使用2B和4B模型进行评估。在多种强化学习目标和监督微调下，SSR在不牺牲任务性能的情况下实现了显著的效率提升，平均成功率与同等规模的领先搜索代理相当，同时将每轮推理延迟降低了90%以上，每个问题的总模型推理延迟降低了28-54%。\n- **领域归类**: [多模态代理, 推理优化, 模型效率]\n---\n\n### 13. AGO AI Quality Gate: Evidence-First Release Decisions for Retrieval-Augmented Generation (AGO AI质量门：检索增强生成的证据优先发布决策)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.01218)\n- **研究任务**: 解决企业在采用检索增强生成（RAG）时面临的系统版本发布决策（升级、修改或阻止）问题，处理证据不完整和指标来自易错的LLM评判者的情况。\n- **核心亮点**: 提出AGO AI质量门（AGO）框架，包含四个关键组件：将缺失数据和评判错误视为显式结果的四状态决策模型；结合确定性检查、本地护栏和结构化LLM评估的分层评分；概率量化回归风险的分层beta-二项式门；以及在影响决策前验证LLM评判者的强制元评估协议。\n- **深度解析**: 摘要未提供具体实验数字。研究在包含12个数据集、10万条注释RAG轨迹的公共基准RAGBench上评估评判层。低成本评判者（gpt-4.1-nano）检测不合规答案的AUROC为0.603，而gpt-4o达到0.783。在回归情况下，决策级配置将不安全升级率降低至22.2%-35.1%，优于朴素门的29.3%-41.8%。\n- **领域归类**: [检索增强生成, 模型评估, 质量保证]\n---\n\n### 14. DiffGate: Difficulty-Gated Teacher Guidance for On-Policy Distillation (DiffGate：用于在策略蒸馏的难度门控教师指导)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04596)\n- **研究任务**: 解决在策略蒸馏（OPD）目标主要是局部token和忽略结果的，以及带可验证奖励的强化学习（RLVR，如GRPO）存在奖励稀疏和信用分配粗糙的问题。\n- **核心亮点**: 提出DiffGate，一种结果门控目标，将GRPO与选择性、有界的教师指导相结合。教师监督仅应用于失败的轨迹，按组难度缩放，并平滑有界以防止极端的教师-学生差异主导优化。验证器决定哪些轨迹接收教师指导，而教师在这些轨迹内提供密集的token级更新方向。\n- **深度解析**: 摘要未提供具体数据集名称。研究在Qwen3-0.6B和Qwen3-1.7B学生模型上进行实验。在代码任务中，DiffGate将匹配GRPO的code avg@8分别提高了+1.7和+1.8分，pass@8分别提高了+1.6和+5.7分。在数学任务中，avg@8保持在GRPO的0.5分以内，而pass@8分别提高了+1.1和+3.9分。总体而言，DiffGate在所有四个模型-领域设置中均提高了pass@8。\n- **领域归类**: [模型蒸馏, 强化学习, 大语言模型训练]\n---\n\n### 15. GUI-HARVEST: Self-Improving GUI Agents through Evidence-Driven Harness Evolution (GUI-HARVEST：通过证据驱动的线束演化实现自我改进的GUI代理)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00948)\n- **研究任务**: 解决GUI模型周围的执行线束（harness）优化问题，包括协调模型意图与观察到的视觉效果、在可变执行结果下诊断故障，以及识别跨任务的重复故障模式并将其转化为可重用的运行时更改。\n- **核心亮点**: 提出GUI-HARVEST，一个自动线束优化器，使具有冻结主干模型的GUI代理能够自我改进。它通过将模型输出和执行的动作与前后截图对齐来诊断故障；将同一任务的重复运行视为联合证据单元以定位与结果相关的行为差异；将验证的发现整合为重复的故障模式，并映射到有界的源代码编辑。\n- **深度解析**: 摘要未提供具体实验数字。研究在OSWorld-Verified和WindowsAgentArena上进行实验。在OSWorld-Verified上，六个主干模型均获得一致的保留增益，其中Qwen3-VL-32B-Instruct提升了12.33分。冻结线束转移使GPT-5在WindowsAgentArena上50步时提升了13.87个百分点。\n- **领域归类**: [GUI代理, 自我改进, 自动化测试]\n---\n\n### 16. EmbodiedSmith: Scaling Embodied Data through Recursive Self-Improvement Flywheel in Simulation (EmbodiedSmith：通过模拟中的递归自我改进飞轮扩展具身数据)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07969)\n- **研究任务**: 解决机器人基础模型扩展所需的数据多样性和可靠评估环境问题，特别是现有生成管道受限于预定义资产和技能、场景生成与任务生成脱节以及对复杂具身和物理支持有限的问题。\n- **核心亮点**: 提出EmbodiedSmith，一个通过递归自我改进（RSI）进行可扩展具身数据生成的框架。它统一了资产、场景和任务生成，核心是一个代理细化循环：场景生成预测下游任务需求，任务生成指导有针对性的场景编辑，使场景和任务迭代改进。支持移动机械臂、人形机器人和灵巧手，以及涉及可变形物体和流体的交互。\n- **深度解析**: 摘要未提供具体实验数字和数据集名称。广泛的实验验证了生成数据的质量、多样性和生成效率，下游策略实验表明增加的数据多样性提高了泛化能力。\n- **领域归类**: [具身智能, 机器人学习, 数据生成]\n---\n\n### 17. Making LLMs Say What They Think: Measuring and Improving CoT-Interpretability Alignment (让大语言模型说出它们的想法：测量和改善思维链-可解释性对齐)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38972)\n- **研究任务**: 测量和改善大语言模型（LLM）的思维链（CoT）中描述的推理与其内部计算之间的对齐程度，解决CoT通常无法反映模型内部计算且可被改变而不影响最终答案的问题。\n- **核心亮点**: 提出思维链-可解释性对齐（CIA）指标，用于衡量模型的CoT轨迹与可解释性工具检测到的内部推理策略之间的一致性。通过后期训练改善CIA，将任务准确性和参数忠实度信号均设为奖励，从而在保持或提高任务准确性的同时大幅提高CoT的参数忠实度。\n- **深度解析**: 摘要未提供具体数据集名称。研究在三个任务（两跳问答、提示干预和整数乘法）和三个LLM上评估CIA，发现LLM在所有任务中表现出有限的对齐（44.8-75.9%）。实验表明，通过后期训练可以大幅提高CoT参数忠实度，同时保持或提高任务准确性。\n- **领域归类**: [大语言模型, 可解释性, 思维链]\n---\n\n### 18. SlimWise: Decoupling Expert Pruning Across Prefill and Decode for Efficient MoE Serving (SlimWise：解耦预填充和解码的专家剪枝以实现高效的MoE服务)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34117)\n- **研究任务**: 解决混合专家（MoE）模型在批处理解码时访问几乎整个专家池导致专家权重流量成为主要瓶颈的问题，以及传统专家剪枝方法同时剪枝计算受限的预填充阶段从而牺牲模型质量的问题。\n- **核心亮点**: 提出SlimWise服务框架，为每个推理阶段定制专家池。SlimWise使用完整模型进行预填充，使用剪枝模型进行解码，并直接重用预填充生成的KV缓存而无需转换。引入低成本蒸馏阶段，训练解码器从完整模型KV缓存继续，同时仅更新一小部分参数。\n- **深度解析**: 摘要未提供具体数据集名称。研究在两个MoE骨干和三个剪枝标准上进行评估。在Qwen3.6-35B-A3B上，SlimWise在50%专家剪枝下将解码吞吐量提高了高达1.81倍，同时精度损失极小。\n- **领域归类**: [模型服务, 混合专家模型, 推理优化]\n---\n\n### 19. Adaptive Latent Capacity for World Models (世界模型的自适应潜在容量)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32921)\n- **研究任务**: 解决世界模型在预测信息分布和规划能力方面的问题，提出一种基于联合嵌入预测架构（JEPA）的世界模型，学习将预测信息集中在宽潜在表示的紧凑前缀中。\n- **核心亮点**: 提出自适应LeWorldModel（ALeWM），学习前缀长度的序列条件分布，并训练预测器从采样的输入前缀估计完整的下一个嵌入。引入MixSIGReg，对掩码嵌入进行正则化，使其对抗具有高斯活跃前缀和剩余坐标为零的先验加权混合。这鼓励早期坐标保留对预测和递归规划有用的信息。\n- **深度解析**: 摘要未提供具体实验数字和数据集名称。研究在具有已知状态变量的受控动态系统和目标条件视觉控制中分析ALeWM的行为，表明其始终比调整后的固定宽度LeWM实现更高的平均成功率，且平均规划容量更低。\n- **领域归类**: [世界模型, 强化学习, 表示学习]\n---\n\n### 20. NeMo-DCR: Bit-Exact Delta-Compressed Refit for Scalable Agentic RL at Trillion-Parameter Scale (NeMo-DCR：万亿参数规模下可扩展代理强化学习的位精确增量压缩重构)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08430)\n- **研究任务**: 解决代理强化学习中训练与 rollout 分离导致的策略更新权重同步（重构）问题，特别是在万亿参数规模下传输完整检查点耗时过长的问题。\n- **核心亮点**: 提出NeMo-DCR（增量压缩重构），仅发送更改但保持位精确：接收者获得与密集重构相同的参数和缓冲区位。使用固定仿射映射将训练分片的更改投影到检查点的规范坐标中，可压缩的XOR掩码携带仿射更改，覆盖携带其他更改。接收者就地应用两者，重试覆盖部分写入，联合提交将策略绑定到基线。\n- **深度解析**: 摘要未提供具体数据集名称。研究在30B到1T模型上进行评估，指出即使在3%和5%的更改率下，NeMo-DCR的重构速度也比仅传输的完整检查点参考快12-40倍。在3%更改率下，1T中继树重构仅需150秒，而完整检查点需要87.5分钟。\n- **领域归类**: [分布式训练, 强化学习, 系统优化]\n---\n\n### 21. Rationale-Guided Policy Optimization: Learning to Reason with Adaptive Rationale Scaffolding (基于理由引导的策略优化：通过自适应理由脚手架学习推理)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07342)\n- **研究任务**: 解决在大型语言模型（LLM）的在策略强化学习中，由于奖励稀疏导致优化停滞的问题，从而提升模型的推理能力。\n- **核心亮点**: 提出 RGPO 框架，自适应地利用真实理由信息作为临时“脚手架”，帮助模型生成更好的响应，随后仅将高奖励的模型生成解决方案转移回无引导的原始设置中，无需离策略数据与 RL 任务格式一致。\n- **深度解析**: 摘要未提供具体实验数字，但指出在纯文本和视觉-语言推理设置中，RGPO 均一致优于 RLVR 基线，且消融实验证明自适应理由引导是性能提升的关键。\n- **领域归类**: [强化学习, 大语言模型, 推理能力, 多模态]\n---\n\n### 22. DiVeR: Decision-Critical Verifier Learning for VLA Test-Time Scaling (DiVeR：用于视觉-语言-动作模型测试时扩展的决策关键验证器学习)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04933)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在推理时通过验证器引导测试时扩展来选择最佳动作时，现有分类验证器平等对待所有状态而忽略“决策关键状态”的问题。\n- **核心亮点**: 提出 DiVeR，通过采样动作表示的分散度来估计决策关键性，并将验证器学习的权重重新分配到动作选择最具决定性的状态上，无需步级注释或额外的环境交互。\n- **深度解析**: 摘要未提供具体成功率提升数字，但指出在 LIBERO、RoboCasa 和 Franka Research 3 真实机器人实验中，DiVeR 一致提高了任务成功率，且增加的验证器推理开销可忽略不计。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 强化学习, 测试时扩展]\n---\n\n### 23. Sherpa: Teaching LLMs to Teach Adaptively (Sherpa：教导大语言模型进行自适应教学)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08778)\n- **研究任务**: 解决大语言模型能解决问题但不擅长教学的问题，特别是现有教学方法未基于学生实际学习结果进行优化的问题。\n- **核心亮点**: 提出 Sherpa，一个多轮强化学习框架。通过实例化具有不同学习偏好的多个学生原型，训练教师模型通过直接最大化学生的学习结果来自适应调整教学策略。\n- **深度解析**: 在 MathTutorBench 评估中，整体教学法得分从 52.5% 提升至 79.2%；人类研究表明，训练后的教师在 79.6% 的成对比较中优于基础模型；指导学生的表现平均提升了 20.5 个百分点。\n- **领域归类**: [大语言模型, 强化学习, 教育/辅导, 自适应教学]\n---\n\n### 24. Learning to Read the Contextual Tokens in Diffusion Transformers (学习读取扩散 Transformer 中的上下文 Token)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06844)\n- **研究任务**: 理解和解读多模态扩散 Transformer（MM-DiTs）在生成过程中通过多模态注意力反复更新文本 token 所形成的动态“上下文 token”的功能和内部表示。\n- **核心亮点**: 引入一个框架，通过训练轻量级瓶颈网络将中间上下文 token 映射到冻结 LLM 的输入空间，使 LLM 能直接回答关于生成图像的问题。发现上下文 token 编码了丰富的全局场景表示，并提出“上下文对齐”训练技术来提升生成质量。\n- **深度解析**: 摘要未提供具体的人类偏好得分或生成质量提升数字，但指出上下文 token 在去噪早期就能解码生成特定语义，且在空提示下也能积累图像特定信息；具有更高可读性上下文表示的生成往往获得更高的人类偏好得分。\n- **领域归类**: [多模态生成, 扩散模型, Transformer, 可解释性]\n---\n\n### 25. AdvSim2Real : Training Web Agents Against Adaptive Prompt Injection in a Web World Model (AdvSim2Real：在 Web 世界模型中训练 Web 智能体以对抗自适应提示注入)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08773)\n- **研究任务**: 解决 Web 智能体在面对第三方网页中植入的恶意指令（提示注入）时容易偏离用户目标的问题，特别是现有防御无法应对适应训练模型的攻击者的问题。\n- **核心亮点**: 提出 AdvSim2Real，在一个冻结的 Web 世界模型中共同进化任务课程、注入对手和智能体。课程因智能体解决约一半的任务而获得奖励，对手仅因成功翻转（将成功变为失败）而获得奖励。\n- **深度解析**: 在 150 个 Web 任务上，AdvSim2Real 使 4B 智能体在面对未见过的对手时，任务完成率相对于基础智能体相对提升了 33.6%。同时，能力增益可迁移到真实浏览器中。\n- **领域归类**: [Web 智能体, 安全与鲁棒性, 提示注入, 强化学习]\n---\n\n### 26. Understanding and Enhancing Backdoor Persistency in LLM Agent Post-Training (理解并增强大语言模型智能体后训练中的后门持久性)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07510)\n- **研究任务**: 研究供应链威胁，即攻击者提供的带有后门的模型在经过开发者的良性后训练（如 SFT 和 RL）后，后门行为是否能存活，并探索如何增强后门的持久性。\n- **核心亮点**: 发现良性 SFT 会大幅降低攻击成功率，但随后的 RL 通常会保留残余行为甚至增加攻击成功率。提出 PersistBD 方法，在发布前微调已植入后门的模型，通过利用初始后门强度和与良性训练的梯度兼容性来提高其在良性后训练中的持久性。\n- **深度解析**: 在 Qwen2.5-Coder-7B 上，PersistBD 将 SFT 后的攻击成功率从 20% 提升至 74%，SFT-RL 后从 20% 提升至 76%，同时保持相当的良性任务性能。\n- **领域归类**: [大语言模型智能体, 安全与后门, 供应链攻击, 后训练]\n---\n\n### 27. Hiding Tool Latency in On-Device Cascaded Voice Agent through Speculative Execution (通过推测执行隐藏端设备级联语音智能体中的工具延迟)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07641)\n- **研究任务**: 解决工具增强型语音助手中，由于 ASR、LLM 推理和外部工具执行串行化导致的工具延迟问题，降低端到端响应延迟。\n- **核心亮点**: 提出端设备级联语音智能体的推测工具执行方法。引入 Predictor 模块在语音识别期间预测工具调用并推测执行、缓存结果。结合基于规则的验证机制处理用户自我纠正，并保留 LLM 直接调用工具的能力作为兜底。\n- **深度解析**: 在完全实现的 Android 语音助手上的实时测量中，该方法将首次音频响应时间的中位数从 5.79s 降至 4.60s，标准差从 3.49s 降至 2.81s。\n- **领域归类**: [语音智能体, 端侧部署, 延迟优化, 推测执行]\n---\n\n### 28. Harness-Aware Distillation for Small Language Model Agents (面向小型语言模型智能体的感知 Harness 蒸馏)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02858)\n- **研究任务**: 解决在将带有 Harness（管理上下文、工具和反馈的软件）的语言模型智能体蒸馏为小型模型时，标准蒸馏方法盲目模仿教师完整输出而忽略 Harness 作用的问题。\n- **核心亮点**: 提出 Harness-Aware Distillation (HAD)，将蒸馏重点放在教师超越 Harness 所提供的能力上。结合动作偏好和有效性检查，无需任务奖励或成功标签。\n- **深度解析**: 摘要未提供具体的基准测试名称和性能提升数字，但指出在多个长期智能体基准和模型上，HAD 优于具有相同固定 Harness 的在策略蒸馏基线，且进入无效循环更少，从错误中恢复的频率更高。\n- **领域归类**: [模型蒸馏, 语言模型智能体, 强化学习/在策略学习]\n---\n\n### 29. HLA: Expressive Hybrid Linear Attention via Chunk-Wise Dynamic Mixing (HLA：通过分块动态混合实现的高表达力混合线性注意力)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05842)\n- **研究任务**: 解决线性注意力在长上下文自回归解码中，由于将历史压缩为循环状态而导致难以选择性访问稀疏和远距离信息的问题，以及现有分块扩展中混合系数固定无法适应查询内容的问题。\n- **核心亮点**: 提出混合线性注意力（HLA），一种用于 Gated DeltaNet 的依赖查询的分块级注意力机制。将每个完成的块表示为精确的仿射状态转移，并计算依赖内容的路由门，控制块的加性内存及其对早期状态的转换。\n- **深度解析**: 在 0.8B 到 9B 的 Qwen3.5 模型上，HLA 在 LongBench-V2 上最高提升 5.57 个百分点，在 RULER 上提升 3.97 个百分点。在 1.3B 从头训练设置中，RULER 性能在 32K 上下文时提升 4.22 个百分点。\n- **领域归类**: [注意力机制, 线性注意力, 长上下文建模, 模型架构]\n---\n\n### 30. Towards In-Parameter Memory Augmentation for Large Language Models (面向大语言模型的参数内记忆增强)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08630)\n- **研究任务**: 解决大语言模型及智能体在部署后需要整合新知识时，上下文学习消耗上下文容量且编码成本随长度增长的问题，探索参数内记忆作为补充。\n- **核心亮点**: 这是一篇综述，关注在部署时通过参数记忆增强 LLM 的方法。提出两个正交轴进行分类：参数放置（嵌入、注意力、FFN 层或混合）和参数获取时间（部署时在线获取与部署前离线获取）。\n- **深度解析**: 摘要未提供实验结果或数字，作为综述主要澄清了边界，进行了比较，并讨论了干扰、安全性、与 ICL 的协同设计以及递归自我改进等开放方向。\n- **领域归类**: [大语言模型, 记忆增强, 参数高效微调, 综述]\n---\n\n### 31. DistScene: Object-to-Scene Distillation for 3D Scene Generation (DistScene：面向3D场景生成的物体到场景蒸馏)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06960)\n- **研究任务**: 单图像组合式3D场景生成。\n- **核心亮点**: 提出DistScene框架，将环境作为显式场景组件进行联合建模，通过物体到场景蒸馏技术提升场景级的空间连贯性。\n- **深度解析**: 摘要未提供（注：摘要仅提及了场景帧生成、以物体为中心的细化及物体到场景蒸馏三个模块的名称与宏观作用，未提供具体的网络结构或深层技术原理细节）。\n- **领域归类**: [计算机视觉, 3D场景生成]\n---\n\n### 32. DAEDALUS: Bootstrapping Agent Memory from Self-Generated Tasks (DAEDALUS：通过自生成任务引导智能体记忆)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08048)\n- **研究任务**: 解决LLM智能体在新环境中缺乏操作知识、重复犯错的问题，构建可复用的智能体记忆。\n- **核心亮点**: 提出DAEDALUS方法，无需现有任务或预言机验证器，通过智能体自生成的练习来引导和构建可复用的记忆库。\n- **深度解析**: 该方法配对探索者和解决者两个智能体，探索者生成任务，解决者尝试。系统从解决者的失败中推导启发式规则，并在解决者反复成功后才接受该规则，最终将接受的规则合并为记忆库。摘要未提供其他深度解析细节。\n- **领域归类**: [自然语言处理, 智能体与记忆]\n---\n\n### 33. Accent Analogy Guidance: More Speaker Similarity at Equal Accent in Cross-Lingual Voice Cloning (口音类比引导：跨语言语音克隆中同等口音下提升说话人相似度)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29123)\n- **研究任务**: 解决跨语言零样本文本到语音（TTS）生成中的口音泄漏问题。\n- **核心亮点**: 提出口音类比引导（AAG），一种无需训练的采样器项，通过减去估计的口音方向来消除口音泄漏，在保持同等口音的前提下提高说话人相似度。\n- **深度解析**: AAG从模型对同一合成语音在两种语言下的预测中估计口音方向并将其减去。通过盲测LLM口音评判，该方法在身份-口音权衡曲线上实现了更高的说话人相似度。摘要未提供其他深度解析细节。\n- **领域归类**: [语音处理, 文本到语音/语音克隆]\n---\n\n### 34. Attacca: Goal-Directed Control under State Continuity for Long-Horizon Embodied Agents (Attacca：状态连续性下长视域具身智能体的目标导向控制)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07785)\n- **研究任务**: 解决具身智能体在连续长视域任务执行中，由于状态改变和目标不在视野内导致的视觉目标条件策略失效问题。\n- **核心亮点**: 提出Attacca方法，使用与执行环境解耦的目标图像，在完整的搜索到交互轨迹上训练视觉目标条件策略。\n- **深度解析**: 采用上下文解耦的目标采样，将演示与来自另一个世界的类兼容掩码目标图像配对。通过学习密集当前视图接地的目标掩码预测头提供辅助监督，并引入行为阶段条件以区分搜索、接近和交互阶段。摘要未提供其他深度解析细节。\n- **领域归类**: [机器人学/具身智能, 长视域任务控制]\n---\n\n### 35. Personal-Agent Mediated Recommendation with Cross-Platform User History (基于跨平台用户历史的个人智能体中介推荐)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07588)\n- **研究任务**: 研究在用户主导的个性化范式中，个人LLM智能体如何利用跨平台历史来中介和重排平台推荐结果。\n- **核心亮点**: 形式化了个人智能体中介推荐范式，提出MediateRec基准和PAMO优化方法，以平衡有益救援和有害覆盖。\n- **深度解析**: PAMO通过反事实掩码跨平台历史来估计个人中介支持，并在平台相对价值下限的约束下，重新分配排名感知的优势质量。摘要未提供其他深度解析细节。\n- **领域归类**: [推荐系统, 智能体中介推荐]\n---\n\n### 36. VeriFine: Scaling Verification for Self-Improvement in Embodied Reasoning (VeriFine：具身推理中通过扩展验证实现自我改进)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08761)\n- **研究任务**: 解决具身推理中固定评判者限制策略自我改进的问题，实现策略、训练课程和评判者的共同进化。\n- **核心亮点**: 提出VeriFine智能体利用框架，通过策略改进循环和评判者改进循环，扩展验证能力以支持持续自我改进。\n- **深度解析**: 策略改进循环使用规则评判者诊断失败并构建自适应课程。当验证成为瓶颈时，评判者改进循环选择性查询人类指导，并通过协同校准（人类与智能体解决分歧）来细化评判者。摘要未提供其他深度解析细节。\n- **领域归类**: [具身智能/强化学习, 具身推理与验证]\n---\n\n### 37. World Models' Last Exam in Physics (世界模型的物理终极考试)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08791)\n- **研究任务**: 评估视频世界模型在物理一致性方面的表现。\n- **核心亮点**: 提出“世界模型的物理终极考试”基准，包含40个受控任务，通过基于测量的评估器测试可观察的物理关系，无需参考视频。\n- **深度解析**: 任务涵盖力学、光学、流体、热和相变、电磁学及表面张力。评估器结合了任务可观察性筛选和特定任务的定量物理测量。摘要未提供其他深度解析细节。\n- **领域归类**: [计算机视觉/视频生成, 物理一致性评估]\n---\n\n### 38. Building Rome from a Single Image (从单张图像构建罗马)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08790)\n- **研究任务**: 从单张图像生成完整的3D场景网格，包括相机未观察到的表面，涵盖室内和室外场景。\n- **核心亮点**: 重新设计以物体为中心的生成器（如Trellis 2），使其适用于室内外场景，同时保留其形状先验。\n- **深度解析**: 将场景划分为相对于相机距离缩放的自适应块（近处小块保留细节，远处大块覆盖建筑）；使生成器通过提升图像特征捕获显式的2D-3D对应关系；合成约4000个室外场景以扩展训练数据。摘要未提供其他深度解析细节。\n- **领域归类**: [计算机视觉, 3D场景生成]\n---\n\n### 39. ALIVE: Interaction-Aligned Object Insertion for First-Frame-Guided Video Editing (ALIVE：面向首帧引导视频编辑的交互对齐物体插入)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08779)\n- **研究任务**: 解决视频编辑中插入的物体难以与源视频内容进行连贯交互（如被拿起或操作）的问题。\n- **核心亮点**: 提出ALIVE框架，利用编辑后的首帧和仅命名添加物体的指令，使插入的物体通过连贯交互“活”起来。\n- **深度解析**: 策划了35800个编辑对，训练视觉语言模型（VLM）从相同输入预测交互引导。引入ALIVE-interaction基准评估交互保真度、源保留和视觉连贯性。摘要未提供其他深度解析细节。\n- **领域归类**: [计算机视觉/视频编辑, 视频物体插入]\n---\n\n### 40. Harness Engineering for Software Engineering via Modular Executable Dev-Primitives (通过模块化可执行开发原语实现软件工程的驾驭工程)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07832)\n- **研究任务**: 解决配备终端访问的LLM在长视域软件工程工作流中因上下文爆炸和语义漂移导致的脆弱性问题。\n- **核心亮点**: 提出开发原语（Dev-Primitives）和HERMES框架，将仓库组件从被动软件工件转化为具有智能体原生接口的主动参与者。\n- **深度解析**: 每个开发原语将仓库工件与驻留LLM配对，支持自然语言推理和局部自修改。HERMES通过依赖感知的动态激活机制和错误诊断机制在仓库规模上实例化这些原语。摘要未提供其他深度解析细节。\n- **领域归类**: [软件工程/自然语言处理, LLM智能体]\n\n### 41. HiPLEX: Hierarchical Policy Factorization for Full Duplex Speech Language Models (HiPLEX：用于全双工语音语言模型的层次化策略分解)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07727)\n- **研究任务**: 优化全双工语音语言模型在实时对话中的轮流、反馈和发言权管理等交互行为。\n- **核心亮点**: 提出 HiPLEX 强化学习框架，将全双工文本策略分解为控制策略（决定何时发声）和条件内容策略（决定发声内容），实现了交互时机与语义内容的联合优化。\n- **深度解析**: 该框架利用事件因果掩码将时间优势路由至控制策略因子，并通过 LLM-judge 将语义优势路由至条件内容策略因子。这种层次化分解有效解决了现有强化学习方法无法同时优化对话时机与生成内容的难题，在降低接管率和缩短中断响应延迟方面表现优异。\n- **领域归类**: [语音处理, 强化学习, 自然语言处理]\n---\n\n### 42. Learning Functional Subspaces for Neural Network Compression (学习功能性子空间以实现神经网络压缩)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40127)\n- **研究任务**: 通过低秩权重分解对 Transformer 和大语言模型进行高效压缩，同时保持密集矩阵在标准硬件上的计算效率。\n- **核心亮点**: 提出可学习子空间投影（LSP），在冻结预训练权重的情况下，端到端联合优化正交投影器以丢弃冗余子空间，大幅提升了高压缩率下的模型性能。\n- **深度解析**: 现有方法使用局部闭式标准选择子空间，忽略了误差在网络中的传播。LSP 通过全局目标（如 KL 散度）联合优化投影器，并在注意力机制中缓存共享的窄潜在向量，从而在极高压缩率下有效抑制了误差累积，并显著降低了权重与 KV 缓存的综合内存占用。\n- **领域归类**: [模型压缩, 深度学习, 大语言模型]\n---\n\n### 43. OPD Before RL: Warm-Starting Rubric-Based RL with On-Policy Distillation (RL 之前的 OPD：使用同策略蒸馏预热基于评分标准的强化学习)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02781)\n- **研究任务**: 优化无法通过精确结果验证的开放式语言模型任务，解决基于评分标准（rubric）的强化学习中奖励信号难以归因到单个 token 的问题。\n- **核心亮点**: 提出两阶段训练框架，先使用基于评分标准的同策略蒸馏（RP-OPD）进行密集的 token 级监督预热，再进行基于评分标准的 RL 优化，有效缓解了奖励黑客问题。\n- **深度解析**: 由于基于评分标准的 RL 奖励在完整响应后才分配，无法直接指导单个决策。RP-OPD 阶段让无评分标准上下文的学生模型匹配有评分标准上下文的教师模型的下一 token 分布，为 RL 提供了高质量的初始化，减少了模型为迎合评分标准而生成虚假内容的“奖励黑客”行为。\n- **领域归类**: [强化学习, 自然语言处理, 模型对齐]\n---\n\n### 44. Multilinguality in Hybrid Attention LLMs (混合注意力大语言模型中的多语言能力)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35378)\n- **研究任务**: 研究混合注意力机制（结合全注意力和循环注意力）对大语言模型多语言处理能力的影响。\n- **核心亮点**: 发现混合注意力模型中跨语言表示的发展与层顺序密切相关，并证明将全注意力层置于网络前端能显著提升多语言模型的学习速度和性能。\n- **深度解析**: 可解释性分析表明，循环状态的归纳偏置会改变语言处理模式，跨语言对齐在第一个全注意力层附近出现显著峰值。蒸馏实验证实，打破常规的层顺序（以全注意力层开头替代循环层开头）可使多语言模型的学习速度提升高达 2.5 倍。\n- **领域归类**: [自然语言处理, 模型架构, 多语言处理]\n---\n\n### 45. Do Language Models Need a Trainable Input Embedding Table? Fixed Minimal Token Codes at 1.7B-Class Scale (语言模型需要可训练的输入嵌入表吗？在 1.7B 规模下固定最小化 token 编码)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04002)\n- **研究任务**: 探究大语言模型是否必须依赖可训练的输入嵌入表（Input Embedding Table）来获取语言建模能力。\n- **核心亮点**: 证明在 1.7B 参数规模下，使用固定的 token 身份编码（如标准 16 位 ID 或固定可逆重编码）替代可训练嵌入表，模型依然能学习到实质性的语言能力，并减少了 1.007 亿参数。\n- **深度解析**: 通过控制变量的从头训练实验，研究表明独立可训练的 token 特定输入向量并非架构上的绝对必需品。共享 Transformer 骨干网络足以从固定的 token 标识中学习，这区分了架构必要性与经验效用，并为研究不可变输入下游的表示学习提供了受控环境。\n- **领域归类**: [自然语言处理, 模型架构, 表示学习]\n---\n\n### 46. Learning Discriminative Geometry for Drifting Models (为漂移模型学习判别几何)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04703)\n- **研究任务**: 优化漂移模型（Drifting Models）在复杂图像数据集上的单步生成性能，解决像素空间表示效果不佳的问题。\n- **核心亮点**: 提出持续表示学习（persistent representation learning），在生成器训练过程中动态学习更具判别性的表示几何，无需预训练编码器即可将像素空间漂移模型的 FID 降低 82-95%。\n- **深度解析**: 研究指出漂移模型对表示空间的依赖源于其判别几何结构对核密度估计（KDE）样本权重的影响。通过建立 KDE 比率损失与漂移回归损失之间的梯度等价性，该方法实现了对漂移速度的直接控制，从而在单步生成中大幅提升了图像质量。\n- **领域归类**: [计算机视觉, 图像生成, 表示学习]\n---\n\n### 47. JLD: Perceptual Distance Through A Jacobian Lens (JLD：通过雅可比透镜衡量感知距离)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05967)\n- **研究任务**: 提出一种鲁棒且高效的图像与视频感知距离度量方法，解决现有方法对分辨率敏感或依赖人类主观标签的问题。\n- **核心亮点**: 提出雅可比透镜距离（JLD），利用冻结视觉编码器的雅可比矩阵构建感知度量张量，仅需少量无标签图像即可拟合，在多个感知数据库中达到 SOTA，且对分辨率变化具有极强的鲁棒性。\n- **深度解析**: JLD 结合了早期 patch 特征的局部性与后期编码器表示的感知敏感性，通过编码器雅可比矩阵识别早期特征空间中强烈影响输出的方向，生成固定的度量张量。这种拉回度量赋予了 JLD 清晰的几何解释，使其摆脱了对人类标签的依赖，并成功克服了传统指标在分辨率翻倍时相关性下降的痛点。\n- **领域归类**: [计算机视觉, 图像质量评估, 感知度量]\n---\n\n### 48. Judged Useless, Queried Anyway: Tool-Using Agents Rarely Turn Their Own Evidence Judgments into Stopping Decisions (判定无用却依然查询：工具使用型智能体极少将自身的证据判断转化为停止决策)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06191)\n- **研究任务**: 研究工具使用型智能体在检索任务中，对其工具返回结果的“无用判断”与“实际停止决策”之间的脱节现象。\n- **核心亮点**: 发现智能体虽然能高准确率（97-100%）识别工具返回的无用结果，但极少据此停止查询；提出通过外部执行框架强制集成判断结果，可有效提升任务成功率并规范停止行为。\n- **深度解析**: 研究表明，智能体在“认知”与“行动”上存在严重割裂。提示词中的预算、规则或推理模式等线索只能改变停止的时机，无法改变停止的依据。只有当外部框架（harness）强制执行“连续 5 次判断无用即停止”的集成步骤时，智能体的停止决策才能真正遵循证据，从而提升整体成功率。\n- **领域归类**: [智能体 (Agents), 自然语言处理, 检索增强生成]\n---\n\n### 49. Stepped MoE: Segment-Level Routing with Configurable Inference Complexity (Stepped MoE：具有可配置推理复杂度的段级路由)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07348)\n- **研究任务**: 设计一种统一框架，使大语言模型能够同时适应不同的部署计算约束（弹性架构）和任务需求（稀疏激活）。\n- **核心亮点**: 提出 Stepped MoE，结合弹性嵌套子网络与稀疏门控机制，实现推理时计算复杂度的可配置。单个模型可灵活切换 1B 至 4B 参数规模，在保持低延迟的同时超越同等规模的密集模型。\n- **深度解析**: 该方法通过段级路由让模型根据上下文和目标效率规格进行条件化，在弹性嵌套子网络中激活任务相关参数。这不仅允许单个模型跨越多个容量点并共享参数以节省端侧磁盘空间，还能根据设备的 DRAM 和计算能力灵活调整推理时的参数量，实现精度与效率的细粒度权衡。\n- **领域归类**: [模型架构, 大语言模型, 混合专家模型 (MoE)]\n---\n\n### 50. A Safe Action Is Not Enough: Feasible-Future Decoding for Vision-Language-Action Policies (安全的动作是不够的：面向视觉-语言-动作策略的可行未来解码)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05166)\n- **研究任务**: 解决视觉-语言-动作（VLA）策略在生成安全动作时，可能忽略未来动作可行性（即“安全但不可行”）的问题。\n- **核心亮点**: 提出可行未来解码方法和无训练重排序器 VICS-G，通过评估动作对未来安全完成任务的贡献来重新排序候选动作，在不重训策略的情况下显著降低安全成本。\n- **深度解析**: 研究指出冻结的 VLA 策略可能偏好局部允许的动作，却留下无法安全完成任务的未来路径（可行性-可能性差距）。通过推导历史条件策略-环境轨迹定律的精确边缘分布，量化了候选动作的“可行未来质量”。VICS-G 作为一种即插即用的解码干预，有效弥合了似然排名与可行性之间的差距。\n- **领域归类**: [具身智能, 强化学习, 计算机视觉]\n---\n\n### 51. MEND: RL For Flow Models via Proximal Velocity Matching (MEND：基于近端速度匹配的流模型强化学习)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.05954)\n- **研究任务**: 流模型（Flow models）的奖励后训练（Reward post-training）。\n- **核心亮点**: 提出MEND方法，基于近端速度匹配。在每个提示组内对奖励进行封顶，对表现好的样本不进行移动；在封顶之下，沿奖励梯度提出移动，仅当封顶奖励增益超过二次位移代价时才接受。模型回归到速度目标，无需KL项、冻结参考模型或优势权重。\n- **深度解析**: 传统的流模型奖励后训练通常需要数千次更新来重新加权样本或反向传播奖励。MEND通过限制奖励和引入二次位移代价，避免了不必要的移动。在100次更新中，MEND在六个评估器中的五个上超越了需要约4000次更新的Flow-GRPO。在同等预算下，它在四种训练奖励的每次评估更新中都超越了ReFL和DiffusionNFT（例如PickScore达到24.03，而ReFL和DiffusionNFT分别为23.92和23.43）。300次更新的三奖励运行也超越了五奖励的DiffusionNFT模型。MEND通用且易于采用，适用于任何具有可微奖励的流骨干网络。\n- **领域归类**: [计算机视觉, 生成模型, 强化学习]\n---\n\n### 52. Sensor-Language-Action Models (传感器-语言-动作模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08244)\n- **研究任务**: 将多模态传感器观测、自然语言和动作统一在一个模型中，用于感知、理解和决策。\n- **核心亮点**: 提出传感器-语言-动作（SLA）建模框架，使用语言作为感知和动作之间的语义接口。构建了包含超过11.6万个个体、79种传感器模态和60个动作组的大规模SLA基准。提出OpenSLA模型，用于分层动作预测、状态理解和动作解释。\n- **深度解析**: 现有的传感器模型大多停留在感知层面，动作建模往往是分离的。SLA框架通过语言将异构动作的表示、预测和解释统一起来，并扎根于底层传感器证据。OpenSLA在临床预测、手术室和代谢健康等真实世界任务中表现出优于最先进方法的性能，并展示了语言引导的证据扎根以及对未见动作和群体的零样本泛化能力。\n- **领域归类**: [多模态, 传感器网络, 具身智能]\n---\n\n### 53. CheckerBench: Can Long-Horizon Agents Synthesize Static-Analysis Checkers? (CheckerBench：长程智能体能合成静态分析检查器吗？)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07557)\n- **研究任务**: 评估代码智能体从头开始开发静态分析检查器的能力。\n- **核心亮点**: 引入CheckerBench，一个包含300个任务的可执行基准，源自167个代码库中的297个CVE、85个CWE和5种语言生态系统。引入CheckerLab评估框架，独立重建提交的检查器并测量诊断对比、补丁定位、误报和工具使用。\n- **深度解析**: 现有的代码智能体基准主要关注补丁生成或漏洞检测，很少评估智能体是否能从头开发可用的检查器。CheckerBench要求智能体解释缺陷规范、检查代码库、实现特定于分析器的逻辑，并通过重复编译和分析反馈来优化检查器。在21种模型-工具配置和每种配置3次独立重复中，平均Pass@1为32.30%，最高达到45.33%，表明可靠、可重用的检查器开发对当前代码智能体仍具挑战性。\n- **领域归类**: [软件工程, 代码生成, 智能体评估]\n---\n\n### 54. Kinematic MeanFlow: One-Step Action Generation Policy for Robotic Foundation Models (运动学MeanFlow：机器人基础模型的一步动作生成策略)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00864)\n- **研究任务**: 在机器人基础模型（RFMs）中实现一步动作生成，以克服多步流匹配的高推理延迟。\n- **核心亮点**: 提出运动学MeanFlow（K-MF），一种专为RFM定制的一步动作策略。基于运动学恒等式，将MeanFlow公式中的时间导数项解耦为两个由中间点分隔的子区间项，分别捕获早期和晚期去噪动态。\n- **深度解析**: 直接将MeanFlow应用于RFM会导致性能崩溃，原因在于RFM速度场中的“局部加速度”在去噪末期急剧上升，且样本间的幅度差异随去噪进行而扩大。K-MF通过解耦时间导数项，缓解了过程中的误差放大。K-MF使RFM在从零训练和微调范式中均能实现一步动作生成，并在大多数设置中优于多步流匹配。在推理效率方面，K-MF在L40和Jetson Orin上使GR00T-N1.6的动作头延迟降低了67.5%~74.4%，端到端延迟降低了30.3%~54.9%。\n- **领域归类**: [机器人学, 基础模型, 动作生成]\n---\n\n### 55. Cross-Lingual Alignment for Decoder-Only Models using MoE Routers (使用MoE路由器的仅解码器模型跨语言对齐)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.01921)\n- **研究任务**: 在仅解码器的大型语言模型（LLMs）中实现跨语言表示对齐，以提升跨语言迁移能力。\n- **核心亮点**: 提出使用混合专家模型（MoE）路由器的输出作为跨语言对比学习的对齐目标，而不是在隐藏状态上应用辅助对齐损失。\n- **深度解析**: 由于多语言分词的不同，仅解码器的LLM难以显式对齐表示。MoE路由器的输出更适合在许多token上进行池化，从而在序列级别实现更可靠的跨语言比较。在四个开源MoE模型上的受控持续预训练实验表明，结合这种路由损失不仅对齐了底层的跨语言隐藏表示，还显著提升了在多样化评估套件上的多语言性能。\n- **领域归类**: [自然语言处理, 大语言模型, 跨语言学习]\n---\n\n### 56. S2PD: Serial-to-Parallel Diffusion for Physically and Logically Consistent Video Generation (S2PD：用于物理和逻辑一致视频生成的串行到并行扩散)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06847)\n- **研究任务**: 解决双向视频扩散模型在生成视频时违反物理定律和简单符号规则的问题，提高物理和逻辑一致性。\n- **核心亮点**: 提出串行到并行扩散（S2PD），在高噪声下执行自回归扩散，在低噪声下切换为并行扩散。自回归阶段提供串行计算以协调相互依赖的事件并产生有效的状态转换，并行阶段联合细化整个视频并减少采样时间。\n- **深度解析**: 双向视频扩散模型在并行去噪整个视频时，即使使用无限分布内数据训练，仍会违反物理规则。S2PD结合了两种架构：从头训练的像素空间扩散Transformer和通过因果注意力LoRA微调的预训练视频模型。在游戏、物理模拟和真实视频中，S2PD比匹配的双向基线更可靠地遵循规则，并比其他串行方法生成具有更高时间稳定性和采样效率的视频。\n- **领域归类**: [计算机视觉, 视频生成, 扩散模型]\n---\n\n### 57. Conditional Trajectory Peaks: Single-Pass Multimodal Policies over Action Chunks (条件轨迹峰值：动作块上的单次通过多模态策略)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06104)\n- **研究任务**: 在多模态模仿学习中，在相同观测下生成多样的可执行未来，并在重规划周期中保持一致的行为。\n- **核心亮点**: 提出条件轨迹峰值（CTP），一种单次通过策略框架，联合预测完整的动作块候选、概率质量和轨迹尺度。包含分布感知峰值特化（DAPS）和证据门控轨迹信念传输（ETBT）机制。\n- **深度解析**: CTP通过轨迹级后验责任以及质量和尺度调制的重叠约束来特化轨迹峰值。ETBT通过可交换候选集之间的几何对应关系保持跨块一致性，同时允许当前策略证据覆盖历史约束。在Push-T上覆盖率达到91.40%；在D3IL的三个任务上成功率分别为100.0%、79.72%和84.44%；在LIBERO上平均成功率为97.25%。在真实世界双臂实验中，CTP在双盘任务中保留了两种放置模式，50次试验全部成功。在瓶子直立和笔放置任务中，保持与π_{0.5}相当的成功率，同时将策略推理延迟从218.24 ms降低到75.80 ms。\n- **领域归类**: [机器人学, 模仿学习, 强化学习]\n---\n\n### 58. Execution-Aligned Progressive Noise for Consistent Asynchronous Replanning in Generative Robot Policies (执行对齐渐进噪声：用于生成式机器人策略中一致异步重规划)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06090)\n- **研究任务**: 解决实时生成式机器人策略在连续异步重规划中，由于独立随机初始化导致的模式切换和动作块间延续不一致的问题。\n- **核心亮点**: 提出执行对齐渐进噪声（EAPN），在块间和块内级别引入结构化随机性。跨重规划步骤传播共享噪声轨迹，并将其与实际执行位移对齐，建立执行对齐的块间相关性。\n- **深度解析**: EAPN在每个动作块内沿动作时间建模时间相关性。对齐的随机历史与提交的动作上下文结合，以条件化后续生成，使新块从执行一致的生成状态继续，而不是从独立噪声重新开始。在D3IL、Kinetix、LIBERO和真实世界操作任务上评估，EAPN提高了D3IL上的多模态行为一致性，在Kinetix上平均成功率达到88.59%。在LIBERO上，即使在长推理延迟下也保持鲁棒。真实机器人实验中，对象存储成功率达90.0%，双臂布料折叠达96.7%。\n- **领域归类**: [机器人学, 动作规划, 生成模型]\n---\n\n### 59. Toward Real-Time VLAs: Stage-Aware Two-Step Flow Denoising and System-Level Evaluation (迈向实时VLA：阶段感知的两步流去噪与系统级评估)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39822)\n- **研究任务**: 解决视觉-语言-动作（VLA）模型在低推理率和高执行率机器人之间的时序差距，实现实时控制。\n- **核心亮点**: 提出阶段感知的两步非均匀去噪，将步数从10步减少到2步，模型推理时间从61.557 ms减少到21.956 ms。开发分布式实时VLA框架，具有独立的推理、动作发布和机器人控制率。\n- **深度解析**: 论文通过端到端延迟测量分析了推理和执行链的差距，发现重复的流匹配去噪是推理成本的主要来源，而机器人侧延迟主要来自感知获取、通信调度和物理响应。速度场分析显示早期积分阶段幅度和方向相对稳定，终端步骤附近方向校正较强。使用π0.5作为基线，在长程物理衣物折叠任务上评估了六种实时执行方法。Legato在基于训练的方法中表现最好，Temporal Smoothing在无训练方法中领先。结合两步去噪与代表性执行方法可大幅降低推理成本，且任务性能仅有小幅下降。\n- **领域归类**: [机器人学, 视觉语言动作模型, 实时系统]\n---\n\n### 60. Magic-W0: A Structured World-Action Foundation Model for Physical Intelligence (Magic-W0：用于物理智能的结构化世界-动作基础模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39870)\n- **研究任务**: 构建结合动作条件环境动力学的世界-动作模型（WAMs），以增强机器人策略，解决现有方法缺乏与动作生成紧密耦合的结构化、面向控制的世界表示的问题。\n- **核心亮点**: 提出Magic-W0，联合建模结构化物理状态演变和连续动作。将交互表示为结构化世界转换（当前状态、转换、未来状态）。提出层对齐的世界-动作交互架构，使演变中的动作假设条件化世界转换预测，同时预测的世界表示持续为动作生成提供信息。\n- **深度解析**: 当前状态结合视觉语言上下文与当前3D几何；转换由捕获动作引起的三维变化的3D运动表示；未来状态由描述任务相关结果的未来语义表示。Magic-W0在大规模自我中心人类操作、UMI、真实机器人和模拟数据上预训练。推理时干预表明，结构化世界表示对候选动作的变化做出系统性响应。在RoboDojo-Sim上平均得分达到27.10，为对比WAMs中最高。在多个真实机器人任务中，使用有限下游数据微调后展现出强大的下游性能，支持泛化和快速适应。\n- **领域归类**: [机器人学, 基础模型, 具身智能]\n---\n\n### 61. WildMatch: Weakly Supervised Image Matcher Adaptation for Wildlife Re-Identification (WildMatch：用于野生动物重识别的弱监督图像匹配器自适应)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.07384)\n- **研究任务**: 野生动物个体重识别（从相机陷阱图像中识别特定动物个体，属于实例检索问题）。\n- **核心亮点**: 提出一种弱监督自适应方法，仅使用个体身份标签（无需关键点或几何对应关系的真实标签）微调预训练的关键点匹配器。\n- **深度解析**: 现有方法要么需要大量标注图像学习全局嵌入，要么直接使用通用图像匹配器但难以适应缺乏对应级别标注的小型野生动物数据集。WildMatch 利用预训练匹配器挖掘图像对，通过身份一致性推导弱正负监督信号，对比微调匹配网络以增强同身份对的对应关系并抑制不同身份对的对应关系。该方法在开源数据集上优于现成匹配器和局部-全局融合方法，并在开放世界协议下学习到可迁移的对应先验，而非死记硬背训练身份。\n- **领域归类**: [计算机视觉, 弱监督学习, 图像匹配, 野生动物监测]\n---\n\n### 62. Source Identification Is Not Fitness Testing: Measuring the Limits of Synthetic-Data Attribution (来源识别并非适应度测试：衡量合成数据归因的局限性)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00417)\n- **研究任务**: 评估在重复使用模型生成数据进行训练时，数据溯源（来源识别）的可靠性及其对选择更好训练数据的帮助。\n- **核心亮点**: 揭示了“识别数据来源”和“识别哪些数据对训练有用”是两个独立的问题。在金融风控文本上，生成器归因在原始段落准确率达98.7%，但在释义和风格重写后大幅下降。\n- **深度解析**: 重复在模型生成的数据上训练会导致后续模型性能下降。一种可能的应对策略是利用数据溯源来决定重用哪些生成的样本。研究测试了溯源恢复的可靠性以及它是否有助于识别更好的训练数据。实验表明，虽然生成与人类检测在测试集上接近完美，但溯源在文本改写后准确率骤降。此外，比较了基于来源信息和基于参考模型分数的两种选择生成样本的方法，发现它们选择了不同的样本，但并未检测到 resulting 模型退化程度的稳定差异。这表明溯源分数或面向标准的代理指标不足以预测未来的递归训练行为。\n- **领域归类**: [自然语言处理, 模型训练, 数据质量, 合成数据]\n---\n\n### 63. CtrlCache: Accelerating Interactive Video World Models with Control-Aware Caching (CtrlCache：通过控制感知缓存加速交互式视频世界模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.08777)\n- **研究任务**: 加速交互式视频世界模型的视频块生成，同时保持对用户控制的忠实响应。\n- **核心亮点**: 提出 CtrlCache，一种无需训练的控制感知缓存框架。利用控制信号（在去噪前到达）制定调度策略，根据动作变化将块标记为初始、过渡、转向或稳态，并自适应计算。\n- **深度解析**: 交互式视频世界模型通常使用分块自回归生成和少步去噪，但每个块仍需多次昂贵的去噪迭代。现有的免训练缓存策略主要依赖模型内部去噪动态，未显式考虑控制转换。CtrlCache 发现相邻块的结构相似性在动作变化时下降，且低频结构比高频细节更持久。因此，它通过动作感知调度检测动作变化，对初始和过渡块保留完整计算，对转向和稳态块复用最近完全计算步的 transformer 残差。此外，引入频率混合历史先验引导，利用前一个干净潜变量的互补信息。在 Matrix-Game 2.0 和 LingBot-World v1/v2 上，CtrlCache 实现了 1.21x 到 1.41x 的 DiT 骨干加速，并提高了 WBench 总体得分。\n- **领域归类**: [计算机视觉, 视频生成, 世界模型, 推理加速]\n---\n\n### 64. ConEx: Human-Interpretable Saliency Maps via Concept-Aware Attribution (ConEx：通过概念感知归因实现人类可解释的显著性图)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.04605)\n- **研究任务**: 提高计算机视觉中视觉解释方法的可解释性和可信度，将低级像素显著性与具有语义意义的概念联系起来。\n- **核心亮点**: 提出 ConEx 框架，自动发现特定类别的概念并通过概念激活向量（CAVs）表示，无需手动监督。生成忠实的显著性图，揭示概念在图像中的位置及其对预测的贡献。\n- **深度解析**: 许多视觉解释方法虽然能突出像素重要性，但难以将这些低级线索与语义概念联系起来。ConEx 使用特定于架构的掩码机制来减少分割掩码引入的噪声，从而提高概念纯度，无需手动监督即可学习 CAVs。为了评估学习概念的可靠性，提出了向量-概念匹配（VCM）和概念-类别匹配（CCM）两个互补指标。实验表明，ConEx 在忠实度、分割和概念质量基准上达到了最先进的性能，推动了视觉模型向真正可解释和基于概念的解释迈进。\n- **领域归类**: [计算机视觉, 可解释性AI, 显著性图, 概念学习]\n---\n\n### 65. DMAD: Distribution Matching as Adversarial Distillation for Fast Visual Generation (DMAD：将分布匹配作为对抗蒸馏以实现快速视觉生成)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.02188)\n- **研究任务**: 加速视觉生成模型（如图像、视频、音视频联合生成）的少步生成，解决分布匹配蒸馏（DMD）中辅助扩散模型带来的额外内存和计算成本问题。\n- **核心亮点**: 提出 DMAD，将分布匹配重新表述为分类问题，直接学习所需的对数密度比。通过在共享主干上添加两个判别器头来区分真实数据和教师样本，无需辅助得分拟合即可训练学生模型。\n- **深度解析**: 传统的 DMD 需要保持一个拟合学生分布演变的辅助扩散模型，成本高昂。DMAD 利用判别器对数与对数密度比之间的经典恒等式，证明在判别器最优时，其线性损失能恢复 DMD 的分布匹配梯度。此外，引入基于差距的重加权，根据真实数据头的经验对数差距自适应调整不同噪声级别的教师监督。实验结果显示，DMAD 在 ImageNet-64x64 上单步生成 FID 达到 1.04，在 COCO-10K 上四步 SDXL FID 为 14.47，在 Wan2.1-T2V-14B 上四步 VBench 总分 85.15。在 MiniMax-H3-33B 上，四步学生在联合音视频生成中的人类偏好率分别比 DMD2 和 rCM 高出 79.1% 和 84.6%。\n- **领域归类**: [计算机视觉, 生成模型, 知识蒸馏, 扩散模型]\n---\n\n### 66. DeCoPrune: Efficient KV-Cache Pruning for Autoregressive Video Diffusion via Denoising Consistency (DeCoPrune：通过去噪一致性实现自回归视频扩散的高效 KV 缓存剪枝)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39096)\n- **研究任务**: 解决自回归视频扩散模型中 KV 缓存随生成历史不断增长的问题，实现高效的缓存压缩以支持流式生成和交互控制。\n- **核心亮点**: 提出 DeCoPrune，一种无需训练的方法，将缓存压缩视为去噪一致性问题。利用去噪难度（中间干净预测与最终去噪值之间的差异）作为 token 长期保留价值的代理指标。\n- **深度解析**: 现有的压缩策略通常使用固定窗口丢弃历史或通过局部注意力和相似度信号选择 token，未能直接衡量当前块是否提供了超出保留上下文的信息。DeCoPrune 发现去噪难度较大的 token 往往携带从保留上下文中较难预测的视觉证据。因此，它保留高差异 token，剪枝低差异 token。为了评估信息保留，引入了 CMBench（包含58个约一分钟的上下文片段和116个需要回忆特定对象或场景的续写任务）。在 LingBot World v2 上的实验表明，DeCoPrune 在剪枝超过 85% 历史 KV token 并将续写生成加速 4 倍以上的同时，保持了接近完整 KV 的长程召回率，显著优于基线方法。\n- **领域归类**: [计算机视觉, 视频生成, 扩散模型, 推理加速]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [allenai/olmocr](https://github.com/allenai/olmocr)\n- **今日趋势**: 19,723 stars / 1,645 forks / 今日新增 22 stars\n- **项目简介**: 用于将PDF线性化以构建大语言模型数据集和训练的工具包。\n- **核心价值**: \n  - **项目用途**: 将PDF文档进行线性化处理，转化为适合大语言模型训练的数据集格式。\n  - **目标人群**: AI研究人员、数据工程师及大模型训练开发者。\n  - **技术核心**: PDF文档解析与线性化技术、数据集构建。\n  - **AI/大模型相关**: 是（描述明确提及用于LLM数据集/训练）。\n---\n### [MDX-Tom/gpt-instruct](https://github.com/MDX-Tom/gpt-instruct)\n- **今日趋势**: 9,315 stars / 1,128 f
