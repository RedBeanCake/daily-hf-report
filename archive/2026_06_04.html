- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.02800)

- **核心亮点**: 构建了一个能同时处理文本、视频、动作的全模态世界模型，服务于物理 AI 任务。
- **深度解析**: 延续了 Cosmos 系列思路，重点在于“全模态”融合。模型不仅生成视频，还能理解物理规律和动作指令。通过统一编码不同模态数据，让 AI 在模拟环境中预测下一步状态，从而更好地训练机器人策略，减少真机试错成本。

- **深度解析**: 针对复杂研究类 Agent 容易迷路的问题，提出了一种细粒度评估方法。通过解析 Agent 的思考轨迹（Trajectory），自动标注出哪一步推理或哪个信息片段导致了后续错误。这比传统的任务成功/失败二元评估更有用，方便开发者针对性优化。

- **领域归类**: [AI 安全], [智能代理]
