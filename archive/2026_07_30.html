### 1. TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with <1 GB VRAM (TurboVLA：基于 RTX 4090 显存小于 1GB 的 32Hz 实时视觉 - 语言 - 动作模型)
- **社区热度**: `👍 114 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.27205)
- **研究任务**: 具身智能模型部署与加速
- **核心亮点**: 在消费级显卡上实现了低显占用的实时 VLA 推理。
- **深度解析**: 针对视觉 - 语言 - 动作（VLA）模型显存大、延迟高的问题，提出了架构压缩与推理优化方案。通过在 RTX 4090 上将显存占用控制在 1GB 以内，同时保持 32Hz 的控制频率，解决了具身模型在边缘设备部署的硬件门槛。
- **领域归类**: [具身智能] [模型压缩] [实时推理]
---

### 2. CoRT: Counterfactual Replay for Token-Level Rubric-Guided Policy Optimization (CoRT：用于 Token 级规则引导策略优化的反事实回放)
- **社区热度**: `👍 70 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.25659)
- **研究任务**: 大模型策略优化与对齐
- **核心亮点**: 利用反事实回放机制在 Token 粒度上优化策略。
- **深度解析**: 传统 RLHF 多在序列级别打分，该方法引入“反事实回放”，即模拟“如果当时选了另一个 Token 会怎样”，结合规则（Rubric）指导，在 Token 级别进行更细粒度的策略更新，提升模型对复杂指令的遵循能力。
- **领域归类**: [强化学习] [大模型对齐] [策略优化]
---

### 3. HumanCLAW: Can Vision-Language Models Act Through a Body? (HumanCLAW：视觉语言模型能否通过身体执行动作？)
- **社区热度**: `👍 64 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.27180)
- **研究任务**: 具身智能能力评估
- **核心亮点**: 系统性评估 VLM 控制物理身体的实际能力边界。
- **深度解析**: 探讨了视觉语言模型（VLM）直接作为机器人控制器的可行性。通过构建特定测试环境，分析 VLM 在感知 - 动作闭环中的表现，指出当前模型在物理交互层面的不足，为具身模型架构设计提供基准参考。
- **领域归类**: [具身智能] [模型评估] [机器人学]
---

### 4. DecoEvo: Score-Decoupled Co-Evolution of Solver and Rubric-Generator Skills in Text Space (DecoEvo：文本空间中求解器与规则生成器技能的分数解耦协同进化)
- **社区热度**: `👍 53 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.25675)
- **研究任务**: 模型自我进化与提示优化
- **核心亮点**: 解耦求解者与规则生成器，实现文本空间内的协同进化。
- **深度解析**: 针对自我进化过程中奖励模型偏差问题，将“解题者”与“评分规则生成者”分开训练。两者在文本空间内协同进化，避免单一模型既当裁判又当运动员，提升复杂任务下的自我改进稳定性。
- **领域归类**: [大模型自我进化] [提示工程] [进化算法]
---

### 5. CLBench-V: Evaluating Multimodal Context Learning from Grounding to Knowledge Acquisition (CLBench-V：评估从视觉定位到知识获取的多模态上下文学习)
- **社区热度**: `👍 39 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.25294)
- **研究任务**: 多模态学习能力评估
- **核心亮点**: 覆盖从基础定位到复杂知识获取的多模态评估基准。
- **深度解析**: 提出了一个新的基准测试套件，分层评估多模态模型的能力：底层是视觉对象定位（Grounding），上层是基于视觉上下文的知识获取。旨在量化模型利用多模态上下文进行推理和学习的真实水平。
- **领域归类**: [多模态学习] [模型评估] [基准测试]

- **社区热度**: `👍 27 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.25308)

- **核心亮点**: 利用传统游戏求解器对 LLM 智能体进行回合级教学。
- **深度解析**: 结合符号求解器的精确性与 LLM 的泛性。使用传统游戏求解器生成最优步骤作为“教师信号”，在每一个回合级别监督 LLM 智能体的决策，提升智能体在策略游戏中的规划能力。
- **领域归类**: [智能体学习] [知识蒸馏] [游戏 AI]

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.26784)
- **研究任务**: 跨任务技能迁移
- **核心亮点**: 通过智能体强化学习实现技能在不同任务间的积累与演化。
- **深度解析**: 关注智能体如何在多个任务间复用技能。利用强化学习机制，将已学技能模块化，使其能在新任务中被调用和改良，解决智能体每遇新任务需从头训练的问题，促进能力累积。

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.26754)
- **研究任务**: 游戏世界模型生成
- **核心亮点**: 确保生成的游戏世界在底层机制逻辑上保持一致。
- **深度解析**: 针对生成式世界模型容易出现逻辑矛盾的问题，引入状态感知机制。模型不仅生成视觉内容，还维护 underlying state（底层状态），确保游戏机制（如物理规则、交互逻辑）在生成过程中不崩坏。

### 10. OmegaUse-OfficeVal: Benchmarking LLM Agents on Long-Horizon Office-Suite Tasks with Economic Grounding (OmegaUse-OfficeVal：基于成本约束的长程办公套件任务 LLM 智能体基准测试)

### 11. Explicit Layer Modeling for Video Object Insertion and Layer Decomposition (视频对象插入与显式层建模)
- **社区热度**: `👍 5 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.25802)
- **研究任务**: 视频编辑中的对象插入与场景层分解。
- **核心亮点**: 提出显式层建模方法，解决了视频对象插入时的遮挡和光照一致性问题。
- **深度解析**: 传统方法多用隐式神经表示，该方法将视频显式分解为多个层（如背景、前景、阴影），在插入对象时单独调整各层属性。通过层分解模型，能更精确地处理对象与场景的交互，避免插入物体看起来“浮”在表面上。
- **领域归类**: [计算机视觉], [视频编辑], [生成模型]

### 13. GPT-Red: Automated Red Teaming via Self-Play at Scale (GPT-Red：大规模自博弈自动化红队测试)
- **社区热度**: `👍 4 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.26115)
- **研究任务**: 自动化安全红队测试，挖掘模型漏洞。

- **深度解析**: 摒弃人工编写攻击提示的传统流程，构建两个 agent 分别扮演攻击者和防御者。通过强化学习让双方在不断对抗中进化，自动发现模型潜在的安全漏洞和越狱路径，显著扩大了测试覆盖范围。
- **领域归类**: [AI 安全], [红队测试], [强化学习]

### 14. CADENCE: Closing the Reasoning Gap via Coverage-Adaptive On-Policy Distillation (CADENCE：通过覆盖自适应_on-policy_蒸馏缩小推理差距)
- **社区热度**: `👍 3 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.16955)
- **研究任务**: 提升小模型在复杂推理任务上的表现。
- **核心亮点**: 采用覆盖自适应策略，针对学生模型薄弱环节进行_on-policy_蒸馏。
- **深度解析**: 传统蒸馏多用静态数据，该方法根据学生模型当前的策略覆盖情况，动态选择教师模型的输出进行蒸馏。重点强化学生模型未掌握或置信度低的推理路径，有效缩小了与教师模型的推理能力差距。
- **领域归类**: [模型蒸馏], [逻辑推理], [自然语言处理]

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.26314)
- **研究任务**: 评估安全攻击代理的隐蔽性和抗检测能力。

- **领域归类**: [AI 安全], [基准测试], [网络攻防]

### 16. Grading the Narrators: An Isnad-Rijal Framework for Claim-Level Provenance in Multi-Agent Knowledge Systems (评估叙述者：多代理知识系统中 claim 级来源的 Isnad-Rijal 框架)

- **深度解析**: 借鉴历史学中考据信息传播链的方法，记录多 agent 系统中每条知识的传递路径。通过评估每个“叙述者”agent 的可信度，来判断最终生成 claim 的可靠性，解决多 agent 协作中的幻觉和责任归属问题。
