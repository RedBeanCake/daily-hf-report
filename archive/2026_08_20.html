    <h1>前沿科研情报 - 2026-08-20</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. SemComp-Bench: Benchmarking Semantic Task Completion in Video Generation (SemComp-Bench：视频生成中的语义任务完成基准测试)\n- **社区热度**: `👍 151 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.17426)\n- **研究任务**: 面向结果的视频生成任务（Semantic Task Completion Video Generation），要求生成的视频既实现预期结果，又保持与参考图像在任务相关高级语义上的对应（即语义基础）。\n- **核心亮点**: 提出了 SemComp-Bench 评估协议，利用视觉语言模型（VLM）回答结构化二值问题来评估结果达成度（OA Score）和生成可靠性（GR Score）；构建了覆盖六个领域的 SemComp-Data 数据集及可扩展的四阶段数据整理流程。\n- **深度解析**: 该研究将视频生成的评估重点从传统的“外观一致性”和“中间步骤完整性”转移到“最终结果达成”与“高级语义对应”上。通过引入 VLM 进行结构化问答评估，提供了一种更贴合实际任务目标的评价方式。实验表明，当前代表性模型在兼顾结果达成与语义基础方面仍面临挑战。\n- **领域归类**: [计算机视觉, 视频生成, 模型评估]\n---\n\n### 2. Zetta ζ: An Efficient Closed-Loop Embodied Harness for Self-Evolving Physical Intelligence (Zetta ζ：一种用于自我进化物理智能的高效闭环具身框架)\n- **社区热度**: `👍 126 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.16590)\n- **研究任务**: 解决现有具身智能体在物理执行中缺乏闭环学习（多为开环、事后反思）的问题，实现物理智能的自我进化。\n- **核心亮点**: 提出 Zetta 闭环具身框架，在冻结基础策略的同时，在线演化基于代码的运行时评论家（critics）和恢复技能；设计了三个时间尺度分离的循环机制；结合 Z-Infra 基础设施，实现动作频率治理、提议和验证门控更新。\n- **深度解析**: Zetta 突破了传统具身智能体开环执行的局限，通过多时间尺度的闭环机制，使智能体能够在执行过程中实时调整。在 LIBERO-Pro 和 RoboCasa 基准测试中取得了 90.8% 和 93.6% 的成功率，并实现了 11.1 倍的推理加速。此外，系统展现出零样本技能迁移能力，并涌现出机器人的“顿悟时刻（Aha Moments）”，证明了闭环框架自我进化在可靠物理智能中的扩展潜力。\n- **领域归类**: [具身智能, 强化学习, 机器人控制]\n---\n\n### 3. SemaPLC: A Project-Grounded, Verification-Gated Agent Harness for PLC Code Generation (SemaPLC：一种基于项目上下文与验证门控的可编程逻辑控制器代码生成智能体框架)\n- **社区热度**: `👍 110 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18565)\n- **研究任务**: 解决大语言模型生成的可编程逻辑控制器（PLC）代码难以无缝集成到现有 PLC 项目并在实时环境中正确运行的问题。\n- **核心亮点**: 提出 SemaPLC 框架，采用严格的完成规则，仅当规范、编译和实时运行时行为等外部检查全部通过时才宣告任务完成；在动态行为评估（部署到实时 PLC 运行时比较执行轨迹）中表现远超基线。\n- **深度解析**: SemaPLC 强调“执行而非静态评分”是检验生成控制逻辑是否有效的忠实标准。在 117 个独立任务中，其严格验证通过率达到 72.6%；在 65 个项目上下文任务中，其动态行为得分（52.2）显著优于基线方法（22.4 到 31.4），有效解决了生成逻辑在实际工业运行时环境中的落地难题。\n- **领域归类**: [代码生成, 工业控制, 智能体应用]\n---\n\n### 4. OmniScientist: An Omni-Modal Omni-Discipline AI Scientist (OmniScientist：一种全模态、全学科的 AI 科学家)\n- **社区热度**: `👍 79 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13558)\n- **研究任务**: 构建一个能够直接从异构原始证据（如图像、信号、音频、视频等）中进行端到端、多学科研究的 AI 科学家系统，以克服现有系统仅依赖文本或预计算特征的局限。\n- **核心亮点**: 提出 OmniScientist 系统，包含感知层和构思、实验、撰写三个自主智能体；通过代码执行进行想法、严谨性和声明检查；支持从原始多模态数据直接生成完整科学手稿。\n- **深度解析**: OmniScientist 的核心突破在于“全生命周期感知”，使系统能够直接处理空间、时间等科学发现中至关重要的原始多模态证据。在 36 个跨学科真实数据案例中，系统成功完成了从原始数据到论文手稿的全流程，平均得分 6.3。与仅使用预计算特征的基线相比，直接感知在 85% 的对比中胜出，证明了多模态原始感知对证据驱动的科学发现至关重要。\n- **领域归类**: [AI for Science, 多模态大模型, 智能体]\n---\n\n### 5. Co-RL: Unsupervised Reasoning Emerges from Diverse Cohort in Multi-agent RL (Co-RL：多智能体强化学习中多样化群体涌现的无监督推理)\n- **社区热度**: `👍 77 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.17253)\n- **研究任务**: 解决自奖励强化学习（Self-rewarding RL）中因依赖自身反馈导致的偏差强化、响应同质化和训练崩溃问题，实现无监督的推理能力提升。\n- **核心亮点**: 提出 Co-RL 框架，通过多个不共享参数的解耦模型进行合作多智能体训练，利用同伴生成的奖励进行优化；通过引入模型族、规模和训练样本的多样性来减少相关错误。\n- **深度解析**: Co-RL 证明了无监督推理可以通过合作多智能体训练涌现。通过增加“队列多样性”（异构模型、不同规模、重述样本），有效打破了自我强化反馈循环。实验表明，在没有任何真实标签的情况下，Co-RL 在 7 个纯文本基准上为 LLM 带来 3.0-8.6% 的平均提升，在 4 个多模态基准上为 VLM 带来 2.3-7.2% 的提升，性能匹配甚至超越了监督方法。\n- **领域归类**: [强化学习, 大语言模型, 推理能力]\n---\n\n### 6. SPADE: Self-Play in Adaptive Synthetic Executable Environments (SPADE：自适应合成可执行环境中的自博弈)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.19197)\n- **研究任务**: 解决语言智能体训练中环境目标分布固定的问题，实现持续自我改进，构建能够根据智能体能力动态生成自适应训练环境的自博弈强化学习框架。\n- **核心亮点**: 提出 SPADE 框架，让单个大语言模型同时扮演“环境设计者”和“推理智能体”；环境设计者通过生成可执行代码构建长期训练环境，并利用“遗憾（regret）”信号针对智能体能力边缘设计环境。\n- **深度解析**: SPADE 将环境设计本身转化为一个可学习的组件。环境设计者基于预训练语料库文档并累积环境记忆，生成具有状态转移和验证代码的复杂环境。扩展至 30B 参数模型后，SPADE 在 8 个数学、科学、代码和推理基准上平均提升 5.3 分，在多轮工具使用场景（BFCL-v4 和 ACEBench-Agent）中分别提升 5.7 和 13.9 分，为开放式自我改进迈出了实质性一步。\n- **领域归类**: [强化学习, 智能体, 环境生成]\n---\n\n### 7. Training Chemical Plausibility-Aware Large Language Models for Single-Step Retrosynthesis (训练具备化学合理性感知的大语言模型用于单步逆合成)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18940)\n- **研究任务**: 解决单步逆合成任务中固有的“一对多”特性难以被传统单答案评估和基准测试协议准确捕获的问题，提升反应预测的多样性和合理性。\n- **核心亮点**: 引入 Top-K prompting 作为训练和推理范式；构建了包含约 4560 万条验证反应的超大规模数据集 CREED-CCV-2+USPTO-XL 来训练 C3LM 模型；结合微调与基于 ChemCensor 及新颖性的奖励机制。\n- **深度解析**: 该研究通过 Top-K 提示和化学合理性感知训练，使模型能够更好地捕捉多样化且合理的反应预测。在 OOD URSA-expert-2026 基准测试中达到了最先进（SOTA）的性能。此外，反应唯一性分析表明，大语言模型与传统模型在探索反应空间上具有互补性，这为未来基于集成策略的逆合成系统提供了新方向。\n- **领域归类**: [AI for Science, 化学信息学, 大语言模型]\n---\n\n### 8. Decision-Metric Alignment in Latent World Models: Diagnostics and Action-Conditioned Objectives for MPC Planning (潜在世界模型中的决策-度量对齐：MPC 规划的诊断与动作条件目标)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18746)\n- **研究任务**: 解决 JEPA 风格的潜在世界模型在模型预测控制（MPC）中，使用潜在空间欧氏距离作为成本函数时，无法保证候选动作序列按真实任务进度正确排序（即缺乏决策-度量对齐）的问题。\n- **核心亮点**: 提出 Plan-Real Spearman 和 CEM-stage Spearman 指标来衡量潜在空间与真实空间排序的一致性；提出 DA-LeWM 方法，通过引入逆动力学和演示条件目标-动作头来增强潜在世界模型。\n- **深度解析**: 研究指出，潜在世界模型对任务变量的强解码并不等同于潜在距离能真实反映任务进度。通过诊断指标发现了对齐差距后，DA-LeWM 利用动作条件目标优化了欧氏成本 MPC 所使用的几何空间。实验表明，DA-LeWM 在保持探测分数相似的情况下，加速了收敛并实现了比基线 LeWM 更高的在线成功率。具体提升数字摘要未提供。\n- **领域归类**: [强化学习, 世界模型, 模型预测控制]\n---\n\n### 9. Training Leaves Traces: Centered Residual Signatures for Language Model Lineage Verification (训练留下痕迹：用于语言模型谱系验证的居中残差签名)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14929)\n- **研究任务**: 解决开放权重语言模型在经过微调、量化、剪枝或合并后来源往往未记录的问题，实现无需数据的白盒模型谱系（血缘）验证。\n- **核心亮点**: 提出通过移除残差训练产生的共享身份对齐组件，比较残差块特定结构来计算对称谱系得分；在无需数据的情况下，有效区分同源衍生模型与独立/蒸馏模型。\n- **深度解析**: 该研究证明了“训练会在权重中留下痕迹”。在 GPT-2 和 residual-MLP 基准测试中，该方法以 1.0 的 AUROC 完美区分了微调、LoRA 合并、剪枝和量化产生的后代模型与独立模型。在面对函数保持的检查点清洗实验时，该方法得分保持不变，且运行速度比最接近的鲁棒基线快 76 倍。案例研究还成功识别了公开 LLaMA-2 检查点中的 3 个相关和 7 个不相关模型。\n- **领域归类**: [模型安全, 模型水印/溯源, 大语言模型]\n---\n\n### 10. Looped Language Models Improve Compositional Tool Calling (循环语言模型提升组合式工具调用能力)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18171)\n- **研究任务**: 探索循环语言模型（Looped Language Models）在智能体组合式工具调用（Compositional Tool Calling）场景中的潜力，解决需要协调多个 API 调用、维护中间状态和保持依赖关系的问题。\n- **核心亮点**: 在组合式工具调用设置中评估了原生和改造的循环语言模型；发现循环计算能显著提升组合式和依赖感知工具使用的准确率；自适应推理（Adaptive inference）能在需要时分配额外计算，实现更优的计算-性能权衡。\n- **深度解析**: 该研究填补了循环语言模型在智能体工具使用领域的空白。实验表明，在 API-Bank、BFCL 和 NESTful 等基准测试中，循环计算对多步、依赖感知的工具调用有显著增益，且准确率通常随循环深度增加而提高。相比之下，对孤立的单步 API 调用提升较小。自适应推理机制进一步证明了循环架构在需要可靠规划、协调和执行组合工具工作流的智能体系统中的前景。具体的准确率提升数字摘要未提供。\n- **领域归类**: [大语言模型, 智能体, 工具调用]\n---\n\n### 11. SoftVTBench: A Deformation-Aware Visuo-Tactile Dataset and Benchmark for Deformable-Object Manipulation (SoftVTBench：面向可变形物体操作的变形感知视觉-触觉数据集与基准)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18701)\n- **研究任务**: 评估可变形物体操作中的物理交互质量，并研究视觉-触觉多模态融合在其中的作用。\n- **核心亮点**: 引入了包含 4000 个专家演示和 50 多个资产的视觉-触觉数据集；提出了“变形感知成功率 (DSR)”指标，仅在任务完成且峰值归一化变形在容差范围内时才计算为成功；揭示了仅仅提供触觉并不能保证有效的多模态融合。\n- **深度解析**: 现有的基准通常只评估任务是否成功，而忽略了物理交互的质量（如滑动或过度压缩）。SoftVTBench 通过同步多视角 RGB、触觉、本体感觉以及评估器专用的有限元 (FEM) 状态，建立了一个闭环基准。实验表明，在分布内配置中，有 0.7% 到 24% 的成功 rollout 实际上违反了变形容差；在分布偏移下，视觉-触觉变体的表现互有优劣。关于具体的资产名称列表、有限元（FEM）状态的具体计算技术细节以及多视角相机的具体硬件参数，摘要未提供。\n- **领域归类**: [机器人学, 多模态学习, 计算机视觉, 强化学习]\n---\n\n### 12. FM-Bench: A Benchmark for Long-Horizon Management with Competing Agents (FM-Bench：面向竞争智能体的长周期管理基准)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18423)\n- **研究任务**: 评估大语言模型智能体在长周期、多智能体竞争环境下的持续决策与复杂管理能力。\n- **核心亮点**: 提出了首个大规模长周期（20 个游戏年）足球俱乐部管理基准 FM-Bench；包含单人轨道和共享竞技场（Arena）模式；发现决定模型管理表现的关键在于管理行为（如优化投资时机和现金流管理），而非模型规模、价格或计算成本。\n- **深度解析**: FM-Bench 要求 LLM 代理在 20 年内通过 26 个工具进行 340 到 400 次决策，并利用确定性引擎累积最终得分，避免了主观评判。研究发现，所有 15 个前沿模型都能完成长周期任务，但排名在后期才稳定。高分模型展现出减少慢回报投资、保持现金投资等特定管理行为，但在从失败中学习（如推断隐藏市场价格）和长期记忆管理方面仍存在缺陷。关于其余 14 个前沿模型的具体名称、确定性引擎的具体技术实现细节以及 6 种行为能力的具体定义，摘要未提供。\n- **领域归类**: [大语言模型, 智能体 (Agents), 强化学习, 基准测试]\n---\n\n### 13. Scaling Creative Writing Beyond Story-Centric Data with Attribute-Guided Genre Expansion (超越故事中心数据：通过属性引导的体裁扩展规模化创意写作)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.13947)\n- **研究任务**: 扩展大语言模型的创意写作训练数据，提升其在多种非故事类创意体裁下的生成与格式遵循能力。\n- **核心亮点**: 提出了属性引导的体裁扩展框架，将主题广度与体裁形式控制分离；构建了包含 5 万条样本、跨越 13 种创意体裁（如说唱、歌词、剧本、游戏设计等）的 Multi-Genre Collection 数据集；证明了受控的体裁扩展是提升鲁棒创意写作能力的关键。\n- **深度解析**: 现有高质量创意写作数据过度集中于故事形式，限制了模型对其他创意格式结构和功能的遵循能力。该框架利用人工编写的故事提示作为种子，结合人工策划的体裁属性来强制实施特定的结构、风格和格式规范，并通过质量过滤生成最终的查询-响应对。实验证明，微调后的模型在分布外写作基准上持续超越基线模型。关于质量过滤的具体技术细节、具体的分布外写作基准名称以及 13 种创意体裁的完整列表，摘要未提供。\n- **领域归类**: [自然语言处理, 大语言模型, 数据构建, 创意写作]\n---\n\n### 14. The More Popular, The Harder to Forget: Adaptive Popularity for LLM Unlearning (越流行越难遗忘：大语言模型遗忘的自适应流行度方法)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.14229)\n- **研究任务**: 解决大语言模型机器遗忘（Machine Unlearning）中，高频“流行”事实因记忆更深而难以被彻底移除的问题。\n- **核心亮点**: 提出了 AdaPop（自适应流行度）方法，根据事实的流行度动态调整遗忘梯度压力；利用双上升控制器自动平衡遗忘与保留的惩罚权重；在释义和对抗性查询下，分别将遗忘内容的泄漏率降低了约 5 倍和 1.6 倍。\n- **深度解析**: 传统的 LLM 遗忘方法对所有训练数据频率施加统一的梯度压力，导致流行事实难以遗忘。AdaPop 引入外部代理（如 Wikidata 站点链接或 LLM-as-Judge）评估事实流行度，并结合局部 token 置信度计算自适应指数。内部指标显示，该方法能使遗忘集的隐藏状态有效偏离预遗忘模型的状态，同时保持保留集表示的稳定。关于具体的 3 个模型家族名称、2 个基准名称以及外部代理评估流行度的具体技术细节，摘要未提供。\n- **领域归类**: [大语言模型, 机器遗忘 (Machine Unlearning), 安全与对齐]\n---\n\n### 15. Temporal Multi-Signal Fusion for Token-Level Hallucination Detection (面向词元级幻觉检测的时间多信号融合)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18115)\n- **研究任务**: 提升词元（Token）级别的幻觉检测性能，解决现有独立打分方法在模型“自信地出错”时失效的问题。\n- **核心亮点**: 将幻觉检测视为时间跨度上的序列标注任务；提出融合文本统计、自然语言推理 (NLI) 和语言模型意外度的 33 维特征流；无需访问模型内部状态，对闭源模型和未见过的模型具有强泛化能力（AUC 下降不到 4%）。\n- **深度解析**: 现有的独立 token 打分方法无法捕捉上下文时序信息。本文通过 BiGRU 等架构融合时序特征，利用时间顺序将证据从自信的位置传播到相邻的模糊位置，在 RAGTruth 数据集上达到了 0.840 的 AUC，比独立逻辑回归基线高出 11 个点。研究表明，性能瓶颈在于特征集而非模型容量，且该方法仅依赖生成文本和外部信号。关于 33 维特征流的具体构成细节、除 RAGTruth 之外的其他测试数据集以及 BiGRU 的具体超参数设置，摘要未提供。\n- **领域归类**: [自然语言处理, 幻觉检测, 序列标注, 模型评估]\n---\n\n### 16. SkillGate: Training In-Policy Skill Selection in Long-Horizon Agents (SkillGate：训练长视野智能体的策略内技能选择)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.18852)\n- **研究任务**: 解决长视野智能体在策略内选择调用何种技能时面临的信用分配问题，提升技能选择决策的准确性。\n- **核心亮点**: 揭示了长视野智能体技能选择中的“选择器信用饥饿”问题；提出 SkillGate 方法，通过解耦结果信用和动作局部优势，为技能选择 token 提供独立的信用通道；在 16 个候选技能的设定下，将 9B 策略的试验成功率从 40.8% 提升至 53.2%。\n- **深度解析**: 在基于技能的智能体框架中，选择调用哪个技能是一个关键决策，但传统的序列级结果奖励会导致“选择器信用饥饿”，即正确的技能选择会因后续执行失败而受到错误惩罚，且该问题随视野长度单调恶化。SkillGate 通过结构上的创新，将信用分配解耦，确保技能命名 token 仅在其选择正确时获得正向奖励。实验证明，该方法大幅提高了策略的成功率，并减少了被误导候选技能的影响。关于 5 个智能体基准的具体名称、9B 策略的具体模型架构细节以及“选择器信用饥饿”的完整数学证明，摘要未提供。\n- **领域归类**: [强化学习, 智能体 (Agents), 大语言模型, 信用分配]\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [Tencent/AI-Infra-Guard](https://github.com/Tencent/AI-Infra-Guard)\n- **今日趋势**: ⭐ 4,803 | 🍴 475 | 📈 今日新增 28 stars\n- **项目简介**: 腾讯开源的全栈 AI 红队测试平台，用于保障 AI 生态系统的安全。\n- **核心价值**: \n  - **项目用途**: 通过 Agent 扫描、技能扫描、MCP 扫描、AI 基础设施扫描以及 LLM 越狱评估，对 AI 系统进行全方位的安全测试。\n  - **目标人群**: AI 安全研究人员、红队测试专家及 AI 系统开发者。\n  - **技术核心**: 全栈 AI 红队测试、多维度 AI 组件扫描、大语言模型（LLM）越狱评估。\n  - **AI/大模型相关性**: 是，深度聚焦于 AI 基础设施与大模型的安全评估。\n\n---\n\n### [Osmantic/ODS](https://github.com/Osmantic/ODS)\n- **今日趋势**: ⭐ 4,569 | 🍴 686 | 📈 今日新增 168 stars\n- **项目简介**: 将个人电脑转化为全能 AI 服务器的本地化部署工具。\n- **核心价值**: \n  - **项目用途**: 将 PC、Mac 或 Linux 设备转变为 AI 服务器，提供 LLM 推理、聊天 UI、语音、代理、工作流、RAG 和图像生成等一站式功能。\n  - **目标人群**: 个人开发者、AI 爱好者及需要在本地私有化部署 AI 应用的用户。\n  - **技术核心**: 本地 AI 服务器搭建、LLM 推理、RAG（检索增强生成）、多模态生成（语音/图像）及 Agent 工作流。\n  - **AI/大模型相关性**: 是，核心功能完全围绕大模型推理与 AI 应用展开。\n\n---\n\n### [microsoft/agent-framework](https://github.com/microsoft/agent-framework)\n- **今日趋势**: ⭐ 12,999 | 🍴 2,201 | 📈 今日新增 85 stars\n- **项目简介**: 微软推出的用于构建和编排 AI 代理及多代理工作流的开发框架。\n- **核心价值**: \n  - **项目用途**: 为开发者提供构建、编排和部署 AI 代理（Agents）以及多代理工作流的底层框架支持。\n  - **目标人群**: AI 应用开发者、软件工程师及企业级 AI 解决方案构建者。\n  - **技术核心**: AI Agent 构建与编排、多代理协同工作流、支持 Python 和 .NET 双语言生态。\n  - **AI/大模型相关性**: 是，专注于 AI 代理（Agent）技术的框架级支持。\n\n---\n\n### [ATH-MaaS/Pixelle-Video](https://github.com/ATH-MaaS/Pixelle-Video)\n- **今日趋势**: ⭐ 27,093 | 🍴 3,933 | 📈 今日新增 125 stars\n- **项目简介**: 基于 AI 技术的全自动短视频生成引擎。\n- **核心价值**: \n  - **项目用途**: 提供 A       window.addEventListener("DOMContentLoaded", function () {
        const markdown = JSON.parse(document.getElementById("raw-md").textContent);
        const target = document.getElementById("content");
        if (!window.marked || !window.DOMPurify) {
          target.textContent = markdown;
          return;
        }
        const rendered = marked.parse(markdown);
        target.innerHTML = DOMPurify.sanitize(rendered);
      });
    </script>
</body>
</html>
