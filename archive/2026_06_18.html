### 1. LoopCoder-v2: Only Loop Once for Efficient Test-Time Computation Scaling (LoopCoder-v2：仅需一次循环即可实现高效测试时计算扩展)
- **社区热度**: `👍 112 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.18023)
- **研究任务**: 代码生成模型推理效率优化
- **核心亮点**: 提出单次循环机制，在降低计算开销的同时实现测试时计算扩展。
- **深度解析**: 传统代码生成模型常依赖多次采样或迭代修正来提升准确率，导致推理延迟高。该文改进推理架构，设计了一种只需单次循环即可动态分配计算资源的策略。通过内部状态复用，避免了重复编码，在保持生成质量的前提下显著减少了 FLOPs 消耗。
- **领域归类**: ['代码大模型', '推理优化', '高效计算']
