### 1. LLaTiSA: Towards Difficulty-Stratified Time Series Reasoning from Visual Perception to Semantics (面向视觉到语义的难度分层时间序列推理)
- **社区热度**: `👍 75 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.17295)
- **研究任务**: 时间序列数据的多模态理解与推理。
- **核心亮点**: 把时间序列任务按难度分级，让模型从看图到理解语义一步步来。
- **深度解析**: 传统方法往往一把抓，这篇论文搞了个分层机制。先把视觉图表信息提取出来，再根据任务难易程度分配不同的推理路径。简单任务直接走语义映射，复杂任务加强视觉感知模块。这样既省算力，又提高了复杂推理的准确率。
- **领域归类**: [时间序列分析, 多模态学习, 推理]
---

### 2. WorldMark: A Unified Benchmark Suite for Interactive Video World Models (交互式视频世界模型统一基准)
- **社区热度**: `👍 29 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.21686)
- **研究任务**: 评估视频世界模型的交互能力。
- **核心亮点**: 出了个统一测试集，专门测视频模型懂不懂物理交互。
- **深度解析**: 现在视频生成模型很多，但缺标准衡量它们懂不懂“世界规律”。这篇论文整合了多个交互场景，定义了统一指标。主要测模型对物体运动、碰撞、因果关系的预测能力。方便大家对比不同模型在物理常识上的表现。
- **领域归类**: [基准测试, 视频理解, 世界模型]
---

### 3. UniT: Toward a Unified Physical Language for Human-to-Humanoid Policy Learning and World Modeling (面向人机策略与世界建模的统一物理语言)
- **社区热度**: `👍 25 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.19734)
- **研究任务**: 人形机器人策略学习与世界建模。
- **核心亮点**: 用一套统一的物理语言，把人的动作和机器人的策略连起来。
- **深度解析**: 以前教机器人干活，人的演示和机器人的策略空间对不上。这篇论文设计了一种中间语言，专门描述物理交互。人做的动作先转成这个语言，机器人再从中学习策略。同时这个世界模型也能用这套语言预测环境变化，降低了迁移难度。
- **领域归类**: [机器人学习, 具身智能, 策略迁移]
---

- **社区热度**: `👍 18 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.21689)
- **研究任务**: 跨风格面部身份识别。
- **核心亮点**: 不管脸是卡通还是素描，只要能认出是谁就行，还配套了新数据集。
- **深度解析**: 人脸识别在风格变化大时容易失效。这篇论文搞了个数据集，包含各种艺术风格的人脸。同时提出了一个感知感知指标，不只看特征距离，还看感知一致性。模型训练时强调忽略风格纹理，只抓身份特征，鲁棒性提升明显。
- **领域归类**: [计算机视觉, 人脸识别, 数据集]

### 5. Seeing Fast and Slow: Learning the Flow of Time in Videos (学习视频中的时间流逝)
- **社区热度**: `👍 13 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.21931)

- **深度解析**: 视频里事件发生速度不一样，模型容易乱。这篇论文设计了一个双分支结构，一个分支抓快动作，一个分支抓慢变化。然后通过时间流模块把两者融合。这样模型既能看懂快速动作，也能理解长时依赖，时序定位更准。
- **领域归类**: [视频理解, 时序建模]

- **社区热度**: `👍 5 Upvotes`
