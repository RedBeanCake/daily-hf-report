### 1. ClawGUI: A Unified Framework for Training, Evaluating, and Deploying GUI Agents (ClawGUI：用于训练、评估和部署 GUI 代理的统一框架)
- **社区热度**: `👍 118 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.11784)
- **研究任务**: GUI 智能体的全生命周期管理（训练、评估、部署）。
- **核心亮点**: 提供了一个统一框架，解决了当前 GUI 代理工具链碎片化的问题。
- **深度解析**: 该工作整合了数据收集、模型微调、自动化评估及实际部署接口。以往研究往往只关注其中一个环节，导致复现和落地困难。ClawGUI 标准化了交互协议和评估指标，支持多种底层模型接入，降低了开发门槛，便于在不同操作系统环境中快速验证代理能力。
- **领域归类**: [Agent, GUI, System]
---

### 2. KnowRL: Boosting LLM Reasoning via Reinforcement Learning with Minimal-Sufficient Knowledge Guidance (KnowRL：通过最小充分知识引导的强化学习提升 LLM 推理能力)
- **社区热度**: `👍 76 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.12627)
- **研究任务**: 大语言模型推理能力增强。
- **核心亮点**: 在强化学习中引入“最小充分知识”引导，避免信息过载干扰推理。
- **深度解析**: 传统 RL 训练推理任务时，外部知识注入往往过多或无关。该方法设计了一种筛选机制，仅向模型提供解决问题所需的最少关键知识作为奖励信号的一部分。这减少了模型对外部信息的依赖噪声，使其更专注于逻辑链条的构建，提升了复杂推理任务中的泛化性。
- **领域归类**: [RL, Reasoning, LLM]
---

- **领域归类**: [Distillation, LLM, Optimization]

### 4. Turing Test on Screen: A Benchmark for Mobile GUI Agent Humanization (屏幕上的图灵测试：移动 GUI 代理拟人化基准)

- **深度解析**: 现有基准多关注任务完成率，忽略了操作过程的合理性。该基准通过记录人类操作轨迹（如点击延迟、滑动轨迹、错误修正），对比代理的行为模式。如果代理的操作序列在统计上无法与人类区分，则视为通过。这推动了代理从“能用”向“好用、自然”发展。
- **领域归类**: [Benchmark, GUI, Agent]

### 5. SPPO: Sequence-Level PPO for Long-Horizon Reasoning Tasks (SPPO：面向长程推理任务的序列级 PPO)

- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.08865)
- **研究任务**: 长程推理任务中的强化学习优化。

- **深度解析**: 针对长链条推理中 token 级奖励稀疏且噪声大的问题，SPPO 在整个推理序列完成后才计算奖励并进行反向传播。这种方法改善了信用分配（Credit Assignment），让模型能更好地理解最终结果与中间步骤的关系，显著提升了多步数学或逻辑推理的稳定性。
- **领域归类**: [RL, Reasoning, Algorithm]

- **核心亮点**: 构建了涵盖多种 Unicode 脚本的基准测试，揭示了当前 OCR 模型在小语种上的严重不足。
- **深度解析**: 现有 OCR 评测多集中在中英文等主流语言。这项工作收集了包含稀有脚本的多样化数据集进行测试，结果显示主流模型在非拉丁、非汉字体系上的识别率大幅下降，指出了数据分布偏差是主要瓶颈。
- **领域归类**: [NLP，OCR，基准测试]

### 24. Seeing Through Touch: Tactile-Driven Visual Localization of Material Regions (通过触觉看：触觉驱动的材质区域视觉定位)

- **深度解析**: 单靠视觉难以区分外观相似但材质不同的区域（如塑料与金属）。该方法让机器人通过触摸获取硬度、纹理反馈，将这些触觉信号作为条件输入视觉模型，从而在图像上准确分割出对应的材质区域。
- **领域归类**: [机器人学，多模态感知，触觉交互]

### 25. 3DTV: A Feedforward Interpolation Network for Real-Time View Synthesis (3DTV：用于实时视图合成的前馈插值网络)

### 26. When Reasoning Models Hurt Behavioral Simulation: A Solver-Sampler Mismatch in Multi-Agent LLM Negotiation (当推理模型伤害行为仿真：多 Agent LLM 谈判中的求解器 - 采样器不匹配)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.11840)
- **研究任务**: 多 Agent 仿真与谈判
- **核心亮点**: 发现强推理模型在行为仿真中会导致求解逻辑与采样分布不一致，降低仿真真实性。
- **深度解析**: 在多 Agent 谈判模拟中，引入推理链（CoT）模型本意是增强策略，但研究发现这会导致模型过度优化单次收益，破坏了人类行为分布的随机性和多样性，造成仿真结果与实际人类行为脱节。
- **领域归类**: [大语言模型，多 Agent 系统，仿真]

### 27. Hierarchical SVG Tokenization: Learning Compact Visual Programs for Scalable Vector Graphics Modeling (分层 SVG Token 化：学习紧凑的视觉程序用于可缩放矢量图形建模)

- **领域归类**: [生成式 AI，计算机图形学，程序合成]

- **研究任务**: 视觉 - 语言模型错误分析
- **核心亮点**: 揭示了模型幻觉不仅源于看不清，更源于过度依赖语义先验而忽略视觉证据。
- **深度解析**: 分析了 LVLM 的错误案例，发现即使视觉特征清晰，模型仍会因文本先验太强而坚持错误描述，这种现象被称为“语义固着”。研究建议需要在训练中加入更强的视觉约束来打破这种固着。
