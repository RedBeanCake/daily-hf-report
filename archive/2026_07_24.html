### 1. AREX: Towards a Recursively Self-Improving Agent for Deep Research (AREX：迈向深度研究的递归自改进代理)
- **社区热度**: `👍 112 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.21461)
- **研究任务**: 自动化深度研究 Agent
- **核心亮点**: 引入递归机制，让 Agent 能自我评估并迭代改进研究计划。
- **深度解析**: 传统 Agent 跑完流程就结束，这个方案搞了个闭环。Agent 输出阶段性研究结果后，会自己评估质量，生成新的指令再输入给自己，循环往复。目的是解决复杂研究任务中单次执行不够深的问题，让 Agent 具备类似人类的“反思 - 修正”能力，适合长周期科研辅助。

- **社区热度**: `👍 41 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.20061)

- **深度解析**: 针对具身场景下目标不明确的问题，不直接端到端硬追。先用语言描述确定目标是谁（Referring），锁定后再进行视觉跟踪（Tracking）。这种解耦设计降低了指代歧义带来的跟踪漂移，比单一模型更稳，适合机器人跟随特定物体或人的任务。
- **领域归类**: [Embodied AI, Computer Vision]
