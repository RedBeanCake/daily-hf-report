### 1. OmniDirector: General Multi-Shot Camera Cloning without Cross-Paired Data (OmniDirector：无需交叉配对数据的通用多镜头相机克隆)
- **社区热度**: `👍 91 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.13432)
- **研究任务**: 视频生成中的相机运动控制
- **核心亮点**: 解决了视频生成中相机控制需要成对训练数据的痛点，实现了无配对数据下的多镜头克隆。
- **深度解析**: 传统方法依赖大量“内容 - 相机运动”配对数据，该方法通过解耦内容生成与相机轨迹，利用几何约束和自监督信号替代配对数据。模型能直接理解镜头语言（如推拉摇移），在不同场景间迁移相机运动风格，降低了数据收集成本。
- **领域归类**: [视频生成, 计算机视觉, AIGC]

### 2. APPO: Agentic Procedural Policy Optimization (APPO：代理程序化策略优化)
- **社区热度**: `👍 61 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.12384)
- **研究任务**: 智能体强化学习训练
- **核心亮点**: 将程序化任务生成引入策略优化，提升了智能体在复杂环境下的泛化能力。
- **深度解析**: 在 PPO 基础上改进，不再使用固定任务集训练，而是动态生成程序化任务序列。智能体在面对未见过的任务组合时，能更快调整策略。这种方法减少了过拟合，让智能体学会“如何学习”新任务，而不仅仅是记住特定任务的解法。
- **领域归类**: [强化学习, 智能体, 算法优化]
---

### 3. Memory is Reconstructed, Not Retrieved: Graph Memory for LLM Agents (记忆是重构而非检索：面向 LLM 智能体的图记忆)
- **社区热度**: `👍 53 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.06036)
- **研究任务**: 大模型智能体记忆机制
- **核心亮点**: 提出用图结构动态重构记忆，替代传统的向量检索方式。
- **深度解析**: 传统 RAG 靠相似度检索片段，容易丢失上下文关联。该方法在交互过程中构建知识图谱，节点代表事实，边代表关系。需要记忆时，通过图遍历重构上下文，而非简单抓取片段。这解决了长程对话中逻辑断裂的问题，让记忆更符合人类联想机制。
- **领域归类**: [大模型, 智能体, 记忆机制]
---

- **深度解析**: 重新审视了 LoRA 公式中的缩放因子 $alpha/r$。研究发现该因子不仅影响学习率缩放，还直接梯度更新的几何形态。论文提出了一种自适应调整缩放因子的策略，在不增加额外参数的情况下，显著提升了 LoRA 在低秩设置下的收敛速度和最终性能。
- **领域归类**: [Optimization, PEFT, LLM]

### 24. Pythagoras-Prover: Advancing Efficient Formal Proving via Augmented Lean Formalisation (Pythagoras-Prover：通过增强 Lean 形式化推进高效形式化证明)

- **领域归类**: [Formal Methods, Math AI, Theorem Proving]
