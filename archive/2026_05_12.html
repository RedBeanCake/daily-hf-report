- **研究任务**: 音乐驱动舞蹈视频生成
- **核心亮点**: 将动作生成与外观生成拆分为级联专家模块，解决动作与视觉不一致问题。
- **深度解析**: 传统方法常 jointly 训练导致动作变形或画面闪烁。该方案设计两个专家网络，先生成骨骼运动序列，再级联生成对应外观视频，通过中间表示对齐确保舞蹈动作卡点准确且人物形象稳定。

### 2. Flow-OPD: On-Policy Distillation for Flow Matching Models (Flow-OPD：面向流匹配模型的在线策略蒸馏)
- **社区热度**: `👍 73 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.08063)

- **深度解析**: 借鉴强化学习中的 On-Policy 思想，在蒸馏过程中让学生模型直接模仿教师模型的流轨迹分布，而非仅匹配最终输出。这种方法减少了累积误差，能在极少步数下保持生成质量。
- **领域归类**: [生成模型] [模型蒸馏] [流匹配]

- **领域归类**: [模型架构] [扩散模型] [深度学习]
