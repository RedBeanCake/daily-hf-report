    <h1>前沿科研情报 - 2026-08-11</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. SWE-Bench ProMax: Benchmarking agents on Large-Scale Multilingual Code Refactoring (SWE-Bench ProMax：在大规模多语言代码重构上对智能体进行基准测试)\n- **社区热度**: `👍 70 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09802)\n- **研究任务**: 评估 AI 编程智能体在大规模、多语言代码重构任务上的能力，解决现有基准测试饱和及评估质量不佳的问题。\n- **核心亮点**: 提出了 SWE-Bench ProMax 基准，包含 170 个实例，涵盖 7 种编程语言（Python、Java、TypeScript、Go、C、C++ 和 Rust）。通过多阶段严格筛选，重写了问题描述以提供精确规范，并手动审查测试套件以消除过窄或过宽的测试。平均每个实例修改 11.4 个文件和 261.6 行代码，规模远超现有基准。\n- **深度解析**: 现有基准（如 SWE-bench Verified）存在测试缺陷（近 60% 未解决实例包含有缺陷的测试）和模型记忆训练数据的问题。代码重构需要跨文件的协调和保持行为不变，是更难的测试。实验表明，前沿模型在两种智能体脚手架下最高解决率仅为 41.2%，证明该基准具有挑战性且未饱和。\n- **领域归类**: [软件工程, 智能体评估, 代码重构]\n---\n\n### 2. Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA (Macaron-V1：面向具有自我改进和 LoRA 混合架构的开放持续学习)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09819)\n- **研究任务**: 构建一个开放的智能体模型家族，使其能够在真实环境中从经验中学习，并在部署后持续学习。\n- **核心亮点**: 提出了 Macaron-V1，采用 LoRA 混合（MoL）架构，冻结基础模型并组合专家 LoRA 适配器，每个用户回合选择一个 LoRA。旗舰模型 Macaron-V1-Venti 结合了 744B 的 GLM-5.2 基础模型和四个 LoRA（聊天、智能体、编码、GenUI），另有基于 Qwen3.6 的 50B 本地部署版本。\n- **深度解析**: 系统围绕适应和协作两个目标设计。适应通过版本化模型-工具对的递归改进实现；协作通过 MoL 架构实现。算法结合了模型-工具协同设计和递归自我改进循环（包括 GenUI 工具、有状态动作基底等）。基础设施包括后训练平台 MinT 和长上下文 RL 方法 LongStraw。在个人智能、GenUI 和通用能力基准上进行了评估，摘要未提供具体的实验结果数字和具体数据集名称。\n- **领域归类**: [大语言模型, 持续学习, 智能体架构, 混合专家模型]\n---\n\n### 3. Agent Memory Distillation: Empowering Small LLM Agents with Hierarchical Teacher Memory (智能体记忆蒸馏：通过分层教师记忆赋能小型 LLM 智能体)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.07169)\n- **研究任务**: 提升小型语言模型智能体在工具使用任务中的表现，解决其难以自行生成足够成功轨迹的问题。\n- **核心亮点**: 提出了智能体记忆蒸馏（AMD），一个无需训练的框架，通过分层记忆将大型教师智能体的结构化知识转移给小型学生智能体。构建了工作流记忆（任务级策略）、子任务记忆（中等粒度行为示例）和函数记忆（调用约定和常见陷阱）三种互补记忆。\n- **深度解析**: 工作流和子任务记忆在任务开始时主动注入，函数记忆在工具调用出错时被动检索。在 AppWorld、BFCL V3 和 ToolSandbox 三个工具使用基准上，使用 GPT-5-mini 作为教师评估了四个学生模型（4B-8B 参数），平均准确率分别提升了 27.2%p、11.2%p 和 3.4%p。分析表明子任务记忆贡献最大，4B 规模的学生获益最多。\n- **领域归类**: [智能体记忆, 知识蒸馏, 小语言模型, 工具使用]\n---\n\n### 4. Motif 3: Technical Report (Motif 3：技术报告)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09119)\n- **研究任务**: 训练并介绍 Motif 3，一个具有 3140 亿总参数和每 token 132 亿激活参数的 decoder-only 混合专家（MoE）语言模型。\n- **核心亮点**: 采用细粒度稀疏性（384 个路由专家，每个 token 选择 8 个）。核心架构围绕分组差分潜在注意力（GDLA）构建，结合了修改的流形约束超连接、专家特定 PolyNorm 激活和多 token 预测。在约 12.5 万亿个 token 上进行预训练，支持长达 256K token 的上下文长度。\n- **深度解析**: 后训练流程结合了通用监督微调、六个使用强化学习训练的专家教师、一个使用监督微调训练的软件工程教师，以及多教师在策略蒸馏。最终模型整合了推理、编码、工具使用、长上下文理解等能力。在广泛评估中，与领先的开源权重模型相比具有竞争力，特别是在长视野智能体任务、数学推理和科学知识的评估中表现强劲，摘要未提供具体的实验结果数字和具体数据集名称。\n- **领域归类**: [大语言模型, 混合专家模型, 模型架构, 预训练与后训练]\n---\n\n### 5. Sci-VBench: Evaluating Knowledge- and Reasoning-Intensive Video Generation in Science Domains (Sci-VBench：评估科学领域中知识和推理密集型视频生成)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09873)\n- **研究任务**: 评估跨科学领域的知识和推理密集型视频生成模型，超越表面级的视觉合理性。\n- **核心亮点**: 引入了 Sci-VBench 基准，包含 1253 个专家注释的示例，涵盖 4 个核心学科（自然科学、医疗保健、人文与社会科学、工程）的 60 个科目。要求模型生成时间丰富、需要科学推理和基于知识的合成的视频，并建立了一个基于评分标准的评估协议。\n- **深度解析**: 分析表明，非专家人类评估者和 MLLM-as-Judge 系统在该协议下能与专家判断达到较高的一致性。对 16 个前沿专有和开源模型进行了基准测试，发现自动感知质量得分在各系统间紧密聚集，但在提示接地以及科学与因果正确性方面表现差异很大，存在明显的专有模型与开源模型差距。这表明视觉真实感的进步尚未转化为对科学和因果动态的可靠建模，摘要未提供具体的模型得分数字。\n- **领域归类**: [视频生成, 评估基准, 科学推理, 多模态]\n---\n\n### 6. Ouroboros: A Self-Developing Frontier Coding Agent with Reviewed Core Evolution (Ouroboros：具有审查核心进化的自发展前沿编码智能体)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08311)\n- **研究任务**: 构建一个自发展的智能体工具，其工具、提示、上下文组装和核心实现通过审查后的提交进行改进，并成为后续工作的运行时。\n- **核心亮点**: 核心进化分两种模式：递归自由进化（改进本身作为一个任务）和经验驱动的核心进化（日常工作和社交互动暴露问题并导致结构性改变）。在 Terminal-Bench 2.1 上得分 86.74%，在 OSWorld-Verified 上达到 90.69%，在 CL-Bench 上达到 0.2301 的归一化奖励，均创历史新高。\n- **深度解析**: Hope 是运行时间最长的公开记录的 Ouroboros 部署，是一个在受治理的人类通信下跨越七个表面的 161 天自由进化活体智能体实验。人类交互暴露故障并生成提案，但由智能体决定追求哪些改变。由于自发展智能体可能会重写自己的代码并选择新的模型 API，操作安全成为首要设计问题：护栏必须在进化和公共社交压力下保持权威性。基准测试使用冻结的系统快照，而 Hope 在单独的谱系上继续实时进化。\n- **领域归类**: [编码智能体, 自我进化, 智能体安全, 软件工程]\n---\n\n### 7. What to Edit Next: Visually Aligned Image-Editing Follow-Up Suggestions in Conversational Systems (接下来编辑什么：对话系统中视觉对齐的图像编辑后续建议)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.07565)\n- **研究任务**: 在图像创作对话中，为用户提供反映其偏好、提供多样化方向且在当前图像上可执行的后续编辑建议。\n- **核心亮点**: 收集了 100,000 个来自 Qwen App 的真实多轮图像创作对话样本，发现 80.1% 依赖于图像。提出了一个三阶段框架：阶段 1 构建人工审查的后续编辑意图表并微调多模态策略；阶段 2 使用用户点击反馈通过多目标强化学习优化策略；阶段 3 引入视觉验证器作为额外训练监督以减少视觉不一致。\n- **深度解析**: 实验表明该框架在自动和人工评估中均显著优于基线。在数百万用户的实时用户随机 A/B 测试中，最终框架将视觉不一致性从 3.7% 降低到 0.9%。此外，推荐 CTR 显著提高了 32.70%，图像带走率提高了 16.32%，每个用户的平均对话轮数增加了 39.90%（均 p\u003c0.05）。\n- **领域归类**: [多模态对话, 图像编辑, 推荐系统, 强化学习]\n---\n\n### 8. SPOT: Sparse Probing and Outcome Calibration for On-Policy Distillation (SPOT：用于在策略蒸馏的稀疏探测与结果校准)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.04419)\n- **研究任务**: 改进在策略蒸馏（OPD），解决标准 reverse-KL 训练可能为其他合理续写分配概率不足的问题，以及局部教师概率可能无法预测下游成功的问题。\n- **核心亮点**: 引入了 SPOT，通过“获取-探索-利用”过程解决“在哪里探测”和“蒸馏什么”这两个耦合决策。在获取阶段，结合归一化教师熵、top-k 候选集捕获的概率质量和师生不匹配来分配有限的探测预算。\n- **深度解析**: 在探索阶段，SPOT 通过验证器评分的学生续写来评估教师提出的候选。在利用阶段，这些结果产生一个封闭形式的、KL 正则化的目标，该目标偏好具有更好下游结果的候选，同时保持锚定在教师分布上。在多个学生模型和推理基准上的广泛实验表明，SPOT 在提高推理性能的同时，有效平衡了解决方案的质量和覆盖率，摘要未提供具体的实验结果数字和具体数据集名称。\n- **领域归类**: [知识蒸馏, 强化学习, 推理能力, 模型训练]\n---\n\n### 9. OasisKV: Scaling In-Decode KV Cache Beyond HBM with Lookahead Sparse Prefetching (OasisKV：通过前瞻稀疏预取将解码期 KV 缓存扩展至 HBM 之外)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08097)\n- **研究任务**: 缓解大语言模型推理服务中由于长上下文和长文本推理工作负载增加导致的 HBM（高带宽内存）容量压力。\n- **核心亮点**: 提出了 OasisKV，一种以内存为中心的 LLM 推理系统设计，通过在 LLM 解码期间将完整的 KV 缓存存储与 HBM 解耦来减轻 HBM 容量压力。利用推测解码起草的前瞻 token 准确预测未来重要的 token，并采用高效的注意力后台管道识别重要的 KV 块，从更高容量的内存层预取并暂存在 HBM 中。\n- **深度解析**: 基于 vLLM 实现了 OasisKV。前瞻预测足够准确，在 2048-token 的 KV 预算下，能将准确度保持在完全注意力的 0.7 个点以内。这使得 OasisKV 将稀疏性转化为吞吐量增益：在推理工作负载上，在准确度损失 0.1 个点的情况下，比密集 vLLM 快 1.69 倍；在多 GPU 长上下文服务上快达 2.1 倍。在预填充-解码解耦下，OasisKV 达到约 2 倍的密集吞吐量，同时每个请求接受的 KV 减少 6.5-9.7 倍，并保持比完全 KV 传输少 2.2-2.6 倍的解码节点主机内存，摘要未提供具体数据集名称。\n- **领域归类**: [推理优化, 内存管理, KV 缓存, 系统架构]\n---\n\n### 10. RoMeRL: Balancing Feedback Coverage and the Memory-Reward Trap in Self-Evolving Agent Memory via Reduced-Order Utility States (RoMeRL：通过降阶效用状态平衡自进化智能体记忆中的反馈覆盖与记忆-奖励陷阱)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.02508)\n- **研究任务**: 解决自进化 LLM 智能体基于学习的记忆系统面临的两个挑战：轨迹索引效用随交互历史增长导致反馈分散，以及轨迹级奖励共同分配给共同检索的记忆导致无关经验获得误导性效用更新（记忆-奖励陷阱）。\n- **核心亮点**: 引入了降阶记忆强化学习（RoMeRL），使用由结果极性和记忆动态分解的固定维度的每任务记忆状态来表示不断增长的轨迹索引效用空间。通过一组固定的语义坐标纳入新经验，其内容随时间更新或替换，从而将反馈集中在有界的效用支持上。\n- **深度解析**: 理论上证明了这种降阶参数化增加了每个效用坐标接收的平均反馈，并表征了通用坐标转换模型下错误坐标的稳态占用率。在 ALFWorld 和 LifelongAgentBench 上的实证结果表明，RoMeRL 提高了任务性能，将 Cold-Q 比率降低了 80.0%，反馈密度增加了约 6.0 倍，维持的记忆大小减少了 84.4%，并将 LLM 调用次数减少了 21.1%。\n- **领域归类**: [智能体记忆, 强化学习, 自进化智能体, 效用优化]\n---\n\n### 11. Evo-Bench: Can Language Models Improve Agent Harness? (Evo-Bench：语言模型能改进智能体运行环境吗？)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09096)\n- **研究任务**: 评估大语言模型自主优化其自身运行环境（harness）的能力，解决现有评估无法隔离环境改进与基础模型能力、防止任务特定过拟合或捕捉长视野迭代研究的问题。\n- **核心亮点**: 提出首个评估模型内在环境进化能力的基准 Evo-Bench，覆盖搜索、办公和通用智能体领域。采用新颖的环境引导构建框架，利用辅助任务进化识别对框架改进真正敏感的任务，并通过敏感性感知分层分割确保跨套件泛化。\n- **深度解析**: 评估了9个前沿和开源权重模型，顶级模型实现了高达16.6分的绝对增益，接近人工设计的最先进基线。自主进化在通用任务中超越人工环境，在搜索任务中表现出色，但在需要高度特定处理工作流的办公任务中表现挣扎。分析揭示了早期饱和等关键时间异常，并证明合成的环境作为高度可迁移的推理结构，能持续提升不同策略模型。\n- **领域归类**: [智能体, 大语言模型, 基准测试]\n---\n\n### 12. Evidence-RL: Towards Evidence-intensive Visual Reasoning (Evidence-RL：迈向基于证据的密集视觉推理)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.08021)\n- **研究任务**: 解决视觉语言模型（VLMs）在回答时依赖语言先验、数据集捷径或无关视觉上下文，而非具体图像证据的问题。\n- **核心亮点**: 提出反事实证据解缠（CED），一种用于 VLM 基础的训练时证据审计方法。通过中和以对象为中心的证据区域，并将支持度下降与匹配的非证据区域进行比较，结合 GRPO 中的答案正确性，奖励依赖证据路径而非捷径的正确答案。\n- **深度解析**: CED 使用弱对象级提议，无需特定问题的证据注释，且不增加推理时开销。在9个公开基准和4个骨干网络上，CED 优于先前基于 RL 的后训练方法，目标分析验证了其以对象为中心的信号。摘要未提供具体的准确率提升数字。\n- **领域归类**: [视觉语言模型, 强化学习, 视觉推理]\n---\n\n### 13. Scaling Inherently Interpretable Language Models (扩展内在可解释的语言模型)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.07594)\n- **研究任务**: 挑战将可解释性视为模型能力“税”的传统观念，将可解释性作为训练流水线的约束条件，与语言建模目标一起优化。\n- **核心亮点**: 证明在三个数量级的计算量下，无论是自回归还是扩散语言模型，可解释性随能力扩展而非与之对立。模型表示随规模变得更解耦并与人类可理解的概念对齐。实例化了 Steerling-8B，一个带因果注意力掩码的扩散语言模型。\n- **深度解析**: Steerling-8B 能将生成的 token 组归因于相关输入 token、人类可理解的概念和训练数据。支持闭环干预：通过概念或特征归因诊断输出，检索相似训练数据，并通过概念引导纠正行为而无需重新训练。该模型在计算量少2-16倍的开源同级模型中仍具竞争力，表明可解释性可以设计进训练中并随规模提升。摘要未提供具体的基准测试分数。\n- **领域归类**: [大语言模型, 模型可解释性, 扩散模型]\n---\n\n### 14. RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance (RynnValue：利用时间距离扩展机器人价值基础模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09853)\n- **研究任务**: 解决通用奖励模型在扩展机器人学习时遇到的瓶颈，探索从大规模异构语料库中学习价值相关能力的方法，替代依赖偏好或归一化进度等任务内部锚点的方法。\n- **核心亮点**: 引入开源的机器人操作价值基础模型 RynnValue，用时间距离（从观察到语言指定目标的有向到达成本）替代传统锚点。时间距离标签可直接从时间戳推导，使模型能扩展到超过7000小时和约300万个指令条件片段，无需偏好或进度注释。\n- **深度解析**: 结合随机时间采样、时间顺序打乱和价值隔离注意力，抑制捷径。在 RBM-EVAL-OOD 上达到平均 Kendall's tau_a 0.675，超越全偏好监督的 SOTA（0.655），并比纯进度对应物（0.292）翻倍以上，零样本泛化到未见任务、实体和视角。转化为密集奖励后，真实世界策略成功率在线从52.5%提升至72.5%，离线从63.8%提升至82.5%。\n- **领域归类**: [机器人学习, 基础模型, 强化学习]\n---\n\n### 15. Stealing Reasoning Traces from Proprietary LLM APIs (从专有 LLM API 中窃取推理轨迹)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09867)\n- **研究任务**: 揭示并利用专有大型语言模型提供商在保护思维链（CoT）推理轨迹时存在的架构漏洞。提供商将加密的推理块返回给客户端，研究旨在破解这些加密块。\n- **核心亮点**: 发现加密块在同一提供商生态系统内的不同会话、用户和模型之间完全兼容且可互换。利用此兼容性开发可扩展的解密越狱方法：将给定模型的加密推理轨迹注入同一提供商中较弱且防护较少的模型中，迫使其解码并逐字输出明文，而无需直接越狱更强大的模型。\n- **深度解析**: 该漏洞支持四种攻击向量：1）绕过反蒸馏机制，从 Anthropic、OpenAI 和 Google 提取推理（摘要未提供具体提取成功率等数字）；2）大规模提取私人数据，解码从公共仓库抓取的315,320个推理块，恢复了367个个人身份信息（PII）和182个凭证；3）暴露推理过程中隐藏的危险信息；4）执行不可见的提示注入，将恶意负载嵌入加密块中。提出了具体的加密和系统级缓解措施。\n- **领域归类**: [大语言模型安全, 提示注入, 隐私保护]\n---\n\n### 16. Intent Speaks Louder: Controllable User Simulation Beyond Response Imitation (意图胜于言辞：超越响应模仿的可控用户模拟)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09420)\n- **研究任务**: 解决用户模拟器在生成下一轮用户话语时，由于一对多特性导致可能通过不适当的局部交互意图（如接受而非修复）推进对话的问题，实现可控的用户模拟。\n- **核心亮点**: 提出 UserIDA（用户意图-指令对齐），将交互意图暴露为显式的逐轮指令。定义了六向意图接口，通过监督微调学习指令条件生成，并在基于组的强化学习中使用意图校准的策略优化。\n- **深度解析**: 在 LMSYS-USP 上，UserIDA 实现86.6%的意图准确率，比最强的专用用户模拟器基线高出24.3个百分点，同时提高了语义和风格相似度。在上下文内干预中，在91.7%的评估对话状态中实现了至少四个目标意图，而最强的外部基线仅为22.9%。\n- **领域归类**: [自然语言处理, 对话系统, 强化学习]\n---\n\n### 17. An End-to-End Agent Auditing Engine (端到端智能体审计引擎)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.07346)\n- **研究任务**: 解决在快速发展的智能体运行环境（harness）生态系统中，高效构建端到端、系统且全面的评估管道所面临的挑战。\n- **核心亮点**: 引入 A^2E（智能体审计引擎），一个专为智能体 harness 设计的端到端评估引擎。利用新提出的智能体任务协议（ATP）实现评估任务与不同 harness 的快速集成。通过自动插桩的 Monitor 捕获并生成标准化执行轨迹。\n- **深度解析**: 在评估阶段，A^2E 使用多维指标套件系统评估 harness 能力，相比单一正确性，能更细粒度地表征 harness 在执行效率、工具使用、任务规划和错误恢复方面的差异。实验揭示了模型-harness 组合在不同任务类型上存在显著性能差异，且没有单一组合在所有任务中始终最优。摘要未提供具体的性能提升数字。\n- **领域归类**: [智能体, 评估系统, 大语言模型]\n---\n\n### 18. Factorized Hypothesis Search for Evidence-to-Taxonomy Retrieval (用于证据到分类检索的分解假设搜索)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.06614)\n- **研究任务**: 解决大分类检索中，输入通常是间接证据（如依赖行、列、数据类型和上下文的表格单元格），其语义未明确表达目标概念，导致“检索准备度差距”的问题。\n- **核心亮点**: 提出分解假设搜索（FHS），在命名的语义维度上维护多个部分解释。这些假设支持结构化查询渲染、多假设检索和维度级候选验证。\n- **深度解析**: 在金融分类标记和 CodiEsp 临床编码任务上，FHS 在非预言机方法中实现了最佳的 Recall@1、MRR 和最终准确率。摘要未提供具体的准确率数值。用自由文本集成替换分解假设路径会导致头部排名性能最大下降，而顺序细化相比 FHS 强大的并行第一轮没有提供额外增益。\n- **领域归类**: [信息检索, 自然语言处理, 知识表示]\n---\n\n### 19. Vision-Language Grounding as Bidirectional Concept Correspondence (视觉语言定位作为双向概念对应)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.07886)\n- **研究任务**: 解决现有视觉语言定位方法将其简化为单向定位问题（给定文本短语找图像区域），忽略了确定文本哪些部分具有视觉指代性及其如何与图像实体对应的基础挑战。\n- **核心亮点**: 将定位重新定义为图像-文本对上的双向概念对应。目标是恢复具有视觉指代性的文本跨度与实例级图像分割之间的所有对应关系，而不假设相关文本跨度已提供。引入 ConCor-1 模型，使用可学习的桥接 token 表示候选对应关系，预测文本掩码、图像掩码和对应存在分数。\n- **深度解析**: 将多种定位和分割数据集转换为统一的对应格式。实验表明，ConCor-1 持续优于基线，在长标题数据集上将对应 F1 提高了48%，在零样本 LVIS（大型类别列表作为文本输入）上提高了29%。\n- **领域归类**: [计算机视觉, 视觉语言模型, 多模态定位]\n---\n\n### 20. CEAA: A Cognitive Embodied Agents Architecture for Interactive Computing Systems (CEAA：面向交互式计算系统的认知具身智能体架构)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2608.09848)\n- **研究任务**: 解决在实时交互式虚拟环境中开发具有认知能力的具身智能虚拟代理（IVAs）的挑战，现有架构要么局限于商业游戏引擎的低级反应控制系统，要么难以在虚拟世界中实现高级推理模型。\n- **核心亮点**: 提出一种模块化的认知架构，用于部署具身 IVAs。该架构建立在感知-思考-行动范式和信念-欲望-意图（BDI）认知模型等现有框架之上，旨在提供一个可重用的、面向实现的框架模板。\n- **深度解析**: 该架构通过提供模块化、面向实现的框架，弥合了高级智能体推理模型与实时具身执行之间的差距，旨在为复杂交互式虚拟环境中的智能体提供可扩展、自适应和可解释的能力。摘要未提供具体的实验结果或数字。\n- **领域归类**: [具身智能, 智能体架构, 虚拟现实]\n---\n\u003c/details\u003e\n\n\u003e 今日无新增趋势项目（已在近期总结过）。"</script>
