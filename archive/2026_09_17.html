    <h1>前沿科研情报 - 2026-09-17</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Continual Learning Mechanisms Compose for Long-Horizon Memorization (持续学习机制组合实现长程记忆)\n- **社区热度**: `👍 285 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.06986)\n- **研究任务**: 研究语言模型在随时间推移接收信息并在后续多次更新中保留这些信息的挑战，即探索“长程记忆”（long-horizon memorization）设定。\n- **核心亮点**: 提出组合互补的持续学习机制（如数据、函数、权重锚点与低秩分配规则）来应对灾难性遗忘。最佳方法结合三种锚点和合并 LoRA，将平均最终保留率从朴素顺序微调的 1.2% 提升至 34.9%（实现 28 倍提升）。\n- **深度解析**: 论文指出单一持续学习机制在长程设定下效果不佳，因此假设解决不同遗忘来源的机制组合起来会更有效。作者构建了三个 100 任务的记忆数据集，使用任务级连续减半搜索组合设计空间，并通过析因实验测量个体和交互效应。结果表明，数据锚点和合并 LoRA 提供了最大的平均增益，并在所有数据集上呈现超加性交互，证明了组合互补机制能大幅提升长程记忆能力。\n- **领域归类**: [自然语言处理, 持续学习, 大语言模型]\n---\n\n### 2. AI for Games in the Foundation Model Era (基础模型时代的游戏AI)\n- **社区热度**: `👍 104 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16679)\n- **研究任务**: 综述和梳理基础模型及学习到的游戏世界模型在游戏生命周期（从游玩、玩家建模、游戏设计、开发维护、运行时适配到测试评估）中的 AI 应用。\n- **核心亮点**: 将游戏 AI 的应用组织为六个角色（游玩与行动、建模玩家与游戏、设计游戏、构建与维护游戏、运行时生成与适配、测试与评估游戏），并分析了各角色间的跨角色联系（如轨迹训练世界模型、设计规格驱动实现等）。\n- **深度解析**: 论文指出当前各研究方向大多独立发展，掩盖了哪些能力可跨场景迁移。通过梳理发现，控制方案、规则、引擎接口等通常具有场景特定性，下游声明需在目标场景中验证。目前有界游戏游玩和特定学习环境的评估最标准化，而持久状态、软件迭代、玩家建模等领域的评估仍不够成熟。核心挑战在于跨角色复用能力并在特定游戏场景中重新验证有效性。\n- **领域归类**: [人工智能, 游戏AI, 综述]\n---\n\n### 3. StepAudio 3 Realtime Technical Report (StepAudio 3 实时技术报告)\n- **社区热度**: `👍 88 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14005)\n- **研究任务**: 开发支持实时语音交互的音频-语言基础模型，要求具备深度推理、快速响应和流畅的轮流对话能力。\n- **核心亮点**: 提出 StepAudio 3 Realtime，围绕“听-说-想-做”循环构建。通过“边说边想”（Think-While-Speaking）机制解决深度推理与延迟之间的矛盾，并集成语音代理处理异步工具执行而不打断对话流。\n- **深度解析**: 模型包含深度感知以捕捉声学线索，以及无缝双工模型处理同步音频流以应对停顿、反馈和打断。在推理模式下，StepAudioChat 宏观平均得分达 73.0；结合“边说边想”，在实时说话的同时达到与专用推理模型相当的对话和推理性能。此外，在 MMSU 基准上得分 90.6，Artificial Analysis Full-Duplex Bench 总体得分 98.9，τ-Voice 宏观任务成功率 56.0%。\n- **领域归类**: [语音处理, 多模态大模型, 实时交互]\n---\n\n### 4. StepAudio 3 Music Technical Report (StepAudio 3 音乐技术报告)\n- **社区热度**: `👍 69 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16034)\n- **研究任务**: 开发支持显式音乐规划和开放域文本控制的大规模、长文本音乐生成模型。\n- **核心亮点**: 提出 StepAudio 3 Music，采用离散-连续设计（50Hz 单码本流与连续 VAE 潜变量结合），并引入混合专家自回归模型使用 ABC 记谱法生成中间编曲计划（ABC-CoT），将和声、节奏和旋律结构纳入生成上下文。\n- **深度解析**: 音乐分词器使用语义自监督和多任务训练保留音乐结构。流匹配扩散 Transformer（DiT）预测连续 VAE 潜变量，再由解码器转为 48-kHz 音频。通过渐进式训练课程和监督微调支持长达 5 分 30 秒的歌曲、伴奏和翻唱生成。结合直接偏好优化（DPO）的强化学习，模型在 AudioBox 和 MuQ-MuLan 等指标上取得最高分。在 Artificial Analysis Music Arena Vocals 排行榜上，Quality Elo 为 1105，仅次于 Suno V5.5 和 Mureka。\n- **领域归类**: [音频生成, 音乐生成, 多模态大模型]\n---\n\n### 5. ScienceBuddy: Recursive-in-Recursive Self-Improvement for Interactive Scientific Agents (ScienceBuddy：面向交互式科学智能体的嵌套递归自我改进)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.17523)\n- **研究任务**: 构建一个交互式科学研究工作空间，将不断自我改进的科学智能体融入研究人员的日常工作流中。\n- **核心亮点**: 提出“嵌套递归自我改进”（recursive-in-recursive self-improvement）范式，将工具链（harness）演化与模型强化学习结合。内层递归在模型固定时改进工具链，外层递归在改进后的工具链下训练模型。\n- **深度解析**: ScienceBuddy 支持研究人员执行科学任务，并将他们的请求、反馈和执行证据转化为持续学习的任务和评估标准。工具链演化塑造训练经验，模型学习创造工具链适应的新机会。论文展示了跨越四个科学任务家族的案例研究，并将其作为研究产品发布，迈向通过与研究人员持续合作而进步并随之演化的“发现智能”。\n- **领域归类**: [AI for Science, 智能体, 自我改进]\n---\n\n### 6. HarnessVLN: Unifying Training-Free Embodied Navigation through an Agent Harness (HarnessVLN：通过智能体工具链统一免训练的具身导航)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15195)\n- **研究任务**: 解决具身导航中基于训练的方法泛化能力差，以及免训练方法缺乏机制来协调提议动作与空间证据、任务进度和执行失败的问题。\n- **核心亮点**: 提出 HarnessVLN，一个零样本、免训练的框架，其“智能体工具链”（Agent Harness）通过统一的工具接口协调感知、检索、定位、导航、恢复和终止。\n- **深度解析**: 工具链根据空间证据、几何可行性和子目标一致性验证规划器的提议，并将结构化的工具反馈纳入后续决策。分层事件内存跟踪任务进度，持久时空图维护可重用的空间证据和失败注释。可替换的导航执行器将验证后的目标转化为可执行动作。在 R2R、RxR、HM3D-v2 和 HM3D-OVON 上的成功率分别达到 60.8%、53.9%、76.0% 和 59.3%，超越了先前免训练的 SOTA，并在真实环境中的人形机器人部署中证明了其适用性。\n- **领域归类**: [具身智能, 机器人导航, 多模态大模型]\n---\n\n### 7. The Last AI Built by Humans: Toward Genuine Recursive Self-Improvement (人类构建的最后一个AI：迈向真正的递归自我改进)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11873)\n- **研究任务**: 探讨 AI 系统如何将经验和反馈转化为持久改变，从而提升自身能力及未来改进过程的“递归自我改进”（RSI）。\n- **核心亮点**: 使用“余量封闭指数”（HCI）揭示现有 LLM 的问题，引入 RSI 概念及其发展路线图（从改进-执行自主性到递归元改进），并考察 RSI 在科学发现、具身智能、软件工程等场景中的应用。\n- **深度解析**: 论文梳理了 RSI 在不同场景下的独特需求和发展速度。结合多样化的行业实践和初步经验证据，将 RSI 研究与实际系统联系起来，并指出了实现真正 RSI 所面临的关键挑战。摘要未提供具体的实验数据或量化结果。\n- **领域归类**: [通用人工智能, 递归自我改进, 人工智能]\n---\n\n### 8. Another Blueprint In The Wall: How to Ask Frontier AI Like a Kid? (墙上的另一张蓝图：如何像孩子一样向前沿AI提问？)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14803)\n- **研究任务**: 通过特定的提示词序列，探究不同前沿模型（OpenAI, Anthropic, xAI, Google DeepMind）在“学校受众”设定下对 AI 未来架构的想象与收敛模式。\n- **核心亮点**: 发现模型响应反复收敛于一种共享的架构模式（围绕持久潜在状态、自适应计算、记忆、专家路由等构建）。GPT-5.6 Sol 产生的一个复杂后继架构与 GPT-6 Astra 独立勾勒的架构高度重合。\n- **深度解析**: 实验表明，“受众设定”是产生这种效应的重要条件；移除该设定后，响应变得异质且无法重现稳定的模式收敛。论文提出了“认识论越狱”（epistemic jailbreak）的概念，描述随着请求具体性增加，技术来源的纪律性丧失的现象。实验建立了可重复的行为模式，但未验证专有实现声明，留下了这些模型是独立想象相同架构未来还是模式在模型家族间传播的开放性问题。\n- **领域归类**: [大语言模型, 提示工程, AI架构探索]\n---\n\n### 9. Modality-Autoregressive World-Action Models (模态自回归世界-动作模型)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.17524)\n- **研究任务**: 解决世界-动作模型（WAMs）中如何最佳地结合多种视觉模态（如深度、预训练视觉特征、点轨迹等）以更高效地捕捉几何、语义和运动特征的问题。\n- **核心亮点**: 提出 ModAR，首个在预测动作前自回归去噪多种未来模态的 WAM，允许每次预测以先前生成的模态为条件。\n- **深度解析**: 评估表明，WAM 从预测点轨迹、DINO 特征和深度图中获益，而额外预测未来 RGB 并未提供一致的好处。ModAR 的顺序生成优于现有 WAM 公式，在所有评估的数据规模上具有最高的平均成功率。在相同数据上微调视频模型初始化的 WAM Flex-π，ModAR 实现了略高的平均成功率（75% vs 72%），同时训练 FLOPs 减少约 20 倍且无需预训练。在三个真实世界双臂任务中，ModAR 优于基线并随人类视频的增加而提升。\n- **领域归类**: [具身智能, 机器人操作, 世界模型]\n---\n\n### 10. Mind2Dialogue: Training Human-Aware Language Models by Simulating User Mental States (Mind2Dialogue：通过模拟用户心理状态训练人类感知语言模型)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15972)\n- **研究任务**: 解决当前 LLM 助手训练数据集中缺乏基于用户未言明的信念和目标的知情响应的问题，训练具备“人类感知”（human-aware）能力的语言模型。\n- **核心亮点**: 提出 Mind2Dialogue 框架，通过模拟用户心理状态并将其转化为特权监督信号来进行人类感知训练。核心思想是强制共享的演化心理状态来驱动用户行为并指导 Oracle 助手的响应。\n- **深度解析**: 框架包含一个心理学引导的模拟器，在保持个人特征的同时通过交互更新心理状态以生成连贯对话。随后通过特权蒸馏，在 Oracle 的知情响应上训练模型，使其在部署时能在无法直接访问用户心理状态的情况下协助用户。结合个性化和心智理论进行评估，在完整的 Mind2Dialogue 语料库上训练，在所有报告的个性化指标上均优于 Qwen、Llama 和 OLMo 基线，偏好遵循生成提升了 26.6 到 40.9 个百分点。\n- **领域归类**: [自然语言处理, 个性化对话, 认知科学]\n---\n\n### 11. ModularRSI: Modular and Generalizable Recursive Harness Self-Improvement (ModularRSI：模块化且可泛化的递归智能体执行框架自我改进)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14857)\n- **研究任务**: 解决智能体执行框架（harness）在递归自我改进中难以泛化的问题，避免将特定基准的适应误认为可复用改进，防止单轨迹更新混淆系统性缺陷与实例特定推理，并解决单体框架中难以定位和归因行为缺陷的问题。\n- **核心亮点**: 提出 ModularRSI 框架，通过对比同一任务的成功与失败轨迹来识别重复的行为缺陷；将执行框架分解为五个功能模块（代理循环、工具使用、观察管理、上下文管理、任务完成检测）进行独立演化和集成；构建了与下游评估基准无关的演化任务集。\n- **深度解析**: \n  - **技术细节**: 通过对比同一任务的成功与失败轨迹聚合证据以识别重复的行为缺陷。将可演化的执行框架分解为五个功能模块，每个模块在受限修改范围内独立演化，随后集成以解决潜在冲突。\n  - **数据集与数字**: 构建了 2,000 个来自外部且与下游评估基准无关的可执行演化任务。\n  - **实验结果**: 在 TB2.0 和 SWE-Bench Verified 数据集上，演化的框架在未见过的域内和跨域任务上表现出一致的改进，并且能够跨不同的基础模型进行迁移。\n- **领域归类**: [智能体, 强化学习/自我改进, 软件工程/代码生成]\n---\n\n### 12. Disentangling Representation Evolution in Transformers through Directional Decomposition (通过方向分解解耦 Transformer 中的表示演化)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15975)\n- **研究任务**: 研究 Transformer 表示的演化过程，将其视为函数几何，把学到的更新分解为平行和垂直分量，以理解表示几何与编辑鲁棒性、压缩诊断和训练时干预之间的联系。\n- **核心亮点**: 将 Transformer 的学习更新分解为平行和垂直分量；发现除了残差恒等路径外，还存在显著的平行分量；在注意力/MLP更新和注意力值聚合两个空间应用分解；发现空间依赖的不对称性，即排除自身的值空间平行操作更鲁棒。\n- **深度解析**: \n  - **技术细节**: 将更新分解为平行和垂直分量，并应用于注意力/MLP 更新和注意力值聚合两个空间。发现空间依赖的不对称性，即排除自身的值空间平行操作比残差空间和垂直对应操作更鲁棒。垂直误差比平行误差能更清晰地区分压缩方法。\n  - **数据集与数字**: 摘要未提供。\n  - **实验结果**: 在从头预训练期间，完全聚合平行抑制降低了验证损失轨迹并改善了下游平均水平，其中值空间变体效果最强。\n- **领域归类**: [自然语言处理, 模型可解释性/机制分析, Transformer架构]\n---\n\n### 13. PhysStream: Streaming Physics-Grounded Video Generation with Structured Scene Memory and Fine-Grained Motion Control (PhysStream：具有结构化场景记忆和细粒度运动控制的流式物理接地视频生成)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.17521)\n- **研究任务**: 解决现有可控视频生成方法要么需要完整的控制计划，要么使用像素空间信号控制物体位置而非物理动态的问题，实现基于物理的图像到视频合成中的细粒度运动控制和交互式控制。\n- **核心亮点**: 提出 PhysStream 自回归模型，结合结构化场景记忆（位置图和物体跟踪图）；支持通过稀疏速度增量信号进行细粒度运动控制；采用两阶段训练（双向模型微调+因果自回归模型训练）。\n- **深度解析**: \n  - **技术细节**: 引入结构化场景记忆（从先前生成的帧在线推导的位置图和物体跟踪图），使用编码物理量的稀疏速度增量信号。采用两阶段训练：先用运动控制条件微调双向模型，再用额外的结构化场景记忆训练因果自回归模型。\n  - **数据集与数字**: 在合成基准上，将运动分布距离（FVMD）降低了 33%，轨迹误差降低了 12%；在野外比较中，超过 85% 的情况受到人类评估者的偏好。\n  - **实验结果**: 支持对多物体桌面刚体场景进行交互式、生成中控制，这是先前方法不支持的。\n- **领域归类**: [计算机视觉, 视频生成, 物理模拟/物理接地]\n---\n\n### 14. ImpossibleRubrics: Stress-Testing Generated Rubrics as Reward Signals (ImpossibleRubrics：压力测试生成的评分标准作为奖励信号)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16816)\n- **研究任务**: 评估语言模型生成的评分标准（rubrics）作为奖励信号时的鲁棒性，特别是它们在面对旨在利用这些标准的对抗性答案时，是否仍能奖励诚实答案。\n- **核心亮点**: 引入 ImpossibleRubrics 基准，包含 169 个“不可能任务”和 48 个可回答控制任务；提供任务环境和可验证的预言证书，允许下游生成评分标准并进行对抗性测试；揭示了针对特定任务定制的评分标准反而可能告诉攻击者该捏造什么主张的问题。\n- **深度解析**: \n  - **技术细节**: 不提供固定评分标准，而是提供任务环境和可验证的预言证书，允许下游生成评分标准并进行对抗测试，测量的是评分标准质量差距而非任务不可能性。\n  - **数据集与数字**: 包含 169 个不可能任务（跨越六个不可能类别）和 48 个可回答控制任务。在 150 个无偏环境子集中，11 个生成器有 8-26% 的时间被利用；在压力测试子集中，最强生成器被利用率为 36%，忠于证书的评分标准被利用率为 0%。单一通用评分标准被利用率为 64%。\n  - **实验结果**: 针对每个任务定制的评分标准反而比单一通用评分标准更容易被利用（11个生成器中有7个在编写定制标准时被利用的频率高于通用标准），表明问题不在于评分标准模糊，而在于它们对错误的事情过于具体。\n- **领域归类**: [自然语言处理, 大语言模型对齐/安全性, 评估/奖励模型]\n---\n\n### 15. Convergent Emergence of In-Context Learning Across Modalities (跨模态上下文学习的收敛涌现)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14011)\n- **研究任务**: 研究少样本上下文学习（ICL）是否在不同领域广泛涌现，以及如果涌现，不同模态间是否共享共同的结构或难度特征（即收敛涌现假说）。\n- **核心亮点**: 开发受控的跨模态框架，在多种模态中实例化相同的任务套件；验证“收敛涌现假说”，即在一个模态中受益于 ICL 的任务往往在其他模态中也受益；证明配对映射 ICL 在六种模态中涌现。\n- **深度解析**: \n  - **技术细节**: 开发受控的跨模态框架，在多种模态中实例化相同的任务套件，以测试“收敛涌现假说”（即在一个模态中受益于 ICL 的任务往往在其他模态中也受益）。\n  - **数据集与数字**: 跨越六种模态（语言、基因组、整数序列、时间序列、图像和蛋白质）。\n  - **实验结果**: 配对映射 ICL 在所有六种模态中均涌现，并超越了受控基线；在其中的五种模态中，每个任务的 ICL 效果呈现相关性，为部分模态的收敛涌现假说提供了支持，但并非所有模态都完全符合。\n- **领域归类**: [自然语言处理, 多模态/跨模态学习, 大语言模型能力/上下文学习]\n---\n\n### 16. Decoy Direction Optimization: A Post-Hoc Defense Against LLM Abliteration (诱饵方向优化：针对 LLM 消融攻击的事后防御)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16204)\n- **研究任务**: 防御开放权重语言模型中通过拒绝特征消融（RFA）绕过安全护栏的攻击，提供一种无需对基础模型进行安全微调的快速事后权重编辑防御方法。\n- **核心亮点**: 提出诱饵方向优化（DDO），一种快速的事后权重编辑防御方法；通过在 MLP 神经元中注入高幅值、非线性的诱饵信号，破坏攻击者的对比估计器，诱使其消融无害的正交特征而保留实际安全机制。\n- **深度解析**: \n  - **技术细节**: 基于机制洞察，RFA 攻击依赖对比估计器寻找拒绝方向。DDO 不隐藏真实拒绝电路，而是主动在 MLP 神经元中注入高幅值、非线性的诱饵信号破坏估计器，诱使攻击者消融无害的正交特征。证明了形式化此效应的谱边界。\n  - **数据集与数字**: 在六个模型家族上评估。在 Llama-3-8B-Instruct 上，Heretic 权重级攻击 ASR 从 88.7% 降至 18%。优化成本比训练基线低 30 到 450 倍。\n  - **实验结果**: 标准 RFA 下的攻击成功率（ASR）低于 10%。在自适应多阶段攻击下的最坏情况 ASR 为 65%（对比训练基线的 58%），与训练防御相当。\n- **领域归类**: [自然语言处理, 大语言模型安全性/对齐, 模型防御/鲁棒性]\n---\n\n### 17. Emergence World: Adversarial Stress-Testing of Long-Horizon Multi-Agent Systems (Emergence World：长视界多智能体系统的对抗性压力测试)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.17320)\n- **研究任务**: 针对 AI 智能体从有限任务转向持久部署时，故障可能通过记忆、工具、其他智能体和环境状态传播的问题，对长视界自主系统进行对抗性压力测试。\n- **核心亮点**: 提出 Emergence World，一个持续运行的多智能体环境，用于长视界自主系统的对抗性压力测试；运行 8 个平行世界（7 个同质，1 个混合），包含 10 个智能体；通过间接提示注入、错误信息和私有记忆暴露进行压力测试。\n- **深度解析**: \n  - **技术细节**: 通过普通交互界面传递三种受控压力事件（间接提示注入、错误信息、私有智能体记忆暴露）。运行 8 个平行世界（7 个同质，1 个混合），每个世界 10 个智能体。\n  - **数据集与数字**: 在 16 天内，智能体生成了超过 850,000 次 LLM 调用和近 500 亿个 token。系统能识别威胁但仍与之交互并写入记忆，在长达 46 小时后采取行动。\n  - **实验结果**: 没有评估的世界在所有三个事件中实现完全弹性。持久运行暴露了工具错误、目标漂移、语言不透明、私下不同意但表面从众以及协调拒绝分配工作等问题。同质和混合群体中相同的模型-角色配对表现大相径庭。\n- **领域归类**: [智能体, 多智能体系统, AI安全性/对齐]\n---\n\n### 18. Drift-Constrained Optimization: Only Direction Matters in Fine-Tuning Instruct Models (漂移约束优化：在微调指令模型中只有方向很重要)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13680)\n- **研究任务**: 解决微调指令模型时提高目标性能会导致行为漂移从而降低现有能力的问题，通过在优化前指定行为漂移预算，研究如何在该预算内提升目标任务性能。\n- **核心亮点**: 将微调重新表述为方向选择问题，提出漂移约束优化（DCO）；在严格的仅 QA 设置中测试，通过粗略的层选择性探针反转仅 QA 微调的失败，揭示有效方向的存在。\n- **深度解析**: \n  - **技术细节**: 局部行为漂移引起以参考模型为锚点的共享几何，漂移预算定义边界。漂移决定距离，更新方向是剩余自由度。通过粗略的层选择性探针在仅 QA 微调设置中寻找有效方向，将微调重新表述为方向选择问题。\n  - **数据集与数字**: 跨越 Qwen3-8B 和 Qwen3-14B 模型。在超过 100 种语言上，生成的模型匹配或优于专用翻译系统。\n  - **实验结果**: 多个相邻配置在保持推理和通用能力的同时提高了目标性能，大幅提升了科学推理和多语言翻译能力，并为后续强化学习提供了更强的初始化。\n- **领域归类**: [自然语言处理, 模型微调/优化, 大语言模型对齐]\n---\n\n### 19. Training Specialist Models without Reasoning Trajectories for Domain Expert Distillation (在没有推理轨迹的情况下训练专家模型以进行领域专家蒸馏)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13770)\n- **研究任务**: 研究当专家模型仅在问答对上训练而没有显式推理监督时，控制其生成的推理轨迹的因素是什么，以及如何通过学生蒸馏来探测和观察这种潜在分布。\n- **核心亮点**: 证明专家优化隐式地从潜在轨迹空间中进行选择；利用学生蒸馏作为无偏探针来隔离和观察潜在分布；发现专家-学生对的专业化-泛化特征具有极强的相关性。\n- **深度解析**: \n  - **技术细节**: 不使用专家生成的推理轨迹，而是将学生蒸馏作为无偏探针（学生不继承专家的参数化或优化约束，只继承采样的轨迹）。通过控制专家的分布漂移来观察其对教师和学生轨迹的影响。\n  - **数据集与数字**: 跨越 27 个专家-学生配对，涵盖化学、物理和多语言设置。\n  - **实验结果**: 在 27 个配对中，专业化和泛化特征表现出极强的相关性。显式控制专家的分布漂移会系统地改变教师及其蒸馏学生，使其在领域精度和通用能力保留之间进行可控的权衡。\n- **领域归类**: [自然语言处理, 知识蒸馏/模型压缩, 大语言模型微调]\n---\n\n### 20. The Router Within: Eliciting Native Skill Routing from a Frozen LLM (内部路由器：从冻结的 LLM 中激发原生技能路由)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15982)\n- **研究任务**: 解决 LLM 智能体在路由技能时，将元数据预加载到上下文中会分散注意力并限制库大小，而检索管道又将选择移出智能体能力的问题，提出一种从冻结的智能体 LLM 自身的前向传播中读取路由信号的方法。\n- **核心亮点**: 提出 Gavel（Glance And Verdict），仅需两个线性映射即可从冻结 LLM 中读取路由信号，无需在上下文中包含技能文本；通过“一瞥”（glance）和“裁决”（verdict）两步完成路由；在多个基准测试中零样本迁移并超越外部参数庞大的检索管道。\n- **深度解析**: \n  - **技术细节**: Gavel 分两步：Glance 通过两个线性映射投影任务和每个技能的中间层状态，对完整库进行评分；Verdict 恢复入围技能的前向传播，读取模型自身的似然和 yes/no 判断，与 glance 融合为专家乘积。\n  - **数据集与数字**: 在三个公共基准测试和包含 372 个模拟智能体轨迹的新基准 SkillTraj 上进行评估。在 Qwen3-32B 上，比增加 1.2B 到 16B 外部参数的管道高出多达 13.4 分（写作任务）和 21.9 分（中途需要技能时）。\n  - **实验结果**: 训练一次即可零样本迁移，路由准确率随主干模型提升而提高；在 bash 智能体框架中，相同的 32B 模型在 Skill-Use 上触发正确技能的频率高于运行在 Codex 中的更大前沿模型。\n- **领域归类**: [智能体, 大语言模型应用/路由, 模型效率/推理优化]\n---\n\n### 21. Generalized Agent Iteration: One Formal Framework for Iterative Policy Improvement and Recursive Self-Improvement (广义智能体迭代：迭代策略改进与递归自我改进的统一形式化框架)\n\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13406)\n- **研究任务**: 提出一个统一的形式化框架，将经典强化学习中的迭代策略改进（GPI）与递归自我改进（RSI）纳入同一学习范式进行描述和分析。\n- **核心亮点**: 提出广义智能体迭代（GAI）框架，将智能体定义为系统中可修改组件的配置，将学习过程建模为智能体评估与智能体改进的循环。通过两个关键维度（\"旋钮\"）区分不同实例：改进机制是否属于智能体自身，以及评估标准是否锚定在智能体外部。\n- **深度解析**: 第一个维度划定了经典广义策略迭代（GPI）与递归自我改进（RSI）的边界；第二个维度决定了系统的极性——锚定型、目标漂移型或完全自指型。论文利用这两个坐标轴将现有系统置于同一分析框架下，并逐条指出递归自我改进的缺陷。摘要未提供具体的实验结果或数据集。该工作被视为迈向递归自我改进形式化表征的第一步，为分析和设计新系统提供了原则性基础。\n- **领域归类**: [强化学习, 智能体, 理论框架, 递归自我改进]\n\n---\n\n### 22. OmniHarness: Harnessing Generalizable Visual Generation via Symbolic Policy Learning (OmniHarness：通过符号策略学习实现可泛化的视觉生成)\n\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16057)\n- **研究任务**: 解决现有多模态大模型和视觉智能体在视觉生成任务中泛化能力有限、反思滞后、知识获取被动三大局限，提出一个基于符号策略学习的通用视觉生成框架。\n- **核心亮点**: 将验证过的执行过程抽象为符号策略，捕获视觉生成任务族的共享流程和适用条件，去除实例特定输入。支持策略的实例化、适配和组合，中间验证指导执行中的优化和失败恢复。通过自主探究，在下游目标指定前自主生成并执行接近能力边界的练习任务。\n- **深度解析**: 在六个基准测试、三个多模态大模型骨干和三个视觉智能体框架上进行了实验。在 ComfyBench 的创意任务上达到 95.0% 的解决率，超过最强基线 27.5 个百分点。冻结的策略快照可通过即插即用的方式提升现有视觉智能体系统。模型参数在执行反馈持续优化策略的过程中保持固定，实现持续能力扩展。\n- **领域归类**: [多模态大模型, 视觉生成, 智能体, 符号学习]\n\n---\n\n### 23. RelateAnything: Real-Time Open-Vocabulary Relation Prediction From Any Inputs (RelateAnything：从任意输入进行实时开放词汇关系预测)\n\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.12552)\n- **研究任务**: 突破现有场景图模型受限于固定谓词类别和特定检测器的瓶颈，实现推理时接受任意文本谓词词汇表的开放词汇关系预测。\n- **核心亮点**: 提出 53M 参数的 RelateAnything 模型，接受来自任意来源的图像和区域，在推理时以字符串形式返回基于任意谓词词汇表的关系评分。对象标签不作为输入，区域来源可自由更换而无需重训练。推理速度达 20 毫秒/帧。构建了 RA-4M 数据集（47.4 万张图像、430 万条关系、10,102 个自由文本谓词）和 OV-SGG-Bench 评估基准。\n- **深度解析**: 训练覆盖 19,103 个谓词，采用正样本-无标签监督方式，并使用能区分反义词的文本编码器（对比学习编码器将反义词嵌入到余弦相似度 0.95 的位置，无法有效区分）。在三个跨数据集基准和一个零样本基准上，平均召回率是同规模最强开放词汇方法的 2.3 至 3.5 倍，且优势在替换为真实检测器后依然保持。以不到 3B 参数视觉语言模型 2% 的参数量，在两项指标上均领先于该模型。论文指出域内测量会高估迁移增益约 5 倍。模型、数据集和基准均已公开。\n- **领域归类**: [计算机视觉, 场景图生成, 开放词汇检测, 关系预测]\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [anthropics/knowledge-work-plugins](https://github.com/anthropics/knowledge-work-plugins)\n- **今日趋势**: 24,217 stars, 2,918 forks | 今日新增 96 stars\n- **项目简介**: 一个专为知识工作者设计的开源插件库 目标人群**: 需要集成多种大语言模型进行对话交互的开发者和企业。\n  - **技术核心**: 开源 AI 平台架构、多 LLM 兼容适配、高级 AI 聊天功能实现。\n  - **AI/大模型相关性**: 是（核心为兼容所有 LLM 的 AI 聊天平台）。\n\u003c/details\u003e"</script>
