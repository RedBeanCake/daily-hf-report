- **社区热度**: `👍 60 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.04425)
- **研究任务**: GUI 智能体持续学习
- **核心亮点**: 提出多平台在线策略蒸馏方法，解决 GUI 智能体跨平台持续学习中的遗忘问题。
- **深度解析**: 针对智能体在不同操作系统或界面环境下学习新任务时容易忘记旧技能的问题，该方法采用在线策略蒸馏技术。通过在多个平台间共享策略知识，约束模型更新方向，使智能体在不断学习新界面操作的同时，保留原有的交互能力，无需重新训练旧数据。
