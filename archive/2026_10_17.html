    <h1>前沿科研情报 - 2026-10-17</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. OmniCompass: A Holistic Benchmark for Omni-Modal Video Grounding and Understanding (OmniCompass：全模态视频定位与理解的全方位基准)\n- **社区热度**: `👍 442 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18829)\n- **研究任务**: 评估多模态大语言模型（MLLMs）在全模态（视觉和听觉）视频定位（时间、空间）和问答方面的理解能力。\n- **核心亮点**: 提出OmniCompass基准，分为视觉-语言（VL）和全模态（AV）两个赛道，每个赛道包含时间定位、空间定位和问答任务。所有实例均经过人工标注和多轮质量验证。\n- **深度解析**: 数据集包含820个视频/2460个实例（VL赛道）和240个视频/720个实例（AV赛道）。评估了50个MLLMs，结果显示开源模型仍落后于闭源模型，尤其在音视频理解方面；精确的时间和空间定位对领先模型仍具挑战，且预测在不同目标规范下存在不一致性。\n- **领域归类**: [多模态大模型, 视频理解, 基准测试]\n---\n\n### 2. Waypoint-OPD: Transferring RL-Induced Policy Shifts via Gated On-Policy Distillation (Waypoint-OPD：通过门控在策略蒸馏转移强化学习诱导的策略偏移)\n- **社区热度**: `👍 431 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21601)\n- **研究任务**: 改进强化学习（RL）训练后的策略偏移蒸馏方法，解决端点策略偏移无法反映局部动作偏好演变一致性的问题。\n- **核心亮点**: 提出Waypoint-OPD方法，利用RL运行中的中间教师检查点，比较早期和晚期策略偏移的方向一致性，并据此对端点偏移进行门控，在方向相反时进行抑制。\n- **深度解析**: 使用RL训练的Qwen3-4B作为教师，Qwen3-8B、14B和30B-A3B作为学生，在数学和代码推理任务上评估。在所有6个领域-学生设置中取得最高平均分。消融实验表明，移除或打乱门控会降低数学推理性能。\n- **领域归类**: [大模型蒸馏, 强化学习, 模型对齐]\n---\n\n### 3. OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use (OpenGCUA：迈向通用计算机使用的完全开源技术栈)\n- **社区热度**: `👍 262 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22200)\n- **研究任务**: 开发并开源通用计算机使用代理（GCUA）的完整技术栈，使模型能够通过视觉和编程接口在用户计算机上完成任务。\n- **核心亮点**: 将代码执行作为代理设计的关键特征；提出harness-to-model决策转移，将选定的观察和任务状态决策从固定的harness规则转移到模型；发布跨设备SDK和真实设备harness初步版本。\n- **深度解析**: 在OSWorld-v2上评估了8个模型（包括GPT-6 Astra和Claude Opus 5），完整配置使平均部分得分提高19.6分，每任务步骤减少53.0%。在4个真实macOS任务中，Qwen3.8-Max使用的推理token是GPT-6 Astra的19.4倍。\n- **领域归类**: [AI Agent, 计算机使用, 开源工具]\n---\n\n### 4. FDE-Gym: The Last Mile of AI Delivery (FDE-Gym：AI交付的“最后一公里”)\n- **社区热度**: `👍 227 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22350)\n- **研究任务**: 评估AI代理在真实客户交付场景中的能力，要求代理澄清模糊需求、在实时系统中工作并发现未说明的约束条件。\n- **核心亮点**: 提出FDE-Gym基准，包含来自18个行业20个客户场景的95个端到端交付任务。在模拟客户环境中，代理与利益相关者交互并操作类生产系统，通过客户成功指标的提升来评分。\n- **深度解析**: 评估了7个提供商的13种模型配置。在现实设置中，最佳配置平均得分为0.56，仅解决95个任务中的14个。发现未说明的约束是主要瓶颈；即使在23个获取所有关键事实的任务中，也只有10个达到0.8以上的业务提升。\n- **领域归类**: [AI Agent, 基准测试, 软件工程]\n---\n\n### 5. RoTA-Bench: Evaluating 3D Spatial Reasoning through Interactive Projection Alignment (RoTA-Bench：通过交互式投影对齐评估3D空间推理)\n- **社区热度**: `👍 197 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17665)\n- **研究任务**: 评估视觉-语言模型将2D观察转化为支持精确动作的3D理解的能力，包括推断物体几何形状、预测旋转效果并通过视觉反馈优化动作。\n- **核心亮点**: 提出RoTA-Bench，通过交互式3D到2D投影对齐进行评估。给定目标轮廓，模型观察旋转物体并在有限动作预算内选择连续旋转以恢复目标投影。\n- **深度解析**: 构建了674个任务和100个任务的测试集。GPT-5.6-Sol仅成功完成17%的任务，而人类参与者成功率100%。模型在图像空间和姿态空间的进展存在分歧（19.4% vs 10.9%）。移除交互历史会使96.8%的模型动作停留在粗略的30度步长，大幅降低成功率。\n- **领域归类**: [3D视觉, 空间推理, 基准测试]\n---\n\n### 6. Self-Evolving Agent Harness (Self-Evolving Agent Harness：自进化智能体运行环境)\n- **社区热度**: `👍 185 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18813)\n- **研究任务**: 研究智能体软件脚手架（Harness，包括提示、记忆、工作流和可执行组件）的自进化，在保持模型权重固定的情况下通过反馈驱动的过程修改脚手架。\n- **核心亮点**: 形式化了反馈驱动的自进化过程，使接受的修改在运行间持久化。框架将更新目标与提议和准入机制分离，通过进化优化表征搜索，并通过持续PAC学习检验其可靠性。\n- **深度解析**: 摘要未提供\n- **领域归类**: [AI Agent, 系统架构, 自进化系统]\n---\n\n### 7. MJev-Spatial: System One Spatial Intelligence via Native Attention Matching (MJev-Spatial：通过原生注意力匹配实现系统一空间智能)\n- **社区热度**: `👍 138 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22276)\n- **研究任务**: 解决视觉-语言模型在空间理解任务中由于自回归解码带来的效率问题，实现快速的空间智能决策（如空间关系判断、距离估计、位置预测）。\n- **核心亮点**: 提出MJev-Spatial，一个系统1多模态决策模型，在统一的分类框架下处理空间任务。将每个候选视为一个类别，使用骨干网络预训练的query和key投影进行打分，不增加参数，推理时单次前向传播且不生成答案token。\n- **深度解析**: 基于Qwen3.5-4B构建，在12.3M个QA对上训练。在8个测试模型中取得最高总分（65.64%），在12个基准中的7个排名第一。比最快自回归基线快2.5倍，比基础模型快5.6倍，训练吞吐量提高30.8%。\n- **领域归类**: [多模态, 空间智能, 模型推理优化]\n---\n\n### 8. Learning Where to Split: Dynamic Band Splitting for Audio Source Separation (Learning Where to Split：用于音频源分离的动态频带分割)\n- **社区热度**: `👍 130 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14993)\n- **研究任务**: 音频源分离，旨在保留精细的频谱结构同时保持分离器的计算成本可控，解决固定频带边界无法适应不同混合音频内容的问题。\n- **核心亮点**: 提出动态频带分割（DBS），一个端到端框架，在固定的频带token预算下，根据每个混合音频的内容自适应调整边界位置和频带宽度。通过预测内容条件的边界分数，使用硬Top-K选择边界并应用内容相关的池化。\n- **深度解析**: 在DnR v2、MUSDB18-HQ和EchoSet数据集上评估，DBS-BSRNN在DnR v2上的平均SI-SDR相对提升29.0%。证明了内容自适应的频率划分在固定频带token预算下对多种分离器骨干网络有益。\n- **领域归类**: [音频处理, 源分离, 深度学习]\n---\n\n### 9. InfiniSplat v2: Analyzing and Improving Feed-Forward 3DGS from Any Views (InfiniSplat v2：分析与改进任意视角的前馈3D高斯溅射)\n- **社区热度**: `👍 114 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20341)\n- **研究任务**: 前馈高斯重建，直接从输入图像构建3D场景以进行新视角渲染，解决在大视角变化下从预测几何中学习高斯属性以实现高质量渲染的挑战。\n- **核心亮点**: 提出InfiniSplat v2，通过架构和训练改进渲染质量。解耦几何和属性预测（使用冻结的几何分支），在训练期间使用真实相机位姿对齐预测的高斯，并采用大角度目标视角监督。\n- **深度解析**: 在6个数据集上评估，同一训练模型的前馈输出在位姿条件和无位姿设置下均取得SOTA的平均LPIPS和DISTS。在位姿条件设置下，平均LPIPS和DISTS分别比最强基线降低25.8%和32.9%。发现仅使用图像重建监督学习的不透明度可以抑制几何不一致的点。\n- **领域归类**: [3D视觉, 新视角合成, 3D高斯溅射]\n---\n\n### 10. 3DCodeVerse: Exploring 3D Worlds as Code (3DCodeVerse：将3D世界作为代码进行探索)\n- **社区热度**: `👍 97 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22341)\n- **研究任务**: 构建一个研究生态系统，使编码代理能够大规模创建可编辑和可验证的3D内容。\n- **核心亮点**: 提出3DCodeVerse生态系统，包含大规模高质量可执行3D代码数据集（3DCodeVerse-2M）、用于空间推理和自动验证的多智能体DAG编码harness，以及3D编码的实践指导。\n- **深度解析**: 构建了3DCodeVerse-2M数据集。harness使用执行检查、空间测量和视觉反馈自动评估和修改程序。微调后开源模型的3D编码能力显著提高。在人类评估中，当两者均由Claude Opus 5.5使用时，3DCodeVerse harness对Claude Design (3D Object) 的胜率达到90%。\n- **领域归类**: [3D生成, 代码生成, AI Agent]\n---\n\n### 11. MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments (MAI-Gym：一个用于跨移动和计算机环境的 GUI 智能体评估与强化学习训练的全能开源平台)\n- **社区热度**: `👍 92 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20939)\n- **研究任务**: GUI 智能体的评估、数据收集以及跨环境（移动、计算机和 Web）的在线强化学习（RL）训练。\n- **核心亮点**: 提出 MAI-Gym 开源平台，统一了 GUI 智能体的评估、数据收集和在线 RL 训练；通过共享 rollout 管道确保评估和训练行为一致，支持 10 个基准并扩展至 20,000 个并行环境实例；支持自动化合成多样化 GUI 应用和任务（包括可重置的模拟应用和跨应用世界）；训练出 MAI-Gym-9B 模型，在开源 10B 以下 GUI 智能体中取得最佳表现，且模拟环境训练可成功迁移至真实物理手机。\n- **深度解析**: 针对 GUI 智能体在 RL 训练中面临的交互环境成本高和真实训练任务稀缺的问题，MAI-Gym 提供了可扩展的基础设施和自动化任务合成能力。实验结果显示，MAI-Gym-9B 在 MobileWorld 上达到 78.4%，在 OSWorld-Verified 上达到 76.2%。更重要的是，在模拟火车票应用中进行的 RL 训练迁移到真实手机后，任务成功率从 28.8% 提升至 48.1%。团队开源了框架、合成技能、模拟应用、2,000 个验证任务及模型权重。\n- **领域归类**: [强化学习, 智能体, GUI交互, 多模态]\n---\n\n### 12. SCOPE: Semantic Bounded Credit Optimization for Prompt Engineering in Text-to-image Generation (SCOPE：用于文本到图像生成中提示词工程的语义边界信用优化)\n- **社区热度**: `👍 76 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22264)\n- **研究任务**: 利用强化学习（RL）优化文本到图像（T2I）生成中的提示词重写（Prompt Engineering）。\n- **核心亮点**: 提出 SCOPE 方法，基于 GRPO（Group Relative Policy Optimization），将更新权重与语义结构（如对象、数量、属性、关系等语义跨度）对齐；重写器联合生成增强提示词及其语义划分；在语义跨度内池化策略对数概率的偏移，为 token 损失推导共享系数，无需单独的跨度奖励或额外的图像渲染。\n- **深度解析**: 现有方法通常将单一图像信号应用于单个子词 token，忽略了自然语言中的语义跨度结构。SCOPE 通过引入语义边界和跨度内池化作为归纳偏置来解决这一问题。在 Qwen-Image、SD3 和 FLUX.1-dev 上的实验表明，相比 vanilla GRPO，SCOPE 在 GeneVal 上平均相对提升 9.48%，在 T2I-CompBench 上提升 7.62%。消融实验证实，语义边界和跨度内池化对性能提升均有实质性贡献。\n- **领域归类**: [文本到图像生成, 强化学习, 提示词工程, 多模态]\n---\n\n### 13. Speculative Forcing for Efficient Autoregressive Video Generation (推测强制：用于高效自回归视频生成)\n- **社区热度**: `👍 69 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22347)\n- **研究任务**: 提高少步自回归视频生成器（支持流式生成）的计算效率，减少不必要的去噪步骤。\n- **核心亮点**: 提出 Speculative Forcing 框架，将中间清洁估计视为草稿，预测单个 token 何时可以安全地提前接受；一旦接受，token 被冻结为最终输出，不再进行去噪，其缓存的键值仍可作为上下文；探索了两种验证器设计：基于清洁内容相似性和跨步稳定性的免训练验证器，以及读取冻结生成器中间特征以估计剩余差距的学习验证器。\n- **深度解析**: 现有的少步自回归视频生成器对每个 token 都运行最终去噪步骤，造成计算浪费。该框架发现许多 token 在初始步骤已接近最终输出。在 LongLive 数据集上，该方法匹配四步生成器的质量，每个 token 仅需约 1.7 个去噪步骤，速度提升超 1.5 倍（达到 41.7 和 37.8 fps）。在 Lingbot-World 2.0 数据集上，每个 token 约需 2.5 个去噪步骤，速度提升 1.35 倍（达到 24.5 fps），同时保持了生成质量。\n- **领域归类**: [视频生成, 自回归模型, 推理加速, 计算机视觉]\n---\n\n### 14. VLA-Δ: Learning Physical State Transition for Vision-Language-Action Models (VLA-Δ：为视觉-语言-动作模型学习物理状态转换)\n- **社区热度**: `👍 53 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21306)\n- **研究任务**: 改进视觉-语言-动作（VLA）模型在机器人控制中的表现，解决其容易过拟合观察-动作对应关系而缺乏中间物理状态监督的问题。\n- **核心亮点**: 提出 VLA-Δ 框架，使用当前状态和未来状态之间的物理变化作为显式学习目标；构建大规模预训练数据集并推导物理状态转换注释（涵盖任务相关语义和视觉运动变化），为连续动作生成提供更直接的监督；推理时直接从当前观察生成动作，无额外推理开销。\n- **深度解析**: 大多数 VLA 模型直接映射观察到动作，或在语言/视觉/潜在空间引入中间推理，但未显式监督物理状态转换本身。VLA-Δ 填补了这一空白。实验表明，VLA-Δ 在 LIBERO 和 RoboTwin 基准上取得了与最先进方法相当的性能，并在真实机器人实验中优于 π_{0.5} 模型。\n- **领域归类**: [机器人控制, 视觉-语言-动作模型, 具身智能, 多模态]\n---\n\n### 15. Mosaic: Multi-Session Agentic Reinforcement Learning (Mosaic：多会话智能体强化学习)\n- **社区热度**: `👍 46 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22174)\n- **研究任务**: 解决智能体强化学习中单会话训练假设与推理时多会话执行（如上下文压缩、子智能体分叉）不匹配的问题。\n- **核心亮点**: 引入多会话智能体强化学习设定，支持轨迹中包含任意数量的会话；提出 Mosaic 方法，采用无评论家（critic-free）的分层优化；在轨迹级别将会话使用信号纳入优势估计，在会话级别根据估计的边际贡献塑造每个会话的优势。\n- **深度解析**: 现有方法通常将轨迹级优势广播到所有会话，无法区分各会话贡献或指导会话分配。Mosaic 在 BrowseComp 数据集上使用 Qwen3.5-4B 进行实验，在上下文压缩和子智能体分叉场景中均优于广播方法，且平均使用更少的会话。分析表明，该方法在会话效用和分配上实现了显著改进。\n- **领域归类**: [强化学习, 智能体, 大语言模型, 多会话交互]\n---\n\n### 16. Intern Lumina U2: A Multi-Codebook Diffusion Large Language Model for Omni-Visual Understanding and Image Generation (Intern Lumina U2：用于全视觉理解与图像生成的多码本扩散大语言模型)\n- **社区热度**: `👍 39 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20818)\n- **研究任务**: 在单一主干网络中高效建模高容量视觉表示与文本内容，实现统一的离散、连续和混合多模态生成（理解、生成、编辑）。\n- **核心亮点**: 提出 Intern Lumina U2，据称是首个在完全离散空间中表示多码本视觉 token 的扩散语言模型；每个视觉位置由互补码本的一组代码表示；输入端拼接嵌入，输出端使用轻量级多码本自回归头顺序预测代码，扩散主干并行处理所有位置；基于 AToken 的统一 4D 表示，支持图像、视频和 3D 输入；提出稳定性感知采样策略，将图像生成加速 4.45 倍。\n- **深度解析**: 针对单码本离散方法表示能力有限，以及连续/混合方法在异构空间建模导致优化冲突的问题，Intern Lumina U2 通过多码本设计提升了表示能力并保持了与离散文本建模的兼容性。该模型在视觉理解、图像生成和编辑方面在统一模型中取得领先性能。团队构建了全栈系统，在昇腾和 NVIDIA 平台上验证了跨平台有效性。采样策略结合了置信度平台引导的解掩和漂移触发缓存刷新机制。\n- **领域归类**: [多模态大模型, 扩散模型, 图像生成, 视觉理解]\n---\n\n### 17. AutoSFT: An Agentic System for Automated Data Research in Supervised Fine-Tuning (AutoSFT：用于监督微调中自动化数据研究的智能体系统)\n- **社区热度**: `👍 33 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22194)\n- **研究任务**: 自动化监督微调（SFT）中的数据研究过程，使智能体能够执行全面的数据调整操作（如调整比例、修剪、修复、替换和合成）。\n- **核心亮点**: 设计涵盖多种数据操作的动作空间；提出 AutoSFT 多智能体系统，包含元智能体（分离执行与分析、收集独立角度的提案）和合成子智能体（补充数据池无法覆盖的能力）；在固定模型、训练器和预算的情况下进行对比实验。\n- **深度解析**: 单智能体系统往往只能执行单一操作（如调整类别比例）且上下文容易丢失。AutoSFT 通过引入执行器（减少上下文丢失）、分析子智能体（使最佳 IFEval 提升 +6.5）和合成子智能体（IFEval 提升 +3.4，IFBench 提升 +2.9）逐步提升性能。该方法可迁移至代码领域（MBPP+ 提升 +3.7）。结果表明，自动化 SFT 数据研究更依赖于覆盖多样化的数据操作，而非单一操作的增强。\n- **领域归类**: [大语言模型, 监督微调, 数据工程, 智能体]\n---\n\n### 18. DeltaStreamer: Towards Human-Like Agentic Streaming Video Understanding (DeltaStreamer：迈向类人智能体的流式视频理解)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19849)\n- **研究任务**: 流式视频理解，要求系统在不知道未来查询需要哪些细节的情况下保留证据，并在查询到来时进行主动调查。\n- **核心亮点**: 提出 DeltaStreamer 智能体框架，结合变化感知记忆、查询驱动规划和针对性证据收集与重放；在查询到来前持续观察流并在结构化记忆中显式记录视觉变化；查询到来时，查询驱动规划器识别所需证据并指导记忆检索和针对性重放，通过重访历史帧恢复观察时省略的视觉细节。\n- **深度解析**: 现有方法在压缩视频历史时往往模糊事件转换并省略相关细节，且无法恢复缺失的视觉证据。DeltaStreamer 将连续观察与针对每个问题定制的主动调查连接起来。在 OVO-Bench 和 StreamingBench 数据集上的实验表明，其整体得分分别达到 66.07% 和 59.53%，优于代表性的流式视频理解方法。\n- **领域归类**: [视频理解, 智能体, 流式数据处理, 计算机视觉]\n---\n\n### 19. Orbia: Do Generated Videos Form a Consistent 3D World? (Orbia：生成的视频是否构成一致的 3D 世界？)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20693)\n- **研究任务**: 系统且全面地评估交互式世界模型中生成视频的 3D 一致性。\n- **核心亮点**: 提出 Orbia 基准，通过受控探索和重访，将评估分为三个维度：输入保留（外观、几何、空间稳定性）、生成内容持久性（测试模型是否保留其创建的内容）、3D 自一致性（跨视图深度和特征对应、区域尺度一致性等）；包含 720 个实例，涵盖室内和室外环境及六种探索-重访协议；评估了 27 个文本、动作和相机条件模型。\n- **深度解析**: 现有的基准要么只评估选定的几何属性，要么使用视觉语言模型判断，缺乏系统的 3D 评估。Orbia 结合了公开数据集、自捕获场景和仿真，通过原生接口适配器对多种模型进行了广泛评估，为诊断 3D 不一致性和开发更持久的视频世界模型提供了系统基础。\n- **领域归类**: [视频生成, 3D 一致性, 世界模型, 基准测试]\n---\n\n### 20. WorldCast: Exploring Intelligent Visual Generation in World State Prediction (WorldCast：探索世界状态预测中的智能视觉生成)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20731)\n- **研究任务**: 评估多模态生成系统在多步世界状态预测（高级任务）上的能力，即从多模态观察和多样参考中预测连续的未来世界状态。\n- **核心亮点**: 将模型能力组织为四个层次的层次结构；引入 WorldCast 基准，包含 8 个类别的 320 个手动设计案例；评估了 12 个代表性模型；发现前沿模型正迅速推动智能世界建模的边界，但模型间存在巨大差距；强生成模型能有效利用其底层语言模型的能力。\n- **深度解析**: 该任务要求模型具备交织的理解和生成能力，以及广泛的世界知识。实验中，GPT-Image-2.5 System 得分 72.8，展现出早期视觉状态预测能力；Nano Banana Pro 仅得 42.8，最佳开源模型得 20.1，在处理复杂上下文、交织参考和推理密集型任务方面存在缺陷。这强调了需要能够进行动态规划和推理且深度统一的多模态生成模型。\n- **领域归类**: [世界模型, 视觉生成, 多模态大模型, 基准测试]\n\n### 21. InfoVis: Unified Slide Image Generation and Editing (InfoVis：统一的幻灯片图像生成与编辑)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16784)\n- **研究任务**: 幻灯片生成与编辑，要求模型在同一画布上结合准确的文本渲染、指令遵循、视觉定位、美学设计和精确编辑能力。\n- **核心亮点**: 构建了包含1300万条持续预训练记录和190万条监督微调记录的可扩展数据引擎；提出包含1527个实例的VisSlideBench基准；训练了统一的9B参数幻灯片生成与编辑模型InfoVis。\n- **深度解析**: 针对现有工作缺乏大规模幻灯片原生监督和诊断评估的问题，研究定义了四个以幻灯片为中心的任务。InfoVis在VisSlideBench的11项指标中领先所有评估的开源模型，总分达到7.94（Nano-Banana-2为7.99）。基于FLUX.2-klein-base-9B的幻灯片特定后训练使总分增加了1.6分，在内容忠实度上增益最大。在外部SlidesGen-Bench上，其文档到幻灯片工作流获得了第二高的美学分数。模型、代码、数据和基准将全部开源。\n- **领域归类**: [计算机视觉, 多模态生成, 图像编辑]\n---\n\n### 22. MLExpert: Towards a Generalist Agentic Model for Autonomous Machine Learning Engineering (MLExpert：面向自主机器学习工程的通用智能体模型)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22344)\n- **研究任务**: 自主机器学习工程（MLE），通过复杂编排管理长期实验，推动AI for AI (AI4AI) 和递归自我改进。\n- **核心亮点**: 提出了一种用于自主长期MLE优化的后训练方法；设计了Kaggle-MLE Factory以构建可执行任务和交互工具；提出窗口交互强化学习（WIRL）和分层智能体SFT；训练了35B参数的混合专家（MoE）模型MLExpert。\n- **深度解析**: 针对长期MLE运行中实验反馈包含多个先前决策的问题，WIRL将连续实验结果之间的多轮决策视为执行窗口，并分配共享的基于结果的奖励，支持在轨迹结束前进行异步收集和策略修正。在MLE-Bench Lite上，MLExpert将基础模型的平均奖牌率从37.9%提高到72.7%，达到了与Kimi-K3和GLM-5.3等更大前沿模型相当的性能。进一步实验表明，该模型在NatureBench Lite、智能体脚手架优化和算法优化上也表现出泛化能力。\n- **领域归类**: [大语言模型, 智能体, 机器学习工程, 强化学习]\n---\n\n### 23. Terminal-RSI: Recursive Self-Improving Terminal Agents via Recursive Self-Rewrite and Policy-Refine (Terminal-RSI：通过递归自重写与策略优化实现终端智能体的递归自我改进)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22192)\n- **研究任务**: 终端智能体（Terminal agents）的任务解决，将验证器结果转化为有用的策略更新，将部分进展转化为完整的任务解决。\n- **核心亮点**: 提出Terminal-RSI，交替使用验证轨迹的递归自重写（RSR）和继承评论家的递归策略优化（RPR）；提出TB-GAE、FDR、SPR等机制；从Qwen3.8-27B基础模型经过五个阶段训练得到Terminal-RSI-27B。\n- **深度解析**: 研究设计了Turn-Boundary Skip-Observation GAE (TB-GAE) 以保留token特定基线并在交互轮次间应用衰减；Family Dense Reward (FDR) 用于校准跨任务族的语义进展；Success-Prioritized Reward (SPR) 用于区分严格成功和有界的部分信用。Terminal-RSI-27B在Terminal-Bench 4.0上达到19.84%，在Terminal-Bench 2.1上达到86.52%，在Terminal-Bench 3.0上达到16.95%，在Terminal-Bench Hard上达到79.00%。在LHTB上，过程奖励从0.21升至0.37，严格完成从0/46升至5/46；SWR100成功率从3.00%翻倍至6.00%。\n- **领域归类**: [大语言模型, 智能体, 强化学习, 递归自我改进]\n---\n\n### 24. Can World and Action Modeling Benefit Each Other under Unified Causal Training? (在统一因果训练下，世界建模与动作建模能否相互受益？)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21095)\n- **研究任务**: 具身智能中的世界建模与动作（策略）学习，探究两者在统一因果训练框架下的相互促进关系。\n- **核心亮点**: 提出OneWM框架，在共享的视频-动作架构中将动作既作为世界预测的条件，又作为策略学习的目标；在LIBERO、LIBERO-Plus、RoboCasa365及真实世界实验中验证了双向受益。\n- **深度解析**: 研究探讨了学习指定动作条件下的前向动态是否能改善动作学习，以及学习生成动作是否能改善动作条件下的世界建模。结果表明，学习指定动作的视觉后果提高了策略性能和跨变化场景的泛化能力；反过来，动作学习提高了同一架构下多视角世界预测的保真度。这些结果证实了在统一因果训练下，世界建模和动作生成之间存在相互受益的关系。\n- **领域归类**: [具身智能, 世界模型, 机器人学习, 多模态]\n---\n\n### 25. Data World: Scaling Data Environments from Scratch (Data World：从零开始扩展数据环境)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21656)\n- **研究任务**: 数据智能体（Data agents）的训练环境扩展，解决环境构建成本高、隐私/知识产权限制以及开放式发现难以验证的问题。\n- **核心亮点**: 提出Data World多智能体引擎，从显式机制合成环境、任务和评分标准；构建DataWorld-Bench（包含50个保留世界、16个领域的100个任务）；通过RL-zero训练得到DataWorld-35B-A3B模型。\n- **深度解析**: 核心洞察是在生成文件之前先指定文件背后的世界机制，独立审计检查从观察文件中恢复目标的可恢复性。对10个前沿模型的评估显示该基准具有挑战性，特别是在洞察发现方面存在计算-洞察差距。在合成任务上进行RL-zero训练，从Qwen3.6-35B-A3B得到DataWorld-35B-A3B，无需轨迹蒸馏。在匹配评估下，该模型在DataWorld-Bench上提高7.06分，DAComp提高14.28分，DABstep-Hard提高20.90分，JobBench提高12.13分。\n- **领域归类**: [大语言模型, 智能体, 数据科学, 强化学习]\n---\n\n### 26. EdgeWise: Bringing Long-Horizon Agents to the Edge via Selective Cloud Delegation (EdgeWise：通过选择性云端委托将长期智能体带到边缘)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17560)\n- **研究任务**: 降低长期智能体任务在云端使用大模型带来的高昂推理成本，实现边缘-云端协同。\n- **核心亮点**: 提出EdgeWise边缘-云协同框架，本地部署小模型（SLM）作为主要求解器，选择性地将关键步骤委托给云端大模型（LLM）；引入步级强化学习方法联合优化任务求解和委托；引入基于外部评判的委托策略。\n- **深度解析**: 研究发现仅将LLM分配给一小部分关键步骤即可达到与全LLM执行相当的性能。步级RL方法对单个委托决策进行细粒度的信用分配，无需在推理时引入额外模型。实验表明，EdgeWise在SWE-Rebench上匹配或超越纯LLM执行，同时推理成本降低高达62%，在Terminal-Bench 2.1上降低34%。研究还在本地工作站上部署了EdgeWise，验证了在实际边缘-云设置中 comparable 的成本节约效果。\n- **领域归类**: [大语言模型, 智能体, 边缘计算, 强化学习]\n---\n\n### 27. Intern-Decision: Efficient Multimodal Decision Making with Autoregressive Masked Language Modeling (Intern-Decision：基于自回归掩码语言建模的高效多模态决策)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22131)\n- **研究任务**: 交互式智能体在有限动作、标签或有序结果中的高效多模态决策，降低延迟并简化模型与环境的接口。\n- **核心亮点**: 提出Intern-Decision系列多模态决策模型（0.8B, 2B, 4B），返回结构化选择和候选概率；采用自回归掩码语言建模目标，在完整的助手JSON骨架中每个字段放置一个决策占位符。\n- **深度解析**: 真实符号仅出现在监督中，所有字段在单次因果前向传递中使用骨干网络的原生语言模型头进行评估。4B模型在七个评估套件中实现90.02%的未加权平均准确率（Jev v1.13.0为88.74%）。在RTX 4090上处理固定289-token请求（3个字段）的平均延迟为44.16 ms，较小模型约为33-34 ms。温度缩放将预期多分类Brier从0.628降至0.550，预期校准误差从0.213降至0.089。基于置信度的交接研究在111个Jevbench-Hard项目上，通过将42个项目路由到Atria-Dawn-Preview，将准确率从73.87% (82/111) 提高到87.39% (97/111)。\n- **领域归类**: [多模态, 智能体, 高效推理, 决策系统]\n---\n\n### 28. CommerceGen-Studio: An End-to-End Framework for Commercial-Grade Main-Image Generation (CommerceGen-Studio：面向商业级主图生成的端到端框架)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20603)\n- **研究任务**: 电子商务SKU（库存单位）商业级主图的端到端生成。\n- **核心亮点**: 提出三阶段流水线（信息提取、语义重写、多条件生成）；包含PERL-Agent、LTO（布局思考优化）和SKU-DiT（采用RDR渐进训练）；在商业规模下每天生成数百万张主图，延迟仅几秒；发布CommerceGen-Bench。\n- **深度解析**: PERL-Agent通过VLM和LLM角色的迭代闭环将异构SKU元数据提炼为简洁的卖点文本列表。LTO通过交替的特定领域策略优化使重写器与标题和渲染图像质量对齐。SKU-DiT联合以白底产品图、商标裁剪和结构化布局为条件，保持主体保真度、商标完整性和字符级文本准确性。在CommerceGen-Bench上，该框架在评估的开源基线中取得最高总分，匹配甚至超越更大的闭源模型，在决定图像是否可发布的“指令遵循”和“产品整合”属性上击败了多个闭源模型。\n- **领域归类**: [计算机视觉, 图像生成, 电子商务, 多模态]\n---\n\n### 29. Routing Policy Optimization for Online Diffusion Reinforcement Learning (在线扩散强化学习的路由策略优化)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22282)\n- **研究任务**: 视觉生成模型（如文本到图像、文本到视频）的强化学习对齐，解决现有基于得分函数方法因扰动反向去噪轨迹而引入随机性并导致高昂基于 rollout 的优化成本的问题。\n- **核心亮点**: 提出路由策略优化（RPO），将注意力路由转化为随机探索动作，在保留生成器原始采样器的同时引入随机性；使用受控的双rollout估计器；训练效率比Flow-GRPO风格方法高近4倍。\n- **深度解析**: RPO在选定的去噪级别上，每个查询块保留其自身的块，并按生成器原生注意力质量的比例采样进一步的键块，或保留密集注意力。采样的路由扰动该转换的速度，围绕密集速度的高斯似然对扰动进行评分。双rollout估计器共享提示、初始潜变量等，仅在采样的注意力路由上不同，其奖励差提供优势信号。由于似然对密集速度本身求导，学习到的更新在移除路由后仍然有效。推理时恢复密集注意力并保留原始确定性采样器。在文本到图像和视频生成中提高了生成质量。\n- **领域归类**: [计算机视觉, 扩散模型, 强化学习, 图像/视频生成]\n---\n\n### 30. OmniVerifier-C1: Decomposed Graded Verifier for Rule-Governed Generative World Modeling (OmniVerifier-C1：面向规则约束生成式世界建模的分解分级验证器)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22355)\n- **研究任务**: 增强视觉验证器在涉及组合要求的复杂多模态场景中的鲁棒性，以及规则约束的生成式世界建模。\n- **核心亮点**: 提出自动将复杂提示或环境规则分解为细粒度组件并分配逐点分数的分级验证器，取代传统的二元（True/False）验证器；引入解耦强化学习（Decoupled RL）训练策略；证明了从生成模型向结构化世界建模智能体过渡的关键在于准确的成对分级视觉验证器。\n- **深度解析**: 验证器提供连续且信息更丰富的批评信号，提高了对域外多模态批评任务的泛化能力。Decoupled RL联合优化子问题级别的二元判断和全局对齐评分，利用精确的局部反馈为全局连续评分奠定基础。在传统的文本到图像场景中，逐点分级验证器显著优于二元验证器。在规则约束的生成式世界建模（如Maze和Sudoku等结构化任务）中，理论表明当有真实图像时，成对验证范式比逐点公式产生更准确的批评，实证结果验证了其有效性。\n- **领域归类**: [多模态, 视觉验证, 世界模型, 强化学习]\n---\n\n### 31. Each Reward to Its Relevant Tokens: Reward-Specific Token-Level Credit Assignment for Multi-Reward RL (每个奖励对应其相关词元：多奖励强化学习的奖励特定词元级信用分配)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21439)\n- **研究任务**: 在多奖励强化学习（如工具调用正确性、格式、复杂指令约束等）中，为每个奖励精确分配其相关的词元级信用（优势），以解决现有方法将优势均匀分散在整个响应中的问题。\n- **核心亮点**: 提出 MRTPO 方法，利用验证器检查的信息，将每个奖励的优势分配给相关的词元，无需辅助模型或词元级标注。通过计算有/无验证器信息时的下一个词元分布的 Jensen-Shannon 距离来衡量相关性并重新分配优势。\n- **深度解析**: 现有的奖励解耦归一化（GDPO）虽然分离了奖励，但无法实现细粒度的信用分配。MRTPO 解决了这一痛点，实现了更精准的词元级优势分配。在 text-to-SQL、多约束指令遵循和工具调用任务上，MRTPO 收敛更快且性能更好。摘要未提供具体的实验数据集名称、对比基线名称以及具体的性能提升数字。\n- **领域归类**: [自然语言处理, 强化学习, 大语言模型对齐]\n---\n\n### 32. Do Better Visual Representations Always Lead to Better End-to-End Autonomous Driving? (更好的视觉表征是否总能带来更好的端到端自动驾驶？)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09695)\n- **研究任务**: 研究视觉基础模型（VFM）的表征何时以及如何改善端到端自动驾驶的规划性能，并探讨视觉表征与规划器之间的对齐问题。\n- **核心亮点**: 引入 ViRA，一个与规划器无关的视觉表征对齐框架。研究发现 VFM 引导的表征能一致提升驾驶性能；VFM 目标的选择对规划性能有影响；辅助感知监督能降低对 VFM 目标选择的敏感性。基于此开发了 ViRA-Diffusion 规划器。\n- **深度解析**: 摘要提供了具体的实验结果：辅助感知监督将五个目标的 EPDMS 差距从 2.7 缩小到 0.5 分；ViRA-Diffusion 在 NAVSIM v2 navtest 上达到 92.3 EPDMS，比对比方法高出至少 1.9 分。摘要未提供具体的实验数据集全称及其他未提及的技术细节。\n- **领域归类**: [计算机视觉, 自动驾驶, 多模态学习]\n---\n\n### 33. SimVTA: Simulation-Grounded Video-Trajectory Alignment for Driving World Action Models (SimVTA：基于仿真的视频-轨迹对齐用于驾驶世界动作模型)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.13781)\n- **研究任务**: 解决驾驶世界动作模型（WAMs）在强化学习后训练时，由于驾驶日志仅包含记录轨迹的未来视频，导致替代探索轨迹缺乏对应视觉监督的问题。\n- **核心亮点**: 提出 SimVTA 框架，结合轨迹优化与视频监督。使用真实世界模拟器为高奖励候选轨迹渲染未来视频，提供独立于模型预测的轨迹匹配监督。在有限渲染预算下，优先为高误差未来视频提供监督，并使用 GRPO 和流匹配损失进行优化。\n- **深度解析**: 摘要提供了具体的实验结果：在 NAVSIM v1 上将 PDMS 从 86.2 提升至 91.3（+5.1），在 NAVSIM v2 上达到 88.2 EPDMS，在 HUGSIM 闭环评估中平均 HD-Score 为 38.8。推理时模型直接预测轨迹，无需调用模拟器。摘要未提供具体的对比基线名称。\n- **领域归类**: [自动驾驶, 强化学习, 世界模型]\n---\n\n### 34. JevAgentHarness: Benchmarking, Deploying and Training Decision Models That Share Control with LLMs (JevAgentHarness：对与 LLM 共享控制的决策模型进行基准测试、部署和训练)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21412)\n- **研究任务**: 评估和部署决策模型（如 Jev），使其在智能体任务中替代大语言模型（LLM）进行多步决策（如选择下一个工具），以降低长任务的时间和成本。\n- **核心亮点**: 构建 AgentDecisionBench 评估决策模型；设计 JevAgentHarness，通过拟合置信度阈值，让 LLM 在低置信度时决策，高置信度时委托给决策模型；训练 AgentDecision-4B 模型，专门在智能体自身错误后的状态上进行训练。\n- **深度解析**: 摘要提供了具体的实验结果：在不同于训练数据的任务上，使用 AgentDecision-4B 解决了 91.5% 的任务（Jev 为 82.0%）；在类似训练数据的任务上，4B 模型使智能体成本降低 81.1-89.0%，速度提升高达 2.5 倍，且任务成功率不降低 3 分以上。摘要未提供具体的实验数据集名称。\n- **领域归类**: [人工智能, 智能体, 大语言模型应用]\n---\n\n### 35. SWE-at-Scale: Scalable Issue Synthesis from Historical Bug Fixes (SWE-at-Scale：从历史 Bug 修复中可扩展地合成问题)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21359)\n- **研究任务**: 自动化合成真实、多样且具有挑战性的软件工程（SWE）任务，以解决真实任务频率受限、手动整理成本高以及现有合成方法无法捕捉真实软件故障复杂机制的问题。\n- **核心亮点**: 提出 SWE-at-Scale 框架，通过逆向工程真实世界的软件修复来自动合成逼真的问题。核心洞察是历史修复包含了 Bug 形成的深层机制知识，将修复反转即可将修复监督转化为基于实际开发场景的 Bug 诱导监督。\n- **深度解析**: 该方法能将有限的真实世界修复转化为可重用的监督，用于可扩展地合成 SWE 任务。摘要提到该方法能从单个代码上下文中生成不同的 Bug 类型，且 Bug 多样性在单个文件高达 200 次生成中仍能稳健扩展。摘要未提供具体的实验数据集名称、对比基线名称以及具体的性能对比数字。\n- **领域归类**: [软件工程, 人工智能, 大语言模型应用]\n---\n\n### 36. Velox: Spatial Memory Makes World Models Efficient (Velox：空间记忆使世界模型更高效)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22311)\n- **研究任务**: 解决视频世界模型在长视觉展开（rollouts）中，由于分块视频扩散模型的 KV 缓存不断增长，导致后续分块生成速度越来越慢的瓶颈问题。\n- **核心亮点**: 引入 Velox，一种无需训练的注意力路由机制，利用流式几何中的视锥体平板（frustum slab）对应关系进行区域级上下文选择。将历史块表示为具有深度区间的视锥体平板，通过基于新颖性的多 warp 获取当前块深度，从而减少随展开长度增长的注意力计算项。\n- **深度解析**: 摘要提供了具体的实验结果：在第 48 个分块时，Velox 将注意力加速 4.36 倍，去噪加速 2.43 倍。在完整的 158 个案例的 WBench 导航分割中，与 dense LingBot-Fast-Cam 相比，平均无 API 分数差距在 0.15 以内。摘要未提供具体的实验数据集名称。\n- **领域归类**: [计算机视觉, 视频生成, 世界模型]\n---\n\n### 37. MFVSR: A Multi-Style and Fine-Grained Benchmark for Video Subtitle Removal (MFVSR：用于视频字幕去除的多风格细粒度基准)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18461)\n- **研究任务**: 解决现有视频字幕去除（VSR）评估受限于低分辨率数据集、碎片化测试集以及通用视频修复协议的问题，提供更全面、细粒度和可靠性感知的评估基础。\n- **核心亮点**: 引入 MFVSR，一个大规模多风格基准。包含 3000 个配对视频和 953 个野生真实视频；控制字幕多样性（涵盖 16 种语言及 4 个因素）；引入细粒度评估协议，分离盲去除和掩码引导去除，测量修复保真度、保留保真度、时间保真度等指标。\n- **深度解析**: MFVSR 提供了一个更全面和诊断性的基础，用于评估和推进视频字幕去除方法。摘要提到在 6 种代表性方法上进行了实验，揭示了传统全帧指标掩盖了局部修复、区域外保留、时间一致性和全集可靠性之间的巨大差异。摘要未提供具体的实验结果数字和 6 种代表性方法的具体名称。\n- **领域归类**: [计算机视觉, 视频处理, 数据集与基准]\n---\n\n### 38. Trajectory-Level Speculation with Semantic Verification for Tool-Using Agents (用于工具使用智能体的轨迹级推测与语义验证)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21463)\n- **研究任务**: 解决大语言模型智能体在长序列工具调用中，强模型生成每一步导致的高延迟和高成本问题，探索强弱模型协作的新范式。\n- **核心亮点**: 提出 SpecAgent 协作协议，将强模型从每一步的作者转变为弱模型起草步骤的审查者。弱模型执行只读工具调用以起草步骤，强模型通过单次预填充（prefill）验证起草的片段，提交语义有效的最长前缀并修复首个被拒绝的步骤，从而用并行预填充替代自回归解码。\n- **深度解析**: 摘要表明强模型不需要撰写智能体的每一步，审查基于真实观察的草稿可以保留大部分质量，同时降低延迟和内存流量。摘要未提供具体的强/弱模型名称，但提到在 τ^2-Bench 上成功率与强模型仅差 1 分且内存流量和运行时间减半，在 AutomationBench 和 VitaBench 上恢复了 44-75% 的质量差距，在 MCP-Atlas 边缘云部署中关闭了 53-75% 的质量差距。\n- **领域归类**: [人工智能, 智能体, 大语言模型推理优化]\n---\n\n### 39. Athanor: An Agent-Native System for Autonomous Post-Training Research (Athanor：用于自主后训练研究的智能体原生系统)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21055)\n- **研究任务**: 实现前沿智能体在真实 GPU 上自主对小型原始基础模型进行后训练（AutoPostTrain），作为研究其研究潜力和递归自我改进的一种可测量的较弱形式。\n- **核心亮点**: 构建 Athanor 系统，赋予智能体完全的研究自主权、低摩擦工程工具和高效启动代码。智能体自行读取数据、构建训练数据、编写和修改算法、调参并分析结果，在沙盒中工作且无法使用外部教师模型。\n- **深度解析**: 摘要证明了前沿智能体团队已经具备工程和研发能力来完成自主后训练任务。摘要未提供具体的公开数据集名称，但提到在 104 小时的活动中，4 个 Claude Opus 5.5 智能体将 Qwen3-4B-Base 在 6 任务开发套件上的分数从 15.9 提升至 67.3，在保留套件上从 9.2 提升至 48.2，匹配或超越了官方 Qwen3-4B-Instruct-2507（66.5 和 47.9）。\n- **领域归类**: [人工智能, 自动化机器学习, 智能体]\n---\n\n### 40. CoDA: Co-Evolution of Data Engines and Action Policies (CoDA：数据引擎与动作策略的协同进化)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22362)\n- **研究任务**: 解决生成式模拟构建的机器人环境虽然物理有效但不一定对训练有用的问题，旨在识别能解决策略失败的环境并提供相应的监督。\n- **核心亮点**: 提出 CoDA 框架，模拟数据引擎和动作策略通过共享的异构记忆协同进化。记忆将视觉语言评论家的诊断编译为生成程序和学习程序。提出 Text2potential 将诊断转化为分阶段势能以进行动作块价值学习，提供密集监督同时保留最优策略。\n- **深度解析**: CoDA 通过数据引擎和动作策略的协同进化，有效提升了策略在分布外环境中的泛化能力。摘要未提供具体的对比基线名称，但提到在 4 个操作任务家族中，将分布外成功率从监督微调后的 5.3% 提升至 27.6%，在相同生成预算下超过最强闭环基线 9.5 个百分点；在 LIBERO-Pro 上，15 轮迭代使位置扰动下的成功率从 25% 提升至 84%，指令扰动下从 1% 提升至 76%。\n- **领域归类**: [机器人学, 强化学习, 生成式模拟]\n---\n\n### 41. CarryOn: A Dual-Loop Harness for Personalized and Reliable Robot Assistance (CarryOn：用于个性化和可靠机器人辅助的双循环框架)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21453)\n- **研究任务**: 提升通用视觉-语言-动作（VLA）模型在真实世界机器人辅助任务中的个性化执行与可靠安全保障能力。\n- **核心亮点**: 提出一种双循环框架（规划循环与执行循环）来增强冻结的 VLA 策略。规划循环通过维持持久的用户级和场景级上下文实现个性化任务选择；执行循环主动监督策略展开，屏蔽预测的危险接触，并在执行失败时调用可重用的控制恢复技能。\n- **深度解析**: 针对 VLA 模型缺乏个性化和可靠性的痛点，CarryOn 通过规划循环结合用户偏好进行子任务分解，并通过执行循环提供可解释的安全保障和故障恢复机制。在真实机器人和仿真环境中，该系统将已经过安全微调的 VLA 违规率从 52.6% 降至 6.1%，并在复用优化技能时将恢复成功率从 13% 提升至 80%。\n- **领域归类**: [机器人学, 视觉-语言-动作模型, 强化学习与控制]\n\n---\n\n### 42. SUPRA-TEX: 3D Generation with Super-Aligned Texture (SUPRA-TEX：具有超对齐纹理的3D生成)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22352)\n- **研究任务**: 单图 3D 生成，旨在为给定的 3D 网格赋予可重光照材质，同时忠实保留参考图像的视觉细节。\n- **核心亮点**: 提出解耦可见材质估计、表面对齐和观察引导的 3D 补全。利用基于 MLLM 的图像编辑模型预测分离光照的 PBR 贴图，将其投影到可见表面并编码为原生观察潜变量。通过交错流 Transformer 生成完整材质潜变量，实现可见区域的“所见即所得”和未观察表面的一致性补全。\n- **深度解析**: 现有方法在多视图融合或隐式特征条件化时易产生伪影或丢失细节。SUPRA-Tex 通过分工策略，让 3D 生成器专注于保留可见证据和补全未观察表面。该模型仅在公共数据集上训练（具体数据集名称摘要未提供），在几何条件纹理和端到端资产生成中达到 SOTA 性能（具体指标数值摘要未提供），甚至在野外图像上匹配或超越领先的商业系统。\n- **领域归类**: [计算机视觉, 3D生成, 图像编辑]\n\n---\n\n### 43. Learning Self-Orchestration in Decentralized Agent Swarms (在去中心化智能体集群中学习自组织)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22322)\n- **研究任务**: 解决现有多智能体系统中个体能力学习与集体行为组织相分离的问题，实现去中心化智能体集群的联合学习。\n- **核心亮点**: 提出基于市场的后训练（MPT）框架。智能体通过“出价”表达参与意愿，决定谁执行动作以及集体结果如何提供局部训练信用。联合学习动作策略和自组织能力，无需中央协调智能体。\n- **深度解析**: MPT 框架允许个体能力和参与模式共同适应。在具身创建、机器人导航和深度研究等任务上的评估表明，它优于单一后训练，且学习到的自组织优于替代协调策略（具体提升数值摘要未提供）。此外，训练后的集群能更快适应相关任务，在推理时支持更大种群，并在智能体丢失时表现出更强的鲁棒性。\n- **领域归类**: [多智能体系统, 强化学习, 机器人学]\n\n---\n\n### 44. Memory as Weights: Internalizing Long-Term History for Streaming Videos (记忆即权重：为流式视频内化长期历史)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22070)\n- **研究任务**: 提升流式视觉语言模型（VLM）在持续整合历史信息的同时，保持对当前观察和用户查询的响应能力。\n- **核心亮点**: 提出 MaLoW 流式记忆框架，将历史上下文内化为不断演进的轻量级参数更新。使用循环超网络将传入的视频观察增量合并为固定大小的 LoRA 权重，使历史信息得以向前传递而无需重新访问完整视频流。\n- **深度解析**: 现有记忆机制通常将历史观察压缩或缓存并重新引入输入上下文，导致与当前观察竞争有限的上下文。MaLoW 将历史表示为权重，当前观察作为输入。研究构建了包含 56K 视频和 381K 问答对的 MaLoW-Instruct 数据集。在 OVO-Bench、StreamingBench 和 StreamArena 上表现优异，在 OVO-Bench 后向分割中比 prior 方法高出 3.9% 至 11.8%。此外，该框架能泛化到视觉-语言-动作模型，将 Simpler WidowX 上的动作成功率提高 9.3%。\n- **领域归类**: [计算机视觉, 视觉语言模型, 视频理解]\n\n---\n\n### 45. Cowork-Gym: Synthesizing Interactive Work Environments at Scale (Cowork-Gym：大规模合成交互式工作环境)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17670)\n- **研究任务**: 解决扩展协作（Cowork）智能体环境时，难以保持任务目标、可执行资源、用户行为和成功标准之间一致性的问题。\n- **核心亮点**: 引入 Cowork-Gym 框架，通过“构建-执行-修改”循环合成环境，利用执行证据和审查反馈验证和修复生成的环境。包含一个有状态的用户模拟器，通过对话和直接编辑共享工作区来响应智能体动作。\n- **深度解析**: 研究合成了跨 14 个应用场景的 6.49 万个环境，用于对 Qwen 模型（9B, 27B, 35B-A3B）进行监督微调、强化学习和在策略蒸馏的后训练。在 6 个智能体基准测试中，这些模型分别比基础检查点高出 8.7、6.4 和 4.1 分。27B 模型在 PawBench 和 ClawEval 上取得最高平均分，超越了总参数量超过 100B 的模型。\n- **领域归类**: [大语言模型, 智能体, 环境合成与强化学习]\n\n---\n\n### 46. FlashMask-3: Efficient and Expressive Mask-Aware Distributed Attention (FlashMask-3：高效且具表达力的掩码感知分布式注意力)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17901)\n- **研究任务**: 解决大语言和多模态模型长上下文训练中，结构化注意力掩码与多节点上下文并行结合时，掩码计算成为主要瓶颈的问题。\n- **核心亮点**: 引入掩码感知的 Hopper 内核，基于 FlashAttention-3 的 TMA/WGMMA 管道实现三角色 warp 特化。提出掩码感知分布式扩展：零通信掩码定位、稀疏感知负载均衡器（HCC-IPO）以及掩码感知计算-通信重叠（带有掩码驱动的通信剪枝和拓扑感知分层路由）。\n- **深度解析**: FlashMask-3 将列向稀疏掩码的掩码定位简化为边界向量上可证明的零通信操作。在单 H100 上，相比 FlashMask、FlexAttention 和 MagiAttention，在 4K-128K 上下文下分别提升了 45-141%、34-71% 和 2-44% 的 TFLOPs。在上下文并行度 4-32 下，实现了 31-75% 的计算-通信重叠效率，吞吐量大幅提升。在 128 个 H100 上训练 118B-A14B MoE 模型时，吞吐量提升 7.3-11.0%，注意力前向+反向传播速度提升 24.5-44.9%。\n- **领域归类**: [系统优化, 大语言模型, 分布式训练与注意力机制]\n\n---\n\n### 47. WorldMemBench: A Comprehensive Benchmark for Memory of Video World Models (WorldMemBench：视频世界模型记忆的综合基准测试)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19063)\n- **研究任务**: 系统评估视频世界模型中的“世界记忆”能力，即保持与历史一致的世界状态（包括保留先前观察的内容和确保随时间连贯的世界演变）。\n- **核心亮点**: 引入 WorldMemBench 基准，包含 260 个测试用例。通过受控的相机离开和多次重访轨迹，评估静态记忆（人类身份/外观、物体外观/几何、环境内容/几何）和动态记忆（事件进展、状态持久性）。结合外观、几何指标和特定事件评估。\n- **深度解析**: 对 9 个代表性模型的评估表明（具体模型名称和详细指标数值摘要未提供），强大的静态保留并不意味着可靠的动态状态演变，且多次重访会揭示首次返回后的记忆衰退。人工研究支持了自动评估与人类判断的一致性。该基准为诊断记忆失败和指导持久、时间连贯的视频世界开发提供了系统测试平台。\n- **领域归类**: [计算机视觉, 视频生成与世界模型, 基准测试]\n\n---\n\n### 48. Calibrated Typed Decisions for Entity, Relation, and Event Extraction (用于实体、关系和事件抽取的校准类型决策)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17113)\n- **研究任务**: 解决信息抽取模型在跨数据集和标注指南迁移时的挑战，实现跨数据集和模式的统一实体、关系和事件抽取。\n- **核心亮点**: 提出 CalOn，一个统一的 0.6B 参数编码器。联合编码文本和类型定义，直接识别实体跨度、跨度间关系以及事件触发器和论元。提取决策综合考虑请求的类型，利用组合证据识别候选者后再分配类型。结合监督学习和奖励机制。\n- **深度解析**: CalOn 在 40 个基准测试中（具体基准名称摘要未提供）在大多数基准上优于基线，在所有报告的关系抽取基准中领先，并在事件触发器和论元上取得最高平均 F1（具体 F1 数值摘要未提供）。该模型通过跨度对公式在方面情感三元组抽取和代词消解上也表现良好。训练期间引入的概率偏差校正改善了校准后的置信度估计，且 F1 变化很小。\n- **领域归类**: [自然语言处理, 信息抽取, 模型校准]\n\n---\n\n### 49. Virtual Head Attention (虚拟头注意力)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17959)\n- **研究任务**: 解决长上下文大语言模型注意力机制设计中，KV 缓存大小、训练/预填充 FLOPs 和模型质量之间的“不可能三角”问题。\n- **核心亮点**: 提出虚拟头注意力（VHA），通过两个轻量级线性操作同时改善三个顶点：Q Premix 对每个 KV 组内的查询应用近恒等变换以恢复虚拟头多样性；Linear Postmix 通过低秩残差结构融合头间特征。由于无非线性操作，推理时可折叠为标准 GQA-2 架构，复用现有 GQA 推理优化。\n- **深度解析**: VHA 在 4K 上下文 50B token 预训练的四个规模上始终超越标准 GQA 基线（提升 +0.05% 至 +0.81%），同时在密集规模下将 KV 缓存减少至 GQA-8 的 1/4，在 MoE 规模下减少至 GQA-4 的 1/2，并降低 7.9% 的训练和预填充 FLOPs。在工业级 30B-A3B MoE 模型（500B tokens, 8K 上下文）评估中，VHA 优于 MLA 和 GQA-4；在 10B-A1B MoE 的 8K-128K 长上下文评估中，VHA 的 RULER 平均分达到 84.4，远超 GQA 的 73.0。\n- **领域归类**: [大语言模型, 注意力机制, 模型架构]\n\n---\n\n### 50. SERO: Learning from Executable Oracle Continuations for Long-Horizon Agentic Reinforcement Learning (SERO：从长周期智能体强化学习的可执行Oracle延续中学习)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19397)\n- **研究任务**: 解决长周期智能体强化学习中，当前策略访问的未来状态受限，导致无法为未遇到的状态和动作提供监督的问题。\n- **核心亮点**: 引入状态根可执行展开优化（SERO），用可执行的 Oracle 延续增强在策略智能体强化学习。恢复当前策略实际达到的状态，让仅用于训练的 Oracle 继续与真实环境交互，使下游观察和 Oracle 动作可用于学习。应用策略可达性加权，根据冻结行为策略与先前 Oracle 动作的兼容性对每个 Oracle 步骤进行加权。\n- **深度解析**: 与仅监督根 Oracle 动作的方法相比，学习完整的可执行延续在 ALFWorld 上更有效，且策略可达性加权进一步提高了分布外性能。研究在 ALFWorld 和 WebShop 基准上使用 Qwen2.5-1.5B-Instruct 和 Qwen2.5-7B-Instruct 进行了评估（具体提升数值摘要未提供）。Oracle 损失与基础 RL 估计器分开优化，推理时不使用 Oracle。\n- **领域归类**: [强化学习, 智能体, 大语言模型]\n\n### 51. MMSearch-OPD: Easy Made Hard, Hard Made Learnable for Long-Horizon Multimodal Search Agents (MMSearch-OPD：让简单变难，让困难可学——面向长视界多模态搜索智能体)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22240)\n- **研究任务**: 训练能够持续获取证据的长视界多模态深度搜索智能体。\n- **核心亮点**: 提出 MMSearch-OPD，结合可控数据细化与联合强化学习（RL）及在策略蒸馏（OPD）。通过 Refine 管道对现有简单多模态问题的推理链进行针对性扩展，控制搜索深度和跨模态证据需求。\n- **深度解析**: 针对长视界多模态搜索训练中缺乏高难度问题和过程反馈的问题，该研究设计了数据细化管道来生成具有挑战性的训练数据。在训练阶段，利用答案奖励和轻量级行为惩罚引导 RL，并通过奖励差距调节对不完美学生轨迹的 token 级教师指导，同时使用指数衰减的蒸馏系数减少对教师的依赖。实验表明该方法在 SFT 后通过联合训练进一步提升了长视界多模态深度搜索能力（摘要未提供具体的实验数据集名称和具体数字指标）。\n- **领域归类**: [多模态, 强化学习, 智能体, 模型蒸馏]\n---\n\n### 52. PN-Mix: Pair-Norm Guided Mixed-Precision Key Cache Quantization for Efficient Long-Output LLM Inference (PN-Mix：基于对数范数引导的混合精度 Key Cache 量化以实现高效长输出 LLM 推理)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19605)\n- **研究任务**: 解决大语言模型在长输出推理中面临的 KV cache 内存和带宽瓶颈，特别是低比特量化导致精度下降的问题。\n- **核心亮点**: 提出 PN-Mix，一种针对基于 RoPE 的纯解码器 LLM 的混合精度 key-cache 量化方法。通过在 RoPE 通道对级别进行注意力 logit 扰动分析，发现具有较大 query-key 对数范数乘积的通道对量化误差对 logit 变化贡献显著，从而在 prefill 阶段一次性识别显著通道对并分配高精度。\n- **深度解析**: 现有的混合精度方法仅使用 key 统计信息来估计通道显著性。PN-Mix 深入分析了 RoPE 通道对级别的量化误差影响。在标准推理、代码生成和 AIME 基准测试中，平均精度为 2.26-bit 的 PN-Mix 达到了与先前使用 2.32--2.39 bits 的混合精度方法相当或更好的平均精度。此外，在帕累托扫描中，PN-Mix 在降至 1.5 bits 时性能下降平缓，而对比基线在低于 2.25 bits 时性能急剧下降（摘要未提供具体的模型名称和硬件延迟/吞吐量指标）。\n- **领域归类**: [大语言模型, 模型量化, 推理优化, 计算机体系结构]\n---\n\n### 53. LeanPRM: Lean-Grounded Process Supervision for Natural Language Proof Verification (LeanPRM：基于 Lean 的自然语言证明验证过程监督)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.17697)\n- **研究任务**: 为自然语言数学证明提供步骤级别的有效性验证，解决训练验证器时缺乏步骤级正确性标签的问题。\n- **核心亮点**: 提出 LeanPRM 框架，利用 Lean 证明助手为自然语言证明创建步骤级标签，无需人工标注。模型同时生成自然语言证明和配对的 Lean 形式化证明，Lean 对每一步进行标注，第二个模型过滤掉仅由形式化语法引起的失败，从而将负标签标记为数学错误。\n- **深度解析**: 训练过程奖励模型（PRM）通常需要每一步的正确性标签，这在开放式证明中很难获取。LeanPRM 包含 10,634 个证明和 152K 个标注步骤。在 200 个证明的保留集（LeanPRM-Bench）上，基于 LeanPRM 训练的 Qwen3-4B 验证器将精确步骤标签准确率从 48.2 提升至 74.7（而在 PRM800K 上训练仅达 60.3）。它在 IMO 级别问题的 best-of-N 选择中表现更好，并在四个外部验证基准中的三个上超越了基于 PRM800K 训练的验证器。该框架在 0.6B 到 8B 参数的各个尺寸上均有提升。\n- **领域归类**: [数学推理, 形式化验证, 过程奖励模型, 大语言模型]\n---\n\n### 54. Gen4P: Video Generators are 4D Perceivers (Gen4P：视频生成器即 4D 感知器)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22371)\n- **研究任务**: 从单目视频中恢复 4D 几何和运动（3D 空间 + 时间）。\n- **核心亮点**: 提出 Gen4P 统一框架，将预训练的视频生成器重新用作前馈 4D 感知器，无需迭代去噪。基于按需查询（on-demand querying），在单次编码器传递中处理干净的视频潜变量，并通过轻量级交叉注意力解码器预测请求的 4D 属性。引入连续时间查询提供时间灵活性，并结合预训练的视频深度 LoRA 作为冻结的几何先验。\n- **深度解析**: 该方法在 3D 点跟踪、视频深度和相机位姿估计任务上实现了最先进或具有竞争力的性能。定性结果显示其在野外视频中能够跟踪复杂运动同时保持精细结构。这证明了视频生成预训练在统一 4D 感知方面的潜力（摘要未提供具体的定量实验数字和对比数据集名称）。\n- **领域归类**: [计算机视觉, 视频理解, 3D/4D 感知, 视频生成]\n---\n\n### 55. H-DDCM: Hadamard Codebooks for Fast Generative Image and Video Compression (H-DDCM：用于快速生成式图像和视频压缩的 Hadamard 码本)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18125)\n- **研究任务**: 解决基于扩散/流模型的免训练生成式压缩方法在超低比特率下依赖密集高斯码本导致的内存和计算成本高昂、扩展性差的问题。\n- **核心亮点**: 提出 H-DDCM，一种可扩展的生成式压缩框架，用隐式随机 Hadamard 字典替代高斯码本。利用快速 Walsh-Hadamard 变换，以 O(d log d) 的计算复杂度和 O(d) 的内存复杂度隐式合成全维字典。此外，引入了高效的无表字典编码方案，并将框架适配到自回归视频流模型，实现长视频近实时压缩。\n- **深度解析**: 现有的码本方法在组合比特流编码时计算量大。H-DDCM 通过 Hadamard 字典和免表字典编码大幅降低了内存和计算开销。在图像和视频基准测试中，H-DDCM 实现了具有竞争力的率失真-感知性能，同时显著降低了基于码本的免训练生成式压缩的开销。在单 GPU 上实现了长视频的流式压缩（摘要未提供具体的率失真指标数字和具体数据集名称）。\n- **领域归类**: [图像/视频压缩, 扩散模型, 生成式 AI, 信号处理]\n---\n\n### 56. PINT: A Unified Model with Shared Predictive Intent for Robot Manipulation (PINT：具有共享预测意图的机器人操作统一模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16355)\n- **研究任务**: 构建通用机器人操作模型，有效融合预训练视觉语言模型（VLMs）的语义推理能力和视频生成模型（VGMs）的世界建模能力。\n- **核心亮点**: 提出 PINT，通过共享的块级“预测意图”（Predictive Intent）协调语义推理、世界建模和动作生成，同时保留专家特定路径。在 VLM 序列中插入可学习的 Intent Tokens 形成该表示，并以此条件化 VGM 和动作专家（AE）。通过 VLM、VGM 和 AE 的原生预测目标联合学习该意图。\n- **深度解析**: 训练分两阶段：第一阶段冻结 VGM，让未来视频预测塑造与任务相关的预测意图；第二阶段固定意图并微调 VGM 和 AE。在没有具身预训练的情况下，PINT 在 RoboTwin 2.0-Hard 上 OOD 泛化达到 15.5%（对比 Fast-WAM 1.8% 和 StarVLA 3.2%），在 LIBERO-Plus 上达到 79.5%（对比 51.5% 和 75.0%）。在五个真实世界双臂任务中，ID 成功率 68%，OOD 成功率 24%（对比 Motus 35%/9% 和 π_{0.5} 67%/35%）。\n- **领域归类**: [机器人学, 具身智能, 视觉语言模型, 视频生成]\n---\n\n### 57. CLIFT: Conformal Self-Verification for Web Agent Training and Test-Time Scaling (CLIFT：用于 Web 智能体训练和测试时扩展的共形自验证)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06829)\n- **研究任务**: 解决开源 Web 智能体在强化学习训练中依赖弱监督（二元任务成功太稀疏，前沿 LLM 评判器太贵且部署时不可用）的问题。\n- **核心亮点**: 提出 CLIFT，一种基于共形自验证的训练和测试时扩展方法。训练时，智能体回答关于自身轨迹的自然语言验证问题，组合共形认证器保留与训练时评判器证据一致的信号，并将验证器得分融入每步奖励。测试时，使用冻结的认证库进行共形轨迹选择（CTS），通过保守的多数投票规则决定是否替换当前轨迹，无需外部评判器。\n- **深度解析**: 在 WebArena Infinity 上，CLIFT 在开源 Web 智能体中达到 SOTA。在 VisualWebArena 上，用开源模型训练的认证库在测试时迁移到 GPT-5.5 并达到 SOTA。在 Online Mind2Web 上，无需在基准上训练智能体，仅翻译认证问题库就能在零样本评估中提升实时 Web 智能体性能。该方法将昂贵的评判器反馈转化为可重用的训练和测试时扩展信号（摘要未提供具体的成功率数字）。\n- **领域归类**: [智能体, 强化学习, Web 自动化, 测试时计算]\n---\n\n### 58. RepForcing: Representation-Space Initialization for Autoregressive Video Distillation (RepForcing：自回归视频蒸馏的表示空间初始化)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20111)\n- **研究任务**: 将预训练的视频扩散模型蒸馏为少步自回归（AR）生成器，解决因果 ODE 初始化在短采样计划下无法保证高质量生成（细节模糊）的问题。\n- **核心亮点**: 提出 RepForcing（表示强制），通过表示空间监督而非中间教师轨迹回归来学习少步因果初始化。使用冻结的视频扩散 Transformer 的归一化特征，通过教师强制比较干净预测和训练目标。该阶段复用了为 AR 教师训练生成的合成视频，无需生成额外的因果 ODE 轨迹。\n- **深度解析**: 在 4 个采样步数下，RepForcing 在 DMD（分布匹配蒸馏）之前比基于中间教师的初始化更好地保留了生成质量。经过 DMD 后，四步分块模型将 VBench Total 从 84.04 提升至 84.66（+0.62 分），VisionReward 从 6.326 提升至 10.074（+59.25%），超越了基于因果 ODE 的基线。\n- **领域归类**: [视频生成, 模型蒸馏, 扩散模型, 自回归模型]\n---\n\n### 59. A team of Gemini 4 Argon agents beats Minecraft (一支 Gemini 4 Argon 智能体团队击败了 Minecraft)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22319)\n- **研究任务**: 验证 AI 智能体在沙盒生存游戏（Minecraft）中进行长视界、多智能体协作和自主编程以完成复杂目标（击败末影龙）的能力。\n- **核心亮点**: 将四个 Gemini 4 Argon 智能体置于 Minecraft 生存世界中，通过开源库 Mineflayer 控制玩家，并通过游戏内聊天和共享记忆进行协调。没有人为分配角色或编写游戏逻辑，智能体自主计划、编写和调试程序。\n- **深度解析**: 在简单难度的随机生成世界中，团队编写了 2,783 个程序，在 27 小时 14 分钟内击败了末影龙，期间死亡 605 次。据作者所知，这是首次由 AI 智能体端到端自主完成 Minecraft，仅使用标准 Mineflayer 库，没有人类预先侦察的种子或特定游戏工具。这要求智能体在超过一天的时间里，在数千个依赖步骤中保持连贯的计划，展示了长视界编码和多智能体协调的潜力（摘要未提供与其他基线方法的对比数字）。\n- **领域归类**: [智能体, 多智能体系统, 强化学习/自主规划, 游戏 AI]\n---\n\n### 60. Equal CER, Unequal Damage: Severity-Weighted Character Error Rate for OCR (相同的 CER，不同的损害：用于 OCR 的严重程度加权字符错误率)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20461)\n- **研究任务**: 改进 OCR 和视觉语言模型（VLMs）的评估指标字符错误率（CER），解决其无法区分轻微拼写错误和严重错误（如人名错误）的问题。\n- **核心亮点**: 提出 semCER，保留 CER 的对齐和分母，但通过 LLM 评判器为每个字素编辑分配一个严重程度分数，无需分词。semCER 将整体转录分数分解为命名的编辑，并将读者认为最严重的编辑排在排序列表的顶部。\n- **深度解析**: 在英语、越南语和中文中，semCER 的惩罚与读者的评级相吻合。在 CER 和 semCER 存在分歧的样本对中，英语和中文的读者更倾向于支持 semCER。在 16 种语言中，评判器对西班牙语中错误的变音符号或声调标记几乎不扣分，但在泰卢固语中则接近错误字母的严重程度。作者释放了 6100 万个评判编辑、汇总的读者评级和提炼的评分器（摘要未提供具体的 CER 数值对比）。\n- **领域归类**: [自然语言处理, 计算机视觉, OCR, 评估指标]\n\n### 61. PathFM: Fast Generative Forecasting of Multivariate Trajectories (PathFM：多变量轨迹的快速生成式预测)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22358)\n- **研究任务**: 多变量时间序列的生成式预测，重点解决现有模型在预测时忽略未来轨迹依赖结构（如累积需求、峰值负载等）的问题。\n- **核心亮点**: 引入PathFM模型，利用流匹配（flow matching）技术生成完整的未来路径；通过模型蒸馏（1至2步）和共享历史注意力缓存，使生成多条路径的时间与分位数模型单次查询相当；提出包含能量和变异函数得分的新评估基准fps-bench。\n- **深度解析**: 传统时间序列基础模型多关注边缘分位数预测，无法捕捉轨迹间的依赖结构。PathFM通过流匹配直接生成完整路径，弥补了这一缺陷。在效率方面，蒸馏和注意力缓存共享使其具备极高的实用性。实验表明，PathFM在fev-bench和TIME基准上保持了具有竞争力的边缘精度，并在fps-bench上取得了最高的聚合路径得分。此外，在混沌系统测试中，该模型能够维持长期变异性，避免了强基线模型快速崩溃的问题。\n- **领域归类**: [时间序列预测, 生成式模型, 流匹配]\n\n---\n\n### 62. Learning to Read Out: Unembedding Dynamics in Language Model Pretraining (学习读取：语言模型预训练中的反嵌入动态)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21025)\n- **研究任务**: 研究语言模型在预训练过程中何时以及如何获得特定能力，特别是反嵌入矩阵（readout）的学习动态及其对能力显现时间的影响。\n- **核心亮点**: 提出参数轨迹交叉编码（parameter-trajectory crosscoding）方法，直接追踪反嵌入矩阵的学习过程；发现模型隐藏状态编码任务信息的时间早于反嵌入矩阵能够表达该信息的时间；揭示了反嵌入矩阵学习率对能力显现时间的影响。\n- **深度解析**: 以往研究通常通过模型输出来判断模型何时获得某项能力，但这混淆了“模型内部编码”与“反嵌入矩阵表达”的时间线。本文通过直接分析反嵌入矩阵的权重变化，发现模型在Pythia预训练的0.4%到1.1%处存在一个狭窄的早期窗口，此时隐藏状态已能解码任务信息，但反嵌入矩阵尚未学会表达。提高反嵌入矩阵的学习率可使其更早发展并缩短这一差距，且对最终损失影响不大。这表明早期的行为转变可能反映的是反嵌入矩阵的学习进度，而非模型内部表征的学习进度。\n- **领域归类**: [大语言模型, 模型可解释性, 预训练动态]\n\n---\n\n### 63. Copy-Paste Language Models (复制粘贴语言模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19247)\n- **研究任务**: 提升大语言模型在上下文中的复制能力，并优化训练效率和下游任务性能。\n- **核心亮点**: 提出复制粘贴语言模型（CPLMs），在传统语言模型头（LM head）基础上增加轻量级的复制粘贴头（Copy-Paste head）；在135M到1.7B参数规模上验证了其在训练和推理开销极小的情况下的有效性；揭示了其成功的原因在于提供了一条替代梯度路径，缓解了LM head的梯度瓶颈。\n- **深度解析**: 虽然Transformer架构直观上擅长从输入中复制信息，但本文证明通过显式建模可以进一步提升这种能力。CPLMs通过引入额外的轻量级头部，不仅提升了训练效率和下游任务表现，还为长上下文和检索场景提供了新的操作点。从优化角度看，该设计为模型提供了一条替代的梯度传播路径，有效缓解了传统LM head在反向传播时可能遇到的梯度瓶颈问题。\n- **领域归类**: [大语言模型, 模型架构优化, 长上下文处理]\n\n---\n\n### 64. Explaining the Roles of Experts in Mixture-of-Experts LLMs for Personalization (解释混合专家大语言模型中专家在个性化中的作用)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22127)\n- **研究任务**: 理解和控制大语言模型（LLM）的个性化机制，解决密集模型中神经元多义性导致的难以定位个性化组件的问题。\n- **核心亮点**: 提出对混合专家（MoE）LLM进行个性化，利用其稀疏路由特性降低多义性；在3个开源MoE LLM上训练交叉编码器（crosscoders）学习可解释的个性化潜变量，并定位负责特定个性化特征的专家；通过因果干预验证了这些潜变量和专家路由在控制个性化行为中的关键作用。\n- **深度解析**: 传统的密集LLM由于神经元具有多义性，难以精确定位和控制个性化特征。本文转向MoE架构，通过稀疏路由机制有效降低了多义性。研究在大规模个性化数据集上微调MoE模型，并利用交叉编码器提取出可解释的个性化潜变量，成功识别出编码特定个性化特征的专家网络。因果干预实验进一步证明，操纵这些特定的潜变量或增强相关专家的激活，能够直接改变模型的个性化行为。个性化MoE模型在仅激活部分参数的情况下表现与密集模型相当，且产生的个性化潜变量与非个性化模型的重叠度更低。\n- **领域归类**: [大语言模型, 混合专家模型(MoE), 模型可解释性, 个性化]\n\n---\n\n### 65. Beyond Policy Rollouts: Embedding-Space Directional Exploration with Anchored Noise for LLM RLVR (超越策略采样：用于LLM RLVR的锚定噪声嵌入空间定向探索)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16105)\n- **研究任务**: 提升大语言模型在可验证奖励强化学习（RLVR）中的探索效率，解决小采样组内轨迹高度相似导致奖励变化不足的问题。\n- **核心亮点**: 提出EDEN（嵌入空间定向探索 via 锚定噪声）方法，在采样源头通过锚定输入扰动进行干预；在保持相同采样预算的情况下，用带有单一扰动嵌入位置的标准采样替换部分常规采样；在不改变模型架构和推理方式的前提下，显著提升了数学推理等任务上的表现和采样解的覆盖率。\n- **深度解析**: 在RLVR中，由于每个提示词的采样组较小，同一策略重复采样往往产生高度相似的轨迹，削弱了组内相对优势信号。现有的提高温度或增加熵奖励等方法并未改变采样的条件分布。EDEN通过在输入端引入高斯噪声扰动，并利用共享锚点提供共同的条件方向，强制模型在嵌入空间中进行定向探索。这种方法不仅增加了采样轨迹的多样性，提高了组内相对学习信号的有效性，而且无需修改模型架构或测试时推理流程，是一种轻量且高效的探索增强策略。\n- **领域归类**: [大语言模型, 强化学习, 可验证奖励(RLVR), 探索策略]\n\n---\n\n### 66. One Bias Score, Two Factors: How Mitigations Affect Option Bias in Multiple-Choice Evaluation (一个偏差分数，两个因素：缓解措施如何影响多选题评估中的选项偏差)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20993)\n- **研究任务**: 分析和缓解大语言模型在多选题评估中的选择偏差（selection bias）和顺序敏感性（order sensitivity）。\n- **核心亮点**: 提出通过池化选择率标准差（pooled SD）将选择偏差和顺序敏感性统一起来；将pooled SD分解为两个无标签因素：翻转率（flip rate）和位置偏斜（positional skew）；在41个检查点和12个基准上揭示了不同缓解措施对这两个因素的不同影响机制。\n- **深度解析**: 多选题评估中，选项顺序的改变会影响模型的答案。本文提出用池化选择率标准差来综合衡量这种偏差，并巧妙地将其分解为翻转率（衡量答案在选项重排时发生改变的比例）和位置偏斜（衡量模型对特定选项字母的偏好程度）。研究发现，翻转率与准确率和输出不确定性相关，而位置偏斜与选项符号先验相关。先验校正主要降低位置偏斜，而将每个顺序与其反转顺序聚合主要降低翻转率。作者建议同时报告这两个因素，以更准确地区分缓解措施对模型稳定性和正确性的不同影响。\n- **领域归类**: [大语言模型, 模型评估, 偏差与公平性, 多选题评测]\n\n---\n\n### 67. ForcingBooster: Adaptive Patch-wise Denoising for Fast Autoregressive Video Diffusion (ForcingBooster：用于快速自回归视频扩散的自适应逐块去噪)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.12625)\n- **研究任务**: 加速自回归视频扩散模型的生成过程，解决现有方法在生成视频块时均匀分配计算导致的资源浪费问题。\n- **核心亮点**: 提出ForcingBooster框架，能够根据视频内容的空间异质性，动态为各个图像块（patches）分配去噪步数；简单块提前停止以提效，困难块增加细化步数；在保持视觉质量与四步基线相当的情况下，将应用于视频块的总去噪步数减少了约50%。\n- **深度解析**: 自回归视频扩散模型在生成下一个视频片段时，通常对所有图像块采用相同的去噪计划和计算步数，这忽略了视频内容在空间上的难易差异。ForcingBooster通过引入轻量级的路由模块，动态评估每个块的难度，从而自适应地分配计算资源。这种非均匀的计算分配策略极大地减少了冗余计算，在几乎不损失生成质量的前提下，显著提升了视频生成的整体效率，且兼容现有的少步自回归扩散模型。\n- **领域归类**: [视频生成, 扩散模型, 自回归模型, 计算优化]\n\n---\n\n### 68. SimForcing: Distilling Simulation Motion Priors into Real-Domain Robot World Models (SimForcing：将仿真运动先验蒸馏到真实域机器人世界模型中)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.06598)\n- **研究任务**: 构建动作条件的机器人世界模型，解决从异构机器人视频中同时学习精确轨迹响应和逼真视觉动态的难题，特别是克服仿真与真实环境间的外观差异。\n- **核心亮点**: 提出SimForcing框架，利用仿真环境作为可迁移运动知识的来源和可控的预测参考；通过潜在运动蒸馏内部化运动先验；引入多块仿真条件与条件dropout机制，结合无分类器引导平衡内部知识与仿真引导；在Bridge等数据集上取得最优视觉指标，并能提升下游视觉-语言-动作（VLA）模型的成功率。\n- **深度解析**: 机器人世界模型需要精确响应动作并保持视觉真实感，但真实数据缺乏结构化运动监督，而仿真数据存在外观差异。SimForcing巧妙地将仿真数据作为教师模型，通过潜在运动蒸馏将运动先验转移到真实域学生模型中，同时利用多块仿真条件和条件dropout避免模型过度依赖可能不准确的仿真预测。在Bridge数据集上，该方法取得了最佳的PSNR、SSIM、LPIPS和FVD指标。在InternData-A1上的评估进一步支持了其跨数据集的适用性。此外，使用训练好的世界模型初始化VLA模型，有效提升了LIBERO任务的成功率。\n- **领域归类**: [机器人学, 世界模型, 视频生成, 仿真到现实(Sim-to-Real)]\n\n---\n\n### 69. Recursive Environment Scaling for General Long-Horizon Agents (面向通用长视界智能体的递归环境缩放)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.16397)\n- **研究任务**: 通过环境缩放（environment scaling）增加智能体基准测试的难度，同时保持核心任务目标不变，以用于智能体评估和训练。\n- **核心亮点**: 提出递归环境缩放（RES）框架，通过改变信息访问、资源关系和执行依赖来转换现有基准环境；利用基于执行的检查来验证候选环境，并跨轮次继承接受的更改；实验证明RES能显著降低现有模型的任务成功率，且使用RES生成的轨迹进行微调能大幅提升模型性能。\n- **深度解析**: 为了评估和训练长视界智能体，本文提出了一种在不改变核心任务目标的前提下增加环境复杂度的方法。RES框架包含一个提议者来修改环境的信息、资源和依赖关系，并通过执行检查来确保修改的有效性。在来自3个基准的294个初始任务上的实验表明，RES生成的环境使6个评估模型的任务成功率在Claw-Eval-Live上下降了57.14%至77.14%。更重要的是，在相同轨迹数量和优化设置下，使用RES生成的复杂轨迹进行监督微调，在9个模型-基准对比中全面优于原始轨迹微调，性能提升了7.00%至14.61%。\n- **领域归类**: [智能体(Agents), 强化学习, 环境构建, 长视界任务]\n\n---\n\n### 70. VascuSR: Iterative Anatomy-Aware Diffusion for CT Super-Resolution (VascuSR：用于CT超分辨率的迭代解剖感知扩散模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.20509)\n- **研究任务**: 从严重降采样的计算机断层扫描（CT）图像中恢复清晰细节，特别是解决生成式超分辨率中可能出现的解剖学上不支持的血管细节（如血管缺失、伪影或错误连接）问题。\n- **核心亮点**: 提出VascuSR框架，将图像重建与显式的3D血管引导相结合；利用显式3D血管表示捕捉跨切片结构信息，并通过轻量级3D生成细化器专注于血管结构；引入轻量级解剖控制器和迭代反馈机制，将细化后的结构注入扩散解码器；在多个数据集上显著提升了分割准确率和3D血管结构质量。\n- **深度解析**: 传统的生成式超分辨率模型在恢复CT图像高频细节时，可能会生成视觉上合理但解剖学上错误的血管结构。VascuSR通过引入显式的3D血管表示，为扩散模型提供了解剖学层面的强约束。在重新标注的MSD Task08和HVM数据集上，VascuSR在分割准确率（Dice和clDice）和3D血管结构（连通性和平均中心线距离）方面均优于插值和基于学习的基线。与基于学习的基线相比，VascuSR在两个数据集上将类别平均的连通组件数量减少了20%以上，并在MSD数据集上将平均中心线距离减少了10%以上，同时保持了与超分辨率主干网络相当的图像质量。\n- **领域归类**: [医学图像处理, 计算机断层扫描(CT), 超分辨率, 扩散模型]\n\n### 71. EVA-Cap: Optimizing Audiovisual Video Captioning via Event-Centric Alignment (EVA-Cap：通过以事件为中心的对齐优化音视频视频字幕生成)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22186)\n- **研究任务**: 音视频视频字幕生成，旨在优化细粒度的音视频对齐。\n- **核心亮点**: 提出EVA-Cap框架，将字幕分解为原子音视频事件；构建EVA-Data数据集，利用GRPO算法针对全局事件完整性、事件内归因和事件间同步三个目标进行优化。\n- **深度解析**: 现有方法多将字幕生成视为非结构化文本生成，忽略了视频的内在语义结构。EVA-Cap通过将非结构化文本监督转化为以事件为中心的对齐，显著提升了模型对视频语义的理解。实验表明，该方法在ChronusAV上平均提升9.0%，在WorldSense上提升3.3%。\n- **领域归类**: [多模态, 视频理解, 大语言模型]\n---\n\n### 72. Skill-Decoupled On-Policy Expert Distillation for Unified Vision-Language Models (面向统一视觉语言模型的技能解耦在策略专家蒸馏)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.22217)\n- **研究任务**: 统一视觉语言模型的多能力联合优化，解决异构目标带来的跨能力梯度冲突。\n- **核心亮点**: 提出SCOPED（技能解耦在策略专家蒸馏）方法；通过奖励引导的反思提取显式技能；在蒸馏阶段，技能用于指导专家监督，但对学生模型隐藏，促使其内化程序性知识。\n- **深度解析**: 直接联合优化多种能力会导致梯度冲突，而独立训练专家又容易引入奖励黑客偏差。SCOPED通过技能解耦，让学生模型在没有显式技能提示的情况下学习，从而更好地整合独立获取的能力。该方法在8个多模态基准上均优于基线模型，但具体的性能提升数字摘要未提供。\n- **领域归类**: [多模态, 视觉语言模型, 强化学习, 知识蒸馏]\n---\n\n### 73. TimeRSI: Towards Self-Improved Agentic Deployment for Time-Series Foundation Models (TimeRSI：面向时间序列基础模型的自我改进智能体部署)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.19725)\n- **研究任务**: 时间序列基础模型的实际应用部署，解决模型输入输出需要特定任务设计的问题。\n- **核心亮点**: 提出TimeRSI自我改进智能体部署系统；编码智能体自动修改预测管道并通过历史误差反馈进行迭代；部署时通过自适应选择器根据相似条件选择最佳管道。\n- **深度解析**: 时间序列基础模型虽然零样本预测能力强，但实际部署需要大量人工设计管道。TimeRSI利用编码智能体构建反馈闭环，自动调整管道，并结合自适应选择器应对不同场景，大幅减少了人工干预。在TIME和fev-bench的198个任务上，该方法在6个预测指标上均优于所有提交方案。\n- **领域归类**: [时间序列分析, 智能体, 基础模型]\n---\n\n### 74. PAIR: Bridging Perception and Action in Vision-Language-Action Models (PAIR：在视觉-语言-动作模型中桥接感知与动作)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.09016)\n- **研究任务**: 视觉-语言-动作（VLA）模型中从感知表示到动作生成的过渡。\n- **核心亮点**: 提出PAIR框架，学习感知和动作之间的共享表示；使用掩码动作自编码器生成动作潜在令牌，并通过桥接模块提取特征形成桥接令牌；推理时移除自编码器，仅从当前观察和指令生成桥接令牌。\n- **深度解析**: 现有的连续动作VLA模型通常隐式处理感知到动作的过渡。PAIR通过显式构建共享的中间表示，为动作专家提供准备好的起点。实验显示，在LIBERO-Plus上VLA-Adapter的成功率从59.1%提升至64.2%，在CALVIN上平均完成序列长度从4.42增至4.53，在7个真实世界任务中OpenVLA-OFT的成功率从51.4%提升至65.0%。\n- **领域归类**: [具身智能, 机器人学, 视觉语言动作模型]\n---\n\n### 75. When the KV Cache Is Slower Than the GPU: Scaling Remote KV Tiers for Context-Parallel Prefill (当KV缓存比GPU更慢时：扩展用于上下文并行预填充的远程KV层)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21500)\n- **研究任务**: 长上下文大语言模型服务中，优化跨请求的远程注意力KV缓存重用。\n- **核心亮点**: 揭示了远程KV缓存可能比GPU重新计算更慢的问题；提出基于成本模型的优化方案，包括KV存储分片、按rank分区远程层、异步加载及修复客户端bug。\n- **深度解析**: 在解耦部署中，远程KV缓存的同步加载和带宽限制会导致严重的延迟和队列不稳定。作者通过理论成本模型分析瓶颈，实施了系统级优化。优化后，在命中率极高的流中，p99延迟从83.32秒降至0.67秒，预填充吞吐量提升14%，结合上游内核修复后提升34%。\n- **领域归类**: [大模型推理优化, 分布式系统, KV Cache]\n---\n\n### 76. Speech event detector: Timestamped detection of non-verbal vocalizations and background sounds for rich speech transcription (语音事件检测器：用于丰富语音转录的非语言发声和背景声音的时间戳检测)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.14232)\n- **研究任务**: 语音转录中非语言内容（如呼吸、咳嗽、笑声及背景声音）的时间戳检测。\n- **核心亮点**: 提出5.8M参数的Speech Event Detector（Conv-Transformer），支持54个事件类别；设计了后处理流程将事件合并至Whisper转录；通过规则映射和CTC强制对齐统一了7个数据集的标签。\n- **深度解析**: 传统ASR只输出文字，丢失了丰富的非语言信息。该模型通过轻量级架构和巧妙的标签统一策略，在CPU上实现了高效的实时检测。在敏感配置下，召回率为49%，精确率为0.30；在平衡配置下，召回率为0.37，精确率为0.36。\n- **领域归类**: [语音处理, 音频事件检测, 多模态转录]\n---\n\n### 77. CoWorld Reasoner: Agentic Multimodal Reasoning with the Evolving Video World Model-Driven Harness (CoWorld Reasoner：基于演进视频世界模型驱动框架的智能体多模态推理)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.21910)\n- **研究任务**: 视觉语言模型在运动、动作和视角变化等超出输入图像范围的时空推理。\n- **核心亮点**: 提出CoWorld Reasoner智能体框架，将视频世界模型作为统一的视觉推理引擎；引入VLM-VWM Harness协同进化机制，基于执行反馈联合修订工具、技能和代码，且保持模型权重固定。\n- **深度解析**: 现有方法通常通过固定管道调用视频世界模型。CoWorld Reasoner通过智能体动态决定何时进行视觉想象及如何操作，并通过协同进化机制不断优化提示和工具。在7个基准测试中，最强变体在MMSI上相对准确率提升11.8%，在ERQA上提升13.0%。\n- **领域归类**: [多模态推理, 视频世界模型, 智能体]\n---\n\n### 78. AI-Driven, Timing-Aware Power Optimization (AI驱动的时序感知功耗优化)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.18890)\n- **研究任务**: 集成电路设计中的布线后功耗恢复，在严格的时序、电气和物理约束下优化功耗。\n- **核心亮点**: 提出AI驱动的框架，使用学习模型对功耗恢复编辑和修复动作进行排序；结合确定性EDA分析控制接受标准；使用梯度提升模型集成预测功耗变化和约束回归风险。\n- **深度解析**: 在芯片物理设计阶段，功耗恢复往往引发时序等副作用。该研究利用AI模型预测修改带来的影响，并通过确定性的EDA分析作为“守门员”，确保每次修改在物理实现前都是安全且净收益为正的。关于具体的训练模型结果和实验数字，摘要未提供。\n- **领域归类**: [电子设计自动化, AI for Engineering, 芯片设计]\n---\n\n### 79. ANTE: Anticipate, Then Execute -- Learning Internal World Models for Coding Agents from Verified Beliefs (ANTE：先预测后执行——从验证信念中学习编码智能体的内部世界模型)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.15368)\n- **研究任务**: 软件工程智能体在复杂编码任务中的动作后果预测与信用分配问题。\n- **核心亮点**: 提出ANTE智能体强化学习框架；引入BAPO（信念锚定策略优化），利用动作前的内部信念进行每步信用分配；提出ANTE-TTO用于推理时的测试时优化。\n- **深度解析**: 现有的编码智能体缺乏前瞻能力，错误操作会导致不可逆的破坏。ANTE让智能体在执行前预测后果，并将预测结果作为强化学习的奖励信号，从而训练出具备内部世界模型的智能体。在SWE-bench Verified上，Qwen3-32B的pass@1从25.0%提升至57.2%，世界模型准确率从44%提升至69%。\n- **领域归类**: [智能体, 强化学习, 代码生成]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 G
