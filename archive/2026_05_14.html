- **深度解析**: 在预训练模型基础上引入循环机制，让模型在潜在空间进行多次迭代 refinement。类似于增加推理步数（System 2 思维），在不微调参数的情况下增强模型处理复杂任务的能力。

- **领域归类**: [AI 安全，水印，文本生成]
