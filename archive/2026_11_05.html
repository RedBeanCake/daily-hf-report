    <h1>前沿科研情报 - 2026-11-05</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems (Route Anything：通用人工智能系统中模型与策略路由的研究)\n- **社区热度**: `👍 83 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05275)\n- **研究任务**: 研究在通用人工智能系统中，如何动态选择和协调最合适的候选模型、工具或策略（即路由），以在性能和计算成本之间取得平衡。\n- **核心亮点**: 提出了 Route Anything 统一框架，构建了包含 25 个基准、452 种候选配置的跨模态轨迹矩阵。实验表明，学习到的路由器在 16 个基准上比最佳固定候选高出 0.3 分，视频生成高 2.1 分，机器人操作高 1.1 分且策略时间减少 24%，平均效率提升 8.82 倍。\n- **深度解析**: 该研究建立了一个统一的理论基础，用于表征质量-成本权衡下的最优路由，并确立了路由器可用信息如何决定其可达性能。通过构建涵盖语言理解、图像/视频/语音生成、代码、办公智能体和机器人操作的庞大轨迹矩阵，系统性地调查了全模态模型路由的潜力以及路由提升效率的条件。\n- **领域归类**: [AI系统架构, 模型路由, 通用人工智能]\n---\n\n### 2. Words Caught in the Heart: Simulating Person-Specific Expression for Self-Opaque Clients in Psychotherapy (Words Caught in the Heart：心理治疗中自我认知模糊来访者的特定个人表达模拟)\n- **社区热度**: `👍 67 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.00617)\n- **研究任务**: 模拟心理治疗中来访者在能够连贯描述痛苦之前的特定个人表达，捕捉情绪、安全感和信任等因素对表达方式的动态影响。\n- **核心亮点**: 提出 Pandora 心理治疗来访者模拟框架，通过显式的表达规划改善与个人语言模式的对齐。在 115 个案例的评估中，获得最高的表达相似度和整体披露对齐分数，AI 感判断从基线的 43.3%-67.2% 大幅降至 7.2%。\n- **深度解析**: Pandora 框架根据治疗师的干预动态更新心理与关系状态，构建主观评估与归因以规划回应策略。其核心机制在于引入了一个独立的表达规划器，该规划器将上述决策与从来访者话语中蒸馏出的语言模式相结合，从而指导最终的语言生成，使模拟更贴近个体真实的表达习惯。\n- **领域归类**: [自然语言处理, 心理治疗模拟, 情感计算]\n---\n\n### 3. Think Less, Locally: Local Preference Learning for Reasoning Compression (Think Less, Locally：用于推理压缩的局部偏好学习)\n- **社区热度**: `👍 64 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04814)\n- **研究任务**: 压缩大推理模型的长思维链（Chain-of-Thought），解决模型在获取充分信息后继续深思熟虑所带来的高昂推理成本问题。\n- **核心亮点**: 提出 LoCo 局部偏好学习方法。在数学和代码生成基准上，LoCo 将完成长度减少 23.4%-45.4%，同时保持或提高准确率，并在所有代码基准上取得最佳 AUC，展现了跨领域的通用性。\n- **深度解析**: LoCo 从模型自身的轨迹中检测候选的“过度思考”状态，冻结对应的推理前缀，并从相同状态重新生成更短的、经过验证的续篇。由此构建状态条件偏好对并使用 DPO 进行训练。这种机制教会模型在局部决策中何时继续推理、何时得出结论，而非单纯鼓励生成更短的轨迹。\n- **领域归类**: [大语言模型, 推理压缩, 偏好学习]\n---\n\n### 4. MoviEdit: Long-form Multi-Shot Video Editing Made Easy (MoviEdit：让长视频多镜头编辑变得简单)\n- **社区热度**: `👍 61 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02737)\n- **研究任务**: 解决长视频多镜头编辑中，编辑意图在场景、视角和主体外观突变时保持连贯性的问题，以及处理比传统单镜头编辑器更长的视觉上下文。\n- **核心亮点**: 提出 MoviEdit 端到端框架，开发了自动数据生成管线生成 87K 无手动标注的配对编辑视频，并引入 MoviEdit-Bench 基准。在文本和图像引导编辑上大幅超越现有开源模型，与业界前沿模型表现持平。\n- **深度解析**: MoviEdit 采用级联双向自回归架构：轻量级双向阶段首先在时空压缩表示上建立全局连贯的编辑草稿，随后在完整视频上进行自回归传播和细化。数据方面，通过涵盖同步多视角、真实多镜头和生成多镜头内容的自动管线，解决了跨镜头监督数据稀缺的问题。\n- **领域归类**: [计算机视觉, 视频编辑, 多模态生成]\n---\n\n### 5. Behind Video Generation: Observations and Insights on Multimodal Understanding from Kling (Behind Video Generation：来自可灵的多模态理解观察与洞察)\n- **社区热度**: `👍 51 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04916)\n- **研究任务**: 总结从可灵（Kling）连续迭代中获得的多模态理解观察与洞察，探讨视频生成质量如何作为多模态理解在数据-条件-对齐-评估全链条上的投影。\n- **核心亮点**: 系统分享了可灵在基础模型、提示增强、文本编码器到奖励建模的实践经验。强调可靠的文本编码器源于感知训练而非更强的语言能力，并引入结合通用奖励模型和决策奖励模型的奖励建模机制。\n- **深度解析**: Kling-MLLM 统一多种模态输入并针对下游模块特化；将字幕生成视为最大化描述密度的语义契约，并扩展为参考锚定字幕；提示增强通过文本级和生成器在环强化学习进行优化；奖励建模结合通用奖励模型（提供可解释的局部批评）与决策奖励模型（进行快速多维评分），并将感知带宽作为首要设计参数。\n- **领域归类**: [多模态大模型, 视频生成, 强化学习]\n---\n\n### 6. DreamX: Video Diffusion Model is a Universal Latent Action Learner (DreamX：视频扩散模型是通用的潜在动作学习器)\n- **社区热度**: `👍 49 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05377)\n- **研究任务**: 从视频中学习通用的动作表示，要求对同一动作的不同执行保持一致性，同时对具身和外观的变化保持不变。\n- **核心亮点**: 将预训练视频扩散模型重新用作通用潜在动作学习器（DreamX），将每帧压缩 300 倍。在 LARY-Bench 上达到 SOTA，支持任意到任意的视频迁移和跨具身/环境的零样本动作迁移。\n- **深度解析**: DreamX 利用视频模型的生成先验，从丰富的时空特征中提取与动作相关且与视觉外观解耦的动态特征。提取的潜在空间作为跨具身（人和机器人）、环境和动作参数化的共享动作接口，不仅支持零样本迁移，还允许在紧凑的潜在动作空间中进行策略学习，从而降低计算成本。\n- **领域归类**: [计算机视觉, 具身智能, 视频扩散模型]\n---\n\n### 7. RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild (RoboColosseum：大规模野外物理智能评估)\n- **社区热度**: `👍 43 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02497)\n- **研究任务**: 在多样化环境中大规模评估通用机器人策略的跨机器人、跨任务和跨环境泛化及适应能力。\n- **核心亮点**: 提出 RoboColosseum 分布式评估框架。初始研究评估了 5 种 VLA 策略和 3 种前沿 AI 代理。发现前沿代理可与专用 VLA 策略媲美，但所有系统在开放世界任务中均表现挣扎；微调后不同具身的最优策略不同，且跨具身排名一致性弱。\n- **深度解析**: 框架包含 Open Track（无任务特定适应的盲测配对试验）和 Fine-tune Track（测量 VLA 策略在每种具身 100 个演示下的 20 个任务适应能力）。通过 5699 次配对比较发现，Open Track 排名不能很好地预测微调后的相对性能。此外，测量部分进展能揭示仅靠任务成功率所忽略的差异（如 G1 人形机器人无策略完成任何任务，但平均进展在 13.3% 到 23.2% 之间）。\n- **领域归类**: [机器人学, 物理智能, 模型评估]\n---\n\n### 8. Factorized MLLM Embeddings for Composed Image Retrieval (Factorized MLLM Embeddings：用于组合图像检索的分解多模态大语言模型嵌入)\n- **社区热度**: `👍 42 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05193)\n- **研究任务**: 组合图像检索（CIR），即给定参考图像和修改文本，检索目标图像。解决现有 MLLM 方法未能充分利用组合理解能力的问题。\n- **核心亮点**: 提出 FactEmbed，将组合查询理解与构建判别性嵌入解耦。通过分解潜变量模拟预期的视觉修改，在形成检索表示前先锚定目标语义。在多个 CIR 基准上超越先前工作。\n- **深度解析**: FactEmbed 使用一组分解潜变量，通过中间目标想象目标模拟预期的视觉修改，鼓励潜变量在形成判别性表示前先锚定目标语义。随后优化分解级对比损失，并将分解表示蒸馏到 MLLM 的更深注意力层。推理时，保留 [EOS] token 建立全局级嵌入用于检索，并利用均值池化的分解潜变量以极低成本对短候选列表进行重排。\n- **领域归类**: [多模态检索, 计算机视觉, 大语言模型]\n---\n\n### 9. Axion 1.0: Open Agent Foundation Models, Simplified (Axion 1.0：简化的开放智能体基础模型)\n- **社区热度**: `👍 38 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03233)\n- **研究任务**: 构建一个兼具强大、广泛的智能体能力且训练方法极其简单的完全开放的智能体基础模型。\n- **核心亮点**: Axion 1.0 仅通过三个阶段训练（两次轻量级 SFT 和一次 RL），无需专门的中期训练、DPO 或 OPD。在广泛的智能体基准上表现强劲，与领先商业模型竞争力相当。完全开源，包括数据构建、生成、过滤、验证、提示和训练代码。\n- **深度解析**: 训练分为三阶段：第一阶段通过模型感知数据构建（合成难题并基于基础模型自身成功策略进行对抗性增强）培养强大的独立推理能力；第二阶段通过可扩展管线构建基于真实数据源和确定性计算的多样化、可自动验证任务，扩展至依赖工具的推理；第三阶段通过强化学习进一步增强长视野推理及与外部工具/环境的交互。\n- **领域归类**: [智能体, 大语言模型, 强化学习]\n---\n\n### 10. ToolSpace: Scaling Tool-Centric Environment Synthesis for Long-Horizon Agents (ToolSpace：为长视野智能体扩展以工具为中心的环境合成)\n- **社区热度**: `👍 34 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05036)\n- **研究任务**: 解决长视野智能体在组合 MCP 服务工具时，现有环境扩展方法导致工具接口不匹配、组合缺乏执行基础、任务难以跨环境的问题。\n- **核心亮点**: 提出 ToolSpace 以工具为中心的框架，从真实 MCP 服务和开放智能体语料库的执行轨迹中挖掘依赖关系，使用确定性规则而非 LLM 判断。在 AutomationBench 等基准上生成更难的 Pro 版本，使前沿模型分数下降高达 38.2 分，并显著提升特定模型的表现。\n- **深度解析**: ToolSpace 从相邻调用中挖掘数据、状态和重试依赖，使用确定性规则构建加权工具组合图并聚类为环境。仅为状态突变环境合成数据库，查询和无状态工具重放记录返回值。执行状态感知的带回滚随机游走，将每条链反编译为带断言检查的自然语言任务，仅保留从初始状态成功重放的样本。\n- **领域归类**: [智能体, 工具使用, 环境合成]\n\n### 11. YANAMI: A Large-Scale Multimodal Dataset and Benchmark for Multiturn Stateful Interaction (YANAMI：用于多轮有状态交互的大规模多模态数据集与基准)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05280)\n- **研究任务**: 解决统一多模态模型（UMMs）在多轮有状态交互中缺乏有效监督与评估的问题，即模型难以在跨轮次对话中理解、维护、更新并忠实实现不断演变的对话状态。\n- **核心亮点**: 提出首个大规模多模态对话数据集和基准 YANAMI（包含 YANAMI-400K 和 YANAMI-Bench）。YANAMI-400K 包含 40 万条多轮多模态对话（超 200 万张图像和 260 万轮对话），涵盖多图像融合、图像编辑、世界建模和视觉推理四个场景。YANAMI-Bench 包含 400 条对话，联合评估对话状态理解和视觉实现能力。\n- **深度解析**: 现有数据集多为单轮任务或各轮次可独立解决，无法有效评估模型在多轮交互中维持状态的能力。YANAMI 填补了这一空白。实验表明，在 YANAMI-400K 上微调 BAGEL 模型，可显著提升图像编辑、生成和多模态有状态交互能力（分别提升 10.3%、2.0% 和 13.23%），且保持通用视觉理解能力。YANAMI-Bench 评估揭示现有 UMM 在维持、更新和视觉实现多模态对话状态方面仍面临困难（具体的基线对比数字摘要未提供）。\n- **领域归类**: [多模态学习, 数据集与基准, 对话系统]\n---\n\n### 12. VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks (VidUEU-Agent：用于多模态理解、编辑和统一任务的数据整理智能体)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04418)\n- **研究任务**: 解决多模态学习中高质量指令数据稀缺且标注成本高的问题，特别是将原始视频转化为精确指令数据的挑战。\n- **核心亮点**: 提出 VidUEU-Agent，一个从原始视频自动合成多模态理解、编辑和统一任务指令数据的自动化流水线，并构建了包含 10 万训练样本的大规模数据集 VidUEU-100K。\n- **深度解析**: VidUEU-Agent 采用四阶段流水线：全局感知过滤低质量镜头、挖掘关键帧和多模odal信号、构建元数据并路由以合成指令样本。更重要的是，其智能体框架能够根据下游训练结果自主迭代数据分布，从而优化数据质量、平衡性和训练效果。实验表明，在 VidUEU-100K 上微调基线模型，能在多个代表性基准测试中取得显著且一致的性能提升（具体的性能提升数字摘要未提供）。\n- **领域归类**: [多模态学习, 数据工程, 智能体]\n---\n\n### 13. EvoTeam: Multi-Agent Collaboration via Evolving Teams (EvoTeam：通过进化团队实现多智能体协作)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.39813)\n- **研究任务**: 解决基于大语言模型的多智能体系统（MAS）在异构任务中协作进化的挑战，现有方法通常局限于共享结构内重组团队，并在不兼容的团队上下文中复用交互规则。\n- **核心亮点**: 提出 EvoTeam，一个以协作为核心的进化框架，通过执行经验联合进化团队组织、交互规则和单个智能体技能。\n- **深度解析**: EvoTeam 维护一个可复用团队的库，选择或创建智能体团队，并通过特定于团队的交互规则指导协作。协作经验在兼容的团队上下文中积累，而单个技能在团队间保持可复用。实验在四个基准测试中证明了其有效性（具体的性能提升数字和基线对比摘要未提供）。\n- **领域归类**: [多智能体系统, 大语言模型, 进化算法]\n---\n\n### 14. WebHarbor: Docking Real Websites for Evolving GUI Agent Environments (WebHarbor：为不断演进的 GUI 智能体环境对接真实网站)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03634)\n- **研究任务**: 解决 GUI 网页智能体在评估和训练中缺乏真实、交互且稳定的环境的问题（实时网站评估受内容变化和访问限制影响，而现有合成环境缺乏功能深度和视觉保真度）。\n- **核心亮点**: 提出 WebHarbor，一套包含 153 个可执行且已 Docker 化的网站环境，在确定性控制下忠实重构真实网络服务的视觉界面、内容和功能工作流，包含 3518 个任务。\n- **深度解析**: WebHarbor 通过任务驱动的人机协作构建，环境随新任务扩展功能范围，编码智能体实现更改，人类贡献者审核视觉保真度、功能正确性和任务有效性。除了可靠评估，WebHarbor 还提供高保真合成网络环境用于低成本的强化学习（RL）。实验表明，在 WebHarbor 中使用 RL 训练的 Qwen 4B 级 GUI 智能体能泛化到未见任务，并在四个基准测试中与领先的开源 GUI 网页智能体表现相当（具体的性能对比数字摘要未提供）。\n- **领域归类**: [智能体环境, GUI 智能体, 强化学习]\n---\n\n### 15. SpecPilot: Autonomous Algorithm Discovery and Systems Optimization for Speculative Decoding (SpecPilot：用于推测解码的自主算法发现与系统优化)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02501)\n- **研究任务**: 解决推测解码（特别是并行推测解码）在实际部署系统中未能达到理论最大加速比的问题，识别了单请求时读取所有目标权重、批处理时验证工作抵消加速、以及部署特定性导致无通用优化方案三大挑战。\n- **核心亮点**: 提出 SpecPilot，一个自主智能体循环，为每次部署发现算法和系统优化。发现了通用的无损 12 位权重格式、混合循环目标的树验证、两级验证和三种批处理机制。\n- **深度解析**: SpecPilot 在每一轮中通过成本模型定位当前系统与理论上限的最大差距，并行智能体探索方向并整合成功方案，Token forcing 检查输出以防止奖励黑客，结构化记忆将验证机制传递到新轮次和部署。在四个目标模型、三个草稿模型、两个 GPU 平台和五个基准上的评估表明，无需训练或质量损失，单请求时加速比从 stock 的 4.46 倍提升至 10.87 倍，批处理时从 1.94 倍提升至 3.93 倍。\n- **领域归类**: [大语言模型推理优化, 系统优化, 智能体]\n---\n\n### 16. ParetoSaddler: Pareto-Guided Optimization of Agent Harnesses for Quality and Cost (ParetoSaddler：基于帕累托引导的智能体 Harness 质量与成本联合优化)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02079)\n- **研究任务**: 解决 LLM 智能体 Harness（线束/框架）优化中，将部署偏好应用于中间更新会过早拒绝对后续改进有价值的候选者的问题，实现质量与成本的联合优化。\n- **核心亮点**: 提出 ParetoSaddler，将中间候选者晋升与最终部署选择分离。使用贝叶斯自举帕累托支持来晋升在质量或成本上表现出可信进展的候选者。\n- **深度解析**: 在每次迭代中，优化器更新父 Harness 生成候选者，通过重复执行比较两者，并使用贝叶斯自举帕累托支持晋升候选者。晋升的候选者接受更广泛的开发评估，并保留作为后续优化步骤的父代。在 ClawMark 上，质量从 70.86% 提升至 81.35%，成本从 $1.17 降至 $1.01/任务；在 GAIA2 上，质量从 56.22% 提升至 62.89%，成本从 $0.78 降至 $0.45/任务。帕累托选择的 Harness 在更低成本下实现了比仅优化质量的 Harness 更高的质量。\n- **领域归类**: [大语言模型智能体, 多目标优化, 提示工程]\n---\n\n### 17. MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery (MoLRSI：用于分子发现的递归自我改进 AI 智能体)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.39714)\n- **研究任务**: 解决分子发现中需要在庞大组合搜索空间中导航并平衡相互竞争的生物学目标的问题，优化工作流并通过经验改进其开发。\n- **核心亮点**: 提出 MoLRSI，一个结合工作流和模型架构系统优化与持久跨任务记忆的 AI 智能体，递归改进其分子发现的搜索策略。\n- **深度解析**: MoLRSI 利用工作流性能、细化结果和执行反馈来指导后续搜索，改进工作流及其开发策略。在抗生素发现中，MoLRSI 开发了平衡抗菌活性、细胞毒性和结构新颖性的筛选工作流，实验命中率达到 15.9%（之前专家主导的工作流为 8.7%）。在从头设计肽-MHC 结合剂中，产生了 8 个针对 MART-1 和 SARS-CoV-1 pMHC 的实验验证命中物，而 Claude Science 完全失败。\n- **领域归类**: [AI for Science, 分子发现, 智能体]\n---\n\n### 18. \"Shall We Approve?\" Consequence-Aware Approval for Autonomous Coding Agents (“我们应该批准吗？” 面向自主编码智能体的后果感知审批机制)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.40753)\n- **研究任务**: 解决自主编码智能体中现有自动审批器仅依赖请求和命令文本，无法评估命令实际执行后果（行为取决于调用的代码和工作区状态）的问题。\n- **核心亮点**: 提出 Caper，一种后果感知审批机制，在快照沙盒中预执行每个命令，向独立审批器提供观察到的效应有界报告，提交允许的命令，并回滚被阻止的命令及提供智能体可操作的原因。\n- **深度解析**: 与六个现有系统相比，Caper 在 SABER 上实现了最低的有害结果率（6.7% vs 至少 14.8%），在 YoloFS-Ext（一个有害行为隐藏在调用工具中的基准测试）上为 7.8%（vs 至少 35.3%），同时仅阻止了 YoloFS-Ext 中危险任务的安全孪生任务的 1.0%。\n- **领域归类**: [AI 安全, 编码智能体, 沙盒与权限控制]\n---\n\n### 19. Mage-VL-Cowork: A Full Training Recipe to Learn Hybrid Computer Use From Evolved Harnesses (Mage-VL-Cowork：从进化 Harness 中学习混合计算机使用的完整训练配方)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.40747)\n- **研究任务**: 训练能够有效结合视觉 GUI 交互与代码及终端执行的混合计算机使用智能体（CUA）。\n- **核心亮点**: 提出 Mage-VL-Cowork（4B 参数混合 CUA），通过端到端的渐进式五阶段课程（跨中训练、SFT 和 RL）从通用多模态对齐检查点训练。提出 Mage-CUA-Forge 合成大规模数据。\n- **深度解析**: Mage-CUA-Forge 用可复用的、技能条件化的生成工作流和应用特定准备器替代逐任务智能体构建，合成了 6915 个技能下的 293,806 个桌面和 Web 任务，将重复的每任务支出减少了 82.6%。通过进化教师 Harness 并实例化专门的 CUA Harness 来生成高质量轨迹和特定阶段的监督。Mage-VL-Cowork-4B 最终在 OSWorld-Verified 上达到 66.0%，在其参数量级上实现了 SOTA 性能。\n- **领域归类**: [计算机使用智能体, 多模态学习, 强化学习]\n---\n\n### 20. FlowTranslator: Training-Free In-Image Machine Translation with Flow-Based Editing (FlowTranslator：基于流编辑的免训练图内机器翻译)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04303)\n- **研究任务**: 解决图内机器翻译（IIMT，在保留周围视觉上下文的同时替换图像中的文本为翻译文本）需要大量配对训练图像的问题。\n- **核心亮点**: 提出 FlowTranslator，一个免训练的 IIMT 框架。利用 OCR 和 LLM 生成翻译提示并注入基于 T2I 的扩散模型。引入区域耦合释放（RCR）和耦合扩展（CE）两种轨迹控制。\n- **深度解析**: RCR 在轨迹早期部分解相关文本区域内目标分支的噪声，CE 在轨迹中期放大出现的编辑位移。在 EasyOCR 回读协议下，FlowTranslator 平均 PRIM BLEU 和 COMET 得分分别为 20.6 和 57.2，大幅超越强训练基线 UniTranslator。在更具挑战性的全图 ScenePair 照片翻译成中文的任务中，达到 40.1% 的精确匹配准确率，超越现有编辑系统。\n- **领域归类**: [图像编辑, 机器翻译, 扩散模型]\n---\n\n### 21. Recursa: Toward Recursively Self-Improving Foundation Model Systems (Recursa：迈向递归自我改进的基础模型系统)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04035)\n- **研究任务**: 解决基础模型在变化环境中遇到未覆盖的陌生领域知识时，如何在没有人类专家或更强教师模型的情况下适应新领域的问题。\n- **核心亮点**: 提出Recursa系统，通过从自身经验中学习来适应新领域。该系统使用知识库存储学到的特定领域技能、应用指令、过去任务经验和改进反思，并通过并行学习器执行任务、合成局部改进，最终验证并合并到知识库中，实现递归自我改进。\n- **深度解析**: 实验结果：在Harvey LAB的Firm Knowledge基准测试中，使用DeepSeek-V4.1-Flash将保留测试任务的全通过率从30.0%提高到55.0%，使用Qwen3.8-Flash从35.0%提高到46.0%。技术细节：利用知识库存储领域特定技能与经验反思；通过并行学习器执行任务并合成局部改进，随后验证并合并至知识库。\n- **领域归类**: [基础模型, 领域适应, 自我改进]\n---\n\n### 22. PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations (PrimeSim：基于大规模跨具身演示的通用世界模型模拟器)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04870)\n- **研究任务**: 构建一个机器人世界模型模拟器，使其不仅能生成合理的视频，还能忠实遵循指令动作、保持跨相机视角的一致性，并维持连贯的长视野展开。\n- **核心亮点**: 提出PrimeSim，一个动作条件化、多视角的世界模型模拟器。通过渐进式中期训练和后期训练解决挑战，引入统一的跨具身动作表示、视角感知交错注意力机制以及快视频慢记忆后期训练框架，将双向视频生成器转化为高效的自回归模拟器。\n- **深度解析**: 实验结果/数字：运行速度为10.1 FPS；在5个开源动作条件化世界模型中，于WorldSimProbe的5个套件中领先4个，并取得最佳整体EWMBench分数；在100到200个梯度步骤内即可转移到保留平台。数据集：30,110小时的机器人演示，跨越22个平台。技术细节：引入帧对齐双路径条件化以加强动作-帧对应关系；开发视角感知交错注意力机制以保持多视角一致性；结合快速因果生成、自展开训练和分层时间记忆来缓解误差累积。\n- **领域归类**: [机器人学, 世界模型, 模拟器]\n---\n\n### 23. Every Token Needs Its Own Teacher: Multi-teacher Adaptive On-policy Self-distillation (每个Token都需要自己的老师：多教师自适应在策略自蒸馏)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.40574)\n- **研究任务**: 改进大语言模型后训练中的在策略自蒸馏（OPSD）方法，解决现有方法中教师模型固定或仅在响应间自适应变化的问题，实现Token级别的自适应教师选择。\n- **核心亮点**: 提出MTA-OPSD，首个Token级自适应OPSD方法。通过教师干预试点研究验证了教师偏好在Token间存在差异，构建多教师池，使每个Token在训练期间能够通过多数投票和基于KL的选择自适应地选择其偏好的教师。\n- **深度解析**: 实验结果：在Qwen3模型的数学推理任务中，MTA-OPSD比现有OPSD方法平均提升高达+5.9（相对于基础模型）。技术细节：通过多数投票和基于KL的散度选择来识别每个Token的偏好教师；构建多教师池，使每个Token在训练期间自适应选择其偏好的教师。\n- **领域归类**: [大语言模型, 自蒸馏, 模型训练]\n---\n\n### 24. You don't need long context (你不需要长上下文)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05306)\n- **研究任务**: 探讨长上下文语言模型的必要性，验证在长视野和长输入任务中，通过频繁压缩保持短上下文是否会影响任务准确率。\n- **核心亮点**: 证明前沿语言模型在保持短上下文时，任务准确率几乎没有或完全没有牺牲。表明即使在长视野软件工程任务中每个上下文最多采取一个动作，LLM性能也不会崩溃，并据此概述了语义状态空间模型（SSSMs）的概念。\n- **深度解析**: 实验结果/数字：在前沿开放权重模型上，后期Token生成的成本可能比前期Token高出多达7倍。技术细节：通过频繁压缩（frequent compaction）来维持短上下文；提出语义状态空间模型（SSSMs）的概念。\n- **领域归类**: [大语言模型, 上下文长度, 推理优化]\n---\n\n### 25. Near-Zero Token Embeddings Silently Stall Training in Gated Sequence Models (接近零的Token嵌入会悄悄阻碍门控序列模型的训练)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04449)\n- **研究任务**: 调查并解决门控序列模型（如Mamba、Gated DeltaNet、xLSTM）中由于接近零的Token嵌入导致训练停滞（梯度消失或溢出）的问题。\n- **核心亮点**: 发现大量未绑定门控和混合检查点包含范数极低的可达输入嵌入，这会在预训练时因AdamW权重衰减而产生。在门控序列模型中，接近零的Token会将输入嵌入梯度放大数十个数量级，导致FP32全局范数裁剪溢出到无穷大，从而使当前批次的梯度归零。提出GroupClip和GateFloor两种修复方法。\n- **深度解析**: 实验结果/数字：调查了291个开源权重语言模型仓库（280个不同的嵌入表），52.6%（38个中的20个）的未绑定门控和混合检查点存在此问题；在Nemotron-3-Nano-4B的泰卢姆语持续预训练中，约20%的步骤丢弃更新；GateFloor在高达370M参数的实验中将近零梯度减少了28个数量级。技术细节：接近零的Token会将输入嵌入梯度放大超过30个数量级（最高35）；当梯度条目超过1.84×10^{19}时，FP32全局范数裁剪会溢出；GroupClip使用64位或重新缩放的范数解耦输入嵌入裁剪；GateFloor（SiLU(z) + δ，δ∈[0.01, 0.1]）在零输入时保持门为正。\n- **领域归类**: [模型训练, 序列模型, 梯度优化]\n---\n\n### 26. Adversarial Speculative Reasoning Improves Long Horizon Agents (对抗性推测推理提升长视野智能体)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05345)\n- **研究任务**: 改进长视野智能体的推理能力，通过控制推测解码验证窗口内增长的数值噪声，将推测解码从纯系统优化转变为上下文精度的主动分配器。\n- **核心亮点**: 发现推测解码中的草稿接受结果会改变模型在30步后的输出分布，影响长视野智能体的推理准确率。提出通过训练草稿模型产生对抗性偏好，使其在关键推理点被拒绝，从而让目标模型在最无噪声的条件下对关键思考Token进行采样和编码。\n- **深度解析**: 实验结果/数字：通过训练托管参数的0.06%到0.28%来提升长视野智能体的端到端成功率。技术细节：推测解码在验证窗口内数值噪声增长，30步后草稿接受结果会改变模型输出分布；训练草稿模型产生对抗性偏好，使其在关键推理点被拒绝，从而让目标模型在最无噪声的条件下对关键思考Token进行采样。\n- **领域归类**: [智能体, 推测解码, 推理优化]\n---\n\n### 27. Dory1.0-4B: A Looped Normalized-GPT (Dory1.0-4B：一个循环归一化GPT)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03998)\n- **研究任务**: 构建一个具有弹性深度的40亿参数循环（潜在循环）语言模型，使单个检查点能够服务于不同的推理计算预算。\n- **核心亮点**: 提出Dory1.0-4B，基于归一化Transformer（nGPT）骨干，推理时循环块可应用可变次数。采用难度感知的循环课程进行后训练，将更难的提示路由到更深的循环。增加循环次数可提高准确率，并在智能体基准测试中提高Token效率，同时通过仅缓存最后一次循环的键和值来保持KV缓存占用不变。\n- **深度解析**: 实验结果/数字：40亿参数，6万亿Token预训练（前4.5万亿用NVFP4），上下文扩展至256K；在2个或更多循环下，平均在12个基准测试中超越Qwen3.5-9B、Gemma 4 12B和Gemma 4 26B-A4B；4个循环时生成的Token比1个循环时少1.3-2.5倍。技术细节：基于归一化Transformer（nGPT）骨干，包含交错的滑动窗口和全注意力层；采用难度感知的循环课程进行后训练；仅缓存最后一次循环的键和值，保持KV缓存占用与非循环模型相等；开源BF16、MXFP8、NVFP4和GGUF量化检查点。\n- **领域归类**: [大语言模型, 循环神经网络, 模型架构]\n---\n\n### 28. Switch-SWE: Do Coding Agents Hold Focus When Switching Between Unfinished Tasks? (Switch-SWE：编码智能体在切换未完成任务时能保持专注吗？)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02017)\n- **研究任务**: 评估编码智能体在同一仓库中交错处理多个未完成任务后，能否恢复早期任务的需求和部分进展，即测试其“焦点任务恢复”能力。\n- **核心亮点**: 引入Switch-SWE基准测试，构建匹配的不间断和切换会话。发现交错的未完成工作会导致焦点任务解决率显著下降。提出一种即插即用的上下文管理模块，通过选择任务相关历史和维护简洁的任务状态摘要来改善任务切换表现。\n- **深度解析**: 实验结果/数字：包含200个焦点任务，19个Python仓库，渲染为400个匹配的会话规范；在7个编码智能体中，平均焦点任务解决差距为11.5个百分点（范围6.0到15.0）；上下文管理模块在OpenCode上将同仓库任务切换下的焦点任务完成率提高了5.5到15.5个百分点。技术细节：轨迹分析识别出跨任务需求混淆和任务状态丢失是常见的恢复行为；即插即用的上下文管理模块通过选择任务相关历史和维护简洁的任务状态摘要来改善任务切换。\n- **领域归类**: [代码智能体, 基准测试, 软件工程]\n---\n\n### 29. Can AI Reviewers See Your Efforts to Improve Your Paper? A Large-Scale Study of Paper Revision Trajectories (AI审稿人能看到你改进论文的努力吗？论文修订轨迹的大规模研究)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02244)\n- **研究任务**: 调查AI审稿人的评判是否能反映作者通过修订对科学手稿所做的改进，评估AI审稿人对论文修订的敏感度和一致性。\n- **核心亮点**: 使用PaperTrajectory-2026数据集分析AI审稿人是否对标注的重大改进给予更高分数。发现大多数重大改进的分数保持不变，分数变化方向的一致性较弱。即使修订获得了更高的中立分数，简短的负面用户意见也可能抹去或逆转这一优势。\n- **深度解析**: 实验结果/数字：使用PaperTrajectory-2026数据集，包含5个AI会议的6,959篇论文轨迹，包含14个维度的自动变更标注；使用8个AI审稿人进行独立评估。技术细节：标注显示重大改进强调实证证据和框架，后期修订倾向于增量改进；修订维度与分数增加存在一些特定于审稿人的关联，但预测区分度有限；简短的负面用户意见可能抹去或逆转修订带来的分数优势。\n- **领域归类**: [AI审稿, 论文评估, 自然语言处理]\n---\n\n### 30. LOLPlay: Benchmarking Real-Time Visual Agents in League of Legends (LOLPlay：在英雄联盟中基准测试实时视觉智能体)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03685)\n- **研究任务**: 评估视觉智能体在环境推理过程中不断演变时的推理与行动协调能力，特别是在实时控制环境中的表现。\n- **核心亮点**: 引入LOLPlay基准测试，在原生《英雄联盟》中包含36个特定英雄任务。智能体通过截图和鼠标键盘动作交互，包含82个可执行子目标检查。发现增加推理努力并不能提高任何模型的指标，更长的请求会减少交互轮数，表明在实时控制中额外推理存在成本。\n- **深度解析**: 实验结果/数字：36个特定英雄任务，82个可执行子目标检查；对3个模型在3种推理努力设置下进行324次任务评估；GPT-6 Astra在低/中等努力下最高任务成功率为25.0%，中等努力下最高子目标成功率为40.3%。技术细节：智能体通过截图和鼠标-键盘动作交互，自动化初始化和子目标检查区分部分进展与完成；轨迹揭示了不完整的子目标组合和在观察场景变化后执行的动作。\n- **领域归类**: [视觉智能体, 实时控制, 基准测试]\n---\n\n### 31. RoboTryOn: Synthesizing Dexterous Robot Demonstrations from Human Videos via Virtual Try-On (RoboTryOn：通过虚拟试穿从人类视频中合成灵巧机器人演示)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05163)\n- **研究任务**: 解决高自由度机器人在适应新任务时严重依赖遥操作演示的问题，通过将人类视频转化为目标机器人的演示视频来提供可扩展的替代数据源。\n- **核心亮点**: 提出 RoboTryOn 方法，将“人-机”转换类比为“虚拟试穿”（保留演示动作，将人类替换为机器人）。该方法通过自回归翻译关键帧并结合人手骨架条件引导视频合成，同时使用结合深度特征的逆动力学模型（IDM）从合成视频中推断动作标签以进行策略学习。\n- **深度解析**: 摘要提到实验在多种人形实体上进行，使用合成数据训练的策略在新任务（包括具有挑战性的双手操作）上的平均成功率从 2% 提升至 60%，且无需这些任务的真实机器人演示。此外，使用合成数据训练的性能与仅使用遥操作演示训练的性能相当，但数据收集成本约为后者的三分之一，证明了该方法的成本效益。\n- **领域归类**: [机器人学, 计算机视觉, 强化学习]\n---\n\n### 32. Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena (前沿VLM智能体准备好成为机器人通才了吗？基于具身智能体竞技场的实证研究)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.00854)\n- **研究任务**: 评估前沿视觉语言模型（VLM）智能体在解释场景、执行动作并满足任务所有条件方面的能力，以衡量其作为“机器人通才”的潜力。\n- **核心亮点**: 引入 Embodied Agent Arena 基准，包含 1000 个案例（结合 32 个现有来源和 168 个案例的 GeoProbe 基准），在几何、空间推理、可供性、任务规划和操作五个维度评估 10 个 VLM 智能体。发现闭源模型在所有领域领先，而开源模型在空间推理上有用但规划和操作成功率显著较低。\n- **深度解析**: 摘要指出，在执行过程中，智能体可能会出现实现早期子目标但失去对象控制、将动作绑定到错误区域或在物理状态满足前停止等失败。增加计算量（如代码修复可恢复执行但不完成任务，自我审查甚至会逆转正确判断）并不能统一解决这些失败。最强的规划器会将失败的 token 消耗集中在长时间的身体控制任务上，而其他模型则在各个程序中广泛失败。\n- **领域归类**: [具身智能, 视觉语言模型, 机器人学]\n---\n\n### 33. SeMo3D: Unifying 3D Generation, Editing, and Completion via Selective Modeling (SeMo3D：通过选择性建模统一3D生成、编辑和补全)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02568)\n- **研究任务**: 解决 3D 生成、编辑和补全任务中存在的任务孤立、应保持不变的内容不一致以及依赖特定任务配对数据的问题，实现三个任务的统一。\n- **核心亮点**: 提出“选择性建模”范式（SeMo3D），即合成指定区域同时保持其余部分不变。提出区域选择性去噪训练方法，以及 Omni3DiT 架构（一种多条件 3D 扩散 Transformer），能够区分需要创建和保留的区域，并融合图像、文本和点引导进行细粒度控制。\n- **深度解析**: 摘要未提供具体的实验数据集名称和详细数字，但指出在三个基准测试上的实验表明，SeMo3D 在所有任务上均超越了最先进的方法，在生成中提供多模态可控性，在编辑和补全中提供强一致性和准确性。此外，SeMo3D 还可作为智能体的统一建模工具，通过自然语言交互实现高效的 3D 创建。\n- **领域归类**: [3D视觉, 扩散模型, 计算机视觉]\n---\n\n### 34. BEND 2.0: Benchmarking the Capabilities Needed to Design DNA (BEND 2.0：评估设计DNA所需能力的基准测试)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03806)\n- **研究任务**: 评估基因组基础模型预测 DNA 变化影响的能力，以及这些预测是否能指导序列设计，以弥补当前基准测试未衡量成功设计所需能力的缺陷。\n- **核心亮点**: 引入 BEND 2.0 基准，包含基于 5 个实验数据集构建的 8 个任务。发现模型选择和表示访问方式会影响性能；冻结表示的线性读出可匹配或超过模型的原生输出；功能后训练能显著提升模型的能力。\n- **深度解析**: 摘要提到线性读出在实验测定和基因间转移良好，表明模型捕获了超越单个预测器拟合数据的功能模式。但对平均效应的强预测可能会掩盖对上下文特定效应的弱预测，且准确预测组合突变效应并不意味着能准确预测它们的相互作用。在设计任务中，模型预测可减少寻找预期响应所需的候选数量，但在上下文特定和多细胞目标方面仍有改进空间。摘要未提供具体的准确率或提升数字。\n- **领域归类**: [计算生物学, 基础模型, 基准测试]\n---\n\n### 35. Muon Makes the First Mixture-of-Experts Layer Harder to Balance (Muon使得第一个混合专家层更难平衡)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.37914)\n- **研究任务**: 研究在使用 Muon 优化器训练混合专家（MoE）语言模型时，优化器对第一层 MoE 负载均衡（通过路由分数的偏置跨度来衡量）的影响。\n- **核心亮点**: 发现 Muon 优化器会显著增加第一层 MoE 的路由偏置跨度（平均翻倍），表明该层更难平衡。这种增加源于网络其余部分使用了 Muon，无论路由器本身使用何种优化器。\n- **深度解析**: 摘要提到在 55M 和 108M 活跃参数的模型中进行实验。在预热后，最繁忙的专家平均负载是公平份额的 4 到 7 倍。在前 3000 步中，从这些输入中减去批次均值可消除过载且几乎不改变损失。在较小模型上，将 Muon 学习率减半可消除大部分跨度增加并略微改善损失。仅将路由器移至 AdamW 会使负载在预热期间转移更多并略微增加损失，因此在此规模下建议路由器继续使用 Muon。摘要未提供具体的损失数值。\n- **领域归类**: [大语言模型, 优化算法, 混合专家模型]\n---\n\n### 36. Every Pixel Is an Option: A System One Model for Medical Ultrasound Biometry (每个像素都是一个选项：用于医学超声生物测量的系统1模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03360)\n- **研究任务**: 解决超声生物测量中手动放置卡尺带来的操作者间差异问题，以及传统方法依赖特定预测头或视觉语言模型直接坐标预测无法显式建模空间似然分布的局限。\n- **核心亮点**: 提出 Kev-Bio，一种视觉语言模型，利用临床测量问题引导超声地标检测。受系统 1 决策模型启发，利用语言模型的决策表示为每个卡尺端点生成查询，与共享的密集超声特征匹配生成空间概率图，从而导出地标坐标和临床测量值。\n- **深度解析**: 摘要提到在 9 个视角的 FU/GU Biometry 2026 数据集上进行实验，Kev-Bio 实现了 22.50 像素的平均径向误差（MRE）和 15.38 的临床测量平均绝对误差（MAE），整体性能优于对比基线，证明了其在不同解剖视角下进行超声地标检测和临床测量的有效性。\n- **领域归类**: [医疗AI, 视觉语言模型, 医学图像分析]\n---\n\n### 37. Do We Need an LLM to Know Why Sources Conflict? Decision Models for Knowledge-Conflict Typing in RAG (我们需要大语言模型来知道来源为何冲突吗？RAG中知识冲突分类的决策模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.36915)\n- **研究任务**: 研究在检索增强生成（RAG）中，当检索来源存在分歧时，是否可以使用单次前向传播返回固定选项概率的“决策模型”来快速、廉价地对冲突类型进行分类，从而替代昂贵的前沿大语言模型。\n- **核心亮点**: 使用 CONFLICTS 基准测试评估了 11 个决策模型。直接询问时，决策模型准确率达 50.0-67.0%，其中 10 个匹配或超过 Gemini 2.5 Flash（61.3%），且成本低 4-39 倍，延迟低 2.6-6.0 倍。\n- **深度解析**: 摘要提到，将决策模型最不自信的四分之一查询发送给 Gemini 3.8 Flash（70.0%）形成的级联系统，在 11 个模型中有 8 个在统计上与其持平，成本仅为后者的 25-37%。将分类法分解为是/否问题会降低所有模型的准确性，且在一个模型上拟合的修复方法无法迁移。决策模型检测植入的虚假来源不如 LLM 的硬标签可靠，但其概率仍能区分植入和干净来源。摘要未提供具体的 F1 或精确率等详细数字。\n- **领域归类**: [检索增强生成(RAG), 大语言模型, 自然语言处理]\n---\n\n### 38. Is Your Long-Horizon Benchmark Really Deep? Measuring and Synthesizing Depth in Terminal Tasks (你的长视野基准测试真的够“深”吗？测量与合成终端任务中的深度)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.01927)\n- **研究任务**: 重新定义和测量长视野终端任务的“深度”（必须按顺序发生的回合数），指出当前合成方法主要增加了“工作量”而非“深度”，并提出新的深度任务合成方法。\n- **核心亮点**: 提出“深度”概念（受限于最小回合上限的任务通过率）。审计了 6 个现有数据集的 734 个任务，发现 94% 的合成任务在 3 个回合内通过。提出 DEPTH 方法，在真实软件环境中逐段生成并执行任务，确保后续段落基于前一段落留下的状态。\n- **深度解析**: 摘要提到使用 DEPTH 方法生成的 105 个任务在深度和工作量上均超过所有被审计的数据集，且当前 6 个模型均无法通过其中一半的任务。在 Qwen3-8B 上微调这些任务的运行轨迹，可提升其在两个终端基准测试上的表现。摘要未提供具体的通过率百分比或提升的具体数值。\n- **领域归类**: [智能体, 基准测试, 大语言模型]\n---\n\n### 39. What We Keep of What We Forget: Replacement Operators and Routing Semantics in Training-Free MoE Expert Pruning (我们保留了什么，遗忘了什么：免训练MoE专家剪枝中的替换算子与路由语义)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.41366)\n- **研究任务**: 研究免训练混合专家（MoE）模型专家剪枝中的两个决策：移除哪些专家，以及当路由器仍选择被移除专家时该层应如何计算（替换算子）。\n- **核心亮点**: 在固定掩码的情况下，比较了三个系列的替换算子。发现“幸存者的门控缩放”这一通常隐式的选择影响最大。提出“倾斜新手”（tilted novice）算子，一种被剪枝专家输入的闭式低秩映射，其秩为 0 的情况即为 MoNE 的常数替换。\n- **深度解析**: 摘要提到在 50% 剪枝率下，“倾斜新手”在 OLMoE 和 Moonlight 上分别比常数替换高出 3.45 和 1.37 分，且参数量仅增加 1.2-1.8%，在 4 位和 3 位量化下基本保持不变。评估指标会改变结论：在 25% 剪枝率下，MoNE 常数保留了 92-97% 的密集多项选择准确率，但仅保留 5-65% 的 GSM8K 和 0-17% 的代码分数。摘要未提供具体的模型总参数量或基础准确率。\n- **领域归类**: [大语言模型, 模型压缩, 混合专家模型]\n---\n\n### 40. Is Forgetting Unified? Exploring Concept Unlearning in Unified Multimodal Models (遗忘是统一的吗？探索统一多模态模型中的概念遗忘)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04467)\n- **研究任务**: 研究在统一多模态模型（UMMs）中，现有的单路径遗忘方法是否足以在图像生成和视觉理解两个路径中同时抑制目标概念（跨路径概念遗忘）。\n- **核心亮点**: 引入 UUBench 诊断基准，包含 30 个目标概念和 60 个语义相关的相邻概念。发现单路径方法在联合遗忘方面效果有限：生成侧编辑器能强烈抑制目标生成但在视觉理解中遗忘有限，理解侧基线甚至难以在自身路径中实现大幅遗忘。\n- **深度解析**: 摘要提到在代表性 UMMs 上的实验表明，提出的 UniForget 方法在 BAGEL-7B-MoT 上实现了 80.0% 的联合遗忘率，在 Janus-Pro-7B 上实现了 92.7% 的联合遗忘率，优于代表性基线。进一步分析揭示了联合遗忘与能力保留之间存在的权衡关系。\n- **领域归类**: [多模态模型, 模型安全/对齐, 计算机视觉]\n---\n\n### 41. Where to Learn and How Far to Roll Out: Efficient Adaptive Training for GUI Agents (在哪学习以及展开多远：GUI 智能体的高效自适应训练)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2610.39251)\n- **研究任务**: 提高多步 GUI 智能体在轨迹级 GRPO（Group Relative Policy Optimization）训练中的效率，解决从任务根节点重复展开完整轨迹导致的低效问题。\n- **核心亮点**: 提出一种两阶段自适应训练框架，联合解决“在哪学习”和“展开多远”的问题。通过动作不一致性（action disagreement）选择信息丰富的枢纽点（pivots），并在这些点进行单步强化学习，随后根据任务进度自适应地扩展策略责任。\n- **深度解析**: 传统的轨迹级 GRPO 训练 GUI 智能体时，任务级奖励提供的监督过于粗糙，且会重复执行已掌握的前缀。本文方法首先从成功的专家轨迹中构建可复用的中间检查点，利用动作不一致性（直接从采样的 GUI 动作中测量不确定性）选择枢纽点。第一阶段在这些枢纽点执行单步 RL 以改善不确定的局部决策；第二阶段通过自适应的局部、后缀和根训练逐步扩展策略责任。在 MobileGym 和 CUA-Gym-Hub 上，该方法相比 Vanilla GRPO 减少了 56-61% 的环境交互，同时提升了任务性能。摘要未提供具体的绝对任务成功率数字。\n- **领域归类**: [强化学习, 智能体, 图形用户界面]\n\n---\n\n### 42. Kierston \u0026 KierstonBench: Simulation of Allentown, PA and Evaluation of Language Models in Crime Investigation and Surveillance Tasks (Kierston 与 KierstonBench：宾夕法尼亚州阿伦敦的模拟及语言模型在犯罪调查和监控任务中的评估)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04785)\n- **研究任务**: 评估大型语言模型在刑事调查和大规模监控中收集和分析记录的能力与准确性。\n- **核心亮点**: 提出了城市级模拟引擎 Kierston 和基准测试 KierstonBench。Kierston 模拟了约 12.5 万名居民的日常生活及相关的电信、财务、行政和车牌记录；KierstonBench 包含 32 个任务族，涵盖记录链接、日常重建、事件调查和欺骗性账户评估。\n- **深度解析**: 真实部署缺乏用于评分的基准真相，且缺乏模拟环境下的基准测试。本文通过受限的记录接口让模型进行调查，模型无法访问底层模拟。对 16 个语言模型的评估显示，大多数模型无法执行记录调查，并提交了记录不支持的身份识别。少数前沿模型解决了大部分任务并在证据不足时放弃，但在某些情况下仍会上当受骗，且没有模型能完全替代调查员。摘要未提供具体的模型准确率数字或数据集的详细划分细节。\n- **领域归类**: [自然语言处理, 基准测试, 智能体应用]\n\n---\n\n### 43. GigaSpeech 3: Scaling Multi-Dialect Arabic Speech Recognition with Weakly Labeled Data (GigaSpeech 3：利用弱标签数据扩展多方言阿拉伯语语音识别)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.02476)\n- **研究任务**: 解决方言阿拉伯语语音识别中因缺乏方言分辨的转录语音而受限的问题，利用丰富的网络音频资源进行扩展。\n- **核心亮点**: 推出 GigaSpeech 3 语料库，包含 39,000 小时和 1000 万个弱转录语音片段，覆盖阿尔及利亚、埃及、伊拉克、沙特和叙利亚阿拉伯语。采用语音识别偏置的自监督学习训练标记模型，并进行数据选择和四轮噪声学生微调。\n- **深度解析**: 从每种方言 60 小时的人工转录开始，训练标记模型并应用于匹配方言的网络音频。在 GigaSpeechBench 上，最终的方言特定模型在所有五种方言上均优于标记模型，宏平均词错误率（WER）达到 23.86%，比覆盖所有五种方言的最强第三方系统相对降低了 16.6%。使用自预测方言身份的多方言模型宏平均 WER 为 25.51%，并支持现代标准阿拉伯语。在三个外部语料库的八个条件下，训练的 Zipformer 在所有条件下均实现了最低的 WER，微调 Qwen3 语音识别器也提升了所有条件下的性能。摘要未提供具体的第三方系统基线 WER 绝对数值。\n- **领域归类**: [语音识别, 数据集, 多语言/多方言处理]\n\n---\n\n### 44. Auto-Research Agent on MSA Organization to Improve Protein-Protein Complex Structure Prediction (用于改进蛋白质-蛋白质复合物结构预测的 MSA 组织自动研究智能体)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03183)\n- **研究任务**: 改进 AlphaFold 3 (AF3) 在蛋白质复合物结构预测中的表现，解决当前多序列比对（MSA）管道采用统一配方导致次优的问题。\n- **核心亮点**: 引入一个自主智能体，将冻结的 AF3 视为黑盒实验仪器。智能体针对每个目标提出生物学假设，分析并重组 MSA，仅使用预测器的无标签信号迭代优化序列选择和配对策略。\n- **深度解析**: 研究表明 MSA 的深度和跨链配对的价值高度依赖于目标，没有单一配方适用于所有界面。在 AF3 训练截止日期后发布的三个基准测试的 1,015 个蛋白质-蛋白质界面上，该智能体在每个基准测试上都提高了整体界面 DockQ，同时平均使用的 MSA 序列比默认管道少 60%。在种间异聚体（物种配对不可靠）上增益最大：FoldBench 上的平均 DockQ 从 0.465 提高到 0.612，HD439 上从 0.482 提高到 0.562。改进源于序列构建和配对策略（包括故意不配对）。摘要未提供具体的计算资源消耗或推理时间数字。\n- **领域归类**: [计算生物学, 智能体, 结构预测]\n\n---\n\n### 45. Going Deeper With Memories (借助记忆走向深层)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.05255)\n- **研究任务**: 解决字节级语言模型因全分辨率处理每个字节而导致计算成本高昂的问题，同时避免对分词器的依赖。\n- **核心亮点**: 提出 DeepMem，一种因果多尺度架构，将语义压缩与精确字节保留分离。使用可逆子带变换构建较短序列的层次结构，通过无损载体和显式细节边带保留字节身份。\n- **深度解析**: 快速权重记忆块沿编码器运行，在压缩瓶颈处进行迭代共享状态计算，同时基于注意力的超分辨率解码器恢复字节分辨率表示。在 FineWeb-Edu 和 PG19 上，DeepMem 实现了比匹配的字节级 Transformer 更强的语言建模性能，并在评估的 FLORES 语言中获得了最佳的宏平均性能。它还提高了 PIQA 准确率，并在代码建模、多选推理和字节级损坏鲁棒性方面保持竞争力。瓶颈细化所需的计算量（FLOPs）比等效的全分辨率推理少约 7,600 倍，同时保持了有竞争力的评估吞吐量。摘要未提供具体的参数量规模或各任务的绝对准确率数值。\n- **领域归类**: [自然语言处理, 模型架构, 字节级语言模型]\n\n---\n\n### 46. Enhancing Stock Market Information Retrieval with Retrieval-Augmented Generation (利用检索增强生成增强股票市场信息检索)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.03747)\n- **研究任务**: 解决传统基于 NLP 的系统在动态金融环境中难以保持上下文准确性和生成相关响应的问题，提升股票市场信息检索和生成的质量。\n- **核心亮点**: 设计了一个检索增强生成（RAG）系统，结合检索和生成方法来增强金融文本生成的准确性和相关性。使用 ROUGE 指标（ROUGE-1, ROUGE-2, ROUGE-L）评估生成文本与参考文本的词汇和结构相似度。\n- **深度解析**: 实验在包含 100 个股票市场相关查询的数据集上进行，结果显示获得了高 ROUGE 分数，表明与参考文档高度一致。此外，评估了系统响应延迟，平均响应时间为 1.16 秒。摘要未提供具体的 ROUGE 分数数值或数据集的详细来源。\n- **领域归类**: [自然语言处理, 检索增强生成 (RAG), 金融应用]\n\n---\n\n### 47. Length Is Cheap, Competition Is Not: Attention Predicts Context Rot in Retrieval (长度很廉价，竞争则不然：注意力预测检索中的上下文腐烂)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.04169)\n- **研究任务**: 探究语言模型在长输入上失败的原因，特别是在检索任务中，验证“长度导致失败”的假设是否成立。\n- **核心亮点**: 证明在检索任务中，长度本身成本很低，而注意力竞争才是导致“上下文腐烂”的原因。中性填充词不会降低准确率，但与证据格式相同或提供竞争值的陈述会显著降低准确率。模型内部留在证据上的注意力质量可以追踪这种失败。\n- **深度解析**: 在五个开源模型（0.5B 到 3B 参数，四个系列）上进行测试。添加中性填充词时，准确率保持在 0.97 到 1.00（在 Qwen2.5-1.5B 上高达 32K tokens）。而提供竞争值的单一陈述会使损失增加 9 到 110 倍。在 126,473 次试验中，证据上的注意力质量解释了高达 58% 的损失方差，而对数长度最多解释 8%。掩码填充协议在 MMLU 上复现了长度损害的说法（30K tokens 时损失 11 到 18 分），但在检索的可见控制中失败（掩码在 32K tokens 时损失 45 个准确率点，而可见填充无损失）。摘要未提供具体的其他模型名称或 MMLU 的具体基线分数。\n- **领域归类**: [自然语言处理, 模型可解释性, 长上下文处理]\n\n---\n\n### 48. QFabric: Guarded Cross-Domain Task Recovery and Its Limits on a Linux-RTOS Board (QFabric：Linux-RTOS 板上的受保护跨域任务恢复及其局限性)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2611.01598)\n- **研究任务**: 解决异构嵌入式板（Linux 应用处理器与实时微控制器 MCU 结合）中，当任务时序退化时在两个域之间迁移任务的问题。\n- **核心亮点**: 提出 QFabric 原型，将跨域放置视为对违反经验软实时契约的受保护恢复。任务在两个域编译，在窗口中监控，仅在静止纪元边界进行语义和容量准入后切换，并在试用后提交或回滚。\n- **深度解析**: 在 Arduino UNO Q（Cortex-A53 Linux 和 Cortex-M33 Zephyr）上测试。每次 MCU 调用成本约 19 ms，MCU 运行最重内核比 Linux 慢 34 倍。由于每次调用都经过 Linux 用户空间，Linux 争用使 MCU 路径膨胀远大于 Linux 路径（p99 高达 400 ms 对比 17.0 ms）。在四节点链的 30 个单元中，Linux 满足所有契约（未命中率 0.8%），QFabric 正确地从不迁移；没有滞后的控制器在 7 个单元中迁移，使 p95 增加高达 177 倍，试用回滚了其中 5 次移动。结论是在 Linux 调度的异构板上，迁移无法隔离任务免受 Linux 干扰，恢复保护主要在于防止有害移动。摘要未提供具体的工作负载名称或详细的硬件规格。\n- **领域归类**: [嵌入式系统, 实时系统, 操作系统]\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [NVIDIA/auto-ontology](https://github.com/NVIDIA/auto-ontology)\n- **今日趋势**: Stars: 4,645 | Forks: 377 | 今日新增: 2,053\n- **项目简介**: 一个用于在数据上构建基于图的语义推理层的Python框架，旨在增强LLM和Agent工作流。\n- **核心价值**: \n  - **项目用途**: 构建语义和基于图的推理层，实现确定性查询生成、更好的上下文检索和更可解释的AI。\n  - **目标人群**: 开发LLM和Agent工作流的AI开发者、数据科学家及研究人员。\n  - **技术核心**: 基于图的语义推理层、确定性查询生成、上下文检索优化。\n  - **AI/大模型相关性**: 是（描述明确提及用于LLM和Agent工作流，以及可解释AI）。\n---\n### [github/spec-kit](https://github.com/github/spec-kit)\n- **今日趋势**: Stars: 147,210 | Forks: 13,214 | 今日新增: 810\n- **项目简介**: 帮助开发者快速上手SDD（规格驱动开发）或其他开发流程的官方工具包。\n- **核心价值**: \n  - **项目用途**: 辅助开发者启动和进行SDD（Spec-Driven Development）或其他标准开发流程。\n  - **目标人群**: 软件开发者、工程师及项目管理人员。\n  - **技术核心**: SDD（规格驱动开发）工具集与流程辅助。\n  - **AI/大模型相关性**: 否（描述未提供AI或大模型相关信息）。\n---\n### [The-PR-Agent/pr-agent](https://github.com/The-PR-Agent/pr-agent)\n- **今日趋势**: Stars: 14,676 | Forks: 2,091 | 今日新增: 279\n- **项目简介**: 原始的开源Pull Request（PR）审查代理工具。\n- **核心价值**: \n  - **项目用途**: 自动化审查代码的Pull Request（PR）。\n  - **目标人群**: 软件开发者、开源贡献者及代码审查人员。\n  - **技术核心**: 开源PR审查代理（Agent）机制。\n  - **AI/大模型相关性**: 否（描述未
