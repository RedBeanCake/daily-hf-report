### 1. PhysisForcing: Physics Reinforced World Simulator for Robotic Manipulation (物理增强的机器人操作世界模拟器)
- **社区热度**: `👍 33 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.28128)
- **研究任务**: 机器人操作任务的仿真环境构建。
- **核心亮点**: 把物理规则硬约束进神经网络模拟器，减少仿真到现实的差距。
- **深度解析**: 传统世界模型容易忽略物理一致性，导致策略迁移失败。该方案在模拟器的损失函数中加入物理约束项（如碰撞、摩擦力），让生成的视频帧不仅看起来真，物理逻辑也真，直接用仿真数据训出来的策略能更好落地。
- **领域归类**: [机器人学习] [世界模型] [仿真]
---
### 2. Translation as a Bridging Action: Transferring Manipulation Skills from Humans to Robots (作为桥梁动作的翻译：从人类到机器人的操作技能迁移)
- **社区热度**: `👍 28 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.28133)
- **研究任务**: 人机操作技能迁移（Imitation Learning）。
- **核心亮点**: 不把翻译当预处理，而是当成一个可学习的“桥梁动作”嵌入到策略网络里。
- **深度解析**: 解决人体骨骼和机器人机械臂结构不一致的问题。方法是在策略网络中间层显式加入一个“翻译模块”，将人类动作映射为机器人可达的运动原语，端到端训练，比先做数据对齐再训练策略的效果更稳。
- **领域归类**: [机器人学习] [模仿学习] [人机交互]
---

### 5. MultiHashFormer: Hash-based Generative Language Models (基于哈希的生成式语言模型)
