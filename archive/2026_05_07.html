### 1. ARIS: Autonomous Research via Adversarial Multi-Agent Collaboration (ARIS：通过对抗性多智能体协作实现自主研究)
- **社区热度**: `👍 65 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.03042)
- **研究任务**: 自主科学研究与智能体协作
- **核心亮点**: 让多个智能体互相扮演对手，通过挑错来提升研究方案的质量。
- **深度解析**: 传统科研智能体容易陷入自我确认偏差。该方案设计了“提案者”和“审查者”两类智能体，审查者专门寻找实验设计漏洞和逻辑矛盾。双方进行多轮对抗博弈，最终输出的研究计划经过了几轮否定之否定，减少了幻觉和不可行方案。
- **领域归类**: [AI Agent, AI for Science]
---

### 2. OpenSeeker-v2: Pushing the Limits of Search Agents with Informative and High-Difficulty Trajectories (OpenSeeker-v2：用高难度信息轨迹推高搜索智能体极限)
- **社区热度**: `👍 36 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.04036)
- **研究任务**: 搜索智能体强化学习
- **核心亮点**: 专门构建高难度搜索轨迹数据，解决智能体只会简单查询的问题。
- **深度解析**: 针对现有搜索智能体在处理复杂多步查询时容易迷失的问题，构建了包含强信息依赖和高难度跳转的轨迹数据集。利用这些数据进行强化学习训练，迫使智能体学会规划长链条搜索路径，而不是依赖单次检索。
- **领域归类**: [AI Agent, Search, RL]
---

### 3. Beyond SFT-to-RL: Pre-alignment via Black-Box On-Policy Distillation for Multimodal RL (超越 SFT 到 RL：通过黑盒同策略蒸馏进行多模态 RL 预对齐)
- **社区热度**: `👍 34 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.28123)
- **研究任务**: 多模态强化学习对齐
- **核心亮点**: 在 SFT 和 RL 之间加了一步黑盒蒸馏，让多模态模型更好收敛。
- **深度解析**: 直接从监督微调过渡到强化学习，多模态模型容易不稳定。该方法引入黑盒同策略蒸馏，利用教师模型的输出分布对学生模型进行预对齐，不依赖教师模型权重。这一步降低了后续 RL 训练的方差，提高了采样效率。
- **领域归类**: [Multimodal, RL, Alignment]
---

### 4. X2SAM: Any Segmentation in Images and Videos (X2SAM：图像与视频中的任意分割)
- **社区热度**: `👍 16 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.00891)
- **研究任务**: 图像与视频分割
- **核心亮点**: 一个模型同时搞定图片和视频分割，不用分开训练。
- **深度解析**: 基于 SAM 架构，增加了时序注意力模块来处理视频帧间关系。模型共享大部分编码器权重，仅在解码端区分静态和动态特征。实测在视频分割任务上保持了帧间一致性，且推理速度接近原 SAM。
- **领域归类**: [Computer Vision, Segmentation]
---

- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.02396)

### 9. SVGS: Enhancing Gaussian Splatting Using Primitives with Spatially Varying Colors (SVGS：利用空间变化颜色原语增强高斯泼溅)
- **社区热度**: `👍 3 Upvotes`

- **核心亮点**: 让每个高斯球内部颜色可变，用更少的球渲染出更多细节。
- **深度解析**: 传统 3DGS 每个高斯原语颜色是均匀的，需要大量球体拟合高频细节。该方法给原语增加了空间变化的颜色函数，单个原语能表达更复杂的纹理。在同等画质下，显著减少了场景所需的高斯球数量，降低了显存占用。
- **领域归类**: [3D Vision, Rendering]
