eo VAEs, we find that both encoding and decoding a patch rely almost entirely on its spatial and temporal neighbors. To exploit this strong locality, we introduce LiveVAE, a streaming encoder and decoder built on causal window attention, which cuts per frame compute while keeping the temporal KV cache bounded for streaming. Decoupled encoder/decoder distillation followed by joint finetuning preserves the pretrained latent space, making LiveVAE a drop-in replacement for the original VAE. On MiniMax-H3, LiveVAE achieves 5.2-6.2x faster encoding and 3.0-3.3x faster decoding than the official VAE with higher PSNR. Paired with our dedicated inference infrastructure, LiveVAE pushes the speedup to 13.4x with almost no quality loss. Code and models will be released.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e尽管视频扩散模型变得越来越快且越来越支持流式传输，但视频VAE仍然是交互式生成和编辑管道中的主要延迟瓶颈。现有的VAE及其加速方法主要依赖于繁重的卷积或全帧注意力，并且大多数仅关注解码，使得编码对于流式条件生成和编辑而言成本高昂。这引出了一个自然的问题：视频VAE的编码和解码实际上需要这种全局时空建模吗？通过分析预训练视频VAE的有效感受野，我们发现编码和解码一个图块几乎完全依赖于其空间和时间邻居。为了利用这种强局部性，我们引入了LiveVAE，一种基于因果窗口注意力构建的流式编码器和解码器，它减少了每帧计算量，同时保持时间KV缓存有界以进行流式传输。解耦的编码器/解码器蒸馏，随后进行联合微调，保留了预训练的潜在空间，使LiveVAE成为原始VAE的直接替代品。在MiniMax-H3上，与官方VAE相比，LiveVAE实现了5.2-6.2倍的编码加速和3.0-3.3倍的解码加速，且具有更高的PSNR。与我们的专用推理基础设施配对，LiveVAE将加速推向13.4倍，几乎没有质量损失。代码和模型将发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e视频变分自编码器（Video VAE）的加速与优化，用于交互式视频生成和编辑管道中的流式编码与解码。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现视频VAE编解码的强局部性，提出基于因果窗口注意力的流式编解码器LiveVAE；通过解耦蒸馏和联合微调保留预训练潜在空间，可作为直接替代品；在MiniMax-H3上实现5.2-6.2倍编码加速和3.0-3.3倍解码加速，且PSNR更高；结合专用推理基础设施实现13.4倍加速且几乎无质量损失。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出LiveVAE通过利用局部性大幅降低了计算延迟并保持了质量。局限性方面，摘要未提供关于长视频序列中误差累积的分析、内存占用的具体数据，以及在MiniMax-H3之外其他数据集或模型上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与编辑\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e48. OmniPersist: Persistent Dynamic World Modeling via Coupled Panoramic Evolution（OmniPersist：通过耦合全景演化实现持久动态世界建模）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32473\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32473\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAction-conditioned world models play a vital role in robotics and autonomous driving, yet existing video diffusion models struggle to maintain dynamic object persistence. When the camera turns away and returns, out-of-view moving entities fail to evolve plausibly in latent space, often mutating or vanishing entirely due to bounded perspective views. To resolve this issue, we propose OmniPersist, a unified framework that couples perspective video generation with panoramic evolution within a single-stage diffusion model, without relying on auxiliary models or initial panoramic inputs. To maintain efficiency, we model the panoramic stream at a lower frame rate, bridging both views across space and time via Geometric Anchoring (GeoAnch) for spatial correspondence and Temporal Compensation (TemComp) for temporal aggregation. OmniPersist is agnostic to camera-control architectures, supporting both latent-level and attention-level conditioning. Extensive experiments on a newly constructed dynamic benchmark across image-to-video and video continuation tasks demonstrate consistent gains in visual quality, camera controllability, revisit consistency, and dynamic persistence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e动作条件世界模型在机器人技术和自动驾驶中发挥着至关重要的作用，然而现有的视频扩散模型难以维持动态对象的持久性。当相机移开并返回时，视野外的移动实体无法在潜在空间中合理地演化，由于有界的透视视图，它们通常会完全突变或消失。为了解决这个问题，我们提出了OmniPersist，一个统一的框架，在单阶段扩散模型中将透视视频生成与全景演化耦合在一起，而不依赖辅助模型或初始全景输入。为了保持效率，我们以较低的帧率对全景流进行建模，通过几何锚定（GeoAnch）实现空间对应，通过时间补偿（TemComp）实现时间聚合，从而在空间和时间上桥接两种视图。OmniPersist与相机控制架构无关，支持潜在级和注意力级条件。在新构建的动态基准上进行的跨图像到视频和视频续写任务的广泛实验表明，在视觉质量、相机可控性、重访一致性和动态持久性方面取得了一致的提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e动作条件世界模型中的动态对象持久性建模，具体为在视频生成（图像到视频和视频续写）中维持视野外动态对象的合理演化。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出OmniPersist框架，在单阶段扩散模型中耦合透视视频生成与全景演化，无需辅助模型或初始全景输入；以低帧率建模全景流，利用GeoAnch和TemComp桥接时空视图；与相机控制架构无关，支持潜在级和注意力级条件；在新动态基准上提升视觉质量、相机可控性、重访一致性和动态持久性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明OmniPersist通过引入全景演化解决了透视视图导致的对象消失或突变问题。局限性方面，摘要未提供具体的计算开销增加数据（尽管提到低帧率全景流以保持效率）、全景流与透视流对齐失败的情况，以及在其他未提及的复杂场景或长序列视频中的具体表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成与世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e49. SIA: Selective Image Analogy（SIA：选择性图像类比）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33894\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33894\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eImage analogy transfers a demonstrated transformation from a before/after pair (A, A\u0026#x27;) to a new query image B. Existing methods assume all changes in (A, A\u0026#x27;) should be fully transferred, limiting flexibility when users want only a subset of the demonstrated edits. We introduce Selective Image Analogy (SIA), a new setting where a single demonstration pair encodes multiple edits, and the user selects at inference time which edits to apply to B. To support this, we curate a multi-edit analogy dataset with full-edit and partial-edit targets. We then train a model that first learns to transfer the complete demonstrated transformation, and then gains selective control through a mask-aligned suppression mechanism: a token-gated LoRA that restricts adapter updates to suppressed edit tokens during denoising, paired with a concept suppression vector that weakens the selected tokens in the text embeddings before denoising. Together, these components allow SIA to suppress unwanted edits that remain visible in A\u0026#x27;, while preserving the user-selected ones, all without requiring a new demonstration pair for each edit combination. We perform extensive quantitative and qualitative evaluations along with user studies to demonstrate the efficacy of our approach.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e图像类比将演示的转换从前后图像对（A，A\u0026#x27;）转移到新的查询图像B。现有方法假设（A，A\u0026#x27;）中的所有更改都应被完全转移，当用户只想要演示编辑的子集时，这限制了灵活性。我们引入了选择性图像类比（SIA），这是一种新设置，其中单个演示对编码多个编辑，用户在推理时选择将哪些编辑应用于B。为了支持这一点，我们构建了一个包含完整编辑和部分编辑目标的多编辑类比数据集。然后，我们训练一个模型，该模型首先学习转移完整的演示转换，然后通过掩码对齐抑制机制获得选择性控制：一个令牌门控LoRA，在去噪期间将适配器更新限制为被抑制的编辑令牌，并与一个概念抑制向量配对，该向量在去噪之前削弱文本嵌入中被选中的令牌。这些组件共同允许SIA抑制在A\u0026#x27;中仍然可见的不需要的编辑，同时保留用户选择的编辑，而无需为每个编辑组合提供新的演示对。我们进行了广泛的定量和定性评估以及用户研究，以证明我们方法的有效性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e选择性图像类比，即从包含多个编辑的单一演示图像对中提取并应用用户选择的特定编辑子集到查询图像。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出选择性图像类比（SIA）新设置，允许从单一演示对中选择性应用编辑子集；构建包含完整和部分编辑目标的多编辑类比数据集；提出掩码对齐抑制机制，结合令牌门控LoRA和概念抑制向量，实现选择性控制；无需为每种编辑组合提供新演示对即可抑制不需要的编辑。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SIA通过掩码对齐抑制机制实现了细粒度的编辑控制。局限性方面，摘要未提供该机制在编辑数量极多或编辑之间高度耦合时的表现，未提及推理时的额外计算开销，也未提供具体的定量评估指标数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像编辑与生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e50. 3D CoCa v3: Contrastive Learners with Scene Graphs for Urban Scene Understanding（3D CoCa v3：用于城市场景理解的带场景图对比学习器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33835\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33835\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eUnderstanding large-scale 3D urban scenes requires representations that capture both multi-scale geometric structures and complex spatial relationships. However, existing 3D vision-language methods primarily emphasize global semantic alignment or object-level representations, leaving structured relational modeling underexplored within unified contrastive and generative frameworks. In this paper, we present 3D CoCa v3, a scene-graph-enhanced contrastive and generative framework for urban 3D scene understanding. Our framework features a Pyramid Vision Encoder for multi-scale geometric representation learning and a language-model-based decoder with question-guided caption retrieval and visual cross-attention. We further introduce MSG-based relational descriptions to enrich contrastive 3D-language alignment with structured spatial relationships. To support semantic and relational supervision, we construct City3D-9.6K, a multi-view urban vision-language dataset with aligned visual-geometric observations, scene captions, and scene graphs. Extensive experiments on City-3DQA demonstrate that 3D CoCa v3 achieves 88.35% and 64.79% overall top-1 accuracy on the sentence-wise and city-wise splits, surpassing 3D CoCa v2 by 20.88 and 3.57 percentage points, respectively. Furthermore, 3D CoCa v3 achieves the best performance on GeoEval3D, demonstrating its effectiveness in urban spatial reasoning and geometric understanding. Code is available at https://github.com/AIGeeksGroup/3DCoCav3.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e理解大规模3D城市场景需要能够捕获多尺度几何结构和复杂空间关系的表示。然而，现有的3D视觉-语言方法主要强调全局语义对齐或对象级表示，使得在统一的对比和生成框架内对结构化关系建模的探索不足。在本文中，我们提出了3D CoCa v3，一个用于城市3D场景理解的场景图增强的对比和生成框架。我们的框架具有用于多尺度几何表示学习的金字塔视觉编码器和基于语言模型的解码器，该解码器具有问题引导的标题检索和视觉交叉注意力。我们进一步引入了基于MSG的关系描述，以用结构化空间关系丰富对比3D-语言对齐。为了支持语义和关系监督，我们构建了City3D-9.6K，一个多视图城市视觉-语言数据集，包含对齐的视觉-几何观测、场景标题和场景图。在City-3DQA上的广泛实验表明，3D CoCa v3在句子级和城市级划分上分别达到了88.35%和64.79%的总体top-1准确率，分别比3D CoCa v2高出20.88和3.57个百分点。此外，3D CoCa v3在GeoEval3D上取得了最佳性能，证明了其在城市空间推理和几何理解方面的有效性。代码可在 https://github.com/AIGeeksGroup/3DCoCav3 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e城市3D场景理解，具体为结合多尺度几何结构和复杂空间关系（场景图）的3D视觉-语言对比与生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出3D CoCa v3框架，结合金字塔视觉编码器和基于语言模型的解码器；引入基于MSG的关系描述以丰富3D-语言对齐；构建City3D-9.6K多视图城市视觉-语言数据集；在City-3DQA上句子级和城市级top-1准确率分别达88.35%和64.79%，超越3D CoCa v2；在GeoEval3D上取得最佳性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明3D CoCa v3通过引入场景图和多尺度几何表示显著提升了城市空间推理和几何理解能力。局限性方面，摘要未提供模型推理速度、计算资源消耗、City3D-9.6K数据集的规模细节（除名称外），以及在非城市场景或不同3D数据格式上的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D视觉与多模态学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e51. Efficient Video Retrieval Augmented Generation via Token Allocation（基于令牌分配的高效视频检索增强生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32938\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32938\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEfficient long-video understanding requires identifying relevant evidence while minimizing the tokens processed by vision-language models (VLMs). Existing video retrieval-augmented generation (RAG) methods rely on frame selection and token compression, but overlook how much each additional token is worth. We introduce Lembas, a plug-and-play framework that formulates video RAG as a token allocation problem over frames and subtitles under a shared budget. Our key insight is that the value of a token diminishes within each item and decreases further as similar evidence receives more tokens. Lembas captures both effects in a single objective and solves it with an efficient iterative water-filling algorithm that has a provable convergence guarantee. For multi-turn conversations, Lembas reuses the tokens processed in earlier turns and refines relevance with the VLM\u0026#x27;s attention at no extra cost. Our evaluations show that Lembas improves accuracy by up to 7.2 percentage points over state-of-the-art baselines at comparable compute. On multi-turn video understanding, Lembas achieves up to 1.5 percentage points higher accuracy with 1.7-17.3x fewer TFLOPs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e高效的长视频理解需要在最小化视觉语言模型（VLMs）处理的令牌数量的同时识别相关证据。现有的视频检索增强生成（RAG）方法依赖于帧选择和令牌压缩，但忽略了每个额外令牌的价值。我们引入了Lembas，一个即插即用的框架，将视频RAG公式化为共享预算下帧和字幕的令牌分配问题。我们的核心见解是，令牌的价值在每个项目内递减，并且随着相似证据接收更多令牌而进一步降低。Lembas在单一目标中捕获这两种效应，并使用具有可证明收敛保证的高效迭代注水算法来解决它。对于多轮对话，Lembas重用早期轮次中处理的令牌，并以零额外成本利用VLM的注意力细化相关性。我们的评估表明，在相当的计算量下，Lembas比最先进的基线提高了高达7.2个百分点的准确率。在多轮视频理解方面，Lembas以少1.7-17.3倍的TFLOPs实现了高达1.5个百分点的更高准确率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e高效的长视频理解，具体为在最小化视觉语言模型处理令牌数量的同时识别相关证据的视频检索增强生成（RAG）任务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Lembas即插即用框架，将视频RAG转化为共享预算下的令牌分配问题。2. 核心见解指出令牌价值在项目内递减且随相似证据增加而降低，通过单一目标和可证明收敛的迭代注水算法求解。3. 在多轮对话中零额外成本重用已处理令牌并利用VLM注意力细化相关性。4. 在相当计算量下准确率提升高达7.2个百分点；多轮视频理解中准确率提升高达1.5个百分点，同时减少1.7-17.3倍TFLOPs。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Lembas通过优化令牌分配有效提升了长视频和多轮视频理解的效率与准确率。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与自然语言处理交叉领域（视频理解、检索增强生成）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e52. A Mesh for Every Moment（每一刻的网格：动态场景的几何重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34939\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34939\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present MEMO (a Mesh for Every MOment), a method that reconstructs the geometry of complete dynamic scenes, captured by multiple synchronized cameras, and extracts a mesh at every frame. Existing dynamic Gaussian splatting methods either model appearance alone or target isolated objects segmented by foreground masks, and all of them recover meshes by TSDF fusion or Poisson reconstruction, whose fixed grids limit the detail they can capture. At the core of MEMO is a per-Gaussian motion model inspired by Gaussian processes, which represents each Gaussian\u0026#x27;s position and rotation over time as a combination of temporal Gaussian kernels. The model keeps every Gaussian a valid surface element throughout the sequence and carries an implicit representation of the dynamic geometry, so a mesh can be derived at any time from a field defined by the Gaussians. Although common in real captures, large and fast motion poses a challenge that dynamic Gaussian splatting methods usually overlook. To account for it, we design a track-based initialization scheme that fits each Gaussian\u0026#x27;s initial trajectory to point tracks in closed form. We evaluate MEMO on Blender-Moments, a new benchmark of nine animated scenes with ground-truth meshes at every frame, and on two real-world datasets. MEMO reconstructs the most accurate geometry among state-of-the-art methods, and remains competitive in novel-view synthesis and training time. Project page: https://memo-4d.github.io\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了MEMO（每一刻的网格），一种重建由多个同步相机捕获的完整动态场景几何，并在每一帧提取网格的方法。现有的动态高斯溅射方法要么仅对表建模，要么针对由前景掩码分割的孤立对象，并且它们都通过TSDF融合或泊松重建来恢复网格，其固定网格限制了它们能捕获的细节。MEMO的核心是受高斯过程启发的逐高斯运动模型，它将每个高斯随时间的位置和旋转表示为时间高斯核的组合。该模型使每个高斯在整个序列中保持为有效的表面元素，并携带动态几何的隐式表示，因此可以从高斯定义的场中在任何时间推导出网格。尽管在真实捕获中很常见，但大且快的运动构成了动态高斯溅射方法通常忽略的挑战。为了解决这个问题，我们设计了一种基于轨迹的初始化方案，以闭合形式将每个高斯的初始轨迹拟合到点轨迹。我们在Blender-Moments（一个包含九部动画场景的新基准，每帧都有真实网格）和两个真实世界数据集上评估了MEMO。MEMO在最先进的方法中重建了最准确的几何，并在新视角合成和训练时间方面保持竞争力。项目页面：https://memo-4d.github.io\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e重建由多个同步相机捕获的完整动态场景的几何，并在每一帧提取网格。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出MEMO方法，通过受高斯过程启发的逐高斯运动模型，将高斯的位置和旋转表示为时间高斯核的组合，实现动态几何的隐式表示并随时提取网格。2. 设计基于轨迹的初始化方案，以闭合形式拟合高斯初始轨迹，解决大且快运动的挑战。3. 在Blender-Moments（9个动画场景）和两个真实世界数据集上评估，实现了最准确的几何重建，且在新视角合成和训练时间上具竞争力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明MEMO通过创新的运动模型和初始化方案，有效解决了动态高斯溅射中固定网格限制细节和大快运动难以处理的局限，实现了高精度的动态场景几何重建。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉（三维重建、动态场景建模、高斯溅射）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e53. SPARC: Geometry-Guided Attention Pruning for Long-Horizon Camera-Controlled Video Generation（SPARC：用于长时程相机控制视频生成的几何引导注意力剪枝）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 1 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34064\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34064\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe present SPARC, a geometry-guided attention pruning framework that turns the native self-attention of pretrained video diffusion transformers into a unified mechanism for camera control and persistent scene memory. Our key insight is that attention connectivity can simultaneously serve as geometric conditioning for camera control and spatial addressing for historical memory retrieval. Motivated by the asymmetric contextual requirements of reconstructing observed content and synthesizing novel regions, SPARC restricts observed tokens to geometrically corresponding historical tokens and local spatiotemporal context, while preserving dense attention for unobserved regions. Correspondence-aware attention biasing and order-invariant historical positioning further enable stable retrieval across long temporal gaps. Without introducing additional learnable control or memory modules, SPARC achieves precise camera adherence and faithful scene revisitation while substantially reducing attention computation. Extensive experiments demonstrate the effectiveness of aggressive attention pruning in improving camera adherence, revisit consistency, and visual fidelity, with an inference speedup of over 50x when combined with four-step distillation. Project page is available at https://zju3dv.github.io/SPARC.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们提出了SPARC，一个几何引导的注意力剪枝框架，将预训练视频扩散Transformer的原生自注意力转化为用于相机控制和持久场景记忆的统一机制。我们的核心见解是，注意力连接性可以同时作为相机控制的几何条件和历史记忆检索的空间寻址。受重建观察内容和合成新区域的非对称上下文需求启发，SPARC将观察到的令牌限制在几何对应的历史令牌和局部时空上下文中，同时为未观察区域保留密集注意力。对应感知的注意力偏置和顺序不变的历史定位进一步实现了跨长时期间隔的稳定检索。在不引入额外可学习控制或记忆模块的情况下，SPARC实现了精确的相机遵循和忠实的场景重访，同时大幅减少了注意力计算。大量实验证明了激进的注意力剪枝在提高相机遵循、重访一致性和视觉保真度方面的有效性，结合四步蒸馏时推理速度提升超过50倍。项目页面可在 https://zju3dv.github.io/SPARC 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e长时程相机控制视频生成，具体为实现精确的相机遵循、持久的场景记忆和忠实的场景重访。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SPARC框架，将预训练视频扩散Transformer的原生自注意力转化为相机控制和持久场景记忆的统一机制。2. 核心见解指出注意力连接性可同时作为相机控制的几何条件和历史记忆检索的空间寻址。3. 通过限制观察令牌至几何对应的历史令牌和局部时空上下文，并为未观察区域保留密集注意力，结合对应感知偏置和顺序不变定位，实现跨长时期间隔的稳定检索。4. 无需额外可学习模块，大幅提升相机遵循和视觉保真度，结合四步蒸馏推理加速超50倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SPARC通过几何引导的注意力剪枝，巧妙利用原生自注意力机制同时解决相机控制和场景记忆问题，显著降低了计算量并提升了生成质量。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与生成式人工智能（视频生成、扩散模型、相机控制）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e54. Look Back: Reinforcement Learning with Counterfactual World Models（回顾：基于反事实世界模型的强化学习）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.29259\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.29259\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgents in complex, stochastic environments must contend with dynamics that can exceed their world models\u0026#x27; predictive capacity and randomness that obscure the consequences of their actions. We hypothesize that, compared to imagining entirely new trajectories in such complex environments, it can be easier to transform observed trajectories with alternative actions. Counterfactual world models condition on observations to predict alternative outcomes under the same underlying environmental randomness, using experience as a reference for predicting action-dependent changes. We present a policy gradient estimator, REINFORCE Look Back (RLB), that uses counterfactual returns as baselines to distinguish action effects from environmental luck, and prove conditions for unbiasedness and variance reduction. In settings where environmental evolution is harder to predict than action-induced changes, we show that counterfactual world models are easier to learn and support better policy learning than ordinary world models. Our findings suggest that counterfactual thinking can help agents learn effective behavior without independently reproducing the full complexity of their worlds.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e复杂随机环境中的智能体必须应对可能超出其世界模型预测能力的动态性以及掩盖其行为后果的随机性。我们假设，与在这种复杂环境中想象全新的轨迹相比，用替代动作转换观察到的轨迹可能更容易。反事实世界模型以观察为条件，在相同的基础环境随机性下预测替代结果，使用经验作为预测依赖动作的变化的参考。我们提出了一种策略梯度估计器，REINFORCE Look Back (RLB)，它使用反事实回报作为基线来区分动作效应和环境运气，并证明了无偏性和方差减少的条件。在环境演变比动作引起的变化更难预测的设置中，我们表明反事实世界模型比普通世界模型更容易学习，并支持更好的策略学习。我们的发现表明，反事实思维可以帮助智能体学习有效行为，而无需独立重现其世界的全部复杂性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在复杂随机环境中进行强化学习，具体为通过反事实世界模型预测替代结果，以区分动作效应和环境随机性，从而学习有效行为。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出反事实世界模型，以观察为条件在相同环境随机性下预测替代结果，使用经验作为参考。2. 提出REINFORCE Look Back (RLB) 策略梯度估计器，使用反事实回报作为基线区分动作效应和环境运气，并证明其无偏性和方差减少条件。3. 证明在环境演变比动作引起的变化更难预测时，反事实世界模型比普通世界模型更易学习且支持更好的策略学习。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明反事实世界模型通过利用已有经验转换轨迹，有效降低了复杂随机环境中世界模型的学习难度，提高了策略学习的性能。局限性方面，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能与机器学习（强化学习、世界模型、策略优化）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e55. GOLD-SLAM: Gaussian-splatting Omnidirectional LiDAR-Depth SLAM（GOLD-SLAM：基于高斯溅射的全向激光雷达-深度SLAM）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32335\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32335\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePanoramic cameras capture nearly the entire spherical field of view in a single frame. However, the mismatch between this panoramic coverage and the field of view of LiDAR poses a substantial challenge for panoramic Gaussian splatting SLAM that relies on LiDAR depth priors. We introduce GOLD-SLAM, a Gaussian-splatting Omnidirectional LiDAR-Depth SLAM system that combines high-quality rendering with accurate geometric reconstruction. It performs tracking and mapping in the spherical domain and uses tracked visual features in regions without LiDAR coverage to improve pose estimation. To address insufficient coverage of newly observed surfaces and floating artifacts during incremental mapping, we introduce Depth-Aware Map Extension and Pruning (DAEP). To enable broader evaluation, we collect a new dataset, WHOLE, using a UAV platform across Weak-geometry, High-dynamic, Omnidirectional, Low-light, and Easy scenarios. Extensive experiments on public benchmarks and WHOLE demonstrate competitive rendering quality and improved geometric accuracy relative to perspective systems. Compared with existing panoramic baselines, GOLD-SLAM improves mean PSNR by 5.56-9.10 dB and reduces mean Depth-L1 by 71.9-83.9%. To assess deployment feasibility on resource-constrained platforms such as UAVs, we evaluate an embedded configuration of GOLD-SLAM on a Jetson Orin NX (16 GB), demonstrating online operation at the cost of reconstruction quality.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e全景相机在单帧中捕获几乎整个球形视场。然而，这种全景覆盖与激光雷达视场之间的不匹配对依赖激光雷达深度先验的全景高斯溅射SLAM构成了重大挑战。我们引入了GOLD-SLAM，一个结合高质量渲染与精确几何重建的高斯溅射全向激光雷达-深度SLAM系统。它在球面域中执行跟踪和建图，并利用无激光雷达覆盖区域的跟踪视觉特征来改善位姿估计。为了解决增量建图期间新观察表面覆盖不足和漂浮伪影的问题，我们引入了深度感知地图扩展与剪枝（DAEP）。为了实现更广泛的评估，我们使用无人机平台在弱几何、高动态、全向、低光和简单场景下收集了一个新数据集WHOLE。在公共基准和WHOLE上的大量实验表明，与透视系统相比，其具有竞争力的渲染质量和提高的几何精度。与现有的全景基线相比，GOLD-SLAM将平均PSNR提高了5.56-9.10 dB，并将平均Depth-L1降低了71.9-83.9%。为了评估在无人机等资源受限平台上的部署可行性，我们在Jetson Orin NX (16 GB) 上评估了GOLD-SLAM的嵌入式配置，证明了以重建质量为代价的在线运行能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e全景高斯溅射SLAM（同步定位与建图），具体为解决全景相机与激光雷达视场不匹配的问题，结合高质量渲染与精确几何重建。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出GOLD-SLAM系统，在球面域进行跟踪和建图，利用无激光雷达覆盖区的视觉特征改善位姿估计。2. 引入深度感知地图扩展与剪枝（DAEP）解决增量建图中新表面覆盖不足和漂浮伪影问题。3. 收集新数据集WHOLE（涵盖弱几何、高动态、全向、低光、简单场景）。4. 相比全景基线，平均PSNR提升5.56-9.10 dB，平均Depth-L1降低71.9-83.9%；在Jetson Orin NX上实现嵌入式在线运行。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明GOLD-SLAM通过球面域处理和DAEP模块，有效解决了全景相机与激光雷达视场不匹配及增量建图伪影问题，提升了渲染和几何精度，并验证了在资源受限平台上的部署可行性。局限性方面，摘要指出嵌入式配置的在线运行需以重建质量为代价。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与机器人学（SLAM、三维重建、高斯溅射、多传感器融合）\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e56. Simulator-as-Proxy World Model for Robot Manipulation（用于机器人操作的模拟器代理世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32786\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32786\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eVideo world models for robots are increasingly conditioned on a simulated or rendered proxy of the scene, on the assumption that the video will show what the proxy shows. Testing this assumption requires a proxy whose state is explicit and can be perturbed. We present SimPWM (Simulator-as-Proxy World Model): given a calibrated camera, it represents, from the first frame alone, the robot by its 3D model and the objects the gripper may touch as 3D points; a rule-based simulator with no trained parameters moves them under the actions, and a video model renders the result. SimPWM returns the realistic video together with the simulated state. We then freeze the simulated objects while the arm moves as recorded and check whether the video still shows the object lifted. On DROID episodes from unseen setups, the answer differs for the arm and for the objects. With each of three base video models, the arm follows the proxy (robot IoU 0.75-0.78, against at most 0.69 for end-to-end models); rendering the robot alone already gives this. What the simulated objects add is the object state: against a robot-only proxy, they cut missed pick-ups from 54% to 38%, and the video follows them only with some base models: on rigid objects, freezing them lowers the lift rate of MiniMax-H3, fine-tuned on episodes whose simulation agrees with the real video, from 42% to 10%, but that of LTX-2.3, trained on the same episodes, only from 57% to 49%, as if it inferred the grasp from the arm motion; more than half of the remaining lifts of MiniMax-H3 are of cloth and rope, which the simulator carries rigidly. With any base model, the simulated state records what the simulation did; under perturbed actions, a video that disagrees with it reveals that the video ignores the simulated state.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人的视频世界模型越来越多地以场景的模拟或渲染代理为条件，其假设是视频将显示代理所显示的内容。测试这一假设需要一个状态明确且可受扰动的代理。我们提出了SimPWM（作为代理世界模型的模拟器）：给定一个校准相机，它仅从第一帧开始，用其3D模型表示机器人，并将夹爪可能触摸的物体表示为3D点；一个没有训练参数的基于规则的模拟器在动作下移动它们，视频模型渲染结果。SimPWM返回逼真的视频以及模拟状态。然后，我们在机械臂按记录移动时冻结模拟物体，并检查视频是否仍然显示物体被抬起。在来自未见设置的DROID回合上，机械臂和物体的答案不同。对于三个基础视频模型中的每一个，机械臂都遵循代理（机器人IoU为0.75-0.78，而端到端模型最多为0.69）；仅渲染机器人就已经给出了这一点。模拟物体增加的是物体状态：与仅机器人的代理相比，它们将漏抓率从54%降低到38%，并且视频仅在某些基础模型中跟随它们：在刚性物体上，冻结它们将MiniMax-H3（在模拟与真实视频一致的回合上微调）的抬起率从42%降低到10%，但在相同回合上训练的LTX-2.3的抬起率仅从57%降低到49%，仿佛它是从机械臂运动推断出抓取的；MiniMax-H3剩余抬起中有一半以上是布和绳子，模拟器将它们刚性携带。对于任何基础模型，模拟状态记录了模拟所做的事情；在受扰动动作下，与之不一致的视频表明视频忽略了模拟状态。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为SimPWM的机器人视频世界模型，通过显式且可扰动的模拟器代理来测试视频世界模型是否真正遵循代理状态，并评估视频模型对机器人和物体状态的跟随能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SimPWM，利用无训练参数的基于规则的模拟器和视频模型，从第一帧开始通过3D模型和3D点表示机器人和物体。2. 实验证明机械臂能很好地遵循代理（IoU 0.75-0.78），优于端到端模型。3. 引入模拟物体状态可将漏抓率从54%降至38%。4. 揭示了不同视频模型（如MiniMax-H3和LTX-2.3）对物体状态和机械臂运动推断的依赖差异，以及视频模型在受扰动动作下可能忽略模拟状态的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：该方法通过冻结模拟物体来测试视频模型是否真正依赖模拟状态，发现不同基础视频模型对物体状态的依赖程度不同（如LTX-2.3似乎依赖机械臂运动而非模拟状态）。局限性：摘要未提供计算成本、推理速度、非刚性物体的详细改进方案以及除三个基础视频模型外的其他模型评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉 / 世界模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e57. SOLVE: Sparse, Ordered Keyposes Make LLM Agents Versatile and Efficient Robot Manipulator（SOLVE：稀疏、有序的关键姿态使LLM智能体成为多功能且高效的机器人操作器）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 0 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34750\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34750\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLLM agents have made remarkable progress in robot manipulation, yet they suffer from expensive inference, dense step-by-step control, and tool bottlenecks. We introduce SOLVE, a training-free, versatile and efficient agent policy: a multimodal LLM agent writes a sparse, ordered sequence of 6-DoF end-effector keyposes per call, observes the result, and writes the next, while a motion planner interpolates between them. The agent decides the number and spacing of keyposes for both fast long-range motion and fine-grained manipulation. This granularity matches the sparsity of teleoperated manipulation: most demonstrations in DROID can be compressed into a few keyposes instead of dense actions. SOLVE grounds keyposes with sparse depth queries answered by noisy sources, such as multi-view triangulation, stereo, or monocular depth, and copes with that noise itself. It also improves from execution feedback, reflecting on its own rollouts and distilling a few rules per task. SOLVE reaches state-of-the-art performance of 74.5% on RoboDojo and 84.5% on RoboLab, with only $1.7 per episode on average, 12x less than previous dense-control agent policies. On a real robot, the same agent achieves an 88% success rate (75 of 85 episodes) over 16 challenging zero-shot tasks. Our project page is at https://serenos.github.io/solve-website.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eLLM智能体在机器人操作方面取得了显著进展，但它们受到推理成本高昂、密集逐步控制和工具瓶颈的困扰。我们引入了SOLVE，一种无需训练、多功能且高效的智能体策略：多模态LLM智能体在每次调用时编写一个稀疏、有序的6自由度末端执行器关键姿态序列，观察结果，并编写下一个，同时运动规划器在它们之间进行插值。智能体决定关键姿态的数量和间距，以实现快速的长距离运动和细粒度的操作。这种粒度与遥操作操作的稀疏性相匹配：DROID中的大多数演示可以压缩为几个关键姿态，而不是密集动作。SOLVE通过由噪声源（如多视图三角测量、立体或单目深度）回答的稀疏深度查询来定位关键姿态，并自行应对这种噪声。它还从执行反馈中进行改进，反思自己的执行轨迹并为每个任务提炼出几条规则。SOLVE在RoboDojo上达到了74.5%的最先进性能，在RoboLab上达到了84.5%，平均每个回合仅需1.7美元，比以前的密集控制智能体策略低12倍。在真实机器人上，同一智能体在16个具有挑战性的零样本任务中实现了88%的成功率（85个回合中的75个）。我们的项目页面位于 https://serenos.github.io/solve-website。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种名为SOLVE的无需训练的多模态LLM智能体策略，通过生成稀疏、有序的6自由度末端执行器关键姿态序列并结合运动规划器插值，解决现有LLM智能体在机器人操作中推理成本高、控制密集和工具瓶颈的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SOLVE策略，LLM智能体每次调用生成稀疏、有序的6-DoF关键姿态，由运动规划器插值，匹配遥操作演示的稀疏性。2. 利用多视图三角测量、立体或单目深度等噪声源的稀疏深度查询来定位关键姿态，并自行处理噪声。3. 结合执行反馈进行自我反思并为每个任务提炼规则。4. 在RoboDojo和RoboLab上分别达到74.5%和84.5%的SOTA性能，平均成本仅1.7美元/回合（降低12倍）。5. 在真实机器人上16个零样本任务中达到88%（75/85）的成功率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e分析：SOLVE通过将密集动作压缩为稀疏关键姿态，大幅降低了LLM的推理成本（降低12倍），同时通过结合运动规划器和处理深度噪声源，在仿真和真实机器人上均取得了极高的成功率。局限性：摘要未提供运动规划器插值失败时的处理机制、处理深度噪声的具体算法细节以及在动态环境中的泛化能力评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 大型语言模型应用 / 智能体策略\u003c/p\u003e\n\u003chr\u003e\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [mvanhorn/last30days-skill](https://github.com/mvanhorn/last30days-skill)\n- **今日趋势**: 75,719 stars / 6,677 forks | 今日新增 755 stars\n- **项目简介**: 跨平台信息检索与摘要生成的AI代理技能。\n- **核心价值**: \n  - **项目用途**: 跨Reddit、X、YouTube、HN、Polymarket及Web研究任意主题，并生成有依据的摘要。\n  - **目标人群**: 需要利用AI代理进行高效信息检索与内容总结的用户及开发者。\n  - **技术核心**: AI Agent技能，跨平台数据抓取与综合摘要生成。\n  - **AI/大模型相关**: 是。\n\n---\n\n### [Tracer-Cloud/opensre](https://github.com/Tracer-Cloud/opensre)\n- **今日趋势**: 15,803 stars / 2,062 forks | 今日新增 325 stars\n- **项目简介**: 保障CI/CD流水线可靠性的开源代理。\n- **核心价值**: \n  - **项目用途**: 提供用于保障CI/CD可靠性的开源代理解决方案。\n  - **目标人群**: DevOps工程师及CI/CD流水线维护人员。\n  - **技术核心**: 开源Agent技术，专注于CI/CD可靠性保障。\n  - **AI/大模型相关**: 是。\n\n---\n\n### [zhouxiaoka/autoclip](https://github.com/zhouxiaoka/autoclip)\n- **今日趋势**: 16,900 stars / 2,380 forks | 今日新增 770 stars\n- **项目简介**: 本地优先的开源AI视频剪辑桌面工具，一键将长视频转为短视频。\n- **核心价值**: \n  - **项目用途**: 将播客、访谈等长视频自动剪辑为短视频，生成字幕、封面和文案，适配各大短视频平台。\n  - **目标人群**: 视频创作者、内容运营者及需要批量处理长视频的用户。\n  - **技术核心**: 本地优先的AI剪辑与MCP服务器，长短视频自动化处理。\n  - **AI/大模型相关**: 是。\n\n---\n\n### [Imbad0202/academic-research-skills](https://github.com/Imbad0202/academic-research-skills)\n- **今日趋势**: 58,692 stars / 4,475 forks | 今日新增 130 stars\n- **项目简介**: 为Claude Code打造的学术研究全流程辅助技能。\n- **核心价值**: \n  - **项目用途**: 为Claude Code提供涵盖研究、写作、审查、修改到最终定稿的学术研究技能。\n  - **目标人群**: 学术研究人员及使用Claude Code进行学术写作的学者。\n  - **技术核心**: 针对Claude Code的特定技能（Skills），自动化辅助学术研究写作流程。\n  - **AI/大模型相关**: 是。\n\n---\n\n### [wshobson/agents](https://github.com/wshobson/agents)\n- **今日趋势**: 42,928 stars / 4,550 forks | 今日新增 37 stars\n- **项目简介**: 跨多种AI编码工具的通用插件、代理与技能集合。\n- **核心价值**: \n  - **项目用途**: 为Claude Code、Cursor、Copilot等多种AI工具提供插件
