    <h1>前沿科研情报 - 2026-11-27</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails open\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文\u003c/b\u003e\u003c/summary\u003e\n\u003ch3\u003e1. Real2SimLab: A Unified Platform for Real-to-Simulation Transfer（Real2SimLab：一个用于真实到仿真迁移的统一平台）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 101 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34849\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34849\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReal-to-simulation transfer, which builds simulations from real-world observations, has long been studied in research and industry. Recently, coding agents have become capable of generating simulation programs from video recordings, and several benchmarks have been proposed to evaluate them. However, each individual benchmark defines its own inputs, deliverables, and scoring pipeline. This leads to N times M integrations when evaluating N methods on M benchmarks. To this end, we present Real2SimLab, a unified platform for real-to-simulation transfer. It evaluates a method by running its written program and scoring the output simulation with the original scorer of each benchmark. Moreover, Real2SimLab provides a pipeline to create training data and reward annotations for real-to-simulation methods. Our pipeline carefully avoids data contamination by filtering out the video recordings that exist in benchmarks. For each video recording, a program is first produced, and then our pipeline computes its reward with the same code that Real2SimLab uses for evaluation. So far, it supports 47 coding agents and 5 non-agent methods on 6 benchmarks. Both the platform and Awesome-Real2Sim, our research map of nearly 300 real-to-simulation papers, are open source, and we invite the Real2SimHub community to build them together.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e真实到仿真迁移（从现实世界的观察中构建仿真）在研究和工业界已被长期研究。最近，编码智能体已经能够从视频记录中生成仿真程序，并且已经提出了几个基准来评估它们。然而，每个单独的基准都定义了自己的输入、交付物和评分流程。这导致在M个基准上评估N种方法时需要进行N乘M次集成。为此，我们提出了Real2SimLab，一个用于真实到仿真迁移的统一平台。它通过运行方法编写的程序并使用每个基准的原始评分器对输出仿真进行评分来评估该方法。此外，Real2SimLab提供了一个流程，用于为真实到仿真方法创建训练数据和奖励注释。我们的流程通过过滤掉基准中存在的视频记录来仔细避免数据污染。对于每个视频记录，首先生成一个程序，然后我们的流程使用Real2SimLab用于评估的相同代码计算其奖励。到目前为止，它支持6个基准上的47个编码智能体和5个非智能体方法。该平台以及Awesome-Real2Sim（我们包含近300篇真实到仿真论文的研究地图）都是开源的，我们邀请Real2SimHub社区共同构建它们。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决真实到仿真迁移评估中基准不统一导致的集成繁琐问题，并提供避免数据污染的训练数据生成流程。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Real2SimLab统一平台，支持运行程序并使用各基准原始评分器评估；提供避免数据污染的训练数据和奖励注释生成流程；支持6个基准上的47个编码智能体和5个非智能体方法；开源平台及包含近300篇论文的研究地图。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供具体的评估性能对比数字或详细的局限分析。主要贡献在于统一评估平台和防污染数据生成流程，解决了N乘M集成的痛点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与仿真/强化学习环境/基准测试平台\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e2. Sage-Med: Scaling Medical Multimodal Intelligence（Sage-Med：扩展医疗多模态智能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 84 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34575\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34575\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEstablishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in practice, we introduce Sage-Med-Preview, a 35B-parameter medical multimodal model with 3B activated parameters, built by combining stage-specific curation over 322.7 million candidate records with a progressive training curriculum spanning medical pretraining, staged supervised fine-tuning, and adaptive reinforcement learning. Across this curriculum, progressive supervised refinement and adaptive reinforcement learning yield consistent stage-wise gains, substantially advancing both specialized visual understanding and medical language capabilities. Evaluated against 77 competing models across 238 clinical tasks spanning 61 public and 13 private multi-center benchmarks in more than 40 modalities, Sage-Med-Preview achieves an average score of 58.26% on the 31 public multimodal benchmarks. It outperforms the state-of-the-art open-source medical model Hulu-Med-235B-A22B at 50.99% and the general scientific model Intern-S2-Preview at 52.24%, and approaches the advanced proprietary model GPT-6.2-Sol across multiple tasks such as comprehensive multimodal understanding, report generation, and visual grounding. Although substantial challenges remain in complex medical reasoning and multi-step clinical workflows, this report provides empirical evidence, actionable data and training recipes, and a rigorous benchmark toward scalable clinical multimodal intelligence.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e为医疗多模态大语言模型（MLLMs）建立有效的缩放定律仍然是一个持久且根本的挑战。我们的系统评估表明，现有的医疗MLLMs在一系列医疗任务中往往落后于前沿的通用MLLMs，而扩大模型规模主要提高的是文本能力而非多模态感知能力，并且启用推理模式也未能弥合这一视觉差距。为了研究医疗多模态智能在实践中如何扩展，我们引入了Sage-Med-Preview，这是一个拥有35B参数、3B激活参数的医疗多模态模型，它结合了对3.227亿条候选记录的阶段特定筛选，以及跨越医疗预训练、分阶段监督微调和自适应强化学习的渐进式训练课程。在这个课程中，渐进式监督微调和自适应强化学习产生了持续的阶段性收益，大幅推进了专业视觉理解和医疗语言能力。在跨越40多种模态的61个公开和13个私有多中心基准的238个临床任务中，对77个竞争模型进行了评估，Sage-Med-Preview在31个公开多模态基准上取得了58.26%的平均得分。它以50.99%的得分超越了最先进的开源医疗模型Hulu-Med-235B-A22B，以52.24%的得分超越了通用科学模型Intern-S2-Preview，并在全面多模态理解、报告生成和视觉定位等多个任务上接近先进的专有模型GPT-6.2-Sol。尽管在复杂医疗推理和多步骤临床工作流中仍存在重大挑战，但本报告提供了实证证据、可操作的数据和训练配方，以及迈向可扩展临床多模态智能的严格基准。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索医疗多模态智能的扩展规律，并开发一个高性能的医疗多模态大语言模型Sage-Med-Preview。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e发现现有医疗MLLM视觉感知落后且单纯扩大参数无法弥补视觉差距；提出Sage-Med-Preview（35B总参数/3B激活参数），采用3.227亿数据筛选和渐进式训练（预训练、监督微调、自适应强化学习）；在31个公开多模态基准上平均得分58.26%，超越Hulu-Med-235B-A22B和Intern-S2-Preview，接近GPT-6.2-Sol。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出复杂医疗推理和多步骤临床工作流仍存在重大挑战。模型在视觉感知上通过渐进式训练取得了进展，但单纯扩大规模对多模态感知提升有限。评估涵盖了大量基准和任务，但未提供具体失败案例的详细分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e医疗人工智能/多模态大语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e3. Mixture-of-Loops Transformer（循环混合Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 57 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34923\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34923\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLooped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and reads local KV across loops for expressivity. Under loop KV, MoLT-KV instead restarts from embeddings and reads current-loop local KV with preceding-loop memory KV at earlier positions for efficiency. MoLT-KV eliminates same-position cross-loop dependence and, paired with loop forcing for parallel training, unlocks single-traversal Mixture-of-Loops (MoL) decoding beyond the training loop horizon. To balance efficiency and quality, we introduce U-shaped MoLT (U-MoLT), which separates memory construction from prediction readout and skips unused decoder traversals without changing predictions. In 400B-token pretraining, U-MoLT outperforms OLMo3 across 700M/1.5B dense and 3B MoE models, achieving 1.7x validation cross-entropy (CE) token efficiency at 700M while improving 3B MoE 10-domain perplexity by 0.75 and 10-task accuracy by 2.1 percentage points. In 100B-token continued pretraining of Qwen3.5-0.8B-Base, our U-MoLT adaptation lowers CE on all 11 domains over the matched baseline with 1.4x mean token efficiency. At inference, U-MoLT with MoL-Hybrid-2 matches non-looped OLMo3 latency at 996.6 vs. 1,000.6 ms on S-size (~113M) models. Code is available at https://github.com/hustvl/MoLT\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e循环Transformer通过在循环中重用共享层来提高表达能力，但代价是效率。推动其表达能力-效率边界需要重新思考连接相邻循环的核心机制：Transformer循环应该传递什么？我们引入了循环混合Transformer（MoLT），其循环混合注意力（MoLA）使用键和值（KV）作为内存，以便在深度和循环之间进行选择性重用。在循环残差下，MoLT-R保留残差流并跨循环读取局部KV以提高表达能力。在循环KV下，MoLT-KV转而从嵌入重新开始，并在较早位置读取当前循环局部KV与先前循环内存KV以提高效率。MoLT-KV消除了同位置的跨循环依赖，并与用于并行训练的循环强制结合，解锁了超越训练循环视野的单次遍历循环混合（MoL）解码。为了平衡效率和质量，我们引入了U型MoLT（U-MoLT），它将内存构建与预测读取分离，并跳过未使用的解码器遍历而不改变预测。在400B token的预训练中，U-MoLT在700M/1.5B密集模型和3B MoE模型中超越了OLMo3，在700M模型上实现了1.7倍的验证交叉熵（CE）token效率，同时将3B MoE的10领域困惑度降低了0.75，10任务准确率提高了2.1个百分点。在Qwen3.5-0.8B-Base的100B token继续预训练中，我们的U-MoLT适配在所有11个领域上降低了CE，平均token效率达到1.4倍。在推理时，带有MoL-Hybrid-2的U-MoLT在S尺寸（约113M）模型上匹配了非循环OLMo3的延迟，为996.6毫秒对比1,000.6毫秒。代码可在 https://github.com/hustvl/MoLT 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决循环Transformer在提高表达能力时牺牲效率的问题，重新设计循环间的核心传递机制以平衡表达能力与效率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出MoLT及MoLA机制，利用KV作为跨深度和循环的选择性重用内存；提出MoLT-KV消除同位置跨循环依赖，结合循环强制实现单次遍历解码；提出U-MoLT分离内存构建与预测读取；在400B token预训练中，700M模型实现1.7倍CE token效率，3B MoE困惑度降0.75、准确率升2.1%；在Qwen3.5继续预训练中实现1.4倍效率；推理延迟匹配非循环模型。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供关于模型在特定下游任务上的详细表现或更广泛的局限性分析。主要关注预训练和继续预训练阶段的token效率、困惑度和准确率，以及推理延迟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理/大语言模型架构\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e4. DyLoMo-DiT: Dynamic Looped Mixture-of-Experts Diffusion Transformers（DyLoMo-DiT：动态循环混合专家扩散Transformer）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 55 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30844\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30844\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDiffusion Transformers (DiTs) scale model capacity by increasing both parameter count and computation. Mixture-of-Experts (MoE) variants expand parameter capacity while keeping per-token computation roughly fixed, but still require substantial parameter storage. In this paper, we propose Dynamic Looped MoE DiT (DyLoMo-DiT), which reuses parameters rather than adding them: a weight-shared loop repeatedly applies the middle layers, while sparse experts allocate parameter capacity across tokens. This design deepens the network without adding parameters, freeing the parameter budget for other uses, such as more experts or more distinct layers. It also allocates compute dynamically, varying the number of passes across noise levels. Experiments show that DyLoMo-DiT makes more effective use of parameter and compute budgets, with further gains from assigning more passes to low-noise steps. On ImageNet 256times256, DyLoMo-DiT reduces FID by 11-24% relative to DiT and 36-56% relative to DiT-MoE at matched parameter and compute budgets. For text-to-image generation, a scaled DyLoMo-DiT achieves a higher GenEval score than FLUX.1 (0.714 vs. 0.673), with less than one tenth of its active parameters (1.05B vs. 12B).\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩散Transformer（DiTs）通过增加参数数量和计算量来扩展模型容量。混合专家（MoE）变体在保持每token计算量大致固定的同时扩展了参数容量，但仍然需要大量的参数存储。在本文中，我们提出了动态循环MoE DiT（DyLoMo-DiT），它重用参数而不是增加参数：一个权重共享的循环重复应用中间层，而稀疏专家跨token分配参数容量。这种设计在不增加参数的情况下加深了网络，释放了参数预算用于其他用途，例如更多的专家或更多不同的层。它还动态分配计算，改变跨噪声级别的传递次数。实验表明，DyLoMo-DiT更有效地利用了参数和计算预算，并且通过将更多传递次数分配给低噪声步骤获得了进一步的收益。在ImageNet 256x256上，在匹配的参数和计算预算下，DyLoMo-DiT相对于DiT将FID降低了11-24%，相对于DiT-MoE降低了36-56%。对于文本到图像生成，缩放后的DyLoMo-DiT实现了比FLUX.1更高的GenEval得分（0.714对0.673），而其激活参数不到FLUX.1的十分之一（1.05B对12B）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决扩散Transformer（DiTs）和混合专家（MoE）变体在扩展参数容量时面临的大量参数存储和计算成本问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出DyLoMo-DiT，通过权重共享循环重用参数并跨token分配稀疏专家，在不增加参数的情况下加深网络；动态分配计算，根据噪声级别改变传递次数；在ImageNet 256x256上，匹配预算下FID比DiT降低11-24%，比DiT-MoE降低36-56%；在文生图任务中，GenEval得分达0.714（超越FLUX.1的0.673），且激活参数仅为1.05B（FLUX.1为12B）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要未提供关于模型生成多样性、更高分辨率下的表现或训练稳定性的局限分析。主要证明了在参数和计算预算受限情况下的生成质量提升。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉/图像生成/扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e5. VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation（VibeVideoAgent：为代码驱动的视频生成闭合感知循环）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 54 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34237\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34237\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCode-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding session bloats its long-horizon context, while critiquing only the finished full-resolution render turns early design mistakes into costly rewrites. We introduce VibeVideoAgent, a training-free framework that lets coding agents inspect their drafts throughout production. Multimodal perception runs in short-lived contexts kept apart from the coder and returns compact, grounded Findings. Seven primitives operate on a unified multi-clock representation of assets and drafts: they explore media from coarse to fine, verify quoted requirements with evidence from every required modality, compare a draft with a reference or an earlier revision on separate clocks, and measure stream signals locally. A lightweight staged protocol has the agent test its riskiest decision on a minimal preview first. On all 239 VibeVideoBench tasks, with matched agent runtimes and a fixed perception model, VibeVideoAgent improves holistic audiovisual quality (L3) for Claude Opus 5.5 (4.03 -\u0026gt; 4.43, while L2 rubric compliance rises from 98.87% to 99.35%), GPT-6 Astra (4.03 -\u0026gt; 4.27), and Claude Sonnet 5.5 (3.97 -\u0026gt; 4.10), with the largest gains in audio-visual synchronization (up to +0.56). Controlled ablations show that each component contributes, and trajectory audits show that the granularity of code edits governs the trade-off between rubric adherence and perceptual quality.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e代码驱动的视频生成要求编码智能体编写并运行渲染程序。这提供了对排版、数据可视化、同步音频和多镜头场景的精确控制，并留下了一个可编辑的项目。一个干净退出的程序仍然可能渲染出重叠的标签、镜头偏离主体、损坏的对象交互或漂移不同步的旁白，而这些都不会引发运行时错误。将渲染的帧和音频反馈回编码会话会使其长视野上下文膨胀，而仅对完成的完整分辨率渲染进行批评则会将早期的设计错误变成代价高昂的重写。我们引入了VibeVideoAgent，这是一个免训练框架，让编码智能体在整个制作过程中检查其草稿。多模态感知在独立于编码器的短暂上下文中运行，并返回紧凑、有依据的发现。七个原语在资产和草稿的统一多时钟表示上运行：它们从粗到细地探索媒体，用每个所需模态的证据验证引用的要求，在单独的时钟上将草稿与参考或早期修订进行比较，并在本地测量流信号。一个轻量级的分阶段协议让智能体首先在最小预览上测试其风险最高的决策。在所有239个VibeVideoBench任务中，在匹配的智能体运行时间和固定的感知模型下，VibeVideoAgent提高了Claude Opus 5.5的整体视听质量（L3）（4.03 -\u0026gt; 4.43，同时L2规则遵从性从98.87%提高到99.35%）、GPT-6 Astra（4.03 -\u0026gt; 4.27）和Claude Sonnet 5.5（3.97 -\u0026gt; 4.10），在视听同步方面获得了最大收益（高达+0.56）。受控消融实验表明每个组件都有贡献，轨迹审计表明代码编辑的粒度支配着规则遵从性和感知质量之间的权衡。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决代码驱动视频生成中，程序无运行时错误但存在视觉或听觉感知缺陷的问题，避免长上下文膨胀和早期错误导致的高成本重写。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出免训练框架VibeVideoAgent，使编码智能体能在制作全程检查草稿；多模态感知在独立短上下文中运行，返回紧凑发现；7个原语在统一多时钟表示上操作，支持从粗到细探索、多模态证据验证等；轻量级分阶段协议先在最小预览测试高风险决策；在239个VibeVideoBench任务上，显著提升多个模型的整体视听质量和视听同步（最高+0.56）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出代码编辑的粒度支配着规则遵从性和感知质量之间的权衡，但未提供如何自动选择最佳粒度的具体方法。此外，评估依赖于固定的感知模型和匹配的运行时间，未探讨不同感知模型或更长运行时间对结果的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态生成/视频生成/智能体应用\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e6. Improving and Expanding Video Editing Capabilities Without Videos（在无视频情况下改进和扩展视频编辑能力）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 43 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34941\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34941\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eImage editing models can follow a wide range of instructions, but video editing models still lag behind, limited in part by the difficulty of collecting paired source and edited videos. Is it possible to transfer advanced image editing capabilities to video editors without new paired videos? We introduce Image-to-Video Transfer (I2VT), which improves pretrained video editors and expands them to new editing tasks using an image editor. It enables efficient post-training with no architectural changes and no new videos, using only individual images. Our key idea is to let the video editor role-play as an image editor: it edits an image as a one-frame video, with the image editor guiding the video editor\u0026#x27;s predictions at each denoising step. Although the video editor sees only single images during training, at test time it applies the improved and expanded capabilities to whole video clips while preserving temporal consistency. To push the boundaries of video editing, we introduce OpenVE++, an extension of OpenVE-Bench that adds four new editing tasks useful for video production, including action changes, expression changes, body movements, and scene relighting. Our experiments across three different video editors show that I2VT improves existing editing capabilities and expands them to new tasks, and our models achieve state-of-the-art (SOTA) performance on both OpenVE-Bench and OpenVE++.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e图像编辑模型可以遵循广泛的指令，但视频编辑模型仍然落后，部分原因是收集配对的源视频和编辑后视频存在困难。是否可以在没有新的配对视频的情况下，将先进的图像编辑能力转移到视频编辑器中？我们引入了图像到视频转移（I2VT），它利用图像编辑器改进预训练的视频编辑器，并将其扩展到新的编辑任务。它实现了高效的后训练，无需架构更改，也无需新视频，仅使用单张图像。我们的核心思想是让视频编辑器扮演图像编辑器的角色：它将图像作为单帧视频进行编辑，由图像编辑器在每个去噪步骤中指导视频编辑器的预测。尽管视频编辑器在训练期间仅看到单张图像，但在测试时，它将改进和扩展的能力应用于整个视频片段，同时保持时间一致性。为了突破视频编辑的界限，我们引入了OpenVE++，它是OpenVE-Bench的扩展，增加了四个对视频制作有用的新编辑任务，包括动作改变、表情改变、身体运动和场景重新照明。我们在三个不同的视频编辑器上进行的实验表明，I2VT 改进了现有的编辑能力并将其扩展到新任务，我们的模型在 OpenVE-Bench 和 OpenVE++ 上均取得了最先进（SOTA）的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将先进的图像编辑能力转移到视频编辑器中，以改进预训练视频编辑器并将其扩展到新的编辑任务，而无需收集新的配对视频。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出图像到视频转移（I2VT）方法，让视频编辑器在训练时扮演图像编辑器角色，仅使用单张图像进行高效后训练，无需改变架构或收集新视频；在测试时保持时间一致性并应用于整个视频片段；引入OpenVE++基准，增加动作改变、表情改变、身体运动和场景重新照明四个新编辑任务；在三个不同视频编辑器上验证，并在OpenVE-Bench和OpenVE++上取得SOTA性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e该方法通过让视频编辑器在训练时处理单帧图像，巧妙绕过了配对视频数据收集的难题，实现了跨模态能力迁移。然而，摘要未提供关于时间一致性保持的具体量化指标、I2VT方法在不同视频编辑器上的具体性能提升数值，以及OpenVE++基准的具体评估指标和对比基线细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与视频编辑\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e7. PyRUA-Dex: Learning Programmatic Policies for Dexterous Bimanual Manipulation with Coding Agents（PyRUA-Dex：使用编码代理学习灵巧双手操作的程序化策略）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 43 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33144\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33144\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLearning for dexterous manipulation is limited by the scarcity of high-quality demonstrations: retargeting from human video is imprecise, teleoperation gives no force feedback to the operator, and exoskeleton-based collection is hard to scale up. We present PyRUA-Dex, a framework that enables coding agents to develop dexterous manipulation through programmatic policy, without the need of demonstrations. The programmatic policy is developed in two stages: during exploration, multiple agents explore in parallel for task skills and ways to compose them, and a distilling agent condenses the successful attempts into a task library and one program. During refinement, this program is improved through randomized layouts for enhanced robustness and execution efficiency. In simulated environments, PyRUA-Dex achieves SOTA on Bench2Dex with a score of 72.9 and reaches 81.0% success on DexJoCo under full randomization, ahead of every trained policy on both benchmarks. In real world experiments on a bimanual platform with two 22-DoF hands, PyRUA-Dex learns to play piano, write calligraphy, and other tasks efficiently: learning a new piece from sheet music takes as little as 30 minutes. These results suggest that PyRUA-Dex is an effective framework for developing dexterous manipulation policies with coding agents in the absence of high quality dexterous manipulation demonstrations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e灵巧操作的学习受到高质量演示稀缺的限制：从人类视频重定向不精确，遥操作无法为操作员提供力反馈，基于外骨骼的收集难以扩展。我们提出了 PyRUA-Dex，这是一个使编码代理能够通过程序化策略开发灵巧操作的框架，而无需演示。程序化策略分两个阶段开发：在探索阶段，多个代理并行探索任务技能及其组合方式，蒸馏代理将成功的尝试浓缩为任务库和一个程序。在细化阶段，该程序通过随机化布局进行改进，以增强鲁棒性和执行效率。在模拟环境中，PyRUA-Dex 在 Bench2Dex 上以 72.9 分取得 SOTA，并在完全随机化下在 DexJoCo 上达到 81.0% 的成功率，领先于这两个基准上的所有训练策略。在具有两个 22 自由度手的双臂平台上的真实世界实验中，PyRUA-Dex 能够有效地学习弹钢琴、写书法和其他任务：从乐谱学习一首新曲子仅需 30 分钟。这些结果表明，在没有高质量灵巧操作演示的情况下，PyRUA-Dex 是一个使用编码代理开发灵巧操作策略的有效框架。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e在没有高质量演示的情况下，使编码代理能够通过程序化策略学习并开发灵巧的双手操作能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出PyRUA-Dex框架，无需演示即可通过编码代理开发灵巧操作；采用两阶段程序化策略开发（探索阶段多代理并行探索与蒸馏，细化阶段随机化布局改进）；在Bench2Dex（72.9分）和DexJoCo（81.0%成功率）模拟环境中取得SOTA；在真实世界双臂平台（22自由度）上实现弹钢琴、写书法等任务，从乐谱学习新曲子仅需30分钟。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e该框架通过程序化策略和编码代理有效解决了高质量灵巧操作演示稀缺的问题，并在模拟和真实世界中展现了强大的泛化和执行能力。然而，摘要未提供关于程序化策略具体代码结构、多代理并行探索的具体算法细节、真实世界实验中除30分钟外的其他任务成功率或具体误差数据，以及与其他基于演示方法的详细对比分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与灵巧操作\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e8. DocSEAM: Bidirectional Cross-Page Encoding for Multi-Page Document Understanding（DocSEAM：用于多页文档理解的双向跨页编码）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 26 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34420\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34420\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMulti-page document vision-language models encode each page independently, creating a feature-level discontinuity at page boundaries: visual tokens are formed without access to content on adjacent pages, and the language model must reason over these page representations formed in isolation. We introduce DocSEAM (Document Selective Enrichment via Anchored Masking), a lightweight module inserted between a pretrained vision encoder and the language model that injects the inductive bias of local cross-page context into visual representations. For each page, DocSEAM forms a local triplet with its two neighbors, applies center-anchored masked self-attention with directional salience gates to fuse information from neighbor pages, and returns only the enriched center-page tokens, leaving the visual token count unchanged. After a supervised cross-page warm-up and multi-page fine-tuning with DocSEAM frozen, our 9B-parameter model achieves state-of-the-art results among the evaluated open-weight models of up to 10B parameters on five multi-page document VQA benchmarks. We further show that under controlled re-pagination, DocSEAM reduces sensitivity to boundary placement and improves cross-page span localization\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多页文档视觉语言模型独立编码每一页，在页面边界处造成特征级别的不连续性：视觉标记的形成无法访问相邻页面的内容，语言模型必须对这些孤立形成的页面表示进行推理。我们引入了 DocSEAM（通过锚定掩码进行文档选择性富集），这是一个插入在预训练视觉编码器和语言模型之间的轻量级模块，它将局部跨页上下文的归纳偏置注入到视觉表示中。对于每一页，DocSEAM 与其两个邻居形成一个局部三元组，应用带有方向显著性门的中心锚定掩码自注意力来融合来自邻居页面的信息，并仅返回富集后的中心页标记，保持视觉标记数量不变。在经过监督的跨页预热和冻结 DocSEAM 的多页微调之后，我们的 90 亿参数模型在五个多页文档 VQA 基准测试中，在评估的高达 100 亿参数的开放权重模型中取得了最先进的结果。我们进一步表明，在受控的重新分页下，DocSEAM 降低了对边界放置的敏感性并改善了跨页跨度定位。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决多页文档视觉语言模型在页面边界处特征不连续的问题，通过注入局部跨页上下文归纳偏置来提升多页文档理解能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出DocSEAM轻量级模块，插入于视觉编码器和语言模型之间；通过构建局部三元组并应用带方向显著性门的中心锚定掩码自注意力融合邻居页面信息，且保持视觉标记数量不变；90亿参数模型在五个多页文档VQA基准上于100亿参数以下的开放权重模型中取得SOTA；在受控重新分页下降低对边界放置的敏感性并改善跨页跨度定位。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eDocSEAM 通过轻量级的跨页注意力机制有效缓解了多页文档处理中的特征不连续问题，且在保持视觉标记数量不变的情况下实现了性能提升。然而，摘要未提供五个多页文档 VQA 基准的具体名称和各项具体得分、90亿参数模型与100亿参数以上闭源或开源模型的具体对比数据，以及跨页跨度定位改善的具体量化指标。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与多模态文档理解\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e9. HOG-WAM: Improving Visual Robustness through Future Gradient Prediction（HOG-WAM：通过未来梯度预测提高视觉鲁棒性）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 22 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34811\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34811\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWorld-action models jointly predict future observations and actions, yet visual corruption can disrupt the resulting policies. We introduce HOG-WAM, which adds future Histograms of Oriented Gradients (HOG) as structural supervision derived directly from demonstration images. An auxiliary HOG diffusion transformer (DiT) module reads RGB features through asymmetric attention, allowing its objective to shape the visual representation used for control. The module is used only during training and removed at inference, preserving FastWAM\u0026#x27;s RGB-to-action architecture. We evaluate four controlled observation corruptions through a visual-corruption extension of RoboTwin, termed RoboTwin-Plus; HOG-WAM achieves the highest success among the compared policies under all four. Mixed-noise success increases from 78.86% to 82.86% relative to FastWAM, with comparable performance on clean scenes. On LIBERO Plus, overall success increases from 74.49% to 75.26%, with the largest gain under sensor noise, from 74.14% to 78.89%. Across four Franka tasks, average success increases from 40% to 59% under clean observations and from 17% to 24% under noisy observations. A representation ablation favors combining RGB observations with auxiliary HOG prediction over replacing RGB with HOG. These findings support future-gradient prediction as complementary supervision for visually robust control, with larger absolute gains on physical tasks than in simulation. Code is available at https://github.com/iPPLab/HOG-WAM.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e世界-动作模型联合预测未来观察和动作，但视觉损坏可能会破坏由此产生的策略。我们引入了 HOG-WAM，它添加了未来的方向梯度直方图（HOG）作为直接从演示图像中得出的结构监督。一个辅助的 HOG 扩散 Transformer（DiT）模块通过非对称注意力读取 RGB 特征，使其目标能够塑造用于控制的视觉表示。该模块仅在训练期间使用，并在推理时移除，从而保留了 FastWAM 的 RGB 到动作架构。我们通过 RoboTwin 的视觉损坏扩展（称为 RoboTwin-Plus）评估了四种受控观察损坏；HOG-WAM 在所有四种情况下在比较的策略中取得了最高的成功率。相对于 FastWAM，混合噪声成功率从 78.86% 提高到 82.86%，在干净场景下具有相当的性能。在 LIBERO Plus 上，整体成功率从 74.49% 提高到 75.26%，在传感器噪声下的增益最大，从 74.14% 提高到 78.89%。在四个 Franka 任务中，在干净观察下平均成功率从 40% 提高到 59%，在噪声观察下从 17% 提高到 24%。表示消融实验支持将 RGB 观察与辅助 HOG 预测相结合，而不是用 HOG 替换 RGB。这些发现支持未来梯度预测作为视觉鲁棒控制的补充监督，在物理任务上的绝对收益大于在模拟中。代码可在 https://github.com/iPPLab/HOG-WAM 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过引入未来方向梯度直方图（HOG）作为结构监督，提高世界-动作模型在视觉损坏情况下的策略鲁棒性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出HOG-WAM，引入辅助HOG扩散Transformer（DiT）模块在训练时提供未来HOG结构监督，推理时移除以保留原架构；在RoboTwin-Plus的四种受控观察损坏中取得最高成功率；混合噪声成功率从78.86%提升至82.86%；LIBERO Plus整体成功率从74.49%提升至75.26%（传感器噪声下从74.14%提升至78.89%）；四个Franka物理任务中干净观察成功率从40%提升至59%，噪声下从17%提升至24%；消融实验证明RGB结合HOG预测优于仅用HOG。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eHOG-WAM 通过辅助的结构监督有效提升了模型在多种视觉损坏条件下的鲁棒性，且推理阶段无额外计算负担。实验数据详实，证明了其在模拟和物理任务上的有效性。然而，摘要未提供 RoboTwin-Plus 中四种具体受控观察损坏的类型名称、LIBERO Plus 和 Franka 任务的具体任务描述、以及与其他非 FastWAM 基线模型的具体对比数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与视觉强化学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e10. EgoUseBench: Benchmarking Computer-Use Agents under Evolving First-Person Contexts（EgoUseBench：在不断演变的第一人称上下文中对计算机使用代理进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 19 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34466\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34466\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAI wearables, such as smart glasses, extend the context available to agents beyond digital environments to users\u0026#x27; physical surroundings. With these devices, computer tasks can originate from users\u0026#x27; ongoing activities rather than solely from explicit instructions. Through first-person observations, agents can identify objects and activities relevant to user requests and ground digital tasks in the surrounding context. We call this interaction paradigm Ego Use. However, first-person observations are limited by the wearer\u0026#x27;s viewpoint and may provide incomplete or ambiguous evidence of ongoing activities. As new observations arrive, agents may need to revise their understanding of the physical context and user intent, and reassess whether prior digital actions remain valid. Whether current agents can reliably handle these changes remains insufficiently evaluated. We introduce EgoUseBench, a benchmark for evaluating Ego Use across three interaction settings with different levels of first-person context. Computer-Use relies on explicit instructions, Offline Ego Use provides prerecorded first-person context before execution, and Online Ego Use provides continuous observations as user intent evolves. Based on over 74 hours of real-world first-person recordings, we construct 693 tasks across the three interaction settings. To capture task evolution, we track first-person observations, user requirements, and website state separately. We further group tasks by how information changes during execution, resulting in three types: Graft (revised user requirements), Refresh (new first-person observations), and Clarify (agent-initiated information seeking). We evaluate advanced models and find that average success rates in Online Ego Use are 26.3% lower than in Computer-Use. This result reveals the difficulty of keeping task execution aligned with evolving first-person context and user intent.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003eAI 可穿戴设备（如智能眼镜）将代理可用的上下文从数字环境扩展到用户的物理周围环境。借助这些设备，计算机任务可以源于用户正在进行的活动，而不仅仅是明确的指令。通过第一人称观察，代理可以识别与用户请求相关的对象和活动，并将数字任务扎根于周围环境中。我们将这种交互范式称为 Ego Use（自我使用）。然而，第一人称观察受到佩戴者视角的限制，可能会提供正在进行的活动的不完整或模棱两可的证据。随着新观察的到来，代理可能需要修正其对物理上下文和用户意图的理解，并重新评估先前的数字动作是否仍然有效。当前代理是否能可靠地处理这些变化仍未得到充分评估。我们引入了 EgoUseBench，这是一个用于在三种具有不同级别第一人称上下文的交互设置中评估 Ego Use 的基准。Computer-Use 依赖明确指令，Offline Ego Use 在执行前提供预录的第一人称上下文，Online Ego Use 在用户意图演变时提供连续观察。基于超过 74 小时的真实世界第一人称录像，我们在三种交互设置中构建了 693 个任务。为了捕捉任务演变，我们分别跟踪第一人称观察、用户要求和网站状态。我们进一步根据执行期间信息的变化方式对任务进行分组，产生三种类型：Graft（修改的用户要求）、Refresh（新的第一人称观察）和 Clarify（代理发起的信息寻求）。我们评估了高级模型，发现 Online Ego Use 的平均成功率比 Computer-Use 低 26.3%。这一结果揭示了使任务执行与不断演变的第一人称上下文和用户意图保持一致的困难。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估计算机使用代理在具有不同级别第一人称上下文（明确指令、离线第一人称上下文、在线连续观察）的交互设置（Ego Use）中处理不断演变的物理上下文和用户意图的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出Ego Use交互范式及EgoUseBench基准，包含Computer-Use、Offline Ego Use和Online Ego Use三种设置；基于超74小时真实世界第一人称录像构建693个任务；将任务按信息变化分为Graft、Refresh和Clarify三类；评估发现Online Ego Use平均成功率比Computer-Use低26.3%，揭示了保持任务执行与演变上下文一致的困难。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003eEgoUseBench 填补了评估代理在动态第一人称物理上下文中执行计算机任务能力的空白，提供了丰富的真实世界数据和细致的任务分类。然而，摘要未提供所评估的高级模型的具体名称、三种交互设置下各自的具体成功率数值、693个任务的具体分布比例，以及 Graft、Refresh 和 Clarify 三类任务各自的具体难度差异或成功率表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能代理与基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e11. Playfulness as Feedback for Agentic Game Development（将趣味性作为智能体游戏开发的反馈）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 18 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33457\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33457\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eCoding agents can generate runnable games from natural-language descriptions. However, a runnable game does not guarantee an excellent gameplay experience for players. In our view, a playful game should provide 1) reliable core functionality, 2) appealing visual design and assets, and 3) rich gameplay that supports exploration and progression. How agents can improve these aspects of playfulness remains underexplored. In our work, we propose Play2Evolve, a recursive game development framework with three stages: Initialization, Refinement, and Evolution. Using playfulness as feedback, agents playtest the game and diagnose issues in its functionality, visual presentation, and gameplay. Their feedback guides bug fixes and asset improvements. It also helps agents propose new gameplay and aesthetic goals for continued game evolution. To enrich game materials, we combine a video generation model with code to create appealing static and dynamic assets and integrate them into interactive gameplay. Finally, Play2Evolve achieves state-of-the-art performance among the evaluated methods, scoring 60.05 on GameCraft-Bench compared with 50.81 after Game Initialization and 52.46 for Play2Code. Human overall-quality ratings reach 3.67, compared with 2.38 and 2.43, respectively. Our code will be released at https://github.com/showlab/Play2Evolve.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e编码智能体可以根据自然语言描述生成可运行的游戏。然而，可运行的游戏并不能保证为玩家提供出色的游戏体验。在我们看来，一个具有趣味性的游戏应该提供：1）可靠的核心功能，2）吸引人的视觉设计和资产，以及3）支持探索和进阶的丰富游戏玩法。智能体如何改善这些趣味性方面仍未得到充分探索。在我们的工作中，我们提出了Play2Evolve，一个包含三个阶段的递归游戏开发框架：初始化、细化和进化。使用趣味性作为反馈，智能体对游戏进行测试并诊断其功能、视觉呈现和游戏玩法中的问题。它们的反馈指导错误修复和资产改进。它还有助于智能体提出新的游戏玩法和美学目标，以实现游戏的持续进化。为了丰富游戏材料，我们将视频生成模型与代码结合，创建吸引人的静态和动态资产，并将它们整合到交互式游戏玩法中。最后，Play2Evolve在评估方法中取得了最先进的性能，在GameCraft-Bench上得分60.05，而游戏初始化后得分为50.81，Play2Code得分为52.46。人类总体质量评分达到3.67，而对比方法分别为2.38和2.43。我们的代码将在 https://github.com/showlab/Play2Evolve 发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用智能体和趣味性反馈来改进自动生成的游戏的视觉、功能和玩法，实现递归的游戏开发。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Play2Evolve框架，包含初始化、细化和进化三个阶段，利用趣味性作为反馈进行游戏测试和问题诊断。2. 结合视频生成模型与代码，生成静态和动态资产以丰富游戏材料。3. 在GameCraft-Bench和人类评估中均取得最先进的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过智能体自我测试和反馈循环来迭代优化游戏，并结合了视频生成模型来增强资产。局限性方面，摘要未提供关于框架的具体计算开销、视频生成模型引入的延迟、除GameCraft-Bench外其他基准的评估结果，以及在更复杂游戏类型上的泛化能力局限。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机图形学 / 人工智能 / 游戏开发 / 智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e12. High-Fidelity Image Matting with Pixel-Space Diffusion Transformers（使用像素空间扩散Transformer进行高保真图像抠图）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34929\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34929\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDiffusion models have shown strong potential for image matting by transferring generative priors learned from large-scale pretraining. However, existing approaches largely rely on latent diffusion models, whose compressed representations and VAE-based reconstruction introduce a mismatch with the high-frequency precision required for matting. We present PixelMatte, a framework that adapts pretrained pixel-space diffusion transformers for high-fidelity image matting. We show that strong image-conditioned matting capabilities can be acquired even from a pure text-to-image model without paired image-to-image pretraining. Our approach reuses the backbone\u0026#x27;s native patch embedding to jointly process the input image, trimap, and noisy alpha matte as spatially aligned tokens, enabling direct pixel-space prediction without additional condition encoders or adapters. With pixel-accurate synthetic supervision and real-image fine-tuning, PixelMatte predicts alpha mattes in a single forward pass. Two lightweight calibration modules, LayerShift and High-Pass Refiner, further improve regional opacity accuracy and boundary fidelity. Experiments across four benchmarks and two distinct pixel diffusion backbones demonstrate substantial improvements over existing methods, reducing SAD and gradient errors by 24-44% relative to RenderMatte on P3M-500-NP and AM-2K, while achieving competitive performance on AIM-500 and RenderMatte-2K. These results demonstrate the effectiveness of pixel-space generative priors for precision-sensitive image matting. Project page: https://white-yc.github.io/pixelmatte/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩散模型通过转移从大规模预训练中学习到的生成先验，在图像抠图方面展现出了巨大的潜力。然而，现有方法在很大程度上依赖于潜在扩散模型，其压缩表示和基于VAE的重建与抠图所需的高频精度不匹配。我们提出了PixelMatte，一个调整预训练像素空间扩散Transformer以进行高保真图像抠图的框架。我们表明，即使是从纯文本到图像模型中，无需配对的图像到图像预训练，也能获得强大的图像条件抠图能力。我们的方法重用主干网络的原生补丁嵌入，将输入图像、三元图（trimap）和带噪alpha蒙版作为空间对齐的令牌（tokens）进行联合处理，从而无需额外的条件编码器或适配器即可实现直接的像素空间预测。通过像素级精确的合成监督和真实图像微调，PixelMatte在单次前向传播中预测alpha蒙版。两个轻量级校准模块，LayerShift和High-Pass Refiner，进一步提高了区域不透明度精度和边界保真度。在四个基准测试和两个不同的像素扩散主干网络上的实验表明，与现有方法相比有了显著改进，在P3M-500-NP和AM-2K上相对于RenderMatte将SAD和梯度误差降低了24-44%，同时在AIM-500和RenderMatte-2K上取得了具有竞争力的性能。这些结果证明了像素空间生成先验对精度敏感的图像抠图的有效性。项目主页：https://white-yc.github.io/pixelmatte/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用像素空间扩散Transformer进行高保真图像抠图，解决潜在扩散模型在高频精度上的不足。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出PixelMatte框架，直接在像素空间使用预训练扩散Transformer，无需额外条件编码器。2. 证明纯文本到图像模型无需配对图像到图像预训练即可获得强大的图像条件抠图能力。3. 引入LayerShift和High-Pass Refiner两个轻量级校准模块提升区域和边界精度。4. 在多个基准上显著降低SAD和梯度误差（24-44%）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该方法通过像素空间预测和轻量级校准模块解决了潜在扩散模型的高频精度不匹配问题，且支持单次前向传播。局限性方面，摘要未提供模型的具体推理时间、显存消耗、在极端复杂背景或极细毛发等极端情况下的具体表现局限，也未提及合成监督数据的具体生成方式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 图像抠图 / 扩散模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e13. AIRIS: Benchmarking Social Embodied Intelligence in Egocentric Streaming Videos（AIRIS：在第一人称流视频中对社交具身智能进行基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34347\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34347\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEmbodied agents operating around people must not only recognize social cues, but also decide when the available evidence is sufficient, whether to intervene, and how to respond without violating social norms. Existing benchmarks typically evaluate these abilities in isolation or with access to completed videos, obscuring where an online social decision fails. We introduce AIRIS, a causal streaming benchmark that formulates social embodied intelligence as a time-anchored chain of Attention, Intention, Reaction, and Interaction (A-I-R-I). AIRIS contains 8,000 expert-curated questions grounded in 357 egocentric clips across 11 context categories and 36 capability dimensions. At each query, models receive only the observation prefix available at that time; decision-aware metrics reward calibrated waiting and complete reactions while penalizing premature commitment. Evaluating 45 proprietary and open-source general-purpose, embodied, streaming-video, and omni-modal models reveals fragmented and temporally miscalibrated competence. General-purpose VLMs excel at passive cue grounding and intent recognition, whereas embodied specialists lead on isolated reaction sub-decisions; yet across all families, models frequently guess intents before sufficient evidence emerges and fail to jointly align intervention timing, action domain, and concrete execution within the same episode. AIRIS thus provides a diagnostic foundation for bridging the gap between passive social perception and reliable embodied interaction.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在人类周围运行的具身智能体不仅必须识别社交线索，还必须决定可用证据何时充分、是否进行干预以及如何在不违反社交规范的情况下做出回应。现有的基准测试通常单独评估这些能力，或者在可以访问完整视频的情况下进行评估，从而掩盖了在线社交决策在何处失败。我们引入了AIRIS，一个因果流式基准测试，将社交具身智能构建为以时间为锚点的注意力、意图、反应和交互（A-I-R-I）链。AIRIS包含8,000个由专家策划的问题，基于11个上下文类别和36个能力维度中的357个第一人称视频片段。在每次查询时，模型仅接收当时可用的观察前缀；决策感知指标奖励校准的等待和完整的反应，同时惩罚过早的承诺。对45个专有和开源的通用、具身、流视频和多模态模型的评估揭示了碎片化和时间上未校准的能力。通用VLM在被动线索定位和意图识别方面表现出色，而具身专家在孤立的反应子决策中处于领先地位；然而在所有模型家族中，模型经常在充分证据出现之前猜测意图，并且未能在同一集中联合对齐干预时机、动作领域和具体执行。因此，AIRIS为弥合被动社交感知与可靠具身交互之间的差距提供了诊断基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e构建一个名为AIRIS的因果流式基准测试，用于评估具身智能体在第一人称流视频中的社交决策能力（包括注意力、意图、反应和交互）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出AIRIS基准，将社交具身智能建模为时间锚定的A-I-R-I链，支持流式（仅观察前缀）评估。2. 包含8,000个专家策划的问题，涵盖357个第一人称视频片段、11个上下文类别和36个能力维度。3. 引入决策感知指标，奖励校准等待，惩罚过早承诺。4. 评估了45个模型，揭示了当前模型在时间校准和联合对齐干预时机、动作与执行方面的碎片化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该基准填补了在线社交决策评估的空白，并揭示了现有模型在证据不足时过早猜测意图以及无法联合对齐干预时机和执行的局限。局限性方面，摘要未提供具体表现最好的模型名称及其具体得分、视频片段的平均长度、或该基准在真实物理机器人部署中的验证情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 具身智能 / 多模态学习 / 基准测试\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e14. FoundSurface: Feedforward Ray-Based 3D Scene Surface Reconstruction from Unposed Images（FoundSurface：从无位姿图像进行前馈基于射线的3D场景表面重建）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34128\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34128\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAccurate 3D surface reconstruction from unposed images remains a fundamental challenge in computer vision. Recent feed-forward pointmap methods eliminate the need for camera poses but inherently produce discrete, sparse representations. In this paper, we present a generalizable pipeline that directly recovers continuous, high-fidelity 3D surfaces from unposed images by seamlessly integrating pointmap- and ray-based representations. Our approach first extracts explicit geometric priors using a pre-trained pointmap model. A query-view-centric selection module then identifies geometrically relevant reference views via a robust surfel voting mechanism. Next, a cross-attention regressor bridges target query rays with reference features to estimate a continuous coarse surface. Lastly, a raylet-based module aggregates local 3D features to carve out high-frequency details and analytical normals. Trained as a single foundation model on 9 diverse datasets, our method demonstrates exceptional zero-shot generalization on 6 unseen datasets, clearly surpassing state-of-the-art baselines in geometric accuracy and detail preservation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从无位姿图像进行准确的3D表面重建仍然是计算机视觉中的一个基本挑战。最近的前馈点图（pointmap）方法消除了对相机位姿的需求，但本质上产生离散的、稀疏的表示。在本文中，我们提出了一种可泛化的流程，通过无缝集成基于点图和基于射线的表示，直接从无位姿图像中恢复连续、高保真的3D表面。我们的方法首先使用预训练的点图模型提取显式几何先验。然后，以查询视图为中心的选择模块通过鲁棒的表面元（surfel）投票机制识别几何相关的参考视图。接下来，交叉注意力回归器将目标查询射线与参考特征桥接，以估计连续的粗糙表面。最后，基于射线束（raylet）的模块聚合局部3D特征以雕刻出高频细节和分析法线。作为单一基础模型在9个不同的数据集上进行训练，我们的方法在6个未见数据集上展示了卓越的零样本泛化能力，在几何精度和细节保留方面明显超越最先进的基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e从无位姿图像中直接恢复连续、高保真的3D表面，结合点图和基于射线的表示。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出FoundSurface流程，无缝集成点图和射线表示，实现从无位姿图像到连续高保真3D表面的直接恢复。2. 设计了以查询视图为中心的选择模块和交叉注意力回归器来估计粗糙表面。3. 引入基于raylet的模块聚合局部3D特征以提取高频细节和分析法线。4. 作为单一基础模型在9个数据集上训练，在6个未见数据集上展现出卓越的零样本泛化能力，超越最先进基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过结合点图的显式几何先验和射线表示的连续性，解决了前馈点图方法产生离散稀疏表示的问题，并实现了强大的零样本泛化。局限性方面，摘要未提供具体的推理时间、显存占用、在极端弱纹理或高反射表面等困难场景下的重建失败率，也未提及训练所使用的9个数据集的具体名称和规模。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 3D重建 / 基础模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e15. Agentic LongLive: Asynchronous Agentic Memory for Long Video Generation（Agentic LongLive：用于长视频生成的异步智能体记忆）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 17 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34907\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34907\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReal-time autoregressive video generators stream minutes of video and accept new prompts on the fly, but struggle to keep people, objects, and places consistent over a long interactive story. Agent systems provide such memory for offline multi-shot generation, yet they read the whole script in advance, plan each shot before generating it, and regenerate failed shots, which a live stream does not allow. We present Agentic LongLive, an asynchronous agentic memory for long video generation. A memory agent on separate GPUs reads only the prompts revealed so far, never the generated video, and keeps a text state and evolving images for every person, object, and scene. From this entity memory it composes a global image and a per-shot memory image, which an auxiliary GPU prefills into the generator\u0026#x27;s attention sink before the next shot starts, and writes entity cards for the prompts that name them, so the video never waits for memory and video errors are not written back. A small language model, trained with reinforcement learning and an image reward calibrated using downstream video outcomes, decides what to remember before the next prompt is known. On LongStory-Online, a new benchmark of 25 stories (857 shots) revealed one shot at a time, Agentic LongLive improves persistent-state accuracy of LongLive-2.0, its base generator, by 26.3 points, protagonist identity by 44.9, and revisited-place consistency by 40.4, at about 1% extra generation time on H100. The full system streams faster than real time on one 8xB200 node with the generator in BF16 (34.3 FPS), keeps image quality stable over 14-minute stories, and improves identity on two MiniMax-H3 generators, one of which, LongLive-H3, also runs in real time with it. To our knowledge, it is the first real-time video generator with text and image memory kept by an LLM agent.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e实时自回归视频生成器可以流式传输数分钟的视频并即时接受新提示，但在长篇互动故事中难以保持人物、物体和地点的一致性。智能体系统为离线多镜头生成提供了这种记忆，但它们会提前阅读整个脚本，在生成每个镜头前进行规划，并重新生成失败的镜头，而实时流不允许这样做。我们提出了Agentic LongLive，一种用于长视频生成的异步智能体记忆。位于独立GPU上的记忆智能体仅读取到目前为止揭示的提示，从不读取生成的视频，并为每个人物、物体和场景保留文本状态和不断演变的图像。从这个实体记忆中，它合成一个全局图像和每个镜头的记忆图像，辅助GPU在下一个镜头开始前将其预填充到生成器的注意力池（attention sink）中，并为命名它们的提示编写实体卡，因此视频永远不会等待记忆，且视频错误不会被写回。一个小型语言模型通过强化学习训练，并使用下游视频结果校准的图像奖励，在知道下一个提示之前决定要记住什么。在LongStory-Online（一个包含25个故事（857个镜头）的新基准，每次揭示一个镜头）上，Agentic LongLive将其基础生成器LongLive-2.0的持久状态准确率提高了26.3分，主角身份提高了44.9分，重访地点一致性提高了40.4分，而在H100上仅增加约1%的生成时间。完整系统在配备BF16生成器（34.3 FPS）的单个8xB200节点上的流式传输速度高于实时，在14分钟的故事中保持图像质量稳定，并提高了两个MiniMax-H3生成器的身份一致性，其中一个（LongLive-H3）也与其一起实时运行。据我们所知，这是第一个由LLM智能体保持文本和图像记忆的实时视频生成器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e为实时长视频生成设计一种异步智能体记忆系统，以在长篇互动故事中保持人物、物体和场景的一致性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Agentic LongLive，使用独立的记忆智能体异步维护实体的文本状态和图像记忆，不阻塞视频生成流。2. 记忆智能体使用小型语言模型，通过强化学习和图像奖励训练，在未知下一提示时决定记忆内容。3. 在LongStory-Online基准上，显著提升基础生成器的持久状态准确率（+26.3）、主角身份（+44.9）和重访地点一致性（+40.4），且仅增加约1%生成时间。4. 在8xB200节点上实现高于实时的流式传输（34.3 FPS），是首个由LLM智能体保持文本和图像记忆的实时视频生成器。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法通过异步架构和实体记忆有效解决了实时视频生成中的长期一致性问题，且对生成速度影响极小。局限性方面，摘要未提供记忆智能体本身的显存消耗、在超过14分钟或更复杂剧情下的性能衰减情况、实体卡片数量上限，以及该小型语言模型的具体参数量和训练数据细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 视频生成 / 智能体系统 / 多模态大模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e16. Let Vision-Language Models Generate Images through Their Representations（让视觉-语言模型通过其表示生成图像）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 16 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31237\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31237\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent unified multimodal models aim to combine visual understanding and generation within a single model, yet effectively integrating the two capabilities remains challenging. Leveraging pretrained vision-language models offers a way to build on already learned multimodal knowledge, but making this knowledge effectively accessible to visual generation remains nontrivial. We find that a central challenge lies in the heterogeneous visual representations used for understanding and generation. To address this challenge, we introduce Integral, which converts a pretrained vision-language model into a unified multimodal model by constructing a shared visual representation space across the two capabilities. Integral implements this design through two complementary components. Abstraction Fusion constructs shared visual tokens by aggregating hierarchical representations from the frozen vision encoder, while Block-wise MoT introduces a lightweight generative stream that interacts with the vision-language model only at block boundaries. Our approach effectively preserves the pretrained understanding capability while extending it to strong visual generation. Controlled comparisons further demonstrate that sharing visual representations between understanding and generation substantially improves generative learning compared with using a separate visual representation space, despite comparable reconstruction fidelity. These results suggest that representations learned by pretrained vision-language models already provide an effective foundation for visual generation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近的统一多模态模型旨在将视觉理解和生成结合在单个模型中，但有效地整合这两种能力仍然具有挑战性。利用预训练的视觉-语言模型提供了一种建立在已学习多模态知识基础上的方法，但使这些知识有效地可用于视觉生成仍然非平凡。我们发现，一个核心挑战在于用于理解和生成的异构视觉表示。为了解决这一挑战，我们引入了 Integral，它通过在两种能力之间构建共享的视觉表示空间，将预训练的视觉-语言模型转换为统一的多模态模型。Integral 通过两个互补的组件实现了这一设计。抽象融合（Abstraction Fusion）通过聚合来自冻结视觉编码器的层次化表示来构建共享视觉 token，而逐块 MoT（Block-wise MoT）引入了一个轻量级的生成流，该流仅在块边界处与视觉-语言模型交互。我们的方法有效地保留了预训练的理解能力，同时将其扩展到强大的视觉生成。受控比较进一步证明，与使用单独的视觉表示空间相比，在理解和生成之间共享视觉表示可大幅提高生成学习，尽管具有相当的重建保真度。这些结果表明，预训练视觉-语言模型学习的表示已经为视觉生成提供了有效的基础。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e将预训练的视觉-语言模型转换为统一的多模态模型，以结合视觉理解和生成能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Integral 模型，通过构建共享视觉表示空间整合理解与生成；包含抽象融合（聚合层次化表示构建共享视觉 token）和逐块 MoT（在块边界交互的轻量级生成流）两个组件；证明共享视觉表示能大幅提升生成学习效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效保留了预训练理解能力并扩展了视觉生成，且共享表示优于独立表示空间。局限性：摘要未提供具体的评估数据集、定量指标以及与其他最先进多模态生成模型的详细对比数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态学习与计算机视觉\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e17. Target-Part Preference Optimization for Part-Aware 3D Generation（用于部件感知3D生成的目标部件偏好优化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 15 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30472\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30472\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003ePart-aware 3D generation requires not only globally plausible objects but also complete, well-separated semantic parts, yet high-quality part decompositions remain too scarce to support large-scale supervised fine-tuning. We study whether preference fine-tuning based on Direct Preference Optimization (DPO) can adapt a pretrained part-aware generator from limited part-annotated data without architectural changes. We rank candidates generated with different random seeds against ground-truth (GT) geometric metrics, and select the (object, target-part) examples with the largest across-seed quality gap. Each selected example stores a seed pair whose two flow trajectories share one clean GT compositional latent and differ only in Gaussian noise. We derive a reference-relative target-block preference loss from FlowDPO that compares the two trajectories against a frozen reference model. GT flow-matching losses on the target block and complete part set provide absolute supervision, while only the diffusion transformer (DiT) is updated. Human-ranked controls test an alternative ordering source, and synthetic cropping provides controlled loser targets that are incomplete by construction. Among the three training-set scales, the medium-scale setting gives the strongest result on held-out Objaverse and outperforms both the pretrained generator and the reported direct supervised fine-tuning baseline on the multi-part aggregate. Further analysis shows sensitivity to pair ordering, target-part coverage, and the balance between pairwise and GT supervision. Cross-dataset experiments show less consistent gains under distribution shift.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e部件感知的3D生成不仅需要全局合理的对象，还需要完整、分离良好的语义部件，但高质量的部件分解仍然太少，无法支持大规模监督微调。我们研究了基于直接偏好优化（DPO）的偏好微调是否可以在没有架构更改的情况下，从有限的部件注释数据中调整预训练的部件感知生成器。我们根据真实（GT）几何指标对使用不同随机种子生成的候选者进行排名，并选择具有最大跨种子质量差距的（对象，目标部件）示例。每个选定的示例存储一个种子对，其两个流轨迹共享一个干净的GT组合潜在变量，并且仅在高斯噪声上有所不同。我们从 FlowDPO 中推导出一个参考相对目标块偏好损失，将这两个轨迹与冻结的参考模型进行比较。目标块和完整部件集上的GT流匹配损失提供了绝对监督，同时只更新扩散 Transformer（DiT）。人工排名的控制测试了替代排序源，合成裁剪提供了通过构造不完整的受控失败者目标。在三种训练集规模中，中等规模设置在保留的 Objaverse 上给出了最强的结果，并在多部件聚合上优于预训练生成器和报告的直接监督微调基线。进一步分析显示了对配对排序、目标部件覆盖率以及成对和GT监督之间平衡的敏感性。跨数据集实验显示在分布偏移下增益不太一致。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e利用基于直接偏好优化（DPO）的偏好微调，在有限部件注释数据上调整预训练的部件感知3D生成器，以生成具有完整且分离良好的语义部件的3D对象。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出目标块偏好损失（基于 FlowDPO），利用不同随机种子生成的轨迹质量差距构建偏好对；仅更新扩散 Transformer（DiT），结合GT流匹配损失提供绝对监督；在中等规模训练集下，于 Objaverse 数据集的多部件聚合指标上超越预训练模型和直接监督微调基线。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法在中等规模数据下效果最好，且对配对排序、目标部件覆盖率及监督平衡敏感。局限性：跨数据集实验在分布偏移下增益不一致；摘要未提供具体的几何指标数值、模型参数量及推理效率等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e3D视觉与生成模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e18. Beyond Self-Consistency: Recursive Self-Improvement at Test Time（超越自洽性：测试时的递归自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30965\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30965\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eLarge language models (LLMs) that continue improving after deployment (e.g., recursive self-improvement) offer a promising path toward general intelligence. Current test-time methods pursue this goal on unlabeled questions, primarily relying on self-consistency: they generate independent solutions and use majority voting to select an answer or construct training targets. This leaves earlier reasoning unused at inference and can reinforce an incorrect majority during training. Humans instead build on earlier attempts to preserve useful reasoning, correct mistakes and improve their problem-solving strategies. Following this principle, we propose Test-Time Recursive Self-Improvement (TT-RSI), a label-free framework for improving LLMs at test time through two mutually reinforcing components: (1) In-Context RSI repeatedly re-solves each question using the full previous solution as a reference, letting the model decide whether and how to use it so that inference compute builds on earlier reasoning. (2) In-Weight RSI distills successive refinements into the model\u0026#x27;s weights, enabling progress beyond an initially wrong majority and theoretically bringing the first attempt toward the model\u0026#x27;s infinite-step refinement limit. The updated model answers better and refines more effectively, generating stronger references for subsequent training. Extensive experiments show that TT-RSI improves average accuracy by +13.89% over the base model and outperforms the strongest self-consistency-based method by +4.79% under the same test-time scaling budget.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在部署后持续改进的大型语言模型（LLM）（例如，递归自我改进）为通向通用智能提供了一条有希望的途径。当前的测试时方法在无标签问题上追求这一目标，主要依赖于自洽性：它们生成独立的解决方案并使用多数投票来选择答案或构建训练目标。这使得早期的推理在推理时未被使用，并且可能在训练期间强化错误的多数。人类反而建立在早期尝试的基础上，以保留有用的推理，纠正错误并改进他们的问题解决策略。遵循这一原则，我们提出了测试时递归自我改进（TT-RSI），这是一个无标签框架，通过两个相互加强的组件在测试时改进 LLM：（1）上下文 RSI 使用完整的先前解决方案作为参考重复重新解决每个问题，让模型决定是否以及如何使用它，以便推理计算建立在早期推理之上。（2）权重 RSI 将连续的改进提炼到模型的权重中，从而取得超越初始错误多数的进展，并在理论上将第一次尝试引向模型的无限步改进极限。更新后的模型回答得更好，改进得更有效，为后续训练生成更强的参考。大量实验表明，在相同的测试时扩展预算下，TT-RSI 将基础模型的平均准确率提高了 +13.89%，并比最强的基于自洽性的方法高出 +4.79%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e提出一种无标签的测试时递归自我改进（TT-RSI）框架，通过在测试时迭代改进大型语言模型（LLM）的推理能力，超越传统的自洽性方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 TT-RSI 框架，包含上下文 RSI（利用先前完整解作为参考进行迭代推理）和权重 RSI（将连续改进蒸馏到模型权重中）；在相同测试时计算预算下，平均准确率比基础模型提升 +13.89%，比最强自洽性方法提升 +4.79%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效利用了早期推理并克服了错误多数的强化问题，显著提升了准确率。局限性：摘要未提供所使用的具体数据集名称、模型规模、以及在不同类型任务上的细粒度表现和局限性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理与大语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e19. What Is Redundant at High Resolution? Efficient Attention and Feed-Forward Design for All-in-One Image Restoration（高分辨率下什么是冗余的？用于全能图像恢复的高效注意力与前馈设计）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 14 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33636\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33636\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMulti-scale architectures are widely adopted in all-in-one image restoration (AIO-IR) to capture larger-scale context at low-resolution stages and refine details at high-resolution (HR) stages. However, processing spatially large feature maps at HR stages incurs substantial computational costs and memory traffic, making efficient HR processing challenging. To address this challenge, we propose High-resolution Global-Local Restoration (HiGLR), an efficient multi-scale AIO-IR network grounded in an analysis of spatial redundancy in self-attention and convolutional feed-forward networks (ConvFFNs). Specifically, this analysis identifies three key redundancies: per-query readout at the finest-scale stage, key routing across neighboring queries at intermediate stages, and spatial mixing in the expanded feature spaces of ConvFFNs. Accordingly, HiGLR replaces costly self-attention at the finest-scale stage with a learned input-independent kernel. At intermediate stages, we propose a Block-Routed Hybrid Attention, which combines coarse-scale dense attention with fine-scale block-sparse attention over value residuals relative to coarse summaries, and shares routing indices across neighboring queries. We further introduce a Dual-Space FFN that performs spatial mixing in a compact space and pointwise nonlinear transformation in an expanded space, enabling efficient kernel fusion. Combining these designs, HiGLR achieves state-of-the-art performance while delivering up to a 4.24times inference speedup over existing methods.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e多尺度架构被广泛采用于全能图像恢复（AIO-IR）中，以在低分辨率阶段捕获更大规模的上下文并在高分辨率（HR）阶段细化细节。然而，在 HR 阶段处理空间上大的特征图会产生大量的计算成本和内存流量，使得高效的 HR 处理具有挑战性。为了解决这一挑战，我们提出了高分辨率全局-局部恢复（HiGLR），这是一种高效的多尺度 AIO-IR 网络，其基础是对自注意力和卷积前馈网络（ConvFFNs）中空间冗余的分析。具体而言，该分析确定了三个关键冗余：最精细尺度阶段的每查询读取、中间阶段跨相邻查询的键路由，以及 ConvFFNs 扩展特征空间中的空间混合。因此，HiGLR 用学习的输入无关核替换了最精细尺度阶段昂贵的自注意力。在中间阶段，我们提出了块路由混合注意力，它结合了粗尺度密集注意力和相对于粗摘要的值残差上的细尺度块稀疏注意力，并在相邻查询之间共享路由索引。我们进一步引入了双空间 FFN，在紧凑空间中执行空间混合，在扩展空间中执行逐点非线性变换，从而实现高效的核融合。结合这些设计，HiGLR 实现了最先进的性能，同时与现有方法相比，推理速度提升了高达 4.24 倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e设计一种高效的多尺度全能图像恢复（AIO-IR）网络，以解决高分辨率阶段处理大特征图带来的高计算成本和内存流量问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 HiGLR 网络，通过分析自注意力和 ConvFFNs 的空间冗余进行优化；在最精细尺度使用输入无关核替代自注意力，中间尺度使用块路由混合注意力，并引入双空间 FFN 实现高效核融合；在达到最先进性能的同时，推理速度比现有方法提升高达 4.24 倍。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该设计有效降低了高分辨率下的计算和内存开销，并实现了显著的加速。局限性：摘要未提供具体的图像恢复任务类型、使用的评估数据集、具体的精度指标以及模型在不同分辨率下的具体显存占用数据。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与图像处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e20. Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures（超越成功路径：从模拟失败中泛化机器人世界模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33925\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33925\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobot world models are increasingly used to evaluate and plan policies, yet robot training data are dominated by successful demonstrations. Off the happy path, when a grasp is misaligned or mistimed and the object is pushed, tilted, or slips, their predictions break down. Across five pretrained action-conditioned models, object-motion error is at most 10.4% lower than that of a static baseline that copies the first frame, and two models are worse than this baseline. We present WorldReforge, which teaches world models what happens when manipulation goes wrong. We construct the Reforge dataset of 62k simulated trajectories by perturbing reference grasps in position, orientation, and closure timing, recording each resulting push, slip, or failed pickup with ground-truth object pose, contact, and surface points. WorldReforge turns this ground truth into two training signals without additional inference cost. Interaction Alignment focuses reconstruction on the small object and contact regions that a global loss underweights, and Surface Correspondence trains backbone features to follow the same physical surface points across frames. On Cosmos3 Nano, WorldReforge reduces object trajectory error by 28.2% overall and by 35.0% on unseen objects, and it lowers the error in predicting how two actions\u0026#x27; outcomes diverge by 43.3%. Although trained only in simulation, it also improves reconstruction on DROID and on real failure videos. Controlled data studies show that failed contact and successful holding teach complementary physics: failed contact teaches how objects respond, and holding teaches how a grasped state persists. Our code, data, and models are available at aim-uofa.github.io/WorldReforge/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人世界模型越来越多地用于评估和规划策略，但机器人训练数据主要由成功的演示主导。偏离成功路径时，当抓取未对齐或时机不对导致物体被推动、倾斜或滑落时，它们的预测就会崩溃。在五个预训练的动作条件模型中，物体运动误差最多比复制第一帧的静态基线低 10.4%，并且有两个模型比该基线更差。我们提出了 WorldReforge，它教导世界模型在操作出错时会发生什么。我们构建了包含 62k 个模拟轨迹的 Reforge 数据集，通过在位置、方向和闭合时间上扰动参考抓取来记录，记录每次导致的推动、滑动或拾取失败，并带有真实（GT）物体姿态、接触和表面点。WorldReforge 将这些真实值转化为两个训练信号，而无需额外的推理成本。交互对齐将重建集中在全球损失权重不足的小物体和接触区域，表面相关性训练主干特征以在帧之间跟随相同的物理表面点。在 Cosmos3 Nano 上，WorldReforge 将物体轨迹误差总体降低了 28.2%，在未见物体上降低了 35.0%，并将预测两个动作结果如何分化的误差降低了 43.3%。尽管仅在模拟中训练，它也改善了在 DROID 和真实失败视频上的重建。受控数据研究表明，失败的接触和成功的抓取教授了互补的物理知识：失败的接触教授物体如何响应，而抓取教授抓取状态如何持续。我们的代码、数据和模型可在 aim-uofa.github.io/WorldReforge/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e通过引入模拟失败轨迹，训练机器人世界模型以预测操作失败（如推动、滑动、拾取失败）时的物理动态，从而提高其在非成功路径下的泛化能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 WorldReforge 方法和包含 62k 个模拟轨迹的 Reforge 数据集；设计交互对齐和表面相关性两种无需额外推理成本的训练信号；在 Cosmos3 Nano 上，总体物体轨迹误差降低 28.2%，未见物体降低 35.0%，动作结果分化预测误差降低 43.3%；仅在模拟中训练即可提升真实失败视频和 DROID 数据集上的重建效果。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明该方法有效弥补了仅使用成功数据训练的缺陷，显著降低了失败情况下的预测误差，并证明了失败接触和成功抓取在物理学习上的互补性。局限性：摘要未提供在真实机器人硬件上的闭环控制结果、具体的推理延迟、以及在不同类型机器人或更复杂操作任务上的泛化表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学与具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e21. ROAM-Bench: Evaluating Embodied Active Spatial Intelligence through Evidence Verification（ROAM-Bench：通过证据验证评估具身主动空间智能）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 13 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33143\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33143\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEmbodied spatial intelligence requires agents to gather information through exploration and interaction, then use it to reason and act. Existing benchmarks insufficiently distinguish correct outcomes from completion of these task requirements. We introduce ROAM-Bench to evaluate these abilities under robot motion and collision constraints. Independent checks use simulation state and episode records to assess outcomes and task requirements, with stronger checks of geometry, coverage, or placement. It comprises 250 manually validated tasks across 11 types in five groups and 27 indoor environments, covering object and room search, counting, geometric judgments, direction reasoning, and relocation. Human evaluators achieve 84% strict task success on 100 sampled tasks, with every correct outcome satisfying the required checks. Across seven frontier vision-language models, we identify two complementary failure modes: correct outcomes with unmet task requirements, and incorrect outcomes despite passing stronger checks. Oracle-input diagnostics show that more complete target observations and calibrated feedback improve final spatial judgments.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具身空间智能要求智能体通过探索和交流收集信息，然后利用这些信息进行推理和行动。现有的基准测试不足以将正确的结果与这些任务要求的完成区分开来。我们引入了ROAM-Bench，以在机器人运动和碰撞约束下评估这些能力。独立检查使用模拟状态和回合记录来评估结果和任务要求，并对几何、覆盖范围或放置进行更严格的检查。它包含在五个组的11种类型和27个室内环境中手动验证的250个任务，涵盖物体和房间搜索、计数、几何判断、方向推理和重新定位。人类评估者在100个抽样任务中实现了84%的严格任务成功率，每个正确的结果都满足了所需的检查。在七个前沿视觉语言模型中，我们确定了两种互补的失败模式：结果正确但未满足任务要求，以及尽管通过了更严格的检查但结果不正确。神谕输入诊断表明，更完整的目标观察和校准反馈可以改善最终的空间判断。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估具身智能体在运动和碰撞约束下的主动空间智能（包括信息收集、推理和行动），并区分正确结果与任务要求的完成情况。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出了ROAM-Bench基准，包含250个手动验证任务、11种类型、27个室内环境；采用独立检查机制评估结果和任务要求；人类评估者达到84%的严格任务成功率；识别出视觉语言模型的两种互补失败模式。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该基准通过独立检查区分了结果正确性和任务要求完成度，并揭示了现有前沿视觉语言模型在空间任务中的两种失败模式。局限性方面，摘要未提供关于基准测试在真实物理机器人上的泛化能力、计算成本或更广泛的模型评估细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学 / 基准测试与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e22. SEEK: Self-Evolution through Execution Knowledge for Agentic Robot Manipulation（SEEK：通过执行知识实现智能机器人操作的自我进化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 11 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33915\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33915\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGeneral-purpose multimodal foundation models enable robots to adapt during deployment from observations and execution feedback, without task-specific demonstrations or training. However, the robot retains what it learns only in the model\u0026#x27;s working context. Once the task ends, it loses this execution knowledge, such as how to carry a bowl between two grippers. On the next attempt at the task, the robot may take just as long and repeat the same mistakes. To avoid this repetition, robots must retain execution knowledge across attempts. Yet replaying past actions is insufficient, because their effects depend on the current conditions. Procedures that determine actions from the current scene address this, but when they meet conditions that earlier attempts did not cover, revising them requires the measured effects of earlier actions. We therefore propose SEEK, an agentic framework that retains both, enabling robots to improve across attempts while keeping the underlying model fixed. To adapt retained knowledge to the current scene, SEEK adopts a Self-Evolving Programmatic Policy (SEPP) that encodes manipulation as executable procedures and determines each action from current observations. As the robot executes these procedures, SEEK records the measured effects of its actions, including those from failed attempts, in a Persistent Action-Effect Bank (PAEB). Where a retained procedure applies, it acts without a model request; where it meets a condition it does not cover, this evidence guides its revision. On RoboDojo, knowledge retained over ten attempts raises SEEK\u0026#x27;s average task score from 27.0 to 54.4 and its success rate from 19.7% to 48.0% across all 42 tasks. On 34 of these tasks with GPT-6.2 Astra, SEEK reaches 80.1 after five attempts, against 49.6 for the same model acting directly, and uses 77.6% fewer model requests. https://zeyangguan.github.io/SEEK-Agentic-Robot-Manipulation/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e通用多模态基础模型使机器人能够在部署期间根据观察和执行反馈进行适应，而无需特定任务的演示或训练。然而，机器人仅在其模型的工作上下文中保留其学习到的内容。一旦任务结束，它就会丢失这些执行知识，例如如何在两个夹爪之间搬运碗。在下一次尝试该任务时，机器人可能会花费同样长的时间并重复相同的错误。为了避免这种重复，机器人必须在多次尝试中保留执行知识。然而，重放过去的动作是不够的，因为它们的效果取决于当前条件。从当前场景确定动作的程序解决了这个问题，但是当它们遇到早期尝试未涵盖的条件时，修改它们需要早期动作的测量效果。因此，我们提出了SEEK，一个保留这两者的智能体框架，使机器人能够在保持底层模型固定的情况下跨尝试进行改进。为了使保留的知识适应当前场景，SEEK采用了一种自我进化程序策略（SEPP），将操作编码为可执行程序并根据当前观察确定每个动作。随着机器人执行这些程序，SEEK将其动作的测量效果（包括失败尝试的效果）记录在持久动作效果库（PAEB）中。在保留的程序适用的地方，它无需模型请求即可执行动作；在遇到其未涵盖的条件的地方，这些证据指导其修改。在RoboDojo上，十次尝试中保留的知识将SEEK在所有42个任务中的平均任务得分从27.0提高到54.4，成功率从19.7%提高到48.0%。在使用GPT-6.2 Astra的34个任务中，SEEK在五次尝试后达到80.1，而相同模型直接执行得分为49.6，并且减少了77.6%的模型请求。https://zeyangguan.github.io/SEEK-Agentic-Robot-Manipulation/\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决机器人在多次任务尝试中丢失执行知识的问题，通过在尝试间保留执行知识（程序和动作效果）来实现机器人操作的自我进化与改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SEEK智能体框架，包含自我进化程序策略（SEPP）和持久动作效果库（PAEB）；在保持底层模型固定的情况下实现跨尝试改进；在RoboDojo上，10次尝试后平均得分从27.0提升至54.4，成功率从19.7%提升至48.0%；使用GPT-6.2 Astra时，5次尝试后得分达80.1，减少77.6%的模型请求。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明SEEK通过结合可执行程序和动作效果记录，有效解决了机器人重复犯错的问题，并在RoboDojo环境中显著提升了任务得分和成功率，同时大幅减少了模型请求。局限性方面，摘要未提供在更多样化或真实物理环境中的泛化能力评估、不同基础模型下的表现差异，以及PAEB长期积累的存储和检索效率等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学 / 机器人操作与学习\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e23. Beyond Code and Pixels: Co-Generating Editable and Visually Rich Presentations（超越代码与像素：协同生成可编辑且视觉丰富的演示文稿）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 10 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28010\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28010\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerating PPTX presentations is a structured task that requires semantic planning, visual composition, precise layout, and editability, motivating collaboration among specialized agents. However, programmatic methods offer editability but often produce rigid designs, while image-based methods provide visual richness but flatten content into difficult-to-edit pixels. A hybrid system can combine these strengths, but must coordinate interdependent decisions across content, layout, and appearance. To address this challenge, we propose SlidesWeaver, a hybrid multi-agent system that coordinates language and v
