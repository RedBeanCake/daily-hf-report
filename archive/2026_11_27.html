ision agents through shared deck- and slide-level states. Specifically, it uses staged multimodal commitment, diffusion-based composition planning, and two generation schedules for different priorities between composition freedom and accurate text preservation, while preserving native text and geometry. Across 1,728 generations spanning 24 system-model configurations, SlidesWeaver achieves consistently superior overall quality across all evaluated dimensions while maintaining structural control, editability, and practical generation efficiency.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e生成PPTX演示文稿是一项结构化任务，需要语义规划、视觉构图、精确布局和可编辑性，这促使了专业智能体之间的协作。然而，基于编程的方法提供了可编辑性，但通常产生僵化的设计，而基于图像的方法提供了视觉丰富性，但将内容扁平化为难以编辑的像素。混合系统可以结合这些优势，但必须协调内容、布局和外观之间相互依赖的决策。为了应对这一挑战，我们提出了SlidesWeaver，一个混合多智能体系统，通过共享的文档级和幻灯片级状态来协调语言和视觉智能体。具体而言，它使用分阶段的多模态承诺、基于扩散的构图规划，以及针对构图自由度和准确文本保留之间不同优先级的两种生成计划，同时保留原生文本和几何形状。在跨越24种系统-模型配置的1,728次生成中，SlidesWeaver在所有评估维度上均取得了一致优越的整体质量，同时保持了结构控制、可编辑性和实际的生成效率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决生成PPTX演示文稿时，基于编程的方法设计僵化与基于图像的方法难以编辑之间的矛盾，实现语义规划、视觉构图、精确布局和可编辑性的协同生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出SlidesWeaver混合多智能体系统，通过共享状态协调语言和视觉智能体；采用分阶段多模态承诺、基于扩散的构图规划及两种生成计划；在24种配置的1728次生成中，在所有评估维度上实现优越质量，并保持结构控制、可编辑性和生成效率。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出SlidesWeaver通过混合多智能体协作和基于扩散的规划，成功结合了代码方法的可编辑性和图像方法的视觉丰富性，在大量生成实验中保持了高质量和结构控制。局限性方面，摘要未提供关于生成特定复杂图表的能力、用户主观满意度评估、生成所需的具体时间开销，以及在非标准模板或极端内容下的表现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与多模态 / 文档生成与多智能体系统\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e24. iMFPO: Improving Mean Flow Policy Optimization with Drift-Aware Velocity Alignment for Embodied Control（iMFPO：通过漂移感知速度对齐改进具身控制的平均流策略优化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33922\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33922\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFlow-based generative policies offer expressive action modeling for embodied control, yet achieving efficient one-step generation under reward-driven policy optimization remains challenging. In particular, evolving action distributions during online reinforcement learning may introduce inconsistencies between instantaneous-velocity learning and interval-averaged action generation. To address this challenge, we propose iMFPO, a one-step generative policy optimization framework with decoupled velocity learning and drift-aware velocity alignment. A shared interval-conditioned actor supports instantaneous-velocity supervision and interval-averaged action generation. JVP-corrected velocity regression is jointly optimized with reward-driven policy objectives, with action-level guidance from a frozen PPO teacher during training. At inference, iMFPO directly generates actions through interval-averaged velocity prediction, achieving one-step control without iterative flow integration. Across Go2, G1, H1, and Spot, zero-latent evaluation yields mean returns of 35.69, 34.44, 416.23, and 29.86. On Go2, action-generation latency drops from 15.57 ms to 0.41 ms relative to 64-step RFPO. Code: https://github.com/AIGeeksGroup/iMFPO. Website: https://aigeeksgroup.github.io/iMFPO.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于流的生成策略为具身控制提供了富有表现力的动作建模，但在奖励驱动的策略优化下实现高效的单步生成仍然具有挑战性。特别是，在线强化学习过程中不断演变的动作分布可能会引入瞬时速度学习与区间平均动作生成之间的不一致。为了应对这一挑战，我们提出了iMFPO，一个具有解耦速度学习和漂移感知速度对齐的单步生成策略优化框架。共享的区间条件演员网络支持瞬时速度监督和区间平均动作生成。JVP校正的速度回归与奖励驱动的策略目标联合优化，并在训练期间接受来自冻结PPO教师的动作级指导。在推理时，iMFPO通过区间平均速度预测直接生成动作，无需迭代流积分即可实现单步控制。在Go2、G1、H1和Spot上，零延迟评估的平均回报分别为35.69、34.44、416.23和29.86。在Go2上，相对于64步RFPO，动作生成延迟从15.57毫秒降至0.41毫秒。代码：https://github.com/AIGeeksGroup/iMFPO。网站：https://aigeeksgroup.github.io/iMFPO。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决基于流的生成策略在奖励驱动的在线强化学习中，瞬时速度学习与区间平均动作生成之间的不一致问题，实现高效的单步动作生成。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出iMFPO单步生成策略优化框架，采用解耦速度学习和漂移感知速度对齐；使用共享区间条件演员网络和JVP校正速度回归；在Go2等四个机器人平台上实现单步控制；Go2上的动作生成延迟从15.57 ms降至0.41 ms。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明iMFPO通过解耦速度学习和漂移感知对齐，有效解决了流策略在强化学习中的不一致问题，实现了无迭代流积分的单步控制，并大幅降低了动作生成延迟。局限性方面，摘要未提供在更复杂或长视野任务中的表现、与其他单步生成基线的详细对比、零延迟评估的具体设置细节，以及在不同地形或干扰下的鲁棒性分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习与机器人控制 / 生成式策略与流模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e25. RoboEvo^2: Recursive Robot Self-Improvement via Harness-Policy Co-Evolution（RoboEvo^2：通过Harness-策略协同进化实现递归机器人自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 9 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34675\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34675\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRobots should adapt to unfamiliar environments and acquire new skills through interaction, then execute those skills efficiently with practice. Vision-language-action policies provide efficient control, but often need additional human demonstrations to handle unfamiliar settings; reasoning agents can discover solutions using broad prior knowledge and robot-control APIs, but repeated deliberation and repair are costly. Inspired by human learning through reasoning and practice, we propose RoboEvo^2, a framework for recursive harness-policy co-evolution. In Policy-to-Harness (P2H) evolution, policy failures guide a coding agent to search complementary Code, Code+ICL, and Code+Policy routes, consolidating verified solutions into reusable skills, routing strategies, and experience memory. In Harness-to-Policy (H2P) evolution, verified trajectories provide supervised training, while Counterfactual Preference Distillation (CPD) teaches the policy to favor successful corrections over failures from the same starting state. The improved policy provides stronger motor skills for subsequent search, while its remaining failures redirect harness evolution, closing the reciprocal loop. Through recursive co-evolution without additional human demonstrations, RoboEvo^2 improves standalone success from 11.0% to 84.1% and hybrid success from 30.4% to 90.5% on LIBERO-PRO, with similar gains and reduced agentic costs on RoboTwin C2R. Further experiments demonstrate autonomous task acquisition, cross-embodiment harness transfer, and 95.0% hybrid success on the Unitree G1-D. Our models and code will be publicly released.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e机器人应该适应不熟悉的环境并通过交互获取新技能，然后通过练习高效地执行这些技能。视觉-语言-动作策略提供了高效控制，但通常需要额外的人类演示来处理不熟悉的设置；推理智能体可以利用广泛的先验知识和机器人控制API发现解决方案，但重复的思考和修复成本高昂。受人类通过推理和实践学习的启发，我们提出了RoboEvo^2，一个用于递归Harness-策略协同进化的框架。在策略到Harness（P2H）进化中，策略失败指导编码智能体搜索互补的代码、代码+ICL和代码+策略路线，将经过验证的解决方案整合为可重用技能、路由策略和经验记忆。在Harness到策略（H2P）进化中，经过验证的轨迹提供监督训练，而反事实偏好蒸馏（CPD）教导策略偏好成功修正而不是来自相同起始状态的失败。改进后的策略为后续搜索提供更强的运动技能，而其剩余的失败则重定向Harness进化，从而闭合互惠循环。通过无需额外人类演示的递归协同进化，RoboEvo^2在LIBERO-PRO上将独立成功率从11.0%提高到84.1%，混合成功率从30.4%提高到90.5%，在RoboTwin C2R上取得了类似的收益并降低了智能体成本。进一步的实验证明了自主任务获取、跨具身Harness迁移，以及在Unitree G1-D上达到95.0%的混合成功率。我们的模型和代码将公开发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决机器人在不熟悉环境中需要额外人类演示或推理成本高昂的问题，通过策略与Harness（代码/推理工具）的递归协同进化，实现无需额外人类演示的自主技能获取与自我改进。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出RoboEvo^2框架，实现策略到Harness（P2H）和Harness到策略（H2P）的递归协同进化；引入反事实偏好蒸馏（CPD）优化策略；在LIBERO-PRO上独立成功率从11.0%提升至84.1%，混合成功率从30.4%提升至90.5%；在Unitree G1-D上实现95.0%的混合成功率及跨具身迁移。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出RoboEvo^2通过结合推理智能体的先验知识和策略的执行反馈，形成了闭环的自我改进机制，在多个基准和真实机器人上显著提升了成功率并降低了智能体成本。局限性方面，摘要未提供关于协同进化过程的收敛速度、计算资源消耗、在完全未知且无先验知识任务上的表现，以及长期进化中可能出现的灾难性遗忘或经验库膨胀等细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e具身智能与机器人学 / 机器人学习与自我进化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e26. Loupe: Reinforcing Knowledge-Intensive Video Generation Agents（Loupe：强化知识密集型视频生成代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 8 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.31895\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.31895\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eKnowledge-intensive video generation remains challenging because prompts often omit the facts, appearances, and temporal relationships required for accurate generation. While search-based workflows can retrieve missing evidence, manually designed strategies limit adaptive planning, and conventional training suffers from costly video-level feedback and coarse trajectory-level credit assignment. In this paper, we present Loupe, a video generation agent that retrieves and verifies textual and visual evidence to construct evidence-grounded temporal video prompts with reference images. We further introduce Rubric-Based Credit (RBC), which leverages prompt-specific factual, visual, and temporal requirements to evaluate intermediate search and planning decisions before video rendering. Building on RBC, RBC-SFT reweights assistant-token learning by step quality, while RBC-GRPO incorporates step-level credits alongside a final planning reward, without rendering videos during RL. To address the lack of dedicated search-oriented evaluation, we construct Search-VBench, which contains 150 held-out prompts across seven categories. Experiments show that Loupe improves all four evaluation dimensions across three video generators, raising the overall score of MiniMax-H3 from 32.80 to 70.67 and outperforming an untrained search workflow. Ablation experiments show that full RBC training outperforms standard SFT followed by trajectory-level GRPO by 5.27 points. Human evaluations and results on Sci-VBench and KIVI-Bench further demonstrate improved generation quality, scientific grounding, factual precision, and helpfulness. Our project page is available at https://zengkaiya.github.io/Loupe/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e知识密集型视频生成仍然具有挑战性，因为提示通常省略了准确生成所需的事实、外观和时间关系。虽然基于搜索的工作流可以检索缺失的证据，但手动设计的策略限制了自适应规划，并且传统训练受到昂贵的视频级反馈和粗糙的轨迹级信用分配的困扰。在本文中，我们提出了 Loupe，这是一个视频生成代理，它检索并验证文本和视觉证据，以构建带有参考图像的基于证据的时间视频提示。我们进一步引入了基于规则的信用（Rubric-Based Credit, RBC），它利用特定于提示的事实、视觉和时间要求，在视频渲染之前评估中间搜索和规划决策。在 RBC 的基础上，RBC-SFT 通过步骤质量对助手标记学习进行重新加权，而 RBC-GRPO 将步骤级信用与最终规划奖励结合起来，在强化学习期间不渲染视频。为了解决缺乏专门的面向搜索的评估的问题，我们构建了 Search-VBench，其中包含跨越七个类别的 150 个保留提示。实验表明，Loupe 在三个视频生成器上提高了所有四个评估维度，将 MiniMax-H3 的总体得分从 32.80 提高到 70.67，并优于未训练的搜索工作流。消融实验表明，完整的 RBC 训练比标准 SFT 后跟轨迹级 GRPO 高出 5.27 分。人类评估以及在 Sci-VBench 和 KIVI-Bench 上的结果进一步证明了生成质量、科学依据、事实精确度和有用性的提高。我们的项目页面可在 https://zengkaiya.github.io/Loupe/ 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e知识密集型视频生成中的证据检索、规划与代理强化学习训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 Loupe 代理，通过检索和验证文本与视觉证据构建基于证据的时间视频提示；引入基于规则的信用（RBC）在视频渲染前评估中间决策；提出 RBC-SFT 和 RBC-GRPO 方法实现步骤级信用分配，避免 RL 期间的视频渲染；构建包含 150 个提示的 Search-VBench 评估集。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Loupe 在多个视频生成器和评估维度上取得了显著提升（如 MiniMax-H3 得分从 32.80 升至 70.67），且 RBC 训练比基线高出 5.27 分。局限性方面，摘要未提供具体的计算开销、生成视频的具体分辨率或帧率限制，也未提及在更广泛或不同分布数据集上的泛化能力评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e视频生成与多模态代理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e27. Letting Models Manage Their Own Context: Where We Stand（让模型管理自己的上下文：我们目前的进展）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 6 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34147\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34147\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAgent harnesses today manage context on the model\u0026#x27;s behalf: when the window fills, the harness triggers a compaction that summarizes the history. We study the alternative, model-driven context management, in which the model itself decides when and what to compact through a context API. We gave models control over their own context in \\nooa, NVIDIA\u0026#x27;s open source agent harness, and compared the two strategies on document research and machine learning engineering across context budgets from 8K to 512K tokens. Models that use the context API effectively reach higher accuracy, often with fewer input tokens, especially at tight budgets: GPT 6.1 nearly triples its score at a 32K budget on OfficeQA Pro v2 (21\\%~rightarrow~56\\%), and Kimi gains with up to 41\\% fewer input tokens. Models differ widely, however, in how often they use the API, how aggressively they compact, and when they start compacting, and prompt changes shift that timing. Finally, we show that inference engines can make model-driven edits cheaper: by reusing the KV cache of the unchanged suffix after an edit, we cut prefill compute by up to 15\\% per request with no measurable change in accuracy. Together, these results point to a new co-design frontier: models trained to manage their own context, served by inference engines that support KV cache editing.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e如今的代理框架代表模型管理上下文：当窗口填满时，框架会触发压缩以总结历史记录。我们研究了另一种替代方案，即模型驱动的上下文管理，其中模型本身通过上下文 API 决定何时以及压缩什么。我们在 NVIDIA 的开源代理框架 \\nooa 中赋予了模型对其自身上下文的控制权，并在 8K 到 512K 标记的上下文预算下，在文档研究和机器学习工程任务中比较了这两种策略。有效使用上下文 API 的模型能够达到更高的准确率，通常使用更少的输入标记，尤其是在预算紧张的情况下：GPT 6.1 在 OfficeQA Pro v2 的 32K 预算下得分几乎翻了三倍（21%~rightarrow~56%），而 Kimi 在输入标记减少高达 41% 的情况下获得了提升。然而，模型在使用 API 的频率、压缩的激进程度以及开始压缩的时间上存在很大差异，并且提示的变化会改变这一时间。最后，我们表明推理引擎可以使模型驱动的编辑变得更便宜：通过重用编辑后未更改后缀的 KV 缓存，我们将每个请求的预填充计算量减少了高达 15%，且准确率没有可测量的变化。综合来看，这些结果指向了一个新的协同设计前沿：训练有素以管理自身上下文的模型，由支持 KV 缓存编辑的推理引擎提供服务。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e代理框架中模型驱动的上下文管理策略及其在文档研究和机器学习工程任务中的评估。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出并评估了模型通过上下文 API 自主决定何时及如何压缩上下文的策略；在 8K 到 512K 标记预算下比较了模型驱动与框架驱动策略；发现模型驱动策略在紧张预算下能显著提高准确率并减少输入 token（如 GPT 6.1 在 32K 预算下得分从 21% 升至 56%）；提出通过重用未更改后缀的 KV 缓存，将推理引擎的预填充计算量减少高达 15%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了模型驱动上下文管理在提高准确率和减少 token 消耗方面的有效性，并提出了 KV 缓存重用的推理优化。局限性方面，摘要未提供不同模型在 API 使用频率和压缩激进程度上的具体量化差异数据，也未说明该协同设计方法在更长上下文或更复杂多轮对话任务中的具体表现和潜在延迟增加。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e大语言模型推理与上下文管理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e28. Demystifying the Autoresearch Harness: How Context and Skills Shape Self-Evolving Agents（揭秘自动研究框架：上下文和技能如何塑造自我进化的代理）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 5 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28244\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28244\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAutoresearch agents, which autonomously design, run, and refine experiments, are accelerating scientific progress, particularly in AI research. However, existing agents rely on harnesses that combine multiple mechanisms, making it difficult to determine how individual components contribute to performance. We systematically study harness design for long-horizon, self-evolving autoresearch agents along two dimensions: context management, which determines what an agent retains from its past attempts, and skill management, which governs how it stores and reuses lessons from those attempts. Across MLE-Bench and KernelBench with gpt-oss-120b, gpt-6-luna, and gpt-6-sol, we isolate the effects of individual harness design choices by evaluating each against a recency-truncation baseline within a shared agent framework. For context management, we find that preserving individually accessible records of past attempts is more effective than maintaining a rolling summary, with context folding performing best across all six settings and improving upon the baseline by up to 19.2%. For skill management, selectively discarding persistently unused lessons is more effective on average than consolidating them or promoting them to standing rules. Building on these findings, we combine context folding and skill deletion in MLEvolver, which achieves a 72.7% medal rate on MLE-Bench Lite and a 94% fast_1 score on KernelBench Level 3, substantially outperforming AIDE and OpenEvolve under the same inference budget. Overall, our study distills design principles for preserving experimental history and curating reusable lessons in autoresearch harnesses, paving the way for agents that turn accumulated experience into sustained progress.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e自主设计、运行和完善实验的自动研究代理正在加速科学进步，特别是在人工智能研究领域。然而，现有的代理依赖于结合多种机制的框架，使得难以确定各个组件对性能的贡献。我们沿着两个维度系统地研究了长视野、自我进化的自动研究代理的框架设计：上下文管理（决定代理从过去的尝试中保留什么）和技能管理（控制它如何存储和重用这些尝试中的经验）。在 MLE-Bench 和 KernelBench 上，使用 gpt-oss-120b、gpt-6-luna 和 gpt-6-sol，我们通过在共享代理框架内将每个设计选择与近期截断基线进行评估，从而隔离了各个框架设计选择的影响。对于上下文管理，我们发现保留可单独访问的过去尝试记录比维护滚动摘要更有效，其中上下文折叠在所有六种设置中表现最佳，并比基线提高了高达 19.2%。对于技能管理，选择性地丢弃持续未使用的经验平均比合并它们或将它们提升为常驻规则更有效。基于这些发现，我们在 MLEvolver 中结合了上下文折叠和技能删除，在 MLE-Bench Lite 上实现了 72.7% 的奖牌率，在 KernelBench Level 3 上实现了 94% 的 fast_1 得分，在相同的推理预算下大幅优于 AIDE 和 OpenEvolve。总体而言，我们的研究提炼了在自动研究框架中保留实验历史和整理可重用经验的设计原则，为将积累的经验转化为持续进步的代理铺平了道路。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e自动研究代理框架中上下文管理和技能管理的设计原则及其对自我进化代理性能的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e系统研究了长视野自动研究代理的上下文管理和技能管理维度；发现保留可单独访问的过去尝试记录（上下文折叠）比滚动摘要更有效，提升高达 19.2%；发现选择性丢弃持续未使用的经验比合并或提升为常驻规则更有效；提出 MLEvolver，结合上下文折叠和技能删除，在 MLE-Bench Lite 和 KernelBench Level 3 上分别达到 72.7% 奖牌率和 94% fast_1 得分，优于 AIDE 和 OpenEvolve。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细分析了框架设计组件的独立影响，并提出了有效的组合策略 MLEvolver，在特定基准上取得了显著提升。局限性方面，摘要未提供关于持续未使用的具体阈值定义，未说明这些设计原则在除 MLE-Bench 和 KernelBench 之外的其他科学领域或更复杂任务中的泛化能力，也未提供推理预算的具体数值和计算成本分析。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自动研究与代理框架设计\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e29. Puzzling-Bench: Evaluating Language Models on 23,777 Human-Written Puzzles with Community-Verified Answers（Puzzling-Bench：使用 23,777 个人工编写且经社区验证答案的谜题评估语言模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34331\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34331\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWe introduce Puzzling-Bench, a benchmark of 23,777 puzzles with community-verified answers drawn from the Puzzling Stack Exchange archive (2014-2026): riddles, ciphers, logic grids, lateral-thinking problems, wordplay and recreational mathematics, a third of them with images. Every puzzle carries the answer accepted by its author, a short reference answer taken from it (LLM-extracted for the evaluation sets and checked on a 50-puzzle human review), the author\u0026#x27;s own hints, community tags and a creation date, so that the benchmark supports hint ablations, category analysis and a rolling post-cutoff slice (254 puzzles posted after the training cutoff of six of the nine models we evaluate, including the best one) as a contamination check. We evaluate nine frontier and open models with a two-tier scorer (normalized exact match, then an LLM judge) and validate the judge with three judges from two model families: they agree on 95-97% of verdicts (kappa 0.82-0.96), move no model by more than 1.6 points, and show no own-family preference. The best model, GPT-6.1, reaches 74.8% on a shared 255-puzzle set; a hard core of 17 puzzles defeats all nine models; model failures are strongly correlated, and the second-best model contributes a single puzzle to a greedy ensemble, yet an oracle over all nine reaches 91%. On a 100-puzzle multimodal pilot, withholding the question\u0026#x27;s image costs the two best models 24 and 35 points. We release the dataset, the scoring pipeline and all per-row provenance.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e我们引入了 Puzzling-Bench，这是一个包含 23,777 个谜题的基准，具有来自 Puzzling Stack Exchange 档案（2014-2026 年）的社区验证答案：包括谜语、密码、逻辑网格、横向思维问题、文字游戏和娱乐数学，其中三分之一带有图像。每个谜题都带有作者接受的答案、从中提取的简短参考答案（针对评估集由 LLM 提取并在 50 个谜题的人工审查中进行了检查）、作者自己的提示、社区标签和创建日期，因此该基准支持提示消融、类别分析以及滚动截止后切片（在我们评估的九个模型中包括最佳模型在内的六个模型的训练截止后发布的 254 个谜题）作为污染检查。我们使用两级评分器（归一化精确匹配，然后是 LLM 评判）评估了九个前沿和开放模型，并使用来自两个模型家族的三个评判验证了该评判：他们在 95-97% 的裁决上达成一致（kappa 0.82-0.96），对任何模型的移动不超过 1.6 分，并且没有表现出自身家族偏好。最佳模型 GPT-6.1 在共享的 255 个谜题集上达到了 74.8%；17 个谜题的核心难题击败了所有九个模型；模型失败高度相关，第二好的模型仅对贪心集成贡献了一个谜题，然而所有九个模型的预言机达到了 91%。在 100 个谜题的多模态试点中，隐藏问题的图像使两个最佳模型分别损失了 24 分和 35 分。我们发布了数据集、评分管道和所有逐行来源。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估语言模型在包含 23,777 个人工编写且具有社区验证答案的多样化谜题（包括多模态）上的推理与解题能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e构建了 Puzzling-Bench，包含 23,777 个谜题（三分之一带图像），支持提示消融、类别分析和数据污染检查；采用两级评分器并使用多个 LLM 评判进行验证，评判一致性达 95-97%；发现 GPT-6.1 在 255 个共享谜题上达 74.8%，17 个核心难题击败所有模型，多模型集成预言机达 91%；多模态试点表明隐藏图像会使最佳模型得分下降 24 至 35 分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 Puzzling-Bench 提供了一个大规模、多维度且经过严格验证的谜题评估基准，揭示了当前模型在特定核心难题上的局限以及对多模态信息的依赖。局限性方面，摘要未提供关于 LLM 提取参考答案的具体错误率，未说明除 GPT-6.1 外其他八个模型的具体得分分布，也未详细探讨模型失败高度相关的具体原因或特征。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e语言模型评估与逻辑推理基准\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e30. CONCOR: Benchmarking Contrastive Decoding for Visual Hallucination Mitigation Beyond Final-Output Performance（CONCOR：超越最终输出性能对比解码以缓解视觉幻觉的基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 4 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30460\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30460\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eContrastive decoding (CD) mitigates object hallucination in multimodal large language models (MLLMs) by contrasting token distributions under different conditions to adjust token scores. However, existing generative and discriminative benchmarks primarily measure final task scores, which can be confounded by candidate filtering, changes in generation trajectories, and response biases, making it difficult to isolate the effects of the underlying contrastive adjustments. To address these limitations while complementing existing evaluations, we introduce CONCOR (Contrastive Correction Evaluation), a controlled benchmark that directly evaluates the competition between ground-truth and different types of hallucinated candidates using the Contrastive Grounding Margin (CGM). CGM also enables analysis of directional consistency, composition, and reliability of contrastive corrections. Our evaluation reveals that existing CD methods exhibit distinct correction behaviors: some consistently favor ground-truth candidates, whereas others produce strong corrections but also introduce more errors. Crucially, these differences help explain their contrasting responses to increased contrast strength, which improves some methods while degrading others. These findings highlight the importance of evaluating the contrastive correction itself, rather than relying solely on final-output performance, and CONCOR provides a controlled and interpretable framework for understanding and improving CD methods for hallucination mitigation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e对比解码（CD）通过在不同条件下对比标记分布以调整标记得分，从而缓解多模态大语言模型（MLLM）中的物体幻觉。然而，现有的生成式和判别式基准主要测量最终任务得分，这可能会受到候选过滤、生成轨迹变化和响应偏差的混淆，使得难以隔离底层对比调整的影响。为了解决这些局限性并补充现有评估，我们引入了 CONCOR（对比校正评估），这是一个受控基准，使用对比基础边际（CGM）直接评估真实情况与不同类型幻觉候选之间的竞争。CGM 还使得能够分析对比校正的方向一致性、组合和可靠性。我们的评估表明，现有的 CD 方法表现出不同的校正行为：有些一致地偏好真实情况候选，而另一些则产生强烈的校正但也引入了更多错误。至关重要的是，这些差异有助于解释它们对增加对比强度的相反反应，这提高了一些方法的效果而降低了其他方法的效果。这些发现强调了评估对比校正本身的重要性，而不是仅仅依赖最终输出性能，CONCOR 提供了一个受控且可解释的框架，用于理解和改进用于缓解幻觉的 CD 方法。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和隔离多模态大语言模型中对比解码（CD）方法在缓解物体幻觉时的底层对比调整效果，而非仅仅依赖最终任务得分。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出 CONCOR 基准，使用对比基础边际（CGM）直接评估真实情况与幻觉候选之间的竞争；CGM 支持分析对比校正的方向一致性、组合和可靠性；揭示现有 CD 方法具有不同的校正行为（如偏好真实候选或引入更多错误），并解释了它们对对比强度增加的不同反应。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明 CONCOR 能够有效隔离和评估对比解码的底层调整效果，揭示了不同 CD 方法在校正行为和对比强度响应上的差异。局限性方面，摘要未提供 CONCOR 基准的具体数据集规模、包含的幻觉类型数量，也未提供不同 CD 方法在 CGM 指标上的具体量化得分对比，仅描述了定性行为差异。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e多模态大语言模型幻觉缓解与评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e31. Entangle: Scaling Human-Video In-Context World-Action Models across Unseen Tasks and Contexts（Entangle：跨未见任务与上下文扩展人类视频上下文世界-动作模型）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28732\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28732\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eIn-context learning (ICL) enables foundation models to perform unseen tasks from context without parameter updates. In robotic manipulation, a human video provides the context that specifies how a task should be performed. However, scaling human-video ICL on world-action models (WAMs) faces two challenges: task-level human-robot pairs are not temporally aligned with robot actions, and standard action losses allow policies to rely on initial-scene or task-identity shortcuts rather than tracking the context. We present Entangle, an in-context world-action model that maps a single human video and current robot observations to future visual states and executable actions. To scale temporally aligned training data, we convert recorded robot videos into matched human contexts via video-to-video generation, supplemented by real paired recordings. For model training, we combine variable-length video windows with an intra-task contrastive objective that distinguishes the paired action trajectory from other executions of the same task, preventing task-identity shortcuts. Without task-specific fine-tuning, Entangle improves steadily as aligned training data scales, reaching an average score of 83.5/100 across six unseen tasks on an Astribot S1 robot, and achieves a 69.5% average success rate on seven unseen RoboTwin tasks, outperforming Zero-WAM by 22.6 percentage points. Under Context-OOD, although trained only on scene-aligned pairs, Entangle transfers context-specified behaviors across rearranged layouts and substituted tools. Project page at https://entangle-robotics.github.io/\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e上下文学习（ICL）使基础模型能够在不进行参数更新的情况下从上下文中执行未见过的任务。在机器人操作中，人类视频提供了指定如何执行任务的上下文。然而，在世界-动作模型（WAMs）上扩展人类视频ICL面临两个挑战：任务级的人类-机器人对在时间上与机器人动作不对齐，并且标准的动作损失允许策略依赖于初始场景或任务身份捷径，而不是跟踪上下文。我们提出了Entangle，一个上下文世界-动作模型，它将单个人类视频和当前的机器人观察映射到未来的视觉状态和可执行动作。为了扩展时间对齐的训练数据，我们通过视频到视频的生成将记录的机器人视频转换为匹配的人类上下文，并辅以真实的配对记录。对于模型训练，我们将可变长度的视频窗口与任务内对比目标相结合，该目标将配对的动作轨迹与同一任务的其他执行区分开来，从而防止任务身份捷径。无需特定任务的微调，Entangle随着对齐训练数据的扩展而稳步提高，在Astribot S1机器人上的六个未见任务中达到83.5/100的平均分数，并在七个未见过的RoboTwin任务中实现69.5%的平均成功率，比Zero-WAM高出22.6个百分点。在上下文分布外（Context-OOD）下，尽管仅在场景对齐对上训练，Entangle仍能跨重新排列的布局和替换的工具转移上下文指定的行为。项目主页位于 https://entangle-robotics.github.io/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决在世界-动作模型（WAMs）上扩展人类视频上下文学习（ICL）时面临的训练数据时间不对齐和策略依赖捷径的问题，通过提出Entangle模型将单个人类视频和机器人观察映射为未来视觉状态和可执行动作。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出Entangle模型，结合可变长度视频窗口和任务内对比目标，防止任务身份捷径。2. 通过视频到视频生成和真实配对记录扩展时间对齐的训练数据。3. 在Astribot S1和RoboTwin的未见任务中取得高成功率，且在Context-OOD下具备跨布局和工具转移行为的能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明Entangle通过对比学习和视频生成有效解决了数据对齐和捷径问题，并在未见任务和分布外场景中展现了良好的泛化能力。局限：摘要未提供关于模型计算成本、视频生成质量对最终策略的具体影响量化，以及在更复杂或更长时序任务中的表现细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人操作与计算机视觉 / 具身智能\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e32. AIChipBench: Benchmarking LLM Agents for Automated AI Accelerator Design（AIChipBench：用于自动化AI加速器设计的大型语言模型智能体基准测试）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33093\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33093\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA language-model decoder carries state between decoding steps, and in hardware a wrong state update can leave the current token correct and corrupt the output several tokens later, so a design can pass output tests and still be wrong. AIChipBench asks what LLM coding agents need to build such hardware correctly. Agents implement quantized Qwen3.5, Gemma 3, Gemma 4, and Llama 3.2 decoders in synthesizable register-transfer-level (RTL) code against an executable integer reference that specifies the outputs and the stored state at every decoding step. They debug against public tests under fixed budgets; their frozen designs are graded on held-out token sequences, resets, memory stalls, and synthesis, and a second track asks them to speed up a correct design at nearly fixed area. Across 9,136 attempts by four coding agents, the difficulty lies in stored state. Feedback that points to the first state mismatch raises acceptance over output-only feedback in all 12 agent--task cells of a matched study, by 25.0 to 46.9 percentage points, and halves the agent-hours per accepted design. Regraded on new sequences and conditions, 45 of 69 accepted designs fail within the 32 steps their tests required. More than a third of attempts to speed up a correct design end without one. An overall score ranks Sol 5.6 and Fable 5.1 above Astra 6 and Opus 5.5, and both halves of the instances give this order in all 200 random splits. Hardware agents therefore need debugging feedback that exposes stored state, and their benchmarks need final tests well beyond the development cases.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e语言模型解码器在解码步骤之间携带状态，而在硬件中，错误的状态更新可能使当前token保持正确，但在几个token之后破坏输出，因此设计可以通过输出测试但仍然是错误的。AIChipBench探讨了大型语言模型（LLM）编码智能体需要做什么才能正确构建此类硬件。智能体在可综合的寄存器传输级（RTL）代码中实现量化的Qwen3.5、Gemma 3、Gemma 4和Llama 3.2解码器，对照一个可执行的整数参考，该参考指定了每个解码步骤的输出和存储状态。他们在固定预算下针对公开测试进行调试；其冻结的设计在保留的token序列、重置、内存停顿和综合方面进行评分，第二个赛道要求他们在几乎固定的面积下加速正确的设计。在四个编码智能体的9,136次尝试中，难度在于存储状态。在匹配研究的所有12个智能体-任务单元中，指向第一个状态不匹配的反馈将接受率提高了25.0到46.9个百分点，并使每个接受设计所需的智能体小时数减半，这优于仅输出反馈。在新的序列和条件下重新评分时，69个接受的设计中有45个在其测试所需的32个步骤内失败。超过三分之一的加速正确设计的尝试以失败告终。总体得分将Sol 5.6和Fable 5.1排在Astra 6和Opus 5.5之上，并且在所有200个随机分割中，实例的两半都给出了这一顺序。因此，硬件智能体需要暴露存储状态的调试反馈，并且其基准测试需要远超开发案例的最终测试。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和基准测试大型语言模型（LLM）编码智能体在自动化AI加速器设计（具体为构建语言模型解码器硬件）中的能力，并探究智能体正确构建此类硬件所需的条件（如调试反馈类型）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出AIChipBench基准，要求智能体生成可综合的RTL代码实现量化LLM解码器，并引入存储状态验证。2. 发现指向首个状态不匹配的反馈能显著提高设计接受率（提升25.0至46.9个百分点）并减少一半的智能体工时。3. 评估了多个编码智能体，发现Sol 5.6和Fable 5.1表现优于Astra 6和Opus 5.5，且结果具有统计稳定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了在硬件设计中，仅依赖输出测试是不够的，暴露存储状态的反馈至关重要，且现有的基准测试需要更严格的最终测试。局限：摘要未提供关于智能体生成代码的具体面积或功耗数据，未详细说明不同智能体在特定子任务（如加速赛道）上的具体失败原因，且未提供除排名外的具体成功率数字。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e硬件设计自动化 / 大型语言模型智能体评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e33. Evaluation-Free Recursive Self-Improvement for Coding Agents（编码智能体的无评估递归自我改进）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21056\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21056\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eRecent self-improving coding agents have achieved strong benchmark performance by iteratively modifying their own executable implementations. A common pattern uses downstream task-derived evidence to decide which candidates or lineages continue evolving, which we term evaluate-and-select. Obtaining this signal requires repeatedly executing evolved agents on downstream tasks, so broader exploration incurs increasing evaluation cost, while repeated optimization against a fixed evaluation distribution may encourage benchmark-specific adaptation. We ask: can coding agents self-improve without downstream task evaluation inside the evolution loop? We introduce Explore-then-Integrate (ELITE), which integrates implementation mechanisms rather than selecting a single exploratory child to continue the lineage. At each generation, ELITE proposes diverse focused improvements, implements them independently from the same parent, and inspects the resulting programs to identify complementary, redundant, and conflicting mechanisms before reimplementing a compatible subset as one coherent descendant. No downstream task outcomes or task-solving trajectories of evolved candidates are used to guide evolution; only deterministic checks of structural and operational validity are used inside the loop. On SWE-bench Pro, ELITE improves the initial agent from 60.0% to 85.6%, compared with 86.7% for the Darwin Godel Machine (DGM) and 88.3% for the Huxley-Godel Machine (HGM), while using zero candidate task evaluations and reducing observed wall-clock evolution time by 8.8x and 3.2x, respectively, under the evaluated configurations. In cross-benchmark transfer without further adaptation, ELITE averages 73.3% on SWE-bench Verified and 69.3% on Polyglot. Together, these results demonstrate the feasibility of coding-agent self-improvement without downstream candidate task evaluation in our setting.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近自我改进的编码智能体通过迭代修改其自身的可执行实现，在基准测试中取得了强劲的性能。一种常见的模式使用下游任务衍生的证据来决定哪些候选者或谱系继续进化，我们称之为评估并选择。获取此信号需要在下游任务上重复执行进化后的智能体，因此更广泛的探索会带来不断增加的评估成本，而针对固定评估分布的重复优化可能会鼓励特定于基准的适应。我们问：编码智能体能否在进化循环内不进行下游任务评估的情况下实现自我改进？我们引入了探索后整合（ELITE），它整合实现机制，而不是选择单个探索性子代来延续谱系。在每一代中，ELITE提出多样化的聚焦改进，从同一个父代独立实现它们，并检查生成的程序以识别互补、冗余和冲突的机制，然后将兼容的子集重新实现为一个连贯的后代。进化过程不使用进化候选者的任何下游任务结果或任务解决轨迹作为指导；循环内仅使用结构和操作有效性的确定性检查。在SWE-bench Pro上，ELITE将初始智能体从60.0%提高到85.6%，而Darwin Godel Machine（DGM）为86.7%，Huxley-Godel Machine（HGM）为88.3%，同时在评估配置下使用零候选任务评估，并将观察到的挂钟进化时间分别减少了8.8倍和3.2倍。在无需进一步适应的跨基准迁移中，ELITE在SWE-bench Verified上平均达到73.3%，在Polyglot上达到69.3%。总而言之，这些结果证明了在我们的设置中，编码智能体在没有下游候选任务评估的情况下进行自我改进的可行性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e探索并实现编码智能体在进化循环内不依赖下游任务评估的自我改进方法，以解决传统评估并选择模式带来的高评估成本和基准特定适应问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出探索后整合（ELITE）方法，通过整合多样化的聚焦改进机制而非选择单一子代来实现自我改进。2. 进化循环内仅使用结构和操作有效性的确定性检查，完全摒弃下游任务评估。3. 在SWE-bench Pro上将初始智能体性能从60.0%提升至85.6%，且将挂钟进化时间减少了3.2至8.8倍，并在跨基准测试中展现出良好的迁移能力。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明ELITE通过机制整合和确定性检查，成功实现了无下游任务评估的自我改进，大幅降低了计算时间并避免了基准过拟合。局限：摘要未提供ELITE在SWE-bench Pro上最终性能与DGM和HGM相比略低的具体原因分析，未提供不同改进机制冲突解决的具体策略细节，且未说明该方法在更长时间或更多代际进化中的稳定性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e软件工程 / 大型语言模型智能体 / 自动化代码生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e34. Lost in Translation, Not in Confidence: Benchmarking and Calibrating Multilingual Decision Models（迷失在翻译中，而非置信度中：多语言决策模型的基准测试与校准）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33307\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33307\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eDecision models are language models fine-tuned to return a probability for each option of a typed query, which routers and guardrails threshold directly. They are built on multilingual bases but ranked almost entirely in English. We evaluate 25 top-ranked open-weight decision models on 17 tasks in 14 languages, comparing each language with English on parallel items. Every model loses accuracy in every language, from about 2 points in high-resource languages to 8 in Tamil, while confidence falls only half as much: a threshold set for 95\\% accuracy in English yields 90% in Tamil. The size of the loss is set by the language and the base model rather than by leaderboard rank. In 81 controlled fine-tuning runs, task skill learned in English transfers to other languages and a few thousand target-language items narrow large losses, but neither more data nor full-parameter tuning closes them. Finally, the same test items are answered more accurately in all 23 benchmark--language pairs we compare when an LLM rather than a person translated them, so LLM-translated test sets understate the gap.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e决策模型是经过微调的语言模型，用于返回类型化查询每个选项的概率，路由器和防护栏直接对其进行阈值处理。它们构建在多语言基础上，但排名几乎完全基于英语。我们在14种语言的17个任务上评估了25个排名靠前的开放权重决策模型，在平行项目上将每种语言与英语进行比较。每个模型在每种语言中都会损失准确率，从高资源语言的约2分到泰米尔语的8分，而置信度仅下降一半：为英语中95%准确率设定的阈值在泰米尔语中产生90%的准确率。损失的大小由语言和基础模型决定，而不是由排行榜排名决定。在81次受控的微调运行中，在英语中学到的任务技能会转移到其他语言，并且几千个目标语言项目可以缩小巨大的损失，但更多的数据或全参数微调都无法弥补这些损失。最后，在我们比较的所有23个基准-语言对中，当由LLM而不是人类翻译相同的测试项目时，回答的准确率更高，因此LLM翻译的测试集低估了这一差距。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估和校准多语言决策模型在不同语言下的准确率与置信度表现，探究语言、基础模型、微调策略以及翻译方式对模型跨语言性能差距的影响。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 发现所有评估的决策模型在非英语语言中均存在准确率下降（2至8分），且置信度下降幅度仅为准确率的一半，导致阈值设定失效。2. 准确率损失的大小取决于语言和基础模型，而非模型的英语排行榜排名。3. 证明增加数据或全参数微调无法完全弥补跨语言损失，且使用LLM翻译测试集会低估实际的语言差距。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要揭示了多语言决策模型在实际应用中存在的严重跨语言性能衰减和置信度校准问题，并指出当前基准测试（使用LLM翻译）可能低估了这一问题。局限：摘要未提供25个模型中具体哪些模型表现最好或最差，未详细说明17个任务和14种语言的具体分布，且未提供全参数微调后具体的准确率提升数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 模型评估与基准测试 / 多语言模型\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e35. DexEngine: Scaling Human Demonstrations into Physically Executable Whole-Robot Data（DexEngine：将人类演示扩展为物理可执行的全身机器人数据）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.33579\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.33579\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eA growing body of recent work addresses the retargeting of human hand-object demonstrations to robotic hands. To train whole-robot policies, however, the retargeted motions must be kinematically feasible and physically executable, and be produced efficiently at scale. We present DexEngine, a simulation pipeline that turns human manipulation data into train-ready, physically executable arm-hand trajectories. DexEngine first places each clip\u0026#x27;s hand-object motion where the arms can reach it, finds an arm motion that follows the human hands, and then corrects the motion in physics simulation with residual reinforcement learning. From nine human hand-object datasets, we generate about 5,200 clips for each of four dexterous hands, augmented into 65,000 trajectories (116 h) and 325,000 episodes (578 h) in total. Even with arms attached, DexEngine tracks objects more accurately than prior floating-hand methods and runs over 10x faster than RL-based ones. Policies trained on our data far outperform those trained on the same clips without physics correction or with the arms attached after a floating-hand correction, showing that fine-tuning data need physics correction. Mid-training on our data further improves them at equal fine-tuning budget, in simulation and on a real robot.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e最近越来越多的工作致力于将人类手-物体演示重定向到机器人手部。然而，为了训练全身机器人策略，重定向的动作必须在运动学上可行且在物理上可执行，并能够高效地大规模生成。我们提出了DexEngine，一个仿真管道，它将人类操作数据转化为可训练的、物理上可执行的手臂-手部轨迹。DexEngine首先将每个片段的手-物体动作放置在手臂可以触及的地方，找到跟随人类手部的臂部动作，然后在物理仿真中使用残差强化学习对动作进行校正。从九个人类手-物体数据集中，我们为四种灵巧手各生成约5,200个片段，总共增强为65,000条轨迹（116小时）和325,000个回合（578小时）。即使附加了手臂，DexEngine跟踪物体的准确度也高于以前的浮手方法，并且运行速度比基于强化学习的方法快10倍以上。在我们的数据上训练的策略远远优于在没有物理校正的情况下或在浮手校正后附加手臂的情况下使用相同片段训练的策略，这表明微调数据需要物理校正。在相同微调预算下，在我们的数据上进行中期训练进一步提高了它们在仿真和真实机器人上的表现。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决将人类手-物体演示重定向为全身机器人策略训练数据时，动作需满足运动学可行、物理可执行且能大规模高效生成的问题，提出DexEngine仿真管道。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出DexEngine管道，结合运动学求解与残差强化学习，将人类演示转化为物理可执行的手臂-手部轨迹。2. 从9个数据集生成约5,200个片段每灵巧手，共增强出65,000条轨迹和325,000个回合的大规模数据。3. 相比浮手方法跟踪更准、速度提升10倍以上；证明微调数据必须经过物理校正，且中期训练能进一步提升仿真和真实机器人性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明DexEngine有效解决了人类演示到机器人数据的物理可行性问题，生成的大规模高质量数据显著提升了策略性能。局限：摘要未提供策略在真实机器人上的具体成功率数字，未详细说明残差强化学习的具体奖励函数设计，且未提供与具体基线方法的详细性能对比数值。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人操作 / 具身智能 / 模仿学习与数据生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e36. Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock（看到时再说：主动任务助手应等待证据而非看时间）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30895\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30895\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eProactive assistants that guide people through physical tasks must decide, every few seconds, whether a step is complete and whether a mistake has occurred. We find that two benchmarks for this task largely reward knowing when rather than seeing what: a timer that never looks at the video, raising an alarm at 25 s and confirming each step at 30 s, reaches a mistake F1 of 0.373 on Ego-MC-Bench, above every published result (at most 0.27). We formalize this as the video-blind frontier, the best trade-off between completion accuracy and mistake F1 that policies reach from the elapsed time, the instruction and training statistics alone: every published per-step result on Ego-MC-Bench lies inside it, and so do all twelve zero-shot models we run on QICD. To move beyond it, we introduce Evidence-Contrastive Training (ECT): fine-tune on the benchmark\u0026#x27;s own questions, and pair its positives with negatives from the same recording at the same elapsed time, so that elapsed time cannot separate the two sides of a pair. Trained on 209 QICD videos in about 15 GPU-hours, a 2B model with ECT crosses the frontier on both benchmarks in all four seeds; transferred to Ego-MC-Bench without adaptation, it confirms 59% of mistake-free steps in time, against 30% for a published model with the same backbone trained on about 25k synthetic counterfactuals and real recordings. Its decisions follow the video beyond what timing explains: at equal elapsed time it tells a finished step from an unfinished one in 90-92% of test pairs, where the instruction\u0026#x27;s typical duration reaches 65%, rescaling the time stamps between the frames leaves it essentially unchanged, and swapping in another recording, of the same recipe where one exists, cuts its completion accuracy by two thirds. The code and model weights will be publicly released.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e引导人们完成物理任务的主动助手必须每隔几秒钟决定一个步骤是否完成以及是否发生了错误。我们发现，该任务的两个基准主要奖励的是知道“何时”而不是看到“什么”：一个从不查看视频的计时器，在25秒时发出警报并在30秒时确认每个步骤，在Ego-MC-Bench上的错误F1达到了0.373，高于所有已发表的结果（最多0.27）。我们将其形式化为“视频盲区前沿”，即策略仅从经过的时间、指令和训练统计中达到的完成准确率和错误F1之间的最佳权衡：Ego-MC-Bench上所有已发表的逐步结果都位于其内部，我们在QICD上运行的所有12个零样本模型也是如此。为了超越它，我们引入了证据对比训练（ECT）：在基准测试自身的问题上进行微调，并将其正样本与来自同一录像在相同经过时间的负样本配对，使得经过的时间无法区分配对的两边。在约15个GPU小时内对209个QICD视频进行训练后，带有ECT的2B模型在所有四个种子中均跨越了两个基准的前沿；在无需适应的情况下转移到Ego-MC-Bench时，它及时确认了59%的无错误步骤，而具有相同主干并在约2.5万个合成反事实和真实录像上训练的已发表模型仅为30%。它的决策遵循视频，超越了时间所能解释的范围：在相同的经过时间下，它在90-92%的测试对中区分了已完成和未完成的步骤，而指令的典型持续时间仅达到65%，重新缩放帧之间的时间戳使其基本保持不变，并且换入另一个相同食谱的录像（如果存在的话）会将其完成准确率降低三分之二。代码和模型权重将公开发布。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e开发主动任务助手，以在物理任务中每隔几秒判断步骤是否完成以及是否发生错误，超越仅依赖时间统计的视频盲区前沿。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 揭示了现有基准主要奖励基于时间的策略，并形式化了视频盲区前沿。2. 提出证据对比训练（ECT），通过在同一录像和相同时间下配对正负样本，使模型依赖视觉证据而非时间。3. 2B模型在15 GPU小时内训练后，在两个基准上超越前沿，无错误步骤确认率达59%，且在相同时间下区分完成与未完成步骤的准确率达90-92%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了ECT方法能有效让模型依赖视频证据而非时间启发式，显著提升了步骤确认准确率。关于模型在更广泛物理任务上的泛化能力、在其他非基准数据集上的具体表现数字，以及计算资源消耗等局限和细节，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与主动任务助手\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e37. Negative-Only Policy Optimization for One-Sided Verifiable Rewards（针对单边可验证奖励的纯负样本策略优化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 3 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.17287\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.17287\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning with verifiable rewards (RLVR) typically relies on a verifier that can reliably judge whether sampled solutions are correct. However, in many realistic settings, complete verification is generally unavailable, while cheap checks can only falsify failures. We formalize this regime as one-sided verifiability (OSV): verified negatives are reliable counterexamples, but verified positives are merely non-falsified candidates and may contain many false positives. This asymmetry makes standard RLVR unreliable, because reinforcing verified positives can directly reward shortcuts that pass partial checks. To address this issue, we propose Negative-Only Policy Optimization (NOPO), which treats verified positives as unlabeled and updates the policy only by suppressing trusted verified negatives. Specifically, NOPO combines a reference-relative negative suppression loss with a group-level adapter that scales each update by the proportion of non-falsified responses. Across unit-test, constraint-check, and LLM self-verifiers, NOPO improves pass@k over baselines on code, logic, and math benchmarks when oracle rewards are unavailable. These gains persist under inference-time scaling and cross-benchmark transfer.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具有可验证奖励的强化学习（RLVR）通常依赖于一个能够可靠判断采样解决方案是否正确的验证器。然而，在许多现实设置中，通常无法进行完整验证，而廉价的检查只能证伪失败。我们将这种机制形式化为单边可验证性（OSV）：验证的负样本是可靠的反例，但验证的正样本仅仅是未被证伪的候选者，可能包含许多假阳性。这种不对称性使得标准RLVR不可靠，因为强化验证的正样本会直接奖励通过部分检查的捷径。为了解决这个问题，我们提出了纯负样本策略优化（NOPO），它将验证的正样本视为未标记的，并且仅通过抑制受信任的验证负样本来更新策略。具体而言，NOPO结合了参考相对负抑制损失与组级适配器，该适配器通过未证伪响应的比例来缩放每次更新。在单元测试、约束检查和LLM自验证器中，当无法获得oracle奖励时，NOPO在代码、逻辑和数学基准上提高了pass@k，优于基线。这些收益在推理时扩展和跨基准转移中持续存在。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决在单边可验证性设置下（即只能可靠证伪失败，而正样本可能包含假阳性），标准RLVR因强化假阳性而不可靠的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 形式化了单边可验证性机制，指出标准RLVR在此机制下会奖励捷径。2. 提出纯负样本策略优化（NOPO），将正样本视为未标记，仅通过抑制验证的负样本来更新策略。3. NOPO结合参考相对负抑制损失和组级适配器，在代码、逻辑和数学基准上提升了pass@k，且收益在推理时扩展和跨基准转移中持续存在。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了NOPO在缺乏完整验证的情况下，通过仅抑制负样本能有效提升模型在代码、逻辑和数学任务上的表现，并具备推理时扩展和跨基准转移能力。关于具体的pass@k提升数字、使用的具体基准数据集名称、基线模型的具体名称，以及NOPO在完整验证设置下的对比结果，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习与大语言模型优化\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e38. Evaluating Memanto on DolphinBench for AI Agents（在DolphinBench上评估AI智能体的Memanto）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.28231\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.28231\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMemory benchmarks built on question answering tell an agent which fact to recall. Workplace requests often leave that need implicit: to post an update in the team\u0026#x27;s channel, an agent must work out which channel from earlier interactions and use it in a tool call. We evaluate Memanto, a memory agent that ranks memories with an information-theoretic relevance score, on DolphinBench, which tests memory through 600 simulated workplace tasks, each validated as requiring memory. Running in the Hermes agent harness with GPT-6-Luna and at most 6 iterations per conversation, Memanto completes 503 tasks (83.83%). The strongest configuration reported by the benchmark\u0026#x27;s authors, Mem0 with GPT-5.6-Luna and up to 60 iterations, completes 424 (70.67%). Memanto\u0026#x27;s run also has the lowest total cost (10.86, against 61.48 for the cheapest reported run) and the shortest median task latency (15.32s). Grading uses the benchmark\u0026#x27;s own judge, but the agent model differs, so these results compare complete systems. The memory system affects both whether an agent completes such tasks and what completion costs.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e基于问答构建的记忆基准会告诉智能体需要回忆哪个事实。工作场所的请求通常使这种需求保持隐式：要在团队的频道中发布更新，智能体必须从早期的交互中计算出是哪个频道，并在工具调用中使用它。我们在DolphinBench上评估了Memanto，这是一个使用信息论相关性得分对记忆进行排序的记忆智能体，该基准通过600个模拟工作场所任务测试记忆，每个任务都经过验证需要记忆。在Hermes智能体框架中运行，使用GPT-6-Luna且每次对话最多6次迭代，Memanto完成了503个任务（83.83%）。基准作者报告的最强配置，即使用GPT-5.6-Luna且最多60次迭代的Mem0，完成了424个任务（70.67%）。Memanto的运行还具有最低的总成本（10.86，而报告的最便宜运行成本为61.48）和最短的中位任务延迟（15.32秒）。评分使用基准自己的评判器，但智能体模型不同，因此这些结果比较的是完整的系统。记忆系统既影响智能体是否完成此类任务，也影响完成成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估隐式记忆需求下的记忆智能体表现，即在智能体需要自行推断应回忆哪些事实并用于工具调用的工作场所任务中，评估Memanto在DolphinBench上的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出在隐式记忆需求场景下评估记忆智能体，而非传统的显式问答。2. Memanto使用信息论相关性得分排序记忆，在Hermes框架和GPT-6-Luna下，最多6次迭代完成83.83%的任务。3. 相比基准作者报告的最强配置，Memanto不仅任务完成率高，且总成本最低，中位延迟最短。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了Memanto在隐式记忆任务中不仅准确率高，而且成本和延迟显著低于现有最强配置，表明记忆系统对任务完成及成本有重大影响。关于Memanto在其他基准上的表现、信息论相关性得分的具体计算细节，以及控制模型变量后的对比结果，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能智能体与记忆系统评估\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e39. Single-Database Rewards Are Hackable: Counterfactual Execution for Trustworthy Text-to-SQL RL（单数据库奖励是可被利用的：用于可信Text-to-SQL强化学习的反事实执行）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34363\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34363\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eReinforcement learning (RL) for text-to-SQL agents pays a query when its result matches the reference on one database. However, a wrong query can match by luck when the data lack the rows that expose its bug. We study a counterfactual-database (CF) reward that also runs the final query on a few hidden, code-generated copies of the database and pays only if all results match (strict form) or by the share matched (mean form). On 1,302 synthetic audit questions, the strict form lowers the share of buggy queries paid in full from 29.5% to 16.8% and of reward hacks from 54.1% to 1.9%, rejecting 0 of 2,847 correct queries; copies from a family-blind generator do about as well. In a controlled GRPO comparison on a 3.35B model with three seeds per arm, training on the mean form did not improve in-domain accuracy (8.4% vs 11.7%), because the two rewards disagreed on only 5-7% of rollouts; on Spider it gained 1.6 points. One seed reverses both signs, so single-seed reward comparisons mislead. Code: https://github.com/RishiiGamer2201/counterfactual-sql-rewards ; data, models, demo: https://huggingface.co/counterfactual-sql\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e用于text-to-SQL智能体的强化学习（RL）在查询结果与一个数据库上的参考结果匹配时支付奖励。然而，当数据缺少暴露其错误的行时，错误的查询可能会侥幸匹配。我们研究了一种反事实数据库（CF）奖励，它还在几个隐藏的、代码生成的数据库副本上运行最终查询，并且仅在所有结果匹配时支付（严格形式）或按匹配比例支付（平均形式）。在1,302个合成审计问题上，严格形式将全额支付的错误查询比例从29.5%降至16.8%，将奖励利用从54.1%降至1.9%，拒绝了2,847个正确查询中的0个；来自家庭盲生成器的副本表现差不多。在3.35B模型上进行的受控GRPO比较中（每个臂三个种子），在平均形式上的训练没有提高域内准确率（8.4%对11.7%），因为两种奖励仅在5-7%的展开中存在分歧；在Spider上它获得了1.6分。一个种子反转了两个符号，因此单种子奖励比较会产生误导。代码：https://github.com/RishiiGamer2201/counterfactual-sql-rewards ；数据、模型、演示：https://huggingface.co/counterfactual-sql\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决Text-to-SQL强化学习中单数据库奖励容易被错误查询侥幸匹配的问题，通过引入反事实数据库奖励来提高奖励的可信度。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 指出单数据库强化学习奖励存在漏洞，错误查询可能因数据缺失而侥幸匹配。2. 提出反事实数据库奖励，在隐藏的代码生成数据库副本上运行查询，分为严格形式和平均形式。3. 严格形式在合成审计问题上将全额支付的错误查询比例降至16.8%，奖励利用降至1.9%，且未拒绝正确查询。4. 发现单种子比较会产生误导，因为不同种子下结果符号可能反转。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了反事实数据库奖励能显著减少Text-to-SQL中的奖励利用现象，同时保持对正确查询的接受率。关于严格形式在模型训练中的具体准确率提升数字、不同种子下结果反转的具体原因，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e强化学习与数据库查询\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e40. WorldBridge: Bridging Scattered Views for Coherent 3D World Generation（WorldBridge：桥接分散视图以实现连贯的3D世界生成）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34079\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34079\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGenerating coherent and explorable 3D worlds from scattered images with little or no visual overlap is a fundamental and long-standing challenge in computer vision, which existing geometry-aware methods fail to address. Meanwhile, existing image- and video-based methods may generate unseen regions but produce inconsistent geometry across views. To bridge this gap, we present WorldBridge, a framework for coherent and controllable 3D world generation under scattered images with little or no visual overlap. WorldBridge encodes scattered references into a global scene context to guide geometry and appearance generation across views. Our temporal and spatial reference attention mechanism further enhances the fidelity of temporal references along the target trajectory and supports flexible spatial references outside it. A plug-and-play latent-reference consistency strategy improves reference fidelity through reprojection-guided test-time optimization. We also introduce the WorldBridge benchmark suite to evaluate 3D world generation from scattered, low-overlap references, which is rarely explored by current benchmarks. Both qualitative and quantitative results demonstrate that our method enables controllable and coherent 3D world generation, surpassing the existing state-of-the-art solutions. Our project page is available at https://davidyan2001.github.io/WorldBridge/.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e从视觉重叠很少或没有视觉重叠的分散图像中生成连贯且可探索的3D世界是计算机视觉中一个基本且长期存在的挑战，现有的几何感知方法无法解决这一问题。同时，现有的基于图像和视频的方法可能会生成未见区域，但在不同视图之间产生不一致的几何。为了弥合这一差距，我们提出了WorldBridge，一个在视觉重叠很少或没有视觉重叠的分散图像下进行连贯且可控的3D世界生成的框架。WorldBridge将分散的参考编码为全局场景上下文，以指导跨视图的几何和外观生成。我们的时间和空间参考注意力机制进一步增强了沿目标轨迹的时间参考的保真度，并支持其外部的灵活空间参考。一种即插即用的潜在参考一致性策略通过重投影引导的测试时优化来提高参考保真度。我们还引入了WorldBridge基准套件，用于评估从分散、低重叠参考中生成3D世界，这是当前基准很少探索的。定性和定量结果均表明，我们的方法实现了可控且连贯的3D世界生成，超越了现有的最先进解决方案。我们的项目页面位于 https://davidyan2001.github.io/WorldBridge/。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决从视觉重叠极少或无重叠的分散图像中生成连贯且可探索的3D世界的挑战，克服现有几何感知方法失效及基于图像或视频方法几何不一致的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出WorldBridge框架，通过将分散参考编码为全局场景上下文，实现低重叠分散图像下的连贯可控3D世界生成。2. 引入时间和空间参考注意力机制，增强目标轨迹内外参考的保真度。3. 提出即插即用的潜在参考一致性策略，通过重投影引导的测试时优化提升保真度。4. 引入WorldBridge基准套件，填补了当前基准在分散低重叠参考3D生成评估方面的空白。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要证明了WorldBridge在定性和定量上均超越了现有最先进方案，实现了低重叠图像下的连贯3D生成，并提供了新的评估基准。关于具体的定量评估指标数字、分散图像的具体数量或重叠度阈值，以及计算资源消耗，摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉与3D生成\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e41. Edit Recommendation: Can LLMs Anticipate Edit Requests from Users, and When?（编辑推荐：大语言模型能否预测用户的编辑请求，以及何时预测？）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.21155\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.21155\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eAfter a large language model (LLM) agent generates an artifact, users often send edit requests for it. This paper studies whether an LLM can anticipate these requests before they are sent. Such anticipation is useful in practice because it reduces the effort of user review and feedback. We formalize this task as edit recommendation and build EditRecBench, a benchmark for evaluating the performance of LLMs on this task, from real-world conversation logs in WildChat-4.8M. Through benchmarking and failure analysis, we identify a practical challenge that some cases are inherently difficult to predict in real-world settings. To address this, we introduce decision model-based gating to filter out cases where predictions are unlikely to be correct before they are presented to the user. Our trained model outperforms existing decision models and raises pass@5 among shown suggestions by 12--25 points at a gating threshold. Our code is available at https://github.com/ntt-dkiku/llm-edit-recommendation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e在大语言模型（LLM）智能体生成工件后，用户通常会为其发送编辑请求。本文研究了LLM是否能在这些请求发送之前预测它们。这种预测在实践中很有用，因为它减少了用户审查和反馈的工作量。我们将此任务形式化为编辑推荐，并构建了EditRecBench，这是一个用于评估LLM在此任务上性能的基准，数据来自WildChat-4.8M中的真实世界对话日志。通过基准测试和失败分析，我们确定了一个实际挑战，即在真实世界设置中，某些情况本质上难以预测。为了解决这个问题，我们引入了基于决策模型的门控机制，在将预测呈现给用户之前，过滤掉那些预测不太可能正确的情况。我们训练的模型优于现有的决策模型，并在门控阈值下将显示建议中的pass@5提高了12到25个百分点。我们的代码可在 https://github.com/ntt-dkiku/llm-edit-recommendation 获取。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e预测用户在大语言模型生成工件后可能发送的编辑请求（编辑推荐任务）。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 将编辑请求预测形式化为编辑推荐任务，并基于WildChat-4.8M构建了EditRecBench基准。2. 引入基于决策模型的门控机制，过滤掉预测不正确的情况。3. 训练模型在门控阈值下将显示建议的pass@5提高了12至25个百分点。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要指出该任务在真实世界设置中存在本质上难以预测的情况，通过引入门控机制缓解了这一问题并提升了指标。但关于门控机制的具体技术细节、EditRecBench的详细评估指标（除pass@5外）、以及该模型在何种具体场景下失效的深入分析，这些局限和细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 人机交互\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e42. When Does Reasoning Help Entity Disambiguation? Small LLMs In-Domain and Under Shift（推理何时有助于实体消歧？小型大语言模型在域内和分布偏移下的表现）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.30334\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.30334\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eEntity disambiguation (mapping ambiguous mentions in text to entities in a knowledge base) is a foundational step in tasks such as knowledge graph construction, question answering, and information extraction. Recent work has applied LLMs to this problem, achieving stateof-the-art performance. Notably, reasoning LLMs have been shown to perform entity disambiguation in a true zero-shot fashion, generalizing across knowledge bases and domains. However, it is unclear whether this capability survives, or remains competitive, with smaller LLMs, where entity disambiguation has typically relied on reranking rather than reasoning. We ask when reasoning is worth its cost at small scale. We compare pointwise, listwise, and reasoning-based candidate-selection components within a classical coarse-to-fine entity disambiguation pipeline, across the classical, few-shot and true zero-shot settings. The reasoning paradigm is trained with distillation and reinforcement learning recipes. The benefit of reasoning grows with domain shift: negligible in-domain, decisive in the true zero-shot setting. We show that two distinct factors are at work: the reranker\u0026#x27;s uncertainty over the candidates locates where the paradigms disagree, while shift governs which is right when they do.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e实体消歧（将文本中的歧义提及映射到知识库中的实体）是知识图谱构建、问答和信息抽取等任务的基础步骤。最近的工作将大语言模型应用于该问题，取得了最先进的性能。值得注意的是，推理型大语言模型已被证明能以真正的零样本方式执行实体消歧，并在知识库和领域之间进行泛化。然而，目前尚不清楚这种能力在小型大语言模型中是否依然存在或保持竞争力，而在小型大语言模型中，实体消歧通常依赖于重排序而非推理。我们探讨在小型规模下推理何时值得其成本。我们在经典、少样本和真正零样本设置下，比较了经典粗到细实体消歧管道中的逐点、列表和基于推理的候选选择组件。推理范式通过蒸馏和强化学习方案进行训练。推理的收益随着领域偏移而增加：在域内可忽略不计，在真正零样本设置中起决定性作用。我们表明有两个不同的因素在起作用：重排序器对候选项的不确定性定位了范式之间存在分歧的地方，而偏移决定了当它们存在分歧时哪个是正确的。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e评估小型大语言模型在实体消歧任务中，推理范式相较于重排序范式在不同设置（经典、少样本、零样本）及分布偏移下的有效性与成本收益。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 比较了小型LLM在实体消歧中逐点、列表和基于推理的候选选择组件。2. 发现推理的收益随领域偏移增加：域内可忽略，真正零样本下起决定性作用。3. 揭示了重排序器的不确定性和领域偏移是决定不同范式表现差异的两个关键因素。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要提供了推理在域内和零样本下的对比结论，并指出了不确定性和偏移的作用。但关于小型LLM的具体参数量、蒸馏和强化学习的具体配方细节、以及在不同数据集上的具体量化指标（如准确率提升的具体数值），这些技术细节和实验数字摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e自然语言处理 / 知识图谱与信息抽取\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e43. When Every Rollout Fails: Splicing Learner-Conditioned Options into Long-Horizon Agent RL（当每次推演都失败时：将学习者条件选项拼接到长视界智能体强化学习中）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34777\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34777\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eGroup-based reinforcement learning with verifiable rewards often yields all-fail groups on long-horizon agent tasks: every sampled trajectory receives zero reward, leaving group-relative methods without a reward-based policy gradient. A common remedy supplies complete solutions from a stronger model, but full trajectories are expensive and expose the learner to long off-policy histories. We introduce SPLICE, which constructs local training targets from failed current-policy trajectories online. For each all-fail group, a proposal model selects a splice point in a current-policy trajectory and generates several bounded options from that point. We estimate each option\u0026#x27;s value using repeated current-policy continuations, convert positive estimates into a return-weighted local target, and fit the current policy on the options. We evaluate SPLICE across two policy families on two long-horizon agent tasks, Software Engineering with SWE-bench Verified and Deep Research with BrowseComp-Plus. SPLICE outperforms GRPO and full-trajectory guidance baselines in all four settings, improving over GRPO by 2.8--9.8 percentage points. On initially failed SWE tasks, it raises GRPO\u0026#x27;s graduation rate by 10.8 percentage points. Further experiments show that SPLICE improves performance while reducing costly proposal-model computation.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e具有可验证奖励的基于组的强化学习在长视界智能体任务上通常会产生全失败组：每个采样的轨迹都获得零奖励，使得基于组的方法缺乏基于奖励的策略梯度。一种常见的补救措施是从更强的模型提供完整的解决方案，但完整轨迹成本高昂，并使学习者暴露于长期的离策略历史中。我们引入了SPLICE，它在线从失败的当前策略轨迹中构建局部训练目标。对于每个全失败组，提议模型在当前策略轨迹中选择一个拼接点，并从该点生成几个有界选项。我们使用重复的当前策略延续来估计每个选项的价值，将正估计转换为回报加权的局部目标，并在这些选项上拟合当前策略。我们在两个策略族和两个长视界智能体任务（使用SWE-bench Verified的软件工程和使用BrowseComp-Plus的深度研究）上评估了SPLICE。SPLICE在所有四种设置中均优于GRPO和全轨迹指导基线，比GRPO提高了2.8到9.8个百分点。在最初失败的SWE任务上，它将GRPO的毕业率提高了10.8个百分点。进一步的实验表明，SPLICE在提高性能的同时减少了昂贵的提议模型计算。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e解决长视界智能体强化学习任务中，基于组的强化学习因所有采样轨迹失败（零奖励）而导致缺乏策略梯度的问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出SPLICE方法，在线从失败的当前策略轨迹中构建局部训练目标，通过提议模型选择拼接点并生成有界选项。2. 在SWE-bench Verified和BrowseComp-Plus任务上，SPLICE比GRPO提高2.8至9.8个百分点，并在最初失败的SWE任务上将GRPO毕业率提高10.8个百分点。3. 在提升性能的同时减少了提议模型的计算成本。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要详细说明了SPLICE的机制和性能提升数据。但关于两个策略族的具体名称、SPLICE减少计算成本的具体比例或数值、以及“毕业率”的具体定义和计算方式，这些技术细节和实验数字摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习与智能体\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e44. Collect for Coverage, Replay with Evidence: Adaptive and Efficient On-Policy Distillation for Long-Horizon Agents（为覆盖而收集，用证据重放：面向长视界智能体的自适应高效在策略蒸馏）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34756\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34756\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eFully online on-policy distillation (OPD) is costly for long-horizon agents because each update depends on fresh environment rollouts. Prefix replay offers an efficient alternative by sampling current-student responses from stored histories, reducing idle time for long-tail rollouts and allowing each collected trajectory to support multiple updates. However, our analysis of the complete prefix replay pipeline identifies two limitations in long-horizon settings. In trajectory collection, teacher-only trajectories miss student-induced histories, while broader history coverage can reduce teacher reliability. In trajectory reuse, fixed position-based schedules cannot identify critical decisions that may occur at any trajectory depth. We introduce CARE-OPD (Collect for coverAge, Replay with Evidence) to address both limitations. Student-seeded teacher completions and response-level confidence gating expand history coverage while filtering unreliable updates. Hindsight replay allocation then uses downstream execution evidence to select consequential turns. Across long-horizon tasks Software Engineering and Deep Research, CARE-OPD outperforms online OPD and prior prefix replay baselines. On SWE-bench Verified, it raises task success to 59.5% while reducing end-to-end training time by 45% and environment actions by 44% relative to asynchronous online OPD.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e完全在线的在策略蒸馏（OPD）对长视界智能体来说成本高昂，因为每次更新都依赖于新鲜的环境推演。前缀重放提供了一种高效的替代方案，通过从存储的历史中采样当前学生的响应，减少了长尾推演的空闲时间，并允许每个收集的轨迹支持多次更新。然而，我们对完整前缀重放管线的分析指出了长视界设置中的两个局限性。在轨迹收集中，仅教师的轨迹会错过学生引起的历史，而更广泛的历史覆盖会降低教师的可靠性。在轨迹重用中，固定的基于位置的调度无法识别可能发生在任何轨迹深度的关键决策。我们引入了CARE-OPD（为覆盖而收集，用证据重放）来解决这两个局限性。学生播种的教师补全和响应级置信度门控扩展了历史覆盖范围，同时过滤了不可靠的更新。然后，事后重放分配使用下游执行证据来选择具有重大影响的回合。在软件工程和数据研究的长视界任务中，CARE-OPD优于在线OPD和先前的前缀重放基线。在SWE-bench Verified上，它将任务成功率提高到59.5%，同时相对于异步在线OPD，将端到端训练时间减少了45%，环境动作减少了44%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e优化长视界智能体的在策略蒸馏（OPD）过程，解决完全在线OPD成本高以及现有前缀重放方法在轨迹收集和重用中的局限性。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出CARE-OPD，通过学生播种的教师补全和响应级置信度门控扩展历史覆盖并过滤不可靠更新。2. 利用事后重放分配和下游执行证据选择关键决策回合。3. 在SWE-bench Verified上任务成功率达59.5%，端到端训练时间减少45%，环境动作减少44%。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要明确了CARE-OPD的改进机制和显著的性能与效率提升数据。但关于“学生播种的教师补全”和“事后重放分配”的具体算法实现细节、置信度门控的具体阈值设定，以及“Deep Research”任务的具体名称或数据集细节，这些技术细节摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e人工智能 / 强化学习与模型蒸馏\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e45. DemoFoundry: Toward Scalable Photorealistic Robot Data with Coding Agents and Generative Rendering（DemoFoundry：利用编码智能体与生成式渲染实现可扩展的照片级真实机器人数据）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34671\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34671\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eScaling robot learning requires demonstrations that combine realistic visual observations with reliable action supervision. Simulation-based synthesis faces a substantial visual gap relative to real environments, while video-only generation struggles to maintain physically consistent interactions and provide aligned action labels. We present DemoFoundry, an automated framework that couples coding agents with generative rendering to synthesize photorealistic and physically grounded robot demonstrations. Coding agents both construct aligned real--proxy video pairs from existing robot episodes to train a video renderer and write executable interaction programs to generate new demonstrations. Given a scene reference and task instruction, an agent reconstructs task-relevant geometry and writes a control program without requiring target-task human demonstrations. Program execution in a physics simulator produces proxy videos with aligned robot states and actions. The video renderer translates these proxy videos into scene-consistent, photorealistic observations, reducing the need for detailed appearance modeling in each scene. Automated task-execution checks select successful trajectories for rendering and policy learning. Experiments show improved visual quality and action--video consistency. Policies trained on the generated demonstrations outperform raw-simulation training and approach the performance of training on an equal number of real demonstrations.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e扩展机器人学习需要结合逼真视觉观察与可靠动作监督的演示。基于模拟的合成与真实环境相比存在巨大的视觉差距，而纯视频生成则难以保持物理一致的交互并提供对齐的动作标签。我们提出了DemoFoundry，这是一个自动化框架，将编码智能体与生成式渲染结合，以合成照片级真实且物理基础的机器人演示。编码智能体既从现有的机器人情节中构建对齐的真实-代理视频对来训练视频渲染器，又编写可执行的交互程序来生成新的演示。给定场景参考和任务指令，智能体重建与任务相关的几何体并编写控制程序，而无需目标任务的人类演示。在物理模拟器中执行程序会生成具有对齐机器人状态和动作的代理视频。视频渲染器将这些代理视频转化为场景一致、照片级真实的观察，减少了对每个场景进行详细外观建模的需求。自动化的任务执行检查选择成功的轨迹进行渲染和策略学习。实验表明，视觉质量和动作-视频一致性得到了改善。在生成的演示上训练的策略优于原始模拟训练，并接近在同等数量的真实演示上训练的性能。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e合成结合逼真视觉观察与可靠动作监督的机器人演示数据，以解决模拟合成的视觉差距和纯视频生成的物理不一致问题。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e1. 提出DemoFoundry框架，结合编码智能体与生成式渲染合成照片级真实且物理基础的机器人演示。2. 编码智能体利用现有情节训练视频渲染器，并根据场景参考和指令生成控制程序，无需人类演示。3. 实验证明生成的演示在视觉质量和动作-视频一致性上有所提升，训练出的策略性能优于原始模拟训练并接近真实数据训练。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要展示了DemoFoundry的框架设计和定性或半定量的实验结果。但关于视觉质量和动作-视频一致性提升的具体量化指标、所使用的具体物理模拟器名称、以及“接近真实数据训练性能”的具体差距数值，这些实验结果和数字摘要未提供。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e机器人学 / 计算机视觉与模拟\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e46. Change the Base, Change the Game: Rethinking Pan-sharpening（改变基础，改变游戏：重新思考全色锐化）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.32002\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.32002\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eMany pan-sharpening (PS) networks reconstruct high-resolution multispectral (HRMS) images by adding learned residuals to 4times-interpolated low-resolution multispectral (LRMS) inputs, incorporating panchromatic (PAN) detail only through these residual corrections. This raises a simple question: Why start with a blurry base when sharp spatial detail is already available? We propose PanBase, a sharper multispectral starting point designed for more effective residual learning. Guided by physical sensor characteristics, PanBase combines PAN spatial detail with LRMS spectral information while enforcing consistency with the LRMS observations under sensor-specific blur. We construct this base without neural network training, estimating only nine coefficients per spectral band through closed-form calibration. Our PanBase can be easily integrated into existing backbones with a global residual skip through two simple changes: (i) replacing the skip base with PanBase and (ii) concatenating it as an additional input. Using each backbone\u0026#x27;s original training recipe and matched training budgets, PanBase improves most reduced- and full-resolution metrics on WorldView-3, QuickBird, and GaoFen-2, while achieving 4.4times faster training convergence on average. In zero-shot evaluation on WorldView-2, standalone PanBase achieves competitive reconstruction without target-sensor fitting or neural refinement.\u003c/p\u003e\u003c/details\u003e\n\u003cp\u003e\u003cb\u003e中文摘要翻译（AI 翻译）：\u003c/b\u003e\u003c/p\u003e\u003cp\u003e许多全色锐化（PS）网络通过将学习到的残差加到4倍插值的低分辨率多光谱（LRMS）输入上来重建高分辨率多光谱（HRMS）图像，仅通过这些残差校正来融合全色（PAN）细节。这引出了一个简单的问题：当锐利的空间细节已经可用时，为什么要从模糊的基础开始？我们提出了PanBase，一种更清晰的多光谱起点，旨在实现更有效的残差学习。在物理传感器特性的指导下，PanBase将PAN空间细节与LRMS光谱信息相结合，同时在传感器特定模糊下强制与LRMS观测保持一致。我们在没有神经网络训练的情况下构建了这个基础，仅通过闭式校准估计每个光谱带的九个系数。我们的PanBase可以通过两个简单的更改，通过全局残差跳跃轻松集成到现有主干中：（i）用PanBase替换跳跃基础，（ii）将其作为额外输入进行拼接。使用每个主干的原始训练配方和匹配的训练预算，PanBase提高了WorldView-3、QuickBird和GaoFen-2上的大多数降采样和全分辨率指标，同时平均实现了4.4倍更快的训练收敛。在WorldView-2的零样本评估中，独立的PanBase无需目标传感器拟合或神经细化即可实现具有竞争力的重建。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e基于摘要的解读（AI 生成，未读取全文）：\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e研究任务：\u003c/b\u003e全色锐化，即融合低分辨率多光谱图像和全色图像以生成高分辨率多光谱图像。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e核心亮点：\u003c/b\u003e提出PanBase作为更清晰的多光谱起点，结合PAN空间细节与LRMS光谱信息；无需神经网络训练，仅通过闭式校准估计每波段9个系数构建基础；易于集成到现有主干中；在WorldView-3、QuickBird和GaoFen-2上提升多数指标并实现4.4倍训练收敛加速；在WorldView-2上实现零样本竞争性重建。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e分析与局限：\u003c/b\u003e摘要表明PanBase通过改进残差学习的基础来加速收敛并提升指标。局限性方面，摘要未提供具体的失败案例、计算开销对比（除训练收敛速度外）或在其他未提及数据集上的表现，也未提及与最先进方法的全面对比细节。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e领域归类：\u003c/b\u003e计算机视觉 / 遥感图像处理\u003c/p\u003e\n\u003chr\u003e\n\n\u003ch3\u003e47. LiveVAE: Causal Window Attention Makes Efficient Streaming Video VAE（LiveVAE：因果窗口注意力实现高效流式视频VAE）\u003c/h3\u003e\n\u003cp\u003e\u003cb\u003e社区热度：\u003c/b\u003e 👍 2 Upvotes\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e论文链接：\u003c/b\u003e \u003ca href=\"https://arxiv.org/abs/2611.34912\"\u003earXiv 原文\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e摘要来源：\u003c/b\u003e \u003ca href=\"https://huggingface.co/papers/2611.34912\"\u003eHugging Face\u003c/a\u003e\u003c/p\u003e\n\u003cdetails\u003e\u003csummary\u003e查看原始摘要\u003c/summary\u003e\u003cp\u003eWhile video diffusion models have grown faster and increasingly streamable, the video VAE remains a primary latency bottleneck across interactive generation and editing pipelines. Existing VAEs and their acceleration methods rely mainly on heavy convolutions or full frame attention, and most focus only on decoding, leaving encoding costly for streaming conditional generation and editing. This raises a natural question: Do video VAE encoding and decoding actually require such global spatiotemporal modeling? By analyzing the effective receptive fields of pretrained vid
