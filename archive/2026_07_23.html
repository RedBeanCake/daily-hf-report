### 1. SLAI T-Rex: Full-Parameter Post-training of the DeepSeek-V4 Family on Ascend SuperPOD (SLAI T-Rex：昇腾 SuperPOD 上 DeepSeek-V4 家族的全参数后训练)
- **社区热度**: `👍 40 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.20145)
- **研究任务**: 大模型全参数微调与国产硬件适配
- **核心亮点**: 在华为昇腾集群上实现了 DeepSeek-V4 系列模型的全参数后训练，验证了国产算力支撑大规模全参数微调的可行性。
- **深度解析**: 针对 Ascend NPU 架构做了算子适配和并行策略优化，解决了显存带宽和通信瓶颈。方案没有用 LoRA 等参数高效方法，而是跑通了全参数流程，证明了在特定硬件优化下，国产池子能扛住大模型全参数训练的压力。
- **领域归类**: `[LLM, 训练基础设施, 国产硬件]`
---

### 2. Self Gradient Forcing: Native Long Video Extrapolation (自梯度强制：原生长视频外推)
- **社区热度**: `👍 27 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.20368)
- **研究任务**: 视频生成长度外推
- **核心亮点**: 提出一种梯度强制机制，让模型无需微调就能生成长度远超训练窗口的视频。
- **深度解析**: 传统方法生成长视频需要微调位置编码或注意力机制。这篇论文通过在推理阶段干预梯度 flow，强制模型保持长序列的一致性，解决了视频生成中常见的时序崩坏问题，实现了原生支持长上下文。
- **领域归类**: `[视频生成, 扩散模型, 长度外推]`
---

### 3. Beyond Relevance-Centric Retrieval: Rubric-Oriented Document Set Selection and Ranking (超越相关性检索：面向规则的文档集选择与排序)
- **社区热度**: `👍 22 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.19747)
- **研究任务**: 检索增强生成（RAG）
- **核心亮点**: 在传统的语义相似度检索之外，引入规则评分机制来筛选和排序文档，提升检索质量。
- **深度解析**: 单纯靠向量相似度容易召回相关性高但质量低的内容。该方案设计了一套评分规则（如来源可信度、信息密度），在检索阶段结合语义分和规则分进行重排序，确保喂给大模型的文档既相关又可靠。
- **领域归类**: `[RAG, 信息检索, NLP]`
---

### 4. An Exam for Active Observers (主动观察者考试)
- **社区热度**: `👍 13 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.16165)
- **研究任务**: Agent 感知能力评估
- **核心亮点**: 构建了一个基准测试，专门评估智能体在动态环境中主动观察和捕捉信息的能力。
- **深度解析**: 现有评测多关注任务结果，忽视观察过程。该基准设计了一系列需要主动切换视角、关注细节变化的任务，用来区分 Agent 是真正“看懂”了环境，还是只是被动接收数据。
- **领域归类**: `[Agent, 评估基准, 感知]`
---

### 5. Scaling Laws for Hypernetwork-Based Knowledge Injection in Large Language Models (基于超网络的大模型知识注入缩放定律)
- **社区热度**: `👍 9 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.19604)
- **研究任务**: 知识注入与效率优化
- **核心亮点**: 研究了使用超网络向大模型注入知识时，模型规模与效果之间的缩放规律。
- **深度解析**: 超网络是一种轻量级知识编辑手段。论文通过实验量化了主模型大小、超网络容量与知识保留率之间的关系，为在不全量微调的情况下高效更新模型知识提供了理论依据和参数选择建议。
- **领域归类**: `[LLM, 知识编辑, 缩放定律]`

### 6. Beyond Euclidean Clipping: Overcoming Exploration Collapse in LLM RL via Riemannian Isometric Policy Optimization (超越欧氏裁剪： via 黎曼等距策略优化克服 LLM RL 中的探索坍塌)
- **社区热度**: `👍 8 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.10169)
- **研究任务**: 强化学习人类反馈（RLHF）
- **核心亮点**: 用黎曼几何方法替代传统的梯度裁剪，防止强化学习训练中策略多样性丧失。
- **深度解析**: RL 训练后期容易出现策略坍塌，模型只输出几种安全回答。该方案将策略更新约束在黎曼流形上，保持更新步长在不同方向上的几何一致性，从而维持探索多样性，避免模型过早收敛到局部最优。
- **领域归类**: `[RLHF, 优化算法, 强化学习]`
---

### 7. Generalizable VLA Finetuning via Representation Anchoring and Language-Action Alignment ( via 表征锚定与语言 - 动作对齐实现通用 VLA 微调)
- **社区热度**: `👍 7 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.13429)
- **研究任务**: 视觉 - 语言 - 动作模型（机器人）
- **核心亮点**: 通过表征锚定和对齐技术，提升了机器人模型在不同任务间的泛化能力。
- **深度解析**: 针对机器人任务差异大、微调难泛化的问题，方案在视觉表征空间设置锚点，并将语言指令与动作空间强制对齐。这使得模型在面对新任务时，能更好地复用已学到的视觉 - 动作映射关系。
- **领域归类**: `[机器人, 多模态, VLA]`

- **深度解析**: 针对办公自动化场景，设计了格式调整、内容提取、跨文档编辑等任务。关键是每个任务都有明确的验证标准，能客观衡量 Agent 在处理长文档和复杂指令时的准确性和鲁棒性。

### 9. FVAttn: Adaptive Sparse Attention with Runtime Load Balancing for Video Generation (FVAttn：视频生成中带有运行时负载均衡的自适应稀疏注意力)
- **社区热度**: `👍 4 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.16190)
- **研究任务**: 视频生成效率优化
- **核心亮点**: 提出一种自适应稀疏注意力机制，并在运行时进行负载均衡，加速视频生成。
- **深度解析**: 视频生成计算量大主要在注意力模块。该方案动态稀疏化注意力矩阵，跳过不重要的帧间计算，同时设计了负载均衡策略防止某些计算单元空闲，显著降低了显存占用和推理延迟。
- **领域归类**: `[视频生成, 注意力机制, 推理加速]`

### 10. Trace: A Taxonomy-Guided Environment for Multidomain Visual Reasoning (Trace：多领域视觉推理的分类指导环境)
- **社区热度**: `👍 3 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.19790)
- **研究任务**: 视觉推理评测
- **核心亮点**: 构建了一个基于分类体系的环境，用于系统化评估模型在多领域的视觉推理能力。
- **深度解析**: 现有的视觉推理评测比较散。该工作建立了一个分类树（Taxonomy），涵盖不同难度和领域的视觉任务，让评测结果能具体定位模型是在哪个细分能力上不足，而不仅仅是给一个总分。
- **领域归类**: `[计算机视觉, 推理, 评测基准]`

### 11. SLPO: Scaling Latent Reasoning via a Surrogate Policy (SLPO：通过代理策略扩展潜在推理)
- **社区热度**: `👍 2 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.19691)
- **研究任务**: 大模型推理能力增强
- **核心亮点**: 引入代理策略来优化潜在空间中的推理步骤，避免直接优化复杂推理链的高成本。
- **深度解析**: 针对大模型隐性推理过程难以直接监督的问题，设计了一个 surrogate policy（代理策略）作为中间桥梁。该方法不直接训练推理路径，而是通过代理策略在 latent space 中引导推理扩展，实现了推理能力的 scaling，降低了训练开销。
- **领域归类**: [LLM], [Reasoning], [Reinforcement Learning]

### 12. G-MAD: A Game-Based Data Generation Framework for Multi-View RGB-T Aerial Object Detection (G-MAD：基于游戏的多视角 RGB-T  aerial 目标检测数据生成框架)
- **社区热度**: `👍 2 Upvotes`

- **深度解析**: 面向无人机多视角 RGB-T 检测任务，构建了一套基于游戏引擎的数据生成流水线。通过模拟真实物理环境和传感器特性，批量生产带标注的 RGB 与热成像配对数据，显著提升了检测模型在数据匮乏场景下的泛化能力。

### 13. Train the Model, Not the Reader: Decodability Supervision for Verifiable Activation Explanations (训练模型而非阅读器：用于可验证激活解释的可解码性监督)
- **社区热度**: `👍 1 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.20379)
- **研究任务**: 模型可解释性
- **核心亮点**: 不再训练单独的解释器，而是直接监督模型激活值，使其具备可解码性。
- **深度解析**: 传统方法通常训练一个外部“阅读器”来解释模型激活。本文反其道而行，在训练主模型时加入可解码性约束，迫使模型内部激活状态本身就包含可验证的语义信息，从而省去了解释器训练步骤，提高了解释的可靠性。
- **领域归类**: [Interpretability], [LLM], [Mechanistic Interpretability]
---

- **论文链接**: [点击跳转](https://arxiv.org/abs/2607.20417)

- **深度解析**: 针对传统 3D Gaussian Splatting 需要 per-scene 优化导致速度慢的问题，提出了前馈网络架构。引入自适应 Token 扩展机制，根据场景复杂度动态调整计算量，在保证重建质量的同时大幅减少了参数量和推理时间。
- **领域归类**: [3D Vision], [Graphics], [Gaussian Splatting]
