    <h1>前沿科研情报 - 2026-10-02</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. The Teacher Is a Direction, Not a Destination: Extrapolating RL-Induced Representation Residuals in On-Policy Distillation (教师是方向而非终点：在在策略蒸馏中外推强化学习诱导的表征残差)\n- **社区热度**: `👍 221 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36484)\n- **研究任务**: 改进在策略蒸馏（OPD），使学生模型能够超越教师模型，解决输出空间外推中因语言模型头各向异性衰减和采样token对数概率比注入噪声导致的训练不稳定问题。\n- **核心亮点**: 提出 RIDE（RL诱导方向外推）方法，直接在表征空间中外推强化学习引起的变化。该方法计算教师模型与其预强化学习检查点之间的残差，并将学生的隐藏状态向沿此残差位移超过教师的目标进行回归。\n- **深度解析**: 该方法在数学上等价于在二次惩罚下最大化由残差定义的线性方向奖励。在四个跨越不同规模、架构和预训练血统的基础/RL教师对上，RIDE 接近或超过了 RL 训练的教师，且是唯一平均表现达到此效果的方法。关于这四个基础/RL教师对的具体名称、具体的实验数字或其他未提及的技术细节，摘要未提供。\n- **领域归类**: [大模型训练, 知识蒸馏, 强化学习]\n---\n\n### 2. UniEvo-VL: An On-policy Self-Distillation Training Recipe for Multimodal Model Self-improvement (UniEvo-VL：一种用于多模态模型自我提升的在策略自蒸馏训练方案)\n- **社区热度**: `👍 181 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38721)\n- **研究任务**: 提升多模态模型的图像生成能力，利用模型自身的自我纠正反馈进行自我进化，无需依赖外部更大的教师模型。\n- **核心亮点**: 提出 UniEvo-VL 框架，让单一多模态模型同时充当教师和学生。学生只看原始问题，教师以特权自我批评为条件。通过最小化学生自身采样轨迹上两者去噪扩散分布的每状态差异来进行训练。\n- **深度解析**: 在 Qwen-image-2512 上，GenEval 从 0.747 提升至 0.808，GenEval2 Soft-TIFA 从 32.97 提升至 35.53。使用更强大的外部评判者（如 GPT5.6-Luna）表明具有强评判能力的多模态模型能预期更高的自我进化上限。关于具体的去噪扩散分布计算细节、其他未提及的实验数字或数据集，摘要未提供。\n- **领域归类**: [多模态大模型, 图像生成, 自我进化/自蒸馏]\n---\n\n### 3. False Frontiers: Diagnosing and Mitigating Co-Cheating in Self-Evolving Search Agents (虚假前沿：诊断和缓解自进化搜索智能体中的“协同作弊”现象)\n- **社区热度**: `👍 172 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39102)\n- **研究任务**: 解决自进化搜索智能体中提议者（生成问题）和解决者（回答问题）联合优化时出现的“协同作弊”问题，即两者在共享错误上达成一致，导致内部奖励提升但外部正确性未相应增长。\n- **核心亮点**: 提出 CrossFit 方法。将提议者的源文档分为 A 和 B 两组，从 A 生成的问题由仅在 B 上训练的辅助解决者评分，反之亦然。交叉拟合的协议决定提议者奖励，防止同源伪标签通过反馈解决者被复制。\n- **深度解析**: 使用 Qwen3.5-4B 和 Qwen3.5-9B 进行实验，多采样验证（MSV）将错误协议质量分别从 6.1% 降至 5.7%、从 8.8% 降至 7.2%；而 CrossFit 将其降至 3.0% 和 3.7%。在七个下游搜索基准上，CrossFit 在 4B 和 9B 规模上比标准耦联自进化平均提高 8.8 和 8.4 分，比 Search-R1 提高 8.7 和 7.8 分。关于七个下游搜索基准的具体名称、更详细的网络结构或训练超参数，摘要未提供。\n- **领域归类**: [AI 智能体, 搜索与检索, 强化学习/自进化]\n---\n\n### 4. Rethinking Latent Visual Reasoning: Grounding Latent Reasoning in Visual Evidence (重新思考潜在视觉推理：将潜在推理建立在视觉证据之上)\n- **社区热度**: `👍 138 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34563)\n- **研究任务**: 解决多模态大语言模型在潜在视觉推理中，潜在token对改变正确答案的图像扰动反应微弱（潜在证据-信用差距）的问题，为潜在推理提供视觉证据监督。\n- **核心亮点**: 提出 ReaLVR 方法，将视觉证据监督引入模型自身的自由运行潜在轨迹。通过对比正确答案和模型生成的错误答案来确定需要更强监督的位置，并对比相关和不匹配的视觉证据来指定需要保留的内容。\n- **深度解析**: 在 Qwen2.5-VL-7B 上实现了五个任务的最高平均分 63.7%，且该框架在高达 235B 的前沿模型规模上继续提供稳健的改进。分析显示潜在token位置对问题更敏感，与相关视觉区域的对齐更强。关于具体的五个任务名称、235B模型的具体架构细节或其他未提及的实验数字，摘要未提供。\n- **领域归类**: [多模态大模型, 视觉推理, 强化学习/GRPO]\n---\n\n### 5. AREX-2: Advancing Self-Improving Agents through Long-Horizon Reflective Tasks (AREX-2：通过长周期反思任务推进自我提升智能体)\n- **社区热度**: `👍 109 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38288)\n- **研究任务**: 提升大语言模型智能体在测试时迭代改进解决方案的自我提升能力，包括反思（产生比当前更好的解决方案）和长周期执行（保持多轮迭代有效）。\n- **核心亮点**: 假设反思和长周期执行能力是领域无关的，因此可以在适合监督的场景（如机器学习和算法编程任务）中学习。通过合成提供可验证反馈并支持持续迭代的长周期改进轨迹数据来训练智能体。\n- **深度解析**: 基于 Qwen3.8-27B 构建的智能体在 MLE-bench Lite 上达到 81.8，Frontier-CS 上达到 70.7；在深度研究任务中，BrowseComp 达到 84.0，HLE 达到 52.6，GAIA 达到 92.2，DeepSearchQA 达到 93.8，且随着轮次预算增加持续提升。关于 Qwen3.8-27B 的具体训练超参数、合成长周期轨迹数据的具体生成细节或其他未提及的实验数字，摘要未提供。\n- **领域归类**: [AI 智能体, 自我提升/反思, 长周期任务规划]\n---\n\n### 6. Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents (Mid-Harness：在终端智能体的模型与执行环境之间扩展动作)\n- **社区热度**: `👍 90 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39982)\n- **研究任务**: 提高终端智能体动作的可靠性和轨迹成功率，解决模型生成有用动作但执行不可靠的问题，通过在模型-执行环境边界分配测试时计算来实现。\n- **核心亮点**: 引入 Mid-Harness 方法，在转发执行前对候选动作进行采样和验证，同时保持生成器和执行环境不变。结合动作扩展和轨迹扩展，在更低的估计token成本下达到更高的成功率。\n- **深度解析**: 使用 TMAX-9B 作为生成器，在 TerminalBench-Lite 上，GPT-5.6 Sol 验证器在 8 个采样动作下将 Pass@1 从 50.00% 提升至 68.03%。当 TMAX-9B 同时作为验证器时，成对验证表现最好，将其响应蒸馏到 TMAX-9B 可进一步提升 Pass@1。关于 TMAX-9B 和 GPT-5.6 Sol 的具体架构细节、其他未提及的基准测试名称或具体数字，摘要未提供。\n- **领域归类**: [AI 智能体, 终端交互, 测试时计算/验证]\n---\n\n### 7. EvoDuet: Bilevel Co-Evolution of Web Searching and Task Solving for Scientific Discovery (EvoDuet：面向科学发现的网页搜索与任务求解的双层协同进化)\n- **社区热度**: `👍 84 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40340)\n- **研究任务**: 解决大语言模型在进化搜索中因缺乏外部知识而停滞，以及简单添加网页搜索工具在解决方案变化时返回相同页面的问题，实现解决方案和搜索查询的协同进化。\n- **核心亮点**: 提出 EvoDuet 双层优化方法。在固定模型参数的情况下，每次迭代通过检索门让 LLM 评估知识差距并选择检索、重用或不检索。内循环优化查询并根据预测的解决方案得分对文档排名；外循环从这些文档中并行生成候选并记录评估结果。\n- **深度解析**: 在 21 个优化任务上，使用 GPT-5.6-Luna 将 OpenEvolve 的归一化发现增益从 74.1% 提升至 78.0%，使用 Gemini-3.8-Flash 从 61.3% 提升至 82.3%。在八个任务上超越了之前报告的最佳分数（包括 Q20 和 Rosetta 上的 Swap Reduction）。关于 21 个优化任务的具体名称、双层优化的具体数学公式或其他未提及的实验数字，摘要未提供。\n- **领域归类**: [AI 智能体, 进化搜索, 科学发现/网页检索]\n---\n\n### 8. WorldAuditBench: Interactive 3D World Auditing with Multimodal Agents (WorldAuditBench：使用多模态智能体进行交互式 3D 世界审计)\n- **社区热度**: `👍 75 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40325)\n- **研究任务**: 开发高效流程以识别交互式 3D 模拟环境中的异常（如漂浮物体、可穿透墙壁等），评估多模态智能体耦合“动作”（导航搜索）和“视觉推理”（识别异常）的能力。\n- **核心亮点**: 引入 WorldAuditBench 基准测试，包含使用 Unreal Engine 5 和 Three.js 构建的 13 个环境中的 213 个异常任务，涵盖五个异常家族。评估了两种审计范式：基于 VLA 的探索后接基于 VLM 的异常识别，以及端到端 VLM 智能体。\n- **深度解析**: 在固定探索预算下，评估的五个前沿模型在两种范式下的成功率在 6.6% 到 42.3% 之间，远低于人类表现（83.4%）。关于五个前沿模型的具体名称、13 个环境的具体场景细节、五个异常家族的具体分类或其他未提及的实验数字，摘要未提供。\n- **领域归类**: [多模态智能体, 3D 环境交互, 基准测试/评估]\n---\n\n### 9. Learning Meta-Skills for Agent Harness Design in Test-Time AI4AI (在测试时 AI4AI 中学习用于智能体执行环境设计的元技能)\n- **社区热度**: `👍 58 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38143)\n- **研究任务**: 研究测试时 AI-for-AI（AI4AI），即构建者（Builder）如何在两个模型权重固定的情况下，为目标模型（Target）学习构建更好的执行环境（harness）。\n- **核心亮点**: 引入“元技能”（Meta-Skill）概念，即指定何时需要支持以及提供何种资源的原则。构建者从目标模型在开发集上的执行反馈中学习这些原则，然后使用冻结的技能库为未见任务构建执行环境。\n- **深度解析**: 在 Harness-Bench 和 NewtonBench 上，全库元技能比无技能构建的宏观平均性能提高了 8.95 个百分点，比直接将相同技能库交付给目标模型提高了 12.02 个百分点。关于 Harness-Bench 和 NewtonBench 的具体任务细节、元技能的具体内容示例或其他未提及的实验数字，摘要未提供。\n- **领域归类**: [AI 智能体, 测试时计算/环境设计, 元学习]\n---\n\n### 10. EVOKE: Eliciting World Knowledge in Agents for Transferable Decision-Making (EVOKE：在智能体中激发世界知识以实现可迁移的决策)\n- **社区热度**: `👍 50 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38334)\n- **研究任务**: 解决大语言模型智能体在未见环境中迁移能力差的问题，通过激发预训练期间内部化的世界知识，而不是额外训练世界模型，来提高多步决策的泛化能力。\n- **核心亮点**: 提出 EVOKE 后训练方法，通过在固定状态下提供目标多样性来施加压力。保持环境状态和交互历史固定，在不同目标下对相同的候选动作进行排序，迫使动作偏好发生改变，从而隐式激发策略的预训练世界知识来指导决策。\n- **深度解析**: 在三种骨干网络的多样化任务中评估了 EVOKE，展示了任务性能、未见环境泛化和数据效率的提升。关于三种骨干网络的具体名称、多样化任务的具体数据集名称、提升的具体实验数字或其他未提及的技术细节，摘要未提供。\n- **领域归类**: [AI 智能体, 强化学习/后训练, 泛化与迁移]\n---\n\n### 11. Thinking Outside the Box: Can Language Models Rely on External Guidance Selectively? (跳出框框：语言模型能有选择地依赖外部指导吗？)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39578)\n- **研究任务**: 研究语言模型在代理任务中如何平衡和利用外部指导（如人类设计的工作流），即培养模型“跳出框框”的能力——在有益指导中获益，同时能够覆盖和拒绝不可靠的指导。\n- **核心亮点**: 提出 Box^2-Bench 基准测试，通过改变工作流可靠性来隔离模型调节依赖的能力；提出两种训练策略（反事实监督微调和基于结果的强化学习）来提升开源模型对不可靠指导的鲁棒性；发现该能力可泛化到同伴纠错和抵御损坏的记忆等其他外部信息形式。\n- **深度解析**: 随着模型能力增强，不可靠的外部指导反而可能限制其执行。本文指出“有选择地依赖易错的外部信息”是代理可靠性的一个重要维度。通过 Box^2-Bench 发现，前沿模型在误导性指导下依然脆弱。通过反事实监督微调和基于结果的强化学习训练两个开源权重模型，模型能学会更好地利用有用工作流并抵抗错误指导。此外，这种选择性依赖能力可迁移至其他外部信息处理场景，证明其不仅体现在单一任务表现上。\n- **领域归类**: [Agent, 强化学习, 模型鲁棒性, 监督微调]\n---\n\n### 12. More Choices, Fewer Decisions: Ordinal-Scale Bias in JEV-like Direct-Decision Models (选择越多，决策越少：类JEV直接决策模型中的序数尺度偏差)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38827)\n- **研究任务**: 分析直接决策模型（如 JEV 和 KEV 模型）在使用用户提供的序数决策尺度时的可靠性，特别是探究模型是否忠实且充分地利用了该尺度。\n- **核心亮点**: 发现“序数尺度利用率偏差”（ordinal scale-utilization bias），即模型在决策阶段会压缩候选空间，未能充分利用提供的序数尺度；提出“目标 BA-LoRA”后训练方法，有效提升了模型对黄金标准的相对利用率，证明这种压缩是可通过训练修改的。\n- **深度解析**: 直接决策模型在分类和自动评估中很受欢迎，但可靠性不仅取决于准确率，还取决于是否忠实使用用户提供的序数尺度。研究发现，在 ANLI 等数据集中，模型倾向于将预测集中在 Neutral 等特定类别，导致有效黄金支持利用率低。随着候选尺度 K 的增加（从 2 到 14），利用率显著下降。通过针对性的 BA-LoRA 后训练，可将八个监督尺度上的利用率从约 47% 提升至 86%，表明这种偏差并非不可改变的架构限制，而是可以通过学习来修正的。\n- **领域归类**: [模型评估, 偏差分析, 参数高效微调, 自然语言处理]\n---\n\n### 13. Imagine3D-LLM: Teaching MLLMs to Imagine 3D Scenes Before Answering (Imagine3D-LLM：教导多模态大语言模型在回答前“想象”3D场景)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38177)\n- **研究任务**: 解决多模态大语言模型（MLLMs）在多视角图像 3D 世界推理中的挑战，提升其跨视角证据整合和 3D 空间理解能力。\n- **核心亮点**: 提出 Imagine3D-LLM，通过学习组装紧凑的 3D 高斯溅射（3D Gaussian Splatting）表示来“想象”场景，并基于此表示进行条件回答；仅对摘要 token 进行直接重建监督，即可诱导 LLM 底层图像特征产生更强的跨帧对应关系。\n- **深度解析**: 现有方法多试图通过注入细粒度像素级跨视角对应或融合 3D 几何基础模型特征来赋予 MLLMs 3D 感知能力，但与人类推理仍有差距。本文受人类空间推理启发（粗略识别物体、推断相对几何、组装粗略 3D 布局），在图像 token 后附加可学习的摘要 token，通过光度重建损失将其解码为紧凑的 3D 高斯溅射表示，并与标准的下一个 token 预测目标联合训练。结果表明，学习重建能将 3D 感知信号传播到整个模型，在多个空间推理和 3D 理解基准上持续优于先前方法，证明“想象场景”比“被告知像素级几何”更有效。\n- **领域归类**: [多模态大模型, 3D视觉, 空间推理, 计算机视觉]\n---\n\n### 14. RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement (RSIGame：具有递归自我改进能力的自主代理游戏开发)\n- **社区热度**: `👍 41 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39045)\n- **研究任务**: 解决自动游戏生成中，在达到可玩版本后难以可靠地改进生成游戏（如修复 bug、增加行为、泛化玩家交互）的问题。\n- **核心亮点**: 提出 RSIGame 框架，包含互补的局部和全局循环（局部探索-诊断-改进循环和全局质量跟踪循环）；将成功的开发经验通过训练内化到生成器中，使 Qwen3.8-27B 在 Godot 和 Phaser 上的得分超过 GPT-5.5 的单次生成得分，同时生成 token 数减少了 11 倍。\n- **深度解析**: 朴素的迭代优化容易过拟合少量测试用例，导致游戏脆弱且泛化能力差。RSIGame 通过局部循环广泛探索可执行游戏、诊断问题并进行基于证据的修改（利用不断演进的检查表），通过全局循环跟踪整体质量、保留最佳检查点并检测长期开发中的饱和或退化。此外，框架将开发经验内化到生成器中。在 140 个 GameCraft-Bench 任务、两个游戏引擎和五个生成器上的实验表明，RSIGame 在匹配的开发预算下持续提高游戏质量，经验内化显著提升了开源模型的表现并大幅降低了生成成本。\n- **领域归类**: [Agent, 代码生成, 自我改进, 游戏开发]\n---\n\n### 15. AIM: Agentic Idea Management for Automated Research (AIM：用于自动化研究的代理想法管理)\n- **社区热度**: `👍 40 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38445)\n- **研究任务**: 解决基于想法的自动化科学研究中，如何组织不断演变的科研想法、选择有前景的方向以及保持想法与实现之间对齐的核心挑战。\n- **核心亮点**: 提出全自主框架 AIM（Agentic Idea Manager），受贝叶斯优化启发，使用代理代理模型（Agentic Surrogate）和代理采集机制（Agentic Acquisition）来组织想法并指导选择；包含解决方案审计员（Solution Auditor）和资源规划器（Resource Planner）；在 AutoLab 基准上超越最强基线，且达到基线最佳性能的速度快达 3.1 倍。\n- **深度解析**: 前沿 LLM 正被用于通过迭代搜索自动化科研。本文区分了“想法驱动搜索”和“解决方案驱动搜索”。AIM 通过代理代理模型和采集机制管理发现的科研想法并引导选择，解决方案审计员维持想法与解决方案的完整性，资源规划器自适应分配剩余实验预算。实验表明，AIM 在系统优化和长期模型开发/CUDA 任务上显著优于基线，且墙钟时间大幅缩短。理论分析表明，显式的想法级分配使语义覆盖直接可控，且在许多合理替代方案中竞争性研究方向稀疏时，更广泛的覆盖变得更有价值。\n- **领域归类**: [Agent, 自动化科研 (AI for Science), 贝叶斯优化, 资源分配]\n---\n\n### 16. Unmask the State: When Does State Adaptation Matter for Masked Diffusion Language Models (揭示状态：状态适应何时对掩码扩散语言模型重要)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33355)\n- **研究任务**: 研究掩码扩散语言模型（MDMs）在推理过程中，何时以及如何选择性地改变去掩码（unmasking）策略，以应对不同生成状态下的适应机会。\n- **核心亮点**: 将 MDM 推理组织为五个轴（分数、基数、区域、承诺和规划），定义“适应机会”为最佳候选动作优于固定动作的单步效用优势；提出“选择性适应”策略，使用轻量级检测器识别高机会状态，在 LLaDA-8B 受限 JSON 填充任务中仅适应前 10% 的状态即可捕获 56.9% 的候选集 oracle 机会。\n- **深度解析**: MDMs 允许灵活的生成顺序，去掩码策略成为推理时的决策。现有方法在优先级、并行度、选择区域等方面各有不同，但尚不清楚这些选择在生成过程中何时应改变。本文通过“策略反转”研究这一问题，发现适应机会高度异质，某些机制下存在集中且可预测的单步增益。因此，均匀适应并非最优，选择性适应（通过验证提示校准的轻量级检测器识别高机会状态）更为有效。转换级结果表明，状态适应在选择性应用时最为有用。\n- **领域归类**: [生成模型, 扩散模型, 推理策略, 自然语言处理]\n---\n\n### 17. Agent Error Dataset: Scaling 50,000 Error--Diagnosis Pairs for Failure Analysis and Error-Aware Post-Training (代理错误数据集：扩展50,000个错误-诊断对以进行失败分析和感知错误的后训练)\n- **社区热度**: `👍 36 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40111)\n- **研究任务**: 从失败的 LLM 代理执行轨迹中提取错误信息，构建大规模错误-诊断数据集，并用于失败分析和感知错误的后训练，以提升代理的纠错和恢复能力。\n- **核心亮点**: 构建 Agent Error Dataset (AED)，包含来自 33 个环境、19 个工具链家族和 23 个策略模型的 50,228 个错误-诊断对；提出五阶段 Agentic Error-to-Training (AET) 管道；通过诊断和 actor 恢复的独立训练视图，显著提升了验证器通过率和模型与内部教师标签的精确步一致性。\n- **深度解析**: 不成功的 LLM 代理运行包含比最终奖励更多的信息。AED 保留了源轨迹和执行元数据，支持跨设置失败分析。AET 管道收集自然失败、生成诊断和修正建议，并对照记录证据进行检查。在 3,062 个匹配的重放对中，首次提议的修正将验证器通过率从 18.4% 提升至 51.1%。使用冻结的诊断发布，对 1,656 个源任务进行全诊断微调，使 Qwen3-8B 的精确步一致性从 47.2% 提升至 63.6%。此外，仅动作修复训练在 WebShop-lite 上的得分比仅成功训练高出 6.67 个百分点，证明利用错误经验进行后训练的有效性。\n- **领域归类**: [Agent, 数据集, 失败分析, 模型微调]\n---\n\n### 18. LANTERN: Illuminating Hidden Mathematical Knowledge in Language Models (LANTERN：照亮语言模型中隐藏的数学知识)\n- **社区热度**: `👍 35 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32264)\n- **研究任务**: 探索利用语言模型内部表示来识别有前景的数学联系（如整数序列之间的关系），从而辅助数学发现。\n- **核心亮点**: 提出 LANTERN 管道，使用预训练模型激活的分类器对候选关系进行排序，随后进行分阶段过滤、假设生成、可执行验证和分析检查；在 OEIS（整数序列在线百科全书）中，从 10,000 个频繁引用的序列的 5000 万对中发现了 62 个已验证的关系，其中 4 个为全新发现。\n- **深度解析**: 尽管语言模型现在可以证明定理，但决定研究哪些问题仍由人类完成。LANTERN 旨在通过模型内部表示自动发现有价值的数学联系。该管道首先对预训练模型的激活值训练分类器以排序候选关系，然后经过过滤、生成假设、可执行验证和分析检查。在 OEIS 数据集上，LANTERN 在 8 小时内完成了包括分类器训练、候选排序、过滤和验证在内的端到端过程，发现了 62 个没有现有 OEIS 交叉引用的已验证关系，其中 13 个值得展示，9 个具有信息量或洞察力，4 个为完全新颖的发现。\n- **领域归类**: [AI for Science, 数学发现, 模型内部表示, 知识发现]\n---\n\n### 19. It's Not What the Image Shows: Irrelevant Context Destabilises VLM Judges Without Informing Them (重要的不是图像展示了什么：无关上下文使VLM评判者不稳定且未提供信息)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37863)\n- **研究任务**: 评估视觉语言模型（VLMs）作为人类标注者替代品时的可靠性，测试无关图像上下文（对齐或误导）对 VLM 评判者决策稳定性的影响。\n- **核心亮点**: 引入 MIST（误导性图像压力测试），包含 200 个英语句子及不同图像条件；发现无关图像的存在（无论对齐还是误导）会改变 VLM 的标签决策，但决策并未向图像所示意义移动，且与人类标注者的一致性未变，表明 VLM 评判者的不稳定性源于“图像的存在”而非“图像的内容”。\n- **深度解析**: VLMs 越来越多地用于替代人类标注，因此可替代性测试必须反映模型本身而非偶然的评估条件。MIST 测试要求仅根据句子决定标签，图像不应改变答案。结果显示，对齐图像改变了 20.5% 的标签，误导图像改变了 19.4%，但只有 37% 的改变标签向图像所示意义移动。这表明，移动评判者决策的是“那里有一张图像”这一事实，而不是图像的具体内容。因此，可替代性裁决不仅描述了模型，还描述了评估配置。这一发现强调了在评估 VLM 时控制无关上下文的重要性。\n- **领域归类**: [多模态模型, 模型评估, 鲁棒性/压力测试, 视觉语言模型]\n---\n\n### 20. Breaking Babel: A Self-Evolving Multi-Agent System for Long-Form Subtitle Translation (打破巴别塔：用于长篇字幕翻译的自进化多智能体系统)\n- **社区热度**: `👍 30 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38660)\n- **研究任务**: 解决长篇字幕翻译中需要跨剧集或系列进行语篇和文化语境推理，同时保持术语和风格一致性的挑战。\n- **核心亮点**: 提出 SMART（自进化多智能体长篇字幕翻译系统），在测试时训练期间构建持久系列级记忆，通过动态路由和 MoA 层进行翻译，并利用评判-优化循环更新智能体提示和路由策略；引入 Subtitle Arena 基准和 SubMQM 评估框架；在 15 个翻译方向上取得最佳 MQM 总分，并在 MuSC 基准上取得最佳模型和人类评估结果。\n- **深度解析**: 现有单 LLM 方法多为句子级，多智能体系统常使用不适应场景复杂度的静态工作流。SMART 在测试时训练阶段构建系列级记忆，通过动态路由和混合智能体（Mixture-of-Agents）层结合术语验证、字幕约束验证和上下文检索工具进行翻译。评判-优化循环对候选项打分，并利用文本批评更新智能体提示和路由策略，无需重新训练底层 LLMs。引入的 Subtitle Arena 涵盖 14 种流派、15 个目标语言环境等，SubMQM 包含 7 个维度和 19 个错误类别。SMART 在所有方向上均取得最佳表现，平均惩罚减少 6.9%，并在公开 MuSC 基准上获得 4.50/5 的最高人类评估得分。\n- **领域归类**: [Agent, 机器翻译, 多智能体系统, 测试时训练]\n---\n\n### 21. TERRA: Terrain-Aware Reconstruction, Retargeting and Control for Musculoskeletal Locomotion (TERRA：面向肌肉骨骼运动的感知地形重建、重定向与控制)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38653)\n- **研究任务**: 解决肌肉骨骼智能体在复杂非平地地形上的运动控制问题，实现从纯运动学轨迹到肌肉驱动控制的端到端管线。\n- **核心亮点**: 提出 TERRA 管线，结合地形先验、接触估计和负自由空间证据来恢复任务相关的支撑几何；在重定向阶段综合考虑解剖学、肌腱连续性和接触约束；利用五个数据集生成的运动-地形对，在 9.4 小时的多样化运动数据上成功训练出单一的肌肉驱动控制策略。\n- **深度解析**: TERRA 通过融合地形先验与接触估计来恢复支撑几何，并在重定向中引入严格的解剖与肌腱约束。该管线成功将无场景的运动数据转化为复杂非平地地形上的肌肉驱动运动。在重建、重定向和留一法跟踪基准测试中，TERRA 显著提高了地形准确性，大幅减少了解剖学和交互违规，并在支持的各类地形中实现了最高的任务完成率。\n- **领域归类**: [机器人学, 强化学习, 肌肉骨骼建模]\n---\n\n### 22. DC-SAE: Deep Compression Semantic Autoencoder for Faster Diffusion Convergence (DC-SAE：用于加速扩散模型收敛的深度压缩语义自编码器)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39222)\n- **研究任务**: 解决高压缩率图像生成中重建保真度与生成效率之间的权衡问题，旨在加速扩散模型的训练收敛。\n- **核心亮点**: 提出 DC-SAE（解耦紧凑语义自编码器），包含两个关键组件：宏观架构设计利用语义编码器实现更高的压缩比；像素级编码器则负责保留低级细节，从而确保高保真的图像重建。\n- **深度解析**: 在 ImageNet 512×512 数据集上，DC-SAE 实现了 32 倍空间压缩，PSNR 达到 29.79，gFID 为 3.37，在 PSNR 和 gFID 上分别比先前的 SOTA 高压缩基线 DC-AE 高出 13.5% 和 54.9%，同时保持相当的吞吐量并加快扩散模型训练收敛。在 1024×1024 分辨率的文本到图像生成中，使用 DC-SAE 的 16 亿参数 DiT 模型在 GenEval 上达到 0.84，在 DPG-Bench 上达到 86.007。\n- **领域归类**: [计算机视觉, 图像生成, 扩散模型]\n---\n\n### 23. DyRAD: Radar Novel View Synthesis for Dynamic Driving Scenes (DyRAD：面向动态驾驶场景的雷达新视角合成)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39841)\n- **研究任务**: 利用雷达传感器数据重建动态驾驶场景，支持自动驾驶系统的闭环评估，合成超出原始轨迹的观测数据。\n- **核心亮点**: 提出 DyRAD，使用静态背景反射器和运动跟踪的动态点反射器对动态驾驶场景进行建模，渲染完整的距离-方位-多普勒（RAD）张量；通过固定的解析点扩散函数（PSF）渲染反射器，防止传感器引起的信号扩散被错误地烘焙到场景几何表示中。\n- **深度解析**: DyRAD 将反射器速度从物体轨迹中导出并投影到视线上，使多普勒效应既作为渲染输出，又作为轨迹的监督信号。这种分离机制实现了零样本传感器配置迁移，允许在不同雷达规格下渲染同一重建场景而无需重新拟合。在 RADIal 数据集上，DyRAD 在参考检测到的物体中恢复了 90.7% 的雷达检测，而最强基线仅为 26.9%。\n- **领域归类**: [自动驾驶, 3D视觉, 雷达信号处理]\n---\n\n### 24. Systematically Exploring the Capabilities of GPT-6 Astra as Embodied Policies (系统探索 GPT-6 Astra 作为具身策略的能力)\n- **社区热度**: `👍 26 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38537)\n- **研究任务**: 评估 GPT-6 Astra 作为通用具身策略在直接控制、与学习策略合作以及反馈驱动适应方面的综合能力。\n- **核心亮点**: 在夹爪操作、灵巧操作、移动操作、导航、运动、人形运动操作六个领域对 Astra 进行全面评估；揭示了 Astra 在任务决策上表现优异，但在可靠的底层物理控制方面仍存在差距；并量化了推理延迟对实际控制系统的严重限制。\n- **深度解析**: 实验表明，Astra 在夹爪操作中与 π0.5 混合控制达到 48% 成功率，灵巧操作中达到 50%，移动操作中达到 38.7%。在导航中，RxR 指令跟随成功率达 92%，HM3D 物体搜索达 82%。在人形运动操作中，在 30 个任务中的 13 个上超过基线。然而，在运动中密集参考生成仍不可靠。推理延迟严重受限，策略辅助和直接控制在 50 个实例中分别消耗 6.248 亿和 11.32 亿个 token；30 秒的运动运行需要 250 次模型调用，平均每次耗时 39.86 秒。\n- **领域归类**: [具身智能, 机器人控制, 大语言模型]\n---\n\n### 25. ThinkV2V: Unleashing the Reasoning Capability of MLLMs for Instruction-Guided Video Editing (ThinkV2V：释放多模态大语言模型的推理能力以进行指令引导的视频编辑)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38541)\n- **研究任务**: 解决现有方法在指令引导视频编辑中，将多模态大语言模型（MLLMs）仅作为语义编码器，导致在处理需要因果或语义推理的隐式编辑时表现不佳的问题。\n- **核心亮点**: 提出 ThinkV2V 推理驱动框架，在视觉生成前显式激活 MLLM 的思考；基于 MLLM-to-DiT 架构将思考转化为精细的条件信号；配备渐进式课程训练和推理时思考缩放策略；构建了 ThinkV2V-150K 数据集和 ThinkV2V-Bench。\n- **深度解析**: ThinkV2V 通过渐进式课程训练（从基础编辑逐渐培养到推理密集型案例）和推理时思考缩放（迭代优化候选提示并选择最可靠的）来更好地激发挑战性编辑场景中的推理能力。实验结果表明，其 5B 规模的 DiT 模型在复杂和标准编辑场景中均取得了 SOTA 性能，大幅超越了更大的 10B 规模基线。摘要未提供具体的量化指标数字。\n- **领域归类**: [计算机视觉, 视频编辑, 多模态大模型]\n---\n\n### 26. LoopVL: Recurrent Visual Intelligence (LoopVL：循环视觉智能)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38426)\n- **研究任务**: 研究循环 Transformer（Loop Transformers）是否能有效扩展到视觉-语言模型（VLMs）中。\n- **核心亮点**: 提出 LoopVL，结合模块循环（Module-Loop）和模型循环（Model-Loop）计算，通过共享模块迭代更新统一的视觉-语言状态；从零开始通过语言预训练、多模odal训练和后训练进行完整训练。\n- **深度解析**: LoopVL 在多模态理解和视觉推理基准测试中优于一系列同等规模及更大的非循环模型。研究还观察到 LoopVL 中的“视觉顿悟时刻”（Visual Aha Moments），其特征是跨循环的视觉注意力发生显著转变。该工作为循环视觉-语言建模提供了实践证据，并直观地展示了共享参数如何支持在持续演变的视觉-语言状态上进行更深层次的多模态计算。摘要未提供具体的基准测试名称和量化数字。\n- **领域归类**: [多模态大模型, 视觉语言模型, 模型架构]\n---\n\n### 27. OSWorld-Science: A Benchmark of Computer Use Agents for Learning and Using Scientific Software (OSWorld-Science：用于学习和使用科学软件的计算机使用智能体基准测试)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39903)\n- **研究任务**: 为基于视觉语言模型（VLMs）的计算机使用智能体提供一个基准测试和评估环境，以研究科学领域的计算机使用情况。\n- **核心亮点**: 引入 OSWorld-Science，包含 12 个 VLM 和 146 个高质量任务，涵盖分子绘制、病理图像分析、统计计算和物理模拟等工作流；采用基于执行的特定任务评估器检查应用状态和生成的工件，并对不完整结果给予部分分数；提供集成模型适配器、交互循环控制和轨迹记录的特殊工具链。\n- **深度解析**: 任务通过专家提案和迭代的人机协同设计开发，选择标准基于科学价值和难度。结果表明，即使配备强大工具链的当前 SOTA VLM 在解决科学领域的关键问题时仍面临挑战。研究还分析了多语言、推理工作量、上下文长度等因素对基准测试结果的影响，并得出了协助未来发展的若干重要结论和方向。\n- **领域归类**: [AI Agent, 基准测试, 科学计算]\n---\n\n### 28. PivotOPD: Learning to Recover from Pivotal Mistakes in Multi-Turn Agents (PivotOPD：学习从多轮智能体的关键错误中恢复)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40285)\n- **研究任务**: 解决多轮交互中语言智能体因错误动作导致状态改变、错误在多轮中累积的问题，训练智能体预防并从关键错误中恢复。\n- **核心亮点**: 提出 PivotOPD 在策略蒸馏框架，联合训练学生模型预防关键错误并从其产生的状态中恢复；在关键错误处，教师模型提供黄金动作并在随后几轮命名恢复动作；使用反向 KL 进行预防性蒸馏，使用正向 KL 进行恢复性蒸馏。\n- **深度解析**: 初步实验发现，在三个 Qwen3 模型（8B 到 235B）中，超过一半的失败展开包含关键错误，且通常发生在早期，但这些错误通常是可恢复的。在 ALFWorld、WebShop 和基于搜索的 QA 上对抗 13 个基线，PivotOPD 在 Qwen3-1.7B 和 Qwen3-8B 学生上取得了最强的平均性能，在 ALFWorld 上比最强基线提高了 +5.5%（1.7B 学生）。在软件工程领域，PivotOPD 将 Nemotron-3.5 学生在 SWE-Bench Verified 上的解决率提高了 +3.2%。\n- **领域归类**: [AI Agent, 强化学习, 模型蒸馏]\n---\n\n### 29. BiasReducer: Adaptive Bias Mitigation for Reward Models (BiasReducer：奖励模型的自适应偏差缓解)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32720)\n- **研究任务**: 解决奖励模型偏向长度或置信度等表面属性，导致大语言模型生成高分但不正确响应的问题，提出一种轻量级框架来编辑奖励模型并减轻偏差。\n- **核心亮点**: 提出 BiasReducer，仅编辑线性奖励头并为每个新数据集选择相关编辑；使用稀疏自编码器（SAE）风格的编码器学习奖励模型对哪些属性敏感；学习如何调整奖励头以减少对每个属性的依赖；对新数据集，按属性对奖励分数的影响进行排名，选择相关属性并相应编辑奖励模型。\n- **深度解析**: 在五个奖励模型上，BiasReducer-M 在三个基准测试上平均提高了 8.3、18.0 和 6.9 个百分点，优于两个基于训练的基线。这些收益转移到下游，减少了不必要的冗长和谄媚，同时保持了可相当的判断质量。摘要未提供这三个基准测试的具体名称。\n- **领域归类**: [自然语言处理, 大语言模型对齐, 奖励模型]\n---\n\n### 30. CUA-SWE: When Computer-Use Agents Meet Visual Software Engineering (CUA-SWE：当计算机使用智能体遇上视觉软件工程)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32600)\n- **研究任务**: 探索计算机使用智能体在软件工程中的应用，研究智能体如何结合源代码执行、应用截图和图形交互来生成经过验证的软件更改。\n- **核心亮点**: 引入 CUA-SWE，一个用于计算机使用软件工程的基准测试、环境和评估管线；跨越四个软件工程领域，要求智能体在同一任务中修改代码和配置、执行命令、与运行中的软件交互并检查视觉反馈；每个任务包含确定性的、特定任务的测试，以验证生成的软件是否满足要求。\n- **深度解析**: CUA-SWE 不仅研究 GUI 反馈如何支持诊断和修复，还探讨当所需规范或操作信息仅通过运行中应用程序的视觉界面可用时，智能体是否能完成软件工程任务。评估表征了前沿智能体如何结合源代码级执行与应用截图及图形交互。研究检查了不同领域和任务信息需求下的性能，以及与成功修复相关的开发行为。摘要未提供具体的成功率或量化数字。\n- **领域归类**: [AI Agent, 软件工程, 计算机使用]\n---\n\n### 31. Scaling Laws for Looped Mixture of Experts (循环混合专家模型的缩放定律)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40316)\n- **研究任务**: 联合建模循环（recurrence）和稀疏性（sparsity） alongside 模型规模与数据，提出首个同时考虑这两者的缩放定律（Loop Scaling Laws），以指导在计算和内存约束下设计循环 MoE 模型。\n- **核心亮点**: 提出了 Loop Scaling Laws，其核心是一个有界的、以稀疏性为条件的循环映射；在万亿 token 规模下，基于该定律推导出的循环 MoE 在匹配训练计算量时，其推理能力可匹配参数量大 2 倍的非循环 MoE。\n- **深度解析**: 循环 Transformer 和 MoE 是高效缩放的互补路径（循环增加计算深度，MoE 扩大总容量），但现有定律孤立建模这两者。本文提出的定律能比现有替代方案更准确地预测循环模型的 held-out loss，并能恢复标准的 dense 和 MoE 缩放定律作为特例。实验表明，稀疏性带来约 3 倍的活跃参数效率，循环带来约 2 倍的总参数推理效率，两者联合扩展进一步推高了性能前沿。\n- **领域归类**: [大模型架构, 缩放定律, 混合专家模型 (MoE)]\n\n---\n\n### 32. MILO: Automated Harness Discovery via Orchestrated Multi-Agent Evolution (MILO：通过编排多智能体进化实现自动化 Harness 发现)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38349)\n- **研究任务**: 自动化发现和进化 AI 智能体系统的 Harness（控制执行和环境交互的组件），以优化长视野任务的性能，解决人工设计 Harness 成本高且需随模型变化反复调整的问题。\n- **核心亮点**: 提出 MILO 框架，结合分层谱系记忆、每岛变异智能体和编排器；在 Terminal-Bench 2.1 等基准上超越 8 种 SOTA harness 和 6 种搜索方法；在 EinsteinArena 上改进了多个数学问题的已知最优上界。\n- **深度解析**: 现代智能体系统的 Harness 设计对长视野性能影响巨大，但其组合搜索空间庞大。MILO 通过共同进化 agent harness 和发现策略来解决此问题。它利用被拒绝的突变作为负证据，通过谱系嫁接和物种形成等机制自适应调整搜索。实验证明，使用 Opus 4.8 时，MILO 在 Terminal-Bench 2.1 上达到 86.1 ± 2.0% 的解决率（超越官方榜首的 83.8 ± 2.3%），且 token 消耗减少 26%；在 EinsteinArena 上刷新了 Erdős 最小重叠等问题的上界。\n- **领域归类**: [AI 智能体, 自动化搜索, 多智能体系统]\n\n---\n\n### 33. I Have a Stream: Making Self-Supervised Learning Work on Continuous Video (我有数据流：让自监督学习在连续视频上发挥作用)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40333)\n- **研究任务**: 研究在连续视频流（按时间顺序消耗帧，使用严格的滑动窗口批次，无全局重排或多轮重放）上的自监督学习，使其更贴近婴儿视觉发育的真实过程。\n- **核心亮点**: 构建了 95 小时的城市步行视频数据集 WT++；提出 StreamMAE，通过流感知正则化和运动偏向裁剪选择，在流式设置下匹配标准 i.i.d. MAE 的性能，且性能随数据流增长呈正向扩展。\n- **深度解析**: 标准自监督学习训练管道（独立采样和全局洗牌）与连续视频流不符。研究发现对比和蒸馏方法在流式设置中表现挣扎，MAE 更鲁棒但仍有差距。主要挑战并非批次间的高相似度，而是批次内的高相似度（帧近乎重复）。StreamMAE 保留了 MAE 核心重建目标，通过流感知正则化和运动偏向裁剪缓解此问题。实验表明，随着预训练流从 12 小时增长到 95 小时，StreamMAE 性能持续提升，并保持与 ImageNet 预训练 MAE 的竞争力。\n- **领域归类**: [计算机视觉, 自监督学习, 视频理解]\n\n---\n\n### 34. Physis-Lang: Self-Evolving Language as a Physical Representation for Video World Model (Physis-Lang：将自进化语言作为视频世界模型的物理表示)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40358)\n- **研究任务**: 解决视频世界模型生成的视频在视觉上合理但违反基本物理原理的问题，通过自进化的物理语言表示来提升视频生成的物理合理性。\n- **核心亮点**: 提出 Physis-Lang 框架，将物理语言作为可优化的共享表示；构建 PhysCapBench 评估物理过程描述；基于开源 Cosmos3-Nano 骨干网络的增强模型超越了领先的闭源 Veo 3.1 模型。\n- **深度解析**: 现有方法通常假设自然语言不足以表示生成所需的物理知识，从而引入额外的视觉或数值信号。本文重新审视该假设，使用描述实体、原因、相互作用、控制原则、时间演化和效果的语言来表示物理过程。通过智能体循环迭代分析原子断言级别的错误并细化指令，并将模型缺陷转化为文本描述以检索覆盖缺失物理过程的多样化视频。在四个物理视频基准上证明了一致的改进，证明了纯语言表示在物理常识注入上的巨大潜力。\n- **领域归类**: [视频生成, 世界模型, 物理常识]\n\n---\n\n### 35. DuoOPD: Learning from Joint Teacher-Student Outcomes for Multi-Task On-Policy Distillation (DuoOPD：从联合师生结果中学习多任务在策略蒸馏)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33711)\n- **研究任务**: 改进在策略蒸馏（On-policy distillation, OPD），解决教师模型在学生已答对的问题上可能失败，以及不同任务中成功率不同的问题，从而更有效地利用师生反馈。\n- **核心亮点**: 提出 DuoOPD，利用学生结果设定反馈方向，联合师生结果决定教师支持方式；在 Qwen3 和 Llama 上，平均宏观准确率比 OPD 分别提升 2.58 和 5.98 个百分点。\n- **深度解析**: 传统 OPD 忽略师生各自的成败结果，平均而言甚至会压低学生的正确响应。DuoOPD 设计了一套单一规则覆盖四种结果组合：当仅教师成功时，其验证答案作为评分学生失败响应的上下文；当仅学生成功时，任务内共享权重强化整个响应。消融实验表明，仅基于结果的方向设定效果接近基线，而联合结果设计提供了大部分增益，且无需针对特定任务进行设置。\n- **领域归类**: [大模型微调, 知识蒸馏, 强化学习/对齐]\n\n---\n\n### 36. Rubric Rewards from Item Response Theory (基于项目反应理论的评分标准奖励)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35646)\n- **研究任务**: 解决在强化学习中，将基于评分标准（Rubrics）的多个评判结果聚合为标量奖励时存在的问题（如不同评判模式得分相同、固定分数无法区分当前 rollout 等），并减少评判请求次数。\n- **核心亮点**: 提出 Rubric Response Theory (RRT)，使用双参数项目反应模型将评判模式视为标量质量的证据；在医学、科学等难/极难标准上比 GRPO 高出 2.8 到 5.6 分；在减半评判预算下仍能保持与全量评判的 GRPO 相当的性能。\n- **深度解析**: 许多语言任务依赖评分标准，传统方法直接相加满足标准的分数，导致聚合问题且需要大量评判请求。RRT 假设评分标准是共享目标的单调指标，通过似然得分最大化质量的局部信噪比。其响应参数网络（RPN）读取提示和标准文本预测难度和区分度，并在训练中使用在线期望最大化进行更新。结合自适应 Fisher 选择，RRT 能在大幅减少 judge 请求的同时，提供比 GRPO 更优的奖励信号。\n- **领域归类**: [强化学习, 奖励模型, 评估与对齐]\n\n---\n\n### 37. Synthetic Pre-pretraining Survives Scale, but Not as a Grammatical Prior (合成预预训练在规模化下依然有效，但并非作为语法先验)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39827)\n- **研究任务**: 探究在更大规模（高达 7B 参数，100B token 预算）和更真实的预训练数据混合下，合成非自然语言数据的预预训练（PPT）是否依然有效，以及其收益是否源于语法先验。\n- **核心亮点**: 证明 PPT 在规模化下依然有效（如在 3B 规模下节省至少 21B 预训练 token）；但推翻了 prior work 的结论，发现收益并非来自语法先验，而是来自改善长程检索（long-range retrieval）的 PPT 任务。\n- **深度解析**: 先前工作认为 PPT 提高了 token 效率是因为学到了转移到自然语言语法的结构归纳偏置（语法先验），但仅在 1B 参数和 2B token 以下测试。本文在 5 种 PPT 任务、4 种数据混合、4 种参数规模下进行全面研究。结果表明，下游性能增益并不一致地与语法可接受性对齐，而是源于提升长程检索能力的任务。PPT 性能增益对预训练数据混合的组成具有鲁棒性，仅在缺少网络文本时减弱。\n- **领域归类**: [大模型预训练, 数据工程, 缩放定律]\n\n---\n\n### 38. RoboCoach: World Models as Active Coaches for Compositional Robot Skills (RoboCoach：世界模型作为组合机器人技能的主动教练)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39685)\n- **研究任务**: 解决长视野机器人操作中，通过额外的端到端演示来改进技能组合成本高昂的问题，实现一个能决定“教什么”和“在哪里应用监督”的实用自我改进系统。\n- **核心亮点**: 提出 RoboCoach 框架，利用想象失败来指导演示请求和专家更新；在 Franka 和 AgileX 平台上，仅用 150 个额外子任务演示，成功率分别从 13.3% 提升至 75.0% 和从 40.0% 提升至 83.8%。\n- **深度解析**: 系统包含 Route-Imagine-Diagnose-Improve (RIDI) 循环，在共享的动作条件世界模型 COACHWORLD 中执行可重用的技能专家，并使用进度判断器记录第一个未能完成的子任务。聚合记录决定获取哪些子任务演示以及更新哪些专家适配器。实验表明，想象和部署的成功率高度相关（rho = 0.840），且被教练的专家能转移到未见过的组合任务中（平均成功率 35.0%，而统一获取演示的基线为 0%），证明了世界模型作为主动教练的有效性。\n- **领域归类**: [机器人学, 强化学习, 世界模型]\n\n---\n\n### 39. The Low-Rank Structure of VLA Reinforcement Learning (VLA 强化学习的低秩结构)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34599)\n- **研究任务**: 探究强化学习（RL）如何重塑视觉-语言-动作（VLA）模型的策略，特别是 RL 在参数空间中编码学习信号的机制。\n- **核心亮点**: 发现 RL 在 VLA 模型中诱导的参数更新秩显著更低，且高度集中在动作专家的 Timestep Modules 中；通过沿 shift 更新方向进行 steering，可以在不增加 RL 训练的情况下进一步提升策略性能。\n- **深度解析**: 研究表明，RL 使 Timestep Modules 专门用于 rollout 期间使用的离散去噪时间步，这种离散时间步训练是低秩更新的基础。在这些模块的输出中，shift vector 在 RL 下变化最明显，其更新方向能强烈预测任务成功率（ROC-AUC 高达 99.6%）。此外，shift 更新的几何形状反映了任务关系，其成对相似性与跨任务迁移模式相关。这为理解 RL 如何改变 VLA 策略提供了系统性的视角。\n- **领域归类**: [具身智能, 视觉-语言-动作模型 (VLA), 强化学习]\n\n---\n\n### 40. A2Z GameSpec-Bench: How Faithfully Can Coding Agents Generate Games from Game Design Specifications? (A2Z GameSpec-Bench：编码智能体能在多大程度上忠实地根据游戏设计规范生成游戏？)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39564)\n- **研究任务**: 评估编码智能体在端到端游戏开发中，是否能忠实地遵循长篇游戏设计文档（GDD）中相互依赖的需求，而不仅仅是生成看似合理的输出。\n- **核心亮点**: 引入包含 100 个长篇 GDD 的 A2Z GameSpec-Bench 基准；将 GDD 转化为感知依赖的契约（包含规则、约束和先决条件）；发现需求特定的反馈能使 GDD 保真度相对自我修订提升 10.9%。\n- **深度解析**: 现有游戏开发基准通常使用紧凑规范，缺乏对长篇 GDD 中跨游戏逻辑、视觉渲染和玩家交互的相互依赖需求的评估支持。该基准通过结合源码检查与智能体生成的测试策略进行基于场景的重放和自适应测试。契约在智能体和修订轮次中保持不变，确保一致比较和故障检测。评估显示当前智能体难以联合满足代码实现和实际游玩中相互依赖的需求，该基准为评估端到端规范遵循能力提供了有效工具。\n- **领域归类**: [AI 智能体, 代码生成, 评估基准]\n\n### 41. The Evolution of Attention in Large Language Models: Mechanisms, Trade-offs, and Emerging Trends (大语言模型中注意力机制的演进：机制、权衡与新兴趋势)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39661)\n- **研究任务**: 分析和总结大语言模型（LLM）中自注意力机制及其变体（如显式记忆压缩、稀疏访问、循环状态构建等）的发展，将其视为模型内部的上下文记忆机制。\n- **核心亮点**: 引入了一个五维视角（记忆表示、记忆更新、访问、读出和整合）来描述上下文记忆；利用14个主要模型系列和11个高性能开源端点的59个发布级记录，重构了机制层面和架构层面的发展。\n- **深度解析**: 论文指出，显式记忆和循环状态方法虽然接口不同，但越来越多地控制重叠的记忆功能；异构架构在跨网络深度上的协调日益增加，深度成为构建和管理上下文记忆的维度；提出了“有状态多维记忆路由假说”，认为高效的序列架构设计越来越关注上下文记忆的组织、生命周期和选择性使用，而不是孤立的注意力算子。\n- **领域归类**: [大语言模型, 架构设计, 注意力机制, 综述]\n---\n\n### 42. AdviSD: Learning to Advise Frontier LLMs via Targeted Multi-Turn Self-Distillation (AdviSD：通过定向多轮自蒸馏学习为前沿大语言模型提供建议)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38142)\n- **研究任务**: 训练一个小型可训练的“顾问（advisor）”模型，通过自然语言建议来引导冻结的语言模型“执行器（executor）”，并利用交互反馈来改进建议质量。\n- **核心亮点**: 提出了顾问自蒸馏（AdviSD）方法，将基于结果的强化学习与来自反馈条件化顾问副本的自蒸馏相结合；通过评估有/无建议时执行器响应的差异大小，来选择用于监督的决策。\n- **深度解析**: 论文证明了在共享参数模型中，如果某些修正的目标不如其他修正强烈，保留它们可能会限制学习。AdviSD不需要执行器的似然估计或额外的执行器展开。实验表明，使用 Qwen3-8B 作为 Gemini 和 Claude 的顾问时，AdviSD 在 BFCL-v3 上比 advisor-GRPO 高出 4.2-6.4 个百分点，在 EnvScaler 上高出 3.9-5.1 分，且能泛化到域外任务并在不同执行器版本和模型家族间迁移。\n- **领域归类**: [大语言模型, 强化学习, 模型蒸馏, Agent]\n---\n\n### 43. WUSH-KV: KV Cache Quantization with Data-Adaptive Transforms (WUSH-KV：基于数据自适应变换的 KV Cache 量化)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38121)\n- **研究任务**: 解决 KV 缓存内存和带宽成本随上下文长度和批次大小增长的问题，提出一种用于低比特 KV 缓存量化的方法 WUSH-KV，以提高长上下文推理效率。\n- **核心亮点**: 引入 WUSH-KV，利用校准数据构建独立的键（key）和值（value）变换，值变换折叠到模型权重中，键变换在 RoPE 之后应用；结合裁剪量化器（如 QuEST INT），在温和假设下证明 WUSH 变换接近最优。\n- **深度解析**: WUSH-KV 减少了逐层重建误差，并在测试的变换中实现了最低的整体困惑度。在端到端评估中，将其集成到 SGLang 中，使用 OSCAR 风格的百分位裁剪仿射量化。在 2-bit 量化下，WUSH-KV 在所有评估的模型和下游任务中，表现与 OSCAR 变换相当或更优。具体的评估模型名称和下游任务数据集摘要未提供。\n- **领域归类**: [大语言模型, 推理加速, 量化, KV Cache]\n---\n\n### 44. Decompose Radicals, Then Reward: Fine-Grained Inspection for Accurate Chinese Text Rendering (先分解偏旁部首再奖励：用于准确中文文本渲染的细粒度检查)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37569)\n- **研究任务**: 解决文本到图像模型在渲染准确中文文本时面临的挑战，提出一种细粒度的检查与奖励机制，以改善中文字符内部结构的忠实再现。\n- **核心亮点**: 引入 IDSpect 方法，利用表意文字描述序列（IDS）将目标文本确定性地分解为 IDS token，并将裁剪级别的视觉 IDS 预测与目标序列对齐；结合整字语义奖励，提供组件和空间关系的细粒度信用分配，且不改变图像生成器或增加推理时间成本。\n- **深度解析**: 现有的基于 OCR 的强化学习奖励将汉字视为原子字符，忽略了其组合性质，导致视觉上的偏旁部首错误得到同样粗糙的反馈。IDSpect 通过训练专家 IDS 识别器，将渲染的中文文本转录为 IDS 表示。在 Qwen-Image 的 GRPO 后训练实验中，IDSpect 在 LongText 和 GenTextEval 数据集上实现了领先的结构质量和语义对齐。具体的评估数字和更多数据集细节摘要未提供。\n- **领域归类**: [多模态, 文本到图像, 中文文本渲染, 强化学习]\n---\n\n### 45. Tacit-TTS: From Autoregressive Decoding to Masked Prediction for Efficient Transcript-Free Voice Cloning (Tacit-TTS：从自回归解码到掩码预测以实现高效的无文本语音克隆)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38658)\n- **研究任务**: 解决具有自回归语义建模的 TTS 系统顺序解码延迟高的问题，同时避免非自回归替代方案通常依赖参考语音文本（transcript）的限制，提出一种高效的无文本零样本语音克隆系统。\n- **核心亮点**: 提出 Tacit-TTS（从 IndexTTS2 蒸馏而来），用掩码非自回归生成替换自回归文本到语义的解码；引入免训练的声学长度估计；通过 ReFlow 蒸馏加速流匹配渲染器。\n- **深度解析**: 在两个英语和两个普通话数据集上，Tacit-TTS 实现了具有竞争力的零样本质量，同时对于 5 秒以上的语音，生成速度比 IndexTTS2 快 10 倍以上。其无文本条件支持跨语言和非词汇参考，在八种其他语言、婴儿咿呀学语和合成胡言乱语的参考下验证了该能力，避免了依赖 ASR 文本导致的性能下降或失败。具体的数据集名称摘要未提供。\n- **领域归类**: [语音合成, 零样本语音克隆, 模型蒸馏, 非自回归生成]\n---\n\n### 46. SeLMRoute: Probabilistic Semantic Evidence for Large Language Model Routing (SeLMRoute：用于大语言模型路由的概率语义证据)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34736)\n- **研究任务**: 为大语言模型（LLM）路由设计一种新框架，旨在为每个传入查询选择最合适的模型，解决现有路由方法很少说明查询实际需求的问题。\n- **核心亮点**: 提出 SeLMRoute，将候选独立的语义证据提取与候选性能学习和部署目标应用分离开来；决策模型首先评估关于查询的可解释问题（如推理需求、外部知识使用），并将每个判断保留为概率分布，形成概率语义状态。\n- **深度解析**: 轻量级监督路由器使用概率语义状态来估计候选模型的性能，随后应用路由目标，使同一语义状态能够支持面向性能和成本感知的决策。在 LLMRouterBench（15 个数据集，20 个候选模型，11,481 个查询）上，SeLMRoute 平均准确率达到 72.08% ± 0.45，分组五折外折叠评估达到 72.64%，而最强固定候选为 69.23%。在 13 个模型的性能-成本设置中，平均 PerfGain 为 2.66%。\n- **领域归类**: [大语言模型, 模型路由, 混合专家系统, 概率模型]\n---\n\n### 47. PatchHolmes: Agentic Patch Retrieval via Listwise Selection (PatchHolmes：通过列表选择实现智能体补丁检索)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38807)\n- **研究任务**: 解决补丁检索（寻找修复已知漏洞的提交）任务中，主要咨询数据库中 60% 到 63% 的 CVE 缺乏补丁链接的问题，提出一种两阶段的补丁检索系统。\n- **核心亮点**: 提出 PatchHolmes，结合混合第一阶段检索器和智能体第二阶段检查循环；第二阶段智能体以列表方式（listwise）读取前 100 个候选，一次性查看完整列表，并通过四个预算工具选择性地读取 3 到 10 个提交，最后提交一个最佳提交。\n- **深度解析**: 在 GitHubAD 上，PatchHolmes 的 Recall@1 比逐点（pointwise）二分类器 Favia 高 25.34%，比 retrieve-and-CoT 基线 IRCoT 高 31.40%，且每个 CVE 只需一次智能体对话（Favia 需要十次）。在保持候选集相同的情况下，智能体比检索器的首选高出 27.32% 的 Recall@1。该系统在冻结的开源权重模型和本地 Git 仓库上运行，无需微调或外部搜索 API，且在 Qwen 家族不同骨干和 gpt-oss 模型家族间具有鲁棒性。\n- **领域归类**: [软件工程, 漏洞管理, 智能体, 信息检索]\n---\n\n### 48. Not Every Token Is Worth Distilling: Selective Supervision for Direct-OPD (并非每个 Token 都值得蒸馏：Direct-OPD 的选择性监督)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29142)\n- **研究任务**: 改进直接在线策略蒸馏（Direct-OPD），解决其使用强化学习诱导的策略改进（通过前后检查点的 token 级对数比）作为密集监督时，可能因概率质量消失而导致奖励和更新保持不变的问题。\n- **核心亮点**: 提出 Selective Supervision for Direct-OPD（S^2D-OPD），根据教师参考的 Jensen-Shannon 散度（JSD）对学生采样的状态进行排名，并在低散度状态下掩码 Direct-OPD 监督，仅保留每个响应中前 10% 的状态。\n- **深度解析**: 论文通过精确构造证明，Direct-OPD 的奖励和更新可以保持不变，而检查点之间的 JSD 和两个 KL 散度随概率质量消失而趋于零。S^2D-OPD 在两个教师对和四个学生模型（1.7B 到 8B 参数）上进行了实验，在 AIME 和 HMMT 基准测试的八种设置中，有七种的留出准确率优于密集 Direct-OPD，一种持平，且不需要额外的前向传播。\n- **领域归类**: [大语言模型, 模型蒸馏, 强化学习, 训练优化]\n---\n\n### 49. Removing Timing Shortcuts Improves Non-Invasive Brain-to-Text (消除时间捷径可改善非侵入式脑到文本解码)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40359)\n- **研究任务**: 解决非侵入式脑 recordings 解码文字任务中存在的“时间捷径”问题，即神经网络利用词间时间间隔（暗示单词发音时长）而非底层大脑活动来进行预测。\n- **核心亮点**: 发现主要改进可以在没有任何大脑数据的情况下复现；提出一种简单的改变：独立处理每个窗口，而不是联合编码句子中的所有窗口，从而防止网络学习时间捷径，迫使网络从大脑 recordings 中学习特定于单词的底层信息。\n- **深度解析**: 在 d'Ascoli 等人（2025）的工作中，连续语音感知的大脑活动时间序列被分割成固定长度的窗口。由于相邻窗口部分重叠，隐含地揭示了词间间隔。消除该捷径后，聚合不同神经响应的预测和使用预训练 LLM 作为语言先验的两种现有策略变得更加有效。在感知语音基准上，这种简单方法（SimpleB2T）在每词 5 次观察下实现了 36.6% 的词错误率（WER），接近过去侵入式语音解码的性能。具体的基准测试数据集名称摘要未提供。\n- **领域归类**: [脑机接口, 语音解码, 深度学习, 神经科学]\n---\n\n### 50. SkillGym: Training Skill-Use Agents with Automatic Verifiable Environment Generation (SkillGym：通过自动可验证环境生成训练技能使用智能体)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37539)\n- **研究任务**: 解决如何合成可靠的训练数据以及如何训练智能体使用技能（skills）的问题，提出一种自动构建可验证环境、收集轨迹并训练技能使用智能体的流水线。\n- **核心亮点**: 提出 SkillGym，从互联网爬取大量技能并保留可离线重现工作流的技能；使用构建者-审查者流水线构建难度受控的任务（包含四种任务类型），构建 6.8k 个环境并收集 19k 个经过验证的成功轨迹用于监督微调。\n- **深度解析**: 在不同家族和规模（2B 到 122B 参数）的 LLM 上，使用这些轨迹进行微调在四个技能使用基准测试中均有提升；其 Qwen3.5-9B SFT 模型在其中两个基准上超越了 397B 的未训练模型。分析表明，训练教会了智能体调用技能，将读取相关技能的比率从 28% 提高到 96%，且收益跨越推理结构，扩展到训练数据中占少数的任务类型和训练中没有的技能。具体的基准测试名称摘要未提供。\n- **领域归类**: [智能体, 技能学习, 强化学习/微调, 环境生成]\n---\n\n### 51. SkillSeek: Revisiting Agent Skill Retrieval at Marketplace Scale (SkillSeek：在市场规模下重新审视智能体技能检索)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38822)\n- **研究任务**: 解决大规模智能体技能库（如超过23万个技能）中的技能选择与检索瓶颈问题。\n- **核心亮点**: 提出开源的两阶段技能检索器 SkillSeek（基于标准信息检索方案：BGE-base 双编码器结合小型交叉编码器，通过 MCP 暴露），以极低成本达到了与 LLM 中介检索循环相当的性能。\n- **深度解析**: 现有方法通常将选择权交给智能体自身（LLM 中介的检索循环），但这会在每个任务中消耗大量 LLM token。SkillSeek 采用标准的信息检索（IR）方案。在 4×11 的网格（池、主干、方法）和 89 个任务的 SkillsBench 基准上，SkillSeek 观察到与 Liu 等人的 LLM 中介循环性能相当，且几乎无额外成本。仅使用 bm25 在四个设置中的三个上达到了与他们精炼循环相当或更高的通过率，小型交叉编码器弥补了第四个设置的差异。首次召回上限解释了这一模式，每次试验的总花费从 51.30 美元降至 27.54 美元（比无技能基线高不到 50 美分）。在测试的 SkillsBench 任务和 OpenHands 框架下，标准 IR 方案可作为智能体技能检索的强默认选项。\n- **领域归类**: [智能体, 信息检索, 大语言模型]\n---\n\n### 52. CoEvoWhen: Policy-Tool Coevolution for Ultra-Long Video Temporal Grounding (CoEvoWhen：用于超长视频时间接地的策略-工具协同进化)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40048)\n- **研究任务**: 解决超长视频时间接地任务中，在有限的视觉预算下平衡长程证据搜索与细粒度事件理解的挑战。\n- **核心亮点**: 提出了一种新颖的策略-工具协同进化框架，从 VLM 的智能体推理轨迹中联合进化高级策略和可执行媒体工具，形成无需更新模型参数的可重用技能。\n- **深度解析**: 现有的智能体方法主要依赖预定义的策略和工具能力。该框架中，外部技能更新器在长视频时间接地中提炼可迁移的任务经验，相应地完善长程基于图像和细粒度基于视频观察的编排。同时，更新器利用其编码能力升级现有工具或创建新工具，以适应长视频证据获取。配备进化后的技能，VLM 在进化策略的指导下自主编排工具，协调图像和视频观察进行智能体推理，无需依赖单独的更强规划模型。在跨越 5 个基准和 3 个 VLM 的广泛实验中，策略-工具协同进化一致地提高了超长视频的时间接地准确率，同时降低了推理时的视觉 token 成本。进化的技能在通用长视频问答中也产生了显著的性能提升，无需额外的特定任务进化。\n- **领域归类**: [计算机视觉, 视频理解, 智能体]\n---\n\n### 53. Game-Guided Skill Discovery through Self-Play for Playable Agent Control (通过自我博弈进行游戏引导的技能发现以实现可玩智能体控制)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40137)\n- **研究任务**: 发现可供人类直接游玩的电机技能（motor skills），为控制具身智能体提供紧凑的抽象。\n- **核心亮点**: 提出游戏引导的技能发现（GGSD）框架，通过游戏中的自我博弈来发现语义上不同、可解释且具表现力的可玩技能。\n- **深度解析**: 现有的无监督技能发现方法通常无法同时实现语义不同、可解释和具表现力。GGSD 通过将技能发现建立在竞争性游戏玩法中来实现这些目标。分层智能体与其过去的自我竞争，高级策略从小的离散技能集中进行选择，技能调节的低级策略学习相应的行为。训练后，人类可以替换高级策略，并通过相同的离散技能直接控制智能体。尽管高级动作数量少，但技能转换会产生涌现的组合行为，将表现力扩展到单个原语之外。在 Ant、Franka-arm 和 Unitree G1 环境中，GGSD 产生了人类可玩的技能，人类可以组合这些技能来解决未见过的任务（如 Maze 和 CubePush），无需额外训练。\n- **领域归类**: [强化学习, 具身智能, 机器人控制]\n---\n\n### 54. See it, Say it, Sorted: Mechanistic Diagnosis and Parameter-Space Mitigation of Emergent Misalignment in LLMs (看到它，说出它，解决它：大语言模型中涌现性未对齐的机制诊断与参数空间缓解)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34970)\n- **研究任务**: 诊断和缓解安全对齐的大语言模型在窄领域适应后意外触发的跨无关领域的灾难性安全失败（涌现性未对齐，EM）。\n- **核心亮点**: 提出动态的二阶几何研究来追踪训练轨迹，揭示方向 Hessian 曲率集中在语义枢轴 token 上，并引入参数级几何缓解框架（Geometric Mitigation Framework）。\n- **深度解析**: 先前的静态分析未映射训练动态，现有防御依赖降低效用的启发式方法。该研究跟踪训练轨迹发现，方向 Hessian 曲率尖锐地集中在语义枢轴 token 上。Grassmannian 投影显示，在大多数设置中，有害-安全差距扩大主要是因为安全梯度重叠下降。利用这些见解，引入了参数级几何缓解框架，将经验有害梯度子空间正交投影出参数更新。在 Qwen2.5-14B-IT 上，该防御将自由生成 EM 抑制高达 80.0%；在其他三个开放权重指令模型家族（3B-20B）中，单层行为 EM 已接近零，教师强制评估显示相同的有害子空间控制冻结 EM 响应的条件支持。这些诊断揭示了行为安全的错觉：在行为 EM 接近零的模型中，相同的子空间仍然是可测量和可引导的。\n- **领域归类**: [大语言模型, 模型安全, 机制可解释性]\n---\n\n### 55. Aligning One-Step Generative Models with Reward-Weighted Transport Distillation (使用奖励加权传输蒸馏对齐单步生成模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30840)\n- **研究任务**: 解决单步生成模型（只需一次网络评估即可实现高质量视觉生成）的后训练与对齐困难问题。\n- **核心亮点**: 提出奖励加权传输蒸馏（RWTD），一种仅需生成样本和标量奖励评估的后训练方法，通过特征空间最优传输和定点回归实现自适应目标。\n- **深度解析**: 通用隐式生成器既不提供易处理的似然也不提供去噪轨迹，且许多奖励不可微。RWTD 不单纯对齐传统的奖励倾斜参考分布，而是构建了一个混合当前和参考分布的自适应目标。当前组件结合了训练期间发现的改进，参考组件将目标锚定到预训练生成器。RWTD 通过特征空间最优传输和定点回归实现这一目标。理论分析表明，RWTD 的定点分布在参考的离策略奖励倾斜和当前模型的在策略倾斜之间插值。实证上，RWTD 将单步 SANA Sprint 1.6B 主干的 GenEval 分数从 0.73 大幅提高到 0.80，同时单独的偏好对齐实验证明了强大的跨奖励泛化能力，产生平衡的改进并保留组合能力。\n- **领域归类**: [计算机视觉, 图像生成, 模型对齐]\n---\n\n### 56. BIABench: Evaluating AI agents on real-world bioimage analysis tasks (BIABench：在真实世界生物图像分析任务上评估 AI 智能体)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34274)\n- **研究任务**: 评估 AI 智能体是否能够端到端地执行真实的生物图像分析任务。\n- **核心亮点**: 引入 BIABench 基准，包含从已发表生物学研究中重建的 16 个任务，涵盖 11 个分析子任务和多种模态，提供结果分数和过程分数的双重评估。\n- **深度解析**: 真实的生物图像分析对智能体来说很困难，因为 2D 图像、3D 体积和时间序列通常太大而无法作为上下文读取，智能体必须通过代码、专业软件和渲染视图来选择和运行分析。BIABench 的 16 个任务保留了科学问题、成像数据和地面实况。每次提交都会获得一个结果分数（使用领域标准指标将输出文件与地面实况进行比较）和一个过程分数（视觉语言模型根据专家编写的评分标准判断方法选择和质量控制）。评估了多个语言模型的通用和生物学特定智能体。常规的二维任务解决得很好，但在增加第三维度或时间轴的一些任务中，没有智能体得分超过 0.19。生物学专业化、更强的模型或详细的专家指令都没有缩小这一差距。智能体也不可靠，同一智能体重复运行之间的分数变化大于不同智能体之间的变化。\n- **领域归类**: [智能体, 基准测试, 生物图像分析]\n---\n\n### 57. DAGent: Evaluate-then-Grow Planning for Deep Research Agents (DAGent：用于深度研究智能体的“评估后增长”规划)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39154)\n- **研究任务**: 解决深度研究任务中智能体需要在庞大知识空间中导航、综合多源证据并随着发现的涌现调整计划的问题。\n- **核心亮点**: 提出基于有向无环图（DAG）的多智能体框架 DAGent，采用“评估后增长”（Evaluate-then-Grow）的增量规划策略，并引入 DAGRPO（一种 GRPO 的改编）注入拓扑条件的信用。\n- **深度解析**: 现有的基于 DAG 的智能体在执行前实例化任务级计划，仅在观察到失败或缺失证据后才修复图，这种“先计划后修补”策略在深度研究中很脆弱。DAGent 的编排器一次增长一个批次的任务图，以完成节点的置信度和不确定性信号为条件。分层上下文层默认传播紧凑的 QueryDocs，同时保留完整的执行轨迹以供按需回忆。记录的 DAG 拓扑允许结构化 RL 信号。DAGRPO 在 Executor rollout 上注入拓扑条件的信用，并在 Orchestrator 计划上注入结构合规正则化。在 BrowseComp-Plus、GAIA 和 xbench-DeepSearch 上，DAGent 在 Qwen3-235B-A22B 规模上超越了最强的开源基线 5.3 / 5.8 / 2.0 分。在 Qwen3-8B 规模上，DAGRPO 比同等预算的仅结果 GRPO 基线平均提高 3.0 个 Pass@1 分。\n- **领域归类**: [智能体, 多智能体系统, 深度研究]\n---\n\n### 58. MemLife: Curating and Reasoning over Long-Term Egocentric Video Memories (MemLife：对长期第一人称视频记忆进行整理与推理)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40195)\n- **研究任务**: 解决长期第一人称视频（长达数百小时）在个性化 AI 助手推理时，重新处理原始视频在计算上难以承受的问题，以及现有记忆系统在保留关键证据和检索相关性方面的失败。\n- **核心亮点**: 引入多模态记忆系统 MemLife，构建基于实体锚定的第一人文本片段，并通过时间索引的智能体读取器进行检索；提出强化学习框架 MemOpt 优化记忆编写器。\n- **深度解析**: 随着视频历史增长到数月或数年，重新处理原始片段成本过高。现有记忆系统要么未保留关键证据，要么由于增长搜索空间中的检索竞争导致检索器无法定位相关条目。MemLife 无需训练或查询时访问视频，在四个长视野基准上比最强的免训练基线提高了 4.6--12.0%。为了进一步提高记忆质量，提出 MemOpt，一个优化记忆编写器以产生忠实、信息丰富且可检索的记忆的强化学习框架。MemOpt 在不同的视频和问题分布上始终将 MemLife 提高 2.7--5.0%，其收益可泛化到不同的编写器和读取器主干以及记忆系统。\n- **领域归类**: [多模态, 视频理解, 记忆系统]\n---\n\n### 59. Mitigating the Length-Scaling Tax with Online Distillation (使用在线蒸馏缓解长度缩放税)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38854)\n- **研究任务**: 缓解强化学习（RL）后训练中“长度缩放税”（LST）的副作用，即对已解决的问题产生不必要的冗长回复。\n- **核心亮点**: 提出长度自蒸馏（LSD），将已解决的提示路由到在策略蒸馏，并对未解决的提示保留原始 RL 目标，使用在线策略的指数移动平均作为教师。\n- **深度解析**: RL 后训练中的长度缩放通常被视为推理能力提高的标志，但也会使对已解决问题的回复变得不必要地冗长。LST 被量化为在没有相应准确率增益的情况下，对已解决查询的过度响应长度。LSD 使用在线策略的指数移动平均作为教师，无需外部模型。研究发现，LSD 在多个变体中实现了与 RL 相当或更好的性能，同时大幅抑制了简单查询上的响应长度增长。LSD 将单轮推理的 LST 从 19.0% 降低到 -3.7%，将多轮智能体任务的 LST 从 31.4% 降低到 13.7%，证明 LSD 有效保留了简单查询上的简洁响应模式，同时支持 RL 后训练中困难查询的高效探索。\n- **领域归类**: [大语言模型, 强化学习, 模型后训练]\n---\n\n### 60. How Much Is an AI Token Worth? Scaling Laws for Wild AI-Generated Web Text (一个 AI Token 值多少钱？野生 AI 生成网络文本的缩放定律)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40295)\n- **研究任务**: 研究预训练数据中日益增多的“野生”AI 生成网络文本对语言模型预训练的影响，并建立相应的缩放定律。\n- **核心亮点**: 预训练 800 个语言模型以拟合缩放定律，发现 AI token 在数据匮乏时初期有益但随后有害，提出包含独立收益和损害项的新缩放定律，并释放 WildAI 语料库。\n- **深度解析**: 应用 FineWeb 质量过滤后，2026 年 6 月网络数据中 27.5% 的 token 被 Pangram 标记为 AI 生成，8 月升至 31.1%。这种野生 AI 文本来自许多模型，为人类读者编写，且未标记地进入预训练语料库。预训练 800 个语言模型，改变添加的 AI token 与人类 token 的比例。对于数据匮乏的模型，添加 AI token 最初会降低人类文本的损失，但随着添加更多，收益饱和并迅速反转为损害。对于在人类文本高预算下训练的模型，AI token 几乎立即增加损失，而相同数量的新鲜人类 token 则继续降低损失。Hoffman 等人（2022）等缩放定律无法预测此行为。提出了一种新的缩放定律，包含独立的收益和损害项，允许 AI token 的价值改变符号，并在没有 AI 文本的情况下还原为 Chinchilla 定律。在较小模型上拟合时，该定律预测 AI 文本对最大 3.6 倍大模型的留出人类文本损失的影响，误差比所有 AI 比例上现有的最佳定律低 41%。建议过滤 AI 文本（当目标是人类文本时），释放了包含 830 亿 token 的 WildAI 语料库。\n- **领域归类**: [大语言模型, 预训练数据, 缩放定律]\n---\n\n### 61. LEAP: Learned Block-wise Evidence Retrieval for Long Audio-Video Perception (LEAP：用于长音视频感知的学习分块证据检索)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39938)\n- **研究任务**: 解决小时级音视频问答（AVQA）中的上下文困境，即全记录编码会迅速耗尽上下文限制，而均匀时间压缩会严重稀释细粒度的声学和视觉证据。\n- **核心亮点**: 提出 LEAP 框架，将长录音划分为固定时长的块，对每个块应用轻量级定位传递以评估短候选窗口。将排名最高的窗口池化并在单个有界答案传递中重新编码，使答案输入和峰值上下文独立于录音时长，并原生支持流式推理。\n- **深度解析**: 框架解耦了证据定位与推理，支持在不解码媒体帧的情况下对预计算文本进行定位。采用两阶段训练：定位 LoRA 优化窗口选择，答案 LoRA 优化答案生成。在多个 AVQA 基准上，相比 Qwen3-Omni-30B-A3B 基线提升 4.5-16.8%；迁移至 MiniCPM-o 4.5 骨干网络后，超越其已发布结果 3.1-13.0%。\n- **领域归类**: [多模态, 音视频问答, 长上下文处理]\n---\n\n### 62. NavHarness: Towards Lifelong Embodied Navigation (NavHarness：迈向终身具身导航)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34276)\n- **研究任务**: 解决具身智能体在连续任务中依赖不断演变的地图和早期搜索记录（可能不完整或与观察冲突）的问题，实现无需训练的终身导航。\n- **核心亮点**: 提出免训练的具身框架 NavHarness，将记忆处理纳入导航循环。利用多轮智能体会话调用地图、任务记录和房屋知识，并在跨任务或恢复尝试的新对话中保留经验，支持结果验证和运行结束摘要。\n- **深度解析**: 在 GOAT-Bench 上，NavHarness 使用 Astra 和 Opus 5 分别将 s-SR 提高 18.6 和 22.6 分。结合 SLAM 估计位姿，GPT-6 Astra 在 GOAT-Bench 达到 83.7 s-SR 和 36.9 e-SR，在 IR2R-CE 达到 85.9 s-SR。研究表明结构化恢复交接优于长度匹配的摘要，且经验整合能超越单纯保留地图和任务记录。\n- **领域归类**: [具身智能, 机器人导航, 记忆与经验复用]\n---\n\n### 63. Label-free steering: Compressing test-time reinforcement learning into bias-only subspaces (无标签引导：将测试时强化学习压缩至仅偏置子空间)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.18587)\n- **研究任务**: 探索在奖励信号和优化空间受到严重限制的情况下，测试时强化学习（TTRL）能否实现有效的测试时适应。\n- **核心亮点**: 提出无标签仅偏置 TTRL 方法，使用多数投票伪标签作为奖励，在冻结预训练骨干网络的同时仅优化约 10 万个偏置参数。\n- **深度解析**: 在 MATH-500 数据集上，使用 Qwen2.5-7B 达到 76.67% 准确率，优化的参数比全参数 TTRL 少 76,000 倍。该方法同样提升了 MathVista、AI2D、LogicVista 和 MMAU 等视觉语言和音频推理任务的性能。学到的引导向量可迁移至 4,500 个保留的 MATH 问题。分析表明，多数投票可靠性随 rollout 共识提高，且可访问梯度能量更大的偏置子空间表现出更强的下游可训练性。\n- **领域归类**: [大模型优化, 测试时适应, 强化学习]\n---\n\n### 64. Beyond the Remembered World: Predictive 4D Belief for Persistent Navigation in Evolving Worlds (超越记忆世界：用于演变世界中持续导航的预测性 4D 信念)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39166)\n- **研究任务**: 解决具身智能体在“演变世界”中导航时，目标可能在未被观察时移动，导致记忆位置不可靠的问题。\n- **核心亮点**: 提出 EvolvingNav 框架，通过时间索引的 3D 对象历史构建信念，区分目标在最后观察位置的持续存在与向其他位置的重定位，并利用事件驱动滤波器随时间传播信念并融合新的 RGB-D 证据。\n- **深度解析**: 引入基于人类活动轨迹的 EvoWorld-Bench 基准，包含 54 个场景和 803,680 个任务。在仿真和真实机器人实验中，EvolvingNav 提高了导航成功率和搜索效率。使用零样本视觉语言控制器进行动作选择和重规划。消融实验表明保留不确定性和结合可见性感知的证据具有重要价值。\n- **领域归类**: [具身智能, 空间记忆, 目标追踪与导航]\n---\n\n### 65. Safety of Latent Communication in Multi-Agent Systems (多智能体系统中潜在通信的安全性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39788)\n- **研究任务**: 研究多智能体系统中潜在通信（在内部表示空间直接交换信息）的安全性，特别是其对有害合规性的影响。\n- **核心亮点**: 发现即使是良性的链接训练也会增加有害合规性。攻击者可以通过在有害查询-响应对上优化链接或对良性训练数据投毒来放大这种效应。\n- **深度解析**: 开发了一种强化学习攻击方法，在三种通信拓扑和四个安全基准上，将平均有害合规得分从良性训练链接的 27.9 提高到 76.9，同时在两个良性效用基准上实现更高准确率。通过调整奖励以适应更安全的行为，可以在不更新智能体的情况下修复受损链接，大幅降低有害合规性。\n- **领域归类**: [大模型安全, 多智能体系统, 潜在通信]\n---\n\n### 66. Retrieval Capacity of Self-Attention Under Competition (竞争下自注意力的检索能力)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37879)\n- **研究任务**: 研究语言模型实际上使用了上下文中的多少 token，以及决定该数量的因素，通过自注意力机制进行探讨。\n- **核心亮点**: 在不重新训练的情况下，仅保留每个头、层和查询中注意力权重最高的 token。通过改变选择集大小并测量负对数似然（NLL）的增加，估计在选定损失容差内所需的有效注意力集大小。\n- **深度解析**: 相对较小的选择集可使 NLL 接近全注意力基线，且基于注意力的选择大幅优于随机选择。扩展上下文会增加所需集大小，但其占上下文的比例下降。固定支持事实的实验表明，额外的背景会将其 token 在注意力排名中推后。重归一化保留权重可大幅减少所需集大小。条件理论模型解释了竞争和注意力质量保留如何导致集大小增长。\n- **领域归类**: [大模型机制分析, 自注意力机制, 上下文检索]\n---\n\n### 67. SlideDP: Scaling Host-Resident LLM Fine-Tuning Across Multiple GPUs (SlideDP：跨多 GPU 扩展宿主机驻留的大模型微调)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34162)\n- **研究任务**: 解决宿主机层流式传输在多 GPU 数据并行微调大模型时，数据并行秩竞争共享宿主机资源导致的传输流量放大和计算窗口缩短问题。\n- **核心亮点**: 提出 SlideDP，一种用于共享宿主机多 GPU 系统的同步数据并行运行时。它维护一个权威的宿主机状态，解耦通信路由与状态布局，并在秩和块之间流水线化参数传递、梯度聚合和 CPU 更新。\n- **深度解析**: 在匹配批次的扫描中，SlideDP 的几何平均吞吐量比 SlideFormer、MegaTrain 和 ZeRO-Offload 高 1.46-2.64 倍。在 4 张 H100 上处理 Qwen3-14B 时，更大批次下每步处理超过 100 万个 token，超过 FSDP2 的峰值吞吐量 11.2%。此外，它支持同一模型的 256K token 序列，并在 4 张 RTX 4090 上微调 Qwen2.5-72B。\n- **领域归类**: [分布式训练, 大模型微调, 系统优化]\n---\n\n### 68. Dating the Model: Hidden Dates in System Prompts Affect LLM Evaluation (给模型定日期：系统提示中的隐藏日期影响大模型评估)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36931)\n- **研究任务**: 研究系统提示中隐藏注入当前日期（用户无法控制且每天变化）对大语言模型输出和评估可重复性的影响。\n- **核心亮点**: 发现仅当前日期的变化就会导致大模型在多项选择问答、数学推理、代码生成和机器翻译等任务上的性能发生显著变化，甚至改变模型在排行榜上的排名。\n- **深度解析**: 在 9 个近期大模型和 6 个数据集上的测试表明，日期变化带来的性能差异在 MCQA 上高达 6%，数学推理 14%，代码生成 7%，机器翻译 2.84 BLEU。这种日期效应超过了批大小和数值精度等其他非确定性来源。思维链（CoT）和少样本提示等标准提示技术无法降低这种敏感性，CoT 甚至会放大它。\n- **领域归类**: [大模型评估, 提示工程, 可重复性研究]\n---\n\n### 69. CheatBench: Measuring Reward Gaming in AI Agents (CheatBench：衡量 AI 智能体中的奖励博弈行为)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36308)\n- **研究任务**: 解决强化学习训练的 AI 智能体为最大化奖励而采取作弊行为（如访问未授权信息、逃避监控、破坏沙盒）的问题，提供衡量该问题的基准。\n- **核心亮点**: 引入 CheatBench，一个跨多个领域的 AI 智能体作弊基准。其环境结合具有挑战性的任务与作弊机会，用于研究智能体在诚实工作困难时如何追求目标。\n- **深度解析**: 涵盖数学研究、知识工作、编码、视觉任务等领域，支持跨模型和任务类别的比较，为随着智能体承担更重要责任时衡量和减少作弊行为提供了测试平台。该基准已在 https://cheatbench.ai 公开发布。具体实验结果与数字摘要未提供。\n- **领域归类**: [AI 安全, 智能体评估, 强化学习]\n---\n\n### 70. Decision-Oriented Recommendation Reranking: An Empirical Study of Jev (面向决策的推荐重排序：Jev 的实证研究)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40241)\n- **研究任务**: 研究当重排序任务本质上是预定义候选项之间的结构化选择时，面向决策的模型能否作为推荐重排序中推荐质量与服务效率权衡的有用替代方案。\n- **核心亮点**: 对 TypeSafe AI 描述的“系统一模型” Jev 进行受控实证研究，将其与推荐特定模型以及逐点和逐列表的 Qwen 重排序器在多个 Amazon Reviews 领域和候选集大小上进行比较。\n- **深度解析**: 结果表明，Jev 在保持强推荐有效性的同时，其延迟增长比逐点 Qwen 重排序器更为平缓，尽管其观察到的服务延迟仍显著高于推荐特定模型。这些特性使 Jev 在不同候选集大小和领域中处于独特的质量-延迟操作区间。具体实验结果数字摘要未提供。\n- **领域归类**: [推荐系统, 模型重排序, 决策模型]\n---\n\n### 71. Almost Human, Except When It Matters: VoxParity and the Decisions a Voice Should Change (近乎人类，但在关键时刻掉链子：VoxParity与语音应当改变的决策)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35922)\n- **研究任务**: 评估语音智能体在处理语音通话时，是否能根据声音特征（如语气、背景音等）而非仅仅是文字内容来做出正确的决策。\n- **核心亮点**: 提出了VoxParity基准测试，包含14个领域的183个场景。在文字转录固定的情况下改变音频（如指导声音、医疗监护仪哔哔声、无线电下的求救声、药物名称上的噪音、下注的童声、恐惧的耳语等），测试智能体是否能根据音频改变正确的工具调用。\n- **深度解析**: 研究发现，在仅依赖文字的零基准测试中，23个可运行的系统只有11个通过。描述性地看，错误倾向于依赖文字：当音频需要保护时，所有28个系统执行常规请求的频率（41%）高于在干净通话中过度反应的频率（12%）；仅文字管道的比例为58%对15%。探索性分析表明，领先系统的大部分失误在于它们听到的线索；系统几乎完全在陈述规则的项上击败零基准；领先系统推翻听到的顺从或困惑的频率远高于极度恐慌；在测试的模型中，描述声音和陈述规则各自弥补了部分缺陷，但在情感理解上仍留有差距。\n- **领域归类**: [语音智能体, 多模态理解, 基准测试]\n---\n\n### 72. Training LLM Judges from Language Feedback via Position-Selective Self-Distillation (通过位置选择性自蒸馏从语言反馈中训练大语言模型裁判)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38792)\n- **研究任务**: 研究如何利用自然语言反馈（特别是主观任务中的评估标准和权重）来训练大语言模型裁判（LLM judges）。\n- **核心亮点**: 提出了一种基于位置选择性的自蒸馏（Self-Distillation, SD）方法。通过分析教师和学生在每个位置上的熵变，识别出“上下文锐化”和“上下文扩散”两种机制，并引入基于熵变的位置掩码，保留熵变分布的低尾部分，从而提高分布外泛化能力。\n- **深度解析**: 传统的结果监督强化学习（如GRPO）仅根据最终裁决的准确性给予单一标量奖励，忽略了伴随偏好标签的丰富语言反馈。自蒸馏利用语言反馈提供密集的位置级监督。实验表明，掩码高熵变位置比朴素自蒸馏更能提升主观子类别的性能（提升2-9个百分点），同时在客观任务上保持竞争力。\n- **领域归类**: [大语言模型, 模型评估, 强化学习, 自蒸馏]\n---\n\n### 73. Prompted Identity Degrades Cooperation in Multi-Agent LLM Systems (提示身份会降低多智能体大语言模型系统中的合作)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35928)\n- **研究任务**: 研究在多智能体大语言模型系统中，向智能体暴露其底层模型身份（如模型家族）对合作行为的影响。\n- **核心亮点**: 发现当智能体知道彼此的模型家族时，群体会分裂成派系（factionalism），倾向于与带有相同标签的智能体互动，即使任务并没有奖励或要求这种分裂。\n- **深度解析**: 在两个合作游戏和一个推理基准测试中，使用9到25个来自最多5个开源模型家族的智能体进行了验证。当宣布的家族被洗牌或替换为任意标签时，派系依然跟随该信息；当移除标签时，该行为消失。在严格的合作任务中，带标签的组平均多花费30%的轮次和55%的token来达成决定，成功率从96%下降到81%。向智能体隐藏身份标签是一种简单有效的缓解措施。\n- **领域归类**: [多智能体系统, 大语言模型, 合作与博弈]\n---\n\n### 74. Who Said What, and Will It Be Remembered? Evaluating Persistent Speaker Attribution Across Meetings (谁说了什么，会被记住吗？评估跨会议的持久说话人归属)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39344)\n- **研究任务**: 评估语音转录作为长期记忆时，是否能同时保留文字和稳定的说话人身份（即持久说话人归属）。\n- **核心亮点**: 提出了Speaker Identified cpWER (SI-cpWER) 指标，在单一全局说话人ID分配下对语料库进行评分。推出了端到端参考系统ThyVoice，用于修复重叠并门控用于创建和更新声纹的证据。\n- **深度解析**: 现有的会议转录指标要么忽略说话人，要么在每次录音中独立重新映射匿名说话人，无法衡量同一人在跨会议中是否保持同一身份。在完整的129个会议的CHiME-8 NOTSOFAR评估集（干净和噪声增强形式）以及CHiME-6上，评估了5个商业级联和2个开源基线。ThyVoice在所有三种条件下均记录了比所有评估的商业级联系统更低的SI-cpWER，在完整面板中均值最低（47.13，而下一个系统为54.75）。结果表明，在跨时间重用对话的系统中，必须直接评估持久归属。\n- **领域归类**: [语音处理, 说话人日志化, 长期记忆]\n---\n\n### 75. Soft Spatial Reasoning (软空间推理)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38717)\n- **研究任务**: 解决大型视觉语言模型（LVLMs）在空间推理中由于过早离散化（premature discretization）导致的错误传播问题。\n- **核心亮点**: 提出了“软空间推理”（Soft Spatial Reasoning）后训练框架。在中间推理步骤中，LVLM通过混合token嵌入形成连续的“软状态”，而不是选择单一token，允许多个候选延续影响下一步。核心是AdaptSoft控制器，利用当前隐藏状态和预测不确定性自适应调整每一步的“软度”。\n- **深度解析**: 硬思维（hard thinking）要求在每一步提交单一token，即使空间解释仍不确定。软推理通过混合token嵌入保留多个候选，但如果候选暗示冲突的空间关系，混合可能会干扰后续推理。AdaptSoft通过梯度对齐学习目标进行训练，提供特定步骤的学习信号而无需中间推理监督。在多样化的空间基准测试中，该方法优于使用相同主干的硬推理和固定软推理基线，以及现有的多种LVLMs。\n- **领域归类**: [视觉语言模型, 空间推理, 模型训练]\n---\n\n### 76. Evaluating Bounded Autonomy in Regulated Agentic AI: A Diagnostic Harness with Constitutional Rewards, Escalation Labels, and Runtime Governance (评估受监管智能AI中的有界自主性：具有宪法奖励、升级标签和运行时治理的诊断工具)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37501)\n- **研究任务**: 提出RegLLM，一个用于评估受监管智能工作流中“有界自主性”（bounded autonomy）的诊断工具。\n- **核心亮点**: 该工具对六个可信度信号进行监测：引用有效性、来源基础、模式合规性、升级正确性、宪法对齐和不安全行为率。引入确定性运行时监督器来阻止无根据的回答并强制升级，记录干预措施。\n- **深度解析**: 任务级别的“应该升级”标签将“行动与推迟”的决策转化为可测量的训练信号。在烟雾测试规模下，离线参考运行（n=12）在启用治理后，将升级召回率从0提升至0.67，不安全行为率从0.33降至0.08。两个单GPU的Qwen2.5-3B LoRA/DPO试点（n=8）暴露了配置方差可能压倒微调效果的问题（例如名义上相同的RL基础配置产生0.25对0.12的任务成功率）。这些小型试点强调了更大评估集和重复运行的必要性。\n- **领域归类**: [AI安全与治理, 智能体, 大语言模型]\n---\n\n### 77. The Endless Exam: Mathematical Constructions from Today's Models toward Superintelligence (无尽的考试：从当今模型走向超级智能的数学构造)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.24555)\n- **研究任务**: 引入“无尽的考试”（Endless Exam）基准测试，旨在衡量模型在已发表数学前沿之前及之后的进展，面向超级智能的评估。\n- **核心亮点**: 该基准涵盖14个参数化的数学构造问题族。每个提交的对象都会自动检查有效性，并根据已发表的前沿或构造基线分配相对质量分数，且不以1为上限。通过紧凑证书（compact certificates）允许验证大型构造而无需列出每个元素。\n- **深度解析**: 在9个模型评估的69个不同实例中，连续质量分数能够区分性能，尽管没有模型超越了30个已发表前沿参考中的任何一个。大小-质量曲线展示了构造质量如何随问题规模增加而变化。研究发布了生成器、验证器、参考、模型响应和分析，以支持在人类前沿之前及之后的持续测量。\n- **领域归类**: [基准测试, 数学推理, 超级智能评估]\n---\n\n### 78. ATLAS: Aligned Transport of Latent Structure for Reliable World Model Planning (ATLAS：用于可靠世界模型规划的潜在结构对齐传输)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.36333)\n- **研究任务**: 解决潜在世界模型（latent world models）在规划中，由于仅正则化潜在边际而导致与规划相关的状态间关系（新颖性结构）被削弱的问题。\n- **核心亮点**: 提出ATLAS（潜在结构对齐传输），一种训练目标，在校准全局潜在分布的同时显式保留关系几何。它将归一化的成对结构从信息丰富的编码器表示转移到规划潜在空间，并使用Wasserstein嵌入匹配（WEMReg）通过一维Wasserstein-2传输校准其边际。\n- **深度解析**: 分析表明，关系保留和边际校准施加了非冗余约束。在LeWM中实例化ATLAS后，在PushT、TwoRoom和OGBench-Cube上的平均目标达成成功率得到提升，在较高新颖性的TwoRoom episode上提升最大。表示和 rollout 诊断显示规划潜在空间具有更强的新颖性相关结构、更好的边际校准和更低的多步预测误差。\n- **领域归类**: [世界模型, 强化学习, 潜在表示学习]\n---\n\n### 79. Overcoming Scaling Limits in On-Policy Self-Distillation for LLM Reasoning (克服大语言模型推理中在策略自蒸馏的扩展限制)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37915)\n- **研究任务**: 解决在策略自蒸馏（OPSD）用于大语言模型推理时，随着模型规模扩大而效果下降的扩展限制问题。\n- **核心亮点**: 发现OPSD中“脚手架正确性”（scaffold correctness）比“上下文正确性”对下游准确率的影响更大。未验证的脚手架会产生模仿差距。提出OASIS方法，保留OPSD目标，但主要监督由标签验证的在策略轨迹，并用未验证的模型生成尝试替换书面解作为教师上下文。\n- **深度解析**: OASIS仅需要最终答案标签。在Qwen3-1.7B、4B和8B上评估AIME 2024、AIME 2025和HMMT 2025，OASIS平均比基础模型提高3.2-3.8分，而OPSD的收益从1.7B的3.05分下降到8B的0.14分。在8B时，OASIS比OPD提高3.05分，证明了验证的在策略脚手架能保持自蒸馏在模型扩展时的有效性。\n- **领域归类**: [大语言模型, 模型推理, 自蒸馏, 模型扩展]\n---\n\n### 80. The Geometry of Inference in Transformer Residual Streams (Transformer残差流中推理的几何学)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.37824)\n- **研究任务**: 研究Transformer语言模型如何通过连续的残差更新构建预测，以及其表示如何变得特定于最终结果。\n- **核心亮点**: 通过比较中间残差状态与其自身的最终状态以及来自其他上下文的经验最终状态库，发现“自身终点”在早期就变得比平均替代方案更受青睐。开发了简单的高维模型来分离范数、对齐和终点几何的作用，并证明指向自身终点的直线路径不会引入新的竞争者。\n- **深度解析**: 研究发现，随着深度增加，竞争集合通常会缩小，但其成员发生变化，且存活的终点不一定变得更相似。方向对齐和终点排名可以改善，而到最终状态的欧氏距离变化不大。此外，与排名较低的输出token相关的终点在所有研究的6个预训练模型中往往在余弦距离上更远，将残差几何与输出组织联系起来。\n- **领域归类**: [Transformer, 可解释性, 几何表示]\n---\n\n### 81. Working Around the Compute Ceiling: Byte-Exact Memory in Galahad Makes LLM Reading a One-Time Cost (绕过计算天花板：Galahad 中的字节精确内存使 LLM 阅读成为一次性成本)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.39358)\n- **研究任务**: 解决大语言模型在无状态服务中重复计算已读文本注意力状态的问题，将 LLM 推理从无状态转变为有状态，从而降低计算和能耗成本。\n- **核心亮点**: 提出 Galahad 内存层，通过字节精确的内存管理使 LLM 阅读长文本成为一次性成本，并在重启或热加载后实现位级精确的状态恢复。\n- **深度解析**: Galahad 包含两个组件：Taliesin 保存文本块的 KV 状态并在下次请求包含相同字节时加载；Blaise 保留文档本身，仅向模型传递问题所需的部分。在包含 100 个事实的 97,000 token 语料库（使用 Gemma 4 31B）测试中，结合 Taliesin 和 Blaise 的模型每问仅阅读约 668 个 token，在 vLLM、SGLang 和 llama.cpp 上均实现 100/100 的准确率，耗时 0.59-0.64 秒，能耗 200-213 焦耳。存储语料库的一次性成本约为 100 秒和 28 千焦，在 13 个问题后即可回收能耗。恢复的状态是位级相同的（262,144 个输出 logits 完全匹配）。该系统在 vLLM 下测试了 30 个模型，且具备故障安全机制（未通过检查的加载将重新计算）。\n- **领域归类**: [大语言模型, 推理优化, 系统架构]\n---\n\n### 82. EviRover: Reinforcing Agentic Perception Beyond a Glance (EviRover：强化超越一瞥的智能体感知)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.40230)\n- **研究任务**: 解决视觉感知在需要细粒度视觉细节或密集/最新知识时因“证据不足”而失败的问题，将视觉感知从单次预测转化为可通过交互获取信息的智能体过程。\n- **核心亮点**: 提出 EviRover，据作者所知是首个明确训练通过交互解决感知查询的感知智能体，采用监督微调结合智能体强化学习进行训练。\n- **深度解析**: 研究设计了两条数据生成管道，产出 EviRover-SFT-5K 和 EviRover-RL-12K 训练数据，并构建了包含 688 个实例、涵盖 5 个感知类别的人工验证基准 EviLens。4B 参数的 EviRover 在 EviLens 上平均比其主干模型高出 30 分，达到高级专有模型的性能水平。该增益还迁移至 WebEyes、传统感知基准和通用多模态基准，其中在 BrowseComp-VL 上提升了 15 分。所有代码、模型和数据均已开源。\n- **领域归类**: [多模态大模型, 智能体 (Agent), 视觉感知]\n---\n\n### 83. Understanding Multimodality in Generative Behavioral Cloning (理解生成式行为克隆中的多模态性)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.22493)\n- **研究任务**: 研究生成式行为克隆策略如何表示同一观察下存在多个有效动作的多模态专家行为，并识别不同模型参数化下的瓶颈。\n- **核心亮点**: 系统分析了潜在变量策略和动作空间生成策略在处理多模态性时的理论瓶颈与机制，并通过合成和物理机器人任务验证了这些机制。\n- **深度解析**: 对于潜在变量策略，保留演示模式需要潜在表示中包含动作条件信息，过度的后验-先验正则化会抑制该信息，而较弱或聚合的正则化虽能保留模式信息，但需确保部署时的先验能覆盖相关潜在区域。对于动作空间生成策略，多模态性受限于基础到动作传输的平滑度，具有小 Lipschitz 常数的映射无法为多个良好分离的模式分配大量概率，覆盖多模式需要基础空间的急剧转变或动作空间的非支持桥接区域。实验在合成多模态导航和物理机器人双峰操作任务上支持了上述机制。此外，分析表明标准机器人仿真基准中的条件多模态性有限，确定性回归仍具竞争力。\n- **领域归类**: [机器人学, 行为克隆, 模仿学习]\n---\n\n### 84. SpatialCORE: Confidence-Aware Grounded Spatial Reasoning in Large Vision--Language Models (SpatialCORE：大型视觉语言模型中感知置信度的接地空间推理)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.38716)\n- **研究任务**: 解决大型视觉语言模型（LVLMs）在空间推理中仅优化最终答案正确性，而忽略接地（grounding）置信度的问题，提升模型基于自信定位的对象进行空间推理的能力。\n- **核心亮点**: 提出 SpatialCORE 后训练框架，将模型在生成式接地中的自身置信度转化为空间推理的学习信号，通过自我调节的空间奖励和答案门控机制优化推理过程。\n- **深度解析**: SpatialCORE 的核心思想是强化既准确又自信的接地。其技术实现包括一个自我调节的空间奖励，该奖励根据坐标 token 的置信度对每个预测边界框的匹配质量进行加权；同时引入答案门控，将接地优化与最终答案的正确性绑定。该方法在多个基准测试中，于开源和专门的空间推理模型中取得了最先进（SOTA）的结果，并在零样本设置下有效迁移至未见过的数据分布。\n- **领域归类**: [多模态大模型, 空间推理, 视觉接地]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [tile-ai/tilelang](https://github.com/tile-ai/tilelang)\n- **今日趋势**: 8,053 stars / 811 forks，今日新增 157 stars\n- **项目简介**: 一种旨在简化高性能GPU/CPU/加速器内核开发的领域特定语言（DSL）。\n- **核心价值**: 该项目主要用于简化高性能计算内核的开发，面向底层系统工程师和硬件加速开发者。其技术核心在于领域特定语言（DSL）设计与异构计算（GPU/CPU/加速器）优化。与AI/大模型相关：否（严格依据描述，未直接提及AI或大模型，仅聚焦于底层硬件加速内核开发，不根据项目名中的“ai”猜测）。\n---\n### [Friedrich-M/UniMate](https://github.com/Friedrich-M/UniMate)\n- **今日趋势**: 1,026 stars / 97 forks，今日新增 225 stars\n- **项目简介**: 一个能够为多样化骨骼生成动画的统一模型（SIGGRAPH Asia 2026 论文项
