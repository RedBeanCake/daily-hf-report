    <h1>前沿科研情报 - 2026-09-30</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Post-Training Leaves Behavioral Shadows on Unrelated Decisions (后训练在无关决策上留下行为阴影)\n- **社区热度**: `👍 240 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29233)\n- **研究任务**: 研究语言模型在后训练后，如何通过任务无关的文本（仅一个词）进行能力转移，即探测后训练留下的“行为阴影”。\n- **核心亮点**: 提出主动无任务蒸馏（ATD）方法，仅通过教师模型在每个提示中输出的单个词，即可将后训练获得的能力转移给学生模型，整个过程无需目标任务示例、教师 logits 或教师参数。\n- **深度解析**: 在 Qwen2.5-1.5B 的主要编码实验中，5,664 个响应在 HumanEval+ 上比精确干扰匹配的控制组产生了 5.34 个百分点的提升。实验还表明该能力转移在科学知识、常识推理和阅读理解方面跨多个模型世代、尺寸和家族均有效。功能分析表明，学习到的能力是可组合的，且其强度与教师的更新强度相追踪。\n- **领域归类**: [自然语言处理, 模型蒸馏, 后训练]\n---\n\n### 2. YuE2: Unifying Symbolic and Audio Music Generation at Frontier Quality (YuE2：以前沿质量统一符号与音频音乐生成)\n- **社区热度**: `👍 195 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33757)\n- **研究任务**: 统一符号音乐生成与音频音乐生成，通过符号规划生成高质量的全曲音乐。\n- **核心亮点**: 提出 YuE2 模型，通过符号规划（先写可读乐谱，再扩展为语义音乐 token，最后实现全曲音频）统一符号和音频音乐生成。引入 MERT2 和 SheetSage2 提供语义和符号监督，支持零样本翻唱和基于乐谱的代理音乐编辑。\n- **深度解析**: 采用单个 AR-NAR 混合 Transformer（MoT）架构。在 WildSongBench 上，YuE2 的 SongBench 全局平均分达到 6.73（best-of-8 达 6.96），超越所有公开基线，并在专家听测中与 Suno v4.5/v5 等专有生成器竞争力相当。MERT2 在 15 项 MARBLE 指标中 14 项刷新 SOTA，SheetSage2 在 15 对基准指标中领先 12 对。专家偏好显示，使用符号规划的整体质量和音乐性偏好率（49.3%）显著高于无规划（34.6%）。\n- **领域归类**: [音频生成, 音乐生成, 多模态]\n---\n\n### 3. Beyond Teacher Assignment: Domain-Normalized Multi-Teacher On-Policy Distillation (超越教师分配：领域归一化的多教师在线策略蒸馏)\n- **社区热度**: `👍 138 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35347)\n- **研究任务**: 解决多教师在线策略蒸馏（MOPD）中不同领域专家反馈不平衡的问题，将多个单技能专家模型合并为一个全能学生模型。\n- **核心亮点**: 提出领域归一化多教师在线策略蒸馏（DN-MOPD），在保留领域路由的同时，根据各领域的反馈分布（spread）对反馈进行重新缩放，解决指令遵循反馈主导学生更新的问题。\n- **深度解析**: 在 Qwen3.5 模型上实验发现，传统 MOPD 中指令遵循的反馈分布比数学反馈广数倍，导致学生模型无法获得数学专家的优势。DN-MOPD 通过测量分布来缩放反馈，在 6 个公开基准上提升了各尺寸模型的平均分，并恢复了大部分数学能力的增益。控制实验表明，增益主要来自降低指令遵循反馈的权重，而非单纯提高数学反馈。\n- **领域归类**: [自然语言处理, 知识蒸馏, 强化学习]\n---\n\n### 4. Self-Evolving Coding Agents: From Digital Programs to Physical-World Intelligence (自进化编码智能体：从数字程序到物理世界智能)\n- **社区热度**: `👍 90 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35432)\n- **研究任务**: 解决视觉-语言-动作（VLA）和世界-动作（WAM）模型在物理世界中泛化能力差、难以检查和修改的问题，将物理世界的任务状态和执行过程转化为代码表示。\n- **核心亮点**: 提出“物理编码（Physical Coding）”范式，将任务状态表示为“作为世界的代码（Code as World）”，将规划、验证和恢复表示为“作为策略的代码（Code as Policy）”。构建 HexaAnything 智能体，通过调用感知、规划和控制工具进行循环内决策，并将验证后的轨迹转化为数据和记忆以实现自进化。\n- **深度解析**: 在 RoboCasa365 上，HexaAnything 在 Composite-Unseen 和整体成功率上优于 XR-1 VLA，其 Harness 训练的 HexaModel 在所有分割上均超越基础模型。在 PhyBench 和双臂 AgileX 机器人上，该智能体自主完成物理实验和大多数桌面任务，速度通常快于已发表结果。未来目标包括权重内化、架构/语言/任务的自主重新设计以及在制造和科学中的部署。\n- **领域归类**: [机器人学, 具身智能, 智能体]\n---\n\n### 5. Duplex-MPE: Benchmarking Multi-Party Interaction in Full-Duplex Dialogue (Duplex-MPE：全双工对话中多方交互的基准测试)\n- **社区热度**: `👍 80 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.31948)\n- **研究任务**: 评估实时全双工语音模型在多方共享对话中，作为助手何时应该回答、保持沉默或停止说话的能力。\n- **核心亮点**: 提出 Duplex-MPE 基准，包含 2,000 个场景（3-4 个人类说话者和 1 个助手），涵盖对同一请求的显式和隐式寻址。模型接收连续对话音频，无需转录或提供的轮次边界。通过四个分数（新响应发起、回答准确性、沉默保持、人类解决请求时的停止）进行评估。\n- **深度解析**: 评估了五个开放权重语音系统（MiniCPM-o 4.5, Moshi, FLM-Audio, Voila 和 Freeze-Omni）。MiniCPM-o 4.5 在三项能力上领先，而其他系统常出现回答不准确或未能保持沉默的问题。基于转录的 Gemini 3.1 Pro 参考模型对显式请求的响应率比隐式请求高 64.3 个百分点，而语音系统在配对测试中未检测到响应率的显著差异。\n- **领域归类**: [语音处理, 全双工对话, 基准测试]\n---\n\n### 6. Groupwise Agentic Grading and Advantage Redistribution for Code Agent RL (代码智能体强化学习的分组智能体评分与优势重分配)\n- **社区热度**: `👍 69 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32577)\n- **研究任务**: 解决代码智能体强化学习中，基于可执行测试的二元奖励（如 GRPO）忽视实现质量和任务要求遵循度，导致策略无法区分干净实现与冗余修改的问题。\n- **核心亮点**: 提出 GAGAR 框架，用于代码智能体 RL 中的质量感知信用重分配。通过动态采样保留包含通过和失败轨迹的组，利用 SFT 训练的智能体评分器对通过测试的候选轨迹进行联合检查和排名，并据此降低低排名轨迹的权重，按比例重新缩放所有通过轨迹的优势。\n- **深度解析**: 在工业规模下使用 MiMo-V2.6-Flash（310B 总参数）和 MiMo-V2.6-Pro（1.02T 总参数）的 pre-RL SFT 检查点进行评估。受控的纯代码 Flash 实验表明，GAGAR 提高了代码智能体性能，减少了轨迹长度增长，并使训练更稳定。在 Flash 和 Pro 的大规模混合任务 RL 中也得到了应用，支持将基于测试的验证与分组智能体评分结合，以提高代码智能体 RL 的质量和稳定性。\n- **领域归类**: [强化学习, 代码生成, 智能体]\n---\n\n### 7. MassAlloc Attention: Let Attention Allocate Its Own Compute (MassAlloc Attention：让注意力分配自己的计算)\n- **社区热度**: `👍 64 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32712)\n- **研究任务**: 解决标准全注意力（FullAttn）在形成 QK 块后，对归一化质量极小的因果得分空间执行密集计算导致的资源浪费问题。\n- **核心亮点**: 提出 MALA（MassAlloc Attention），一种融合注意力原语。它保留对每个合法因果交互的得分访问，并利用归一化贡献来分配得分后计算。前向传播使用其演化的在线 softmax 归一化器，反向传播重用最终归一化器来导出嵌套保留支持。\n- **深度解析**: 在 8K 上下文长度的匹配工作研究中，MALA 在总得分后工作量完全匹配的情况下，接近每实例参考质量预言机（平均省略质量 0.0188% vs 0.0182%）。在 1K 到 32K token 的上下文长度中，保持低输出和梯度误差。在 128K token 的注意力算子基准测试中，MALA 将训练的前向和反向延迟分别降低 2.2 倍和 3.0 倍，推理解码延迟降低 1.6 倍。在 0.6B 到 14B 参数的缩放定律训练中，MALA 在降低总训练 FLOPs 的同时，其困惑度与 FullAttn 紧密跟踪，生成的 14B 和 32B 模型在知识、推理和长上下文检索得分上与 FullAttn 相当。\n- **领域归类**: [自然语言处理, 注意力机制, 模型加速]\n---\n\n### 8. TraceDance: An Automated System for Building Agent Behavior Benchmarks from Real-World Agent Deployment Traces (TraceDance：从真实世界智能体部署轨迹构建智能体行为基准的自动化系统)\n- **社区热度**: `👍 60 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33295)\n- **研究任务**: 解决现有固定基准测试套件无法覆盖智能体在实际部署中遇到的特定不良行为的问题，自动化构建针对用户指定不良行为的针对性基准。\n- **核心亮点**: 提出 TraceDance 系统，利用“锚定与确认（Anchor-and-Confirm）”方法结合可编程检索与 Flash LLM 的候选级确认，并通过“锚定综合循环”生成和修改自定义行为规范。基准使用决策点延续来评估 LLM 在记录决策点的下一轮表现。\n- **深度解析**: 在编码和通用工具使用的实验中，利用 252,557 个会话生成了 107 个包含 4,125 个实例的基准，满足了 95.3% 的构建目标请求。人类注释者在 84% 的抽样实例中确认了请求的行为，自动评分器与人类通过/失败判断的一致性可与注释者之间的一致性相媲美。9 个前沿 LLM 的平均通过率仅为 26.7%，表明它们在评估的决策点上仍难以做出适当响应。该系统可作为递归自我改进（RSI）循环的关键组件。\n- **领域归类**: [智能体, 基准测试, 模型评估]\n---\n\n### 9. CoWindow Attention: Full Causal Coverage Is a Collective Property (CoWindow Attention：完全因果覆盖是一种集体属性)\n- **社区热度**: `👍 59 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32704)\n- **研究任务**: 解决全注意力（FullAttn）向每个注意力头重复暴露完整因果历史所带来的大量冗余计算和内存流量问题。\n- **核心亮点**: 提出 CoWA（CoWindow Attention），一种结构化注意力架构，将因果历史的访问分布在 KV 头上。所有头共享近对角线和前缀汇聚窗口，而互补的长程窗口划分剩余历史。它们的并集提供了完全的因果覆盖，尽管每个头对远距离 token 的注意力是稀疏的。\n- **深度解析**: 这种基于位置定义的注意力模式无需学习路由器或索引器，在训练和推理中一致使用，并与 KV 头张量并行对齐。在 8K 上下文长度的窗口匹配消融实验中，具有 100% 集体覆盖率的 CoWA 达到 89.73% 的准确率（FullAttn 为 89.97%），而重复的长程窗口表现差得多。在 128K token 的注意力算子基准测试中，CoWA 将训练的前向和反向延迟分别降低 7.4 倍和 8.6 倍，推理解码延迟降低 3.0 倍，解码期间的每秩峰值算子内存降低 7.6 倍。在 0.6B 到 14B 参数的缩放定律训练中，CoWA 在降低总训练 FLOPs 的同时，其困惑度与 FullAttn 紧密跟踪，生成的 14B 和 32B 模型在各项得分上与 FullAttn 相当。\n- **领域归类**: [自然语言处理, 注意力机制, 模型加速]\n---\n\n### 10. How Far Are We from Removing the Visual Encoder? Scaling Laws for Encoder-Free Multimodal Pretraining (我们距离移除视觉编码器还有多远？无编码器多模态预训练的缩放定律)\n- **社区热度**: `👍 53 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35457)\n- **研究任务**: 系统性地表征无视觉编码器多模态大语言模型（MLLM）的缩放行为，并比较其与基于视觉编码器的 MLLM 的缩放定律差异。\n- **核心亮点**: 通过对比实验发现，移除视觉编码器会将多模态目标的计算最优分配转向更大的模型，而对文本目标几乎无影响。无编码器模型在小规模时表现不佳，但预计在约 $10^{22}$ FLOPs 时能追上基于编码器的模型。\n- **深度解析**: 无视觉编码器时，语言模型通过视觉特定适应来接管其角色：随着训练计算增加，视觉 token 之间的双向交互变得越来越有益，视觉处理向更早的层转移，视觉 token 的专家路由变得更加集中。结果表明，预训练编码器提供的视觉先验优势随规模递减，无编码器架构是多模态预训练的一个有前景的方向。\n- **领域归类**: [多模态, 计算机视觉, 缩放定律]\n\n### 11. Improving Test-Time Scaling with Adaptive Looped Transformers (通过自适应循环 Transformer 改进测试时缩放)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35748)\n- **研究任务**: 研究循环 Transformer 在输出序列变长时是否能改善测试时缩放（test-time scaling）能力，并提出针对性的改进方法。\n- **核心亮点**: 提出 TaH2 方法，通过前瞻深度监督联合后训练主干网络和迭代决策器，使模型能够将额外的计算迭代精准集中在真正受益于循环的 token 上，从而大幅提升测试时缩放的效率和可达精度。\n- **深度解析**: 现有的循环 Transformer 会对每个 token 平均分配额外迭代，但分析表明许多 token 并不需要这些额外计算。TaH2 引入了迭代决策器，利用在线标签（即进一步迭代是否能改善预测）进行监督学习。在 AIME 基准测试中，TaH2 将精度-计算斜率提高了 53%（2.74 vs 1.79），在匹配测试时计算量的情况下，超出非循环基线的峰值精度约 3.4 个点。此外，随着最大迭代深度的增加，现有循环模型的性能大多会停滞，而 TaH2 相对于基线的优势则持续扩大（深度 2 时提升 2.8 个点，深度 8 时提升 3.9 个点）。\n- **领域归类**: [自然语言处理, 模型架构, 推理优化]\n---\n\n### 12. Learning Native Reflection in Unified Models with Interleaved Reinforcement Learning (在统一模型中通过交错强化学习学习原生反思)\n- **社区热度**: `👍 35 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35767)\n- **研究任务**: 赋予统一多模态模型自我修复生成图像的能力，使其能够诊断图像错误、进行修改、观察结果并再次诊断，即学习原生的反思与迭代修正能力。\n- **核心亮点**: 提出 UMM-Reflection，在单一统一模型内应用强化学习（RL）来完成反思轨迹。通过共享初始图像的兄弟轨迹进行组相对优势比较，并使用轨迹级优势同时更新反思 token 和基于流的图像修改，避免了逐轮信用分配的复杂性。\n- **深度解析**: 传统的监督微调（SFT）只能提供冷启动，无法找到高成功率的修复路径；而朴素的 RL 如果只优化渲染器或单一分支，会浪费大部分收益。UMM-Reflection 让信用在轮次间以及同一模型的两种角色（反思与生成）间流动，推理时无需外部验证器。在 BAGEL 模型上，UMM-Reflection 的 GenEval 指标比 SFT 提高了 12.05 分，并且这种增益成功泛化到了训练时未使用的 WISE (+10.97)、OneIG-Bench (+3.48) 和 T2I-CompBench++ (+4.63) 等基准上。\n- **领域归类**: [多模态, 图像生成, 强化学习]\n---\n\n### 13. Knowing When Thinking Is Not Enough: Teaching Small Reasoning Models to Reason Beyond Their Parametric Knowledge (知道何时“思考”是不够的：教小推理模型超越其参数知识进行推理)\n- **社区热度**: `👍 31 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34327)\n- **研究任务**: 解决小推理模型（sRMs）在增加测试时计算量时遇到的知识瓶颈问题，使其能够超越自身参数知识的限制进行有效推理。\n- **核心亮点**: 提出 FlyBy 选择性查询框架。模型先进行自主推理并诊断未解决的问题，当遇到知识瓶颈时，会主动查询参数知识更强的外部模型。通过监督微调引导多深度查询动作，并利用成本感知强化学习来校准查询的时机、内容和成本。\n- **深度解析**: 研究发现，模型的自我完善主要是将概率质量集中在当前状态已可达的解上，而非创造新解。推理失败分为“执行瓶颈”（反思可恢复）和“知识瓶颈”（需要外部信息）。FlyBy-4B 在 6 个基准的 1158 个难题上达到了 45.96% 的 pass@8，超越了 Qwen3-14B (41.64%)，且服务成本降低了 2.7 倍；其 pass@1 (16.85%) 也超过了 Qwen3-8B (15.31%)。扩展到 FlyBy-8B 后，pass@8 进一步提升至 51.81%。\n- **领域归类**: [自然语言处理, 模型推理, 强化学习]\n---\n\n### 14. EmbodiedMemory-Bench: Benchmarking Embodied Memory for Long-Horizon Embodied Tasks (EmbodiedMemory-Bench：长时程具身任务的具身记忆基准测试)\n- **社区热度**: `👍 30 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.28236)\n- **研究任务**: 评估具身智能体在长时程交互中构建、更新和利用记忆的能力，填补现有基准未直接评估这些记忆能力的空白。\n- **核心亮点**: 提出 EmbodiedMemory-Bench (EMem-Bench)，包含 4 个任务族的 2554 个交互片段。同时提出 Embodied-Memorizer (EMem) 外部记忆系统，将具身经验组织为空间、事件和场景记忆，并训练了管理这些记忆的 EMem-8B 策略模型。\n- **深度解析**: 分析指出当前智能体记忆受限的四个关键缺陷：细粒度视觉记忆弱、动态世界状态跟踪不可靠、未能记录交互结果揭示的世界状态、以及从先验经验中泛化的能力有限。EMem-Bench 要求智能体从交互历史中构建和更新记忆以完成后续任务。评估表明，当前模型在这四个挑战上表现薄弱且不均衡。在匹配主干模型的情况下，EMem 在所有评估的记忆系统中取得了最佳整体性能，而 EMem-8B 则进一步超越了其主干模型的表现。\n- **领域归类**: [具身智能, 基准测试, 记忆系统]\n---\n\n### 15. Recursive Harness Distillation across Agents for Robot Manipulation (跨智能体的机器人操作递归线束蒸馏)\n- **社区热度**: `👍 29 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33378)\n- **研究任务**: 使机器人视觉-语言-动作（VLA）模型能够在执行需要诊断失败和调整行为时，通过跨智能体积累和重用干预经验来提升操作成功率。\n- **核心亮点**: 提出“递归线束蒸馏”（Recursive Harness Distillation）。强智能体将其经验蒸馏为轻智能体的“操作手册”（playbook），然后利用轻智能体的执行反馈递归地完善该手册。最终的手册使智能体无需更新模型参数，即可在新任务实例中重用积累的干预知识。\n- **深度解析**: 在真实世界操作中，该线束将成功率从 37.3% 提高到了 64.0%。在 SimplerEnv Bridge 上，配备手册的轻智能体达到了 66.7% 的成功率，而仅使用 GR00T 的基线仅为 41.7%，甚至超过了没有手册的强智能体。同一手册也使强智能体受益，使其成功率达到 79.2%。这证明了干预经验可以跨智能体积累、通过执行反馈进行完善，并有效重用。\n- **领域归类**: [具身智能, 机器人操作, 知识蒸馏]\n---\n\n### 16. Surprising Success, Repeated Failure: Entropy-Guided Credit Assignment for Exploration in LLM Reasoning (意外的成功，重复的失败：LLM 推理中用于探索的熵引导信用分配)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33781)\n- **研究任务**: 改进大语言模型（LLM）在可验证奖励强化学习（RLVR）中的细粒度信用分配机制，以促进更有效的探索。\n- **核心亮点**: 提出“熵优势策略优化”（EAPO），一种熵引导的信用分配方法，对成功和失败进行非对称处理。将归一化策略熵与响应优势的符号结合，强化“意外的成功”（高熵决策的成功）并纠正“重复的失败”（低熵决策的失败），同时减弱不确定位置的惩罚以保留恢复机会。\n- **深度解析**: 现有的细粒度信用分配通常需要辅助模型或特权信息。EAPO 观察到不确定性下的成功较难重复，而自信的失败往往重复发生。它直接从现有的 rollout 信号中重新分配响应优势到 token 级别，无需额外监督。摘要未提供具体的实验数字、数据集名称或量化提升结果，但指出在多种推理任务的基础和推理主干上验证，EAPO 取得了最佳整体性能，促进了更有效的探索，拓宽了问题覆盖面并生成了更多样化的候选答案。\n- **领域归类**: [自然语言处理, 强化学习, 模型推理]\n---\n\n### 17. CompoWorld: Compositional Environment Scaling for General Agents (CompoWorld：面向通用智能体的组合式环境缩放)\n- **社区热度**: `👍 28 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33665)\n- **研究任务**: 通过组合可重用服务的有限库来扩展任务空间，解决现有自动生成环境方法主要在单一环境中生成任务，而真实工作流需要跨多个服务连接信息和动作的问题。\n- **核心亮点**: 提出组合式环境缩放（CompoWorld）。编码智能体将工具规范转化为具有类型化状态和共享接口的经验证服务，世界模型处理无法可靠实现的工具。通过随机游走过程连接服务依赖图，生成需要跨服务信息流的任务，并使用完成聚焦的 Rubric 奖励引导强化学习。\n- **深度解析**: 研究构建了 448 个暴露 10130 个工具的服务，使用 3K 条 SFT 轨迹和 1K 个 RL 任务训练了 Qwen3.6-35B-A3B。实验表明，CompoWorld 在 8 个基准上平均比其主干模型提高了 9.17 分。在 AutomationBench 上，它超越了 Claude Opus 4.6 等前沿模型，并在所有对比的智能体专用 35B-A3B 模型中取得领先。\n- **领域归类**: [智能体, 环境生成, 强化学习]\n---\n\n### 18. DepthBench: Measuring How Residual Connections Enable More Computational Depth (DepthBench：测量残差连接如何实现更多计算深度)\n- **社区热度**: `👍 27 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32534)\n- **研究任务**: 研究 Transformer 架构中增加深度是否真正转化为有效的计算深度，以及残差连接设计在其中的决定性作用。\n- **核心亮点**: 引入 DepthBench，一个用于研究各种架构计算深度的受控基准。系统地改变宽高比（d_model/n_layer），同时保持模型大小和预训练配方固定，评估了 10 种代表性架构。\n- **深度解析**: 研究发现，将更多容量分配给深度的收益高度依赖于架构。标准的 Pre-LN 及其大多数基于范数和缩放的变体在模型变得更深更窄时收益很小，甚至会降低性能；而 HC 和 Full AttnRes 即使在极深的形状下也能持续改善。摘要未提供具体的下游基准测试名称和量化的性能提升数字，但指出层级分析表明，HC 和 Full AttnRes 的收益与更有效地利用额外层有关。结果证明残差连接设计是决定深度是否能作为有意义缩放轴的关键。\n- **领域归类**: [模型架构, Transformer, 基准测试]\n---\n\n### 19. QwenGyre: An Elastic Reinforcement Learning Framework for Training xLong-Horizon Agents (QwenGyre：用于训练超长时程智能体的弹性强化学习框架)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33848)\n- **研究任务**: 解决将在线强化学习（RL）应用于超长时程（xlong）任务时面临的执行方差大、rollout 延迟导致 GPU 闲置，以及复杂非线性分支产生大量轨迹冗余的问题。\n- **核心亮点**: 提出 QwenGyre，一个端到端的超长时程在线 RL 框架。它能弹性地在 rollout 和训练之间重新分配 GPU 而不中断实时执行；其轨迹处理器重构分支历史、对部分进展进行评分，并对冗余路径进行去重以控制训练成本。\n- **深度解析**: 在旗舰模型 Qwen 3.8 2.4T 上进行扩展，每次 rollout 包含 70 万 token，QwenGyre 在 48 步内使 NL2RepoBench 的绝对收益提高了 6.0%（从 52.5% 提升至 58.5%）。在多个不同领域的评估中，QwenGyre 相比 Colocate 和 Async 基线分别实现了高达 1.85 倍和 1.78 倍的训练加速。\n- **领域归类**: [智能体, 强化学习, 训练框架]\n---\n\n### 20. WorldPlay2: Extending Real-Time Interactive World Models in Control and Horizon (WorldPlay2：在控制和时程上扩展实时交互式世界模型)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35560)\n- **研究任务**: 解决交互式世界模型在响应多样化控制和保持长时程一致性方面的困难，特别是异构控制建模、上下文爆炸和不稳定蒸馏阻碍长时程一致性和实时响应性的问题。\n- **核心亮点**: 提出 WorldPlay2，耦合了分解式混合控制接口与压缩记忆和稳定蒸馏的协同设计。包括：1) 整合帧对齐动作控制和结构化语义控制（解耦场景外观、角色身份和动态语义事件）；2) 将历史上下文压缩为紧凑的记忆 token，实现基于片段的记忆条件评分评估；3) 提出 Stable Forcing，通过几步策略初始化自回归学生模型并利用全 rollout 重放确保长时程质量。\n- **深度解析**: 摘要未提供具体的实验数字、数据集名称或量化对比结果，仅说明广泛的实验证明了该模型具有很强的泛化能力，并且在性能上优于现有方法。其核心技术在于通过压缩记忆和 Stable Forcing 机制，大幅降低了长时程蒸馏的开销并保证了生成的稳定性。\n- **领域归类**: [世界模型, 视频/图像生成, 交互式控制]\n---\n\n### 21. Learning to Learn from Context: Synthetic Training from Perturbed Public Documents (从上下文中学习：从受扰动公开文档中合成训练数据)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33642)\n- **研究任务**: 提升大语言模型（LLMs）从复杂任务特定上下文（而非预训练参数知识）中学习的能力，解决人工标注此类上下文成本高昂且难以扩展的问题。\n- **核心亮点**: 提出一种无需人工标注的合成流水线，通过对高质量公开文档进行微小扰动来降低记忆风险，生成真正依赖上下文的推理轨迹和答案，用于训练学生模型。\n- **深度解析**: 该流水线包含四个步骤：重写源文档、生成需要推理的问题和评分标准、基于文档上下文回答问题、仅保留真正依赖文档的样本。从3.5k文档中生成约10k样本。实验表明，SFT将Qwen3.6-35B-A3B在CL-bench上的表现从13.7%提升至22.8%，后续基于评分标准的RL阶段达到24.6%，可与超万亿参数模型Qwen3.8-2.4T（23.9%）媲美。在长上下文理解、指令遵循和推理方面有广泛迁移提升，代码生成和知识保持平稳。\n- **领域归类**: [自然语言处理, 大语言模型, 数据合成, 上下文学习]\n---\n\n### 22. Diffusion Reward Models (扩散奖励模型)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33803)\n- **研究任务**: 改进大语言模型对齐中的奖励模型设计，解决现有设计将提示-响应对简化为点估计或固定参数族分布，无法契合人类偏好 inherent multimodal（多峰）特性的问题。\n- **核心亮点**: 提出扩散奖励模型（DRM），将奖励建模重新定义为条件密度估计。使用轻量级扩散Transformer将高斯噪声去噪为奖励向量，不对输出分布做参数假设，自然表示多峰结构。\n- **深度解析**: 单一架构可处理多属性回归和成对偏好数据。推理时，N个样本形成经验奖励分布，可聚合为标量、方差或分位数。在五个基准测试中，DRM在匹配数据和骨干网络的情况下匹配或超越基线，并在传统头退化为点估计的地方恢复多峰奖励结构（具体基准名称和详细数字摘要未提供）。利用不确定性感知的拒绝和下置信界（LCB）聚合来改善决策。下游RLHF实验表明，使用DRM作为训练时奖励可提高策略性能。\n- **领域归类**: [自然语言处理, 强化学习, 人类反馈强化学习 (RLHF), 奖励模型]\n---\n\n### 23. Skill2Env: Capability-Oriented Environment Synthesis from Skills for General Agents (Skill2Env：面向通用智能体的基于技能的能力导向环境合成)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33772)\n- **研究任务**: 解决为需要工具使用和多步交互的任务进行智能体后训练时，构建可执行任务及其环境难以扩展的问题。\n- **核心亮点**: 提出Skill2Env框架，从技能出发，利用智能体能力需求来引导任务和环境合成。通过可重用的难度模式表示需求，并实例化为任务蓝图，指导任务指令、执行基础、工作空间和基于评分的评估器的联合构建。\n- **深度解析**: 提出“迭代任务强化”机制，利用求解器执行证据识别挑战性不足的任务设计，加强或扩展其难度模式实例化，并修改相应的蓝图和环境。使用从Skill2Env环境生成的1.5K高分轨迹进行监督微调，在广泛的智能体基准测试中观察到一致的性能提升（具体基准名称和详细数字摘要未提供）。\n- **领域归类**: [人工智能, 智能体 (Agents), 环境合成, 监督微调]\n---\n\n### 24. In-Flight KV Cache with Clean Anchors for Faster Autoregressive Video Diffusion (具有干净锚点的飞行中KV缓存以加速自回归视频扩散)\n- **社区热度**: `👍 19 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32540)\n- **研究任务**: 加速少步自回归视频扩散模型的长视频生成过程，解决现有方法需要额外前向传播来重建干净或低噪声KV缓存导致的计算开销问题。\n- **核心亮点**: 提出FlashForward方法，直接重用当前块去噪阶段计算出的“飞行中”KV缓存，避免沉重的仅更新缓存的模型前向传播。为每个阶段分配一个GPU，使不同块并发占据不同阶段。\n- **深度解析**: 针对早期可用性带来的质量成本（阶段匹配的历史记录有噪声，导致外观和运动漂移），FlashForward在生成相应区域前生成稀疏的辅助干净锚点潜在变量，通过双向条件稳定生成轨迹。稀疏干净锚点KV提供粗粒度、长程双向结构指导，密集阶段匹配历史保留细粒度、近期演变。在最多四个GPU上，对于1.3B和14B骨干网络在480p和720p下生成20秒或更长的16 FPS视频，FlashForward比HiAR快1.16-1.69倍，比Self-Forcing快1.42-2.92倍。在VBench上，1.3B模型在480p下得分更高且在20s、35s和65s时长下保持稳定。\n- **领域归类**: [计算机视觉, 视频生成, 扩散模型, 推理加速]\n---\n\n### 25. SpatialSpeak: QA-Native Reconstruction with Local and Global Context for Spatial Chain-of-Thought Reasoning (SpatialSpeak：用于空间思维链推理的具有局部和全局上下文的问答原生重建)\n- **社区热度**: `👍 18 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33616)\n- **研究任务**: 提升视觉语言模型（VLMs）在多视角空间推理中的能力，解决仅答案训练无法直接监督中间几何估计及其在推导定量空间答案中应用的问题。\n- **核心亮点**: 提出SpatialSpeak两阶段框架，将问答原生重建预训练与空间思维链（CoT）学习连接起来。假设当VLM首先通过多视角重建联合学习互补的局部几何和全局场景上下文时，空间CoT监督会变得更有效。\n- **深度解析**: 阶段I（QA-RP）结合标记点3D查询（局部几何）和对象中心查询（全局场景上下文），共享自回归输出接口。阶段II（CoT-VC）训练模型表达与问题相关的几何估计并用于推导答案，包含可靠性评估和视觉补偿。在ReVSI上，QA-RP将CoT-VC的提升从2.6分增加到6.9分。在ReVSI、VSI-Bench和SPAR-Bench上取得SOTA，ReVSI得分62.8，比最强基线高8.7分。\n- **领域归类**: [计算机视觉, 视觉语言模型, 空间推理, 思维链 (CoT)]\n---\n\n### 26. Change the Product, Keep the Parameters: Associative Algebra Layers for Transformers (改变乘积，保留参数：用于Transformer的结合代数层)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32814)\n- **研究任务**: 探索是否可以使用不同、更廉价的乘积来替代Transformer中学习到的普通矩阵乘法投影，从而降低计算成本。\n- **核心亮点**: 基于结合代数构造，用相同权重块上更稀疏的交互表替换普通矩阵乘法。构建了一个在物理块大小固定时具有矩阵维度二次算术的族，并推导了GPU执行的有限形状约束。\n- **深度解析**: 该构造在其双线性秩上通过Alder-Strassen界被证明是最优的，并且可以实现为与因果掩码和KV缓存解码兼容的行类型矩形投影。使用相同配方和12.3B token预算训练两个约110M参数的仅解码器Transformer LM（仅前馈层不同）。在四个提示领域，代数模型实现了6.2-7.8%的端到端生成吞吐量增加，但在所有三个报告的下流指标上得分较低（具体下流指标名称和得分摘要未提供）。作者将此视为在小规模下对所提方法的可行性和可训练性检查。\n- **领域归类**: [自然语言处理, 模型架构, 高效计算, Transformer]\n---\n\n### 27. REALM: A Coarse-to-Fine Generative Framework for Embodied Reactive Listening (REALM：用于具身反应式倾听的由粗到细生成框架)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33095)\n- **研究任务**: 为具身对话AI生成响应式的倾听者面部动作，解决如何考虑说话者提示的时序同时保持与倾听者持续动作的连续性，以及捕获局部可变的面部事件与整体运动轨迹的挑战。\n- **核心亮点**: 提出REALM（反应式具身音频驱动倾听模型），一个由粗到细的音频驱动反应式倾听框架。包含一个反应式门控说话者-倾听者融合模块，结合倾听者动作历史和说话者音频，通过以延迟为中心的注意力先验和自适应门控实现。\n- **深度解析**: 粗解码器预测基础运动轨迹，通过音频条件化的表情子空间随机残差进行增强，同时保留粗粒度姿势参数。在ViCo和L2L上的评估显示，在多个运动质量指标上优于基线（具体提升数字摘要未提供）。额外分析检查了延迟敏感性、门控行为和眨眼动态。在Ameca人形机器人上的部署和感知用户研究证明了生成行为对物理具身的适用性。\n- **领域归类**: [计算机视觉, 具身智能, 人机交互, 面部动作生成]\n---\n\n### 28. RoboFoundry: System-as-Policy Evolution for Self-Learning Embodied Agents (RoboFoundry：面向自学习具身智能体的系统即策略演化)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32862)\n- **研究任务**: 解决现有具身智能体方法通常优化智能体堆栈的单个组件，而不是将支持系统本身视为统一策略的问题，以及交互本身无法产生自我改进的问题。\n- **核心亮点**: 提出RoboFoundry，首个将具身智能体过程 formulize 为“自演化系统即策略”的框架。诊断决策和记忆管理中的能力差距，将执行轨迹转化为经过验证的特定任务系统更新，并将反复出现的改进推广到通用系统。\n- **深度解析**: 演化在管理内部上下文和文件系统记忆的上下文系统，以及组织原子技能和分层技能系统两个表面进行。在EmbodiedBench上达到SOTA，将GPT-5.5提升27.8%，使Qwen3.7-Plus接近GPT-5.5的水平（70.3% vs. 72.7%）。在RoboMemArena上长期记忆表现超越所有基线至少39.0%。在LIBERO-PRO上超越Cap-Agent0 243.8%-679.7%。在真实世界部署中展示了零样本迁移和在线演化。\n- **领域归类**: [人工智能, 具身智能, 机器人学, 自我进化]\n---\n\n### 29. AdaTutoRank: Learning to Rerank Document Sets via Adaptive Tutoring Optimization for RAG and Deep Research (AdaTutoRank：通过自适应辅导优化学习重排文档集以用于RAG和深度研究)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32472)\n- **研究任务**: 改进RAG和深度研究中的文档重排器，解决主流重排器仅通过相关性匹配选择文档导致检索集缺乏完整性、互补性且存在冗余，以及现有集合级评分方法监督稀疏（信用分配困难）的问题。\n- **核心亮点**: 提出AdaTutoRank，一个使用自适应辅导优化（ATO）训练的集合级重排器。在包含九个评分维度的三层层次结构下，提供冷启动的银标签、强化学习的奖励和蒸馏的提示。\n- **深度解析**: ATO从策略自身的冻结快照中提取三种特异性递增的提示形式：仅评分标准、在评分标准下选择的兄弟集、以及对比滚动输出与兄弟集的反思。每个滚动输出接收与其质量匹配的提示形式，并将提示效果蒸馏为token级优势。在涵盖RAG、深度研究和集合级评估的十个基准测试中，AdaTutoRank取得了最佳整体性能，同时发出的检索调用更少（具体基准名称和详细数字摘要未提供）。\n- **领域归类**: [自然语言处理, 检索增强生成 (RAG), 信息检索, 强化学习]\n---\n\n### 30. WideSWE: Can Coding Agents Coordinate Changes Across Repositories? (WideSWE：编码智能体能协调跨代码库的更改吗？)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33382)\n- **研究任务**: 评估编码智能体在需要跨多个代码库协调更改的复杂软件工程任务上的能力，解决现有评估主要局限于单一代码库的问题。\n- **核心亮点**: 引入WideSWE基准，通过挖掘和审查103个软件生态系统的更改，生成120个真实世界任务（60个bug修复和60个功能开发平衡），用于评估编码智能体的跨代码库任务。\n- **深度解析**: 从相关问题和拉取请求中推导提示，系统地审查和调整隐藏测试以支持多样化的正确实现。在七种智能体配置中，完全任务成功率在10.83%到42.50%之间，其中Codex CLI与GPT-5.6-sol配对配置达到最高成功率。轨迹显示智能体未能识别必要的更改、识别但未完成更改、或修改了所需代码库但未完全满足请求。对比发现，独立执行主要恢复遗漏的工作，而联合执行可以利用相关代码库的信息指导实现和验证。\n- **领域归类**: [软件工程, 编码智能体, 基准测试, 代码生成]\n---\n\n### 31. Structured Residual Connectivity Matters for Diffusion Transformers (结构化残差连接对扩散Transformer至关重要)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33203)\n- **研究任务**: 重新思考扩散Transformer（DiTs）中的残差连接，将其从被动的求和转变为针对图像去噪优化的主动检索机制。\n- **核心亮点**: 提出了一种结构化连接设计，显式地将局部残差连接与长程路径结合，使每个Transformer块能够选择性地“关注”关键的早期表示，动态检索空间和语义线索。\n- **深度解析**: 研究分析了DiT的内部表示，发现其偏好早期层特征复用和对称层引导。实验表明，该自适应连接方法在增加不到0.1%参数的情况下，使训练迭代次数减少高达1.73倍，并在REPA-XL/2模型上将无引导FID从5.9降至4.34，有分类器自由引导FID达到1.39。摘要未提供具体使用的数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [计算机视觉, 图像生成, 扩散模型, Transformer]\n---\n\n### 32. Just MLPs: Efficient Visual State Reconstruction for Multimodal Language Models (仅需MLP：多模态语言模型的高效视觉状态重建)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34972)\n- **研究任务**: 降低多模态大语言模型（MLLMs）中长视觉token序列带来的计算开销，同时保留所有视觉token以避免丢失有用信息。\n- **核心亮点**: 提出δ-Vision方法，用轻量级低秩适配器替代视觉token的重复Transformer演化，构建逐层视觉记忆，同时保留所有视觉token供文本检索。\n- **深度解析**: 研究发现，阻断视觉到文本的注意力后，仅恢复少数方向即可恢复大部分丢失的准确率，表明相关视觉影响集中在低维子空间。此外，轻量级MLP能以高余弦相似度和低重建误差近似特定层的视觉状态。在图像和视频基准测试中，δ-Vision在计算量相当或更低的情况下，准确率高于视觉token剪枝基线。摘要未提供具体的图像和视频基准测试数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [多模态大语言模型, 视觉token压缩, 模型加速]\n---\n\n### 33. Rethinking Training-Inference Mismatch in LLM Reinforcement Learning: Where It Arises and How to Correct It (重新思考大语言模型强化学习中的训练-推理不匹配：来源与纠正方法)\n- **社区热度**: `👍 15 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32444)\n- **研究任务**: 解决大语言模型在可验证奖励强化学习（RLVR）中，推理引擎和训练引擎对同一token分配不同概率导致的训练-推理不匹配问题。\n- **核心亮点**: 引入校准重要性采样（CIS），通过置信度感知截断来处理不匹配，将精确重要性采样的无界二阶矩替换为有界项。\n- **深度解析**: CIS将不匹配表示为对数几率中的加性位移，其分布近似独立于token置信度。在三个混合专家模型和五个数学推理基准上的评估中，CIS在所有三个模型上取得了最高的五基准平均分。诊断分析表明，CIS对低置信度token的截断偏差小于截断重要性采样，而对小重要性权重的向上裁剪会降低留出集准确率。摘要未提供具体的混合专家模型和数学推理基准名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [大语言模型, 强化学习, 训练与推理优化]\n---\n\n### 34. FlowTool: Controlling Tool Parameter in Image Retouching via Flow Matching (FlowTool：通过流匹配控制图像修饰中的工具参数)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35673)\n- **研究任务**: 将基于工具的图像编辑（图像修饰）任务建模为流匹配问题，直接生成高质量的工具参数，替代自回归多模态大模型的顺序生成。\n- **核心亮点**: 提出FlowTool框架，结合视觉语言模型主干和扩散Transformer参数生成器，使用条件整流流将高斯噪声转化为编辑计划，并通过两阶段监督流匹配课程和基于奖励的后训练进行训练。\n- **深度解析**: 在MMArt-Bench、FlowTool-Eval、ArtEdit-Bench和MIT-Adobe5K数据集上，FlowTool在基于参考的性能上显著优于专用MLLM编辑代理和专有MLLM，在无参考评估中与专有模型具有竞争力。此外，FlowTool显著提高了推理效率，延迟降低至少50倍，内存需求比基线减少近2倍。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [计算机视觉, 图像编辑, 流匹配, 多模态大模型]\n---\n\n### 35. Precise Editing and Flexible Referencing for Interactable Worlds (可交互世界的精确编辑与灵活参考)\n- **社区热度**: `👍 14 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34470)\n- **研究任务**: 将视频世界模型从单纯的探索导航扩展到对现有世界内容的精确修改，支持流式编辑指令和参考图像。\n- **核心亮点**: 提出EditWorld，引入门控因果注意力处理随时间变化的编辑条件和参考图像，以及稀疏上下文机制维持长视野推理的有界历史上下文。\n- **深度解析**: 采用联合自回归和双向训练及退火自重采样，并构建专门的数据合成与标注管道。在提出的WBench-Editing基准上，EditWorld取得最佳整体表现，总分73.8，编辑得分80.0，大幅超越现有方法。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [视频生成, 世界模型, 视频编辑]\n---\n\n### 36. Hard Vision, Easy Vision: What GPT-6 Astra Reveals Across Computer Vision (困难视觉与简单视觉：GPT-6 Astra在计算机视觉领域的启示)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35718)\n- **研究任务**: 评估前沿通用系统（如GPT-6 Astra）在计算机视觉任务中的能力边界，探讨其在多大程度上能替代专用视觉模型。\n- **核心亮点**: 在34项能力和55个跨越计算机视觉9个领域的基准测试中评估GPT-6 Astra及其他5个前沿系统，绘制了通用视觉接口的能力版图。\n- **深度解析**: Astra在视觉和空间推理及多种结构化预测方面大幅领先其他系统。涉及语义解释、推理和以对象为中心的预测的能力正逐渐接近或达到参考水平；但在需要度量几何精度、忠实重建、时间一致密集预测或专门细粒度视觉知识的任务中仍存在较大差距。摘要未提供具体的基准测试和数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [计算机视觉, 大模型评测, 通用人工智能]\n---\n\n### 37. Imprint Reader: From Weight-Update Readout to Behavioral Intervention (Imprint Reader：从权重更新解读到行为干预)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35261)\n- **研究任务**: 使语言模型能够反思自身的学习过程，将训练留下的参数级痕迹解码为明确的自然语言描述，并利用其进行行为干预。\n- **核心亮点**: 引入Imprint Reader模型，通过语义挂载与读取微调（SaRT）描述冻结的权重更新；提供MetaEdit方法，利用Reader的梯度支持通过权重修剪进行行为干预。\n- **深度解析**: 在保留的更新上，联合Reader在知识和行为上的Pass@100分别达到2%和16%。在0.5%的修剪率下，Reader引导的选择将有害提示拒绝率从57.9%提升至64.1%。在不使用目标任务训练数据的情况下，MetaEdit增加了数学推理轨迹中回溯和子目标表达的频率，并将BFCL Overall从41.69%提升至44.60%。摘要未提供其他具体使用的数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [大语言模型, 模型可解释性, 模型编辑与安全]\n---\n\n### 38. TT-VidT: Decoupling the Temporal Axis for Efficient Motion-Centric Video Pretraining (TT-VidT：解耦时间轴以实现高效的以运动为中心的视频预训练)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33419)\n- **研究任务**: 在视频自监督学习中隔离方法本身的影响，识别哪些选择能产生以运动为中心的表示，并提出TT-VidT架构。\n- **核心亮点**: 提出TT-VidT，结合DINOv3初始化的ViT-B/16空间路径和紧凑的时间传递层，通过Diff Compression从第一帧外观锚点和特定帧运动token重建目标帧。\n- **深度解析**: 在约170M~190M编码器规模上进行了24种架构-目标研究。结果表明，TT3D与Diff Compression结合进入了最强的运动敏感机制。在Jester、Something-Something V2、ARID和Diving48微调中同时领先，比最强非TT行提高54%~121%，编码器FLOPs比DisMo少48%，比VideoMAE或V-JEPA2少55%。摘要未提供其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [计算机视觉, 视频理解, 自监督学习]\n---\n\n### 39. SolveEdit: Benchmarking Visual Problem Solving in Generative Models (SolveEdit：生成式模型中视觉问题求解的基准测试)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35504)\n- **研究任务**: 填补目标驱动的视觉问题求解（如排列物体、修复布局）在现有基准测试中的空白，评估模型理解场景、推断变化并执行变换的能力。\n- **核心亮点**: 引入SolveEpIT基准和SolveEdiT-PLAN两阶段视觉规划器，通过原子转换契约指定必要和保护条件，衡量完成度和意外变化。\n- **深度解析**: SolveEpIT包含2728个案例。最强评估模型仅达到57.0%的SolveScore。引入的SolveEdiT-PLAN两阶段视觉规划器在生成前实例化转换，在GPT-Image-2上将SolveScore从57.0%提升至71.6%。摘要未提供其他具体使用的数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [计算机视觉, 图像编辑, 基准测试, 视觉推理]\n---\n\n### 40. SciGen-Verifier: A Multimodal Reasoner for Explainable Verification in Scientific Image Generation (SciGen-Verifier：科学图像生成中可解释验证的多模态推理器)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33399)\n- **研究任务**: 解决科学图像生成中验证正确性的瓶颈，提供针对科学图像生成的可解释验证和错误纠正反馈。\n- **核心亮点**: 构建SciGen-Verify基准，开发SciGen-Verifier推理驱动的多模态验证器，通过冷启动监督微调和基于课程的两阶段强化学习管道进行训练。\n- **深度解析**: SciGen-Verify基准包含三层分层协议，支持解释和纠正编辑指令。SciGen-Verifier通过基于规则的过程奖励加强科学推理探索，然后通过结果奖励与真实标注对齐。在SciGen-Verify上，SciGen-Verifier取得了与更大专有模型竞争的性能，并可作为迭代图像校正的实用在线评估器。摘要未提供其他具体使用的数据集名称及其他未提及的实验结果、数字、数据集或技术细节。\n- **领域归类**: [多模态大模型, 科学计算, 图像生成验证]\n---\n\n### 41. Program-Verified Self-Evolution for Vision-Language Models (面向视觉语言模型的程序验证自进化)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33855)\n- **研究任务**: 解决视觉语言模型在自进化（利用无标签图像生成问题进行训练）过程中，由于缺乏标准答案，导致多数投票（24%错误率）或模型评判（18%错误率）产生错误标签的问题。\n- **核心亮点**: 提出 VQS（面向自进化模型的可验证问答生成）方法。该方法改变了模型判断答案的方式：模型先将图像解析为结构化记录（如场景图、图表等），由固定程序生成问题并计算答案，模型仅作为视觉检查器逐一确认程序读取的单个事实。\n- **深度解析**: 摘要提供了详细的实验与技术细节。通过声明级别的检查来选择解析器的训练目标，使解析器无需标签即可改进。人类评估显示 VQS 答案正确率达 94%，远超多数投票的 76%。在 10 个基准测试中，VQS 在 2B、4B 和 8B 规模上将 Qwen3-VL 的性能提升了最高 3.18 分，并在三轮训练中持续增长至 3.84 分，超越了最强的自进化基线。代码已开源。\n- **领域归类**: [多模态学习, 视觉语言模型, 自进化/自训练]\n---\n\n### 42. An RL View of OPD: Least Square Policy Distillation for Sample-Efficient LLM Reasoning (从强化学习视角看在线策略蒸馏：用于样本高效 LLM 推理的最小二乘策略蒸馏)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35505)\n- **研究任务**: 通过强化学习（RL）视角研究在线策略蒸馏（OPD），建立 OPD 中的 reverse-KL 目标与 KL 正则化策略优化之间的联系，旨在提高大语言模型推理的样本效率。\n- **核心亮点**: 提出最小二乘策略蒸馏（LSPD）框架。该框架受 RL 启发，将基于价值的 RL 中的乐观探索和非策略数据重用引入策略蒸馏，在保持策略多样性的同时，通过重复学习先前收集的轨迹来提高 rollout 效率。\n- **深度解析**: 摘要提供了具体的实验与理论细节。理论分析表明，LSPD 的理想化公式在在线探索下可实现 $\\mathcal{O}(\\log K)$ 的尖锐遗憾界。在 6 个数学推理基准和多种师生设置中，LSPD 的 Avg@16 平均提升 +1.59 分。Pass@k（最高至 k=64）评估显示其更好地保留了策略多样性。其完全非策略变体仅使用 25% 的 rollout 批次即可达到 vanilla OPD 的性能。\n- **领域归类**: [大语言模型, 强化学习, 模型蒸馏, 逻辑推理]\n---\n\n### 43. InfiniHand: Streaming World-Space Hand Motion Estimation from Egocentric Video (InfiniHand：从自我中心视频中流式估计世界空间手部运动)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35743)\n- **研究任务**: 解决从自我中心视频中估计世界空间手部运动时，现有方法依赖级联独立手部姿态估计器和 SLAM 系统所导致的误差累积、流程复杂和计算开销大的问题。\n- **核心亮点**: 提出 InfiniHand，一个端到端的流式前馈框架。它直接从未校准的自我中心视频中联合估计 MANO 参数、相机轨迹和手部位置，将持久时空记忆与以手部为中心的视觉特征相集成，在统一架构中显式耦合相机运动与局部手部几何。\n- **深度解析**: 摘要提供了详细的实验数据。模型通过两阶段渐进训练，并使用约 5,000 小时的自我中心数据进行预训练。在域内基准测试中，InfiniHand 比 ViDiHand 的 ARCTIC PA-p 降低了 21.4%，并大幅减轻了世界空间漂移。此外，它能稳健地泛化到野外视频，运行速度达 11.19 FPS，吞吐量是 HaWoR 的两倍多。\n- **领域归类**: [计算机视觉, 3D 重建, 自我中心视觉, 动作捕捉]\n---\n\n### 44. Residual Transferability in Neural Image Watermarking (神经图像水印中的残差可迁移性)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32241)\n- **研究任务**: 研究并形式化神经图像水印中的“残差可迁移性（RT）”漏洞（即提取水印残差并转移到无关图像上进行伪造），探究导致残差可迁移的根本原因，并寻找有效的防御方法。\n- **核心亮点**: 发现架构设计在 RT 差异中起核心作用，并识别出两种增强水印证据对封面图像依赖性的机制以抑制 RT。提出即插即用的 CoverLock 策略，在不重新设计现有水印系统架构的情况下增强图像依赖性。\n- **深度解析**: 摘要未提供。\n- **领域归类**: [计算机视觉, 图像安全, 数字水印, 深度学习安全]\n---\n\n### 45. Nereus: Adaptive Parallelism for LLM Post-Training (Nereus：面向大语言模型后训练的自适应并行)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34645)\n- **研究任务**: 解决大语言模型强化学习后训练过程中，由于资源可用性、序列长度、内存压力和阶段瓶颈等因素动态变化，导致初始执行计划变慢或不可行的问题，特别是应对模型共享 GPU 时调整计划的高昂过渡成本和状态复用挑战。\n- **核心亮点**: 提出 Nereus，一个成本感知的运行时系统。它通过低成本控制器选择内存可行的全局计划，利用“弹性模型单元”表示分布式状态，并采用全局过渡图来协调 GPU 转移和状态重用，从而实现高效的执行计划自适应。\n- **深度解析**: 摘要提供了具体的实验性能数据。在真实数据构建的 trace 中，在线 TP/PP 适应使平均步延迟比初始固定布局降低 27.7%。在 1,000 步、1,024 GPU 的运行中，6 次转换仅占总运行时间的 0.079%。Nereus 将端到端 8B PPO 吞吐量比 OpenRLHF 提高 2.14--7.27 倍，比 Verl 提高 1.10--1.47 倍。\n- **领域归类**: [大语言模型, 分布式系统, 训练加速, 强化学习]\n---\n\n### 46. BaRe-Mem: Bayesian Reliability Memory for Robust and Adaptive Agent Consultation (BaRe-Mem：用于鲁棒自适应智能体协商的贝叶斯可靠性记忆)\n- **社区热度**: `👍 8 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35551)\n- **研究任务**: 解决多智能体系统中可靠协商的挑战，即顾问能力因任务而异，且误导性信息可能导致协商效果不如自主推理的问题。\n- **核心亮点**: 提出 BaRe-Mem，一种用于多智能体协商的在线贝叶斯可靠性记忆。它基于中心模型的内部信念表示来估计顾问的可靠性，并根据历史交互进行更新，从而调节顾问响应的影响，并智能指导选择协商还是自主推理。\n- **深度解析**: 摘要提供了实验设置与结果细节。在 9 个基准和 6 个中心模型上，BaRe-Mem 对误导性信息的鲁棒性优于辩论和多数投票；在困难任务中，所有测试的误导性级别下其表现均保持在自主推理之上。在 MuSiQue 基准上，BaRe-Mem 通过历史成功计数改进了路由的任务完成度，并能更早识别出有能力的 worker。\n- **领域归类**: [多智能体系统, 大语言模型应用, 贝叶斯方法, 决策优化]\n---\n\n### 47. GeoVerse: World-Consistent Novel View Synthesis in Geometric Latent Space (GeoVerse：几何潜空间中的世界一致性新视角合成)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35734)\n- **研究任务**: 解决从稀疏图像进行新视角合成时，基于几何的方法难以补全未见区域，而视频生成模型在顺序生成中会积累不一致性的问题，以实现世界一致性的新视角合成。\n- **核心亮点**: 提出 GeoVerse 框架，在预训练 3D 基础模型的几何潜空间中执行生成，并通过 ControlNet 风格的适配器从视频生成模型（Wan2.2 VACE）注入多级外观先验。引入全局空间记忆持续聚合内容，将目标对齐的引导重新投影，以强制跨视角一致性。\n- **深度解析**: 摘要提供了具体的实验对比数据。在 DL3DV 数据集上，GeoVerse 的 PSNR 比 GLD 高 2.23 dB；在 Mip-NeRF360 数据集上，其 ATE 比 GLD 低 32.4%，显著提升了视觉质量和几何一致性。\n- **领域归类**: [计算机视觉, 3D 视觉, 新视角合成, 生成模型]\n---\n\n### 48. RenderRank: Learning to Rerank Text with Compressed Visual Tokens (RenderRank：使用压缩视觉标记学习文本重排序)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35069)\n- **研究任务**: 解决传统基于文本的重排序器在处理文档时输入序列较长的问题，探索将文档文本渲染为图像并使用视觉语言模型编码为压缩视觉标记，以减少输入长度并提高重排序效率。\n- **核心亮点**: 提出 RenderRank，一种从压缩的视觉文档表示中学习查询相关性评分的重排序器。训练时先对齐视觉输入与文本教师的相关性评分，再细化同一查询下正负文档的相对评分，从而替代传统的文本标记序列。\n- **深度解析**: 摘要提供了详尽的实验数据。在 BEIR 的 11 个数据集上，RenderRank 减少 16.5-35.5% 的输入 token，平均 NDCG@10 达 55.96，超越所有 4B 参数以下的文本基线及部分更大模型。在 4 个长文档数据集上，平均 NDCG@10 达 88.27，输入 token 数约为文本重排序器的一半，吞吐量是评估基线最高平均值的 1.70 倍。\n- **领域归类**: [信息检索, 视觉语言模型, 文档理解, 模型加速]\n---\n\n### 49. Rethinking Automated Voice Similarity by Shifting from EER to Embedding Geometry (重新思考自动语音相似度：从 EER 转向嵌入几何)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33999)\n- **研究任务**: 重新评估说话人验证（SV）模型作为语音生成任务中人类语音相似度自动代理的有效性，挑战“验证准确率（EER）越高，模型越能捕捉说话人特征细微差别”的社区隐含假设。\n- **核心亮点**: 证明感知对齐更多由模型的训练方式（学习目标）而非性能（EER）决定。标准基于边际的分类损失（如 AAM-Softmax）的感知对齐远低于原型度量损失。将差异追溯到嵌入几何，发现模型的有效维度（$d_{eff}$）与感知对齐呈 -0.95 的秩相关。\n- **深度解析**: 摘要提供了具体的几何与实验细节。研究表明，分类损失偏好的维度扩展与人类语音感知的低维本质相冲突。通过施加维度瓶颈压缩 $d_{eff}$，可将感知对齐（$\\rho_{align}$）从 0.08 大幅提升至 0.74，为评估语音相似度建立了原则性的几何标准。\n- **领域归类**: [语音处理, 说话人验证, 表示学习, 模型评估]\n---\n\n### 50. Fewer Tokens, More Self-Teaching: On-Policy Self-Distillation for Extreme Visual Token Reduction (更少标记，更多自教：用于极端视觉标记缩减的在线策略自蒸馏)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32353)\n- **研究任务**: 解决多模态大语言模型（MLLM）在极低视觉标记预算下性能急剧下降的问题，探索重度压缩的 MLLM 应如何从自身生成诱导的状态中进行有效学习。\n- **核心亮点**: 提出 LT-OPD 训练框架，采用在线策略自蒸馏。学生模型仅使用极少视觉标记生成响应，而同一 MLLM 的冻结全标记副本作为教师，沿学生生成的轨迹提供分布监督。引入预算级课程学习，在训练中逐步降低 token 预算以稳定学习。\n- **深度解析**: 摘要提供了详细的实验与效率数据。在 Qwen3.5-4B 的 9 个基准上，5% 视觉 token 保留率下的平均保留性能从 68.6% 提升至 82.3%，超越同预算的免训练、训练基和 RL 基线。增益一致转移至 Qwen3.5-9B、GLM-4.6V-9B 和 LLaVA-OV-1.5-4B。此外，KV 缓存使用减少 85.2%，prefill FLOPs 减少 85.4%，且无额外推理开销。\n- **领域归类**: [多模态大语言模型, 模型压缩, 知识蒸馏, 强化学习]\n---\n\n### 51. Relic: From Multi-Agent Collaboration to Persistent Organizational Capability (Relic：从多智能体协作到持久的组织能力)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32965)\n- **研究任务**: 解决多智能体组织中协作冲突和知识流失的问题，将重复的协作失败转化为组织拥有的、可执行的协议，使协作经验成为超越个体成员的持久组织状态。\n- **核心亮点**: 提出 Relic 框架，让智能体成员反思可见工作、提出规则并管理其采用。被采用的协议将触发器、责任、所需证据和执行后果绑定到运行时，同时保留修订和退役的开放性。\n- **深度解析**: 在 360 次受控运行中，Relic 将完整合同交付率从 14.06% 提升至 19.76%。在新成员转移测试中，可执行绑定的行为正确率达 41.2%，比纯文本规则高 6.5 个百分点。在 CooperBench 基准上达到 76.9% 的最佳结果，并在 48 对同模型子集上超越 Solo 基线（29/48 vs. 26/48），逆转了官方对等基线 exhibited 的协调损失。\n- **领域归类**: [Multi-Agent Systems, Software Engineering, Organizational AI]\n---\n\n### 52. Measuring Collapse and Correction in Homogeneous-Panel LLM Debate (测量同质面板大语言模型辩论中的崩溃与纠正)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35279)\n- **研究任务**: 评估多智能体大语言模型辩论中的动态变化，区分“崩溃”（原本正确的多数意见被破坏）和“纠正”（原本错误的多数意见被挽救），解决传统最终准确率评估混淆这两种相反机制的问题。\n- **核心亮点**: 引入一种可审计的同质辩论协议，将每次运行记录为关于崩溃、纠正、发生和符号干预效用的转换账本，从而更准确地评估干预措施的真实影响。\n- **深度解析**: 在 6,925 次 MMLU-Pro 辩论中识别出 253 次崩溃。重放实验表明，防止崩溃的策略（如探针门控冻结）会损失大量纠正机会。8 探针预辩论筛选与条件崩溃风险高度相关（Spearman rho=0.893），且许多崩溃发生在第一轮。研究释放了可重放模式、编码器和审计工具以供未来在相同分母下进行比较。\n- **领域归类**: [Large Language Models, Multi-Agent Debate, Evaluation Metrics]\n---\n\n### 53. WaveFront Decoding: Parallelized Self-Speculative Decoding for Looped Language Models (波前解码：循环语言模型的并行化自推测解码)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23033)\n- **研究任务**: 解决循环语言模型在解码时因多次顺序调用权重共享块而导致的延迟大幅增加问题。\n- **核心亮点**: 提出 Wavefront Decoding (WFD)，一种无需训练的自推测解码框架。利用中间循环输出作为草稿预测，并通过权重共享将不同位置和深度的 token 状态在一个批处理的循环块调用中处理，形成对角波前，并发批处理草稿和验证。\n- **深度解析**: 在 Spec-Bench 的六个任务类别中，WFD 在 Ouro-2.6B 上实现 2.42 倍加速，在 Huginn-3.5B 上实现 3.54 倍加速，持续优于传统的“先草稿后验证”调度。结合跨循环 KV 共享，Huginn-3.5B 的加速比进一步提升至 4.81 倍。\n- **领域归类**: [Inference Optimization, Speculative Decoding, Looped Language Models]\n---\n\n### 54. When Do Model Internals Help? Exploring the Role of Representation Engineering in LLM Safety (模型内部状态何时起作用？探索表征工程在大语言模型安全性中的作用)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34771)\n- **研究任务**: 比较和评估行为对齐方法（如 DPO）、表征工程（读取或修改内部模型状态）以及文本监控器在 LLM 安全性控制与监控中的相对优势和适用条件。\n- **核心亮点**: 系统评估发现，表征工程虽不能普遍替代行为安全措施，但在低数据设置下的安全控制中具有竞争力；在安全监控方面，表征探针在边际成本大幅降低的情况下仍具竞争力，且监控引导的干预可恢复 DPO 在良性微调后丢失的安全性。\n- **深度解析**: 摘要未提供\n- **领域归类**: [LLM Safety, Representation Engineering, Alignment]\n---\n\n### 55. DroneWAM: Efficient World Action Model for Drone Visual Navigation (DroneWAM：用于无人机视觉导航的高效世界动作模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33148)\n- **研究任务**: 为无人机视觉导航开发一种高效的世界动作模型，使其能够在严格的准确性和效率约束下，预测候选动作将如何改变未来的观测并据此采取行动。\n- **核心亮点**: 提出 DroneWAM，采用基于 JEPA 的架构直接在表征空间建模未来状态以避免显式图像生成的成本。引入预训练的 Resampler 压缩特征，以及自适应 rollout 机制，通过偏好训练的 Gate 根据当前场景动态分配预测深度。\n- **深度解析**: 在构建的 DroneNav-6D 模拟数据集上，DroneWAM 实现了最佳的轨迹精度。自适应 rollout 机制将平均预测深度从 8 降低至 4.58，同时进一步提升了轨迹精度，证明了预测计算可以在不同场景间更有效地分配。\n- **领域归类**: [Robotics, Visual Navigation, World Models]\n---\n\n### 56. Draft-KV: Learning Useful Latent Communication Between Language Models (Draft-KV：学习大语言模型之间有用的潜在通信)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34754)\n- **研究任务**: 解决大语言模型之间潜在通信中接收者可能未真正使用消息内容的问题，确保接收者确实利用了共享者传递的内部状态信息。\n- **核心亮点**: 提出 Draft-KV，发送共享者起草答案时形成的键值（KV）状态。通过线性投影将这些状态放置在侧内存中，并通过门控注意力分支读取。接口仅训练 1.05M 个参数，比 C2C 少 348 倍。\n- **深度解析**: 使用 Qwen3-8B 作为共享者和冻结的 Qwen2.5-0.5B-Instruct 作为接收者，在 MMLU-Redux 上达到 78.04% 的准确率，远超单独的 37.45% 和错误消息的 36.40%。在固定接口大小下，共享者从 0.6B 扩展到 8B 使准确率从 46.11% 升至 78.04%，且通信能力可迁移至未见任务。\n- **领域归类**: [Latent Communication, Model Collaboration, Efficient Inference]\n---\n\n### 57. TokenCast: Forecasting Token Consumption During LLM Agent Execution (TokenCast：预测大语言模型智能体执行过程中的 Token 消耗)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35760)\n- **研究任务**: 预测大语言模型智能体在执行任务过程中的 Token 消耗量，解决由于上下文不断增长和工具反馈导致的消耗难以预测且需动态修正的问题。\n- **核心亮点**: 提出 TokenCast，为每个执行段学习一个可组合的成本表示，记录其自身的消耗和引入的上下文增长。组合相邻段可得到累积估计，且随着执行展开，新观察到的证据会刷新预测，无需额外的 LLM 调用。\n- **深度解析**: 在 SWE-bench Verified 上，每次运行的平均累积预测时间仅为 32.8 毫秒。在 4 个任务套件和 6 个智能体模型的 96 种组合中，平均绝对误差比最强基线降低 14.5%。在离线预算控制重放中，相比固定预算策略平均节省 21.3% 的 Token。\n- **领域归类**: [LLM Agents, Cost Prediction, Resource Management]\n---\n\n### 58. KVCMAS: Efficient KV cache Correction for Shared Context in Multi-Agent Systems (KVCMAS：多智能体系统中共享上下文的高效 KV 缓存校正)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34060)\n- **研究任务**: 解决提示特化多智能体系统中，由于智能体特定前缀改变共享上下文的 KV 缓存，导致每个智能体重复预填充和构建独立缓存所带来的高计算和内存开销问题。\n- **核心亮点**: 提出 KVCMAS，一种在线 KV 缓存校正框架。使用紧凑的低秩状态表示跨智能体缓存偏差，并沿智能体工作流无缝链接校正，无需额外的参考预填充，支持动态变化的共享上下文并保留精确的第一智能体缓存。\n- **深度解析**: 在多种语言和视觉语言工作负载中，KVCMAS 在高度并发服务下实现了最低的 TTFT。相比无 KV 缓存共享，TTFT 加速 2.0 倍；相比先前的 KV 缓存校正方法，峰值 GPU 内存减少高达 3.7 倍，同时匹配或提升了准确率。\n- **领域归类**: [Inference Optimization, KV Cache, Multi-Agent Systems]\n---\n\n### 59. PReCache: Efficient KV Cache Sharing for Multi-LoRA Agents via Low-Rank Precomputation and Neutral Reconstruction (PReCache：通过低秩预计算和中性重构实现多 LoRA 智能体的高效 KV 缓存共享)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34054)\n- **研究任务**: 解决多 LoRA 智能体系统中，每个智能体重复处理增长的共享轨迹并构建自己的 KV 缓存所带来的内存和计算冗余问题，同时避免直接缓存复用削弱智能体特定角色行为的问题。\n- **核心亮点**: 提出 PReCache，一种无需训练的 KV 缓存共享框架。PreLRShared 预计算每个智能体的低秩缓存以消除重复预填充；ReBaseShared 从无适配器隐藏状态重构共享基础缓存，以减少前一个智能体适配表示带来的误差。\n- **深度解析**: PreLRShared 实现了高达 3.1 倍的 TTFT 加速和 2.3 倍的每请求吞吐量提升。ReBaseShared 在评估的缓存共享方法中最好地保留了准确率，与无缓存共享推理相比，平均准确率仅下降 1.1 分。\n- **领域归类**: [Inference Optimization, KV Cache, Multi-LoRA Systems]\n---\n\n### 60. Beyond Timestamps: Decision-Aligned On-Policy Distillation for Long-Horizon Agents (超越时间戳：面向长期智能体的决策对齐在策略蒸馏)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33391)\n- **研究任务**: 解决具有可验证奖励的强化学习中，在策略自蒸馏（OPSD）的特权指导与学生功能决策不匹配的“决策-时间戳不匹配”问题，避免基于时间戳的局部监督导致上下文和时间信用范围错位。\n- **核心亮点**: 提出 AlignOPSD，遵循“在分配信用前对齐监督”的原则。包括决策对齐监督校正（在兄弟 rollout 中功能匹配的上下文中重新评分）和半马尔可夫分层信用分配（从对应关系变化中推导可变持续时间的决策跨度，并分配基于结果的信用）。\n- **深度解析**: 在 ALFWorld、WebShop 和 Search-QA 上使用 Qwen2.5-3B 和 Qwen2.5-7B 进行评估。AlignOPSD 在所有八种主干-聚合指标比较中均优于 GRPO 和 StepOPSD，比 GRPO 提升 5.5% 至 8.7%，并在六项指标中排名第一。\n- **领域归类**: [Reinforcement Learning, On-Policy Distillation, Long-Horizon Agents]\n---\n\n### 61. ColNanoVDR: Document-Free Query Distillation for Multi-Vector Visual Document Retrieval via Optimal Transport (ColNanoVDR：基于最优传输的多向量视觉文档检索无文档查询蒸馏)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34899)\n- **研究任务**: 视觉文档检索（VDR）中多向量检索器的查询编码器蒸馏，以解决每次搜索运行数十亿参数查询编码器的计算瓶颈。\n- **核心亮点**: 提出了ColNanoVDR框架，首次将无文档蒸馏引入多向量VDR。其目标函数OTW（带学习权重的最优传输）通过熵最优传输对齐学生查询token和教师token，无需两者tokenization之间的对应关系。\n- **深度解析**: 传统蒸馏方法需要编码和缓存每个训练页面（数据量可达TB级），而此前的NanoVDR仅使用教师的查询嵌入进行训练，但仅限于单向量检索器。ColNanoVDR证明了产生的对齐代价限制了每页的MaxSim得分差异。从五个SOTA教师蒸馏出的149M纯文本学生模型，在ViDoRe v1-v3数据集上保留了约95%的NDCG@5，同时查询编码速度提升高达26倍。在相同训练条件下，OTW在不编码任何页面且读取的缓存教师数据减少12.6倍的情况下，匹配了得分蒸馏的效果。\n- **领域归类**: [信息检索, 视觉语言模型, 模型蒸馏]\n---\n\n### 62. On-Policy Self-Distillation for Multi-Turn Image Editing (面向多轮图像编辑的同策略自蒸馏)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35611)\n- **研究任务**: 解决基于指令的图像编辑模型在多轮（迭代）编辑场景下性能快速下降的问题。\n- **核心亮点**: 提出MT-OPSD（同策略自蒸馏）框架，在多轮编辑中，使用模型自己生成的条件状态进行训练，并由干净条件教师提供编辑监督，无需多轮标注。引入LME-Bench基准测试评估长期鲁棒性。\n- **深度解析**: 现有编辑模型在递归编辑时退化，原因是训练-测试分布不匹配（训练时使用干净图像，推理时却反复条件化于自身不完美的输出）。MT-OPSD通过在三个编辑骨干网络上的实验表明，该方法大幅提高了长期编辑的成功率，减少了多轮崩溃，同时基本保留了单轮编辑质量。LME-Bench包含100个十轮编辑会话。摘要未提供具体的实验结果数字。\n- **领域归类**: [计算机视觉, 图像编辑, 模型训练与蒸馏]\n---\n\n### 63. ExpVoyager: Direct Experience Navigation for Dynamic Agent Skill Synthesis (ExpVoyager：面向动态智能体技能合成的直接经验导航)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32630)\n- **研究任务**: 大语言模型智能体从经验中学习，将积累的经验动态转化为可重用的程序性知识（智能体技能合成）。\n- **核心亮点**: 将智能体技能合成重构为对过去经验的动态导航问题。提出ExpVoyager框架，技能策展人在不同视角和分辨率下导航原始经验，持续识别可重用的程序性知识，同时跟踪剩余的知识需求以指导下一步导航。\n- **深度解析**: 现有方法在明确下游需求前就将经验抽象为固定的程序性知识，容易丢弃后续关键知识或保留无关细节。ExpVoyager允许智能体根据当前任务主动探索积累的轨迹，实现对经验知识的针对性和细粒度访问。广泛实验表明其在下游任务性能、经验空间扩展时的持续收益以及与现有技能的高效兼容性方面均表现有效。摘要未提供具体的实验结果数字和数据集。\n- **领域归类**: [人工智能, 智能体 (Agent), 经验学习]\n---\n\n### 64. Reinforcing Agentic Creativity in Scientific Ideation with Night Science (利用“夜间科学”强化科学构思中的智能体创造力)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35706)\n- **研究任务**: 解决大语言模型在开放式科学构思中由于低熵偏差导致输出同质化和可预测的问题，提升其科学发现的创造力。\n- **核心亮点**: 引入AI Night-Scientist框架，使用强化学习（GRPO）教模型何时以及如何偏离可预测的推理。基于认知科学，沿行动、过程和结果三个轴对创造力进行建模。\n- **深度解析**: 科学发现涵盖从结构化的“日间科学”到 loosely structured 的“夜间科学”。该框架在训练过程中让模型接触不同程度的创造力。结果显示，相比基础模型，科学提案的多样性大幅增加，研究方向范围扩大27.8%，贡献类型增加14.9%，预测引用影响力提高高达32.0个百分点，原创性提高66.2分。这些收益不能仅通过增加解码温度来复制，语义指导（指定追求何种创造力）至关重要。摘要未提供具体的实验数据集。\n- **领域归类**: [自然语言处理, 大语言模型应用, 强化学习, 科学发现]\n---\n\n### 65. Geometry as Address: Routing Attention to Visual Memory for Long-Horizon Camera-Controlled Video Generation (几何作为地址：长时相机控制视频生成中路由注意力至视觉记忆)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34722)\n- **研究任务**: 长时相机控制视频生成，需要从不断增长的视觉历史中准确恢复先前观察到的内容。\n- **核心亮点**: 提出GEAR（几何启用注意力路由）框架，将几何作为视觉记忆的显式token级地址。不将历史观察融合为持久的全局3D表示，而是保留为帧潜变量，使用每帧几何建立与目标视图的token级对应关系。引入几何对应注意力（GCA）和不可见八叉树（Invisible Octree）。\n- **深度解析**: 现有方法要么隐式搜索历史上下文，要么重建为持久3D记忆，面临内存访问低效或几何误差累积的问题。GEAR的关键洞察是几何不需要解释场景，只需决定从哪里读取视觉记忆，而注意力决定恢复什么。GCA在去噪过程中选择性地将几何匹配的历史特征注入嘈杂的目标块中。不可见八叉树用于累积可见性证据并拒绝几何上合理但被遮挡的对应关系。实验表明GEAR实现了SOTA的视觉质量、精确的相机控制和重访一致性，能够沿具有挑战性的轨迹生成分钟级视频。摘要未提供具体的实验结果数字和数据集。\n- **领域归类**: [计算机视觉, 视频生成, 3D视觉]\n---\n\n### 66. Pruned CTC for Memory-Efficient Large-Vocabulary ASR Training (剪枝CTC：面向大词汇量ASR训练的内存高效方法)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33645)\n- **研究任务**: 解决使用原生LLM词汇表进行CTC（连接主义时间分类）语音识别训练时内存消耗过大的问题。\n- **核心亮点**: 提出Pruned CTC，将对齐计算限制在目标token和blank组成的子集内，同时保留全词汇表归一化。证明这种词汇表缩减在损失和梯度上与全词汇表CTC完全等效。进一步开发LLM-CTC，使预训练LLM适应非自回归ASR。\n- **深度解析**: 传统CTC实现在内存中实例化帧乘词汇表的激活，导致大词汇量训练内存密集。Pruned CTC使得头部和损失激活内存不再随词汇表大小线性缩放。结合Zipformer-M编码器和180K词汇表，Pruned CTC将全步内存减少了5.1倍，步时间开销仅增加17%。在GigaSpeech数据集上，跨6种Qwen3模型（0.6B至32B），LLM-CTC的识别速度比LLM-CE快7到10倍，相对WER差距在7%以内；微调Qwen3-ASR用于有界历史流式处理时，测试集相对WER与匹配的离线模型差距在3%以内。\n- **领域归类**: [语音识别, 大语言模型, 模型训练优化]\n---\n\n### 67. AnswerMap: Faithful Spatial Interpretability of VLMs from Answer Posteriors (AnswerMap：基于答案后验的VLM忠实空间可解释性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35247)\n- **研究任务**: 解决视觉语言模型（VLM）回答视觉查询时，现有可解释性工具依赖不匹配的文本模态或需要白盒访问内部读取的问题。\n- **核心亮点**: 提出AnswerMap，一种无需训练、任务无关的黑盒视觉理由构建方法，直接从输出头构建。将图像切分为K行K列的条带，单独输入冻结模型进行是/否相关性提问，行列“是”后验的外积生成查询条件空间图。\n- **深度解析**: 通过在AnswerMap上定义固定读取（如期望、最大值），可以原生派生连续输出（如位置），绕过对离散文本token的依赖。在四个模型和三个查询分布上的验证表明，该图与模型自身生成的点对齐（AUC 0.85，注意力机制为0.38），删除该图区域会翻转53%的正确答案（注意力机制为19%）。其三种读取方式可用于标记幻觉对象、在模型指向失败时正确定位、以及通过裁剪修复一半的错误答案。摘要未提供具体的实验数据集名称。\n- **领域归类**: [计算机视觉, 视觉语言模型, 模型可解释性]\n---\n\n### 68. FactorEngram: Factorized N-gram Memory with Basis-Level Gating for Language Models (FactorEngram：面向语言模型的带基级门控的分解N-gram记忆)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35578)\n- **研究任务**: 通过基于查找的记忆机制扩展大语言模型（LLM）的参数，解决现有多义词模式无法选择性读取记忆组件以及参数共享缺乏语义相关性的问题。\n- **核心亮点**: 提出FactorEngram，一种具有基级上下文门控的分解n-gram记忆。在跨模式共享的基向量字典上检索稀疏正则化系数，相同字典用于门控。主干隐藏状态对每个基向量评分以门控相应系数。\n- **深度解析**: 现有的Engram将每个检索到的嵌入视为单一整体，存储在哈希槽中并由单一标量门调制。FactorEngram允许相关模式重用公共组件，并让上下文单独调制每个记忆组件。它涵盖单个token和多token n-gram。在340M和1B参数的Transformer主干上，FactorEngram提高了语言建模和下游任务性能。消融研究确认了各组件的贡献，并确定在中间层的注意力子层之前插入是有效配置。摘要未提供具体的实验结果数字和数据集。\n- **领域归类**: [自然语言处理, 大语言模型, 模型架构与记忆机制]\n---\n\n### 69. DISCO: Distributed Long Context Scaling with Grounding-Reasoning Disaggregation (DISCO：基于接地-推理解耦的分布式长上下文扩展)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33485)\n- **研究任务**: 解决大语言模型在处理长上下文时推理质量下降（上下文腐烂）的问题，解耦上下文接地与复杂推理的结构性纠缠。\n- **核心亮点**: 提出DISCO框架，受Apache Spark启发，将长上下文分配给一组专门用于并行、局部接地的Worker LLM。中央Driver LLM通过强化学习（GRPO）训练以优化规划，动态将查询映射为原子提取任务并综合最终答案。\n- **深度解析**: 单体架构中巨大的上下文接地搜索负担耗尽了复杂推理所需的表示能力。DISCO通过将推理与原始上下文噪声隔离来消除上下文腐烂。在RULER-QA（100万token）数据集上，标准基线崩溃时它保持了78.4%的准确率。在LongBench v2数据集上比全上下文模型高出高达9.8分，并匹配Gemini-3-Pro-Preview等前沿模型，同时推理成本降低超过80%。\n- **领域归类**: [自然语言处理, 大语言模型, 长上下文处理, 分布式计算]\n---\n\n### 70. Playing to Par: Reinforcement Learning for Provably Optimal Quadrilateral Block Decompositions (达到标准：强化学习实现可证明最优的四边形块分解)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32146)\n- **研究任务**: 生成平面的四边形块分解（网格），使其满足完整性、形状良好且不规则顶点数量达到由离散高斯-博内恒等式强制的理论下限（即“par”标准）。\n- **核心亮点**: 训练强化学习智能体直接在网格的半边数据结构上通过局部编辑进行构建。策略网络的卷积遵循网格自身的连通性，使其可泛化到大于训练所见域的区域。通过行为克隆在易于构建的最优网格上进行预训练，然后使用PPO进行训练。\n- **深度解析**: 奖励直接针对理论下限，且非常稀疏（随机游玩无法在超过8条边的域上达到）。在96个保留域上，智能体在每个域上都生成了全四边形网格，平均在95.7个域上可用，在90个域上达到可证明最优；而Gmsh的最强配置在相同元素数量下仅完成51个，可用38个，最优0个。在64个两倍于训练大小的域上，智能体完成全部，62个可用，与par的中位数超额低于1，而Gmsh在相同元素数量下为39。摘要未提供具体的实验数据集名称。\n- **领域归类**: [强化学习, 几何处理, 网格生成, 计算机图形学]\n---\n\n### 71. G^2PTQ: Improving LLM Post-Training Quantization with Generalized Gradient Compensation (G^2PTQ：利用广义梯度补偿改进大语言模型训练后量化)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.31009)\n- **研究任务**: 大语言模型（LLM）的训练后量化（PTQ），旨在不重新训练的情况下减少模型的内存和计算占用。\n- **核心亮点**: 提出 G^2PTQ 统一框架，通过广义梯度补偿在块级优化目标下整合一阶和二阶信息；引入信任域缩放机制动态限制梯度步长以稳定一阶补偿；推导出块级 Hessian 近似和精确梯度补偿的高效实现。\n- **深度解析**: 现有的 GPTQ 方法存在局限：局部目标缺乏全局监督，而全局目标在开始时固定 Hessian 估计导致指导信息随量化进行而过时。G^2PTQ 在量化每个 Transformer 块前刷新梯度和 Hessian 估计，避免了信息过时问题。实验结果：摘要未提供具体的实验数字和数据集名称，仅定性表示在多种模型家族和位宽上，G^2PTQ 能更好地与全精度模型对齐，并优于现有的 SOTA 基线。\n- **领域归类**: [模型压缩, 大语言模型, 量化]\n---\n\n### 72. SMAT: Simple and Efficient Merge-Aware Training (SMAT：简单高效的合并感知训练)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33437)\n- **研究任务**: 模型合并（Model merging），旨在无需联合重训的情况下整合多个专家的能力，并提高合并后的整体性能。\n- **核心亮点**: 提出 SMAT 框架，将常见的合并操作抽象为缩放（Scale）、掩码（Mask）和扰动（Perturb）；通过采样缩放系数、掩码和加性噪声模拟合并参数，联合优化专家损失和预期损失；引入周期性调度、算子融合和参数存储切换以提升训练效率。\n- **深度解析**: 现有的合并感知训练（MAT）未充分考虑常见合并操作且增加了训练成本。SMAT 从专家视角重新定义合并操作，每步只需一次前向和一次反向传播，大幅降低了开销。实验结果：在四种语言和视觉-语言骨干网络上，SMAT 在五种合并方法上的平均得分比各骨干网络的最强基线提高了 1.07-2.16 分，且训练时间开销比标准微调不到 2%。\n- **领域归类**: [模型合并, 高效微调, 多任务学习]\n---\n\n### 73. KernelZero: Co-Evolving Proposer and Coder for Continuously Improved GPU Kernel Generation (KernelZero：协同进化的提议者与编码器以实现持续改进的 GPU 内核生成)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33074)\n- **研究任务**: 自动生成既正确又高效的高性能 GPU 内核（如 CUDA 或 Triton）。\n- **核心亮点**: 提出 KernelZero 协同进化框架，包含从 API 集生成 Torch 模块的 Proposer 和将其翻译为 CUDA/Triton 的 Coder；使用前沿驱动的模块生成机制产生对齐训练模块；引入正确性感知的组相对策略优化（CA-GRPO），在正确性可靠后才优化性能。\n- **深度解析**: 现有基于 LLM 的方法面临高质量训练数据稀缺以及正确性与性能之间权衡的问题。KernelZero 通过交替优化 Proposer 和 Coder 形成自动课程，实现针对性的能力提升。实验结果：KernelZero-7B 在 CUDA 上超越 Claude-4.5-Sonnet，在 Triton 上超越 DeepSeek-V4-Pro。在 KernelBench Level 1 和 2 上，CUDA pass@1 分别达到 75.8% 和 69.6%，pass@10 达到 100% 和 97%；Triton pass@1 分别达到 77.2% 和 72.5%。\n- **领域归类**: [代码生成, 强化学习, GPU 优化, 系统]\n---\n\n### 74. Why Deterministic PRM Guidance Underperforms in Discrete Diffusion Reasoning (为什么确定性 PRM 引导在离散扩散推理中表现不佳)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35472)\n- **研究任务**: 离散扩散语言模型（dLLMs）的推理过程引导，探讨过程奖励模型（PRM）在测试时计算分配中的有效性。\n- **核心亮点**: 揭示了在相同前向传播预算下，确定性 PRM 引导不如简单的独立采样加结果奖励模型（ORM）重排；追踪了 PRM 引导失败的两个原因：在弱信号上剪枝（PRM 评分能力随掩码率上升而衰减）以及 PRM 作为最终评判者表现不佳。\n- **深度解析**: dLLMs 在每一步都暴露去噪解，使得 PRM 引导看似是测试时计算的好方法。但研究表明，当去噪、PRM 评分和 ORM 评分在相同预算下计费时，确定性形式会输给更简单的基线。实验结果：在 Dream-v0-Instruct-7B 上解决 GSM8K 问题（8个候选），每步保留最高 PRM 分数达到 65.18%，而独立采样加 ORM 重排达到 75.13%。32个候选时差距扩大到 12.69 个百分点。在 MATH 上差距为 9.85 个百分点，在 MBPP 上为 12.16 个百分点。GSM8K 上 PRM ROC-AUC 从 0.77 降至 0.54。\n- **领域归类**: [自然语言处理, 推理, 扩散模型, 奖励模型]\n---\n\n### 75. SkillDRE: Dual-Stage Red-Team Evolution of Agent Skills via Pre-Execution and Runtime Feedback (SkillDRE：通过预执行和运行时反馈进行 Agent 技能的双阶段红队演进)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32400)\n- **研究任务**: Agent 技能的安全性与红队测试，自动化演进完整的恶意技能包以绕过防御机制。\n- **核心亮点**: 提出 SkillDRE 全自动框架，通过双阶段反馈循环演进恶意技能；结合扫描器引导的演进和运行时防御下观察到的执行结果引导的优化，形成跨阶段闭环；在保持合法任务能力的同时构造和验证任务条件下的恶意目标。\n- **深度解析**: Agent 技能可能被攻击者利用演进为恶意技能。现有防御中，候选技能可能通过预执行扫描但在运行时防御下失败，或者修复执行会引入新的扫描发现。SkillDRE 利用两阶段防御反馈作为自适应红队的学习信号。实验结果：在 SkillsBench 上跨四个受害模型评估，SkillDRE 平均攻击成功率为 45.28%，超过最强基线 40.3%，且最终提交的技能未收到 SkillScan 发现，并很大程度上保留了良性任务性能。\n- **领域归类**: [AI 安全, 智能体 (Agent), 红队测试]\n---\n\n### 76. EvolvingAvatar: Interactive 3D Head Generation That Adapts as Conversations Unfold (EvolvingAvatar：随对话展开而自适应的交互式 3D 头部生成)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35616)\n- **研究任务**: 交互式 3D 头部生成，要求生成协调的说话和倾听动作以响应不断发展的对话。\n- **核心亮点**: 提出 EvolvingAvatar 因果生成器，使用测试时训练在交互期间适应用户面部视频和二元音频；引入二元上下文预测目标提供自监督学习信号；使用持久快速权重和瞬时下颌适应来控制动作生成；提出 InterHead-Bench 统一基准。\n- **深度解析**: 现有生成器将传入观察作为上下文但保持参数固定，未利用对话模式作为学习信号。EvolvingAvatar 通过测试时训练动态适应，使生成质量随对话推进而提升。实验结果：在 InterHead-Bench（455.95小时）上实验显示，相比强基线改善了对话运动统计。在最难的分布外分割上，生成质量随对话展开而提高，从第一个区间开始，记录的用户-化身表情统计的不匹配度最多减少了 11.1%。\n- **领域归类**: [计算机视觉, 3D 生成, 交互式 AI, 多模态]\n---\n\n### 77. VGGT-Diff: Visual Geometry Meets Diffusion for Sparse-View Novel View Synthesis (VGGT-Diff：视觉几何遇见扩散模型用于稀疏视图新视图合成)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33253)\n- **研究任务**: 稀疏视图新视图合成（NVS），解决重建方法难以合成未见区域、扩散方法依赖隐式对应关系的权衡问题。\n- **核心亮点**: 提出 VGGT-Diff 几何路由多视图扩散模型；将 VGGT-Ω 的视觉几何潜在变量路由到预训练视频扩散模型中；引入置信度感知的视觉几何路由器（VGR）和点跟踪残差一致性（PTRC）正则化；结合训练时正则化和推理时引导的鲁棒几何条件。\n- **深度解析**: 现有 NVS 方法在保留观察几何和合成未见区域之间存在根本权衡。VGGT-Diff 通过将视觉几何潜在变量与 3D 点和置信度关联，转化为查询对齐的潜在条件，引导联合目标视图去噪，从而桥接重建与生成方法。实验结果：摘要未提供具体实验数字，仅表示在不同视角难度的插值和外推实验中，展现出具有竞争力或最先进（SOTA）的性能。\n- **领域归类**: [计算机视觉, 新视图合成, 扩散模型, 3D 视觉]\n---\n\n### 78. Adaptive Consistency Graph for Long-Horizon Agents (长视界智能体的自适应一致性图)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32754)\n- **研究任务**: 解决大语言模型智能体在长视界任务中，因任务需求、历史证据和当前状态逐渐脱节而导致后期决策偏离原始目标的问题。\n- **核心亮点**: 引入自适应一致性图（ACG），增量式组织执行证据及其来源；在有限的上下文预算下，为每个决策构建临时的以需求为中心的视图；作为基础智能体规划器或工具执行器的补充，提供结构化且可追溯的上下文视图。\n- **深度解析**: LLM 智能体在短任务中表现良好，但在需要长序列依赖动作和工具调用的任务中性能下降。ACG 通过图结构维持上下文的一致性，防止决策漂移。实验结果：在匹配评估中，ACG 将 GPT-5.6-luna 的平均成功率从 ReAct 的 44.5% 提升至 50.2%，在 BrowseComp-Plus 任务上增益最大（从 62.4% 提升至 73.5%）。\n- **领域归类**: [智能体 (Agent), 大语言模型, 长上下文推理]\n---\n\n### 79. ControlScope: Workflow Revision and Reliability in LLM Agents (ControlScope：LLM 智能体中的工作流修订与可靠性)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34313)\n- **研究任务**: 研究语言模型智能体在运行中的工作流应该修订多少，比较继续生成代码、编辑下一个工具调用的数据参数以及从同一公共执行状态替换未完成工作流的效果。\n- **核心亮点**: 通过嵌套权限分离可用修复与智能体选择的动作；评估文件系统任务、ALFWorld 和 AppWorld 中的一次性和重复审查；分析轨迹结构和推理成本以表征不同修订粒度对任务完成的影响。\n- **深度解析**: 智能体在执行中可能需要修订工作流，但修订范围（如仅改参数还是重写整个后续流程）影响效率和成功率。ControlScope 探讨了不同修订粒度对任务完成的影响，并提出了保护机制以节省计算。实验结果：在 20 个文件系统任务中，FULL（替换未完成工作流）完成 15-16 个任务，KEEP（继续生成）完成 13 个。ALFWorld 快速面板中 KEEP/ARG/FULL 得分分别为 85/86/87（87个任务）和 134/134/127（134个任务）。五次调用保护节省了 19.4% 的模型输出日志并仅损失一次成功。\n- **领域归类**: [智能体 (Agent), 大语言模型, 工作流优化]\n---\n\n### 80. SentZero: An Enhanced Sentence-Centric Vision-Language Pretraining for Multi-Task Zero-Shot Chest X-Ray Analysis (SentZero：用于多任务零样本胸部 X 射线分析的增强型以句子为中心的视觉语言预训练)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34479)\n- **研究任务**: 利用配对胸部 X 射线（CXR）图像和放射学报告进行视觉语言（VL）预训练，以实现多任务零样本 CXR 分析。\n- **核心亮点**: 提出 SentZero 框架，引入基于 LLM 的抽象级句子结构化和映射以扩大正样本对多样性；增加额外损失项以缓解假阴性；引入句子条件残差调制视觉嵌入，使视觉特征适应输入句子的语义特征。\n- **深度解析**: 现有 VL 预训练依赖特定任务微调，因为报告冗长且难以与零样本提示对齐。近期的句子级方法忽略了放射学话语的内在特征，且存在正样本对多样性受限和假阴性问题。SentZero 通过 LLM 结构化句子和残差调制解决这些问题。实验结果：摘要未提供具体实验数字，仅表示在多种下游任务和数据集上，SentZero 提高了零样本泛化能力，并优于先前的多任务零样本方法。\n- **领域归类**: [医疗 AI, 视觉语言预训练, 零样本学习, 多模态]\n---\n\n### 81. Who Gets a Token, and What Does It Carry? Unequal Name Support and Concept Access in Large Language Models (谁获得了 Token，它承载了什么？大型语言模型中不平等的名字支持与概念访问)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34065)\n- **研究任务**: 评估大型语言模型（LLM）在处理不同人群名字时是否存在词法接口上的不平等，以及这种不平等如何影响模型内部的概念可及性。\n- **核心亮点**: 揭示了匹配的名字在模型输入端并不等价（单 token 直接访问与多子词组装的差异）；提出了 NameTrace 框架，用于衡量名字表面支持度是否转化为任务相关内部表示的差异。\n- **深度解析**: 研究基于近 50 万个名字和 12 个 LLM 相关的分词器展开。NameTrace 通过模型在特定任务形容词轴上的概率和连续的任务对齐权重来测量概念可及性。结果表明，这种词法支持的不平等在种族/民族和性别相关的分层中普遍存在，并预测了概念可及性在奖学金、招聘、临床评估和借贷等任务中的系统性差异。隐藏状态干预进一步表明，测量的任务方向对下游的受限选择具有影响力。摘要未提供具体的模型家族名称、12 个分词器的具体列表以及更详细的干预参数等技术细节。\n- **领域归类**: [自然语言处理, 模型公平性与偏见, 可解释性]\n---\n\n### 82. VisionHOPE: Visual Backbones as Self-Modifying Learning Systems (VisionHOPE：将视觉骨干网络作为自修改学习系统)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33325)\n- **研究任务**: 设计一种通用的视觉骨干网络，使其能够在处理图像时实现“记住什么”和“如何学习”的共同进化，即构建自修改学习系统。\n- **核心亮点**: 提出 VisionHOPE，首个被构建为自修改学习系统的通用视觉骨干；基于嵌套学习（NL）的自指结构，通过五个耦合记忆（存储内容、生成键值表示、控制学习率和保留率）实现共同进化；提出稳定性匹配步长控制方案以保证内存动态的非扩张性。\n- **深度解析**: 该方法将 NL 的块（chunk）公式适应于二维特征图，通过将块与图像的行和列在四个方向扫描上对齐来实现。在 ImageNet-1K、COCO 和 ADE20K 数据集上取得了具有竞争力的结果，证明了自修改学习系统作为通用视觉骨干的实用性。摘要未提供具体的网络层数、参数量、具体的精度数字（如 Top-1 准确率）以及与其他 SOTA 模型的详细对比数据等技术细节。\n- **领域归类**: [计算机视觉, 模型架构设计, 自监督/自适应学习]\n---\n\n### 83. SCOPD: Sparse-Context On-Policy Self-Distillation for Efficient Vision-Language Models (SCOPD：用于高效视觉语言模型的稀疏上下文在策略自蒸馏)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34044)\n- **研究任务**: 解决推理视觉语言模型（VLMs）在处理长视觉 token 序列时推理成本高昂的问题，通过减少视觉 token 数量来降低成本，同时缓解激进压缩带来的性能下降。\n- **核心亮点**: 发现“表示利用差距”（即剪枝后有用的视觉证据仍可访问但未被可靠使用）；提出 SCOPD 框架，学生模型从剪枝 token 生成推理轨迹，特权全上下文教师监督相同的在策略前缀，无需真实标签或额外推理计算；提出 SCOPD+ 变体，通过小型视觉预算干预识别视觉敏感响应位置并进行选择性蒸馏。\n- **深度解析**: 摘要提供了具体的实验数据：在 10% 视觉 token 保留率下，原始模型在 13 个基准测试中保留了 86.37% 的未剪枝性能；SCOPD 将其提升至 90.49%，SCOPD+ 进一步提升至 92.43%。研究表明，高效推理不仅取决于哪些视觉信息在剪枝中幸存，还取决于模型学习如何可靠地使用它们。摘要未提供这 13 个基准测试的具体名称、具体的 VLM 模型架构名称以及详细的训练超参数等技术细节。\n- **领域归类**: [多模态, 视觉语言模型, 模型压缩与加速]\n---\n\n### 84. Distillation Defenses Easily Break After Reinforcement Learning (强化学习后蒸馏防御极易被攻破)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.35699)\n- **研究任务**: 评估针对闭源大语言模型（LLM）蒸馏攻击的现有防御机制的有效性，并探讨在更现实的威胁模型（即攻击者在蒸馏后使用强化学习进行进一步训练）下防御机制的脆弱性。\n- **核心亮点**: 指出现有防御评估通常假设攻击者不会在蒸馏后继续训练，这会导致虚假的安全感；证明在蒸馏后引入强化学习（RL）会降低蒸馏攻击的门槛，使得简单的攻击就能窃取闭源模型的推理能力，达到与提取完整隐藏轨迹的复杂攻击相当的推理提升。\n- **深度解析**: 研究得出结论，任何泄漏足够信息以重建近似推理轨迹的蒸馏防御都可能是无效的，并讨论了批量级蒸馏防御（batch-level distillation defenses）可能更有效。摘要未提供具体的闭源模型名称、具体的 API 数据收集细节、强化学习的具体算法、防御被攻破的具体成功率数字以及批量级防御的具体实现细节和实验验证结果。\n- **领域归类**: [自然语言处理, 模型安全, 知识蒸馏]\n---\n\n### 85. What masking geometry works best for EEG foundation models? (哪种掩码几何最适合 EEG 基础模型？)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33487)\n- **研究任务**: 系统性地评估和消融脑电图（EEG）基础模型预训练管道中的时空掩码策略设计选择，以确定最优的掩码配置。\n- **核心亮点**: 首次将掩码策略的设计选择形式化并在单一管道下进行独立消融实验；在 MAE 和 JEPA 两种自监督学习（SSL）框架下训练并评估了 58 个预训练模型；发现两种框架在最优掩码配置和共享失败模式上达成一致；识别出一种 JEPA 特有的、标准检测器无法察觉的新型失败模式（偏差膨胀崩溃，bias-inflation collapse）。\n- **深度解析**: 实验在 OpenEEGBench 的 12 个数据集上通过线性探测进行评估。结果表明，在最优配置之外，性能具有鲁棒性（11 个 MAE 和 9 个 JEPA 配置在统计上与最佳配置无显著差异）。使用精心选择的掩码，该管道在预训练计算量大幅减少的情况下，达到了与 REVE 模型相当的下游性能。摘要未提供 58 个模型的具体架构细节、掩码的具体几何形状参数、12 个数据集的具体名称、REVE 的具体参数量以及下游任务的具体精度指标。\n- **领域归类**: [脑机接口/神经科学, 基础模型, 自监督学习]\n---\n\n### 86. Safe Error Correction for Language Models: Frozen-Base Adjustment with Capability Preservation (语言模型的安全错误纠正：保持能力的冻结基础调整)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.16145)\n- **研究任务**: 研究如何在不降低冻结语言模型基础能力的前提下，使用小型修正模块修复模型输出中的错误。\n- **核心亮点**: 提出 CRN v2，一个轻量级的 logit 级修正模块（约 34M 可训练参数，占基础文本模块 4.65B 的 0.73%），置于完全冻结的 Gemma 4 E2B 模型之上；通过监督微调（SFT）和无参考 DPO 在 83,400 个错误纠正对上进行训练；在修正错误的同时，在测试的能力基准上未出现能力退化。\n- **深度解析**: 摘要提供了详细的实验数据：在 60 个问题的领域考试（CEHRI）中，CRN v2 修正了 53.3% 的基础模型错误（重述变体为 43.3%），而在 MMLU/BoolQ（N=200）和 car-wash（N=8）基准上无退化。相比之下，匹配预算（6.6M 参数，rank 19）的 LoRA 基线虽然达到 83.3% 的修正率，但在相同基准上遭受 30-75% 的能力损失。消融实验表明，KL 保留项（lambda=0.1）至关重要，降至 0.01 会使修正率降至 35.0%。摘要未提供 CEHRI 考试的具体内容细节、Gemma 4 E2B 的具体架构参数以及 DPO 的具体超参数设置。\n- **领域归类**: [自然语言处理, 模型对齐, 参数高效微调]\n---\n\n### 87. NanoForecast v0.5: Competitive Time Series Forecasting Through Training Pipeline Optimization (NanoForecast v0.5：通过训练管道优化实现具有竞争力的时间序列预测)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.31669)\n- **研究任务**: 在保持模型架构和计算预算不变的情况下，通过优化训练管道（如损失范围处理、张量形状对齐、增强覆盖等），提升小型时间序列预测模型的性能，使其能够与参数量大得多的模型竞争。\n- **核心亮点**: 提出 NanoForecast v0.5（6.5M 参数），通过修正训练管道中的错误，在相同数据和计算预算下将整体平均绝对缩放误差（MASE）降低了 43.8%（从 3.030 降至 1.704）；在多个数据集上击败了参数量大 31 倍的 TimesFM（200M）以及 PatchTST（15M+ 参数）。\n- **深度解析**: 摘要提供了具体的实验数字：在三个 ETT 数据集上，v0.5 的 MASE 分别为 0.676/1.110/0.287，而 TimesFM 为 0.705/1.360/0.545；在汇率数据集上为 4.317 vs 4.383。训练仅需单张云 GPU（NVIDIA T4）约 12 小时，推理可在 Apple M4 CPU 上进行。摘要未提供 TimesFM 和 PatchTST 的具体官方配置细节、ETT 数据集的具体划分方式以及模型的具体架构设计（如层数、注意力头数等）。\n- **领域归类**: [时间序列分析, 模型优化, 轻量级模型]\n---\n\n### 88. Not All Objectives Are Born Equal: Priority-Constrained Descent for Hierarchical Multi-Objective Optimization (并非所有目标生而平等：用于分层多目标优化的优先级约束下降法)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2606.29521)\n- **研究任务**: 解决深度学习中多目标优化问题里目标重要性不对等（存在主次层级结构）的问题，提出一种能够显式利用这种分层目标结构的基于梯度的优化框架。\n- **核心亮点**: 提出优先级约束下降法（PCD），在保持主目标下降方向的同时，允许最小程度的扭曲以保证次要目标（如稀疏性、压缩、鲁棒性）的进展；通过单一参数 τ ∈ [0, 1] 控制扭曲强度；公式对目标缩放具有不变性，并为两目标和三目标问题提供精确的闭式解。\n- **深度解析**: 实验评估在结构化网络压缩、非结构化稀疏性和低秩性设置以及多种合成实验中进行。结果表明，PCD 展现出 Pareto 优势，并在保证次要目标进展的前提下，实现了比现有方法更好的单目标性能，同时展示了 τ 参数提供的可解释的权衡关系。摘要未提供具体的网络模型名称、具体的压缩比例、稀疏度指标数字以及合成实验的具体设置细节。\n- **领域归类**: [机器学习基础, 优化算法, 多目标优化]\n---\n\n### 89. When Privacy Moves ML-Mediated Decisions On Device: Information and Incentive Misalignment in Auctions (当隐私将 ML 介导的决策移至设备端：拍卖中的信息与激励不对齐)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.33312)\n- **研究任务**: 研究将机器学习（ML）介导的决策移至隐私保护客户端（设备端）时，由于共享预算约束依赖于无法全局实时获取的信息而导致的“信息结构失效”问题，以及由此引发的拍卖逻辑中的激励不对齐。\n- **核心亮点**: 在设备端拍卖逻辑模拟中量化了信息不对齐的影响：在预算压力下，比例 Even pacing 策略在 1 个 tick 延迟后超支 17.77%，50 个 tick 后超支 1,669.31%；推导出条件收费上限下的有限窗口预期超额借方界限；揭示了激励不对齐问题，即 98.23% 的对手拍卖在 1 个 tick 延迟下存在有利可图的偏离。\n- **深度解析**: 研究指出，可见预算的“无销售”守卫可以在零延迟下实现精确合规，但在存在延迟时仍会因其他设备的扣款不可见而导致超支（11.88%）。摘要未提供 36 个活动和 50 个设备的具体配置细节、ML/pacing 分数转换的具体数学公式、以及“关键基础出价支付”（Critical-base-bid payment）的具体实现代码或详细参数，也未提供解决该激励不对齐的完整机制设计细节。\n- **领域归类**: [联邦学习/隐私计算, 机制设计, 边缘计算]\n---\n\n### 90. How Reproducible Are Evaluation Conclusions? A Self-Audit of LLM-Inferred Prompt Structure (评估结论的可复现性有多高？对 LLM 推断 Prompt 结构的自我审计)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30074)\n- **研究任务**: 评估大语言模型（LLM）系统评估结论的可复现性，特别是针对基于 LLM 推断 Prompt 结构的评估任务，探讨小样本提示集和排名表格的可靠性。\n- **核心亮点**: 以 LLM 推断 Prompt 结构为案例进行自我审计，发现相同的调用无法可靠地恢复相同的结构（平均节点集 Jaccard 相似度在 0.39 到 0.96 之间，72% 的提示-模型单元格从未达到节点集完美）；审计评估进一步削弱了结论的可靠性；排名底部的模型最可靠，而顶部的模型排名不稳定；两种合理的合并重复活动规则会改变一半的行并大幅改变整体结论。\n- **深度解析**: 摘要提供了具体的审计数据：测试了 5 个系列的 8 个开放模型变体（参数量从 8B 到 675B），禁用了缓存，保留了 293 个原始中间表示。在联合聚类 bootstrap 下，排名最底的两个模型在 99% 和 86% 的重复中保持排名，中间四个在 27% 到 48% 之间，顶部两个各在 68%。摘要未提供这 8 个模型的具体名称、Prompt 结构推断的具体任务描述、以及被撤回的 4 个端点的具体名称和撤回原因。研究建议报告排名稳定性、每个单元格的来源、执行的敏感性比较、原始的每次运行输出以及测量日期。\n- **领域归类**: [自然语言处理, 模型评估与基准, 可复现性研究]\n---\n\n### 91. Training and Inference Dynamics of PLDR-LLMs: Row-Map Collapse, Renormalization, and Predictive Reduction (PLDR-LLM的训练与推理动态：行映射崩溃、重归一化与预测约简)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34130)\n- **研究任务**: 为幂律解码器表示语言模型（PLDR-LLMs）的训练和推理提供一个统一的理论解释。\n- **核心亮点**: 提出了精确的有限功恒等式，将行中心学习映射的绝对能量变化分解为参数贡献、符号交互和数值观测缺陷；提出了预测重归一化方法，在单次遍历不同语料库目标块时保留优化器记忆等；区分了绝对行崩溃、相对行集中、算子稳定和预测精度。\n- **深度解析**: 实验揭示了观察者和优化器的依赖性，拒绝了测试的自主行状态候选者，并支持有限条件预测和特定状态算子约简。具体的实验数据集和详细的数值结果摘要未提供。理论分离了精确恒等式、条件动态声明和有限经验发现，并提供了证明和紧凑的数值证据。\n- **领域归类**: [自然语言处理, 理论分析, 语言模型]\n---\n\n### 92. How Does \"English (US)\" Become the Default? Triangulating Structural Bias Towards American English Across the LLM Pipeline (“英语（美国）”如何成为默认选项？三角测量大语言模型流水线中对美式英语的结构性偏见)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2604.04204)\n- **研究任务**: 研究大语言模型（LLM）开发流水线中“英语（美国）”如何成为默认选项，将其作为一种结构性偏见进行考察。\n- **核心亮点**: 构建了包含 1,813 个匹配的美式英语（AmE）和英式英语（BrE）变体的精选资源，并引入了 DiAlign（一种动态的、无需训练的方法）来从分布证据中估计区域对齐。在数据暴露、表示和生成三个阶段对 AmE 偏好进行三角测量。\n- **深度解析**: 实验结果表明，在所有 6 个审计的预训练语料库和 21 个后训练数据集中，AmE 始终受到青睐；分词器通常更紧凑地表示 AmE，且预测成本更低。在提示下，AmE 仍是主要的生成默认选项。研究指出当代 LLM 将 AmE 视为事实上的规范，引发了对语言同质化、认知不公和全球 AI 部署不平等的担忧。\n- **领域归类**: [自然语言处理, 模型偏见与公平性, 语言模型]\n---\n\n### 93. AdaGuard: An Adaptive Guard Model with User-defined Policies (AdaGuard：具有用户定义策略的自适应防护模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.34241)\n- **研究任务**: 开发能够根据用户定义的动态策略评估语言模型智能体行为并检测违规的自适应防护模型。\n- **核心亮点**: 引入了 AdaptiveSafety 数据集（包含 10,939 个训练样本和 1,000 个测试样本，涵盖 1-100 条规则的策略）；提出了 SafePO（一种强化学习算法），用于在平衡解释推理和最终裁决的同时优化违规识别；开发了 AdaGuard 防护模型系列（0.6B、4B 和 8B）。\n- **深度解析**: 4B 模型在 AdaptiveSafety 上达到了 89.30% 的二元准确率，在 DynaBench 上达到了 71.82%。SafePO 使用结构化奖励评估预测正确性，保留响应级别的组相对优势，并采用单独训练的价值模型来调节解释和裁决区域内的 token 权重。\n- **领域归类**: [自然语言处理, 模型安全与对齐, 强化学习]\n---\n\n### 94. Routing Drift Alone Does Not Diagnose Failure in Merged MoE LLMs (仅凭路由漂移无法诊断合并 MoE 大语言模型中的故障)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32821)\n- **研究任务**: 调查混合专家模型（MoE）合并后的路由漂移是否真正代表路由故障，以及应提供何种证据来证明修复的合理性。\n- **核心亮点**: 提出了一个路由分析工具包，用于受控的反事实干预和 token 级分析；将路由故障操作化为在指定路由干预下可恢复的任务损失；提出了选择性路由器修复（SRR）作为案例研究。\n- **深度解析**: 在 DeepSeekMoE、OLMoE 和 Qwen3-MoE 上的研究表明，大多数专家重新分配归因于输入偏移而非同层参数变化。源相对路由差异不能很好地预测源路由恢复带来的下一个 token 似然增益。测试表明，故意破坏路由器时可检测到可恢复的损失，但在评估的合并模型中，源路由恢复并未建立可靠的任务收益。具体的实验数据集和详细的数值结果摘要未提供。\n- **领域归类**: [自然语言处理, 模型合并与压缩, 混合专家模型 (MoE)]\n---\n\n### 95. PyroAdapt: Adapting Wildfire Prediction under Spatial Heterogeneity and Temporal Shift (PyroAdapt：在空间异质性和时间偏移下自适应野火预测)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.12435)\n- **研究任务**: 解决野火预测中由于空间异质性和时间分布偏移导致的罕见事件预测问题，使预训练模型能够适应目标条件。\n- **核心亮点**: 提出了 PyroAdapt，一个“预训练-检索-排序”框架，通过检索具有相似条件的历史位置并通过风险排序进行微调来适应目标条件；引入了统一的分数差距公式来表征直接排序、残差成对 DPO (RDPO) 和选择性排序的梯度分配。\n- **深度解析**: 在加利福尼亚州（离散化为 666 个 0.25x0.25 网格单元）的实验中，这些目标将每日平均精度从持续焦点微调的 21.62% 提高到 24.35--24.57%，Top5% 召回率从 18.70% 提高到 22.11--22.79%。在每日 34 个单元的固定检测预算下，选择性排序额外捕获了 344 个正单元-天。对于消耗干物质排名前 5%/10%/20% 的火灾，选择性排序分别将召回率提高了 39.70/28.18/20.50 个百分点。\n- **领域归类**: [人工智能应用, 空间与时间数据分析, 灾害预测]\n---\n\n### 96. Rolling-WAM: World Action Models with Rolling Imagination (Rolling-WAM：具有滚动想象的世界动作模型)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30247)\n- **研究任务**: 解决机器人操作中的世界动作模型（WAMs）在每个重新规划周期完成联合视频-动作去噪过程带来的高延迟问题，提高闭环响应能力。\n- **核心亮点**: 提出了 Rolling-WAM，将联合去噪分布在连续的重新规划周期中；维护一个处于交错噪声级别的视频-动作块滑动窗口；在每个步骤中，滚动噪声调度完全去噪即将执行的动作块，同时部分细化更远的未来块。\n- **深度解析**: 在 LIBERO、RoboTwin 和真实的 Unitree G1 人形机器人上的评估表明，Rolling-WAM 实现了具有竞争力的操作性能。通过消除从头开始去噪整个预测 horizon 的需要，它比标准联合 WAMs 提供了 4.5 倍的稳态重新规划加速。具体的实验数据集和详细的数值结果摘要未提供。\n- **领域归类**: [机器人学, 计算机视觉, 强化学习与控制]\n---\n\n### 97. Allspark: Weak to Strong Transfer via Alternating Chain of Thought (Allspark：通过交替思维链实现弱到强迁移)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.32913)\n- **研究任务**: 探索在不使用强模型 rollout 的情况下，将小（弱）模型学到的推理改进迁移到大（强）模型中。\n- **核心亮点**: 引入了 Allspark，一个通过交替思维链实现弱到强迁移的训练和推理框架；弱教师与同一模型的冻结副本一起训练，两者交替推理片段，冻结模型生成最终答案；推理时，更强的学生替换冻结的训练伙伴。\n- **深度解析**: 在两个规模上进行了研究：受控的 Qwen 数学和推理实验，以及更大规模的 Inkling 在 ARC-AGI-2 上的实验。Inkling 实验显示在家族内和跨家族设置中（包括迁移到 Kimi 和 Nemotron）的准确率提升。具体的实验数据集和详细的数值结果摘要未提供。\n- **领域归类**: [自然语言处理, 推理与思维链, 模型迁移与蒸馏]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [debpalash/VoiceStudio](https://github.com/debpalash/VoiceStudio)\n- **今日趋势**: Stars: 47,556 | Forks: 5,354 | 今日新增: 4,712 stars\n- **项目简介**: 完全本地化的开源语音处理工具，支持646种语言的语音克隆、配音与转录，作为ElevenLabs的替代品。\n- **核心价值**: \n  - **项目用途**: 提供本地化的语音克隆、声音设计、视频配音、听写、转录及有声书创建功能。\n  - **目标人群**: 需要语音合成、克隆、转录等功能的开发者、内容创作者及企业。\n  - **技术核心**: 本地化语音处理、多语言语音克隆与合成、语音转录。\n  - **是否AI/大模型相关**: 是\n\n---\n\n### [VectifyAI/PageIndex](https://github.com/VectifyAI/PageIndex)\n- **今日趋势**: Stars: 37,166 | Forks: 3,250 | 今日新增: 822 stars\n- **项目简介**: 提供无向量、基于推理的RAG（检索增强生成）文档索引工具。\n- **核心价值**: \n  - **项目用途**: 为文档建立索引，支持无向量（Vectorless）和基于推理的检索增强生成（RAG）。\n  - **目标人群**: 构建RAG系统、需要文档检索和推理能力的AI开发者。\n  - **技术核心**: 无向量文档索引、基于推理的RAG架构。\n  - **是否AI/大模型相关**: 是\n\n---\n\n### [harvard-edge/cs249r_book](https://github.com/harvard-edge/cs249r_book)\n- **今日趋势**: Stars: 28,715 | Forks: 3,627 | 今日新增: 62 stars\n- **项目简介**: 哈佛大学CS249r课程的配套教材，涵盖机器学习系统、Agentic AI和物理AI等内容。\n- **核心价值**: \n  - **项目用途**: 提供机器学习系统领域的系统性教材（共四卷），涵盖基础、扩展、Agentic AI和物理AI。\n  - **目标人群**: 机器学习系统方向的学生、研究人员及从业者。\n  - **技术核心**: 机器学习系统（MLSys）、Agentic AI、物理AI。\n  - **是否AI/大模型相关**: 是\n\n---\n\n### [SemiAnalysisAI
