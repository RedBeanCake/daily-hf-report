    <h1>前沿科研情报 - 2026-09-16</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Vidu S2: Real-Time Interactive, Editable, and Spatial Video Generation (Vidu S2：实时交互、可编辑与空间视频生成)\n- **社区热度**: `👍 436 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.11638)\n- **研究任务**: 开发实时交互数字角色模型（Vidu S2-Avatar）和实时视频编辑模型（Vidu S2-Editing），并探索两者的实时空间视频生成能力。\n- **核心亮点**: 支持实时720p视频生成、动态参考随时更新以及更强的指令遵循（如跳舞）；支持对视频流进行风格渲染、换装、换人、换背景等实时编辑；实现了空间视频生成。\n- **深度解析**: 相比前代，Vidu S2在实时性和交互性上实现了显著提升。Avatar模型能够处理动态参考和复杂动作指令，Editing模型则允许对视频流进行多维度的实时编辑。实验表明其性能超越了所有基线模型（具体的基线名称、实验结果数字和数据集摘要未提供）。团队还提供了可在线体验的Demo。\n- **领域归类**: [计算机视觉, 视频生成, 多模态]\n---\n\n### 2. Atria Dawn: The Dawn of Agentic Superintelligence (Atria Dawn：智能体超级智能的曙光)\n- **社区热度**: `👍 365 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15818)\n- **研究任务**: 开发专为科学研究和工程工作流设计的基础智能体语言模型，以拓展智能体在现实世界中的生产力边界。\n- **核心亮点**: 提出Atria Dawn Preview模型，通过“可验证经验管道”将工具交互与可执行环境及外部验证结果相连；在16个基准测试中与前沿智能体竞争，并在5个基准中取得最高分；深入分析了人类与AI协作的真实研发过程。\n- **深度解析**: 论文不仅发布了模型，还将其研发过程作为人机协作的案例研究。通过分析769条任务记录和56名参与者的数据，发现约三分之一的AI辅助任务在没有AI的情况下无法完成。智能体频繁提出方法和修改，而人类保留最终决策并引导探索。这表明人机协作正从任务级执行向项目级伙伴关系转变（具体的基准测试名称和底层技术细节摘要未提供）。\n- **领域归类**: [人工智能, 智能体, 人机协作]\n---\n\n### 3. ZGCM-1: A Fully Open and Extremely Efficient Foundation Model for Math and Agentic Search (ZGCM-1：一个完全开源且极其高效的数学与智能体搜索基础模型)\n- **社区热度**: `👍 290 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13356)\n- **研究任务**: 从头训练一个完全开源的7B密集基础模型，通过结合内部思考与外部工具使用来突破参数容量限制，并支持256K上下文。\n- **核心亮点**: 采用架构与系统协同设计（交错门控滑动窗口与全注意力，稳定的FP8 Muon优化器）；实施渐进式课程与MDP中期训练（16K/64K/256K上下文缩放，将交互轨迹重构为马尔可夫决策过程）；建立AI原生研发工作流；在数学推理和智能体搜索上媲美大几个数量级的前沿模型（如Qwen3-235B-A22B和GLM-5.1）；16K预训练效率提升约4.2倍。\n- **深度解析**: 该模型强调紧凑模型不能被动记忆开放网络，而需通过深思熟虑的内部思考与主动的外部工具使用相结合。团队开源了从预训练到后训练各阶段的权重、中间检查点、训练代码、数据及W\u0026B日志，并提炼了8条关于架构缩放、SFT质量剪枝、长上下文泛化和智能体协同训练动态的经验（具体的底层技术细节摘要未提供）。\n- **领域归类**: [自然语言处理, 基础模型, 数学推理]\n---\n\n### 4. Dream-RSI: Recursive Self-Improvement through Evolving Worlds (Dream-RSI：通过演化世界实现递归自我改进)\n- **社区热度**: `👍 256 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14858)\n- **研究任务**: 为自主AI智能体开发一种可扩展且能递归自我改进的探索框架，解决固定策略无法适应扩展搜索空间以及在线策略优化成本高昂的问题。\n- **核心亮点**: 引入轻量级编排层使探索显式且可编程；核心洞察是将累积的发现历史作为已实现搜索空间的重放模拟器；通过在历史发现树构建的重放模拟器中进行“做梦”（dreaming），获得即时、低成本的离策略反馈以评估和优化探索策略；优化后的策略重新部署到线上驱动进一步发现。\n- **深度解析**: 该框架在不改变底层编码智能体的情况下，通过“做梦”机制利用历史数据构建模拟器，避免了重复且昂贵的在线评估。在算法工程、数学优化和GPU内核工程等任务中，Dream-RSI在大幅降低发现成本的同时，实现了具有竞争力或更好的发现质量（具体的实验结果数字和数据集摘要未提供）。\n- **领域归类**: [人工智能, 智能体, 强化学习]\n---\n\n### 5. PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models (PhysBrain 1.5：从视觉语言模型到物理基础模型)\n- **社区热度**: `👍 169 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14973)\n- **研究任务**: 构建一个统一模型，用于理解物理环境、生成动作和预测未来状态，将观察、交互和环境变化的物理循环纳入共同的学习框架。\n- **核心亮点**: 从通用视觉语言模型出发，将语言响应、末端执行器运动和密集视觉目标编码为离散序列，并通过自回归下一词预测进行联合优化；预训练完全依赖人类交互视频中的具身监督；在28个具身理解基准上，8B模型平均得分72.5，达到开源SOTA，与GPT-6-Astra和Gemini 3.6 Flash等领先闭源模型相当。\n- **深度解析**: 模型通过监督微调适应人类演示、机器人轨迹和模拟经验的混合数据。除了理解评估，定性示例显示其能够生成末端执行器轨迹，并通过空间对齐的RGB、深度和机器人掩码输出预测未来场景，同时保留了通用的多模态能力（具体的基准测试名称和底层技术细节摘要未提供）。\n- **领域归类**: [具身智能, 计算机视觉, 机器人学]\n---\n\n### 6. Grouped Value Attention: Efficient KV Caching via On-Demand Key Reconstruction (分组值注意力：通过按需键重建实现高效KV缓存)\n- **社区热度**: `👍 57 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13285)\n- **研究任务**: 解决Transformer解码中KV缓存的内存占用和缓存读取流量随序列长度增长而增加的瓶颈问题。\n- **核心亮点**: 提出分组值注意力（GVA），存储分组值并通过学习到的线性映射重建内容键；推理时该映射可吸收到查询中，无需在预期解码路径中物化内容键；使用小型共享解耦RoPE通道通过单独缓存的位置键保留位置信息。\n- **深度解析**: 在研究的配置中，该表示方法将持久缓存标量相对于匹配的GQA减少了约45-47%。在350M参数规模、30B FineWeb-Edu tokens下，16维位置变体在五个任务上的平均准确率达到44.18，而GQA为44.36，MLA为43.88。展示了在更紧凑的缓存表示下接近GQA的基准精度。团队开发了自定义解码内核以转化为更快的自回归推理（具体的底层技术细节摘要未提供）。\n- **领域归类**: [自然语言处理, 模型架构优化, 推理加速]\n---\n\n### 7. LynnReal-Omni: Native multi-modal Video Generation for Agentic Visual Workflows (LynnReal-Omni：面向智能体视觉工作流的原生多模态视频生成)\n- **社区热度**: `👍 44 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15863)\n- **研究任务**: 结合视频扩散模型的生成能力与智能体视觉创作的稳定控制能力，构建一个原生多模态视频生成框架，以实现稳定、高质量的视频生成。\n- **核心亮点**: 基于32B共享多模态扩散Transformer构建，统一了文生视频、图像条件生成、参考引导生成、结构控制、编辑、退化视频恢复和长视频生成；接受异构视觉输入（外观参考、可编辑3D渲染、游戏录像）；训练了专用的27B Flash模型用于实时渲染；引入MSAVP评估设计。\n- **深度解析**: LynnReal-Omni-Flash通过模型和解码加速（包括轻量级VAE解码器）降低推理成本。在单张H100上，LynnReal-Omni生成和解码22帧540p视频需843毫秒，Flash版本仅需377毫秒。为实时流式视频生成和智能体视觉创作提供了统一、可控且高效的基础（具体的评估数据集名称摘要未提供）。\n- **领域归类**: [计算机视觉, 视频生成, 多模态]\n---\n\n### 8. RSIAgent: Autonomous Exploration for Recursive Self-improvement in New Environments (RSIAgent：在新环境中通过自主探索实现递归自我改进)\n- **社区热度**: `👍 25 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15364)\n- **研究任务**: 使数字智能体能够适应预训练模型未完全捕获其接口、工具和故障模式的新环境，通过自主记忆构建实现无训练的递归自我改进。\n- **核心亮点**: 提出RSIAgent，一个无训练的多智能体框架，协调课程、执行者和验证者智能体；采用“先广后深”的探索策略，结合并行的广泛递归自探索和聚焦的深度自探索；生成的记忆被冻结，可直接用于下游任务而无需更新模型参数。\n- **深度解析**: 在OSWorld-v2和Agent's Last Exam实验中，RSIAgent显著提升了强大的开源模型性能，使Kimi-K3和GLM-5.3能够超越包括GPT-6在内的前沿闭源模型。该框架通过自主构建和复用环境特定的因果知识，有效解决了智能体在新环境中的适应性问题（具体的实验结果数字摘要未提供）。\n- **领域归类**: [人工智能, 智能体, 强化学习]\n---\n\n### 9. Discovery Foundation Models: Toward Open-Ended Discovery Intelligence (发现基础模型：迈向开放式发现智能)\n- **社区热度**: `👍 23 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15973)\n- **研究任务**: 提出“发现智能”的概念，推动基础模型从解决人类指定的问题，转向参与新问题、表示、解释和知识的创造过程。\n- **核心亮点**: 将发现基础模型（DFMs）公式化为用于开放式发现的通用模型系统，支持七种耦合能力；通过Zetema实例化该框架；通过GALILEO（一个真实的治疗发现系统）结合干实验室推理、湿实验室实验等形成闭环物理发现循环。\n- **深度解析**: 论文提出了一种统一的能力形成和以过程为中心的评估方法，使发现行为能够被训练、改进和衡量。作者认为这是智能缩放的更广泛进展：从学习现有知识，到从行动结果中学习，最终参与到新知识的发现、测试和修订结构的构建中（实验结果、数字和数据集摘要未提供）。\n- **领域归类**: [人工智能, 基础模型, 科学发现]\n---\n\n### 10. BVB: Benchmarking Agentic Video Understanding via Programmatic Reconstruction in Blender (BVB：通过在Blender中进行程序化重建来基准测试智能体视频理解)\n- **社区热度**: `👍 22 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15478)\n- **研究任务**: 提出一种新的视频理解基准测试方法，通过要求智能体在Blender中程序化重建真实世界视频来评估其视频理解能力，而非仅仅通过问答。\n- **核心亮点**: 引入BVB（Blender-VideoBench），智能体通过轻量级工具在相同沙盒和共享成本限制下编程重建视频；从两个轴评估：双重VQA（保留时空事实的数量）和潜在相似性（感知匹配程度）；总体得分采用平方根均值。\n- **深度解析**: 评估了10个模型家族的51种配置。最佳模型达到88.6的潜在相似性，但仅保留了53.7%的源正确时空答案。额外的推理提高了视觉相似性，但未缩小事实准确性的差距。盲测表明潜在相似性与人类偏好高度相关。结果表明程序化重建是测试智能体视频理解的可行方法，而语义保留仍是主要挑战（具体的模型名称和数据集摘要未提供）。\n- **领域归类**: [计算机视觉, 视频理解, 基准测试]\n---\n\n### 11. How Lossless Is Lossless Speculative Decoding? The Role of Numerical Precision in Orthrus (无损推测解码究竟有多无损？数值精度在Orthrus中的作用)\n- **社区热度**: `👍 21 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15504)\n- **研究任务**: 评估Orthrus模型（一种混合自回归-扩散架构）在不同数值精度下实现无损推测解码（即生成与自回归模型完全相同的输出序列）的实际效果。\n- **核心亮点**: 发现Orthrus的“无损”特性高度依赖数值精度。在BF16精度下，作者和独立训练的模型在1190个提示上的精确轨迹匹配率分别仅为45%和43%；而在FP32精度下，所有评估提示均能实现精确匹配。此外，精确匹配概率与参考模型的响应条件困惑度强相关。\n- **深度解析**: 研究指出，尽管在BF16下存在轨迹分歧，Orthrus在下游基准测试中并未表现出系统性退化。这表明应将精确的轨迹等价性与下游任务性能分开评估，且Orthrus在实际应用中的无损性本质上取决于数值精度。\n- **领域归类**: [大语言模型推理加速, 推测解码, 数值精度]\n---\n\n### 12. AlayaVista: Streaming World Modeling from Panoramic States to Perspective Video (AlayaVista：从全景状态到透视视频的流式世界建模)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14462)\n- **研究任务**: 构建一个支持相机控制的流式视频世界模型，解决在相机运动下保持广泛场景上下文同时生成高保真、低延迟观测的表示权衡问题。\n- **核心亮点**: 提出AlayaVista，将全景世界演化与透视观测合成分离。利用预训练模型构建360度场景先验，通过潜在视口渲染器和透视细化器生成目标视频，并适配分块自回归生成和少步蒸馏。构建了包含1318小时4K以上分辨率视频的大规模真实世界全景视频数据集MUGEN。\n- **深度解析**: 研究动机源于视觉感知中全局上下文和选择性局部敏锐度的互补作用。现有透视模型需处理局部视图并在长序列中保留屏幕外内容，而广空间覆盖通常需要合成全视场视频或构建显式3D表示，AlayaVista通过解耦这两种表示有效解决了这一权衡。\n- **领域归类**: [视频生成, 世界模型, 3D/全景视觉]\n---\n\n### 13. Omni-Streaming Thinking (全模态流式思考)\n- **社区热度**: `👍 17 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15128)\n- **研究任务**: 解决流式全模态模型在视频和同步音频处理中，因视觉线索先于完整语音事件而导致的“过早跨模态承诺”问题。\n- **核心亮点**: 提出Omni-Streaming Thinking (OST)，生成包含当前证据、未来预测及声明的结构化输出，并在验证区间结束时检查声明。检测到矛盾时通过反驳过程降低原声明影响。在5个基准上平均相对提升超10%，并引入OST-DiagBench，其d-prime达到2.95（基线最高1.38）。\n- **深度解析**: 研究将这种失败定义为“过早跨模态承诺”（premature cross-modal commitment），即如果早期视觉解释作为事实进入记忆，后续推理会在音频证据产生矛盾后继续传递该错误解释。OST通过将音视频证据分开存储并引入验证区间和反驳机制，从根本上缓解了这一问题。\n- **领域归类**: [多模态大模型, 流式处理, 音视频理解]\n---\n\n### 14. Kaininja: Extending Native 3D Generators to the Part Level (Kaininja：将原生3D生成器扩展至部件级别)\n- **社区热度**: `👍 16 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15659)\n- **研究任务**: 将现有的原生3D生成器（如TRELLIS.2）从生成单一融合网格扩展到生成部件级别的3D资产，以支持编辑、绑定和模拟等下游任务。\n- **核心亮点**: 引入双体积表示解决O-Voxel网格无法表示部件接触界面的问题。提出KaiNinja，无需掩码或分割器即可保持原模型的生成速度和质量。训练数据包含CAD模型和LLM驱动智能体创作的资产。整体Chamfer距离降低40%，严格部件F-score提高16%。\n- **深度解析**: 研究指出了一个关键的技术瓶颈：O-Voxel网格每个体素只存储一层表面，因此在任何分辨率下，单个体积都无法表示两个部件接触的界面。KaiNinja通过双体积表示形式解决了这一几何表示难题，并且意外发现，在相同数据集上微调的相同骨干网络，其整体对象的保真度也得到了提升。\n- **领域归类**: [3D生成, 计算机视觉, 几何建模]\n---\n\n### 15. HazardAuditor: From Executable Threats to Safer Computer-Use Agents (HazardAuditor：从可执行威胁到更安全的计算机使用智能体)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15134)\n- **研究任务**: 解决计算机使用智能体在运行时行为中引入的安全风险，填补现有针对静态提示的防护模型和仅输出评估结果的可执行安全平台之间的空白。\n- **核心亮点**: 提出HazardAuditor框架，在受控环境中运行异构智能体并将交互归一化为规范事件表示。提出GuardPO，将确定性安全结果转化为序列级优势。在多个基准上准确率比最强先前防护模型提高高达16.5个百分点。\n- **深度解析**: 研究观察到，token级的后训练目标会为生成式防护模型造成结构不匹配，导致较长的理由（rationales）主导梯度更新。GuardPO通过将确定性安全结果转化为序列级优势，并归一化理由和判定区域，使安全决策成为有效的优化单元，从而解决了这一结构性问题。\n- **领域归类**: [AI安全, 智能体安全, 强化学习]\n---\n\n### 16. LLaDA-UI: Bringing Block-wise Diffusion to Vision-Language GUI Agents (LLaDA-UI：将分块扩散引入视觉语言GUI智能体)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13287)\n- **研究任务**: 探索扩散大语言模型（dLLMs）能否在保持并行解码优势的同时，扩展为强大的多模态GUI智能体，以实时感知屏幕状态并输出结构化、空间接地的动作。\n- **核心亮点**: 提出LLaDA-UI，一个16.7B参数的基于MoE的分块扩散视觉语言GUI智能体。采用两阶段训练：通用多模态预训练对齐视觉编码器与扩散语言骨干，随后进行GUI智能体监督微调。在多个GUI基准上大幅超越Qwen2.5-VL-7B，并在6个报告基准中的4个上超越Qwen3-VL-8B。\n- **深度解析**: 研究指出，扩散大语言模型通过分块并行、任意顺序的生成方式实现了高解码效率，这对延迟敏感的应用极具吸引力。GUI智能体需要反复感知屏幕状态并实时发出动作，是测试这一范式的天然试验台，该研究成功证明了分块扩散可作为多模态GUI智能体的实用生成范式。\n- **领域归类**: [GUI智能体, 扩散模型, 多模态大模型]\n---\n\n### 17. When Agents Slow Down: Understanding LLM Agents' Test-Time Strategies via Elo-per-token Analysis (当智能体放缓：通过每token Elo分析理解LLM智能体的测试时策略)\n- **社区热度**: `👍 12 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15309)\n- **研究任务**: 研究大语言模型智能体在测试时自适应分配计算资源的策略，并衡量智能体性能如何随计算量扩展。\n- **核心亮点**: 提出Elo-per-token分析，跟踪每个token预算下的最佳解决方案并聚合为跨任务Elo评分。发现智能体初期将token转化为Elo的速度快于独立采样，但边际收益递减并最终低于参考值。定义了“扩展拐点”，并据此将1亿token分配到并行会话中，比单个长会话获得+264 Elo，比十个短会话获得+355 Elo。\n- **深度解析**: 研究引入了独立采样作为理论特征参考（其Elo随计算量的对数线性增长），并发现最强的人类历史参赛者在共享任务上的表现随时间呈超线性提升，这证明了人类具备持续学习能力，且在智能体放缓后仍有巨大的提升空间。\n- **领域归类**: [LLM智能体, 测试时计算, 性能评估]\n---\n\n### 18. Agent as Policy for Robotic Manipulation (智能体即策略：用于机器人操作)\n- **社区热度**: `👍 11 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.12541)\n- **研究任务**: 证明通用智能体可以在无需任何任务特定或环境特定训练的情况下，直接驱动物理机器人完成整个任务执行过程。\n- **核心亮点**: 提出Agent as Policy (AGP)，智能体解释视觉证据、编写可执行程序、发出运动命令并根据物理结果修改动作。在包括从人类视频组装、从目标图像构建积木、模具重定向、定向投掷和双手毛巾折叠等真实世界操作任务中，AGP在三种积木构建配置中分别达到100%、100%和80%的成功率。\n- **深度解析**: 研究将任务规划和执行完全置于智能体控制下，使智能体的推理和编程能力与物理世界产生持续交互。这为通用智能体作为机器人策略提供了一条路径，通过运行时的推理、编程和交互，将其自主性扩展到物理操作领域。\n- **领域归类**: [机器人操作, 具身智能, 通用智能体]\n---\n\n### 19. Pick Your Poison: Learning to Select Poison Sets for Stronger LLM Backdoor Attacks (挑你的毒药：学习选择毒物集以增强LLM后门攻击)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15029)\n- **研究任务**: 解决现有后门中毒攻击评估中因随机采样毒物样本而严重低估最坏情况脆弱性的问题，研究如何选择最优的毒物样本集以最大化攻击成功率。\n- **核心亮点**: 将毒物选择形式化为oracle预算集优化问题，提出SAILS方法。从数百次微调和评估运行中学习集评分器，对数百万候选集排名并审计一小部分。在LLaMA-3-8B的三种后门设置中，SAILS将保留攻击成功率平均提高了30个百分点，并能从小规模微调到全规模微调迁移。\n- **深度解析**: 研究指出，在固定模型、干净数据和毒物数量的情况下，仅因选择的毒物集不同，攻击成功率就会在3%到80%之间波动。这表明随机采样会严重低估最坏情况下的脆弱性，必须通过优化毒物集的选择来准确评估和防范后门攻击。\n- **领域归类**: [AI安全, 后门攻击, 大语言模型]\n---\n\n### 20. Not All Prompts Are Equal: Exploration-Guided Prompt Scaffolding for Multimodal Reinforcement Post-Training (并非所有提示都平等：用于多模态强化后训练的探索引导提示脚手架)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15051)\n- **研究任务**: 解决多模态大语言模型在在线强化学习后训练中，不同训练提示对当前策略的信息量差异巨大，但标准训练分配相同展开预算的问题。\n- **核心亮点**: 提出探索引导的提示脚手架框架，动态调整RL后训练中的提示分布。核心是探索潜力分数（EPS），一种基于KL正则化策略改进理论的轻量级代理。利用教师模型生成脚手架重写。结合GRPO在Geo3K和MMK12上训练，域内相对提升高达9.7%，在MathVision和MMMU-Pro上分别提升11.5%和11.1%。\n- **深度解析**: 研究提出不直接丢弃低效用提示，而是使用教师模型生成保留原始任务意图的脚手架重写，使后续训练更具信息量。这种方法将教师监督重新定义为训练数据细化，而非单纯的输出模仿，从而更有效地利用了训练预算。\n- **领域归类**: [强化学习, 多模态大模型, 提示工程]\n---\n\n### 21. MInTRL: Off-policy Intervention can boost On-policy RL (最小干预强化学习：离策略干预可以提升在策略强化学习)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.12419)\n- **研究任务**: 解决强化学习（特别是结合可验证奖励的 RL）中在策略（on-policy）探索受限与离策略（off-policy）分布偏移之间的矛盾，旨在扩展探索前沿而不牺牲可学习性。\n- **核心亮点**: 提出 MInTRL，通过在在策略生成中引入稀疏、局部的干预来扩展探索；采用序列级优势回归目标，无需重要性采样；在中等干预强度下性能达到峰值。\n- **深度解析**: 该方法巧妙地结合了 in-policy 的可学习性和 off-policy 的探索能力。实验数据集：摘要未提供（仅提及数学和代码基准）。具体实验结果数字：摘要未提供（仅提及一致优于标准基线）。\n- **领域归类**: [强化学习, 大模型后训练]\n---\n\n### 22. Attention-DP3: Spatially Object-aware 3D Diffusion Policy via Geometry-aligned Attentional Conditioning (Attention-DP3：通过几何对齐注意力条件实现空间物体感知的 3D 扩散策略)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13318)\n- **研究任务**: 解决复杂杂乱操作场景中，标准 3D 扩散策略难以定位和利用与任务相关的 3D 点云几何特征的问题。\n- **核心亮点**: 提出 Attention-DP3，通过三场注意力条件（目标场、目标内显著性场、背景场）注入物体级几何线索；在严重遮挡场景下，性能比 DP3 提升高达 31%。\n- **深度解析**: 该方法在不改变 DP3 扩散骨干的前提下，利用开放词汇 2D 分割和相机几何将先验转化为 3D 线索，有效抑制了背景干扰。实验数据集：Adroit, DexArt, MetaWorld 以及真实世界 SO101 平台。具体实验结果数字：在严重杂乱下比 DP3 提升高达 31%。\n- **领域归类**: [机器人学, 计算机视觉, 扩散模型]\n---\n\n### 23. Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model (Dynin-Robotics：全模态统一扩散视觉-语言-动作模型)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13053)\n- **研究任务**: 构建一个全模态统一的视觉-语言-动作（VLA）模型，通过共享轨迹模型为语言条件机器人策略提供目标结果和场景动态变化的表示。\n- **核心亮点**: 基于 Dynin-Omni 掩码扩散骨干，将语言、视觉、目标和动作表示为离散 token；支持测试时缩放；在真实 Franka Research 3 机器人上平均成功率达 78.4%；推理加速高达 29.2 倍。\n- **深度解析**: 通过改变条件跨度，同一模型可学习动作预测、下一观测预测等多种目标。实验数据集：48 个 Open X-Embodiment 数据集（约 133 万条轨迹）、VLABench、LIBERO。具体实验结果数字：Franka 机器人 78.4% 成功率，推理加速 29.2 倍。\n- **领域归类**: [机器人学, 多模态大模型, 扩散模型]\n---\n\n### 24. Expert-Space Exploration in MoE Reinforcement Learning (混合专家强化学习中的专家空间探索)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13058)\n- **研究任务**: 解决混合专家（MoE）模型在强化学习后训练中，将专家选择视为固定组件而限制了 rollout 多样性的问题。\n- **核心亮点**: 提出 ESRL 框架，显式探索 MoE 的专家路由空间；保留高置信度专家为锚点，根据路由器熵自适应扰动强度；在 Qwen3-30B-A3B 上，Pass@1 和 Pass@8 分别提升 3.2 和 4.5 个百分点。\n- **深度解析**: 通过扰动专家路由增加输出多样性，同时避免激活不合适专家导致的性能下降，并利用路径重放缓解路由不匹配。实验数据集：摘要未提供（仅提及数学、科学和代码任务）。具体实验结果数字：Qwen3-30B-A3B 上 Pass@1 提升 3.2%，Pass@8 提升 4.5%。\n- **领域归类**: [强化学习, 大语言模型, 混合专家模型]\n---\n\n### 25. Enabling Creative Exploration for Vibe Design Agents (为 Vibe 设计代理启用创意探索)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15078)\n- **研究任务**: 解决 AI 设计代理在将自然语言转化为 UI 界面和前端代码时，难以帮助用户探索连贯替代方案的问题。\n- **核心亮点**: 将探索与实现分离，引入结构化设计规范作为中间决策；在保持下游生成设置固定的情况下，有效扩大了设计方案的覆盖率和截图变化。\n- **深度解析**: 避免了直接提高 token 级温度导致的美学和语法混乱，提供了一种控制 UI 概念探索的实用方法。实验数据集：摘要未提供（仅提及 168 个提示和超过 300,000 个在线任务）。具体实验结果数字：摘要未提供（仅提及代码导出增加在统计上不确定，但负面反馈减少）。\n- **领域归类**: [人机交互, 代码生成, 大模型应用]\n---\n\n### 26. Building a Production Greek-English Speech Recognizer (构建生产级希腊语-英语语音识别器)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13498)\n- **研究任务**: 构建并评估一个名为 Sophea 的生产级双语（希腊语-英语）自动语音识别系统，满足多项严格的生产门控要求。\n- **核心亮点**: 详细描述 6 阶段数据管道，将希腊语音频丢弃率从 98.7% 降至 10.6%；三模型 ROVER 集成将重叠语音 WER 从 53.35% 降至 37.87%；英语平均 WER 达 4.26%。\n- **深度解析**: 展示了在特定语言对上构建工业级 ASR 系统的工程挑战，如数据质量过滤和多目标优化冲突。实验数据集：摘要未提供（仅提及公开英语测试集和实时希腊语嘈杂环境流量）。具体实验结果数字：希腊语丢弃率降至 10.6%，重叠语音 WER 降至 37.87%，英语 WER 4.26%，希腊语 WER 25.88%。\n- **领域归类**: [语音识别, 自然语言处理, 工程实践]\n---\n\n### 27. Thought without systematicity? Evaluating reasoning models on rule induction tasks (没有系统性的思维？在规则归纳任务上评估推理模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13948)\n- **研究任务**: 评估当前大语言推理模型是否稳健地展现出人类认知中的“系统性”（即理解一个概念 inherently tied to understanding close variations）。\n- **核心亮点**: 利用认知科学的规则归纳任务及任务同构（重组和替换）创建结构等效变体；发现模型虽能解决原任务，但常在结构等效变体上失败，表明其缺乏系统性。\n- **深度解析**: 挑战了推理模型具备真正泛化和系统性思维的假设，指出其能力可能局限于特定的评估上下文。实验数据集：摘要未提供（仅提及已建立的规则归纳任务）。具体实验结果数字：摘要未提供（仅提及模型经常在等效变体上失败）。\n- **领域归类**: [大模型评估, 认知科学, 推理能力]\n---\n\n### 28. ModaLens: Measuring Image Sensitivity in Report-Conditioned Medical VLMs (ModaLens：测量报告条件下的医疗 VLM 图像敏感性)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.15635)\n- **研究任务**: 评估医疗视觉语言模型（VLM）在提供文本放射学报告时，是否真正利用了图像信息（即图像敏感性）。\n- **核心亮点**: 提出 ModaLens 配对图像交换审计方法；发现当提供报告时，模型对图像交换的敏感性显著降低（答案变化率从 20.94% 降至 4.26%）。\n- **深度解析**: 揭示了医疗 VLM 可能过度依赖文本报告而忽视视觉信息的“偷懒”行为，为多模态模型的可靠性评估提供了新视角。实验数据集：3,199 个 MIMIC-CXR 配对案例（来自 293 名患者）。具体实验结果数字：有报告时答案变化率 4.26%，无报告时 20.94%，配对增加 16.7 个百分点。\n- **领域归类**: [医疗 AI, 多模态大模型, 模型评估]\n---\n\n### 29. E2A-Bench: Benchmarking Evidence-to-Action Reliability in Financial Chart Reasoning (E2A-Bench：基准测试金融图表推理中的证据到行动可靠性)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.14302)\n- **研究任务**: 评估金融视觉语言模型（VLM）能否将图表证据转化为可靠的行动建议，解决现有评估仅关注声明幻觉而忽略证据追踪的问题。\n- **核心亮点**: 提出 E2A-Bench 基准（969 个查询），引入 NDR 等指标评估全链路可靠性；揭示金融微调可能导致 BUY:SELL 比例放大 4.21 到 4.68 倍。\n- **深度解析**: 指出金融 VLM 评估必须追踪从证据到最终行动的完整链条，以确保建议的合理性，单一幻觉分数会掩盖方向覆盖率低等严重问题。实验数据集：323 个 HS300 成分股。具体实验结果数字：评估了 20 个 VLM，最低 UCR 模型方向覆盖率仅 6.4%，金融微调使 BUY:SELL 比例放大 4.21 至 4.68 倍。\n- **领域归类**: [金融 AI, 多模态大模型, 基准测试]\n---\n\n### 30. Learning Sparse Decision Trees via Transformer Variational Auto-Encoders (通过 Transformer 变分自编码器学习稀疏决策树)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.01430)\n- **研究任务**: 学习兼顾预测性能和结构稀疏性的决策树，解决现有算法忽视结构稀疏性优化的问题。\n- **核心亮点**: 提出 TREVIS 方法，利用树 Transformer 变分自编码器（TTVAE）将离散的决策树搜索转化为连续的潜在空间优化；在保持预测性能的同时提升了结构稀疏性。\n- **深度解析**: 结合了深度生成模型和传统可解释模型，为高风险场景下需要高可解释性和简洁结构的决策任务提供了新思路。实验数据集：摘要未提供。具体实验结果数字：摘要未提供（仅提及匹配现有近优算法性能并提高稀疏性）。\n- **领域归类**: [可解释 AI, 机器学习, 生成模型]\n---\n\n### 31. Root-Cause Attribution Is a Search Problem: Continual Search for Long-Horizon Agent Failures (根因归因是一个搜索问题：针对长程智能体失败的持续搜索)\n- **社区热度**: `👍 0 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.13463)\n- **研究任务**: 自动化根因归因（RCA），即在长程任务中 AI 智能体产生的大量执行日志里诊断失败的根本原因。\n- **核心亮点**: \n  1. 提出“持续搜索”（Continual Search）迭代框架，引导大模型在多轮交互中持续寻找未解决的诊断证据，克服现有方法在长轨迹中过早下结论而遗漏关键证据的缺陷。\n  2. 构建了 MegaRCA-Mix 数据集，包含 50 个人工标注的长程、执行密集型任务失败样本，填补了当前缺乏大规模执行轨迹基准的空白。\n- **深度解析**: \n  随着 AI 智能体在长程任务中的广泛应用，执行日志规模庞大，人工审查已不切实际。现有的基于大语言模型（LLM）的 RCA 方法多采用一次性判断，当执行轨迹变长时，由于相关信息稀疏、分散且与表面故障脱节，诊断准确率大幅下降。本文指出这本质上是一个巨大的搜索问题。通过“持续搜索”框架，模型被引导在连续轮次中不断深挖证据。在 MegaRCA-Mix 数据集上的评估显示，该方法使 GPT-5.5 的 F1 分数从 0.349 提升至 0.498（提升超 40%）。更有趣的是，在同一模型家族中，较低级别的模型配合该搜索策略甚至能超越更高级别的模型，证明了“有效的搜索策略胜过单纯的模型规模”。\n- **领域归类**: [智能体, 根因归因, 大语言模型, 基准测试]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [MG1937/ASC](https://github.com/MG1937/ASC)\n- **今日趋势**: 1,086 stars / 189 forks，今日新增 122 stars\n- **项目简介**: 一款专为智能体和移动研究人员设计的超快Android反编译前端工具。\n- **核心价值**: \n  - **项目用途**: 提供超快速的Android反编译前端功能。\n  - **目标人群**: 智能体（Agents）和移动安全研究人员。\n  - **技术核心**: 高效的Android反编译前端技术。\n  - **AI/大模型相关**: 部分相关（描述中提及为“Agents”设计，可能用于AI智能体自动化分析，但核心为传统反编译工具）。\n\n---\n\n### [ComposioHQ/awesome-claude-skills](https://github.com/ComposioHQ/awesome-claude-skills)\n- **今日趋势**: 75,083 stars / 8,685 forks，今日新增 80 stars\n- **项目简介**: 一个精选的Claude技能（Skills）、资源和工具列表，用于定制Claude AI工作流。\n- **核心价值**: \n  - **项目用途**: 汇总和提供定制Claude AI工作流所需的技能、资源和工具。\n  - **目标人群**: 需要定制和优化Claude AI工作流的开发者与用户。\n  - **技术核心**: Claude AI工作流定制与技能（Skills）管理。\n  - **AI/大模型相关**: 是（直接针对Claude AI大模型生态）。\n\n---\n\n### [unclecode/crawl4ai](https://github.com/unclecode/crawl4ai)\n- **今日趋势**: 83,557 stars / 8,633 forks，今日新增 98 stars\n- **项目简介**: 一款开源的、对大语言模型（LLM）友好的Web爬虫和数据抓取工具。\n- **核心价值**: \n  - **项目用途**: 提供网页爬虫与数据抓取功能，输出格式对LLM友好。\n  - **目标人群**: 需要为大语言模型准备和清洗网页数据的开发者与研究人员。\n  - **技术核心**: Web爬虫与数据抓取技术，针对LLM输入进行优化。\n  - **AI/大模型相关**: 是（专为LLM大模型设计的数据获取工具）。\n\n---\n\n### [rommapp/romm](https://github.com/rommapp/romm)\n- **今日趋势**: 13,009 stars / 725 forks，今日新增 102 stars\n- **项目简介**: 一款美观、强大且支持自托管的ROM（游戏镜像）管理器和播放器。\n- **核心价值**: \n  - **项目用途**: 提供自托管的ROM文件管理与游戏模拟运行功能。\n  - **目标人群**: 复古游戏爱好者及需要管理本地游戏ROM的用户。\n  - **技术核心**: 自托管Web应用架构，ROM文件管理与模拟器集成。\n  - **AI/大模型相关**: 否（纯游戏ROM管理工具，无AI/大模型相关描述）。\n\n---\n\n### [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\n- **今日趋势**: 36,325 stars / 4,077 forks，今日新增 62 stars\n- **项目简介**: 由Anthropic官方管理的高质量Claude Code插件目录。\n- **核心价值**: \n  - **项目用途**         const rendered = marked.parse(markdown);
        target.innerHTML = DOMPurify.sanitize(rendered);
      });
    </script>
