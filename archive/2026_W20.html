### 1. MACE-Dance: Motion-Appearance Cascaded Experts for Music-Driven Dance Video Generation (MACE-Dance：音乐驱动舞蹈视频生成的运动 - 外观级联专家模型)

- **论文链接**: [点击跳转](https://arxiv.org/abs/2512.18181)
- **研究任务**: 音乐驱动的舞蹈视频生成。
- **核心亮点**: 将运动生成与外观渲染解耦，采用级联专家结构分别处理。
- **深度解析**: 针对现有方法运动与画面一致性差的问题，设计了级联专家网络。第一阶段专家专注音乐节奏与骨骼运动匹配，第二阶段专家负责基于运动序列生成高保真视频外观。这种分治策略降低了单模型学习难度，提升了动作卡点准确率和视频清晰度。
- **领域归类**: [AIGC, 视频生成, 多模态]

### 2. Mean Mode Screaming: Mean--Variance Split Residuals for 1000-Layer Diffusion Transformers (Mean Mode Screaming：面向千层扩散 Transformer 的均值 - 方差分裂残差结构)
- **社区热度**: `👍 74 Upvotes`

- **深度解析**: 针对深层 DiT 训练中的梯度消失和模式坍塌问题，修改了残差连接方式。将残差信号分解为均值和方差两部分分别传递，稳定了深层网络的信号传播。实验证明该结构能显著加深网络层数而不损失收敛性，提升了模型表达能力。
- **领域归类**: [深度学习架构, 扩散模型, 基础模型]
