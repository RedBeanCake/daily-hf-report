### 1. MinT: Managed Infrastructure for Training and Serving Millions of LLMs (MinT：用于训练和服务数百万大模型的管理式基础设施)
- **社区热度**: `👍 131 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.13779)
- **研究任务**: 大模型基础设施与资源调度
- **核心亮点**: 提出了一套能同时支撑百万级模型训练和推理服务的统一资源管理架构。
- **深度解析**: 主要针对多模型并发场景下的资源碎片化问题。设计了动态调度器，根据模型大小和请求负载自动分配显存和计算单元。支持训练任务和服务任务在同一集群内混合部署，通过优先级队列避免互相干扰。实测在高负载下资源利用率提升明显，降低了运维成本。
- **领域归类**: [LLM 基础设施], [系统优化], [资源调度]

### 2. MulTaBench: Benchmarking Multimodal Tabular Learning with Text and Image (MulTaBench：图文多模态表格学习基准)
- **社区热度**: `👍 108 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.10616)
- **研究任务**: 多模态表格数据理解基准测试
- **核心亮点**: 构建了首个结合文本、图像和表格结构的多模态评估基准。
- **深度解析**: 现有基准多侧重纯表格或纯图文，这篇 work 把三者结合起来。数据集包含带图表说明的复杂表格，任务涉及数据检索、趋势分析和跨模态推理。测试了当前主流多模态模型在该任务上的表现，发现模型在处理表格结构与图像关联时仍有较大短板，为后续研究提供了明确改进方向。
- **领域归类**: [多模态学习], [基准测试], [表格理解]

### 3. AnyFlow: Any-Step Video Diffusion Model with On-Policy Flow Map Distillation (AnyFlow：基于在线策略流图蒸馏的任意步数视频扩散模型)
- **社区热度**: `👍 73 Upvotes`
- **论文链接**: [点击跳转](https://arxiv.org/abs/2605.13724)
- **研究任务**: 视频生成与加速采样
- **核心亮点**: 实现了视频扩散模型的任意步数采样，并通过蒸馏技术大幅减少推理时间。
- **深度解析**: 传统扩散模型采样步数固定，这篇提出“流图蒸馏”方法。让模型学习从任意噪声状态直接映射到清晰视频帧的流形，支持在推理时灵活调整步数（如从 50 步减到 5 步）。在线策略蒸馏保证了少步数下的生成质量不崩塌，适合对延迟敏感的视频生成应用。
- **领域归类**: [视频生成], [扩散模型], [模型蒸馏]
---

### 9. Many-Shot CoT-ICL: Making In-Context Learning Truly Learn (Many-Shot CoT-ICL：让上下文学习真正具备学习能力)

- **深度解析**: 机器人视频数据中大量帧是重复或无效的。这篇提出一个帧选择模块，根据动作变化率和信息熵筛选关键帧。训练时只使用这些帧，大幅降低了显存占用和训练时间。实验表明，在数据量减少 50% 的情况下，策略执行成功率未下降，甚至因噪声减少而略有提升。
