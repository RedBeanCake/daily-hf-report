    <h1>前沿科研情报 - 2026-09-26</h1>
    <div id="content"></div>
    <script type="application/json" id="raw-md">"\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🤗 Hugging Face 今日论文 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### 1. Training Object Permanence in World Models (在世界模型中训练客体永恒性)\n- **社区热度**: `👍 153 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.28654)\n- **研究任务**: 探究视频生成模型（作为当前世界模型的代表）是否具备客体永恒性，并尝试通过受核心认知科学启发的数据集来训练它们以构建类人物理智能。\n- **核心亮点**: 提出了WROP（具有客体永恒性的世界推理），包含150个手工设计的认知科学任务，分为六个认知类别。使用Blender生成器随机化参数，生成了150万样本的训练语料库和300个问题的考试。评估了14个视频模型，其中16B参数的PWM-WROP在盲评Elo研究中排名延续模型第一，总排名第三。\n- **深度解析**: 视频生成模型开始展现出涌现的推理能力，是构建类人物理智能的理想候选。该研究通过引入受认知科学启发的数据基础设施，系统性地评估并训练视频模型的物理常识，为提升世界模型的物理推理能力提供了新的数据范式和评估基准。\n- **领域归类**: [计算机视觉, 世界模型, 认知科学, 视频生成]\n---\n\n### 2. Your Transformer Can Hold Two Thoughts at Once: Evidence of Linear Superposition in LLMs (你的Transformer可以同时容纳两种想法：大语言模型中线性叠加的证据)\n- **社区热度**: `👍 49 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29845)\n- **研究任务**: 探究大语言模型在处理线性组合的独立文本流输入时，是否表现出基本的线性特性，即输出单个下一个token分布的叠加。\n- **核心亮点**: 提出了“叠加线性假设”。证明叠加是Transformer架构的内在属性，而非训练的涌现结果（实际上随着预训练推进会减弱）。通过轻量级微调可以大幅恢复线性。提出了一种引导解码程序来解耦叠加输出，实现单次前向传播同时生成两个连贯的续写。\n- **深度解析**: 尽管大语言模型依赖高度非线性的组件，该研究揭示了其内在的线性特性。这一发现不仅深化了对Transformer架构基础属性的理解，还为通过单次前向传播并行处理多任务或生成多路径内容提供了新的理论依据和实用解码方法。\n- **领域归类**: [自然语言处理, 大语言模型, 模型可解释性, Transformer架构]\n---\n\n### 3. WanPE: Towards Cinematic Prompt Enhancement for Modern Text-to-Video Generation (WanPE：面向现代文本到视频生成的电影级提示词增强)\n- **社区热度**: `👍 24 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30221)\n- **研究任务**: 解决现代视频生成器在生成长时间、复杂条件视频时，文本提示词在指导多镜头序列中的动作、相机轨迹、光照和声音等方面的规划问题。\n- **核心亮点**: 提出WanPE，一个拥有397B参数的提示词增强模型，在105万真实视频上训练。通过基于视频的反向构建制定镜头级电影计划，并采用语义一致性GRPO（SC-GRPO）跨镜头保留用户需求。构建了WanPEval基准。在Wan3.0视频生成器上，WanPE-397B在5-15秒和30秒视频生成中显著提升了人类偏好。\n- **深度解析**: 随着视频生成模型能够生成更长时间和更复杂的视频，文本提示词的导演级规划能力变得至关重要。WanPE通过反向构建和语义一致性强化学习，有效解决了长序列生成中语义漂移和需求丢失的问题，为高质量、电影级视频生成提供了强大的提示词工程解决方案。\n- **领域归类**: [计算机视觉, 视频生成, 提示词工程, 多模态]\n---\n\n### 4. OmniEcho: Spatial Audio Understanding for Embodied Agents (OmniEcho：具身智能体的空间音频理解)\n- **社区热度**: `👍 20 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23407)\n- **研究任务**: 解决具身智能体在空间音频理解方面的挑战，特别是如何有效评估和建模具身环境中的空间音频理解，以及将声源方向与视觉线索结合进行推理。\n- **核心亮点**: 引入OmniEchoBench，一个包含197个真实场景、2972个QA对和900个导航样本的统一基准。开发了可控的空间音频渲染管线。提出OmniEcho模型，引入FOA空间编码器和预训练语义音频路径。在空间音视频感知上达到SOTA，在声音引导导航上接近传统视觉-语言导航水平。\n- **深度解析**: 人类能够轻松定位声源并结合视觉线索进行推理，但这对具身智能体仍具挑战。该研究填补了具身环境中空间音频理解评估和建模的空白，证明了空间音频可以作为具身场景推理和导航的有价值信号，同时指出了细粒度空间定位和距离估计仍是重要的开放性挑战。\n- **领域归类**: [具身智能, 多模态学习, 空间音频, 机器人导航]\n---\n\n### 5. Agent-Editing World Model: Rethinking World Modeling for LLM Agents (智能体编辑世界模型：重新思考大语言模型智能体的世界建模)\n- **社区热度**: `👍 13 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.28416)\n- **研究任务**: 解决现有语言世界模型在预测环境观察时的局限性，以及智能体在长视野任务中面临的“任务状态污染”问题（历史中残留不支持的假设和过时计划扭曲后续决策）。\n- **核心亮点**: 提出智能体编辑世界模型（AEWM），对推理和行动如何塑造未来任务进展进行建模。结合Action Judge（区分关键、探索和噪声决策）和State Revision（编辑噪声推理-行动续写）。在Action Judge基准上达到70.5% macro-F1，在六个基准上EditAct平均提升3.2-6.7分。\n- **深度解析**: 传统的世界模型试图模拟环境反馈，但在真实反馈可用时，预测高熵的工具响应收益甚微。AEWM通过直接编辑智能体的推理和行动轨迹来修正任务状态，有效缓解了任务状态污染问题。这种从“模拟环境”到“编辑智能体状态”的范式转变，为提升LLM智能体在复杂环境中的长期规划能力提供了新思路。\n- **领域归类**: [自然语言处理, 智能体, 世界模型, 强化学习]\n---\n\n### 6. Parts-of-Speech as Emergent Categories in SAE Latent Space (词性作为稀疏自编码器潜在空间中的涌现类别)\n- **社区热度**: `👍 10 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29362)\n- **研究任务**: 探究稀疏自编码器（SAEs）的潜在特征是否暴露了语言模型表示中的形态句法信息，特别是词性（PoS）类别是由单个潜在特征编码还是由结构化的特征组编码。\n- **核心亮点**: 发现词性区别可以从SAE激活中高度恢复，但并不与“一对一”的潜在特征/类别映射对齐。这种可恢复性不能归结为词汇记忆。词性类别由紧凑的稀疏潜在特征组支持，且在不同标签间存在差异。这些组在留出数据上保持稳定，并在相关类别间显示重叠。\n- **深度解析**: 该研究通过词性这一受控测试用例，深入剖析了稀疏自编码器在语言模型表示中捕获的形态句法结构。结果表明，模型并非通过原子级的语法特征来定位这些信息，而是以分布式且依赖于类别的形式来表征，这为理解大语言模型的内部表征机制提供了新的视角。\n- **领域归类**: [自然语言处理, 模型可解释性, 稀疏自编码器, 语言学]\n---\n\n### 7. Qwen-Planner-Agent: A Closed-Loop AI-for-AI Framework for Real-World Mobile Planner Agents (Qwen-Planner-Agent：面向真实世界移动规划智能体的闭环“AI赋能AI”框架)\n- **社区热度**: `👍 9 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29892)\n- **研究任务**: 探索AI能否既作为开发对象，又作为构建下一代AI系统的积极参与者，解决移动规划中复杂长视野任务挑战智能体可靠性以及真实设备交互成本高昂限制开发可扩展性的问题。\n- **核心亮点**: 构建了Qwen-Planner-Agent，采用闭环“AI赋能AI”框架。包含：(1) AI for Data：构建人类门控的智能体数据飞轮；(2) AI for Training：结合监督规划冷启动与混合环境在线智能体强化学习，引入CARE（能力感知奖励与优势工程）；(3) AI驱动模型-工具协同进化。在MobilePA-Bench上取得最佳整体性能。\n- **深度解析**: 该研究提出了一种创新的闭环框架，将数据生产、模型训练和部署通过共享的动作-反馈-验证契约连接起来。通过引入能力感知奖励与优势工程以及执行证据驱动的协同进化机制，有效降低了推理和工具使用成本，同时保持了任务性能，为可扩展的复杂移动规划智能体开发提供了系统性解决方案。\n- **领域归类**: [自然语言处理, 智能体, 强化学习, 移动计算]\n---\n\n### 8. IterSynth: Rethinking Deep Search Agents via Role-Decoupled Iterative Synthesis (IterSynth：通过角色解耦的迭代合成重新思考深度搜索智能体)\n- **社区热度**: `👍 7 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29444)\n- **研究任务**: 解决现有ReAct风格深度搜索智能体的两个局限性：角色耦合（一个策略需处理规划、证据使用和合成）和上下文累积（搜索历史增长引入噪声并掩盖有用信息）。\n- **核心亮点**: 提出IterSynth，一种角色解耦和基于摘要的范式，在规划器和合成器之间交替，将规划与合成分离，并使用摘要作为搜索的持久状态。引入角色解耦策略优化（RDPO）进行强化学习训练。IterSynth-8B在五个长视野深度搜索基准上平均得分50.7，超越最强基线4.2%。\n- **深度解析**: 深度搜索要求智能体分解复杂查询、搜索证据并合成有根据的答案。IterSynth通过将规划与合成分离，并以摘要作为持久状态，有效解决了传统方法中的角色耦合和上下文噪声问题。结合特定的强化学习算法，实现了更精确的信用分配，显著提升了长视野复杂搜索任务的性能。\n- **领域归类**: [自然语言处理, 智能体, 信息检索, 强化学习]\n---\n\n### 9. Coding Agents for Generalized Task and Motion Planning Problems (面向广义任务与运动规划问题的编程智能体)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30233)\n- **研究任务**: 解决广义任务与运动规划（TAMP）问题中，现有方法需要大量特定于TAMP的工程工作的问题，探究编程智能体是否能通过合成跨实例泛化的程序来自动化这一过程。\n- **核心亮点**: 评估了Claude Code和Codex在28个模拟环境中的表现。在980个生成的程序和98,000个评估episodes中，所有三种智能体配置在平均成功率（56%至95%）上均优于手工工程规划器、一次性生成和基于LLM的广义规划基线。随着对象数量增加，智能体程序保持更高成功率，且计算量低一个数量级。\n- **深度解析**: 任务与运动规划涉及离散决策与几何、运动学约束的紧密耦合。该研究表明，编程智能体能够通过与环境交互来校准物理模型、测试边缘情况并优化策略，从而合成出具有强泛化能力的规划程序。这为广义规划问题提供了一个无需大量特定领域工程即可实现高性能的强基线方法。\n- **领域归类**: [机器人学, 任务与运动规划, 编程智能体, 强化学习]\n---\n\n### 10. Neural Spectral Capacity: Measuring and Designing Architectures from Network Specification Alone (神经谱容量：仅从网络规范测量和设计架构)\n- **社区热度**: `👍 6 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.23087)\n- **研究任务**: 解决现代Transformer设计和压缩中，传统的参数量和FLOPs无法捕捉架构结构（如深度-宽度、注意力头或FFN分配）差异的问题。\n- **核心亮点**: 提出神经谱容量（NSC），一个基于每个权重矩阵奇异值谱的闭式标量。在标准随机初始化下，可通过架构规范直接计算，无需模型实例化、数据或梯度。提出NSC-DP动态规划求解器。NSC在七个Transformer和CNN家族中排名优于参数量和FLOPs。NSC-DP在2秒内发现超越人工基线的架构，并在无校准数据情况下将LLaMA-7B剪枝为最佳5.7B模型，速度比最强无训练代理基线快约5900倍。\n- **深度解析**: 在模型设计和压缩中，准确评估架构容量至关重要。该指标通过利用权重矩阵的奇异值谱，提供了一种无需训练、无需数据即可精确衡量架构容量的理论指标。结合动态规划求解器，不仅能在极短时间内搜索到最优架构，还能在无校准数据的情况下实现高效模型剪枝，为神经架构设计和压缩提供了一种高效、理论驱动的新范式。\n- **领域归类**: [深度学习, 神经架构搜索, 模型压缩, 理论分析]\n---\n\n### 11. RGBD20K: A Large-Scale Benchmark for RGB-D Semantic Segmentation (RGBD20K：用于 RGB-D 语义分割的大规模基准数据集)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29028)\n- **研究任务**: 促进更鲁棒、更通用的 RGB-D 语义分割模型的开发。\n- **核心亮点**: 提出了 RGBD20K 数据集，包含 160 个细粒度类别和 20,000 个 RGB-D 图像对，并进行了高保真标注以解决长期存在的标注噪声问题。此外，提出了一种分数净化融合（SPF）方法。\n- **深度解析**: 该数据集在语义空间（160类，远超 NYUv2 的 40 类和 SUN RGB-D 的 37 类）、规模（2万对图像）和标注质量上均有显著提升，旨在促进更具泛化能力的分割模型学习。提出的 SPF 方法在所有评估的基准上均实现了最先进（SOTA）的性能，证明了利用高质量多模态信息进行 RGB-D 语义分割的有效性。\n- **领域归类**: [计算机视觉, 语义分割, 数据集]\n---\n\n### 12. Rufus-Air: An Open LLM Post-Training Recipe (Rufus-Air：一种开源的大语言模型后训练配方)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29421)\n- **研究任务**: 提供在 GLM-4.5-Air-Base (106B-A12B) 模型上进行开源且可复现的后训练流程。\n- **核心亮点**: 设计了包含 8 个阶段的串行流水线（SFT、推理 RL、代码 RL、指令遵循 RL、通用智能体、代码智能体、搜索智能体和 RLHF），并详细记录了数据、奖励设计、基础设施及阶段结果。\n- **深度解析**: 训练完全基于开源组件和公开数据，无需新的人工标注或内部蒸馏教师。研究得出四个关键发现：(1) 多样化的高质量 SFT 奠定了强大的能力基础；(2) 难度过滤使 RL 提示保持在有效的学习范围内；(3) 奖励可靠性为阶段排序提供了实用原则；(4) 基础设施和工程选择是配方的核心组成部分。最终 Rufus-Air 超越了官方 GLM-4.5-Air 的后训练版本，与同等规模的开源模型具有竞争力。\n- **领域归类**: [自然语言处理, 大语言模型, 模型训练]\n---\n\n### 13. AgentKernel: The Trust-Native Agentic Operating System (AgentKernel：信任原生的智能体操作系统)\n- **社区热度**: `👍 5 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29647)\n- **研究任务**: 解决现代 AI 智能体跨越信任边界（如摄入不可信内容、调用特权工具）时产生的安全攻击面问题，提供操作系统级别的安全治理。\n- **核心亮点**: 提出了 AgentKernel，一个将安全作为首要设计约束的信任原生智能体操作系统。围绕身份（Identity）、感知（Perception）、认知（Cognition）和执行（Execution）四大支柱构建强制执行边界。\n- **深度解析**: 现有的治理堆栈通常是应用级中间件，与智能体共享进程信任边界。AgentKernel 将经典操作系统安全原则应用于语义层面的故障（如委托滥用、提示注入、记忆中毒和工具滥用）。它将结构安全视为能力乘数，支持跨组织协作、渐进式感知、受信息流控制的记忆以及语义到内核的执行控制，填补了编排框架、智能体运行时和治理平台下方的操作系统层空白。\n- **领域归类**: [人工智能安全, 智能体系统, 操作系统]\n---\n\n### 14. PUBG Ally: A Conversational Embodied Agent as an AI Teammate (PUBG Ally：作为 AI 队友的对话式具身智能体)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29837)\n- **研究任务**: 在《绝地求生》(PUBG) 中构建一个能够推理、自主行动并与玩家作为语音队友协同作战的具身智能体。\n- **核心亮点**: 结合了智能体工具使用与实时游戏控制。语言模型智能体负责检查游戏信息、解释玩家语音、维持上下文并做出高级动作选择，以引导更快的底层控制层。在真实对局中收集了近 3.9 万个会话的数据进行迭代训练。\n- **深度解析**: 构建该队友需要结合在严格延迟约束下感知和响应不断变化的游戏世界，以及自然地与玩家交互并保持语音与动作同步的能力。部署时通过模型压缩、上下文压缩、针对性安全训练、运行时护栏和内存编辑来解决低延迟设备端执行和玩家通信安全问题。在 141 个国家的实时服务调查中，确认与 Ally 同玩的玩家中，推荐意愿的正面反馈比负面反馈高出 25.1 个百分点，玩家将其视为队友或伙伴而非单纯的工具。\n- **领域归类**: [具身智能, 游戏 AI, 人机交互]\n---\n\n### 15. ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds (ExplorationBench：在可验证的异世界中衡量 AI 系统的探索能力)\n- **社区热度**: `👍 4 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30199)\n- **研究任务**: 评估 AI 系统在未知环境中进行科学探索（提出假设、设计实验、迭代结果）的能力，解决验证新假设和区分探索与预训练知识回忆的难题。\n- **核心亮点**: 引入了 ExplorationBench，基于可验证的“异世界”（Alien Worlds）构建。包含两个沙盒：AlienCode（31个发现目标，70个任务）和 AlienLogic（24个发现目标，70个任务）。规则可执行且与常识冲突，防止单纯的知识回忆。\n- **深度解析**: 每个沙盒提供有缺陷的手册、特定任务的环境反馈和专用的工具调用模式。系统利用这些资源进行探索并解决保留任务。对 10 个 AI 系统的评估发现，最强的系统能够获取并应用不熟悉的规则，但不同轨迹间的表现差异很大，持续探索可能会停滞或逆转早期的收益。这代表了 AI 系统通过探索获取和应用真正新知识的一步。\n- **领域归类**: [大语言模型评估, 科学发现, 强化学习/探索]\n---\n\n### 16. World Action Agent: Harnessing VLMs for Robot Manipulation via World Action Rehearsal (World Action Agent：通过世界动作预演利用 VLM 进行机器人操作)\n- **社区热度**: `👍 3 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29964)\n- **研究任务**: 使通用视觉语言模型（VLM）能够直接驾驶机器人进行基本工具操作，在视觉动作工作空间内做出每一个决策。\n- **核心亮点**: 提出了 World Action Agent (WAA)，一个多智能体驾驭框架。工作空间具有三个特性：接触视图（自动从场景几何中选择）、动作预演（将动作转化为可编辑的提案，在执行前预览和修改）、视图内校正（闭合观察、预演和底层执行之间的循环）。\n- **深度解析**: WAA 通过两种方式获取具身程序性知识：在基于证据的审查下从专家视频和人类教学中进化多模态技能，并通过技能智能体进行调用；利用交互轨迹微调较小的 VLM 以驾驭同一框架。在 LIBERO-Pro 上，仅使用从 LIBERO-90 进化的技能的 WAA 达到了 75.6% 的平均成功率（SOTA）。在 harness 轨迹上微调 Qwen3.5-9B 可将其域外成功率从 1.7% 提升至 43.3%。\n- **领域归类**: [机器人操作, 视觉语言模型, 具身智能]\n---\n\n### 17. AV-GRPO: Modality-Anchored Decoupling Diffusion Reinforcement Learning for Joint Audio-Video Generation (AV-GRPO：用于联合音视频生成的模态锚定解耦扩散强化学习)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29816)\n- **研究任务**: 解决联合音视频生成中单模态保真度有限、文本-模态对齐不足以及跨模态同步较弱的问题。\n- **核心亮点**: 提出了 AV-GRPO（模态锚定的在线扩散强化学习框架）和 5DAV（解耦的、难度可控的训练数据集）。AV-GRPO 包含三个关键模块：模态锚定展开、轨迹锁定冻结塔优化、自适应目标和扰动强度。\n- **深度解析**: 直接将强化学习后训练应用于联合音视频生成面临异构多模态奖励纠缠、联合优化计算成本高以及同步评估困难等挑战。AV-GRPO 将耦合的多模态偏好学习转化为单模态子问题，以实现精确的奖励归因和更好的同步。5DAV 数据集在五个维度上解耦样本。在 JavisBench 和 VABench 上的实验表明，AV-GRPO 在 LoRA 和全参数微调下，生成质量、语义对齐和跨模态同步均优于 LTX-2.3。\n- **领域归类**: [多模态生成, 强化学习, 音视频生成]\n---\n\n### 18. Just Ask Jev: Reinforcement Learning for Calibrated Decisions as a Zero-Shot Detector of AI Alignment Failures (Just Ask Jev：用于校准决策的强化学习作为 AI 对齐失败的零样本检测器)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.29429)\n- **研究任务**: 检测已部署语言模型的对齐失败（如谄媚、越狱、欺骗、提示注入等），解决现有检测器（生成式评判或固定标签分类器）成本高或灵活性差的问题。\n- **核心亮点**: 提出了 Jev，一个通过用于校准决策的强化学习（RLCD）训练的模型，能在单次调用中以校准概率回答关于单个输入的多个类型化问题。引入了 RLCDAlignBench，涵盖 10 种对齐失败、44 个基准和 5 个目标模型。\n- **深度解析**: 核心思想是将“问 Jev 什么”与“它看到什么”分开变化。一个通用的单一问题在零样本情况下达到了 0.886 的中位 AUROC，并在大多数基准上击败了监督基线。问题措辞影响不大，而上下文（主要是编码标签的字段）影响更大。Jev 与参考评分者与人类标签的一致性相匹配，揭示了现有基准中的标签缺陷，且成本比 LLM-judge 评分器低 63 倍。\n- **领域归类**: [AI 安全与对齐, 模型评估, 强化学习]\n---\n\n### 19. DeltaWAM: Delta World Action Models for Bimanual Manipulation (DeltaWAM：用于双臂操作的 Delta 世界动作模型)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.28811)\n- **研究任务**: 改进世界动作模型（WAMs），解决现有 WAMs 在训练时预测密集未来帧导致计算冗余，以及在推理时处理完整观测导致动作生成瓶颈的问题。\n- **核心亮点**: 提出了 DeltaWAM，使用密集锚点、稀疏增量和动作流联合预测视觉增量和动作，包含三种在表示和计算共享上不同的架构。开发了流式增量记忆（SDM），用紧凑的观测增量更新缓存的锚点上下文。\n- **深度解析**: DeltaWAM 避免了重复建模 largely unchanged content（ largely 未变内容），并将动作条件动态与无关的外观变化解耦。在 RoboTwin 上，带 SDM 的 DeltaWAM 在干净设置下将平均成功率从 81.3% 提高到 85.4%，在视觉随机化下从 75.8% 提高到 83.9%。三种架构将训练 FLOPs 降低了 17.78-23.77%，SDM 将单步推理延迟和 FLOPs 分别降低了 36.57% 和 31.55%。真实世界评估显示了最高的整体成功率和归一化进度。\n- **领域归类**: [机器人控制, 视频生成, 具身智能]\n---\n\n### 20. ViRDM: Taming Representation Distribution Matching for Few-Step Causal Video Generation (ViRDM：驯服表示分布匹配以实现少步因果视频生成)\n- **社区热度**: `👍 2 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.28923)\n- **研究任务**: 解决少步自回归（AR）视频扩散后训练方法（如 DMD）依赖大型预训练教师和在线评论家导致资源密集的问题，探索仅对生成器进行后训练的可行性。\n- **核心亮点**: 引入了 ViRDM，一种无需教师和评论家的视频后训练配方。通过将 RDM（表示分布匹配）与随机截断的干净退出监督、轻量级 VAE 解码器和分阶段向量-雅可比乘积相结合，使 RDM 在多步因果视频展开中在内存上变得可行。\n- **深度解析**: 研究识别了将 RDM 转移到少步因果视频生成的三个关键障碍：内存难以处理的梯度路径、不同的视频优化机制以及表示分布对时间动态的约束不足。ViRDM 引入了轻量级动态正则化来补偿时间动态约束不足。仅需 20 次生成器更新，该配方在官方 VBench 评估中达到 84.87 分，超越了之前的最佳少步因果基线 0.36 分，同时仅需 16 个 A100 GPU 小时。\n- **领域归类**: [视频生成, 扩散模型, 模型蒸馏/后训练]\n---\n\n### 21. Rate-distortion optimization for full-reference image quality metrics via stochastic Hessian estimates (基于随机海森估计的全参考图像质量度量率失真优化)\n- **社区热度**: `👍 1 Upvotes`\n- **论文链接**: [点击跳转](https://arxiv.org/abs/2609.30077)\n- **研究任务**: 在基于块的视频编解码器中，优化率失真权衡（RDO），使其能够使用更符合人类视觉系统的全参考图像质量评估（FR-IQA）指标（如MS-SSIM或LPIPS）替代传统的平方误差和（SSE），同时保持块级独立计算的特性。\n- **核心亮点**: 提出了一种输入依赖的二次失真（IDQD）来近似广泛的FR-IQA指标，并通过随机海森矩阵估计（保留块对角或仅保留对角线）实现块级可计算的失真度量。在VVC中针对Kodak和CLIC数据集的五种指标，实现了14.2-36.7%的BD-rate节省，且无需修改解码器，编码复杂度仅增加10-30%。\n- **深度解析**: 传统的率失真优化（RDO）通常使用平方误差和（SSE）作为失真度量，因为SSE可以分解为块级SSE的和，从而允许独立处理各个块。然而，SSE与人类视觉系统的对齐程度较差。相比之下，全参考图像质量评估（FR-IQA）指标（如MS-SSIM或LPIPS）更符合人类视觉，但它们无法在编码环路（in-loop）中使用，因为它们不能按块分解，且通常需要完全解码的图像作为输入。本文基于度量二次化（metric quadratization）的现有成果，将广泛的FR-IQA指标近似为输入依赖的二次失真（IDQD），其二次型矩阵由在源视频处评估的度量海森矩阵（Hessian）导出。为了使失真能够按块计算，本文提出了海森矩阵的两种近似方法：1）保留块对角矩阵；2）仅保留对角线元素。同时，提出了这两种近似的估计器，仅需通过自动微分获取海森矩阵的矩阵-向量乘积。实验表明，在VVC中针对Kodak和CLIC数据集的五种指标，IDQD-RDO在目标度量下实现了14.2-36.7%的BD-rate节省，且无需对解码器进行任何更改，仅带来10-30%的编码复杂度开销。\n- **领域归类**: [视频编码, 图像质量评估, 率失真优化, 计算机视觉]\n---\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e\u003cb\u003e🚀 GitHub 今日热门项目 (点击展开)\u003c/b\u003e\u003c/summary\u003e\n\n### [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\n- **今日趋势**: ⭐ 36,837 | 🍴 4,149 | 📈 今日 +62 sta
